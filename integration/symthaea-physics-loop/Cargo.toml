[package]
name = "symtropy-real-symthaea-physics-loop"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Dual-checkout integration and transfer benchmark for real Symthaea inside Symtropy PhysicsWorld"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state", "multi_threaded", "x11"] }
symthaea-bevy-brain = { path = "../../crates/bridges/symthaea-bevy-brain" }
symthaea-core = { path = "../../../symthaea/crates/core/symthaea-core" }
symthaea-multirotor = { path = "../../../symthaea/crates/domains/symthaea-multirotor" }
symtropy-bevy-core = { path = "../../crates/core/symtropy-bevy-core" }
symtropy-math = { path = "../../crates/core/symtropy-math" }
symtropy-physics = { path = "../../crates/core/symtropy-physics" }
symtropy-robotics-bridge = { path = "../../crates/bridges/symtropy-robotics-bridge" }
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
sha2 = "0.10"

# This integration package is deliberately excluded from Symtropy's standalone
# workspace because it resolves real Symthaea sources from a sibling checkout.
# Give it an explicit workspace root so Cargo doesn't reject the excluded package.
[workspace]

# Use one source checkout for shared Symthaea types in this dual-checkout integration.
# Otherwise Cargo can compile registry and path copies of ConsciousnessInputs as
# distinct Rust types, causing E0308 at cross-crate API boundaries.
[patch.crates-io]
symthaea-consciousness-equation = { path = "../../../symthaea/crates/domains/symthaea-consciousness-equation" }
