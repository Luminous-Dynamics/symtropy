[package]
name = "mobility-rrvr-aerb-evaluator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Evaluator-side AERB contract checker and post-run scorer"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aerb_evaluate"
path = "src/bin/aerb_evaluate.rs"

[workspace]

[[bin]]
name = "aerb_generate"
path = "src/bin/aerb_generate.rs"
