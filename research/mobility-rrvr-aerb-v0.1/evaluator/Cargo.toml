[package]
name = "mobility-rrvr-aerb-evaluator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Evaluator-side AERB contract checker and post-run scorer"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
getrandom = "=0.4.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aerb_evaluate"
path = "src/bin/aerb_evaluate.rs"

[[bin]]
name = "aerb_generate"
path = "src/bin/aerb_generate.rs"

[workspace]

[[bin]]
name = "aerb_campaign_evaluate"
path = "src/bin/aerb_campaign_evaluate.rs"

[[bin]]
name = "aerb_sandbox_canary"
path = "src/bin/aerb_sandbox_canary.rs"

[[bin]]
name = "aerb_metadata_audit"
path = "src/bin/aerb_metadata_audit.rs"

[[bin]]
name = "aerb_blind_materialize"
path = "src/bin/aerb_blind_materialize.rs"

[[bin]]
name = "aerb_blind_campaign_evaluate"
path = "src/bin/aerb_blind_campaign_evaluate.rs"
