[package]
name = "mobility-rrvr-command-semantics"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Structural reference evaluator for RRVR physical command semantics"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrvr_command_semantics_check"
path = "src/bin/rrvr_command_semantics_check.rs"

[workspace]
