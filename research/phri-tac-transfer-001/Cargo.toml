[package]
name = "phri-tac-transfer-oracle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false
description = "Synthetic metrology-preserving tactile transfer qualification reference"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[workspace]
resolver = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "phri-tac-transfer-oracle"
path = "src/main.rs"
