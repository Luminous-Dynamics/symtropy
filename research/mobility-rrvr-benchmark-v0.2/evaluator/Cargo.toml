[package]
name = "mobility-rrvr-benchmark-evaluator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Fail-closed executable scorecard for RRVR matched benchmark episodes"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrvr_benchmark_evaluate"
path = "src/bin/rrvr_benchmark_evaluate.rs"

[workspace]
