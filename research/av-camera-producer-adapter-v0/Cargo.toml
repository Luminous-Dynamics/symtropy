[package]
name = "av-camera-producer-adapter-v0"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false
description = "Lossless adapter from deterministic camera policy receipts into AV replay observations"

[workspace]

[dependencies]
action-conditioned-offscreen-camera = { git = "https://github.com/Luminous-Dynamics/symtropy", rev = "7c25af74716e20cef91d86c0d85f02680b81b32d", package = "action-conditioned-offscreen-camera" }
av-observation-replay-v0 = { git = "https://github.com/Luminous-Dynamics/symtropy", rev = "311f65ca8af4dadd2deeb582b3389b296e9bda5d", package = "av-observation-replay-v0" }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.150"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
