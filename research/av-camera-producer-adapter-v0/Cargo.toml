[package]
name = "av-camera-producer-adapter-v0"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false
description = "Lossless adapter from deterministic camera policy receipts into AV replay observations"

[workspace]

[dependencies]
action-conditioned-offscreen-camera = { path = "../action-conditioned-offscreen-camera-001" }
av-observation-replay-v0 = { path = "../av-observation-replay-v0" }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.150"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
