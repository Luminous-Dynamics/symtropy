[package]
name = "mobility-rrvr-paired-inference"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Preregistered paired, cluster-aware inference for RRVR safety and recovery endpoints"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrvr_paired_inference"
path = "src/bin/rrvr_paired_inference.rs"

[workspace]
