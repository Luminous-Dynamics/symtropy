[package]
name = "symtropy-world-experiment-lease"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false
description = "Read-only, evidence-bound leases for immutable Symtropy experiment views"

# Keep this policy prototype isolated from the Bevy workspace and its migration.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
