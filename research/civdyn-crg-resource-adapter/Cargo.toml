[workspace]

[package]
name = "civdyn-crg-resource-adapter"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Open-loop replay adapter from collective-risk action traces to the native-unit service ledger"

[lib]
path = "src/lib.rs"

