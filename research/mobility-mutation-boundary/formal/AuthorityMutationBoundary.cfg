SPECIFICATION Spec

CONSTANTS
  Tickets = {t1, t2, t3}
  Bindings = {b1, b2}
  Attempts = {a1, a2, a3}
  ClockDomains = {c1, c2}
  BootEpochs = {boot1, boot2}
  RecoveryPermits = {permit1}
  NoPending = noPending
  NoPermit = noPermit
  MaxTick = 3
  MaxEpoch = 3

  TicketBinding = [t1 |-> b1, t2 |-> b1, t3 |-> b2]
  TicketAttempt = [t1 |-> a1, t2 |-> a1, t3 |-> a2]
  TicketEpoch = [t1 |-> 0, t2 |-> 0, t3 |-> 2]
  TicketClock = [t1 |-> c1, t2 |-> c1, t3 |-> c1]
  TicketBoot = [t1 |-> boot1, t2 |-> boot1, t3 |-> boot1]
  TicketIssued = [t1 |-> 0, t2 |-> 0, t3 |-> 0]
  TicketExpires = [t1 |-> 2, t2 |-> 2, t3 |-> 3]

INVARIANT TypeOK
INVARIANT NoTicketReuse
INVARIANT ConsumedMatchesApplicationLog
INVARIANT NoUnauthorizedApplication
INVARIANT PendingSlotConsistent
INVARIANT ApplicationSequenceConsistent
