SPECIFICATION Spec

CONSTANTS
  Tickets = {t1, t2, t3}
  Bindings = {b1, b2}
  Attempts = {a1, a2, a3}
  ClockDomains = {c1, c2}
  BootEpochs = {boot1, boot2}
  RecoveryPermits = {permit1}
  NoPending = noPending
  NoPermit = noPermit
  MaxTick = 3
  MaxEpoch = 3
  InitialBinding = b1
  InitialAttempt = a1
  InitialEpoch = 0
  InitialClock = c1
  InitialBoot = boot1

  TicketBinding = [t \in Tickets |-> IF t = t3 THEN b2 ELSE b1]
  TicketAttempt = [t \in Tickets |-> IF t = t3 THEN a2 ELSE a1]
  TicketEpoch = [t \in Tickets |-> IF t = t3 THEN 2 ELSE 0]
  TicketClock = [t \in Tickets |-> c1]
  TicketBoot = [t \in Tickets |-> boot1]
  TicketIssued = [t \in Tickets |-> 0]
  TicketExpires = [t \in Tickets |-> IF t = t3 THEN 3 ELSE 2]
  PermitAttempt = [p \in RecoveryPermits |-> a1]
  PermitEpoch = [p \in RecoveryPermits |-> 0]
  PermitPlanBinding = [p \in RecoveryPermits |-> b2]

INVARIANT TypeOK
INVARIANT NoTicketReuse
INVARIANT ConsumedMatchesApplicationLog
INVARIANT NoUnauthorizedApplication
INVARIANT PendingSlotConsistent
INVARIANT ApplicationSequenceConsistent
INVARIANT ConsumedPermitsMatchResolutionLog
INVARIANT RecoveryPermitLineage
