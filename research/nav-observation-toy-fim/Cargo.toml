[workspace]
members = ["."]
resolver = "3"

[package]
name = "nav-observation-toy-fim"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated exact-small-instance Fisher-information oracle for navigation observation selection."

[lib]
name = "nav_observation_toy_fim"
path = "src/lib.rs"

[[bin]]
name = "nav-observation-toy-fim"
path = "src/main.rs"

[dependencies]

[[bin]]
name = "risk_coverage_demo"
path = "src/bin/risk_coverage_demo.rs"

[[bin]]
name = "clustered_risk_demo"
path = "src/bin/clustered_risk_demo.rs"
