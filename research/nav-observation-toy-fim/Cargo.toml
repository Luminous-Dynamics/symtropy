[workspace]
members = ["."]
resolver = "3"

[package]
name = "nav-observation-toy-fim"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated navigation information/integrity research kernels and reproduction harnesses."

[lib]
name = "nav_observation_toy_fim"
path = "src/lib.rs"

[[bin]]
name = "adaptive_pl_demo"
path = "src/bin/adaptive_pl_demo.rs"

[dependencies]

[[bin]]
name = "student_t_pl_demo"
path = "src/bin/student_t_pl_demo.rs"

[[bin]]
name = "pl_trace_metrics_demo"
path = "src/bin/pl_trace_metrics_demo.rs"

[[bin]]
name = "integrity_evidence_demo"
path = "src/bin/integrity_evidence_demo.rs"

[[bin]]
name = "mission_risk_budget_demo"
path = "src/bin/mission_risk_budget_demo.rs"

[[bin]]
name = "trajectory_support_demo"
path = "src/bin/trajectory_support_demo.rs"
