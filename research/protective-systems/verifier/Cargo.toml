[package]
name = "protective-systems-verifier"
version = "0.1.0"
edition = "2024"
publish = false
description = "Synthetic-only evidence record conformance verifier for PROTECTIVE-SYSTEMS-001"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "protective-voi"
path = "src/bin/voi.rs"

[[bin]]
name = "protective-robust"
path = "src/bin/robust.rs"

[[bin]]
name = "protective-threat-portfolio"
path = "src/bin/threat_portfolio.rs"

[[bin]]
name = "protective-resilience-bridge"
path = "src/bin/protective_resilience_bridge.rs"

[[bin]]
name = "protective-resilience-e0"
path = "src/bin/protective_resilience_e0.rs"
