[package]
name = "protective-systems-verifier"
version = "0.1.0"
edition = "2024"
publish = false
description = "Synthetic-only evidence record conformance verifier for PROTECTIVE-SYSTEMS-001"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.4.1"
sha2 = "0.10"
jsonschema = "=0.61.2"

[[bin]]
name = "protective-voi"
path = "src/bin/voi.rs"

[[bin]]
name = "protective-robust"
path = "src/bin/robust.rs"

[[bin]]
name = "protective-threat-portfolio"
path = "src/bin/threat_portfolio.rs"

[[bin]]
name = "protective-resilience-bridge"
path = "src/bin/protective_resilience_bridge.rs"

[[bin]]
name = "protective-resilience-e0"
path = "src/bin/protective_resilience_e0.rs"

[[bin]]
name = "protective-model-evidence"
path = "src/bin/protective_model_evidence.rs"

[[bin]]
name = "protective-evidence-portability"
path = "src/bin/protective_evidence_portability.rs"

[[bin]]
name = "protective-multiprovider-e3"
path = "src/bin/protective_multiprovider_e3.rs"

[[bin]]
name = "protect-evidence-semantic-projection-e4"
path = "src/bin/protect_evidence_semantic_projection_e4.rs"
