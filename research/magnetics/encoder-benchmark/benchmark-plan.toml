freeze_calibration_procedure_digest = true
seal_blind_holdout_before_fit = true
blind_data_may_not_drive_calibration = true
blind_data_may_not_drive_active_sampling = true

[metrics]
separate_vendor_system_accuracy = true
separate_uncalibrated_installed_accuracy = true
separate_calibrated_installed_accuracy = true
report_max_absolute_error = true
report_rms_error = true
report_repeatability = true
report_hysteresis = true
report_sde_and_noise = true
report_harmonic_spectrum = true
report_thermal_drift = true
report_bandwidth_sample_rate_refresh_latency_jitter = true
report_runout_eccentricity_airgap_sensitivity = true
report_external_field_susceptibility = true
report_power_diagnostics_calibration_installation_cost = true

[research_targets]
