calibration_certificate_id_status = "unselected"
expanded_uncertainty_coverage_factor = 2.0
expanded_uncertainty_target_deg = 0.001
uncertainty_target_status = "engineering_goal_not_yet_demonstrated"
require_timestamp_synchronization = true
require_raw_reference_samples = true

[calibration]
modes = ["uncalibrated_single_head", "calibrated_or_self_calibrated_single_head", "two_head_180deg_if_supported"]
