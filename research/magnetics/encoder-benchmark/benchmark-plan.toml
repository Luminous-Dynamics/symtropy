bandwidth_status = "not_published_in_verified_current_MCD06_pdf"
datasheet_temperature_readhead_c = [-40, 115]
datasheet_temperature_ring_c = [-40, 125]
common_comparison_temperature_c = [-40, 105]
notes = "Do not treat legacy MCD05 product-page PDF as current MCD06 documentation."

[common_test_envelope]
