resolution_bits_max = 20
system_accuracy_deg = 0.004
typical_calibrated_installed_accuracy_deg = 0.009
typical_uncalibrated_installed_accuracy_deg = 0.029
maximum_speed_rpm = 4700
bandwidth_hz = 9000
sampling_hz = 18000
refresh_hz_max = 54000
temperature_min_c = -40
temperature_max_c = 105
self_calibration_supported = true
two_readhead_supported = true
external_field_temporary_malfunction_threshold_mt = 20
external_field_possible_permanent_damage_threshold_mt = 50

[comparator]
manufacturer = "RLS"
family = "AksIM-4 HIPERFACE DSL"
variant = "MC080"
ring_size_class_mm = 80
datasheet_revision_status = "current_MCD06_pdf_and_ordering_code_required"
