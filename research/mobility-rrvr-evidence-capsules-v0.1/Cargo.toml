[package]
name = "mobility-rrvr-evidence-capsule"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Provenance and claim qualification for RRVR evidence capsules"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
