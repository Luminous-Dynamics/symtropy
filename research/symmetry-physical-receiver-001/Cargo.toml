[package]
name = "symmetry-physical-handoff-receiver"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "AGPL-3.0-or-later"
description = "Independent receiver verification for mathematical-to-physical symmetry evidence handoffs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "verify-symmetry-handoff"
path = "src/bin/verify.rs"

[workspace]
