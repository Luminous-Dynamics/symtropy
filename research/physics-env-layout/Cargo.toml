[package]
name = "symtropy-physics-env-layout"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Research microbenchmark for AoS, SoA and AoSoA independent simulation state"

[workspace]
resolver = "2"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "layout_throughput"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
