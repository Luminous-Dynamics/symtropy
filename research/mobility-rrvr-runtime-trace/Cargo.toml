[package]
name = "mobility-rrvr-runtime-trace"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Fail-closed projection of RRVR owner evidence into a TLA+ runtime trace"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", default-features = false }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrvr_runtime_project"
path = "src/bin/rrvr_runtime_project.rs"

[[bin]]
name = "rrvr_attempt_lineage"
path = "src/bin/rrvr_attempt_lineage.rs"

[[bin]]
name = "rrvr_campaign_validate"
path = "src/bin/rrvr_campaign_validate.rs"

[[bin]]
name = "rrvr_campaign_compile"
path = "src/bin/rrvr_campaign_compile.rs"

[[bin]]
name = "rrvr_campaign_verify"
path = "src/bin/rrvr_campaign_verify.rs"

[[bin]]
name = "rrvr_execution_validate"
path = "src/bin/rrvr_execution_validate.rs"

[[bin]]
name = "rrvr_gazebo_preflight"
path = "src/bin/rrvr_gazebo_preflight.rs"

[[bin]]
name = "rrvr_journal_verify"
path = "src/bin/rrvr_journal_verify.rs"

[[bin]]
name = "rrvr_journal_bench"
path = "src/bin/rrvr_journal_bench.rs"

[workspace]
