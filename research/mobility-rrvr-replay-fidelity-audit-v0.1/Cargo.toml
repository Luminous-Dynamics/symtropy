[package]
name = "mobility-rrvr-replay-fidelity-audit"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Raw-artifact replay-fidelity audit for RRVR robot recovery benchmark overlays"

[dependencies]
png = "=0.18.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrvr_replay_audit"
path = "src/bin/rrvr_replay_audit.rs"

[workspace]
