[package]
name = "mobility-rrvr-replay-provenance"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Artifact-backed provenance preflight for RRVR replay fidelity audit"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rrvr_replay_provenance"
path = "src/bin/rrvr_replay_provenance.rs"

[workspace]
