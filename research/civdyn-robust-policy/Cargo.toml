[workspace]

[package]
name = "civdyn-robust-policy"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Metric-specific policy robustness and finite-design regret under CivDyn parameter uncertainty"

[lib]
path = "src/lib.rs"

[[bin]]
name = "robust-policy-sweep"
path = "src/bin/robust_policy_sweep.rs"

[dependencies]
civdyn-cross-scale-resilience = { path = "../civdyn-cross-scale-resilience" }
civdyn-resilience-uq = { path = "../civdyn-resilience-uq" }

[[bin]]
name = "model-set-decision-sweep"
path = "src/bin/model_set_decision_sweep.rs"
