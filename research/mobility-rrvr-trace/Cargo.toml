[package]
name = "mobility-rrvr-trace"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Deterministic replay, causal minimization and TLC JSON import for RRVR traces"

[dependencies]
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", default-features = false }

[lib]
path = "src/lib.rs"

[[bin]]
name = "tlc_trace_import"
path = "src/bin/tlc_trace_import.rs"

[workspace]
