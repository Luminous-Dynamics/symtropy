[package]
name = "furnishing-layout-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "AGPL-3.0-or-later"
description = "Independent known-truth geometry oracle for Symtropy furnishing-layout fixtures"

[workspace]
resolver = "2"

[dependencies]
serde_json = "=1.0.154"


[[bench]]
name = "functional_envelope_scaling"
path = "benches/functional_envelope_scaling.rs"
harness = false

[[bench]]
name = "alternative_frontier_scaling"
path = "benches/alternative_frontier_scaling.rs"
harness = false

[[bench]]
name = "resident_preference_probe_scaling"
path = "benches/resident_preference_probe_scaling.rs"
harness = false

[[bench]]
name = "response_robustness_scaling"
path = "benches/response_robustness_scaling.rs"
harness = false

[[bench]]
name = "preference_policy_evaluation_scaling"
path = "benches/preference_policy_evaluation_scaling.rs"
harness = false
