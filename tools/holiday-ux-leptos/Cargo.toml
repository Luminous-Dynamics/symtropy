[package]
name = "holiday-ux-leptos"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Isolated Leptos prototype for a human-centered holiday-planning journey"

# Keep browser dependencies outside Symtropy's main simulation workspace.
[workspace]

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
console_error_panic_hook = "0.1"
