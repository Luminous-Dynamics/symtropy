[package]
name = "power-restoration-artifact-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
publish = false
description = "Offline content-addressed artifact and signed attestation verifier for restoration evidence"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[workspace]
