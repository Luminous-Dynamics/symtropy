[package]
name = "built-interop-audit"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Synthetic semantic-loss comparator for IFC/IDS-to-fabrication exchange requirements"

[dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
serde = { version = "1", features = ["derive"] }
