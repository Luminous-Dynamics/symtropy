[workspace]
resolver = "3"
members = [".", "visibility-evaluator"]

[package]
name = "scan-bim-replay-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0 OR MIT"
description = "Fail-closed metadata and observability contract auditor for Scan-to-BIM replay"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
