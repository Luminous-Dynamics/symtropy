[package]
name = "built-interop-ifc-schema-gate"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Coverage-aware IFC declared-schema validation gate"

[dependencies]
ifc-model = "=0.3.1"
ifc-step = "=0.5.0"
ifc-schema = { version = "=0.3.2", default-features = false, features = ["ifc4"] }
ifc-validate = { version = "=0.6.0", default-features = false, features = ["ifc4"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
