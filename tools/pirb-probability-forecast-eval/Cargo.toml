[package]
name = "pirb-probability-forecast-eval"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Versioned probability-forecast scoring, historical climatology comparison, and audit receipts for PIRB"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.59", default-features = false }
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "pirb-outcome-vintage-sensitivity"
path = "src/vintage_main.rs"

[[bin]]
name = "pirb-views-offline-adapter"
path = "src/views_adapter_main.rs"

[[bin]]
name = "pirb-cross-provider-benchmark-validate"
path = "src/benchmark_registration_main.rs"

[[bin]]
name = "pirb-hierarchy-coherence-audit"
path = "src/hierarchy_coherence_main.rs"

[[bin]]
name = "pirb-selective-forecast-audit"
path = "src/selective_forecast_main.rs"

[[bin]]
name = "pirb-action-value-audit"
path = "src/action_value_main.rs"

[workspace]
