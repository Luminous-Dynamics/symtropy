[workspace]
members = ["."]
resolver = "3"

[package]
name = "scan-bim-tls-ipa-statistic"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0 OR MIT"
description = "Source-faithful consumer for the NIST/OSAC TLS IPA Part II robust covariance test"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
