[package]
name = "built-interop-semantic-delta"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Paired IFC semantic preservation gate from typed IFC/IDS observations"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
