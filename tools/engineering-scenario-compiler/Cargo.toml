[package]
name = "engineering-scenario-compiler"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline strict compiler for the bounded Engineering Scenario DSL"

[[bench]]
name = "compile_latency"
harness = false

[dependencies]
toml_parser = "=1.0.5"
sha1 = "=0.10.6"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_jcs = "=0.2.0"
sha2 = "=0.10.9"
toml_edit = { version = "=0.23.10", default-features = false, features = ["parse", "serde"] }

[workspace]
