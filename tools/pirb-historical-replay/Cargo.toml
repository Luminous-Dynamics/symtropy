[package]
name = "pirb-historical-replay"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Aggregate-only historical warning/response replay and audit receipts for PIRB"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.59", default-features = false }
sha2 = "0.10"
hex = "0.4"

[workspace]
