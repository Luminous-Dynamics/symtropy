[package]
name = "sim-rel-joint-stochastic-oracle"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Exact finite-state joint physical and sensor stochastic experimental-design reference with blind episode adapter"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[[bin]]
name = "episode_baseline_agent"
path = "src/bin/episode_baseline_agent.rs"
