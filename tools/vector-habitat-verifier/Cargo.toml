[package]
name = "vector-habitat-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

# Explicit nested workspace keeps this verifier outside Symtropy's application workspace.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
