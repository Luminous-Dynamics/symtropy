[package]
name = "symtropy-material-flow-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false
description = "Strict, dependency-light MFB scenario contract and validator"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
symtropy-math = { path = "../../crates/core/symtropy-math" }
symtropy-physics = { path = "../../crates/core/symtropy-physics", features = ["deterministic-net"] }

[workspace]
