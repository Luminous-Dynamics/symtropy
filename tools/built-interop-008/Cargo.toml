[package]
name = "built-interop-semantic-diff"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Schema-directed source-to-target IFC structural semantic diff"

[dependencies]
ifc-model = "=0.3.1"
ifc-step = "=0.5.0"
ifc-schema = { version = "=0.3.2", default-features = false, features = ["ifc4"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
