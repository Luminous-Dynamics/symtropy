[package]
name = "built-interop-ids-xsd-gate"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Offline, pinned IDS 1.0 XML Schema validity gate"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
xsd-schema = { version = "=0.2.3", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
