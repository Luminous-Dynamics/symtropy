[workspace]
members = ["."]
resolver = "3"

[package]
name = "built-asset-oracle"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"
description = "Independent synthetic reference oracle for the Symtropy built-asset inspection corpus"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
