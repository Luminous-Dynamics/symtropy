[package]
name = "built-interop-report-assembler"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Typed, fail-closed assembler for built-environment interoperability evidence reports"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
