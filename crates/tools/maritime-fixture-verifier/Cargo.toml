[package]
name = "maritime-fixture-verifier"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics"]
license = "AGPL-3.0-or-later"
publish = false
description = "Independent verifier for the frozen synthetic maritime fixture corpus"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
