[package]
name = "symthaea-bevy-brain"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bevy plugin for NPC cognitive architecture: HDC perception, CfC neural dynamics, Active Inference behavior, and Phi-gated motor authority. Drop-in replacement for behavior trees."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "ai", "npc", "consciousness", "neural"]
categories = ["game-engines", "simulation", "science"]
readme = "README.md"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_log", "bevy_state",
    "multi_threaded", "x11",
] }
symthaea = { path = "../../../stubs/symthaea", default-features = false, features = ["vision-manifold", "muse", "reasoning_engine"] }
# Pinned host-neutral reality contract. The private integrated workspace may
# replace this exact source with a local path, but standalone builds must never
# float to an unqualified branch tip.
symthaea-reality-ledger = { git = "https://github.com/Luminous-Dynamics/symthaea.git", rev = "ffa27ea1a0fa2bac69df6008adfdd2167b8e29c0", package = "symthaea-reality-ledger", optional = true }

[features]
default = []
# Keep the existing brain crate lightweight for non-art consumers. The real
# off-screen GPU path is opt-in and enables only the Bevy subsystems it needs.
realtime-art-render = [
    "bevy/bevy_asset",
    "bevy/bevy_camera",
    "bevy/bevy_image",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
]
# Bind committed/counterfactual Symtropy observations to the host-neutral
# Reality Ledger without granting mutation authority.
reality-ledger-adapter = ["dep:symthaea-reality-ledger"]
