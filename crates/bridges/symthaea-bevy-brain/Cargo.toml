[package]
name = "symthaea-bevy-brain"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bevy plugin for NPC cognitive architecture: HDC perception, CfC neural dynamics, Active Inference behavior, and Phi-gated motor authority. Drop-in replacement for behavior trees."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "ai", "npc", "consciousness", "neural"]
categories = ["game-engines", "simulation", "science"]
readme = "README.md"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_log", "bevy_state",
    "multi_threaded", "x11",
] }
symthaea = { path = "../../../stubs/symthaea", default-features = false, features = ["vision-manifold", "muse", "reasoning_engine"] }
thiserror = "1.0"
# Pinned host-neutral reality + ordered lifecycle contract. Standalone builds
# must never float to an unqualified branch tip.
symthaea-reality-ledger = { git = "https://github.com/Luminous-Dynamics/symthaea.git", rev = "5ca018fee7fc7bd0d48ff084608c72c06c586db1", package = "symthaea-reality-ledger", optional = true }

[features]
default = []
# Keep the existing brain crate lightweight for non-art consumers. The real
# off-screen GPU path is opt-in and enables only the Bevy subsystems it needs.
realtime-art-render = [
    "bevy/bevy_asset",
    "bevy/bevy_camera",
    "bevy/bevy_image",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
]
# Object-ID acquisition uses a dedicated unlit custom material and proxy render
# layer so the evidence pass never rewrites materials on the committed scene.
realtime-art-object-id = [
    "realtime-art-render",
    "bevy/bevy_pbr",
]
# Bind committed/counterfactual Symtropy observations and lifecycle evidence to
# the host-neutral Reality Ledger without granting mutation authority.
reality-ledger-adapter = ["dep:symthaea-reality-ledger"]
