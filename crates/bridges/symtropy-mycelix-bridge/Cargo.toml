[package]
name = "symtropy-mycelix-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bevy plugin: NPCs and game systems call Mycelix Holochain zomes by spawning mycelix-conductor-bridge as a subprocess and piping JSON. Zero Holochain deps in-crate — no serde conflicts with Bevy."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "simulation", "mycelix", "economics", "governance"]
categories = ["game-engines", "simulation"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "async_executor", "bevy_log", "bevy_state", "multi_threaded"] }
bevy-tokio-tasks = "0.19"
flume = "0.11"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

[[bin]]
name = "mycelix-mock-conductor"
path = "src/bin/mock_conductor.rs"
required-features = ["mock-conductor"]

[features]
default = []
mock-conductor = []
