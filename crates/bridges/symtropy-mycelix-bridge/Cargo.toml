[package]
name = "symtropy-mycelix-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bevy plugin: NPCs and game systems call Mycelix Holochain zomes by spawning mycelix-conductor-bridge as a subprocess and piping JSON. Zero Holochain deps in-crate — no serde conflicts with Bevy."
repository = "https://github.com/luminous-dynamics/symtropy"
keywords = ["bevy", "mycelix", "governance", "simulation"]
categories = ["game-engines", "simulation"]

# Architectural note: Holochain's dep graph locks serde=1.0.203 exactly;
# Bevy 0.18 needs serde_core >=1.0.221. These cannot co-exist in one
# Rust compilation unit. Solution: run the Holochain client as a
# separate process (mycelix-conductor-bridge) and talk to it via JSON
# over stdin/stdout. This crate has zero Holochain deps.
#
# This crate CAN be part of the symtropy workspace (no serde conflict)
# but lives at top-level for cohesion with mycelix-conductor-bridge.

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_log",
    "bevy_state",
    "multi_threaded",
] }
bevy-tokio-tasks = "0.19"
flume = "0.11"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

# ---------------------------------------------------------------------------
# Mock conductor binary — zero Holochain deps, answers the same JSON protocol
# as mycelix-conductor-bridge from an in-memory state machine. Used by the
# scenario harness for offline testing. NOT shipped in user builds:
# required-features ensures cargo build --lib (the default) omits it.
# ---------------------------------------------------------------------------
[[bin]]
name = "mycelix-mock-conductor"
path = "src/bin/mock_conductor.rs"
required-features = ["mock-conductor"]

[features]
default = []
# Enables the mock conductor binary. Off by default so downstreams can depend
# on the lib without pulling the mock into their target/ dir.
mock-conductor = []
