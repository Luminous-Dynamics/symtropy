[package]
name = "symtropy-holochain-relay-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Fail-closed boundary for the future authenticated Symtropy-to-Holochain relay"

[features]
default = []
mycelix = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
