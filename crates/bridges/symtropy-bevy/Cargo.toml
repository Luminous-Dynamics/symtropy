[package]
name = "symtropy-bevy"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Drop-in Bevy plugin for Phi-coupled N-dimensional physics. Builds on the permissive symtropy-bevy-core plugin."

[dependencies]
symtropy-bevy-core = { path = "../../core/symtropy-bevy-core" }
symthaea-bevy-brain = { path = "../../bridges/symthaea-bevy-brain" }
symtropy-physics = { path = "../../core/symtropy-physics" }
symtropy-rapier3d-bridge = { path = "../../bridges/symtropy-rapier3d-bridge", optional = true }
# Required directly by robot.rs's spawn_robot_rapier3d (gated behind the
# `rapier3d` feature below) -- version matches symtropy-rapier3d-bridge's own pin.
rapier3d = { version = "0.18", optional = true }
symtropy-math = { path = "../../core/symtropy-math" }
symtropy-robotics-bridge-core = { path = "../../bridges/symtropy-robotics-bridge-core" }
symtropy-consciousness-physics = { path = "../../domains/symtropy-consciousness-physics" }
symthaea-muse = { path = "../../../stubs/symthaea-muse" }
symtropy-devconsole = { version = "0.1.0", path = "../../domains/symtropy-devconsole", features = ["phi-panel"] }
bevy = { version = "0.19", default-features = false, features = [
    "png",
    "bevy_ui", "bevy_ui_render", "bevy_text", "default_font",
] }
nalgebra = "0.34"
rhai = { version = "1.19", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }

[features]
default = []
debug-gizmos = ["bevy/bevy_gizmos", "bevy/bevy_gizmos_render"]
rapier3d = ["dep:symtropy-rapier3d-bridge", "dep:rapier3d"]
# `inspector` (bevy_inspector_egui in-engine tooling, per README.md/roadmap.md's
# stated direction) was previously declared here as an empty, unbuildable
# feature gating dead code in plugin.rs. Removed 2026-07-21 rather than left
# as a footgun for --all-features builds — add it back for real (dependency +
# cfg-gated plugin registration) when someone actually implements it. See
# SYMTROPY_IMPROVEMENT_PLAN_2026-07-21.md P3.4.

[dev-dependencies]
symthaea-consciousness-equation = "0.1.0"
symtropy-bevy-scene = { path = "../../core/symtropy-bevy-scene" }
symtropy-render-bridge = { path = "../symtropy-render-bridge" }

