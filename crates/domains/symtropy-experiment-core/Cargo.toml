[package]
name = "symtropy-experiment-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Renderer-independent, dimension-aware executable equation graphs for Symtropy experiments"
repository = "https://github.com/Luminous-Dynamics/symtropy"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "symtropy-experiment-run"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
serde_json_canonicalizer = "0.3.2"

[build-dependencies]
sha2 = "0.10.9"
