[package]
name = "humanity-history-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Renderer-independent evidence and provenance validation for historical reconstructions"
repository = "https://github.com/Luminous-Dynamics/symtropy"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "humanity-history-validate"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
