[package]
name = "symtropy-lightyear"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Lightyear integration for Symtropy — prediction, rollback, interpolation over Iroh QUIC"

[dependencies]
# Lightyear 0.31 is the published Bevy 0.20-compatible line. Keep this
# adapter on the same Bevy minor as the entire workspace to avoid a second ECS
# type graph. See docs/BEVY_020_GRAPHICS_AND_MIGRATION.md.
lightyear = "0.31"

# Bevy sub-crates share the workspace's Bevy 0.20 version.
bevy_app = "0.20"
bevy_ecs = "0.20"
bevy_log = "0.20"

# Symtropy crates
symtropy-net = { path = "../../domains/symtropy-net" }
symtropy-physics = { path = "../../core/symtropy-physics" }

# nalgebra
nalgebra = "0.34"

# Serialization
serde = { version = "1", features = ["derive"] }

# Bytes for Link buffers
bytes = "1"
bevy_reflect = "0.20"
