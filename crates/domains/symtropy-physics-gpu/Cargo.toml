[package]
name = "symtropy-physics-gpu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Experimental Bevy/WGPU compute and rendering scaffolding for Symtropy physics research."

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_render", "bevy_asset", "bevy_gizmos", "bevy_pbr"] }
bevy_pbr = "0.20"
bevy_mesh = "0.20"
symtropy-bevy-core = { path = "../../core/symtropy-bevy-core" }
symtropy-physics = { path = "../../core/symtropy-physics" }
symtropy-math = { path = "../../core/symtropy-math" }
symthaea-bevy-brain = { path = "../../bridges/symthaea-bevy-brain" }
nalgebra = { version = "0.34", features = ["serde-serialize"] }
bytemuck = { version = "1.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[features]
default = []
