[package]
name = "symtropy-animal-replay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Deterministic, evidence-bounded animal replay scorecards and result receipts."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symtropy-animal-observation = { path = "../symtropy-animal-observation" }
symtropy-fauna-core = { path = "../symtropy-fauna-core" }
