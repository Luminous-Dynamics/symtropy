[package]
name = "symtropy-terrain"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Volumetric terrain and excavation systems for Symtropy."

[dependencies]
symtropy-math = { path = "../../core/symtropy-math" }
symtropy-physics = { path = "../../core/symtropy-physics" }
symtropy-physics-gpu = { path = "../../domains/symtropy-physics-gpu" }
symtropy-rapier3d-bridge = { path = "../../bridges/symtropy-rapier3d-bridge" }
rapier3d = "0.18"
nalgebra = "0.34"
image = "0.25"
bevy = { version = "0.19", default-features = false, features = ["bevy_render", "bevy_asset", "bevy_image", "bevy_state", "bevy_log", "multi_threaded"] }
bevy_mesh = "0.19"
futures-lite = "2.0"
# Cargo resolver v2 does not inherit the launcher's naga@27 feature selection
# when qualifying this package alone. Bevy 0.19/naga_oil activates
# codespan-reporting 0.12 termcolor in the same graph, so explicitly select
# naga@27/termcolor here to keep Naga 27's DiagnosticBuffer representation
# consistent with the unified codespan-reporting feature set.
naga = { version = "27", default-features = false, features = ["termcolor"] }
