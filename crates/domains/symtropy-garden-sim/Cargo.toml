[package]
name = "symtropy-garden-sim"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Bounded accounting contract for garden infrastructure scenarios"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "verify-field-robot-cost-manifest"
path = "src/bin/verify_field_robot_cost_manifest.rs"

[[bin]]
name = "verify-provider-coverage-manifest"
path = "src/bin/verify_provider_coverage_manifest.rs"

[[bench]]
name = "portfolio_frontier"
harness = false

[workspace]
