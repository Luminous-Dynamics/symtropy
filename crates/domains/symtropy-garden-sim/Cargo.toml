[package]
name = "symtropy-garden-sim"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Bounded accounting contract for garden infrastructure scenarios"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"

[[bin]]
name = "verify-field-robot-cost-manifest"
path = "src/bin/verify_field_robot_cost_manifest.rs"

[[bin]]
name = "verify-provider-coverage-manifest"
path = "src/bin/verify_provider_coverage_manifest.rs"

[[bin]]
name = "verify-service-access-manifest"
path = "src/bin/verify_service_access_manifest.rs"

[[bin]]
name = "verify-field-eval-report"
path = "src/bin/verify_field_eval_report.rs"

[[bench]]
name = "portfolio_frontier"
harness = false

[workspace]
