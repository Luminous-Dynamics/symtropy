[package]
name = "symtropy-housing-evidence"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Fail-closed verifier for reproducible housing-engineering evidence manifests."
repository = "https://github.com/Luminous-Dynamics/symtropy"

[[bin]]
name = "housing-evidence-verify"
path = "src/main.rs"

[dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
