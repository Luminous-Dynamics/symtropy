symtropy-succession-core = { path = "../../domains/symtropy-succession-core" }
symtropy-recognition-core = { path = "../../domains/symtropy-recognition-core" }
symtropy-assets-core = { path = "../../domains/symtropy-assets-core" }
symtropy-economy-core = { path = "../../domains/symtropy-economy-core" }
symtropy-projects-core = { path = "../../domains/symtropy-projects-core" }
symtropy-transit-core = { path = "../../domains/symtropy-transit-core" }
symtropy-comms-core = { path = "../../domains/symtropy-comms-core" }
symtropy-diplomacy-core = { path = "../../domains/symtropy-diplomacy-core" }
symtropy-conflict-core = { path = "../../domains/symtropy-conflict-core" }
symtropy-civilization-scale-core = { path = "../../domains/symtropy-civilization-scale-core" }
