[package]
name = "symtropy-three-worlds-lab"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Headless integrated civilization lab across Aster, Vesper, and Helion."
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
