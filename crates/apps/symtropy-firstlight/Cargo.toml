[package]
name = "symtropy-firstlight"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Authoritative headless integration application for the Firstlight opening."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symtropy-crawler-core = { path = "../../domains/symtropy-crawler-core" }
symtropy-firstlight-bent-feeder = { path = "../../domains/symtropy-firstlight-bent-feeder" }
symtropy-firstlight-catastrophe = { path = "../../domains/symtropy-firstlight-catastrophe" }
symtropy-game-state = { path = "../../domains/symtropy-game-state" }
symtropy-iris = { path = "../../domains/symtropy-iris" }
symtropy-persistence = { path = "../../domains/symtropy-persistence" }
symtropy-residents = { path = "../../domains/symtropy-residents" }
