[package]
name = "symtropy-native-multiplayer-witness"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Two-process native Iroh transport witness for Symtropy multiplayer"

[dependencies]
symtropy-net = { path = "../../bridges/symtropy-net", features = ["iroh-native"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
