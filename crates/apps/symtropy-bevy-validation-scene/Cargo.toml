[package]
name = "symtropy-bevy-validation-scene"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"
description = "Executable smoke scene for the permissive Symtropy Bevy distribution."

[dependencies]
# Keep Bevy features explicit to avoid implicitly enabling the full default
# 2D/3D/UI/audio bundle for this smoke-test application. Add rendering and
# animation features intentionally when the validation scene needs them.
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_render",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_winit", "bevy_color", "bevy_state",
    "bevy_log", "bevy_post_process", "bevy_shader",
    "bevy_gizmos", "bevy_gizmos_render", "bevy_pbr",
    "multi_threaded", "x11",
    "default_font", "png",
] }
symtropy-bevy-scene = { path = "../../core/symtropy-bevy-scene" }
symtropy-core = { path = "../../core/symtropy-core" }
