[workspace]
resolver = "2"
members = [
    "crates/symtropy-math",
    "crates/symtropy-physics",
    "crates/symtropy-fluid",
    "crates/symtropy-mesh",
    "crates/symtropy-soft",
    "crates/symtropy-net-core",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Luminous-Dynamics/symtropy"

[workspace.lints.clippy]
all = "warn"
