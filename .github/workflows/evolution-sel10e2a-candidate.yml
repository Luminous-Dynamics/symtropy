name: Evolution SEL-10E2A Candidate

on:
  push:
    branches:
      - "ci/evolution-sel10e2a-candidate-v0.1"

permissions:
  contents: read

env:
  PRODUCT_HEAD: 8bb89d06408257124dec4242f76c90a7b58f3510

jobs:
  candidate:
    name: SEL-10E2A candidate / Rust 1.96
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 1
      - name: Assert executed subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Isolate cross-model stack
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/cross-model-stack"
          rm -rf "${root}"
          mkdir -p "${root}"
          cp -R crates/domains/symtropy-evolution-core "${root}/symtropy-evolution-core"
          cp -R crates/domains/symtropy-species-concept "${root}/symtropy-species-concept"
          cp -R crates/domains/symtropy-species-concept-relations "${root}/symtropy-species-concept-relations"
          cp -R crates/domains/symtropy-species-concept-general-lineage "${root}/symtropy-species-concept-general-lineage"
          cp -R crates/domains/symtropy-species-concept-robustness "${root}/symtropy-species-concept-robustness"
      - name: Check E2A formatting
        id: fmt
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-species-concept-robustness
        run: cargo fmt --all -- --check
      - name: Check E2A all targets
        id: check
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-species-concept-robustness
        run: cargo check --all-targets
      - name: Run E2A adversarial corpus
        id: e2a
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_design_v1
      - name: Run all E2A targets
        id: all_tests
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-species-concept-robustness
        run: cargo test --all-targets
      - name: Run strict E2A Clippy
        id: clippy
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-species-concept-robustness
        run: cargo clippy --all-targets -- -D warnings
      - name: Run frozen relation corpus
        id: relation
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-species-concept-relations
        run: cargo test --all-targets
      - name: Run frozen general-lineage corpus
        id: general_lineage
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-species-concept-general-lineage
        run: cargo test --all-targets
      - name: Run strict current-species prerequisite
        id: strict_status
        working-directory: ${{ runner.temp }}/cross-model-stack/symtropy-evolution-core
        run: cargo test --test current_species_status_v1
