name: Shipyard observed-history dispatch baseline

on:
  push:
    paths:
      - "tools/shipyard-observed-dispatch/**"
      - ".github/workflows/shipyard-observed-dispatch.yml"
  pull_request:
    paths:
      - "tools/shipyard-observed-dispatch/**"
      - ".github/workflows/shipyard-observed-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-observed-dispatch-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/shipyard-observed-dispatch/Cargo.toml -- --check

      - name: Test dispatch rules, precedence, freeze and outage controls offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-observed-dispatch/Cargo.toml

      - name: Check example
        run: cargo check --locked --offline --manifest-path tools/shipyard-observed-dispatch/Cargo.toml --examples

      - name: Lint with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-observed-dispatch/Cargo.toml --all-targets -- -D warnings
