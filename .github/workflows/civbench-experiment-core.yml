name: CivBench experiment core

on:
  pull_request:
    paths:
      - "research/civbench-experiment-core/**"
      - ".github/workflows/civbench-experiment-core.yml"
  push:
    paths:
      - "research/civbench-experiment-core/**"
      - ".github/workflows/civbench-experiment-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-experiment-core:
    name: Test CivBench experiment qualification core
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust with formatting and lint components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Resolve and preserve the standalone dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -s research/civbench-experiment-core/Cargo.toml
          test -s research/civbench-experiment-core/src/lib.rs
          cargo generate-lockfile --manifest-path research/civbench-experiment-core/Cargo.toml

      - name: Upload generated Cargo.lock for exact review
        uses: actions/upload-artifact@v4
        with:
          name: civbench-experiment-core-cargo-lock
          path: research/civbench-experiment-core/Cargo.lock
          if-no-files-found: error

      - name: Check formatting
        run: cargo fmt --manifest-path research/civbench-experiment-core/Cargo.toml --all -- --check

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civbench-experiment-core/Cargo.toml --all-targets

      - name: Run all tests
        run: cargo test --locked --manifest-path research/civbench-experiment-core/Cargo.toml --all-targets

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civbench-experiment-core/Cargo.toml --all-targets -- -D warnings

      - name: Build documentation without dependencies
        run: cargo doc --locked --manifest-path research/civbench-experiment-core/Cargo.toml --no-deps
