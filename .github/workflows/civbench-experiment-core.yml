name: CivBench experiment core

on:
  pull_request:
    paths:
      - "research/civbench-experiment-core/**"
      - ".github/workflows/civbench-experiment-core.yml"
  push:
    paths:
      - "research/civbench-experiment-core/**"
      - ".github/workflows/civbench-experiment-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-experiment-core:
    name: Test CivBench experiment qualification core
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust with formatting and lint components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify the committed standalone dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -s research/civbench-experiment-core/Cargo.toml
          test -s research/civbench-experiment-core/Cargo.lock
          test -s research/civbench-experiment-core/src/lib.rs
          cargo metadata --locked --manifest-path research/civbench-experiment-core/Cargo.toml --no-deps >/dev/null
          git diff --exit-code -- research/civbench-experiment-core/Cargo.lock

      - name: Check formatting
        id: format_check
        continue-on-error: true
        run: cargo fmt --manifest-path research/civbench-experiment-core/Cargo.toml --all -- --check

      - name: Export rustfmt repair source for review
        if: steps.format_check.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path research/civbench-experiment-core/Cargo.toml --all
          mkdir -p /tmp/civbench-rustfmt
          cp research/civbench-experiment-core/src/lib.rs /tmp/civbench-rustfmt/lib.rs
          git diff --no-ext-diff --unified=3 -- research/civbench-experiment-core/src/lib.rs > /tmp/civbench-rustfmt/rustfmt.diff
          test -s /tmp/civbench-rustfmt/rustfmt.diff

      - name: Upload rustfmt repair source
        if: steps.format_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: civbench-rustfmt-repair
          path: /tmp/civbench-rustfmt/
          if-no-files-found: error

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civbench-experiment-core/Cargo.toml --all-targets

      - name: Run all tests
        run: cargo test --locked --manifest-path research/civbench-experiment-core/Cargo.toml --all-targets

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civbench-experiment-core/Cargo.toml --all-targets -- -D warnings

      - name: Build documentation without dependencies
        run: cargo doc --locked --manifest-path research/civbench-experiment-core/Cargo.toml --no-deps

      - name: Require formatting to be committed (diagnostic repair runs must remain red)
        if: steps.format_check.outcome == 'failure'
        run: |
          echo "The rustfmt repair artifact is diagnostic only; commit the formatted source and rerun."
          exit 1
