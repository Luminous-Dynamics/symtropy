name: NH3 H2 service twin evaluator

on:
  push:
    branches:
      - research/nh3-h2-service-twin-v0-1
    paths:
      - "crates/tools/nh3-h2-service-evaluator/**"
      - "benchmarks/ammonia/nh3-h2-service-v0.json"
      - ".github/workflows/nh3-h2-service-evaluator.yml"
  pull_request:
    paths:
      - "crates/tools/nh3-h2-service-evaluator/**"
      - "benchmarks/ammonia/nh3-h2-service-v0.json"
      - ".github/workflows/nh3-h2-service-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path crates/tools/nh3-h2-service-evaluator/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/nh3-h2-service-evaluator/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/nh3-h2-service-evaluator/Cargo.toml --all-targets -- -D warnings
      - name: Audit frozen NH3 H2 service fixture
        run: cargo run --locked --manifest-path crates/tools/nh3-h2-service-evaluator/Cargo.toml -- benchmarks/ammonia/nh3-h2-service-v0.json
