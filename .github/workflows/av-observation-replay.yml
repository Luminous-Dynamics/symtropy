name: AV observation replay qualification

on:
  push:
    branches:
      - research/av-observation-replay-contract-v1
    paths:
      - "research/av-observation-replay-v0/**"
      - ".github/workflows/av-observation-replay.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/av-observation-replay-v0/**"
      - ".github/workflows/av-observation-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: av-observation-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head:
    name: Exact-head contract tests and strict Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Assert Rust toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          cargo --version
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --manifest-path research/av-observation-replay-v0/Cargo.toml --all -- --check

      - name: Regenerate lockfile for exact Cargo 1.96 resolution
        run: cargo generate-lockfile --manifest-path research/av-observation-replay-v0/Cargo.toml

      - name: Run unit and fixture-integrity tests against resolved lock
        run: cargo test --manifest-path research/av-observation-replay-v0/Cargo.toml

      - name: Run strict Clippy against resolved lock
        run: cargo clippy --locked --manifest-path research/av-observation-replay-v0/Cargo.toml --all-targets -- -D warnings

      - name: Export resolved lockfile for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: av-observation-replay-resolved-lockfile
          path: research/av-observation-replay-v0/Cargo.lock
          if-no-files-found: error

      - name: Require committed lockfile to match resolver output
        run: |
          git ls-files --error-unmatch research/av-observation-replay-v0/Cargo.lock
          git diff --exit-code -- research/av-observation-replay-v0/Cargo.lock
