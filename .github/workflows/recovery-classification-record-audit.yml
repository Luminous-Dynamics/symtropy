name: Recovery Classification Record Audit

on:
  push:
    branches: ["feat/recovery-proof-carrying-records-v0-1"]
    paths:
      - "docs/tech/recovery-classification-record-packet-v0.1.json"
      - "docs/tech/recovery-scenario-envelope-corpus-v0.1.json"
      - "schemas/recovery/classification-record-packet-v0.1.schema.json"
      - "tools/recovery-classification-record-audit/**"
      - ".github/workflows/recovery-classification-record-audit.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/recovery-classification-record-packet-v0.1.json"
      - "docs/tech/recovery-scenario-envelope-corpus-v0.1.json"
      - "schemas/recovery/classification-record-packet-v0.1.schema.json"
      - "tools/recovery-classification-record-audit/**"
      - ".github/workflows/recovery-classification-record-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-classification-record-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classification-record-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Check formatting
        run: cargo fmt --check --manifest-path tools/recovery-classification-record-audit/Cargo.toml
      - name: Run content-integrity and lifecycle tests
        run: cargo test --manifest-path tools/recovery-classification-record-audit/Cargo.toml
      - name: Audit exact-head synthetic record packet
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/recovery-classification-record-audit/Cargo.toml -- \
            docs/tech/recovery-classification-record-packet-v0.1.json \
            --source-commit "$source_commit" > recovery-classification-record-receipt.json
          jq -e '
            ."$schema" == "https://json-schema.org/draft/2020-12/schema"
            and .properties.schema_version.const == "recovery-classification-record-packet-v0.1"
            and .properties.claim_ceiling.properties.authenticity_verified.const == false
            and .properties.claim_ceiling.properties.expected_actuation.const == false
            and (.properties.records.items.properties.sha256."$ref" == "#/$defs/sha256")
          ' schemas/recovery/classification-record-packet-v0.1.schema.json
          jq -e --arg head "$source_commit" '
            .result == "pass"
            and .schema_version == "recovery-classification-record-packet-v0.1"
            and .algorithm_id == "content-bound-classification-record-audit-v0.1"
            and .source_commit == $head
            and .record_count == 17
            and .binding_count == 17
            and .revocation_entry_count == 17
            and .case_count == 17
            and .integrity_counts.MATCH == 17
            and .binding_counts.MATCH == 17
            and .scope_counts.IN_SCOPE == 10
            and .scope_counts.OUT_OF_SCOPE == 7
            and .lifecycle_counts.VALID_ACTIVE == 17
            and .synthetic_review_candidate_count == 3
            and .all_authenticity_unverified == true
            and .all_actuation_disabled == true
            and (.case_results | length) == 17
            and (.errors | length) == 0
          ' recovery-classification-record-receipt.json
      - name: Upload deterministic record receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-classification-record-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery-classification-record-receipt.json
          if-no-files-found: warn
          retention-days: 14
