name: Shipyard EDE Ledger

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-ede-ledger/**"
      - "benchmarks/shipyard/ede/**"
      - "docs/tech/SHIPYARD_EDE_QUALITY_ADJUSTED_ENERGY_V0_1*"
      - ".github/workflows/shipyard-ede-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-ede-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic tandem-GMAW EDE integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-ede-ledger/Cargo.toml --all -- --check

      - name: Run EDE unit and mutation tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-ede-ledger/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-ede-ledger/Cargo.toml --all-targets -- -D warnings

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
