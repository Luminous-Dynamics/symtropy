name: Wildfire Operations Resilience Benchmark

on:
  push:
    branches: ["research/wildfire-ops-benchmark-v0-1"]
    paths:
      - "docs/tech/WILDFIRE_OPS_BENCHMARK_V0_1.md"
      - "docs/tech/WILDFIRE_TRAFFIC_CTM_BENCHMARK_V0_1.md"
      - "docs/tech/WILDFIRE_NETWORK_FLOW_V0_1.md"
      - "docs/tech/WILDFIRE_SUMO_ADAPTER_V0_1.md"
      - "docs/tech/WILDFIRE_SUMO_BEHAVIOR_METRICS_V0_1.md"
      - "docs/tech/WILDFIRE_SUMO_COMPARABILITY_V0_1.md"
      - "benchmarks/fixtures/WILDFIRE_OPS_V0_1.json"
      - "benchmarks/fixtures/WILDFIRE_TRAFFIC_CTM_V0_1.json"
      - "benchmarks/fixtures/WILDFIRE_NETWORK_FLOW_V0_1.json"
      - "benchmarks/fixtures/WILDFIRE_TRAFFIC_CTM_V0_1.json"
      - "benchmarks/fixtures/WILDFIRE_NETWORK_FLOW_V0_1.json"
      - "tools/wildfire-ops-bench/**"
      - ".github/workflows/wildfire-ops-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/WILDFIRE_OPS_BENCHMARK_V0_1.md"
      - "benchmarks/fixtures/WILDFIRE_OPS_V0_1.json"
      - "tools/wildfire-ops-bench/**"
      - ".github/workflows/wildfire-ops-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildfire-ops-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Format validator
        run: cargo fmt --manifest-path tools/wildfire-ops-bench/Cargo.toml --check

      - name: Run validator and negative-control tests
        run: cargo test --manifest-path tools/wildfire-ops-bench/Cargo.toml

      - name: Validate frozen corpus and emit exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/wildfire-ops-bench/Cargo.toml --bin wildfire-ops-bench -- \
            benchmarks/fixtures/WILDFIRE_OPS_V0_1.json \
            --source-commit "$source_commit" > wildfire-ops-reference-receipt.json
          export SOURCE_COMMIT="$source_commit"
          jq -e '
            .result == "pass"
            and .benchmark_id == "WILDFIRE-OPS-001"
            and .scenario_count == 6
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit == env.SOURCE_COMMIT)
            and (.scenarios | length == 6)
            and (.scenarios | all(.status == "pass"))
            and (.scenarios | all(.B1_static_shortest_route != null))
            and (.scenarios | all(.B3_evidence_bounded_feasible_choice != null))
            and (.benchmark_summary.scenario_count == 6)
            and (.benchmark_summary.B1_static_shortest_route.selected_infeasible_plan_count == 5)
            and (.benchmark_summary.B1_static_shortest_route.actual_blocked_edge_violations_against_oracle == 2)
            and (.benchmark_summary.B1_static_shortest_route.expected_choice_match_count == 1)
            and (.benchmark_summary.B1_static_shortest_route.expected_choice_mismatch_count == 5)
            and (.benchmark_summary.B3_evidence_bounded_feasible_choice.selected_infeasible_plan_count == 0)
            and (.benchmark_summary.B3_evidence_bounded_feasible_choice.abstention_count == 3)
            and (.benchmark_summary.B3_evidence_bounded_feasible_choice.expected_choice_match_count == 6)
            and (.benchmark_summary.B3_evidence_bounded_feasible_choice.expected_choice_mismatch_count == 0)
          ' wildfire-ops-reference-receipt.json

      - name: Independently recompute receipt choices and scorecard
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/wildfire-ops-bench/Cargo.toml --bin verify_receipt -- \
            benchmarks/fixtures/WILDFIRE_OPS_V0_1.json \
            wildfire-ops-reference-receipt.json \
            "$source_commit"

      - name: Simulate the frozen traffic-capacity microbenchmark
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          export SOURCE_COMMIT="$source_commit"
          cargo run --quiet --manifest-path tools/wildfire-ops-bench/Cargo.toml --bin wildfire_traffic_ctm -- \
            benchmarks/fixtures/WILDFIRE_TRAFFIC_CTM_V0_1.json \
            --source-commit "$source_commit" > wildfire-traffic-ctm-receipt.json
          jq -e '
            .result == "pass"
            and .benchmark_id == "WILDFIRE-TRAFFIC-001"
            and .scenario_count == 4
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit == env.SOURCE_COMMIT)
            and (.cases | length == 4)
            and (.cases | all(.status == "pass"))
            and (.scorecard.case_count == 4)
            and (.scorecard.B1_static_free_flow.selected_infeasible_count == 2)
            and (.scorecard.B1_static_free_flow.expected_dynamic_choice_matches == 0)
            and (.scorecard.B2_capacity_aware_cell_model.selected_count == 4)
            and (.scorecard.B2_capacity_aware_cell_model.abstention_count == 0)
            and (.scorecard.B2_capacity_aware_cell_model.expected_dynamic_choice_matches == 4)
            and (.cases | all(.paths | all(.simulation.mass_balance_ok == true)))
          ' wildfire-traffic-ctm-receipt.json

      - name: Simulate the frozen directed-network flow benchmark
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          export SOURCE_COMMIT="$source_commit"
          cargo run --quiet --manifest-path tools/wildfire-ops-bench/Cargo.toml --bin wildfire_network_flow -- \
            benchmarks/fixtures/WILDFIRE_NETWORK_FLOW_V0_1.json \
            --source-commit "$source_commit" > wildfire-network-flow-reference-receipt.json
          jq -e '
            .result == "pass"
            and .benchmark_id == "WILDFIRE-NETWORK-001"
            and .scenario_count == 6
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit == env.SOURCE_COMMIT)
            and (.cases | length == 6)
            and (.cases | all(.status == "pass"))
            and (.scorecard.scenario_count == 6)
            and (.scorecard.all_cases_preserve_mass_balance == true)
            and (.scorecard.all_cases_respect_entry_capacity == true)
            and (.cases | all(.edges | all(.entries_at_or_after_closure == 0)))
          ' wildfire-network-flow-reference-receipt.json

      - name: Independently verify directed-network receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/wildfire-ops-bench/Cargo.toml --bin verify_network_flow_receipt -- \
            benchmarks/fixtures/WILDFIRE_NETWORK_FLOW_V0_1.json \
            wildfire-network-flow-reference-receipt.json \
            "$source_commit"

      - name: Export frozen directed networks to SUMO plain XML
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          export SOURCE_COMMIT="$source_commit"
          cargo run --quiet --manifest-path tools/wildfire-ops-bench/Cargo.toml --bin wildfire_sumo_export -- \
            benchmarks/fixtures/WILDFIRE_NETWORK_FLOW_V0_1.json \
            wildfire-sumo-export \
            "$source_commit" 60 13.9 > wildfire-sumo-export.stdout.json
          jq -e '
            .result == "pass"
            and .benchmark_id == "WILDFIRE-NETWORK-001"
            and .scenario_count == 6
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit == env.SOURCE_COMMIT)
            and (.cases | length == 6)
            and (.cases | all(.manifest_sha256 | test("^[0-9a-f]{64}$")))
            and (.cases | all(.file_sha256["nodes.nod.xml"] != null))
            and (.cases | all(.file_sha256["edges.edg.xml"] != null))
            and (.cases | all(.file_sha256["demand.rou.xml"] != null))
            and (.cases | all(.file_sha256["closures.add.xml"] != null))
          ' wildfire-sumo-export/index.json
          test -s wildfire-sumo-export/TWO_ORIGINS_SHARED_BOTTLENECK_001/nodes.nod.xml
          test -s wildfire-sumo-export/TWO_ORIGINS_SHARED_BOTTLENECK_001/edges.edg.xml
          test -s wildfire-sumo-export/TWO_ORIGINS_SHARED_BOTTLENECK_001/demand.rou.xml
          test -s wildfire-sumo-export/TWO_ORIGINS_SHARED_BOTTLENECK_001/closures.add.xml

      - name: Build exported networks with pinned SUMO netconvert
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/eclipse-sumo/sumo@sha256:87623396d3501ca8d0ac25154e202bc38baa55a31c724e4dfd6ae60f297c6bf2"
          docker pull "$image"
          docker run --rm \
            --mount "type=bind,src=$PWD/wildfire-sumo-export,dst=/data" \
            "$image" bash -lc '
              set -euo pipefail
              echo "SUMO container started"
              command -v netconvert
              command -v sumo
              netconvert --version 2>&1 | tee /data/netconvert-version.txt
              sumo --version 2>&1 | tee /data/sumo-version.txt
              grep -q "1.27.1" /data/netconvert-version.txt
              grep -q "1.27.1" /data/sumo-version.txt
              for case_dir in /data/*/; do
                test -f "$case_dir/manifest.json" || continue
                echo "Building network for $(basename "$case_dir")"
                netconvert \
                  --node-files "$case_dir/nodes.nod.xml" \
                  --edge-files "$case_dir/edges.edg.xml" \
                  --output-file "$case_dir/network.net.xml"
                echo "Running SUMO smoke simulation for $(basename "$case_dir")"
                if ! sumo \
                  --net-file "$case_dir/network.net.xml" \
                  --route-files "$case_dir/demand.rou.xml" \
                  --additional-files "$case_dir/closures.add.xml" \
                  --end 3000 \
                  --time-to-teleport -1 \
                  --no-step-log true \
                  --duration-log.disable true \
                  --tripinfo-output "$case_dir/tripinfo.xml" \
                  --tripinfo-output.write-unfinished true \
                  --tripinfo-output.write-undeparted true \
                  > "$case_dir/sumo-smoke.stdout.log" 2> "$case_dir/sumo-smoke.stderr.log"; then
                  cat "$case_dir/sumo-smoke.stdout.log"
                  cat "$case_dir/sumo-smoke.stderr.log"
                  exit 1
                fi
                test -s "$case_dir/tripinfo.xml"
              done
            '
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          export SOURCE_COMMIT="$source_commit"
          cargo run --quiet --manifest-path tools/wildfire-ops-bench/Cargo.toml --bin verify_sumo_export -- \
            benchmarks/fixtures/WILDFIRE_NETWORK_FLOW_V0_1.json \
            wildfire-sumo-export \
            "$source_commit"
          jq -e '
            .result == "pass"
            and .benchmark_id == "WILDFIRE-SUMO-OUTCOMES-001"
            and .case_count == 6
            and (.source_commit == env.SOURCE_COMMIT)
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and (.cases | length == 6)
            and (.cases | all(.sumo_behavior.planned_vehicle_count == .sumo_behavior.tripinfo_record_count))
            and (.cases | all(.sumo_behavior.arrived_by_horizon_vehicle_count + .sumo_behavior.not_arrived_by_horizon_vehicle_count == .sumo_behavior.planned_vehicle_count))
            and (.cases | all(.sumo_behavior.trip_duration_seconds.count == .sumo_behavior.arrived_by_horizon_vehicle_count))
            and (.cases | all(.sumo_behavior.trip_waiting_seconds.count == .sumo_behavior.arrived_by_horizon_vehicle_count))
            and (.cases | all(.sumo_behavior.trip_time_loss_seconds.count == .sumo_behavior.arrived_by_horizon_vehicle_count))
            and (.cases | all(.sumo_behavior.claim_boundary | contains("not equivalent to Symtropy")))
          ' wildfire-sumo-export/sumo-behavior-receipt.json
          jq -e '
            .result == "pass"
            and .benchmark_id == "WILDFIRE-SUMO-COMPARABILITY-001"
            and .case_count == 6
            and (.source_commit == env.SOURCE_COMMIT)
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and (.summary.comparable_case_count == 0)
            and (.summary.non_comparable_case_count == 6)
            and (.summary.cross_model_comparison_permitted == false)
            and (.cases | length == 6)
            and (.cases | all(.status == "non_comparable" and .comparison_permitted == false))
            and (.cases | all([.blocking_reasons[].code] | index("EDGE_CAPACITY_STORAGE_UNCALIBRATED") != null))
            and (.cases | all([.blocking_reasons[].code] | index("SINK_SERVICE_GATES_NOT_ENFORCED") != null))
            and (.cases | all([.blocking_reasons[].code] | index("ACCESSIBILITY_LABEL_ONLY") != null))
            and ([.cases[] | select(.case_id == "ENTRY_CLOSURE_DURING_DEPARTURES_003") | .blocking_reasons[].code] | index("CLOSURE_POLICY_DIFFERS") != null)
          ' wildfire-sumo-export/sumo-comparability-receipt.json

      - name: Upload deterministic benchmark receipts
        uses: actions/upload-artifact@v4
        with:
          name: wildfire-resilience-benchmark-receipts
          path: |
            wildfire-ops-reference-receipt.json
            wildfire-traffic-ctm-receipt.json
            wildfire-network-flow-reference-receipt.json
            wildfire-sumo-export/sumo-behavior-receipt.json
            wildfire-sumo-export/sumo-comparability-receipt.json
            wildfire-sumo-export/
          if-no-files-found: error
          retention-days: 90
