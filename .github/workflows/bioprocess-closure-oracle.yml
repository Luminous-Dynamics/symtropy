name: Bioprocess Closure Oracle Contract

on:
  pull_request:
    paths:
      - "tools/bioprocess-closure-oracle/**"
      - "docs/research/bioprocess/bioprocess-closure-*.json"
      - ".github/workflows/bioprocess-closure-oracle.yml"

permissions:
  contents: read

concurrency:
  group: bioprocess-closure-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Exact-head synthetic process closure contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Confirm checkout is exact requested head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          printf 'expected_head=%s\nactual_head=%s\n' "$EXPECTED_HEAD" "$actual"

      - name: Format focused crate
        run: cargo fmt --manifest-path tools/bioprocess-closure-oracle/Cargo.toml -- --check

      - name: Test focused crate
        run: cargo test --manifest-path tools/bioprocess-closure-oracle/Cargo.toml

      - name: Clippy focused crate
        run: cargo clippy --manifest-path tools/bioprocess-closure-oracle/Cargo.toml --all-targets -- -D warnings

      - name: Produce exact-head evidence receipt
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path tools/bioprocess-closure-oracle/Cargo.toml -- \
            --expected-head "$EXPECTED_HEAD" \
            --corpus docs/research/bioprocess/bioprocess-closure-corpus-v1.json \
            --receipt target/bioprocess-closure-receipt.json
          test -s target/bioprocess-closure-receipt.json

      - name: Preserve receipt artifact
        if: ${{ always() && hashFiles('target/bioprocess-closure-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bioprocess-closure-receipt
          path: target/bioprocess-closure-receipt.json
          if-no-files-found: error
          retention-days: 30
