name: Shipyard polygon geometry

on:
  pull_request:
    branches: ["research/shipyard-space-time-oracle-v0"]
    paths:
      - "tools/shipyard-polygon-geometry/**"
      - ".github/workflows/shipyard-polygon-geometry.yml"
  push:
    branches: ["research/shipyard-polygon-geometry-v0"]
    paths:
      - "tools/shipyard-polygon-geometry/**"
      - ".github/workflows/shipyard-polygon-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Pinned Rust polygon oracle suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/shipyard-polygon-geometry/Cargo.toml -- --check
      - name: Run tests offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-polygon-geometry/Cargo.toml
      - name: Clippy with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-polygon-geometry/Cargo.toml --all-targets -- -D warnings
