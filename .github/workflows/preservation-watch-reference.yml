name: preservation-watch-reference isolated qualification

on:
  pull_request:
    paths:
      - 'research/physical-storage/preservation-watch-reference/**'
      - 'research/physical-storage/preservation-watch-reference/Cargo.lock'
      - '.github/workflows/preservation-watch-reference.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'research/physical-storage/preservation-watch-reference/**'
      - 'research/physical-storage/preservation-watch-reference/Cargo.lock'
      - '.github/workflows/preservation-watch-reference.yml'

permissions:
  contents: write

jobs:
  rust:
    name: preservation-watch-reference (Rust 1.96.0)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      MANIFEST: research/physical-storage/preservation-watch-reference/Cargo.toml
      SOURCE: research/physical-storage/preservation-watch-reference/src/lib.rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Apply rustfmt
        run: cargo fmt --manifest-path "$MANIFEST"
      - name: Commit rustfmt changes to this PR branch
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- "$SOURCE"; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          git commit -m "style: rustfmt preservation-watch-reference"
          git push origin "HEAD:$PR_BRANCH"
      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Draft 2020-12 schemas and frozen fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          pairs = [
              ("research/physical-storage/preservation_watch_cases_v0_1.schema.json", "research/physical-storage/fixtures/preservation_watch_cases_v0_1.json"),
          ]
          for schema_path, fixture_path in pairs:
              schema = json.loads(Path(schema_path).read_text())
              fixture = json.loads(Path(fixture_path).read_text())
              assert schema.get("$schema") == "https://json-schema.org/draft/2020-12/schema", schema_path
              Draft202012Validator.check_schema(schema)
              errors = sorted(
                  Draft202012Validator(schema).iter_errors(fixture),
                  key=lambda error: list(map(str, error.absolute_path)),
              )
              if errors:
                  for error in errors:
                      print(f"{fixture_path}: {list(error.absolute_path)}: {error.message}")
                  raise SystemExit(1)
              print(f"VALID Draft 2020-12: {fixture_path}")
          PY
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --manifest-path "$MANIFEST" --all-targets
