name: Shipyard Draft 2020-12 schema validation

on:
  pull_request:
    branches: ["research/shipyard-benchmark-audit-v0"]
    paths:
      - "tools/shipyard-jsonschema-validator/**"
      - "tools/shipyard-benchmark-audit/**"
      - "tools/shipyard-benchmark-contract/**"
      - ".github/workflows/shipyard-jsonschema-validation.yml"
  push:
    branches: ["research/shipyard-jsonschema-validator-v0"]
    paths:
      - "tools/shipyard-jsonschema-validator/**"
      - "tools/shipyard-benchmark-audit/**"
      - "tools/shipyard-benchmark-contract/**"
      - ".github/workflows/shipyard-jsonschema-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shipyard-jsonschema-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Bootstrap, then verify the committed exact head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Generate pinned dependency lockfile if missing
        run: cargo generate-lockfile --manifest-path tools/shipyard-jsonschema-validator/Cargo.toml
      - name: Apply Rust 1.96 formatting
        run: cargo fmt --manifest-path tools/shipyard-jsonschema-validator/Cargo.toml
      - name: Detect bootstrap changes
        id: prep
        run: |
          if [ -z "$(git status --porcelain -- tools/shipyard-jsonschema-validator)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail on forked PR that needs generated lockfile or formatting
        if: steps.prep.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "This PR needs a committed Cargo.lock or rustfmt changes. Please regenerate/format locally and push those changes."
          exit 1
      - name: Commit bootstrap changes and let the new SHA trigger verification
        if: steps.prep.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/shipyard-jsonschema-validator
          git commit -m "build(shipyard): pin schema validator lockfile and formatting"
          git push origin "HEAD:${HEAD_REF}"
      - name: Fetch the locked dependency graph
        if: steps.prep.outputs.changed == 'false'
        run: cargo fetch --locked --manifest-path tools/shipyard-jsonschema-validator/Cargo.toml
      - name: Check Rust formatting on the committed tree
        if: steps.prep.outputs.changed == 'false'
        run: cargo fmt --manifest-path tools/shipyard-jsonschema-validator/Cargo.toml -- --check
      - name: Run schema and semantic tests offline
        if: steps.prep.outputs.changed == 'false'
        run: cargo test --locked --offline --manifest-path tools/shipyard-jsonschema-validator/Cargo.toml
      - name: Clippy with warnings denied
        if: steps.prep.outputs.changed == 'false'
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-jsonschema-validator/Cargo.toml --all-targets -- -D warnings
