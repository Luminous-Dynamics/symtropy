name: Shipyard Reference Artifact Drift Sentinel

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-reference-drift/**"
      - "benchmarks/shipyard/reference-drift/**"
      - "docs/tech/SHIPYARD_REFERENCE_DRIFT_V0_1*"
      - ".github/workflows/shipyard-reference-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-reference-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic reference-artifact drift sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-reference-drift/Cargo.toml --all -- --check

      - name: Run drift sentinel unit and mutation tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-reference-drift/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-reference-drift/Cargo.toml --all-targets -- -D warnings

      - name: Replay frozen stable and drift cases
        run: cargo run --locked --manifest-path crates/tools/shipyard-reference-drift/Cargo.toml -- benchmarks/shipyard/reference-drift/corpus-v0.1.json

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
