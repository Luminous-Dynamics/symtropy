name: Fabrication Cumulative Qualification

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: fabrication-cumulative-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Workspace Invariants
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Physics Core Tests
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Run Fabrication Tests
      run: cargo test -p symtropy-fabrication --lib

    - name: Run Construction Tests
      run: cargo test -p symtropy-construction --lib

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets

    - name: Patch Conduit Functional Proof
      run: cargo run -p symtropy-firstlight -- patch-conduit

    - name: Patch Conduit Exact Plan Proof
      run: cargo run -p symtropy-firstlight -- patch-conduit-exact-plan

    - name: Patch Conduit Staged Execution Proof
      run: cargo run -p symtropy-firstlight -- patch-conduit-execute

    - name: Patch Conduit Diagnostic Proof
      run: cargo run -p symtropy-firstlight -- patch-conduit-diagnose
