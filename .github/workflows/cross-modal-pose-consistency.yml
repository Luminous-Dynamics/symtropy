name: Cross-Modal Spacecraft Pose Consistency

on:
  pull_request:
    paths:
      - "tools/cross-modal-pose-consistency-bench/**"
      - ".github/workflows/cross-modal-pose-consistency.yml"
  push:
    branches:
      - "research/cross-modal-pose-consistency-v0-1"
    paths:
      - "tools/cross-modal-pose-consistency-bench/**"
      - ".github/workflows/cross-modal-pose-consistency.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Common-cause and cross-modal pose consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/cross-modal-pose-consistency-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/cross-modal-pose-consistency-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/cross-modal-pose-consistency-bench/Cargo.toml --all-targets -- -D warnings
      - name: Independent complete receipt parity
        run: |
          set -euo pipefail
          manifest=tools/cross-modal-pose-consistency-bench/fixtures/cross-modal-common-cause-v0_1.tsv
          digest=$(sha256sum "$manifest" | cut -d' ' -f1)
          cargo run --quiet --locked --manifest-path tools/cross-modal-pose-consistency-bench/Cargo.toml -- "$manifest" "$GITHUB_SHA" "$digest" > /tmp/cross-modal-rust.json
          python3 tools/cross-modal-pose-consistency-bench/tests/reference_oracle.py "$manifest" "$GITHUB_SHA" "$digest" > /tmp/cross-modal-python.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/cross-modal-rust.json").read_text())
          oracle = json.loads(Path("/tmp/cross-modal-python.json").read_text())
          assert rust == oracle, "Rust/Python complete receipt mismatch"
          assert rust["pair_count"] == 12
          assert rust["independence_proven"] is False
          assert rust["physical_truth_established"] is False
          assert rust["deterministic_safety_bound"] is False
          assert rust["maneuver_authority_granted"] is False
          cases = {result["sample_id"].removeprefix("rgb-"): result for result in rust["results"]}
          expected = {
              "consistent": "CANDIDATE_CONSISTENT",
              "shared_clock": "DEPENDENCE_UNKNOWN",
              "shared_training_target": "DEPENDENCE_UNKNOWN",
              "common_mode_bias": "DEPENDENCE_UNKNOWN",
              "conflict": "DISAGREEMENT",
              "antipodal_quaternion": "CANDIDATE_CONSISTENT",
              "stale_timestamp": "OUT_OF_SCOPE",
              "frame_identity_mismatch": "OUT_OF_SCOPE",
              "coordinate_convention_mismatch": "OUT_OF_SCOPE",
              "event_ood": "ABSTAIN_MODALITY_UNAVAILABLE",
              "low_observability": "ABSTAIN_LOW_OBSERVABILITY",
              "incomplete_dependencies": "DEPENDENCE_UNKNOWN",
          }
          assert {name: result["disposition"] for name, result in cases.items()} == expected
          assert cases["common_mode_bias"]["translation_disagreement_um"] == 100
          assert cases["common_mode_bias"]["independence_proven"] is False
          assert cases["shared_clock"]["shared_dependency_kinds"] == ["clock"]
          assert cases["antipodal_quaternion"]["orientation_chord_q30"] == 0
          PY
      - name: Retain exact receipt and manifest
        uses: actions/upload-artifact@v4
        with:
          name: cross-modal-pose-consistency-evidence
          path: |
            /tmp/cross-modal-rust.json
            /tmp/cross-modal-python.json
            tools/cross-modal-pose-consistency-bench/fixtures/*.tsv
          if-no-files-found: error
          retention-days: 30
