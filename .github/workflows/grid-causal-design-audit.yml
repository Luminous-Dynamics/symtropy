name: Grid Causal Design Audit

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/domains/symtropy-grid-causal-design/**"
      - ".github/workflows/grid-causal-design-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid-causal-design-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Parse strict schema and fixture
        run: |
          jq empty crates/domains/symtropy-grid-causal-design/schemas/grid_causal_design_v0_1.schema.json
          jq empty crates/domains/symtropy-grid-causal-design/fixtures/grid_causal_design_v0_1.json
      - name: Format
        run: cargo fmt --package symtropy-grid-causal-design -- --check
      - name: Rust tests
        run: cargo test -p symtropy-grid-causal-design --locked
      - name: Clippy
        run: cargo clippy -p symtropy-grid-causal-design --all-targets --locked -- -D warnings
      - name: Emit deterministic audit report
        run: |
          cargo run --quiet -p symtropy-grid-causal-design --locked --bin grid_causal_design_audit -- \
            crates/domains/symtropy-grid-causal-design/fixtures/grid_causal_design_v0_1.json \
            > grid-causal-design-report.json
          jq -e '
            .benchmark_id == "GRID-CAUSAL-DESIGN-AUDIT-001"
            and .design_qualified == true
            and .design_class == "cluster_randomized_parallel"
            and .primary_estimand == "intention_to_treat"
            and .primary_outcome_unit == "kWh"
            and .cluster_count == 8
            and .site_count == 8
            and .asset_count == 8
            and .treated_cluster_count == 4
            and .control_cluster_count == 4
            and .stratum_count == 2
            and .randomization_reproducible == true
            and .declared_pre_registration_precedes_randomization == true
            and .declared_public_randomness_published_after_freeze == true
            and .interference_domain_ids_unique_in_manifest == true
            and .pre_registration_document_authenticated == false
            and .interference_mapping_authenticated == false
            and .declared_timestamps_attested == false
            and .cluster_level_inference_required == true
            and .external_randomness_source_authenticated == false
            and .causal_effect_estimated == false
            and .treatment_on_treated_identified == false
            and .settlement_authority_granted == false
            and .payment_authorized == false
            and .dispatch_authority_granted == false
            and (.input_digest | test("^sha256:[0-9a-f]{64}$"))
            and (.randomization_assignment_digest | test("^sha256:[0-9a-f]{64}$"))
          ' grid-causal-design-report.json
          cat grid-causal-design-report.json
      - name: Upload causal design audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: grid-causal-design-audit-evidence
          path: |
            grid-causal-design-report.json
            crates/domains/symtropy-grid-causal-design/fixtures/grid_causal_design_v0_1.json
            crates/domains/symtropy-grid-causal-design/schemas/grid_causal_design_v0_1.schema.json
            crates/domains/symtropy-grid-causal-design/README.md
          if-no-files-found: error
