name: AERO Independent Assurance Benchmark Contract

on:
  push:
    branches:
      - research/aero-independent-assurance-benchmark-v0.3
      - research/aero-assurance-disposition-semantics-v0.1
      - research/aero-assurance-disposition-evaluator-v0.1
      - research/aero-state-vector-source-binding-v0.1
      - research/aero-evsi-evidence-action-planner-v0.1
      - research/aero-robust-evsi-v0.1
      - research/aero-assurance-delta-v0.1
      - research/aero-tool-assurance-v0.1
    paths:
      - .github/workflows/aero-independent-assurance-benchmark.yml
      - crates/domains/symtropy-aero-material-qual/**
      - Cargo.toml
      - Cargo.lock
      - docs/research/aviation/**
      - tools/aero/**
  pull_request:
    paths:
      - .github/workflows/aero-independent-assurance-benchmark.yml
      - crates/domains/symtropy-aero-material-qual/**
      - Cargo.toml
      - Cargo.lock
      - docs/research/aviation/**
      - tools/aero/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Benchmark and Rust disposition contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate v0.3 registry and challenge corpus
        run: python tools/aero/validate_independent_assurance_benchmark.py
      - name: Validate point EVSI planner fixture and independent integer oracle
        run: python tools/aero/validate_evidence_action_planner.py
      - name: Validate robust EVSI scenario-set contract
        run: python tools/aero/validate_robust_evidence_action_evsi.py
      - name: Validate assurance delta impact fixture and independent oracle
        run: python tools/aero/validate_assurance_delta_impact.py
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check AERO evaluator formatting
        run: cargo fmt --manifest-path Cargo.toml --package symtropy-aero-material-qual -- --check
      - name: Test AERO evaluator (locked dependency graph)
        run: cargo test --locked --manifest-path Cargo.toml --package symtropy-aero-material-qual
      - name: Clippy AERO evaluator (locked dependency graph)
        run: cargo clippy --locked --manifest-path Cargo.toml --package symtropy-aero-material-qual --all-targets -- -D warnings
