name: GAUGE Raw Rigid Trial Contract

on:
  pull_request:
    paths:
      - 'benchmarks/gauge-rigid-raw-trial-contract/v0.1/**'
      - '.github/workflows/gauge-rigid-raw-trial-contract.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/gauge-rigid-raw-trial-contract/v0.1/**'
      - '.github/workflows/gauge-rigid-raw-trial-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauge-rigid-raw-trial-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/gauge-rigid-raw-trial-contract/v0.1/Cargo.toml -- --check
      - name: Run raw-trial contract tests
        run: cargo test --manifest-path benchmarks/gauge-rigid-raw-trial-contract/v0.1/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/gauge-rigid-raw-trial-contract/v0.1/Cargo.toml --all-targets --locked -- -D warnings
