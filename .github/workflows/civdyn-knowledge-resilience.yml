name: CivDyn knowledge resilience reference

on:
  pull_request:
    paths:
      - "research/civdyn-knowledge-resilience/**"
      - ".github/workflows/civdyn-knowledge-resilience.yml"
  push:
    paths:
      - "research/civdyn-knowledge-resilience/**"
      - ".github/workflows/civdyn-knowledge-resilience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute knowledge resilience benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-knowledge-resilience/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-knowledge-resilience/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-knowledge-resilience/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-knowledge-resilience/Cargo.toml --all-targets

      - name: Execute knowledge lifecycle and archive recovery sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-knowledge-evidence
          cargo run --locked --manifest-path research/civdyn-knowledge-resilience/Cargo.toml --bin knowledge-resilience-sweep \
            | tee target/civdyn-knowledge-evidence/knowledge-resilience.csv

      - name: Verify capability lifecycle, refuted knowledge and archive failure domains
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-knowledge-evidence/knowledge-resilience.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 11, f"expected 2 items + 5 transmissions + 4 archive outcomes, got {len(rows)}"
          assert all(len(row) == 24 for row in rows)

          items = {row["item_id"]: row for row in rows if row["record_type"] == "item_summary"}
          hydro = items["hydrology_skill"]
          assert hydro["epistemic_status"] == "verified"
          assert hydro["carrier_state_count"] == "4"
          assert hydro["transmission_events"] == "3"
          assert hydro["delivered_transmissions"] == "3"
          assert hydro["acquisition_count"] == "3"
          assert hydro["comprehension_count"] == "3"
          assert hydro["demonstration_success_count"] == "3"
          assert hydro["retention_assessed_count"] == "3"
          assert hydro["retained_count"] == "2"
          assert hydro["independent_teacher_count"] == "2"
          assert hydro["longest_consecutive_demonstrated_generations"] == "3"
          assert hydro["verified_archive_copy_count"] == "3"
          assert hydro["independent_archive_failure_domain_count"] == "2"

          myth = items["silt_myth"]
          assert myth["epistemic_status"] == "refuted"
          assert myth["carrier_state_count"] == "2"
          assert myth["refuted_knowledge_acquisition_count"] == "1"
          assert myth["verified_archive_copy_count"] == "0"

          archive = {
              (row["item_id"], row["scope"]): row
              for row in rows if row["record_type"] == "archive_recovery"
          }
          hydro_failed = archive[("hydrology_skill", "archive_domain_a_failed")]
          myth_failed = archive[("silt_myth", "archive_domain_a_failed")]
          assert hydro_failed["recoverable"] == "true"
          assert hydro_failed["recovery_surviving_verified_copy_count"] == "2"
          assert myth_failed["recoverable"] == "false"
          assert myth_failed["recovery_surviving_verified_copy_count"] == "0"

          print("CIVDYN-KNOW-001 delivery/acquisition separation, durable capability, refuted uptake and archive-domain resilience verified.")
          PY

          {
            echo "## CIVDYN-KNOW-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-knowledge-evidence/knowledge-resilience.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic evidence-aware knowledge trace"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload knowledge resilience evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-knowledge-resilience
          path: target/civdyn-knowledge-evidence/knowledge-resilience.csv
          if-no-files-found: error
          retention-days: 30
