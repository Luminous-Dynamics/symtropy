name: Weak-IV Anderson Rubin Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "research/weak-iv-ar-confidence-set-v1/**"
      - ".github/workflows/weak-iv-ar-confidence-set-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weak-iv-ar-confidence-set-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Weak-IV AR confidence set
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/weak-iv-ar-confidence-set-v1/Cargo.toml -- --check
      - name: Run synthetic Anderson-Rubin tests
        run: cargo test --manifest-path research/weak-iv-ar-confidence-set-v1/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/weak-iv-ar-confidence-set-v1/Cargo.toml --locked --all-targets -- -D warnings
