name: Maritime Repair Restoration Contract

on:
  pull_request:
    branches: [research/diagnostic-claim-revision-v0-1]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/maritime-control-response/src/repair_restoration.rs"
      - "benchmarks/maritime-control-response/src/lib.rs"
      - "benchmarks/maritime-control-response/repair-restoration-*"
      - "benchmarks/maritime-control-response/repair-restoration.schema.json"
      - "docs/tech/MARITIME_REPAIR_RESTORATION_V0_1.md"
      - ".github/workflows/maritime-repair-restoration-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-repair-restoration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  repair-restoration-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned JSON Schema validator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Validate protocol, case schema and falsification corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("benchmarks/maritime-control-response")
          protocol = json.loads((root / "repair-restoration-v0.1.json").read_text())
          schema = json.loads((root / "repair-restoration.schema.json").read_text())
          corpus = json.loads((root / "repair-restoration-cases-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          assert protocol["schema_version"] == "symtropy-marine-repair-restoration-v0.1"
          assert protocol["status"] == "protocol_only_not_executed"
          assert len(protocol["hard_gates"]) >= 30
          assert len(corpus["cases"]) == 8
          assert len({case["case_id"] for case in corpus["cases"]}) == 8
          assert schema["additionalProperties"] is False
          assert "measurement_evidence_sha256" in schema["properties"]["pre_repair_episode"]["properties"]["measurements"]["items"]["required"]
          assert "diagnostic_revision_receipt_sha256" in schema["properties"]["binding"]["required"]
          assert all(case["expected_disposition"] for case in corpus["cases"])
          assert "physical_restoration_authorized" in (root / "src/repair_restoration.rs").read_text()
          print("Repair restoration protocol/schema/corpus checks: PASS")
          PY

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Verify full crate formatting
        working-directory: benchmarks/maritime-control-response
        run: cargo fmt -- --check

      - name: Run complete library regression suite
        working-directory: benchmarks/maritime-control-response
        run: cargo test --locked --lib

      - name: Run strict library Clippy
        working-directory: benchmarks/maritime-control-response
        run: cargo clippy --locked --lib -- -D warnings
