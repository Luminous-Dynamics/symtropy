name: Thermal Model Validation Contract

on:
  pull_request:
    paths:
      - 'benchmarks/thermal-model-validation/v0.1/**'
      - 'tools/validate_thermal_model_validation.py'
      - '.github/workflows/thermal-model-validation.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/thermal-model-validation/v0.1/**'
      - 'tools/validate_thermal_model_validation.py'
      - '.github/workflows/thermal-model-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.24.0
      - name: Validate model, held-out split and negative controls
        run: python tools/validate_thermal_model_validation.py
