name: AeroWeft Operational Assurance Case Oracle

on:
  pull_request:
    paths:
      - "tools/aeroweift-assurance-case/**"
      - "docs/research/aviation/AEROWEFT_OPERATIONAL_ASSURANCE_CASE_001.md"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - "fixtures/aeroweift-assurance-case/**"
      - ".github/workflows/aeroweift-assurance-case-oracle.yml"
  push:
    branches:
      - "research/aeroweFt-operational-assurance-case-001"
    paths:
      - "tools/aeroweift-assurance-case/**"
      - "docs/research/aviation/AEROWEFT_OPERATIONAL_ASSURANCE_CASE_001.md"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - "fixtures/aeroweift-assurance-case/**"
      - ".github/workflows/aeroweift-assurance-case-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeroweift-assurance-case-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/aeroweift-assurance-case/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/aeroweift-assurance-case/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/aeroweift-assurance-case/Cargo.toml --all-targets
