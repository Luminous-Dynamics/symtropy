name: Maritime cyber-physical assurance evaluator
on:
  push:
    branches: ["research/maritime-cyberphysical-assurance-v0-1"]
    paths:
      - "tools/maritime-cyberphysical-assurance-evaluator/**"
      - "benchmarks/maritime-cyberphysical-assurance/**"
      - "docs/tech/MARITIME_CYBERPHYSICAL_ASSURANCE_CORPUS_V0_1.schema.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/maritime-cyberphysical-assurance-evaluator.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/maritime-cyberphysical-assurance-evaluator/**"
      - "benchmarks/maritime-cyberphysical-assurance/**"
      - "docs/tech/MARITIME_CYBERPHYSICAL_ASSURANCE_CORPUS_V0_1.schema.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/maritime-cyberphysical-assurance-evaluator.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maritime-cyberphysical-assurance-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Format evaluator
        run: cargo fmt --package maritime-cyberphysical-assurance-evaluator -- --check
      - name: Test evaluator
        run: cargo test --locked -p maritime-cyberphysical-assurance-evaluator
      - name: Strict Clippy
        run: cargo clippy --locked -p maritime-cyberphysical-assurance-evaluator --all-targets -- -D warnings
      - name: Execute frozen corpus and verify receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "\${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-cyberphysical-assurance/corpus-v0.1.json"
          sha="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-cyberphysical-assurance-evaluator -- "$input" --source-commit "$source_commit" --corpus-sha256 "$sha" > maritime-cyberphysical-assurance-receipt.json
          jq -e --arg source "$source_commit" --arg sha "$sha" '.result == "pass" and .source_commit == $source and .corpus_sha256 == $sha and .scenario_count == 12 and .taxonomy_class_count == 12 and .exact_diagnosis_set_match_count == 12 and .false_unique_cause_count == 0 and .missed_component_count == 0 and .false_positive_component_count == 0 and .sensor_to_command_latency == "NOT_MEASURED" and .algorithm_compute_time_is_not_end_to_end_latency == true and .source_artifact_payloads_verified == false and .authority_boundary.read_only == true and .authority_boundary.generator_command == false and .authority_boundary.bess_command == false and .authority_boundary.topology_switching == false' maritime-cyberphysical-assurance-receipt.json
      - name: Upload synthetic assurance receipt
        uses: actions/upload-artifact@v4
        with:
          name: maritime-cyberphysical-assurance-receipt
          path: maritime-cyberphysical-assurance-receipt.json
          if-no-files-found: error
          retention-days: 90
