name: GLASS-SELECTION-AWARE-QUALIFICATION Audit

on:
  pull_request:
    paths:
      - "tools/glass-silicon-contract-audit/**"
      - "docs/tech/glass-selection-aware-qualification-*.schema.json"
      - "docs/tech/GLASS_SELECTION_AWARE_QUALIFICATION_V0_1.md"
      - ".github/workflows/glass-selection-aware-qualification.yml"
  push:
    branches:
      - "research/glass-selection-aware-qualification-v0.1"
    paths:
      - "tools/glass-silicon-contract-audit/**"
      - "docs/tech/glass-selection-aware-qualification-*.schema.json"
      - "docs/tech/GLASS_SELECTION_AWARE_QUALIFICATION_V0_1.md"
      - ".github/workflows/glass-selection-aware-qualification.yml"

permissions:
  contents: read

jobs:
  selection-aware-qualification:
    name: Simultaneous confidence bounds, known answers, and replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Validate frozen schema contracts and fixtures
        shell: bash
        run: |
          set -euo pipefail
          task_schema="docs/tech/glass-selection-aware-qualification-task-v0.1.schema.json"
          oracle_schema="docs/tech/glass-selection-aware-qualification-oracle-v0.1.schema.json"
          report_schema="docs/tech/glass-selection-aware-qualification-report-v0.1.schema.json"
          task="tools/glass-silicon-contract-audit/fixtures/glass-selection-aware-qualification-task.synthetic.json"
          oracle="tools/glass-silicon-contract-audit/fixtures/glass-selection-aware-qualification-oracle.synthetic.json"

          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.benchmark_id.const == "glass-selection-aware-qualification-synthetic-v0-1" and
            .properties.target_success_probability.const == 0.95 and
            .properties.familywise_confidence_level.const == 0.95 and
            .additionalProperties == false
          ' "$task_schema" > /dev/null
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.evidence_class.const == "synthetic_evaluator_only" and
            .properties.outcomes.maxItems == 100 and
            .additionalProperties == false
          ' "$oracle_schema" > /dev/null
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.audit_kind.const == "synthetic_selection_aware_binomial_qualification" and
            .properties.adjustment.const == "bonferroni_simultaneous_two_sided_exact_binomial" and
            .properties.decisions.items.properties.disposition.enum == ["QUALIFIED","NOT_QUALIFIED","UNRESOLVED"] and
            .additionalProperties == false
          ' "$report_schema" > /dev/null
          jq -e '
            .schema_version == 1 and
            .benchmark_id == "glass-selection-aware-qualification-synthetic-v0-1" and
            .target_success_probability == 0.95 and
            .familywise_confidence_level == 0.95 and
            ([.candidates[].candidate_id] == ["lot-alpha","lot-beta","lot-gamma","lot-delta","lot-epsilon"])
          ' "$task" > /dev/null
          jq -e '
            .schema_version == 1 and
            .evidence_class == "synthetic_evaluator_only" and
            ([.outcomes[] | {n:(.trial_results|length), s:([.trial_results[] | select(.)] | length)}] ==
             [{"n":104,"s":104},{"n":103,"s":103},{"n":100,"s":85},{"n":80,"s":76},{"n":0,"s":0}])
          ' "$oracle" > /dev/null
          echo "Selection-aware task/oracle/report schema checks: PASS"

      - name: Run exact-binomial selection-adjusted tests
        run: cargo test --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --bin audit-qualification-familywise

      - name: Execute family-wise audit and deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          task="tools/glass-silicon-contract-audit/fixtures/glass-selection-aware-qualification-task.synthetic.json"
          oracle="tools/glass-silicon-contract-audit/fixtures/glass-selection-aware-qualification-oracle.synthetic.json"
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --bin audit-qualification-familywise -- "$task" "$oracle" > glass-selection-aware-report.json
          task_digest="$(sha256sum "$task" | awk '{print $1}')"
          oracle_digest="$(sha256sum "$oracle" | awk '{print $1}')"
          jq -e --arg task_digest "$task_digest" --arg oracle_digest "$oracle_digest" '
            .status == "PASS" and
            .audit_kind == "synthetic_selection_aware_binomial_qualification" and
            .input_sha256 == $task_digest and
            .oracle_sha256 == $oracle_digest and
            .family_size == 5 and
            .per_candidate_tail_alpha == 0.005 and
            .findings == [] and
            ([.decisions[] | select(.candidate_id == "lot-alpha")][0].disposition == "QUALIFIED") and
            ([.decisions[] | select(.candidate_id == "lot-beta")][0].disposition == "UNRESOLVED") and
            ([.decisions[] | select(.candidate_id == "lot-gamma")][0].disposition == "NOT_QUALIFIED") and
            ([.decisions[] | select(.candidate_id == "lot-delta")][0].disposition == "UNRESOLVED") and
            ([.decisions[] | select(.candidate_id == "lot-epsilon")][0].disposition == "UNRESOLVED") and
            ([.decisions[] | select(.candidate_id == "lot-alpha")][0].simultaneous_confidence_interval.lower >= 0.95) and
            ([.decisions[] | select(.candidate_id == "lot-beta")][0].simultaneous_confidence_interval.lower < 0.95) and
            ([.decisions[] | select(.candidate_id == "lot-gamma")][0].simultaneous_confidence_interval.upper < 0.95) and
            ([.decisions[] | select(.candidate_id == "lot-epsilon")][0].simultaneous_confidence_interval == {"lower":0,"upper":1})
          ' glass-selection-aware-report.json

          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --bin audit-qualification-familywise -- \
            --replay glass-selection-aware-report.json "$task" "$oracle" > glass-selection-aware-replay.json
          jq -e --arg task_digest "$task_digest" --arg oracle_digest "$oracle_digest" '
            .status == "PASS" and
            .audit_kind == "synthetic_selection_aware_qualification_replay" and
            .input_sha256 == $task_digest and
            .oracle_sha256 == $oracle_digest and
            .findings == []
          ' glass-selection-aware-replay.json
          echo "Selection-adjusted qualification audit and deterministic replay: PASS"
