name: Mobility RRVR Runtime Projection

on:
  push:
    branches:
      - research/mobility-rrvr-runtime-projection-v0-1
      - research/mobility-rrvr-attempt-lineage-v0-1
      - research/mobility-rrvr-fault-campaign-v0-1
      - research/mobility-rrvr-plan-compiler-v0-1
      - research/mobility-rrvr-execution-evidence-v0-1
      - research/mobility-rrvr-gazebo-adapter-v0-1
      - research/mobility-rrvr-benchmark-overlay-v0-1
    paths:
      - "research/mobility-rrvr-runtime-trace/**"
      - "research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla"
      - ".github/workflows/mobility-rrvr-runtime-projection.yml"
  pull_request:
    paths:
      - "research/mobility-rrvr-runtime-trace/**"
      - "research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla"
      - ".github/workflows/mobility-rrvr-runtime-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Download and verify pinned TLC and formal inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          JAR="$RUNNER_TEMP/tla/tla2tools.jar"
          curl --fail --location --retry 3 \
            "https://github.com/microsoft/tlalink/releases/download/tla2tools-2ef2af8/tla2tools.jar" \
            --output "$JAR"
          MODEL="research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla"
          MODEL_CFG="research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.cfg"
          TRACE_SPEC="research/mobility-rrvr-runtime-trace/RestartSafeEffectContinuityTrace.tla"
          TRACE_CFG="research/mobility-rrvr-runtime-trace/RestartSafeEffectContinuityTrace.cfg"
          printf '%s  %s\n' "d15655eeaff4b3f7b3d65c46b838bc0f35d131b2ef4b1e473689b62c98d4726f" "$JAR" | sha256sum --check
          printf '%s  %s\n' "fb2117728e195f9ae5f188e75afdf989d42165472c4bcb6a47238ceb07810d81" "$MODEL" | sha256sum --check
          printf '%s  %s\n' "e599cffcf0e82887af8ba627470c026da1109a5becc81e9a21c6755919495168" "$MODEL_CFG" | sha256sum --check
          printf '%s  %s\n' "281c17f88823c88edf070b4d7b320738f8c5b46645ec41cb1059213c69a5e3aa" "$TRACE_SPEC" | sha256sum --check
          printf '%s  %s\n' "b4e7c14733a757a9923e9837519586708b85ee23c6bb35995fff245695a365dc" "$TRACE_CFG" | sha256sum --check

      - name: Validate schema and known-answer fixtures
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA="research/mobility-rrvr-runtime-trace/schemas/runtime_projection_v0_1.schema.json"
          INIT="research/mobility-rrvr-runtime-trace/fixtures/runtime_projection_init_v0_1.json"
          TRACE_FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/runtime_projection_reservation_acceptance_v0_1.json"
          RECOVERY_FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/runtime_projection_no_effect_recovery_v0_1.json"
          jq empty "$SCHEMA"
          jq empty "$INIT"
          jq empty "$TRACE_FIXTURE"
          jq empty "$RECOVERY_FIXTURE"
          for FIXTURE in "$INIT" "$TRACE_FIXTURE" "$RECOVERY_FIXTURE"; do
            jq -e '
              all(.snapshots[].owner_evidence[];
                (.raw_artifact_sha256 | test("^[a-fA-F0-9]{64}$")))
            ' "$FIXTURE"
          done
          jq -e '
            .version == "0.1"
            and .header.model_source_sha256 == "fb2117728e195f9ae5f188e75afdf989d42165472c4bcb6a47238ceb07810d81"
            and .header.model_config_sha256 == "e599cffcf0e82887af8ba627470c026da1109a5becc81e9a21c6755919495168"
            and .header.tla_tool_sha256 == "d15655eeaff4b3f7b3d65c46b838bc0f35d131b2ef4b1e473689b62c98d4726f"
            and (.snapshots | length == 4)
            and all(.snapshots[]; (.state_s | keys | length == 43))
            and all(.snapshots[]; (.owner_evidence | length == 10))
            and all(.snapshots[]; ([.owner_evidence[].domain] | unique | length == 10))
            and .snapshots[0].model_action == null
            and .snapshots[1].model_action == "ReserveAttempt"
            and .snapshots[2].model_action == "MarkDispatchStarted"
            and .snapshots[3].model_action == "NativeAcceptOld"
            and .snapshots[3].state_s.commandPending == true
            and .snapshots[3].state_s.commandOwnerAttempt == "attempt-1"
          ' "$TRACE_FIXTURE"
          jq -e '
            .version == "0.1"
            and .header.model_source_sha256 == "fb2117728e195f9ae5f188e75afdf989d42165472c4bcb6a47238ceb07810d81"
            and .header.model_config_sha256 == "e599cffcf0e82887af8ba627470c026da1109a5becc81e9a21c6755919495168"
            and .header.tla_tool_sha256 == "d15655eeaff4b3f7b3d65c46b838bc0f35d131b2ef4b1e473689b62c98d4726f"
            and (.snapshots | length == 17)
            and all(.snapshots[]; (.state_s | keys | length == 43))
            and all(.snapshots[]; (.owner_evidence | length == 10))
            and .snapshots[4].model_action == "OldDeviceDoesNotApply"
            and .snapshots[7].model_action == "AcknowledgeStoreNoCommit"
            and .snapshots[10].model_action == "FenceControllerQueue"
            and .snapshots[11].model_action == "FenceDownstreamExecution"
            and .snapshots[12].model_action == "ObserveOldEffect"
            and .snapshots[14].model_action == "IssueRecoveryPermit"
            and .snapshots[15].model_action == "CreateFreshTicket"
            and .snapshots[16].model_action == "NativeAcceptRecovery"
            and .snapshots[-1].state_s.recoveryPermit == "consumed"
            and .snapshots[-1].state_s.permitUseCount == 1
            and .snapshots[-1].state_s.downstreamFenceBootEpoch == 0
            and .snapshots[-1].state_s.admittedDownstreamFence == true
            and .snapshots[-1].state_s.commandOwnerAttempt == "attempt-2"
            and ([.snapshots[-1].owner_evidence[]
                  | select(.domain == "physical_outcome_observer_quorum" or .domain == "downstream_observer_quorum")
                  | .status] | all(. == "quorum_qualified"))
          ' "$RECOVERY_FIXTURE"

      - name: Compare Rust and JSON Schema fields with pinned TLA Init
        shell: bash
        run: |
          set -euo pipefail
          MODEL="research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla"
          RUST="research/mobility-rrvr-runtime-trace/src/lib.rs"
          SCHEMA="research/mobility-rrvr-runtime-trace/schemas/runtime_projection_v0_1.schema.json"
          sed -n '/Init ==/,/ReserveAttempt ==/p' "$MODEL" \
            | grep -oE '[A-Za-z][A-Za-z0-9]*[[:space:]]*\|->' \
            | sed -E 's/[[:space:]]*\|->$//' \
            | sort -u > "$RUNNER_TEMP/tla-fields.txt"
          sed -n '/pub const STATE_FIELDS/,/^];/p' "$RUST" \
            | grep -oE '"[A-Za-z][A-Za-z0-9]*"' \
            | tr -d '"' | sort -u > "$RUNNER_TEMP/rust-fields.txt"
          jq -r '.properties.snapshots.items.properties.state_s.required[]' "$SCHEMA" \
            | sort -u > "$RUNNER_TEMP/schema-fields.txt"
          diff -u "$RUNNER_TEMP/tla-fields.txt" "$RUNNER_TEMP/rust-fields.txt"
          diff -u "$RUNNER_TEMP/tla-fields.txt" "$RUNNER_TEMP/schema-fields.txt"
          test "$(wc -l < "$RUNNER_TEMP/tla-fields.txt" | tr -d ' ')" -eq 43

      - name: Validate multi-attempt lineage fixture and schema
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA="research/mobility-rrvr-runtime-trace/schemas/attempt_lineage_v0_1.schema.json"
          FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/attempt_lineage_three_attempts_v0_1.json"
          jq empty "$SCHEMA"
          jq empty "$FIXTURE"
          jq -e '
            .version == "0.1"
            and (.logical_effect_id | length > 0)
            and (.attempts | length == 3)
            and .fault_profile_revision == "rrvr-lineage-fault-model-v0.1"
            and ([.attempts[].ordinal] == [1, 2, 3])
            and .attempts[0].observer_assurance.physical_outcome.asserted_value == "no_effect"
            and .attempts[0].observer_assurance.downstream_quiescence.asserted_value == "quiescent"
            and .attempts[1].observer_assurance.physical_outcome.asserted_value == "no_effect"
            and .attempts[1].observer_assurance.downstream_quiescence.asserted_value == "quiescent"
            and .attempts[0].observer_assurance.physical_outcome.observer_quorum.fault_model_revision == .fault_profile_revision
            and .attempts[0].observer_assurance.downstream_quiescence.observer_quorum.fault_model_revision == .fault_profile_revision
            and .attempts[1].observer_assurance.physical_outcome.observer_quorum.fault_model_revision == .fault_profile_revision
            and .attempts[1].observer_assurance.downstream_quiescence.observer_quorum.fault_model_revision == .fault_profile_revision
            and (.attempts[0].observer_assurance.physical_outcome.observer_quorum.members | length == 2)
            and (.attempts[0].observer_assurance.downstream_quiescence.observer_quorum.members | length == 2)
            and (([.attempts[0].observer_assurance.physical_outcome.observer_quorum.members[].observer_id] + [.attempts[0].observer_assurance.downstream_quiescence.observer_quorum.members[].observer_id] | unique | length) == 4)
            and (([.attempts[0].observer_assurance.physical_outcome.observer_quorum.members[].common_cause_domains[]] + [.attempts[0].observer_assurance.downstream_quiescence.observer_quorum.members[].common_cause_domains[]] | unique | length) == 12)
            and (([.attempts[1].observer_assurance.physical_outcome.observer_quorum.members[].observer_id] + [.attempts[1].observer_assurance.downstream_quiescence.observer_quorum.members[].observer_id] | unique | length) == 4)
            and (([.attempts[1].observer_assurance.physical_outcome.observer_quorum.members[].common_cause_domains[]] + [.attempts[1].observer_assurance.downstream_quiescence.observer_quorum.members[].common_cause_domains[]] | unique | length) == 12)
            and .attempts[2].observer_assurance.physical_outcome.asserted_value == "applied"
            and .attempts[2].observer_assurance.physical_outcome.observer_quorum.fault_model_revision == .fault_profile_revision
            and (.attempts[2].observer_assurance.physical_outcome.observer_quorum.members | length == 2)
            and .attempts[2].observer_assurance.downstream_quiescence == null
            and .attempts[0].parent_attempt_id == null
            and .attempts[1].parent_attempt_id == .attempts[0].attempt_id
            and .attempts[2].parent_attempt_id == .attempts[1].attempt_id
            and .attempts[0].physical_outcome.outcome == "no_effect"
            and .attempts[1].physical_outcome.outcome == "no_effect"
            and .attempts[2].physical_outcome.outcome == "applied"
            and .attempts[0].persistence.receipt.domain == "persistence"
            and .attempts[0].persistence.receipt.asserted_value == .attempts[0].persistence.outcome
            and .attempts[0].persistence.receipt.status == "confirmed"
            and .attempts[0].physical_outcome.receipt.domain == "physical_outcome"
            and .attempts[0].physical_outcome.receipt.asserted_value == .attempts[0].physical_outcome.outcome
            and .attempts[0].physical_outcome.receipt.status == "confirmed"
            and .attempts[0].mission_resolution.receipt.domain == "mission_resolution"
            and .attempts[0].mission_resolution.receipt.asserted_value == .attempts[0].mission_resolution.outcome
            and .attempts[0].mission_resolution.receipt.status == "confirmed"
            and .attempts[0].controller_queue_fence.receipt.domain == "controller_queue"
            and .attempts[0].controller_queue_fence.receipt.asserted_value == "quiescent;target_boot_epoch=2;target_controller_epoch=2"
            and .attempts[0].controller_queue_fence.receipt.status == "confirmed"
            and .attempts[0].downstream_quiescence.receipt.domain == "downstream_execution_graph"
            and .attempts[0].downstream_quiescence.receipt.asserted_value == "quiescent;target_boot_epoch=2;target_controller_epoch=2"
            and .attempts[0].downstream_quiescence.receipt.status == "confirmed"
            and .attempts[1].controller_queue_fence.receipt.asserted_value == "quiescent;target_boot_epoch=3;target_controller_epoch=3"
            and .attempts[1].downstream_quiescence.receipt.asserted_value == "quiescent;target_boot_epoch=3;target_controller_epoch=3"
            and .attempts[2].physical_outcome.receipt.asserted_value == "applied"
            and .attempts[0].controller_queue_fence.target_epoch == .attempts[1].authorized_epoch
            and .attempts[0].downstream_quiescence.target_epoch == .attempts[1].authorized_epoch
            and .attempts[1].controller_queue_fence.target_epoch == .attempts[2].authorized_epoch
            and .attempts[1].downstream_quiescence.target_epoch == .attempts[2].authorized_epoch
            and ([.. | objects | select(has("raw_artifact_sha256")) | .raw_artifact_sha256] | all(type == "string" and test("^[a-fA-F0-9]{64}$")))
          ' "$FIXTURE"
      - name: Validate paired RRVR fault campaign manifest and schema
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA="research/mobility-rrvr-runtime-trace/schemas/fault_campaign_v0_1.schema.json"
          FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/fault_campaign_paired_v0_1.json"
          jq empty "$SCHEMA"
          jq empty "$FIXTURE"
          jq -e '
            .version == "0.1"
            and (.campaign_id | length > 0)
            and (.fault_model_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.profile_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.environment_artifact_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.simulation_interfaces_revision | length > 0)
            and (.platform.scene_broadcaster_id == "gz::sim::systems::SceneBroadcaster")
            and (.platform.scene_broadcaster_revision | length > 0)
            and (.platform.scene_broadcaster_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.fault_injector_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.fault_injector_id | length > 0)
            and (.platform.fault_injector_fault_domain_id | length > 0)
            and (.platform.fault_injector_revision | length > 0)
            and (.platform.native_adapter_id | length > 0)
            and (.platform.native_adapter_revision | length > 0)
            and (.reset.profile_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.reset.expected_initial_state_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.scenarios | length == 4)
            and ([.scenarios[].pair_id] | unique | length == 2)
            and ([.scenarios[] | select(.arm == "full_rrvr" and .control_class == "positive" and .expected_disposition == "admit")] | length == 1)
            and ([.scenarios[] | select(.arm == "full_rrvr" and (.control_class == "negative" or .control_class == "mutation") and (.expected_disposition == "hold" or .expected_disposition == "block"))] | length == 1)
            and ([.scenarios[] | select(.arm == "last_attempt_only" and .expected_disposition == "measure")] | length == 2)
            and ([.scenarios[].faults[]] | length == 8)
            and ([.scenarios[].faults[].parameters_sha256] | map(test("^[a-fA-F0-9]{64}$")) | all)
            and ([.scenarios[].faults[].target_profile_sha256] | map(test("^[a-fA-F0-9]{64}$")) | all)
            and ([.scenarios[].faults[].expected_delivery_signature_sha256] | map(test("^[a-fA-F0-9]{64}$")) | all)
            and ([.scenarios[].faults[].target_revision] | map(length > 0) | all)
            and ([.scenarios[].faults[].scheduled_simulation_step] | length == 8)
          ' "$FIXTURE"

      - name: Check formatting
        run: cargo fmt --manifest-path research/mobility-rrvr-runtime-trace/Cargo.toml -- --check

      - name: Run runtime projection tests
        run: cargo test --manifest-path research/mobility-rrvr-runtime-trace/Cargo.toml --locked

      - name: Run paired RRVR campaign validator positive control
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/fault_campaign_paired_v0_1.json"
          REPORT="$RUNNER_TEMP/rrvr-campaign-summary.json"
          cargo run --locked --manifest-path research/mobility-rrvr-runtime-trace/Cargo.toml --bin rrvr_campaign_validate -- "$FIXTURE" "$REPORT"
          jq -e '
            .validation == "passed"
            and .scenario_count == 4
            and .pair_count == 2
            and .positive_control_count == 2
            and .negative_control_count == 2
            and .fault_injection_count == 8
            and .full_rrvr_positive_count == 1
            and .full_rrvr_negative_count == 1
            and .coverage_complete == true
            and (.fault_injector_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.native_adapter_revision | length > 0)
            and .fault_injection_executed == false
            and .platform_inventory_authenticated == false
            and .owner_evidence_authenticated == false
            and .physical_safety_established == false
            and .tla_refinement_checked == false
          ' "$REPORT"

      - name: Run multi-attempt lineage CLI positive control
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/attempt_lineage_three_attempts_v0_1.json"
          REPORT="$RUNNER_TEMP/rrvr-attempt-lineage-summary.json"
          cargo run --locked --manifest-path research/mobility-rrvr-runtime-trace/Cargo.toml --bin rrvr_attempt_lineage -- "$FIXTURE" "$REPORT"
          jq -e '
            .validation == "passed"
            and .attempt_count == 3
            and .recovery_edge_count == 2
            and .applied_attempt_count == 1
            and .head_attempt_id == "attempt-3"
            and .head_physical_outcome == "applied"
            and .head_outcome_verdict == "confirmed"
            and .head_physical_observer_quorum_qualified == true
            and .owner_authentication == "not_performed"
            and .evidence_completeness == "not_established"
            and .tla_refinement == "not_checked"
            and .physical_safety == "not_established"
            and .native_action_authority == "not_created"
          ' "$REPORT"

      - name: Compile, deterministically replay and verify the RRVR campaign plan
        id: compiled_plan
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/mobility-rrvr-runtime-trace"
          SOURCE="$ROOT/fixtures/fault_campaign_paired_v0_1.json"
          SCHEMA="$ROOT/schemas/compiled_campaign_plan_v0_1.schema.json"
          PLAN_A="$RUNNER_TEMP/rrvr-campaign-plan-a.json"
          PLAN_B="$RUNNER_TEMP/rrvr-campaign-plan-b.json"
          REPORT="$RUNNER_TEMP/rrvr-campaign-plan-report.json"
          VERIFY_REPORT="$RUNNER_TEMP/rrvr-campaign-plan-verify.json"
          TAMPERED="$RUNNER_TEMP/rrvr-campaign-plan-tampered.json"

          jq empty "$SCHEMA"
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_campaign_compile -- "$SOURCE" "$PLAN_A" "$REPORT" > "$RUNNER_TEMP/rrvr-campaign-compile.stdout"
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_campaign_compile -- "$SOURCE" "$PLAN_B" > /dev/null
          cmp "$PLAN_A" "$PLAN_B"

          jq -e '
            .version == "0.1"
            and .canonicalization == "serde-json-value-sorted-keys-v0.1"
            and (.source_manifest_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.plan_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.fault_model_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.profile_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.environment_artifact_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.fault_injector_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.platform.native_adapter_revision | length > 0)
            and (.platform.runtime_monitor_revision | length > 0)
            and (.scenarios | length == 4)
            and (.pairs | length == 2)
            and ([.scenarios[].schedule_sha256] | map(test("^[a-fA-F0-9]{64}$")) | all)
            and ([.pairs[].pair_commitment_sha256] | map(test("^[a-fA-F0-9]{64}$")) | all)
            and ([.scenarios | group_by(.pair_id)[] | ([.[].pair_commitment_sha256] | unique | length == 1)] | all)
            and ([.scenarios[].fault_events | to_entries[] | .value.sequence == (.key + 1)] | all)
          ' "$PLAN_A"

          EXPECTED_PLAN_SHA=$(jq -r '.plan_sha256' "$REPORT")
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_campaign_verify -- "$PLAN_A" "$SOURCE" "$EXPECTED_PLAN_SHA" "$VERIFY_REPORT" > /dev/null
          EXPECTED_SOURCE_SHA=$(sha256sum "$SOURCE" | cut -d ' ' -f 1)
          PLAN_ARTIFACT_SHA=$(sha256sum "$PLAN_A" | cut -d ' ' -f 1)
          jq -e --arg source_sha "$EXPECTED_SOURCE_SHA" --arg artifact_sha "$PLAN_ARTIFACT_SHA" '
            .validation == "passed"
            and .source_manifest_binding == true
            and .canonical_encoding == true
            and .nested_pair_and_schedule_commitments == true
            and .external_expected_digest_match == true
            and .source_manifest_sha256 == $source_sha
            and .compiled_plan_artifact_sha256 == $artifact_sha
            and .fault_injection_executed == false
            and .native_authority_created == false
            and .platform_inventory_authenticated == false
            and .physical_safety_established == false
          ' "$VERIFY_REPORT"

          jq '.scenarios[0].fault_events[0].kind = "power_loss"' "$PLAN_A" > "$TAMPERED"
          set +e
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_campaign_verify -- "$TAMPERED" "$SOURCE" "$EXPECTED_PLAN_SHA" > "$RUNNER_TEMP/rrvr-campaign-tamper.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Campaign plan verifier accepted a mutated fault event."
            exit 1
          fi
          echo "Expected negative control rejected: tampered compiled plan."

          echo "plan_sha=$EXPECTED_PLAN_SHA" >> "$GITHUB_OUTPUT"
          echo "plan_path=$PLAN_A" >> "$GITHUB_OUTPUT"
          echo "source_sha=$EXPECTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate pinned Gazebo Simulation Interfaces profile
        shell: bash
        env:
          PLAN_PATH: ${{ steps.compiled_plan.outputs.plan_path }}
          PLAN_SHA: ${{ steps.compiled_plan.outputs.plan_sha }}
        run: |
          set -euo pipefail
          ROOT="research/mobility-rrvr-runtime-trace"
          SOURCE="$ROOT/fixtures/fault_campaign_paired_v0_1.json"
          PROFILE="$ROOT/fixtures/gazebo_capabilities_positive_v0_1.json"
          SCHEMA="$ROOT/schemas/gazebo_capability_profile_v0_1.schema.json"
          REPORT="$RUNNER_TEMP/rrvr-gazebo-preflight.json"

          jq empty "$SCHEMA"
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_gazebo_preflight -- "$PLAN_PATH" "$SOURCE" "$PLAN_SHA" "$PROFILE" "$REPORT"
          jq -e '
            .validation == "passed"
            and .preflight_scope == "captured_capability_profile_only"
            and (.simulation_interfaces_revision | length > 0)
            and .scene_broadcaster_id == "gz::sim::systems::SceneBroadcaster"
            and (.scene_broadcaster_sha256 | test("^[a-fA-F0-9]{64}$"))
            and .scene_broadcaster_loaded == true
            and .selected_stepping_method == "step_simulation_service"
            and .live_simulator_discovery_performed == false
            and .simulator_mutation_performed == false
            and .fault_injection_executed == false
            and .execution_receipts_emitted == false
            and .native_authority_created == false
            and .physical_safety_established == false
          ' "$REPORT"

      - name: Validate plan-bound fault execution evidence and uncertainty controls
        shell: bash
        env:
          PLAN_PATH: ${{ steps.compiled_plan.outputs.plan_path }}
          PLAN_SHA: ${{ steps.compiled_plan.outputs.plan_sha }}
          SOURCE_SHA: ${{ steps.compiled_plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          ROOT="research/mobility-rrvr-runtime-trace"
          SOURCE="$ROOT/fixtures/fault_campaign_paired_v0_1.json"
          SCHEMA="$ROOT/schemas/execution_evidence_bundle_v0_1.schema.json"
          FIXTURE="$ROOT/fixtures/execution_evidence_positive_v0_1.json"
          BUNDLE="$RUNNER_TEMP/rrvr-execution-evidence.json"
          REPORT="$RUNNER_TEMP/rrvr-execution-evidence-report.json"
          DISPATCH_ONLY="$RUNNER_TEMP/rrvr-dispatch-only.json"
          UNKNOWN="$RUNNER_TEMP/rrvr-unknown-dispatch.json"
          TAMPERED="$RUNNER_TEMP/rrvr-tampered-delivery-signature.json"

          jq empty "$SCHEMA"
          jq --arg plan "$PLAN_SHA" --arg source "$SOURCE_SHA" '
            .plan_sha256 = $plan
            | .source_manifest_sha256 = $source
          ' "$FIXTURE" > "$BUNDLE"

          jq -e '
            .version == "0.1"
            and (.plan_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.source_manifest_sha256 | test("^[a-fA-F0-9]{64}$"))
            and (.events | length == 4)
            and ([.events[].dispatch.status] | all(. == "accepted"))
            and ([.events[].execution.status] | all(. == "executed"))
            and ([.events[].delivery_observation.verdict] | all(. == "confirmed"))
            and ([.events[].planned_fault.expected_delivery_signature_sha256] == [.events[].delivery_observation.observed_fault_signature_sha256])
            and ([.events[].target_resolution.receipt.evidence_id, .events[].dispatch.receipt.evidence_id, .events[].execution.receipt.evidence_id, .events[].delivery_observation.receipt.evidence_id] | length == 16)
          ' "$BUNDLE"

          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_execution_validate -- "$PLAN_PATH" "$SOURCE" "$PLAN_SHA" "$BUNDLE" "$REPORT"
          jq -e '
            .validation == "passed"
            and .planned_fault_count == 4
            and .dispatch_accepted_count == 4
            and .executed_count == 4
            and .delivery_confirmed_count == 4
            and .reconcile_required == false
            and .retry_permitted == false
            and .native_authority_created == false
            and .producer_authentication_performed == false
            and .physical_observer_independence_proven == false
            and .physical_safety_established == false
          ' "$REPORT"

          jq '
            .events[0].execution.status = "unknown"
            | .events[0].execution.receipt = null
            | .events[0].delivery_observation.verdict = "unknown"
            | .events[0].delivery_observation.observer_id = null
            | .events[0].delivery_observation.observer_revision = null
            | .events[0].delivery_observation.observer_fault_domain_id = null
            | .events[0].delivery_observation.observed_fault_signature_sha256 = null
            | .events[0].delivery_observation.receipt = null
          ' "$BUNDLE" > "$DISPATCH_ONLY"
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_execution_validate -- "$PLAN_PATH" "$SOURCE" "$PLAN_SHA" "$DISPATCH_ONLY" "$RUNNER_TEMP/rrvr-dispatch-only-report.json" > /dev/null
          jq -e '
            .dispatch_accepted_count == 4
            and .executed_count == 3
            and .delivery_confirmed_count == 3
            and .reconcile_required == true
            and .retry_permitted == false
          ' "$RUNNER_TEMP/rrvr-dispatch-only-report.json"

          jq '
            .events[1].dispatch.status = "unknown"
            | .events[1].dispatch.receipt = null
            | .events[1].execution.status = "unknown"
            | .events[1].execution.receipt = null
            | .events[1].delivery_observation.verdict = "unknown"
            | .events[1].delivery_observation.observer_id = null
            | .events[1].delivery_observation.observer_revision = null
            | .events[1].delivery_observation.observer_fault_domain_id = null
            | .events[1].delivery_observation.observed_fault_signature_sha256 = null
            | .events[1].delivery_observation.receipt = null
          ' "$BUNDLE" > "$UNKNOWN"
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_execution_validate -- "$PLAN_PATH" "$SOURCE" "$PLAN_SHA" "$UNKNOWN" "$RUNNER_TEMP/rrvr-unknown-report.json" > /dev/null
          jq -e '
            .dispatch_unknown_count == 1
            and .execution_unknown_count == 1
            and .delivery_unknown_count == 1
            and .reconcile_required == true
            and .retry_permitted == false
          ' "$RUNNER_TEMP/rrvr-unknown-report.json"

          jq '.events[0].delivery_observation.observed_fault_signature_sha256 = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"' "$BUNDLE" > "$TAMPERED"
          set +e
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_execution_validate -- "$PLAN_PATH" "$SOURCE" "$PLAN_SHA" "$TAMPERED" > "$RUNNER_TEMP/rrvr-execution-tamper.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Execution evidence validator accepted a mismatched observed fault signature."
            exit 1
          fi
          echo "Expected negative control rejected: delivery signature mismatch."

      - name: Score matched RRVR evidence and recovery benchmark
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/mobility-rrvr-runtime-trace"
          CORPUS="$ROOT/fixtures/benchmark_matched_arms_v0_1.json"
          SCHEMA="$ROOT/schemas/benchmark_corpus_v0_1.schema.json"
          REPORT="$RUNNER_TEMP/rrvr-benchmark-report.json"
          BAD="$RUNNER_TEMP/rrvr-benchmark-unmatched.json"

          jq empty "$SCHEMA"
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_benchmark_score -- "$CORPUS" "$REPORT" > /dev/null
          jq -e '
            .version == "0.1"
            and .matched_pair_count == 2
            and (.arm_summaries | length == 5)
            and (.paired_comparisons | length == 4)
            and ([.arm_summaries[].arm] | sort == ["full_rrvr","logging_only","restart_only","task_only","trace_only"])
            and (.arm_summaries[] | select(.arm == "full_rrvr") |
              .task_success_rate_ppm == 1000000
              and .safety_rate_ppm == 1000000
              and .false_confirmed_count == 1
              and .median_trace_reduction_ppm == 625000)
            and (.arm_summaries[] | select(.arm == "task_only") |
              .safety_scored_count == 2
              and .sbu_rate_all_episodes_ppm == 500000)
          ' "$REPORT"

          jq '.episodes[1].seed = (.episodes[1].seed + 1)' "$CORPUS" > "$BAD"
          set +e
          cargo run --locked --manifest-path "$ROOT/Cargo.toml" --bin rrvr_benchmark_score -- "$BAD" > "$RUNNER_TEMP/rrvr-benchmark-unmatched.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "RRVR benchmark scorer accepted a pair with a changed seed."
            exit 1
          fi
          echo "Expected negative control rejected: unmatched pair inputs."

      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/mobility-rrvr-runtime-trace/Cargo.toml --all-targets --locked -- -D warnings

      - name: Emit Reflow trace and provenance sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rrvr-runtime-projection"
          FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/runtime_projection_reservation_acceptance_v0_1.json"
          TRACE="$RUNNER_TEMP/rrvr-runtime-projection/runtime-trace.ndjson"
          SIDECAR="$RUNNER_TEMP/rrvr-runtime-projection/provenance-sidecar.json"
          MANIFEST="$RUNNER_TEMP/rrvr-runtime-projection/manifest.json"
          cargo run --locked \
            --manifest-path research/mobility-rrvr-runtime-trace/Cargo.toml \
            --bin rrvr_runtime_project -- "$FIXTURE" "$TRACE" "$SIDECAR" > "$MANIFEST"
          jq -e '
            .projection_validation == "passed"
            and .tla_conformance == "not_run"
            and .snapshot_count == 4
            and (.input_sha256 | test("^[a-f0-9]{64}$"))
            and (.trace_sha256 | test("^[a-f0-9]{64}$"))
            and (.sidecar_sha256 | test("^[a-f0-9]{64}$"))
          ' "$MANIFEST"
          test "$(wc -l < "$TRACE" | tr -d ' ')" -eq 4
          jq -e -s '
            length == 4
            and .[0].state.s.stage == "unreserved"
            and .[1].event == "ReserveAttempt"
            and .[1].state.s.stage == "reserved"
            and .[2].event == "MarkDispatchStarted"
            and .[2].state.s.stage == "dispatch_started"
            and .[3].event == "NativeAcceptOld"
            and .[3].state.s.commandPending == true
          ' "$TRACE"
          jq -e '
            .snapshots | length == 4
            and (.[3].owner_evidence | length == 10)
            and (.[0].owner_evidence | map(.domain) | unique | length == 10)
          ' "$SIDECAR"
          cp "$FIXTURE" "$RUNNER_TEMP/rrvr-runtime-projection/input-recording.json"
          (
            cd "$RUNNER_TEMP/rrvr-runtime-projection"
            sha256sum input-recording.json runtime-trace.ndjson provenance-sidecar.json manifest.json > SHA256SUMS
          )

      - name: Emit full no-effect recovery projection
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="research/mobility-rrvr-runtime-trace/fixtures/runtime_projection_no_effect_recovery_v0_1.json"
          TRACE="$RUNNER_TEMP/rrvr-runtime-projection/no-effect-recovery-trace.ndjson"
          SIDECAR="$RUNNER_TEMP/rrvr-runtime-projection/no-effect-recovery-sidecar.json"
          MANIFEST="$RUNNER_TEMP/rrvr-runtime-projection/no-effect-recovery-manifest.json"
          cargo run --locked \
            --manifest-path research/mobility-rrvr-runtime-trace/Cargo.toml \
            --bin rrvr_runtime_project -- "$FIXTURE" "$TRACE" "$SIDECAR" > "$MANIFEST"
          jq -e '
            .projection_validation == "passed"
            and .tla_conformance == "not_run"
            and .snapshot_count == 17
          ' "$MANIFEST"
          test "$(wc -l < "$TRACE" | tr -d ' ')" -eq 17
          jq -e -s '
            length == 17
            and .[12].event == "ObserveOldEffect"
            and .[14].event == "IssueRecoveryPermit"
            and .[15].event == "CreateFreshTicket"
            and .[16].event == "NativeAcceptRecovery"
            and .[16].state.s.recoveryPermit == "consumed"
            and .[16].state.s.permitUseCount == 1
            and .[16].state.s.downstreamFenceBootEpoch == 0
            and .[16].state.s.admittedDownstreamFence == true
          ' "$TRACE"
          jq -e '
            .snapshots | length == 17
            and (.[16].owner_evidence | length == 10)
            and ([.[16].owner_evidence[]
                  | select(.domain == "physical_outcome_observer_quorum" or .domain == "downstream_observer_quorum")
                  | .status] | all(. == "quorum_qualified"))
          ' "$SIDECAR"
          cp "$FIXTURE" "$RUNNER_TEMP/rrvr-runtime-projection/no-effect-recovery-recording.json"
          (
            cd "$RUNNER_TEMP/rrvr-runtime-projection"
            sha256sum no-effect-recovery-recording.json no-effect-recovery-trace.ndjson \
              no-effect-recovery-sidecar.json no-effect-recovery-manifest.json \
              >> SHA256SUMS
          )

      - name: Validate emitted action/state traces with pinned TLC
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla"
          TRACE_SPEC="$GITHUB_WORKSPACE/research/mobility-rrvr-runtime-trace/RestartSafeEffectContinuityTrace.tla"
          TRACE_CFG="$GITHUB_WORKSPACE/research/mobility-rrvr-runtime-trace/RestartSafeEffectContinuityTrace.cfg"
          JAR="$RUNNER_TEMP/tla/tla2tools.jar"
          ROOT="$RUNNER_TEMP/rrvr-runtime-projection"

          run_trace_check() {
            local label="$1"
            local source_trace="$2"
            local work="$ROOT/tla-$label"
            mkdir -p "$work"
            cp "$MODEL" "$work/RestartSafeEffectContinuity.tla"
            cp "$TRACE_SPEC" "$work/RestartSafeEffectContinuityTrace.tla"
            cp "$TRACE_CFG" "$work/RestartSafeEffectContinuityTrace.cfg"
            cp "$source_trace" "$work/rrvr-trace.ndjson"
            (
              cd "$work"
              java -XX:+UseParallelGC -cp "$JAR" tlc2.TLC \
                -workers 1 \
                -metadir "$RUNNER_TEMP/tlc-runtime-$label" \
                -config RestartSafeEffectContinuityTrace.cfg \
                RestartSafeEffectContinuityTrace.tla
            ) | tee "$ROOT/tlc-$label.log"
            grep -Fq "Model checking completed. No error has been found." "$ROOT/tlc-$label.log"
            grep -Fq "0 states left on queue" "$ROOT/tlc-$label.log"
          }

          run_trace_check "reservation" "$ROOT/runtime-trace.ndjson"
          run_trace_check "no-effect-recovery" "$ROOT/no-effect-recovery-trace.ndjson"

      - name: Prove trace validator rejects wrong action labels
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rrvr-runtime-projection"
          MODEL="$GITHUB_WORKSPACE/research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla"
          TRACE_SPEC="$GITHUB_WORKSPACE/research/mobility-rrvr-runtime-trace/RestartSafeEffectContinuityTrace.tla"
          TRACE_CFG="$GITHUB_WORKSPACE/research/mobility-rrvr-runtime-trace/RestartSafeEffectContinuityTrace.cfg"
          JAR="$RUNNER_TEMP/tla/tla2tools.jar"
          WORK="$ROOT/tla-negative-wrong-action"
          mkdir -p "$WORK"
          jq -c -s '
            map(if .event? == "ReserveAttempt"
                then .event = "MarkDispatchStarted"
                else .
                end)
            | .[]
          ' "$ROOT/runtime-trace.ndjson" > "$WORK/rrvr-trace.ndjson"
          jq -s -e '
            length == 4
            and .[1].event == "MarkDispatchStarted"
            and .[1].state.s.stage == "reserved"
          ' "$WORK/rrvr-trace.ndjson"
          cp "$MODEL" "$WORK/RestartSafeEffectContinuity.tla"
          cp "$TRACE_SPEC" "$WORK/RestartSafeEffectContinuityTrace.tla"
          cp "$TRACE_CFG" "$WORK/RestartSafeEffectContinuityTrace.cfg"
          set +e
          (
            cd "$WORK"
            java -XX:+UseParallelGC -cp "$JAR" tlc2.TLC \
              -workers 1 \
              -metadir "$RUNNER_TEMP/tlc-runtime-negative-wrong-action" \
              -config RestartSafeEffectContinuityTrace.cfg \
              RestartSafeEffectContinuityTrace.tla
          ) > "$ROOT/tlc-negative-wrong-action.log" 2>&1
          status=$?
          set -e
          cat "$ROOT/tlc-negative-wrong-action.log"
          if [ "$status" -eq 0 ]; then
            echo "TLC accepted a trace whose named action cannot produce its recorded state."
            exit 1
          fi
          if ! grep -Fq "TraceNotStuck" "$ROOT/tlc-negative-wrong-action.log" \
            || ! grep -Eiq "violat" "$ROOT/tlc-negative-wrong-action.log"; then
            echo "TLC failed for a reason other than the expected TraceNotStuck invariant."
            exit 1
          fi
          echo "Expected negative control rejected: action/state mismatch."

          cp "$TRACE_SPEC" "$ROOT/RestartSafeEffectContinuityTrace.tla"
          cp "$TRACE_CFG" "$ROOT/RestartSafeEffectContinuityTrace.cfg"
          cp "$MODEL" "$ROOT/RestartSafeEffectContinuity.tla"
          cp "$JAR" "$ROOT/tla2tools.jar"
          (
            cd "$ROOT"
            MODEL_SHA=$(sha256sum RestartSafeEffectContinuity.tla | cut -d ' ' -f 1)
            TRACE_SPEC_SHA=$(sha256sum RestartSafeEffectContinuityTrace.tla | cut -d ' ' -f 1)
            TRACE_CFG_SHA=$(sha256sum RestartSafeEffectContinuityTrace.cfg | cut -d ' ' -f 1)
            TLC_JAR_SHA=$(sha256sum tla2tools.jar | cut -d ' ' -f 1)
            RESERVATION_LOG_SHA=$(sha256sum tlc-reservation.log | cut -d ' ' -f 1)
            RECOVERY_LOG_SHA=$(sha256sum tlc-no-effect-recovery.log | cut -d ' ' -f 1)
            NEGATIVE_LOG_SHA=$(sha256sum tlc-negative-wrong-action.log | cut -d ' ' -f 1)
            jq -n \
              --arg model_sha256 "$MODEL_SHA" \
              --arg trace_spec_sha256 "$TRACE_SPEC_SHA" \
              --arg trace_config_sha256 "$TRACE_CFG_SHA" \
              --arg tlc_jar_sha256 "$TLC_JAR_SHA" \
              --arg reservation_log_sha256 "$RESERVATION_LOG_SHA" \
              --arg recovery_log_sha256 "$RECOVERY_LOG_SHA" \
              --arg negative_log_sha256 "$NEGATIVE_LOG_SHA" \
              '{
                schema_version:"0.1",
                tla_conformance:"passed",
                checker:"TLC",
                trace_contract:"named-action plus exact complete successor-state equality",
                valid_traces:{
                  reservation:{result:"passed",snapshots:4,log_sha256:$reservation_log_sha256},
                  no_effect_recovery:{result:"passed",snapshots:17,log_sha256:$recovery_log_sha256}
                },
                negative_control:{
                  mutation:"Rename first recorded ReserveAttempt action to MarkDispatchStarted without changing successor state",
                  expected:"TraceNotStuck violated",
                  result:"rejected",
                  log_sha256:$negative_log_sha256
                },
                pins:{
                  model_sha256:$model_sha256,
                  trace_spec_sha256:$trace_spec_sha256,
                  trace_config_sha256:$trace_config_sha256,
                  tla2tools_jar_sha256:$tlc_jar_sha256
                },
                claim_ceiling:"Recorded state/action traces conform to the pinned TLA abstraction; this does not authenticate source artifacts or prove physical truth."
              }' > formal-conformance-manifest.json
            sha256sum RestartSafeEffectContinuityTrace.tla RestartSafeEffectContinuityTrace.cfg \
              RestartSafeEffectContinuity.tla tla2tools.jar tlc-reservation.log tlc-no-effect-recovery.log \
              tlc-negative-wrong-action.log formal-conformance-manifest.json >> SHA256SUMS
          )

      - name: Upload projection conformance package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rrvr-runtime-projection-${{ github.sha }}
          path: ${{ runner.temp }}/rrvr-runtime-projection/
          if-no-files-found: error
          retention-days: 90
