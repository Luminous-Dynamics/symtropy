name: D1 Format Prerequisite Authority

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: d1-format-prerequisite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/symtropy-d1-format-prerequisite-target
  PRODUCT_BRANCH: design/d1-content-bound-design-revisions-v0.1
  PRODUCT_PARENT: 36797e6a09833da202d97a27a8aa2dc9ecc66e90
  PRODUCT_PARENT_TREE: ca0df84e9041bd7a2f67b6d6aaf73897ccd82511
  PRODUCT_LOCK_BLOB: 9722cc9a91cd8c1ba3194be110798e96d3d3f45b

jobs:
  qualify-and-promote:
    name: Normalize and prove exact D1 formatting prerequisite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact lock-qualified D1 product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          fetch-depth: 0

      - name: Check out exact runner subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact prerequisite subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_PARENT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PRODUCT_PARENT_TREE"
          test "$(git -C product hash-object Cargo.lock)" = "$PRODUCT_LOCK_BLOB"
          test "$(git -C runner-tools rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C runner-tools status --porcelain=v1 --untracked-files=all)"
          echo "D1_FORMAT_PARENT_HEAD=$(git -C product rev-parse HEAD)"
          echo "D1_FORMAT_PARENT_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "D1_FORMAT_RUNNER_HEAD=$(git -C runner-tools rev-parse HEAD)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Record exact formatter and compiler identity
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Prove lock-qualified package shape before formatting
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo metadata --locked --format-version 1 > /tmp/d1-format-parent-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('/tmp/d1-format-parent-metadata.json').read_text())
          packages = [p for p in metadata['packages'] if p['name'] == 'symtropy-design']
          assert len(packages) == 1, packages
          package = packages[0]
          assert package['version'] == '0.1.0', package['version']
          dependencies = sorted(dep['name'] for dep in package['dependencies'])
          assert dependencies == ['serde', 'serde_json', 'sha2', 'symtropy-game-state'], dependencies
          print('D1_FORMAT_PACKAGE=symtropy-design@0.1.0')
          print('D1_FORMAT_DEPENDENCIES=' + ','.join(dependencies))
          PY
          test "$(git hash-object Cargo.lock)" = "$PRODUCT_LOCK_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze dependency and manifest bytes
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cp Cargo.lock /tmp/d1-format-Cargo.lock.before
          cp Cargo.toml /tmp/d1-format-root-Cargo.toml.before
          cp crates/domains/symtropy-design/Cargo.toml /tmp/d1-format-crate-Cargo.toml.before
          git hash-object Cargo.toml
          git hash-object crates/domains/symtropy-design/Cargo.toml

      - name: Apply only pinned rustfmt normalization
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-design
          test "$(git status --porcelain=v1 --untracked-files=all)" = ' M crates/domains/symtropy-design/src/lib.rs'
          cmp Cargo.lock /tmp/d1-format-Cargo.lock.before
          cmp Cargo.toml /tmp/d1-format-root-Cargo.toml.before
          cmp crates/domains/symtropy-design/Cargo.toml /tmp/d1-format-crate-Cargo.toml.before
          git diff --check
          git diff -- crates/domains/symtropy-design/src/lib.rs

      - name: Re-prove formatted D1 without semantic edits
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-design -- --check
          cargo check --locked -p symtropy-design --all-targets
          cargo test --locked -p symtropy-design
          cargo clippy --locked -p symtropy-design --all-targets -- -D warnings
          cmp Cargo.lock /tmp/d1-format-Cargo.lock.before
          cmp Cargo.toml /tmp/d1-format-root-Cargo.toml.before
          cmp crates/domains/symtropy-design/Cargo.toml /tmp/d1-format-crate-Cargo.toml.before
          test "$(git status --porcelain=v1 --untracked-files=all)" = ' M crates/domains/symtropy-design/src/lib.rs'

      - name: Commit exact one-file style subject
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_PARENT"
          git config user.name "luminous-qualification-bot"
          git config user.email "qualification@luminous.invalid"
          git add crates/domains/symtropy-design/src/lib.rs
          test "$(git diff --cached --name-only)" = 'crates/domains/symtropy-design/src/lib.rs'
          test -z "$(git diff --name-only)"
          git commit -m "style(design): normalize D1 under Rust 1.96 rustfmt"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'crates/domains/symtropy-design/src/lib.rs'
          echo "D1_FORMAT_QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "D1_FORMAT_QUALIFIED_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse branch race and promote exact formatted parent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$PRODUCT_PARENT"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "D1_FORMAT_PROMOTED_HEAD=$(git rev-parse HEAD)"
