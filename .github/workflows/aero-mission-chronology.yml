name: aero-mission-chronology

on:
  pull_request:
    paths:
      - "tools/civil-aero-benchmark/schemas/mission-timeline.schema.json"
      - "tools/civil-aero-benchmark/schemas/aircraft-phase-state.schema.json"
      - "tools/civil-aero-benchmark/schemas/phase-energy-balance.schema.json"
      - "tools/civil-aero-benchmark/schemas/phase-energy-balance-v0.2.schema.json"
      - "tools/civil-aero-benchmark/schemas/phase-energy-balance-v0.3.schema.json"
      - "tools/civil-aero-benchmark/data/mission/**"
      - "tools/civil-aero-benchmark/data/mission/phase_energy_planes_fixtures_v0_2.json"
      - "tools/civil-aero-benchmark/data/mission/phase_energy_planes_fixtures_v0_3.json"
      - "tools/civil-aero-benchmark/scripts/verify-mission-chronology.py"
      - "tools/civil-aero-benchmark/scripts/verify-phase-energy-planes.py"
      - "tools/civil-aero-benchmark/scripts/verify-phase-energy-planes-v0.3.py"
      - "tools/civil-aero-benchmark/PHASE_ENERGY_PLANES_V0_3.md"
      - ".github/workflows/aero-mission-chronology.yml"
  push:
    paths:
      - "tools/civil-aero-benchmark/schemas/mission-timeline.schema.json"
      - "tools/civil-aero-benchmark/schemas/aircraft-phase-state.schema.json"
      - "tools/civil-aero-benchmark/schemas/phase-energy-balance.schema.json"
      - "tools/civil-aero-benchmark/schemas/phase-energy-balance-v0.2.schema.json"
      - "tools/civil-aero-benchmark/schemas/phase-energy-balance-v0.3.schema.json"
      - "tools/civil-aero-benchmark/data/mission/**"
      - "tools/civil-aero-benchmark/data/mission/phase_energy_planes_fixtures_v0_2.json"
      - "tools/civil-aero-benchmark/data/mission/phase_energy_planes_fixtures_v0_3.json"
      - "tools/civil-aero-benchmark/scripts/verify-mission-chronology.py"
      - "tools/civil-aero-benchmark/scripts/verify-phase-energy-planes.py"
      - "tools/civil-aero-benchmark/scripts/verify-phase-energy-planes-v0.3.py"
      - "tools/civil-aero-benchmark/PHASE_ENERGY_PLANES_V0_3.md"
      - ".github/workflows/aero-mission-chronology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aero-mission-chronology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse contract schemas and fixture
        run: |
          set -euo pipefail
          python3 -m json.tool tools/civil-aero-benchmark/schemas/mission-timeline.schema.json >/dev/null
          python3 -m json.tool tools/civil-aero-benchmark/schemas/aircraft-phase-state.schema.json >/dev/null
          python3 -m json.tool tools/civil-aero-benchmark/schemas/phase-energy-balance.schema.json >/dev/null
          python3 -m json.tool tools/civil-aero-benchmark/data/mission/mission_chronology_fixture_v0_1.json >/dev/null
          python3 -m json.tool tools/civil-aero-benchmark/schemas/phase-energy-balance-v0.2.schema.json >/dev/null
          python3 -m json.tool tools/civil-aero-benchmark/schemas/phase-energy-balance-v0.3.schema.json >/dev/null
          python3 -m json.tool tools/civil-aero-benchmark/data/mission/phase_energy_planes_fixtures_v0_2.json >/dev/null
          python3 -m json.tool tools/civil-aero-benchmark/data/mission/phase_energy_planes_fixtures_v0_3.json >/dev/null
          test -s tools/civil-aero-benchmark/PHASE_ENERGY_PLANES_V0_3.md

      - name: Independent phase, mass-state, energy and hostile-control oracle
        run: python3 tools/civil-aero-benchmark/scripts/verify-mission-chronology.py

      - name: Independent carrier-aware energy-plane oracle and hostile controls
        run: python3 tools/civil-aero-benchmark/scripts/verify-phase-energy-planes.py

      - name: Independent v0.3 direct-drive and fuel-cell topology oracle
        run: python3 tools/civil-aero-benchmark/scripts/verify-phase-energy-planes-v0.3.py
