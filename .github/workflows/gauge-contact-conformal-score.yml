name: GAUGE Contact Conformal Pose Score

on:
  pull_request:
    paths:
      - 'research/gauge-contact-conformal-score-v0/**'
      - 'research/loco-episode-conformal-v0/**'
      - '.github/workflows/gauge-contact-conformal-score.yml'
  push:
    branches: [main]
    paths:
      - 'research/gauge-contact-conformal-score-v0/**'
      - 'research/loco-episode-conformal-v0/**'
      - '.github/workflows/gauge-contact-conformal-score.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauge-contact-conformal-score-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/gauge-contact-conformal-score-v0/Cargo.toml -- --check
      - name: Run score adapter tests
        run: cargo test --offline --manifest-path research/gauge-contact-conformal-score-v0/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --offline --manifest-path research/gauge-contact-conformal-score-v0/Cargo.toml --all-targets --locked -- -D warnings
