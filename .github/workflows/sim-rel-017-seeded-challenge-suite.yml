name: SIM-REL-017 Seeded Scientific Challenge Suite

on:
  push:
    branches: ["research/sim-rel-017-*"]
    paths:
      - "tools/sim-rel-joint-stochastic-oracle/**"
      - ".github/workflows/sim-rel-017-seeded-challenge-suite.yml"
  pull_request:
    branches: ["main", "research/sim-rel-016-robust-joint-policy-dp"]
    paths:
      - "tools/sim-rel-joint-stochastic-oracle/**"
      - ".github/workflows/sim-rel-017-seeded-challenge-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: seeded challenge determinism and intervention-sequence controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-017-challenge-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format the new benchmark module
        run: rustfmt --edition 2024 --check tools/sim-rel-joint-stochastic-oracle/src/benchmark.rs
      - name: Unit, seeded replay, and optimizer tests
        run: cargo test --locked --manifest-path tools/sim-rel-joint-stochastic-oracle/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-joint-stochastic-oracle/Cargo.toml --lib -- -D warnings
      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD: \${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
