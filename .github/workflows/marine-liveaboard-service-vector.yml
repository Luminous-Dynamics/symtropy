name: Marine Liveaboard Service Vector Audit

on:
  pull_request:
    paths:
      - "tools/marine-liveaboard-service-vector/**"
      - ".github/workflows/marine-liveaboard-service-vector.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marine-liveaboard-service-vector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-vector-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/marine-liveaboard-service-vector/Cargo.toml -- --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/marine-liveaboard-service-vector/Cargo.toml --all-targets -- -D warnings

      - name: Run semantic and negative-control tests
        run: cargo test --manifest-path tools/marine-liveaboard-service-vector/Cargo.toml

      - name: Validate strict schema and synthetic fixture roster
        run: |
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and .properties.service_floor_contract.minItems == 10 and .properties.service_floor_contract.maxItems == 10 and .properties.policies.minItems >= 3 and .properties.policies.items.properties.role.enum | index("authorized_soft_relaxation") != null' tools/marine-liveaboard-service-vector/schema/marine-liveaboard-service-vector.schema.json
          jq -e '.record_status == "synthetic" and .claim_ceiling == "non_compensatory_service_vector_comparison_only" and (.service_floor_contract | length == 10) and (.policies | length == 3) and ([.policies[].role] | sort) == ["integrated_candidate","weather_blind_reference","weather_informed_resource_blind"] and (.policies[0].resource_metrics | length == 10)' tools/marine-liveaboard-service-vector/fixtures/synthetic-liveaboard-service-vector-0001.json

      - name: Audit vector and require Pareto rather than scalar output
        run: |
          cargo run --quiet --manifest-path tools/marine-liveaboard-service-vector/Cargo.toml -- audit-service-vector tools/marine-liveaboard-service-vector/fixtures/synthetic-liveaboard-service-vector-0001.json > /tmp/liveaboard-service-vector.json
          jq -e '.disposition == "SYNTHETIC_ONLY" and .policy_count == 3 and .pareto_comparison.incomparable == true and .pareto_comparison.aggregate_scalar_score == "NOT_COMPUTED" and ([.policies[] | select(.role == "integrated_candidate") | .feasible] | . == [true])' /tmp/liveaboard-service-vector.json
