name: environmental-window-evaluator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/environmental-window-evaluator/**"
      - ".github/workflows/environmental-window-evaluator.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/environmental-window-evaluator/**"
      - ".github/workflows/environmental-window-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environmental-window-evaluator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/environmental-window-evaluator/Cargo.toml -- --check
      - name: Test deterministic reference evaluator
        run: cargo test --locked --manifest-path benchmarks/environmental-window-evaluator/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path benchmarks/environmental-window-evaluator/Cargo.toml --all-targets -- -D warnings
