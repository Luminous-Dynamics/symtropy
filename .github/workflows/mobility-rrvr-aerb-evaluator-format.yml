name: Format RRVR AERB Evaluator v0.1

on:
  push:
    branches:
      - research/mobility-rrvr-aerb-v0-1
      - research/mobility-rrvr-aerb-probe-value-v0-1
    paths:
      - "research/mobility-rrvr-aerb-v0.1/evaluator/**"
      - ".github/workflows/mobility-rrvr-aerb-evaluator-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Format only the AERB evaluator package
        run: cargo fmt --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml

      - name: Commit formatting-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mobility-rrvr-aerb-v0.1/evaluator
          if ! git diff --cached --quiet; then
            git commit -m "style(rrvr): format AERB evaluator package"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
