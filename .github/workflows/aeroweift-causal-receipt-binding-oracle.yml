name: AeroWeft Causal Receipt Binding Oracle

on:
  pull_request:
    paths:
      - "tools/aeroweift-causal-receipt-binding/**"
      - "docs/research/aviation/AEROWEFT_CAUSAL_RECEIPT_BINDING_001.md"
      - "fixtures/aeroweift-causal-receipt-binding/**"
      - ".github/workflows/aeroweift-causal-receipt-binding-oracle.yml"
  push:
    branches:
      - "research/aeroweFt-causal-receipt-binding-001"
    paths:
      - "tools/aeroweift-causal-receipt-binding/**"
      - "docs/research/aviation/AEROWEFT_CAUSAL_RECEIPT_BINDING_001.md"
      - "fixtures/aeroweift-causal-receipt-binding/**"
      - ".github/workflows/aeroweift-causal-receipt-binding-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeroweift-causal-receipt-binding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/aeroweift-causal-receipt-binding/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/aeroweift-causal-receipt-binding/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/aeroweift-causal-receipt-binding/Cargo.toml --all-targets
