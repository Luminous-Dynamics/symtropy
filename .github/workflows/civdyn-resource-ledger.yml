name: CivDyn resource ledger

on:
  pull_request:
    paths:
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-resource-ledger.yml"
  push:
    paths:
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-resource-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, check and test standalone CivDyn crate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-resource-ledger/Cargo.toml --all -- --check

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-resource-ledger/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-resource-ledger/Cargo.toml --all-targets
