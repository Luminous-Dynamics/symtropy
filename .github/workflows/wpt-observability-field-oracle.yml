name: WPT Observability Field Oracle

on:
  push:
    branches: ["main"]
    paths:
      - "research/wpt-observability-field-v0/**"
      - "tools/wpt-observability-field-oracle/**"
      - ".github/workflows/wpt-observability-field-oracle.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/wpt-observability-field-v0/**"
      - "tools/wpt-observability-field-oracle/**"
      - ".github/workflows/wpt-observability-field-oracle.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test synthetic field-design oracle
        run: cargo test --locked --manifest-path tools/wpt-observability-field-oracle/Cargo.toml
      - name: Score frozen synthetic field candidates
        run: cargo run --locked --manifest-path tools/wpt-observability-field-oracle/Cargo.toml -- research/wpt-observability-field-v0/synthetic-designs.tsv
