name: construction-microgrid

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/construction-microgrid/**"
      - ".github/workflows/construction-microgrid.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/construction-microgrid/**"
      - ".github/workflows/construction-microgrid.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-microgrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/construction-microgrid/Cargo.toml -- --check
      - name: Test exact energy reconciliation
        run: cargo test --locked --manifest-path benchmarks/construction-microgrid/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path benchmarks/construction-microgrid/Cargo.toml --all-targets -- -D warnings
