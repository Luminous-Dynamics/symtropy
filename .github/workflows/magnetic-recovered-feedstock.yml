name: Magnetic recovered feedstock evaluator

on:
  pull_request:
    paths:
      - "research/magnetics/recovered-feedstock/**"
      - ".github/workflows/magnetic-recovered-feedstock.yml"

permissions:
  contents: read

jobs:
  recovered-feedstock-evaluator:
    name: recovered feedstock evaluator / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Formatting
        run: cargo fmt --manifest-path research/magnetics/recovered-feedstock/evaluator/Cargo.toml --all -- --check
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/magnetics/recovered-feedstock/evaluator/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path research/magnetics/recovered-feedstock/evaluator/Cargo.toml --all-targets
