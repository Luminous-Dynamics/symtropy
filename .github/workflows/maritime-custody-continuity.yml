name: Maritime custody continuity qualification

on:
  pull_request:
    paths:
      - "benchmarks/maritime-custody-continuity/**"
      - ".github/workflows/maritime-custody-continuity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy

      - name: Verify frozen input digests
        working-directory: benchmarks/maritime-custody-continuity
        run: sha256sum --check data/SHA256SUMS

      - name: Check formatting
        working-directory: benchmarks/maritime-custody-continuity
        run: cargo +1.96.0 fmt --all --check

      - name: Run locked offline tests
        working-directory: benchmarks/maritime-custody-continuity
        run: cargo +1.96.0 test --offline --locked

      - name: Execute read-only evaluator
        working-directory: benchmarks/maritime-custody-continuity
        run: cargo +1.96.0 run --offline --locked

      - name: Run strict Clippy
        working-directory: benchmarks/maritime-custody-continuity
        run: cargo +1.96.0 clippy --offline --locked --all-targets -- -D warnings
