name: maritime-engineering-health-evaluator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/maritime-engineering-health/**"
      - "benchmarks/maritime/engineering-health-corpus-v0.1.json"
      - "benchmarks/maritime/marine-engine-fault-dataset-v1.manifest.json"
      - "benchmarks/maritime-engineering-health/src/bin/marine_engine_dataset_audit.rs"
      - "docs/tech/MARITIME_ENGINE_DATASET_AUDIT_REPORT_V0_1.schema.json"
      - "docs/tech/MARITIME_ENGINE_FAULT_DATASET_BENCHMARK_V0_1.md"
      - "docs/tech/MARITIME_ENGINEERING_HEALTH*"
      - ".github/workflows/maritime-engineering-health-evaluator.yml"
  push:
    branches: [main, research/maritime-engineering-health-v0-1]
    paths:
      - "benchmarks/maritime-engineering-health/**"
      - "benchmarks/maritime/engineering-health-corpus-v0.1.json"
      - ".github/workflows/maritime-engineering-health-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-engineering-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual_head=${actual}"
          echo "expected_head=${expected}"
          test "${actual}" = "${expected}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/maritime-engineering-health/Cargo.toml -- --check

      - name: Run evaluator tests
        run: cargo test --locked --all-targets --manifest-path benchmarks/maritime-engineering-health/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path benchmarks/maritime-engineering-health/Cargo.toml --all-targets -- -D warnings

      - name: Execute frozen corpus
        run: |
          cargo run --locked --manifest-path benchmarks/maritime-engineering-health/Cargo.toml --bin maritime-engineering-health-evaluator -- \
            benchmarks/maritime/engineering-health-corpus-v0.1.json > /tmp/maritime-engineering-health-report.json
          cat /tmp/maritime-engineering-health-report.json

      - name: Upload exact-head evaluator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maritime-engineering-health-evaluator-evidence
          path: /tmp/maritime-engineering-health-report.json
          if-no-files-found: warn

  external-marine-engine-dataset-audit:
    name: Download, verify and audit Aalto marine-engine payload
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATASET_URL: https://zenodo.org/records/19857425/files/Marine_Engine_Fault_Data_v1.zip?download=1
      DATASET_EXPECTED_SIZE: "26538633"
      DATASET_PUBLISHER_MD5: f4d246c1bb46e05b26e56221acc2606c
      MANIFEST_PATH: benchmarks/maritime/marine-engine-fault-dataset-v1.manifest.json
      REPORT_SCHEMA: docs/tech/MARITIME_ENGINE_DATASET_AUDIT_REPORT_V0_1.schema.json
      MAX_UNCOMPRESSED_BYTES: "200000000"
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up pinned schema validator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Retrieve and verify publisher archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Marine_Engine_Fault_Data_v1.zip"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 300 \
            --output "$archive" "$DATASET_URL"
          actual_size="$(stat -c '%s' "$archive")"
          test "$actual_size" = "$DATASET_EXPECTED_SIZE"
          printf '%s  %s\n' "$DATASET_PUBLISHER_MD5" "$archive" | md5sum --check
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          echo "ARCHIVE_SHA256=$archive_sha256" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"
          echo "Publisher archive verified; SHA-256=$archive_sha256"

      - name: Audit ZIP paths, exact inventory and decompression budget
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - "$ARCHIVE_PATH" "$MANIFEST_PATH" "$MAX_UNCOMPRESSED_BYTES" <<'PY'
          import json
          import pathlib
          import stat
          import sys
          import zipfile

          archive_path = pathlib.Path(sys.argv[1])
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text())
          maximum = int(sys.argv[3])
          expected = {x["path"].replace("\\", "/")
                      for x in manifest["public_record_metadata"]["archive"]["file_inventory"]}
          with zipfile.ZipFile(archive_path) as archive:
              files = [item for item in archive.infolist() if not item.is_dir()]
              observed = set()
              total = 0
              for item in files:
                  name = item.filename
                  path = pathlib.PurePosixPath(name)
                  mode = (item.external_attr >> 16) & 0o170000
                  if (path.is_absolute() or any(p in ("", ".", "..") for p in path.parts)
                      or "\\" in name or name.startswith("/")
                      or (len(name) > 1 and name[1] == ":") or mode == stat.S_IFLNK):
                      raise SystemExit(f"unsafe ZIP member: {name!r}")
                  if name in observed:
                      raise SystemExit(f"duplicate ZIP member: {name!r}")
                  observed.add(name)
                  total += item.file_size
              if observed != expected:
                  raise SystemExit(
                      f"ZIP inventory mismatch: missing={sorted(expected-observed)}, "
                      f"unexpected={sorted(observed-expected)}"
                  )
              if total > maximum:
                  raise SystemExit(f"decompression budget exceeded: {total} > {maximum}")
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              print(f"Verified {len(files)} files; uncompressed bytes={total}")
          PY

      - name: Extract verified archive
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/marine-engine-fault-extracted"
          mkdir -p "$root"
          unzip -q "$ARCHIVE_PATH" -d "$root"
          test "$(find "$root" -type f | wc -l | tr -d ' ')" -eq 22
          test -z "$(find "$root" -type l -print)"
          echo "DATASET_ROOT=$root" >> "$GITHUB_ENV"

      - name: Run Rust payload audit
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/marine-engine-fault-audit-report.json"
          cargo run --release --locked \
            --manifest-path benchmarks/maritime-engineering-health/Cargo.toml \
            --bin marine_engine_dataset_audit -- \
            "$DATASET_ROOT" "$MANIFEST_PATH" --archive "$ARCHIVE_PATH" \
            --output "$report"
          echo "AUDIT_REPORT=$report" >> "$GITHUB_ENV"

      - name: Validate closed audit receipt and scientific claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - "$AUDIT_REPORT" "$REPORT_SCHEMA" "$ARCHIVE_SHA256" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report = json.loads(Path(sys.argv[1]).read_text())
          schema = json.loads(Path(sys.argv[2]).read_text())
          expected_sha = sys.argv[3]
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(report)
          archive = report["archive"]
          assert report["audit_state"] == "content_audited_pending_independent_review"
          assert report["dataset_doi"] == "10.5281/zenodo.19857425"
          assert report["files_expected"] == report["files_found"] == 22
          assert report["scenario_csvs_audited"] == 15
          assert report["baseline_csvs_audited"] == 1
          assert report["total_data_rows"] > 0
          assert archive["size_bytes"] == 26538633
          assert archive["sha256"] == expected_sha
          assert archive["publisher_md5_matches"] is True
          assert archive["zip_signature_valid"] is True
          assert report["errors"] == []
          print(json.dumps({
              "audit_state": report["audit_state"],
              "files_found": report["files_found"],
              "scenario_csvs": report["scenario_csvs_audited"],
              "baseline_csvs": report["baseline_csvs_audited"],
              "total_rows": report["total_data_rows"],
              "archive_sha256": archive["sha256"],
              "warnings": report["warnings"],
          }, indent=2))
          PY

      - name: Upload machine-readable payload audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marine-engine-fault-payload-audit-${{{ github.run_id }}
          path: ${{{ runner.temp }}/marine-engine-fault-audit-report.json
          if-no-files-found: warn
          retention-days: 90
