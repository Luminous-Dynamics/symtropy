name: Shipyard lift-envelope preflight verifier

on:
  push:
    paths:
      - "tools/shipyard-lift-envelope/**"
      - ".github/workflows/shipyard-lift-envelope.yml"
  pull_request:
    paths:
      - "tools/shipyard-lift-envelope/**"
      - ".github/workflows/shipyard-lift-envelope.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-lift-envelope-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/shipyard-lift-envelope/Cargo.toml -- --check

      - name: Run locked offline preflight tests
        run: cargo test --locked --offline --manifest-path tools/shipyard-lift-envelope/Cargo.toml

      - name: Compile all targets
        run: cargo check --locked --offline --manifest-path tools/shipyard-lift-envelope/Cargo.toml --all-targets

      - name: Lint all targets with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-lift-envelope/Cargo.toml --all-targets -- -D warnings

      - name: Generate and verify canonical synthetic preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/shipyard-lift-preflight
          rm -rf "$out"
          mkdir -p "$out"
          cargo run --locked --offline --manifest-path tools/shipyard-lift-envelope/Cargo.toml --example synthetic_preflight > "$out/combined.jsonl"
          test "$(wc -l < "$out/combined.jsonl")" -eq 2
          sed -n '1p' "$out/combined.jsonl" > "$out/lift-input.json"
          sed -n '2p' "$out/combined.jsonl" > "$out/preflight-report.json"
          jq -e '.contract_version == "shipyard-lift-envelope-v0.1" and .lift_id == "synthetic-lift-001" and .block_revision == "block-r7" and .crane_configuration_revision == "gantry-config-r4" and .weather.observation_subject_id == "synthetic-weather-station-01" and .weather.limit_profile_id == "synthetic-wind-limit-profile-01"' "$out/lift-input.json"
          jq -e '.contract_version == "shipyard-lift-envelope-v0.1" and .disposition == "ready_for_human_review" and .design_load_upper_mn == 431508000 and (.leg_assessments | length) == 2 and all(.leg_assessments[]; .tension_upper_mn == 305122139 and .within_working_load_limit == true) and .diagnostics == []' "$out/preflight-report.json"
          input_sha=$(sha256sum "$out/lift-input.json" | cut -d ' ' -f 1)
          report_sha=$(sha256sum "$out/preflight-report.json" | cut -d ' ' -f 1)
          printf '{"receipt_contract_version":"shipyard-lift-preflight-receipt-v0","input_sha256":"%s","report_sha256":"%s"}\n' "$input_sha" "$report_sha" > "$out/preflight-receipt.json"
          jq -e --arg input "$input_sha" --arg report "$report_sha" '.receipt_contract_version == "shipyard-lift-preflight-receipt-v0" and .input_sha256 == $input and .report_sha256 == $report' "$out/preflight-receipt.json"

      - name: Retain canonical synthetic lift-preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-lift-preflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/shipyard-lift-preflight/**
          if-no-files-found: ignore
          retention-days: 14
