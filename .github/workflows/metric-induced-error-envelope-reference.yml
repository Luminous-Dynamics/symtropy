name: Metric-induced error envelope reference

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/metric-induced-error-envelope-001/**"
      - ".github/workflows/metric-induced-error-envelope-reference.yml"
  push:
    branches: [main]
    paths:
      - "research/metric-induced-error-envelope-001/**"
      - ".github/workflows/metric-induced-error-envelope-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metric-induced-error-envelope-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path research/metric-induced-error-envelope-001/Cargo.toml --all -- --check
      - name: Test
        run: cargo test --locked --manifest-path research/metric-induced-error-envelope-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/metric-induced-error-envelope-001/Cargo.toml --all-targets -- -D warnings
      - name: Run deterministic coordinate ladder
        run: cargo run --release --locked --manifest-path research/metric-induced-error-envelope-001/Cargo.toml --example coordinate_ladder
      - name: Run deterministic metric-layer microbenchmark
        run: |
          set -euo pipefail
          cargo run --release --locked --manifest-path research/metric-induced-error-envelope-001/Cargo.toml --bin metric-induced-microbenchmark -- "$RUNNER_TEMP/metric-induced-microbenchmark.json"
          test -s "$RUNNER_TEMP/metric-induced-microbenchmark.json"
      - name: Upload reference-layer microbenchmark report
        uses: actions/upload-artifact@v4
        with:
          name: metric-induced-reference-microbenchmark-${{ github.sha }}
          path: ${{ runner.temp }}/metric-induced-microbenchmark.json
          if-no-files-found: error
