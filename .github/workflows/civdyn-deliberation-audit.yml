name: CivDyn deliberation procedural audit

on:
  pull_request:
    paths:
      - "research/civdyn-deliberation-audit/**"
      - ".github/workflows/civdyn-deliberation-audit.yml"
  push:
    paths:
      - "research/civdyn-deliberation-audit/**"
      - ".github/workflows/civdyn-deliberation-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute deliberation audit reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-deliberation-audit/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-deliberation-audit/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-deliberation-audit/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-deliberation-audit/Cargo.toml --all-targets

      - name: Execute baseline and steering controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-deliberation-evidence
          cargo run --locked --manifest-path research/civdyn-deliberation-audit/Cargo.toml --bin deliberation-audit-sweep \
            | tee target/civdyn-deliberation-evidence/deliberation-audit.csv

      - name: Verify speaking, proposal, evidence, consensus and allocation controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-deliberation-evidence/deliberation-audit.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 94, f"expected 94 evidence rows, got {len(rows)}"
          assert all(len(row) == 12 for row in rows)
          session_rows = [row for row in rows if row["record_type"] == "session_metric"]
          member_rows = [row for row in rows if row["record_type"] == "member_metric"]
          pair_rows = [row for row in rows if row["record_type"] == "facilitation_variant_pair"]
          order_rows = [row for row in rows if row["record_type"] == "option_order_pair"]
          assert len(session_rows) == 44
          assert len(member_rows) == 48
          assert len(pair_rows) == 1
          assert len(order_rows) == 1

          sessions = {row["session_id"] for row in session_rows}
          assert sessions == {
              "synthetic_unfacilitated_reference",
              "synthetic_facilitated_steering_control",
          }

          def value(session, metric):
              row = next(r for r in session_rows if r["session_id"] == session and r["metric"] == metric)
              return float(row["value"])

          baseline = "synthetic_unfacilitated_reference"
          steered = "synthetic_facilitated_steering_control"
          assert value(baseline, "allocation_l1_shift_units") == 0
          assert value(steered, "allocation_l1_shift_units") == 56
          assert value(steered, "reallocated_units") == 28
          assert value(steered, "suppressed_proposal_count") == 1
          assert abs(value(steered, "proposal_summary_coverage") - (2/3)) < 1e-6
          assert value(steered, "unsupported_facilitator_claim_count") == 1
          assert value(steered, "verified_facilitator_claim_count") == 1
          steered_row = next(r for r in session_rows if r["session_id"] == steered)
          assert steered_row["facilitator_declares_consensus"] == "true"
          assert steered_row["consensus_claim_contradicted_by_recorded_non_endorsement"] == "true"
          assert abs(value(steered, "modal_top_preference_share") - (1/3)) < 1e-6
          assert value(steered, "mean_trust_after") > value(steered, "mean_trust_before")
          assert value(steered, "consensus_endorsement_count") == 2
          assert value(steered, "consensus_non_endorsement_count") == 1
          assert value(steered, "consensus_unrecorded_count") == 0

          member_c = [
              row for row in member_rows
              if row["session_id"] == steered and row["subject"] == "member_c"
          ]
          assert len(member_c) == 8
          assert next(r for r in member_c if r["metric"] == "proposals_in_summary")["value"] == "0"
          assert next(r for r in member_c if r["metric"] == "consensus_endorsement")["value"] == "false"

          pair = pair_rows[0]
          assert pair["allocation_l1_shift_units"] == "56"
          assert pair["reallocated_units"] == "28.000000"

          order_pair = order_rows[0]
          assert order_pair["metric"] == "semantic_option_order_sensitivity"
          assert order_pair["allocation_l1_shift_units"] == "56"
          assert order_pair["reallocated_units"] == "28.000000"
          assert order_pair["subject"] == "synthetic_option_order_position_bias"

          print("CIVDYN-DELIB-001 trace audit, proposal omission, unsupported claims, endorsement semantics, rhetoric sensitivity and option-order bias verified.")
          PY

          {
            echo "## CIVDYN-DELIB-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-deliberation-evidence/deliberation-audit.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic trace audit"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deliberation audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-deliberation-audit
          path: target/civdyn-deliberation-evidence/deliberation-audit.csv
          if-no-files-found: error
          retention-days: 30
