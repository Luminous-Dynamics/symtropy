name: PB-04a Capsule Slim Diagnostic

on:
  push:
    branches:
      - "ci/pb04a-capsule-slim-diagnostic"
    paths:
      - ".github/workflows/pb04a-capsule-slim-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: pb04a-capsule-slim-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Replay exact PB-04a Python capsule twice
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind distinct diagnostic subject
        shell: bash
        run: |
          set -euo pipefail
          readonly FROZEN_PRODUCT_HEAD="74b8771d6f19fd562a3fb5f95d5d1cd73d6c9343"
          actual_head="$(git rev-parse HEAD)"
          test "${actual_head}" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${FROZEN_PRODUCT_HEAD}" HEAD
          echo "PB04A_SLIM_DIAGNOSTIC_HEAD=${actual_head}"
          echo "PB04A_FROZEN_PRODUCT_ROOT=${FROZEN_PRODUCT_HEAD}"
          echo "PB04A_DIAGNOSTIC_COMMITS_SINCE_ROOT=$(git rev-list --count "${FROZEN_PRODUCT_HEAD}..HEAD")"
          echo "PB04A_SLIM_DIAGNOSTIC_TREE=$(git rev-parse HEAD^{tree})"
          python3 --version

      - name: Verify exact seven-blob transformation capsule
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            test "${actual}" = "${expected}" || {
              echo "capsule drift: ${path}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            }
            echo "PB04A_CAPSULE_BLOB ${path} ${actual}"
          }

          check_blob 01ac9cfb159fe5c87b41e386a2b70c6edb6f6ae9 crates/domains/symtropy-spatial-topology/src/lib.rs
          check_blob 66d2d48ef30208bf1389983a5e3dd5708d5eab3f crates/domains/symtropy-spatial-topology/Cargo.toml
          check_blob 859392660ab0a722d76892ee317aceb2f2522be4 crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs
          check_blob 1d94ebb0a6819bfd1d95060920ec5b3d460194a9 scripts/pb04a-harden-content-identity.py
          check_blob e03de8d8e452af9720d24f8922081c5e00209022 scripts/pb04a-harden-global-source-consistency.py
          check_blob 0790af59fc936515a1a9131ffe1a945e2696f7c6 scripts/pb04a-harden-query-semantics.py
          check_blob 14b41e0c1e010aa9ba4011cff90ded3e77e747f6 scripts/pb04a-seal-identity-state.py

      - name: Syntax-check transformer programs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              "scripts/pb04a-harden-content-identity.py",
              "scripts/pb04a-harden-global-source-consistency.py",
              "scripts/pb04a-harden-query-semantics.py",
              "scripts/pb04a-seal-identity-state.py",
          ]
          for path in paths:
              source = Path(path).read_text(encoding="utf-8")
              compile(source, path, "exec")
              print(f"PB04A_PYTHON_SYNTAX_OK {path}")
          PY

      - name: Replay capsule twice and prove deterministic transformed bytes
        shell: bash
        run: |
          set -euo pipefail
          readonly TARGETS=(
            crates/domains/symtropy-spatial-topology/Cargo.toml
            crates/domains/symtropy-spatial-topology/src/lib.rs
            crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs
          )

          apply_capsule() {
            python3 scripts/pb04a-harden-content-identity.py
            python3 scripts/pb04a-harden-global-source-consistency.py
            python3 scripts/pb04a-harden-query-semantics.py
            python3 scripts/pb04a-seal-identity-state.py
          }

          assert_allowed_delta() {
            while IFS= read -r path; do
              case "$path" in
                crates/domains/symtropy-spatial-topology/Cargo.toml|\
                crates/domains/symtropy-spatial-topology/src/lib.rs|\
                crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs)
                  ;;
                *)
                  echo "unexpected transformed path: $path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only)
            git diff --exit-code --quiet && {
              echo "capsule produced no semantic delta" >&2
              exit 1
            }
            git diff --check
          }

          fingerprint() {
            for path in "${TARGETS[@]}"; do
              printf '%s  %s\n' "$(git hash-object "$path")" "$path"
            done
            git diff --binary --full-index --no-ext-diff -- "${TARGETS[@]}" | sha256sum | awk '{print $1 "  TRANSFORM_PATCH_SHA256"}'
          }

          apply_capsule
          assert_allowed_delta
          fingerprint | tee /tmp/pb04a-pass1.txt

          git checkout -- "${TARGETS[@]}"
          test -z "$(git diff --name-only -- "${TARGETS[@]}")"

          apply_capsule
          assert_allowed_delta
          fingerprint | tee /tmp/pb04a-pass2.txt

          diff -u /tmp/pb04a-pass1.txt /tmp/pb04a-pass2.txt
          echo "PB04A_SLIM_CAPSULE_REPLAY_DETERMINISTIC=1"

      - name: State evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "This job proves only deterministic Python capsule application on ubuntu-slim."
          echo "It does NOT run rustfmt, cargo check, cargo test, or Clippy."
          echo "It is NOT semantically equivalent to the frozen ubuntu-latest PB-04a qualification lane."
