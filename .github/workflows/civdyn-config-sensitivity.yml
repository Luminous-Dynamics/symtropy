name: CivDyn configuration sensitivity reference

on:
  pull_request:
    paths:
      - "research/civdyn-config-sensitivity/**"
      - ".github/workflows/civdyn-config-sensitivity.yml"
  push:
    paths:
      - "research/civdyn-config-sensitivity/**"
      - ".github/workflows/civdyn-config-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute configuration-sensitivity reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-config-sensitivity/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-config-sensitivity/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-config-sensitivity/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-config-sensitivity/Cargo.toml --all-targets

      - name: Execute configuration surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-config-evidence
          cargo run --locked --manifest-path research/civdyn-config-sensitivity/Cargo.toml --bin configuration-sensitivity-sweep \
            | tee target/civdyn-config-evidence/configuration-sensitivity.csv

      - name: Verify configuration identity, paired flips and cohort reversal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-config-evidence/configuration-sensitivity.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 13, f"expected 13 rows, got {len(rows)}"
          assert all(len(row) == 21 for row in rows)
          summaries = {row["configuration_id"]: row for row in rows if row["record_type"] == "configuration_summary"}
          cohorts = {(row["configuration_id"], row["cohort_id"]): row for row in rows if row["record_type"] == "cohort_summary"}
          contrasts = [row for row in rows if row["record_type"] == "single_facet_contrast"]
          surfaces = [row for row in rows if row["record_type"] == "configuration_surface"]

          assert set(summaries) == {"baseline", "semantic_permutation", "position_biased_order"}
          assert len({row["configuration_digest"] for row in summaries.values()}) == 3
          assert all(row["configuration_digest"].startswith("sha256:") and len(row["configuration_digest"]) == 71 for row in summaries.values())
          assert summaries["semantic_permutation"]["flipped_vs_baseline"] == "0"
          assert summaries["position_biased_order"]["flipped_vs_baseline"] == "4"
          assert abs(float(summaries["position_biased_order"]["flip_rate_vs_baseline"]) - 1/3) < 1e-6

          base_a = cohorts[("baseline", "cohort_a")]
          base_b = cohorts[("baseline", "cohort_b")]
          changed_a = cohorts[("position_biased_order", "cohort_a")]
          changed_b = cohorts[("position_biased_order", "cohort_b")]
          assert (base_a["selected"], base_a["total"]) == ("4", "6")
          assert (base_b["selected"], base_b["total"]) == ("2", "6")
          assert abs(float(base_b["ratio_to_reference"]) - 0.5) < 1e-6
          assert abs(float(changed_a["rate"]) - 1/3) < 1e-6
          assert abs(float(changed_b["rate"]) - 2/3) < 1e-6
          assert abs(float(changed_b["ratio_to_reference"]) - 2.0) < 1e-6

          assert len(contrasts) == 3
          target = next(row for row in contrasts if row["configuration_a"] == "baseline" and row["configuration_b"] == "position_biased_order")
          assert target["facet"] == "order_profile"
          assert target["pair_flipped_cases"] == "4"
          assert abs(float(target["pair_flip_rate"]) - 1/3) < 1e-6
          assert abs(float(target["overall_rate_delta_b_minus_a"])) < 1e-6
          assert len(surfaces) == 1

          print("CIVDYN-CFG-001 complete configuration identity, semantic-order invariance, position-bias flips and cohort-ratio reversal verified.")
          PY

          {
            echo "## CIVDYN-CFG-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-config-evidence/configuration-sensitivity.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic configuration-sensitivity fixture"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload configuration-sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-configuration-sensitivity
          path: target/civdyn-config-evidence/configuration-sensitivity.csv
          if-no-files-found: error
          retention-days: 30
