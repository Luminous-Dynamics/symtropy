name: preservation-intervention-portfolio-reference isolated qualification

on:
  pull_request:
    paths:
      - 'research/physical-storage/preservation-intervention-portfolio-reference/**'
      - 'research/physical-storage/preservation-intervention-portfolio-reference/Cargo.lock'
      - '.github/workflows/preservation-intervention-portfolio-reference.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'research/physical-storage/preservation-intervention-portfolio-reference/**'
      - 'research/physical-storage/preservation-intervention-portfolio-reference/Cargo.lock'
      - '.github/workflows/preservation-intervention-portfolio-reference.yml'

permissions:
  contents: write

jobs:
  rust:
    name: preservation-intervention-portfolio-reference (Rust 1.96.0)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      MANIFEST: research/physical-storage/preservation-intervention-portfolio-reference/Cargo.toml
      SOURCE: research/physical-storage/preservation-intervention-portfolio-reference/src/lib.rs
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Apply rustfmt
        run: cargo fmt --manifest-path "$MANIFEST"
      - name: Commit rustfmt changes to this PR branch
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- "$SOURCE"; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          git commit -m "style: rustfmt preservation-intervention-portfolio-reference"
          git push origin "HEAD:$PR_BRANCH"
      - name: Check formatting
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --manifest-path "$MANIFEST" --all-targets
