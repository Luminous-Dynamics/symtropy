name: PB-04a Identity Hardening Apply

on:
  push:
    branches:
      - "spatial/pb04a-faceted-topology-kernel"
    paths:
      - "scripts/pb04a-harden-content-identity.py"
      - "scripts/pb04a-harden-global-source-consistency.py"
      - "scripts/pb04a-harden-query-semantics.py"
      - "scripts/pb04a-seal-identity-state.py"
      - ".github/workflows/pb04a-identity-apply.yml"

permissions:
  contents: write

concurrency:
  group: pb04a-identity-hardening
  cancel-in-progress: true

jobs:
  apply:
    name: Apply PB-04a identity and query hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact transformer input head
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "${actual_head}" = "${GITHUB_SHA}"
          echo "PB04A_IDENTITY_INPUT_HEAD=${actual_head}"
          echo "PB04A_IDENTITY_INPUT_TREE=$(git rev-parse HEAD^{tree})"
          python3 --version

      - name: Verify exact transformation capsule
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "PB-04a hardening capsule drift: ${path}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            fi
            echo "PB04A_CAPSULE_BLOB ${path} ${actual}"
          }

          check_blob 01ac9cfb159fe5c87b41e386a2b70c6edb6f6ae9 crates/domains/symtropy-spatial-topology/src/lib.rs
          check_blob 66d2d48ef30208bf1389983a5e3dd5708d5eab3f crates/domains/symtropy-spatial-topology/Cargo.toml
          check_blob 859392660ab0a722d76892ee317aceb2f2522be4 crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs

          check_blob 1d94ebb0a6819bfd1d95060920ec5b3d460194a9 scripts/pb04a-harden-content-identity.py
          check_blob e03de8d8e452af9720d24f8922081c5e00209022 scripts/pb04a-harden-global-source-consistency.py
          check_blob 253cc6e94a23dd61a7b712b43862ddfb966e8872 scripts/pb04a-harden-query-semantics.py
          check_blob 14b41e0c1e010aa9ba4011cff90ded3e77e747f6 scripts/pb04a-seal-identity-state.py

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Apply fail-closed hardening transformers
        run: |
          set -euo pipefail
          python3 scripts/pb04a-harden-content-identity.py
          python3 scripts/pb04a-harden-global-source-consistency.py
          python3 scripts/pb04a-harden-query-semantics.py
          python3 scripts/pb04a-seal-identity-state.py

      - name: Canonical formatting
        run: >-
          cargo fmt
          --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml

      - name: Prove hardened isolated crate
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --all-targets
          cargo test --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml
          cargo clippy --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --all-targets -- -D warnings

      - name: Require semantic delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet && {
            echo "hardening transformers produced no semantic delta" >&2
            exit 1
          }
          git status --short

      - name: Commit qualified PB-04a hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PB-04a Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/domains/symtropy-spatial-topology/Cargo.toml \
                  crates/domains/symtropy-spatial-topology/src/lib.rs \
                  crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs
          git diff --cached --exit-code --quiet && {
            echo "no qualified source delta to commit" >&2
            exit 1
          }
          git commit -m "fix(spatial): harden PB-04a topology authority semantics"
          qualified_head="$(git rev-parse HEAD)"
          qualified_tree="$(git rev-parse HEAD^{tree})"
          echo "PB04A_HARDENED_HEAD=${qualified_head}"
          echo "PB04A_HARDENED_TREE=${qualified_tree}"

          remote_head="$(git ls-remote origin refs/heads/spatial/pb04a-faceted-topology-kernel | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin HEAD:spatial/pb04a-faceted-topology-kernel
