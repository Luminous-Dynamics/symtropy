name: SIM-REL-019 Exact Model-Family Trace Auditor

on:
  push:
    branches: ["research/sim-rel-019-*"]
    paths:
      - "tools/sim-rel-model-family-auditor/**"
      - "tools/sim-rel-joint-stochastic-oracle/**"
      - ".github/workflows/sim-rel-019-model-family-auditor.yml"
  pull_request:
    branches: ["main", "research/sim-rel-018-adaptive-benchmark-generator"]
    paths:
      - "tools/sim-rel-model-family-auditor/**"
      - "tools/sim-rel-joint-stochastic-oracle/**"
      - ".github/workflows/sim-rel-019-model-family-auditor.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: exact support, rare-event and out-of-family controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-019-model-auditor-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/sim-rel-model-family-auditor/Cargo.toml -- --check
      - name: Exact trace-audit tests
        run: cargo test --locked --manifest-path tools/sim-rel-model-family-auditor/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-model-family-auditor/Cargo.toml --lib -- -D warnings
      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD: \${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
