name: PIRB v0.2 Outcome Governance Schema Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/schemas/peacebuilding-outcome-governance-v0.2.schema.json"
      - "docs/fixtures/peacebuilding-outcome-governance-v0.2.json"
      - "tools/pirb-outcome-governance-audit/**"
      - ".github/workflows/pirb-v0-2-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirb-v0-2-schema-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Generate standalone dependency lock
        run: cargo generate-lockfile --manifest-path tools/pirb-outcome-governance-audit/Cargo.toml

      - name: Check standalone crate formatting
        run: cargo fmt --manifest-path tools/pirb-outcome-governance-audit/Cargo.toml -- --check

      - name: Run schema meta-validation, instance validation and negative controls
        run: cargo test --locked --manifest-path tools/pirb-outcome-governance-audit/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/pirb-outcome-governance-audit/Cargo.toml --all-targets -- -D warnings

      - name: Generate and verify exact-head proof-carrying receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          cargo run --locked --manifest-path tools/pirb-outcome-governance-audit/Cargo.toml -- \
            --source-commit "$source_commit" \
            --rustc-version "$rustc_version" \
            --cargo-version "$cargo_version" > pirb-v0-2-receipt.json
          schema_sha="$(sha256sum docs/schemas/peacebuilding-outcome-governance-v0.2.schema.json | cut -d ' ' -f1)"
          fixture_sha="$(sha256sum docs/fixtures/peacebuilding-outcome-governance-v0.2.json | cut -d ' ' -f1)"
          lock_sha="$(sha256sum tools/pirb-outcome-governance-audit/Cargo.lock | cut -d ' ' -f1)"
          jq --exit-status \
            --arg source_commit "$source_commit" \
            --arg schema_sha "$schema_sha" \
            --arg fixture_sha "$fixture_sha" \
            --arg lock_sha "$lock_sha" \
            --arg rustc_version "$rustc_version" \
            --arg cargo_version "$cargo_version" \
            ' .passed == true
              and .schema_meta_valid == true
              and .example_valid == true
              and .validation_error_count == 0
              and .source_commit == $source_commit
              and (.source_commit | test("^[0-9a-f]{40}$"))
              and .schema_sha256 == $schema_sha
              and .fixture_sha256 == $fixture_sha
              and .dependency_lock_sha256 == $lock_sha
              and .rustc_version == $rustc_version
              and .cargo_version == $cargo_version
              and .metric_id == "pirb-metric-fictional-essential-service-gap"
              and .metric_version == 1
              and .governance_event_count == 4' pirb-v0-2-receipt.json > /dev/null
          cat pirb-v0-2-receipt.json

      - name: Upload exact-head v0.2 receipt and inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pirb-v0-2-outcome-governance-receipt
          path: |
            pirb-v0-2-receipt.json
            docs/schemas/peacebuilding-outcome-governance-v0.2.schema.json
            docs/fixtures/peacebuilding-outcome-governance-v0.2.json
            tools/pirb-outcome-governance-audit/Cargo.lock
          if-no-files-found: warn
          retention-days: 90
