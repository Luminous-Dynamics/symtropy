name: MUS-OPT instrument matrix audit

on:
  pull_request:
    paths:
      - "tools/mus-opt-audit/**"
      - "schemas/manufacturing/instrument_architecture_matrix_v0_1.schema.json"
      - "fixtures/manufacturing/instrument_architecture_matrix_v0_1.json"
      - ".github/workflows/mus-opt-audit.yml"
  push:
    branches: [main]
    paths:
      - "tools/mus-opt-audit/**"
      - "schemas/manufacturing/instrument_architecture_matrix_v0_1.schema.json"
      - "fixtures/manufacturing/instrument_architecture_matrix_v0_1.json"
      - ".github/workflows/mus-opt-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: MUS-OPT schema, policy tests and fixture audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format source and emit exact rustfmt output for review
        run: |
          cargo fmt --manifest-path tools/mus-opt-audit/Cargo.toml
          echo '---BEGIN_FORMATTED_RUST_SOURCE---'
          cat tools/mus-opt-audit/src/main.rs
          echo '---END_FORMATTED_RUST_SOURCE---'
      - name: Run auditor unit tests
        run: cargo test --manifest-path tools/mus-opt-audit/Cargo.toml
      - name: Audit synthetic matrix
        run: cargo run --manifest-path tools/mus-opt-audit/Cargo.toml -- --schema schemas/manufacturing/instrument_architecture_matrix_v0_1.schema.json --corpus fixtures/manufacturing/instrument_architecture_matrix_v0_1.json
