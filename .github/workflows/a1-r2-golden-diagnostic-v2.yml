name: A1 R2 Legacy Identity Diagnostic V2

on:
  pull_request:
    branches: [ "analysis/a0-replay-valid-evidence-v0.1" ]

permissions:
  contents: read

env:
  LEGACY_A1_HEAD: e5f1ff4a21f1ee472cf2f14d76699dd8b9b16f26
  LEGACY_A1_SOURCE_BLOB: f041971ff435129487f6ce798cc8f22374e6f11d
  LEGACY_A1_MANIFEST_BLOB: 7988c2b950e3d842f247b3239b69da0232525532
  FIXTURE_BLOB: 4274b1c42bea3b7b0ad9b5680345b3630c78bdfe
  CARGO_TARGET_DIR: /tmp/symtropy-a1-r2-golden-target-v2

jobs:
  capture:
    name: Execute exact legacy A1 schema-v1 identity fixtures
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact legacy A1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.LEGACY_A1_HEAD }}
          path: legacy-a1
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact runner tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact legacy source and fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy-a1 rev-parse HEAD)" = "$LEGACY_A1_HEAD"
          test "$(git -C legacy-a1 hash-object crates/domains/symtropy-analysis-qualification/src/lib.rs)" = "$LEGACY_A1_SOURCE_BLOB"
          test "$(git -C legacy-a1 hash-object crates/domains/symtropy-analysis-qualification/Cargo.toml)" = "$LEGACY_A1_MANIFEST_BLOB"
          test "$(git -C runner-tools hash-object .github/repair/a1_legacy_identity_fixture.rs)" = "$FIXTURE_BLOB"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0

      - name: Materialize independent public-API fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-a1/crates/domains/symtropy-analysis-qualification/examples
          cp runner-tools/.github/repair/a1_legacy_identity_fixture.rs legacy-a1/crates/domains/symtropy-analysis-qualification/examples/freeze_a1_identity.rs
          cp legacy-a1/Cargo.lock /tmp/a1-legacy-lock.before

      - name: Resolve stale legacy local-package lock and execute vectors
        shell: bash
        run: |
          set -euo pipefail
          cd legacy-a1
          cargo run -p symtropy-analysis-qualification --example freeze_a1_identity 2>&1 | tee /tmp/a1-golden.log
          grep -q '^A1_PROFILE_GOLDEN=' /tmp/a1-golden.log
          grep -q '^A1_CUT_GOLDEN=' /tmp/a1-golden.log

      - name: Prove legacy resolution did not alter source semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy-a1 hash-object crates/domains/symtropy-analysis-qualification/src/lib.rs)" = "$LEGACY_A1_SOURCE_BLOB"
          test "$(git -C legacy-a1 hash-object crates/domains/symtropy-analysis-qualification/Cargo.toml)" = "$LEGACY_A1_MANIFEST_BLOB"
          git -C legacy-a1 diff -- crates/domains/symtropy-analysis-qualification/src/lib.rs crates/domains/symtropy-analysis-qualification/Cargo.toml --exit-code
          echo "Legacy lock delta (diagnostic only):"
          git -C legacy-a1 diff -- Cargo.lock || true
