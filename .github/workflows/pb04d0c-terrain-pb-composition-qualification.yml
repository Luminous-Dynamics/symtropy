name: PB-04d0c Terrain PB Composition Qualification

on:
  push:
    branches:
      - "ci/pb04d0c-terrain-pb-composition-qual-224c1ce"
    paths:
      - ".github/workflows/pb04d0c-terrain-pb-composition-qualification.yml"

permissions:
  contents: read

concurrency:
  group: pb04d0c-terrain-pb-composition-qual-224c1ce
  cancel-in-progress: true

jobs:
  composition-object:
    name: Prove exact cross-lineage composition object
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact one-commit workflow-only qualifier lineage
        shell: bash
        run: |
          set -euo pipefail
          product=224c1cef5971f0623c61c1533212a7baf485c9a0
          qualifier=.github/workflows/pb04d0c-terrain-pb-composition-qualification.yml
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${product}"
          test "$(git diff --name-only "${product}..HEAD")" = "${qualifier}"
          test -z "$(git rev-list --merges "${product}..HEAD")"

      - name: Checkout immutable composition product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 224c1cef5971f0623c61c1533212a7baf485c9a0
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact parents tree roots and asymmetric provenance
        shell: bash
        run: |
          set -euo pipefail
          product=224c1cef5971f0623c61c1533212a7baf485c9a0
          terrain_parent=346852c0b3490df30b1b34ba96d23cb9cf47e5f3
          pb_parent=5adc54c6f52c7928ac0c7f3381d88c2ee2f5eba4
          expected_tree=42dad78a271ec9822c0489f9f8a74be6f1a12168
          decomposition=crates/domains/symtropy-spatial-decomposition
          topology=crates/domains/symtropy-spatial-topology

          test "$(git rev-parse HEAD)" = "${product}"
          test "$(git show -s --format=%P HEAD)" = "${terrain_parent} ${pb_parent}"
          test "$(git rev-parse HEAD^{tree})" = "${expected_tree}"

          test "$(git rev-parse HEAD:Cargo.toml)" = "274720e256ba9067fad3d06f71e1b18590b046bd"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain)" = "4337d35ba4795d32bc59e29e421360dca4f2eb52"
          test "$(git rev-parse HEAD:${decomposition})" = "d85aa9016f9354498caf77ee237a4fb6d006f1a8"
          test "$(git rev-parse HEAD:${topology})" = "01a11e08fa7e4ae00681da2cdf9df2c4687d97e2"
          test "$(git rev-parse HEAD:crates/domains/symtropy-game-state)" = "6c38d5cf93837ed4b1b123d15de5858ee107b09d"

          test "$(git rev-parse HEAD:.github)" = "$(git rev-parse "${terrain_parent}:.github")"
          test "$(git rev-parse HEAD:scripts)" = "$(git rev-parse "${terrain_parent}:scripts")"
          test "$(git rev-parse HEAD:Cargo.toml)" = "$(git rev-parse "${terrain_parent}:Cargo.toml")"
          test "$(git rev-parse HEAD:Cargo.lock)" = "$(git rev-parse "${terrain_parent}:Cargo.lock")"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain)" = "$(git rev-parse "${terrain_parent}:crates/domains/symtropy-terrain")"

          expected="$(printf '%s\n' \
            "${decomposition}/Cargo.lock" \
            "${decomposition}/Cargo.toml" \
            "${decomposition}/src/lib.rs" \
            "${decomposition}/tests/complete_local_coverage.rs" \
            "${decomposition}/tests/exact_cell_bounds.rs" \
            "${decomposition}/tests/incremental_equivalence.rs" \
            "${decomposition}/tests/local_identity.rs" \
            "${topology}/Cargo.lock" \
            "${topology}/Cargo.toml" \
            "${topology}/README.md" \
            "${topology}/src/lib.rs" \
            "${topology}/tests/hostile_projection.rs" | sort)"
          actual="$(git diff --name-only "${terrain_parent}..${product}" | sort)"
          test "${actual}" = "${expected}"
          test "$(printf '%s\n' "${actual}" | sed '/^$/d' | wc -l)" -eq 12

      - name: Prove no cross-domain mapping semantics were introduced
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          terrain = Path("crates/domains/symtropy-terrain")
          decomp = Path("crates/domains/symtropy-spatial-decomposition")
          topo = Path("crates/domains/symtropy-spatial-topology")

          terrain_text = "\n".join(p.read_text() for p in sorted((terrain / "src").glob("*.rs")))
          terrain_manifest = (terrain / "Cargo.toml").read_text()
          pb_text = "\n".join([
              (decomp / "Cargo.toml").read_text(),
              (decomp / "src/lib.rs").read_text(),
              (topo / "Cargo.toml").read_text(),
              (topo / "src/lib.rs").read_text(),
          ])

          if "symtropy-spatial-decomposition" in terrain_manifest or "symtropy_spatial_decomposition" in terrain_text:
              raise SystemExit("Terrain gained a PB dependency in the composition-only product")
          if "symtropy-terrain" in pb_text or "symtropy_terrain" in pb_text:
              raise SystemExit("PB proof workspaces gained a Terrain dependency in the composition-only product")

          print("PB04D0C_MAPPING_IMPLEMENTATION=ABSENT")
          print("PB04D0C_CROSS_DOMAIN_DEPENDENCY=ABSENT")
          PY

      - name: Exact immutable-product postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "224c1cef5971f0623c61c1533212a7baf485c9a0"
          test "$(git show -s --format=%P HEAD)" = "346852c0b3490df30b1b34ba96d23cb9cf47e5f3 5adc54c6f52c7928ac0c7f3381d88c2ee2f5eba4"
          test "$(git rev-parse HEAD^{tree})" = "42dad78a271ec9822c0489f9f8a74be6f1a12168"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "PB04D0C_COMPOSITION_OBJECT=PASS"

  terrain-replay:
