          qualifier=.github/workflows/pb04d0c-terrain-pb-composition-qualification.yml
          test "$(git rev-parse HEAD^)" = "${product}"
          test "$(git diff --name-only "${product}..HEAD")" = "${qualifier}"

      - name: Checkout immutable composition product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 224c1cef5971f0623c61c1533212a7baf485c9a0
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact Terrain inheritance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "224c1cef5971f0623c61c1533212a7baf485c9a0"
          test "$(git rev-parse HEAD^{tree})" = "42dad78a271ec9822c0489f9f8a74be6f1a12168"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain)" = "4337d35ba4795d32bc59e29e421360dca4f2eb52"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/lib.rs)" = "ead663beacad41e99da28f9c67a6c34f126caa69"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/terrain_metric.rs)" = "5f6cce3dc034c0b8c0e46dc55e599bd6162841ac"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/tests/terrain_metric_public.rs)" = "20029889212d686d08fd92190a6945eb302d3ce5"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/live_geometry_provider.rs)" = "543858ec733429ac41d39bd52eb2e39210806280"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_currentness.rs)" = "2da7d9b27313ae24b45269171cf58ea6cd528de4"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/live_geometry_query.rs)" = "34995e11c7d82ffa4e18b7fc12927816408e8d1d"
          test ! -e crates/domains/symtropy-terrain/src/geometry_authority.rs
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04d0c-terrain-target" >> "${GITHUB_ENV}"

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind toolchain and locked root graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          test "$(cargo --version | awk '{print $2}')" = "1.96.0"
          before="$(git hash-object Cargo.lock)"
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/pb04d0c-terrain-metadata.json"
          test "$(git hash-object Cargo.lock)" = "${before}"

      - name: Check exact Terrain formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/domains/symtropy-terrain/src/lib.rs \
            crates/domains/symtropy-terrain/src/terrain_metric.rs \
            crates/domains/symtropy-terrain/tests/terrain_metric_public.rs

      - name: Compile all Terrain targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p symtropy-terrain --locked --all-targets

      - name: Re-execute Terrain theorem corpora
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked live_geometry_provider::tests -- --nocapture
          cargo test -p symtropy-terrain --locked geometry_currentness::tests -- --nocapture
          cargo test -p symtropy-terrain --locked live_geometry_query::tests -- --nocapture
          cargo test -p symtropy-terrain --locked --test terrain_metric_public -- --nocapture

      - name: Execute complete Terrain regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked --all-targets

      - name: Enforce strict Terrain Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p symtropy-terrain --locked --all-targets -- -D warnings

      - name: Audit inherited Terrain authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("crates/domains/symtropy-terrain")
          src = root / "src"
          texts = {p.name: p.read_text() for p in sorted(src.glob("*.rs"))}
          joined = "\n".join(texts.values())
          lib = texts["lib.rs"]
          kernel = texts["geometry_kernel.rs"]
          provider = texts["live_geometry_provider.rs"]
          metric = texts["terrain_metric.rs"]
          manifest = (root / "Cargo.toml").read_text()

          if (src / "geometry_authority.rs").exists():
              raise SystemExit("superseded geometry authority reappeared")
          if "TerrainGeometrySnapshot::capture(" in joined:
              raise SystemExit("caller-coordinate capture surface reappeared")

          expected_defs = {
              "TerrainGeometrySnapshot": "geometry_kernel.rs",
              "EarthChunkLatticeCoord": "geometry_kernel.rs",
              "EarthChunkLatticeLocus": "live_geometry_provider.rs",
          }
          for ty, expected in expected_defs.items():
              owners = [name for name, text in texts.items() if re.search(rf"\bstruct\s+{ty}\b", text)]
              if owners != [expected]:
                  raise SystemExit(f"unexpected {ty} definitions: {owners!r}")

          prefix = provider.partition("#[cfg(test)]")[0]
          locus = re.search(
              r"#\[derive\((?P<derives>[^)]*)\)\]\s*pub\(crate\)\s+struct\s+EarthChunkLatticeLocus\b",
              prefix,
              flags=re.S,
          )
          if locus is None:
              raise SystemExit("crate-owned locus declaration changed")
          if "Reflect" in {x.strip() for x in locus.group("derives").split(",")}:
              raise SystemExit("locus gained Reflect derive")

          capture = re.compile(
              r"pub fn capture_live_terrain_geometry\(\s*world:\s*&World,\s*entity:\s*Entity,\s*\)\s*->",
              re.S,
          )
          if len(capture.findall(provider)) != 1:
              raise SystemExit("live capture signature changed or duplicated")

          required = (
              "mod geometry_currentness;",
              "pub mod geometry_kernel;",
              "mod live_geometry_provider;",
              "mod live_geometry_query;",
              "pub mod terrain_metric;",
              "verify_live_terrain_geometry_current",
              "capture_live_terrain_geometry",
              "query_live_terrain_geometry",
          )
          if any(lib.count(term) != 1 for term in required):
              raise SystemExit("converged Terrain wiring changed")

          prod_metric = metric.partition("#[cfg(test)]")[0]
          if "impl Default for TerrainMetricProfile" in prod_metric:
              raise SystemExit("metric profile gained a default")
          if re.search(r"(?:Resource|Component)\b.*TerrainMetricProfile", prod_metric, re.S):
              raise SystemExit("metric profile gained ECS writer authority")
          if any(x in prod_metric for x in ("GlobalTransform", "Vec3", "Collider")):
              raise SystemExit("metric vocabulary gained runtime inference")
          if "symtropy-spatial-decomposition" in manifest or "symtropy_spatial_decomposition" in joined:
              raise SystemExit("Terrain gained PB dependency")

          print("PB04D0C_TERRAIN_REPLAY=PASS")
          PY

      - name: Terrain immutable-product postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "224c1cef5971f0623c61c1533212a7baf485c9a0"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain)" = "4337d35ba4795d32bc59e29e421360dca4f2eb52"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e crates/domains/symtropy-terrain/target
          echo "PB04D0C_TERRAIN_IMMUTABLE=PASS"

