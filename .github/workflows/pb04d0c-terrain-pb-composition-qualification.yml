        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind toolchain and locked topology graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=crates/domains/symtropy-spatial-topology/Cargo.toml
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          test "$(cargo --version | awk '{print $2}')" = "1.96.0"
          before="$(git hash-object crates/domains/symtropy-spatial-topology/Cargo.lock)"
          cargo metadata --manifest-path "${manifest}" --locked --format-version 1 > "${RUNNER_TEMP}/pb04d0c-topology-metadata.json"
          test "$(git hash-object crates/domains/symtropy-spatial-topology/Cargo.lock)" = "${before}"

      - name: Check topology formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml -- --check

      - name: Check all topology targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --all-targets

      - name: Execute complete topology regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --all-targets

      - name: Enforce strict topology Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --all-targets -- -D warnings

      - name: Audit topology isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("crates/domains/symtropy-spatial-topology")
          manifest = (root / "Cargo.toml").read_text()
          source = (root / "src/lib.rs").read_text()
          if "symtropy-terrain" in manifest or "symtropy_terrain" in source:
              raise SystemExit("PB topology gained Terrain dependency")
          print("PB04D0C_TOPOLOGY_TERRAIN_DEPENDENCY=ABSENT")
          PY

      - name: Topology immutable-product postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "224c1cef5971f0623c61c1533212a7baf485c9a0"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-topology)" = "01a11e08fa7e4ae00681da2cdf9df2c4687d97e2"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e crates/domains/symtropy-spatial-topology/target
          echo "PB04D0C_TOPOLOGY_IMMUTABLE=PASS"
