          source = (root / "src/lib.rs").read_text()
          manifest = (root / "Cargo.toml").read_text()
          tests = (root / "tests/exact_cell_bounds.rs").read_text()

          if source.count("pub fn exact_cell_bounds(") != 1:
              raise SystemExit("expected exactly one public exact_cell_bounds wrapper")
          match = re.search(
              r"pub fn exact_cell_bounds\(.*?\n\s*\}\n\n\s*fn contains",
