name: Power restoration service trajectory audit

on:
  pull_request:
    paths:
      - "tools/power-restoration-service-trajectory-audit/**"
      - "tools/power-restoration-benchmark-case/**"
      - "tools/power-restoration-run-receipt/**"
      - ".github/workflows/power-restoration-service-trajectory-audit.yml"
  push:
    paths:
      - "tools/power-restoration-service-trajectory-audit/**"
      - ".github/workflows/power-restoration-service-trajectory-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-trajectory-audit:
    name: Reconcile service evidence and weighted delivered kWh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate service trajectory schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("tools/power-restoration-service-trajectory-audit/fixtures/service-trajectory-v0.1.schema.json")
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          print("PASS: service trajectory JSON Schema is valid")
          PY
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/power-restoration-service-trajectory-audit/Cargo.toml --all -- --check
      - name: Resolve dependency graph
        run: cargo generate-lockfile --manifest-path tools/power-restoration-service-trajectory-audit/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/power-restoration-service-trajectory-audit/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --manifest-path tools/power-restoration-service-trajectory-audit/Cargo.toml --all-targets
