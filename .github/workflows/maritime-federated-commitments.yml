name: maritime-federated-commitments

on:
  push:
    paths:
      - "research/maritime-federated-commitments/**"
      - ".github/workflows/maritime-federated-commitments.yml"
  pull_request:
    paths:
      - "research/maritime-federated-commitments/**"
      - ".github/workflows/maritime-federated-commitments.yml"

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path research/maritime-federated-commitments/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --manifest-path research/maritime-federated-commitments/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/maritime-federated-commitments/Cargo.toml --all-targets -- -D warnings
