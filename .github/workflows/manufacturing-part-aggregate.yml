name: Manufacturing part-level conformity aggregation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/manufacturing-conformity/part_aggregate.rs"
      - "tools/manufacturing-conformity/part-aggregate-README.md"
      - ".github/workflows/manufacturing-part-aggregate.yml"
  push:
    branches: [main]
    paths:
      - "tools/manufacturing-conformity/part_aggregate.rs"
      - "tools/manufacturing-conformity/part-aggregate-README.md"
      - ".github/workflows/manufacturing-part-aggregate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  part-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run part/receipt-chain tests with warnings denied
        run: |
          rustc --version
          rustc --edition=2024 -D warnings --test tools/manufacturing-conformity/part_aggregate.rs -o "$RUNNER_TEMP/part-aggregate-tests"
          "$RUNNER_TEMP/part-aggregate-tests"
      - name: Build and verify frozen aggregation campaign
        run: |
          rustc --edition=2024 -D warnings tools/manufacturing-conformity/part_aggregate.rs -o "$RUNNER_TEMP/part-aggregate"
          "$RUNNER_TEMP/part-aggregate" --verify
      - name: Compare deterministic report output and emit digests
        run: |
          "$RUNNER_TEMP/part-aggregate" --csv > "$RUNNER_TEMP/part-a.csv"
          "$RUNNER_TEMP/part-aggregate" --csv > "$RUNNER_TEMP/part-b.csv"
          diff -u "$RUNNER_TEMP/part-a.csv" "$RUNNER_TEMP/part-b.csv"
          sha256sum tools/manufacturing-conformity/part_aggregate.rs "$RUNNER_TEMP/part-a.csv"
          cat "$RUNNER_TEMP/part-a.csv"
