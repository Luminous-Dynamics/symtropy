name: AeroWeft PNT Reachability Adapter

on:
  pull_request:
    paths:
      - "tools/aeroweift-pnt-reachability-adapter/**"
      - "tools/aeroweift-reachability/**"
      - "fixtures/aeroweift-pnt-reachability/**"
      - ".github/workflows/aeroweift-pnt-reachability-adapter.yml"
  push:
    branches:
      - "research/aeroweFt-pnt-reachability-001"
    paths:
      - "tools/aeroweift-pnt-reachability-adapter/**"
      - "tools/aeroweift-reachability/**"
      - "fixtures/aeroweift-pnt-reachability/**"
      - ".github/workflows/aeroweift-pnt-reachability-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeroweift-pnt-reachability-adapter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/aeroweift-pnt-reachability-adapter/Cargo.toml
      - name: Export temporary rustfmt patch
        if: always()
        run: git diff --binary -- tools/aeroweift-pnt-reachability-adapter > /tmp/rustfmt.patch
      - name: Upload temporary rustfmt patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeroweift-rustfmt-pnt
          path: /tmp/rustfmt.patch
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/aeroweift-pnt-reachability-adapter/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/aeroweift-pnt-reachability-adapter/Cargo.toml
