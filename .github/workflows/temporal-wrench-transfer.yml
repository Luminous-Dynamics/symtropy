name: Temporal Wrench Transfer

on:
  pull_request:
    branches: [main]
    paths:
      - "research/temporal-wrench-transfer/v0.1/**"
      - ".github/workflows/temporal-wrench-transfer.yml"
  push:
    branches: [main]
    paths:
      - "research/temporal-wrench-transfer/v0.1/**"
      - ".github/workflows/temporal-wrench-transfer.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 temporal transfer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/temporal-wrench-transfer/v0.1/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/temporal-wrench-transfer/v0.1/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/temporal-wrench-transfer/v0.1/Cargo.toml --locked --all-targets -- -D warnings
