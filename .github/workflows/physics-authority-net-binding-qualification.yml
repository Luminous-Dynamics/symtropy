name: PHYS-ID-01B2A Authority NetId Binding Qualification

on:
  push:
    branches:
      - "ci/physics-authority-net-binding-v0.1"

permissions:
  contents: read

concurrency:
  group: physics-authority-net-binding-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 317b34d02b61e69c4904dba78c13ecf47fb8c669
  PHYS_ID01B1_PARENT: f53c9ff9cc2d7fbc3724b43b92dc7dae005c19f9

jobs:
  qualify:
    name: Frozen PHYS-ID-01B2A / Rust 1.96
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 0

      - name: Assert exact subject ancestry and delta
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          test "$(git rev-parse HEAD^)" = "${PHYS_ID01B1_PARENT}"
          count="$(git rev-list --count "${PHYS_ID01B1_PARENT}..${PRODUCT_HEAD}")"
          echo "phys_id01b2a_commits_above_parent=${count}"
          test "${count}" = "1"
          mapfile -t changed < <(git diff --name-only "${PHYS_ID01B1_PARENT}..${PRODUCT_HEAD}" | sort)
          expected=(
            "crates/core/symtropy-physics/PHYSICAL_AUTHORITY_NET_BINDING_V01.md"
            "crates/core/symtropy-physics/src/identity_authority.rs"
            "crates/core/symtropy-physics/tests/world_identity_authority_v01.rs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" = "${#expected_sorted[@]}"
          for i in "${!changed[@]}"; do test "${changed[$i]}" = "${expected_sorted[$i]}"; done

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Freeze source identities
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symtropy-physics/src/body.rs \
            crates/core/symtropy-physics/src/world.rs \
            crates/core/symtropy-physics/src/identity_authority.rs \
            crates/core/symtropy-physics/src/identity_mutation.rs \
            crates/core/symtropy-physics/tests/world_identity_authority_v01.rs \
            crates/core/symtropy-physics/tests/net_identity_mutation_v01.rs \
            crates/core/symtropy-physics/PHYSICAL_AUTHORITY_NET_BINDING_V01.md \
            > "${RUNNER_TEMP}/phys-id01b2a-source-sha256.txt"

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check

      - name: Compile entire workspace
        id: workspace_check
        run: cargo check --workspace --locked --all-targets

      - name: Run authority-owned identity corpus
        id: identity
        run: cargo test -p symtropy-physics --locked --test world_identity_authority_v01

      - name: Run checked mutation corpus
        id: mutation
        run: cargo test -p symtropy-physics --locked --test net_identity_mutation_v01

      - name: Run complete symtropy-physics library regression
        id: physics_tests
        run: cargo test -p symtropy-physics --locked --lib

      - name: Run existing replay harness
        id: replay
        run: cargo test -p symtropy-physics --locked --test replay_harness

      - name: Run strict physics Clippy
        id: clippy
        run: cargo clippy -p symtropy-physics --locked --all-targets --all-features -- -D warnings

      - name: Audit authority-owned binding boundary
        id: authority_audit
        shell: bash
        run: |
          set -euo pipefail
          authority=crates/core/symtropy-physics/src/identity_authority.rs
          public_test=crates/core/symtropy-physics/tests/world_identity_authority_v01.rs
          contract=crates/core/symtropy-physics/PHYSICAL_AUTHORITY_NET_BINDING_V01.md

          grep -Fq 'pub fn bind_net_id(' "${authority}"
          grep -Fq 'assign_net_id_checked(&mut self.world, handle, net_id)?;' "${authority}"
          grep -Fq 'pub fn add_bodies_deterministic(' "${authority}"
          grep -Fq 'add_bodies_deterministic_checked(&mut self.world, bodies)?;' "${authority}"
          grep -Fq 'Result<PhysicsBodySubject, NetIdentityMutationError>' "${authority}"
          grep -Fq 'Result<Vec<(BodyHandle, PhysicsBodySubject)>, NetIdentityMutationError>' "${authority}"

          if grep -Fq 'set_net_id(' "${public_test}"; then
            echo 'public authority integration test still constructs valid fixtures with legacy set_net_id' >&2
            exit 1
          fi
          grep -Fq 'raw.set_net_id(' "${authority}"
          grep -Fq 'duplicate_live_net_id_fails_closed_even_if_index_points_to_one_body' "${authority}"
          grep -Fq 'subject remains an exact live-authority/generation reference' "${contract}"
          grep -Fq 'public `PhysicsWorld::set_net_id`' "${contract}"
          grep -Fq 'Queued, skipped, or runnerless CI is not evidence of qualification.' "${contract}"

      - name: Assert unchanged frozen subject
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git diff --exit-code -- . ':!Cargo.lock'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SUBJECT: ${{ steps.subject.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          FMT: ${{ steps.fmt.outcome }}
          WORKSPACE_CHECK: ${{ steps.workspace_check.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          MUTATION: ${{ steps.mutation.outcome }}
          PHYSICS_TESTS: ${{ steps.physics_tests.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          AUDIT: ${{ steps.authority_audit.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/phys-id01b2a-authority-net-binding-v01.json"
          export RECEIPT_PATH="${receipt}"
          python3 - <<'PY'
          import json, os
          keys = ["SUBJECT","SOURCE","FMT","WORKSPACE_CHECK","IDENTITY","MUTATION","PHYSICS_TESTS","REPLAY","CLIPPY","AUDIT","POSTFLIGHT"]
          outcomes = {k.lower(): os.environ.get(k, "unknown") for k in keys}
          receipt = {
              "receipt_version": 1,
              "qualification": "PHYS-ID-01B2A-authority-net-binding-v0.1",
              "product_head": os.environ["PRODUCT_HEAD"],
              "phys_id01b1_parent": os.environ["PHYS_ID01B1_PARENT"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "PhysicsAuthorityWorld provides the preferred checked live NetId binding path and returns exact authority/generation-bound PhysicsBodySubject values; legacy raw-world mutators and structural body storage remain outside the claim",
          }
          with open(os.environ["RECEIPT_PATH"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write("\n")
          PY
          cp "${RUNNER_TEMP}/phys-id01b2a-source-sha256.txt" "${RUNNER_TEMP}/phys-id01b2a-source-sha256-evidence.txt"
          sha256sum "${receipt}" > "${receipt}.sha256"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phys-id01b2a-authority-net-binding-v01-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/phys-id01b2a-authority-net-binding-v01.json
            ${{ runner.temp }}/phys-id01b2a-authority-net-binding-v01.json.sha256
            ${{ runner.temp }}/phys-id01b2a-source-sha256-evidence.txt
          if-no-files-found: error
          retention-days: 90
