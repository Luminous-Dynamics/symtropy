name: Hybrid APPJ methane process evidence audit

on:
  push:
    branches:
      - research/hybrid-appj-methane-process-twin-v0-1
    paths:
      - "crates/tools/hybrid-appj-methane-evaluator/**"
      - "benchmarks/plasma/appj-methane-process-v0.json"
      - ".github/workflows/hybrid-appj-methane-evaluator.yml"
  pull_request:
    paths:
      - "crates/tools/hybrid-appj-methane-evaluator/**"
      - "benchmarks/plasma/appj-methane-process-v0.json"
      - ".github/workflows/hybrid-appj-methane-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/hybrid-appj-methane-evaluator/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/hybrid-appj-methane-evaluator/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/hybrid-appj-methane-evaluator/Cargo.toml --all-targets -- -D warnings
      - name: Audit APPJ process fixture
        run: cargo run --locked --manifest-path crates/tools/hybrid-appj-methane-evaluator/Cargo.toml -- benchmarks/plasma/appj-methane-process-v0.json
