name: CIV-INFRA Held-Out Calibration Benchmark

on:
  pull_request:
    paths:
      - "tools/civ-infra-heldout-calibration/**"
      - ".github/workflows/civ-infra-heldout-calibration.yml"
      - "docs/tech/CIV_INFRA_HELDOUT_CALIBRATION_V0_1.md"
  push:
    branches: ["main"]
    paths:
      - "tools/civ-infra-heldout-calibration/**"
      - ".github/workflows/civ-infra-heldout-calibration.yml"
      - "docs/tech/CIV_INFRA_HELDOUT_CALIBRATION_V0_1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Record exact source and toolchain
        run: |
          rustc --version --verbose
          cargo --version
          git rev-parse HEAD

      - name: Check format
        run: cargo fmt --manifest-path tools/civ-infra-heldout-calibration/Cargo.toml -- --check

      - name: Run locked unit tests
        run: cargo test --locked --manifest-path tools/civ-infra-heldout-calibration/Cargo.toml

      - name: Emit frozen report and assert claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          fixture="tools/civ-infra-heldout-calibration/fixtures/calibration-v0.1.json"
          expected_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          report="$RUNNER_TEMP/civ-infra-heldout-calibration-report.json"
          cargo run --locked --manifest-path tools/civ-infra-heldout-calibration/Cargo.toml -- "$fixture" "$report"
          jq -e --arg expected_sha "$expected_sha" '
            .schema_version == "civ-infra-heldout-calibration/v0.1" and
            .input_sha256 == $expected_sha and
            (.split_manifest_sha256 | test("^[0-9a-f]{64}$")) and
            .calibration_record_count == 3 and
            .holdout_record_count == 3 and
            .qualified_holdout_count == 3 and
            .out_of_domain_holdout_count == 0 and
            .envelope.lower_residual_ticks == -3 and
            .envelope.upper_residual_ticks == 8 and
            .heldout_residual_covered_count == 3 and
            .heldout_residual_miss_count == 0 and
            .heldout_coverage_denominator == 3 and
            .false_robust_feasible_count == 0 and
            .reference_interval_truth_miss_count == 0 and
            (.evidence_semantics | contains("does not retrieve")) and
            (.claim_ceiling | contains("no_physical_bound"))
          ' "$report"
