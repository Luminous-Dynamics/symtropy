name: Robotics Episode Integrity (Synthetic Only)

on:
  pull_request:
    branches:
      - "docs/wood-robot-platform-portfolio-v0-1"
      - "research/robotics-qualification-oracle-v0"
    paths:
      - "docs/tech/ROBOTICS_EPISODE_INTEGRITY_CONTRACT_V0.md"
      - "docs/tech/robotics-plan-episode-integrity-corpus-v0.1.json"
      - "tools/robotics-episode-integrity/**"
      - ".github/workflows/robotics-episode-integrity.yml"
  push:
    branches:
      - "research/robotics-episode-integrity-v0"

permissions:
  contents: read

concurrency:
  group: robotics-episode-integrity-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  episode-integrity:
    name: Stale-plan / episode integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path tools/robotics-episode-integrity/Cargo.toml -- --check

      - name: Focused episode and metamorphic tests
        run: cargo test --manifest-path tools/robotics-episode-integrity/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/robotics-episode-integrity/Cargo.toml --all-targets -- -D warnings

      - name: Emit exact-input receipt
        env:
          ROBOTICS_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path tools/robotics-episode-integrity/Cargo.toml -- docs/tech/robotics-plan-episode-integrity-corpus-v0.1.json > /tmp/robotics-episode-receipt.json
          cat /tmp/robotics-episode-receipt.json
          grep -q '"execution_mode": "plan_eligibility_only_no_actuation"' /tmp/robotics-episode-receipt.json
          grep -q "\"tested_revision\": \"$ROBOTICS_TESTED_SHA\"" /tmp/robotics-episode-receipt.json
          {
            echo "Tested PR head: ${ROBOTICS_TESTED_SHA}"
            echo "Rust: $(rustc --version)"
            echo "Manifest SHA-256: $(sha256sum tools/robotics-episode-integrity/Cargo.toml | cut -d' ' -f1)"
            echo "Corpus SHA-256: $(sha256sum docs/tech/robotics-plan-episode-integrity-corpus-v0.1.json | cut -d' ' -f1)"
            echo "Lockfile SHA-256: $(sha256sum tools/robotics-episode-integrity/Cargo.lock | cut -d' ' -f1)"
            echo ""
            echo "Synthetic temporal qualification only; all physical actuation remains forbidden."
            echo ""
            cat /tmp/robotics-episode-receipt.json
          } >> "$GITHUB_STEP_SUMMARY"
