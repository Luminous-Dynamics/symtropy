name: SIM-REL-045 Anytime Paired Evidence PR Qualification

on:
  pull_request:
    branches:
      - research/sim-rel-044-causal-thermal-execution-bridge-2026-11-02
    paths:
      - "tools/sim-rel-action-realization-filter/src/decision_value.rs"
      - "tools/sim-rel-action-realization-filter/src/decision_value/**"
      - "tools/sim-rel-action-realization-filter/ANYTIME_VALID_PAIRED_EVIDENCE_PROTOCOL.md"
      - ".github/workflows/sim-rel-045-anytime-paired-pr.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: exact e-process, martingale, optional stopping, family allocation and full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-045-anytime-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml -- --check
      - name: Focused anytime paired evidence tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib decision_value::anytime_paired_evidence
      - name: Full locked crate tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib -- -D warnings
      - name: Verify exact PR head and clean tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
