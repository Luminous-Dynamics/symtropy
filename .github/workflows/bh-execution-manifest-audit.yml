name: Black-hole execution manifest audit

on:
  push:
    branches:
      - research/bh-response-manifest-paired-comparisons-v0.2
    paths:
      - "tools/bh-execution-manifest/**"
      - ".github/workflows/bh-execution-manifest-audit.yml"
  pull_request:
    paths:
      - "tools/bh-execution-manifest/**"
      - ".github/workflows/bh-execution-manifest-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path tools/bh-execution-manifest/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/bh-execution-manifest/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/bh-execution-manifest/Cargo.toml --all-targets
