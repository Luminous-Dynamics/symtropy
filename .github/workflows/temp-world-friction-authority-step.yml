          path.write_text(source)

          test_path = Path("crates/core/symtropy-physics/tests/world_friction_authority.rs")
          if test_path.exists():
              raise SystemExit("world friction authority regression unexpectedly already exists")
          test_path.write_text(r'''// Copyright (C) 2024-2026 Tristan Stoltz / Luminous Dynamics
          // SPDX-License-Identifier: Apache-2.0 OR MIT
          // Commercial licensing: see COMMERCIAL_LICENSE.md at repository root

          use std::convert::Infallible;

          use nalgebra::SVector;
          use symtropy_math::Point;
          use symtropy_physics::{
              BodyHandle, CollisionEvent, DirectFrictionImpulseAuthority, FrictionAuthorityFailure,
              FrictionImpulseAuthority, FrictionSolverCoordinates, FrictionStepError, PhysicsCallback,
              PhysicsWorld, RigidBody,
          };

          #[derive(Default)]
          struct TrackingCallback {
              dissipation_joules: f64,
              collision_count: usize,
          }

          impl PhysicsCallback<2> for TrackingCallback {
              fn modulate_force(&self, _: BodyHandle, force: &SVector<f64, 2>) -> SVector<f64, 2> {
                  *force
              }

              fn modulate_impulse(&self, impulse: f64, _: &SVector<f64, 2>) -> f64 {
                  impulse
              }

              fn friction_multiplier(&self, _: &SVector<f64, 2>, _: BodyHandle) -> f64 {
                  1.0
              }

              fn on_collision(&mut self, _: &CollisionEvent<2>) {
                  self.collision_count += 1;
              }

              fn record_dissipation(&mut self, energy: f64) {
                  self.dissipation_joules += energy;
              }

              fn record_work(&mut self, _: BodyHandle, _: f64) {}

              fn apply_trauma(&mut self, _: &CollisionEvent<2>) {}
          }

          fn friction_world() -> (PhysicsWorld<2>, BodyHandle, BodyHandle) {
              let mut world = PhysicsWorld::<2>::new(SVector::zeros());
              world.solver_iterations = 3;
              let body_a = world.add_sphere(Point::new([-0.9, 0.0]), 1.0, 1.0);
              let body_b = world.add_sphere(Point::new([0.9, 0.0]), 1.0, 1.0);

              world.body_mut(body_a).unwrap().friction = 1.0;
              world.body_mut(body_b).unwrap().friction = 1.0;
              world.body_mut(body_a).unwrap().restitution = 0.0;
              world.body_mut(body_b).unwrap().restitution = 0.0;
              world.body_mut(body_a).unwrap().linear_velocity = SVector::from([1.0, 0.75]);
              world.body_mut(body_b).unwrap().linear_velocity = SVector::from([-1.0, -0.75]);

              (world, body_a, body_b)
          }

          #[derive(Default)]
          struct RecordingDirectAuthority {
              direct: DirectFrictionImpulseAuthority,
              seen: Vec<(BodyHandle, BodyHandle, FrictionSolverCoordinates)>,
          }

          impl FrictionImpulseAuthority<2> for RecordingDirectAuthority {
              type Error = Infallible;

              fn execute_friction_impulse(
                  &mut self,
                  body_a: &mut RigidBody<2>,
                  body_b: &mut RigidBody<2>,
                  contact_point: &SVector<f64, 2>,
                  impulse_on_b: &SVector<f64, 2>,
                  coordinates: FrictionSolverCoordinates,
              ) -> Result<(), Self::Error> {
                  self.seen.push((body_a.handle, body_b.handle, coordinates));
                  self.direct.execute_friction_impulse(
                      body_a,
                      body_b,
                      contact_point,
                      impulse_on_b,
                      coordinates,
                  )
              }
          }

          #[test]
          fn authority_world_path_preserves_legacy_mechanics_but_not_pseudo_energy_telemetry() {
              let (mut legacy, legacy_a, legacy_b) = friction_world();
              let (mut checked, checked_a, checked_b) = friction_world();
              let mut legacy_callback = TrackingCallback::default();
              let mut checked_callback = TrackingCallback::default();
              let mut authority = RecordingDirectAuthority::default();

              legacy.step_with_callback(1.0 / 120.0, &mut legacy_callback);
              checked
                  .step_with_callback_and_friction_authority(
                      1.0 / 120.0,
                      &mut checked_callback,
                      &mut authority,
                  )
                  .unwrap();

              assert!(!authority.seen.is_empty(), "expected real solver friction authority calls");
              assert!(legacy_callback.dissipation_joules > 0.0);
              assert_eq!(checked_callback.dissipation_joules, 0.0);

              for (legacy_handle, checked_handle) in [(legacy_a, checked_a), (legacy_b, checked_b)] {
                  let legacy_body = legacy.body(legacy_handle).unwrap();
                  let checked_body = checked.body(checked_handle).unwrap();
                  assert_eq!(legacy_body.linear_velocity, checked_body.linear_velocity);
                  assert_eq!(legacy_body.angular_velocity, checked_body.angular_velocity);
              }

              let coordinates: Vec<_> = authority.seen.iter().map(|(_, _, c)| *c).collect();
              assert!(coordinates.windows(2).all(|pair| pair[0] < pair[1]));
              assert!(coordinates.iter().all(|c| c.contact_sequence == 0));
              assert!(coordinates.iter().all(|c| c.point_sequence == 0));
              assert!(coordinates.iter().all(|c| c.solver_iteration < 3));
          }

          struct RejectingAuthority {
              calls: usize,
          }

          impl FrictionImpulseAuthority<2> for RejectingAuthority {
              type Error = &'static str;

              fn execute_friction_impulse(
                  &mut self,
                  _body_a: &mut RigidBody<2>,
                  _body_b: &mut RigidBody<2>,
                  _contact_point: &SVector<f64, 2>,
                  _impulse_on_b: &SVector<f64, 2>,
                  _coordinates: FrictionSolverCoordinates,
              ) -> Result<(), Self::Error> {
                  self.calls += 1;
                  Err("blocked")
              }
          }

          #[test]
          fn authority_rejection_stops_at_first_exact_solver_coordinate_without_pseudo_energy() {
              let (mut world, body_a, body_b) = friction_world();
              let mut callback = TrackingCallback::default();
              let mut authority = RejectingAuthority { calls: 0 };

              let error = world
                  .step_with_callback_and_friction_authority(
                      1.0 / 120.0,
                      &mut callback,
                      &mut authority,
                  )
                  .unwrap_err();

              assert_eq!(authority.calls, 1);
              assert_eq!(callback.dissipation_joules, 0.0);
              assert_eq!(callback.collision_count, 0);
              assert_eq!(
                  error,
                  FrictionStepError::Authority(FrictionAuthorityFailure {
                      body_a,
                      body_b,
                      coordinates: FrictionSolverCoordinates::new(0, 0, 0),
                      error: "blocked",
                  })
              );
          }
          ''')

          if source.count("step_with_callback_and_friction_authority") < 2:
              raise SystemExit("authority-aware world API missing after patch")
          if "integrator::apply_impulse(&mut self.bodies[a], &(-friction_impulse));" in source:
              raise SystemExit("old direct friction mutation still present")
          if source.count("j_t.abs() * 0.1") != 2:
              # one in the legacy API doc and one guarded executable expression
              raise SystemExit("unexpected pseudo-dissipation expression count")
          PY

          cargo fmt --all -- --check
          cargo test -p symtropy-physics --test world_friction_authority --test callback_contract
          cargo test -p symtropy-physics friction_solver_execution::
