                  };
          ''',
          '''    fn resolve_contact<E>(
                  &mut self,
                  mut contact: ContactManifold<D>,
                  dt: f64,
                  callback: &mut dyn PhysicsCallback<D>,
                  friction_executor: &mut E,
                  solver_iteration: usize,
                  contact_sequence: usize,
              ) -> Result<ContactManifold<D>, E::Error>
              where
                  E: SolverFrictionExecutor<D>,
              {
                  let (idx_a, idx_b) = self.find_body_indices(contact.body_a, contact.body_b);
                  let (Some(a), Some(b)) = (idx_a, idx_b) else {
                      return Ok(contact);
                  };
                  if a == b {
                      return Ok(contact);
                  }
