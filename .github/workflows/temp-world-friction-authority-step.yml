              /// Step through an explicit friction authority while retaining the normal
              /// consciousness-physics callback for force/normal-impulse modulation.
              ///
              /// Native solver coordinates are losslessly converted before every
              /// authority call. An authority error is fail-stop, not a transactional
              /// rollback of the whole physics world: integration and earlier solver
              /// work in this step may already have occurred. Callers must therefore
              /// reject/poison the enclosing fixed-tick consequence on `Err`.
              ///
              /// Unlike the legacy stepping surface, this path never emits the
              /// dimensionally invalid `record_dissipation(|J| * 0.1)` telemetry.
              pub fn step_with_callback_and_friction_authority<A>(
                  &mut self,
                  dt: f64,
                  callback: &mut dyn PhysicsCallback<D>,
                  authority: &mut A,
              ) -> Result<(), FrictionStepError<A::Error>>
              where
                  A: FrictionImpulseAuthority<D>,
              {
                  let mut friction_executor = CheckedFrictionExecutor::new(authority);
                  self.step_internal(dt, callback, &mut friction_executor)
              }

              /// Authority-aware pure-physics convenience wrapper.
              pub fn step_with_friction_authority<A>(
                  &mut self,
                  dt: f64,
                  authority: &mut A,
              ) -> Result<(), FrictionStepError<A::Error>>
              where
                  A: FrictionImpulseAuthority<D>,
              {
                  let mut noop = NoOpCallback;
                  self.step_with_callback_and_friction_authority(dt, &mut noop, authority)
              }

              fn step_internal<E>(
                  &mut self,
                  dt: f64,
                  callback: &mut dyn PhysicsCallback<D>,
