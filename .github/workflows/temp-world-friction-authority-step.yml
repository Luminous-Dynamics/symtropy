name: Temporary world friction authority patch

on:
  push:
    branches:
      - physics/world-friction-authority-step-v0.1
    paths:
      - .github/workflows/temp-world-friction-authority-step.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.96.0

      - name: Patch exact world source and add regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b362466b695722c5edef9b86908aae1b9eee3ba3"
          test "$(git hash-object crates/core/symtropy-physics/src/world.rs)" = "7dccf283f858c4874c96425fd7aa8aa3e176a557"

