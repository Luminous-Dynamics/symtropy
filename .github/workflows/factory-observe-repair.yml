name: Factory Observe Repair Benchmark

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "tools/factory-observe-repair/**"
      - ".github/workflows/factory-observe-repair.yml"
  push:
    branches: [ "main" ]
    paths:
      - "tools/factory-observe-repair/**"
      - ".github/workflows/factory-observe-repair.yml"

concurrency:
  group: factory-observe-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-scope:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt
    - name: Format
      run: cargo fmt --manifest-path tools/factory-observe-repair/Cargo.toml -- --check
    - name: Clippy
      run: cargo clippy --manifest-path tools/factory-observe-repair/Cargo.toml --all-targets -- -D warnings
    - name: Tests
      run: cargo test --manifest-path tools/factory-observe-repair/Cargo.toml --all-targets
