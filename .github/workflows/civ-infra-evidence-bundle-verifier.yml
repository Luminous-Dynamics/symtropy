name: CIV-INFRA Evidence Bundle Verifier

on:
  pull_request:
    paths:
      - "tools/civ-infra-evidence-bundle-verifier/**"
      - ".github/workflows/civ-infra-evidence-bundle-verifier.yml"
      - "docs/tech/CIV_INFRA_EVIDENCE_BUNDLE_V0_1.md"
  push:
    branches: ["main"]
    paths:
      - "tools/civ-infra-evidence-bundle-verifier/**"
      - ".github/workflows/civ-infra-evidence-bundle-verifier.yml"
      - "docs/tech/CIV_INFRA_EVIDENCE_BUNDLE_V0_1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Record source and toolchain
        run: |
          rustc --version --verbose
          cargo --version
          git rev-parse HEAD

      - name: Check formatting
        run: cargo fmt --manifest-path tools/civ-infra-evidence-bundle-verifier/Cargo.toml -- --check

      - name: Run locked verifier tests
        run: cargo test --locked --manifest-path tools/civ-infra-evidence-bundle-verifier/Cargo.toml

      - name: Verify frozen evidence bundle and assert receipt
        shell: bash
        run: |
          set -euo pipefail
          manifest="tools/civ-infra-evidence-bundle-verifier/fixtures/evidence-bundle-v0.1.json"
          root="tools/civ-infra-evidence-bundle-verifier/fixtures/bundle-root"
          expected_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          report="$RUNNER_TEMP/evidence-bundle-report.json"
          cargo run --locked --manifest-path tools/civ-infra-evidence-bundle-verifier/Cargo.toml -- "$manifest" "$root" "$report"
          jq -e --arg expected_sha "$expected_sha" '
            .schema_version == "civ-infra-evidence-bundle/v0.1" and
            .input_manifest_sha256 == $expected_sha and
            .artifact_count == 3 and
            .verified_artifact_count == 3 and
            .failed_artifact_count == 0 and
            .qualified == true and
            all(.artifacts[]; (.issues | length) == 0 and (.actual_sha256 | test("^[0-9a-f]{64}$"))) and
            (.claim_ceiling | contains("not_authenticity"))
          ' "$report"
