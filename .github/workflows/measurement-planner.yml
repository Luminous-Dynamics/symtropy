name: Measurement Planner

on:
  pull_request:
    paths:
      - "crates/domains/symtropy-measurement-planner/**"
      - ".github/workflows/measurement-planner.yml"
  push:
    branches: [main, "stabilize/*"]
    paths:
      - "crates/domains/symtropy-measurement-planner/**"
      - ".github/workflows/measurement-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measurement-planner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/domains/symtropy-measurement-planner/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/domains/symtropy-measurement-planner/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/domains/symtropy-measurement-planner/Cargo.toml --all-targets -- -D warnings
