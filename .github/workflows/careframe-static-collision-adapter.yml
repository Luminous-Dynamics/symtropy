name: Careframe Static Collision Adapter

on:
  pull_request:
    branches:
      - "research/medical-humanoid-platform-v0"
    paths:
      - "crates/bridges/symtropy-robotics-bridge-core/**"
      - "Cargo.lock"
      - ".github/workflows/careframe-static-collision-adapter.yml"
  push:
    branches:
      - "research/careframe-static-collision-adapter-v0"

permissions:
  contents: read

concurrency:
  group: careframe-static-collision-adapter-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static-collision-import:
    name: Import static geometry only (no motors / no patient contact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check for robotics bridge core
        run: cargo fmt --manifest-path crates/bridges/symtropy-robotics-bridge-core/Cargo.toml -- --check

      - name: Run focused bridge-core tests with committed lockfile
        run: cargo test --locked -p symtropy-robotics-bridge-core

      - name: Clippy bridge core with warnings denied
        run: cargo clippy --locked -p symtropy-robotics-bridge-core --all-targets -- -D warnings

      - name: Verify lockfile contains the new direct dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > /tmp/careframe-cargo-metadata.json
          jq -e '
            .packages[] |
            select(.name == "symtropy-robotics-bridge-core") |
            any(.dependencies[]; .name == "serde_json" and .kind == null)
          ' /tmp/careframe-cargo-metadata.json

      - name: Summarize exact-head evidence ceiling
        env:
          CARE_FRAME_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Tested revision: ${CARE_FRAME_TESTED_SHA}"
            echo "Rust: $(rustc --version)"
            echo "Cargo lock SHA-256: $(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "Bridge-core manifest SHA-256: $(sha256sum crates/bridges/symtropy-robotics-bridge-core/Cargo.toml | cut -d' ' -f1)"
            echo ""
            echo "Careframe morphology is imported as static oriented-box collision proxies only."
            echo "Tests cover 16 link proxies, reference transforms, rotated pose, strict fields and fail-closed rejection."
            echo "This does not create an articulated dynamic robot, motor control, inertial model or clinical authorization."
          } >> "$GITHUB_STEP_SUMMARY"
