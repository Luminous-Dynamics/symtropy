name: SE3 Pose Trustworthiness Benchmark

on:
  pull_request:
    paths:
      - "tools/se3-pose-trustworthiness-bench/**"
      - ".github/workflows/se3-pose-trustworthiness.yml"
  push:
    branches:
      - "research/se3-pose-trustworthiness-bench-v0-1"
    paths:
      - "tools/se3-pose-trustworthiness-bench/**"
      - ".github/workflows/se3-pose-trustworthiness.yml"

permissions:
  contents: read

jobs:
  verify:
    name: SE3 covariance, calibration and selective-risk oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/se3-pose-trustworthiness-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/se3-pose-trustworthiness-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/se3-pose-trustworthiness-bench/Cargo.toml --all-targets -- -D warnings
      - name: Bind frozen corpus digest
        run: |
          echo "CORPUS_SHA256=$(sha256sum tools/se3-pose-trustworthiness-bench/fixtures/pose-trust-corpus-v0_1.csv | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Deterministic Rust receipt
        run: |
          cargo run --quiet --locked --manifest-path tools/se3-pose-trustworthiness-bench/Cargo.toml --bin se3-pose-trustworthiness-bench -- tools/se3-pose-trustworthiness-bench/fixtures/pose-trust-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/se3-rust.json
          cargo run --quiet --locked --manifest-path tools/se3-pose-trustworthiness-bench/Cargo.toml --bin se3-pose-trustworthiness-bench -- tools/se3-pose-trustworthiness-bench/fixtures/pose-trust-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/se3-rust-replay.json
          cmp /tmp/se3-rust.json /tmp/se3-rust-replay.json
      - name: Independent Python geometry and covariance oracle
        run: |
          python3 tools/se3-pose-trustworthiness-bench/tests/reference_oracle.py tools/se3-pose-trustworthiness-bench/fixtures/pose-trust-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/se3-python.json
      - name: Compare complete receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/se3-rust.json").read_text())
          oracle = json.loads(Path("/tmp/se3-python.json").read_text())
          assert rust == oracle
          assert rust["case_count"] == 45
          assert rust["expected_disposition_matches"] == 45
          assert rust["expected_disposition_mismatches"] == 0
          assert rust["covariance_order"] == "BODY_LOCAL_TRANSLATION_XYZ_ROTATION_VECTOR_XYZ"
          assert rust["covariance_units"] == "m,m,m,rad,rad,rad"
          assert rust["claim_ready"] is False
          assert rust["source_bytes_authenticated"] is False
          assert rust["physical_calibration_validated"] is False
          assert rust["maneuver_authority_granted"] is False
          cases = {item["case_id"]: item for item in rust["results"]}
          assert cases["ST001"]["disposition"] == "EVALUATED"
          assert cases["ST004"]["rotation_error_rad"] == "0.000000000000"
          assert cases["ST006"]["false_confident_95"] is True
          assert cases["ST007"]["observability_policy_violation"] is True
          assert cases["ST008"]["disposition"] == "ABSTAINED"
          assert cases["ST013"]["disposition"] == "INVALID_COVARIANCE"
          assert cases["ST039"]["disposition"] == "DUPLICATE_SAMPLE"
          assert cases["ST041"]["disposition"] == "SPLIT_LEAKAGE"
          assert cases["ST043"]["benchmark_admissible"] is True
          assert cases["ST043"]["observability_policy_violation"] is False
          assert cases["ST044"]["false_confident_95"] is True
          assert cases["ST045"]["disposition"] == "OUT_OF_SCOPE"
          assert rust["summary"]["risk_coverage"]
          assert rust["summary"]["accepted_pose_coverage_fraction"] is not None
          assert rust["summary"]["accepted_covariance_logdet_median"] is not None
          assert rust["summary"]["accepted_95_region_log_volume_median"] is not None
          print("45 SE3 trust cases: exact Rust/Python receipt equality")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: se3-pose-trustworthiness-evidence
          path: |
            /tmp/se3-rust.json
            /tmp/se3-python.json
            tools/se3-pose-trustworthiness-bench/fixtures/pose-trust-corpus-v0_1.csv
          if-no-files-found: error
          retention-days: 30
