name: HMR-0 Tool Manifest Qualification (Synthetic Only)

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/tech/HMR0_TOOL_FORGE_QUALIFICATION_CONTRACT_V0.md"
      - "docs/tech/hmr0-tool-candidate-corpus-v0.1.json"
      - "tools/medical-robot-tool-qualification/**"
      - ".github/workflows/medical-robot-tool-qualification.yml"
  push:
    branches:
      - "research/medical-robot-tool-qualification-v0"

permissions:
  contents: read

concurrency:
  group: hmr0-tool-qualification-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tool-qualification:
    name: Synthetic tool manifest qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path tools/medical-robot-tool-qualification/Cargo.toml -- --check

      - name: Unit and adversarial tests
        run: cargo test --manifest-path tools/medical-robot-tool-qualification/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/medical-robot-tool-qualification/Cargo.toml --all-targets -- -D warnings

      - name: Emit manifest qualification receipt
        env:
          MED_TOOL_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path tools/medical-robot-tool-qualification/Cargo.toml -- docs/tech/hmr0-tool-candidate-corpus-v0.1.json > /tmp/hmr0-tool-receipt.json
          cat /tmp/hmr0-tool-receipt.json
          grep -q '"physical_actuation_authorized": false' /tmp/hmr0-tool-receipt.json
          grep -q '"patient_contact_authorized": false' /tmp/hmr0-tool-receipt.json
          grep -q "\"tested_revision\": \"$MED_TOOL_TESTED_SHA\"" /tmp/hmr0-tool-receipt.json
          {
            echo "Exact tested revision: ${MED_TOOL_TESTED_SHA}"
            echo "Rust: $(rustc --version)"
            echo "Manifest SHA-256: $(sha256sum tools/medical-robot-tool-qualification/Cargo.toml | cut -d' ' -f1)"
            echo "Corpus SHA-256: $(sha256sum docs/tech/hmr0-tool-candidate-corpus-v0.1.json | cut -d' ' -f1)"
            echo "Lockfile SHA-256: $(sha256sum tools/medical-robot-tool-qualification/Cargo.lock | cut -d' ' -f1)"
            echo "Only simulation-review eligibility is measured. No physical actuation, patient contact, or clinical function is authorized."
            cat /tmp/hmr0-tool-receipt.json
          } >> "$GITHUB_STEP_SUMMARY"
