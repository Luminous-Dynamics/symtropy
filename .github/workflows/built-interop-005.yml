name: BUILT-INTEROP-005 IFC Schema Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/built-interop-005/**"
      - ".github/workflows/built-interop-005.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/built-interop-005/**"
      - ".github/workflows/built-interop-005.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: built-interop-005-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-gate:
    name: Build, test and lint declared-schema gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      # Bootstrap only: commit the generated lock after the first run, then
      # replace this step with a checksum assertion and keep --locked below.
      - name: Generate candidate lockfile (bootstrap)
        run: |
          cargo generate-lockfile --manifest-path tools/built-interop-005/Cargo.toml
          sha256sum tools/built-interop-005/Cargo.lock
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 tools/built-interop-005/Cargo.lock
          echo
          echo "LOCKFILE_BASE64_END"
      - name: Check formatting
        run: cargo fmt --manifest-path tools/built-interop-005/Cargo.toml -- --check
      - name: Run synthetic schema gate tests
        run: cargo test --locked --manifest-path tools/built-interop-005/Cargo.toml
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/built-interop-005/Cargo.toml --all-targets -- -D warnings
