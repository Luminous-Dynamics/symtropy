name: Aero Replenishment Recourse

on:
  push:
    branches: ["main"]
    paths:
      - "research/aero-replenishment-recourse-v0/**"
      - "tools/aero-replenishment-recourse/**"
      - ".github/workflows/aero-replenishment-recourse.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/aero-replenishment-recourse-v0/**"
      - "tools/aero-replenishment-recourse/**"
      - ".github/workflows/aero-replenishment-recourse.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test non-anticipative replenishment policy oracle
        run: cargo test --locked --manifest-path tools/aero-replenishment-recourse/Cargo.toml
      - name: Evaluate synthetic robust policy alternatives
        run: cargo run --locked --manifest-path tools/aero-replenishment-recourse/Cargo.toml -- research/aero-replenishment-recourse-v0/synthetic-scenarios.tsv
