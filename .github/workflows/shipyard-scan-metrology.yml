name: Shipyard Scan Metrology

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-scan-metrology/**"
      - "benchmarks/shipyard/scan-metrology/**"
      - "docs/tech/SHIPYARD_SCAN_METROLOGY_V0_1*"
      - "rust-toolchain.toml"
      - ".github/workflows/shipyard-scan-metrology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-scan-metrology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic scan-pair metrology oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-scan-metrology/Cargo.toml --all -- --check

      - name: Run scan-pair metrology unit and mutation tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-scan-metrology/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-scan-metrology/Cargo.toml --all-targets -- -D warnings

      - name: Reproduce frozen paired-profile known answer
        run: cargo run --locked --manifest-path crates/tools/shipyard-scan-metrology/Cargo.toml -- benchmarks/shipyard/scan-metrology/paired-profile-v0.1.json

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
