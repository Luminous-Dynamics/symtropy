name: CivDyn causal-path conformance reference

on:
  pull_request:
    paths:
      - "research/civdyn-causal-path/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-causal-path.yml"
  push:
    paths:
      - "research/civdyn-causal-path/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-causal-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute ledger-backed causal path
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-causal-path/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-causal-path/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-causal-path/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-causal-path/Cargo.toml --all-targets

      - name: Execute ledger-backed paired intervention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-causal-path-evidence
          cargo run --locked --manifest-path research/civdyn-causal-path/Cargo.toml --bin causal-path-sweep \
            | tee target/civdyn-causal-path-evidence/causal-path.csv

      - name: Verify path continuity, ledger outcome and negative control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-causal-path-evidence/causal-path.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 9, f"expected 3 arm + 4 edge + 1 paired + 1 negative rows, got {len(rows)}"
          assert all(len(row) == 16 for row in rows)

          arms = {row["arm_id"]: row for row in rows if row["record_type"] == "arm_outcome"}
          assert set(arms) == {"control", "treatment", "negative_control"}
          assert float(arms["control"]["value"]) == 0.0
          assert float(arms["treatment"]["value"]) == 1.0
          assert float(arms["negative_control"]["value"]) == 0.0
          assert float(arms["control"]["reservoir_closing_water_m3"]) == 20.0
          assert float(arms["treatment"]["reservoir_closing_water_m3"]) == 10.0
          assert float(arms["negative_control"]["reservoir_closing_water_m3"]) == 20.0
          assert float(arms["treatment"]["household_served_water_m3"]) == 10.0
          assert all(row["source_record_id"].startswith("resource-ledger:") for row in arms.values())
          assert all(float(row["max_water_conservation_residual_m3"]) < 1e-9 for row in arms.values())

          edges = [row for row in rows if row["record_type"] == "path_edge"]
          assert len(edges) == 4
          assert all(row["complete"] if "complete" in row else row["path_complete"] == "true" for row in edges)
          assert all(row["transition_applied"] == "true" for row in edges)

          paired = next(row for row in rows if row["record_type"] == "paired_effect")
          assert paired["qualified"] == "true"
          assert paired["path_complete"] == "true"
          assert paired["value"] == "1.000000"
          assert paired["first_broken_edge"] == ""

          negative = next(row for row in rows if row["record_type"] == "negative_control")
          assert negative["qualified"] == "true"
          assert float(negative["value"]) == 0.0
          assert negative["control_outcome"] == negative["treatment_outcome"]

          print("CIVDYN causal path, single-intervention match, independent ledger outcome, conservation and negative control verified.")
          PY

          {
            echo "## CIVDYN causal-path execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-causal-path-evidence/causal-path.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: deterministic model path conformance, not empirical causal identification"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload causal-path evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-causal-path
          path: target/civdyn-causal-path-evidence/causal-path.csv
          if-no-files-found: error
          retention-days: 30
