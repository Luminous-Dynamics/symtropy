name: One-shot Rust 1.96 formatting (shipyard assurance stack)

on:
  push:
    branches:
      - "research/shipyard-assurance-stack-v1-20261112"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Format shipyard-weld-physics-vvuq
        run: cargo fmt --manifest-path crates/tools/shipyard-weld-physics-vvuq/Cargo.toml --all

      - name: Format shipyard-distortion-co-design
        run: cargo fmt --manifest-path crates/tools/shipyard-distortion-co-design/Cargo.toml --all

      - name: Format shipyard-tandem-gmaw-admission
        run: cargo fmt --manifest-path crates/tools/shipyard-tandem-gmaw-admission/Cargo.toml --all

      - name: Format shipyard-interpass-adaptive
        run: cargo fmt --manifest-path crates/tools/shipyard-interpass-adaptive/Cargo.toml --all

      - name: Format shipyard-scan-metrology
        run: cargo fmt --manifest-path crates/tools/shipyard-scan-metrology/Cargo.toml --all

      - name: Format shipyard-geometry-metrology-oracle
        run: cargo fmt --manifest-path crates/tools/shipyard-geometry-metrology-oracle/Cargo.toml --all

      - name: Commit formatter-only changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- crates/tools/shipyard-weld-physics-vvuq/src/main.rs crates/tools/shipyard-distortion-co-design/src/main.rs crates/tools/shipyard-tandem-gmaw-admission/src/main.rs crates/tools/shipyard-interpass-adaptive/src/lib.rs crates/tools/shipyard-scan-metrology/src/lib.rs crates/tools/shipyard-geometry-metrology-oracle/src/lib.rs; then
            echo "All six verifier libraries already match rustfmt 1.96"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tools/shipyard-weld-physics-vvuq/src/main.rs crates/tools/shipyard-distortion-co-design/src/main.rs crates/tools/shipyard-tandem-gmaw-admission/src/main.rs crates/tools/shipyard-interpass-adaptive/src/lib.rs crates/tools/shipyard-scan-metrology/src/lib.rs crates/tools/shipyard-geometry-metrology-oracle/src/lib.rs
          git commit -m "style: apply Rust 1.96 formatting to shipyard assurance verifiers"
          git push origin "HEAD:${TARGET_BRANCH}"
