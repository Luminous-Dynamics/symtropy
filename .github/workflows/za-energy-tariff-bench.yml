name: ZA Energy Tariff Billing Reference

on:
  pull_request:
    paths:
      - "tools/za-energy-tariff-bench/**"
      - ".github/workflows/za-energy-tariff-bench.yml"
  push:
    branches: [main]
    paths:
      - "tools/za-energy-tariff-bench/**"
      - ".github/workflows/za-energy-tariff-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tariff-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check --manifest-path tools/za-energy-tariff-bench/Cargo.toml

      - name: Unit tests
        run: cargo test --manifest-path tools/za-energy-tariff-bench/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path tools/za-energy-tariff-bench/Cargo.toml --all-targets -- -D warnings

      - name: Execute frozen fixture
        run: |
          cargo run --quiet --manifest-path tools/za-energy-tariff-bench/Cargo.toml -- tools/za-energy-tariff-bench/fixtures/synthetic-citypower-winter-demand-ratchet.json > /tmp/za-tariff-result.json
          jq -e '
            (.results | length == 2) and
            (.results[0].energy_charge_zar == 966.68) and
            (.results[1].energy_charge_zar == 400.88) and
            (.results[0].billed_demand_kva == 100) and
            (.results[1].billed_demand_kva == 100) and
            (.results[0].invoice_equivalent_total_zar == null) and
            (.results[1].invoice_equivalent_total_zar == null)
          ' /tmp/za-tariff-result.json
