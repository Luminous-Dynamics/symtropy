name: ECON-05A Freight Load Qualification

on:
  push:
    branches:
      - "ci/econ-freight-load-qualification-v0.1"

permissions:
  contents: read

concurrency:
  group: econ-freight-load-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 3286ac0ed7a89df4445f53a9ed3f0d5fa1dd052f
  ECON04D_PARENT: e4c700acefb93f18fc523e1646de0e6be81c8205

jobs:
  qualify:
    name: Frozen ECON-05A / Rust 1.96
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact frozen product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 0

      - name: Assert exact subject and ancestry
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git merge-base --is-ancestor "${ECON04D_PARENT}" "${PRODUCT_HEAD}"
          count="$(git rev-list --count "${ECON04D_PARENT}..${PRODUCT_HEAD}")"
          echo "econ05a_commits_above_parent=${count}"
          test "${count}" = "4"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Freeze source identities
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symtropy-core/src/economic.rs \
            crates/core/symtropy-core/src/stock_reservation.rs \
            crates/core/symtropy-core/src/encumbrance_handoff.rs \
            crates/core/symtropy-core/src/freight_load.rs \
            crates/core/symtropy-core/src/lib.rs \
            crates/core/symtropy-core/tests/econ_encumbrance_handoff.rs \
            crates/core/symtropy-core/tests/econ_freight_load.rs \
            crates/core/symtropy-core/ECONOMIC_ENCUMBRANCE_HANDOFF_V01.md \
            crates/core/symtropy-core/ECONOMIC_FREIGHT_LOAD_V01.md \
            > "${RUNNER_TEMP}/econ05a-source-sha256.txt"
          cat "${RUNNER_TEMP}/econ05a-source-sha256.txt"

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check

      - name: Check symtropy-core all targets
        id: check
        run: cargo check -p symtropy-core --locked --all-targets

      - name: Run ECON-05A public freight-load corpus
        id: freight_load
        run: cargo test -p symtropy-core --locked --test econ_freight_load

      - name: Run ECON-04D handoff regressions
        id: handoff
        run: cargo test -p symtropy-core --locked --test econ_encumbrance_handoff

      - name: Run ECON-04C reconciliation regressions
        id: reservation_reconciliation
        run: cargo test -p symtropy-core --locked --test econ_reservation_reconciliation

      - name: Run ECON-04B reservation regressions
        id: reservation_regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-core --locked --lib stock_reservation::tests
          cargo test -p symtropy-core --locked --test econ_stock_reservation

      - name: Run ECON-04 commodity regressions
        id: commodity_regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-core --locked --lib commodity::tests
          cargo test -p symtropy-core --locked --test econ_commodity_identity

      - name: Run prerequisite ECON regressions
        id: econ_regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-core --locked --lib economic_repartition::tests
          cargo test -p symtropy-core --locked --lib economic_partition::tests
          cargo test -p symtropy-core --locked --lib economic_resolution::tests
          cargo test -p symtropy-core --locked --lib settlement::tests
          cargo test -p symtropy-core --locked --lib financial::tests
          cargo test -p symtropy-core --locked --lib economic::tests

      - name: Run complete symtropy-core library regression
        id: core_tests
        run: cargo test -p symtropy-core --locked --lib

      - name: Run strict symtropy-core Clippy
        id: clippy
        run: cargo clippy -p symtropy-core --locked --all-targets --all-features -- -D warnings

      - name: Audit freight-load authority surface
        id: authority_audit
        shell: bash
        run: |
          set -euo pipefail
          source=crates/core/symtropy-core/src/freight_load.rs
          contract=crates/core/symtropy-core/ECONOMIC_FREIGHT_LOAD_V01.md

          grep -Fq 'pub fn load_full_transport_reservation' "${source}"
          grep -Fq 'pub struct CarrierCargoBinding' "${source}"
          grep -Fq 'pub struct FreightLoadReceipt' "${source}"
          grep -Fq 'StockEvent::TransferCustody' "${source}"
          grep -Fq 'StockEvent::Relocate' "${source}"
          grep -Fq 'candidate.transact(events)' "${source}"
          grep -Fq 'reservations.validate_against_stock(&candidate)' "${source}"
          grep -Fq 'LotNotTransportIsolated' "${source}"
          grep -Fq 'TransportReservationNotActive' "${source}"
          grep -Fq 'Full-lot isolation boundary' "${contract}"
          grep -Fq 'available(L) == 0' "${contract}"
          grep -Fq 'carrier-local cargo-space' "${contract}"

          if grep -Eq '\b(f32|f64)\b' "${source}"; then
            echo 'floating-point type found in freight-load authority' >&2
            exit 1
          fi
          if grep -Eq 'StockReservationEvent::(Reserve|Release|ReleasePartial)' "${source}"; then
            echo 'freight-load authority introduced reservation mutation grammar' >&2
            exit 1
          fi
          if grep -Eq 'StockEvent::(Establish|Split|TransferOwnership|Deplete)' "${source}"; then
            echo 'freight-load authority mutates stock outside custody/location boundary' >&2
            exit 1
          fi
          if grep -Eq '^pub struct .*Ledger' "${source}"; then
            echo 'parallel freight/cargo ledger introduced' >&2
            exit 1
          fi

      - name: Assert unchanged frozen subject
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git diff --exit-code -- . ':!Cargo.lock'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SUBJECT: ${{ steps.subject.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          FREIGHT_LOAD: ${{ steps.freight_load.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
          RECON: ${{ steps.reservation_reconciliation.outcome }}
          RESERVATION: ${{ steps.reservation_regressions.outcome }}
          COMMODITY: ${{ steps.commodity_regressions.outcome }}
          ECON: ${{ steps.econ_regressions.outcome }}
          CORE: ${{ steps.core_tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          AUDIT: ${{ steps.authority_audit.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/econ05a-freight-load-v01.json"
          export RECEIPT_PATH="${receipt}"
          python3 - <<'PY'
          import json, os, subprocess
          keys = ["SUBJECT","SOURCE","FMT","CHECK","FREIGHT_LOAD","HANDOFF","RECON","RESERVATION","COMMODITY","ECON","CORE","CLIPPY","AUDIT","POSTFLIGHT"]
          outcomes = {k.lower(): os.environ.get(k, "unknown") for k in keys}
          def version(cmd):
              try: return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
              except Exception: return "unavailable"
          receipt = {
              "receipt_version": 1,
              "qualification": "ECON-05A-freight-load-v0.1",
              "product_head": os.environ["PRODUCT_HEAD"],
              "econ04d_parent": os.environ["ECON04D_PARENT"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "rustc_version": version(["rustc", "--version"]),
              "cargo_version": version(["cargo", "--version"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "isolated full-lot loading from live ECON-04D successor reservation into carrier-local custody/location with quantity, owner, commodity identity, and encumbrance conserved; no carrier-capacity, route, motion, ETA, fuel, delivery, settlement, legal, or distributed-consensus authority",
          }
          with open(os.environ["RECEIPT_PATH"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          cp "${RUNNER_TEMP}/econ05a-source-sha256.txt" "${RUNNER_TEMP}/econ05a-source-sha256-evidence.txt" || true
          sha256sum "${receipt}" > "${receipt}.sha256"
          cat "${receipt}"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econ05a-freight-load-v01-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/econ05a-freight-load-v01.json
            ${{ runner.temp }}/econ05a-freight-load-v01.json.sha256
            ${{ runner.temp }}/econ05a-source-sha256-evidence.txt
          if-no-files-found: error
          retention-days: 90
