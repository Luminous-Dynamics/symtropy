name: Orbital Truss Inspectability Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-truss-inspectability-bench/**"
      - "docs/research/orbital-truss/fixtures/inspectability-v0_1.json"
      - "docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json"
      - ".github/workflows/orbital-truss-inspectability.yml"
  push:
    branches:
      - "research/orbital-truss-inspectability-v0-1"
    paths:
      - "tools/orbital-truss-inspectability-bench/**"
      - "docs/research/orbital-truss/fixtures/inspectability-v0_1.json"
      - "docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json"
      - ".github/workflows/orbital-truss-inspectability.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Synthetic inspectability contract and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/inspectability-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json").read_text())
          assert fixture["benchmark_id"] == "ORBITAL-TRUSS-INSPECTABILITY-001"
          assert fixture["evidence_class"] == "synthetic"
          assert fixture["claim_ceiling"] == "synthetic_2d_geometric_observability_only"
          assert len(fixture["cases"]) == 12
          assert len({case["case_id"] for case in fixture["cases"]}) == 12
          assert schema["properties"]["cases"]["minItems"] == 12
          assert schema["properties"]["cases"]["maxItems"] == 12
          assert all(case["views"] and case["features"] for case in fixture["cases"])
          assert all(all(view["pose_perturbations"] for view in case["views"]) for case in fixture["cases"])
          print("frozen corpus/schema structure: 12 unique cases")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml -- docs/research/orbital-truss/fixtures/inspectability-v0_1.json "$GITHUB_SHA" > /tmp/inspectability-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml -- docs/research/orbital-truss/fixtures/inspectability-v0_1.json "$GITHUB_SHA" > /tmp/inspectability-b.json
          cmp /tmp/inspectability-a.json /tmp/inspectability-b.json
          jq -e '
            .schema == "luminous.orbital-truss-inspectability.receipt.v0.1" and
            .case_count == 12 and .expected_outcome_matches == 12 and
            .expected_outcome_mismatches == 0 and .authority_granted == false and
            .structural_acceptance_authorized == false and .flight_authorized == false and
            .physical_validation == "NOT_ASSESSED"
          ' /tmp/inspectability-a.json
      - name: Independent standard-library oracle
        run: |
          python3 tools/orbital-truss-inspectability-bench/tests/inspectability_reference_oracle.py docs/research/orbital-truss/fixtures/inspectability-v0_1.json > /tmp/inspectability-oracle.json
      - name: Compare Rust receipt with independent oracle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/inspectability-a.json").read_text())
          oracle = json.loads(Path("/tmp/inspectability-oracle.json").read_text())
          assert rust["input_sha256"] == oracle["input_sha256"]
          assert rust["case_count"] == oracle["case_count"] == 12
          assert rust["expected_outcome_matches"] == oracle["expected_outcome_matches"] == 12
          assert rust["expected_outcome_mismatches"] == oracle["expected_outcome_mismatches"] == 0
          for key in ("evidence_class", "claim_ceiling", "authority_granted",
                      "structural_acceptance_authorized", "flight_authorized",
                      "physical_validation", "cases"):
              assert rust[key] == oracle[key], key
          print("Rust and independent Python oracle agree on all case dispositions, reasons, views, and feature coverage")
          PY
      - name: Create exact-head evidence manifest
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          rust_bytes = Path("/tmp/inspectability-a.json").read_bytes()
          oracle_bytes = Path("/tmp/inspectability-oracle.json").read_bytes()
          rust = json.loads(rust_bytes)
          manifest = {
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "benchmark_id": rust["benchmark_id"],
              "input_sha256": rust["input_sha256"],
              "fixture_sha256": hashlib.sha256(Path("docs/research/orbital-truss/fixtures/inspectability-v0_1.json").read_bytes()).hexdigest(),
              "schema_sha256": hashlib.sha256(Path("docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json").read_bytes()).hexdigest(),
              "rust_receipt_sha256": hashlib.sha256(rust_bytes).hexdigest(),
              "oracle_receipt_sha256": hashlib.sha256(oracle_bytes).hexdigest(),
              "case_count": rust["case_count"],
              "expected_outcome_matches": rust["expected_outcome_matches"],
              "expected_outcome_mismatches": rust["expected_outcome_mismatches"],
              "authority_granted": rust["authority_granted"],
              "physical_validation": rust["physical_validation"],
          }
          Path("/tmp/inspectability-evidence-manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-truss-inspectability-evidence
          path: |
            /tmp/inspectability-a.json
            /tmp/inspectability-oracle.json
            /tmp/inspectability-evidence-manifest.json
            docs/research/orbital-truss/fixtures/inspectability-v0_1.json
            docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
