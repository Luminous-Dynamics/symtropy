name: Orbital Truss Inspectability Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-truss-inspectability-bench/**"
      - "docs/research/orbital-truss/fixtures/inspectability-v0_1.json"
      - "docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json"
      - "docs/research/orbital-truss/fixtures/planning-v0_2.json"
      - "docs/research/orbital-truss/orbital_truss_planning_v0_2.schema.json"
      - ".github/workflows/orbital-truss-inspectability.yml"
  push:
    branches:
      - "research/orbital-truss-inspectability-v0-1"
    paths:
      - "tools/orbital-truss-inspectability-bench/**"
      - "docs/research/orbital-truss/fixtures/inspectability-v0_1.json"
      - "docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json"
      - "docs/research/orbital-truss/fixtures/planning-v0_2.json"
      - "docs/research/orbital-truss/orbital_truss_planning_v0_2.schema.json"
      - ".github/workflows/orbital-truss-inspectability.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Synthetic inspectability contract and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/inspectability-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json").read_text())
          planning = json.loads(Path("docs/research/orbital-truss/fixtures/planning-v0_2.json").read_text())
          assert planning["schema"] == "luminous.orbital-truss-inspectability.planning-corpus.v0.2"
          planning_schema = json.loads(Path("docs/research/orbital-truss/orbital_truss_planning_v0_2.schema.json").read_text())
          assert fixture["benchmark_id"] == "ORBITAL-TRUSS-INSPECTABILITY-001"
          assert fixture["evidence_class"] == "synthetic"
          assert fixture["claim_ceiling"] == "synthetic_2d_geometric_observability_only"
          assert len(fixture["cases"]) == 12
          assert len({case["case_id"] for case in fixture["cases"]}) == 12
          assert all(case["coordinate_frame_id"] == "ORBITAL-TRUSS-SYNTHETIC-XY" for case in fixture["cases"])
          assert "coordinate_frame_id" in schema["$defs"]["Case"]["required"]
          assert schema["properties"]["cases"]["minItems"] == 12
          assert schema["properties"]["cases"]["maxItems"] == 12
          assert all(case["views"] and case["features"] for case in fixture["cases"])
          assert all(
              all(1 <= len(view["pose_perturbations"]) <= 256 for view in case["views"])
              for case in fixture["cases"]
          )
          assert planning["benchmark_id"] == "ORBITAL-TRUSS-PLANNING-002"
          assert planning["evidence_class"] == "synthetic"
          assert planning["claim_ceiling"] == "synthetic_2d_geometric_observability_and_view_selection_only"
          assert all(feature["required_view_count"] >= 1 and feature["required_failure_domains"] >= 1 for case in planning["cases"] for feature in case["problem"]["features"])
          assert len(planning["cases"]) == 8
          assert len({case["case_id"] for case in planning["cases"]}) == 8
          assert planning_schema["properties"]["cases"]["minItems"] == 8
          assert planning_schema["properties"]["cases"]["maxItems"] == 8
          assert all(1 <= len(case["problem"]["views"]) <= 20 for case in planning["cases"])
          assert all(case["problem"]["features"] for case in planning["cases"])
          print("frozen geometry corpus: 12 unique cases; frozen planning corpus: 5 unique cases")
          PY
      - name: Validate support-envelope corpus and schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/support-envelope-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/support_envelope_v0_1.schema.json").read_text())
          assert fixture["schema"] == "luminous.orbital-truss-support-envelope.corpus.v0.1"
          assert fixture["benchmark_id"] == "ORBITAL-TRUSS-SUPPORT-ENVELOPE-001"
          assert fixture["evidence_class"] == "synthetic"
          assert fixture["claim_ceiling"] == "synthetic_3d_full_support_sensing_envelope_bounds_only_occlusion_not_assessed"
          assert len(fixture["cases"]) == 13
          assert len({case["case_id"] for case in fixture["cases"]}) == 13
          assert schema["properties"]["cases"]["minItems"] == 13
          assert schema["properties"]["cases"]["maxItems"] == 13
          assert all(case["length_unit"] == "METRE" for case in fixture["cases"])
          print("frozen support-envelope corpus/schema: 13 unique cases")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --bin orbital-truss-inspectability-bench -- docs/research/orbital-truss/fixtures/inspectability-v0_1.json "$GITHUB_SHA" > /tmp/inspectability-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --bin orbital-truss-inspectability-bench -- docs/research/orbital-truss/fixtures/inspectability-v0_1.json "$GITHUB_SHA" > /tmp/inspectability-b.json
          cmp /tmp/inspectability-a.json /tmp/inspectability-b.json
          jq -e '
            .schema == "luminous.orbital-truss-inspectability.receipt.v0.1" and
            .case_count == 12 and .expected_outcome_matches == 12 and
            .expected_outcome_mismatches == 0 and .authority_granted == false and
            .structural_acceptance_authorized == false and .flight_authorized == false and
            .physical_validation == "NOT_ASSESSED"
          ' /tmp/inspectability-a.json
      - name: Independent standard-library oracle
        run: |
          python3 tools/orbital-truss-inspectability-bench/tests/inspectability_reference_oracle.py docs/research/orbital-truss/fixtures/inspectability-v0_1.json > /tmp/inspectability-oracle.json
      - name: Compare Rust receipt with independent oracle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/inspectability-a.json").read_text())
          oracle = json.loads(Path("/tmp/inspectability-oracle.json").read_text())
          assert rust["input_sha256"] == oracle["input_sha256"]
          assert rust["case_count"] == oracle["case_count"] == 12
          assert rust["expected_outcome_matches"] == oracle["expected_outcome_matches"] == 12
          assert rust["expected_outcome_mismatches"] == oracle["expected_outcome_mismatches"] == 0
          for key in ("evidence_class", "claim_ceiling", "authority_granted",
                      "structural_acceptance_authorized", "flight_authorized",
                      "physical_validation", "cases"):
              assert rust[key] == oracle[key], key
          print("Rust and independent Python oracle agree on all case dispositions, reasons, views, and feature coverage")
          PY
      - name: Deterministic Rust planning receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --bin orbital-truss-inspection-planning-bench -- docs/research/orbital-truss/fixtures/planning-v0_2.json "$GITHUB_SHA" > /tmp/planning-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --bin orbital-truss-inspection-planning-bench -- docs/research/orbital-truss/fixtures/planning-v0_2.json "$GITHUB_SHA" > /tmp/planning-b.json
          cmp /tmp/planning-a.json /tmp/planning-b.json
          jq -e '
            .schema == "luminous.orbital-truss-inspectability.planning-corpus-receipt.v0.5" and
            .case_count == 8 and .expected_outcome_matches == 8 and
            .expected_outcome_mismatches == 0 and .authority_granted == false and
            .physical_validation == "NOT_ASSESSED"
          ' /tmp/planning-a.json
      - name: Independent planning oracle
        run: |
          python3 tools/orbital-truss-inspectability-bench/tests/planning_reference_oracle_v0_2.py docs/research/orbital-truss/fixtures/planning-v0_2.json "$GITHUB_SHA" > /tmp/planning-oracle.json
      - name: Compare Rust planning receipt with independent oracle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/planning-a.json").read_text())
          oracle = json.loads(Path("/tmp/planning-oracle.json").read_text())
          assert rust == oracle
          assert rust["case_count"] == 8
          cases = {case["case_id"]: case for case in rust["cases"]}
          trap = cases["OP-001-GREEDY-TRAP"]["planning"]
          assert trap["exact_optimum"]["selected_view_ids"] == ["VIEW-B", "VIEW-C"]
          assert trap["greedy_next_best_view"]["selected_view_count"] == 3
          assert trap["greedy_cost_gap_units"] == 1
          assert cases["OP-002-BUDGET-HOLD"]["planning"]["planning_disposition"] == "BUDGET_INFEASIBLE"
          assert cases["OP-003-DOMAIN-COLLAPSE"]["planning"]["planning_disposition"] == "INFEASIBLE"
          assert cases["OP-004-ROBUSTNESS-ABSTAIN"]["planning"]["planning_disposition"] == "INDETERMINATE"
          k_cover = cases["OP-006-K-COVER-SAME-DOMAIN"]["planning"]
          assert k_cover["exact_optimum"]["feature_coverage"][0]["robust_view_count"] == 2
          assert k_cover["exact_optimum"]["feature_coverage"][0]["robust_failure_domain_count"] == 1
          domain_cover = cases["OP-007-DOMAIN-DIVERSITY-ONE-VIEW-DEMAND"]["planning"]
          assert domain_cover["exact_optimum"]["feature_coverage"][0]["required_view_count"] == 1
          assert domain_cover["exact_optimum"]["feature_coverage"][0]["robust_failure_domain_count"] == 2
          shortfall = cases["OP-008-UNCAPPED-K-SHORTFALL"]["planning"]
          assert shortfall["candidate_geometry_disposition"] == "INFEASIBLE"
          assert shortfall["exact_optimum"] is None
          assert shortfall["candidate_pool_coverage"][0]["required_view_count"] == 3
          assert shortfall["candidate_pool_coverage"][0]["robust_view_count"] == 2
          capped = shortfall["published_k_coverage_greedy"]
          assert capped["requested_k_covered"] is False
          assert capped["attainable_capped_target_covered"] is True
          assert capped["feature_coverage"][0]["requested_k"] == 3
          assert capped["feature_coverage"][0]["available_candidate_views"] == 2
          assert capped["feature_coverage"][0]["attainable_capped_target"] == 2
          assert capped["feature_coverage"][0]["selected_views"] == 2
          domain_greedy = cases["OP-003-DOMAIN-COLLAPSE"]["planning"]["published_k_coverage_greedy"]
          assert domain_greedy["requested_k_covered"] is True
          assert domain_greedy["robust_failure_domain_requirements_met"] is False
          fragile_greedy = cases["OP-004-ROBUSTNESS-ABSTAIN"]["planning"]["published_k_coverage_greedy"]
          assert fragile_greedy["requested_k_covered"] is True
          assert fragile_greedy["robust_requested_k_covered"] is False
          assert fragile_greedy["feature_coverage"][0]["available_candidate_views"] == 2
          assert fragile_greedy["feature_coverage"][0]["available_robust_candidate_views"] == 1
          for case in cases.values():
              planning = case["planning"]
              exact_k = planning["nominal_k_exact"]
              paper_greedy = planning["published_k_coverage_greedy"]
              assert exact_k["minimum_cardinality_certified"] is True
              assert exact_k["attainable_capped_target_covered"] is True
              assert paper_greedy["attainable_capped_target_covered"] is True
              assert paper_greedy["exact_reference_minimum_view_count"] == exact_k["selected_view_count"]
              assert paper_greedy["view_count_gap_vs_exact"] == paper_greedy["selected_view_count"] - exact_k["selected_view_count"]
              assert paper_greedy["view_count_gap_vs_exact"] >= 0
              if exact_k["selected_view_count"] > 0:
                  assert paper_greedy["relative_gap_basis_points_vs_exact"] == (paper_greedy["view_count_gap_vs_exact"] * 10000 // exact_k["selected_view_count"])
          pareto = cases["OP-005-COST-COUNT-PARETO"]["planning"]["pareto_frontier"]
          assert [(item["total_cost_units"], item["selected_view_count"]) for item in pareto] == [(2, 2), (3, 1)]
          print("Rust exact planner and independent Python oracle agree on eight frozen cases, including orthogonal k-view and failure-domain controls")
          PY
      - name: Deterministic Rust support-envelope receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --bin orbital-truss-support-envelope-bench -- docs/research/orbital-truss/fixtures/support-envelope-v0_1.json "$GITHUB_SHA" > /tmp/support-envelope-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-truss-inspectability-bench/Cargo.toml --bin orbital-truss-support-envelope-bench -- docs/research/orbital-truss/fixtures/support-envelope-v0_1.json "$GITHUB_SHA" > /tmp/support-envelope-b.json
          cmp /tmp/support-envelope-a.json /tmp/support-envelope-b.json
          jq -e '
            .schema == "luminous.orbital-truss-support-envelope.receipt.v0.1" and
            .case_count == 13 and .expected_outcome_matches == 13 and
            .expected_outcome_mismatches == 0 and .authority_granted == false and
            .occlusion_assessed == false and .physical_validation == "NOT_ASSESSED" and
            all(.cases[]; .full_support_visibility_certified == false and .may_count_toward_full_support_coverage == false)
          ' /tmp/support-envelope-a.json
      - name: Independent support-envelope oracle
        run: |
          python3 tools/orbital-truss-inspectability-bench/tests/support_envelope_reference_oracle.py docs/research/orbital-truss/fixtures/support-envelope-v0_1.json "$GITHUB_SHA" > /tmp/support-envelope-oracle.json
      - name: Compare Rust support-envelope receipt with independent oracle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/support-envelope-a.json").read_text())
          oracle = json.loads(Path("/tmp/support-envelope-oracle.json").read_text())
          assert rust == oracle
          assert rust["expected_outcome_matches"] == rust["case_count"] == 13
          by_id = {case["case_id"]: case for case in rust["cases"]}
          assert by_id["SE-001-WHOLE-SUPPORT-PASS"]["status"] == "CERTIFIED_WITHIN_SENSING_ENVELOPE"
          assert by_id["SE-004-ALL-SUPPORT-OUTSIDE-FOV"]["status"] == "PROVEN_OUTSIDE_SENSING_ENVELOPE"
          assert by_id["SE-005-FOV-BOUND-INDETERMINATE"]["status"] == "INDETERMINATE"
          assert all(not case["full_support_visibility_certified"] for case in rust["cases"])
          print("Rust support-envelope certificates match the independent Python oracle on all 13 frozen controls")
          PY
      - name: Create exact-head evidence manifest
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          rust_bytes = Path("/tmp/inspectability-a.json").read_bytes()
          oracle_bytes = Path("/tmp/inspectability-oracle.json").read_bytes()
          planning_rust_bytes = Path("/tmp/planning-a.json").read_bytes()
          planning_oracle_bytes = Path("/tmp/planning-oracle.json").read_bytes()
          planning_rust = json.loads(planning_rust_bytes)
          rust = json.loads(rust_bytes)
          manifest = {
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "benchmark_id": rust["benchmark_id"],
              "input_sha256": rust["input_sha256"],
              "fixture_sha256": hashlib.sha256(Path("docs/research/orbital-truss/fixtures/inspectability-v0_1.json").read_bytes()).hexdigest(),
              "schema_sha256": hashlib.sha256(Path("docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json").read_bytes()).hexdigest(),
              "rust_receipt_sha256": hashlib.sha256(rust_bytes).hexdigest(),
              "oracle_receipt_sha256": hashlib.sha256(oracle_bytes).hexdigest(),
              "case_count": rust["case_count"],
              "expected_outcome_matches": rust["expected_outcome_matches"],
              "expected_outcome_mismatches": rust["expected_outcome_mismatches"],
              "authority_granted": rust["authority_granted"],
              "physical_validation": rust["physical_validation"],
              "planning_benchmark_id": planning_rust["benchmark_id"],
              "planning_fixture_sha256": hashlib.sha256(Path("docs/research/orbital-truss/fixtures/planning-v0_2.json").read_bytes()).hexdigest(),
              "planning_schema_sha256": hashlib.sha256(Path("docs/research/orbital-truss/orbital_truss_planning_v0_2.schema.json").read_bytes()).hexdigest(),
              "planning_rust_receipt_sha256": hashlib.sha256(planning_rust_bytes).hexdigest(),
              "planning_oracle_receipt_sha256": hashlib.sha256(planning_oracle_bytes).hexdigest(),
              "planning_case_count": planning_rust["case_count"],
              "planning_expected_outcome_matches": planning_rust["expected_outcome_matches"],
              "planning_expected_outcome_mismatches": planning_rust["expected_outcome_mismatches"],
              "support_envelope_benchmark_id": "ORBITAL-TRUSS-SUPPORT-ENVELOPE-001",
              "support_envelope_fixture_sha256": hashlib.sha256(Path("docs/research/orbital-truss/fixtures/support-envelope-v0_1.json").read_bytes()).hexdigest(),
              "support_envelope_schema_sha256": hashlib.sha256(Path("docs/research/orbital-truss/support_envelope_v0_1.schema.json").read_bytes()).hexdigest(),
              "support_envelope_rust_receipt_sha256": hashlib.sha256(Path("/tmp/support-envelope-a.json").read_bytes()).hexdigest(),
              "support_envelope_oracle_receipt_sha256": hashlib.sha256(Path("/tmp/support-envelope-oracle.json").read_bytes()).hexdigest(),
              "support_envelope_case_count": 13,
              "support_envelope_expected_outcome_matches": 13,
              "support_envelope_occlusion_assessed": False,
          }
          Path("/tmp/inspectability-evidence-manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-truss-inspectability-evidence
          path: |
            /tmp/inspectability-a.json
            /tmp/inspectability-oracle.json
            /tmp/inspectability-evidence-manifest.json
            docs/research/orbital-truss/fixtures/inspectability-v0_1.json
            docs/research/orbital-truss/orbital_truss_inspectability_v0_1.schema.json
            /tmp/planning-a.json
            /tmp/planning-oracle.json
            docs/research/orbital-truss/fixtures/planning-v0_2.json
            docs/research/orbital-truss/orbital_truss_planning_v0_2.schema.json
            /tmp/support-envelope-a.json
            /tmp/support-envelope-oracle.json
            docs/research/orbital-truss/fixtures/support-envelope-v0_1.json
            docs/research/orbital-truss/support_envelope_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
