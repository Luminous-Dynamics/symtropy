name: D1 Lock Authority Runner

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: d1-lock-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Apply and prove exact D1 lock repair
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/symtropy-d1-lock-authority-target
    steps:
      - name: Check out exact D1 product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: design/d1-content-bound-design-revisions-v0.1
          path: product
          fetch-depth: 0

      - name: Bind exact unqualified D1 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "9098b501a0b61a163aed031b351228ddf2c39bcf"
          test "$(git -C product rev-parse HEAD^{tree})" = "bf36582bdfe6862cb1d6ab1a2ef4adfd41cd45b3"
          test "$(git -C product hash-object Cargo.lock)" = "db602c9707ecd6143ef36c0243c051544a027141"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Regenerate exact missing workspace lock state
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check -p symtropy-design --all-targets

      - name: Prove exact diagnostic-replayed lock delta
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git status --porcelain=v1 --untracked-files=all)" = ' M Cargo.lock'
          test "$(git hash-object Cargo.lock)" = "9722cc9a91cd8c1ba3194be110798e96d3d3f45b"
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "3d018d3ce3000130b42e5342719f39c161475ddd349a25334eae87ca4c6b0578"
          git diff --binary -- Cargo.lock > /tmp/d1-lock.patch
          test "$(sha256sum /tmp/d1-lock.patch | awk '{print $1}')" = "8333f1cf80679cd40b47a09cb6a2f30cfc8d6f5118a0cff717f9d883d722608a"
          added="$(git diff --unified=0 -- Cargo.lock | grep '^+' | grep -v '^+++')"
          expected=$(cat <<'EOF'
          +[[package]]
          +name = "symtropy-design"
          +version = "0.1.0"
          +dependencies = [
          + "serde",
          + "serde_json",
          + "sha2",
          + "symtropy-game-state",
          +]
          +
          EOF
          )
          test "$(printf '%s\n' "$added")" = "$(printf '%s\n' "$expected")"

      - name: Prove regenerated lock is self-consistent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo metadata --locked --format-version 1 > /tmp/d1-locked-metadata.json
          test "$(sha256sum /tmp/d1-locked-metadata.json | awk '{print $1}')" = "cf95cef8ec3af4f762834012888e4095eafbc6d5a67b4d38a7b3731d28e4af2d"
          cargo check --locked -p symtropy-design --all-targets
          test "$(git status --porcelain=v1 --untracked-files=all)" = ' M Cargo.lock'

      - name: Commit lock-only prerequisite
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          test -z "$(git diff --name-only)"
          git commit -m "chore(design): lock symtropy-design workspace package"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "D1_LOCK_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo "D1_LOCK_PRODUCT_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse branch race and push exact lock-fixed D1 head
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin refs/heads/design/d1-content-bound-design-revisions-v0.1 | awk '{print $1}')"
          test "${remote_head}" = "9098b501a0b61a163aed031b351228ddf2c39bcf"
          git push origin HEAD:design/d1-content-bound-design-revisions-v0.1
