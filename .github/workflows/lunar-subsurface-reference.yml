name: lunar-subsurface-reference

on:
  pull_request:
    paths:
      - ".github/workflows/lunar-subsurface-reference.yml"
      - "tools/lunar-subsurface-reference/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lunar-subsurface-reference.yml"
      - "tools/lunar-subsurface-reference/**"

permissions:
  contents: read

jobs:
  reference:
    name: lunar excavation volume reference checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/lunar-subsurface-reference/Cargo.toml -- --check

      - name: Run unit tests
        run: cargo test --manifest-path tools/lunar-subsurface-reference/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/lunar-subsurface-reference/Cargo.toml --all-targets -- -D warnings

      - name: Execute report twice and require deterministic JSON
        run: |
          cargo run --manifest-path tools/lunar-subsurface-reference/Cargo.toml --release > report-1.json
          cargo run --manifest-path tools/lunar-subsurface-reference/Cargo.toml --release > report-2.json
          cmp report-1.json report-2.json
          mv report-1.json lunar-subsurface-reference.json
          jq -e . lunar-subsurface-reference.json >/dev/null
          jq -e '.evidence_class == "geometry_only_excavation_volume_screen" and .scenario_count == 72 and (.scenarios | length) == 72' lunar-subsurface-reference.json >/dev/null
          jq -e 'any(.scenarios[]; .circumference_km == 100 and .excavated_cross_section_m2 == 30 and .bore_count == 1 and .overbreak_fraction == 0 and .design_bore_volume_m3 == 3000000 and .total_excavation_volume_m3 == 3000000)' lunar-subsurface-reference.json >/dev/null
          jq -e 'any(.scenarios[]; .circumference_km == 100 and .excavated_cross_section_m2 == 30 and .bore_count == 2 and .overbreak_fraction == 0.2 and .design_bore_volume_m3 == 6000000 and .overbreak_volume_m3 == 1200000 and .total_excavation_volume_m3 == 7200000)' lunar-subsurface-reference.json >/dev/null
          jq -e 'any(.scenarios[]; .circumference_km == 150 and .excavated_cross_section_m2 == 40 and .bore_count == 2 and .overbreak_fraction == 0.2 and .total_excavation_volume_m3 == 14400000)' lunar-subsurface-reference.json >/dev/null
          jq -e 'all(.scenarios[]; .shaft_volume_m3 == 0 and .cavern_volume_m3 == 0 and .cross_passage_volume_m3 == 0 and .ancillary_volume_m3 == 0)' lunar-subsurface-reference.json >/dev/null

      - name: Fingerprint exact source and retained report
        run: |
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc +1.96.0 --version)"
            echo "cargo=$(cargo +1.96.0 --version)"
            sha256sum tools/lunar-subsurface-reference/Cargo.toml
            sha256sum tools/lunar-subsurface-reference/README.md
            sha256sum tools/lunar-subsurface-reference/src/main.rs
            sha256sum .github/workflows/lunar-subsurface-reference.yml
            sha256sum lunar-subsurface-reference.json
          } > lunar-subsurface-evidence-manifest.txt

      - name: Retain report and evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: lunar-subsurface-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lunar-subsurface-reference.json
            lunar-subsurface-evidence-manifest.txt
          if-no-files-found: error
          retention-days: 90
