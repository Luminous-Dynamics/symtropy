name: CivDyn normative premise audit reference

on:
  pull_request:
    paths:
      - "research/civdyn-normative-audit/**"
      - ".github/workflows/civdyn-normative-audit.yml"
  push:
    paths:
      - "research/civdyn-normative-audit/**"
      - ".github/workflows/civdyn-normative-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute normative premise audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-normative-audit/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-normative-audit/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-normative-audit/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-normative-audit/Cargo.toml --all-targets

      - name: Execute synthetic premise profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-normative-audit-evidence
          cargo run --locked --manifest-path research/civdyn-normative-audit/Cargo.toml --bin normative-audit-sweep \
            | tee target/civdyn-normative-audit-evidence/normative-audit.csv

      - name: Verify profile plurality, evidence and tri-state semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-normative-audit-evidence/normative-audit.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 14, f"expected 4 profile + 10 premise rows, got {len(rows)}"
          assert all(len(row) == 8 for row in rows)
          profiles = {row["profile_id"]: row for row in rows if row["record_type"] == "profile"}
          premises = [row for row in rows if row["record_type"] == "premise"]
          assert set(profiles) == {
              "aggregate_consequence",
              "equal_consideration",
              "rights_constrained",
              "intergenerational_stewardship",
          }
          assert profiles["aggregate_consequence"]["status"] == "supported"
          assert profiles["equal_consideration"]["status"] == "contradicted"
          assert profiles["rights_constrained"]["status"] == "contradicted"
          assert profiles["intergenerational_stewardship"]["status"] == "contradicted"
          assert len(premises) == 10
          assert all(row["source_type"] == "synthetic_fixture" for row in rows)
          assert all(row["status"] in {"supported", "contradicted", "undetermined"} for row in rows)
          rights = [row for row in premises if row["profile_id"] == "rights_constrained"]
          assert any("synthetic_transfer_001" in row["evidence_refs"] for row in rights)
          stewardship = [row for row in premises if row["profile_id"] == "intergenerational_stewardship"]
          assert any("synthetic_food_receipt" in row["evidence_refs"] for row in stewardship)

          print("CIVDYN-THERMO-AGENCY-001 premise plurality, tri-state evidence and no-universal-score controls verified.")
          PY

          {
            echo "## CIVDYN-THERMO-AGENCY-001 normative audit"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-normative-audit-evidence/normative-audit.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic premise-rule execution; no empirical or thermodynamic moral conclusion"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload normative audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-normative-audit
          path: target/civdyn-normative-audit-evidence/normative-audit.csv
          if-no-files-found: error
          retention-days: 30
