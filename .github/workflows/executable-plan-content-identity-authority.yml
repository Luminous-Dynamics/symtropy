name: Executable Plan Content Identity Authority (held for golden probe)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: executable-plan-content-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hold:
    name: Refuse promotion until Patch Conduit digest is frozen
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Authority-producing #611 promotion is intentionally held.'
          echo 'First capture exact canonical Patch Conduit digest candidates in a read-only hosted probe.'
          echo 'This workflow performs no checkout, transform, commit, or push.'
