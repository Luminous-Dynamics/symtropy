name: Executable Plan Content Identity Authority

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: executable-plan-content-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/symtropy-executable-plan-content-identity-target
  PRODUCT_BRANCH: fabrication/executable-plan-content-identity
  PRODUCT_PARENT: a3a2bc5e07c69996ee9542048d41c4c84bdb25ef
  PRODUCT_PARENT_TREE: e8e198ce04c4b4ad790e05ee3a01b0d59139461f
  IDENTITY_TRANSFORM_BLOB: 309a09d307e79d2daa1904827607352615087b1a
  PATCH_GOLDEN_TRANSFORM_BLOB: 262a8ff4350d135ceb8c74f134b2d01f27edb319

jobs:
  qualify-and-promote:
    name: Prove exact #611 identity theorem and promote one commit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact product parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          fetch-depth: 0

      - name: Check out exact runner subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact subjects and repair blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_PARENT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PRODUCT_PARENT_TREE"
          test "$(git -C runner-tools rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C runner-tools hash-object .github/repair/executable_plan_content_identity.py)" = "$IDENTITY_TRANSFORM_BLOB"
          test "$(git -C runner-tools hash-object .github/repair/freeze_patch_conduit_identity_goldens.py)" = "$PATCH_GOLDEN_TRANSFORM_BLOB"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"
          echo "IDENTITY_PARENT_HEAD=$(git -C product rev-parse HEAD)"
          echo "IDENTITY_PARENT_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "IDENTITY_RUNNER_HEAD=$(git -C runner-tools rev-parse HEAD)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Re-prove exact #605 parent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-fabrication -p symtropy-firstlight -- --check
          cargo check --locked -p symtropy-fabrication --lib
          cargo check --locked -p symtropy-firstlight
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply frozen #611 transforms
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/executable_plan_content_identity.py
          python3 ../runner-tools/.github/repair/freeze_patch_conduit_identity_goldens.py
          cargo fmt -p symtropy-fabrication -p symtropy-firstlight

      - name: Resolve only the bounded direct sha2 lock edge
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cp Cargo.lock /tmp/pre-611-Cargo.lock
          cargo check -p symtropy-fabrication --lib
          python3 - <<'PY'
          import subprocess
          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "--", "Cargo.lock"], text=True
          )
          added = [
              line[1:] for line in diff.splitlines()
              if line.startswith("+") and not line.startswith("+++")
          ]
          removed = [
              line[1:] for line in diff.splitlines()
              if line.startswith("-") and not line.startswith("---")
          ]
          assert added == [' "sha2",'] or added == ['    "sha2",'], (added, removed, diff)
          assert removed == [], (added, removed, diff)
          print("LOCK_DELTA=one direct sha2 edge only")
          PY

      - name: Prove change surface is exactly bounded
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 - <<'PY'
          import subprocess
          expected = {
              "Cargo.lock",
              "crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs",
              "crates/domains/symtropy-fabrication/Cargo.toml",
              "crates/domains/symtropy-fabrication/src/executable_plan_identity.rs",
              "crates/domains/symtropy-fabrication/src/lib.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True
          ).splitlines())
          paths = {line[3:] for line in changed}
          assert paths == expected, (paths, expected)
          print("IDENTITY_CHANGED_FILES=" + ",".join(sorted(paths)))
          PY
          test -z "$(git diff -- crates/domains/symtropy-game-state)"

      - name: Prove synthetic protocol golden executes exactly once
        shell: bash
        run: |
          set -euo pipefail
          cd product
          output="$(cargo test --locked -p symtropy-fabrication golden_v1_digest_freezes_cross_layer_preimage 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test .*golden_v1_digest_freezes_cross_layer_preimage .* ok'
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. 1 passed; 0 failed;'

      - name: Prove all four real Patch Conduit goldens execute
        shell: bash
        run: |
          set -euo pipefail
          cd product
          output="$(cargo test --locked -p symtropy-firstlight patch_conduit_executable_identity_v1_goldens 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test .*patch_conduit_executable_identity_v1_goldens .* ok'
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. 1 passed; 0 failed;'

      - name: Re-prove crate authority and canonical Firstlight contract
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-fabrication -p symtropy-firstlight -- --check
          cargo check --locked -p symtropy-fabrication --all-targets
          cargo test --locked -p symtropy-fabrication
          cargo clippy --locked -p symtropy-fabrication --all-targets -- -D warnings
          cargo test --locked -p symtropy-firstlight patch_conduit_exact_plan

      - name: Commit exact qualified #611 product
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_PARENT"
          git config user.name "luminous-qualification-bot"
          git config user.email "qualification@luminous.invalid"
          git add Cargo.lock \
            crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs \
            crates/domains/symtropy-fabrication/Cargo.toml \
            crates/domains/symtropy-fabrication/src/executable_plan_identity.rs \
            crates/domains/symtropy-fabrication/src/lib.rs
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep '^??' || true)"
          git commit -m "feat(fabrication): add canonical executable plan content identity"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_PARENT"
          echo "IDENTITY_QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "IDENTITY_QUALIFIED_TREE=$(git rev-parse HEAD^{tree})"
          git show --stat --oneline --decorate=short HEAD

      - name: Push only after exact postflight
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD^)" = "$PRODUCT_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort | wc -l)" -eq 5
          git push origin "HEAD:${PRODUCT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "IDENTITY_PROMOTED_HEAD=$(git rev-parse HEAD)"
