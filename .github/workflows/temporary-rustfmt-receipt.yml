name: One-time rustfmt for solver receipt verifier

on:
  push:
    branches: ["feat/physical-solver-receipt-verifier-v0-1"]
    paths:
      - ".github/workflows/temporary-rustfmt-receipt.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Format canonical contract crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path research/physical-solver-contract/Cargo.toml --all
          if git diff --quiet -- research/physical-solver-contract/src; then
            echo "Rust formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/physical-solver-contract/src
          git commit -m "style(physics): format receipt verifier regression"
          git push origin "HEAD:${GITHUB_REF_NAME}"
