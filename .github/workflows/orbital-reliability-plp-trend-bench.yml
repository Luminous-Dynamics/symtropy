name: Orbital PLP Trend Diagnostic Benchmark

on:
  push:
    branches: ["research/orbital-plp-trend-test-v0-1"]
    paths:
      - "tools/orbital-reliability-plp-trend-bench/**"
      - ".github/workflows/orbital-reliability-plp-trend-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/orbital-reliability-plp-trend-bench/**"
      - ".github/workflows/orbital-reliability-plp-trend-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbital-plp-trend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plp-trend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact benchmark head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Generate standalone lockfile
        run: cargo generate-lockfile --manifest-path tools/orbital-reliability-plp-trend-bench/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path tools/orbital-reliability-plp-trend-bench/Cargo.toml -- --check

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path tools/orbital-reliability-plp-trend-bench/Cargo.toml --all-targets

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/orbital-reliability-plp-trend-bench/Cargo.toml --all-targets -- -D warnings

      - name: Replay frozen trend corpus
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$BENCHMARK_COMMIT"
          cargo run --locked --quiet --manifest-path tools/orbital-reliability-plp-trend-bench/Cargo.toml -- \
            tools/orbital-reliability-plp-trend-bench/fixtures/v0.1/trend-cases.json \
            --source-commit "$actual_commit" > orbital-reliability-plp-trend-receipt.json
          jq -e --arg expected_commit "$BENCHMARK_COMMIT" '
            .receipt_schema == "luminous.orbital-reliability-plp-trend.receipt.v0.1"
            and .source_commit == $expected_commit
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .report.evidence_class == "synthetic"
            and .report.claim_ceiling == "synthetic-constant-vs-plp-trend-diagnostic-only"
            and .report.summary.case_count == 24
            and .report.summary.expected_result_mismatches == 0
            and .report.summary.trend_signal_detected >= 1
            and .report.summary.no_trend_signal_detected >= 1
            and .report.summary.fit_acceptances == 0
            and .report.summary.reliability_claims_granted == 0
            and .report.summary.authority_grants == 0
            and .report.authority_granted == false
            and .report.fit_acceptance_granted == false
            and .report.reliability_claim_granted == false
          ' orbital-reliability-plp-trend-receipt.json

      - name: Run independent exact conditional trend oracle
        run: node tools/orbital-reliability-plp-trend-bench/tests/reference_oracle.mjs tools/orbital-reliability-plp-trend-bench/fixtures/v0.1/trend-cases.json

      - name: Upload reproducible trend receipt
        uses: actions/upload-artifact@v4
        with:
          name: orbital-reliability-plp-trend-${{ github.event.pull_request.head.sha || github.sha }}
          path: orbital-reliability-plp-trend-receipt.json
          if-no-files-found: error
          retention-days: 30
