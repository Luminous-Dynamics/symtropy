name: Plasma stream telemetry

on:
  push:
    branches:
      - research/plasma-stream-telemetry-v0-1-2026-11-19
    paths:
      - "crates/tools/plasma-stream-telemetry/**"
      - "benchmarks/plasma/stream-telemetry-v0.json"
      - ".github/workflows/plasma-stream-telemetry.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-stream-telemetry/**"
      - "benchmarks/plasma/stream-telemetry-v0.json"
      - ".github/workflows/plasma-stream-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-stream-telemetry/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-stream-telemetry/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-stream-telemetry/Cargo.toml --all-targets -- -D warnings
      - name: Replay frozen stream fixture
        run: cargo run --locked --manifest-path crates/tools/plasma-stream-telemetry/Cargo.toml -- benchmarks/plasma/stream-telemetry-v0.json
