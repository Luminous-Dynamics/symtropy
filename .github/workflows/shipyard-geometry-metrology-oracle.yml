name: Shipyard Geometry Metrology Oracle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-geometry-metrology-oracle/**"
      - "docs/tech/SHIPYARD_GEOMETRY_METROLOGY_ORACLE_V0_1*"
      - ".github/workflows/shipyard-geometry-metrology-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-geometry-metrology-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact synthetic profile integration and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-geometry-metrology-oracle/Cargo.toml --all -- --check

      - name: Run exact geometry metrology tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-geometry-metrology-oracle/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-geometry-metrology-oracle/Cargo.toml --all-targets -- -D warnings

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
