name: CivDyn authority power and contestability audit

on:
  pull_request:
    paths:
      - "research/civdyn-authority-power/**"
      - ".github/workflows/civdyn-authority-power.yml"
  push:
    paths:
      - "research/civdyn-authority-power/**"
      - ".github/workflows/civdyn-authority-power.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute authority audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-authority-power/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-authority-power/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-authority-power/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-authority-power/Cargo.toml --all-targets

      - name: Execute voting-power and authority topology portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-authority-evidence
          cargo run --locked --manifest-path research/civdyn-authority-power/Cargo.toml --bin authority-power-sweep \
            | tee target/civdyn-authority-evidence/authority-power-sweep.csv

      - name: Verify exact indices, power concentration and role separation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-authority-evidence/authority-power-sweep.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 100
          assert all(len(row) == 12 for row in rows)

          actors = [r for r in rows if r["record_type"] == "voting_actor"]
          asymmetric = [r for r in actors if r["case_id"] == "asymmetric_five"]
          first = next(r for r in asymmetric if r["subject"] == "asymmetric_five_actor_0")
          assert abs(float(first["normalized_banzhaf"]) - 0.44) < 1e-6
          assert abs(float(first["shapley_shubik"]) - 0.45) < 1e-6

          dictator = next(
              r for r in actors
              if r["case_id"] == "dictatorial_five"
              and r["subject"] == "dictatorial_five_actor_0"
          )
          assert abs(float(dictator["normalized_banzhaf"]) - 1.0) < 1e-9
          assert "dictator=true" in dictator["flag_or_rationale"]
          balanced = [r for r in actors if r["case_id"] == "balanced_five"]
          assert all(abs(float(r["normalized_banzhaf"]) - 0.2) < 1e-9 for r in balanced)

          topology = {
              (r["case_id"], r["subject"]): r["value"]
              for r in rows if r["record_type"] == "topology_metric"
          }
          assert topology[("separated_roles", "compliant_with_declared_policy")] == "true"
          assert topology[("separated_roles", "appeal_independence")] == "true"
          assert topology[("concentrated_capture", "compliant_with_declared_policy")] == "false"
          assert topology[("concentrated_capture", "appeal_independence")] == "false"

          safe_conflicts = [r for r in rows if r["record_type"] == "role_conflict" and r["case_id"] == "separated_roles"]
          captured_conflicts = [r for r in rows if r["record_type"] == "role_conflict" and r["case_id"] == "concentrated_capture"]
          assert len(safe_conflicts) == 0
          assert len(captured_conflicts) >= 3

          decision = {
              (r["case_id"], r["metric"]): r["value"]
              for r in rows if r["record_type"] == "decision_trace_metric"
          }
          assert decision[("proposal_separated", "compliant_with_reference_separation")] == "true"
          assert decision[("proposal_capture", "compliant_with_reference_separation")] == "false"

          print("CIVDYN-AUTH-001 exact power indices, dictator/veto flags, role separation and independent appeal controls verified.")
          PY

          {
            echo "## CIVDYN-AUTH-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-authority-evidence/authority-power-sweep.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: exact small weighted voting games and declared role policies"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authority power evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-authority-power-sweep
          path: target/civdyn-authority-evidence/authority-power-sweep.csv
          if-no-files-found: error
          retention-days: 30
