name: GeoFusion Thermal Transient Oracle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research/geofusion-thermal-transient-oracle/**"
      - ".github/workflows/geofusion-thermal-transient-oracle.yml"
  push:
    branches: ["main"]
    paths:
      - "research/geofusion-thermal-transient-oracle/**"
      - ".github/workflows/geofusion-thermal-transient-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geofusion-thermal-transient-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Verify closed-form transient reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check format
        run: cargo fmt --manifest-path research/geofusion-thermal-transient-oracle/Cargo.toml -- --check
      - name: Test analytic known answers and metamorphic properties
        run: cargo test --manifest-path research/geofusion-thermal-transient-oracle/Cargo.toml --all-targets
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/geofusion-thermal-transient-oracle/Cargo.toml --all-targets -- -D warnings
