name: Temporary UQ-006 variance-scale verification

on:
  push:
    branches:
      - research/ehd-piv-empirical-spatial-fit-v0-7
    paths:
      - .github/workflows/verify-uq006-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format UQ-006 crate
        run: cargo fmt --manifest-path tools/ehd-piv-empirical-spatial-fit/Cargo.toml
      - name: Commit pinned formatting
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/ehd-piv-empirical-spatial-fit
            git commit -m "style(ehd-piv): format UQ-006 variance-scale qualification"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ehd-piv-empirical-spatial-fit/Cargo.toml -- --check
      - name: Run unit tests
        run: cargo test --manifest-path tools/ehd-piv-empirical-spatial-fit/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/ehd-piv-empirical-spatial-fit/Cargo.toml --all-targets -- -D warnings
