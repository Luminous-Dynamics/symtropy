name: CivBench event evaluator

on:
  pull_request:
    paths:
      - "research/civbench-event-evaluator/**"
      - ".github/workflows/civbench-event-evaluator.yml"
  push:
    paths:
      - "research/civbench-event-evaluator/**"
      - ".github/workflows/civbench-event-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-evaluator:
    name: Test CivBench event evaluator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate standalone package and committed lock
        run: |
          set -euo pipefail
          cargo metadata --locked --manifest-path research/civbench-event-evaluator/Cargo.toml --no-deps >/dev/null
          git diff --exit-code -- research/civbench-event-evaluator/Cargo.lock

      - name: Check formatting
        run: cargo fmt --manifest-path research/civbench-event-evaluator/Cargo.toml --all -- --check

      - name: Check all targets
        run: cargo check --locked --manifest-path research/civbench-event-evaluator/Cargo.toml --all-targets

      - name: Run tests
        run: cargo test --locked --manifest-path research/civbench-event-evaluator/Cargo.toml --all-targets

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civbench-event-evaluator/Cargo.toml --all-targets -- -D warnings

      - name: Build documentation
        run: cargo doc --locked --manifest-path research/civbench-event-evaluator/Cargo.toml --no-deps
