name: Plasma metriplectic structure audit

on:
  push:
    branches:
      - research/plasma-metriplectic-audit-v0-1-2026-11-20
    paths:
      - "crates/tools/plasma-metriplectic-audit/**"
      - "benchmarks/plasma/metriplectic-audit-*.json"
      - ".github/workflows/plasma-metriplectic-audit.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-metriplectic-audit/**"
      - "benchmarks/plasma/metriplectic-audit-v0.json"
      - ".github/workflows/plasma-metriplectic-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-metriplectic-audit/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-metriplectic-audit/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-metriplectic-audit/Cargo.toml --all-targets -- -D warnings
      - name: Audit mixed reversible-dissipative fixture
        run: cargo run --locked --manifest-path crates/tools/plasma-metriplectic-audit/Cargo.toml -- benchmarks/plasma/metriplectic-audit-v0.json
      - name: Confirm an indefinite dissipator fails closed
        shell: bash
        run: |
          report="$(mktemp)"
          if cargo run --locked --manifest-path crates/tools/plasma-metriplectic-audit/Cargo.toml -- benchmarks/plasma/metriplectic-audit-indefinite-v0.json >"$report"; then
            echo "indefinite dissipator unexpectedly returned exit 0"
            exit 1
          fi
          jq -e '.body.disposition == "rejected" and any(.body.findings[]; .code == "dissipative_operator_not_positive_semidefinite")' "$report" >/dev/null
