name: Temporary Event PIV acquisition verification

on:
  push:
    branches:
      - research/ehd-piv-event-acquisition-v0-1

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format event acquisition crate
        run: cargo fmt --manifest-path tools/ehd-piv-event-acquisition/Cargo.toml
      - name: Commit pinned formatting
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/ehd-piv-event-acquisition
            git commit -m "style(ehd-piv): format event acquisition planner with Rust 1.96"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ehd-piv-event-acquisition/Cargo.toml -- --check
      - name: Run unit tests
        run: cargo test --manifest-path tools/ehd-piv-event-acquisition/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/ehd-piv-event-acquisition/Cargo.toml --all-targets -- -D warnings
