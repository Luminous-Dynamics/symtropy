name: GeoFusion FMI API Ledger Fixture Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research/geofusion-fmi-api-ledger-v0.1/**"
      - ".github/workflows/geofusion-fmi-api-ledger.yml"
  push:
    branches: ["main"]
    paths:
      - "research/geofusion-fmi-api-ledger-v0.1/**"
      - ".github/workflows/geofusion-fmi-api-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geofusion-fmi-api-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixture-audit:
    name: Audit schema, artifacts, exchanges and trace links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: research/geofusion-fmi-api-ledger-v0.1/tests/requirements.txt
      - name: Install pinned test-only schema validator
        run: python -m pip install --requirement research/geofusion-fmi-api-ledger-v0.1/tests/requirements.txt
      - name: Audit positive fixture and frozen corpus shape
        run: python research/geofusion-fmi-api-ledger-v0.1/tests/audit_fixture.py
