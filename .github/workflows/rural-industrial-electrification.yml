name: Rural, Industrial and EV Platform Design Screen

on:
  pull_request:
    paths:
      - "tools/rural-industrial-electrification-evaluator/**"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_PORTFOLIO_V0_1.md"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_CARDS_V0_1.md"
      - "docs/research/EV_MISSION_PHYSICS_SCREEN_V0_2.md"
      - "docs/research/EV_PLATFORM_FAMILIES_AND_INTERFACES_V0_1.md"
      - "docs/research/EV_VERIFICATION_AND_BENCHMARKS_V0_1.md"
      - "docs/research/EV_CHARGING_QUEUE_SCREEN_V0_1.md"
      - "docs/research/EV_CHARGING_CURVE_SCREEN_V0_1.md"
      - ".github/workflows/rural-industrial-electrification.yml"
  push:
    branches: [main]
    paths:
      - "tools/rural-industrial-electrification-evaluator/**"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_PORTFOLIO_V0_1.md"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_CARDS_V0_1.md"
      - "docs/research/EV_MISSION_PHYSICS_SCREEN_V0_2.md"
      - "docs/research/EV_PLATFORM_FAMILIES_AND_INTERFACES_V0_1.md"
      - "docs/research/EV_VERIFICATION_AND_BENCHMARKS_V0_1.md"
      - "docs/research/EV_CHARGING_QUEUE_SCREEN_V0_1.md"
      - "docs/research/EV_CHARGING_CURVE_SCREEN_V0_1.md"
      - ".github/workflows/rural-industrial-electrification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml --all -- --check
      - name: Check schema documents are valid JSON
        run: |
          jq empty tools/rural-industrial-electrification-evaluator/schemas/vehicle_designs_v0_1.schema.json
          jq empty tools/rural-industrial-electrification-evaluator/schemas/vehicle_missions_v0_2.schema.json
          jq empty tools/rural-industrial-electrification-evaluator/schemas/vehicle_platforms_v0_1.schema.json
          jq empty tools/rural-industrial-electrification-evaluator/schemas/vehicle_subsystem_architectures_v0_1.schema.json
          jq empty tools/rural-industrial-electrification-evaluator/schemas/vehicle_verification_matrix_v0_1.schema.json
          jq empty tools/rural-industrial-electrification-evaluator/schemas/charging_queue_v0_1.schema.json
          jq empty tools/rural-industrial-electrification-evaluator/schemas/charging_curve_v0_1.schema.json
      - name: Run all evaluator tests
        run: cargo test --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml --all-targets
      - name: Run shift energy screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin rural-industrial-electrification-evaluator -- \
            tools/rural-industrial-electrification-evaluator/fixtures/benchmark_v0_1.json > shift-report.json
          jq -e '.results | length == 5' shift-report.json
      - name: Run industrial and mobile energy-path screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin energy_path_screen -- \
            tools/rural-industrial-electrification-evaluator/fixtures/energy_paths_v0_1.json > path-report.json
          jq -e '.results | length == 8' path-report.json
      - name: Run chronological energy dispatch screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin energy_dispatch_screen -- \
            tools/rural-industrial-electrification-evaluator/fixtures/dispatch_profiles_v0_1.json > dispatch-report.json
          jq -e '.results | length == 4 and all(.[]; .maximum_absolute_energy_balance_residual_kwh < 0.000001)' dispatch-report.json
      - name: Run electric mobility design screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin vehicle_design_screen -- \
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json > vehicle-design-report.json
          jq -e '.results | length == 19 and all(.[]; .evidence_class == "synthetic" and (.status == "passes_synthetic_screen" or .status == "blocked"))' vehicle-design-report.json
          jq -e '[.results[] | select(.design_id == "open-pit-haul-battery-only-control") | .status] == ["blocked"]' vehicle-design-report.json
          jq -e '[.results[] | select(.design_id != "open-pit-haul-battery-only-control") | select(.status != "passes_synthetic_screen")] | length == 0' vehicle-design-report.json
      - name: Run longitudinal EV mission physics screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin vehicle_mission_physics -- \
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json \
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_missions_v0_2.json > vehicle-mission-report.json
          jq -e '.results | length == 19 and ([.[].design_id] | unique | length == 19) and all(.[]; .evidence_class == "synthetic" and (.status == "passes_synthetic_screen" or .status == "blocked"))' vehicle-mission-report.json
          jq -e '[.results[] | select(.status == "blocked") | .scenario_id] == ["compact-ev-city-arterial", "light-van-delivery-route", "open-pit-haul-steep-loaded-stress", "rural-4x4-field-support"]' vehicle-mission-report.json
          jq -e '[.results[] | select(.scenario_id == "open-pit-haul-steep-loaded-stress") | .status] == ["blocked"]' vehicle-mission-report.json
      - name: Validate all vehicle designs and platform-contract mappings
        run: |
          jq -e '.schema_version == "0.1.0" and .programme_id == "EV-PLATFORM-001" and (.shared_interface_contracts | length == 11) and (.platform_families | length == 10)' tools/rural-industrial-electrification-evaluator/fixtures/vehicle_platforms_v0_1.json
          jq -e '.schema_version == "0.1.0" and .programme_id == "EV-PLATFORM-001" and (.architecture_patterns | length == 9) and ([.architecture_patterns[].pattern_id] | unique | length == 9) and (.designs | length == 19) and all(.designs[]; (.subsystems | length == 6) and ([.subsystems[].subsystem_id] | unique | length == 6) and all(.subsystems[]; .status == "conceptual"))' tools/rural-industrial-electrification-evaluator/fixtures/vehicle_subsystem_architectures_v0_1.json
          jq -en --slurpfile cat tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json --slurpfile p tools/rural-industrial-electrification-evaluator/fixtures/vehicle_platforms_v0_1.json --slurpfile m tools/rural-industrial-electrification-evaluator/fixtures/vehicle_missions_v0_2.json --slurpfile a tools/rural-industrial-electrification-evaluator/fixtures/vehicle_subsystem_architectures_v0_1.json '
            ($cat[0].designs | map(.design_id) | sort) as $designs |
            ($p[0].platform_families | map(.design_ids[]) | sort) as $mapped |
            ($p[0].shared_interface_contracts | map(.contract_id) | sort) as $contracts |
            ($p[0].platform_families | map(.shared_contracts[]) | unique | sort) as $used |
            ($m[0].scenarios | map(.design_id) | sort) as $mission_designs |
            ($a[0].designs | map(.design_id) | sort) as $architecture_designs |
            ($a[0].architecture_patterns | map(.pattern_id) | sort) as $pattern_ids |
            ($p[0].platform_families | map(.platform_family_id)) as $family_ids |
            ($a[0].designs | all(.[]; (.platform_family_id as $fid | $family_ids | index($fid)) != null and (.architecture_pattern_id as $pid | $pattern_ids | index($pid)) != null)) as $refs_ok |
            ($designs == $mapped and ($mapped | length) == 19 and ($mapped | unique | length) == 19 and
             $designs == $mission_designs and ($mission_designs | unique | length) == 19 and
             $designs == $architecture_designs and ($architecture_designs | unique | length) == 19 and
             $contracts == $used and $refs_ok)
          '
      - name: Run fleet charging queue policy comparison
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml --bin charging_queue_screen -- tools/rural-industrial-electrification-evaluator/fixtures/charging_queue_v0_1.json > charging-queue-report.json
          jq -e '.results | length == 10 and all(.[]; .evidence_class == "synthetic" and .site_power_limit_respected and .energy_balance_residual_kwh > -0.000001 and .energy_balance_residual_kwh < 0.000001 and (.jobs | length > 0) and all(.jobs[]; .maximum_site_input_power_kw <= .maximum_allowed_site_input_power_kw + 0.00000001))' charging-queue-report.json
          jq -e '[.results[] | select(.scenario_id == "deadline-policy-oracle" and .policy == "fcfs") | .missed_deadlines] == [1]' charging-queue-report.json
          jq -e '[.results[] | select(.scenario_id == "deadline-policy-oracle" and .policy == "earliest_deadline_first") | .missed_deadlines] == [0]' charging-queue-report.json
          jq -e '[.results[].jobs[]] | length == 58' charging-queue-report.json
      - name: Run SOC-dependent charge curve screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml --bin charging_curve_screen -- tools/rural-industrial-electrification-evaluator/fixtures/charging_curve_v0_1.json > charging-curve-report.json
          jq -e '.results | length == 5 and all(.[]; .evidence_class == "synthetic" and .total_battery_energy_delivered_kwh > 0 and .total_charge_duration_minutes > 0 and .energy_balance_residual_kwh > -0.000001 and .energy_balance_residual_kwh < 0.000001 and (.results | length > 0))' charging-curve-report.json
          jq -e '[.results[].results[]] | all(.[]; .effective_battery_charge_power_kw <= .external_battery_side_power_limit_kw + 0.00000001 and .duration_minutes > 0 and .battery_energy_kwh > 0)' charging-curve-report.json
      - name: Validate EV verification matrix coverage and hard gates
        run: |
          jq -e '.schema_version == "0.1.0" and .programme_id == "EV-VALIDATION-001" and .design_count == 19 and .gates_per_design == 5 and (.designs | length == 19) and ([.designs[].design_id] | unique | length == 19) and all(.designs[]; (.verification_gates | length == 5) and all(.verification_gates[]; .release_blocking == true and (.test_id | length > 0) and (.measurement_set | length > 0) and (.evidence_required | length > 0))) and ([.designs[].verification_gates[].test_id] | unique | length == 95) and (.cross_class_invariants | length >= 5)' tools/rural-industrial-electrification-evaluator/fixtures/vehicle_verification_matrix_v0_1.json
          jq -en --slurpfile cat tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json --slurpfile p tools/rural-industrial-electrification-evaluator/fixtures/vehicle_platforms_v0_1.json --slurpfile v tools/rural-industrial-electrification-evaluator/fixtures/vehicle_verification_matrix_v0_1.json '
            ($cat[0].designs | map(.design_id) | sort) as $designs |
            ($p[0].platform_families | map(.platform_family_id)) as $families |
            ($v[0].designs | map(.design_id) | sort) as $verified |
            ($v[0].designs | all(.[]; (.platform_family_id as $id | $families | index($id)) != null)) as $family_refs_ok |
            ($designs == $verified and ($verified | unique | length) == 19 and $family_refs_ok)
          '
      - name: Hash deterministic screen reports and inputs
        run: sha256sum shift-report.json path-report.json dispatch-report.json vehicle-design-report.json vehicle-mission-report.json charging-queue-report.json charging-curve-report.json tools/rural-industrial-electrification-evaluator/fixtures/charging_curve_v0_1.json tools/rural-industrial-electrification-evaluator/schemas/charging_curve_v0_1.schema.json docs/research/EV_CHARGING_CURVE_SCREEN_V0_1.md tools/rural-industrial-electrification-evaluator/fixtures/charging_queue_v0_1.json tools/rural-industrial-electrification-evaluator/schemas/charging_queue_v0_1.schema.json docs/research/EV_CHARGING_QUEUE_SCREEN_V0_1.md tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json tools/rural-industrial-electrification-evaluator/fixtures/vehicle_missions_v0_2.json tools/rural-industrial-electrification-evaluator/fixtures/vehicle_platforms_v0_1.json tools/rural-industrial-electrification-evaluator/schemas/vehicle_designs_v0_1.schema.json tools/rural-industrial-electrification-evaluator/schemas/vehicle_missions_v0_2.schema.json tools/rural-industrial-electrification-evaluator/schemas/vehicle_platforms_v0_1.schema.json tools/rural-industrial-electrification-evaluator/fixtures/vehicle_subsystem_architectures_v0_1.json tools/rural-industrial-electrification-evaluator/schemas/vehicle_subsystem_architectures_v0_1.schema.json docs/research/ELECTRIC_MOBILITY_DESIGN_PORTFOLIO_V0_1.md docs/research/ELECTRIC_MOBILITY_DESIGN_CARDS_V0_1.md docs/research/EV_MISSION_PHYSICS_SCREEN_V0_2.md docs/research/EV_PLATFORM_FAMILIES_AND_INTERFACES_V0_1.md tools/rural-industrial-electrification-evaluator/fixtures/vehicle_verification_matrix_v0_1.json tools/rural-industrial-electrification-evaluator/schemas/vehicle_verification_matrix_v0_1.schema.json docs/research/EV_VERIFICATION_AND_BENCHMARKS_V0_1.md > screen-report.sha256
      - name: Upload reproducible screen reports
        uses: actions/upload-artifact@v4
        with:
          name: rural-industrial-ev-screen-reports-${{ github.sha }}
          path: |
            shift-report.json
            path-report.json
            dispatch-report.json
            vehicle-design-report.json
            vehicle-mission-report.json
            charging-queue-report.json
            charging-curve-report.json
            screen-report.sha256
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_missions_v0_2.json
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_platforms_v0_1.json
            tools/rural-industrial-electrification-evaluator/schemas/vehicle_designs_v0_1.schema.json
            tools/rural-industrial-electrification-evaluator/schemas/vehicle_missions_v0_2.schema.json
            tools/rural-industrial-electrification-evaluator/schemas/vehicle_platforms_v0_1.schema.json
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_subsystem_architectures_v0_1.json
            tools/rural-industrial-electrification-evaluator/schemas/vehicle_subsystem_architectures_v0_1.schema.json
            docs/research/ELECTRIC_MOBILITY_DESIGN_PORTFOLIO_V0_1.md
            docs/research/ELECTRIC_MOBILITY_DESIGN_CARDS_V0_1.md
            docs/research/EV_MISSION_PHYSICS_SCREEN_V0_2.md
            docs/research/EV_PLATFORM_FAMILIES_AND_INTERFACES_V0_1.md
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_verification_matrix_v0_1.json
            tools/rural-industrial-electrification-evaluator/schemas/vehicle_verification_matrix_v0_1.schema.json
            docs/research/EV_VERIFICATION_AND_BENCHMARKS_V0_1.md
            docs/research/EV_CHARGING_QUEUE_SCREEN_V0_1.md
            tools/rural-industrial-electrification-evaluator/fixtures/charging_queue_v0_1.json
            tools/rural-industrial-electrification-evaluator/schemas/charging_queue_v0_1.schema.json
            tools/rural-industrial-electrification-evaluator/fixtures/charging_curve_v0_1.json
            tools/rural-industrial-electrification-evaluator/schemas/charging_curve_v0_1.schema.json
            docs/research/EV_CHARGING_CURVE_SCREEN_V0_1.md
          if-no-files-found: error
          retention-days: 14
