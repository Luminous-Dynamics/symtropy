name: Rural, Industrial and EV Platform Design Screen

on:
  pull_request:
    paths:
      - "tools/rural-industrial-electrification-evaluator/**"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_PORTFOLIO_V0_1.md"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_CARDS_V0_1.md"
      - "docs/research/EV_MISSION_PHYSICS_SCREEN_V0_2.md"
      - ".github/workflows/rural-industrial-electrification.yml"
  push:
    branches: [main]
    paths:
      - "tools/rural-industrial-electrification-evaluator/**"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_PORTFOLIO_V0_1.md"
      - "docs/research/ELECTRIC_MOBILITY_DESIGN_CARDS_V0_1.md"
      - "docs/research/EV_MISSION_PHYSICS_SCREEN_V0_2.md"
      - ".github/workflows/rural-industrial-electrification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml --all -- --check
      - name: Run all evaluator tests
        run: cargo test --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml --all-targets
      - name: Run shift energy screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin rural-industrial-electrification-evaluator -- \
            tools/rural-industrial-electrification-evaluator/fixtures/benchmark_v0_1.json > shift-report.json
          jq -e '.results | length == 5' shift-report.json
      - name: Run industrial and mobile energy-path screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin energy_path_screen -- \
            tools/rural-industrial-electrification-evaluator/fixtures/energy_paths_v0_1.json > path-report.json
          jq -e '.results | length == 8' path-report.json
      - name: Run chronological energy dispatch screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin energy_dispatch_screen -- \
            tools/rural-industrial-electrification-evaluator/fixtures/dispatch_profiles_v0_1.json > dispatch-report.json
          jq -e '.results | length == 4 and all(.[]; .maximum_absolute_energy_balance_residual_kwh < 0.000001)' dispatch-report.json
      - name: Run electric mobility design screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin vehicle_design_screen -- \
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json > vehicle-design-report.json
          jq -e '.results | length == 19 and all(.[]; .evidence_class == "synthetic" and (.status == "passes_synthetic_screen" or .status == "blocked"))' vehicle-design-report.json
          jq -e '[.results[] | select(.design_id == "open-pit-haul-battery-only-control") | .status] == ["blocked"]' vehicle-design-report.json
          jq -e '[.results[] | select(.design_id != "open-pit-haul-battery-only-control") | select(.status != "passes_synthetic_screen")] | length == 0' vehicle-design-report.json
      - name: Run longitudinal EV mission physics screen
        run: |
          cargo run --quiet --manifest-path tools/rural-industrial-electrification-evaluator/Cargo.toml \
            --bin vehicle_mission_physics -- \
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_designs_v0_1.json \
            tools/rural-industrial-electrification-evaluator/fixtures/vehicle_missions_v0_2.json > vehicle-mission-report.json
          jq -e '.results | length == 19 and ([.[].design_id] | unique | length == 19) and all(.[]; .evidence_class == "synthetic" and (.status == "passes_synthetic_screen" or .status == "blocked"))' vehicle-mission-report.json
          jq -e '[.results[] | select(.status == "blocked") | .scenario_id] == ["compact-ev-city-arterial", "light-van-delivery-route", "open-pit-haul-steep-loaded-stress", "rural-4x4-field-support"]' vehicle-mission-report.json
          jq -e '[.results[] | select(.scenario_id == "open-pit-haul-steep-loaded-stress") | .status] == ["blocked"]' vehicle-mission-report.json
      - name: Hash deterministic screen reports
        run: sha256sum shift-report.json path-report.json dispatch-report.json vehicle-design-report.json vehicle-mission-report.json > screen-report.sha256
      - name: Upload reproducible screen reports
        uses: actions/upload-artifact@v4
        with:
          name: rural-industrial-ev-screen-reports-${{ github.sha }}
          path: |
            shift-report.json
            path-report.json
            dispatch-report.json
            vehicle-design-report.json
            vehicle-mission-report.json
            screen-report.sha256
          if-no-files-found: error
          retention-days: 14
