name: Energy Service Capability Profile

on:
  push:
    branches: ["main"]
    paths:
      - "research/energy-service-capability-profile-v0/**"
      - "tools/energy-service-capability-profile/**"
      - ".github/workflows/energy-service-capability-profile.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/energy-service-capability-profile-v0/**"
      - "tools/energy-service-capability-profile/**"
      - ".github/workflows/energy-service-capability-profile.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test capability profile compatibility matcher
        run: cargo test --locked --manifest-path tools/energy-service-capability-profile/Cargo.toml
      - name: Evaluate receiver service request
        run: cargo run --locked --manifest-path tools/energy-service-capability-profile/Cargo.toml -- research/energy-service-capability-profile-v0/synthetic-offers.tsv research/energy-service-capability-profile-v0/docked-receiver-request.tsv
