name: Sawlog Benchmark Contract

on:
  push:
    branches: ["feat/sawlog-benchmark-contract-v0-1"]
    paths:
      - "docs/tech/SAWLOG_BENCHMARK_CONTRACT_V0_1.md"
      - "docs/tech/sawlog-benchmark-corpus-v0.1.json"
      - "tools/sawlog-benchmark/**"
      - ".github/workflows/sawlog-benchmark.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/SAWLOG_BENCHMARK_CONTRACT_V0_1.md"
      - "docs/tech/sawlog-benchmark-corpus-v0.1.json"
      - "tools/sawlog-benchmark/**"
      - ".github/workflows/sawlog-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sawlog-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/sawlog-benchmark/Cargo.toml -- --check
      - name: Run contract and adversarial tests
        run: cargo test --manifest-path tools/sawlog-benchmark/Cargo.toml
      - name: Validate the frozen corpus at the exact source commit
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/sawlog-benchmark/Cargo.toml -- \
            docs/tech/sawlog-benchmark-corpus-v0.1.json \
            --source-commit "$source_commit" > sawlog-benchmark-receipt.json
          jq -e '
            .result == "pass"
            and .scenario_count == 2
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and ([.scenarios[].scenario_id] == ["SYNTHETIC_TAPERED_STRAIGHT_COMPLETE", "SYNTHETIC_SWEEP_AND_KNOT_PARTIAL"])
            and ([.scenarios[].observed_board_count] == [2, 3])
            and ([.scenarios[].accounting_status] == ["within_tolerance", "partial_only"])
            and ([.scenarios[].section_station_count] == [4, 5])
            and ([.scenarios[].defect_count] == [0, 2])
          ' sawlog-benchmark-receipt.json
      - name: Upload deterministic contract receipt
        uses: actions/upload-artifact@v4
        with:
          name: sawlog-benchmark-contract-receipt
          path: sawlog-benchmark-receipt.json
          if-no-files-found: error
          retention-days: 90
