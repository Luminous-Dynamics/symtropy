name: Scan-to-BIM Admission Synthetic Oracle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/scan-bim-admission-oracle/**"
      - "docs/research/built-asset/scan-bim/**"
      - ".github/workflows/scan-bim-admission-oracle.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/scan-bim-admission-oracle/**"
      - "docs/research/built-asset/scan-bim/**"
      - ".github/workflows/scan-bim-admission-oracle.yml"

permissions:
  contents: read

concurrency:
  group: scan-bim-admission-oracle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-oracle:
    name: Scan-to-BIM admission oracle (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/scan-bim-admission-oracle/Cargo.toml -- --check
      - name: Test independent oracle
        run: cargo test --manifest-path tools/scan-bim-admission-oracle/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path tools/scan-bim-admission-oracle/Cargo.toml --all-targets -- -D warnings
      - name: Evaluate frozen corpus
        run: |
          cargo run --manifest-path tools/scan-bim-admission-oracle/Cargo.toml -- \
            --corpus docs/research/built-asset/scan-bim/v0.1/corpus.json \
            > /tmp/scan-bim-admission-report.json
          jq -e '.passed == true and .case_count == 25 and .mismatched_cases == 0' \
            /tmp/scan-bim-admission-report.json
