name: PB-04a Spatial Topology Qualification

on:
  push:
    branches:
      - "spatial/pb04a-faceted-topology-kernel"
    paths:
      - "crates/domains/symtropy-spatial-topology/**"
      - ".github/workflows/pb04a-spatial-topology-qualification.yml"
  pull_request:
    paths:
      - "crates/domains/symtropy-spatial-topology/**"
      - ".github/workflows/pb04a-spatial-topology-qualification.yml"

permissions:
  contents: read

concurrency:
  group: pb04a-spatial-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify PB-04a exact locked execution subject
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind executed Git subject and ephemeral build path
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04a-target" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${actual_head}" = "${GITHUB_SHA}"
            echo "PB04A_PRODUCT_HEAD=${actual_head}"
            echo "PB04A_PRODUCT_TREE=${actual_tree}"
          else
            mapfile -t parents < <(git rev-list --parents -n 1 HEAD)
            read -r -a tuple <<< "${parents[0]}"
            test "${#tuple[@]}" -eq 3
            test "${tuple[1]}" = "${{ github.event.pull_request.base.sha }}"
            test "${tuple[2]}" = "${{ github.event.pull_request.head.sha }}"
            echo "PB04A_INTEGRATION_BASE=${tuple[1]}"
            echo "PB04A_INTEGRATION_HEAD=${tuple[2]}"
            echo "PB04A_INTEGRATION_MERGE=${actual_head}"
            echo "PB04A_INTEGRATION_TREE=${actual_tree}"
          fi

      - name: Require committed nested dependency lock
        shell: bash
        run: |
          set -euo pipefail
          lock="crates/domains/symtropy-spatial-topology/Cargo.lock"
          test -s "${lock}" || {
            echo "PB-04a qualification refuses an unlocked/pre-product subject" >&2
            exit 1
          }
          git ls-files --error-unmatch "${lock}" >/dev/null
          echo "PB04A_LOCK_STATE=frozen-product"
          echo "PB04A_LOCK_BLOB=$(git hash-object "${lock}")"
          echo "PB04A_LOCK_SHA256=$(sha256sum "${lock}" | awk '{print $1}')"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PB04A_RUNNER_OS=${RUNNER_OS}"
          echo "PB04A_RUNNER_ARCH=${RUNNER_ARCH}"
          echo "PB04A_IMAGE_OS=${ImageOS:-unknown}"
          echo "PB04A_IMAGE_VERSION=${ImageVersion:-unknown}"
          echo "PB04A_CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          uname -a
          git --version

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Verify locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --format-version 1 > "${RUNNER_TEMP}/pb04a-cargo-metadata.json"
          echo "PB04A_LOCKED_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/pb04a-cargo-metadata.json" | awk '{print $1}')"

      - name: Canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml -- --check

      - name: Check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --all-targets

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked

      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --all-targets -- -D warnings

      - name: Prove checkout unchanged
        shell: bash
        run: |
          set -euo pipefail
          test ! -e crates/domains/symtropy-spatial-topology/target
          git diff --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "${status}" ]]; then
            echo "PB-04a qualification mutated the checkout:" >&2
            printf '%s\n' "${status}" >&2
            exit 1
          fi
