name: Maritime sail capability profile and impact assurance

on:
  push:
    branches: ["research/maritime-sail-capability-profile-v0-2"]
    paths:
      - "tools/maritime-observability-evidence-validator/src/bin/sail_capability_profile.rs"
      - "tools/maritime-observability-evidence-validator/src/bin/sail_capability_impact.rs"
      - "tools/maritime-observability-evidence-validator/src/bin/qualification_scope.rs"
      - "benchmarks/maritime-observability/sail-capability-profile.v0.1.json"
      - "benchmarks/maritime-observability/sail-capability-scope-cases.v0.1.json"
      - "benchmarks/maritime-observability/sail-capability-impact-cases.v0.1.json"
      - "docs/tech/MARITIME_SAIL_CAPABILITY_*.json"
      - ".github/workflows/maritime-sail-capability-profile.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/maritime-observability-evidence-validator/src/bin/sail_capability_profile.rs"
      - "tools/maritime-observability-evidence-validator/src/bin/sail_capability_impact.rs"
      - "tools/maritime-observability-evidence-validator/src/bin/qualification_scope.rs"
      - "benchmarks/maritime-observability/sail-capability-profile.v0.1.json"
      - "benchmarks/maritime-observability/sail-capability-scope-cases.v0.1.json"
      - "benchmarks/maritime-observability/sail-capability-impact-cases.v0.1.json"
      - "docs/tech/MARITIME_SAIL_CAPABILITY_*.json"
      - ".github/workflows/maritime-sail-capability-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-sail-capability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Assert exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "source_commit=$actual"

      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            tools/maritime-observability-evidence-validator/src/bin/qualification_scope.rs \
            tools/maritime-observability-evidence-validator/src/bin/sail_capability_profile.rs \
            tools/maritime-observability-evidence-validator/src/bin/sail_capability_impact.rs

      - name: Run exact-head Rust tests
        run: cargo test --locked --manifest-path tools/maritime-observability-evidence-validator/Cargo.toml --bin qualification_scope --bin sail_capability_profile --bin sail_capability_impact

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/maritime-observability-evidence-validator/Cargo.toml --all-targets -- -D warnings

      - name: Execute sail capability-specific qualification cases
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          input="benchmarks/maritime-observability/sail-capability-scope-cases.v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked \
            --manifest-path tools/maritime-observability-evidence-validator/Cargo.toml \
            --bin qualification_scope -- "$input" \
            --source-commit "$source_commit" --case-sha256 "$digest" > sail-capability-scope-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '
            .result == "pass"
            and .source_commit == $source
            and .case_sha256 == $digest
            and .case_count == 16
            and .disposition_counts.SUPPORTED == 7
            and .disposition_counts.REQUALIFICATION_REQUIRED == 3
            and .disposition_counts.EXPIRED == 3
            and .disposition_counts.NOT_EVALUATED == 1
            and .disposition_counts.CONFLICTED == 1
            and .disposition_counts.OUT_OF_SCOPE == 1
            and .mutation_performed == false
            and .authorization_granted == false
            and .physical_qualification_established == false
          ' sail-capability-scope-receipt.json

      - name: Execute sail capability graph profile
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          profile="benchmarks/maritime-observability/sail-capability-profile.v0.1.json"
          cases="benchmarks/maritime-observability/sail-capability-scope-cases.v0.1.json"
          profile_digest="$(sha256sum "$profile" | awk '{print $1}')"
          cases_digest="$(sha256sum "$cases" | awk '{print $1}')"
          cargo run --quiet --locked \
            --manifest-path tools/maritime-observability-evidence-validator/Cargo.toml \
            --bin sail_capability_profile -- "$profile" "$cases" \
            --source-commit "$source_commit" --profile-sha256 "$profile_digest" \
            --cases-sha256 "$cases_digest" > sail-capability-profile-receipt.json
          jq -e --arg source "$source_commit" --arg profile "$profile_digest" --arg cases "$cases_digest" '
            .result == "pass"
            and .source_commit == $source
            and .profile_sha256 == $profile
            and .qualification_cases_sha256 == $cases
            and .capability_count == 7
            and .dependency_edge_count == 9
            and .qualification_case_count == 16
            and .capabilities_with_nominal_scope_cases == 7
            and .change_scenario_count == 5
            and .acyclic == true
            and .mutation_performed == false
            and .authorization_granted == false
            and .actuator_commands_emitted == false
          ' sail-capability-profile-receipt.json

      - name: Execute sail capability impact closure
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          profile="benchmarks/maritime-observability/sail-capability-profile.v0.1.json"
          events="benchmarks/maritime-observability/sail-capability-impact-cases.v0.1.json"
          profile_digest="$(sha256sum "$profile" | awk '{print $1}')"
          events_digest="$(sha256sum "$events" | awk '{print $1}')"
          cargo run --quiet --locked \
            --manifest-path tools/maritime-observability-evidence-validator/Cargo.toml \
            --bin sail_capability_impact -- "$profile" "$events" \
            --source-commit "$source_commit" --profile-sha256 "$profile_digest" \
            --events-sha256 "$events_digest" > sail-capability-impact-receipt.json
          jq -e --arg source "$source_commit" --arg profile "$profile_digest" --arg events "$events_digest" '
            .result == "pass"
            and .source_commit == $source
            and .profile_sha256 == $profile
            and .impact_cases_sha256 == $events
            and .capability_count == 7
            and .event_count == 8
            and .all_expected_impact_closures_matched == true
            and .mutation_performed == false
            and .authorization_granted == false
            and .actuator_commands_emitted == false
          ' sail-capability-impact-receipt.json

      - name: Upload exact-head evidence receipts
        uses: actions/upload-artifact@v4
        with:
          name: sail-capability-evidence-${{ github.run_id }}
          path: |
            sail-capability-scope-receipt.json
            sail-capability-profile-receipt.json
            sail-capability-impact-receipt.json
          if-no-files-found: error
          retention-days: 90
