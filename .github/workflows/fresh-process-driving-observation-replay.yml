name: fresh-process-driving-observation-replay

on:
  pull_request:
    paths:
      - "research/fresh-process-driving-observation-replay-001/**"
      - ".github/workflows/fresh-process-driving-observation-replay.yml"
  push:
    paths:
      - "research/fresh-process-driving-observation-replay-001/**"
      - ".github/workflows/fresh-process-driving-observation-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Export canonical Rust 1.96 rustfmt output (format bootstrap)
        run: |
          files=(
            research/fresh-process-driving-observation-replay-001/src/main.rs
          )
          rustfmt --edition 2024 "${files[@]}"
          export_formatted() {
            name="$1"
            file="$2"
            echo "__FORMAT_EXPORT_BEGIN_${name}__"
            base64 -w0 "$file" | fold -w 4000
            echo "__FORMAT_EXPORT_END_${name}__"
          }
          export_formatted REPLAY_MAIN "${files[0]}"

      - name: Run deterministic fixture tests
        run: cargo test --locked --manifest-path research/fresh-process-driving-observation-replay-001/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/fresh-process-driving-observation-replay-001/Cargo.toml --all-targets --all-features -- -D warnings
