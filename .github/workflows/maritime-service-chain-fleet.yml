name: maritime-service-chain-fleet

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/maritime-service-chain/**"
      - "benchmarks/maritime-service-chain-fleet/**"
      - ".github/workflows/maritime-service-chain-fleet.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/maritime-service-chain/**"
      - "benchmarks/maritime-service-chain-fleet/**"
      - ".github/workflows/maritime-service-chain-fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-service-chain-fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/maritime-service-chain-fleet/Cargo.toml -- --check
      - name: Test shared-resource oracle
        run: cargo test --locked --manifest-path benchmarks/maritime-service-chain-fleet/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path benchmarks/maritime-service-chain-fleet/Cargo.toml --all-targets -- -D warnings
