name: HoloFrac spatial retrieval

on:
  push:
    branches:
      - research/holofrac-architecture-v0
    paths:
      - "research/holofrac-retrieval/**"
      - "crates/core/symtropy-hdc-core/**"
      - ".github/workflows/holofrac-spatial-retrieval.yml"
  pull_request:
    branches:
      - research/freeflow-modular-fractal-v0
    paths:
      - "research/holofrac-retrieval/**"
      - "crates/core/symtropy-hdc-core/**"
      - ".github/workflows/holofrac-spatial-retrieval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-retrieval:
    name: format, test and clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head (or pushed commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/holofrac-retrieval/Cargo.toml --all -- --check

      - name: Run tests
        run: cargo test --manifest-path research/holofrac-retrieval/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path research/holofrac-retrieval/Cargo.toml --all-targets -- -D warnings

      - name: Run deterministic benchmark fixtures
        run: |
          mkdir -p artifacts
          echo "rustc:"
          rustc --version --verbose
          echo "host:"
          uname -a
          grep -m1 "model name" /proc/cpuinfo || true
          echo "spatial retrieval:"
          HOLOFRAC_SOURCE_SHA="$(git rev-parse HEAD)" cargo run --release --manifest-path research/holofrac-retrieval/Cargo.toml > artifacts/spatial-retrieval.csv
          cat artifacts/spatial-retrieval.csv
          echo "factorization capacity sweep:"
          HOLOFRAC_SOURCE_SHA="$(git rev-parse HEAD)" cargo run --release --manifest-path research/holofrac-retrieval/Cargo.toml --bin factorization_sweep > artifacts/factorization-sweep.csv
          cat artifacts/factorization-sweep.csv

      - name: Upload raw benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holofrac-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.csv
          if-no-files-found: warn
          retention-days: 14
