name: Construction Layout Benchmark V0.1

on:
  pull_request:
    branches: [main]
    paths:
      - "research/construction-layout-benchmark-v0-1/**"
      - ".github/workflows/construction-layout-benchmark-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-layout-benchmark-v0-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate layout benchmark artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate profile, fixture and scorecard invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/construction-layout-benchmark-v0-1")
          profile = json.loads((root / "profile/construction-layout-benchmark-v0.1.json").read_text())
          profile_schema = json.loads((root / "schema/construction-layout-benchmark-v0.1.schema.json").read_text())
          cases = json.loads((root / "fixtures/construction-layout-benchmark-cases-v0.1.json").read_text())
          cases_schema = json.loads((root / "schema/construction-layout-benchmark-cases-v0.1.schema.json").read_text())
          Draft202012Validator.check_schema(profile_schema)
          Draft202012Validator.check_schema(cases_schema)
          Draft202012Validator(profile_schema).validate(profile)
          Draft202012Validator(cases_schema).validate(cases)
          ids = [case["case_id"] for case in cases["cases"]]
          assert len(ids) == len(set(ids)), "duplicate frozen case ID"
          assert len(ids) >= 15
          assert profile["scorecard"]["hard_software_gates"]["silent_semantic_substitution"] == 0
          assert profile["scorecard"]["hard_software_gates"]["executor_completion_promoted_to_acceptance"] == 0
          assert "all_planned_features" in profile["scorecard"]["metrics"][5]["formula"]
          assert "prep_hours" not in profile["scorecard"]["metrics"][7]["formula"] or "design_prep_hours" in profile["scorecard"]["metrics"][7]["formula"]
          vendor_claims = profile["vendor_claim_register"]
          assert all(item["status"] != "independently_verified" for item in vendor_claims)
          print(f"validated {len(profile['task_scope']['task_families'])} task families, {len(profile['scorecard']['metrics'])} metrics and {len(ids)} synthetic cases")
          PY
