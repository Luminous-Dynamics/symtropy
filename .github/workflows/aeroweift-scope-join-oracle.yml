name: AeroWeft Scope Join Oracle

on:
  pull_request:
    paths:
      - ".github/workflows/aeroweift-scope-join-oracle.yml"
      - "docs/research/aviation/AEROWEFT_SCOPE_JOIN_001.md"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - "fixtures/aeroweift-scope-join/**"
      - "tools/aeroweift-scope-join-oracle/**"

permissions:
  contents: read

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/aeroweift-scope-join-oracle
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets
