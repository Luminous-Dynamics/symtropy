name: Distribution-aware manufacturing conformity reference

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/manufacturing-conformity-risk/risk.rs"
      - "tools/manufacturing-conformity-risk/README.md"
      - "tools/manufacturing-conformity-risk/expected.csv"
      - ".github/workflows/manufacturing-conformity-risk.yml"
  push:
    branches: [main]
    paths:
      - "tools/manufacturing-conformity-risk/risk.rs"
      - "tools/manufacturing-conformity-risk/README.md"
      - "tools/manufacturing-conformity-risk/expected.csv"
      - ".github/workflows/manufacturing-conformity-risk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posterior-conformity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run PDF integration tests with warnings denied
        run: |
          rustc --version
          rustc --edition=2024 -D warnings --test tools/manufacturing-conformity-risk/risk.rs -o "$RUNNER_TEMP/mfg-risk-tests"
          "$RUNNER_TEMP/mfg-risk-tests"
      - name: Build and verify frozen risk campaign
        run: |
          rustc --edition=2024 -D warnings tools/manufacturing-conformity-risk/risk.rs -o "$RUNNER_TEMP/mfg-risk"
          "$RUNNER_TEMP/mfg-risk" --verify
      - name: Check deterministic output and golden table
        run: |
          "$RUNNER_TEMP/mfg-risk" --csv > "$RUNNER_TEMP/mfg-risk-a.csv"
          "$RUNNER_TEMP/mfg-risk" --csv > "$RUNNER_TEMP/mfg-risk-b.csv"
          diff -u "$RUNNER_TEMP/mfg-risk-a.csv" "$RUNNER_TEMP/mfg-risk-b.csv"
          diff -u tools/manufacturing-conformity-risk/expected.csv "$RUNNER_TEMP/mfg-risk-a.csv"
          cat "$RUNNER_TEMP/mfg-risk-a.csv"
      - name: Emit exact source and output digests
        run: |
          sha256sum tools/manufacturing-conformity-risk/risk.rs tools/manufacturing-conformity-risk/expected.csv "$RUNNER_TEMP/mfg-risk-a.csv"
