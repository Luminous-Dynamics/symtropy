name: Ocean Wave Reference

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/ocean-wave-reference/**"
      - ".github/workflows/ocean-wave-reference.yml"

permissions:
  contents: read

concurrency:
  group: ocean-wave-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Ocean Wave Reference (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Verify standalone formatting
        run: cargo fmt --manifest-path tools/ocean-wave-reference/Cargo.toml -- --check

      - name: Run frozen-corpus and analytic-reference tests
        run: cargo test --manifest-path tools/ocean-wave-reference/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/ocean-wave-reference/Cargo.toml --all-targets --locked -- -D warnings
