name: Shipyard irregular polygon geometry

on:
  pull_request:
    branches: ["main", "research/shipyard-space-time-oracle-v0"]
    paths:
      - "tools/shipyard-irregular-geometry/**"
      - "tools/shipyard-space-time/**"
      - ".github/workflows/shipyard-irregular-geometry.yml"
  push:
    branches: ["main", "research/shipyard-irregular-geometry-v0"]
    paths:
      - "tools/shipyard-irregular-geometry/**"
      - "tools/shipyard-space-time/**"
      - ".github/workflows/shipyard-irregular-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-irregular-geometry-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned Rust polygon geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/shipyard-irregular-geometry/Cargo.toml -- --check

      - name: Run geometry tests offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-irregular-geometry/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-irregular-geometry/Cargo.toml --all-targets -- -D warnings
