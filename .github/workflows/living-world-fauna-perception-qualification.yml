name: Living World fauna perception qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify-fauna-perception:
    name: Qualify exact fauna signal perception oracle
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: e0f6c681e6dc6308d965e52fd1d7e24d7799a410
      CARGO_TARGET_DIR: /tmp/living-world-fauna-perception-target
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert exact clean input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD
          git hash-object Cargo.lock | tee /tmp/cargo-lock.before

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --package symtropy-basin -- --check

      - name: Execute fauna perception oracle
        run: cargo test --locked -p symtropy-basin --test fauna_signal_perception_contract

      - name: Strict Clippy
        run: cargo clippy --locked -p symtropy-basin --all-targets -- -D warnings

      - name: Targeted check
        run: cargo check --locked -p symtropy-basin --all-targets

      - name: Assert exact non-mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git hash-object Cargo.lock)" = "$(cat /tmp/cargo-lock.before)"
          git diff --exit-code
          git diff --cached --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'unexpected untracked files:\n%s\n' "$untracked"
            exit 1
          fi
