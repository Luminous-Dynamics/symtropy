name: Evolution SEL-10E2C Qualification

on:
  push:
    branches:
      - "ci/evolution-sel10e2c-qualification-v0.1"

permissions:
  contents: read

env:
  PRODUCT_HEAD: 5e6cb482d3fa6b393cff8ff2ffe2784b9fa34112

jobs:
  qualify:
    name: Frozen SEL-10E2C / Rust 1.96
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen product subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 1
      - name: Assert executed subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Isolate E2C stack
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/e2c-stack"
          rm -rf "${root}"
          mkdir -p "${root}"
          cp -R crates/domains/symtropy-evolution-core "${root}/symtropy-evolution-core"
          cp -R crates/domains/symtropy-species-concept "${root}/symtropy-species-concept"
          cp -R crates/domains/symtropy-species-concept-relations "${root}/symtropy-species-concept-relations"
          cp -R crates/domains/symtropy-species-concept-general-lineage "${root}/symtropy-species-concept-general-lineage"
          cp -R crates/domains/symtropy-species-concept-robustness "${root}/symtropy-species-concept-robustness"
      - name: Check E2C formatting
        id: fmt
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo fmt --all -- --check
      - name: Check E2C all targets
        id: check
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo check --all-targets
      - name: Run E2C availability corpus
        id: availability
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo test --test current_outcome_availability_v1
      - name: Run E2B matrix corpus
        id: matrix
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_matrix_v1
      - name: Run E2B hardening corpus
        id: matrix_hardening
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_matrix_hardening_v1
      - name: Run E2A design corpus
        id: e2a_design
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_design_v1
      - name: Run E2A hardening corpus
        id: e2a_hardening
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_hardening_v1
      - name: Run E2A currentness corpus
        id: e2a_currentness
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_currentness_v1
      - name: Run all robustness targets
        id: all_tests
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo test --all-targets
      - name: Run strict Clippy
        id: clippy
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-robustness
        run: cargo clippy --all-targets -- -D warnings
      - name: Run frozen semantic-relation stack
        id: relations
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-relations
        run: cargo test --all-targets
      - name: Run frozen general-lineage stack
        id: general_lineage
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-species-concept-general-lineage
        run: cargo test --all-targets
      - name: Run strict current-species prerequisite
        id: strict_status
        working-directory: ${{ runner.temp }}/e2c-stack/symtropy-evolution-core
        run: cargo test --test current_species_status_v1
      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          AVAILABILITY: ${{ steps.availability.outcome }}
          MATRIX: ${{ steps.matrix.outcome }}
          MATRIX_HARDENING: ${{ steps.matrix_hardening.outcome }}
          E2A_DESIGN: ${{ steps.e2a_design.outcome }}
          E2A_HARDENING: ${{ steps.e2a_hardening.outcome }}
          E2A_CURRENTNESS: ${{ steps.e2a_currentness.outcome }}
          ALL_TESTS: ${{ steps.all_tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RELATIONS: ${{ steps.relations.outcome }}
          GENERAL_LINEAGE: ${{ steps.general_lineage.outcome }}
          STRICT_STATUS: ${{ steps.strict_status.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          keys = [
              "FMT", "CHECK", "AVAILABILITY", "MATRIX", "MATRIX_HARDENING",
              "E2A_DESIGN", "E2A_HARDENING", "E2A_CURRENTNESS", "ALL_TESTS",
              "CLIPPY", "RELATIONS", "GENERAL_LINEAGE", "STRICT_STATUS"
          ]
          outcomes = {k.lower(): os.environ.get(k, "unknown") for k in keys}
          receipt = {
              "receipt_version": 1,
              "qualification": "SEL-10E2C-v0.1",
              "product_head": os.environ["PRODUCT_HEAD"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "current-result availability qualification only; qualified missingness does not alter E2B robustness status, add independent coverage, infer unavailable-model outcomes, establish historical robustness, nomenclature, or universal taxonomy truth",
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "sel10e2c-qualification-v0.1.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(receipt, f, sort_keys=True, indent=2); f.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          sha256sum "${RUNNER_TEMP}/sel10e2c-qualification-v0.1.json" > "${RUNNER_TEMP}/sel10e2c-qualification-v0.1.json.sha256"
      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sel10e2c-qualification-v0.1-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/sel10e2c-qualification-v0.1.json
            ${{ runner.temp }}/sel10e2c-qualification-v0.1.json.sha256
          if-no-files-found: error
          retention-days: 30
