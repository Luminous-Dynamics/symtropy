name: Orbital Interface Lifecycle Benchmark

on:
  push:
    branches: ["research/orbital-interface-lifecycle-v0-1"]
    paths:
      - "tools/orbital-interface-lifecycle-bench/**"
      - ".github/workflows/orbital-interface-lifecycle-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/orbital-interface-lifecycle-bench/**"
      - ".github/workflows/orbital-interface-lifecycle-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbital-interface-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact benchmark head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Generate standalone lockfile
        run: cargo generate-lockfile --manifest-path tools/orbital-interface-lifecycle-bench/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path tools/orbital-interface-lifecycle-bench/Cargo.toml -- --check

      - name: Run independent-oracle and evaluator tests
        run: cargo test --locked --manifest-path tools/orbital-interface-lifecycle-bench/Cargo.toml --all-targets

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/orbital-interface-lifecycle-bench/Cargo.toml --all-targets -- -D warnings

      - name: Replay frozen lifecycle corpus
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$BENCHMARK_COMMIT"
          cargo run --locked --quiet --manifest-path tools/orbital-interface-lifecycle-bench/Cargo.toml -- \
            tools/orbital-interface-lifecycle-bench/fixtures/v0.1/cases.json \
            --source-commit "$actual_commit" > orbital-interface-lifecycle-receipt.json
          jq -e --arg expected_commit "$BENCHMARK_COMMIT" '
            .receipt_schema == "luminous.orbital-interface-lifecycle.receipt.v0.1"
            and .source_commit == $expected_commit
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .report.evidence_class == "synthetic"
            and .report.claim_ceiling == "synthetic-lifecycle-state-semantics-only"
            and .report.summary.case_count == 42
            and .report.summary.expected_result_mismatches == 0
            and .report.authority_granted == false
            and .authority_granted == false
          ' orbital-interface-lifecycle-receipt.json

      - name: Upload exact-head lifecycle receipt
        uses: actions/upload-artifact@v4
        with:
          name: orbital-interface-lifecycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: orbital-interface-lifecycle-receipt.json
          if-no-files-found: error
          retention-days: 30
