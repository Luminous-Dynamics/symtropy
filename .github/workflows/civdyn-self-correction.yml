name: CIVDYN self-correction reference

on:
  pull_request:
    paths:
      - "research/civdyn-self-correction/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-self-correction.yml"
  push:
    paths:
      - "research/civdyn-self-correction/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-self-correction.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Normalize source passport Rust formatting
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          git checkout -B "${branch}" "origin/${branch}"
          cargo fmt --manifest-path research/civdyn-self-correction/Cargo.toml --all
          git add research/civdyn-self-correction/src/source_passport.rs research/civdyn-self-correction/src/bin/source_passport_sweep.rs research/civdyn-self-correction/src/measurement_equivalence.rs research/civdyn-self-correction/src/bin/measurement_equivalence_sweep.rs research/civdyn-self-correction/src/lib.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(civdyn): apply rustfmt to source passport"
            git push origin "${branch}"
          fi
      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-self-correction/Cargo.toml --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-self-correction/Cargo.toml --all-targets -- -D warnings
      - name: Compile
        run: cargo check --locked --manifest-path research/civdyn-self-correction/Cargo.toml --all-targets
      - name: Test correction chain, negative controls and ledger conservation
        run: cargo test --locked --manifest-path research/civdyn-self-correction/Cargo.toml --all-targets
      - name: Verify causal-drift detection versus mechanism diagnosis
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin causal-drift-sweep > /tmp/civdyn-causal-drift.csv
          awk -F, '
            NR == 1 { if (NF != 24) exit 20; next }
            NF != 24 { exit 21 }
            $1 == "sign_reversal" && $2 == "outcome_reactive" {
              reversal_reactive++
              if ($4 != "2.000000" || $16 != "true" || $17 != "true" || $19 != "false" || $6 != "8") exit 22
            }
            $1 == "sign_reversal" && $2 == "cusum_signal_only" {
              reversal_cusum++
              if ($17 != "true" || $18 != "4" || $19 != "false" || $7 != "1") exit 23
            }
            $1 == "sign_reversal" && $2 == "mechanism_aware" {
              reversal_aware++
              if ($20 != "causal_sign_reversal" || $18 != "4" || $21 != "4" || $7 != "1" || $23 != "true") exit 24
            }
            $1 == "gradual_sign_reversal" && $2 == "mechanism_aware" {
              gradual_aware++
              if ($3 != "-2.000000" || $4 != "3.000000" || $20 != "causal_sign_reversal" || $18 != "5" || $21 != "6" || $22 != "2" || $7 != "2") exit 25
            }
            $1 == "confounded_null" && $2 == "mechanism_aware" {
              null_aware++
              if ($4 != "5.000000" || $5 != "0.000000" || $20 != "null_effect_with_confounding" || $21 != "2") exit 26
            }
            $1 == "stable_positive" && $2 == "mechanism_aware" {
              stable_aware++
              if ($17 != "false" || $19 != "false" || $6 != "8" || $5 != "2.000000") exit 27
            }
            $1 == "confounder_shift" && $2 == "cusum_signal_only" {
              confounder_cusum++
              if ($3 != "2.000000" || $4 != "-3.000000" || $17 != "true" || $18 != "5" || $19 != "false" || $8 != "3") exit 28
            }
            $1 == "confounder_shift" && $2 == "mechanism_aware" {
              confounder_aware++
              if ($4 != "-3.000000" || $17 != "true" || $18 != "5" || $5 != "2.000000" || $20 != "confounder_shift_without_causal_effect_change" || $21 != "6" || $6 != "8" || $8 != "0" || $23 != "true") exit 29
            }
            $1 == "confounder_shift" && $2 == "outcome_reactive" {
              confounder_reactive++
              if ($8 != "3" || $6 != "5" || $19 != "false") exit 30
            }
            END {
              if (NR != 21 || reversal_reactive != 1 || reversal_cusum != 1 || reversal_aware != 1 || gradual_aware != 1 || null_aware != 1 || stable_aware != 1 || confounder_cusum != 1 || confounder_aware != 1 || confounder_reactive != 1) exit 31
              print "Causal-drift CSV valid: 20 regime/controller cases, 24 columns; causal and confounder controls passed"
            }
          ' /tmp/civdyn-causal-drift.csv
      - name: Verify seeded noisy causal-drift operating characteristics
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin noisy-causal-drift-sweep > /tmp/civdyn-noisy-causal-drift.csv
          awk -F, '
            NR == 1 { if (NF != 25) exit 40; next }
            NF != 25 { exit 41 }
            $2 == "stable_positive" {
              stable++
              if ($6 != "" || $20 != "false" || $9 != "8") exit 42
            }
            $2 == "sign_reversal" {
              reversal++
              if ($6 == "causal_sign_reversal" && $7 == "4" && $20 == "true" && $10 == "1") reversal_good++
            }
            $2 == "gradual_sign_reversal" {
              gradual++
              if ($6 == "causal_sign_reversal" && $7 == "6" && $20 == "true" && $10 == "2") gradual_good++
            }
            $2 == "confounded_null" {
              nulls++
              if ($6 == "null_effect_with_confounding" && $7 == "2" && $20 == "true") null_good++
              if ($25 == "true") null_false_sign++
            }
            $2 == "confounder_shift" {
              confounder++
              if ($6 == "confounder_shift_without_causal_effect_change" && $7 == "6" && $20 == "false" && $11 == "0" && $9 == "8") confounder_good++
            }
            END {
              if (NR != 1281 || stable != 256 || reversal != 256 || gradual != 256 || nulls != 256 || confounder != 256) exit 43
              if (reversal_good < 250 || gradual_good < 250 || null_good < 250 || confounder_good < 250) exit 44
              if (null_false_sign > 5) exit 45
              print "Noisy causal-drift Monte Carlo passed: 1,280 retained episodes; stable false-stops=0; reversal=" reversal_good "/256; gradual=" gradual_good "/256; null=" null_good "/256; confounder-shift=" confounder_good "/256; false sign diagnoses on null=" null_false_sign
            }
          ' /tmp/civdyn-noisy-causal-drift.csv
      - name: Verify deterministic CSV contract and known-answer outputs
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin self-correction-sweep > /tmp/civdyn-self-correction.csv
          awk -F, '
            NR == 1 { if (NF != 21) exit 10; next }
            NF != 21 { exit 11 }
            $1 == "sensor_drift_sham" {
              sensor++
              if ($2 == "outcome_reactive" && $6 != "12.000000") exit 12
              if ($2 == "mechanism_aware" && $6 != "0.000000") exit 13
            }
            $1 == "delayed_externality" {
              delayed++
              if ($2 == "frozen_policy" && $4 != "25.000000") exit 14
              if ($2 == "mechanism_aware" && ($4 != "0.000000" || $5 != "30.000000")) exit 15
            }
            END {
              if (sensor != 3 || delayed != 3) exit 16
              print "CSV valid: 3 sensor-drift controllers + 3 delayed-externality controllers; 21 columns"
            }
          ' /tmp/civdyn-self-correction.csv

      - name: Verify common-stream sequential method portfolio
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin sequential-methods-sweep > /tmp/civdyn-sequential-methods.csv 2>/tmp/civdyn-sequential-methods-summary.txt
          awk -F, '
            NR == 1 { if (NF != 14) exit 60; next }
            NF != 14 { exit 61 }
            {
              rows++
              methods[$7]++
              key = $1 SUBSEP $2 SUBSEP $3
              if (key in digest && digest[key] != $6) exit 62
              digest[key] = $6
              if ($9 < 1 || $9 > 2048) exit 63
              if ($3 == "stable_positive" || $3 == "confounder_shift") {
                alt_rows[$7, $3]++
                if ($8 == "benefit_established") correct[$7, $3]++
                if ($8 == "harmful_effect_established") false_stop[$7, $3]++
              }
              if ($3 == "sign_reversal" || $3 == "gradual_sign_reversal") {
                alt_rows[$7, $3]++
                if ($8 == "harmful_effect_established") correct[$7, $3]++
              }
              if ($3 == "confounded_null" || $3 == "benefit_boundary") {
                null_rows[$7, $3]++
                if ($8 != "inconclusive") false_action[$7, $3]++
              }
              if ($3 != "confounded_null" && $3 != "benefit_boundary") {
                alt_n[$7]++
                alt_cost[$7] += $9
              }
            }
            END {
              if (rows != 7680) exit 64
              method_count = 0
              for (m in methods) {
                method_count++
                if (methods[m] != 1536) exit 65
                if (null_rows[m, "confounded_null"] != 256 || false_action[m, "confounded_null"] > 12) exit 66
                if (null_rows[m, "benefit_boundary"] != 256 || false_action[m, "benefit_boundary"] > 12) exit 73
                if (false_stop[m, "stable_positive"] > 0 || false_stop[m, "confounder_shift"] > 0) exit 72
                if (alt_rows[m, "stable_positive"] != 256 || correct[m, "stable_positive"] < 250) exit 67
                if (alt_rows[m, "sign_reversal"] != 256 || correct[m, "sign_reversal"] < 250) exit 68
                if (alt_rows[m, "gradual_sign_reversal"] != 256 || correct[m, "gradual_sign_reversal"] < 250) exit 69
                if (alt_rows[m, "confounder_shift"] != 256 || correct[m, "confounder_shift"] < 250) exit 70
                mean_cost = alt_cost[m] / alt_n[m]
                if (mean_cost <= 0.70 * 2048) efficient++
              }
              if (method_count != 5 || efficient < 1) exit 71
              print "Sequential portfolio valid: 7,680 receipts; identical stream digests; 256 seeds per regime; false directional actions <=12/256 at both zero-effect and minimum-benefit boundaries; no false harmful stop on positive/confounder-shift regimes; at least one method saves >=30% samples on alternatives"
            }
          ' /tmp/civdyn-sequential-methods.csv


      - name: Verify prior reachability and split-predictive adequacy contract
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin model-adequacy-sweep > /tmp/civdyn-model-adequacy.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("/tmp/civdyn-model-adequacy.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 24, f"expected 24 columns, got {len(fields or [])}"
          assert len(rows) == 6, f"expected six statistic assessments, got {len(rows)}"

          expected = {
              ("prior", "household-water-mean"): "within_reference_interval",
              ("prior", "health-income-joint"): "outside_reference_interval",
              ("prior", "rare-service-failure-rate"): "within_reference_interval",
              ("split_predictive", "household-water-mean"): "within_reference_interval",
              ("split_predictive", "health-income-joint"): "outside_reference_interval",
              ("split_predictive", "rare-service-failure-rate"): "outside_reference_interval",
          }
          actual = {}
          for row in rows:
              key = (row["kind"], row["statistic_id"])
              assert key not in actual, f"duplicate statistic receipt: {key}"
              actual[key] = row["status"]
              assert row["domain_status"] == "primary_discrepancy_detected"
              assert row["source_digest"] and row["observation_digest"]
              assert row["model_digest"] and row["draw_set_digest"]
              assert row["independent_unit"] == "region"
              assert row["expected_units"] == "1" and row["assessed_units"] == "1"
              assert row["covered_units"] in {"0", "1"}
              assert row["empirical_coverage"] in {"0.000000", "1.000000"}
              assert row["wilson_lower_95"] and row["wilson_upper_95"]
              assert row["required_evidence_complete"] == "true"
              assert row["n_draws"] == "20"

          assert actual == expected, f"unexpected reachability/adequacy classifications: {actual}"
          print("Model-adequacy CSV valid: prior reachability and split-predictive controls preserve marginal, joint and rare-tail discrepancies as separate results.")
          PY

      - name: Verify empirical source passport and join compatibility
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin source-passport-sweep > /tmp/civdyn-source-passport.csv
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin source-passport-sweep > /tmp/civdyn-source-passport-replay.csv
          cmp /tmp/civdyn-source-passport.csv /tmp/civdyn-source-passport-replay.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          with Path("/tmp/civdyn-source-passport.csv").open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 14
          assert len(rows) == 7
          cases = {row["scenario"]: row for row in rows}
          assert set(cases) == {
              "matched_provincial_survey",
              "treasury_dws_temporal_mismatch",
              "dws_default_scenario_assumption",
              "dws_default_measured_validation",
              "eskom_acquisition_pending",
              "municipal_boundary_crosswalk",
              "unknown_rights_blocked",
          }

          matched = cases["matched_provincial_survey"]
          assert matched["compatibility_status"] == "compatible"
          assert matched["left_source_qualification"] == "qualified_for_registered_use"
          assert matched["right_source_qualification"] == "qualified_for_registered_use"

          temporal = cases["treasury_dws_temporal_mismatch"]
          assert temporal["compatibility_status"] == "not_comparable"
          assert temporal["temporal_mismatch"] == "true"

          default_scenario = cases["dws_default_scenario_assumption"]
          assert default_scenario["compatibility_status"] == "compatible"
          default_validation = cases["dws_default_measured_validation"]
          assert default_validation["compatibility_status"] == "not_comparable"
          assert default_validation["category_default_rejected"] == "true"

          pending = cases["eskom_acquisition_pending"]
          assert pending["compatibility_status"] == "not_assessed"
          assert pending["left_source_qualification"] == "acquisition_pending"
          assert pending["left_artifact_digest"] == ""

          boundary = cases["municipal_boundary_crosswalk"]
          assert boundary["compatibility_status"] == "compatible_with_explicit_transform"
          assert "sha256-mdb-crosswalk-receipt" in boundary["explicit_transform_digests"]
          assert boundary["geography_mismatch"] == "false"

          unknown = cases["unknown_rights_blocked"]
          assert unknown["compatibility_status"] == "rights_blocked"
          assert unknown["left_source_qualification"] == "rights_blocked"

          print("Source passport CSV valid: provenance, rights, source origin, temporal support and boundary-vintage controls preserved; no unacquired artifact or default promoted to measured evidence.")
          PY
      - name: Verify claim-specific measurement equivalence
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin measurement-equivalence-sweep > /tmp/civdyn-measurement-equivalence.csv
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin measurement-equivalence-sweep > /tmp/civdyn-measurement-equivalence-replay.csv
          cmp /tmp/civdyn-measurement-equivalence.csv /tmp/civdyn-measurement-equivalence-replay.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          with Path("/tmp/civdyn-measurement-equivalence.csv").open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 37, f"expected 37 columns, got {len(fields or [])}"
          assert len(rows) == 36, f"expected 36 claim receipts, got {len(rows)}"
          cases = {(row["scenario"], row["claim"]): row for row in rows}
          assert len(cases) == 36
          claims = {
              "structural_configuration",
              "association_comparison",
              "latent_mean_comparison",
              "individual_score_comparison",
          }
          assert {claim for _, claim in cases} == claims

          for claim in claims:
              assert cases[("exact_same_protocol", claim)]["status"] == "equivalent_for_claim"
              assert cases[("same_protocol_cross_population", claim)]["status"] == "insufficient_evidence_for_claim"

          expected = {
              "configural_only": {
                  "structural_configuration": "equivalent_for_claim",
                  "association_comparison": "not_assessed",
                  "latent_mean_comparison": "not_assessed",
                  "individual_score_comparison": "not_assessed",
              },
              "metric_partial": {
                  "structural_configuration": "equivalent_for_claim",
                  "association_comparison": "equivalent_for_claim",
                  "latent_mean_comparison": "not_equivalent_for_claim",
                  "individual_score_comparison": "not_assessed",
              },
              "scalar_partial": {
                  "structural_configuration": "equivalent_for_claim",
                  "association_comparison": "equivalent_for_claim",
                  "latent_mean_comparison": "equivalent_for_claim",
                  "individual_score_comparison": "not_assessed",
              },
              "full_invariance": {
                  claim: "equivalent_for_claim" for claim in claims
              },
              "bridge_equivalent": {
                  "structural_configuration": "not_assessed",
                  "association_comparison": "equivalent_for_claim",
                  "latent_mean_comparison": "equivalent_for_claim",
                  "individual_score_comparison": "equivalent_for_claim",
              },
              "bridge_mean_inconclusive": {
                  "structural_configuration": "not_assessed",
                  "association_comparison": "equivalent_for_claim",
                  "latent_mean_comparison": "insufficient_evidence_for_claim",
                  "individual_score_comparison": "equivalent_for_claim",
              },
              "bridge_population_noninvariant": {
                  "structural_configuration": "not_assessed",
                  "association_comparison": "not_equivalent_for_claim",
                  "latent_mean_comparison": "not_equivalent_for_claim",
                  "individual_score_comparison": "not_equivalent_for_claim",
              },
          }
          for scenario, scenario_claims in expected.items():
              for claim, status in scenario_claims.items():
                  assert cases[(scenario, claim)]["status"] == status, (scenario, claim)

          bridge = cases[("bridge_equivalent", "latent_mean_comparison")]
          assert bridge["evidence_kind"] == "bridge_study"
          assert bridge["bridge_design"] == "paired"
          assert bridge["confidence_level"] == "0.950000"
          assert bridge["mean_bias_ci"] == "-0.040000:0.030000"
          assert bridge["mean_equivalence_margin"] == "0.100000"
          assert bridge["individual_error_lower_bound"] == "0.040000"
          assert bridge["individual_error_upper_bound"] == "0.080000"
          assert bridge["individual_score_margin"] == "0.120000"

          bridge_wide = cases[("bridge_mean_inconclusive", "latent_mean_comparison")]
          assert bridge_wide["mean_bias_ci"] == "-0.200000:0.030000"
          assert bridge_wide["status"] == "insufficient_evidence_for_claim"

          noninvariant = cases[("metric_partial", "latent_mean_comparison")]
          assert noninvariant["invariance_levels"] == "supported;supported;not_supported;not_assessed"
          assert noninvariant["anchor_item_ids"] == "anchor-item-1;anchor-item-2"
          assert noninvariant["non_invariant_item_ids"] == "item-4"

          for row in rows:
              assert row["construct_id"] == "household-service-security"
              assert row["construct_version"] == "v1"
              assert row["measurement_unit"] == "standardized_score"
              assert row["evidence_digest"]
              assert row["protocol_digest"]
          print("Measurement-equivalence CSV valid: claim-specific invariance ladder, paired bridge, equivalence margins, group lineage and exact evidence receipts preserved.")
          PY