name: CIVDYN self-correction reference

on:
  pull_request:
    paths:
      - "research/civdyn-self-correction/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-self-correction.yml"
  push:
    paths:
      - "research/civdyn-self-correction/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-self-correction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-self-correction/Cargo.toml --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-self-correction/Cargo.toml --all-targets -- -D warnings
      - name: Compile
        run: cargo check --locked --manifest-path research/civdyn-self-correction/Cargo.toml --all-targets
      - name: Test correction chain, negative controls and ledger conservation
        run: cargo test --locked --manifest-path research/civdyn-self-correction/Cargo.toml --all-targets
      - name: Verify causal-drift detection versus mechanism diagnosis
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin causal-drift-sweep > /tmp/civdyn-causal-drift.csv
          awk -F, '
            NR == 1 { if (NF != 24) exit 20; next }
            NF != 24 { exit 21 }
            $1 == "sign_reversal" && $2 == "outcome_reactive" {
              reversal_reactive++
              if ($4 != "2.000000" || $16 != "true" || $17 != "true" || $19 != "false" || $6 != "8") exit 22
            }
            $1 == "sign_reversal" && $2 == "cusum_signal_only" {
              reversal_cusum++
              if ($17 != "true" || $18 != "4" || $19 != "false" || $7 != "1") exit 23
            }
            $1 == "sign_reversal" && $2 == "mechanism_aware" {
              reversal_aware++
              if ($20 != "causal_sign_reversal" || $18 != "4" || $21 != "4" || $7 != "1" || $23 != "true") exit 24
            }
            $1 == "gradual_sign_reversal" && $2 == "mechanism_aware" {
              gradual_aware++
              if ($3 != "-2.000000" || $4 != "3.000000" || $20 != "causal_sign_reversal" || $18 != "5" || $21 != "6" || $22 != "2" || $7 != "2") exit 25
            }
            $1 == "confounded_null" && $2 == "mechanism_aware" {
              null_aware++
              if ($4 != "5.000000" || $5 != "0.000000" || $20 != "null_effect_with_confounding" || $21 != "2") exit 26
            }
            $1 == "stable_positive" && $2 == "mechanism_aware" {
              stable_aware++
              if ($17 != "false" || $19 != "false" || $6 != "8" || $5 != "2.000000") exit 27
            }
            $1 == "confounder_shift" && $2 == "cusum_signal_only" {
              confounder_cusum++
              if ($3 != "2.000000" || $4 != "-3.000000" || $17 != "true" || $18 != "5" || $19 != "false" || $8 != "3") exit 28
            }
            $1 == "confounder_shift" && $2 == "mechanism_aware" {
              confounder_aware++
              if ($4 != "-3.000000" || $17 != "true" || $18 != "5" || $5 != "2.000000" || $20 != "confounder_shift_without_causal_effect_change" || $21 != "6" || $6 != "8" || $8 != "0" || $23 != "true") exit 29
            }
            $1 == "confounder_shift" && $2 == "outcome_reactive" {
              confounder_reactive++
              if ($8 != "3" || $6 != "5" || $19 != "false") exit 30
            }
            END {
              if (NR != 21 || reversal_reactive != 1 || reversal_cusum != 1 || reversal_aware != 1 || gradual_aware != 1 || null_aware != 1 || stable_aware != 1 || confounder_cusum != 1 || confounder_aware != 1 || confounder_reactive != 1) exit 31
              print "Causal-drift CSV valid: 20 regime/controller cases, 24 columns; causal and confounder controls passed"
            }
          ' /tmp/civdyn-causal-drift.csv
      - name: Verify seeded noisy causal-drift operating characteristics
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin noisy-causal-drift-sweep > /tmp/civdyn-noisy-causal-drift.csv
          awk -F, '
            NR == 1 { if (NF != 25) exit 40; next }
            NF != 25 { exit 41 }
            $2 == "stable_positive" {
              stable++
              if ($6 != "" || $20 != "false" || $9 != "8") exit 42
            }
            $2 == "sign_reversal" {
              reversal++
              if ($6 == "causal_sign_reversal" && $7 == "4" && $20 == "true" && $10 == "1") reversal_good++
            }
            $2 == "gradual_sign_reversal" {
              gradual++
              if ($6 == "causal_sign_reversal" && $7 == "6" && $20 == "true" && $10 == "2") gradual_good++
            }
            $2 == "confounded_null" {
              nulls++
              if ($6 == "null_effect_with_confounding" && $7 == "2" && $20 == "true") null_good++
              if ($25 == "true") null_false_sign++
            }
            $2 == "confounder_shift" {
              confounder++
              if ($6 == "confounder_shift_without_causal_effect_change" && $7 == "6" && $20 == "false" && $11 == "0" && $9 == "8") confounder_good++
            }
            END {
              if (NR != 1281 || stable != 256 || reversal != 256 || gradual != 256 || nulls != 256 || confounder != 256) exit 43
              if (reversal_good < 250 || gradual_good < 250 || null_good < 250 || confounder_good < 250) exit 44
              if (null_false_sign > 5) exit 45
              print "Noisy causal-drift Monte Carlo passed: 1,280 retained episodes; stable false-stops=0; reversal=" reversal_good "/256; gradual=" gradual_good "/256; null=" null_good "/256; confounder-shift=" confounder_good "/256; false sign diagnoses on null=" null_false_sign
            }
          ' /tmp/civdyn-noisy-causal-drift.csv
      - name: Verify deterministic CSV contract and known-answer outputs
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin self-correction-sweep > /tmp/civdyn-self-correction.csv
          awk -F, '
            NR == 1 { if (NF != 21) exit 10; next }
            NF != 21 { exit 11 }
            $1 == "sensor_drift_sham" {
              sensor++
              if ($2 == "outcome_reactive" && $6 != "12.000000") exit 12
              if ($2 == "mechanism_aware" && $6 != "0.000000") exit 13
            }
            $1 == "delayed_externality" {
              delayed++
              if ($2 == "frozen_policy" && $4 != "25.000000") exit 14
              if ($2 == "mechanism_aware" && ($4 != "0.000000" || $5 != "30.000000")) exit 15
            }
            END {
              if (sensor != 3 || delayed != 3) exit 16
              print "CSV valid: 3 sensor-drift controllers + 3 delayed-externality controllers; 21 columns"
            }
          ' /tmp/civdyn-self-correction.csv

      - name: Verify common-stream sequential method portfolio
        run: |
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin sequential-methods-sweep > /tmp/civdyn-sequential-methods.csv 2>/tmp/civdyn-sequential-methods-summary.txt
          awk -F, '
            NR == 1 { if (NF != 14) exit 60; next }
            NF != 14 { exit 61 }
            {
              rows++
              methods[$7]++
              key = $1 SUBSEP $2 SUBSEP $3
              if (key in digest && digest[key] != $6) exit 62
              digest[key] = $6
              if ($9 < 1 || $9 > 2048) exit 63
              if ($3 == "stable_positive" || $3 == "confounder_shift") {
                alt_rows[$7, $3]++
                if ($8 == "benefit_established") correct[$7, $3]++
                if ($8 == "harmful_effect_established") false_stop[$7, $3]++
              }
              if ($3 == "sign_reversal" || $3 == "gradual_sign_reversal") {
                alt_rows[$7, $3]++
                if ($8 == "harmful_effect_established") correct[$7, $3]++
              }
              if ($3 == "confounded_null" || $3 == "benefit_boundary") {
                null_rows[$7, $3]++
                if ($8 != "inconclusive") false_action[$7, $3]++
              }
              if ($3 != "confounded_null" && $3 != "benefit_boundary") {
                alt_n[$7]++
                alt_cost[$7] += $9
              }
            }
            END {
              if (rows != 7680) exit 64
              method_count = 0
              for (m in methods) {
                method_count++
                if (methods[m] != 1536) exit 65
                if (null_rows[m, "confounded_null"] != 256 || false_action[m, "confounded_null"] > 12) exit 66
                if (null_rows[m, "benefit_boundary"] != 256 || false_action[m, "benefit_boundary"] > 12) exit 73
                if (false_stop[m, "stable_positive"] > 0 || false_stop[m, "confounder_shift"] > 0) exit 72
                if (alt_rows[m, "stable_positive"] != 256 || correct[m, "stable_positive"] < 250) exit 67
                if (alt_rows[m, "sign_reversal"] != 256 || correct[m, "sign_reversal"] < 250) exit 68
                if (alt_rows[m, "gradual_sign_reversal"] != 256 || correct[m, "gradual_sign_reversal"] < 250) exit 69
                if (alt_rows[m, "confounder_shift"] != 256 || correct[m, "confounder_shift"] < 250) exit 70
                mean_cost = alt_cost[m] / alt_n[m]
                if (mean_cost <= 0.70 * 2048) efficient++
              }
              if (method_count != 5 || efficient < 1) exit 71
              print "Sequential portfolio valid: 7,680 receipts; identical stream digests; 256 seeds per regime; false directional actions <=12/256 at both zero-effect and minimum-benefit boundaries; no false harmful stop on positive/confounder-shift regimes; at least one method saves >=30% samples on alternatives"
            }
          ' /tmp/civdyn-sequential-methods.csv


      - name: Verify prior reachability and split-predictive adequacy contract
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin model-adequacy-sweep > /tmp/civdyn-model-adequacy.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("/tmp/civdyn-model-adequacy.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 24, f"expected 24 columns, got {len(fields or [])}"
          assert len(rows) == 6, f"expected six statistic assessments, got {len(rows)}"

          expected = {
              ("prior", "household-water-mean"): "within_reference_interval",
              ("prior", "health-income-joint"): "outside_reference_interval",
              ("prior", "rare-service-failure-rate"): "within_reference_interval",
              ("split_predictive", "household-water-mean"): "within_reference_interval",
              ("split_predictive", "health-income-joint"): "outside_reference_interval",
              ("split_predictive", "rare-service-failure-rate"): "outside_reference_interval",
          }
          actual = {}
          for row in rows:
              key = (row["kind"], row["statistic_id"])
              assert key not in actual, f"duplicate statistic receipt: {key}"
              actual[key] = row["status"]
              assert row["domain_status"] == "primary_discrepancy_detected"
              assert row["source_digest"] and row["observation_digest"]
              assert row["model_digest"] and row["draw_set_digest"]
              assert row["independent_unit"] == "region"
              assert row["expected_units"] == "1" and row["assessed_units"] == "1"
              assert row["covered_units"] in {"0", "1"}
              assert row["empirical_coverage"] in {"0.000000", "1.000000"}
              assert row["wilson_lower_95"] and row["wilson_upper_95"]
              assert row["required_evidence_complete"] == "true"
              assert row["n_draws"] == "20"

          assert actual == expected, f"unexpected reachability/adequacy classifications: {actual}"
          print("Model-adequacy CSV valid: prior reachability and split-predictive controls preserve marginal, joint and rare-tail discrepancies as separate results.")
          PY


      - name: Verify same-marginal joint and trajectory adequacy controls
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin joint-adequacy-sweep > /tmp/civdyn-joint-adequacy.csv
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path

          path = Path("/tmp/civdyn-joint-adequacy.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 23, f"expected 23 columns, got {len(fields or [])}"
          assert len(rows) == 2, f"expected two joint candidates, got {len(rows)}"
          candidates = {row["candidate"]: row for row in rows}
          positive = candidates["positive-dependence"]
          negative = candidates["negative-dependence"]

          assert positive["statistic_id"] == negative["statistic_id"] == "district-water-energy-state"
          assert positive["unit_id"] == negative["unit_id"] == "district-held-out"
          assert positive["sample_size"] == negative["sample_size"] == "10"
          assert positive["predictive_draws"] == negative["predictive_draws"] == "2"
          assert positive["component_a"] == negative["component_a"] == "water-service"
          assert positive["component_b"] == negative["component_b"] == "energy-service"
          assert positive["source_digest"] == negative["source_digest"]
          assert positive["observation_digest"] == negative["observation_digest"]
          assert positive["calibration_digest"] == negative["calibration_digest"]
          assert positive["split_manifest_digest"] == negative["split_manifest_digest"]
          assert positive["model_digest"] != negative["model_digest"]
          assert positive["draw_set_digest"] != negative["draw_set_digest"]

          assert math.isclose(float(positive["energy_score"]), 0.3535533905932738, rel_tol=1e-10, abs_tol=1e-10)
          assert math.isclose(float(negative["energy_score"]), 0.6464466094067263, rel_tol=1e-10, abs_tol=1e-10)
          assert math.isclose(float(positive["variogram_score"]), 0.0, abs_tol=1e-12)
          assert math.isclose(float(negative["variogram_score"]), 1.0, abs_tol=1e-12)
          assert math.isclose(float(positive["observed_pair_distance"]), 0.0, abs_tol=1e-12)
          assert math.isclose(float(positive["predictive_pair_distance"]), 0.0, abs_tol=1e-12)
          assert math.isclose(float(negative["predictive_pair_distance"]), 1.0, abs_tol=1e-12)
          print("Joint-adequacy CSV valid: identical marginals, opposite coupling, distinct energy and variogram scores, exact source/model/split lineage.")
          PY
      - name: Verify same-degree network topology adequacy controls
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin network-adequacy-sweep > /tmp/civdyn-network-adequacy.csv
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin network-adequacy-sweep > /tmp/civdyn-network-adequacy-replay.csv
          cmp /tmp/civdyn-network-adequacy.csv /tmp/civdyn-network-adequacy-replay.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("/tmp/civdyn-network-adequacy.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 23
          assert len(rows) == 2
          candidates = {row["candidate"]: row for row in rows}
          correct = candidates["topology_correct"]
          wrong = candidates["same_degree_wrong_topology"]

          assert correct["independent_unit"] == wrong["independent_unit"] == "network"
          assert correct["graph_semantics"] == wrong["graph_semantics"] == "undirected_unweighted_simple"
          assert correct["node_count"] == wrong["node_count"] == "6"
          assert correct["edge_count"] == wrong["edge_count"] == "6"
          assert correct["degree_sequence"] == wrong["degree_sequence"] == "2;2;2;2;2;2"
          assert correct["degree_histogram"] == wrong["degree_histogram"] == "2:6"
          assert correct["component_count"] == "1" and wrong["component_count"] == "2"
          assert correct["largest_component_share"] == "1.000000"
          assert wrong["largest_component_share"] == "0.500000"
          assert correct["global_transitivity"] == "0.000000"
          assert wrong["global_transitivity"] == "1.000000"
          assert correct["reachable_unordered_pairs"] == "15"
          assert wrong["reachable_unordered_pairs"] == "6"
          assert correct["mean_finite_shortest_path"] == "1.800000"
          assert wrong["mean_finite_shortest_path"] == "1.000000"
          assert correct["energy_score"] == "0.0000000000000000"
          assert correct["variogram_score"] == "0.0000000000000000"
          assert float(wrong["energy_score"]) > 0.0
          assert float(wrong["variogram_score"]) > 0.0
          assert correct["draw_count"] == wrong["draw_count"] == "20"
          assert correct["source_digest"] == wrong["source_digest"]
          assert correct["observation_digest"] == wrong["observation_digest"]
          assert correct["calibration_digest"] == wrong["calibration_digest"]
          assert correct["split_manifest_digest"] == wrong["split_manifest_digest"]
          assert correct["model_digest"] != wrong["model_digest"]
          assert correct["draw_set_digest"] != wrong["draw_set_digest"]
          print("Network-adequacy CSV valid: identical degree sequences, distinct held-out topology, positive multivariate penalty, exact provenance and deterministic replay.")
          PY
      - name: Verify ordered temporal network adequacy and snapshot-permutation control
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin temporal-network-adequacy-sweep > /tmp/civdyn-temporal-network-adequacy.csv
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin temporal-network-adequacy-sweep > /tmp/civdyn-temporal-network-adequacy-replay.csv
          cmp /tmp/civdyn-temporal-network-adequacy.csv /tmp/civdyn-temporal-network-adequacy-replay.csv
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path

          with Path("/tmp/civdyn-temporal-network-adequacy.csv").open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 26
          assert len(rows) == 2
          candidates = {row["candidate"]: row for row in rows}
          forward = candidates["temporal_order_correct"]
          reverse = candidates["same_snapshots_reversed_order"]

          assert forward["graph_semantics"] == reverse["graph_semantics"] == "undirected_unweighted_simple_stable_node_universe"
          assert forward["snapshot_count"] == reverse["snapshot_count"] == "3"
          assert forward["start_tick"] == reverse["start_tick"] == "10"
          assert forward["end_tick"] == reverse["end_tick"] == "30"

          assert math.isclose(float(forward["mean_component_count"]), 2.0, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_component_count"]), 2.0, abs_tol=1e-8)
          assert math.isclose(float(forward["component_count_trend_per_tick"]), 0.1, abs_tol=1e-8)
          assert math.isclose(float(reverse["component_count_trend_per_tick"]), -0.1, abs_tol=1e-8)

          assert math.isclose(float(forward["mean_degree"]), 5.0 / 3.0, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_degree"]), 5.0 / 3.0, abs_tol=1e-8)
          assert math.isclose(float(forward["mean_degree_trend_per_tick"]), -0.05, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_degree_trend_per_tick"]), 0.05, abs_tol=1e-8)

          assert math.isclose(float(forward["mean_transitivity"]), 1.0 / 3.0, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_transitivity"]), 1.0 / 3.0, abs_tol=1e-8)
          assert math.isclose(float(forward["transitivity_trend_per_tick"]), 0.0, abs_tol=1e-8)
          assert math.isclose(float(reverse["transitivity_trend_per_tick"]), 0.0, abs_tol=1e-8)

          assert math.isclose(float(forward["mean_edge_jaccard"]), 11.0 / 28.0, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_edge_jaccard"]), 11.0 / 28.0, abs_tol=1e-8)
          assert math.isclose(float(forward["mean_edge_turnover"]), 17.0 / 28.0, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_edge_turnover"]), 17.0 / 28.0, abs_tol=1e-8)
          assert math.isclose(float(forward["mean_edge_addition_rate"]), 0.1, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_edge_addition_rate"]), 0.2, abs_tol=1e-8)
          assert math.isclose(float(forward["mean_edge_removal_rate"]), 0.2, abs_tol=1e-8)
          assert math.isclose(float(reverse["mean_edge_removal_rate"]), 0.1, abs_tol=1e-8)

          assert forward["energy_score"] == "0.0000000000000000"
          assert forward["variogram_score"] == "0.0000000000000000"
          assert float(reverse["energy_score"]) > 0.0
          assert float(reverse["variogram_score"]) > 0.0
          assert forward["draw_count"] == reverse["draw_count"] == "20"
          assert forward["source_digest"] == reverse["source_digest"]
          assert forward["observation_digest"] == reverse["observation_digest"]
          assert forward["calibration_digest"] == reverse["calibration_digest"]
          assert forward["split_manifest_digest"] == reverse["split_manifest_digest"]
          assert forward["model_digest"] != reverse["model_digest"]
          assert forward["draw_set_digest"] != reverse["draw_set_digest"]
          print("Temporal-network CSV valid: same snapshot multiset and marginal moments, reversed trends/order distinguished by joint energy/variogram scores; exact provenance and deterministic replay.")
          PY


      - name: Verify same-marginal joint and trajectory adequacy controls
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-self-correction/Cargo.toml --bin joint-adequacy-sweep > /tmp/civdyn-joint-adequacy.csv
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path

          path = Path("/tmp/civdyn-joint-adequacy.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = reader.fieldnames

          assert fields is not None and len(fields) == 23, f"expected 23 columns, got {len(fields or [])}"
          assert len(rows) == 2, f"expected two joint candidates, got {len(rows)}"
          candidates = {row["candidate"]: row for row in rows}
          positive = candidates["positive-dependence"]
          negative = candidates["negative-dependence"]

          assert positive["statistic_id"] == negative["statistic_id"] == "district-water-energy-state"
          assert positive["unit_id"] == negative["unit_id"] == "district-held-out"
          assert positive["sample_size"] == negative["sample_size"] == "10"
          assert positive["predictive_draws"] == negative["predictive_draws"] == "2"
          assert positive["component_a"] == negative["component_a"] == "water-service"
          assert positive["component_b"] == negative["component_b"] == "energy-service"
          assert positive["source_digest"] == negative["source_digest"]
          assert positive["observation_digest"] == negative["observation_digest"]
          assert positive["calibration_digest"] == negative["calibration_digest"]
          assert positive["split_manifest_digest"] == negative["split_manifest_digest"]
          assert positive["model_digest"] != negative["model_digest"]
          assert positive["draw_set_digest"] != negative["draw_set_digest"]

          assert math.isclose(float(positive["energy_score"]), 0.3535533905932738, rel_tol=1e-10, abs_tol=1e-10)
          assert math.isclose(float(negative["energy_score"]), 0.6464466094067263, rel_tol=1e-10, abs_tol=1e-10)
          assert math.isclose(float(positive["variogram_score"]), 0.0, abs_tol=1e-12)
          assert math.isclose(float(negative["variogram_score"]), 1.0, abs_tol=1e-12)
          assert math.isclose(float(positive["observed_pair_distance"]), 0.0, abs_tol=1e-12)
          assert math.isclose(float(positive["predictive_pair_distance"]), 0.0, abs_tol=1e-12)
          assert math.isclose(float(negative["predictive_pair_distance"]), 1.0, abs_tol=1e-12)
          print("Joint-adequacy CSV valid: identical marginals, opposite coupling, distinct energy and variogram scores, exact source/model/split lineage.")
          PY
