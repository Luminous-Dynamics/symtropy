name: Orbital Surface Sampling Density Benchmark

on:
  pull_request:
    paths:
      - "tools/surface-sampling-density-bench/**"
      - "docs/research/orbital-truss/fixtures/sampling-density-v0_1.json"
      - "docs/research/orbital-truss/sampling_density_v0_1.schema.json"
      - ".github/workflows/orbital-sampling-density.yml"
  push:
    branches:
      - "research/orbital-sampling-density-v0-1"
    paths:
      - "tools/surface-sampling-density-bench/**"
      - "docs/research/orbital-truss/fixtures/sampling-density-v0_1.json"
      - "docs/research/orbital-truss/sampling_density_v0_1.schema.json"
      - ".github/workflows/orbital-sampling-density.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/sampling-density-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/sampling_density_v0_1.schema.json").read_text())
          assert fixture["benchmark_id"] == "ORBITAL-SAMPLING-DENSITY-001"
          assert len(fixture["cases"]) == 13
          assert len({case["case_id"] for case in fixture["cases"]}) == 13
          assert schema["properties"]["cases"]["minItems"] == 13
          assert schema["properties"]["cases"]["maxItems"] == 13
          print("frozen sampling-density corpus/schema: 13 cases")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/surface-sampling-density-bench/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/surface-sampling-density-bench/Cargo.toml --all-targets
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/surface-sampling-density-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/surface-sampling-density-bench/Cargo.toml --bin sampling-density-bench -- docs/research/orbital-truss/fixtures/sampling-density-v0_1.json "$GITHUB_SHA" > /tmp/sampling-a.json
          cargo run --quiet --locked --manifest-path tools/surface-sampling-density-bench/Cargo.toml --bin sampling-density-bench -- docs/research/orbital-truss/fixtures/sampling-density-v0_1.json "$GITHUB_SHA" > /tmp/sampling-b.json
          cmp /tmp/sampling-a.json /tmp/sampling-b.json
          jq -e '.case_count == 13 and .expected_outcome_matches == 13 and .expected_outcome_mismatches == 0 and .authority_granted == false and .physical_validation == "NOT_ASSESSED"' /tmp/sampling-a.json
      - name: Independent oracle and full receipt comparison
        run: |
          python3 tools/surface-sampling-density-bench/tests/sampling_density_reference_oracle.py docs/research/orbital-truss/fixtures/sampling-density-v0_1.json "$GITHUB_SHA" > /tmp/sampling-oracle.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/sampling-a.json").read_text())
          oracle = json.loads(Path("/tmp/sampling-oracle.json").read_text())
          assert rust == oracle
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert rust["expected_outcome_matches"] == 13
          assert cases["SD-001-EQUAL-AREA-EQUAL-HITS"]["status"] == "FEASIBLE"
          assert cases["SD-002-TENFOLD-AREA-LOWER-DENSITY"]["status"] == "INFEASIBLE"
          assert cases["SD-005-CANDIDATE-POOL-INSUFFICIENT"]["status"] == "INFEASIBLE"
          assert cases["SD-007-UNVERIFIED-RAY-PROVENANCE"]["status"] == "INDETERMINATE"
          assert cases["SD-009-CRITICAL-ELEMENT-NOT-AVERAGED"]["candidate_pool_sufficient"] is False
          assert cases["SD-010-K-VIEWS-AND-DENSITY-ARE-SEPARATE"]["status"] == "BUDGET_INFEASIBLE"
          assert cases["SD-013-REQUESTED-K-EXCEEDS-AVAILABLE-VIEWS"]["status"] == "INFEASIBLE"
          assert cases["SD-013-REQUESTED-K-EXCEEDS-AVAILABLE-VIEWS"]["candidate_pool_sufficient"] is False
          assert cases["SD-013-REQUESTED-K-EXCEEDS-AVAILABLE-VIEWS"]["selected_view_budget_met"] is True
          print("Rust sampling-density receipt matches independent Python oracle on 13 frozen cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-sampling-density-evidence
          path: |
            /tmp/sampling-a.json
            /tmp/sampling-oracle.json
            docs/research/orbital-truss/fixtures/sampling-density-v0_1.json
            docs/research/orbital-truss/sampling_density_v0_1.schema.json
            tools/surface-sampling-density-bench/Cargo.lock
          if-no-files-found: error
          retention-days: 30
