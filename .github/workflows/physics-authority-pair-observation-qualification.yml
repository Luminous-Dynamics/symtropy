name: PHYS-OBS-01 Authority Pair Observation Qualification

on:
  push:
    branches:
      - "ci/physics-authority-pair-observation-v0.1-r2"

permissions:
  contents: read

concurrency:
  group: physics-authority-pair-observation-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 9daf3c4c55848dcbf58c7036d03803f434fc0063
  PRODUCT_PARENT: 4567df998a4df4aa86a3ed241bebce7d104c27cc

jobs:
  qualify:
    name: Frozen PHYS-OBS-01 / Rust 1.96
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 0

      - name: Assert exact product subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git merge-base --is-ancestor "${PRODUCT_PARENT}" "${PRODUCT_HEAD}"
          test "$(git rev-list --count "${PRODUCT_PARENT}..${PRODUCT_HEAD}")" = "5"
          mapfile -t changed < <(git diff --name-only "${PRODUCT_PARENT}..${PRODUCT_HEAD}")
          test "${#changed[@]}" = "4"
          expected=(
            "crates/core/symtropy-physics/PHYSICAL_AUTHORITY_PAIR_OBSERVATION_V01.md"
            "crates/core/symtropy-physics/src/authority_observation.rs"
            "crates/core/symtropy-physics/src/lib.rs"
            "crates/core/symtropy-physics/tests/authority_pair_observation_v01.rs"
          )
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Freeze pair-observation source identities
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symtropy-physics/src/authority_observation.rs \
            crates/core/symtropy-physics/src/identity_authority.rs \
            crates/core/symtropy-physics/src/lib.rs \
            crates/core/symtropy-physics/tests/authority_pair_observation_v01.rs \
            crates/core/symtropy-physics/tests/authority_observation_v01.rs \
            crates/core/symtropy-physics/tests/world_identity_authority_v01.rs \
            crates/core/symtropy-physics/tests/replay_harness.rs \
            crates/core/symtropy-physics/PHYSICAL_AUTHORITY_PAIR_OBSERVATION_V01.md \
            > "${RUNNER_TEMP}/phys-obs01-source-sha256.txt"

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check

      - name: Check physics all targets
        id: check
        run: cargo check -p symtropy-physics --locked --all-targets

      - name: Run pair-observation theorem
        id: pair
        run: cargo test -p symtropy-physics --locked --test authority_pair_observation_v01

      - name: Run selected-subject observation regression
        id: selected
        run: cargo test -p symtropy-physics --locked --test authority_observation_v01

      - name: Run authority identity regression
        id: authority
        run: cargo test -p symtropy-physics --locked --test world_identity_authority_v01

      - name: Run runtime replay regression
        id: replay
        run: cargo test -p symtropy-physics --locked --test replay_harness

      - name: Run strict physics Clippy
        id: clippy
        run: cargo clippy -p symtropy-physics --locked --all-targets -- -D warnings

      - name: Audit pair-observation claim boundary
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          source=crates/core/symtropy-physics/src/authority_observation.rs
          tests=crates/core/symtropy-physics/tests/authority_pair_observation_v01.rs
          contract=crates/core/symtropy-physics/PHYSICAL_AUTHORITY_PAIR_OBSERVATION_V01.md

          grep -Fq 'pub struct AuthorityPairSnapshot' "${source}"
          grep -Fq 'AuthorityPairObservationError::SameSubject' "${source}"
          grep -Fq 'NonFiniteRelativeTranslation' "${source}"
          grep -Fq 'NonFiniteSeparationSquared' "${source}"
          test "$(grep -Fc '.validate_subject(' "${source}")" -ge 3

          python3 - <<'PY'
          from pathlib import Path
          text = Path('crates/core/symtropy-physics/src/authority_observation.rs').read_text()
          start = text.index('pub struct AuthorityPairSnapshot')
          end = text.index('\n}\n\nimpl<const D: usize> AuthorityPairSnapshot', start) + 2
          block = text[start:end]
          assert 'BodyHandle' not in block, block
          PY

          grep -Fq 'assert_ne!(a1.runtime_handle(), a2.runtime_handle());' "${tests}"
          grep -Fq 'assert_ne!(b1.runtime_handle(), b2.runtime_handle());' "${tests}"
          grep -Fq 'assert_eq!(snapshot_a, snapshot_b);' "${tests}"
          grep -Fq 'NonFiniteRelativeTranslation { axis: 0 }' "${tests}"
          grep -Fq 'NonFiniteSeparationSquared' "${tests}"
          grep -Fq 'SubjectB' "${tests}"
          grep -Fq 'SubjectA' "${tests}"

          grep -Fq 'current-state coherence theorem' "${contract}"
          grep -Fq 'fail closed' "${contract}"
          grep -Fq 'continuous trajectory' "${contract}"
          grep -Fq 'route compliance' "${contract}"
          grep -Fq 'arrival' "${contract}"
          grep -Fq 'delivery' "${contract}"
          grep -Fq 'PHYS-OBS-02 / #1026' "${contract}"

      - name: Assert unchanged frozen subject
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git diff --exit-code -- . ':!Cargo.lock'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SUBJECT: ${{ steps.subject.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          PAIR: ${{ steps.pair.outcome }}
          SELECTED: ${{ steps.selected.outcome }}
          AUTHORITY: ${{ steps.authority.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/phys-obs01-authority-pair-observation-v01.json"
          export RECEIPT_PATH="${receipt}"
          python3 - <<'PY'
          import json, os
          keys = [
              'SUBJECT', 'SOURCE', 'FMT', 'CHECK', 'PAIR', 'SELECTED', 'AUTHORITY',
              'REPLAY', 'CLIPPY', 'AUDIT', 'POSTFLIGHT',
          ]
          outcomes = {k.lower(): os.environ.get(k, 'unknown') for k in keys}
          receipt = {
              'receipt_version': 1,
              'qualification': 'PHYS-OBS-01-authority-pair-observation-v0.1',
              'product_head': os.environ['PRODUCT_HEAD'],
              'product_parent': os.environ['PRODUCT_PARENT'],
              'helper_head': os.environ['HELPER_HEAD'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'step_outcomes': outcomes,
              'overall': 'pass' if all(v == 'success' for v in outcomes.values()) else 'fail',
              'claim_boundary': 'finite current displacement/separation between two distinct explicitly selected PhysicsBodySubjects after fail-closed validation under one immutable authority-world borrow; no history, trajectory, route, arrival, delivery, collision provenance, or complete-world integrity claim',
          }
          with open(os.environ['RECEIPT_PATH'], 'w', encoding='utf-8') as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          cp "${RUNNER_TEMP}/phys-obs01-source-sha256.txt" "${RUNNER_TEMP}/phys-obs01-source-sha256-evidence.txt"
          sha256sum "${receipt}" > "${receipt}.sha256"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phys-obs01-authority-pair-observation-v01-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/phys-obs01-authority-pair-observation-v01.json
            ${{ runner.temp }}/phys-obs01-authority-pair-observation-v01.json.sha256
            ${{ runner.temp }}/phys-obs01-source-sha256-evidence.txt
          if-no-files-found: error
          retention-days: 90
