name: Black-hole tail law audit

on:
  push:
    branches:
      - research/bh-tail-law-audit-v0.1
    paths:
      - tools/bh-tail-law-audit/**
      - .github/workflows/bh-tail-law-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/bh-tail-law-audit/**
      - .github/workflows/bh-tail-law-audit.yml

permissions:
  contents: read

concurrency:
  group: bh-tail-law-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tail law reference controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/bh-tail-law-audit/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/bh-tail-law-audit/Cargo.toml --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path tools/bh-tail-law-audit/Cargo.toml --all-targets
