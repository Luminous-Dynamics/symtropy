name: PB-04c Incremental Equivalence Self Apply

on:
  push:
    branches:
      - "spatial/pb04c-incremental-equivalence-v0.1"
    paths:
      - ".github/workflows/pb04c-incremental-self-apply.yml"
      - "scripts/pb04c-add-incremental-recompute.py"
      - "crates/domains/symtropy-spatial-decomposition/tests/incremental_equivalence.rs"

permissions:
  contents: write

concurrency:
  group: pb04c-incremental-self-apply
  cancel-in-progress: true

jobs:
  qualify-and-freeze:
    name: Qualify and freeze PB-04c incremental product
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact PB-04c theorem lineage and qualified schema3 base
        shell: bash
        run: |
          set -euo pipefail
          base=6e08a053cbdf8ef35c2a9b14e439705a3b844be2
          test_head=efffe9cd8bd9089a1c53bb53c99f4687f105d7b1
          transform_head=ed3a795799e324bda4626b2c80514813cd5b8ba8
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${transform_head}"
          test "$(git rev-parse HEAD^^)" = "${test_head}"
          test "$(git rev-parse HEAD^^^)" = "${base}"
          test "$(git rev-parse ${base}^{tree})" = "4477c58dd76f61e1f0eac2ffbfe3115cd35f1015"

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git rev-parse "HEAD:${path}")"
            test "${actual}" = "${expected}" || {
              echo "PB-04c source drift: ${path}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            }
          }

          check_blob 676fd6a7eb31a2ec00b09c9496b42c568e791556 crates/domains/symtropy-spatial-decomposition/Cargo.lock
          check_blob 614fa7d2e293809faaef10649cf3beb02475c259 crates/domains/symtropy-spatial-decomposition/Cargo.toml
          check_blob 27df81c6a06a1d59a04dfd951c76e27a2c5d7a18 crates/domains/symtropy-spatial-decomposition/src/lib.rs
          check_blob ea93ff96e172027bce604b6438c7ba124a6d54e3 crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs
          check_blob b01ecedb068db1db370c6f7e9d6c991b590c3d95 crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs
          check_blob 1bccd6c80e848cff8bd91e445a32a0e56326c337 crates/domains/symtropy-spatial-decomposition/tests/incremental_equivalence.rs
          check_blob 947caa8f38476581cf991aa13e0e879bee2efdd9 scripts/pb04c-add-incremental-recompute.py

          actual_source_delta="$(git diff --name-only ${base}..HEAD | sort -u)"
          expected_source_delta="$(printf '%s\n' \
            .github/workflows/pb04c-incremental-self-apply.yml \
            crates/domains/symtropy-spatial-decomposition/tests/incremental_equivalence.rs \
            scripts/pb04c-add-incremental-recompute.py | sort)"
          test "${actual_source_delta}" = "${expected_source_delta}"

          echo "PB04C_INPUT_HEAD=${GITHUB_SHA}"
          echo "PB04C_INPUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "PB04C_QUALIFIED_SCHEMA3_BASE=${base}"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04c-incremental-target" >> "${GITHUB_ENV}"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PB04C_RUNNER_OS=${RUNNER_OS}"
          echo "PB04C_RUNNER_ARCH=${RUNNER_ARCH}"
          echo "PB04C_IMAGE_OS=${ImageOS:-unknown}"
          echo "PB04C_IMAGE_VERSION=${ImageVersion:-unknown}"
          uname -a
          git --version

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Apply exact PB-04c transform and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pb04c-add-incremental-recompute.py
          cargo fmt --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml
          echo "PB04C_TRANSFORMED_LIB_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/src/lib.rs)"
          echo "PB04C_FORMATTED_TEST_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/tests/incremental_equivalence.rs)"
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/Cargo.lock)" = "676fd6a7eb31a2ec00b09c9496b42c568e791556"
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs)" = "ea93ff96e172027bce604b6438c7ba124a6d54e3"
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs)" = "b01ecedb068db1db370c6f7e9d6c991b590c3d95"

      - name: Verify locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          manifest="crates/domains/symtropy-spatial-decomposition/Cargo.toml"
          cargo metadata --manifest-path "${manifest}" --locked --format-version 1 > "${RUNNER_TEMP}/pb04c-metadata.json"
          echo "PB04C_LOCKED_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/pb04c-metadata.json" | awk '{print $1}')"

      - name: Check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets

      - name: Test incremental equivalence theorem
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked

      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets -- -D warnings

      - name: Require exact generated product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e crates/domains/symtropy-spatial-decomposition/target
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/Cargo.lock)" = "676fd6a7eb31a2ec00b09c9496b42c568e791556"

          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          lib="crates/domains/symtropy-spatial-decomposition/src/lib.rs"
          test_file="crates/domains/symtropy-spatial-decomposition/tests/incremental_equivalence.rs"
          printf '%s\n' "${actual}" | grep -Fx "${lib}" >/dev/null
          unexpected="$(printf '%s\n' "${actual}" | grep -Fvx -e "${lib}" -e "${test_file}" || true)"
          test -z "${unexpected}" || {
            echo "PB-04c generated unexpected product paths:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          }

      - name: Publish frozen PB-04c product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PB-04c Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            crates/domains/symtropy-spatial-decomposition/src/lib.rs \
            crates/domains/symtropy-spatial-decomposition/tests/incremental_equivalence.rs
          git diff --cached --check
          git diff --cached --exit-code --quiet && {
            echo "no PB-04c product delta" >&2
            exit 1
          }
          git commit -m "feat(spatial): add exact PB-04c incremental recomputation"

          echo "PB04C_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo "PB04C_PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
          echo "PB04C_PRODUCT_PARENT=$(git rev-parse HEAD^)"
          echo "PB04C_PRODUCT_LIB_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/src/lib.rs)"
          echo "PB04C_PRODUCT_TEST_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/tests/incremental_equivalence.rs)"
          echo "PB04C_PRODUCT_LOCK_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/Cargo.lock)"

          remote_head="$(git ls-remote origin refs/heads/spatial/pb04c-incremental-equivalence-v0.1 | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin HEAD:spatial/pb04c-incremental-equivalence-v0.1
