name: LOCO Actuation AoI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research/loco-actuation-aoi-001/**"
      - ".github/workflows/loco-actuation-aoi.yml"
  push:
    branches: ["research/loco-actuation-aoi-001"]
    paths:
      - "research/loco-actuation-aoi-001/**"
      - ".github/workflows/loco-actuation-aoi.yml"

concurrency:
  group: loco-actuation-aoi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Deterministic actuator-side AoI reference (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/loco-actuation-aoi-001/Cargo.toml -- --check
      - name: Test AoI reference
        run: cargo test --locked --manifest-path research/loco-actuation-aoi-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/loco-actuation-aoi-001/Cargo.toml --all-targets -- -D warnings
