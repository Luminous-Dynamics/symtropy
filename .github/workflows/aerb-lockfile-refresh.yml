name: RRVR AERB lockfile refresh and qualification
on:
  push:
    branches:
      - research/mobility-rrvr-aerb-probe-value-v0-1
      - research/aerb-blind-corpus-assignments-v0-1
    paths:
      - "research/mobility-rrvr-aerb-v0.1/evaluator/**"
      - ".github/workflows/aerb-lockfile-refresh.yml"
  pull_request:
    paths:
      - "research/mobility-rrvr-aerb-v0.1/evaluator/**"
      - ".github/workflows/aerb-lockfile-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-and-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Regenerate the evaluator lockfile from its manifest
        run: cargo generate-lockfile --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml -- --check

      - name: Run locked tests
        run: cargo test --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --all-targets

      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run evaluator known-answer fixture
        run: cargo run --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --bin aerb_evaluate -- research/mobility-rrvr-aerb-v0.1/fixtures/candidate_episode_synthetic_v0_1.json research/mobility-rrvr-aerb-v0.1/fixtures/candidate_submission_synthetic_v0_1.json research/mobility-rrvr-aerb-v0.1/fixtures/evaluator_only/world_pack_synthetic_v0_1.json

      - name: Upload regenerated lockfile for source-control update
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerb-evaluator-cargo-lock
          path: research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.lock
          if-no-files-found: error
