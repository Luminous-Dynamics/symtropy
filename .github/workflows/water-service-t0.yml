name: Water service T0 evaluator

on:
  push:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - "docs/research/jw-water-cascade/**"
      - "docs/research/jw-water-intake-t1/**"
      - ".github/workflows/water-service-t0.yml"
  pull_request:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - "docs/research/jw-water-cascade/**"
      - ".github/workflows/water-service-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-service-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --package water-service-t0 -- --check
      - name: Run locked unit and frozen-oracle tests
        run: cargo test --locked --package water-service-t0
      - name: Run strict Clippy
        run: cargo clippy --locked --package water-service-t0 --all-targets -- -D warnings
      - name: Evaluate exact checked-out revision
        id: evaluate
        env:
          WATER_SERVICE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin water-service-t0 -- \
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json \
            research/water-service-engineering/benchmark-manifest-v0.1.json \
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json \
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json \
            artifacts/water-service-t0/receipt.json
      - name: Evaluate Johannesburg water cascade T0
        id: evaluate_cascade
        env:
          JW_WATER_CASCADE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin jw-water-cascade-t0 -- \
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.schema.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.schema.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_source_manifest.v0.1.json \
            artifacts/water-service-t0/jw-water-cascade-t0-receipt.json
      - name: Verify Watersearch T1 capture envelope (synthetic fixture)
        id: verify_intake_t1
        env:
          JW_WATER_INTAKE_T1_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin jw-water-intake-t1 -- \
            docs/research/jw-water-intake-t1/watersearch_suburb_history.synthetic.v0.1.json \
            docs/research/jw-water-intake-t1/response_headers.synthetic.v0.1.txt \
            docs/research/jw-water-intake-t1/capture_manifest.synthetic.v0.1.json \
            docs/research/jw-water-intake-t1/watersearch_suburb_history_response.schema.v0.1.json \
            docs/research/jw-water-intake-t1/capture_manifest.schema.v0.1.json \
            artifacts/water-service-t0/jw-water-intake-t1-receipt.json
      - name: Evaluate paired WaterLoop matched-service T1 contract
        id: evaluate_matched_service_t1
        env:
          WATERLOOP_MATCHED_SERVICE_T1_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin waterloop-matched-service-t1 -- \
            research/water-service-engineering/waterloop-matched-service-t1-input.v0.1.json \
            research/water-service-engineering/waterloop-matched-service-t1-input.schema.v0.1.json \
            research/water-service-engineering/waterloop-matched-service-t1-oracle.v0.1.json \
            artifacts/water-service-t0/waterloop-matched-service-t1-receipt.json
      - name: Upload exact inputs, manifests, oracle and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-service-t0-exact-head-evidence
          path: |
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json
            research/water-service-engineering/benchmark-manifest-v0.1.json
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json
            artifacts/water-service-t0/receipt.json
            docs/research/jw-water-cascade/JW_WATER_CASCADE_T0_PROTOCOL_V0_1.md
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.schema.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.schema.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_source_manifest.v0.1.json
            artifacts/water-service-t0/jw-water-cascade-t0-receipt.json
            docs/research/jw-water-intake-t1/JW_WATERSEARCH_T1_INTAKE_PROTOCOL_V0_1.md
            docs/research/jw-water-intake-t1/watersearch_suburb_history.synthetic.v0.1.json
            docs/research/jw-water-intake-t1/response_headers.synthetic.v0.1.txt
            docs/research/jw-water-intake-t1/capture_manifest.synthetic.v0.1.json
            docs/research/jw-water-intake-t1/watersearch_suburb_history_response.schema.v0.1.json
            docs/research/jw-water-intake-t1/capture_manifest.schema.v0.1.json
            artifacts/water-service-t0/jw-water-intake-t1-receipt.json
            research/water-service-engineering/WATERLOOP_MATCHED_SERVICE_T1_PROTOCOL_V0_1.md
            research/water-service-engineering/waterloop-matched-service-plan.v0.1.json
            research/water-service-engineering/waterloop-matched-service-plan.schema.v0.1.json
            research/water-service-engineering/waterloop-matched-service-run.schema.v0.1.json
            research/water-service-engineering/WATERLOOP_MATCHED_SERVICE_T1_EVALUATOR_PROTOCOL_V0_1.md
            research/water-service-engineering/waterloop-matched-service-t1-input.v0.1.json
            research/water-service-engineering/waterloop-matched-service-t1-input.schema.v0.1.json
            research/water-service-engineering/waterloop-matched-service-t1-oracle.v0.1.json
            research/water-service-engineering/waterloop-matched-service-t1-oracle.schema.v0.1.json
            artifacts/water-service-t0/waterloop-matched-service-t1-receipt.json
          if-no-files-found: warn
      - name: Set up Python for matched-service protocol validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate WaterLoop matched-service plan and run schemas
        id: validate_matched_service
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          plan_schema = json.loads((root / "waterloop-matched-service-plan.schema.v0.1.json").read_text())
          plan = json.loads((root / "waterloop-matched-service-plan.v0.1.json").read_text())
          run_schema = json.loads((root / "waterloop-matched-service-run.schema.v0.1.json").read_text())
          for name, schema in [("plan", plan_schema), ("run", run_schema)]:
              Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(plan_schema).iter_errors(plan),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"WATERLOOP_MATCHED_SERVICE_PLAN_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)
          if plan["status"] != "design_only" or plan["evidence_class"] != "synthetic_plan_only":
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_PLAN_EVIDENCE_CLASS_FAIL")
          for key in ["physical_trial_authorized", "procurement_authorized", "occupied_use_authorized", "network_interconnection_authorized"]:
              if plan[key] is not False:
                  raise SystemExit(f"WATERLOOP_MATCHED_SERVICE_AUTHORIZATION_GUARD_FAIL: {key}")
          if any(channel["data_status"] != "not_acquired" for channel in plan["measurement_channels"]):
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_MEASUREMENTS_MUST_REMAIN_NOT_ACQUIRED")
          if plan["declared_use_profile"]["quality_release_ref"] is not None:
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_QUALITY_RELEASE_MUST_REMAIN_PENDING")
          if any(value is not False for value in plan["claim_guards"].values()):
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_CLAIM_GUARD_BREACH")
          channel_ids = [channel["channel_id"] for channel in plan["measurement_channels"]]
          if len(channel_ids) != len(set(channel_ids)):
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_CHANNEL_IDS_NOT_UNIQUE")
          if len(plan["arms"]) != 2 or {arm["role"] for arm in plan["arms"]} != {"control", "treatment"}:
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_CONTROL_TREATMENT_ARMS_INCOMPLETE")
          print("WATERLOOP_MATCHED_SERVICE_SCHEMA_PASS: design-only; 12 channels; no physical or savings claims")

          t1_input_schema = json.loads((root / "waterloop-matched-service-t1-input.schema.v0.1.json").read_text())
          t1_input = json.loads((root / "waterloop-matched-service-t1-input.v0.1.json").read_text())
          t1_oracle_schema = json.loads((root / "waterloop-matched-service-t1-oracle.schema.v0.1.json").read_text())
          t1_oracle = json.loads((root / "waterloop-matched-service-t1-oracle.v0.1.json").read_text())
          for name, schema in [("t1_input", t1_input_schema), ("t1_oracle", t1_oracle_schema)]:
              Draft202012Validator.check_schema(schema)
          for name, schema, document in [
              ("t1_input", t1_input_schema, t1_input),
              ("t1_oracle", t1_oracle_schema, t1_oracle),
          ]:
              errors = sorted(
                  Draft202012Validator(schema).iter_errors(document),
                  key=lambda error: (list(map(str, error.absolute_path)), error.message),
              )
              if errors:
                  for error in errors:
                      pointer = "/" + "/".join(map(str, error.absolute_path))
                      print(f"WATERLOOP_MATCHED_SERVICE_T1_{name.upper()}_SCHEMA_FAIL: {pointer}: {error.message}")
                  raise SystemExit(1)
          if t1_input["evidence_class"] != "synthetic_only" or t1_input["minimum_paired_blocks"] != 6:
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_T1_CLAIM_CEILING_FAIL")
          if t1_input["frozen_plan_blob_sha"] != "3b64690fa02ac47b3bc430a22b1392c65583bba7":
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_T1_PLAN_IDENTITY_FAIL")
          if len(t1_input["cases"]) != 13 or len(t1_oracle["cases"]) != 13:
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_T1_CASE_COUNT_FAIL")
          if {x["case_id"] for x in t1_input["cases"]} != {x["case_id"] for x in t1_oracle["cases"]}:
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_T1_ORACLE_CASE_SET_FAIL")
          if any(len(case["blocks"]) < 6 for case in t1_input["cases"]):
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_T1_PAIRED_BLOCK_FLOOR_FAIL")
          if any(case["physical_qualification_status"] != "NotRun" or case["statistical_inference_status"] != "NotRun" or case["claim_eligibility"] != "NotEligible" for case in t1_oracle["cases"]):
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_T1_CLAIM_GUARD_BREACH")
          if any(case["probability_interpretation"] if "probability_interpretation" in case else False for case in t1_oracle["cases"]):
              raise SystemExit("WATERLOOP_MATCHED_SERVICE_T1_PROBABILITY_CLAIM_BREACH")
          print("WATERLOOP_MATCHED_SERVICE_T1_SCHEMA_PASS: 13 cases; six paired blocks; synthetic-only; no physical or statistical claim")
          PY
      - name: Require an exact successful evaluator receipt
        if: always()
        env:
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          CASCADE_OUTCOME: ${{ steps.evaluate_cascade.outcome }}
          INTAKE_OUTCOME: ${{ steps.verify_intake_t1.outcome }}
          MATCHED_SERVICE_PLAN_OUTCOME: ${{ steps.validate_matched_service.outcome }}
          MATCHED_SERVICE_T1_OUTCOME: ${{ steps.evaluate_matched_service_t1.outcome }}
        run: |
          test "$EVALUATE_OUTCOME" = "success"
          test "$CASCADE_OUTCOME" = "success"
          test "$INTAKE_OUTCOME" = "success"
          test "$MATCHED_SERVICE_PLAN_OUTCOME" = "success"
          test "$MATCHED_SERVICE_T1_OUTCOME" = "success"
