name: Water service T0 evaluator

on:
  push:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  pull_request:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-service-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --package water-service-t0 -- --check
      - name: Run locked unit and frozen-oracle tests
        run: cargo test --locked --package water-service-t0
      - name: Run strict Clippy
        run: cargo clippy --locked --package water-service-t0 --all-targets -- -D warnings
      - name: Evaluate exact checked-out revision
        id: evaluate
        env:
          WATER_SERVICE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 -- \
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json \
            research/water-service-engineering/benchmark-manifest-v0.1.json \
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json \
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json \
            artifacts/water-service-t0/receipt.json
      - name: Evaluate sparse-sensor control contract at exact checked-out revision
        id: control_evaluate
        env:
          WATER_CONTROL_ROBUSTNESS_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin water-control-robustness -- \
            research/water-service-engineering/pump-control-robustness/scenarios-v0.1.json \
            research/water-service-engineering/pump-control-robustness/scenarios-v0.1.schema.json \
            research/water-service-engineering/pump-control-robustness/disposition-oracle-v0.1.json \
            artifacts/water-control-robustness/receipt.json
      - name: Upload exact inputs, manifests, oracles and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-service-t0-exact-head-evidence
          path: |
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json
            research/water-service-engineering/benchmark-manifest-v0.1.json
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json
            artifacts/water-service-t0/receipt.json
            research/water-service-engineering/pump-control-robustness/scenarios-v0.1.json
            research/water-service-engineering/pump-control-robustness/scenarios-v0.1.schema.json
            research/water-service-engineering/pump-control-robustness/disposition-oracle-v0.1.json
            artifacts/water-control-robustness/receipt.json
          if-no-files-found: warn
      - name: Require both exact-head evaluator receipts
        if: always()
        env:
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          CONTROL_EVALUATE_OUTCOME: ${{ steps.control_evaluate.outcome }}
        run: |
          test "$EVALUATE_OUTCOME" = "success"
          test "$CONTROL_EVALUATE_OUTCOME" = "success"
