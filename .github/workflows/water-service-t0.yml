name: Water service T0 evaluator

on:
  push:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  pull_request:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-service-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --package water-service-t0 -- --check
      - name: Run locked unit and frozen-oracle tests
        run: cargo test --locked --package water-service-t0
      - name: Run strict Clippy
        run: cargo clippy --locked --package water-service-t0 --all-targets -- -D warnings
      - name: Evaluate exact checked-out revision
        id: evaluate
        env:
          WATER_SERVICE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 -- \
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json \
            research/water-service-engineering/benchmark-manifest-v0.1.json \
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json \
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json \
            artifacts/water-service-t0/receipt.json
      - name: Upload exact inputs, manifests, oracle and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-service-t0-exact-head-evidence
          path: |
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json
            research/water-service-engineering/benchmark-manifest-v0.1.json
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json
            artifacts/water-service-t0/receipt.json
          if-no-files-found: warn
      - name: Set up Python for JSON Schema validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate water-network dataset admission register and Draft 2020-12 schema
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          schema = json.loads((root / "wdn-dataset-admission.schema.json").read_text())
          register = json.loads((root / "wdn-dataset-admission-v0.1.json").read_text())
          protocol_schema = json.loads((root / "wdn-cross-population-protocol.schema.v0.1.json").read_text())
          protocol = json.loads((root / "wdn-cross-population-protocol.v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator.check_schema(protocol_schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(register),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"WDN_DATASET_ADMISSION_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)
          datasets = register["datasets"]
          if len(datasets) != 8:
              raise SystemExit(f"WDN_DATASET_COUNT_FAIL: expected 8, got {len(datasets)}")
          if any(row["intake"]["files_acquired"] for row in datasets):
              raise SystemExit("WDN_DATASET_UNVERIFIED_BYTES_MUST_NOT_BE_MARKED_ACQUIRED")
          print("WDN_DATASET_ADMISSION_SCHEMA_PASS: 8 metadata-only records; no hashes or splits fabricated")

          protocol_errors = sorted(
              Draft202012Validator(protocol_schema).iter_errors(protocol),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if protocol_errors:
              for error in protocol_errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"WDN_CROSSPOP_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)
          populations = protocol["populations"]
          expected_ids = {
              "DITEC_WDN", "LEAKDB", "LEAKTESTBED_AGHASHASHI_2023",
              "SLOVAK_UTILITY_SCADA_2026", "BATTLEDIM_L_TOWN",
              "NET3_47K_PAPER_CORPUS", "PAMPLONA_DAS_2026", "WDSEVENTDB",
          }
          observed_ids = {row["dataset_id"] for row in populations}
          if len(populations) != 8 or observed_ids != expected_ids:
              raise SystemExit("WDN_CROSSPOP_POPULATION_IDENTITY_FAIL")
          if protocol["no_pooled_leaderboard"] is not True:
              raise SystemExit("WDN_CROSSPOP_POOLED_LEADERBOARD_MUST_REMAIN_DISABLED")
          if protocol["comparison_requirements"]["cross_population_pooled_metric_allowed"] is not False:
              raise SystemExit("WDN_CROSSPOP_POOLED_METRIC_MUST_REMAIN_DISABLED")
          if protocol["admission"] != {
              "dataset_files_acquired": False,
              "dataset_digests_created": False,
              "split_manifests_created": False,
              "model_performance_claimed": False,
          }:
              raise SystemExit("WDN_CROSSPOP_METADATA_ONLY_CLAIM_CEILING_BREACH")
          if any(row["files_acquired"] or row["archive_sha256"] is not None or row["split_manifest"] is not None for row in populations):
              raise SystemExit("WDN_CROSSPOP_UNVERIFIED_DATA_MUST_NOT_BE_ADMITTED")
          if len(protocol["baseline_ladder"]) != 8:
              raise SystemExit("WDN_CROSSPOP_BASELINE_LADDER_INCOMPLETE")
          print("WDN_CROSSPOP_SCHEMA_PASS: 8 distinct populations; no pooling; no raw data or model claims")
          PY
      - name: Require an exact successful evaluator receipt
        if: always()
        env:
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
        run: test "$EVALUATE_OUTCOME" = "success"
