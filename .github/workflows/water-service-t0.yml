name: Water service T0 evaluator

on:
  push:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  pull_request:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-service-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --package water-service-t0 -- --check
      - name: Run locked unit and frozen-oracle tests
        run: cargo test --locked --package water-service-t0
      - name: Run strict Clippy
        run: cargo clippy --locked --package water-service-t0 --all-targets -- -D warnings
      - name: Evaluate exact checked-out revision
        id: evaluate
        env:
          WATER_SERVICE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin water-service-t0 -- \
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json \
            research/water-service-engineering/benchmark-manifest-v0.1.json \
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json \
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json \
            artifacts/water-service-t0/receipt.json
      - name: Set up pinned Python for membrane data contracts
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Validate membrane dataset admission and RO M0 contracts
        id: membrane_contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          register = json.loads((root / "membrane-dataset-admission-v0.1.json").read_text())
          register_schema = json.loads((root / "membrane-dataset-admission.schema.json").read_text())
          Draft202012Validator.check_schema(register_schema)
          errors = sorted(
              Draft202012Validator(register_schema).iter_errors(register),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"MEMBRANE_DATASET_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)

          rows = register["datasets"]
          ids = [row["dataset_id"] for row in rows]
          if len(ids) != 4 or len(set(ids)) != 4:
              raise SystemExit("MEMBRANE_DATASET_IDENTITY_FAIL")
          if any(row["intake"]["files_acquired"] for row in rows):
              raise SystemExit("MEMBRANE_DATASET_BYTES_NOT_ACQUIRED_GUARD_FAIL")
          if any(row["intake"]["archive_sha256"] is not None or row["intake"]["file_inventory"] for row in rows):
              raise SystemExit("MEMBRANE_DATASET_UNVERIFIED_DIGEST_GUARD_FAIL")
          if any(row["intake"]["split_manifest"] is not None for row in rows):
              raise SystemExit("MEMBRANE_DATASET_UNVERIFIED_SPLIT_GUARD_FAIL")

          m0_schema = json.loads((root / "membrane-ro-m0.schema.json").read_text())
          m0_inputs = json.loads((root / "membrane-ro-m0-cases-v0.1.json").read_text())
          m0_oracle = json.loads((root / "membrane-ro-m0-oracle-v0.1.json").read_text())
          m0_manifest = json.loads((root / "membrane-ro-m0-manifest-v0.1.json").read_text())
          Draft202012Validator.check_schema(m0_schema)
          errors = sorted(
              Draft202012Validator(m0_schema).iter_errors(m0_inputs),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"MEMBRANE_M0_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)

          oracle_by_id = {row["case_id"]: row["expected"] for row in m0_oracle["cases"]}
          input_ids = [row["case_id"] for row in m0_inputs["cases"]]
          if len(input_ids) != 5 or len(set(input_ids)) != 5 or len(oracle_by_id) != 5:
              raise SystemExit("MEMBRANE_M0_CASE_IDENTITY_FAIL")
          if sorted(input_ids) != sorted(oracle_by_id):
              raise SystemExit("MEMBRANE_M0_INPUT_ORACLE_ID_MISMATCH")
          if m0_manifest["case_count"] != 5:
              raise SystemExit("MEMBRANE_M0_MANIFEST_COUNT_FAIL")
          if any("expected" in row for row in m0_inputs["cases"]):
              raise SystemExit("MEMBRANE_M0_INPUTS_EMBED_ORACLE_FAIL")

          def close(actual, expected):
              return math.isclose(actual, expected, rel_tol=1e-9, abs_tol=1e-12)

          for row in m0_inputs["cases"]:
              i = row["inputs"]
              j = i["flux_l_m2_h"]
              dp = i["delta_pressure_bar"]
              piw = i["osmotic_pressure_wall_bar"]
              pip = i["osmotic_pressure_permeate_bar"]
              rejection = i["rejection_fraction"]
              k = i["mass_transfer_coefficient_l_m2_h"]
              ndp = dp - (piw - pip)
              cp = math.exp(j / k)
              beta = (1.0 - rejection) + rejection * cp
              aw = j / ndp
              aw_simple = j / dp
              bs = j * (1.0 - rejection) / (rejection * cp)
              bs_simple = j * (1.0 - rejection) / rejection
              actual = {
                  "net_driving_pressure_bar": ndp,
                  "concentration_polarization_modulus": beta,
                  "water_permeance_reference_l_m2_h_bar": aw,
                  "water_permeance_pressure_only_l_m2_h_bar": aw_simple,
                  "water_permeance_pressure_only_percent_error": 100.0 * (aw_simple - aw) / aw,
                  "solute_permeance_reference_l_m2_h": bs,
                  "solute_permeance_no_concentration_polarization_l_m2_h": bs_simple,
                  "solute_permeance_no_concentration_polarization_percent_error": 100.0 * (bs_simple - bs) / bs,
              }
              expected = oracle_by_id[row["case_id"]]
              for key, value in actual.items():
                  if not close(value, expected[key]):
                      raise SystemExit(
                          f"MEMBRANE_M0_ORACLE_MISMATCH: {row['case_id']} {key}: {value} != {expected[key]}"
                      )
          print("MEMBRANE_DATASET_ADMISSION_PASS: 4 records remain metadata-only; no hashes or splits fabricated")
          print("MEMBRANE_RO_M0_PASS: 5 synthetic transport cases match separate formula oracle")
          PY
      - name: Validate sample-time-only M2 water-quality labels
        id: membrane_wq_m2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path("research/water-service-engineering")
          schema = json.loads((root / "membrane-wq-sample.schema.json").read_text())
          fixtures = json.loads((root / "membrane-wq-sample-fixtures-v0.1.json").read_text())
          manifest = json.loads((root / "membrane-wq-sample-manifest-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          if len(fixtures["cases"]) != 6 or manifest["case_count"] != 6:
              raise SystemExit("MEMBRANE_WQ_M2_CASE_COUNT_FAIL")
          ids = [case["case_id"] for case in fixtures["cases"]]
          if len(set(ids)) != 6:
              raise SystemExit("MEMBRANE_WQ_M2_DUPLICATE_CASE_ID")

          for case in fixtures["cases"]:
              record = case["record"]
              errors = sorted(
                  validator.iter_errors(record),
                  key=lambda error: (list(map(str, error.absolute_path)), error.message),
              )
              if errors:
                  for error in errors:
                      pointer = "/" + "/".join(map(str, error.absolute_path))
                      print(f"MEMBRANE_WQ_M2_SCHEMA_FAIL: {case['case_id']} {pointer}: {error.message}")
                  raise SystemExit(1)

              sample_time = datetime.fromisoformat(record["sample_collection_time"].replace("Z", "+00:00"))
              feature_cutoff = datetime.fromisoformat(record["telemetry_feature_cutoff"].replace("Z", "+00:00"))
              if feature_cutoff > sample_time:
                  if case["expected"] != "REJECT_POST_SAMPLE_FEATURE_LEAKAGE":
                      raise SystemExit(f"MEMBRANE_WQ_M2_FUTURE_FEATURE_NOT_REJECTED: {case['case_id']}")
              if record["result_qualifier"] in ("BELOW_LOD", "BELOW_LOQ"):
                  if record["value"] is not None:
                      raise SystemExit(f"MEMBRANE_WQ_M2_CENSORED_RESULT_MUST_NOT_BE_NUMERIC: {case['case_id']}")
                  if case["expected"] != "ADMISSIBLE_QUALIFIED_RESULT_NOT_ZERO":
                      raise SystemExit(f"MEMBRANE_WQ_M2_QUALIFIER_SEMANTICS_FAIL: {case['case_id']}")
              if record["lab_qc_status"] != "ACCEPTED":
                  if case["expected"] != "NOT_A_TRAINING_LABEL":
                      raise SystemExit(f"MEMBRANE_WQ_M2_REJECTED_QC_NOT_EXCLUDED: {case['case_id']}")
              if record["label_scope"] != "SAMPLE_TIME_LOCATION_ANALYTE_ONLY":
                  raise SystemExit(f"MEMBRANE_WQ_M2_LABEL_SCOPE_FAIL: {case['case_id']}")

          same_time = [
              row["record"] for row in fixtures["cases"]
              if row["record"]["sample_collection_time"] == "2030-01-01T10:20:00Z"
          ]
          if len(same_time) > 1 and len({x["sample_location_id"] for x in same_time}) != len(same_time):
              raise SystemExit("MEMBRANE_WQ_M2_LOCATION_IDENTITY_FAIL")
          print("MEMBRANE_WQ_M2_PASS: 6 synthetic fixtures; sample-time-only, causal cutoff and qualifier semantics enforced")
          PY
      - name: Evaluate membrane RO transport M0 at exact revision
        id: membrane_ro_m0
        env:
          MEMBRANE_RO_M0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin membrane-ro-m0 -- \
            research/water-service-engineering/membrane-ro-m0-cases-v0.1.json \
            research/water-service-engineering/membrane-ro-m0-oracle-v0.1.json \
            research/water-service-engineering/membrane-ro-m0.schema.json \
            research/water-service-engineering/membrane-ro-m0-manifest-v0.1.json \
            artifacts/membrane-ro-m0/receipt.json
      - name: Validate grouped multi-pressure membrane RO M0B regression
        id: membrane_ro_m0b_contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          schema = json.loads((root / "membrane-ro-m0b-regression.schema.json").read_text())
          inputs = json.loads((root / "membrane-ro-m0b-regression-cases-v0.1.json").read_text())
          oracle = json.loads((root / "membrane-ro-m0b-regression-oracle-v0.1.json").read_text())
          manifest = json.loads((root / "membrane-ro-m0b-regression-manifest-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(inputs),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"MEMBRANE_M0B_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)

          oracle_by_id = {row["case_id"]: row["expected"] for row in oracle["cases"]}
          case_ids = [row["case_id"] for row in inputs["cases"]]
          if len(case_ids) != 3 or len(set(case_ids)) != 3 or len(oracle_by_id) != 3:
              raise SystemExit("MEMBRANE_M0B_CASE_IDENTITY_FAIL")
          if sorted(case_ids) != sorted(oracle_by_id) or manifest["case_count"] != 3:
              raise SystemExit("MEMBRANE_M0B_INPUT_ORACLE_OR_MANIFEST_MISMATCH")
          if any("expected" in row for row in inputs["cases"]):
              raise SystemExit("MEMBRANE_M0B_INPUTS_EMBED_ORACLE_FAIL")

          def close(actual, expected):
              return math.isclose(actual, expected, rel_tol=1e-9, abs_tol=1e-12)

          for case in inputs["cases"]:
              replicate_results = []
              for replicate in case["replicates"]:
                  xs, ys = [], []
                  for point in replicate["points"]:
                      ndp = (
                          point["delta_pressure_bar"]
                          - point["osmotic_pressure_wall_bar"]
                          + point["osmotic_pressure_permeate_bar"]
                      )
                      if ndp <= 0:
                          raise SystemExit(f"MEMBRANE_M0B_NONPOSITIVE_NDP: {case['case_id']}")
                      xs.append(ndp)
                      ys.append(point["flux_l_m2_h"])
                  slope = sum(x * y for x, y in zip(xs, ys)) / sum(x * x for x in xs)
                  rmse = math.sqrt(sum((y - slope * x) ** 2 for x, y in zip(xs, ys)) / len(xs))
                  pointwise = sum(y / x for x, y in zip(xs, ys)) / len(xs)
                  replicate_results.append({
                      "replicate_id": replicate["replicate_id"],
                      "point_count": len(xs),
                      "slope_l_m2_h_bar": slope,
                      "residual_rmse_l_m2_h": rmse,
                      "mean_pointwise_ratio_l_m2_h_bar": pointwise,
                  })
              slopes = [row["slope_l_m2_h_bar"] for row in replicate_results]
              mean = sum(slopes) / len(slopes)
              sd = math.sqrt(sum((x - mean) ** 2 for x in slopes) / (len(slopes) - 1))
              actual = {
                  "replicate_count": len(replicate_results),
                  "total_point_count": sum(row["point_count"] for row in replicate_results),
                  "replicates": replicate_results,
                  "mean_slope_l_m2_h_bar": mean,
                  "sample_sd_of_replicate_slopes_l_m2_h_bar": sd,
              }
              expected = oracle_by_id[case["case_id"]]
              for key in ("replicate_count", "total_point_count"):
                  if actual[key] != expected[key]:
                      raise SystemExit(f"MEMBRANE_M0B_ORACLE_MISMATCH: {case['case_id']} {key}")
              for key in ("mean_slope_l_m2_h_bar", "sample_sd_of_replicate_slopes_l_m2_h_bar"):
                  if not close(actual[key], expected[key]):
                      raise SystemExit(f"MEMBRANE_M0B_ORACLE_MISMATCH: {case['case_id']} {key}")
              expected_reps = {row["replicate_id"]: row for row in expected["replicates"]}
              for actual_rep in actual["replicates"]:
                  target = expected_reps[actual_rep["replicate_id"]]
                  for key in ("slope_l_m2_h_bar", "residual_rmse_l_m2_h", "mean_pointwise_ratio_l_m2_h_bar"):
                      if not close(actual_rep[key], target[key]):
                          raise SystemExit(f"MEMBRANE_M0B_REPLICATE_MISMATCH: {case['case_id']} {actual_rep['replicate_id']} {key}")
          print("MEMBRANE_RO_M0B_PASS: 3 grouped pressure-series cases; per-replicate slopes and uncertainty match separate oracle")
          PY
      - name: Evaluate membrane RO M0B grouped regression at exact revision
        id: membrane_ro_m0b
        env:
          MEMBRANE_RO_M0B_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin membrane-ro-m0b-regression -- \
            research/water-service-engineering/membrane-ro-m0b-regression-cases-v0.1.json \
            research/water-service-engineering/membrane-ro-m0b-regression-oracle-v0.1.json \
            research/water-service-engineering/membrane-ro-m0b-regression.schema.json \
            research/water-service-engineering/membrane-ro-m0b-regression-manifest-v0.1.json \
            artifacts/membrane-ro-m0b-regression/receipt.json
            research/water-service-engineering/MEMBRANE_OBSERVABILITY_FAULT_BENCH_F0_V0_1.md
            research/water-service-engineering/membrane-observability-fault-cases-v0.1.json
            research/water-service-engineering/membrane-observability-fault-oracle-v0.1.json
            research/water-service-engineering/membrane-observability-fault.schema.json
            research/water-service-engineering/membrane-observability-fault-manifest-v0.1.json
            artifacts/membrane-observability-fault-f0/receipt.json
            research/water-service-engineering/MEMBRANE_OBSERVABILITY_FAULT_F1_TRACE_PROTOCOL_V0_1.md
            research/water-service-engineering/membrane-observability-f1-traces-v0.1.json
            research/water-service-engineering/membrane-observability-f1-trace-oracle-v0.1.json
            research/water-service-engineering/membrane-observability-f1-traces.schema.json
            research/water-service-engineering/membrane-observability-f1-trace-manifest-v0.1.json
            artifacts/membrane-observability-f1/receipt.json
            research/water-service-engineering/MEMBRANE_PHYSICAL_GRAPH_F2_PROTOCOL_V0_1.md
            research/water-service-engineering/membrane-physical-process-graph-synthetic-v0.1.json
            research/water-service-engineering/membrane-physical-process-graph.schema.json
            research/water-service-engineering/membrane-physical-graph-ablation-manifest-v0.1.json
            research/water-service-engineering/membrane-physical-graph-f2-manifest-v0.1.json
      - name: Validate membrane observability and sensor-fault F0 contracts
        id: membrane_observability_f0_contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          schema = json.loads((root / "membrane-observability-fault.schema.json").read_text())
          inputs = json.loads((root / "membrane-observability-fault-cases-v0.1.json").read_text())
          oracle = json.loads((root / "membrane-observability-fault-oracle-v0.1.json").read_text())
          manifest = json.loads((root / "membrane-observability-fault-manifest-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(inputs),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"MEMBRANE_OBSERVABILITY_F0_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)

          expected_by_id = {row["scenario_id"]: row for row in oracle["cases"]}
          ids = [row["scenario_id"] for row in inputs["scenarios"]]
          if len(ids) != 13 or len(set(ids)) != 13 or len(expected_by_id) != 13:
              raise SystemExit("MEMBRANE_OBSERVABILITY_F0_CASE_IDENTITY_FAIL")
          if sorted(ids) != sorted(expected_by_id) or manifest["scenario_count"] != 13:
              raise SystemExit("MEMBRANE_OBSERVABILITY_F0_INPUT_ORACLE_MANIFEST_FAIL")
          if any("expected_disposition" in row for row in inputs["scenarios"]):
              raise SystemExit("MEMBRANE_OBSERVABILITY_F0_INPUT_EMBEDS_ORACLE_FAIL")

          t = inputs["baseline_thresholds"]
          def classify(i):
              sensor_fault = (
                  i["pressure_sensor_pair_delta_fraction"] > t["pressure_pair_residual_fraction"]
                  or i["flow_sensor_pair_delta_fraction"] > t["flow_pair_residual_fraction"]
                  or abs(i["clock_skew_seconds"]) > t["absolute_clock_skew_seconds"]
                  or i["critical_channel_missing_fraction"] > t["critical_channel_missing_fraction"]
              )
              regime_shift = (
                  abs(i["temperature_delta_c"]) > t["absolute_temperature_shift_c"]
                  or abs(i["feed_conductivity_ratio"] - 1.0) > t["feed_conductivity_ratio_deviation"]
                  or abs(i["pump_speed_ratio"] - 1.0) > t["pump_speed_ratio_deviation"]
              )
              r, u = i["normalized_resistance_ratio"], i["normalized_resistance_relative_uncertainty"]
              observable = r is not None and u is not None and u <= t["maximum_resistance_relative_uncertainty"]
              fouling = observable and r > t["normalized_resistance_ratio"]
              if sensor_fault and (fouling or regime_shift):
                  return "MULTIPLE_CAUSES"
              if sensor_fault:
                  return "SENSOR_FAULT_SUSPECTED"
              if fouling and regime_shift:
                  return "MULTIPLE_CAUSES"
              if fouling:
                  return "FOULING_SUSPECTED"
              if regime_shift:
                  return "OPERATING_REGIME_SHIFT"
              if not observable:
                  return "INDETERMINATE"
              return "NO_FAULT"

          false_sensor_fouling = 0
          false_regime_fouling = 0
          for case in inputs["scenarios"]:
              scenario_id = case["scenario_id"]
              expected = expected_by_id[scenario_id]
              actual = classify(case["inputs"])
              if actual != expected["expected_disposition"]:
                  raise SystemExit(
                      f"MEMBRANE_OBSERVABILITY_F0_ORACLE_MISMATCH: {scenario_id}: "
                      f"{actual} != {expected['expected_disposition']}"
                  )
              if expected["expected_cip_recommendation"] is not False:
                  raise SystemExit("MEMBRANE_OBSERVABILITY_F0_CIP_ORACLE_MUST_BE_FALSE")
              if expected["expected_disposition"] == "SENSOR_FAULT_SUSPECTED" and actual == "FOULING_SUSPECTED":
                  false_sensor_fouling += 1
              if expected["expected_disposition"] == "OPERATING_REGIME_SHIFT" and actual == "FOULING_SUSPECTED":
                  false_regime_fouling += 1
          if false_sensor_fouling != 0 or false_regime_fouling != 0:
              raise SystemExit("MEMBRANE_OBSERVABILITY_F0_NEGATIVE_CONTROL_FAIL")
          print("MEMBRANE_OBSERVABILITY_F0_PASS: 13 synthetic matched/negative-control cases; no false fouling or CIP recommendation")
          PY
      - name: Evaluate membrane observability F0 at exact revision
        id: membrane_observability_f0
        env:
          MEMBRANE_OBSERVABILITY_F0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin membrane-observability-fault-f0 -- \
            research/water-service-engineering/membrane-observability-fault-cases-v0.1.json \
            research/water-service-engineering/membrane-observability-fault-oracle-v0.1.json \
            research/water-service-engineering/membrane-observability-fault.schema.json \
            research/water-service-engineering/membrane-observability-fault-manifest-v0.1.json \
            artifacts/membrane-observability-fault-f0/receipt.json
      - name: Validate time-indexed membrane observability F1 traces
        id: membrane_observability_f1_contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          schema = json.loads((root / "membrane-observability-f1-traces.schema.json").read_text())
          inputs = json.loads((root / "membrane-observability-f1-traces-v0.1.json").read_text())
          oracle = json.loads((root / "membrane-observability-f1-trace-oracle-v0.1.json").read_text())
          manifest = json.loads((root / "membrane-observability-f1-trace-manifest-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(inputs),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"MEMBRANE_OBSERVABILITY_F1_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)

          expected_by_id = {trace["trace_id"]: trace for trace in oracle["traces"]}
          ids = [trace["trace_id"] for trace in inputs["traces"]]
          if len(ids) != 9 or len(set(ids)) != 9 or len(expected_by_id) != 9:
              raise SystemExit("MEMBRANE_OBSERVABILITY_F1_TRACE_IDENTITY_FAIL")
          if sorted(ids) != sorted(expected_by_id) or manifest["trace_count"] != 9:
              raise SystemExit("MEMBRANE_OBSERVABILITY_F1_INPUT_ORACLE_MANIFEST_FAIL")
          thresholds = inputs["baseline_thresholds"]

          def classify(i):
              sensor = (
                  i["pressure_sensor_pair_delta_fraction"] > thresholds["pressure_pair_residual_fraction"]
                  or i["flow_sensor_pair_delta_fraction"] > thresholds["flow_pair_residual_fraction"]
                  or abs(i["clock_skew_seconds"]) > thresholds["absolute_clock_skew_seconds"]
                  or i["critical_channel_missing_fraction"] > thresholds["critical_channel_missing_fraction"]
              )
              regime = (
                  abs(i["temperature_delta_c"]) > thresholds["absolute_temperature_shift_c"]
                  or abs(i["feed_conductivity_ratio"] - 1.0) > thresholds["feed_conductivity_ratio_deviation"]
                  or abs(i["pump_speed_ratio"] - 1.0) > thresholds["pump_speed_ratio_deviation"]
              )
              resistance, uncertainty = i["normalized_resistance_ratio"], i["normalized_resistance_relative_uncertainty"]
              observable = resistance is not None and uncertainty is not None and uncertainty <= thresholds["maximum_resistance_relative_uncertainty"]
              fouling = observable and resistance > thresholds["normalized_resistance_ratio"]
              if sensor and (fouling or regime):
                  return "MULTIPLE_CAUSES"
              if sensor:
                  return "SENSOR_FAULT_SUSPECTED"
              if fouling and regime:
                  return "MULTIPLE_CAUSES"
              if fouling:
                  return "FOULING_SUSPECTED"
              if regime:
                  return "OPERATING_REGIME_SHIFT"
              if not observable:
                  return "INDETERMINATE"
              return "NO_FAULT"

          windows = 0
          false_sensor, false_regime, false_stable, false_cip = 0, 0, 0, 0
          delays = []
          for trace in inputs["traces"]:
              expected = expected_by_id[trace["trace_id"]]
              if len(trace["steps"]) != 8 or len(expected["expected_dispositions"]) != 8 or len(expected["expected_cip_recommendations"]) != 8:
                  raise SystemExit(f"MEMBRANE_OBSERVABILITY_F1_STEP_COUNT_FAIL: {trace['trace_id']}")
              actual_dispositions = []
              for index, step in enumerate(trace["steps"]):
                  if step["time_index"] != index or step["elapsed_minutes"] != index * 5:
                      raise SystemExit(f"MEMBRANE_OBSERVABILITY_F1_TIME_INDEX_FAIL: {trace['trace_id']}")
                  actual = classify(step["inputs"])
                  actual_dispositions.append(actual)
                  target = expected["expected_dispositions"][index]
                  if target["time_index"] != index or actual != target["expected_disposition"]:
                      raise SystemExit(f"MEMBRANE_OBSERVABILITY_F1_ORACLE_MISMATCH: {trace['trace_id']} step {index}")
                  if expected["expected_cip_recommendations"][index] is not False:
                      raise SystemExit("MEMBRANE_OBSERVABILITY_F1_CIP_ORACLE_MUST_BE_FALSE")
                  if actual in ("FOULING_SUSPECTED", "MULTIPLE_CAUSES"):
                      if trace["event_class"] == "SENSOR_ONLY":
                          false_sensor += 1
                      elif trace["event_class"] == "REGIME_ONLY":
                          false_regime += 1
                      elif trace["event_class"] == "NONE":
                          false_stable += 1
                  windows += 1
              positive = trace["event_class"] in ("FOULING", "FOULING_AND_SENSOR")
              detected = None
              if positive:
                  onset = trace["event_onset_step_index"]
                  detected = next(
                      (index for index, disposition in enumerate(actual_dispositions)
                       if index >= onset and disposition in ("FOULING_SUSPECTED", "MULTIPLE_CAUSES")),
                      None,
                  )
                  if detected is not None:
                      delays.append(detected - onset)
              if detected != expected["expected_detected_step_index"]:
                  raise SystemExit(f"MEMBRANE_OBSERVABILITY_F1_DETECTION_INDEX_FAIL: {trace['trace_id']}")

          if windows != 72 or false_sensor or false_regime or false_stable or false_cip:
              raise SystemExit("MEMBRANE_OBSERVABILITY_F1_NEGATIVE_CONTROL_OR_COUNT_FAIL")
          if len(delays) != 2 or any(delay != 0 for delay in delays):
              raise SystemExit("MEMBRANE_OBSERVABILITY_F1_SYNTHETIC_EVENT_DELAY_FAIL")
          print("MEMBRANE_OBSERVABILITY_F1_PASS: 9 traces / 72 windows; 2 synthetic fouling events detected at declared onset; zero false fouling/CIP on negative controls")
          PY
      - name: Evaluate membrane observability F1 traces at exact revision
        id: membrane_observability_f1
        env:
          MEMBRANE_OBSERVABILITY_F1_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin membrane-observability-f1 -- \
            research/water-service-engineering/membrane-observability-f1-traces-v0.1.json \
            research/water-service-engineering/membrane-observability-f1-trace-oracle-v0.1.json \
            research/water-service-engineering/membrane-observability-f1-traces.schema.json \
            research/water-service-engineering/membrane-observability-f1-trace-manifest-v0.1.json \
            artifacts/membrane-observability-f1/receipt.json
      - name: Validate membrane physical graph F2 topology and provenance
        id: membrane_physical_graph_f2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          schema = json.loads((root / "membrane-physical-process-graph.schema.json").read_text())
          graph = json.loads((root / "membrane-physical-process-graph-synthetic-v0.1.json").read_text())
          manifest = json.loads((root / "membrane-physical-graph-f2-manifest-v0.1.json").read_text())
          ablation = json.loads((root / "membrane-physical-graph-ablation-manifest-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(graph),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"MEMBRANE_PHYSICAL_GRAPH_F2_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)

          node_ids = [node["node_id"] for node in graph["nodes"]]
          edge_ids = [edge["edge_id"] for edge in graph["edges"]]
          if len(node_ids) != 13 or len(set(node_ids)) != 13:
              raise SystemExit("MEMBRANE_PHYSICAL_GRAPH_F2_NODE_IDENTITY_FAIL")
          if len(edge_ids) != 12 or len(set(edge_ids)) != 12:
              raise SystemExit("MEMBRANE_PHYSICAL_GRAPH_F2_EDGE_IDENTITY_FAIL")
          known_nodes = set(node_ids)
          for edge in graph["edges"]:
              if edge["source"] not in known_nodes or edge["target"] not in known_nodes:
                  raise SystemExit(f"MEMBRANE_PHYSICAL_GRAPH_F2_UNKNOWN_EDGE_NODE: {edge['edge_id']}")
              if edge["source"] == edge["target"]:
                  raise SystemExit(f"MEMBRANE_PHYSICAL_GRAPH_F2_SELF_EDGE: {edge['edge_id']}")
              if edge["lag_min_seconds"] > edge["lag_max_seconds"]:
                  raise SystemExit(f"MEMBRANE_PHYSICAL_GRAPH_F2_INVALID_LAG: {edge['edge_id']}")
              if graph["evidence_class"] == "synthetic_physical_topology_fixture" and not edge["evidence_class"].startswith("synthetic_"):
                  raise SystemExit("MEMBRANE_PHYSICAL_GRAPH_F2_SYNTHETIC_PROVENANCE_MISMATCH")
              if not edge["provenance"]:
                  raise SystemExit(f"MEMBRANE_PHYSICAL_GRAPH_F2_MISSING_PROVENANCE: {edge['edge_id']}")
          if manifest["benchmark_id"] != "MEMBRANE-PHYSICAL-GRAPH-F2-001":
              raise SystemExit("MEMBRANE_PHYSICAL_GRAPH_F2_MANIFEST_ID_FAIL")
          if manifest["status"] != "synthetic_topology_contract_only":
              raise SystemExit("MEMBRANE_PHYSICAL_GRAPH_F2_EVIDENCE_CEILING_FAIL")
          if len(ablation["variants"]) != 6 or len(ablation["perturbations"]) != 7:
              raise SystemExit("MEMBRANE_PHYSICAL_GRAPH_F2_ABLATION_MATRIX_FAIL")
          if any("physical" in edge["evidence_class"] and edge["provenance"] == "P&ID" for edge in graph["edges"]):
              raise SystemExit("MEMBRANE_PHYSICAL_GRAPH_F2_FAKE_PLANT_PROVENANCE_FAIL")
          print("MEMBRANE_PHYSICAL_GRAPH_F2_PASS: 13 nodes / 12 signed lag-aware synthetic edges; provenance and ablation contract validated")
          PY
