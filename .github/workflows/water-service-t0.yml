name: Water service T0 evaluator

on:
  push:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  pull_request:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - ".github/workflows/water-service-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-service-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --package water-service-t0 -- --check
      - name: Run locked unit and frozen-oracle tests
        run: cargo test --locked --package water-service-t0
      - name: Run strict Clippy
        run: cargo clippy --locked --package water-service-t0 --all-targets -- -D warnings
      - name: Evaluate exact checked-out revision
        id: evaluate
        env:
          WATER_SERVICE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 -- \
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json \
            research/water-service-engineering/benchmark-manifest-v0.1.json \
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json \
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json \
            artifacts/water-service-t0/receipt.json
      - name: Set up pinned Python for filter T1 flow-profile validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Validate filter T1 cell profiles and flow arithmetic
        id: filter_t1_cell
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/water-service-engineering")
          schema = json.loads((root / "filter-t1-cell-flow.schema.json").read_text())
          inputs = json.loads((root / "filter-t1-cell-flow-profiles-v0.1.json").read_text())
          oracle = json.loads((root / "filter-t1-cell-flow-oracle-v0.1.json").read_text())
          manifest = json.loads((root / "filter-t1-cell-manifest-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(inputs),
              key=lambda error: (list(map(str, error.absolute_path)), error.message),
          )
          if errors:
              for error in errors:
                  pointer = "/" + "/".join(map(str, error.absolute_path))
                  print(f"FILTER_T1_SCHEMA_FAIL: {pointer}: {error.message}")
              raise SystemExit(1)

          ids = [row["case_id"] for row in inputs["cases"]]
          expected = {row["case_id"]: row["expected"] for row in oracle["results"]}
          if len(ids) != 4 or len(set(ids)) != 4 or len(expected) != 4:
              raise SystemExit("FILTER_T1_CASE_IDENTITY_FAIL")
          if sorted(ids) != sorted(expected) or manifest["case_count"] != 4:
              raise SystemExit("FILTER_T1_INPUT_ORACLE_MANIFEST_MISMATCH")
          if inputs["pump_t1_reference"]["flow_l_min"] != [12.0, 60.0]:
              raise SystemExit("FILTER_T1_PUMP_REFERENCE_DRIFT")

          def close(actual, target):
              return math.isclose(actual, target, rel_tol=1e-9, abs_tol=1e-12)

          for case in inputs["cases"]:
              q = case["inputs"]["flow_l_min"] / 60000.0
              diameter = case["inputs"]["actual_id_mm"] / 1000.0
              area = math.pi * diameter * diameter / 4.0
              actual = {
                  "flow_m3_s": q,
                  "mean_velocity_m_s": q / area,
                  "community_pump_compatible": 12.0 <= case["inputs"]["flow_l_min"] <= 60.0,
              }
              target = expected[case["case_id"]]
              for key, value in actual.items():
                  if isinstance(value, float):
                      if not close(value, target[key]):
                          raise SystemExit(f"FILTER_T1_ARITHMETIC_MISMATCH: {case['case_id']} {key}")
                  elif value != target[key]:
                      raise SystemExit(f"FILTER_T1_COMPATIBILITY_MISMATCH: {case['case_id']} {key}")

          household = next(x for x in inputs["profiles"] if x["profile_id"] == "FILTER-HOUSEHOLD-POU")
          community = next(x for x in inputs["profiles"] if x["profile_id"] == "FILTER-COMMUNITY-MODULAR")
          if household["flow_l_min"][1] >= inputs["pump_t1_reference"]["flow_l_min"][0]:
              raise SystemExit("FILTER_T1_HOUSEHOLD_PUMP_NONOVERLAP_GUARD_FAIL")
          if not community["pump_t1_compatible"]:
              raise SystemExit("FILTER_T1_COMMUNITY_PUMP_COMPATIBILITY_FAIL")
          if oracle["fixed_checks"]["household_pump_overlap_l_min"] != 0.0:
              raise SystemExit("FILTER_T1_ORACLE_OVERLAP_FAIL")
          print("FILTER_T1_CELL_PASS: 4 sizing cases; household loop is disjoint from pump T1, community loop overlaps")
          PY
      - name: Upload exact inputs, manifests, oracle and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-service-t0-exact-head-evidence
          path: |
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json
            research/water-service-engineering/benchmark-manifest-v0.1.json
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json
            artifacts/water-service-t0/receipt.json
            research/water-service-engineering/FILTER_T1_CELL_DESIGN_BASIS_V0_1.md
            research/water-service-engineering/filter-t1-cell-flow-profiles-v0.1.json
            research/water-service-engineering/filter-t1-cell-flow-oracle-v0.1.json
            research/water-service-engineering/filter-t1-cell-flow.schema.json
            research/water-service-engineering/filter-t1-cell-manifest-v0.1.json
          if-no-files-found: warn
      - name: Require an exact successful evaluator receipt
        if: always()
        env:
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          FILTER_T1_CELL_OUTCOME: ${{ steps.filter_t1_cell.outcome }}
        run: |
          test "$EVALUATE_OUTCOME" = "success"
          test "$FILTER_T1_CELL_OUTCOME" = "success"
