name: Water service T0 evaluator

on:
  push:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - "research/distribution-intrusion-transient/**"
      - "research/water-intrusion-coupling/**"
      - ".github/workflows/water-service-t0.yml"
  pull_request:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - "research/distribution-intrusion-transient/**"
      - "research/water-intrusion-coupling/**"
      - ".github/workflows/water-service-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-service-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --package water-service-t0 -- --check
      - name: Run locked unit and frozen-oracle tests
        run: cargo test --locked --package water-service-t0
      - name: Run strict Clippy
        run: cargo clippy --locked --package water-service-t0 --all-targets -- -D warnings
      - name: Evaluate exact checked-out revision
        id: evaluate
        env:
          WATER_SERVICE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 -- \
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json \
            research/water-service-engineering/benchmark-manifest-v0.1.json \
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json \
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json \
            artifacts/water-service-t0/receipt.json
      - name: Evaluate distribution intrusion T0 exact checked-out revision
        id: intrusion
        env:
          DISTRIBUTION_INTRUSION_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin intrusion-t0 -- \
            research/distribution-intrusion-transient/intrusion-t0-scenarios-v0.1.json \
            research/distribution-intrusion-transient/intrusion-t0-oracle-v0.1.json \
            research/distribution-intrusion-transient/manifest-v0.1.json \
            artifacts/distribution-intrusion-t0/receipt.json
      - name: Evaluate intrusion model-coupling T0 exact checked-out revision
        id: coupling
        env:
          WATER_INTRUSION_COUPLING_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin intrusion-coupling-t0 -- \
            research/water-intrusion-coupling/coupling-t0-cases-v0.1.json \
            research/water-intrusion-coupling/coupling-t0-oracle-v0.1.json \
            research/water-intrusion-coupling/model-coupling-interface-contract-v0.1.json \
            research/water-intrusion-coupling/manifest-v0.1.json \
            artifacts/water-intrusion-coupling-t0/receipt.json
      - name: Evaluate chemical-fate analytical T0 exact checked-out revision
        id: chemical_fate
        env:
          WATER_CHEMICAL_FATE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin chemical-fate-t0 -- \
            research/water-intrusion-coupling/chemical-fate-t0-cases-v0.1.json \
            research/water-intrusion-coupling/chemical-fate-t0-oracle-v0.1.json \
            research/water-intrusion-coupling/manifest-v0.1.json \
            artifacts/water-chemical-fate-t0/receipt.json
      - name: Evaluate non-ideal mixing fidelity T0 exact checked-out revision
        id: mixing_fidelity
        env:
          WATER_MIXING_FIDELITY_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin mixing-fidelity-t0 -- \
            research/water-intrusion-coupling/mixing-fidelity-t0-cases-v0.1.json \
            research/water-intrusion-coupling/mixing-fidelity-t0-oracle-v0.1.json \
            research/water-intrusion-coupling/mixing-fidelity-manifest-v0.1.json \
            artifacts/water-mixing-fidelity-t0/receipt.json
      - name: Upload exact inputs, manifests, oracle and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-service-t0-exact-head-evidence
          path: |
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json
            research/water-service-engineering/benchmark-manifest-v0.1.json
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json
            research/distribution-intrusion-transient/intrusion-t0-scenarios-v0.1.json
            research/distribution-intrusion-transient/intrusion-t0-oracle-v0.1.json
            research/distribution-intrusion-transient/manifest-v0.1.json
            research/distribution-intrusion-transient/REVERSE_FLOW_BOUNDARY_T0_V0_1.md
            research/water-intrusion-coupling/COUPLING_QUAL_V0_1.md
            research/water-intrusion-coupling/coupling-t0-cases-v0.1.json
            research/water-intrusion-coupling/coupling-t0-oracle-v0.1.json
            research/water-intrusion-coupling/model-coupling-interface-contract-v0.1.json
            research/water-intrusion-coupling/manifest-v0.1.json
            research/water-intrusion-coupling/CHEMICAL_FATE_BENCHMARK_PROTOCOL_V0_1.md
            research/water-intrusion-coupling/chemical-fate-comparator-register-v0.1.json
            research/water-intrusion-coupling/chemical-fate-t0-cases-v0.1.json
            research/water-intrusion-coupling/chemical-fate-t0-oracle-v0.1.json
            artifacts/water-service-t0/receipt.json
            artifacts/distribution-intrusion-t0/receipt.json
            artifacts/water-chemical-fate-t0/receipt.json
          if-no-files-found: warn
      - name: Require an exact successful evaluator receipt
        if: always()
        env:
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          INTRUSION_OUTCOME: ${{ steps.intrusion.outcome }}
          COUPLING_OUTCOME: ${{ steps.coupling.outcome }}
          CHEMICAL_FATE_OUTCOME: ${{ steps.chemical_fate.outcome }}
          MIXING_FIDELITY_OUTCOME: ${{ steps.mixing_fidelity.outcome }}
        run: |
          test "$EVALUATE_OUTCOME" = "success"
          test "$INTRUSION_OUTCOME" = "success"
          test "$COUPLING_OUTCOME" = "success"
          test "$CHEMICAL_FATE_OUTCOME" = "success"
          test "$MIXING_FIDELITY_OUTCOME" = "success"
