name: Water service T0 evaluator

on:
  push:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - "docs/research/jw-water-cascade/**"
      - "docs/research/jw-water-intake-t1/**"
      - ".github/workflows/water-service-t0.yml"
  pull_request:
    paths:
      - "tools/water-service-t0/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "research/water-service-engineering/**"
      - "docs/research/jw-water-cascade/**"
      - ".github/workflows/water-service-t0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-service-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --package water-service-t0 -- --check
      - name: Run locked unit and frozen-oracle tests
        run: cargo test --locked --package water-service-t0
      - name: Run strict Clippy
        run: cargo clippy --locked --package water-service-t0 --all-targets -- -D warnings
      - name: Evaluate exact checked-out revision
        id: evaluate
        env:
          WATER_SERVICE_T0_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin water-service-t0 -- \
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json \
            research/water-service-engineering/benchmark-manifest-v0.1.json \
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json \
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json \
            artifacts/water-service-t0/receipt.json
      - name: Evaluate Johannesburg water cascade T0
        id: evaluate_cascade
        env:
          JW_WATER_CASCADE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin jw-water-cascade-t0 -- \
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.schema.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.schema.v0.1.json \
            docs/research/jw-water-cascade/jw_water_cascade_t0_source_manifest.v0.1.json \
            artifacts/water-service-t0/jw-water-cascade-t0-receipt.json
      - name: Verify Watersearch T1 capture envelope (synthetic fixture)
        id: verify_intake_t1
        env:
          JW_WATER_INTAKE_T1_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked --package water-service-t0 --bin jw-water-intake-t1 -- \
            docs/research/jw-water-intake-t1/watersearch_suburb_history.synthetic.v0.1.json \
            docs/research/jw-water-intake-t1/response_headers.synthetic.v0.1.txt \
            docs/research/jw-water-intake-t1/capture_manifest.synthetic.v0.1.json \
            docs/research/jw-water-intake-t1/watersearch_suburb_history_response.schema.v0.1.json \
            artifacts/water-service-t0/jw-water-intake-t1-receipt.json
      - name: Upload exact inputs, manifests, oracle and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-service-t0-exact-head-evidence
          path: |
            research/water-service-engineering/t0-known-answer-vectors-v0.1.json
            research/water-service-engineering/benchmark-manifest-v0.1.json
            research/water-service-engineering/network-diagnostics-manifest-v0.1.json
            research/water-service-engineering/t0-known-answer-oracle-v0.1.json
            artifacts/water-service-t0/receipt.json
            docs/research/jw-water-cascade/JW_WATER_CASCADE_T0_PROTOCOL_V0_1.md
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_input.schema.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_oracle.schema.v0.1.json
            docs/research/jw-water-cascade/jw_water_cascade_t0_source_manifest.v0.1.json
            artifacts/water-service-t0/jw-water-cascade-t0-receipt.json
            docs/research/jw-water-intake-t1/JW_WATERSEARCH_T1_INTAKE_PROTOCOL_V0_1.md
            docs/research/jw-water-intake-t1/watersearch_suburb_history.synthetic.v0.1.json
            docs/research/jw-water-intake-t1/response_headers.synthetic.v0.1.txt
            docs/research/jw-water-intake-t1/capture_manifest.synthetic.v0.1.json
            docs/research/jw-water-intake-t1/watersearch_suburb_history_response.schema.v0.1.json
            docs/research/jw-water-intake-t1/capture_manifest.schema.v0.1.json
            artifacts/water-service-t0/jw-water-intake-t1-receipt.json
          if-no-files-found: warn
      - name: Require an exact successful evaluator receipt
        if: always()
        env:
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          CASCADE_OUTCOME: ${{ steps.evaluate_cascade.outcome }}
          INTAKE_OUTCOME: ${{ steps.verify_intake_t1.outcome }}
        run: |
          test "$EVALUATE_OUTCOME" = "success"
          test "$CASCADE_OUTCOME" = "success"
          test "$INTAKE_OUTCOME" = "success"
