name: Durable Fabrication Plan DAG Runner

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: durable-fabrication-plan-dag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Apply and prove durable F10 DAG invariants
    runs-on: macos-latest
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@v4
        with:
          ref: fabrication/durable-plan-dag
          path: product

      - name: Check out qualifier tools
        uses: actions/checkout@v4
        with:
          ref: fabrication/durable-plan-dag-runner
          path: runner-tools
          persist-credentials: false

      - name: Set up Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Prove exact qualified parent
        shell: bash
        run: |
          cd product
          test "$(git rev-parse HEAD)" = "f323d7d2b9bdb9e923835fd24e4f499942a8fdd1"
          test -z "$(git status --porcelain)"
          cargo check --locked -p symtropy-fabrication --lib
          cargo test --locked -p symtropy-fabrication --lib
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings

      - name: Apply durable F10 DAG transformation
        shell: bash
        run: |
          cd product
          python ../runner-tools/.github/repair/durable_plan_dag.py

      - name: Canonicalize changed Fabrication source
        shell: bash
        run: |
          cd product
          cargo fmt -p symtropy-fabrication

      - name: Verify exact semantic source scope
        shell: bash
        run: |
          cd product
          expected=$(cat <<'EOF'
          crates/domains/symtropy-fabrication/src/executable_plan.rs
          crates/domains/symtropy-fabrication/src/plan.rs
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$(printf '%s\n' "$actual")" = "$(printf '%s\n' "$expected" | sort)"
          printf '%s\n' "$actual"

      - name: Prove F10 owns durable graph validation
        shell: bash
        run: |
          cd product
          grep -q 'struct PlanStepWire' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'struct PlanDependencyWire' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'struct FabricationPlanWire' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'dependency.validate_current()?' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'deserialization_rejects_nested_cyclic_f10_plan' crates/domains/symtropy-fabrication/src/executable_plan.rs
          grep -q 'deserialization_rejects_nested_f10_unknown_dependency_step' crates/domains/symtropy-fabrication/src/executable_plan.rs

      - name: Run locked Fabrication unit tests
        shell: bash
        run: |
          cd product
          cargo test --locked -p symtropy-fabrication --lib

      - name: Run strict Rust 1.96 Fabrication Clippy
        shell: bash
        run: |
          cd product
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings

      - name: Check exact Construction consumer
        shell: bash
        run: |
          cd product
          cargo check --locked -p symtropy-construction --lib

      - name: Check Firstlight Patch Conduit consumer
        shell: bash
        run: |
          cd product
          cargo check --locked -p symtropy-firstlight

      - name: Prove lock and manifests stayed fixed
        shell: bash
        run: |
          cd product
          git diff --exit-code -- Cargo.lock Cargo.toml crates/domains/symtropy-fabrication/Cargo.toml crates/domains/symtropy-construction/Cargo.toml crates/apps/symtropy-firstlight/Cargo.toml

      - name: Commit semantic source only
        shell: bash
        run: |
          cd product
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/domains/symtropy-fabrication/src/plan.rs \
            crates/domains/symtropy-fabrication/src/executable_plan.rs
          test -z "$(git diff --name-only)"
          git commit -m "fix(fabrication): make F10 plan DAG invariants durable"

      - name: Push exact qualified product head
        shell: bash
        run: |
          cd product
          git push origin HEAD:fabrication/durable-plan-dag
