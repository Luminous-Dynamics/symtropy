name: Durable Fabrication Plan DAG Runner

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: durable-fabrication-plan-dag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Apply and prove durable F10 DAG invariants
    runs-on: macos-15
    steps:
      # actions/checkout v4 resolved and frozen at review time.
      - name: Check out exact product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fabrication/durable-plan-dag
          path: product
          fetch-depth: 0

      - name: Check out exact qualifier tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact qualification subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "f323d7d2b9bdb9e923835fd24e4f499942a8fdd1"
          test "$(git -C runner-tools rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C product status --porcelain --untracked-files=all)"
          test -z "$(git -C runner-tools status --porcelain --untracked-files=all)"
          echo "F10_PARENT_HEAD=$(git -C product rev-parse HEAD)"
          echo "F10_PARENT_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "F10_QUALIFIER_HEAD=$(git -C runner-tools rev-parse HEAD)"
          echo "F10_TRANSFORM_BLOB=$(git -C runner-tools hash-object .github/repair/durable_plan_dag.py)"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "IMAGE_OS=${ImageOS:-unknown}"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}"
          uname -a
          git --version

      # dtolnay/rust-toolchain stable branch resolved and frozen at review time.
      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Prove exact qualified parent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check --locked -p symtropy-fabrication --lib
          cargo test --locked -p symtropy-fabrication --lib
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Bind locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test -s Cargo.lock
          git ls-files --error-unmatch Cargo.lock >/dev/null
          cargo metadata --locked --format-version 1 > /tmp/f10-cargo-metadata.json
          echo "F10_LOCK_BLOB=$(git hash-object Cargo.lock)"
          echo "F10_LOCK_SHA256=$(shasum -a 256 Cargo.lock | awk '{print $1}')"
          echo "F10_METADATA_SHA256=$(shasum -a 256 /tmp/f10-cargo-metadata.json | awk '{print $1}')"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply durable F10 DAG transformation
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/durable_plan_dag.py

      - name: Canonicalize changed Fabrication source
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-fabrication

      - name: Verify exact semantic source scope
        shell: bash
        run: |
          set -euo pipefail
          cd product
          expected=$(cat <<'EOF'
          crates/domains/symtropy-fabrication/src/executable_plan.rs
          crates/domains/symtropy-fabrication/src/plan.rs
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$(printf '%s\n' "$actual")" = "$(printf '%s\n' "$expected" | sort)"
          printf '%s\n' "$actual"

      - name: Prove F10 owns durable graph validation
        shell: bash
        run: |
          set -euo pipefail
          cd product
          grep -q 'struct PlanStepWire' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'struct PlanDependencyWire' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'struct FabricationPlanWire' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'dependency.validate_current()?' crates/domains/symtropy-fabrication/src/plan.rs
          grep -q 'deserialization_rejects_nested_cyclic_f10_plan' crates/domains/symtropy-fabrication/src/executable_plan.rs
          grep -q 'deserialization_rejects_nested_f10_unknown_dependency_step' crates/domains/symtropy-fabrication/src/executable_plan.rs

      - name: Run locked Fabrication unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo test --locked -p symtropy-fabrication --lib

      - name: Run strict Rust 1.96 Fabrication Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings

      - name: Check exact Construction consumer
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check --locked -p symtropy-construction --lib

      - name: Check Firstlight Patch Conduit consumer
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check --locked -p symtropy-firstlight

      - name: Prove lock and manifests stayed fixed
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git diff --exit-code -- Cargo.lock Cargo.toml crates/domains/symtropy-fabrication/Cargo.toml crates/domains/symtropy-construction/Cargo.toml crates/apps/symtropy-firstlight/Cargo.toml

      - name: Commit exact semantic source only
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/domains/symtropy-fabrication/src/plan.rs \
            crates/domains/symtropy-fabrication/src/executable_plan.rs
          expected=$(cat <<'EOF'
          crates/domains/symtropy-fabrication/src/executable_plan.rs
          crates/domains/symtropy-fabrication/src/plan.rs
          EOF
          )
          staged=$(git diff --cached --name-only | sort)
          test "$(printf '%s\n' "$staged")" = "$(printf '%s\n' "$expected" | sort)"
          test -z "$(git diff --name-only)"
          git commit -m "fix(fabrication): make F10 plan DAG invariants durable"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "F10_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo "F10_PRODUCT_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse product-branch race and push exact qualified head
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin refs/heads/fabrication/durable-plan-dag | awk '{print $1}')"
          test "${remote_head}" = "f323d7d2b9bdb9e923835fd24e4f499942a8fdd1"
          git push origin HEAD:fabrication/durable-plan-dag
