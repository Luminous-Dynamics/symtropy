name: AeroWeft Sensor Temporal Evidence Oracle

on:
  pull_request:
    paths:
      - "tools/aeroweift-sensor-time-evidence/**"
      - "docs/research/aviation/AEROWEFT_MULTISENSOR_TEMPORAL_EVIDENCE_001.md"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - "fixtures/aeroweift-sensor-time-evidence/**"
      - ".github/workflows/aeroweift-sensor-time-evidence-oracle.yml"
  push:
    branches:
      - "research/aeroweFt-multisensor-temporal-evidence-001"
    paths:
      - "tools/aeroweift-sensor-time-evidence/**"
      - "docs/research/aviation/AEROWEFT_MULTISENSOR_TEMPORAL_EVIDENCE_001.md"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - "fixtures/aeroweift-sensor-time-evidence/**"
      - ".github/workflows/aeroweift-sensor-time-evidence-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeroweift-sensor-time-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/aeroweift-sensor-time-evidence/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/aeroweift-sensor-time-evidence/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/aeroweift-sensor-time-evidence/Cargo.toml --all-targets
