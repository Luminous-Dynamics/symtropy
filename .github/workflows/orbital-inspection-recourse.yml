name: Orbital Inspection Recourse Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-inspection-recourse-bench/**"
      - "docs/research/orbital-truss/fixtures/inspection-recourse-v0_1.json"
      - "docs/research/orbital-truss/orbital_inspection_recourse_corpus_v0_1.schema.json"
      - "docs/research/orbital-truss/orbital_inspection_recourse_v0_1.md"
      - ".github/workflows/orbital-inspection-recourse.yml"
  push:
    branches:
      - "research/orbital-inspection-recourse-v0-1"
    paths:
      - "tools/orbital-inspection-recourse-bench/**"
      - "docs/research/orbital-truss/fixtures/inspection-recourse-v0_1.json"
      - "docs/research/orbital-truss/orbital_inspection_recourse_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-inspection-recourse.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Exact contingent policies and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and Draft 2020-12 schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/inspection-recourse-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_inspection_recourse_corpus_v0_1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert len(fixture["cases"]) == 8
          assert len({case["case_id"] for case in fixture["cases"]}) == 8
          print("8 frozen inspection-recourse cases and Draft 2020-12 schema validated")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-inspection-recourse-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-inspection-recourse-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-inspection-recourse-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-inspection-recourse-bench/Cargo.toml --bin orbital-inspection-recourse-bench -- docs/research/orbital-truss/fixtures/inspection-recourse-v0_1.json "$GITHUB_SHA" > /tmp/recourse-rust-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-inspection-recourse-bench/Cargo.toml --bin orbital-inspection-recourse-bench -- docs/research/orbital-truss/fixtures/inspection-recourse-v0_1.json "$GITHUB_SHA" > /tmp/recourse-rust-b.json
          cmp /tmp/recourse-rust-a.json /tmp/recourse-rust-b.json
      - name: Independent Python oracle
        run: |
          python3 tools/orbital-inspection-recourse-bench/tests/reference_oracle.py docs/research/orbital-truss/fixtures/inspection-recourse-v0_1.json "$GITHUB_SHA" > /tmp/recourse-python.json
      - name: Compare complete Rust and Python receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/recourse-rust-a.json").read_text())
          oracle = json.loads(Path("/tmp/recourse-python.json").read_text())
          assert rust == oracle
          assert rust["expected_outcome_matches"] == 8
          assert rust["expected_outcome_mismatches"] == 0
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert cases["IR-002-CONTINGENT-TREE"]["policy"]["root"]["action_id"] == "VIEW-1"
          assert cases["IR-003-SAME-DECISION"]["policy"]["objective"]["worst_case_action_count"] == 0
          assert cases["IR-004-UNKNOWN-GATE"]["status"] == "ABSTAIN"
          assert cases["IR-006-SEARCH-CAP"]["status"] == "SEARCH_LIMIT_NOT_PROVEN"
          print("Rust and independent Python oracle agree on all 8 policy cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-inspection-recourse-evidence
          path: |
            /tmp/recourse-rust-a.json
            /tmp/recourse-python.json
            docs/research/orbital-truss/fixtures/inspection-recourse-v0_1.json
            docs/research/orbital-truss/orbital_inspection_recourse_corpus_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
