name: resource-normalized-driving-evaluator

on:
  pull_request:
    paths:
      - "research/resource-normalized-driving-capability-001/**"
      - ".github/workflows/resource-normalized-driving-evaluator.yml"
  push:
    paths:
      - "research/resource-normalized-driving-capability-001/**"
      - ".github/workflows/resource-normalized-driving-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Export canonical Rust 1.96 rustfmt output (format bootstrap)
        run: |
          files=(
            research/resource-normalized-driving-capability-001/evaluator/src/lib.rs
            research/resource-normalized-driving-capability-001/evaluator/src/main.rs
          )
          rustfmt --edition 2024 "${files[@]}"
          export_formatted() {
            name="$1"
            file="$2"
            echo "__FORMAT_EXPORT_BEGIN_${name}__"
            base64 -w0 "$file" | fold -w 4000
            echo "__FORMAT_EXPORT_END_${name}__"
          }
          export_formatted FRONTIER_LIB "${files[0]}"
          export_formatted FRONTIER_BIN "${files[1]}"

      - name: Run result-card and Pareto tests
        run: cargo test --locked --manifest-path research/resource-normalized-driving-capability-001/evaluator/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/resource-normalized-driving-capability-001/evaluator/Cargo.toml --all-targets --all-features -- -D warnings

