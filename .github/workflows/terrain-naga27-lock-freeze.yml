name: Terrain Naga 27 Cargo lock freeze

on:
  push:
    branches:
      - ci/terrain-naga27-lock-freeze-v0.1
    paths:
      - .github/workflows/terrain-naga27-lock-freeze.yml

permissions:
  contents: write

concurrency:
  group: terrain-naga27-lock-freeze-v0.1
  cancel-in-progress: false

jobs:
  freeze-lock:
    name: Produce semantically-audited Cargo 1.96 lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact helper subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact product lineage
        shell: bash
        run: |
          set -euo pipefail
          product=5410ba61daad5af56d58f2ad660456a05b176d78
          base=e707113651e302f7c61c5542483104af352cb3d0
          helper=.github/workflows/terrain-naga27-lock-freeze.yml
          manifest=crates/domains/symtropy-terrain/Cargo.toml
          kernel=crates/domains/symtropy-terrain/src/geometry_kernel.rs

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${product}"
          test "$(git rev-parse ${product}^)" = "${base}"
          test "$(git diff --name-only ${product}..HEAD)" = "${helper}"
          test "$(git rev-parse HEAD:${manifest})" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:${kernel})" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          test "$(git rev-parse HEAD:Cargo.lock)" = "$(git rev-parse ${product}:Cargo.lock)"

          echo "TERRAIN_LOCK_HELPER_HEAD=${GITHUB_SHA}"
          echo "TERRAIN_LOCK_PRODUCT_HEAD=${product}"
          echo "TERRAIN_LOCK_INPUT_BLOB=$(git rev-parse HEAD:Cargo.lock)"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/terrain-lock-freeze-target" >> "${GITHUB_ENV}"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind Cargo producer
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          test "$(cargo --version | awk '{print $2}')" = "1.96.0"

      - name: Let Cargo 1.96 refresh the existing lock
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo metadata --format-version 1 > "${RUNNER_TEMP}/terrain-lock-metadata.json"
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.after"
          test -n "$(git status --porcelain -- Cargo.lock)"
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock

      - name: Prove semantic lock delta is edge-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          before = tomllib.loads((root / "Cargo.lock.before").read_text())
          after = tomllib.loads((root / "Cargo.lock.after").read_text())

          def key(pkg):
              return (pkg["name"], pkg["version"], pkg.get("source"))

          before_map = {key(pkg): pkg for pkg in before["package"]}
          after_map = {key(pkg): pkg for pkg in after["package"]}

          if set(before_map) != set(after_map):
              added = sorted(set(after_map) - set(before_map), key=repr)
              removed = sorted(set(before_map) - set(after_map), key=repr)
              raise SystemExit(f"package identity churn: added={added!r} removed={removed!r}")

          changed = [pkg_key for pkg_key in before_map if before_map[pkg_key] != after_map[pkg_key]]
          allowed = [pkg_key for pkg_key in changed if pkg_key[0] == "symtropy-terrain"]
          if len(changed) != 1 or changed != allowed:
              raise SystemExit(f"unexpected lock package mutations: {changed!r}")

          pkg_key = allowed[0]
          old = dict(before_map[pkg_key])
          new = dict(after_map[pkg_key])
          old_deps = old.pop("dependencies", [])
          new_deps = new.pop("dependencies", [])

          if old != new:
              raise SystemExit("symtropy-terrain changed outside dependency edges")

          added_deps = sorted(set(new_deps) - set(old_deps))
          removed_deps = sorted(set(old_deps) - set(new_deps))
          if removed_deps or added_deps != ["naga 27.0.3"]:
              raise SystemExit(
                  f"unexpected Terrain dependency delta: added={added_deps!r} removed={removed_deps!r}"
              )
          if len(new_deps) != len(old_deps) + 1:
              raise SystemExit("Terrain dependency multiplicity changed unexpectedly")

          for pkg_key, old_pkg in before_map.items():
              if pkg_key == allowed[0]:
                  continue
              if old_pkg != after_map[pkg_key]:
                  raise SystemExit(f"non-Terrain package changed: {pkg_key!r}")

          print("TERRAIN_LOCK_SEMANTIC_DELTA=only symtropy-terrain -> naga 27.0.3")
          print(f"TERRAIN_LOCK_PACKAGE_COUNT={len(after_map)}")
          PY

          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/terrain-lock-metadata-locked.json"
          echo "TERRAIN_LOCK_OUTPUT_BLOB=$(git hash-object Cargo.lock)"
          echo "TERRAIN_LOCK_OUTPUT_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          echo "TERRAIN_LOCK_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/terrain-lock-metadata-locked.json" | awk '{print $1}')"

      - name: Prove package-selected feature closure
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p symtropy-terrain --locked -e normal,build,dev --prefix none --format '{p}|{f}' -i naga@27.0.3 | tee "${RUNNER_TEMP}/terrain-naga27-inverse.txt"
          cargo tree -p symtropy-terrain --locked -e normal,build,dev --prefix none --format '{p}|{f}' -i codespan-reporting@0.12.0 | tee "${RUNNER_TEMP}/terrain-codespan012-inverse.txt"

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])

          def package_features(filename, package):
              lines = [line.strip() for line in (root / filename).read_text().splitlines() if line.strip()]
              matches = [line for line in lines if line.startswith(package + "|")]
              if len(matches) != 1:
                  raise SystemExit(f"expected one {package!r} line in {filename}: {matches!r}")
              _, raw = matches[0].split("|", 1)
              return {feature for feature in raw.split(",") if feature}

          naga27 = package_features("terrain-naga27-inverse.txt", "naga v27.0.3")
          codespan = package_features("terrain-codespan012-inverse.txt", "codespan-reporting v0.12.0")
          if "termcolor" not in naga27:
              raise SystemExit(f"Terrain-selected naga 27 lacks termcolor: {sorted(naga27)!r}")
          if "termcolor" not in codespan:
              raise SystemExit(f"Terrain-selected codespan 0.12 lacks termcolor: {sorted(codespan)!r}")
          print("TERRAIN_SELECTED_WRITER_MODE_COHERENCE=PASS")
          PY

      - name: Commit exact Cargo-generated lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "Cargo.lock"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/Cargo.toml)" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "chore(terrain): freeze Cargo-generated Naga 27 lock edge"
          freeze_commit="$(git rev-parse HEAD)"
          freeze_lock_blob="$(git rev-parse HEAD:Cargo.lock)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "TERRAIN_LOCK_FREEZE_COMMIT=${freeze_commit}"
          echo "TERRAIN_LOCK_FREEZE_BLOB=${freeze_lock_blob}"
          echo "claim=Cargo 1.96 generated a lock whose only semantic change is the Terrain dependency edge to already-resolved naga 27.0.3"
