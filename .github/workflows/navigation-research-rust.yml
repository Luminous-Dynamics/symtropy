name: Navigation Research Isolated Rust Crates

on:
  pull_request:
    paths:
      - "research/nav-transition-validator/**"
      - "docs/research/navigation-transition-v0.1/**"
      - "research/nav-observation-toy-fim/**"
      - "research/miluv-ingest/**"
      - ".github/workflows/navigation-research-rust.yml"

permissions:
  contents: read

jobs:
  isolated-rust:
    name: Isolated navigation research crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format standalone crates in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            research/nav-transition-validator/Cargo.toml \
            research/nav-observation-toy-fim/Cargo.toml \
            research/miluv-ingest/Cargo.toml
          do
            if [[ -f "$manifest" ]]; then
              cargo fmt --manifest-path "$manifest"
            fi
          done
          git diff --check

      - name: Clippy and tests for standalone crates
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            research/nav-transition-validator/Cargo.toml \
            research/nav-observation-toy-fim/Cargo.toml \
            research/miluv-ingest/Cargo.toml
          do
            if [[ -f "$manifest" ]]; then
              echo "::group::cargo clippy --all-targets --manifest-path $manifest"
              cargo clippy --all-targets --manifest-path "$manifest"
              echo "::endgroup::"
              echo "::group::cargo test --all-targets --manifest-path $manifest"
              cargo test --all-targets --manifest-path "$manifest"
              echo "::endgroup::"
            fi
          done

      - name: Run equation-level Student-t protection-level baseline demo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f research/nav-observation-toy-fim/Cargo.toml && -f research/nav-observation-toy-fim/src/bin/student_t_pl_demo.rs ]]; then
            cargo run --quiet --manifest-path research/nav-observation-toy-fim/Cargo.toml --bin student_t_pl_demo
          else
            echo "Student-t PL baseline demo is not part of this branch; demo skipped."
          fi

      - name: Run equation-level adaptive PL baseline demo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f research/nav-observation-toy-fim/Cargo.toml && -f research/nav-observation-toy-fim/src/bin/adaptive_pl_demo.rs ]]; then
            cargo run --quiet --manifest-path research/nav-observation-toy-fim/Cargo.toml --bin adaptive_pl_demo
          else
            echo "Adaptive PL baseline crate is not part of this branch; demo skipped."
          fi

      - name: Run protection-level trace metrics demo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f research/nav-observation-toy-fim/Cargo.toml && -f research/nav-observation-toy-fim/src/bin/pl_trace_metrics_demo.rs ]]; then
            cargo run --quiet --manifest-path research/nav-observation-toy-fim/Cargo.toml --bin pl_trace_metrics_demo
          else
            echo "PL trace metrics demo is not part of this branch; demo skipped."
          fi

      - name: Run zero-failure integrity evidence demo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f research/nav-observation-toy-fim/Cargo.toml && -f research/nav-observation-toy-fim/src/bin/integrity_evidence_demo.rs ]]; then
            cargo run --quiet --manifest-path research/nav-observation-toy-fim/Cargo.toml --bin integrity_evidence_demo
          else
            echo "Zero-failure integrity evidence demo is not part of this branch; demo skipped."
          fi

      - name: Run mission-level risk budget demo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f research/nav-observation-toy-fim/Cargo.toml && -f research/nav-observation-toy-fim/src/bin/mission_risk_budget_demo.rs ]]; then
            cargo run --quiet --manifest-path research/nav-observation-toy-fim/Cargo.toml --bin mission_risk_budget_demo
          else
            echo "Mission risk budget demo is not part of this branch; demo skipped."
          fi

      - name: Run schema and semantic validator CLI when corpus is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f research/nav-transition-validator/Cargo.toml \
             && -f docs/research/navigation-transition-v0.1/nav_transition_case.schema.json \
             && -f docs/research/navigation-transition-v0.1/fixtures/nav_transition_cases.v0.1.json \
             && -f docs/research/navigation-transition-v0.1/manifest.v0.1.json ]]; then
            cargo run --manifest-path research/nav-transition-validator/Cargo.toml --bin nav-transition-validate -- \
              docs/research/navigation-transition-v0.1/nav_transition_case.schema.json \
              docs/research/navigation-transition-v0.1/fixtures/nav_transition_cases.v0.1.json \
              docs/research/navigation-transition-v0.1/manifest.v0.1.json
          else
            echo "Transition validator corpus is not part of this branch; CLI integration step skipped."
          fi

      - name: Validate cross-domain generalization split when fixture is present
        shell: bash
        run: |
          set -euo pipefail
          schema="docs/research/nav-generalization-v0.1/nav_generalization_split.schema.json"
          fixture="docs/research/nav-generalization-v0.1/fixtures/leave_site_out.example.json"
          if [[ -f research/nav-transition-validator/Cargo.toml && -f "$schema" && -f "$fixture" ]]; then
            cargo run --manifest-path research/nav-transition-validator/Cargo.toml --bin nav-generalization-validate -- "$schema" "$fixture"
          else
            echo "Generalization split fixture is not part of this branch; validation skipped."
          fi

      - name: Run rights-gated dataset admission CLI when registry is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f docs/research/navigation-transition-v0.1/dataset-admission.schema.json \
             && -f docs/research/navigation-transition-v0.1/datasets.v0.1.json ]]; then
            cargo run --manifest-path research/nav-transition-validator/Cargo.toml --bin dataset_admission_validate -- \
              docs/research/navigation-transition-v0.1/dataset-admission.schema.json \
              docs/research/navigation-transition-v0.1/datasets.v0.1.json \
              research_noncommercial
            cargo run --manifest-path research/nav-transition-validator/Cargo.toml --bin dataset_admission_validate -- \
              docs/research/navigation-transition-v0.1/dataset-admission.schema.json \
              docs/research/navigation-transition-v0.1/datasets.v0.1.json \
              commercial
          else
            echo "Dataset rights registry is not part of this branch; admission CLI skipped."
          fi
