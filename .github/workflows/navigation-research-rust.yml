name: Navigation Research Isolated Rust Crates

on:
  pull_request:
    paths:
      - "research/nav-transition-validator/**"
      - "research/nav-observation-toy-fim/**"
      - ".github/workflows/navigation-research-rust.yml"

permissions:
  contents: read

jobs:
  isolated-rust:
    name: Isolated navigation research crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format standalone crates in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            research/nav-transition-validator/Cargo.toml \
            research/nav-observation-toy-fim/Cargo.toml
          do
            if [[ -f "$manifest" ]]; then
              cargo fmt --manifest-path "$manifest"
            fi
          done
          git diff --check

      - name: Clippy and tests for standalone crates
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            research/nav-transition-validator/Cargo.toml \
            research/nav-observation-toy-fim/Cargo.toml
          do
            if [[ -f "$manifest" ]]; then
              echo "::group::cargo clippy --all-targets --manifest-path $manifest"
              cargo clippy --all-targets --manifest-path "$manifest"
              echo "::endgroup::"
              echo "::group::cargo test --all-targets --manifest-path $manifest"
              cargo test --all-targets --manifest-path "$manifest"
              echo "::endgroup::"
            fi
          done


      - name: Execute isolated active-sensing research demos
        shell: bash
        run: |
          set -euo pipefail
          for bin in nav-observation-toy-fim correlation_demo robust_design_demo correlation_envelope_demo geometry_outcome_demo correlation_audit_demo observability_3d_demo correlated_3d_demo decision_value_demo robust_decision_value_demo truth_boundary_demo; do
            echo "::group::Run $bin"
            cargo run --quiet --manifest-path research/nav-observation-toy-fim/Cargo.toml --bin "$bin"
            echo "::endgroup::"
          done

      - name: Run schema and semantic validator CLI when corpus is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f research/nav-transition-validator/Cargo.toml \
             && -f docs/research/navigation-transition-v0.1/nav_transition_case.schema.json \
             && -f docs/research/navigation-transition-v0.1/fixtures/nav_transition_cases.v0.1.json \
             && -f docs/research/navigation-transition-v0.1/manifest.v0.1.json ]]; then
            cargo run --manifest-path research/nav-transition-validator/Cargo.toml -- \
              docs/research/navigation-transition-v0.1/nav_transition_case.schema.json \
              docs/research/navigation-transition-v0.1/fixtures/nav_transition_cases.v0.1.json \
              docs/research/navigation-transition-v0.1/manifest.v0.1.json
          else
            echo "Transition validator corpus is not part of this branch; CLI integration step skipped."
          fi
