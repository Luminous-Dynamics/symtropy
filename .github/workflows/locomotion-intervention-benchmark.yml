name: Locomotion Intervention Benchmark Verification

on:
  pull_request:
    paths:
      - 'research/locomotion-intervention-benchmark-v0/**'
      - '.github/workflows/locomotion-intervention-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'research/locomotion-intervention-benchmark-v0/**'
      - '.github/workflows/locomotion-intervention-benchmark.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/locomotion-intervention-benchmark-v0/Cargo.toml -- --check
      - name: Run synthetic known-truth tests
        run: cargo test --manifest-path research/locomotion-intervention-benchmark-v0/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/locomotion-intervention-benchmark-v0/Cargo.toml --locked --all-targets -- -D warnings
