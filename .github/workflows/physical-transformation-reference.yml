name: Physical Transformation Reference

on:
  push:
    branches: ["research/physical-transformation-kernel-v0-1"]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-transformation-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check

      - name: Run unit and independent oracle tests
        run: cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify planar-truss mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_planar_truss_mutations.sh

      - name: Verify modal-bar mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_modal_bar_mutations.sh

      - name: Re-verify modal-bar production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/modal_bar.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify NAFEMS NBC05 modal oracle mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_nafems_nbc05_mutations.sh

      - name: Re-verify NAFEMS NBC05 production oracle after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/nafems_nbc05.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify Euler-Bernoulli beam element mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_element_mutations.sh

      - name: Re-verify beam element production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_element.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify released-joint beam assembly mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_pin_assembly_mutations.sh

      - name: Verify refined beam-chain mesh mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_chain_mesh_mutations.sh

      - name: Re-verify released-joint beam assembly source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_pin_assembly.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify beam-modal mechanism classification mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_modal_mutations.sh

      - name: Re-verify beam-modal production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_modal.rs research/physical-transformation-reference/src/modal_bar.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify isolated modal-assignment mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_modal_assignment_mutations.sh

      - name: Re-verify modal-assignment production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/modal_assignment.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify modal-subspace comparison mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_modal_subspace_mutations.sh

      - name: Re-verify modal-subspace production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/modal_subspace.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Re-verify planar-truss production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/planar_truss.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Run frozen fixture and verify exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin physical-transformation-reference -- \
            --source-commit "$source_commit" > physical-transformation-reference-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .schema_version == "physical-transform-receipt-v0.1"
            and .benchmark_id == "PHYS-TRANSFORM-001"
            and .source_commit == $source_commit
            and .evidence_class == "synthetic"
            and .result == "pass"
            and .fixtures.topology_replay == "pass"
            and .fixtures.transactional_rejection == "pass"
            and .fixtures.balanced_mass_ledger == "pass"
            and .fixtures.imbalanced_mass_negative_control == "pass"
            and .fixtures.analytical_mechanics == "pass"
            and .summary.component_count == 3
            and .summary.connection_count == 2
            and .summary.recovered_component_count == 1
            and .summary.recovered_mass_mg == 1000
            and .summary.deconstruction_step_count == 3
            and .summary.deconstruction_recovered_component_count == 2
            and .summary.deconstruction_recovered_mass_mg == 3000
            and .summary.axial_bar_stress_pa > 99999
            and .summary.axial_bar_stress_pa < 100001
            and .summary.axial_bar_extension_m > 0
            and .summary.cantilever_tip_deflection_m > 0
            and .summary.cantilever_maximum_bending_stress_pa > 2499999
            and .summary.simply_supported_midspan_deflection_m > 0.00208
            and .summary.simply_supported_midspan_deflection_m < 0.00209
            and .summary.simply_supported_maximum_bending_stress_pa > 24999999
            and .summary.simply_supported_maximum_bending_stress_pa < 25000001
            and .summary.connected_components_before_cut == 1
            and .summary.connected_components_after_cut == 2
            and .summary.connected_components_after_reconnect == 1
            and (.claim_ceiling | contains("not_structural_or_collapse_prediction"))
          ' physical-transformation-reference-receipt.json

      - name: Generate and verify exact-head planar-truss receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-reference -- \
            --source-commit "$source_commit" > planar-truss-reference-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-reference -- \
            --source-commit "$source_commit" > planar-truss-reference-raw-b.json
          cmp --silent planar-truss-reference-raw-a.json planar-truss-reference-raw-b.json
          request_canonical="$(jq -r '.request_canonical' planar-truss-reference-raw-a.json)"
          fixture_canonical="$(cat research/physical-transformation-reference/fixtures/planar_truss_request_v0_1.txt)"
          test "$request_canonical" = "$fixture_canonical"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "bf16cb7dda8accf9b7cdf3f4614b94bca8cefe3e84d4077adf3edc46269db00c"
          jq --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of UTF-8 request_canonical bytes without a final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked research/physical-transformation-reference files"
            }
          ' planar-truss-reference-raw-a.json > planar-truss-reference-receipt.json
          jq -e --arg source_commit "$source_commit" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            .schema_version == "planar-truss-receipt-v0.1"
            and .benchmark_id == "PHYS-TRUSS-001"
            and .input_fixture_id == "PHYS-TRUSS-V-001"
            and .source_commit == $source_commit
            and .evidence_class == "synthetic"
            and .result == "pass"
            and .request_sha256 == $request_sha256
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
            and .crate_source_tree_sha256 == $crate_tree_sha256
            and (.crate_source_tree_sha256 | test("^[0-9a-f]{64}$"))
            and .verification.independent_known_answer == "pass"
            and .verification.equilibrium_gate == "pass"
            and .verification.energy_balance == "pass"
            and .verification.physical_validation == "not_performed"
            and .energy.strain_energy_j > 0
            and .energy.external_work_j > 0
            and (.energy.residual_j | abs) < 1e-12
            and .energy.normalized_residual < 1e-12
            and .equilibrium.normalized_force_residual < 1e-12
            and .equilibrium.normalized_moment_residual < 1e-12
            and .equilibrium.normalized_free_dof_residual < 1e-12
            and (.claim_ceiling | contains("not member bending/buckling"))
            and (.node_results | length == 3)
            and (.bar_results | length == 2)
          ' planar-truss-reference-receipt.json

      - name: Generate deterministic planar-truss sweep receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          truss_source_sha256="$(sha256sum research/physical-transformation-reference/src/planar_truss.rs | awk '{print $1}')"
          jq -n \
            --arg source_commit "$source_commit" \
            --arg truss_source_sha256 "$truss_source_sha256" \
            '{
              schema_version: "planar-truss-sweep-receipt-v0.1",
              benchmark_id: "PHYS-TRUSS-SWEEP-001",
              source_commit: $source_commit,
              source_sha256: {planar_truss_rs: $truss_source_sha256},
              evidence_class: "software-test-run",
              result: "pass",
              test: "planar_truss::tests::fixed_seed_parameter_sweep_matches_symmetric_truss_closed_form",
              deterministic_generator: {
                family: "64-bit linear congruential generator",
                seed_hex: "0x54525553535F5631",
                multiplier: "6364136223846793005",
                increment: "1442695040888963407",
                output: "top 53 state bits divided by 2^53"
              },
              case_count: 128,
              ranges: {
                half_span_m: {min: 0.25, max: 12.0},
                area_m2: {min: 0.0001, max: 0.05},
                youngs_modulus_pa: {min: 30000000000, max: 210000000000},
                downward_load_n: {min: 10.0, max: 10000.0}
              },
              checks_per_case: 21,
              total_scalar_checks: 2688,
              acceptance: {
                relative_tolerance: 1.0e-10,
                field_specific_absolute_floors: true,
                normalized_force_residual_lt: 1.0e-12,
                normalized_moment_residual_lt: 1.0e-12,
                normalized_free_dof_residual_lt: 1.0e-12,
                normalized_energy_residual_lt: 1.0e-12,
                energy_oracle: "strain_energy_and_external_work_match_half_load_dot_displacement",
                alternating_input_order_reversal: true
              },
              claim_ceiling: "synthetic static small-displacement linear-elastic 2D pin-jointed truss software reference only; no physical validation, code compliance, or structural safety claim"
            }' > planar-truss-sweep-receipt.json
          jq -e --arg source_commit "$source_commit" --arg truss_source_sha256 "$truss_source_sha256" '
            .schema_version == "planar-truss-sweep-receipt-v0.1"
            and .benchmark_id == "PHYS-TRUSS-SWEEP-001"
            and .source_commit == $source_commit
            and .source_sha256.planar_truss_rs == $truss_source_sha256
            and (.source_sha256.planar_truss_rs | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .case_count == 128
            and .checks_per_case == 21
            and .total_scalar_checks == 2688
            and .acceptance.normalized_force_residual_lt == 1e-12
            and .acceptance.normalized_moment_residual_lt == 1e-12
            and .acceptance.normalized_free_dof_residual_lt == 1e-12
            and .acceptance.normalized_energy_residual_lt == 1e-12
            and .acceptance.energy_oracle == "strain_energy_and_external_work_match_half_load_dot_displacement"
          ' planar-truss-sweep-receipt.json

      - name: Generate and verify deterministic axial-modal receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin modal-bar-reference -- \
            --source-commit "$source_commit" > modal-bar-reference-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin modal-bar-reference -- \
            --source-commit "$source_commit" > modal-bar-reference-raw-b.json
          cmp --silent modal-bar-reference-raw-a.json modal-bar-reference-raw-b.json
          request_canonical="$(jq -r '.request_canonical' modal-bar-reference-raw-a.json)"
          fixture_canonical="$(cat research/physical-transformation-reference/fixtures/modal_bar_request_v0_1.txt)"
          test "$request_canonical" = "$fixture_canonical"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "09deaeee97a2ca613713dd4889bff732173c60c63571e27481494c1bdfb85fa7"
          jq --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of UTF-8 request_canonical bytes without final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked reference-crate files"
            }
          ' modal-bar-reference-raw-a.json > modal-bar-reference-receipt.json
          jq -e --arg source_commit "$source_commit" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            .schema_version == "axial-bar-modal-receipt-v0.1"
            and .benchmark_id == "PHYS-AXIAL-BAR-001"
            and .source_commit == $source_commit
            and .request_sha256 == $request_sha256
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
            and .crate_source_tree_sha256 == $crate_tree_sha256
            and (.crate_source_tree_sha256 | test("^[0-9a-f]{64}$"))
            and .evidence_class == "synthetic"
            and .result == "pass"
            and .model.mass_formulation == "consistent"
            and .model.element_count == 8
            and .model.requested_modes == 2
            and (.modes | length == 2)
            and (.modes[0].frequency_hz - 1299.2710715733335 | abs < 1e-6)
            and (.modes[1].frequency_hz - 3948.037301111085 | abs < 1e-6)
            and (.modes | all(.[]; (.shape_free_dofs | length) == 8))
            and .checks.max_relative_frequency_error < 0.05
            and .checks.max_normalized_eigen_residual < 1e-10
            and .checks.max_mass_norm_residual < 1e-10
            and .checks.max_off_diagonal_mass_orthogonality_residual < 1e-10
            and (.claim_ceiling | contains("not_modal_truss_nbc05"))
          ' modal-bar-reference-receipt.json

      - name: Generate and verify NAFEMS NBC05 axial-truss receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin nafems-nbc05-modal-reference -- \
            --source-commit "$source_commit" > nafems-nbc05-modal-reference-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin nafems-nbc05-modal-reference -- \
            --source-commit "$source_commit" > nafems-nbc05-modal-reference-raw-b.json
          cmp --silent nafems-nbc05-modal-reference-raw-a.json nafems-nbc05-modal-reference-raw-b.json
          request_canonical="$(tr -d '\n' < research/physical-transformation-reference/fixtures/nafems_nbc05_axial_truss_request_v0_1.txt)"
          test "$(jq -r '.request_canonical' nafems-nbc05-modal-reference-raw-a.json)" = "$request_canonical"
          test "$request_canonical" = "schema=nafems-nbc05-axial-truss-request-v0.1|fixture=PHYS-NAFEMS-NBC05-AXIAL-001|geometry=top_span_m:1,vertical_offset_m:1|node_A=(0,vertical_offset),fixed_x=true,fixed_y=true|node_B=(0,0),fixed_x=true,fixed_y=true|node_C=(top_span,vertical_offset),fixed_x=false,fixed_y=false|member_AC=horizontal|member_BC=diagonal|youngs_modulus_pa=210000000000|poisson_ratio=0.3|density_kg_m3=7800|section_radius_m=0.01|mass_formulations=consistent,lumped|reference_cs1_hz=452.09,1114.6|reference_cs2_hz=369.13,910.05|reference_model=single_element_per_member_axial_bar_only|claim_ceiling=reported_table_reproduction_not_bending_or_physical_validation"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "b64d2f1ee97224fb292f6c9b6b948b5f0c26a4a61ac8c1cff75ad4c40206dd2d"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          jq --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of canonical UTF-8 request bytes without final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked reference-crate files"
            }
          ' nafems-nbc05-modal-reference-raw-a.json > nafems-nbc05-modal-reference-receipt.json
          jq -e --arg source_commit "$source_commit" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            .schema_version == "nafems-nbc05-axial-truss-receipt-v0.1"
            and .benchmark_id == "PHYS-NAFEMS-NBC05-AXIAL-001"
            and .source_commit == $source_commit
            and .request_sha256 == $request_sha256
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
            and .crate_source_tree_sha256 == $crate_tree_sha256
            and (.crate_source_tree_sha256 | test("^[0-9a-f]{64}$"))
            and .references.challenge == "https://www.nafems.org/downloads/nbc5_challenge.pdf"
            and .references.solution == "https://www.nafems.org/downloads/nbr5v3.pdf"
            and .evidence_class == "published-reference-reproduction"
            and .result == "pass"
            and (.cs1_consistent_mass.frequencies_hz[0] - 452.0919432369085 | abs < 1e-7)
            and (.cs1_consistent_mass.frequencies_hz[1] - 1114.5800375516237 | abs < 1e-7)
            and (.cs2_lumped_mass.frequencies_hz[0] - 369.1315259179073 | abs < 1e-7)
            and (.cs2_lumped_mass.frequencies_hz[1] - 910.0507898311973 | abs < 1e-7)
            and (.cs1_consistent_mass.reference_relative_errors | all(.[]; . < 1e-4))
            and (.cs2_lumped_mass.reference_relative_errors | all(.[]; . < 1e-4))
            and .acceptance.all_four_frequency_targets_within_tolerance == true
            and (.claim_ceiling | contains("not_member_bending"))
          ' nafems-nbc05-modal-reference-receipt.json

      - name: Generate and verify deterministic released-joint beam modal receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-pin-modal-reference -- \
            --source-commit "$source_commit" > beam-pin-modal-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-pin-modal-reference -- \
            --source-commit "$source_commit" > beam-pin-modal-raw-b.json
          cmp --silent beam-pin-modal-raw-a.json beam-pin-modal-raw-b.json
          request_canonical="$(tr -d '\n' < research/physical-transformation-reference/fixtures/beam_pin_assembly_request_v0_1.txt)"
          test "$(jq -r '.request_canonical' beam-pin-modal-raw-a.json)" = "$request_canonical"
