name: Physical Transformation Reference

on:
  push:
    branches: ["research/physical-transformation-kernel-v0-1"]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-transformation-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check

      - name: Run unit and independent oracle tests
        run: cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify planar-truss mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_planar_truss_mutations.sh

      - name: Verify modal-bar mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_modal_bar_mutations.sh

      - name: Re-verify modal-bar production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/modal_bar.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify NAFEMS NBC05 modal oracle mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_nafems_nbc05_mutations.sh

      - name: Re-verify NAFEMS NBC05 production oracle after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/nafems_nbc05.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify Euler-Bernoulli beam element mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_element_mutations.sh

      - name: Re-verify beam element production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_element.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify released-joint beam pin assembly mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_pin_assembly_mutations.sh

      - name: Re-verify released-joint beam assembly source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_pin_assembly.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify released-joint beam modal mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_modal_mutations.sh

      - name: Re-verify released-joint beam modal source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_modal.rs research/physical-transformation-reference/src/modal_bar.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Generate and verify deterministic released-joint beam modal receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-modal-reference -- --source-commit "$source_commit" > beam-modal-reference-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-modal-reference -- --source-commit "$source_commit" > beam-modal-reference-raw-b.json
          cmp --silent beam-modal-reference-raw-a.json beam-modal-reference-raw-b.json
          request_canonical="$(tr -d '\\n' < research/physical-transformation-reference/fixtures/beam_pin_assembly_request_v0_1.txt)"
          test "$(jq -r '.request_canonical' beam-modal-reference-raw-a.json)" = "$request_canonical"
          test "$request_canonical" = "schema=beam-pin-assembly-request-v0.1|fixture=PHYS-BEAM-PIN-001|node|A|0|1|true|true|node|B|0|0|true|true|node|C|1|1|false|false|member|AC|A|C|0.0003141592653589793|210000000000|7800|0.000000007853981633974483|member|BC|B|C|0.0003141592653589793|210000000000|7800|0.000000007853981633974483"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "f32f853195dfd6f3b117bc547206cbad23ab876eb576ee76a8160a3d32d78dd7"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          jq --arg source_commit "$source_commit" --arg request_canonical "$request_canonical" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of canonical UTF-8 request bytes without final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked reference-crate files"
            }
          ' beam-modal-reference-raw-a.json > beam-modal-reference-receipt.json
          jq -e --arg source_commit "$source_commit" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            .schema_version == "released-joint-beam-modal-receipt-v0.1"
            and .benchmark_id == "PHYS-BEAM-MODAL-001"
            and .source_commit == $source_commit
            and .request_sha256 == $request_sha256
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
            and .crate_source_tree_sha256 == $crate_tree_sha256
            and (.crate_source_tree_sha256 | test("^[0-9a-f]{64}$"))
            and .references.challenge == "https://www.nafems.org/downloads/nbc5_challenge.pdf"
            and .references.solution == "https://www.nafems.org/downloads/nbr5v3.pdf"
            and .evidence_class == "deterministic-software-modal-run"
            and .result == "pass"
            and .free_dof_count == 6
            and (.modes | length) == 6
            and ([.modes[].frequency_hz] == ([.modes[].frequency_hz] | sort))
            and (all(.modes[]; .frequency_hz > 0 and .normalized_eigen_residual < 1e-8 and .mass_norm_residual < 1e-8))
            and .maximum_mass_orthogonality_residual < 1e-8
            and .maximum_normalized_eigen_residual < 1e-8
            and .maximum_mass_norm_residual < 1e-8
            and (.claim_ceiling | contains("no full NBC05 convergence"))
            and (.physical_comparator_status | contains("not asserted as a golden numerical target"))
          ' beam-modal-reference-receipt.json

      - name: Verify continuous beam mesh assembly mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_mesh_mutations.sh

      - name: Re-verify beam mesh assembly source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_mesh.rs research/physical-transformation-reference/src/beam_pin_assembly.rs research/physical-transformation-reference/src/bin/beam-pin-assembly-reference.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify beam mesh convergence mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_mesh_convergence_mutations.sh

      - name: Re-verify beam mesh convergence source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_mesh_convergence.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Generate and verify deterministic beam mesh convergence receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-mesh-convergence-reference -- --source-commit "$source_commit" > beam-mesh-convergence-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-mesh-convergence-reference -- --source-commit "$source_commit" > beam-mesh-convergence-raw-b.json
          cmp --silent beam-mesh-convergence-raw-a.json beam-mesh-convergence-raw-b.json
          request_canonical="$(tr -d '\\n' < research/physical-transformation-reference/fixtures/beam_mesh_convergence_request_v0_1.txt)"
          test "$(jq -r '.request_canonical' beam-mesh-convergence-raw-a.json)" = "$request_canonical"
          test "$request_canonical" = "schema=beam-mesh-convergence-request-v0.1|elements_per_member=1,2,4,8|requested_modes=6|monotonic_relative_tolerance=0.00000001|mode_pairing=frequency_ordinal_only_MAC_not_claimed|base_request=schema=beam-pin-assembly-request-v0.1|fixture=PHYS-BEAM-PIN-001|node|A|0|1|true|true|node|B|0|0|true|true|node|C|1|1|false|false|member|AC|A|C|0.0003141592653589793|210000000000|7800|0.000000007853981633974483|member|BC|B|C|0.0003141592653589793|210000000000|7800|0.000000007853981633974483"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "bfdef412f1852b28eaa0951d9d8c63f0e7e445765fcc75a063df22064a8893a9"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          jq --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of canonical UTF-8 request bytes without final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked reference-crate files"
            }
          ' beam-mesh-convergence-raw-a.json > beam-mesh-convergence-receipt.json
          jq -e --arg source_commit "$source_commit" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            .schema_version == "beam-mesh-convergence-receipt-v0.1"
            and .benchmark_id == "PHYS-BEAM-MESH-CONVERGENCE-001"
            and .source_commit == $source_commit
            and .request_sha256 == $request_sha256
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
            and .crate_source_tree_sha256 == $crate_tree_sha256
            and (.crate_source_tree_sha256 | test("^[0-9a-f]{64}$"))
            and .references.challenge == "https://www.nafems.org/downloads/nbc5_challenge.pdf"
            and .references.solution == "https://www.nafems.org/downloads/nbr5v3.pdf"
            and .evidence_class == "deterministic-software-mesh-convergence-run"
            and .result == "pass"
            and .elements_per_member == [1,2,4,8]
            and .requested_mode_count == 6
            and (.points | length) == 4
            and ([.points[].total_element_count] == [2,4,8,16])
            and .points[0].relative_frequency_delta_from_previous == null
            and (.points | all(.[]; (.frequencies_hz | length) == 6 and (.frequencies_hz | all(.[]; . > 0)) and ([.frequencies_hz[]] == ([.frequencies_hz[]] | sort))))
            and (.points | all(.[]; .maximum_mass_orthogonality_residual < 1e-8 and .maximum_normalized_eigen_residual < 1e-8 and .maximum_mass_norm_residual < 1e-8))
            and (.points[1:] | all(.[]; (.relative_frequency_delta_from_previous | length) == 6 and (.relative_frequency_delta_from_previous | all(.[]; . >= 0 and . < 1))))
            and (.claim_ceiling | contains("no MAC mode-shape tracking"))
            and (.physical_comparator_status | contains("not asserted as numerical golden targets"))
          ' beam-mesh-convergence-receipt.json

      - name: Verify beam mode-tracking mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_beam_mode_tracking_mutations.sh

      - name: Re-verify beam mode-tracking source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/beam_mode_tracking.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Generate and verify deterministic beam mode-tracking receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-mode-tracking-reference -- --source-commit "$source_commit" > beam-mode-tracking-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin beam-mode-tracking-reference -- --source-commit "$source_commit" > beam-mode-tracking-raw-b.json
          cmp --silent beam-mode-tracking-raw-a.json beam-mode-tracking-raw-b.json
          request_canonical="$(tr -d '\\n' < research/physical-transformation-reference/fixtures/beam_mode_tracking_request_v0_1.txt)"
          test "$(jq -r '.request_canonical' beam-mode-tracking-raw-a.json)" = "$request_canonical"
          test "$request_canonical" = "schema=beam-mode-tracking-request-v0.1|elements_per_member=1,2,4,8|requested_modes=6|pairing=common-physical-station-MAC|assignment=hungarian-max-weight|rotation_scale_reference_length_m=1.41421356237309515e0|common_station_policy=intersection-of-exact-rational-member-stations|base_request=schema=beam-pin-assembly-request-v0.1|fixture=PHYS-BEAM-PIN-001|node|A|0|1|true|true|node|B|0|0|true|true|node|C|1|1|false|false|member|AC|A|C|0.0003141592653589793|210000000000|7800|0.000000007853981633974483|member|BC|B|C|0.0003141592653589793|210000000000|7800|0.000000007853981633974483"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "888973b4096d78cca1f2788e71a310161dc2007f18ad16fcdbbda3cb979046b2"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          jq --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of canonical UTF-8 request bytes without final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked reference-crate files"
            }
          ' beam-mode-tracking-raw-a.json > beam-mode-tracking-receipt.json
          jq -e --arg source_commit "$source_commit" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            .schema_version == "beam-mode-tracking-receipt-v0.1"
            and .benchmark_id == "PHYS-BEAM-MODE-TRACKING-001"
            and .source_commit == $source_commit
            and .request_sha256 == $request_sha256
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
            and .crate_source_tree_sha256 == $crate_tree_sha256
            and (.crate_source_tree_sha256 | test("^[0-9a-f]{64}$"))
            and .references.challenge == "https://www.nafems.org/downloads/nbc5_challenge.pdf"
            and .references.solution == "https://www.nafems.org/downloads/nbr5v3.pdf"
            and .evidence_class == "deterministic-software-mode-tracking-run"
            and .result == "pass"
            and .elements_per_member == [1,2,4,8]
            and .requested_mode_count == 6
            and (.levels | length) == 4
            and .levels[0].pairs_from_previous == null
            and .levels[1].pairs_from_previous | length == 6
            and .levels[2].pairs_from_previous | length == 6
            and .levels[3].pairs_from_previous | length == 6
            and ([.levels[].total_element_count] == [2,4,8,16])
            and ([.levels[].free_dof_count] == [6,12,24,48])
            and (.levels | all(.[]; (.frequencies_hz | length) == 6 and (.frequencies_hz | all(.[]; . > 0)) and .maximum_normalized_eigen_residual < 1e-8 and .maximum_mass_norm_residual < 1e-8 and .maximum_mass_orthogonality_residual < 1e-8))
            and (.levels[1].pairs_from_previous | all(.[]; .mac.common_translation_dof_count == 6 and .mac.common_rotation_dof_count == 4))
            and (.levels[2].pairs_from_previous | all(.[]; .mac.common_translation_dof_count == 10 and .mac.common_rotation_dof_count == 6))
            and (.levels[3].pairs_from_previous | all(.[]; .mac.common_translation_dof_count == 18 and .mac.common_rotation_dof_count == 10))
            and .total_mode_pairs == 18
            and (.defined_combined_mac_count + .unresolved_combined_mac_count == .total_mode_pairs)
            and (.claim_ceiling | contains("no 200-element/member NAFEMS reproduction"))
          ' beam-mode-tracking-receipt.json

      - name: Re-verify planar-truss production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/planar_truss.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Run frozen fixture and verify exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin physical-transformation-reference -- \
            --source-commit "$source_commit" > physical-transformation-reference-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .schema_version == "physical-transform-receipt-v0.1"
            and .benchmark_id == "PHYS-TRANSFORM-001"
            and .source_commit == $source_commit
            and .evidence_class == "synthetic"
            and .result == "pass"
            and .fixtures.topology_replay == "pass"
            and .fixtures.transactional_rejection == "pass"
            and .fixtures.balanced_mass_ledger == "pass"
            and .fixtures.imbalanced_mass_negative_control == "pass"
            and .fixtures.analytical_mechanics == "pass"
            and .summary.component_count == 3
            and .summary.connection_count == 2
            and .summary.recovered_component_count == 1
            and .summary.recovered_mass_mg == 1000
            and .summary.deconstruction_step_count == 3
            and .summary.deconstruction_recovered_component_count == 2
            and .summary.deconstruction_recovered_mass_mg == 3000
            and .summary.axial_bar_stress_pa > 99999
            and .summary.axial_bar_stress_pa < 100001
            and .summary.axial_bar_extension_m > 0
            and .summary.cantilever_tip_deflection_m > 0
            and .summary.cantilever_maximum_bending_stress_pa > 2499999
            and .summary.simply_supported_midspan_deflection_m > 0.00208
            and .summary.simply_supported_midspan_deflection_m < 0.00209
            and .summary.simply_supported_maximum_bending_stress_pa > 24999999
            and .summary.simply_supported_maximum_bending_stress_pa < 25000001
            and .summary.connected_components_before_cut == 1
            and .summary.connected_components_after_cut == 2
            and .summary.connected_components_after_reconnect == 1
            and (.claim_ceiling | contains("not_structural_or_collapse_prediction"))
          ' physical-transformation-reference-receipt.json

      - name: Generate and verify exact-head planar-truss receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-reference -- \
            --source-commit "$source_commit" > planar-truss-reference-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-reference -- \
            --source-commit "$source_commit" > planar-truss-reference-raw-b.json
          cmp --silent planar-truss-reference-raw-a.json planar-truss-reference-raw-b.json
          request_canonical="$(jq -r '.request_canonical' planar-truss-reference-raw-a.json)"
          fixture_canonical="$(cat research/physical-transformation-reference/fixtures/planar_truss_request_v0_1.txt)"
          test "$request_canonical" = "$fixture_canonical"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "bf16cb7dda8accf9b7cdf3f4614b94bca8cefe3e84d4077adf3edc46269db00c"
          jq --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of UTF-8 request_canonical bytes without a final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked research/physical-transformation-reference files"
            }
          ' planar-truss-reference-raw-a.json > planar-truss-reference-receipt.json
