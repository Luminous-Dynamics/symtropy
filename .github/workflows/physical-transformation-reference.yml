name: Physical Transformation Reference

on:
  push:
    branches: ["research/physical-transformation-kernel-v0-1"]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-transformation-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check

      - name: Run unit and independent oracle tests
        run: cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Run frozen fixture and verify exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml -- \
            --source-commit "$source_commit" > physical-transformation-reference-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .schema_version == "physical-transform-receipt-v0.1"
            and .benchmark_id == "PHYS-TRANSFORM-001"
            and .source_commit == $source_commit
            and .evidence_class == "synthetic"
            and .result == "pass"
            and .fixtures.topology_replay == "pass"
            and .fixtures.transactional_rejection == "pass"
            and .fixtures.balanced_mass_ledger == "pass"
            and .fixtures.imbalanced_mass_negative_control == "pass"
            and .fixtures.analytical_mechanics == "pass"
            and .summary.component_count == 3
            and .summary.connection_count == 2
            and .summary.recovered_component_count == 1
            and .summary.recovered_mass_mg == 1000
            and .summary.deconstruction_step_count == 3
            and .summary.deconstruction_recovered_component_count == 2
            and .summary.deconstruction_recovered_mass_mg == 3000
            and .summary.axial_bar_stress_pa > 99999
            and .summary.axial_bar_stress_pa < 100001
            and .summary.axial_bar_extension_m > 0
            and .summary.cantilever_tip_deflection_m > 0
            and .summary.cantilever_maximum_bending_stress_pa > 2499999
            and .summary.simply_supported_midspan_deflection_m > 0.00208
            and .summary.simply_supported_midspan_deflection_m < 0.00209
            and .summary.simply_supported_maximum_bending_stress_pa > 24999999
            and .summary.simply_supported_maximum_bending_stress_pa < 25000001
            and .summary.connected_components_before_cut == 1
            and .summary.connected_components_after_cut == 2
            and .summary.connected_components_after_reconnect == 1
            and (.claim_ceiling | contains("not_structural_or_collapse_prediction"))
          ' physical-transformation-reference-receipt.json

      - name: Verify frozen morphology/function request
        shell: bash
        run: |
          set -euo pipefail
          echo "18c78aa05c911dcb0b7566ac670565d27774cb73e82b46424fcaf420097a499e  research/physical-transformation-reference/morph_function_request_v0_1.txt" | sha256sum --check -

      - name: Compute morphology/function receipt and enforce semantic gates
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml \
            --bin morph-function-receipt -- \
            --source-commit "$source_commit" --source-tree-sha "$source_tree_sha" > "$temp_dir/first.json"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml \
            --bin morph-function-receipt -- \
            --source-commit "$source_commit" --source-tree-sha "$source_tree_sha" > "$temp_dir/second.json"
          cmp "$temp_dir/first.json" "$temp_dir/second.json"
          jq -e --arg source_commit "$source_commit" --arg tree "$source_tree_sha" '
            .schema_version == "morph-function-receipt-v0.1"
            and .benchmark_id == "MORPH-FUNCTION-001"
            and .source_commit == $source_commit
            and .source_tree_sha == $tree
            and .request_sha256 == "18c78aa05c911dcb0b7566ac670565d27774cb73e82b46424fcaf420097a499e"
            and .evidence_class == "synthetic"
            and .model_class == "2d_small_displacement_linear_elastic_axial_truss"
            and .case_count == 96
            and .load_envelope_case_count == 15
            and .parameter_grid_case_count == 81
            and .braced_pass_count == 64
            and .mechanism_rejection_count == 32
            and (.cases | length) == 96
            and ([.cases[] | select(.suite == "load_envelope")] | length) == 15
            and ([.cases[] | select(.suite == "parameter_grid")] | length) == 81
            and ([.cases[] | select(.disposition == "pass")] | length) == 64
            and ([.cases[] | select(.disposition == "expected_mechanism_rejected")] | length) == 32
            and ([.cases[] | select(.disposition == "pass" and ((.member_results | length) != 5))] | length) == 0
            and ([.cases[] | select(.disposition == "expected_mechanism_rejected" and .member_set_iou_vs_braced != 0.8)] | length) == 0
            and ([.cases[] | select(.disposition == "pass" and
              ((.normalized_force_residual >= 1e-12) or
               (.normalized_moment_residual >= 1e-12) or
               (.normalized_free_dof_residual >= 1e-12)))] | length) == 0
            and (.claim_ceiling | contains("no_physical_validation_no_code_compliance"))
          ' "$temp_dir/first.json" > /dev/null
          cp "$temp_dir/first.json" morph-function-reference-receipt.json

      - name: Upload deterministic reference receipt
        uses: actions/upload-artifact@v4
        with:
          name: physical-transformation-reference-receipt
          path: physical-transformation-reference-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload morphology/function receipt
        uses: actions/upload-artifact@v4
        with:
          name: morph-function-reference-receipt
          path: morph-function-reference-receipt.json
          if-no-files-found: error
          retention-days: 90
