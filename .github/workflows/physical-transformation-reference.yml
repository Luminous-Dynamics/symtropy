name: Physical Transformation Reference

on:
  push:
    branches: ["research/physical-transformation-kernel-v0-1"]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_TRANSFORMATION_SCORECARD_V0_1.md"
      - ".github/workflows/physical-transformation-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-transformation-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check

      - name: Run unit and independent oracle tests
        run: cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Verify planar-truss mutation sensitivity
        shell: bash
        run: bash research/physical-transformation-reference/scripts/verify_planar_truss_mutations.sh

      - name: Re-verify planar-truss production source after mutation audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- research/physical-transformation-reference/src/planar_truss.rs
          cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
          cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
          cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings

      - name: Run frozen fixture and verify exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin physical-transformation-reference -- \
            --source-commit "$source_commit" > physical-transformation-reference-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .schema_version == "physical-transform-receipt-v0.1"
            and .benchmark_id == "PHYS-TRANSFORM-001"
            and .source_commit == $source_commit
            and .evidence_class == "synthetic"
            and .result == "pass"
            and .fixtures.topology_replay == "pass"
            and .fixtures.transactional_rejection == "pass"
            and .fixtures.balanced_mass_ledger == "pass"
            and .fixtures.imbalanced_mass_negative_control == "pass"
            and .fixtures.analytical_mechanics == "pass"
            and .summary.component_count == 3
            and .summary.connection_count == 2
            and .summary.recovered_component_count == 1
            and .summary.recovered_mass_mg == 1000
            and .summary.deconstruction_step_count == 3
            and .summary.deconstruction_recovered_component_count == 2
            and .summary.deconstruction_recovered_mass_mg == 3000
            and .summary.axial_bar_stress_pa > 99999
            and .summary.axial_bar_stress_pa < 100001
            and .summary.axial_bar_extension_m > 0
            and .summary.cantilever_tip_deflection_m > 0
            and .summary.cantilever_maximum_bending_stress_pa > 2499999
            and .summary.simply_supported_midspan_deflection_m > 0.00208
            and .summary.simply_supported_midspan_deflection_m < 0.00209
            and .summary.simply_supported_maximum_bending_stress_pa > 24999999
            and .summary.simply_supported_maximum_bending_stress_pa < 25000001
            and .summary.connected_components_before_cut == 1
            and .summary.connected_components_after_cut == 2
            and .summary.connected_components_after_reconnect == 1
            and (.claim_ceiling | contains("not_structural_or_collapse_prediction"))
          ' physical-transformation-reference-receipt.json

      - name: Generate and verify exact-head planar-truss receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          crate_tree_sha256="$(
            git ls-files research/physical-transformation-reference |
              LC_ALL=C sort |
              xargs -r sha256sum |
              sha256sum |
              awk '{print $1}'
          )"
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-reference -- \
            --source-commit "$source_commit" > planar-truss-reference-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-reference -- \
            --source-commit "$source_commit" > planar-truss-reference-raw-b.json
          cmp --silent planar-truss-reference-raw-a.json planar-truss-reference-raw-b.json
          request_canonical="$(jq -r '.request_canonical' planar-truss-reference-raw-a.json)"
          fixture_canonical="$(cat research/physical-transformation-reference/fixtures/planar_truss_request_v0_1.txt)"
          test "$request_canonical" = "$fixture_canonical"
          request_sha256="$(printf '%s' "$request_canonical" | sha256sum | awk '{print $1}')"
          test "$request_sha256" = "bf16cb7dda8accf9b7cdf3f4614b94bca8cefe3e84d4077adf3edc46269db00c"
          jq --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            . + {
              request_sha256: $request_sha256,
              request_digest_algorithm: "SHA-256 of UTF-8 request_canonical bytes without a final newline",
              crate_source_tree_sha256: $crate_tree_sha256,
              source_digest_algorithm: "SHA-256 over sorted per-file SHA-256 records for git-tracked research/physical-transformation-reference files"
            }
          ' planar-truss-reference-raw-a.json > planar-truss-reference-receipt.json
          jq -e --arg source_commit "$source_commit" --arg request_sha256 "$request_sha256" --arg crate_tree_sha256 "$crate_tree_sha256" '
            .schema_version == "planar-truss-receipt-v0.1"
            and .benchmark_id == "PHYS-TRUSS-001"
            and .input_fixture_id == "PHYS-TRUSS-V-001"
            and .source_commit == $source_commit
            and .evidence_class == "synthetic"
            and .result == "pass"
            and .request_sha256 == $request_sha256
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
            and .crate_source_tree_sha256 == $crate_tree_sha256
            and (.crate_source_tree_sha256 | test("^[0-9a-f]{64}$"))
            and .verification.independent_known_answer == "pass"
            and .verification.equilibrium_gate == "pass"
            and .verification.energy_balance == "pass"
            and .verification.physical_validation == "not_performed"
            and .energy.strain_energy_j > 0
            and .energy.external_work_j > 0
            and (.energy.residual_j | abs) < 1e-12
            and .energy.normalized_residual < 1e-12
            and .equilibrium.normalized_force_residual < 1e-12
            and .equilibrium.normalized_moment_residual < 1e-12
            and .equilibrium.normalized_free_dof_residual < 1e-12
            and (.claim_ceiling | contains("not member bending/buckling"))
            and (.node_results | length == 3)
            and (.bar_results | length == 2)
          ' planar-truss-reference-receipt.json

      - name: Generate deterministic planar-truss sweep receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          truss_source_sha256="$(sha256sum research/physical-transformation-reference/src/planar_truss.rs | awk '{print $1}')"
          jq -n \
            --arg source_commit "$source_commit" \
            --arg truss_source_sha256 "$truss_source_sha256" \
            '{
              schema_version: "planar-truss-sweep-receipt-v0.1",
              benchmark_id: "PHYS-TRUSS-SWEEP-001",
              source_commit: $source_commit,
              source_sha256: {planar_truss_rs: $truss_source_sha256},
              evidence_class: "software-test-run",
              result: "pass",
              test: "planar_truss::tests::fixed_seed_parameter_sweep_matches_symmetric_truss_closed_form",
              deterministic_generator: {
                family: "64-bit linear congruential generator",
                seed_hex: "0x54525553535F5631",
                multiplier: "6364136223846793005",
                increment: "1442695040888963407",
                output: "top 53 state bits divided by 2^53"
              },
              case_count: 128,
              ranges: {
                half_span_m: {min: 0.25, max: 12.0},
                area_m2: {min: 0.0001, max: 0.05},
                youngs_modulus_pa: {min: 30000000000, max: 210000000000},
                downward_load_n: {min: 10.0, max: 10000.0}
              },
              checks_per_case: 21,
              total_scalar_checks: 2688,
              acceptance: {
                relative_tolerance: 1.0e-10,
                field_specific_absolute_floors: true,
                normalized_force_residual_lt: 1.0e-12,
                normalized_moment_residual_lt: 1.0e-12,
                normalized_free_dof_residual_lt: 1.0e-12,
                normalized_energy_residual_lt: 1.0e-12,
                energy_oracle: "strain_energy_and_external_work_match_half_load_dot_displacement",
                alternating_input_order_reversal: true
              },
              claim_ceiling: "synthetic static small-displacement linear-elastic 2D pin-jointed truss software reference only; no physical validation, code compliance, or structural safety claim"
            }' > planar-truss-sweep-receipt.json
          jq -e --arg source_commit "$source_commit" --arg truss_source_sha256 "$truss_source_sha256" '
            .schema_version == "planar-truss-sweep-receipt-v0.1"
            and .benchmark_id == "PHYS-TRUSS-SWEEP-001"
            and .source_commit == $source_commit
            and .source_sha256.planar_truss_rs == $truss_source_sha256
            and (.source_sha256.planar_truss_rs | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .case_count == 128
            and .checks_per_case == 21
            and .total_scalar_checks == 2688
            and .acceptance.normalized_force_residual_lt == 1e-12
            and .acceptance.normalized_moment_residual_lt == 1e-12
            and .acceptance.normalized_free_dof_residual_lt == 1e-12
            and .acceptance.normalized_energy_residual_lt == 1e-12
            and .acceptance.energy_oracle == "strain_energy_and_external_work_match_half_load_dot_displacement"
          ' planar-truss-sweep-receipt.json

      - name: Generate deterministic asymmetric-truss sweep receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          truss_source_sha256="$(sha256sum research/physical-transformation-reference/src/planar_truss.rs | awk '{print $1}')"
          jq -n \
            --arg source_commit "$source_commit" \
            --arg truss_source_sha256 "$truss_source_sha256" \
            '{
              schema_version: "planar-truss-asymmetric-sweep-receipt-v0.1",
              benchmark_id: "PHYS-TRUSS-ASYM-SWEEP-001",
              source_commit: $source_commit,
              source_sha256: {planar_truss_rs: $truss_source_sha256},
              evidence_class: "software-test-run",
              result: "pass",
              test: "planar_truss::tests::fixed_seed_asymmetric_sweep_matches_independent_two_dof_oracle",
              deterministic_generator: {
                family: "64-bit linear congruential generator",
                seed_hex: "0x4153594D54525553",
                multiplier: "6364136223846793005",
                increment: "1442695040888963407",
                output: "top 53 state bits divided by 2^53"
              },
              case_count: 128,
              ranges: {
                base_span_m: {min: 2.0, max: 6.0},
                apex_x_fraction_of_span: {min: 0.2, max: 0.8},
                apex_y_m: {min: 0.5, max: 3.0},
                youngs_modulus_pa: {min: 50000000000, max: 210000000000},
                axial_stiffness_a_n_per_m: {min: 10000000, max: 10000000000},
                axial_stiffness_b_n_per_m: {min: 7000000, max: 13000000000},
                apex_force_x_n: {min: -3000.0, max: 3000.0},
                apex_force_y_n: {min: -3000.0, max: 3000.0}
              },
              checks_per_case: 21,
              total_scalar_checks: 2688,
              acceptance: {
                relative_tolerance: 1.0e-9,
                field_specific_absolute_floors: true,
                normalized_force_residual_lt: 1.0e-12,
                normalized_moment_residual_lt: 1.0e-12,
                normalized_free_dof_residual_lt: 1.0e-12,
                normalized_energy_residual_lt: 1.0e-12,
                oracle: "independent inverse of the reduced 2x2 stiffness matrix",
                alternating_node_and_bar_input_order: true
              },
              claim_ceiling: "synthetic static small-displacement linear-elastic asymmetric 2D pin-jointed truss software reference only; no physical validation, modal analysis, buckling, code compliance, or structural safety claim"
            }' > planar-truss-asymmetric-sweep-receipt.json
          jq -e --arg source_commit "$source_commit" --arg truss_source_sha256 "$truss_source_sha256" '
            .schema_version == "planar-truss-asymmetric-sweep-receipt-v0.1"
            and .benchmark_id == "PHYS-TRUSS-ASYM-SWEEP-001"
            and .source_commit == $source_commit
            and .source_sha256.planar_truss_rs == $truss_source_sha256
            and (.source_sha256.planar_truss_rs | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .case_count == 128
            and .checks_per_case == 21
            and .total_scalar_checks == 2688
            and .acceptance.normalized_force_residual_lt == 1e-12
            and .acceptance.normalized_moment_residual_lt == 1e-12
            and .acceptance.normalized_free_dof_residual_lt == 1e-12
            and .acceptance.normalized_energy_residual_lt == 1e-12
            and .acceptance.oracle == "independent inverse of the reduced 2x2 stiffness matrix"
          ' planar-truss-asymmetric-sweep-receipt.json

      - name: Generate and verify deterministic truss-conditioning receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          truss_source_sha256="$(sha256sum research/physical-transformation-reference/src/planar_truss.rs | awk '{print $1}')"
          conditioning_source_sha256="$(sha256sum research/physical-transformation-reference/src/truss_conditioning.rs | awk '{print $1}')"
          conditioning_bin_sha256="$(sha256sum research/physical-transformation-reference/src/bin/planar-truss-conditioning.rs | awk '{print $1}')"
          lib_source_sha256="$(sha256sum research/physical-transformation-reference/src/lib.rs | awk '{print $1}')"
          cargo_manifest_sha256="$(sha256sum research/physical-transformation-reference/Cargo.toml | awk '{print $1}')"
          conditioning_schema_sha256="$(sha256sum research/physical-transformation-reference/schemas/planar-truss-conditioning-receipt-v0.1.schema.json | awk '{print $1}')"
          jq empty research/physical-transformation-reference/schemas/planar-truss-conditioning-receipt-v0.1.schema.json

          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-conditioning -- \
            --source-commit "$source_commit" > planar-truss-conditioning-raw-a.json
          cargo run --quiet --locked --manifest-path research/physical-transformation-reference/Cargo.toml --bin planar-truss-conditioning -- \
            --source-commit "$source_commit" > planar-truss-conditioning-raw-b.json
          cmp --silent planar-truss-conditioning-raw-a.json planar-truss-conditioning-raw-b.json

          jq \
            --arg truss_source_sha256 "$truss_source_sha256" \
            --arg conditioning_source_sha256 "$conditioning_source_sha256" \
            --arg conditioning_bin_sha256 "$conditioning_bin_sha256" \
            --arg lib_source_sha256 "$lib_source_sha256" \
            --arg cargo_manifest_sha256 "$cargo_manifest_sha256" \
            --arg conditioning_schema_sha256 "$conditioning_schema_sha256" '
            . + {
              source_sha256: {
                planar_truss_rs: $truss_source_sha256,
                truss_conditioning_rs: $conditioning_source_sha256,
                planar_truss_conditioning_bin_rs: $conditioning_bin_sha256,
                lib_rs: $lib_source_sha256,
                cargo_toml: $cargo_manifest_sha256,
                conditioning_receipt_schema_json: $conditioning_schema_sha256
              },
              source_digest_algorithm: "SHA-256 of each exact listed UTF-8 source/manifest file",
              duplicate_run_bytes_identical: true
            }
          ' planar-truss-conditioning-raw-a.json > planar-truss-conditioning-receipt.json

          jq -e \
            --arg source_commit "$source_commit" \
            --arg truss_source_sha256 "$truss_source_sha256" \
            --arg conditioning_source_sha256 "$conditioning_source_sha256" \
            --arg conditioning_bin_sha256 "$conditioning_bin_sha256" \
            --arg lib_source_sha256 "$lib_source_sha256" \
            --arg cargo_manifest_sha256 "$cargo_manifest_sha256" \
            --arg conditioning_schema_sha256 "$conditioning_schema_sha256" '
            .schema_version == "planar-truss-conditioning-receipt-v0.1"
            and .benchmark_id == "PHYS-TRUSS-CONDITION-001"
            and .source_commit == $source_commit
            and .source_sha256.planar_truss_rs == $truss_source_sha256
            and .source_sha256.truss_conditioning_rs == $conditioning_source_sha256
            and .source_sha256.planar_truss_conditioning_bin_rs == $conditioning_bin_sha256
            and .source_sha256.lib_rs == $lib_source_sha256
            and .source_sha256.cargo_toml == $cargo_manifest_sha256
            and .source_sha256.conditioning_receipt_schema_json == $conditioning_schema_sha256
            and (.source_sha256 | all(.[]; type == "string" and test("^[0-9a-f]{64}$")))
            and .evidence_class == "software-test-run"
            and .result == "pass"
            and .case_count == 9
            and .accepted_case_count == 7
            and .rejected_case_count == 2
            and .condition_reject_threshold == 0.001
            and (.cases | length == 9)
            and .duplicate_run_bytes_identical == true
            and (.cases | all(.[]; 
                  (.vertical_rhs_perturbation_n | type == "number" and isfinite and . > 0)
                  and (.vertical_rhs_perturbation_relative_amplitude | type == "number" and isfinite and . > 9.999999e-11 and . < 1.0000001e-10)
                  and (.vertical_rhs_plus_relative_displacement_change | type == "number" and isfinite and . >= 0)
                  and (.vertical_rhs_minus_relative_displacement_change | type == "number" and isfinite and . >= 0)
                  and (.vertical_rhs_plus_amplification | type == "number" and isfinite and . >= 0)
                  and (.vertical_rhs_minus_amplification | type == "number" and isfinite and . >= 0)
                  and (if .disposition == "accepted" then
                  (.observed_displacement_m | type == "array" and length == 2)
                  and (.forward_error_relative | type == "number" and isfinite)
                  and (.backward_error_relative | type == "number" and isfinite)
                  and (.condition_amplified_backward_error | type == "number" and isfinite)
                  and (.forward_error_bound | type == "number" and isfinite)
                  and (.forward_error_acceptance_limit | type == "number" and isfinite)
                  and (.normalized_force_residual | type == "number" and isfinite and . < 1e-12)
                  and (.normalized_moment_residual | type == "number" and isfinite and . < 1e-12)
                  and (.normalized_free_dof_residual | type == "number" and isfinite and . < 1e-12)
                  and (.normalized_energy_residual | type == "number" and isfinite and . < 1e-12)
                  and (.forward_error_relative <= .forward_error_acceptance_limit)
                  and (.solver_error == null)
                elif .disposition == "rejected_numerically_unresolved" then
                  (.condition_times_machine_epsilon >= 0.001)
                  and (.observed_displacement_m == null)
                  and (.forward_error_relative == null)
                  and (.backward_error_relative == null)
                  and (.solver_error | type == "string" and length > 0)
                else false end))
            and (.cases[-1].vertical_rhs_plus_amplification > .cases[0].vertical_rhs_plus_amplification)
            and ([.cases[].condition_infinity] as $conditions
              | all(range(0; ($conditions | length) - 1); $conditions[.] < $conditions[. + 1]))
            and ([.cases[].vertical_rhs_plus_amplification] as $plus_sensitivity
              | all(range(0; ($plus_sensitivity | length) - 1); $plus_sensitivity[.] < $plus_sensitivity[. + 1]))
            and ([.cases[].vertical_rhs_minus_amplification] as $minus_sensitivity
              | all(range(0; ($minus_sensitivity | length) - 1); $minus_sensitivity[.] < $minus_sensitivity[. + 1]))
            and (.condition_reject_threshold as $threshold
              | (
                  ([.cases[] | select(.condition_times_machine_epsilon >= $threshold) | .disposition] | length == 2)
                  and ([.cases[] | select(.condition_times_machine_epsilon >= $threshold) | .disposition]
                    | all(.[]; . == "rejected_numerically_unresolved"))
                ))
            and .claim_ceiling
              == "synthetic static small-displacement linear-elastic 2D pin-jointed truss conditioning test only; no physical validation, external FEM qualification, or structural safety claim"
          ' planar-truss-conditioning-receipt.json

      - name: Upload deterministic reference receipts
        uses: actions/upload-artifact@v4
        with:
          name: physical-transformation-reference-receipts
          path: |
            physical-transformation-reference-receipt.json
            planar-truss-mutation-receipt.json
            planar-truss-reference-receipt.json
            planar-truss-sweep-receipt.json
            planar-truss-asymmetric-sweep-receipt.json
            planar-truss-conditioning-receipt.json
          if-no-files-found: error
          retention-days: 90
