name: Industry dynamics benchmark schema

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/industry-dynamics-benchmark-001/**"
      - ".github/workflows/industry-dynamics-benchmark-schema.yml"
  push:
    branches: [main]
    paths:
      - "research/industry-dynamics-benchmark-001/**"
      - ".github/workflows/industry-dynamics-benchmark-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industry-dynamics-benchmark-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned schema checker
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate schema and semantic-match controls
        run: |
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path("research/industry-dynamics-benchmark-001")
          schema = json.loads((root / "schema/dynamics-benchmark-bundle-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/synthetic-6dof-bundle-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          assert not list(validator.iter_errors(fixture))
          assert fixture["fixture_mode"] == "synthetic_example"
          assert fixture["comparison"]["status"] == "INCONCLUSIVE"
          signatures = [run["semantic_signature"] for run in fixture["engine_runs"]]
          assert all(signature == signatures[0] for signature in signatures[1:])
          assert len({run["engine"] for run in fixture["engine_runs"]}) == len(fixture["engine_runs"])
          # Negative control: a different constraint contract invalidates a matched comparison.
          mismatch = copy.deepcopy(fixture)
          mismatch["engine_runs"][1]["semantic_signature"]["constraint_semantics_sha256"] = "f" * 64
          mismatch_signatures = [run["semantic_signature"] for run in mismatch["engine_runs"]]
          assert any(signature != mismatch_signatures[0] for signature in mismatch_signatures[1:])
          # Performance without oracle correctness must remain inconclusive.
          assert mismatch["oracle"]["reference_status"] == "INCONCLUSIVE"
          PY
