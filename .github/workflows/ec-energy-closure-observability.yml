name: EC Energy Closure Observability

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "research/ec-energy-closure-observability-001/**"
      - ".github/workflows/ec-energy-closure-observability.yml"
  push:
    branches: [ "main" ]
    paths:
      - "research/ec-energy-closure-observability-001/**"
      - ".github/workflows/ec-energy-closure-observability.yml"
  workflow_dispatch:

concurrency:
  group: ec-energy-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --manifest-path research/ec-energy-closure-observability-001/Cargo.toml --all -- --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path research/ec-energy-closure-observability-001/Cargo.toml --all-targets -- -D warnings

      - name: Run reference tests
        run: cargo test --manifest-path research/ec-energy-closure-observability-001/Cargo.toml --all-targets
