name: CCX MMS P1 analytic and mesh verification

on:
  pull_request:
    paths:
      - ".github/workflows/ccx-mms-p1-oracle.yml"
      - "research/ccx-mms-p1-001-oracle/**"
      - "research/ccx-mms-p1-001-mesh/**"
      - "research/physical-solver-contract/fixtures/ccx-mms-p1-001/problem.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccx-mms-p1-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: research/ccx-mms-p1-001-oracle
        run: cargo fmt --all -- --check

      - name: Run analytical oracle tests
        working-directory: research/ccx-mms-p1-001-oracle
        run: cargo test --locked --all-targets

      - name: Run strict Clippy
        working-directory: research/ccx-mms-p1-001-oracle
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Ensure the lockfile stayed unchanged
        run: git diff --exit-code -- research/ccx-mms-p1-001-oracle/Cargo.lock

  mesh-and-loads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: research/ccx-mms-p1-001-mesh
        run: cargo fmt --all -- --check

      - name: Run deterministic mesh and load tests
        working-directory: research/ccx-mms-p1-001-mesh
        run: cargo test --locked --all-targets

      - name: Run strict Clippy
        working-directory: research/ccx-mms-p1-001-mesh
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Generate and byte-compare deterministic receipts
        working-directory: research/ccx-mms-p1-001-mesh
        run: |
          cargo run --locked --release --quiet --bin mms-p1-probe -- 8 > /tmp/mms-p1-probe-a.json
          cargo run --locked --release --quiet --bin mms-p1-probe -- 8 > /tmp/mms-p1-probe-b.json
          cmp /tmp/mms-p1-probe-a.json /tmp/mms-p1-probe-b.json
          jq -e '.load_assembly_checks_pass == true' /tmp/mms-p1-probe-a.json > /dev/null
          sha256sum /tmp/mms-p1-probe-a.json > /tmp/mms-p1-probe-a.sha256
          cargo run --locked --release --quiet --bin mms-p1-calibration > /tmp/mms-p1-calibration-a.json
          cargo run --locked --release --quiet --bin mms-p1-calibration > /tmp/mms-p1-calibration-b.json
          cmp /tmp/mms-p1-calibration-a.json /tmp/mms-p1-calibration-b.json
          jq -e '.postprocessor_calibration_pass == true' /tmp/mms-p1-calibration-a.json > /dev/null
          sha256sum /tmp/mms-p1-calibration-a.json > /tmp/mms-p1-calibration-a.sha256
          cargo run --locked --release --quiet --bin mms-p1-deck -- 8 48 > /tmp/mms-p1-n8.inp
          cargo run --locked --release --quiet --bin mms-p1-deck -- 8 48 > /tmp/mms-p1-n8-repeat.inp
          cmp /tmp/mms-p1-n8.inp /tmp/mms-p1-n8-repeat.inp
          grep -F '*ELEMENT, TYPE=CPE3, ELSET=EALL' /tmp/mms-p1-n8.inp > /dev/null
          grep -F '*NODE PRINT, NSET=NALL' /tmp/mms-p1-n8.inp > /dev/null
          sha256sum /tmp/mms-p1-n8.inp > /tmp/mms-p1-n8.sha256

      - name: Preserve deterministic probe and calibration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccx-mms-p1-deterministic-receipts
          path: |
            /tmp/mms-p1-probe-a.json
            /tmp/mms-p1-probe-a.sha256
            /tmp/mms-p1-calibration-a.json
            /tmp/mms-p1-calibration-a.sha256
            /tmp/mms-p1-n8.inp
            /tmp/mms-p1-n8.sha256
          if-no-files-found: ignore
          retention-days: 90

      - name: Ensure both lockfiles stayed unchanged
        run: git diff --exit-code -- research/ccx-mms-p1-001-mesh/Cargo.lock research/ccx-mms-p1-001-oracle/Cargo.lock
