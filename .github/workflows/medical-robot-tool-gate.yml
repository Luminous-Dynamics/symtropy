name: Careframe Medical Robot Tool Gate (Simulation Only)

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/medical-robotics/**"
      - "tools/medical-robot-tool-gate/**"
      - ".github/workflows/medical-robot-tool-gate.yml"
  push:
    branches:
      - "research/medical-humanoid-platform-v0"

permissions:
  contents: read

concurrency:
  group: careframe-tool-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  manifest-gate:
    name: Validate concept tool manifests (no hardware authority)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --check

      - name: Focused tests
        run: cargo test --locked --manifest-path tools/medical-robot-tool-gate/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/medical-robot-tool-gate/Cargo.toml --all-targets -- -D warnings

      - name: Exercise corpus and single-candidate manifest gates
        env:
          CARE_FRAME_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          corpus=docs/medical-robotics/medical-robot-tool-corpus-v0.1.json
          cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- "$corpus" > /tmp/careframe-tool-receipt.json
          grep -q '"clinical_use_authorized": false' /tmp/careframe-tool-receipt.json
          grep -q '"physical_actuation_authorized": false' /tmp/careframe-tool-receipt.json
          grep -q "\"tested_revision\": \"$CARE_FRAME_TESTED_SHA\"" /tmp/careframe-tool-receipt.json

          # A proposal copied from a frozen positive fixture must be simulation-only.
          jq '.cases[0].manifest' "$corpus" > /tmp/careframe-proposal-valid.json
          cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --validate-manifest /tmp/careframe-proposal-valid.json > /tmp/careframe-proposal-valid-receipt.json
          grep -q '"disposition": "SIMULATION_ONLY"' /tmp/careframe-proposal-valid-receipt.json
          grep -Eq '"tool_manifest_sha256": "[0-9a-f]{64}"' /tmp/careframe-proposal-valid-receipt.json
          grep -q "\"tested_revision\": \"$CARE_FRAME_TESTED_SHA\"" /tmp/careframe-proposal-valid-receipt.json

          # Every built-in proposal template must be emitted and re-qualified as simulation-only.
          for kind in sealed_supply_gripper tray_carrier telepresence_head trainer_probe; do
            template="/tmp/careframe-template-${kind}.json"
            receipt="/tmp/careframe-template-${kind}-receipt.json"
            cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --template "$kind" "$template"
            cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --validate-manifest "$template" > "$receipt"
            grep -q '"disposition": "SIMULATION_ONLY"' "$receipt"
            grep -q "\"tested_revision\": \"$CARE_FRAME_TESTED_SHA\"" "$receipt"
            grep -q '"physical_actuation_authorized": false' "$receipt"
          done

          # The same proposal with clinical authority escalated must be denied.
          jq '.cases[0].manifest | .authority.clinical_use_authorized = true' "$corpus" > /tmp/careframe-proposal-forbidden.json
          set +e
          cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --validate-manifest /tmp/careframe-proposal-forbidden.json > /tmp/careframe-proposal-forbidden-receipt.json
          forbidden_status=$?
          set -e
          if [[ "$forbidden_status" -ne 1 ]]; then
            echo "Expected forbidden manifest to exit 1, got $forbidden_status" >&2
            cat /tmp/careframe-proposal-forbidden-receipt.json >&2
            exit 1
          fi
          grep -q '"disposition": "BLOCKED"' /tmp/careframe-proposal-forbidden-receipt.json
          grep -q 'CLINICAL_USE_AUTHORITY_FORBIDDEN' /tmp/careframe-proposal-forbidden-receipt.json
          grep -q '"clinical_use_authorized": false' /tmp/careframe-proposal-forbidden-receipt.json
          grep -q '"physical_actuation_authorized": false' /tmp/careframe-proposal-forbidden-receipt.json
          grep -q "\"tested_revision\": \"$CARE_FRAME_TESTED_SHA\"" /tmp/careframe-proposal-forbidden-receipt.json

          {
            echo "Tested revision: ${CARE_FRAME_TESTED_SHA}"
            echo "Rust: $(rustc --version)"
            echo "Manifest SHA-256: $(sha256sum tools/medical-robot-tool-gate/Cargo.toml | cut -d' ' -f1)"
            echo "Corpus SHA-256: $(sha256sum "$corpus" | cut -d' ' -f1)"
            echo "Lockfile SHA-256: $(sha256sum tools/medical-robot-tool-gate/Cargo.lock | cut -d' ' -f1)"
            echo ""
            echo "Candidate validator: positive simulation proposal accepted; unauthorized clinical claim rejected."
            echo "This is concept-manifest qualification for simulation only. No physical/clinical authority is granted."
            echo ""
            cat /tmp/careframe-tool-receipt.json
            cat /tmp/careframe-proposal-valid-receipt.json
            cat /tmp/careframe-proposal-forbidden-receipt.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate articulated morphology contract
        env:
          CARE_FRAME_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          model=docs/medical-robotics/careframe-wheeled-upper-body-morphology-v0.json
          cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --validate-morphology "$model" > /tmp/careframe-morphology-receipt.json
          jq -e '.disposition == "SIMULATION_ONLY" and
                 .physical_actuation_authorized == false and
                 .patient_contact_authorized == false and
                 .clinical_use_authorized == false' /tmp/careframe-morphology-receipt.json
          grep -q "\"tested_revision\": \"$CARE_FRAME_TESTED_SHA\"" /tmp/careframe-morphology-receipt.json
          grep -Eq '"morphology_sha256": "[0-9a-f]{64}"' /tmp/careframe-morphology-receipt.json

          # The same nominal topology must be blocked if a joint command is enabled.
          jq '.joints[0].command_enabled = true' "$model" > /tmp/careframe-morphology-command-enabled.json
          set +e
          cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --validate-morphology /tmp/careframe-morphology-command-enabled.json > /tmp/careframe-morphology-command-receipt.json
          command_status=$?
          set -e
          if [[ "$command_status" -ne 1 ]]; then
            echo "Expected a commanded joint to be blocked; got exit status $command_status" >&2
            cat /tmp/careframe-morphology-command-receipt.json >&2
            exit 1
          fi
          grep -q '"disposition": "BLOCKED"' /tmp/careframe-morphology-command-receipt.json
          grep -q 'MORPHOLOGY_JOINT_COMMAND_FORBIDDEN' /tmp/careframe-morphology-command-receipt.json
          grep -q '"physical_actuation_authorized": false' /tmp/careframe-morphology-command-receipt.json

          # A graph that is disconnected/cyclic cannot be admitted even for simulation.
          jq '.joints[0].parent_link = "right_drive_wheel" |
              .joints[1].parent_link = "left_drive_wheel"' "$model" > /tmp/careframe-morphology-cycle.json
          set +e
          cargo run --locked --quiet --manifest-path tools/medical-robot-tool-gate/Cargo.toml -- --validate-morphology /tmp/careframe-morphology-cycle.json > /tmp/careframe-morphology-cycle-receipt.json
          graph_status=$?
          set -e
          if [[ "$graph_status" -ne 1 ]]; then
            echo "Expected cyclic/disconnected morphology to be blocked; got exit status $graph_status" >&2
            cat /tmp/careframe-morphology-cycle-receipt.json >&2
            exit 1
          fi
          grep -q 'MORPHOLOGY_GRAPH_DISCONNECTED_OR_CYCLIC' /tmp/careframe-morphology-cycle-receipt.json

          {
            echo ""
            echo "Careframe articulated morphology exact revision: ${CARE_FRAME_TESTED_SHA}"
            echo "Model SHA-256: $(sha256sum "$model" | cut -d' ' -f1)"
            echo "Nominal 16-link / 15-joint synthetic graph admitted for simulation only."
            echo "Joint-command and graph-cycle negative controls were rejected."
            echo "No physical or clinical validity is implied."
            echo ""
            cat /tmp/careframe-morphology-receipt.json
          } >> "$GITHUB_STEP_SUMMARY"
