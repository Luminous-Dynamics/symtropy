name: Road EGCI reciprocal SAM handoff

on:
  push:
    branches:
      - "research/road-egci-handoff-001-*"
    paths:
      - "research/road-egci-handoff-001/**"
      - ".github/workflows/road-egci-handoff-001.yml"
  pull_request:
    paths:
      - "research/road-egci-handoff-001/**"
      - ".github/workflows/road-egci-handoff-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/road-egci-handoff-001/Cargo.toml -- --check
      - name: Run adapter conformance tests
        run: cargo test --locked --manifest-path research/road-egci-handoff-001/Cargo.toml --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path research/road-egci-handoff-001/Cargo.toml --all-targets -- -D warnings
      - name: Validate machine-readable fixtures and SAM DTO shape
        run: python3 -c 'import json; from pathlib import Path; root=Path("research/road-egci-handoff-001"); [json.loads(p.read_text(encoding="utf-8")) for p in [root/"fixtures/handoff_cases.json", root/"fixtures/sam-policy-trajectory-query.example.json", root/"schemas/sam-policy-trajectory-query.v0.1.schema.json", root/"schemas/reciprocal-episode-export.v0.2.schema.json"]]; schema=json.loads((root/"schemas/sam-policy-trajectory-query.v0.1.schema.json").read_text()); sample=json.loads((root/"fixtures/sam-policy-trajectory-query.example.json").read_text()); assert set(sample)==set(schema["required"]); assert all(set(step)==set(schema["properties"]["steps"]["items"]["required"]) for step in sample["steps"]); assert all(set(action)==set(schema["properties"]["steps"]["items"]["properties"]["joint_actions"]["items"]["required"]) for step in sample["steps"] for action in step["joint_actions"])'
