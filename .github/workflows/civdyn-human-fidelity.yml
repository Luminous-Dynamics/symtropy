name: CivDyn human fidelity reference

on:
  pull_request:
    paths:
      - "research/civdyn-human-fidelity/**"
      - ".github/workflows/civdyn-human-fidelity.yml"
  push:
    paths:
      - "research/civdyn-human-fidelity/**"
      - ".github/workflows/civdyn-human-fidelity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute human-fidelity reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-human-fidelity/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-human-fidelity/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-human-fidelity/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-human-fidelity/Cargo.toml --all-targets

      - name: Execute micro, population and trajectory fidelity fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-human-fidelity-evidence
          cargo run --locked --manifest-path research/civdyn-human-fidelity/Cargo.toml --bin human-fidelity-sweep \
            | tee target/civdyn-human-fidelity-evidence/human-fidelity-sweep.csv

      - name: Verify micro/macro separation, rare-option and trajectory controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-human-fidelity-evidence/human-fidelity-sweep.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 30, f"expected 30 metric rows, got {len(rows)}"
          assert all(len(row) == 30 for row in rows), "all records must retain the 30-column schema"
          overall = {row["policy"]: row for row in rows if row["record_type"] == "overall"}
          assert set(overall) == {"direct_prompt_mode_collapse", "structured_context_reference"}

          collapsed = overall["direct_prompt_mode_collapse"]
          structured = overall["structured_context_reference"]
          assert float(structured["mean_brier_score"]) < float(collapsed["mean_brier_score"])
          assert float(structured["total_variation"]) < float(collapsed["total_variation"])
          assert float(structured["jensen_shannon_bits"]) < float(collapsed["jensen_shannon_bits"])
          assert float(structured["trajectory_transition_tvd"]) < float(collapsed["trajectory_transition_tvd"])
          assert float(structured["tail_option_coverage"]) == 1.0
          assert float(collapsed["tail_option_coverage"]) == 0.0

          slices = [row for row in rows if row["record_type"] == "slice"]
          assert len(slices) == 18
          assert all(int(row["participant_count"]) == 20 for row in slices)

          coverage = [row for row in rows if row["record_type"] == "coverage_curve"]
          assert len(coverage) == 10
          expected = {"10", "20", "30", "50", "60"}
          for policy in overall:
              actual = {row["participant_count"] for row in coverage if row["policy"] == policy}
              assert actual == expected

          print("CIVDYN-HUMSIM-001 individual scoring, population divergence, long-tail coverage and trajectory controls verified.")
          PY

          {
            echo "## CIVDYN-HUMSIM-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-human-fidelity-evidence/human-fidelity-sweep.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic micro/population/trajectory fixture"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Execute participant-cluster bootstrap coverage curve twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-human-fidelity-evidence
          cargo run --locked --manifest-path research/civdyn-human-fidelity/Cargo.toml --bin human-fidelity-bootstrap \
            | tee target/civdyn-human-fidelity-evidence/human-fidelity-bootstrap.csv
          cargo run --locked --manifest-path research/civdyn-human-fidelity/Cargo.toml --bin human-fidelity-bootstrap \
            > target/civdyn-human-fidelity-evidence/human-fidelity-bootstrap-replay.csv
          cmp target/civdyn-human-fidelity-evidence/human-fidelity-bootstrap.csv \
              target/civdyn-human-fidelity-evidence/human-fidelity-bootstrap-replay.csv

      - name: Verify cluster-bootstrap uncertainty and undefined metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-human-fidelity-evidence/human-fidelity-bootstrap.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 80, f"expected 2 policies × 5 sample sizes × 8 metrics, got {len(rows)}"
          assert all(len(row) == 13 for row in rows)
          assert {row["policy"] for row in rows} == {
              "direct_prompt_mode_collapse", "structured_context_reference"
          }
          assert all(row["scope"] == "participant_cluster" for row in rows)
          assert all(row["replicate_count"] == "200" for row in rows)
          assert all(float(row["mean_trial_count_per_replicate"]) ==
                     int(row["participant_count"]) * 3 for row in rows)
          assert all(int(row["valid_replicates"]) + int(row["undefined_replicates"]) == 200
                     for row in rows)

          expected_sizes = {"10", "20", "30", "50", "60"}
          expected_metrics = {
              "mean_brier_score", "mean_log_loss", "top_choice_accuracy",
              "total_variation", "jensen_shannon_bits", "entropy_delta_bits",
              "trajectory_transition_tvd", "tail_option_coverage"
          }
          for policy in ("direct_prompt_mode_collapse", "structured_context_reference"):
              policy_rows = [row for row in rows if row["policy"] == policy]
              assert {row["participant_count"] for row in policy_rows} == expected_sizes
              for size in expected_sizes:
                  size_rows = [row for row in policy_rows if row["participant_count"] == size]
                  assert {row["metric"] for row in size_rows} == expected_metrics

          transitions = [row for row in rows if row["metric"] == "trajectory_transition_tvd"]
          assert all(row["valid_replicates"] == "200" for row in transitions)
          assert all(row["undefined_replicates"] == "0" for row in transitions)
          assert all(row["mean"] and row["p2_5"] and row["p97_5"] for row in transitions)

          print("CIVDYN-HUMSIM-002 participant-cluster bootstrap coverage, percentile intervals and undefined-value handling verified.")
          PY

          {
            echo "## CIVDYN-HUMSIM-002 cluster bootstrap"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-human-fidelity-evidence/human-fidelity-bootstrap.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic participant-cluster resampling only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload human-fidelity bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-human-fidelity-bootstrap
          path: target/civdyn-human-fidelity-evidence/human-fidelity-bootstrap.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload human-fidelity evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-human-fidelity-sweep
          path: target/civdyn-human-fidelity-evidence/human-fidelity-sweep.csv
          if-no-files-found: error
          retention-days: 30
