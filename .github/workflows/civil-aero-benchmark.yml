name: civil-aero-benchmark

on:
  push:
    paths:
      - "tools/civil-aero-benchmark/**"
      - ".github/workflows/civil-aero-benchmark.yml"
  pull_request:
    paths:
      - "tools/civil-aero-benchmark/**"
      - ".github/workflows/civil-aero-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-aero-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path tools/civil-aero-benchmark/Cargo.toml --check
      - name: Unit and negative-control tests
        run: cargo test --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic report check
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml -- tools/civil-aero-benchmark/data/example_cases.csv > /tmp/aero-report-a.csv
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml -- tools/civil-aero-benchmark/data/example_cases.csv > /tmp/aero-report-b.csv
          cmp /tmp/aero-report-a.csv /tmp/aero-report-b.csv
          test "$(wc -l < /tmp/aero-report-a.csv)" -eq 4
          grep -q "screening_only" /tmp/aero-report-a.csv
          sha256sum /tmp/aero-report-a.csv
      - name: Matched-mission Pareto and exploitation controls
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin pareto -- tools/civil-aero-benchmark/data/candidate_designs.csv > /tmp/aero-pareto-a.csv 2> /tmp/aero-pareto-a.txt
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin pareto -- tools/civil-aero-benchmark/data/candidate_designs.csv > /tmp/aero-pareto-b.csv 2> /tmp/aero-pareto-b.txt
          cmp /tmp/aero-pareto-a.csv /tmp/aero-pareto-b.csv
          cmp /tmp/aero-pareto-a.txt /tmp/aero-pareto-b.txt
          test "$(wc -l < /tmp/aero-pareto-a.csv)" -eq 5
          grep -q "pareto=balanced_reference;lower_mass_higher_drag;higher_mass_lower_drag" /tmp/aero-pareto-a.txt
          awk -F, '$1 == "dominated_high_drag" { found = 1; if ($9 != "false" || $10 != "false") exit 1 } END { if (!found) exit 1 }' /tmp/aero-pareto-a.csv
          sha256sum /tmp/aero-pareto-a.csv
      - name: Validate evidence manifest without promoting pending sources
        shell: bash
        run: |
          jq -e '
            .manifest_schema == "civil-aero-evidence-manifest/0.1.0" and
            .status == "source_discovery_only" and
            (.sources | length >= 6) and
            all(.sources[];
              (.source_id | type == "string" and length > 0) and
              (.admission_status | type == "string" and length > 0) and
              (if .data_sha256 == null
               then (.admission_status | test("pending|catalog_only"))
               else
                 (.data_sha256 | type == "string" and test("^[0-9a-fA-F]{64}$")) and
                 (.byte_length | type == "number" and . > 0)
               end)
            )
          ' tools/civil-aero-benchmark/data/source_manifest.v0.1.json
