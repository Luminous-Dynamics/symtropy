name: civil-aero-benchmark

on:
  push:
    paths:
      - "tools/civil-aero-benchmark/**"
      - ".github/workflows/civil-aero-benchmark.yml"
  pull_request:
    paths:
      - "tools/civil-aero-benchmark/**"
      - ".github/workflows/civil-aero-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-aero-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path tools/civil-aero-benchmark/Cargo.toml --check
      - name: Unit and negative-control tests
        run: cargo test --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic report check
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml -- tools/civil-aero-benchmark/data/example_cases.csv > /tmp/aero-report-a.csv
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml -- tools/civil-aero-benchmark/data/example_cases.csv > /tmp/aero-report-b.csv
          cmp /tmp/aero-report-a.csv /tmp/aero-report-b.csv
          test "$(wc -l < /tmp/aero-report-a.csv)" -eq 4
          grep -q "screening_only" /tmp/aero-report-a.csv
          sha256sum /tmp/aero-report-a.csv
      - name: Matched-mission Pareto and exploitation controls
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin pareto -- tools/civil-aero-benchmark/data/candidate_designs.csv > /tmp/aero-pareto-a.csv 2> /tmp/aero-pareto-a.txt
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin pareto -- tools/civil-aero-benchmark/data/candidate_designs.csv > /tmp/aero-pareto-b.csv 2> /tmp/aero-pareto-b.txt
          cmp /tmp/aero-pareto-a.csv /tmp/aero-pareto-b.csv
          cmp /tmp/aero-pareto-a.txt /tmp/aero-pareto-b.txt
          test "$(wc -l < /tmp/aero-pareto-a.csv)" -eq 5
          grep -q "pareto=balanced_reference;lower_mass_higher_drag;higher_mass_lower_drag" /tmp/aero-pareto-a.txt
          awk -F, '$1 == "dominated_high_drag" { found = 1; if ($9 != "false" || $10 != "false") exit 1 } END { if (!found) exit 1 }' /tmp/aero-pareto-a.csv
          sha256sum /tmp/aero-pareto-a.csv
      - name: Run deterministic stress-scenario screening
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin robust -- \
            tools/civil-aero-benchmark/data/example_cases.csv \
            tools/civil-aero-benchmark/data/illustrative_stress_scenarios.csv \
            > /tmp/aero-stress-a.csv 2> /tmp/aero-stress-a.txt
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin robust -- \
            tools/civil-aero-benchmark/data/example_cases.csv \
            tools/civil-aero-benchmark/data/illustrative_stress_scenarios.csv \
            > /tmp/aero-stress-b.csv 2> /tmp/aero-stress-b.txt
          cmp /tmp/aero-stress-a.csv /tmp/aero-stress-b.csv
          cmp /tmp/aero-stress-a.txt /tmp/aero-stress-b.txt
          test "$(wc -l < /tmp/aero-stress-a.csv)" -eq 25
          awk -F, 'NF != 16 { exit 1 }' /tmp/aero-stress-a.csv
          grep -q "screening_only" /tmp/aero-stress-a.csv
          grep -q "case=balanced_reference .*robust_screen_pass=true probability=none" /tmp/aero-stress-a.txt
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin robust -- \
            tools/civil-aero-benchmark/data/robustness_negative_control.csv \
            tools/civil-aero-benchmark/data/illustrative_stress_scenarios.csv \
            > /tmp/aero-stress-negative.csv 2> /tmp/aero-stress-negative.txt
          test "$(wc -l < /tmp/aero-stress-negative.csv)" -eq 9
          grep -q "case=borderline_energy .*energy_failures=[1-9].*robust_screen_pass=false probability=none" /tmp/aero-stress-negative.txt
          sha256sum /tmp/aero-stress-a.csv /tmp/aero-stress-negative.csv
      - name: Generate and audit non-flight coupon mesh
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/civil-aero-benchmark/Cargo.toml --bin coupon_mesh -- \
            --chord-mm 100 --span-mm 80 --chordwise 32 --spanwise 4 \
            --out /tmp/civil-aero-coupon.stl \
            --manifest /tmp/civil-aero-coupon.json
          grep -q "solid civil_aero_nonflight_coupon" /tmp/civil-aero-coupon.stl
          bash tools/civil-aero-benchmark/scripts/finalize-coupon-manifest.sh \
            /tmp/civil-aero-coupon.stl /tmp/civil-aero-coupon.json
          jq -e '
            .manifest_schema == "civil-aero-coupon/0.1.0" and
            .watertight_two_manifold == true and
            .orientation_consistent == true and
            .signed_volume_mm3 > 0 and
            (.output_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            .output_sha256_status == "computed_from_exact_stl_bytes" and
            .manufacturing_release == "not_authorized" and
            .flight_use == "prohibited" and
            .airworthiness_or_structural_claim == false
          ' /tmp/civil-aero-coupon.json
      - name: Verify byte-pinned NASA TMR source files
        working-directory: tools/civil-aero-benchmark
        run: sha256sum -c data/reference/nasa-tmr/SHA256SUMS
      - name: Run strict NASA TMR parsers and zone-count oracle
        working-directory: tools/civil-aero-benchmark
        shell: bash
        run: |
          cargo run --locked --bin reference_audit -- > /tmp/aero-reference-audit.txt
          cat /tmp/aero-reference-audit.txt
          grep -q "dataset=NASA-TMR-NACA0012-LADSON-FORCES observations=53 zones=3" /tmp/aero-reference-audit.txt
          grep -q "dataset=NASA-TMR-NACA0012-LADSON-PRESSURE observations=405 zones=9" /tmp/aero-reference-audit.txt
          grep -q "dataset=NASA-TMR-NACA0012-GREGORY-PRESSURE observations=73 zones=3" /tmp/aero-reference-audit.txt
          grep -q "evidence=source_bytes_pinned_parser_output_unqualified" /tmp/aero-reference-audit.txt
      - name: Validate evidence manifest without promoting pending sources
        shell: bash
        run: |
          jq -e '
            .manifest_schema == "civil-aero-evidence-manifest/0.1.0" and
            .status == "source_discovery_only" and
            (.sources | length >= 6) and
            all(.sources[];
              (.source_id | type == "string" and length > 0) and
              (.admission_status | type == "string" and length > 0) and
              (if .data_sha256 == null
               then (.admission_status | test("pending|catalog_only"))
               else
                 (.data_sha256 | type == "string" and test("^[0-9a-fA-F]{64}$")) and
                 (.byte_length | type == "number" and . > 0)
               end)
            )
          ' tools/civil-aero-benchmark/data/source_manifest.v0.1.json
