name: PIRB Synthetic Reference Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/fixtures/peace-infrastructure-resilience-v0.1.json"
      - "docs/schemas/peace-infrastructure-resilience-v0.1.schema.json"
      - "tools/pirb-audit/**"
      - ".github/workflows/pirb-reference-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirb-reference-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Generate standalone dependency lock
        run: cargo generate-lockfile --manifest-path tools/pirb-audit/Cargo.toml

      - name: Check standalone crate formatting
        run: cargo fmt --manifest-path tools/pirb-audit/Cargo.toml -- --check

      - name: Run unit and negative-control tests
        run: cargo test --locked --manifest-path tools/pirb-audit/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/pirb-audit/Cargo.toml --all-targets -- -D warnings

      - name: Execute exact-head schema and corpus audit and verify receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          corpus="docs/fixtures/peace-infrastructure-resilience-v0.1.json"
          schema="docs/schemas/peace-infrastructure-resilience-v0.1.schema.json"
          expected_corpus_sha="$(sha256sum "$corpus" | awk '{print $1}')"
          expected_schema_sha="$(sha256sum "$schema" | awk '{print $1}')"
          cargo run --locked --quiet --manifest-path tools/pirb-audit/Cargo.toml -- \
            --source-commit "$source_commit" > pirb-reference-receipt.json
          dependency_lock_sha="$(sha256sum tools/pirb-audit/Cargo.lock | awk '{print $1}')"
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          jq --arg lock_sha "$dependency_lock_sha" --arg rustc_version "$rustc_version" --arg cargo_version "$cargo_version" '. + {dependency_lock_sha256: $lock_sha, rustc_version: $rustc_version, cargo_version: $cargo_version}' pirb-reference-receipt.json > pirb-reference-receipt.tmp
          mv pirb-reference-receipt.tmp pirb-reference-receipt.json
          jq -e \
            --arg source_commit "$source_commit" \
            --arg corpus_sha "$expected_corpus_sha" \
            --arg schema_sha "$expected_schema_sha" \
            --arg lock_sha "$dependency_lock_sha" \
            --arg rustc_version "$rustc_version" \
            --arg cargo_version "$cargo_version" \
            '
              .result == "pass"
              and .benchmark_version == "PIRB-0.1"
              and .execution_claim == "synthetic_conformance_only"
              and .source_commit == $source_commit
              and (.source_commit | test("^[0-9a-f]{40}$"))
              and .corpus_sha256 == $corpus_sha
              and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
              and .schema_sha256 == $schema_sha
              and (.schema_sha256 | test("^[0-9a-f]{64}$"))
              and .dependency_lock_sha256 == $lock_sha
              and (.dependency_lock_sha256 | test("^[0-9a-f]{64}$"))
              and .rustc_version == $rustc_version
              and .cargo_version == $cargo_version
              and .scenario_count == 12
              and (.scenarios | length == 12)
              and ((.scenarios | map(select(.status != "pass")) | length) == 0)
              and (.findings | length == 0)
            ' pirb-reference-receipt.json

      - name: Upload exact-head synthetic receipt and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: pirb-synthetic-reference-receipt
          path: |
            pirb-reference-receipt.json
            tools/pirb-audit/Cargo.lock
            docs/fixtures/peace-infrastructure-resilience-v0.1.json
            docs/schemas/peace-infrastructure-resilience-v0.1.schema.json
          if-no-files-found: error
          retention-days: 90
