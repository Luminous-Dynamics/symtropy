name: Orbital Projective Acquisition Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-projective-acquisition-bench/**"
      - "docs/research/orbital-truss/fixtures/projective-acquisition-v0_1.json"
      - "docs/research/orbital-truss/orbital_projective_acquisition_corpus_v0_1.schema.json"
      - "docs/research/orbital-truss/orbital_projective_acquisition_v0_1.md"
      - ".github/workflows/orbital-projective-acquisition.yml"
  push:
    branches:
      - "research/orbital-projective-acquisition-v0-1"
    paths:
      - "tools/orbital-projective-acquisition-bench/**"
      - "docs/research/orbital-truss/fixtures/projective-acquisition-v0_1.json"
      - "docs/research/orbital-truss/orbital_projective_acquisition_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-projective-acquisition.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Fixed-point projection bounds and Fraction oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and Draft 2020-12 schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/projective-acquisition-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_projective_acquisition_corpus_v0_1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert len(fixture["cases"]) == 10
          assert len({case["case_id"] for case in fixture["cases"]}) == 10
          print("10 projective acquisition cases and Draft 2020-12 schema validated")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-projective-acquisition-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-projective-acquisition-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-projective-acquisition-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-projective-acquisition-bench/Cargo.toml --bin orbital-projective-acquisition-bench -- docs/research/orbital-truss/fixtures/projective-acquisition-v0_1.json "$GITHUB_SHA" > /tmp/projective-rust-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-projective-acquisition-bench/Cargo.toml --bin orbital-projective-acquisition-bench -- docs/research/orbital-truss/fixtures/projective-acquisition-v0_1.json "$GITHUB_SHA" > /tmp/projective-rust-b.json
          cmp /tmp/projective-rust-a.json /tmp/projective-rust-b.json
      - name: Independent Fraction oracle
        run: |
          python3 tools/orbital-projective-acquisition-bench/tests/reference_oracle.py docs/research/orbital-truss/fixtures/projective-acquisition-v0_1.json "$GITHUB_SHA" > /tmp/projective-python.json
      - name: Compare complete Rust and Python receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/projective-rust-a.json").read_text())
          oracle = json.loads(Path("/tmp/projective-python.json").read_text())
          assert rust == oracle
          assert rust["expected_outcome_matches"] == 10
          assert rust["expected_outcome_mismatches"] == 0
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert cases["PM-007-COMBINED-EXCEEDS"]["status"] == "BUDGET_EXCEEDED"
          assert cases["PM-008-UNKNOWN-MOTION"]["status"] == "INDETERMINATE"
          assert cases["PM-009-FAILED-SUPPORT"]["status"] == "BLOCKED"
          assert cases["PM-010-ZERO-DEPTH"]["status"] == "INVALID_INPUT"
          print("Rust and independent Fraction oracle agree on all 10 projective acquisition cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-projective-acquisition-evidence
          path: |
            /tmp/projective-rust-a.json
            /tmp/projective-python.json
            docs/research/orbital-truss/fixtures/projective-acquisition-v0_1.json
            docs/research/orbital-truss/orbital_projective_acquisition_corpus_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
