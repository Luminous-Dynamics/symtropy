name: A2 R2 Replay-Bound Admission Authority

on:
  pull_request:
    branches: [ "analysis/a1-faceted-qualification-r2-v0.1" ]

permissions:
  contents: write

concurrency:
  group: a2-r2-rederive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: analysis/a2-qualification-admission-r2-v0.1
  PARENT_HEAD: 482aa7ed1f162491fe5cd6bfea4b173ac8e0a65f
  PARENT_TREE: 6e2c3192f86195adf26ca883ef3c485181e05df4
  PARENT_ROOT_MANIFEST_BLOB: 6484e047e059a3ad94f448364444b9d7b0dc0ca6
  PARENT_LOCK_BLOB: 9765aef8fdf10278e70d5120e4115e23aeaba7dc
  A0_MANIFEST_BLOB: f7bb504e0ee4077eb4a3bcfc101ea835c9f7b50f
  A0_SOURCE_BLOB: 30bc76556677556fda1063e806aa2142d080fc67
  A0_PERSISTENCE_BLOB: f596a7539ea245a043149eaa5c32f7d9ba258f33
  A1_MANIFEST_BLOB: 7988c2b950e3d842f247b3239b69da0232525532
  A1_SOURCE_BLOB: c4d9e4dd691957947e81e81c946301f8021e55aa
  LEGACY_A2_HEAD: e9cf89afa3b9c5d4c8061404440b71973545de84
  LEGACY_A2_MANIFEST_BLOB: 534a9c2a2ef6664fb8e3a3a8668e83fa0c36e456
  LEGACY_A2_SOURCE_BLOB: 04a753ae5d16b012bbcba0bc28c32a14d48f619f
  TRANSFORM_BLOB: 24caa3bd98310abd388dc626cbbde7b150535b79
  CARGO_TARGET_DIR: /tmp/symtropy-a2-r2-target

jobs:
  qualify-and-promote:
    name: Rederive A2 on replay-valid A1 and promote exact product
    runs-on: ubuntu-24.04
    steps:
      - name: Check out frozen product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          fetch-depth: 0

      - name: Check out exact legacy A2 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.LEGACY_A2_HEAD }}
          path: legacy-a2
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact runner tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact A1 parent, legacy A2 and transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PARENT_HEAD"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test "$(git -C product hash-object Cargo.toml)" = "$PARENT_ROOT_MANIFEST_BLOB"
          test "$(git -C product hash-object Cargo.lock)" = "$PARENT_LOCK_BLOB"
          test "$(git -C product hash-object crates/domains/symtropy-analysis-contracts/Cargo.toml)" = "$A0_MANIFEST_BLOB"
          test "$(git -C product hash-object crates/domains/symtropy-analysis-contracts/src/lib.rs)" = "$A0_SOURCE_BLOB"
          test "$(git -C product hash-object crates/domains/symtropy-analysis-contracts/src/persistence.rs)" = "$A0_PERSISTENCE_BLOB"
          test "$(git -C product hash-object crates/domains/symtropy-analysis-qualification/Cargo.toml)" = "$A1_MANIFEST_BLOB"
          test "$(git -C product hash-object crates/domains/symtropy-analysis-qualification/src/lib.rs)" = "$A1_SOURCE_BLOB"
          test "$(git -C legacy-a2 rev-parse HEAD)" = "$LEGACY_A2_HEAD"
          test "$(git -C legacy-a2 hash-object crates/domains/symtropy-analysis-admission/Cargo.toml)" = "$LEGACY_A2_MANIFEST_BLOB"
          test "$(git -C legacy-a2 hash-object crates/domains/symtropy-analysis-admission/src/lib.rs)" = "$LEGACY_A2_SOURCE_BLOB"
          test "$(git -C runner-tools hash-object .github/repair/a2_rederive_admission_r2.py)" = "$TRANSFORM_BLOB"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Re-prove exact A0 and A1 parent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo metadata --locked --format-version 1 >/tmp/a2-r2-parent-metadata.json
          cargo fmt -p symtropy-analysis-contracts -p symtropy-analysis-qualification -- --check
          cargo check --locked -p symtropy-analysis-contracts -p symtropy-analysis-qualification --all-targets
          cargo test --locked -p symtropy-analysis-contracts
          cargo test --locked -p symtropy-analysis-contracts --doc
          cargo test --locked -p symtropy-analysis-qualification
          cargo test --locked -p symtropy-analysis-qualification --doc
          cargo test --locked -p symtropy-analysis-contracts tests::canonical_analysis_request_digest_has_frozen_golden_vector -- --exact
          cargo test --locked -p symtropy-analysis-contracts tests::canonical_analysis_evidence_digest_has_frozen_golden_vector -- --exact
          cargo test --locked -p symtropy-analysis-qualification tests::canonical_qualification_profile_digest_has_frozen_golden_vector -- --exact
          cargo test --locked -p symtropy-analysis-qualification tests::canonical_qualification_cut_digest_has_frozen_golden_vector -- --exact
          cargo clippy --locked -p symtropy-analysis-contracts -p symtropy-analysis-qualification --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze parent authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cp Cargo.toml /tmp/a2-r2-root.before
          cp Cargo.lock /tmp/a2-r2-lock.before
          cp crates/domains/symtropy-analysis-contracts/Cargo.toml /tmp/a2-r2-a0-manifest.before
          cp crates/domains/symtropy-analysis-contracts/src/lib.rs /tmp/a2-r2-a0-source.before
          cp crates/domains/symtropy-analysis-contracts/src/persistence.rs /tmp/a2-r2-a0-persistence.before
          cp crates/domains/symtropy-analysis-qualification/Cargo.toml /tmp/a2-r2-a1-manifest.before
          cp crates/domains/symtropy-analysis-qualification/src/lib.rs /tmp/a2-r2-a1-source.before

      - name: Apply exact A2 semantic rederivation
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/a2_rederive_admission_r2.py ../legacy-a2
          cargo fmt -p symtropy-analysis-admission
          cmp crates/domains/symtropy-analysis-contracts/Cargo.toml /tmp/a2-r2-a0-manifest.before
          cmp crates/domains/symtropy-analysis-contracts/src/lib.rs /tmp/a2-r2-a0-source.before
          cmp crates/domains/symtropy-analysis-contracts/src/persistence.rs /tmp/a2-r2-a0-persistence.before
          cmp crates/domains/symtropy-analysis-qualification/Cargo.toml /tmp/a2-r2-a1-manifest.before
          cmp crates/domains/symtropy-analysis-qualification/src/lib.rs /tmp/a2-r2-a1-source.before
          grep -q 'ValidatedAnalysisEvidence' crates/domains/symtropy-analysis-admission/src/lib.rs
          grep -q 'raw_evidence_cannot_admit' crates/domains/symtropy-analysis-admission/src/lib.rs
          ! grep -q 'request: &AnalysisRequest,.*evidence: &AnalysisEvidence' crates/domains/symtropy-analysis-admission/src/lib.rs

      - name: Resolve and prove bounded lock delta
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo metadata --format-version 1 >/tmp/a2-r2-metadata.json
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/a2-r2-lock.before').read_text())
          after = tomllib.loads(Path('Cargo.lock').read_text())
          assert {k:v for k,v in before.items() if k!='package'} == {k:v for k,v in after.items() if k!='package'}
          canon = lambda p: json.dumps(p, sort_keys=True, separators=(',', ':'))
          old = {canon(p) for p in before['package']}
          new = {canon(p) for p in after['package']}
          assert not (old-new), sorted(old-new)
          added = new-old
          assert len(added) == 1, sorted(added)
          package = json.loads(next(iter(added)))
          assert package['name'] == 'symtropy-analysis-admission' and package['version'] == '0.1.0', package
          assert 'source' not in package and 'checksum' not in package, package
          assert sorted(package.get('dependencies', [])) == [
              'serde', 'sha2', 'symtropy-analysis-contracts', 'symtropy-analysis-qualification',
              'symtropy-design', 'symtropy-game-state'
          ], package
          PY
          cargo metadata --locked --format-version 1 >/tmp/a2-r2-locked-metadata.json

      - name: Prove exact four-file product surface
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 - <<'PY'
          import subprocess
          expected={
              ' M Cargo.lock',
              ' M Cargo.toml',
              '?? crates/domains/symtropy-analysis-admission/Cargo.toml',
              '?? crates/domains/symtropy-analysis-admission/src/lib.rs',
          }
          actual=set(subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True).splitlines())
          assert actual == expected, (sorted(actual), sorted(expected))
          PY
          git diff --check -- Cargo.toml Cargo.lock

      - name: Format gate A2
        run: cargo fmt --manifest-path product/Cargo.toml -p symtropy-analysis-admission -- --check

      - name: Check gate A2
        run: cargo check --locked --manifest-path product/Cargo.toml -p symtropy-analysis-admission --all-targets

      - name: Test gate A2
        run: cargo test --locked --manifest-path product/Cargo.toml -p symtropy-analysis-admission

      - name: Compile-fail raw A0 authority gate
        run: cargo test --locked --manifest-path product/Cargo.toml -p symtropy-analysis-admission --doc

      - name: Strict Clippy gate A2
        run: cargo clippy --locked --manifest-path product/Cargo.toml -p symtropy-analysis-admission --all-targets -- -D warnings

      - name: Re-prove A0 and A1 after A2 qualification
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check --locked -p symtropy-analysis-contracts -p symtropy-analysis-qualification --all-targets
          cargo test --locked -p symtropy-analysis-contracts
          cargo test --locked -p symtropy-analysis-contracts --doc
          cargo test --locked -p symtropy-analysis-qualification
          cargo test --locked -p symtropy-analysis-qualification --doc
          cargo clippy --locked -p symtropy-analysis-contracts -p symtropy-analysis-qualification --all-targets -- -D warnings
          cmp crates/domains/symtropy-analysis-contracts/Cargo.toml /tmp/a2-r2-a0-manifest.before
          cmp crates/domains/symtropy-analysis-contracts/src/lib.rs /tmp/a2-r2-a0-source.before
          cmp crates/domains/symtropy-analysis-contracts/src/persistence.rs /tmp/a2-r2-a0-persistence.before
          cmp crates/domains/symtropy-analysis-qualification/Cargo.toml /tmp/a2-r2-a1-manifest.before
          cmp crates/domains/symtropy-analysis-qualification/src/lib.rs /tmp/a2-r2-a1-source.before

      - name: Commit exact qualified A2 product only
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name luminous-qualification-bot
          git config user.email qualification@luminous.invalid
          git add Cargo.lock Cargo.toml crates/domains/symtropy-analysis-admission/Cargo.toml crates/domains/symtropy-analysis-admission/src/lib.rs
          python3 - <<'PY'
          import subprocess
          expected=[
              'Cargo.lock',
              'Cargo.toml',
              'crates/domains/symtropy-analysis-admission/Cargo.toml',
              'crates/domains/symtropy-analysis-admission/src/lib.rs',
          ]
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert actual == expected, (actual, expected)
          PY
          test -z "$(git diff --name-only)"
          git commit -m "feat(analysis): bind admission to replay-valid evidence"
          test "$(git rev-parse HEAD^)" = "$PARENT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "A2_R2_QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "A2_R2_QUALIFIED_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse branch race and push exact qualified A2 head
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$PARENT_HEAD"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          pushed="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)"
          test "$pushed" = "$(git rev-parse HEAD)"
          echo "A2_R2_PROMOTED_HEAD=$pushed"
