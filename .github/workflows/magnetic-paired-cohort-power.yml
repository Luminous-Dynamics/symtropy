name: Magnetic paired cohort power evaluator

on:
  pull_request:
    paths:
      - "research/magnetics/paired-cohort-power/**"
      - "research/magnetics/MAG_PAIRED_COHORT_POWER_2026-11-28.md"
      - ".github/workflows/magnetic-paired-cohort-power.yml"

permissions:
  contents: read

jobs:
  paired-cohort-power:
    name: paired cohort power / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Formatting
        run: cargo fmt --manifest-path research/magnetics/paired-cohort-power/evaluator/Cargo.toml --all -- --check
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/magnetics/paired-cohort-power/evaluator/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path research/magnetics/paired-cohort-power/evaluator/Cargo.toml --all-targets
