name: ECON-05C Live Carrier Identity Qualification

on:
  push:
    branches:
      - "ci/econ-live-carrier-identity-qualification-v0.1"

permissions:
  contents: read

concurrency:
  group: econ-live-carrier-identity-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_HEAD: ecedeede2e09b5ffa701bdad33bdf2e5ca2c830e
  ECON05B_PARENT: dbe6126491beb59dbfee06b30cbd711b2759b92d

jobs:
  qualify:
    name: Frozen ECON-05C / Rust 1.96
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact frozen product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 0

      - name: Assert exact subject and ancestry
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git merge-base --is-ancestor "${ECON05B_PARENT}" "${PRODUCT_HEAD}"
          count="$(git rev-list --count "${ECON05B_PARENT}..${PRODUCT_HEAD}")"
          echo "econ05c_commits_above_parent=${count}"
          test "${count}" = "4"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Freeze source identities
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symtropy-physics/src/body.rs \
            crates/core/symtropy-physics/src/world.rs \
            crates/core/symtropy-bevy-core/src/lib.rs \
            crates/core/symtropy-bevy-scene/src/loader.rs \
            crates/core/symtropy-core/src/carrier_physics.rs \
            crates/core/symtropy-core/src/freight_load.rs \
            crates/core/symtropy-core/src/reserved_lot_isolation.rs \
            crates/core/symtropy-core/src/lib.rs \
            crates/core/symtropy-core/tests/econ_live_carrier_identity.rs \
            crates/core/symtropy-core/ECONOMIC_LIVE_CARRIER_IDENTITY_V01.md \
            > "${RUNNER_TEMP}/econ05c-source-sha256.txt"
          cat "${RUNNER_TEMP}/econ05c-source-sha256.txt"

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check

      - name: Check symtropy-core all targets
        id: check
        run: cargo check -p symtropy-core --locked --all-targets

      - name: Run ECON-05C public carrier-identity corpus
        id: carrier_identity
        run: cargo test -p symtropy-core --locked --test econ_live_carrier_identity

      - name: Run ECON-05B isolation regressions
        id: isolation
        run: cargo test -p symtropy-core --locked --test econ_reserved_lot_isolation

      - name: Run ECON-05A freight-load regressions
        id: freight_load
        run: cargo test -p symtropy-core --locked --test econ_freight_load

      - name: Run ECON-04D handoff regressions
        id: handoff
        run: cargo test -p symtropy-core --locked --test econ_encumbrance_handoff

      - name: Run ECON-04C reconciliation regressions
        id: reservation_reconciliation
        run: cargo test -p symtropy-core --locked --test econ_reservation_reconciliation

      - name: Run ECON-04B reservation regressions
        id: reservation_regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-core --locked --lib stock_reservation::tests
          cargo test -p symtropy-core --locked --test econ_stock_reservation

      - name: Run ECON-04 commodity regressions
        id: commodity_regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-core --locked --lib commodity::tests
          cargo test -p symtropy-core --locked --test econ_commodity_identity

      - name: Run prerequisite ECON regressions
        id: econ_regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-core --locked --lib economic_repartition::tests
          cargo test -p symtropy-core --locked --lib economic_partition::tests
          cargo test -p symtropy-core --locked --lib economic_resolution::tests
          cargo test -p symtropy-core --locked --lib settlement::tests
          cargo test -p symtropy-core --locked --lib financial::tests
          cargo test -p symtropy-core --locked --lib economic::tests

      - name: Run complete symtropy-core library regression
        id: core_tests
        run: cargo test -p symtropy-core --locked --lib

      - name: Run strict symtropy-core Clippy
        id: clippy
        run: cargo clippy -p symtropy-core --locked --all-targets --all-features -- -D warnings

      - name: Audit carrier identity authority boundary
        id: authority_audit
        shell: bash
        run: |
          set -euo pipefail
          source=crates/core/symtropy-core/src/carrier_physics.rs
          contract=crates/core/symtropy-core/ECONOMIC_LIVE_CARRIER_IDENTITY_V01.md

          grep -Fq 'pub struct CarrierPhysicsRef' "${source}"
          grep -Fq 'pub fn resolve_live_carrier' "${source}"
          grep -Fq 'exactly one live body' "${contract}"
          grep -Fq 'creates **no historical movement receipt**' "${contract}"
          grep -Fq 'AmbiguousNetId' "${source}"
          grep -Fq 'IdentityIndexMissing' "${source}"
          grep -Fq 'IdentityIndexMismatch' "${source}"
          grep -Fq 'ReverseIdentityMismatch' "${source}"

          ref_block="$(sed -n '/pub struct CarrierPhysicsRef {/,/^}/p' "${source}")"
          if grep -Fq 'BodyHandle' <<<"${ref_block}"; then
            echo 'CarrierPhysicsRef stores runtime BodyHandle' >&2
            exit 1
          fi
          grep -Fq 'NetId' <<<"${ref_block}"

          if grep -Eq 'Stock(Event|Ledger|Lot)|StockReservation(Event|Ledger)' "${source}"; then
            echo 'carrier identity bridge mutates stock/reservation authority' >&2
            exit 1
          fi
          if grep -Eq 'body\.(transform|position|linear_velocity|angular_velocity)' "${source}"; then
            echo 'carrier identity bridge introduced pose/motion authority' >&2
            exit 1
          fi
          if grep -Eq '\b(route|arrival|eta|distance|speed)_?[a-zA-Z0-9_]*\s*:' "${source}"; then
            echo 'carrier identity bridge introduced route/travel state fields' >&2
            exit 1
          fi

      - name: Assert unchanged frozen subject
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git diff --exit-code -- . ':!Cargo.lock'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SUBJECT: ${{ steps.subject.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CARRIER_IDENTITY: ${{ steps.carrier_identity.outcome }}
          ISOLATION: ${{ steps.isolation.outcome }}
          FREIGHT_LOAD: ${{ steps.freight_load.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
          RECON: ${{ steps.reservation_reconciliation.outcome }}
          RESERVATION: ${{ steps.reservation_regressions.outcome }}
          COMMODITY: ${{ steps.commodity_regressions.outcome }}
          ECON: ${{ steps.econ_regressions.outcome }}
          CORE: ${{ steps.core_tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          AUDIT: ${{ steps.authority_audit.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/econ05c-live-carrier-identity-v01.json"
          export RECEIPT_PATH="${receipt}"
          python3 - <<'PY'
          import json, os, subprocess
          keys = ["SUBJECT","SOURCE","FMT","CHECK","CARRIER_IDENTITY","ISOLATION","FREIGHT_LOAD","HANDOFF","RECON","RESERVATION","COMMODITY","ECON","CORE","CLIPPY","AUDIT","POSTFLIGHT"]
          outcomes = {k.lower(): os.environ.get(k, "unknown") for k in keys}
          def version(cmd):
              try: return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
              except Exception: return "unavailable"
          receipt = {
              "receipt_version": 1,
              "qualification": "ECON-05C-live-carrier-identity-v0.1",
              "product_head": os.environ["PRODUCT_HEAD"],
              "econ05b_parent": os.environ["ECON05B_PARENT"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "rustc_version": version(["rustc", "--version"]),
              "cargo_version": version(["cargo", "--version"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "live fail-closed resolution of ECON carrier AssetId/physical-authority binding through exactly one consistently indexed physics NetId to a runtime-only BodyHandle; no persistence, historical continuity, pose, movement, route, arrival, travel, capacity, settlement, legal, or distributed-consensus authority",
          }
          with open(os.environ["RECEIPT_PATH"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          cp "${RUNNER_TEMP}/econ05c-source-sha256.txt" "${RUNNER_TEMP}/econ05c-source-sha256-evidence.txt" || true
          sha256sum "${receipt}" > "${receipt}.sha256"
          cat "${receipt}"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econ05c-live-carrier-identity-v01-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/econ05c-live-carrier-identity-v01.json
            ${{ runner.temp }}/econ05c-live-carrier-identity-v01.json.sha256
            ${{ runner.temp }}/econ05c-source-sha256-evidence.txt
          if-no-files-found: error
          retention-days: 90
