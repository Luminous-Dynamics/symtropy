name: CivDyn collective-risk resource adapter

on:
  pull_request:
    paths:
      - "research/civdyn-crg-resource-adapter/**"
      - "research/civdyn-collective-risk/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-crg-resource-adapter.yml"
  push:
    paths:
      - "research/civdyn-crg-resource-adapter/**"
      - "research/civdyn-collective-risk/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-crg-resource-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and replay CRG actions through resource ledger
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-crg-resource-adapter/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-crg-resource-adapter/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-crg-resource-adapter/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-crg-resource-adapter/Cargo.toml --all-targets

      - name: Execute the coupled bridge twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-crg-resource-adapter
          cargo run --locked --manifest-path research/civdyn-crg-resource-adapter/Cargo.toml --bin crg-resource-bridge \
            > target/civdyn-crg-resource-adapter/bridge-a.csv
          cargo run --locked --manifest-path research/civdyn-crg-resource-adapter/Cargo.toml --bin crg-resource-bridge \
            > target/civdyn-crg-resource-adapter/bridge-b.csv
          cmp target/civdyn-crg-resource-adapter/bridge-a.csv target/civdyn-crg-resource-adapter/bridge-b.csv
          mv target/civdyn-crg-resource-adapter/bridge-a.csv target/civdyn-crg-resource-adapter/civdyn-crg-resource-bridge.csv
          rm target/civdyn-crg-resource-adapter/bridge-b.csv

      - name: Verify artifact contract and negative controls
        shell: bash
        run: |
          set -euo pipefail
          output=target/civdyn-crg-resource-adapter/civdyn-crg-resource-bridge.csv
          test "$(wc -l < "$output")" -eq 1066
          grep -q '^episode_summary,risk-0.1-all_zero,0.100000000,all_zero' "$output"
          grep -q '^shared_tick,risk-0.1-all_zero,0.100000000,all_zero,,,,,,,,,,,,12.000000000' "$output"
          grep -q '^episode_summary,risk-0.5-all_risk_pivot,0.500000000,all_risk_pivot' "$output"
          grep -q '^episode_summary,risk-0.9-all_fixed_maximum,0.900000000,all_fixed_maximum' "$output"
          echo "CSV rows: $(($(wc -l < "$output") - 1))" >> "$GITHUB_STEP_SUMMARY"
          echo "CSV SHA-256: $(sha256sum "$output" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Repeated execution: byte-identical" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-crg-resource-bridge
          path: target/civdyn-crg-resource-adapter/civdyn-crg-resource-bridge.csv
          if-no-files-found: error
          retention-days: 30
