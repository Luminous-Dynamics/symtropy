name: One-time Rust formatting pass

on:
  push:
    branches: ["research/physical-solver-contract-validator-v0-1"]
    paths:
      - ".github/workflows/one-time-rustfmt.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Format and commit isolated validator
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/physical-solver-contract/Cargo.toml --all
          if git diff --quiet -- tools/physical-solver-contract; then
            echo "Rust formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/physical-solver-contract/src
          git commit -m "style(physics): format receipt physics partition validator"
          git push origin "HEAD:${GITHUB_REF_NAME}"
