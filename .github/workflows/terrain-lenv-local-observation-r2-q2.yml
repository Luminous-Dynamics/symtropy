name: Terrain LENV local observation r2 exact qualification q2

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: terrain-lenv-local-observation-r2-q2
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'ci/terrain-lenv-local-observation-r2-q2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_SHA: b34056f41ecdbe97e5af23ddc17a5daab35dc039
      PARENT_SHA: 346852c0b3490df30b1b34ba96d23cb9cf47e5f3
      PRODUCT_TREE: f22f548cbacf4e8c2a27d59303fe4851f96a51dc
      MODULE: crates/domains/symtropy-terrain/src/environment_observation.rs
      MODULE_BLOB: 814a1fe884df803fbbb5ae65051001cb37811c7e
      LIB: crates/domains/symtropy-terrain/src/lib.rs
      LIB_BLOB: aabe641f7b9a600a888da0f681d1338bab97fbd8
      CARGO_TARGET_DIR: /tmp/terrain-lenv-local-observation-r2-q2-target
      REPORT: /tmp/terrain-lenv-local-observation-r2-q2-qualification.txt

    steps:
      - name: Checkout literal immutable product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact product and inherited qualified surfaces
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          : > "$REPORT"
          rm -rf -- "$CARGO_TARGET_DIR"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD:$MODULE)" = "$MODULE_BLOB"
          test "$(git rev-parse HEAD:$LIB)" = "$LIB_BLOB"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/live_geometry_provider.rs)" = "543858ec733429ac41d39bd52eb2e39210806280"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_currentness.rs)" = "2da7d9b27313ae24b45269171cf58ea6cd528de4"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/live_geometry_query.rs)" = "34995e11c7d82ffa4e18b7fc12927816408e8d1d"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/terrain_metric.rs)" = "5f6cce3dc034c0b8c0e46dc55e599bd6162841ac"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/tests/terrain_metric_public.rs)" = "20029889212d686d08fd92190a6945eb302d3ce5"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/Cargo.toml)" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          expected="$(printf '%s\n' "$MODULE" "$LIB" | sort)"
          actual="$(git diff --name-only "$PARENT_SHA" "$PRODUCT_SHA" | sort)"
          test "$actual" = "$expected"
          test "$(git diff --numstat "$PARENT_SHA" "$PRODUCT_SHA" -- "$LIB")" = $'1\t0\t'"$LIB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e target
          printf 'PASS exact_subject_identity\n' >> "$REPORT"

      - name: Install Linux system dependencies
        id: sysdeps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind toolchain and locked graph
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          test "$(cargo --version | awk '{print $2}')" = "1.96.0"
          before="$(git hash-object Cargo.lock)"
          cargo metadata --locked --format-version 1 > /tmp/terrain-lenv-local-observation-r2-q2-metadata.json
          test "$(git hash-object Cargo.lock)" = "$before"
          printf 'PASS toolchain_and_locked_graph\n' >> "$REPORT"

      - name: Check exact product formatting
        id: format
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.96.0 --edition 2024 --check "$MODULE" "$LIB"
          printf 'PASS exact_product_format\n' >> "$REPORT"

      - name: Compile all Terrain targets
        id: check
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p symtropy-terrain --locked --all-targets
          printf 'PASS all_target_check\n' >> "$REPORT"

      - name: Execute local observation hostile corpus
        id: local_tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked environment_observation::tests -- --nocapture
          printf 'PASS local_observation_hostile_corpus\n' >> "$REPORT"

      - name: Re-execute qualified parent theorem corpora
        id: parent_tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked live_geometry_provider::tests -- --nocapture
          cargo test -p symtropy-terrain --locked geometry_currentness::tests -- --nocapture
          cargo test -p symtropy-terrain --locked live_geometry_query::tests -- --nocapture
          cargo test -p symtropy-terrain --locked --test terrain_metric_public -- --nocapture
          printf 'PASS qualified_parent_corpora\n' >> "$REPORT"

      - name: Execute complete Terrain regression suite
        id: all_tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked --all-targets
          printf 'PASS complete_terrain_regression\n' >> "$REPORT"

      - name: Enforce strict all-target Clippy
        id: clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p symtropy-terrain --locked --all-targets -- -D warnings
          printf 'PASS strict_all_target_clippy\n' >> "$REPORT"

      - name: Audit local-only read authority surface
        id: authority_audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("crates/domains/symtropy-terrain")
          module = (root / "src/environment_observation.rs").read_text()
          prod = module.partition("#[cfg(test)]")[0]
          lib = (root / "src/lib.rs").read_text()
          manifest = (root / "Cargo.toml").read_text()
          if prod.count("pub struct TerrainLocalObservation") != 1:
              raise SystemExit("TerrainLocalObservation definition missing or duplicated")
          block = re.search(r"pub struct TerrainLocalObservation\s*\{(?P<body>.*?)\n\}", prod, flags=re.S)
          if block is None:
              raise SystemExit("TerrainLocalObservation body not found")
          body = block.group("body")
          for required in ("snapshot: TerrainGeometrySnapshot", "receipt: TerrainGeometryQueryReceipt"):
              if required not in body:
                  raise SystemExit(f"missing exact retained field: {required}")
          if "Entity" in body:
              raise SystemExit("Bevy Entity leaked into retained canonical observation")
          for call in (
              "capture_live_terrain_geometry(world, entity)?",
              "verify_live_terrain_geometry_current(world, entity, expected.snapshot())?",
              "snapshot.query(bounds)?",
              "snapshot.query(expected.bounds())?",
          ):
              if call not in prod:
                  raise SystemExit(f"qualified source composition changed: {call}")
          for token in (
              "TerrainMetricProfile", "GlobalTransform", "SubstrateMaterial", "EarthChunk",
              "AuthorityScope", "AuthoritySnapshotToken", "CapabilitySourceRevision",
              "get_mut::<", "world_position",
          ):
              if token in prod:
                  raise SystemExit(f"forbidden authority/input leaked into production adapter: {token}")
          if lib.count("pub mod environment_observation;") != 1:
              raise SystemExit("environment observation export changed")
          if "symtropy-lifesim-core" in manifest or "symtropy_lifesim_core" in prod:
              raise SystemExit("adapter gained dependency on static/unqualified vocabulary")
          print("TERRAIN_LENV_LOCAL_READ_ONLY=PASS")
          PY
          printf 'PASS local_only_read_authority_audit\n' >> "$REPORT"

      - name: Exact immutable-product postflight
        id: postflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e target
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD:$MODULE)" = "$MODULE_BLOB"
          test "$(git rev-parse HEAD:$LIB)" = "$LIB_BLOB"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          test -d "$CARGO_TARGET_DIR"
          printf 'PASS build_outputs_confined_to_external_target\n' >> "$REPORT"
          printf 'PASS immutable_postflight\n' >> "$REPORT"

      - name: Retain exact result receipt
        if: always()
        shell: bash
        run: |
          {
            echo "product_sha=$PRODUCT_SHA"
            echo "product_tree=$PRODUCT_TREE"
            echo "preflight=${{ steps.preflight.outcome }}"
            echo "sysdeps=${{ steps.sysdeps.outcome }}"
            echo "toolchain=${{ steps.toolchain.outcome }}"
            echo "format=${{ steps.format.outcome }}"
            echo "check=${{ steps.check.outcome }}"
            echo "local_tests=${{ steps.local_tests.outcome }}"
            echo "parent_tests=${{ steps.parent_tests.outcome }}"
            echo "all_tests=${{ steps.all_tests.outcome }}"
            echo "clippy=${{ steps.clippy.outcome }}"
            echo "authority_audit=${{ steps.authority_audit.outcome }}"
            echo "postflight=${{ steps.postflight.outcome }}"
          } >> "$REPORT"
          cat "$REPORT"

      - name: Upload exact qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terrain-lenv-local-observation-r2-q2-${{ env.PRODUCT_SHA }}
          path: /tmp/terrain-lenv-local-observation-r2-q2-qualification.txt
          if-no-files-found: error
          retention-days: 30
