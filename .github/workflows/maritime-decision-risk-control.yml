name: Maritime decision-risk control reference

on:
  pull_request:
    paths:
      - "research/maritime-decision-risk-control/**"
      - ".github/workflows/maritime-decision-risk-control.yml"
  push:
    branches:
      - "research/maritime-decision-risk-control-v0-1"
    paths:
      - "research/maritime-decision-risk-control/**"
      - ".github/workflows/maritime-decision-risk-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-decision-risk-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/maritime-decision-risk-control/Cargo.toml --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --all-targets -- -D warnings
      - name: Compile
        run: cargo check --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --all-targets
      - name: Run tests
        run: cargo test --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --all-targets
      - name: Verify deterministic decision-risk receipts
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin decision-risk-audit > /tmp/decision-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin decision-risk-audit > /tmp/decision-risk-replay.csv
          cmp /tmp/decision-risk.csv /tmp/decision-risk-replay.csv
          test "$(wc -l < /tmp/decision-risk.csv)" -eq 3
          head -n 1 /tmp/decision-risk.csv | awk -F, '{ if (NF != 20) exit 1 }'
          grep -q "^MONOTONE_HARD_FAILURE,WHOLE_SCHEDULE,REQUIRE_MONOTONE," /tmp/decision-risk.csv
          grep -q "^NON_MONOTONE_WITH_ENVELOPE,WHOLE_SCHEDULE,MONOTONE_ENVELOPE," /tmp/decision-risk.csv
          grep -q "MARGINAL_EXPECTED_BOUNDED_LOSS,SYNTHETIC_ONLY$" /tmp/decision-risk.csv

          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin non-monotone-risk-audit > /tmp/non-monotone-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin non-monotone-risk-audit > /tmp/non-monotone-risk-replay.csv
          cmp /tmp/non-monotone-risk.csv /tmp/non-monotone-risk-replay.csv
          test "$(wc -l < /tmp/non-monotone-risk.csv)" -eq 4
          head -n 1 /tmp/non-monotone-risk.csv | awk -F, '{ if (NF != 17) exit 1 }'
          grep -q "^N1200_ALPHA200,WHOLE_SCHEDULE,CRC_NM_FINITE_GRID," /tmp/non-monotone-risk.csv
          grep -q "^N120_ALPHA100,WHOLE_SCHEDULE,CRC_NM_FINITE_GRID," /tmp/non-monotone-risk.csv
          grep -q "^N50000_ALPHA100,WHOLE_SCHEDULE,CRC_NM_FINITE_GRID," /tmp/non-monotone-risk.csv
          grep -q "NO_POSITIVE_ADJUSTED_TARGET$" /tmp/non-monotone-risk.csv
          grep -q "SYNTHETIC_ONLY$" /tmp/non-monotone-risk.csv
          echo "Maritime decision-risk and finite-grid non-monotone receipts passed."
