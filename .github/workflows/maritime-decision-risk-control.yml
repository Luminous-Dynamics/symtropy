name: Maritime decision-risk control reference

on:
  pull_request:
    paths:
      - "research/maritime-decision-risk-control/**"
      - ".github/workflows/maritime-decision-risk-control.yml"
  push:
    branches:
      - "research/maritime-decision-risk-control-v0-1"
    paths:
      - "research/maritime-decision-risk-control/**"
      - ".github/workflows/maritime-decision-risk-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-decision-risk-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/maritime-decision-risk-control/Cargo.toml --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --all-targets -- -D warnings
      - name: Compile
        run: cargo check --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --all-targets
      - name: Run tests
        run: cargo test --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --all-targets
      - name: Verify deterministic decision-risk receipts
        run: |
          set -euxo pipefail
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin decision-risk-audit > /tmp/decision-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin decision-risk-audit > /tmp/decision-risk-replay.csv
          cmp /tmp/decision-risk.csv /tmp/decision-risk-replay.csv
          test "$(wc -l < /tmp/decision-risk.csv)" -eq 3
          head -n 1 /tmp/decision-risk.csv | awk -F, '{ if (NF != 20) exit 1 }'
          grep -q "^MONOTONE_HARD_FAILURE,WHOLE_SCHEDULE,REQUIRE_MONOTONE," /tmp/decision-risk.csv
          grep -q "^NON_MONOTONE_WITH_ENVELOPE,WHOLE_SCHEDULE,MONOTONE_ENVELOPE," /tmp/decision-risk.csv
          grep -q "MARGINAL_EXPECTED_BOUNDED_LOSS,SYNTHETIC_ONLY$" /tmp/decision-risk.csv

          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin non-monotone-risk-audit > /tmp/non-monotone-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin non-monotone-risk-audit > /tmp/non-monotone-risk-replay.csv
          cmp /tmp/non-monotone-risk.csv /tmp/non-monotone-risk-replay.csv
          test "$(wc -l < /tmp/non-monotone-risk.csv)" -eq 4
          head -n 1 /tmp/non-monotone-risk.csv | awk -F, '{ if (NF != 17) exit 1 }'
          grep -q "^N1200_ALPHA200,WHOLE_SCHEDULE,CRC_NM_FINITE_GRID," /tmp/non-monotone-risk.csv
          grep -q "^N120_ALPHA100,WHOLE_SCHEDULE,CRC_NM_FINITE_GRID," /tmp/non-monotone-risk.csv
          grep -q "^N50000_ALPHA100,WHOLE_SCHEDULE,CRC_NM_FINITE_GRID," /tmp/non-monotone-risk.csv
          grep -q "NO_POSITIVE_ADJUSTED_TARGET$" /tmp/non-monotone-risk.csv
          grep -q "SYNTHETIC_ONLY$" /tmp/non-monotone-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin weighted-shift-risk-audit > /tmp/weighted-shift-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin weighted-shift-risk-audit > /tmp/weighted-shift-risk-replay.csv
          cmp /tmp/weighted-shift-risk.csv /tmp/weighted-shift-risk-replay.csv
          test "$(wc -l < /tmp/weighted-shift-risk.csv)" -eq 4
          head -n 1 /tmp/weighted-shift-risk.csv | awk -F, '{ if (NF != 16) exit 1 }'
          grep -q "^N120,KNOWN_EXACT_RATIO," /tmp/weighted-shift-risk.csv
          grep -q "^N1200,KNOWN_EXACT_RATIO," /tmp/weighted-shift-risk.csv
          grep -q "^N50000,KNOWN_EXACT_RATIO," /tmp/weighted-shift-risk.csv
          grep -q "UPPER_BOUND_UNINFORMATIVE$" /tmp/weighted-shift-risk.csv
          grep -q "EXPECTED_RISK_BOUND$" /tmp/weighted-shift-risk.csv
          awk -F, '$1=="N1200" { if ($9 != 1 || $10 != 0 || $12 <= $11) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/weighted-shift-risk.csv

          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin lipschitz-risk-audit > /tmp/lipschitz-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin lipschitz-risk-audit > /tmp/lipschitz-risk-replay.csv
          cmp /tmp/lipschitz-risk.csv /tmp/lipschitz-risk-replay.csv
          test "$(wc -l < /tmp/lipschitz-risk.csv)" -eq 7
          head -n 1 /tmp/lipschitz-risk.csv | awk -F, '{ if (NF != 12) exit 1 }'
          awk -F, '$2==10000 { if ($8 >= $7 || $10 != $8) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/lipschitz-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin bernstein-risk-audit > /tmp/bernstein-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin bernstein-risk-audit > /tmp/bernstein-risk-replay.csv
          cmp /tmp/bernstein-risk.csv /tmp/bernstein-risk-replay.csv
          test "$(wc -l < /tmp/bernstein-risk.csv)" -eq 4
          head -n 1 /tmp/bernstein-risk.csv | awk -F, '{ if (NF != 15) exit 1 }'
          grep -q "^120,4,200," /tmp/bernstein-risk.csv
          grep -q "^1200,4,200," /tmp/bernstein-risk.csv
          grep -q "^50000,4,200," /tmp/bernstein-risk.csv
          awk -F, '$1==1200 { if ($6 >= $5 || $7 != $6) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/bernstein-risk.csv
          grep -q "EXPECTED_RISK_BOUND_SYNTHETIC$" /tmp/bernstein-risk.csv

          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin simultaneous-hoeffding-risk-audit > /tmp/simultaneous-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin simultaneous-hoeffding-risk-audit > /tmp/simultaneous-risk-replay.csv
          cmp /tmp/simultaneous-risk.csv /tmp/simultaneous-risk-replay.csv
          test "$(wc -l < /tmp/simultaneous-risk.csv)" -eq 4
          head -n 1 /tmp/simultaneous-risk.csv | awk -F, '{ if (NF != 10) exit 1 }'
          grep -q "^120,4,100," /tmp/simultaneous-risk.csv
          grep -q "^1200,4,100," /tmp/simultaneous-risk.csv
          grep -q "^50000,4,100," /tmp/simultaneous-risk.csv
          grep -q "NO_POLICY_MEETS_TARGET$" /tmp/simultaneous-risk.csv
          grep -q "SIMULTANEOUS_UCB_SYNTHETIC$" /tmp/simultaneous-risk.csv
          awk -F, '$1==50000 { if ($6 != 1 || $7 > 100) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/simultaneous-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin repeated-sampling-risk-audit > /tmp/repeated-sampling-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin repeated-sampling-risk-audit > /tmp/repeated-sampling-risk-replay.csv
          cmp /tmp/repeated-sampling-risk.csv /tmp/repeated-sampling-risk-replay.csv
          test "$(wc -l < /tmp/repeated-sampling-risk.csv)" -eq 21
          head -n 1 /tmp/repeated-sampling-risk.csv | awk -F, '{ if (NF != 27) exit 1 }'
          awk -F, 'NF != 27 { exit 1 }' /tmp/repeated-sampling-risk.csv
          grep -q "MARGINAL_EXPECTED_RISK" /tmp/repeated-sampling-risk.csv
          grep -q "FIXED_GRID_HIGH_PROBABILITY" /tmp/repeated-sampling-risk.csv
          grep -q ",NO_POSITIVE_ADJUSTED_TARGET$" /tmp/repeated-sampling-risk.csv
          awk -F, '$2=="SIMULTANEOUS_HOEFFDING" && $6==200 { if ($8 <= 0 || $9 >= 2000 || $19=="NA") exit 1; found++; } END { if (found != 2) exit 1 }' /tmp/repeated-sampling-risk.csv
          awk -F, '$2=="SIMULTANEOUS_HOEFFDING" && $6==10 { if ($8 != 0 || $9 != 2000 || $25!="NA") exit 1; found++; } END { if (found != 2) exit 1 }' /tmp/repeated-sampling-risk.csv
          cargo run --release --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin repeated-sampling-risk-audit -- --full > /tmp/repeated-sampling-risk-full.csv
          cargo run --release --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin repeated-sampling-risk-audit -- --full > /tmp/repeated-sampling-risk-full-replay.csv
          cmp /tmp/repeated-sampling-risk-full.csv /tmp/repeated-sampling-risk-full-replay.csv
          test "$(wc -l < /tmp/repeated-sampling-risk-full.csv)" -eq 141
          awk -F, 'NF != 27 { exit 1 }' /tmp/repeated-sampling-risk-full.csv
          for n in 50 120 500 1200 5000 10000 50000; do
            awk -F, -v n="$n" '$4==n { count++ } END { if (count != 20) exit 1 }' /tmp/repeated-sampling-risk-full.csv
          done
          awk -F, '$2=="SIMULTANEOUS_HOEFFDING" { count++ } END { if (count != 56) exit 1 }' /tmp/repeated-sampling-risk-full.csv
          grep -q "MARGINAL_EXPECTED_RISK" /tmp/repeated-sampling-risk-full.csv
          grep -q "FIXED_GRID_HIGH_PROBABILITY" /tmp/repeated-sampling-risk-full.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin clustered-dependence-risk-audit > /tmp/clustered-dependence-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin clustered-dependence-risk-audit > /tmp/clustered-dependence-risk-replay.csv
          cmp /tmp/clustered-dependence-risk.csv /tmp/clustered-dependence-risk-replay.csv
          test "$(wc -l < /tmp/clustered-dependence-risk.csv)" -eq 65
          head -n 1 /tmp/clustered-dependence-risk.csv | awk -F, '{ if (NF != 22) exit 1 }'
          awk -F, 'NF != 22 { exit 1 }' /tmp/clustered-dependence-risk.csv
          grep -q "INVALID_IID_PSEUDOREPLICATION_NEGATIVE_CONTROL" /tmp/clustered-dependence-risk.csv
          grep -q "IID_CLUSTERS_SYNTHETIC_ONLY" /tmp/clustered-dependence-risk.csv
          awk -F, '$1=="EXPECTED_RISK_CRC_PROFILE" && $4==50 && $2=="FINITE_SAMPLE_CRC" && $3=="SCHEDULE_ROWS_AS_IID" { if ($13 <= 40) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/clustered-dependence-risk.csv
          awk -F, '$1=="EXPECTED_RISK_CRC_PROFILE" && $4==50 && $2=="FINITE_SAMPLE_CRC" && $3=="INDEPENDENT_CLUSTER_MEANS" { if ($13 > 40) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/clustered-dependence-risk.csv
          awk -F, '$1=="HIGH_PROBABILITY_UCB_PROFILE" && $4==50 && $2=="SIMULTANEOUS_HOEFFDING_UCB" && $3=="SCHEDULE_ROWS_AS_IID" { if ($16 <= 0.05) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/clustered-dependence-risk.csv
          awk -F, '$1=="HIGH_PROBABILITY_UCB_PROFILE" && $4==50 && $2=="SIMULTANEOUS_HOEFFDING_UCB" && $3=="INDEPENDENT_CLUSTER_MEANS" { if ($11 != 0 || $12 != 2000 || $19 != "NA") exit 1; found=1 } END { if (!found) exit 1 }' /tmp/clustered-dependence-risk.csv
          awk -F, '$1=="HIGH_PROBABILITY_UCB_PROFILE" && $4==2000 && $2=="SIMULTANEOUS_HOEFFDING_UCB" && $3=="INDEPENDENT_CLUSTER_MEANS" { if ($11 <= 0 || $16 != 0) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/clustered-dependence-risk.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin source-claim-admission-audit > /tmp/source-claim-admission.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin source-claim-admission-audit > /tmp/source-claim-admission-replay.csv
          cmp /tmp/source-claim-admission.csv /tmp/source-claim-admission-replay.csv
          test "$(wc -l < /tmp/source-claim-admission.csv)" -eq 22
          head -n 1 /tmp/source-claim-admission.csv | awk -F, '{ if (NF != 7) exit 1 }'
          awk -F, 'NF != 7 { exit 1 }' /tmp/source-claim-admission.csv
          grep -q "SOURCE_CLASS_DOES_NOT_SUPPORT_CLAIM" /tmp/source-claim-admission.csv
          grep -q "PUBLICATION_TIME_UNKNOWN" /tmp/source-claim-admission.csv
          grep -q "EVIDENCE_UNAVAILABLE_AT_AS_OF_CUTOFF" /tmp/source-claim-admission.csv
          grep -q "INDEPENDENCE_REFERENCE_MISSING" /tmp/source-claim-admission.csv
          grep -q "RECEIVER_CUSTODY_DIGEST_MISSING" /tmp/source-claim-admission.csv
          grep -q "EVENT_TIME_UNKNOWN" /tmp/source-claim-admission.csv
          grep -q "NOTICE_ONLY" /tmp/source-claim-admission.csv
          grep -q "THIRD_PARTY_DERIVED_ONLY" /tmp/source-claim-admission.csv
          grep -q "INTEROPERABILITY_ONLY" /tmp/source-claim-admission.csv
          grep -q "RECEIVER_ACCEPTANCE" /tmp/source-claim-admission.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin dcsa-maturity-audit > /tmp/dcsa-maturity.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin dcsa-maturity-audit > /tmp/dcsa-maturity-replay.csv
          cmp /tmp/dcsa-maturity.csv /tmp/dcsa-maturity-replay.csv
          test "$(wc -l < /tmp/dcsa-maturity.csv)" -eq 12
          head -n 1 /tmp/dcsa-maturity.csv | awk -F, '{ if (NF != 7) exit 1 }'
          awk -F, 'NF != 7 { exit 1 }' /tmp/dcsa-maturity.csv
          grep -q "ESTIMATED_ONLY" /tmp/dcsa-maturity.csv
          grep -q "REQUESTED_ONLY" /tmp/dcsa-maturity.csv
          grep -q "PLANNED_ONLY" /tmp/dcsa-maturity.csv
          grep -q "SOURCE_REPORTED_ACTUAL_ONLY" /tmp/dcsa-maturity.csv
          grep -q "UNKNOWN_CLASSIFIER" /tmp/dcsa-maturity.csv
          grep -q "WRONG_STANDARD_VERSION" /tmp/dcsa-maturity.csv
          grep -q "EVENT_TIME_UNKNOWN" /tmp/dcsa-maturity.csv
          grep -q "PUBLICATION_TIME_UNKNOWN" /tmp/dcsa-maturity.csv
          grep -q "PUBLICATION_AFTER_RETRIEVAL" /tmp/dcsa-maturity.csv
          echo "c9d2b17e1ef041bb6787849eda725021502d9822ab4b6980f357152dd9016e96  research/maritime-service-chain-benchmark/dcsa-epcis-crosswalk-v1.0.0.toml" | sha256sum --check
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin cross-standard-mapping-audit > /tmp/cross-standard-mapping.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin cross-standard-mapping-audit > /tmp/cross-standard-mapping-replay.csv
          cmp /tmp/cross-standard-mapping.csv /tmp/cross-standard-mapping-replay.csv
          test "$(wc -l < /tmp/cross-standard-mapping.csv)" -eq 26
          head -n 1 /tmp/cross-standard-mapping.csv | awk -F, '{ if (NF != 13) exit 1 }'
          awk -F, 'NF != 13 { exit 1 }' /tmp/cross-standard-mapping.csv
          grep -q "DCSA_CLASSIFIER_CANNOT_MAP_TO_BIZSTEP" /tmp/cross-standard-mapping.csv
          grep -q "DCSA_CLASSIFIER_CANNOT_MAP_TO_DISPOSITION" /tmp/cross-standard-mapping.csv
          grep -q "CONTEXTUAL" /tmp/cross-standard-mapping.csv
          grep -q "LOSSY" /tmp/cross-standard-mapping.csv
          grep -q "NONEXACT_MAPPING_CLAIMS_REVERSIBILITY" /tmp/cross-standard-mapping.csv
          grep -q "INVALID_SOURCE_PAYLOAD_DIGEST" /tmp/cross-standard-mapping.csv
          grep -q "MAPPING_RULE_NOT_APPROVED" /tmp/cross-standard-mapping.csv
          grep -q "INVALID_TARGET_VOCABULARY_VALUE" /tmp/cross-standard-mapping.csv
          grep -q "EXACT_MAPPING_VALUE_CHANGED" /tmp/cross-standard-mapping.csv
          grep -q "SOURCE_SUBJECT_IDENTITY_MISSING" /tmp/cross-standard-mapping.csv
          grep -q "SOURCE_PAYLOAD_REFERENCE_MISSING" /tmp/cross-standard-mapping.csv
          grep -q "SOURCE_PAYLOAD_REFERENCE_MISMATCH" /tmp/cross-standard-mapping.csv
          grep -q "MAPPING_BUNDLE_REFERENCE_MISSING" /tmp/cross-standard-mapping.csv
          grep -q "MAPPING_BUNDLE_REFERENCE_MISMATCH" /tmp/cross-standard-mapping.csv
          grep -q "SYNTHETIC_RULE_USED_FOR_NON_SYNTHETIC_SOURCE" /tmp/cross-standard-mapping.csv
          grep -q "SOURCE_EVENT_FAMILY_MISMATCH" /tmp/cross-standard-mapping.csv
          grep -q "TARGET_VOCABULARY_VERSION_MISMATCH" /tmp/cross-standard-mapping.csv
          grep -q "EXTERNAL_APPROVAL_RECORD_MISSING" /tmp/cross-standard-mapping.csv
          grep -q "GS1-EPCIS-2.0.1" /tmp/cross-standard-mapping.csv
          grep -q "GS1-CBV-2.0.0" /tmp/cross-standard-mapping.csv
          grep -q "SYNTHETIC_FIXTURE_ONLY" /tmp/cross-standard-mapping.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin epcis-correction-audit > /tmp/epcis-corrections.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin epcis-correction-audit > /tmp/epcis-corrections-replay.csv
          cmp /tmp/epcis-corrections.csv /tmp/epcis-corrections-replay.csv
          test "$(wc -l < /tmp/epcis-corrections.csv)" -eq 7
          head -n 1 /tmp/epcis-corrections.csv | awk -F, '{ if (NF != 7) exit 1 }'
          awk -F, 'NF != 7 { exit 1 }' /tmp/epcis-corrections.csv
          grep -q "AS_REPORTED" /tmp/epcis-corrections.csv
          grep -q "DECLARED_IN_ERROR" /tmp/epcis-corrections.csv
          grep -q "CORRECTIVE_EVENT_AVAILABLE" /tmp/epcis-corrections.csv
          grep -q "SUBJECT_MISMATCH_REJECTED" /tmp/epcis-corrections.csv
          grep -q "PAYLOAD_MISMATCH_REJECTED" /tmp/epcis-corrections.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin service-variability-audit > /tmp/service-variability.csv
          cargo run --quiet --locked --manifest-path research/maritime-decision-risk-control/Cargo.toml --bin service-variability-audit > /tmp/service-variability-replay.csv
          cmp /tmp/service-variability.csv /tmp/service-variability-replay.csv
          test "$(wc -l < /tmp/service-variability.csv)" -eq 8
          head -n 1 /tmp/service-variability.csv | awk -F, '{ if (NF != 24) exit 1 }'
          awk -F, 'NF != 24 { exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="MEAN_MATCHED_STABLE" { if ($5 != 100 || $8 != 100 || $13 != 1000) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="MEAN_MATCHED_HIGH_VARIABILITY" { if ($5 != 100 || $8 != 280 || $13 != 900 || $15 != 20) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="MEAN_MATCHED_STABLE" { if ($16 != 0 || $17 != 0 || $18 != 1170) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="MEAN_MATCHED_HIGH_VARIABILITY" { if ($16 != 260 || $17 != 2680 || $18 != 300) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="LOCAL_PORT_GAIN_NO_RECEIVER_GAIN" { if ($3 >= 130 || $5 != 150) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="RECEIVER_REGRESSION" { if ($3 >= 130 || $5 != 190 || $13 != 0) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="FAIRNESS_COHORT_FLOOR_HIDDEN_BY_AGGREGATE" { if ($5 != 100 || $13 != 900 || $14 != 1) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          awk -F, '$1=="EXPECTED_UNITS_WITH_UNRESOLVED_DELIVERY" { if ($2 != 20 || $13 != 900 || $19 != 18 || $20 != 1 || $23 != 1) exit 1; found=1 } END { if (!found) exit 1 }' /tmp/service-variability.csv
          echo "Maritime repeated-sampling risk tournament smoke receipt passed."
          echo "Maritime decision-risk and finite-grid non-monotone receipts passed."

      - name: Hash exact deterministic receipts
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          printf "head_sha=%s\nrun_id=%s\n" "$EXACT_HEAD_SHA" "$GITHUB_RUN_ID" > /tmp/maritime-receipt-manifest.txt
          sha256sum \
            /tmp/decision-risk.csv \
            /tmp/non-monotone-risk.csv \
            /tmp/weighted-shift-risk.csv \
            /tmp/lipschitz-risk.csv \
            /tmp/bernstein-risk.csv \
            /tmp/simultaneous-risk.csv \
            /tmp/repeated-sampling-risk.csv \
            /tmp/repeated-sampling-risk-full.csv \
            /tmp/clustered-dependence-risk.csv \
            /tmp/source-claim-admission.csv \
            /tmp/epcis-corrections.csv \
            /tmp/dcsa-maturity.csv \
            /tmp/cross-standard-mapping.csv \
            /tmp/service-variability.csv \
            research/maritime-service-chain-benchmark/dcsa-epcis-crosswalk-v1.0.0.toml \
            > /tmp/maritime-receipt-sha256.txt

      - name: Upload reproducible maritime risk receipts
        uses: actions/upload-artifact@v4
        with:
          name: maritime-risk-receipts-${{ github.event.pull_request.number || github.run_number }}
          path: |
            /tmp/maritime-receipt-manifest.txt
            /tmp/maritime-receipt-sha256.txt
            /tmp/decision-risk.csv
            /tmp/non-monotone-risk.csv
            /tmp/weighted-shift-risk.csv
            /tmp/lipschitz-risk.csv
            /tmp/bernstein-risk.csv
            /tmp/simultaneous-risk.csv
            /tmp/repeated-sampling-risk.csv
            /tmp/repeated-sampling-risk-full.csv
            /tmp/clustered-dependence-risk.csv
            /tmp/source-claim-admission.csv
            /tmp/epcis-corrections.csv
            /tmp/dcsa-maturity.csv
            /tmp/cross-standard-mapping.csv
            /tmp/service-variability.csv
            research/maritime-service-chain-benchmark/dcsa-epcis-crosswalk-v1.0.0.toml
          if-no-files-found: error
          retention-days: 30
