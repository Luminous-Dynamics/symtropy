name: Matched 3D pHDAE and RATTLE dumbbell campaign

on:
  pull_request:
    paths:
      - "tools/dumbbell-matched-3d-campaign/**"
      - "tools/dumbbell-rattle-3d-reference/**"
      - "tools/phdae-dumbbell-3d-reference/**"
      - "docs/research/DUMBBELL_SO3_MATCHED_PHDAE_RATTLE_2026-10-31.md"
      - ".github/workflows/dumbbell-so3-matched-campaign.yml"
  push:
    branches:
      - "research/dumbbell-so3-rattle-matched-2026-10-31"

permissions:
  contents: read

jobs:
  matched-so3-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Check formatting
        run: |
          rustup run 1.96.0 rustfmt --edition 2021 --check tools/phdae-dumbbell-3d-reference/constrained_dumbbell_3d.rs
          rustup run 1.96.0 rustfmt --edition 2021 --check tools/dumbbell-rattle-3d-reference/cartesian_rattle_3d.rs
          rustup run 1.96.0 rustfmt --edition 2021 --check tools/dumbbell-matched-3d-campaign/compare_dumbbell_3d_solvers.rs

      - name: Compile and run warning-denied tests
        run: |
          rustup run 1.96.0 rustc --edition 2021 --test -D warnings \
            tools/dumbbell-matched-3d-campaign/compare_dumbbell_3d_solvers.rs \
            -o /tmp/dumbbell-so3-campaign-tests
          /tmp/dumbbell-so3-campaign-tests

      - name: Compile optimized campaign and verify deterministic CSV
        run: |
          rustup run 1.96.0 rustc --edition 2021 -O -D warnings \
            tools/dumbbell-matched-3d-campaign/compare_dumbbell_3d_solvers.rs \
            -o /tmp/dumbbell-so3-campaign
          /tmp/dumbbell-so3-campaign > /tmp/dumbbell-so3-a.csv
          /tmp/dumbbell-so3-campaign > /tmp/dumbbell-so3-b.csv
          cmp /tmp/dumbbell-so3-a.csv /tmp/dumbbell-so3-b.csv
          test "$(wc -l < /tmp/dumbbell-so3-a.csv)" -eq 9
          grep -q "^semi_explicit_phdae_dg_3d," /tmp/dumbbell-so3-a.csv
          grep -q "^cartesian_rattle_3d," /tmp/dumbbell-so3-a.csv
