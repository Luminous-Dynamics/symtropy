name: One-shot Rust 1.96 formatting (shipyard twin commissioning)

on:
  push:
    branches:
      - "research/shipyard-twin-commissioning-v0-1"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Apply pinned rustfmt to isolated workspace
        run: cargo fmt --manifest-path crates/tools/shipyard-twin-commissioning/Cargo.toml --all

      - name: Commit formatter-only changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- crates/tools/shipyard-twin-commissioning/src/main.rs; then
            echo "Rust source already matches rustfmt 1.96"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tools/shipyard-twin-commissioning/src/main.rs
          git commit -m "style: apply Rust 1.96 formatting to twin commissioning"
          git push origin "HEAD:${TARGET_BRANCH}"
