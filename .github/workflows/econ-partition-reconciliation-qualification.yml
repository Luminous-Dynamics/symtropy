name: ECON-03B Partition Reconciliation Qualification

on:
  push:
    branches:
      - "ci/econ-partition-reconciliation-qualification-v0.1"

permissions:
  contents: read

concurrency:
  group: econ-partition-reconciliation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PRODUCT_HEAD: 97b1be1c58577349af8586fc1a56118d7034419b
  ECON03_PARENT: 3f822df416ba409966171cb4dccc22fb1c27c6fd

jobs:
  qualify:
    name: Frozen ECON-03B / Rust 1.96
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact frozen product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 0

      - name: Assert exact subject and stack ancestry
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git merge-base --is-ancestor "${ECON03_PARENT}" "${PRODUCT_HEAD}"
          count="$(git rev-list --count "${ECON03_PARENT}..${PRODUCT_HEAD}")"
          echo "econ03b_commits_above_parent=${count}"
          test "${count}" = "4"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Freeze source identities
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symtropy-core/src/economic.rs \
            crates/core/symtropy-core/src/financial.rs \
            crates/core/symtropy-core/src/settlement.rs \
            crates/core/symtropy-core/src/economic_resolution.rs \
            crates/core/symtropy-core/src/economic_partition.rs \
            crates/core/symtropy-core/src/lib.rs \
            crates/core/symtropy-core/ECONOMIC_STOCK_LEDGER_V01.md \
            crates/core/symtropy-core/ECONOMIC_FINANCIAL_LEDGER_V01.md \
            crates/core/symtropy-core/ECONOMIC_MONETARY_SETTLEMENT_V01.md \
            crates/core/symtropy-core/ECONOMIC_RESOLUTION_CONSERVATION_V01.md \
            crates/core/symtropy-core/ECONOMIC_PARTITION_RECONCILIATION_V01.md \
            > "${RUNNER_TEMP}/econ03b-source-sha256.txt"
          cat "${RUNNER_TEMP}/econ03b-source-sha256.txt"

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check

      - name: Check symtropy-core all targets
        id: check
        run: cargo check -p symtropy-core --locked --all-targets

      - name: Run ECON-03B partition theorem corpus
        id: econ03b_tests
        run: cargo test -p symtropy-core --locked --lib economic_partition::tests

      - name: Run ECON-03 resolution regression corpus
        id: econ03_tests
        run: cargo test -p symtropy-core --locked --lib economic_resolution::tests

      - name: Run ECON-02B settlement regression corpus
        id: econ02b_tests
        run: cargo test -p symtropy-core --locked --lib settlement::tests

      - name: Run ECON-02 financial regression corpus
        id: econ02_tests
        run: cargo test -p symtropy-core --locked --lib financial::tests

      - name: Run ECON-00/01 stock regression corpus
        id: econ01_tests
        run: cargo test -p symtropy-core --locked --lib economic::tests

      - name: Run complete symtropy-core library regression
        id: core_tests
        run: cargo test -p symtropy-core --locked --lib

      - name: Run strict symtropy-core Clippy
        id: clippy
        run: cargo clippy -p symtropy-core --locked --all-targets --all-features -- -D warnings

      - name: Audit partition authority surface
        id: authority_audit
        shell: bash
        run: |
          set -euo pipefail
          source=crates/core/symtropy-core/src/economic_partition.rs
          contract=crates/core/symtropy-core/ECONOMIC_PARTITION_RECONCILIATION_V01.md

          grep -Fq 'pub struct EconomicPartitionPlan' "${source}"
          grep -Fq 'stock_assignments' "${source}"
          grep -Fq 'account_assignments' "${source}"
          grep -Fq 'SharedGlobalEconomicState' "${source}"
          grep -Fq 'DuplicateAuthoritativeStock' "${source}"
          grep -Fq 'DuplicateAuthoritativeAccount' "${source}"
          grep -Fq 'NonCanonicalPartitionStock' "${source}"
          grep -Fq 'NonCanonicalPartitionAccounts' "${source}"
          grep -Fq 'PartitionReconciliationMismatch' "${source}"
          grep -Fq 'reconstruct(authoritative partitions + shared-global state)' "${contract}"
          grep -Fq '100 currency units globally' "${contract}"
          grep -Fq 'duplicated observations are allowed; duplicated ownership/claims are not.' "${contract}"

          if grep -Eq 'pub[[:space:]]+fn[[:space:]]+set_(currency|supply|stock|account)' "${source}"; then
            echo 'forbidden generic partition authority setter found' >&2
            exit 1
          fi

      - name: Assert unchanged frozen subject
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git diff --exit-code -- . ':!Cargo.lock'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          ECON03B_OUTCOME: ${{ steps.econ03b_tests.outcome }}
          ECON03_OUTCOME: ${{ steps.econ03_tests.outcome }}
          ECON02B_OUTCOME: ${{ steps.econ02b_tests.outcome }}
          ECON02_OUTCOME: ${{ steps.econ02_tests.outcome }}
          ECON01_OUTCOME: ${{ steps.econ01_tests.outcome }}
          CORE_OUTCOME: ${{ steps.core_tests.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          AUTHORITY_OUTCOME: ${{ steps.authority_audit.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/econ03b-partition-reconciliation-v01.json"
          export RECEIPT_PATH="${receipt}"
          python3 - <<'PY'
          import json, os, subprocess

          outcomes = {
              "subject": os.environ.get("SUBJECT_OUTCOME", "unknown"),
              "source_identity": os.environ.get("SOURCE_OUTCOME", "unknown"),
              "fmt": os.environ.get("FMT_OUTCOME", "unknown"),
              "check": os.environ.get("CHECK_OUTCOME", "unknown"),
              "econ03b_tests": os.environ.get("ECON03B_OUTCOME", "unknown"),
              "econ03_tests": os.environ.get("ECON03_OUTCOME", "unknown"),
              "econ02b_tests": os.environ.get("ECON02B_OUTCOME", "unknown"),
              "econ02_tests": os.environ.get("ECON02_OUTCOME", "unknown"),
              "econ01_tests": os.environ.get("ECON01_OUTCOME", "unknown"),
              "core_tests": os.environ.get("CORE_OUTCOME", "unknown"),
              "clippy": os.environ.get("CLIPPY_OUTCOME", "unknown"),
              "authority_audit": os.environ.get("AUTHORITY_OUTCOME", "unknown"),
              "postflight": os.environ.get("POSTFLIGHT_OUTCOME", "unknown"),
          }

          def version(command):
              try:
                  return subprocess.check_output(command, text=True, stderr=subprocess.STDOUT).strip()
              except Exception:
                  return "unavailable"

          receipt = {
              "receipt_version": 1,
              "qualification": "ECON-03B-economic-partition-reconciliation-v0.1",
              "product_head": os.environ["PRODUCT_HEAD"],
              "econ03_parent": os.environ["ECON03_PARENT"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "scope": "symtropy-core ECON-03B partition/merge reconciliation plus complete earlier ECON and core library regressions",
              "declared_rust_toolchain": "1.96.0",
              "rustc_version": version(["rustc", "--version"]),
              "cargo_version": version(["cargo", "--version"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "authoritative stock/account partition uniqueness plus canonical partition-local order, single shared-global currency/history and exact manifest reconstruction only; no geographic partition correctness, distributed locking/consensus, cross-host atomic commit, live migration, or logistics authority",
          }
          with open(os.environ["RECEIPT_PATH"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          cp "${RUNNER_TEMP}/econ03b-source-sha256.txt" "${RUNNER_TEMP}/econ03b-source-sha256-evidence.txt" || true
          sha256sum "${receipt}" > "${receipt}.sha256"
          cat "${receipt}"
          cat "${receipt}.sha256"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econ03b-partition-reconciliation-v01-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/econ03b-partition-reconciliation-v01.json
            ${{ runner.temp }}/econ03b-partition-reconciliation-v01.json.sha256
            ${{ runner.temp }}/econ03b-source-sha256-evidence.txt
          if-no-files-found: error
          retention-days: 90
