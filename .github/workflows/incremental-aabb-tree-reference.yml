name: Incremental AABB Tree Reference

on:
  pull_request:
    branches: [main, "research/incremental-aabb-tree-reference-v0.1"]
    paths:
      - "research/incremental-aabb-tree-reference/v0.1/**"
      - ".github/workflows/incremental-aabb-tree-reference.yml"
  push:
    branches: [main, "research/incremental-aabb-tree-reference-v0.1", "research/incremental-aabb-tree-balanced-v0.1"]
    paths:
      - "research/incremental-aabb-tree-reference/v0.1/**"
      - ".github/workflows/incremental-aabb-tree-reference.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 incremental AABB tree reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/incremental-aabb-tree-reference/v0.1/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/incremental-aabb-tree-reference/v0.1/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/incremental-aabb-tree-reference/v0.1/Cargo.toml --locked --all-targets -- -D warnings
