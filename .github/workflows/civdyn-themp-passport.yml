name: CivDyn THEMP theory-empirics passport

on:
  pull_request:
    paths:
      - "research/civdyn-themp/**"
      - ".github/workflows/civdyn-themp-passport.yml"
  push:
    paths:
      - "research/civdyn-themp/**"
      - ".github/workflows/civdyn-themp-passport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute THEMP passport auditor
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-themp/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-themp/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-themp/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-themp/Cargo.toml --all-targets

      - name: Execute theory-empirics passport conformance sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-themp-evidence
          cargo run --locked --manifest-path research/civdyn-themp/Cargo.toml --bin themp-passport-sweep \
            | tee target/civdyn-themp-evidence/themp-passport-sweep.csv

      - name: Verify evidence roles, holdout separation and claim classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-themp-evidence/themp-passport-sweep.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert all(len(row) == 14 for row in rows)
          summaries = {row["scenario_id"]: row for row in rows if row["record_type"] == "summary"}
          assert set(summaries) == {
              "reference",
              "calibration_holdout_leakage",
              "unoperationalized_construct",
              "mechanism_without_falsifier",
              "model_inference_as_external_validation",
          }
          assert summaries["reference"]["error_count"] == "0"
          assert summaries["reference"]["severity"] == "none"

          findings = {
              row["scenario_id"]: {item["finding_code"] for item in rows
                                   if item["record_type"] == "finding"
                                   and item["scenario_id"] == row["scenario_id"]}
              for row in summaries.values()
          }
          assert "calibration_external_partition_leakage" in findings["calibration_holdout_leakage"]
          assert "construct_not_operationalized" in findings["unoperationalized_construct"]
          assert "mechanism_explanation_incomplete" in findings["mechanism_without_falsifier"]
          assert "non_empirical_external_validation" in findings["model_inference_as_external_validation"]

          assert all(
              summaries[name]["error_count"] != "0"
              for name in (
                  "calibration_holdout_leakage",
                  "unoperationalized_construct",
                  "mechanism_without_falsifier",
                  "model_inference_as_external_validation",
              )
          )
          assert all(int(row["checked_constructs"]) == 3 for row in summaries.values())
          assert all(int(row["checked_mechanisms"]) == 1 for row in summaries.values())

          print("CIVDYN-THEMP-001 verifies theory/evidence structure, operationalization, falsifiers, alternative explanations and held-out evidence separation.")
          PY

          {
            echo "## CIVDYN-THEMP-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-themp-evidence/themp-passport-sweep.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic passport conformance only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload THEMP passport evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-themp-passport-sweep
          path: target/civdyn-themp-evidence/themp-passport-sweep.csv
          if-no-files-found: error
          retention-days: 30
