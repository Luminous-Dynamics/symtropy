name: Discrete Passivity Energy Budget Reference

on:
  push:
    paths:
      - "benchmarks/synthetic-joints/discrete-passivity/v0.1/**"
      - ".github/workflows/discrete-passivity-energy-budget.yml"
  pull_request:
    paths:
      - "benchmarks/synthetic-joints/discrete-passivity/v0.1/**"
      - ".github/workflows/discrete-passivity-energy-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discrete-passivity-energy-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/synthetic-joints/discrete-passivity/v0.1/Cargo.toml -- --check

      - name: Run discrete passivity tests
        run: cargo test --manifest-path benchmarks/synthetic-joints/discrete-passivity/v0.1/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/synthetic-joints/discrete-passivity/v0.1/Cargo.toml --all-targets --locked -- -D warnings
