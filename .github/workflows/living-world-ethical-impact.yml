name: Living World Ethical Impact

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "research/living-world-ethical-impact/**"
      - "research/living-world-ethical-impact-validator/**"
      - ".github/workflows/living-world-ethical-impact.yml"
  push:
    branches: [ "main" ]
    paths:
      - "research/living-world-ethical-impact/**"
      - "research/living-world-ethical-impact-validator/**"
      - ".github/workflows/living-world-ethical-impact.yml"
  workflow_dispatch:

concurrency:
  group: living-world-ethical-impact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --manifest-path research/living-world-ethical-impact-validator/Cargo.toml --all -- --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path research/living-world-ethical-impact-validator/Cargo.toml --all-targets -- -D warnings

      - name: Run conformance tests
        run: cargo test --manifest-path research/living-world-ethical-impact-validator/Cargo.toml --all-targets

      - name: Run deterministic report
        run: cargo run --manifest-path research/living-world-ethical-impact-validator/Cargo.toml
