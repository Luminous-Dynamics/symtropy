name: Coupled contact stack build qualification

on:
  pull_request:
    paths:
      - "crates/core/symtropy-physics/**"
      - "crates/core/symtropy-math/**"
      - "crates/core/symtropy-consciousness-physics/**"
      - ".github/workflows/coupled-contact-stack-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coupled-contact-stack-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physics-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Clippy all physics package targets and features
        run: cargo clippy -p symtropy-physics --all-targets --all-features --locked -- -D warnings
      - name: Run math, rigid-body physics, and consciousness physics library tests
        run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib --locked
      - name: Check complete rigid-body physics package
        run: cargo check -p symtropy-physics --all-targets --all-features --locked
