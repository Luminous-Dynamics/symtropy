name: construction-power-envelope

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/construction-power-envelope/**"
      - ".github/workflows/construction-power-envelope.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/construction-power-envelope/**"
      - ".github/workflows/construction-power-envelope.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-power-envelope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/construction-power-envelope/Cargo.toml -- --check
      - name: Test time-resolved campaign evaluator
        run: cargo test --locked --manifest-path benchmarks/construction-power-envelope/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path benchmarks/construction-power-envelope/Cargo.toml --all-targets -- -D warnings
