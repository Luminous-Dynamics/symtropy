name: Thermodynamic temporal fairness

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/thermo-temporal-fairness/**"
      - ".github/workflows/thermo-temporal-fairness.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/thermo-temporal-fairness/**"
      - ".github/workflows/thermo-temporal-fairness.yml"

permissions:
  contents: read

jobs:
  temporal-fairness:
    name: Temporal fairness metrics (Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Format check
        run: cargo fmt --manifest-path tools/thermo-temporal-fairness/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --manifest-path tools/thermo-temporal-fairness/Cargo.toml
      - name: Audit alternating trace
        run: cargo run --quiet --manifest-path tools/thermo-temporal-fairness/Cargo.toml -- --audit tools/thermo-temporal-fairness/fixtures/alternating.tsv
      - name: Audit monopoly negative control
        run: cargo run --quiet --manifest-path tools/thermo-temporal-fairness/Cargo.toml -- --audit tools/thermo-temporal-fairness/fixtures/monopoly.tsv
