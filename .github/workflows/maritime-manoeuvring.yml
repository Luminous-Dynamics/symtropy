name: maritime-manoeuvring-contract

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/maritime-manoeuvring/**"
      - ".github/workflows/maritime-manoeuvring.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/maritime-manoeuvring/**"
      - ".github/workflows/maritime-manoeuvring.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-manoeuvring-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/maritime-manoeuvring/Cargo.toml -- --check
      - name: Run frozen contract tests
        run: cargo test --locked --manifest-path benchmarks/maritime-manoeuvring/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path benchmarks/maritime-manoeuvring/Cargo.toml --all-targets -- -D warnings
