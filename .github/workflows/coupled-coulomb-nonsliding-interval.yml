name: Coupled Coulomb separating and sticking branch intervals

on:
  pull_request:
    paths:
      - "crates/core/symtropy-physics/src/coupled_friction_sturm.rs"
      - "docs/research/COULOMB_NONSLIDING_BRANCH_INTERVAL_CERT_2026-11-01.md"
      - ".github/workflows/coupled-coulomb-nonsliding-interval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-sliding-interval-cert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run exact interval root and all single-contact branch tests
        run: cargo test -p symtropy-physics --lib coupled_friction::sturm --locked
      - name: Re-run production coupled contact regressions
        run: cargo test -p symtropy-physics --lib coupled_friction::tests --locked
