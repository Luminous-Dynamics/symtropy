name: Antarctic Energy Profile V0

on:
  pull_request:
    paths:
      - "research/antarctic-energy-resilience/**"
      - "scripts/check-antarctic-energy-profile.sh"
      - "scripts/check-antarctic-energy-data.sh"
      - "scripts/acquire-antarctic-sources.sh"
      - "scripts/check-antarctic-benchmark-receipt.sh"
      - "research/antarctic-energy-resilience/benchmark-run-v0.schema.json"
      - "research/antarctic-energy-resilience/benchmark-run-v0.synthetic.json"
      - ".github/workflows/antarctic-energy-profile.yml"
  push:
    branches: [main]
    paths:
      - "research/antarctic-energy-resilience/**"
      - "scripts/check-antarctic-energy-profile.sh"
      - "scripts/check-antarctic-energy-data.sh"
      - "scripts/acquire-antarctic-sources.sh"
      - ".github/workflows/antarctic-energy-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antarctic-energy-profile-v0-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  synthetic-profile-audit:
    name: Audit synthetic energy and storage ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Verify jq is available
        run: command -v jq

      - name: Run independent fixture arithmetic and mutation checks
        run: bash scripts/check-antarctic-energy-profile.sh

      - name: Run source-attributed annual-data checks and mutation controls
        run: bash scripts/check-antarctic-energy-data.sh

      - name: Check source-acquisition utility syntax and fail-closed stewardship gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/acquire-antarctic-sources.sh
          bash scripts/acquire-antarctic-sources.sh --help >/dev/null
          set +e
          output="$(env -u AADC_ORIGINATOR_CONTACT_CONFIRMED bash scripts/acquire-antarctic-sources.sh fetch-aadc-fuel 2>&1)"
          status=$?
          set -e
          test "$status" -eq 5
          grep -q "contact the data originator" <<<"$output"

      - name: Check benchmark receipt schema/example claim ceiling
        run: bash scripts/check-antarctic-benchmark-receipt.sh
