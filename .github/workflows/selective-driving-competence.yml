name: selective-driving-competence

on:
  pull_request:
    paths:
      - "research/selective-driving-competence-001/**"
      - ".github/workflows/selective-driving-competence.yml"
  push:
    paths:
      - "research/selective-driving-competence-001/**"
      - ".github/workflows/selective-driving-competence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/selective-driving-competence-001/Cargo.toml -- --check

      - name: Run unit and CLI tests
        run: cargo test --locked --manifest-path research/selective-driving-competence-001/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/selective-driving-competence-001/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Validate protocol documents parse as JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("research/selective-driving-competence-001")
          for name in ["manifest-v0_1.json", "selective-driving-evaluation-v0_1.schema.json"]:
              json.loads((root / name).read_text())
          PY
