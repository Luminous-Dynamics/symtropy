name: SIM-REL Rust Format and Exact-Head Qualification

on:
  push:
    branches:
      - "research/sim-rel-013-*"
      - "research/sim-rel-014-*"
      - "research/sim-rel-015-*"
      - "research/sim-rel-016-*"
      - "research/sim-rel-017-*"
      - "research/sim-rel-018-*"
      - "research/sim-rel-019-*"
      - "research/sim-rel-020-*"
      - "research/sim-rel-022-*"
    paths:
      - "tools/sim-rel-joint-stochastic-oracle/**"
      - ".github/workflows/sim-rel-rustfmt-autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sim-rel-rustfmt-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-qualify:
    name: rustfmt, locked tests, strict Clippy and exact-head receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-rustfmt-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format the standalone research crate
        run: cargo fmt --manifest-path tools/sim-rel-joint-stochastic-oracle/Cargo.toml
      - name: Commit formatter-only changes to the triggering research branch
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sim-rel-joint-stochastic-oracle
          if ! git diff --cached --quiet; then
            git commit -m "style(research): apply pinned rustfmt to stochastic research crate"
            git push origin "HEAD:$GH_REF_NAME"
          fi
      - name: Capture formatted source identity
        run: echo "EXPECTED_FORMATTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify rustfmt
        run: cargo fmt --manifest-path tools/sim-rel-joint-stochastic-oracle/Cargo.toml -- --check
      - name: Locked unit and oracle tests
        run: cargo test --locked --manifest-path tools/sim-rel-joint-stochastic-oracle/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-joint-stochastic-oracle/Cargo.toml --lib -- -D warnings
      - name: Verify exact formatted checkout and clean tree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_FORMATTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
