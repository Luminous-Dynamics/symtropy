name: SIM-REL-006 Decision-Aware Stopping

on:
  push:
    branches: ["main", "research/sim-rel-006-*"]
    paths:
      - "tools/sim-rel-decision/**"
      - "docs/research/SIM_REL_006_DECISION_AWARE_STOPPING_2026-10-30.md"
      - ".github/workflows/sim-rel-decision.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/sim-rel-decision/**"
      - "docs/research/SIM_REL_006_DECISION_AWARE_STOPPING_2026-10-30.md"
      - ".github/workflows/sim-rel-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: finite-horizon Bellman vs independent reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-006-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/sim-rel-decision/Cargo.toml -- --check
      - name: Unit and exhaustive small-domain cross-checks
        run: cargo test --locked --manifest-path tools/sim-rel-decision/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-decision/Cargo.toml --lib -- -D warnings
      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
