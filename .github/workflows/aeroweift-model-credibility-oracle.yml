name: AeroWeft Model Credibility Envelope Oracle

on:
  pull_request:
    paths:
      - "tools/aeroweift-model-credibility/**"
      - "docs/research/aviation/AEROWEFT_MODEL_CREDIBILITY_001.md"
      - "fixtures/aeroweift-model-credibility/**"
      - ".github/workflows/aeroweift-model-credibility-oracle.yml"
  push:
    branches:
      - "research/aeroweFt-model-credibility-001"
    paths:
      - "tools/aeroweift-model-credibility/**"
      - "docs/research/aviation/AEROWEFT_MODEL_CREDIBILITY_001.md"
      - "fixtures/aeroweift-model-credibility/**"
      - ".github/workflows/aeroweift-model-credibility-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeroweift-model-credibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/aeroweift-model-credibility/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/aeroweift-model-credibility/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/aeroweift-model-credibility/Cargo.toml --all-targets
