name: Terrain Geometry Slim Diagnostic

on:
  push:
    branches:
      - "ci/terrain-geometry-slim-diagnostic-7aa1190"
    paths:
      - ".github/workflows/terrain-geometry-slim-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic exact Terrain geometry theorem
    runs-on: ubuntu-slim
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind diagnostic lineage
        shell: bash
        run: |
          set -euo pipefail
          theorem=7aa1190fe8390187f1765479978f2ad04e36e974
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${theorem}"
          actual="$(git diff --name-only ${theorem}..HEAD)"
          test "${actual}" = ".github/workflows/terrain-geometry-slim-diagnostic.yml"

      - name: Checkout exact Terrain geometry theorem
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7aa1190fe8390187f1765479978f2ad04e36e974
          fetch-depth: 0

      - name: Bind exact theorem subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7aa1190fe8390187f1765479978f2ad04e36e974"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_authority.rs)" = "9a6ec7076b54d7da9525e31dd8aa2258174ab5ea"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/tests/geometry_authority_golden.rs)" = "3ce0c63c9a73c86f9943bc85b115bc7d69ee9dca"
          test "$(git rev-parse HEAD:scripts/terrain-integrate-exact-geometry-authority.py)" = "81348cea2294e46df3354a549d5642953b3af5ca"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/terrain-geometry-slim-target" >> "${GITHUB_ENV}"
          echo "TERRAIN_GEOMETRY_LOCK_BEFORE=$(git hash-object Cargo.lock)" >> "${GITHUB_ENV}"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Apply exact transform
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/terrain-integrate-exact-geometry-authority.py
          cargo fmt --package symtropy-terrain
          test "$(git hash-object Cargo.lock)" = "${TERRAIN_GEOMETRY_LOCK_BEFORE}"

      - name: Locked metadata
        shell: bash
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Check
        shell: bash
        run: cargo check -p symtropy-terrain --locked --all-targets

      - name: Test
        shell: bash
        run: cargo test -p symtropy-terrain --locked --all-targets

      - name: Strict Clippy
        shell: bash
        run: cargo clippy -p symtropy-terrain --locked --all-targets -- -D warnings

      - name: Diagnostic postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Cargo.lock)" = "${TERRAIN_GEOMETRY_LOCK_BEFORE}"
          git diff --check
          echo "DIAGNOSTIC_ONLY_NOT_PRODUCT_QUALIFICATION"
