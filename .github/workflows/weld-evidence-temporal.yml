name: Weld Evidence Temporal Snapshot Oracle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "crates/tools/weld-evidence-temporal/**"
      - "docs/tech/WELD_EVIDENCE_TEMPORAL_V0_1*"
      - ".github/workflows/weld-evidence-temporal.yml"
      - ".github/workflows/shipyard-workspace-topology.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weld-evidence-temporal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify bitemporal welding evidence snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/weld-evidence-temporal/Cargo.toml --all -- --check

      - name: Run temporal snapshot and leakage oracle tests
        run: cargo test --locked --manifest-path crates/tools/weld-evidence-temporal/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/weld-evidence-temporal/Cargo.toml --all-targets -- -D warnings

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
