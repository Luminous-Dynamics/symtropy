name: Clinical-Trial Site Operations Benchmark

on:
  push:
    branches: ["research/trial-site-ops-benchmark-v0-1"]
    paths:
      - "docs/tech/TRIAL_SITE_OPS_BENCHMARK_V0_1.md"
      - "benchmarks/fixtures/TRIAL_SITE_OPS_V0_1.json"
      - "tools/trial-site-ops-bench/**"
      - ".github/workflows/trial-site-ops-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/TRIAL_SITE_OPS_BENCHMARK_V0_1.md"
      - "benchmarks/fixtures/TRIAL_SITE_OPS_V0_1.json"
      - "tools/trial-site-ops-bench/**"
      - ".github/workflows/trial-site-ops-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trial-site-ops-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Format validator
        run: cargo fmt --manifest-path tools/trial-site-ops-bench/Cargo.toml --check

      - name: Run validator and negative-control tests
        run: cargo test --manifest-path tools/trial-site-ops-bench/Cargo.toml

      - name: Validate frozen corpus and emit exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/trial-site-ops-bench/Cargo.toml -- \
            benchmarks/fixtures/TRIAL_SITE_OPS_V0_1.json \
            --source-commit "$source_commit" > trial-site-ops-reference-receipt.json
          export SOURCE_COMMIT="$source_commit"
          jq -e '
            .result == "pass"
            and .benchmark_id == "TRIAL-SITE-OPS-001"
            and .scenario_count == 6
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit == env.SOURCE_COMMIT)
            and (.scenarios | length == 6)
            and (.scenarios | all(.status == "pass"))
            and (.scenarios | all(.reference_comparison.B1_self_report_only != null))
            and (.scenarios | all(.reference_comparison.B3_capability_aware_heuristic != null))
            and (.scenarios | all(.reference_comparison.separate_access_dimensions != null))
          ' trial-site-ops-reference-receipt.json

      - name: Upload deterministic reference receipt
        uses: actions/upload-artifact@v4
        with:
          name: trial-site-ops-reference-receipt
          path: trial-site-ops-reference-receipt.json
          if-no-files-found: error
          retention-days: 90
