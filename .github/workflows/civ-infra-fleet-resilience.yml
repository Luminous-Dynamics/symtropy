name: CIV-INFRA Fleet Resilience Manifest

on:
  push:
    branches: ["main"]
    paths:
      - "tools/civ-infra-fleet-resilience/**"
      - "docs/research/civ-infra-resilience/**"
      - ".github/workflows/civ-infra-fleet-resilience.yml"
  pull_request:
    branches: ["main", "docs/civ-infra-fleet-resilience-v0-1", "feat/civ-infra-event-timeline-audit-clean"]
    paths:
      - "tools/civ-infra-fleet-resilience/**"
      - "docs/research/civ-infra-resilience/**"
      - ".github/workflows/civ-infra-fleet-resilience.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  manifest:
    name: Manifest contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/civ-infra-fleet-resilience/Cargo.toml -- --check

      - name: Run manifest and adversarial tests
        run: cargo test --locked --manifest-path tools/civ-infra-fleet-resilience/Cargo.toml

      - name: Emit and inspect fixture validation report
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/civ-infra-resilience/fixtures/fleet-resilience-v0.1.json"
          expected_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          report="$RUNNER_TEMP/civ-infra-fleet-resilience-report.json"
          cargo run --locked --manifest-path tools/civ-infra-fleet-resilience/Cargo.toml -- "$fixture" > "$report"
          jq -e --arg expected_sha "$expected_sha" '
            .schema_version == "luminous.civ_infra.fleet_resilience_manifest_report.v0.1" and
            .input_sha256 == $expected_sha and
            .validation_status == "fixture_schema_valid_and_finite_schedule_oracle_checked" and
            .benchmark_executed == false and
            .finite_schedule_oracle_executed == true and
            .policy_runs_performed == 0 and
            .counts.policies == 4 and
            .counts.resources == 9 and
            .counts.task_nodes == 4 and
            .counts.tiny_schedule_cases == 3 and
            .counts.schedule_cases_with_feasible_solution == 2 and
            .counts.schedule_cases_without_feasible_solution == 1 and
            .counts.disturbance_cases == 13 and
            .counts.evidence_vocabulary_items == 32 and
            .counts.evaluation_rules == 7 and
            ([.schedule_oracle_results[] | select(.case_id == "O-001-parallel-branches" and .minimum_makespan_ticks == 5 and .status == "feasible_reference_schedule")] | length) == 1 and
            ([.schedule_oracle_results[] | select(.case_id == "O-002-resource-alternative" and .minimum_makespan_ticks == 4 and .status == "feasible_reference_schedule")] | length) == 1 and
            ([.schedule_oracle_results[] | select(.case_id == "O-002-resource-alternative") | .optimal_schedule[] | select(.task_id == "prepare-panel" and .alternative_id == "robot-a")] | length) == 1 and
            ([.schedule_oracle_results[] | select(.case_id == "O-003-horizon-infeasible" and .minimum_makespan_ticks == null and .status == "no_feasible_schedule_within_horizon")] | length) == 1 and
            ([.disturbance_cases[].status] | unique) == ["declared_not_simulated"] and
            ([.disturbance_cases[].case_id] | sort) == [
              "R-001", "R-002", "R-003", "R-004", "R-005", "R-006", "R-007",
              "R-008", "R-009", "R-010", "R-011", "R-012", "R-013"
            ]
          ' "$report"

      - name: Execute bounded recovery-policy microcase
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/civ-infra-resilience/fixtures/policy-rollout-microcase-v0.1.json"
          expected_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          report="$RUNNER_TEMP/civ-infra-policy-rollout-report.json"
          cargo run --locked --manifest-path tools/civ-infra-fleet-resilience/Cargo.toml --bin policy-rollout -- "$fixture" > "$report"
          jq -e --arg expected_sha "$expected_sha" '
            .schema_version == "luminous.civ_infra.policy_rollout_report.v0.1" and
            .input_sha256 == $expected_sha and
            .classification == "synthetic_only" and
            .validation_status == "single_synthetic_rollout_and_frozen_outcomes_checked" and
            .benchmark_executed == true and
            .simulated_cases == 1 and
            .policy_runs_performed == 3 and
            .event_injection_tick == 1 and
            .event_observable_tick == 2 and
            .all_expected_outcomes_matched == true and
            ([.policy_results[] | select(.policy_id == "B0" and .status == "protective_stop_no_accepted_output" and .accepted_synthetic_work == false and .makespan_ticks == null and .completed_task_count == 0 and .interrupted_attempt_count == 1 and .event_observed_tick == null and .knowledge_leak_detected == false)] | length) == 1 and
            ([.policy_results[] | select(.policy_id == "B1" and .status == "synthetic_acceptance_complete" and .accepted_synthetic_work == true and .makespan_ticks == 8 and .completed_task_count == 4 and .resource_reassignments == 0 and .event_observed_tick == 2 and .replan_tick == null and .knowledge_leak_detected == false)] | length) == 1 and
            ([.policy_results[] | select(.policy_id == "B2" and .status == "synthetic_acceptance_complete" and .accepted_synthetic_work == true and .makespan_ticks == 6 and .completed_task_count == 4 and .resource_reassignments == 1 and .event_observed_tick == 2 and .replan_tick == 2 and .knowledge_leak_detected == false)] | length) == 1
          ' "$report"

      - name: Audit event queue and observation boundaries
        if: ${{ hashFiles('tools/civ-infra-fleet-resilience/src/bin/event-timeline-audit.rs') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/civ-infra-resilience/fixtures/fleet-resilience-v0.1.json"
          expected_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          report="$RUNNER_TEMP/civ-infra-event-timeline-report.json"
          cargo run --locked --manifest-path tools/civ-infra-fleet-resilience/Cargo.toml --bin event-timeline-audit -- "$fixture" > "$report"
          jq -e --arg expected_sha "$expected_sha" '
            .schema_version == "luminous.civ_infra.event_timeline_audit.v0.1" and
            .input_sha256 == $expected_sha and
            .classification == "synthetic_only" and
            .timeline_status == "canonical_event_queue_timing_audited" and
            .timeline_audit_executed == true and
            .policy_simulation_executed == false and
            .policy_runs_performed == 0 and
            .counts.disturbance_cases == 13 and
            .counts.typed_disturbance_kinds == 13 and
            .counts.delayed_observations == 3 and
            .counts.total_observation_delay_ticks == 4 and
            .counts.maximum_observation_delay_ticks == 2 and
            .counts.timeline_tick_count == 8 and
            ([.evaluator_timeline[] | select(.tick == 2) | .injected_event_ids[] | select(. == "R-008")] | length) == 1 and
            ([.evaluator_timeline[] | select(.tick == 2) | .events_injected_but_not_yet_observable[] | select(. == "R-008")] | length) == 1 and
            ([.policy_timeline[] | select(.tick == 3) | .visible_event_ids[] | select(. == "R-008")] | length) == 0 and
            ([.policy_timeline[] | select(.tick == 4) | .visible_event_ids[] | select(. == "R-008")] | length) == 1 and
            ([.policy_timeline[4].newly_observed_events[] | select(.case_id == "R-008" and .observed_at_tick == 4 and (has("injection_tick") | not))] | length) == 1
          ' "$report"

      - name: Independently verify event timeline report
        if: ${{ hashFiles('tools/civ-infra-fleet-resilience/src/bin/event-timeline-check.rs') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/civ-infra-resilience/fixtures/fleet-resilience-v0.1.json"
          report="$RUNNER_TEMP/civ-infra-event-timeline-report.json"
          checker_report="$RUNNER_TEMP/civ-infra-event-timeline-check.json"
          test -s "$report"
          cargo run --locked --manifest-path tools/civ-infra-fleet-resilience/Cargo.toml --bin event-timeline-check -- "$fixture" "$report" > "$checker_report"
          jq -e '
            .status == "independent_event_timeline_report_verified" and
            .fixture_id == "civ-infra-fleet-resilience-synthetic-001" and
            .event_count == 13 and
            .timeline_tick_count == 8 and
            .policy_simulation_executed == false
          ' "$checker_report"

      - name: Execute typed recovery-admission contract
        if: ${{ hashFiles('tools/civ-infra-fleet-resilience/src/bin/recovery-admission-contract.rs') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/civ-infra-resilience/fixtures/fleet-resilience-v0.1.json"
          expected_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          report="$RUNNER_TEMP/civ-infra-recovery-admission-report.json"
          echo "CIV_INFRA_ADMISSION_REPORT=$report" >> "$GITHUB_ENV"
          cargo run --locked --manifest-path tools/civ-infra-fleet-resilience/Cargo.toml --bin recovery-admission-contract > "$report"
          jq -e --arg expected_sha "$expected_sha" '
            .schema_version == "luminous.civ_infra.recovery_admission_contract.v0.1" and
            .fixture_id == "civ-infra-fleet-resilience-synthetic-001" and
            .fixture_sha256 == $expected_sha and
            .classification == "synthetic_only" and
            .validation_status == "typed_task_admission_contract_checked" and
            .contract_suite_executed == true and
            .scenario_count >= 40 and
            .expectation_mismatch_count == 0 and
            .all_expected_decisions_match == true and
            (.scenario_set_sha256 | test("^[0-9a-f]{64}$")) and
            (.scenario_results | all(.[]; (.input_sha256 | test("^[0-9a-f]{64}$")) and (.decision_sha256 | test("^[0-9a-f]{64}$")))) and
            .policy_simulation_executed == false and
            .policy_runs_performed == 0 and
            .physical_control_executed == false and
            .dispatch_authorized == false and
            .input_receipts_cryptographically_verified == false and
            .immutable_history_store_executed == false and
            .gate_inputs_are_synthetic_assertions == true and
            ([.scenario_results[] | select((.scenario_id | test("^R-[0-9]{3}-accept-after-recovery$")) and .admitted == true)] | length) == 13 and
            ([.scenario_results[] | select((.scenario_id | test("^R-[0-9]{3}-missing-recovery-evidence$")) and .admitted == false)] | length) == 13 and
            ([.scenario_results[] | select(.scenario_id == "R-008-future-observation-reference" and .admitted == false and (.reason_codes | index("observation_not_yet_visible:R-008") != null))] | length) == 1 and
            ([.scenario_results[] | select(.scenario_id == "global-approval-not-required-bypass" and .admitted == false and (.reason_codes | index("visible_approval_gate_requires_granted_authorization:R-012") != null))] | length) == 1 and
            ([.scenario_results[] | select(.scenario_id == "global-protective-stop-before-observation" and .admitted == true and .next_state == "interrupted")] | length) == 1
          ' "$report"

      - name: Emit exact-checkout reproducibility receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/civ-infra-resilience/fixtures/fleet-resilience-v0.1.json"
          lock="tools/civ-infra-fleet-resilience/Cargo.lock"
          report="${CIV_INFRA_ADMISSION_REPORT:-}"
          rustc_version="$(rustc -Vv 2>&1 || true)"
          cargo_version="$(cargo -V 2>&1 || true)"
          toolchain="$(rustup show active-toolchain 2>&1 || true)"
          source_sha="$(git rev-parse HEAD)"
          source_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          fixture_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          lock_sha="$(sha256sum "$lock" | awk '{print $1}')"
          report_present=false
          report_sha=""
          if [[ -n "$report" && -f "$report" ]]; then
            report_present=true
            report_sha="$(sha256sum "$report" | awk '{print $1}')"
          fi
          jq -n \
            --arg schema "luminous.civ_infra.run_provenance.v0.1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$source_sha" \
            --arg source_tree_sha "$source_tree_sha" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg runner_os "$RUNNER_OS" \
            --arg architecture "$RUNNER_ARCH" \
            --arg rustc_version "$rustc_version" \
            --arg cargo_version "$cargo_version" \
            --arg toolchain "$toolchain" \
            --arg fixture_sha256 "$fixture_sha" \
            --arg cargo_lock_sha256 "$lock_sha" \
            --arg decision_report_sha256 "$report_sha" \
            --argjson decision_report_present "$report_present" \
            '{
              schema_version: $schema,
              repository: $repository,
              source_commit: $source_sha,
              source_tree: $source_tree_sha,
              workflow: $workflow,
              workflow_ref: $workflow_ref,
              workflow_definition_commit: $workflow_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              runner_os: $runner_os,
              runner_architecture: $architecture,
              rustc_version_verbose: $rustc_version,
              cargo_version: $cargo_version,
              active_toolchain: $toolchain,
              fixture_sha256: $fixture_sha256,
              cargo_lock_sha256: $cargo_lock_sha256,
              decision_report_present: $decision_report_present,
              decision_report_sha256: (if $decision_report_present then $decision_report_sha256 else null end),
              evidence_scope: "run provenance only; does not authenticate observations, signatures, physical state, or dispatch authority"
            }' > "$RUNNER_TEMP/civ-infra-recovery-run-receipt.json"
          jq -e '.schema_version == "luminous.civ_infra.run_provenance.v0.1" and (.source_commit | test("^[0-9a-f]{40}$")) and (.source_tree | test("^[0-9a-f]{40}$")) and (.fixture_sha256 | test("^[0-9a-f]{64}$")) and (.cargo_lock_sha256 | test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/civ-infra-recovery-run-receipt.json"

      - name: Upload recovery contract and provenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ-infra-recovery-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/civ-infra-recovery-admission-report.json
            ${{ runner.temp }}/civ-infra-recovery-run-receipt.json
          if-no-files-found: warn
          retention-days: 90
