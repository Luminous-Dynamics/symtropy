name: Physical Solver Request Contract

on:
  push:
    branches: ["research/physical-solver-handoff-contract-v0-1"]
    paths:
      - "research/physical-solver-contract/**"
      - "schemas/physical-transformation/**"
      - ".github/workflows/physical-solver-contract-rust.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/physical-solver-contract/**"
      - "schemas/physical-transformation/**"
      - ".github/workflows/physical-solver-contract-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-solver-contract-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  request-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/physical-solver-contract/Cargo.toml --all -- --check
      - name: Test semantic validation and negative controls
        run: cargo test --locked --manifest-path research/physical-solver-contract/Cargo.toml
      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path research/physical-solver-contract/Cargo.toml --all-targets -- -D warnings
      - name: Validate fixtures at exact head and assert unresolved claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request schemas/physical-transformation/fixtures/analytical-bar-request-v0.1.json \
            --validator-revision "$source_commit" > solver-contract-supported-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .schema_version == "physical-solver-validation-receipt-v0.1"
            and .request_validation == "PASS"
            and .validator_revision == $source_commit
            and .solver_invoked == false
            and .physical_result_status == "UNRESOLVED"
            and .physics_omitted == []
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
          ' solver-contract-supported-receipt.json
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request schemas/physical-transformation/fixtures/unsupported-dynamic-fracture-request-v0.1.json \
            --validator-revision "$source_commit" > solver-contract-unsupported-receipt.json
          jq -e '
            .request_validation == "PASS"
            and .solver_invoked == false
            and .physical_result_status == "UNRESOLVED"
            and (.physics_omitted | index("dynamic_response") != null)
            and (.physics_omitted | index("fracture") != null)
          ' solver-contract-unsupported-receipt.json

      - name: Verify exact-bound unresolved solver receipt
        shell: bash
        run: |
          set -euo pipefail
          request="schemas/physical-transformation/fixtures/unsupported-dynamic-fracture-request-v0.1.json"
          receipt_template="schemas/physical-transformation/fixtures/unresolved-receipt-v0.1.json"
          request_sha256="$(sha256sum "$request" | cut -d ' ' -f 1)"
          request_id="$(jq -r '.request_id' "$request")"
          source_revision="$(jq -r '.source_revision' "$request")"
          jq --arg digest "$request_sha256" --arg id "$request_id" --arg revision "$source_revision" \
            '.request_sha256 = $digest | .request_id = $id | .source_revision = $revision' \
            "$receipt_template" > solver-contract-unresolved-receipt.json

          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$request" --receipt solver-contract-unresolved-receipt.json \
            > solver-contract-receipt-verification.json
          jq -e '
            .receipt_contract_validation == "PASS"
            and .producer_status == "UNRESOLVED"
            and .physics_partition_exact == true
            and .solver_execution_authenticated == false
            and .output_artifact_bytes_verified == false
          ' solver-contract-receipt-verification.json

      - name: Verify local output bytes without implying execution
        shell: bash
        run: |
          set -euo pipefail
          request="schemas/physical-transformation/fixtures/analytical-bar-request-v0.1.json"
          artifact_root="solver-contract-artifacts"
          mkdir -p "$artifact_root"
          request_sha256="$(sha256sum "$request" | cut -d ' ' -f 1)"
          request_id="$(jq -r '.request_id' "$request")"
          source_revision="$(jq -r '.source_revision' "$request")"
          outputs_json='[]'

          while IFS= read -r kind; do
            artifact_ref="${kind}.json"
            printf '{"synthetic_fixture_only":true,"output_kind":"%s"}\n' "$kind" \
              > "$artifact_root/$artifact_ref"
            artifact_sha256="$(sha256sum "$artifact_root/$artifact_ref" | cut -d ' ' -f 1)"
            entry="$(jq -cn \
              --arg kind "$kind" \
              --arg ref "$artifact_ref" \
              --arg digest "$artifact_sha256" \
              '{output_id:("fixture-" + $kind),kind:$kind,sha256:$digest,media_type:"application/json",unit:null,artifact_ref:$ref}')"
            outputs_json="$(jq -cn --argjson outputs "$outputs_json" --argjson entry "$entry" '$outputs + [$entry]')"
          done < <(jq -r '.required_outputs[]' "$request")

          jq -n \
            --slurpfile request "$request" \
            --arg digest "$request_sha256" \
            --arg request_id "$request_id" \
            --arg revision "$source_revision" \
            --argjson outputs "$outputs_json" '
            {
              schema_version:"physical-solver-receipt-v0.1",
              request_id:$request_id,
              request_sha256:$digest,
              source_revision:$revision,
              adapter:{
                adapter_id:"synthetic-artifact-byte-fixture",
                version:"0.1.0",
                executable_sha256:("b" * 64),
                configuration_sha256:("c" * 64),
                solver_name:"synthetic-test-only",
                solver_version:"0.1.0",
                solver_build_ref:"fixture-only:no-solver-executed"
              },
              status:"PASS",
              evidence_class:"synthetic",
              physics_evaluated:$request[0].requested_physics,
              physics_omitted:[],
              convergence:{
                state:"not_applicable",
                iterations:null,
                residual:null,
                mesh_refinement_evaluated:false,
                details:"Synthetic verifier control only; no solver executed."
              },
              outputs:$outputs,
              uncertainty:{
                state:"unknown",
                method:null,
                summary:"No physical uncertainty is represented in this fixture."
              },
              validity_envelope:{
                supported_geometry:"synthetic fixture only",
                supported_material_model:"synthetic fixture only",
                load_regime:"synthetic fixture only",
                limitations:["No numerical or physical result is asserted."]
              },
              claim_ceiling:"Synthetic byte-verification test only; not physical qualification.",
              diagnostics:[]
            }' > solver-contract-synthetic-pass-receipt.json

          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$request" \
            --receipt solver-contract-synthetic-pass-receipt.json \
            --artifact-root "$artifact_root" \
            > solver-contract-artifact-verification.json
          jq -e '
            .receipt_contract_validation == "PASS"
            and .producer_status == "PASS"
            and .artifact_verification_status == "PASS"
            and .output_artifact_bytes_verified == true
            and .solver_execution_authenticated == false
            and .physical_result_qualified == false
            and .verified_output_count == (.artifact_results | length)
            and (.artifact_results | all(.[]; .status == "PASS"))
          ' solver-contract-artifact-verification.json

          first_ref="$(jq -r '.outputs[0].artifact_ref' solver-contract-synthetic-pass-receipt.json)"
          printf 'deliberately mutated output bytes\n' > "$artifact_root/$first_ref"
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$request" \
            --receipt solver-contract-synthetic-pass-receipt.json \
            --artifact-root "$artifact_root" \
            > solver-contract-artifact-tampered-verification.json
          jq -e '
            .artifact_verification_status == "FAIL"
            and .output_artifact_bytes_verified == false
            and .physical_result_qualified == false
            and any(.artifact_results[]; .status == "FAIL")
          ' solver-contract-artifact-tampered-verification.json

          jq '.outputs[0].artifact_ref = "../outside.json"' \
            solver-contract-synthetic-pass-receipt.json \
            > solver-contract-path-escape-receipt.json
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$request" \
            --receipt solver-contract-path-escape-receipt.json \
            --artifact-root "$artifact_root" \
            > solver-contract-artifact-path-escape-verification.json
          jq -e '
            .artifact_verification_status == "UNRESOLVED"
            and .output_artifact_bytes_verified == false
            and any(.artifact_results[]; .status == "UNRESOLVED")
          ' solver-contract-artifact-path-escape-verification.json

      - name: Compare normalized numerical observables against exact request-bound reference
        shell: bash
        run: |
          set -euo pipefail
          request="schemas/physical-transformation/fixtures/analytical-bar-request-v0.1.json"
          artifact_root="solver-contract-reference-artifacts"
          mkdir -p "$artifact_root"
          request_sha256="$(sha256sum "$request" | cut -d ' ' -f 1)"
          request_id="$(jq -r '.request_id' "$request")"
          source_revision="$(jq -r '.source_revision' "$request")"
          scene_sha256="$(jq -r '.scene_sha256' "$request")"
          scene_revision="$(jq -r '.scene_revision' "$request")"
          case_id="fixture-bar-reference"

          jq -n \
            --arg digest "$request_sha256" \
            --arg request_id "$request_id" \
            --arg scene_sha256 "$scene_sha256" \
            --argjson scene_revision "$scene_revision" \
            --arg case_id "$case_id" \
            '{
              schema_version:"physical-normalized-observables-v0.1",
              request_sha256:$digest,
              request_id:$request_id,
              scene_sha256:$scene_sha256,
              scene_revision:$scene_revision,
              case_id:$case_id,
              observables:[{observable_id:"fixture_displacement_m",value:0.125,unit:"m"}]
            }' > "$artifact_root/normalized.json"
          printf '{"synthetic_auxiliary":true}\n' > "$artifact_root/stress.json"
          normalized_sha256="$(sha256sum "$artifact_root/normalized.json" | cut -d ' ' -f 1)"
          stress_sha256="$(sha256sum "$artifact_root/stress.json" | cut -d ' ' -f 1)"

          jq -n \
            --arg request_id "$request_id" \
            --arg digest "$request_sha256" \
            --arg revision "$source_revision" \
            --arg normalized_sha "$normalized_sha256" \
            --arg stress_sha "$stress_sha256" \
            --slurpfile request "$request" '
            {
              schema_version:"physical-solver-receipt-v0.1",
              request_id:$request_id,
              request_sha256:$digest,
              source_revision:$revision,
              adapter:{
                adapter_id:"synthetic-numerical-compare-fixture",
                version:"0.1.0",
                executable_sha256:("b" * 64),
                configuration_sha256:("c" * 64),
                solver_name:"synthetic-test-only",
                solver_version:"0.1.0",
                solver_build_ref:"fixture-only:no-solver-executed"
              },
              status:"PASS",
              evidence_class:"synthetic",
              physics_evaluated:$request[0].requested_physics,
              physics_omitted:[],
              convergence:{
                state:"not_applicable",
                iterations:null,
                residual:null,
                mesh_refinement_evaluated:false,
                details:"Synthetic numerical-comparator control only; no solver executed."
              },
              outputs:[
                {output_id:"normalized",kind:"displacement",sha256:$normalized_sha,media_type:"application/json",unit:"m",artifact_ref:"normalized.json"},
                {output_id:"aux-stress",kind:"stress",sha256:$stress_sha,media_type:"application/json",unit:"Pa",artifact_ref:"stress.json"}
              ],
              uncertainty:{
                state:"unknown",
                method:null,
                summary:"No physical uncertainty is represented in this fixture."
              },
              validity_envelope:{
                supported_geometry:"synthetic fixture only",
                supported_material_model:"synthetic fixture only",
                load_regime:"synthetic fixture only",
                limitations:["No numerical or physical result is asserted."]
              },
              claim_ceiling:"Synthetic comparator fixture only; not physical qualification.",
              diagnostics:[]
            }' > solver-contract-numerical-receipt.json

          jq -n \
            --arg digest "$request_sha256" \
            --arg request_id "$request_id" \
            --arg scene_sha256 "$scene_sha256" \
            --argjson scene_revision "$scene_revision" \
            --arg case_id "$case_id" '
            {
              schema_version:"physical-reference-observables-v0.1",
              reference_id:"fixture-known-answer-v1",
              case_id:$case_id,
              request_id:$request_id,
              scene_sha256:$scene_sha256,
              scene_revision:$scene_revision,
              request_sha256:$digest,
              comparison_protocol_id:"fixture-tolerance-v1",
              oracle:{
                method:"analytical_exact",
                identity:"frozen synthetic known-answer oracle",
                source_ref:"test-oracle://normalized-observable-v1"
              },
              observables:[
                {observable_id:"fixture_displacement_m",expected_value:0.125,unit:"m",absolute_tolerance:1e-12,relative_tolerance:1e-10}
              ]
            }' > solver-contract-reference-manifest.json

          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$request" \
            --receipt solver-contract-numerical-receipt.json \
            --artifact-root "$artifact_root" \
            --reference solver-contract-reference-manifest.json \
            --observation-output-id normalized \
            > solver-contract-numerical-comparison-pass.json
          jq -e '
            .comparison_status == "PASS"
            and .artifact_verification_status == "PASS"
            and .numerical_observable_comparison == "PASS"
            and .physical_result_qualified == false
            and .real_world_validation_status == "UNRESOLVED"
            and .observable_results[0].within_tolerance == true
          ' solver-contract-numerical-comparison-pass.json

          # Change the observed value, then update the output hash so this tests
          # numerical disagreement rather than a mere byte-integrity failure.
          jq '.observables[0].value = 0.13' "$artifact_root/normalized.json" > "$artifact_root/normalized-mutated.json"
          mv "$artifact_root/normalized-mutated.json" "$artifact_root/normalized.json"
          mutated_sha256="$(sha256sum "$artifact_root/normalized.json" | cut -d ' ' -f 1)"
          jq --arg digest "$mutated_sha256" '.outputs[0].sha256 = $digest' \
            solver-contract-numerical-receipt.json > solver-contract-numerical-mutated-receipt.json
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$request" \
            --receipt solver-contract-numerical-mutated-receipt.json \
            --artifact-root "$artifact_root" \
            --reference solver-contract-reference-manifest.json \
            --observation-output-id normalized \
            > solver-contract-numerical-comparison-fail.json
          jq -e '
            .artifact_verification_status == "PASS"
            and .comparison_status == "FAIL"
            and .numerical_observable_comparison == "FAIL"
            and .physical_result_qualified == false
            and .observable_results[0].within_tolerance == false
          ' solver-contract-numerical-comparison-fail.json

          jq '.observables[0].unit = "mm"' "$artifact_root/normalized.json" > "$artifact_root/normalized-mutated.json"
          mv "$artifact_root/normalized-mutated.json" "$artifact_root/normalized.json"
          unit_mutated_sha256="$(sha256sum "$artifact_root/normalized.json" | cut -d ' ' -f 1)"
          jq --arg digest "$unit_mutated_sha256" '.outputs[0].sha256 = $digest' \
            solver-contract-numerical-receipt.json > solver-contract-numerical-unit-mismatch-receipt.json
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$request" \
            --receipt solver-contract-numerical-unit-mismatch-receipt.json \
            --artifact-root "$artifact_root" \
            --reference solver-contract-reference-manifest.json \
            --observation-output-id normalized \
            > solver-contract-numerical-comparison-unit-mismatch.json
          jq -e '
            .artifact_verification_status == "PASS"
            and .comparison_status == "UNRESOLVED"
            and any(.diagnostics[]; contains("unit mismatch"))
            and .physical_result_qualified == false
          ' solver-contract-numerical-comparison-unit-mismatch.json

      - name: Assess receipt-backed mesh refinement series
        shell: bash
        run: |
          set -euo pipefail
          base_request="schemas/physical-transformation/fixtures/analytical-bar-request-v0.1.json"
          root="solver-contract-mesh-study"
          rm -rf "$root" solver-contract-mesh-study-tampered-mesh solver-contract-mesh-study-tampered-output
          mkdir -p "$root"
          for index in 0 1 2; do
            case "$index" in
              0) level="coarse"; h="1.0"; elements=2; dofs=10; value="1.5" ;;
              1) level="medium"; h="0.5"; elements=16; dofs=40; value="0.75" ;;
              2) level="fine"; h="0.25"; elements=128; dofs=160; value="0.5625" ;;
            esac
            level_dir="$root/levels/$level"
            mkdir -p "$level_dir"
            scene_revision="$((index + 1))"
            printf -v scene_sha '%064x' "$((index + 1))"
            jq --arg request_id "mesh-$level" \
              --arg scene_sha "$scene_sha" \
              --argjson scene_revision "$scene_revision" \
              '.request_id = $request_id | .scene_sha256 = $scene_sha | .scene_revision = $scene_revision' \
              "$base_request" > "$level_dir/request.json"
            request_sha256="$(sha256sum "$level_dir/request.json" | cut -d ' ' -f 1)"
            source_revision="$(jq -r '.source_revision' "$level_dir/request.json")"
            printf 'synthetic mesh fixture %s\n' "$level" > "$level_dir/mesh.inp"
            printf '{"synthetic_auxiliary":true}\n' > "$level_dir/stress.json"
            mesh_sha256="$(sha256sum "$level_dir/mesh.inp" | cut -d ' ' -f 1)"
            jq -n \
              --arg request_sha256 "$request_sha256" \
              --arg request_id "mesh-$level" \
              --arg scene_sha "$scene_sha" \
              --argjson scene_revision "$scene_revision" \
              --arg case_id "linear-bar-test" \
              --argjson value "$value" \
              '{
                schema_version:"physical-normalized-observables-v0.1",
                request_sha256:$request_sha256,
                request_id:$request_id,
                scene_sha256:$scene_sha,
                scene_revision:$scene_revision,
                case_id:$case_id,
                observables:[{observable_id:"end_displacement_m",value:$value,unit:"m"}]
              }' > "$level_dir/normalized.json"
            normalized_sha256="$(sha256sum "$level_dir/normalized.json" | cut -d ' ' -f 1)"
            stress_sha256="$(sha256sum "$level_dir/stress.json" | cut -d ' ' -f 1)"
            jq -n \
              --arg request_sha256 "$request_sha256" \
              --arg request_id "mesh-$level" \
              --arg revision "$source_revision" \
              --arg normalized_sha "$normalized_sha256" \
              --arg stress_sha "$stress_sha256" \
              --arg mesh_sha "$mesh_sha256" \
              --arg level "$level" \
              --slurpfile request "$level_dir/request.json" '
              {
                schema_version:"physical-solver-receipt-v0.1",
                request_id:$request_id,
                request_sha256:$request_sha256,
                source_revision:$revision,
                adapter:{
                  adapter_id:"synthetic-mesh-study-fixture",
                  version:"0.1.0",
                  executable_sha256:("b" * 64),
                  configuration_sha256:("c" * 64),
                  solver_name:"synthetic-test-only",
                  solver_version:"0.1.0",
                  solver_build_ref:"fixture-only:no-solver-executed"
                },
                input_artifacts:[
                  {input_id:"mesh",kind:"finite_element_mesh",sha256:$mesh_sha,media_type:"text/plain",artifact_ref:("levels/" + $level + "/mesh.inp")}
                ],
                status:"PASS",
                evidence_class:"synthetic",
                physics_evaluated:$request[0].requested_physics,
                physics_omitted:[],
                convergence:{
                  state:"converged",
                  iterations:1,
                  residual:0.0,
                  mesh_refinement_evaluated:false,
                  details:"Synthetic mesh-refinement fixture; no solver executed."
                },
                outputs:[
                  {output_id:"normalized",kind:"displacement",sha256:$normalized_sha,media_type:"application/json",unit:"m",artifact_ref:("levels/" + $level + "/normalized.json")},
                  {output_id:"aux-stress",kind:"stress",sha256:$stress_sha,media_type:"application/json",unit:"Pa",artifact_ref:("levels/" + $level + "/stress.json")}
                ],
                uncertainty:{state:"unknown",method:null,summary:"No physical uncertainty is represented."},
                validity_envelope:{
                  supported_geometry:"synthetic fixture only",
                  supported_material_model:"synthetic fixture only",
                  load_regime:"synthetic fixture only",
                  limitations:["No numerical or physical result is asserted."]
                },
                claim_ceiling:"Synthetic receipt fixture only; not physical qualification.",
                diagnostics:[]
              }' > "$level_dir/receipt.json"
          done

          coarse_mesh="$(sha256sum "$root/levels/coarse/mesh.inp" | cut -d ' ' -f 1)"
          medium_mesh="$(sha256sum "$root/levels/medium/mesh.inp" | cut -d ' ' -f 1)"
          fine_mesh="$(sha256sum "$root/levels/fine/mesh.inp" | cut -d ' ' -f 1)"
          jq -n \
            --arg coarse_mesh "$coarse_mesh" \
            --arg medium_mesh "$medium_mesh" \
            --arg fine_mesh "$fine_mesh" '
            {
              schema_version:"physical-mesh-refinement-study-v0.1",
              study_id:"linear-bar-convergence-fixture",
              case_id:"linear-bar-test",
              observable_id:"end_displacement_m",
              unit:"m",
              dimension:1,
              trend_expectation:"monotone_expected",
              refinement_ratio_relative_tolerance:0.05,
              expected_order_min:1.5,
              reference:{
                value:0.5,
                unit:"m",
                method:"analytical_exact",
                identity:"frozen synthetic second-order oracle",
                source_ref:"test-oracle://mesh-convergence-v1"
              },
              acceptance:{
                max_fine_absolute_error:0.1,
                max_fine_relative_error:0.2
              },
              levels:[
                {level_id:"coarse",h_m:1.0,element_count:2,dof_count:10,mesh_sha256:$coarse_mesh,mesh_ref:"levels/coarse/mesh.inp",request_ref:"levels/coarse/request.json",receipt_ref:"levels/coarse/receipt.json",output_id:"normalized"},
                {level_id:"medium",h_m:0.5,element_count:16,dof_count:40,mesh_sha256:$medium_mesh,mesh_ref:"levels/medium/mesh.inp",request_ref:"levels/medium/request.json",receipt_ref:"levels/medium/receipt.json",output_id:"normalized"},
                {level_id:"fine",h_m:0.25,element_count:128,dof_count:160,mesh_sha256:$fine_mesh,mesh_ref:"levels/fine/mesh.inp",request_ref:"levels/fine/request.json",receipt_ref:"levels/fine/receipt.json",output_id:"normalized"}
              ]
            }' > "$root/study.json"

          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --mesh-study "$root/study.json" --artifact-root "$root" > "$root/report.json"
          jq -e '
            .study_status == "PASS"
            and .mesh_convergence_status == "PASS"
            and .fine_mesh_accuracy_status == "PASS"
            and .all_level_receipt_and_output_bytes_verified == true
            and .solver_build_identity_constant_across_levels == true
            and .physical_result_qualified == false
            and .real_world_validation_status == "UNRESOLVED"
            and (.observed_order_finest_three > 1.999 and .observed_order_finest_three < 2.001)
            and (.richardson_extrapolated_value > 0.499999 and .richardson_extrapolated_value < 0.500001)
          ' "$root/report.json"

          cp -a "$root" solver-contract-mesh-study-tampered-mesh
          printf 'tampered mesh bytes\n' > solver-contract-mesh-study-tampered-mesh/levels/coarse/mesh.inp
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --mesh-study solver-contract-mesh-study-tampered-mesh/study.json \
            --artifact-root solver-contract-mesh-study-tampered-mesh \
            > solver-contract-mesh-study-tampered-mesh/report.json
          jq -e '
            .study_status == "UNRESOLVED"
            and .all_level_receipt_and_output_bytes_verified == false
            and any(.diagnostics[]; contains("input artifact bytes"))
            and .physical_result_qualified == false
          ' solver-contract-mesh-study-tampered-mesh/report.json

          cp -a "$root" solver-contract-mesh-study-tampered-output
          printf 'tampered normalized observation\n' > solver-contract-mesh-study-tampered-output/levels/fine/normalized.json
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --mesh-study solver-contract-mesh-study-tampered-output/study.json \
            --artifact-root solver-contract-mesh-study-tampered-output \
            > solver-contract-mesh-study-tampered-output/report.json
          jq -e '
            .study_status == "UNRESOLVED"
            and .all_level_receipt_and_output_bytes_verified == false
            and any(.diagnostics[]; contains("artifact verification"))
            and .physical_result_qualified == false
          ' solver-contract-mesh-study-tampered-output/report.json

      - name: Audit receipt-bound equilibrium and reject tampered reaction bytes
        shell: bash
        run: |
          set -euo pipefail
          root="solver-contract-equilibrium"
          rm -rf "$root" "${root}-tampered"
          mkdir -p "$root/artifacts"

          base_request="schemas/physical-transformation/fixtures/analytical-bar-request-v0.1.json"
          jq '
            .loads[0].target_id = "cantilever-tip"
            | .loads[0].vector_xyz = [0, -1000, 0]
            | .required_outputs = ["reaction_force", "reaction_moment"]
          ' "$base_request" > "$root/request.json"

          request_sha="$(sha256sum "$root/request.json" | cut -d ' ' -f 1)"
          request_id="$(jq -r '.request_id' "$root/request.json")"
          source_revision="$(jq -r '.source_revision' "$root/request.json")"
          scene_sha="$(jq -r '.scene_sha256' "$root/request.json")"
          scene_revision="$(jq -r '.scene_revision' "$root/request.json")"
          frame="$(jq -r '.coordinate_frame_id' "$root/request.json")"
          case_id="synthetic-cantilever-equilibrium-cli"

          jq -n \
            --arg case_id "$case_id" \
            --arg request_id "$request_id" \
            --arg request_sha "$request_sha" \
            --arg scene_sha "$scene_sha" \
            --arg frame "$frame" \
            --argjson scene_revision "$scene_revision" \
            '{
              schema_version:"physical-equilibrium-reaction-forces-v0.1",
              case_id:$case_id,
              request_id:$request_id,
              request_sha256:$request_sha,
              scene_sha256:$scene_sha,
              scene_revision:$scene_revision,
              coordinate_frame_id:$frame,
              units:{length:"m",force:"N"},
              reaction_forces:[{
                reaction_id:"fixed-support",
                force_n:[0,1000,0],
                position_m:[0,0,0]
              }]
            }' > "$root/artifacts/reaction-forces.json"

          jq -n \
            --arg case_id "$case_id" \
            --arg request_id "$request_id" \
            --arg request_sha "$request_sha" \
            --arg scene_sha "$scene_sha" \
            --arg frame "$frame" \
            --argjson scene_revision "$scene_revision" \
            '{
              schema_version:"physical-equilibrium-reaction-moments-v0.1",
              case_id:$case_id,
              request_id:$request_id,
              request_sha256:$request_sha,
              scene_sha256:$scene_sha,
              scene_revision:$scene_revision,
              coordinate_frame_id:$frame,
              units:{length:"m",moment:"N*m"},
              reaction_moments:[{
                reaction_id:"fixed-support",
                moment_nm:[0,0,2000]
              }]
            }' > "$root/artifacts/reaction-moments.json"

          force_sha="$(sha256sum "$root/artifacts/reaction-forces.json" | cut -d ' ' -f 1)"
          moment_sha="$(sha256sum "$root/artifacts/reaction-moments.json" | cut -d ' ' -f 1)"
          jq -n \
            --slurpfile request "$root/request.json" \
            --arg request_sha "$request_sha" \
            --arg request_id "$request_id" \
            --arg source_revision "$source_revision" \
            --arg force_sha "$force_sha" \
            --arg moment_sha "$moment_sha" \
            '{
              schema_version:"physical-solver-receipt-v0.1",
              request_id:$request_id,
              request_sha256:$request_sha,
              source_revision:$source_revision,
              adapter:{
                adapter_id:"synthetic-equilibrium-cli-fixture",
                version:"0.1.0",
                executable_sha256:("b" * 64),
                configuration_sha256:("c" * 64),
                solver_name:"synthetic-test-only",
                solver_version:"0.1.0",
                solver_build_ref:"fixture-only:no-solver-executed"
              },
              status:"PASS",
              evidence_class:"synthetic",
              physics_evaluated:$request[0].requested_physics,
              physics_omitted:[],
              convergence:{
                state:"not_applicable",
                iterations:null,
                residual:null,
                mesh_refinement_evaluated:false,
                details:"Synthetic CLI control; no FEM solver executed."
              },
              outputs:[
                {output_id:"reaction-forces",kind:"reaction_force",sha256:$force_sha,media_type:"application/json",unit:"N",artifact_ref:"reaction-forces.json"},
                {output_id:"reaction-moments",kind:"reaction_moment",sha256:$moment_sha,media_type:"application/json",unit:"N*m",artifact_ref:"reaction-moments.json"}
              ],
              uncertainty:{state:"unknown",method:null,summary:"Synthetic control only."},
              validity_envelope:{
                supported_geometry:"synthetic fixture only",
                supported_material_model:"synthetic fixture only",
                load_regime:"synthetic fixture only",
                limitations:["No external solver executed."]
              },
              claim_ceiling:"Synthetic CLI control only; not physical qualification.",
              diagnostics:[]
            }' > "$root/receipt.json"

          jq -n \
            --arg request_id "$request_id" \
            --arg request_sha "$request_sha" \
            --arg scene_sha "$scene_sha" \
            --arg frame "$frame" \
            --argjson scene_revision "$scene_revision" \
            '{
              schema_version:"physical-equilibrium-manifest-v0.1",
              audit_id:"synthetic-equilibrium-cli-audit",
              case_id:"synthetic-cantilever-equilibrium-cli",
              request_id:$request_id,
              request_sha256:$request_sha,
              scene_sha256:$scene_sha,
              scene_revision:$scene_revision,
              coordinate_frame_id:$frame,
              origin_m:[0,0,0],
              units:{length:"m",force:"N",moment:"N*m"},
              reference:{
                method:"hand_calculated_synthetic_free_body",
                identity:"tip force balanced by fixed support reaction and couple",
                source_ref:"fixture-only:equilibrium-cli-v1"
              },
              applied_loads:[{
                load_id:"tension-001",
                target_id:"cantilever-tip",
                force_n:[0,-1000,0],
                position_m:[2,0,0],
                couple_nm:[0,0,0]
              }],
              required_reaction_force_ids:["fixed-support"],
              required_reaction_moment_ids:["fixed-support"],
              tolerances:{
                force_absolute_n:0.000000001,
                force_relative:0.000000000001,
                moment_absolute_nm:0.000000001,
                moment_relative:0.000000000001
              }
            }' > "$root/manifest.json"

          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$root/request.json" \
            --receipt "$root/receipt.json" \
            --artifact-root "$root/artifacts" \
            --equilibrium-manifest "$root/manifest.json" \
            --reaction-force-output-id reaction-forces \
            --reaction-moment-output-id reaction-moments \
            > "$root/report.json"
          jq -e '
            .audit_status == "PASS"
            and .force_balance.residual_norm == 0
            and .moment_balance.residual_norm == 0
            and .artifact_verification_status == "PASS"
            and .output_artifact_bytes_verified == true
            and .physical_result_qualified == false
            and .real_world_validation_status == "UNRESOLVED"
          ' "$root/report.json"

          cp -a "$root" "${root}-tampered"
          printf 'deliberately mutated reaction bytes\n' > "${root}-tampered/artifacts/reaction-forces.json"
          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "${root}-tampered/request.json" \
            --receipt "${root}-tampered/receipt.json" \
            --artifact-root "${root}-tampered/artifacts" \
            --equilibrium-manifest "${root}-tampered/manifest.json" \
            --reaction-force-output-id reaction-forces \
            --reaction-moment-output-id reaction-moments \
            > "${root}-tampered/report.json"
          jq -e '
            .audit_status == "UNRESOLVED"
            and .artifact_verification_status == "FAIL"
            and .output_artifact_bytes_verified == false
            and .physical_result_qualified == false
          ' "${root}-tampered/report.json"

      - name: Verify restricted stock-CCX RF equivalence and deck mutation controls
        shell: bash
        run: |
          set -euo pipefail
          root="solver-contract-restricted-rf"
          rm -rf "$root" "${root}-dload"
          mkdir -p "$root"

          jq '
            .request_id = "fixture:restricted-rf-cli"
            | .loads[0].kind = "point_force"
            | .loads[0].vector_xyz = [1000, 0, 0]
            | .boundary_conditions[0].dofs = ["ux", "uy", "uz"]
            | .required_outputs = ["reaction_force"]
          ' schemas/physical-transformation/fixtures/analytical-bar-request-v0.1.json > "$root/request.json"
          request_sha="$(sha256sum "$root/request.json" | cut -d ' ' -f 1)"
          scene_sha="$(jq -r '.scene_sha256' "$root/request.json")"
          scene_revision="$(jq -r '.scene_revision' "$root/request.json")"
          request_id="$(jq -r '.request_id' "$root/request.json")"
          frame="$(jq -r '.coordinate_frame_id' "$root/request.json")"

          cat > "$root/model.inp" <<'DECK'
          *HEADING
          synthetic axial bar (test fixture; no external solver run)
          *NODE
          1,0,0,0
          2,1,0,0
          *ELEMENT,TYPE=T3D2,ELSET=BAR
          1,1,2
          *NSET,NSET=SUPPORT
          1
          *MATERIAL,NAME=STEEL
          *ELASTIC
          210000000000,0.3
          *SOLID SECTION,ELSET=BAR,MATERIAL=STEEL
          0.01
          *BOUNDARY
          1,1,3,0
          *STEP
          *STATIC
          1.,1.,1.E-05,1.
          *CLOAD
          2,1,1000.
          *NODE PRINT,NSET=SUPPORT
          RF
          *END STEP
          DECK

          cat > "$root/model.dat" <<'DAT'
           forces (fx,fy,fz) for set SUPPORT and time 0.1000000E+01
           1 -1.000000E+03 0.000000E+00 0.000000E+00

          DAT
          deck_sha="$(sha256sum "$root/model.inp" | cut -d ' ' -f 1)"
          dat_sha="$(sha256sum "$root/model.dat" | cut -d ' ' -f 1)"

          jq -n \
            --arg case_id "restricted-rf-cli-synthetic" \
            --arg request_id "$request_id" \
            --arg request_sha "$request_sha" \
            --arg scene_sha "$scene_sha" \
            --arg frame "$frame" \
            --arg deck_sha "$deck_sha" \
            --argjson scene_revision "$scene_revision" \
            '{
              schema_version:"physical-support-node-catalog-v0.1",
              case_id:$case_id,
              request_id:$request_id,
              request_sha256:$request_sha,
              scene_sha256:$scene_sha,
              scene_revision:$scene_revision,
              coordinate_frame_id:$frame,
              deck_sha256:$deck_sha,
              units:{length:"m"},
              nodes:[{node_id:1,position_m:[0,0,0]}],
              provenance:{
                method:"independent-deck-node-inventory",
                identity:"synthetic fixed support node",
                source_ref:"fixture-only:restricted-rf-cli"
              }
            }' > "$root/node-catalog.json"
          catalog_sha="$(sha256sum "$root/node-catalog.json" | cut -d ' ' -f 1)"

          jq -n \
            --arg case_id "restricted-rf-cli-synthetic" \
            --arg request_id "$request_id" \
            --arg request_sha "$request_sha" \
            --arg scene_sha "$scene_sha" \
            --arg frame "$frame" \
            --arg deck_sha "$deck_sha" \
            --arg catalog_sha "$catalog_sha" \
            --argjson scene_revision "$scene_revision" \
            '{
              schema_version:"calculix-rf-restricted-proof-manifest-v0.1",
              case_id:$case_id,
              request_id:$request_id,
              request_sha256:$request_sha,
              scene_sha256:$scene_sha,
              scene_revision:$scene_revision,
              coordinate_frame_id:$frame,
              node_set:"SUPPORT",
              deck_sha256:$deck_sha,
              node_catalog_sha256:$catalog_sha,
              support_node_map:[{target_id:"bar-end-a",node_id:1}],
              load_node_map:[{target_id:"bar-end-b",node_id:2}],
              units:{length:"m",force:"N"},
              provenance:{
                method:"independent-request-deck-map",
                identity:"synthetic axial bar support and load mapping",
                source_ref:"fixture-only:restricted-rf-cli-v1"
              }
            }' > "$root/manifest.json"

          cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "$root/request.json" \
            --deck "$root/model.inp" \
            --dat "$root/model.dat" \
            --node-catalog "$root/node-catalog.json" \
            --restricted-rf-manifest "$root/manifest.json" \
            > "$root/report.json"
          jq -e '
            .normalization_status == "PASS"
            and .restricted_equivalence_proved == true
            and .source_semantics == "RF_under_restricted_deck_equivalence"
            and .normalized_output.reaction_forces[0].force_n[0] == -1000
            and .physical_result_qualified == false
            and .real_world_validation_status == "UNRESOLVED"
            and .deck_sha256 != .dat_sha256
          ' "$root/report.json"

          cp -a "$root" "${root}-dload"
          sed '/\*CLOAD/i *DLOAD\nBAR,GRAV,-9.81,0,0,-1' "${root}-dload/model.inp" > "${root}-dload/model-mutated.inp"
          mv "${root}-dload/model-mutated.inp" "${root}-dload/model.inp"
          bad_deck_sha="$(sha256sum "${root}-dload/model.inp" | cut -d ' ' -f 1)"
          jq --arg deck_sha "$bad_deck_sha" '.deck_sha256 = $deck_sha' \
            "${root}-dload/node-catalog.json" > "${root}-dload/node-catalog-mutated.json"
          mv "${root}-dload/node-catalog-mutated.json" "${root}-dload/node-catalog.json"
          bad_catalog_sha="$(sha256sum "${root}-dload/node-catalog.json" | cut -d ' ' -f 1)"
          jq --arg deck_sha "$bad_deck_sha" --arg catalog_sha "$bad_catalog_sha" \
            '.deck_sha256 = $deck_sha | .node_catalog_sha256 = $catalog_sha' \
            "${root}-dload/manifest.json" > "${root}-dload/manifest-mutated.json"
          mv "${root}-dload/manifest-mutated.json" "${root}-dload/manifest.json"
          if cargo run --quiet --locked --manifest-path research/physical-solver-contract/Cargo.toml -- \
            --request "${root}-dload/request.json" \
            --deck "${root}-dload/model.inp" \
            --dat "${root}-dload/model.dat" \
            --node-catalog "${root}-dload/node-catalog.json" \
            --restricted-rf-manifest "${root}-dload/manifest.json" \
            > "${root}-dload/report.json" 2> "${root}-dload/error.log"; then
            echo "DLOAD mutation unexpectedly passed restricted RF normalization" >&2
            exit 1
          fi
          grep -q "unsupported deck keyword '\*DLOAD'" "${root}-dload/error.log"

      - name: Upload validation receipts and reports
        uses: actions/upload-artifact@v4
        with:
          name: physical-solver-contract-receipts
          path: |
            solver-contract-*-receipt.json
            solver-contract-*verification.json
            solver-contract-numerical-comparison-*.json
            solver-contract-mesh-study*/study.json
            solver-contract-mesh-study*/report.json
            solver-contract-equilibrium*/manifest.json
            solver-contract-equilibrium*/report.json
            solver-contract-restricted-rf*/manifest.json
            solver-contract-restricted-rf*/report.json
          if-no-files-found: error
          retention-days: 90

