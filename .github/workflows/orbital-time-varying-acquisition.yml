name: Orbital Time-Varying Acquisition Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-time-varying-acquisition-bench/**"
      - "docs/research/orbital-truss/fixtures/time-varying-acquisition-v0_1.json"
      - "docs/research/orbital-truss/orbital_time_varying_acquisition_corpus_v0_1.schema.json"
      - "docs/research/orbital-truss/orbital_time_varying_acquisition_v0_1.md"
      - ".github/workflows/orbital-time-varying-acquisition.yml"
  push:
    branches:
      - "research/orbital-time-varying-acquisition-v0-1"
    paths:
      - "tools/orbital-time-varying-acquisition-bench/**"
      - "docs/research/orbital-truss/fixtures/time-varying-acquisition-v0_1.json"
      - "docs/research/orbital-truss/orbital_time_varying_acquisition_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-time-varying-acquisition.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Time-varying bounds and independent Fraction oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and Draft 2020-12 schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/time-varying-acquisition-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_time_varying_acquisition_corpus_v0_1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert len(fixture["cases"]) == 17
          assert len({case["case_id"] for case in fixture["cases"]}) == 17
          print("17 time-varying acquisition cases and Draft 2020-12 schema validated")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-time-varying-acquisition-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-time-varying-acquisition-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-time-varying-acquisition-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-time-varying-acquisition-bench/Cargo.toml --bin orbital-time-varying-acquisition-bench -- docs/research/orbital-truss/fixtures/time-varying-acquisition-v0_1.json "$GITHUB_SHA" > /tmp/time-varying-rust-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-time-varying-acquisition-bench/Cargo.toml --bin orbital-time-varying-acquisition-bench -- docs/research/orbital-truss/fixtures/time-varying-acquisition-v0_1.json "$GITHUB_SHA" > /tmp/time-varying-rust-b.json
          cmp /tmp/time-varying-rust-a.json /tmp/time-varying-rust-b.json
      - name: Independent Fraction oracle
        run: |
          python3 tools/orbital-time-varying-acquisition-bench/tests/reference_oracle.py docs/research/orbital-truss/fixtures/time-varying-acquisition-v0_1.json "$GITHUB_SHA" > /tmp/time-varying-python.json
      - name: Compare complete Rust and Python receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/time-varying-rust-a.json").read_text())
          oracle = json.loads(Path("/tmp/time-varying-python.json").read_text())
          assert rust == oracle
          assert rust["expected_outcome_matches"] == 17
          assert rust["expected_outcome_mismatches"] == 0
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert cases["TV-016-FRAME-WINDOW-TRAP"]["bounds"]["combined_frame"]["total_um"] == 13
          assert cases["TV-014-EXACT-BOUNDARY"]["status"] == "WITHIN_DECLARED_BUDGET"
          assert cases["TV-017-FAILED-CALIBRATION"]["status"] == "BLOCKED"
          assert cases["TV-012-PROJECTION-OVERFLOW"]["status"] == "INVALID_INPUT"
          print("Rust and independent Fraction oracle agree on all 17 time-varying cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-time-varying-acquisition-evidence
          path: |
            /tmp/time-varying-rust-a.json
            /tmp/time-varying-python.json
            docs/research/orbital-truss/fixtures/time-varying-acquisition-v0_1.json
            docs/research/orbital-truss/orbital_time_varying_acquisition_corpus_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
