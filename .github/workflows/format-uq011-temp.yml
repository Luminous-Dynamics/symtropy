name: Temporary UQ-011 Rustfmt

on:
  push:
    branches:
      - research/ehd-piv-functional-covariance-closure-v0-7
    paths:
      - .github/workflows/format-uq011-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Format functional UQ crate
        run: cargo fmt --manifest-path tools/ehd-piv-conformal-functional-uq/Cargo.toml
      - name: Check whitespace
        run: git diff --check
      - name: Commit formatting-only changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "UQ-011 source is already rustfmt-clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ehd-piv-conformal-functional-uq
          git commit -m "style(ehd-piv): format integrated functional covariance closure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
