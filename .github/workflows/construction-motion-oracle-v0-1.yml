name: Construction Motion Oracle v0.1

on:
  pull_request:
    branches:
      - research/construction-motion-envelope-v0-1
      - research/construction-motion-oracle-bench-v0-1
      - research/construction-capsule-oracle-v0-1
      - research/construction-translating-capsule-oracle-v0-1
      - research/construction-co-translating-capsule-oracle-v0-2
      - research/construction-absolute-time-capsule-ccd-v0-1
      - research/construction-multibody-time-swept-broadphase-v0-1
      - research/construction-multibody-relative-clock-domain-ccd-v0-1
      - research/construction-relative-time-conservative-broadphase-v0-1
      - research/construction-hierarchical-multibody-broadphase-v0-1
      - research/construction-cached-slab-bound-refinement-v0-1
    paths:
      - "research/construction-motion-oracle-v0-1/**"
      - ".github/workflows/construction-motion-oracle-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Locked metadata
        run: cargo metadata --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked --format-version 1
      - name: Formatting
        run: cargo fmt --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked --all-targets -- -D warnings
      - name: Differential benchmark
        if: runner.os == 'Linux'
        run: cargo run --release --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --bin differential-bench
