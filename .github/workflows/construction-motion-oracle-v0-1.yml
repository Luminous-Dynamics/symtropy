name: Construction Motion Oracle v0.1

on:
  push:
    branches: [research/construction-verified-stop-aware-dispatch-v0-1, research/construction-stop-tube-geometry-builder-v0-1]
  pull_request:
    branches: [research/construction-motion-envelope-v0-1, research/construction-motion-oracle-bench-v0-1, research/construction-field-independent-acceptance-scorer-v0-1, research/construction-site-state-ledger-v0-1, research/construction-space-time-dispatch-gate-v0-1, research/construction-dependency-scoped-invalidation-v0-1, research/construction-verified-stop-aware-dispatch-v0-1, research/construction-stop-tube-occupancy-binding-v0-1]
    paths:
      - "research/construction-motion-oracle-v0-1/**"
      - ".github/workflows/construction-motion-oracle-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Draft 2020-12 construction schema and fixture validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Validate event, IFC/IDS and stop-tube schemas and known-answer fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/construction-motion-oracle-v0-1")
          event_schema = json.loads((root / "schema/site-state-event-v0.1.schema.json").read_text())
          event_fixture = json.loads((root / "examples/site-state-event-stream-synthetic-v0.1.json").read_text())
          ifc_schema = json.loads((root / "schema/ifc-ids-preflight-input-v0.1.schema.json").read_text())
          ifc_fixture = json.loads((root / "examples/ifc-ids-preflight-input-synthetic-v0.1.json").read_text())
          stop_tube_schema = json.loads((root / "schema/stop-tube-envelope-v0.1.schema.json").read_text())
          stop_tube_fixture = json.loads((root / "examples/stop-tube-envelope-synthetic-v0.1.json").read_text())
          stop_tube_build_schema = json.loads((root / "schema/stop-tube-build-report-v0.1.schema.json").read_text())
          stop_tube_build_fixture = json.loads((root / "examples/stop-tube-build-report-synthetic-v0.1.json").read_text())

          Draft202012Validator.check_schema(event_schema)
          Draft202012Validator.check_schema(ifc_schema)
          Draft202012Validator.check_schema(stop_tube_schema)
          Draft202012Validator.check_schema(stop_tube_build_schema)
          event_validator = Draft202012Validator(event_schema)
          ifc_validator = Draft202012Validator(ifc_schema)
          stop_tube_validator = Draft202012Validator(stop_tube_schema)
          stop_tube_build_validator = Draft202012Validator(stop_tube_build_schema)

          for event in event_fixture:
              event_validator.validate(event)
          ifc_validator.validate(ifc_fixture)
          stop_tube_validator.validate(stop_tube_fixture)
          stop_tube_build_validator.validate(stop_tube_build_fixture)

          assert stop_tube_build_fixture["slice_count"] == len(stop_tube_build_fixture["slices"])
          assert stop_tube_build_fixture["slice_count"] == (
              stop_tube_build_fixture["primitive_count"]
              * stop_tube_build_fixture["trigger_window_count"]
          )
          assert (
              stop_tube_build_fixture["trigger_domain_end_ms"]
              - stop_tube_build_fixture["trigger_domain_start_ms"]
              == stop_tube_build_fixture["trigger_domain_duration_ms"]
          )
          assert stop_tube_build_fixture["stop_coverage_duration_ms"] >= (
              stop_tube_build_fixture["trigger_domain_duration_ms"]
              + stop_tube_build_fixture["conservative_stop_time_bound_ms"]
          )
          for item in stop_tube_build_fixture["slices"]:
              assert item["occupancy_start_ms"] == item["trigger_start_ms"]
              assert item["occupancy_end_ms"] == (
                  item["trigger_end_ms"]
                  + stop_tube_build_fixture["conservative_stop_time_bound_ms"]
              )

          ids = [event["event_id"] for event in event_fixture]
          sequences = [event["sequence"] for event in event_fixture]
          assert len(ids) == len(set(ids)), "duplicate event IDs in fixture"
          assert sequences == list(range(1, len(sequences) + 1)), "event sequence is not contiguous"
          for index, event in enumerate(event_fixture):
              expected_previous = None if index == 0 else event_fixture[index - 1]["event_sha256"]
              assert event["previous_event_sha256"] == expected_previous, "event hash-link fixture mismatch"
          assert any(event["payload"]["kind"] == "execution_interrupted" for event in event_fixture)
          assert all(isinstance(item, dict) for item in event_schema["properties"]["payload"]["oneOf"])

          print(f"PASS: four Draft 2020-12 schemas, {len(event_fixture)} site-state events, IFC/IDS fixture, stop-tube receipt and geometry-builder report fixture")
          print("LIMIT: fixture hashes are synthetic and this does not verify real signatures or event digests")
          PY
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Locked metadata
        run: cargo metadata --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked --format-version 1
      - name: Formatting
        run: cargo fmt --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked --all-targets -- -D warnings
      - name: Differential benchmark
        if: runner.os == 'Linux'
        run: cargo run --release --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --bin differential-bench
      - name: Stop-tube geometry builder benchmark
        if: runner.os == 'Linux'
        run: cargo run --release --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --bin stop-tube-builder-bench
