name: Construction Motion Oracle v0.1

on:
  pull_request:
    branches: [research/construction-motion-envelope-v0-1, research/construction-motion-oracle-bench-v0-1, research/construction-field-independent-acceptance-scorer-v0-1, research/construction-site-state-ledger-v0-1, research/construction-space-time-dispatch-gate-v0-1, research/construction-space-time-resource-reservation-v0-1, research/construction-cumulative-resource-capacity-v0-1, research/construction-robust-capacity-derating-v0-1, research/construction-capacity-n-atomic-admission-v0-1]
    paths:
      - "research/construction-motion-oracle-v0-1/**"
      - ".github/workflows/construction-motion-oracle-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Locked metadata
        run: cargo metadata --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked --format-version 1
      - name: Formatting
        run: cargo fmt --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --locked --all-targets -- -D warnings
      - name: Composite resource event schema validation
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/construction-motion-oracle-v0-1")
          schema = json.loads((root / "schema/site-state-event-v0.1.schema.json").read_text())
          fixture = json.loads((root / "examples/composite-resource-admission-event-synthetic-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(fixture)
          print("PASS: composite resource admission event schema and synthetic fixture")
          PY
      - name: Differential benchmark
        if: runner.os == 'Linux'
        run: cargo run --release --manifest-path research/construction-motion-oracle-v0-1/Cargo.toml --bin differential-bench
