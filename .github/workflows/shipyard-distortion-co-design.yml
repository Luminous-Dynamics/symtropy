name: Shipyard Distortion Co-Design

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-distortion-co-design/**"
      - "crates/tools/shipyard-distortion-co-design/Cargo.lock"
      - "benchmarks/shipyard/distortion-co-design/**"
      - "docs/tech/SHIPYARD_DISTORTION_CO_DESIGN_V0_1*"
      - "docs/tech/SHIPYARD_DISTORTION_CO_DESIGN_ENUMERABLE_ORACLE_V0_1.schema.json"
      - "rust-toolchain.toml"
      - ".github/workflows/shipyard-distortion-co-design.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-distortion-co-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic sequence, fixture and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply pinned Rust formatting for repair capture
        run: cargo fmt --manifest-path crates/tools/shipyard-distortion-co-design/Cargo.toml --all

      - name: Capture pinned rustfmt source output
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-distortion
          path: crates/tools/shipyard-distortion-co-design/src/main.rs
          if-no-files-found: error
          retention-days: 1

      - name: Run contract evaluator tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-distortion-co-design/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-distortion-co-design/Cargo.toml --all-targets -- -D warnings

      - name: Verify frozen co-design corpus
        run: cargo run --locked --manifest-path crates/tools/shipyard-distortion-co-design/Cargo.toml -- benchmarks/shipyard/distortion-co-design/corpus-v0.1.json

      - name: Exhaustively verify enumerable sequence/fixture/release Pareto oracle
        run: cargo run --locked --manifest-path crates/tools/shipyard-distortion-co-design/Cargo.toml -- --oracle

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
