name: Shipyard Distortion Co-Design

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-distortion-co-design/**"
      - "benchmarks/shipyard/distortion-co-design/**"
      - "docs/tech/SHIPYARD_DISTORTION_CO_DESIGN_V0_1*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/shipyard-distortion-co-design.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-distortion-co-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic sequence, fixture and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run contract evaluator tests
        run: cargo test --locked -p shipyard-distortion-co-design

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked -p shipyard-distortion-co-design --all-targets -- -D warnings

      - name: Verify frozen co-design corpus
        run: cargo run --locked -p shipyard-distortion-co-design -- benchmarks/shipyard/distortion-co-design/corpus-v0.1.json

      - name: Exhaustively verify enumerable sequence/fixture/release Pareto oracle
        run: cargo run --locked -p shipyard-distortion-co-design -- --oracle

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
