name: Orbital Acquisition Scope Coherence Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-acquisition-scope-coherence-bench/**"
      - "docs/research/orbital-truss/fixtures/acquisition-scope-coherence-v0_1.json"
      - "docs/research/orbital-truss/orbital_acquisition_scope_coherence_corpus_v0_1.schema.json"
      - "docs/research/orbital-truss/orbital_acquisition_scope_coherence_v0_1.md"
      - ".github/workflows/orbital-acquisition-scope-coherence.yml"
  push:
    branches:
      - "research/orbital-acquisition-scope-coherence-v0-1"
    paths:
      - "tools/orbital-acquisition-scope-coherence-bench/**"
      - "docs/research/orbital-truss/fixtures/acquisition-scope-coherence-v0_1.json"
      - "docs/research/orbital-truss/orbital_acquisition_scope_coherence_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-acquisition-scope-coherence.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Exact scope bindings and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and Draft 2020-12 schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/acquisition-scope-coherence-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_acquisition_scope_coherence_corpus_v0_1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert len(fixture["cases"]) == 26
          assert len({case["case_id"] for case in fixture["cases"]}) == 26
          print("26 scope-coherence cases and Draft 2020-12 schema validated")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-acquisition-scope-coherence-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-acquisition-scope-coherence-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-acquisition-scope-coherence-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-acquisition-scope-coherence-bench/Cargo.toml --bin orbital-acquisition-scope-coherence-bench -- docs/research/orbital-truss/fixtures/acquisition-scope-coherence-v0_1.json "$GITHUB_SHA" > /tmp/scope-rust-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-acquisition-scope-coherence-bench/Cargo.toml --bin orbital-acquisition-scope-coherence-bench -- docs/research/orbital-truss/fixtures/acquisition-scope-coherence-v0_1.json "$GITHUB_SHA" > /tmp/scope-rust-b.json
          cmp /tmp/scope-rust-a.json /tmp/scope-rust-b.json
      - name: Independent scope oracle
        run: |
          python3 tools/orbital-acquisition-scope-coherence-bench/tests/reference_oracle.py docs/research/orbital-truss/fixtures/acquisition-scope-coherence-v0_1.json "$GITHUB_SHA" > /tmp/scope-python.json
      - name: Compare complete Rust and Python receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/scope-rust-a.json").read_text())
          oracle = json.loads(Path("/tmp/scope-python.json").read_text())
          assert rust == oracle
          assert rust["expected_disposition_matches"] == 26
          assert rust["expected_disposition_mismatches"] == 0
          assert rust["source_bytes_authenticated"] is False
          assert rust["authority_granted"] is False
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert cases["SC-001-ALL-MATCH"]["disposition"] == "SCOPE_COHERENT"
          assert cases["SC-011-CLOCK-MAP-MISMATCH"]["disposition"] == "OUT_OF_SCOPE"
          assert cases["SC-015-VALIDITY-START-TOO-LATE"]["disposition"] == "INDETERMINATE"
          assert cases["SC-016-TOUCHES-VALID-UNTIL"]["disposition"] == "INDETERMINATE"
          assert cases["SC-025-VALIDITY-WHOLLY-BEFORE"]["disposition"] == "OUT_OF_SCOPE"
          assert cases["SC-026-ACQUISITION-WHOLLY-AFTER"]["disposition"] == "OUT_OF_SCOPE"
          assert cases["SC-017-MISSING-SCOPE"]["disposition"] == "INDETERMINATE"
          assert cases["SC-023-MISSING-TIMING-EVIDENCE"]["disposition"] == "INDETERMINATE"
          assert cases["SC-024-EXTRA-SCOPE-CLAIM-MISMATCH"]["disposition"] == "OUT_OF_SCOPE"
          assert cases["SC-019-DUPLICATE-SCOPE-FIELD"]["disposition"] == "INVALID_INPUT"
          assert cases["SC-022-DIGEST-NOT-AUTH"]["disposition"] == "SCOPE_COHERENT"
          print("Rust and independent scope oracle agree on all 26 scope-coherence cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-acquisition-scope-coherence-evidence
          path: |
            /tmp/scope-rust-a.json
            /tmp/scope-python.json
            docs/research/orbital-truss/fixtures/acquisition-scope-coherence-v0_1.json
            docs/research/orbital-truss/orbital_acquisition_scope_coherence_corpus_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
