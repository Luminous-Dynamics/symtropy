name: Shipyard Weld Physics VVUQ

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-weld-physics-vvuq/**"
      - "benchmarks/shipyard/weld-physics/**"
      - "docs/tech/SHIPYARD_WELD_PHYSICS_VVUQ_V0_1*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/shipyard-weld-physics-vvuq.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-weld-physics-vvuq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frozen weld-physics manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run independent manifest verifier tests
        run: cargo test --locked -p shipyard-weld-physics-vvuq

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked -p shipyard-weld-physics-vvuq --all-targets -- -D warnings

      - name: Verify exact frozen source/case manifest
        run: cargo run --locked -p shipyard-weld-physics-vvuq -- benchmarks/shipyard/weld-physics/vvuq-corpus-v0.1.json

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
