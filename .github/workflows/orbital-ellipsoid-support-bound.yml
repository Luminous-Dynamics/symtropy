name: Orbital Ellipsoid Support Bound Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-ellipsoid-support-bound-bench/**"
      - ".github/workflows/orbital-ellipsoid-support-bound.yml"
  push:
    branches:
      - "research/orbital-ellipsoid-support-bound-v0-1"
    paths:
      - "tools/orbital-ellipsoid-support-bound-bench/**"
      - ".github/workflows/orbital-ellipsoid-support-bound.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Directional support bound and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/orbital-ellipsoid-support-bound-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-ellipsoid-support-bound-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-ellipsoid-support-bound-bench/Cargo.toml --all-targets -- -D warnings
      - name: Bind frozen corpus digest
        run: |
          echo "CORPUS_SHA256=$(sha256sum tools/orbital-ellipsoid-support-bound-bench/fixtures/ellipsoid-support-corpus-v0_1.csv | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Deterministic Rust receipt
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-ellipsoid-support-bound-bench/Cargo.toml --bin orbital-ellipsoid-support-bound-bench -- tools/orbital-ellipsoid-support-bound-bench/fixtures/ellipsoid-support-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/support-rust.json
          cargo run --quiet --locked --manifest-path tools/orbital-ellipsoid-support-bound-bench/Cargo.toml --bin orbital-ellipsoid-support-bound-bench -- tools/orbital-ellipsoid-support-bound-bench/fixtures/ellipsoid-support-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/support-rust-replay.json
          cmp /tmp/support-rust.json /tmp/support-rust-replay.json
      - name: Independent Python integer oracle
        run: |
          python3 tools/orbital-ellipsoid-support-bound-bench/tests/reference_oracle.py tools/orbital-ellipsoid-support-bound-bench/fixtures/ellipsoid-support-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/support-python.json
      - name: Compare complete receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/support-rust.json").read_text())
          oracle = json.loads(Path("/tmp/support-python.json").read_text())
          assert rust == oracle
          assert rust["case_count"] == 36
          assert rust["expected_disposition_matches"] == 36
          assert rust["expected_disposition_mismatches"] == 0
          assert rust["claim_ready"] is False
          assert rust["source_bytes_authenticated"] is False
          assert rust["physical_geometry_validated"] is False
          assert rust["authority_granted"] is False
          cases = {item["case_id"]: item for item in rust["results"]}
          assert cases["ES001"]["rho_y_upper_um"] == 1000000
          assert cases["ES003"]["rho_y_upper_um"] == 707107
          assert cases["ES012"]["disposition"] == "INVALID_INPUT"
          assert cases["ES016"]["disposition"] == "OUT_OF_SCOPE"
          assert cases["ES026"]["disposition"] == "OVERFLOW"
          assert cases["ES025"]["disposition"] == "INVALID_INPUT"
          print("36 directional support cases: exact Rust/Python receipt equality")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-ellipsoid-support-bound-evidence
          path: |
            /tmp/support-rust.json
            /tmp/support-python.json
            tools/orbital-ellipsoid-support-bound-bench/fixtures/ellipsoid-support-corpus-v0_1.csv
          if-no-files-found: error
          retention-days: 30
