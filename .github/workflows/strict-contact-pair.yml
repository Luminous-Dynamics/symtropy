name: Strict Contact Pair Reference

on:
  push:
    branches:
      - feat/atomic-contact-impulse-pair-v0-1
    paths:
      - "crates/core/symtropy-physics/**"
      - "crates/core/symtropy-math/**"
      - ".github/workflows/strict-contact-pair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-contact-pair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-contact-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy -p symtropy-math -p symtropy-physics --all-targets -- -D warnings
      - name: Physics Core Tests
        run: cargo test -p symtropy-math -p symtropy-physics --lib
      - name: Workspace Build
        run: cargo check --workspace --all-targets
