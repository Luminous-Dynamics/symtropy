name: GeoFusion SSP 2.0.1 Package Qualification

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research/geofusion-ssp-package-v0.1/**"
      - ".github/workflows/geofusion-ssp-package.yml"
  push:
    branches: ["main"]
    paths:
      - "research/geofusion-ssp-package-v0.1/**"
      - ".github/workflows/geofusion-ssp-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geofusion-ssp-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Verify SSP 2.0.1 descriptor and adversarial package corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned XML schema validator
        run: python -m pip install --disable-pip-version-check --requirement research/geofusion-ssp-package-v0.1/requirements.txt
      - name: Run SSP package schema and negative-control tests
        working-directory: research/geofusion-ssp-package-v0.1
        run: python -m unittest discover -s tests -v
