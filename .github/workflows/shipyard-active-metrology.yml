name: Shipyard Active Metrology

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-active-metrology/**"
      - "docs/tech/SHIPYARD_ACTIVE_METROLOGY_V0_1*"
      - "benchmarks/shipyard/active-metrology/**"
      - ".github/workflows/shipyard-active-metrology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-active-metrology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic active-metrology decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-active-metrology/Cargo.toml --all -- --check

      - name: Run active-metrology contract tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-active-metrology/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-active-metrology/Cargo.toml --all-targets -- -D warnings

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
