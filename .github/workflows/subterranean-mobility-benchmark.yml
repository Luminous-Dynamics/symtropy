name: Subterranean Mobility Benchmark

on:
  push:
    branches: ["main"]
    paths:
      - "crates/tools/subterranean-mobility-benchmark/**"
      - ".github/workflows/subterranean-mobility-benchmark.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/tools/subterranean-mobility-benchmark/**"
      - ".github/workflows/subterranean-mobility-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subterranean-mobility-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/subterranean-mobility-benchmark/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --locked --offline --manifest-path crates/tools/subterranean-mobility-benchmark/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --locked --offline --manifest-path crates/tools/subterranean-mobility-benchmark/Cargo.toml --all-targets -- -D warnings

      - name: Run demonstration
        run: cargo run --locked --offline --manifest-path crates/tools/subterranean-mobility-benchmark/Cargo.toml --bin subterranean-mobility-benchmark
