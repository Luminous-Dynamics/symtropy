name: WPT Standards Register

on:
  push:
    branches: ["main"]
    paths:
      - "research/wpt-standards-v0/**"
      - "tools/wpt-standards-register/**"
      - ".github/workflows/wpt-standards-register.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/wpt-standards-v0/**"
      - "tools/wpt-standards-register/**"
      - ".github/workflows/wpt-standards-register.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test standards register validator
        run: cargo test --locked --manifest-path tools/wpt-standards-register/Cargo.toml
      - name: Validate source register
        run: cargo run --locked --manifest-path tools/wpt-standards-register/Cargo.toml -- research/wpt-standards-v0/standards.tsv
