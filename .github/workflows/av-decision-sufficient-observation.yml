name: AV decision-sufficient observation fixture audit

on:
  push:
    branches:
      - research/av-decision-sufficient-observation-v0
    paths:
      - "research/av-decision-sufficient-observation-v0/**"
      - ".github/workflows/av-decision-sufficient-observation.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/av-decision-sufficient-observation-v0/**"
      - ".github/workflows/av-decision-sufficient-observation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: av-decision-sufficient-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head:
    name: Exact-head fixture audit, tests and strict Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install repository-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Assert Rust toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          cargo --version
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --manifest-path research/av-decision-sufficient-observation-v0/Cargo.toml --all -- --check

      - name: Run fixture audit tests
        run: cargo test --locked --manifest-path research/av-decision-sufficient-observation-v0/Cargo.toml

      - name: Run independent finite-fixture audit
        run: |
          cargo run --locked --manifest-path research/av-decision-sufficient-observation-v0/Cargo.toml -- \
            research/av-decision-sufficient-observation-v0/fixtures/agent/agent-inputs-v1.json \
            research/av-decision-sufficient-observation-v0/fixtures/evaluator-only/evaluator-oracle-v1.json \
            research/av-decision-sufficient-observation-v0/fixtures/expected/known-answer-scorecard-v1.json

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/av-decision-sufficient-observation-v0/Cargo.toml --all-targets -- -D warnings
