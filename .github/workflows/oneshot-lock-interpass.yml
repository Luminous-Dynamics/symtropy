name: One-shot Cargo 1.96 lockfile generation (interpass)

on:
  push:
    branches:
      - "research/shipyard-interpass-adaptive-v0-1-clean"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Generate lockfile with pinned Cargo
        run: cargo generate-lockfile --manifest-path crates/tools/shipyard-interpass-adaptive/Cargo.toml

      - name: Commit generated local lockfile
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- crates/tools/shipyard-interpass-adaptive/Cargo.lock; then
            echo "Local lockfile already matches Cargo 1.96 resolution"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tools/shipyard-interpass-adaptive/Cargo.lock
          git commit -m "build: regenerate locked dependencies for shipyard-interpass-adaptive"
          git push origin "HEAD:${TARGET_BRANCH}"
