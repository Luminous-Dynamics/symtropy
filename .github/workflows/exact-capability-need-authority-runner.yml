name: Exact Capability Need Authority Runner

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: exact-capability-need-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Apply and prove exact F10-F5 need binding
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/symtropy-f5-need-authority-target
    steps:
      - name: Check out exact #321 product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fabrication/exact-capability-need-binding
          path: product
          fetch-depth: 0

      - name: Check out exact authority tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact qualification subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "3c77f5ba2429fbcd36fefeeda3d30289de2d7ae0"
          test "$(git -C runner-tools rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C runner-tools hash-object .github/repair/exact_capability_need_binding.py)" = "ac7deeab879084c142074a3109af445b492de037"
          test "$(git -C runner-tools hash-object .github/repair/exact_capability_binary_bridge.py)" = "43e079ce7c10c6b7bbe0e00c05b855ccba0f0ed5"
          test "$(git -C runner-tools hash-object .github/repair/exact_capability_need_schema.py)" = "1437466d5899f24a316447791e01a9537f3febd4"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C runner-tools status --porcelain=v1 --untracked-files=all)"
          echo "F5_PARENT_HEAD=$(git -C product rev-parse HEAD)"
          echo "F5_PARENT_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "F5_QUALIFIER_HEAD=$(git -C runner-tools rev-parse HEAD)"
          echo "F5_NEED_TRANSFORM_BLOB=ac7deeab879084c142074a3109af445b492de037"
          echo "F5_BINARY_BRIDGE_BLOB=43e079ce7c10c6b7bbe0e00c05b855ccba0f0ed5"
          echo "F5_SCHEMA_TRANSFORM_BLOB=1437466d5899f24a316447791e01a9537f3febd4"
          echo "F5_CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "IMAGE_OS=${ImageOS:-unknown}"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}"
          uname -a
          git --version

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Prove exact qualified #321 parent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check --locked -p symtropy-fabrication --lib
          cargo test --locked -p symtropy-fabrication --lib
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Bind locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test -s Cargo.lock
          git ls-files --error-unmatch Cargo.lock >/dev/null
          cargo metadata --locked --format-version 1 > /tmp/f5-cargo-metadata.json
          echo "F5_LOCK_BLOB=$(git hash-object Cargo.lock)"
          echo "F5_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          echo "F5_METADATA_SHA256=$(sha256sum /tmp/f5-cargo-metadata.json | awk '{print $1}')"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply exact F5 need-binding transforms
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/exact_capability_need_binding.py
          python3 ../runner-tools/.github/repair/exact_capability_binary_bridge.py
          python3 ../runner-tools/.github/repair/exact_capability_need_schema.py
          cargo fmt -p symtropy-fabrication -p symtropy-firstlight

      - name: Prove exact semantic source scope
        shell: bash
        run: |
          set -euo pipefail
          cd product
          expected=$(cat <<'EOF'
          crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs
          crates/domains/symtropy-fabrication/src/capability.rs
          crates/domains/symtropy-fabrication/src/executable_plan.rs
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$(printf '%s\n' "$actual")" = "$(printf '%s\n' "$expected" | sort)"
          printf '%s\n' "$actual"

      - name: Prove exact F5 authority shape
        shell: bash
        run: |
          set -euo pipefail
          cd product
          grep -q 'CAPABILITY_NEED_SNAPSHOT_SCHEMA_VERSION' crates/domains/symtropy-fabrication/src/capability.rs
          grep -q 'UnsupportedNeedSnapshotSchemaVersion' crates/domains/symtropy-fabrication/src/capability.rs
          grep -q 'exact_need_snapshot_binds_schema_version_and_rejects_unknown_wire_version' crates/domains/symtropy-fabrication/src/capability.rs
          grep -q 'struct CapabilityNeedSnapshot' crates/domains/symtropy-fabrication/src/capability.rs
          grep -q 'new_with_capability_needs' crates/domains/symtropy-fabrication/src/executable_plan.rs
          grep -q 'MissingCapabilityNeedBinding' crates/domains/symtropy-fabrication/src/executable_plan.rs
          grep -q 'NonBinaryF5BootstrapRequirement' crates/domains/symtropy-fabrication/src/executable_plan.rs
          grep -q 'f5_backed_process_requirement_must_remain_binary_at_f4_bridge' crates/domains/symtropy-fabrication/src/executable_plan.rs
          grep -q 'real_patch_conduit_exact_plan_binds_every_f5_need_semantically' crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs
          grep -q 'deserialization_rejects_nested_cyclic_f10_plan' crates/domains/symtropy-fabrication/src/executable_plan.rs
          grep -q 'deserialization_rejects_nested_f10_unknown_dependency_step' crates/domains/symtropy-fabrication/src/executable_plan.rs

      - name: Run locked transformed Fabrication tests
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo test --locked -p symtropy-fabrication --lib

      - name: Run strict transformed Fabrication Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings

      - name: Check exact Construction consumer
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check --locked -p symtropy-construction --lib

      - name: Check Firstlight Patch Conduit consumer
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo check --locked -p symtropy-firstlight

      - name: Prove lock and manifests stayed fixed
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git diff --exit-code -- Cargo.lock Cargo.toml crates/domains/symtropy-fabrication/Cargo.toml crates/domains/symtropy-construction/Cargo.toml crates/apps/symtropy-firstlight/Cargo.toml
          expected=$(cat <<'EOF'
          crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs
          crates/domains/symtropy-fabrication/src/capability.rs
          crates/domains/symtropy-fabrication/src/executable_plan.rs
          EOF
          )
          actual=$(git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | sort)
          test "$(printf '%s\n' "$actual")" = "$(printf '%s\n' "$expected" | sort)"

      - name: Commit exact #605 semantic source only
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/domains/symtropy-fabrication/src/capability.rs \
            crates/domains/symtropy-fabrication/src/executable_plan.rs \
            crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs
          expected=$(cat <<'EOF'
          crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs
          crates/domains/symtropy-fabrication/src/capability.rs
          crates/domains/symtropy-fabrication/src/executable_plan.rs
          EOF
          )
          staged=$(git diff --cached --name-only | sort)
          test "$(printf '%s\n' "$staged")" = "$(printf '%s\n' "$expected" | sort)"
          test -z "$(git diff --name-only)"
          git commit -m "fix(fabrication): bind executable plans to exact F5 needs"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "F5_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo "F5_PRODUCT_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse product-branch race and push exact qualified head
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin refs/heads/fabrication/exact-capability-need-binding | awk '{print $1}')"
          test "${remote_head}" = "3c77f5ba2429fbcd36fefeeda3d30289de2d7ae0"
          git push origin HEAD:fabrication/exact-capability-need-binding
