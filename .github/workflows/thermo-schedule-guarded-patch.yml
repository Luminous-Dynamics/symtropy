name: guarded thermodynamic schedule patch

on:
  push:
    branches:
      - "physics/thermo-fixed-schedule-adapter-v0.1"

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(thermo): stage guarded schedule patcher v6' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact-preimage schedule migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/thermo_schedule_guarded_patch.py
          git diff --check
          git diff -- src/systems/thermodynamic.rs src/systems/thermodynamic_schedule.rs src/plugin.rs

      - name: Commit surgical migration and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/systems/thermodynamic.rs src/systems/thermodynamic_schedule.rs src/plugin.rs
          git rm .github/workflows/thermo-schedule-guarded-patch.yml scripts/thermo_schedule_guarded_patch.py
          git commit -m "fix(thermo): switch FixedUpdate to transactional schedule"
          git push origin HEAD:physics/thermo-fixed-schedule-adapter-v0.1
