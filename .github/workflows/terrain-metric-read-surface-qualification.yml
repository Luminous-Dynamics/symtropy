name: Terrain Metric Read Surface Qualification

on:
  push:
    branches:
      - "ci/terrain-metric-read-surface-qual-552dda8"
    paths:
      - ".github/workflows/terrain-metric-read-surface-qualification.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify immutable Terrain metric read-surface product
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact harness lineage
        shell: bash
        run: |
          set -euo pipefail
          product=552dda82caac15b457b264c07cc3f829658fae83
          qualifier=.github/workflows/terrain-metric-read-surface-qualification.yml
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${product}"
          test "$(git diff --name-only ${product}..HEAD)" = "${qualifier}"

      - name: Checkout immutable product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 552dda82caac15b457b264c07cc3f829658fae83
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact immutable product
        shell: bash
        run: |
          set -euo pipefail
          product=552dda82caac15b457b264c07cc3f829658fae83
          base=7bb937cb6b47eaff5dcd5b9bef8eb5980aed3ac6
          test "$(git rev-parse HEAD)" = "${product}"
          test "$(git rev-parse HEAD^)" = "${base}"
          test "$(git rev-parse HEAD^{tree})" = "8a47aeae15c01477639580bfa46f567695b74aee"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/terrain_metric.rs)" = "5f6cce3dc034c0b8c0e46dc55e599bd6162841ac"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/lib.rs)" = "56bc36d82a2a8889568ac537255ca327b2b4bb77"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/tests/terrain_metric_public.rs)" = "20029889212d686d08fd92190a6945eb302d3ce5"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/Cargo.toml)" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          expected="$(printf '%s\n' crates/domains/symtropy-terrain/src/lib.rs crates/domains/symtropy-terrain/tests/terrain_metric_public.rs | sort)"
          actual="$(git diff --name-only ${base}..${product} | sort)"
          test "${actual}" = "${expected}"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/terrain-metric-read-surface-target" >> "${GITHUB_ENV}"

      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind toolchain and locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          test "$(cargo --version | awk '{print $2}')" = "1.96.0"
          before="$(git hash-object Cargo.lock)"
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/metric-read-surface-metadata.json"
          test "$(git hash-object Cargo.lock)" = "${before}"

      - name: Check format and all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/domains/symtropy-terrain/Cargo.toml -- --check
          cargo check -p symtropy-terrain --locked --all-targets

      - name: Execute public metric theorem and complete Terrain regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked --test terrain_metric_public -- --nocapture
          cargo test -p symtropy-terrain --locked --all-targets

      - name: Enforce strict all-target Clippy
        shell: bash
        run: |
          cargo clippy -p symtropy-terrain --locked --all-targets -- -D warnings

      - name: Audit public read-only metric surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          lib = Path("crates/domains/symtropy-terrain/src/lib.rs").read_text()
          metric = Path("crates/domains/symtropy-terrain/src/terrain_metric.rs").read_text()
          manifest = Path("crates/domains/symtropy-terrain/Cargo.toml").read_text()
          production_metric = metric.partition("#[cfg(test)]")[0]
          if lib.count("pub mod terrain_metric;") != 1:
              raise SystemExit("terrain_metric is not exported exactly once")
          if "impl Default for TerrainMetricProfile" in production_metric:
              raise SystemExit("metric profile gained a default value")
          if re.search(r"(?:Resource|Component)\b.*TerrainMetricProfile", production_metric, re.S):
              raise SystemExit("metric profile gained ECS writer surface")
          if "symtropy-spatial-decomposition" in manifest or "symtropy_spatial_decomposition" in lib:
              raise SystemExit("metric read surface gained PB dependency")
          if any(term in production_metric for term in ("GlobalTransform", "Vec3", "Collider")):
              raise SystemExit("metric vocabulary gained runtime inference dependency")
          print("TERRAIN_METRIC_PUBLIC_READ_SURFACE=PASS")
          print("TERRAIN_METRIC_SELECTION_AUTHORITY=ABSENT")
          PY

      - name: Exact immutable-product postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "552dda82caac15b457b264c07cc3f829658fae83"
          test "$(git rev-parse HEAD^{tree})" = "8a47aeae15c01477639580bfa46f567695b74aee"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/terrain_metric.rs)" = "5f6cce3dc034c0b8c0e46dc55e599bd6162841ac"
          git diff --exit-code
          test -z "$(git status --porcelain)"
