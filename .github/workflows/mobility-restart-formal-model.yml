name: Mobility Restart Recovery Formal Model

on:
  push:
    branches:
      - research/mobility-restart-tla-v0-1
    paths:
      - "research/mobility-restart-reconciliation/model/**"
      - "research/mobility-rrvr-trace/**"
      - ".github/workflows/mobility-restart-formal-model.yml"
  pull_request:
    paths:
      - "research/mobility-restart-reconciliation/model/**"
      - "research/mobility-rrvr-trace/**"
      - ".github/workflows/mobility-restart-formal-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rrvr-tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Download and verify pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          curl --fail --location --retry 3 \
            "https://github.com/microsoft/tlalink/releases/download/tla2tools-2ef2af8/tla2tools.jar" \
            --output "$RUNNER_TEMP/tla/tla2tools.jar"
          printf '%s  %s\n' \
            "D15655EEAFF4B3F7B3D65C46B838BC0F35D131B2EF4B1E473689B62C98D4726F" \
            "$RUNNER_TEMP/tla/tla2tools.jar" | sha256sum --check
      - name: Check safe recovery model
        shell: bash
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp "$RUNNER_TEMP/tla/tla2tools.jar" tlc2.TLC \
            -workers auto \
            -metadir "$RUNNER_TEMP/tlc-safe" \
            -config research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.cfg \
            research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla
      - name: Capture expected unsafe retry TLC JSON counterexample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rrvr-tlc-package"
          MODEL_DIR="research/mobility-restart-reconciliation/model"
          MODEL_FILE="RestartSafeEffectContinuity.tla"
          CFG_FILE="RestartSafeEffectContinuity_NaiveRetry.cfg"
          TRACE_NAME="rrvr-naive-retry-counterexample.json"
          TRACE_SOURCE="$GITHUB_WORKSPACE/$MODEL_DIR/$TRACE_NAME"
          TRACE="$RUNNER_TEMP/rrvr-tlc-package/naive-retry-counterexample.json"
          rm -f "$TRACE_SOURCE"
          set +e
          (
            cd "$MODEL_DIR"
            java -XX:+UseParallelGC -cp "$RUNNER_TEMP/tla/tla2tools.jar" tlc2.TLC \
              -workers 1 \
              -seed 42 \
              -dumpTrace json "$TRACE_NAME" \
              -metadir "$RUNNER_TEMP/tlc-negative" \
              -config "$CFG_FILE" \
              "$MODEL_FILE"
          ) > "$RUNNER_TEMP/tlc-negative.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/tlc-negative.log"
            echo "Expected the deliberately unsafe retry model to violate NoDuplicatePhysicalEffects."
            exit 1
          fi
          if ! grep -Fq "Invariant NoDuplicatePhysicalEffects is violated" "$RUNNER_TEMP/tlc-negative.log"; then
            cat "$RUNNER_TEMP/tlc-negative.log"
            echo "TLC failed for a reason other than the expected duplicate-effect counterexample."
            exit 1
          fi
          test -s "$TRACE_SOURCE"
          cp "$TRACE_SOURCE" "$TRACE"
          jq -e '
            . as $trace
            | ($trace.vars | index("s") != null)
              and ($trace.counterexample.state | type == "array" and length >= 2)
              and ($trace.counterexample.action | type == "array" and length == ($trace.counterexample.state | length - 1))
              and ($trace.counterexample.action[-1][1].name == "NaiveRetry")
          ' "$TRACE"
          echo "Expected negative-control counterexample observed and exported as TLC JSON."

      - name: Import TLC JSON as an RRVR trace bundle
        shell: bash
        run: |
          set -euo pipefail
          MODEL="research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity.tla"
          CFG="research/mobility-restart-reconciliation/model/RestartSafeEffectContinuity_NaiveRetry.cfg"
          TRACE="$RUNNER_TEMP/rrvr-tlc-package/naive-retry-counterexample.json"
          BUNDLE="$RUNNER_TEMP/rrvr-tlc-package/naive-retry-rrvr-bundle.json"
          cargo run --locked --manifest-path research/mobility-rrvr-trace/Cargo.toml --bin tlc_trace_import -- \
            "$TRACE" "$MODEL" "$CFG" "$RUNNER_TEMP/tla/tla2tools.jar" "$BUNDLE" \
            "rrvr-tlc-naive-retry-$GITHUB_SHA" \
            "symtropy-restart-recovery-formal-model" "$GITHUB_SHA" \
            "NoDuplicatePhysicalEffects" "naive_retry_duplicate_physical_effect" "42"
          jq -e --slurpfile raw "$TRACE" '
            .header.target_failure.property_id == "NoDuplicatePhysicalEffects"
            and .events[-1].kind == "naive_retry_attempted"
            and .events[-1].event_id == .header.target_failure.witness_event_id
            and (.events | length == ($raw[0].counterexample.action | length))
            and (.artifacts | length == 4)
            and all(.events[]; (.raw_artifact_ids | index("tlc-raw-json") != null))
          ' "$BUNDLE"
          cp "$MODEL" "$RUNNER_TEMP/rrvr-tlc-package/RestartSafeEffectContinuity.tla"
          cp "$CFG" "$RUNNER_TEMP/rrvr-tlc-package/RestartSafeEffectContinuity_NaiveRetry.cfg"
          cp "$RUNNER_TEMP/tla/tla2tools.jar" "$RUNNER_TEMP/rrvr-tlc-package/tla2tools.jar"
          (
            cd "$RUNNER_TEMP/rrvr-tlc-package"
            sha256sum naive-retry-counterexample.json naive-retry-rrvr-bundle.json \
              RestartSafeEffectContinuity.tla RestartSafeEffectContinuity_NaiveRetry.cfg tla2tools.jar \
              > SHA256SUMS
          )

      - name: Upload verified TLC counterexample and RRVR bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rrvr-tlc-naive-retry-counterexample-${{ github.sha }}
          path: ${{ runner.temp }}/rrvr-tlc-package/
          if-no-files-found: error
          retention-days: 90
