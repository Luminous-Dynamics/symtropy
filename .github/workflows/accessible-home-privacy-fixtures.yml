name: Accessible home privacy fixture checks

on:
  pull_request:
    paths:
      - "docs/built-environment/accessible-home-privacy-v0.1.md"
      - "docs/built-environment/accessible-home-private-evidence-envelope-v0.1.*"
      - ".github/workflows/accessible-home-privacy-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "docs/built-environment/accessible-home-privacy-v0.1.md"
      - "docs/built-environment/accessible-home-private-evidence-envelope-v0.1.*"
      - ".github/workflows/accessible-home-privacy-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    name: Validate public synthetic metadata example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse schema and synthetic fixture
        run: |
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and .properties.fixture_kind.const == "synthetic_metadata_example" and .properties.claim_boundary.const == "SYNTHETIC METADATA ONLY. Does not contain resident payload; does not prove truth, anonymity or legal compliance."' docs/built-environment/accessible-home-private-evidence-envelope-v0.1.schema.json > /dev/null
          jq -e '.schema_version == "0.1.0" and .fixture_kind == "synthetic_metadata_example" and .data_class == "public_synthetic" and .access_tier == "public_synthetic_only" and .payload_location == "none_synthetic_only" and .claim_boundary == "SYNTHETIC METADATA ONLY. Does not contain resident payload; does not prove truth, anonymity or legal compliance."' docs/built-environment/accessible-home-private-evidence-envelope-v0.1.example.json > /dev/null
      - name: Enforce public synthetic boundary
        run: |
          ! grep -Eiq 'real resident data|actual resident payload|real-home measurements' docs/built-environment/accessible-home-private-evidence-envelope-v0.1.example.json
          grep -q 'Hashing is not anonymization' docs/built-environment/accessible-home-privacy-v0.1.md
          grep -q 'publication of a digest of raw real resident/home evidence' docs/built-environment/accessible-home-privacy-v0.1.md
