name: WPT 6-DOF Dataset Integrity

on:
  push:
    branches: ["main"]
    paths:
      - "research/wpt-6dof-physical-observability-v0/**"
      - "tools/wpt-6dof-dataset-integrity/**"
      - ".github/workflows/wpt-6dof-dataset-integrity.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/wpt-6dof-physical-observability-v0/**"
      - "tools/wpt-6dof-dataset-integrity/**"
      - ".github/workflows/wpt-6dof-dataset-integrity.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test 6-DOF dataset integrity and split leakage
        run: cargo test --locked --manifest-path tools/wpt-6dof-dataset-integrity/Cargo.toml
      - name: Validate synthetic episode manifest
        run: cargo run --locked --manifest-path tools/wpt-6dof-dataset-integrity/Cargo.toml -- research/wpt-6dof-physical-observability-v0/synthetic-episode-manifest.tsv
