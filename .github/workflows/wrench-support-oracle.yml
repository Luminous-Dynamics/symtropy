name: Wrench Support Oracle

on:
  pull_request:
    branches: [main]
    paths:
      - "research/wrench-support-oracle/v0.1/**"
      - ".github/workflows/wrench-support-oracle.yml"
  push:
    branches: [main]
    paths:
      - "research/wrench-support-oracle/v0.1/**"
      - ".github/workflows/wrench-support-oracle.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 oracle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/wrench-support-oracle/v0.1/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/wrench-support-oracle/v0.1/Cargo.toml --locked
      - name: Run deterministic reduction tournament
        run: cargo run --manifest-path research/wrench-support-oracle/v0.1/Cargo.toml --example reduction_tournament --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/wrench-support-oracle/v0.1/Cargo.toml --locked --all-targets -- -D warnings
