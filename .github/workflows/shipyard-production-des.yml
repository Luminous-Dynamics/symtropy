name: Shipyard Deterministic Production DES

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-production-des/**"
      - "docs/tech/SHIPYARD_PRODUCTION_DES_V0_1*"
      - ".github/workflows/shipyard-production-des.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-production-des-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify deterministic resource and precedence event replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-production-des/Cargo.toml --all -- --check
      - name: Run deterministic DES tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-production-des/Cargo.toml
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-production-des/Cargo.toml --all-targets -- -D warnings
      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
