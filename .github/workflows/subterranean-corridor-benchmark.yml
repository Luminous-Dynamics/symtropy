name: Subterranean corridor reference tests

on:
  pull_request:
    paths:
      - 'tools/subterranean-corridor-benchmark/**'
      - 'docs/research/SEISMICALLY_RESILIENT_CORRIDOR_BENCHMARK_V0_1.md'
      - '.github/workflows/subterranean-corridor-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'tools/subterranean-corridor-benchmark/**'
      - 'docs/research/SEISMICALLY_RESILIENT_CORRIDOR_BENCHMARK_V0_1.md'
      - '.github/workflows/subterranean-corridor-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subterranean-corridor-reference-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-reference:
    name: Offline reference tests (Rust 1.96.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add rustfmt --toolchain 1.96.0
          rustup default 1.96.0
      - name: Format
        run: cargo fmt --manifest-path tools/subterranean-corridor-benchmark/Cargo.toml -- --check
      - name: Locked tests
        run: cargo test --manifest-path tools/subterranean-corridor-benchmark/Cargo.toml --locked
      - name: Deterministic demonstration
        run: cargo run --manifest-path tools/subterranean-corridor-benchmark/Cargo.toml --locked