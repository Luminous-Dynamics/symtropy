name: Shipyard space-time baseline

on:
  pull_request:
    branches: ["main", "research/shipyard-space-time-oracle-v0"]
    paths:
      - "tools/shipyard-space-time-baselines/**"
      - "tools/shipyard-space-time/**"
      - ".github/workflows/shipyard-space-time-baseline.yml"
  push:
    branches: ["main", "research/shipyard-space-time-first-fit-v0"]
    paths:
      - "tools/shipyard-space-time-baselines/**"
      - "tools/shipyard-space-time/**"
      - ".github/workflows/shipyard-space-time-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-space-time-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned Rust first-fit baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path tools/shipyard-space-time-baselines/Cargo.toml -- --check

      - name: Run dependency-free baseline tests offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-space-time-baselines/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-space-time-baselines/Cargo.toml --all-targets -- -D warnings
