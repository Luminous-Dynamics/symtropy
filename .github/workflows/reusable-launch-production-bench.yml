name: Reusable Launch Production Reference

on:
  push:
    branches: ["research/reusable-launch-production-bench-v0-1"]
    paths:
      - "tools/reusable-launch-production-bench/**"
      - ".github/workflows/reusable-launch-production-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/reusable-launch-production-bench/**"
      - ".github/workflows/reusable-launch-production-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reusable-launch-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Resolve standalone dependency graph
        run: cargo generate-lockfile --manifest-path tools/reusable-launch-production-bench/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path tools/reusable-launch-production-bench/Cargo.toml -- --check

      - name: Run deterministic reference tests
        run: cargo test --locked --manifest-path tools/reusable-launch-production-bench/Cargo.toml --all-targets

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/reusable-launch-production-bench/Cargo.toml --all-targets -- -D warnings

      - name: Generate exact-input receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/reusable-launch-production-bench/Cargo.toml -- \
            tools/reusable-launch-production-bench/fixtures/v0.1/reference.json \
            --source-commit "$source_commit" > reusable-launch-production-receipt.json
          jq -e '
            .result == "pass"
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .report.result == "pass"
            and .report.evidence_class == "synthetic"
            and .report.metrics.asset_count == 3
            and .report.metrics.flight_attempts == 4
            and .report.metrics.mission_successes == 3
            and .report.metrics.recovered_stages == 3
            and .report.metrics.lost_stages == 1
            and .report.metrics.payload_acceptances == 3
            and .report.metrics.accepted_payload_kg == 23000
            and .report.metrics.completed_reflight_cycles == 1
            and .report.metrics.turnaround_sample_count == 1
            and .report.metrics.turnaround_total_ticks == 14
            and .report.metrics.turnaround_max_ticks == 14
            and .report.metrics.maintenance_task_count == 5
            and .report.metrics.maintenance_total_wait_ticks == 1
            and .report.metrics.costs.total_lifecycle_scu == 485
            and .report.metrics.costs.cost_per_accepted_kg_microscu == 21086
          ' reusable-launch-production-receipt.json

      - name: Retain benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: reusable-launch-production-receipt-${{ github.sha }}
          path: reusable-launch-production-receipt.json
          if-no-files-found: error
