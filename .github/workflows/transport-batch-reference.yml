name: Transport Batch Oracle

on:
  pull_request:
    branches:
      - "feat/transport-shared-capacity-batch-r1"
    paths:
      - "crates/domains/symtropy-transport-optimization/**"
      - "docs/tech/TRANSPORT_BENCHMARK_LADDER_V0_1.md"
      - ".github/workflows/transport-batch-reference.yml"

permissions:
  contents: read

concurrency:
  group: transport-batch-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: Exact-head transport oracle tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact source
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Install project Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run transport optimization tests
        run: cargo test -p symtropy-transport-optimization --all-features

      - name: Run Clippy
        run: cargo clippy -p symtropy-transport-optimization --all-targets --all-features -- -D warnings

      - name: Check transport optimization build
        run: cargo check -p symtropy-transport-optimization --all-targets --all-features
