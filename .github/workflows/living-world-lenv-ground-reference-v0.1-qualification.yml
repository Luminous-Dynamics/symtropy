name: Living World LENV Ground reference v0.1 qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify-ground-reference:
    name: Qualify exact Ground That Remembers reference subject
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: 889bbc94918bcc7f82b5807a0badb265e9388474
      PARENT_SHA: e20aadfabfbc774f3c8adff3dbcd56af63c78473
      PRODUCT_FILE: crates/domains/symtropy-lifesim-core/tests/ground_that_remembers_reference.rs
      CARGO_TARGET_DIR: /tmp/living-world-lenv-ground-reference-v01-target
    steps:
      - name: Checkout exact product subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert exact one-file product scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git diff --name-status "$PARENT_SHA" "$PRODUCT_SHA")" = $'A\t'"$PRODUCT_FILE"
          git hash-object Cargo.lock | tee /tmp/cargo-lock.before
          git rev-parse HEAD^{tree} | tee /tmp/tree.before

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check focused formatting
        run: cargo fmt --package symtropy-lifesim-core -- --check

      - name: Execute Ground That Remembers reference tests
        run: cargo test --locked -p symtropy-lifesim-core --test ground_that_remembers_reference

      - name: Strict focused Clippy
        run: cargo clippy --locked -p symtropy-lifesim-core --test ground_that_remembers_reference -- -D warnings

      - name: Focused all-target dependency check
        run: cargo check --locked -p symtropy-lifesim-core --test ground_that_remembers_reference

      - name: Assert immutable exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/tree.before)"
          test "$(git hash-object Cargo.lock)" = "$(cat /tmp/cargo-lock.before)"
          git diff --exit-code
          git diff --cached --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'unexpected untracked files:\n%s\n' "$untracked"
            exit 1
          fi
