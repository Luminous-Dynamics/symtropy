name: Road exogenous-coupling fixtures

on:
  pull_request:
    paths:
      - "research/road-exo-coupling-001/**"
      - ".github/workflows/road-exo-coupling-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-reference:
    name: Philox semantic resolver (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check locked dependency graph
        run: cargo metadata --manifest-path research/road-exo-coupling-001/Cargo.toml --locked --format-version 1 --no-deps
      - name: Check formatting
        run: cargo fmt --manifest-path research/road-exo-coupling-001/Cargo.toml -- --check
      - name: Run conformance tests
        run: cargo test --manifest-path research/road-exo-coupling-001/Cargo.toml --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --manifest-path research/road-exo-coupling-001/Cargo.toml --locked --all-targets -- -D warnings
      - name: Validate machine-readable fixtures
        run: python3 -c 'import json; paths = ["research/road-exo-coupling-001/fixtures/event_identity_cases.json", "research/road-exo-coupling-001/fixtures/dependence_cases.json", "research/road-exo-coupling-001/fixtures/decision_closure_cases.json", "research/road-exo-coupling-001/fixtures/evidence_provenance_cases.json", "research/road-exo-coupling-001/fixtures/decision_evidence_binding_cases.json", "research/road-exo-coupling-001/fixtures/measurement_selection_cases.json", "research/road-exo-coupling-001/fixtures/trajectory_evidence_binding_cases.json"]; [json.load(open(path, encoding="utf-8")) for path in paths]'
