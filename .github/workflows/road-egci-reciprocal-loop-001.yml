name: ROAD EGCI reciprocal producer v0.1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/road-egci-reciprocal-loop-001/**"
      - "research/road-egci-handoff-001/src/lib.rs"
      - "crates/core/symtropy-physics/src/replay.rs"
      - "crates/domains/symtropy-road-actors/src/lib.rs"
      - "crates/domains/symtropy-road-actor-adapter/src/lib.rs"
      - ".github/workflows/road-egci-reciprocal-loop-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reciprocal-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format producer
        run: cargo fmt --manifest-path research/road-egci-reciprocal-loop-001/Cargo.toml -- --check
      - name: Validate machine-readable fixtures
        run: |
          python3 -m json.tool research/road-egci-reciprocal-loop-001/fixtures/reciprocal-cases.json > /dev/null
          python3 -m json.tool research/road-egci-handoff-001/fixtures/handoff_cases.json > /dev/null
      - name: Diagnose and print resolved Cargo.lock delta
        run: |
          cargo metadata --manifest-path research/road-egci-reciprocal-loop-001/Cargo.toml --format-version 1 > /tmp/road-egci-metadata.json
          git diff --no-ext-diff --unified=3 -- research/road-egci-reciprocal-loop-001/Cargo.lock
      - name: Run paired reciprocal conformance tests
        run: cargo test --manifest-path research/road-egci-reciprocal-loop-001/Cargo.toml --locked
      - name: Upload regenerated standalone lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-egci-standalone-cargo-lock
          path: research/road-egci-reciprocal-loop-001/Cargo.lock
          if-no-files-found: error
          retention-days: 1
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/road-egci-reciprocal-loop-001/Cargo.toml --all-targets --locked -- -D warnings
