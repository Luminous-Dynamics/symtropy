name: Evolution SEL-07D2 Qualification

on:
  push:
    branches:
      - "ci/evolution-sel07d2-qualification-v0.1"

permissions:
  contents: read

concurrency:
  group: evolution-sel07d2-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PRODUCT_HEAD: bb361c585d6c78afc1ea073a885270529dc4321d

jobs:
  qualify:
    name: Frozen SEL-07D2 / Rust 1.96
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact frozen product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 1

      - name: Assert executed product subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected_product_head=${PRODUCT_HEAD}"
          echo "actual_product_head=${actual}"
          test "${actual}" = "${PRODUCT_HEAD}"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Isolate dependency-light evolution crate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/symtropy-evolution-core"
          cp -R crates/domains/symtropy-evolution-core "${RUNNER_TEMP}/symtropy-evolution-core"
          printf 'source_product_head=%s\n' "${PRODUCT_HEAD}" > "${RUNNER_TEMP}/symtropy-evolution-core/QUALIFICATION_SUBJECT"

      - name: Check formatting
        id: fmt
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo fmt --all -- --check

      - name: Check all targets
        id: check
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo check --all-targets

      - name: Run SEL-07D2 exact causal-randomization corpus
        id: sel07d2
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test causal_randomization_test_v1

      - name: Run SEL-07D1 complete-randomization reference corpus
        id: sel07d1
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test complete_randomization_reference_v1

      - name: Run SEL-07C2 causal-effect corpus
        id: sel07c2
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test causal_viability_effect_v1

      - name: Run SEL-07C2 hardening corpus
        id: sel07c2_hardening
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test causal_viability_effect_hardening_v1

      - name: Run SEL-07C1 causal-identification corpus
        id: sel07c1
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test causal_identification_v1

      - name: Run SEL-07B2 exact association corpus
        id: sel07b2
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test selection_association_v1

      - name: Run SEL-07B2 hardening corpus
        id: sel07b2_hardening
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test selection_association_hardening_v1

      - name: Run SEL-07B1 analysis-frame corpus
        id: sel07b1
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test selection_analysis_frame_v1

      - name: Run SEL-07A comparison-design corpus
        id: sel07a
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test selection_comparison_design_v1

      - name: Run SEL-06C selection-evidence corpus
        id: sel06c
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test selection_evidence_v1

      - name: Run SEL-06B current-authority corpus
        id: sel06b
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test validated_consequence_authority_v1

      - name: Run SEL-06A consequence-ledger corpus
        id: sel06a
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test consequence_ledger_v1

      - name: Run INDIV-06A census corpus
        id: indiv
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --test linked_individual_census_v1

      - name: Run all tests
        id: test_all
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo test --all-targets

      - name: Run strict Clippy
        id: clippy
        working-directory: ${{ runner.temp }}/symtropy-evolution-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          SEL07D2_OUTCOME: ${{ steps.sel07d2.outcome }}
          SEL07D1_OUTCOME: ${{ steps.sel07d1.outcome }}
          SEL07C2_OUTCOME: ${{ steps.sel07c2.outcome }}
          SEL07C2_HARDENING_OUTCOME: ${{ steps.sel07c2_hardening.outcome }}
          SEL07C1_OUTCOME: ${{ steps.sel07c1.outcome }}
          SEL07B2_OUTCOME: ${{ steps.sel07b2.outcome }}
          SEL07B2_HARDENING_OUTCOME: ${{ steps.sel07b2_hardening.outcome }}
          SEL07B1_OUTCOME: ${{ steps.sel07b1.outcome }}
          SEL07A_OUTCOME: ${{ steps.sel07a.outcome }}
          SEL06C_OUTCOME: ${{ steps.sel06c.outcome }}
          SEL06B_OUTCOME: ${{ steps.sel06b.outcome }}
          SEL06A_OUTCOME: ${{ steps.sel06a.outcome }}
          INDIV_OUTCOME: ${{ steps.indiv.outcome }}
          TEST_ALL_OUTCOME: ${{ steps.test_all.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/sel07d2-evidence-v01.json"
          export RECEIPT_PATH="${receipt}"
          python3 - <<'PY'
          import json, os, subprocess
          outcomes = {
              "fmt": os.environ.get("FMT_OUTCOME", "unknown"),
              "check": os.environ.get("CHECK_OUTCOME", "unknown"),
              "causal_randomization_test_v1": os.environ.get("SEL07D2_OUTCOME", "unknown"),
              "complete_randomization_reference_v1": os.environ.get("SEL07D1_OUTCOME", "unknown"),
              "causal_viability_effect_v1": os.environ.get("SEL07C2_OUTCOME", "unknown"),
              "causal_viability_effect_hardening_v1": os.environ.get("SEL07C2_HARDENING_OUTCOME", "unknown"),
              "causal_identification_v1": os.environ.get("SEL07C1_OUTCOME", "unknown"),
              "selection_association_v1": os.environ.get("SEL07B2_OUTCOME", "unknown"),
              "selection_association_hardening_v1": os.environ.get("SEL07B2_HARDENING_OUTCOME", "unknown"),
              "selection_analysis_frame_v1": os.environ.get("SEL07B1_OUTCOME", "unknown"),
              "selection_comparison_design_v1": os.environ.get("SEL07A_OUTCOME", "unknown"),
              "selection_evidence_v1": os.environ.get("SEL06C_OUTCOME", "unknown"),
              "validated_consequence_authority_v1": os.environ.get("SEL06B_OUTCOME", "unknown"),
              "consequence_ledger_v1": os.environ.get("SEL06A_OUTCOME", "unknown"),
              "linked_individual_census_v1": os.environ.get("INDIV_OUTCOME", "unknown"),
              "test_all": os.environ.get("TEST_ALL_OUTCOME", "unknown"),
              "clippy": os.environ.get("CLIPPY_OUTCOME", "unknown"),
          }
          def version(command):
              try:
                  return subprocess.check_output(command, text=True, stderr=subprocess.STDOUT).strip()
              except Exception:
                  return "unavailable"
          receipt = {
              "receipt_version": 1,
              "qualification": "SEL-07D2-exact-causal-randomization-test",
              "product_head": os.environ["PRODUCT_HEAD"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "scope": "crates/domains/symtropy-evolution-core",
              "declared_rust_toolchain": "1.96.0",
              "rustc_version": version(["rustc", "--version"]),
              "cargo_version": version(["cargo", "--version"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "isolated exact SEL-07D2 sharp-null causal randomization-test behavior plus named prerequisite evolution-core corpora only; no causal interval, fitness scalar, model-specific selection coefficient, beneficial/deleterious classification, adaptation, reproductive isolation, or speciation authority",
          }
          with open(os.environ["RECEIPT_PATH"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          sha256sum "${receipt}" > "${receipt}.sha256"
          cat "${receipt}"
          cat "${receipt}.sha256"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sel07d2-evidence-v01-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/sel07d2-evidence-v01.json
            ${{ runner.temp }}/sel07d2-evidence-v01.json.sha256
          if-no-files-found: error
          retention-days: 90
