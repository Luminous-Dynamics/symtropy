name: Shipyard polygon layout baseline

on:
  pull_request:
    branches: ["research/shipyard-polygon-geometry-v0"]
    paths:
      - "tools/shipyard-polygon-layout-baseline/**"
      - "tools/shipyard-polygon-geometry/**"
      - ".github/workflows/shipyard-polygon-layout-baseline.yml"
  push:
    branches: ["research/shipyard-polygon-layout-baseline-v0"]
    paths:
      - "tools/shipyard-polygon-layout-baseline/**"
      - "tools/shipyard-polygon-geometry/**"
      - ".github/workflows/shipyard-polygon-layout-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Pinned Rust layout conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path tools/shipyard-polygon-layout-baseline/Cargo.toml -- --check
      - name: Offline test suite
        run: cargo test --locked --offline --manifest-path tools/shipyard-polygon-layout-baseline/Cargo.toml
      - name: Clippy with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-polygon-layout-baseline/Cargo.toml --all-targets -- -D warnings
