name: Living World LW62 Ubuntu 24.04 Diagnostic

on:
  push:
    branches:
      - 'ci/living-world-lw62-ubuntu2404-diagnostic-v0.1'

permissions:
  contents: read

concurrency:
  group: living-world-lw62-ubuntu2404-diagnostic-v0.1
  cancel-in-progress: true

env:
  LW62_SHA: 7b1d15c75196bfa9f3d879eb0b76e73ea5959a9e
  CARGO_TERM_COLOR: always

jobs:
  diagnose:
    name: Exact LW62 / explicit ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out exact LW62 product subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.LW62_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate immutable LW62 subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin living-world/lw62-q2-authority-hostile-fixture
          test "$LW62_SHA" = "$(git rev-parse HEAD)"
          test "$LW62_SHA" = "$(git rev-parse origin/living-world/lw62-q2-authority-hostile-fixture)"
          git cat-file -e "${LW62_SHA}^{commit}"
          test -z "$(git status --porcelain)"
          printf 'LW62_SHA=%s\nLW62_TREE=%s\n' "$LW62_SHA" "$(git rev-parse HEAD^{tree})"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Record diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          sha256sum Cargo.lock
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/living-world-lw62-diagnostic-target" >> "$GITHUB_ENV"

      - name: Rustfmt exact LW62
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          test -z "$(git status --porcelain)"

      - name: Check exact LW62
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p symtropy-lifesim-core --all-targets
          test -z "$(git status --porcelain)"

      - name: Execute LW62 Q2 hostile fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symtropy-lifesim-core --lib shadow_current_executable_continuity_hostile_tests -- --nocapture
          test -z "$(git status --porcelain)"

      - name: Execute full lifesim library suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symtropy-lifesim-core --lib
          test -z "$(git status --porcelain)"

      - name: Strict Clippy exact LW62
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p symtropy-lifesim-core --all-targets --all-features -- -D warnings
          test -z "$(git status --porcelain)"

      - name: Diagnostic nonclaim
        shell: bash
        run: |
          set -euo pipefail
          echo 'This diagnostic executes exact LW62 on explicit ubuntu-24.04.'
          echo 'It does not qualify LW55-LW61 individually, attest manifests, qualify production runner emission, or authorize anchor renewal.'
