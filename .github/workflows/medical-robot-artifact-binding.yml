name: HMR-0 Artifact Byte Binding (No Physical Claims)

on:
  pull_request:
    branches:
      - "research/medical-robot-tool-qualification-v0"
    paths:
      - "docs/tech/HMR0_ARTIFACT_BINDING_CONTRACT_V0.md"
      - "tools/medical-robot-artifact-binding/**"
      - ".github/workflows/medical-robot-artifact-binding.yml"
  push:
    branches:
      - "research/hmr0-artifact-binding-v0"

permissions:
  contents: read

concurrency:
  group: hmr0-artifact-binding-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  artifact-binding:
    name: Verify artifact bytes against manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path tools/medical-robot-artifact-binding/Cargo.toml -- --check

      - name: Unit and adversarial tests
        run: cargo test --manifest-path tools/medical-robot-artifact-binding/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --manifest-path tools/medical-robot-artifact-binding/Cargo.toml --all-targets -- -D warnings

      - name: End-to-end synthetic artifact receipt
        env:
          HMR0_ARTIFACT_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="target/hmr0-artifact-binding-fixture"
          mkdir -p "$artifact_root"
          printf 'synthetic geometry fixture only; not CAD\n' > "$artifact_root/geometry.preview"
          digest="$(sha256sum "$artifact_root/geometry.preview" | cut -d' ' -f1)"
          length="$(wc -c < "$artifact_root/geometry.preview" | tr -d ' ')"
          cat > "$artifact_root/manifest.json" <<EOF
          {
            "schema_version": "hmr0-artifact-manifest-v0.1",
            "tool_id": "HMR0-CI-SYNTHETIC-FIXTURE",
            "tool_revision": "0.1.0",
            "evidence_class": "concept_preview_only",
            "physical_actuation_authorized": false,
            "patient_contact_authorized": false,
            "clinical_function_authorized": false,
            "artifacts": [{
              "artifact_id": "geometry-preview-fixture",
              "relative_path": "geometry.preview",
              "media_type": "application/vnd.luminous.hmr0.fixture",
              "byte_length": $length,
              "sha256": "$digest",
              "role": "geometry_preview"
            }],
            "claim_ceiling": "Synthetic byte-binding fixture only."
          }
          EOF
          cargo run --manifest-path tools/medical-robot-artifact-binding/Cargo.toml -- "$artifact_root" "$artifact_root/manifest.json" > "$artifact_root/receipt.json"
          cat "$artifact_root/receipt.json"
          grep -q "\"tested_revision\": \"$HMR0_ARTIFACT_TESTED_SHA\"" "$artifact_root/receipt.json"
          grep -q '"verified_artifact_count": 1' "$artifact_root/receipt.json"
          grep -q '"failed_artifact_count": 0' "$artifact_root/receipt.json"

      - name: Report exact-input verification boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact tested PR head: ${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust: $(rustc --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA-256: $(sha256sum tools/medical-robot-artifact-binding/src/main.rs | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Cargo manifest SHA-256: $(sha256sum tools/medical-robot-artifact-binding/Cargo.toml | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Lockfile SHA-256: $(sha256sum tools/medical-robot-artifact-binding/Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow tests artifact-byte binding using temporary synthetic files. It does not establish CAD correctness, simulation fidelity, manufacturability, medical-device conformity, or physical safety." >> "$GITHUB_STEP_SUMMARY"
