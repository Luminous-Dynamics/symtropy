name: Design-for-Disassembly Reference

on:
  push:
    branches: ["research/physical-transformation-dfd-v0-1"]
    paths:
      - "research/physical-transformation-reference/**"
      - ".github/workflows/design-for-disassembly-reference.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/physical-transformation-reference/**"
      - ".github/workflows/design-for-disassembly-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dfd-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dfd-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/physical-transformation-reference/Cargo.toml --all -- --check
      - name: Run vector DfD and negative-control tests
        run: cargo test --locked --manifest-path research/physical-transformation-reference/Cargo.toml
      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path research/physical-transformation-reference/Cargo.toml --all-targets -- -D warnings
      - name: Verify exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "DfD reference tests are scoped to exact source revision $source_commit"
