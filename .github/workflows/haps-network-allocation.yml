name: HAPS Network Allocation

on:
  pull_request:
    paths:
      - ".github/workflows/haps-network-allocation.yml"
      - "tools/haps-network-allocation/**"
      - "docs/research/aviation/examples/synthetic_haps_disaster_traffic_trace_v1.json"

permissions:
  contents: read

jobs:
  standalone-rust:
    name: Standalone HAPS allocator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/haps-network-allocation/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/haps-network-allocation/Cargo.toml --all-targets -- -D warnings

      - name: Run unit and fixture-replay tests
        run: cargo test --locked --manifest-path tools/haps-network-allocation/Cargo.toml
