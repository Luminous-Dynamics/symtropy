name: Mine Flexible Load Scheduling Benchmark

on:
  push:
    branches: ["feat/mine-flex-001-bench-v0-1"]
    paths:
      - "docs/tech/MINE_FLEX_SCHEDULING_BENCHMARK_V0_1.md"
      - "docs/tech/MINE_FLEX_ROBUSTNESS_BENCHMARK_V0_1.md"
      - "docs/tech/MINE_FLEX_RECOURSE_BENCHMARK_V0_1.md"
      - "docs/tech/mine-flex-scheduling-corpus-v0.1.json"
      - "tools/mine-flex-scheduling-bench/**"
      - ".github/workflows/mine-flex-scheduling-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/MINE_FLEX_SCHEDULING_BENCHMARK_V0_1.md"
      - "docs/tech/MINE_FLEX_ROBUSTNESS_BENCHMARK_V0_1.md"
      - "docs/tech/MINE_FLEX_RECOURSE_BENCHMARK_V0_1.md"
      - "docs/tech/MINE_FLEX_RISK_BUDGET_BENCHMARK_V0_1.md"
      - "docs/tech/MINE_FLEX_EXECUTION_BENCHMARK_V0_1.md"
      - "docs/tech/mine-flex-scheduling-corpus-v0.1.json"
      - "tools/mine-flex-scheduling-bench/**"
      - ".github/workflows/mine-flex-scheduling-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mine-flex-scheduling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml -- --check
      - name: Run exact-oracle and hard-constraint tests
        run: cargo test --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml
      - name: Validate exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml -- \
            docs/tech/mine-flex-scheduling-corpus-v0.1.json \
            --source-commit "$source_commit" > mine-flex-scheduling-receipt.json
          jq -e '
            .result == "validated"
            and .suite_id == "MINE-FLEX-001"
            and .scenario_count == 1
            and .expected_controls_matched == 1
            and .independent_checks_passed == true
            and .hard_constraint_violations == 0
            and .scenarios[0].status == "feasible"
            and .scenarios[0].search_space_size == 36
            and .scenarios[0].candidate_schedules_evaluated == 8
            and .scenarios[0].feasible_schedule_count == 5
            and .scenarios[0].best_schedule.batches == [1,3,0]
            and .scenarios[0].best_schedule.total_grid_cost_units == 410
            and .scenarios[0].best_schedule.total_grid_carbon_units == 152
            and .scenarios[0].fixed_baseline_schedule.total_grid_cost_units == 590
            and .scenarios[0].fixed_baseline_schedule.total_grid_carbon_units == 100
            and ([.scenarios[0].pareto_frontier[] | {batches: .batches, grid_cost_units: .total_grid_cost_units, grid_carbon_units: .total_grid_carbon_units}] == [
              {batches:[1,3,0],grid_cost_units:410,grid_carbon_units:152},
              {batches:[2,2,0],grid_cost_units:450,grid_carbon_units:132},
              {batches:[1,2,1],grid_cost_units:550,grid_carbon_units:120},
              {batches:[2,1,1],grid_cost_units:590,grid_carbon_units:100}
            ])
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
          ' mine-flex-scheduling-receipt.json
      - name: Validate generated validation and held-out robustness tournament
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml -- \
            --robustness --source-commit "$source_commit" > mine-flex-robustness-receipt.json
          jq -e '
            .result == "validated"
            and .suite_id == "MINE-FLEX-ROBUST-001"
            and .suite_version == "0.1.0"
            and .generator_version == "mine-flex-generated-disturbances-v0.1.0"
            and .validation_seed_count == 32
            and .held_out_seed_count == 32
            and .uncertainty_worlds_per_seed == 5
            and .validation_world_result_count == 160
            and .held_out_world_result_count == 160
            and .total_world_result_count == 320
            and .hard_constraint_violations == 0
            and .robust_policy_feasible_worlds == 320
            and .robust_policy_infeasible_worlds == 0
            and ([.summaries[] | select(.policy_id == "bounded_minimax_cost" and .split == "held_out").feasible_rate_basis_points][0] == 10000)
            and ([.summaries[] | select(.policy_id == "nominal_forecast_cost_minimizer" and .split == "held_out").cost_regret.cvar95_regret_units_worst_five_percent_mean_floor][0] != null)
            and ([.paired_comparisons[] | select(.split == "held_out").paired_worlds_both_feasible][0] > 0)
            and (.generated_case_set_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and ([.world_results[] | select(.robust_policy.feasible == false)] | length == 0)
          ' mine-flex-robustness-receipt.json
      - name: Emit paired validation and held-out metrics
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            suite_id,
            generator_version,
            validation_seed_count,
            held_out_seed_count,
            total_world_result_count,
            hard_constraint_violations,
            robust_policy_feasible_worlds,
            robust_policy_infeasible_worlds,
            summaries: [.summaries[] | {
              split, policy_id, evaluated_worlds, feasible_worlds,
              infeasible_worlds, feasible_rate_basis_points,
              mean_cost_units_floor, mean_carbon_units_floor,
              cost_regret
            }],
            paired_comparisons
          }' mine-flex-robustness-receipt.json
      - name: Validate causal adaptive recourse and out-of-envelope controls
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml -- \
            --recourse --source-commit "$source_commit" > mine-flex-recourse-receipt.json
          jq -e '
            .result == "validated"
            and .suite_id == "MINE-FLEX-RECOURSE-001"
            and .recourse_policy_version == "mine-flex-causal-recourse-v0.1.0"
            and .generator_version == "mine-flex-generated-disturbances-v0.1.0"
            and .validation_seed_count == 32
            and .held_out_seed_count == 32
            and .envelope_worlds_per_seed == 5
            and .out_of_envelope_challenges_per_seed == 3
            and .in_envelope_world_count == 320
            and .out_of_envelope_world_count == 192
            and .total_world_count == 512
            and .validation_world_count == 256
            and .held_out_world_count == 256
            and .completed_adaptive_worlds_within_envelope == 320
            and .completed_carbon_first_worlds_within_envelope == 320
            and (.adaptive_aborts_outside_envelope + .carbon_first_aborts_outside_envelope) > 0
            and .causal_nonanticipativity_violations == 0
            and .independent_hard_constraint_violations == 0
            and ([.summaries[] | select((.policy_id == "causal_adaptive_recourse" or .policy_id == "causal_adaptive_carbon_first") and .world_class == "in_envelope").feasible_rate_basis_points] | all(. == 10000))
            and ([.summaries[] | select((.policy_id == "causal_adaptive_recourse" or .policy_id == "causal_adaptive_carbon_first") and .world_class == "out_of_envelope") | .evaluated_worlds] | all(. == 96))
            and (.generated_evaluation_set_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and ([.world_results[] | select(.adaptive_execution.completed_production_target == false and .adaptive_recourse.feasible == true)] | length == 0)
            and ([.world_results[] | select(.carbon_aware_execution.completed_production_target == false and .carbon_aware_recourse.feasible == true)] | length == 0)
          ' mine-flex-recourse-receipt.json
      - name: Emit recourse metrics by split and world class
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            suite_id, recourse_policy_version, generator_version,
            in_envelope_world_count, out_of_envelope_world_count,
            completed_adaptive_worlds_within_envelope,
            adaptive_aborts_outside_envelope,
            completed_carbon_first_worlds_within_envelope,
            carbon_first_aborts_outside_envelope,
            causal_nonanticipativity_violations,
            independent_hard_constraint_violations,
            summaries,
            paired_outcomes: [.world_results[] | {
              seed, split, world_class, realization_id,
              oracle_cost: .evaluator_oracle_grid_cost_units,
              nominal_feasible: .nominal_policy.feasible,
              robust_feasible: .static_robust_policy.feasible,
              adaptive_feasible: .adaptive_recourse.feasible,
              adaptive_schedule: .adaptive_recourse.schedule_batches,
              adaptive_rejection: .adaptive_recourse.rejection_reason,
              adaptive_incurred_cost: .adaptive_execution.incurred_grid_cost_units,
              carbon_first_feasible: .carbon_aware_recourse.feasible,
              carbon_first_schedule: .carbon_aware_recourse.schedule_batches,
              carbon_first_rejection: .carbon_aware_recourse.rejection_reason,
              carbon_first_incurred_cost: .carbon_aware_execution.incurred_grid_cost_units
            }]
          }' mine-flex-recourse-receipt.json

      - name: Validate risk-budgeted robust Pareto frontier
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml -- \
            --risk-budget --source-commit "$source_commit" > mine-flex-risk-budget-receipt.json
          jq -e '
            .result == "validated"
            and .suite_id == "MINE-FLEX-PARETO-001"
            and .suite_version == "0.1.0"
            and .validation_seed_count == 32
            and .held_out_seed_count == 32
            and .carbon_headroom_basis_points == [0,250,500,1000,2500,10000]
            and .case_frontier_count == 64
            and .budget_decision_count == 384
            and .world_evaluation_count == 1920
            and .decision_failures == 0
            and .budget_cap_violations == 0
            and .budget_monotonicity_violations == 0
            and .independent_hard_constraint_violations == 0
            and (.generated_case_set_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and ([.summaries[] | select(.cases_evaluated != 32 or .decision_failures != 0 or .worlds_expected != 160 or .worlds_evaluated != 160 or .feasible_worlds != 160 or .feasibility_rate_basis_points != 10000 or .hard_constraint_violations != 0)] | length == 0)
            and ([.decisions[] | select(.chosen_schedule_batches == null or .carbon_cap_units == null or .selected_worst_case_carbon_units > .carbon_cap_units)] | length == 0)
            and ([.case_frontiers[] | select((.nondominated_points | length) == 0)] | length == 0)
          ' mine-flex-risk-budget-receipt.json
      - name: Emit risk-budgeted frontier metrics
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            suite_id, suite_version, generated_case_set_sha256,
            case_frontier_count, budget_decision_count, world_evaluation_count,
            decision_failures, budget_cap_violations, budget_monotonicity_violations,
            independent_hard_constraint_violations,
            summaries,
            selected_frontier: [.decisions[] | {
              seed, split, carbon_headroom_basis_points, carbon_cap_units,
              chosen_schedule_batches, selected_worst_case_cost_units,
              selected_worst_case_carbon_units, nondominated_frontier_points
            }]
          }' mine-flex-risk-budget-receipt.json

      - name: Validate physical dispatch executability
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml -- \
            --executability --source-commit "$source_commit" > mine-flex-execution-receipt.json
          jq -e '
            .result == "validated"
            and .suite_id == "MINE-FLEX-EXEC-001"
            and .suite_version == "0.1.0"
            and .validation_seed_count == 32
            and .held_out_seed_count == 32
            and .case_count == 64
            and .world_evaluation_count == 320
            and .resource_only_optimum_rejected_by_execution_cases > 0
            and .execution_constrained_cases == 64
            and .execution_constrained_non_executable_cases == 0
            and .execution_constrained_non_executable_worlds == 0
            and .independent_resource_accounting_violations == 0
            and .execution_envelope.max_ramp_up_batches_per_period == 1
            and .execution_envelope.max_ramp_down_batches_per_period == 1
            and .execution_envelope.minimum_up_periods_after_start == 2
            and .execution_envelope.maximum_starts_per_horizon == 1
            and (.generated_case_set_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and ([.summaries[] | select(.evaluated_worlds != 160 or .resource_feasible_worlds != 160 or .physically_executable_worlds + .execution_violation_worlds != 160)] | length == 0)
            and ([.summaries[] | select(.policy_id == "execution_constrained_robust_min_cost" and (.physically_executable_worlds != 160 or .execution_violation_worlds != 0 or .feasibility_rate_basis_points != 10000))] | length == 0)
            and ([.case_decisions[] | select(.execution_constrained_execution_audit.executable != true)] | length == 0)
            and ([.world_evaluations[] | select(.execution_constrained.resource_feasible != true or .execution_constrained.execution_audit.executable != true)] | length == 0)
          ' mine-flex-execution-receipt.json
      - name: Emit physical execution metrics
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            suite_id, suite_version, generated_case_set_sha256,
            execution_envelope, case_count, world_evaluation_count,
            resource_only_optimum_rejected_by_execution_cases,
            execution_constrained_cases, execution_constrained_non_executable_cases,
            execution_constrained_non_executable_worlds,
            independent_resource_accounting_violations, summaries,
            cases: [.case_decisions[] | {
              seed, split, resource_robust_candidate_count, execution_robust_candidate_count,
              resource_only_min_cost_batches, resource_only_worst_case_cost_units,
              resource_only_execution_audit, execution_constrained_batches,
              execution_constrained_worst_case_cost_units, execution_constrained_worst_case_carbon_units
            }]
          }' mine-flex-execution-receipt.json


      - name: Validate bounded pump/sump state transitions
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --quiet --manifest-path tools/mine-flex-scheduling-bench/Cargo.toml --             --pump-sump --source-commit "$source_commit" > mine-flex-pump-sump-receipt.json
          jq -e '
            .result == "validated"
            and .suite_id == "MINE-FLEX-PUMP-SUMP-001"
            and .suite_version == "0.1.0"
            and .case_count == 7
            and .period_count == 21
            and .expected_controls_matched == 7
            and .accepted_cases == 1
            and .rejected_cases == 6
            and .hard_violations_in_accepted_cases == 0
            and .conservation_mismatches == 0
            and (.generated_case_set_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and ([.cases[] | select(.executable != .expected_executable)] | length == 0)
            and ([.cases[] | select(.case_id == "pump-drawdown-low-level" and ([.violations[].code] | index("SUMP_LOW_BOUND_VIOLATION") == null))] | length == 0)
            and ([.cases[] | select(.case_id == "inflow-high-level" and ([.violations[].code] | index("SUMP_HIGH_BOUND_VIOLATION") == null))] | length == 0)
            and ([.cases[] | select(.case_id == "minimum-off-time" and ([.violations[].code] | index("MINIMUM_OFF_TIME_NOT_MET") == null))] | length == 0)
          ' mine-flex-pump-sump-receipt.json
      - name: Emit pump/sump trajectory metrics
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            suite_id, suite_version, generated_case_set_sha256, case_count, period_count,
            expected_controls_matched, accepted_cases, rejected_cases,
            hard_violations_in_accepted_cases, conservation_mismatches,
            cases: [.cases[] | {
              case_id, expected_executable, executable, startup_count,
              violation_codes: [.violations[].code]
            }]
          }' mine-flex-pump-sump-receipt.json
