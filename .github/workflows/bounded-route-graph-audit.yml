name: Bounded Route Graph Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - "schemas/transport/bounded_route_graph_v0_1.schema.json"
      - "fixtures/transport/bounded_route_graph_scenarios_v0_1.json"
      - "docs/tech/BOUNDED_ROUTE_GRAPH_BENCHMARK_V0_1.md"
      - "tools/bounded-route-graph-audit/**"
      - ".github/workflows/bounded-route-graph-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "schemas/transport/bounded_route_graph_v0_1.schema.json"
      - "fixtures/transport/bounded_route_graph_scenarios_v0_1.json"
      - "docs/tech/BOUNDED_ROUTE_GRAPH_BENCHMARK_V0_1.md"
      - "tools/bounded-route-graph-audit/**"
      - ".github/workflows/bounded-route-graph-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounded-route-graph-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Normalize all mission transport Rust sources
        run: |
          cargo fmt --manifest-path tools/multimodal-mission-chain-audit/Cargo.toml
          cargo fmt --manifest-path tools/mission-resilience-audit/Cargo.toml
          cargo fmt --manifest-path tools/bounded-route-graph-audit/Cargo.toml
      - name: Verify all mission transport Rust sources
        run: |
          cargo fmt --manifest-path tools/multimodal-mission-chain-audit/Cargo.toml -- --check
          cargo fmt --manifest-path tools/mission-resilience-audit/Cargo.toml -- --check
          cargo fmt --manifest-path tools/bounded-route-graph-audit/Cargo.toml -- --check
      - name: Commit canonical formatting to this same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/multimodal-mission-chain-v0-1'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/multimodal-mission-chain-audit/src/main.rs tools/mission-resilience-audit/src/main.rs tools/bounded-route-graph-audit/src/main.rs
          if git diff --cached --quiet; then
            echo "Mission transport sources already rustfmt-normalized."
            exit 0
          fi
          git commit -m "Apply rustfmt to mission transport auditors"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Run graph enumeration and fail-closed tests
        run: cargo test --manifest-path tools/bounded-route-graph-audit/Cargo.toml --all-targets
      - name: Audit bounded route graph fixture
        run: |
          cargo run --manifest-path tools/bounded-route-graph-audit/Cargo.toml -- fixtures/transport/bounded_route_graph_scenarios_v0_1.json > "$RUNNER_TEMP/bounded-route-graph-report.json"
          jq -e '
            .benchmark_id == "bounded-route-graph-v0.1"
            and .mission_count == 6
            and .environment_count == 5
            and .node_count == 17
            and .edge_count == 19
            and .topological_route_count == 14
            and .eligible_route_count == 9
            and .expected_oracle_match_count == 6
            and .expected_oracle_match_percent == 100
            and .weighted_utility_score_produced == false
            and .universal_winner_produced == false
            and .route_or_deployment_authorized == false
            and .patient_care_authorized == false
            and .autonomous_hazard_handling_authorized == false
            and .real_world_validated == false
            and ([.mission_summaries[] | select(.mission_id == "afghanistan-civilian-aid-payload") | .mission_disposition] == ["no_admissible_route"])
            and ([.mission_summaries[] | select(.mission_id == "sahara-disconnected-sensor") | .mission_disposition] == ["no_topological_route"])
            and ([.route_assessments[] | select(.route_id == "congo-unsecure-direct") | .disposition] == ["blocked_constraints"])
            and ([.route_assessments[] | select(.route_id == "ant-air-direct") | .disposition] == ["needs_gate_evidence"])
          ' "$RUNNER_TEMP/bounded-route-graph-report.json"
          sha256sum "$RUNNER_TEMP/bounded-route-graph-report.json"

