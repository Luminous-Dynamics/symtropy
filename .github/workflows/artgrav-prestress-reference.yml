name: Artgrav Prestress Reference

on:
  push:
    branches:
      - research/artgrav-prestress-modal-v0-1
    paths:
      - "tools/artgrav-prestress-reference/**"
      - ".github/workflows/artgrav-prestress-reference.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/artgrav-prestress-reference/**"
      - ".github/workflows/artgrav-prestress-reference.yml"

permissions:
  contents: read

jobs:
  reference:
    name: analytical-reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/artgrav-prestress-reference/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/artgrav-prestress-reference/Cargo.toml --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path tools/artgrav-prestress-reference/Cargo.toml --locked --all-targets
