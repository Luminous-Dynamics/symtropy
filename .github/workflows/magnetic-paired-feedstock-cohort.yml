name: Magnetic paired feedstock cohort evaluator

on:
  pull_request:
    paths:
      - "research/magnetics/paired-feedstock-cohort/**"
      - "research/magnetics/MAG_PAIRED_FEEDSTOCK_COHORTS_2026-11-28.md"
      - ".github/workflows/magnetic-paired-feedstock-cohort.yml"

permissions:
  contents: read

jobs:
  paired-feedstock-cohort:
    name: paired feedstock cohort / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Formatting
        run: cargo fmt --manifest-path research/magnetics/paired-feedstock-cohort/evaluator/Cargo.toml --all -- --check
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/magnetics/paired-feedstock-cohort/evaluator/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path research/magnetics/paired-feedstock-cohort/evaluator/Cargo.toml --all-targets
