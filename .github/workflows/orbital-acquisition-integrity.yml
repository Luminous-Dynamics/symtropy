name: Orbital Acquisition Integrity Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-acquisition-integrity-bench/**"
      - "docs/research/orbital-truss/fixtures/acquisition-integrity-v0_1.json"
      - "docs/research/orbital-truss/orbital_acquisition_integrity_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-acquisition-integrity.yml"
  push:
    branches:
      - "research/orbital-acquisition-integrity-evaluator-v0-1"
    paths:
      - "tools/orbital-acquisition-integrity-bench/**"
      - "docs/research/orbital-truss/fixtures/acquisition-integrity-v0_1.json"
      - "docs/research/orbital-truss/orbital_acquisition_integrity_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-acquisition-integrity.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Acquisition integrity contract and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and Draft 2020-12 schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/acquisition-integrity-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_acquisition_integrity_corpus_v0_1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert len(fixture["cases"]) == 19
          assert len({case["case_id"] for case in fixture["cases"]}) == 19
          print("18 frozen acquisition-integrity cases and Draft 2020-12 schema validated")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-acquisition-integrity-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-acquisition-integrity-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-acquisition-integrity-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-acquisition-integrity-bench/Cargo.toml --bin orbital-acquisition-integrity-bench -- docs/research/orbital-truss/fixtures/acquisition-integrity-v0_1.json "$GITHUB_SHA" > /tmp/acq-rust-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-acquisition-integrity-bench/Cargo.toml --bin orbital-acquisition-integrity-bench -- docs/research/orbital-truss/fixtures/acquisition-integrity-v0_1.json "$GITHUB_SHA" > /tmp/acq-rust-b.json
          cmp /tmp/acq-rust-a.json /tmp/acq-rust-b.json
          jq -e '
            .schema == "luminous.orbital-acquisition-integrity.receipt.v0.1" and
            .case_count == 19 and .expected_outcome_matches == 19 and
            .expected_outcome_mismatches == 0 and .authority_granted == false and
            .physical_validation == "NOT_ASSESSED" and
            (.cases | all(.[]; .visibility_assessed == false and .photometric_usability_assessed == false and .feature_measurability_assessed == false))
          ' /tmp/acq-rust-a.json
      - name: Independent Python oracle
        run: |
          python3 tools/orbital-acquisition-integrity-bench/tests/reference_oracle.py docs/research/orbital-truss/fixtures/acquisition-integrity-v0_1.json "$GITHUB_SHA" > /tmp/acq-python.json
      - name: Compare complete Rust and Python receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/acq-rust-a.json").read_text())
          oracle = json.loads(Path("/tmp/acq-python.json").read_text())
          assert rust == oracle
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert cases["ACQ-001-STATIC-GLOBAL-SHUTTER"]["status"] == "ACQUISITION_VALID_WITHIN_BUDGET"
          assert cases["ACQ-003-EXPOSURE-SMEAR-EXCEEDED"]["status"] == "MOTION_BLUR_BUDGET_EXCEEDED"
          assert cases["ACQ-004-ROLLING-SHUTTER-ROW-TIME-EXCEEDED"]["status"] == "ROLLING_SHUTTER_BUDGET_EXCEEDED"
          assert cases["ACQ-005-TIMESTAMP-ASSOCIATION-EXCEEDED"]["status"] == "TIMING_UNCERTAINTY_EXCEEDED"
          assert cases["ACQ-006-COMBINED-BUDGET-EXCEEDED"]["status"] == "COMBINED_ACQUISITION_BUDGET_EXCEEDED"
          assert cases["ACQ-015-PROJECTOR-WINDOW-DISJOINT"]["status"] == "PROJECTOR_PATTERN_MISMATCH"
          assert cases["ACQ-016-PROJECTOR-WINDOW-OVERLAPS-TRANSITION"]["status"] == "INDETERMINATE"
          assert cases["ACQ-017-PROJECTOR-WINDOW-FULLY-STABLE"]["status"] == "ACQUISITION_VALID_WITHIN_BUDGET"
          assert cases["ACQ-019-PROJECTOR-CLOCK-MAP-UNKNOWN"]["status"] == "INDETERMINATE"
          print("Rust and independent Python oracle agree on all 19 acquisition-integrity cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-acquisition-integrity-evidence
          path: |
            /tmp/acq-rust-a.json
            /tmp/acq-python.json
            docs/research/orbital-truss/fixtures/acquisition-integrity-v0_1.json
            docs/research/orbital-truss/orbital_acquisition_integrity_corpus_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
