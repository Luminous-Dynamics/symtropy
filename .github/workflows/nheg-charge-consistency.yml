name: EGB NHEG charge consistency replay

on:
  push:
    branches:
      - research/egb-nheg-charge-consistency-2026-11-21
    paths:
      - crates/domains/symtropy-lovelock5d/benchmarks/derive_nheg_charge_consistency.py
      - .github/workflows/nheg-charge-consistency.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nheg-charge-consistency
  cancel-in-progress: false

jobs:
  exact-three-way-check:
    name: Exact Wald / Lovelock / source-density comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned symbolic engine
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Replay coordinate curvature and charge densities
        env:
          PYTHONHASHSEED: "0"
        run: |
          OUT="$RUNNER_TEMP/nheg_charge_consistency.json"
          python crates/domains/symtropy-lovelock5d/benchmarks/derive_nheg_charge_consistency.py --output "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          v=data["validation"]
          required=(
              "coordinate_determinant_exact",
              "Lovelock_PGB_contraction_exact",
              "Einstein_sector_matches_source_Eq29_exactly",
              "GB_Noether_potential_exact",
              "axial_variation_exact",
              "Wald_variation_exact",
              "source_density_conversion_exact",
              "three_way_discrepancy_exact",
          )
          for key in required:
              assert v[key] is True, (key, v[key])
          assert v["source_charge_formula_term_by_term_replayed"] is False
          assert v["symplectic_flux_and_integrability_established"] is False
          assert v["finite_entropy_or_angular_momentum_claimed"] is False
          grid=data["reference_grid"]
          assert grid["point_count"] == 95 and len(grid["samples"]) == 95
          assert grid["precision_digits"] == 60
          print("PASS: coordinate Lovelock momentum and Einstein normalization.")
          print("PASS: exact source, axial Noether, and Wald density polynomials separately reconstructed.")
          print("PASS: discrepancy preserved as unresolved; no finite charge claimed.")
          PY
      - name: Preserve exact consistency receipt
        uses: actions/upload-artifact@v4
        with:
          name: egb-nheg-charge-consistency-replay
          path: ${{ runner.temp }}/nheg_charge_consistency.json
          if-no-files-found: error
          retention-days: 30
