name: One-shot nested Cargo lock refresh (shipyard assurance stack)

on:
  push:
    branches:
      - "research/shipyard-assurance-stack-v1-20261112"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Regenerate shipyard-weld-physics-vvuq lockfile
        run: cargo generate-lockfile --manifest-path crates/tools/shipyard-weld-physics-vvuq/Cargo.toml

      - name: Regenerate shipyard-distortion-co-design lockfile
        run: cargo generate-lockfile --manifest-path crates/tools/shipyard-distortion-co-design/Cargo.toml

      - name: Regenerate shipyard-tandem-gmaw-admission lockfile
        run: cargo generate-lockfile --manifest-path crates/tools/shipyard-tandem-gmaw-admission/Cargo.toml

      - name: Commit generated lockfiles
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- crates/tools/shipyard-weld-physics-vvuq/Cargo.lock crates/tools/shipyard-distortion-co-design/Cargo.lock crates/tools/shipyard-tandem-gmaw-admission/Cargo.lock; then
            echo "All three dependency lockfiles are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tools/shipyard-weld-physics-vvuq/Cargo.lock crates/tools/shipyard-distortion-co-design/Cargo.lock crates/tools/shipyard-tandem-gmaw-admission/Cargo.lock
          git commit -m "build: refresh locked serde_json dependency graphs for shipyard verifiers"
          git push origin "HEAD:${TARGET_BRANCH}"
