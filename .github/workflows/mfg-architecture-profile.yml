name: Manufacturing Architecture Profile Integrity

on:
  pull_request:
    paths:
      - "tools/manufacturing-architecture-portability/**"
      - ".github/workflows/mfg-architecture-profile.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/manufacturing-architecture-portability/**"
      - ".github/workflows/mfg-architecture-profile.yml"

permissions:
  contents: write

concurrency:
  group: mfg-architecture-profile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/manufacturing-architecture-portability/validator -> target

      # One-time maintainer-only formatting repair. This guarded step is removed
      # after the normalized source is committed; normal validation is read-only.
      - name: One-time rustfmt repair on Foundry research branch
        if: github.event_name == 'pull_request' && github.actor == 'Tristan-Stoltz-ERC' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/mfg-architecture-portability-v0-1'
        run: |
          cargo fmt --manifest-path tools/manufacturing-architecture-portability/validator/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/manufacturing-architecture-portability/validator/src
          if ! git diff --cached --quiet; then
            git commit -m "style(foundry): rustfmt portability validator"
            git push origin HEAD:refs/heads/research/mfg-architecture-portability-v0-1
          fi

      # Cargo.lock is committed and every dependency operation is locked.
      - name: Check formatting
        working-directory: tools/manufacturing-architecture-portability/validator
        run: cargo fmt --all -- --check

      - name: Validate Draft 2020-12 schema and profile fixtures
        working-directory: tools/manufacturing-architecture-portability/validator
        run: cargo test --locked

      - name: Validate all committed profiles
        working-directory: tools/manufacturing-architecture-portability/validator
        run: |
          cargo run --locked --bin mfg-architecture-profile-validator -- ../profile.schema.json \
            ../profiles/uns-mqtt.synthetic.json \
            ../profiles/i3x-1.0.reference.json \
            ../profiles/opcua-machinery-1.04.2.reference.json \
            ../profiles/opcua-robotics-1.02.reference.json

      - name: Evaluate the explicit QIF inspection join fixture
        working-directory: tools/manufacturing-architecture-portability/validator
        run: cargo run --locked --bin validate-inspection-join -- ../inspection-join.schema.json tests/fixtures/qif-cycle-join.candidate.json

      - name: Clippy
        working-directory: tools/manufacturing-architecture-portability/validator
        run: cargo clippy --locked --all-targets -- -D warnings

