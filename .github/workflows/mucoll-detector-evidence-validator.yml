name: mucoll-detector-evidence-validator

on:
  pull_request:
    paths:
      - ".github/workflows/mucoll-detector-evidence-validator.yml"
      - "tools/mucoll-detector-evidence-validator/**"
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/mucoll-detector-evidence-validator.yml"
      - "tools/mucoll-detector-evidence-validator/**"

permissions:
  contents: read

concurrency:
  group: mucoll-detector-evidence-validator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validator:
    name: detector evidence validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Generate dependency lock
        run: cargo generate-lockfile --manifest-path tools/mucoll-detector-evidence-validator/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path tools/mucoll-detector-evidence-validator/Cargo.toml -- --check

      - name: Run unit and negative-control tests
        run: cargo test --locked --manifest-path tools/mucoll-detector-evidence-validator/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/mucoll-detector-evidence-validator/Cargo.toml --all-targets -- -D warnings

      - name: Check CLI usage
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/mucoll-detector-evidence-validator/Cargo.toml -- --help

      - name: Retain lockfile and validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mucoll-detector-evidence-validator-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tools/mucoll-detector-evidence-validator/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
