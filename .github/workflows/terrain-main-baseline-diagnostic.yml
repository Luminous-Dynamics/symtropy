name: Terrain Main Baseline Diagnostic

on:
  push:
    branches:
      - "ci/terrain-main-baseline-3cb63c8"
    paths:
      - ".github/workflows/terrain-main-baseline-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: terrain-main-baseline-3cb63c8
  cancel-in-progress: true

jobs:
  classify:
    name: Classify exact-main Terrain baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind diagnostic harness lineage
        shell: bash
        run: |
          set -euo pipefail
          base=3cb63c80a273a5f6f41b6eeafbc11cb97f7aaac7
          test "$(git rev-parse HEAD^)" = "${base}"
          test "$(git diff --name-only ${base}..HEAD)" = ".github/workflows/terrain-main-baseline-diagnostic.yml"
          echo "TERRAIN_BASELINE_HARNESS_HEAD=$(git rev-parse HEAD)"
          echo "TERRAIN_BASELINE_HARNESS_TREE=$(git rev-parse HEAD^{tree})"

      - name: Checkout exact main baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3cb63c80a273a5f6f41b6eeafbc11cb97f7aaac7
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact main Terrain subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3cb63c80a273a5f6f41b6eeafbc11cb97f7aaac7"
          test "$(git rev-parse HEAD^{tree})" = "fbdfb6e0543fa3bce1ef73d655bf5efdc46c3739"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/Cargo.toml)" = "6b3dd8cc5ede90833caecd6568757c42ecc97509"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/lib.rs)" = "bbf60ddd18fbe3a5933afda0b1d068df5540bd46"
          test "$(git rev-parse HEAD:Cargo.lock)" = "db602c9707ecd6143ef36c0243c051544a027141"
          test -z "$(git status --porcelain)"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/terrain-main-baseline-target" >> "${GITHUB_ENV}"

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind toolchain and locked graph
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/terrain-main-metadata.json"
          echo "TERRAIN_BASELINE_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/terrain-main-metadata.json" | awk '{print $1}')"
          test "$(git rev-parse HEAD:Cargo.lock)" = "db602c9707ecd6143ef36c0243c051544a027141"

      - name: Classify exact Terrain all-target check
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/terrain-main-check.log"
          set +e
          cargo check -p symtropy-terrain --locked --all-targets 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e

          if [ "${status}" -eq 0 ]; then
            echo "TERRAIN_BASELINE_CLASSIFICATION=PASS"
          else
            grep -F 'naga-27.0.3/src/error.rs:50' "${log}" >/dev/null
            grep -F 'naga-27.0.3/src/front/wgsl/error.rs:113' "${log}" >/dev/null
            grep -F 'naga-27.0.3/src/span.rs:326' "${log}" >/dev/null
            test "$(grep -Fc 'the trait bound `std::string::String: WriteColor` is not satisfied' "${log}")" -ge 3
            grep -F 'could not compile `naga` (lib) due to 3 previous errors' "${log}" >/dev/null
            echo "TERRAIN_BASELINE_CLASSIFICATION=NAGA_27_WRITECOLOR_BLOCKER"
          fi

          test -z "$(git status --porcelain)"
