name: Orbital Assurance Bundle Benchmark

on:
  push:
    branches:
      - "research/orbital-assurance-bundle-v0-1"
      - "research/orbital-incumbent-sequential-receipt-v0-1"
      - "research/orbital-incumbent-policy-adequacy-v0-1"
      - "research/orbital-policy-source-provenance-v0-1"
      - "research/orbital-cvar-regret-v0-1"
      - "research/orbital-incumbent-adequacy-v0-1"
      - "research/orbital-incumbent-loss-model-bridge-v0-1"
      - "research/orbital-incumbent-policy-adequacy-v0-1"
    paths:
      - "tools/orbital-assurance-bundle-bench/**"
      - "research/orbital/DECISION_ASSURANCE_COMPARATOR_PROTOCOL_V0_1.md"
      - "research/orbital/DEPENDENCY_GRAPH_ADEQUACY_V0_1.md"
      - "research/orbital/INCUMBENT_DECISION_ADEQUACY_V0_1.md"
      - "research/orbital/INCUMBENT_LOSS_MODEL_BRIDGE_V0_1.md"
      - "research/orbital/INCUMBENT_POLICY_ADEQUACY_V0_1.md"
      - "research/orbital/ORBITAL_RISK_SENSITIVE_CVAR_V0_1.md"
      - ".github/workflows/orbital-assurance-bundle-bench.yml"
  pull_request:
    branches:
      - "research/orbital-incumbent-adequacy-v0-1"
      - "research/orbital-dependency-graph-adequacy-v0-1"
      - "research/orbital-assurance-bundle-v0-1"
      - "research/orbital-incumbent-sequential-receipt-v0-1"
      - "research/orbital-policy-source-provenance-v0-1"
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/orbital-assurance-bundle-bench/**"
      - "research/orbital/DECISION_ASSURANCE_COMPARATOR_PROTOCOL_V0_1.md"
      - "research/orbital/DEPENDENCY_GRAPH_ADEQUACY_V0_1.md"
      - "research/orbital/INCUMBENT_DECISION_ADEQUACY_V0_1.md"
      - "research/orbital/INCUMBENT_LOSS_MODEL_BRIDGE_V0_1.md"
      - ".github/workflows/orbital-assurance-bundle-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbital-assurance-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assurance-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact benchmark head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Generate standalone lockfile
        run: cargo generate-lockfile --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml -- --check

      - name: Run unit tests
        run: cargo test --locked --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --all-targets

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --all-targets -- -D warnings

      - name: Replay frozen assurance corpus
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$BENCHMARK_COMMIT"
          set +e
          cargo run --locked --quiet --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --bin orbital-assurance-bundle-bench -- \
            tools/orbital-assurance-bundle-bench/fixtures/v0.1/assurance-cases.json \
            --source-commit "$actual_commit" > orbital-assurance-bundle-receipt.json
          replay_status=$?
          set -e
          echo "Assurance receipt summary:"
          jq '.report.summary' orbital-assurance-bundle-receipt.json
          echo "Cases whose computed result differs from frozen expectation:"
          jq -r '.report.cases[] | select(.expected_result_matched == false) | [.case_id, .disposition, .blocker_count, (.blockers | map(.code + ":" + (.claim_id // "-") + ":" + .detail) | join(";"))] | @tsv' orbital-assurance-bundle-receipt.json
          if [ "$replay_status" -ne 0 ]; then
            echo "Corpus replay returned $replay_status; refusing to treat mismatches as success."
            exit "$replay_status"
          fi
          jq -e --arg expected_commit "$BENCHMARK_COMMIT" '
            .receipt_schema == "luminous.orbital-assurance-bundle.receipt.v0.1"
            and .source_commit == $expected_commit
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .report.evidence_class == "synthetic"
            and .report.claim_ceiling == "synthetic-assurance-graph-structure-only"
            and .report.summary.case_count == 60
            and .report.summary.expected_result_mismatches == 0
            and .report.summary.review_bundle_complete >= 1
            and .report.summary.authority_grants == 0
            and .report.authority_granted == false
            and .authority_granted == false
          ' orbital-assurance-bundle-receipt.json

      - name: Run independent JavaScript graph oracle
        run: node tools/orbital-assurance-bundle-bench/tests/reference_oracle.mjs tools/orbital-assurance-bundle-bench/fixtures/v0.1/assurance-cases.json

      - name: Validate dependency-invalidation corpus contract
        run: node tools/orbital-assurance-bundle-bench/tests/validate_invalidation_contract.mjs tools/orbital-assurance-bundle-bench/schema/v0.1/invalidation-corpus.schema.json tools/orbital-assurance-bundle-bench/fixtures/v0.1/invalidation-cases.json

      - name: Validate dependency-invalidation receipt schema JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/schema/v0.1/invalidation-receipt.schema.json", "utf8"))'

      - name: Generate dependency-invalidation receipt
        run: |
          cargo run --locked --quiet --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --bin dependency-invalidation -- tools/orbital-assurance-bundle-bench/fixtures/v0.1/invalidation-cases.json --source-commit "$BENCHMARK_COMMIT" > dependency-invalidation-receipt.json
          jq -e --arg expected_commit "$BENCHMARK_COMMIT" '
            .receipt_schema == "luminous.orbital-assurance-invalidation.receipt.v0.1"
            and .source_commit == $expected_commit
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .evaluation.summary.case_count == 7
            and .evaluation.summary.expected_result_mismatches == 0
            and .evaluation.summary.authority_grants == 0
            and .evaluation.authority_granted == false
            and .authority_granted == false
          ' dependency-invalidation-receipt.json

      - name: Run independent JavaScript invalidation oracle
        run: node tools/orbital-assurance-bundle-bench/tests/dependency_invalidation_oracle.mjs tools/orbital-assurance-bundle-bench/fixtures/v0.1/invalidation-cases.json > dependency-invalidation-oracle.json

      - name: Compare Rust invalidation receipt to independent oracle
        run: node tools/orbital-assurance-bundle-bench/tests/compare_dependency_invalidation.mjs dependency-invalidation-receipt.json dependency-invalidation-oracle.json

      - name: Validate dependency graph adequacy corpus contract
        run: node tools/orbital-assurance-bundle-bench/tests/validate_dependency_graph_contract.mjs tools/orbital-assurance-bundle-bench/schema/v0.1/dependency-graph-corpus.schema.json tools/orbital-assurance-bundle-bench/fixtures/v0.1/dependency-graph-cases.json

      - name: Validate dependency graph adequacy receipt schema JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/schema/v0.1/dependency-graph-receipt.schema.json", "utf8"))'

      - name: Generate independent dependency graph adequacy receipt
        run: |
          cargo run --locked --quiet --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --bin dependency-graph-adequacy -- tools/orbital-assurance-bundle-bench/fixtures/v0.1/dependency-graph-cases.json --source-commit "$BENCHMARK_COMMIT" > dependency-graph-adequacy-receipt.json
          jq -e --arg expected_commit "$BENCHMARK_COMMIT" '
            .receipt_schema == "luminous.orbital-dependency-graph-adequacy.receipt.v0.1"
            and .source_commit == $expected_commit
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .evaluation.summary.case_count == 9
            and .evaluation.summary.graph_complete_cases >= 1
            and .evaluation.summary.common_mode_omission_cases >= 1
            and .evaluation.summary.source_unavailable_cases >= 1
            and .evaluation.summary.invalid_graph_cases >= 1
            and .evaluation.summary.expected_result_mismatches == 0
          ' dependency-graph-adequacy-receipt.json

      - name: Run independent JavaScript dependency grammar oracle
        run: node tools/orbital-assurance-bundle-bench/tests/dependency_graph_adequacy_oracle.mjs tools/orbital-assurance-bundle-bench/fixtures/v0.1/dependency-graph-cases.json > dependency-graph-adequacy-oracle.json

      - name: Compare Rust graph adequacy receipt to independent oracle
        run: node tools/orbital-assurance-bundle-bench/tests/compare_dependency_graph_adequacy.mjs dependency-graph-adequacy-receipt.json dependency-graph-adequacy-oracle.json

      - name: Validate incumbent-adequacy corpus contract
        run: node tools/orbital-assurance-bundle-bench/tests/validate_incumbent_adequacy_contract.mjs tools/orbital-assurance-bundle-bench/schema/v0.1/incumbent-adequacy-corpus.schema.json tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-adequacy-cases.json

      - name: Validate incumbent-adequacy receipt schema JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/schema/v0.1/incumbent-adequacy-receipt.schema.json", "utf8"))'

      - name: Generate finite-world incumbent-adequacy receipt
        run: |
          cargo run --locked --quiet --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --bin incumbent-decision-adequacy -- tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-adequacy-cases.json --source-commit "$BENCHMARK_COMMIT" > incumbent-decision-adequacy-receipt.json
          jq -e --arg expected_commit "$BENCHMARK_COMMIT" '
            .receipt_schema == "luminous.orbital-incumbent-adequacy.receipt.v0.1"
            and .source_commit == $expected_commit
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .evaluation.summary.case_count == 30
            and .evaluation.summary.retain_incumbent_cases >= 1
            and .evaluation.summary.reoptimization_warranted_cases >= 1
            and .evaluation.summary.abstain_cases >= 1
            and .evaluation.summary.loss_model_set_blocked_cases >= 1
            and .evaluation.summary.loss_scenario_evidence_blocked_cases >= 1
            and .evaluation.summary.joint_scenario_inventory_blocked_cases >= 1
            and .evaluation.summary.expected_result_mismatches == 0
            and ([.evaluation.cases[].case_id] | index("unknown_projection_id") != null)
            and ([.evaluation.cases[].case_id] | index("inexact_loss_projection") != null)
            and ([.evaluation.cases[].case_id] | index("incomplete_loss_matrix") != null)
            and .evaluation.summary.authority_grants == 0
            and .evaluation.authority_granted == false
            and .authority_granted == false
          ' incumbent-decision-adequacy-receipt.json

      - name: Run independent incumbent-adequacy oracle
        run: node tools/orbital-assurance-bundle-bench/tests/incumbent_adequacy_oracle.mjs tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-adequacy-cases.json > incumbent-decision-adequacy-oracle.json

      - name: Compare Rust incumbent-adequacy receipt to independent oracle
        run: node tools/orbital-assurance-bundle-bench/tests/compare_incumbent_adequacy.mjs incumbent-decision-adequacy-receipt.json incumbent-decision-adequacy-oracle.json

      - name: Validate incumbent-policy-adequacy fixture and schemas
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/schema/v0.1/incumbent-policy-adequacy-corpus.schema.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/schema/v0.1/incumbent-policy-adequacy-receipt.schema.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-policy-adequacy-cases.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-policy-adequacy-expected.json", "utf8"))'

      - name: Generate incumbent-policy-adequacy receipt
        run: |
          cargo run --locked --quiet --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --bin incumbent-policy-adequacy -- tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-policy-adequacy-cases.json --source-commit "$BENCHMARK_COMMIT" > incumbent-policy-adequacy-receipt.json
          jq -e --arg expected_commit "$BENCHMARK_COMMIT" '
            .receipt_schema == "luminous.orbital-incumbent-policy-adequacy.receipt.v0.1"
            and .source_commit == $expected_commit
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .evaluation.summary.case_count == 1
            and .evaluation.summary.policy_review_warranted_cases == 1
            and .evaluation.summary.authority_grants == 0
            and .physical_qualification_granted == false
            and .authority_granted == false
          ' incumbent-policy-adequacy-receipt.json

      - name: Compare incumbent-policy-adequacy receipt to frozen known answer
        run: |
          node --check tools/orbital-assurance-bundle-bench/tests/compare_incumbent_policy_adequacy.mjs
          node tools/orbital-assurance-bundle-bench/tests/compare_incumbent_policy_adequacy.mjs incumbent-policy-adequacy-receipt.json tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-policy-adequacy-expected.json

      - name: Run independent Python Fraction policy oracle
        run: |
          python3 --version
          python3 -m py_compile tools/orbital-assurance-bundle-bench/tests/incumbent_policy_adequacy_oracle.py
          python3 tools/orbital-assurance-bundle-bench/tests/incumbent_policy_adequacy_oracle.py tools/orbital-assurance-bundle-bench/fixtures/v0.1/incumbent-policy-adequacy-cases.json > incumbent-policy-adequacy-python.json

      - name: Compare Rust and Python policy evaluations
        run: |
          node --check tools/orbital-assurance-bundle-bench/tests/compare_rust_python_policy_adequacy.mjs
          node tools/orbital-assurance-bundle-bench/tests/compare_rust_python_policy_adequacy.mjs incumbent-policy-adequacy-receipt.json incumbent-policy-adequacy-python.json

      - name: Exhaustively enumerate tiny observable policy domain
        run: |
          python3 -m py_compile tools/orbital-assurance-bundle-bench/tests/exhaustive_observable_policy_oracle.py
          python3 tools/orbital-assurance-bundle-bench/tests/exhaustive_observable_policy_oracle.py tools/orbital-assurance-bundle-bench/fixtures/v0.1/exhaustive-observable-policy-domain.json > exhaustive-observable-policy-report.json
          jq -e '
            .schema == "luminous.orbital-observable-policy-exhaustive-report.v0.1"
            and .evidence_class == "synthetic"
            and .claim_ceiling == "tiny-finite-domain-exhaustive-observable-policy-oracle-only"
            and .policy_count == 22
            and .dominated_policy_count == 20
            and .frontier_policy_ids == [
              "query::measure::north=north_action::south=south_action",
              "static::safe"
            ]
            and .incumbent_policy_id == "static::safe"
            and .incumbent_worst_case_loss == {"numerator":10,"denominator":1}
            and .best_eligible_reference_policy_id == "query::measure::north=north_action::south=south_action"
            and .best_eligible_reference_worst_case_loss == {"numerator":1,"denominator":1}
            and .worst_case_improvement == {"numerator":9,"denominator":1}
            and .materiality_margin == {"numerator":2,"denominator":1}
            and .eligible_reference_policy_count == 1
            and .resource_blocked_frontier_policy_count == 0
            and .review_warranted == true
            and .authority_granted == false
          ' exhaustive-observable-policy-report.json

      - name: Validate CVaR corpus and output schemas
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/schema/v0.1/cvar-regret-corpus.schema.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/schema/v0.1/cvar-regret-evaluation.schema.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("tools/orbital-assurance-bundle-bench/fixtures/v0.1/cvar-regret-cases.json", "utf8"))'

      - name: Generate probability-qualified CVaR receipt with Rust
        run: |
          cargo run --locked --quiet --manifest-path tools/orbital-assurance-bundle-bench/Cargo.toml --bin cvar-regret -- tools/orbital-assurance-bundle-bench/fixtures/v0.1/cvar-regret-cases.json --source-commit "$BENCHMARK_COMMIT" > cvar-regret-receipt.json
          jq -e '
            .receipt_schema == "luminous.orbital-cvar-regret.receipt.v0.1"
            and .source_commit == env.BENCHMARK_COMMIT
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .result == "pass"
            and .evaluation.summary.case_count == 4
            and .evaluation.summary.pass_cases == 1
            and .evaluation.summary.abstain_cases == 3
            and .evaluation.summary.invalid_input_cases == 0
            and .evaluation.summary.authority_grants == 0
            and .probability_qualification_granted == false
            and .authority_granted == false
          ' cvar-regret-receipt.json

      - name: Run independent Python Fraction CVaR oracle and tests
        run: |
          python3 --version
          python3 -m py_compile tools/orbital-assurance-bundle-bench/tests/cvar_regret_oracle.py
          python3 tools/orbital-assurance-bundle-bench/tests/cvar_regret_oracle.py tools/orbital-assurance-bundle-bench/fixtures/v0.1/cvar-regret-cases.json > cvar-regret-python.json
          (cd tools/orbital-assurance-bundle-bench/tests && python3 -m unittest -v test_cvar_regret_oracle)

      - name: Compare Rust and Python CVaR results
        run: |
          node --check tools/orbital-assurance-bundle-bench/tests/compare_rust_python_cvar_regret.mjs
          node tools/orbital-assurance-bundle-bench/tests/compare_rust_python_cvar_regret.mjs cvar-regret-receipt.json cvar-regret-python.json

      - name: Upload reproducible assurance receipt
        uses: actions/upload-artifact@v4
        with:
          name: orbital-assurance-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            orbital-assurance-bundle-receipt.json
            dependency-invalidation-receipt.json
            dependency-invalidation-oracle.json
            dependency-graph-adequacy-receipt.json
            dependency-graph-adequacy-oracle.json
            incumbent-decision-adequacy-receipt.json
            incumbent-decision-adequacy-oracle.json
            incumbent-policy-adequacy-receipt.json
            incumbent-policy-adequacy-python.json
            exhaustive-observable-policy-report.json
            cvar-regret-receipt.json
            cvar-regret-python.json
          if-no-files-found: error
          retention-days: 30
