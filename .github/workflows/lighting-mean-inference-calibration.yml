name: lighting mean inference calibration tests

on:
  pull_request:
    paths:
      - 'tools/lighting-study-plan/calibrate_mean_inference_confirmation.py'
      - 'tools/lighting-study-plan/test_calibrate_mean_inference_confirmation.py'
      - 'docs/research/LIGHTING_MEAN_INFERENCE_CALIBRATION_V0_1.md'
      - 'results/mean-inference-calibration-summary.json'
      - '.github/workflows/lighting-mean-inference-calibration.yml'
  push:
    branches:
      - 'research/lighting-mean-inference-calibration-v0-1'
    paths:
      - 'tools/lighting-study-plan/calibrate_mean_inference_confirmation.py'
      - 'tools/lighting-study-plan/test_calibrate_mean_inference_confirmation.py'
      - 'docs/research/LIGHTING_MEAN_INFERENCE_CALIBRATION_V0_1.md'
      - 'results/mean-inference-calibration-summary.json'
      - '.github/workflows/lighting-mean-inference-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused unit tests
        working-directory: tools/lighting-study-plan
        run: python -m unittest -v test_calibrate_mean_inference_confirmation.py
      - name: Validate committed summary JSON
        run: python -m json.tool results/mean-inference-calibration-summary.json > /dev/null
      - name: Validate benchmark source is present
        run: test -s tools/lighting-study-plan/calibrate_mean_inference_confirmation.py
