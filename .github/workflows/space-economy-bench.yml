name: Space Economy Corpus Validator

on:
  push:
    branches: ["feat/space-economy-benchmark-suite-v0-1"]
    paths:
      - "docs/tech/space-economy-benchmark-corpus-v0.1.json"
      - "tools/space-economy-bench/**"
      - ".github/workflows/space-economy-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/space-economy-benchmark-corpus-v0.1.json"
      - "tools/space-economy-bench/**"
      - ".github/workflows/space-economy-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-economy-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Resolve and freeze standalone dependency graph
        run: cargo generate-lockfile --manifest-path tools/space-economy-bench/Cargo.toml

      - name: Run corpus validator unit tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml

      - name: Run exact value-of-information reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example voi_reference

      - name: Run common-cause resilience reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example common_cause_reference

      - name: Run supplier-concentration reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example supplier_concentration_reference

      - name: Run orbital sustainability externality reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example orbital_externality_reference
      - name: Execute corpus validator and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml -- \
            docs/tech/space-economy-benchmark-corpus-v0.1.json \
            --source-commit "$source_commit" > space-economy-reference-receipt.json
          jq -e '
            .result == "pass"
            and .scenario_count == 6
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | all(.status == "pass"))
          ' space-economy-reference-receipt.json

      - name: Execute value-of-information reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example voi_reference -- \
            --source-commit "$source_commit" > space-economy-voi-reference-receipt.json
          jq -e '
            .result == "pass"
            and .scenario_count == 2
            and .scenarios[0].metrics.sample_information_value_before_cost_scu.numerator == 2700000000
            and .scenarios[0].metrics.survey_net_incremental_value_scu.numerator == 1700000000
            and .scenarios[0].decision.purchase_survey == true
            and .scenarios[1].metrics.sample_information_value_before_cost_scu.numerator == 0
            and .scenarios[1].decision.purchase_survey == false
          ' space-economy-voi-reference-receipt.json

      - name: Execute common-cause resilience reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example common_cause_reference -- \
            --source-commit "$source_commit" > space-economy-common-cause-receipt.json
          jq -e '
            .result == "pass"
            and .service_demand_units == 60
            and .summary.shared_architecture_passes_single_provider_outage == true
            and .summary.shared_architecture_fails_shared_power_bus_outage == true
            and .summary.separate_architecture_passes_each_required_single_component_fault == true
            and .summary.diverse_cost_premium_scu == 20
          ' space-economy-common-cause-receipt.json

      - name: Execute supplier-concentration reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example supplier_concentration_reference -- \
            --source-commit "$source_commit" > space-economy-supplier-concentration-receipt.json
          jq -e '
            .result == "pass"
            and .demand_units == 70
            and .portfolios[0].hhi == 3350
            and .portfolios[0].n_minus_one_supplier_gate_pass == false
            and .portfolios[0].minimum_remaining_capacity_under_any_single_supplier_loss == 50
            and .portfolios[1].hhi == 2500
            and .portfolios[1].n_minus_one_supplier_gate_pass == true
            and .portfolios[1].minimum_remaining_capacity_under_any_single_supplier_loss == 75
            and .diversification_cost_premium_percent_integer == 18
          ' space-economy-supplier-concentration-receipt.json

      - name: Execute orbital sustainability externality reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example orbital_externality_reference -- \
            --source-commit "$source_commit" > space-economy-orbital-externality-receipt.json
          jq -e '
            .result == "pass"
            and .environment_scope == "synthetic_near_earth_orbit_case"
            and .service_floor_units == 90
            and .orbital_burden_budget_sobu == 15
            and .options[0].total_accounted_cost_scu == 60
            and .options[0].feasible == false
            and .options[1].residual_burden_sobu == 13
            and .options[1].feasible == true
            and .options[2].residual_burden_sobu == 8
            and .options[2].feasible == true
            and .options[3].claimed_removal_sobu == 20
            and .options[3].credited_removal_sobu == 0
            and .options[3].feasible == false
            and .options[4].service_floor_pass == false
            and .pareto_frontier_option_ids == ["design_for_removal", "service_and_reuse"]
          ' space-economy-orbital-externality-receipt.json

      - name: Bind toolchain and dependency-lock provenance to receipts
        shell: bash
        run: |
          set -euo pipefail
          lock_path="tools/space-economy-bench/Cargo.lock"
          lock_sha="$(sha256sum "$lock_path" | cut -d ' ' -f1)"
          printf '%s  %s\n' "$lock_sha" "$lock_path" > space-economy-cargo-lock.sha256
          for receipt in \
            space-economy-reference-receipt.json \
            space-economy-voi-reference-receipt.json \
            space-economy-common-cause-receipt.json \
            space-economy-supplier-concentration-receipt.json \
            space-economy-orbital-externality-receipt.json; do
            tmp="$(mktemp)"
            jq --arg lock_sha "$lock_sha" \
               '.dependency_lock_sha256 = $lock_sha | .rust_toolchain = "1.96.0"' \
               "$receipt" > "$tmp"
            mv "$tmp" "$receipt"
            jq -e '
              (.dependency_lock_sha256 | test("^[0-9a-f]{64}$"))
              and .rust_toolchain == "1.96.0"
            ' "$receipt"
          done

      - name: Upload deterministic benchmark receipts
        uses: actions/upload-artifact@v4
        with:
          name: space-economy-reference-receipts
          path: |
            space-economy-reference-receipt.json
            space-economy-voi-reference-receipt.json
            space-economy-common-cause-receipt.json
            space-economy-supplier-concentration-receipt.json
            space-economy-orbital-externality-receipt.json
            tools/space-economy-bench/Cargo.lock
            space-economy-cargo-lock.sha256
          if-no-files-found: error
          retention-days: 90
