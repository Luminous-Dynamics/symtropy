name: Space Economy Corpus Validator

on:
  push:
    branches: ["feat/space-economy-benchmark-suite-v0-1"]
    paths:
      - "docs/tech/space-economy-benchmark-corpus-v0.1.json"
      - "tools/space-economy-bench/**"
      - ".github/workflows/space-economy-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/space-economy-benchmark-corpus-v0.1.json"
      - "tools/space-economy-bench/**"
      - ".github/workflows/space-economy-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-economy-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Resolve and freeze standalone dependency graph
        run: cargo generate-lockfile --manifest-path tools/space-economy-bench/Cargo.toml

      - name: Run corpus validator unit tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml

      - name: Run exact value-of-information reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example voi_reference

      - name: Run common-cause resilience reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example common_cause_reference

      - name: Run supplier-concentration reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example supplier_concentration_reference

      - name: Run industrial capability-closure reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example industrial_closure_reference

      - name: Run temporal service-resilience reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example temporal_resilience_reference

      - name: Run resource-to-production-chain reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example resource_chain_reference

      - name: Run resource-assay decision-value reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example resource_assay_selection_reference

      - name: Run adaptive sequential exploration reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example sequential_resource_exploration_reference

      - name: Run correlation-aware assay evidence reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example correlated_assay_evidence_reference

      - name: Run robust model-uncertainty exploration reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example robust_exploration_model_uncertainty_reference

      - name: Run decision-value calibration experiment reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example decision_value_calibration_experiments_reference

      - name: Run calibration transfer-shift reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example calibration_transfer_shift_reference

      - name: Run orbital sustainability externality reference tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml --example orbital_externality_reference
      - name: Execute corpus validator and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml -- \
            docs/tech/space-economy-benchmark-corpus-v0.1.json \
            --source-commit "$source_commit" > space-economy-reference-receipt.json
          jq -e '
            .result == "pass"
            and .scenario_count == 6
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | all(.status == "pass"))
          ' space-economy-reference-receipt.json

      - name: Execute value-of-information reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example voi_reference -- \
            --source-commit "$source_commit" > space-economy-voi-reference-receipt.json
          jq -e '
            .result == "pass"
            and .scenario_count == 2
            and .scenarios[0].metrics.sample_information_value_before_cost_scu.numerator == 2700000000
            and .scenarios[0].metrics.survey_net_incremental_value_scu.numerator == 1700000000
            and .scenarios[0].decision.purchase_survey == true
            and .scenarios[1].metrics.sample_information_value_before_cost_scu.numerator == 0
            and .scenarios[1].decision.purchase_survey == false
          ' space-economy-voi-reference-receipt.json

      - name: Execute common-cause resilience reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example common_cause_reference -- \
            --source-commit "$source_commit" > space-economy-common-cause-receipt.json
          jq -e '
            .result == "pass"
            and .service_demand_units == 60
            and .summary.shared_architecture_passes_single_provider_outage == true
            and .summary.shared_architecture_fails_shared_power_bus_outage == true
            and .summary.separate_architecture_passes_each_required_single_component_fault == true
            and .summary.diverse_cost_premium_scu == 20
          ' space-economy-common-cause-receipt.json

      - name: Execute supplier-concentration reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example supplier_concentration_reference -- \
            --source-commit "$source_commit" > space-economy-supplier-concentration-receipt.json
          jq -e '
            .result == "pass"
            and .demand_units == 70
            and .portfolios[0].hhi == 3350
            and .portfolios[0].n_minus_one_supplier_gate_pass == false
            and .portfolios[0].minimum_remaining_capacity_under_any_single_supplier_loss == 50
            and .portfolios[1].hhi == 2500
            and .portfolios[1].n_minus_one_supplier_gate_pass == true
            and .portfolios[1].minimum_remaining_capacity_under_any_single_supplier_loss == 75
            and .diversification_cost_premium_percent_integer == 18
          ' space-economy-supplier-concentration-receipt.json

      - name: Execute orbital sustainability externality reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example orbital_externality_reference -- \
            --source-commit "$source_commit" > space-economy-orbital-externality-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and (.options | length == 5)
            and .environment_scope == "synthetic_near_earth_orbit_case"
            and .service_floor_units == 90
            and .orbital_burden_budget_sobu == 15
            and .options[0].total_accounted_cost_scu == 60
            and .options[0].feasible == false
            and .options[1].residual_burden_sobu == 13
            and .options[1].feasible == true
            and .options[2].residual_burden_sobu == 8
            and .options[2].feasible == true
            and .options[3].claimed_removal_sobu == 20
            and .options[3].credited_removal_sobu == 0
            and .options[3].feasible == false
            and .options[4].service_floor_pass == false
            and .pareto_frontier_option_ids == ["design_for_removal", "service_and_reuse"]
          ' space-economy-orbital-externality-receipt.json

      - name: Execute industrial capability-closure reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example industrial_closure_reference -- \
            --source-commit "$source_commit" > space-economy-industrial-closure-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and (.portfolios | length == 2)
            and .portfolios[0].claimed_local_content_percent == 92
            and .portfolios[0].target_state.reported_operational_now == true
            and .portfolios[0].target_state.locally_closed == false
            and ([.portfolios[0].target_state.blockers[] | select(.capability_id == "metal_refining" and .reason_code == "EVIDENCE_UNVERIFIED")] | length == 1)
            and ([.portfolios[0].target_state.blockers[] | select(.capability_id == "sensor_module" and .reason_code == "RECURRING_IMPORT_DEPENDENCY")] | length == 1)
            and .portfolios[1].claimed_local_content_percent == 78
            and .portfolios[1].target_state.locally_closed == true
            and (.negative_controls | length == 4)
          ' space-economy-industrial-closure-receipt.json

      - name: Execute temporal service-resilience reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example temporal_resilience_reference -- \
            --source-commit "$source_commit" > space-economy-temporal-resilience-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and .horizon_months == 12
            and .service_availability_floor_basis_points == 7500
            and .selected_robust_feasible_architecture == "verified_local_repair"
            and (.scenarios | length == 5)
            and .scenarios[0].service_months == 9
            and .scenarios[0].availability_gate_pass == true
            and .scenarios[1].service_months == 7
            and .scenarios[1].max_consecutive_downtime_months == 2
            and .scenarios[1].availability_gate_pass == false
            and .scenarios[2].externally_sourced_spares_consumed == 0
            and .scenarios[2].local_repair_events_credited == 3
            and .scenarios[2].availability_gate_pass == true
            and .scenarios[4].credited_local_repair == false
            and .scenarios[4].service_months == 1
          ' space-economy-temporal-resilience-receipt.json

      - name: Execute resource-to-production-chain reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example resource_chain_reference -- \
            --source-commit "$source_commit" > space-economy-resource-chain-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and (.pathways | length == 4)
            and ([.pathways[].mass_balance_pass] | all)
            and .pathways[0].conditional_product_mass_kg == 900
            and .pathways[0].firm_product_mass_in_synthetic_fixture_kg == 900
            and .pathways[1].conditional_product_mass_kg == 200
            and .pathways[1].firm_product_mass_in_synthetic_fixture_kg == 0
            and (.pathways[1].blockers | index("ENERGY_BUDGET_EXCEEDED") != null)
            and .pathways[2].conditional_product_mass_kg == 54
            and .pathways[2].firm_product_mass_in_synthetic_fixture_kg == 0
            and .pathways[3].product_streams[0].mass_kg == 48
            and .pathways[3].product_streams[1].mass_kg == 6
            and .pathways[3].firm_product_mass_in_synthetic_fixture_kg == 0
            and .pathways[2].allocation_group == .pathways[3].allocation_group
            and (.pathways[1].uncredited_coproducts | length == 4)
          ' space-economy-resource-chain-receipt.json

      - name: Execute resource-assay decision-value reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example resource_assay_selection_reference -- \
            --source-commit "$source_commit" > space-economy-resource-assay-selection-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and .expected_value_without_survey.numerator == 5000000000
            and .evpi.numerator == 5000000000
            and .selected_measurement == "direct_sample_assay"
            and (.surveys | length == 4)
            and .surveys[0].evsi.numerator == 3500000000
            and .surveys[0].net_incremental_value.numerator == 2500000000
            and .surveys[0].purchase_survey == true
            and .surveys[0].decision_after_positive == "build_local_oxygen"
            and .surveys[0].decision_after_negative == "import_oxygen"
            and .surveys[0].posterior_rich_site_probability_after_positive_bps == 9000
            and .surveys[0].posterior_rich_site_probability_after_negative_bps == 1000
            and .surveys[1].posterior_rich_site_probability_after_positive_bps == 6000
            and .surveys[1].posterior_rich_site_probability_after_negative_bps == 4000
            and .surveys[1].evsi.numerator == 0
            and .surveys[1].purchase_survey == false
            and .surveys[1].decision_after_positive == .surveys[1].decision_after_negative
            and .surveys[2].purchase_survey == false
            and .surveys[3].evidence_verified == false
            and .surveys[3].effective_sensitivity_used_bps == 5000
            and .surveys[3].effective_specificity_used_bps == 5000
            and .surveys[3].evsi.numerator == 0
            and .surveys[3].purchase_survey == false
            and (.evpi.numerator == 5000000000)
            and all(.surveys[]; .evsi.numerator <= 5000000000)
          ' space-economy-resource-assay-selection-receipt.json

      - name: Execute adaptive sequential resource exploration reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example sequential_resource_exploration_reference -- \
            --source-commit "$source_commit" > space-economy-sequential-resource-exploration-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and .probability_weight_denominator == 1000000000000
            and .baseline.expected_value_without_measurement.numerator == 50000000000000
            and .baseline.evpi.numerator == 50000000000000
            and .direct_high_resolution_assay.net_expected_value.numerator == 65000000000000
            and (.adaptive_policy.branches | length == 2)
            and .adaptive_policy.branches[0].first_stage_outcome == "positive"
            and .adaptive_policy.branches[0].conditional_evsi.numerator == 6500000000000
            and .adaptive_policy.branches[0].purchase_followup == false
            and .adaptive_policy.branches[1].first_stage_outcome == "negative"
            and .adaptive_policy.branches[1].conditional_evsi.numerator == 23500000000000
            and .adaptive_policy.branches[1].purchase_followup == true
            and .adaptive_policy.gross_expected_value.numerator == 78500000000000
            and .adaptive_policy.expected_survey_cost.numerator == 11000000000000
            and .adaptive_policy.net_expected_value.numerator == 67500000000000
            and .adaptive_policy.net_incremental_value_over_no_measurement.numerator == 17500000000000
            and .adaptive_policy.net_advantage_over_direct_high_resolution_assay.numerator == 2500000000000
            and .adaptive_policy.selected_followup_after_screen_outcomes == ["negative"]
            and .high_cost_negative_control.stops_after_screen == true
            and (.high_cost_negative_control.selected_followup_after_screen_outcomes | length == 0)
            and .high_cost_negative_control.net_expected_value.numerator == 54000000000000
          ' space-economy-sequential-resource-exploration-receipt.json

      - name: Execute correlation-aware resource assay reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example correlated_assay_evidence_reference -- \
            --source-commit "$source_commit" > space-economy-correlated-assay-evidence-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and .probability_denominator == 100000000
            and .baseline.expected_value_without_measurement.numerator == 5000000000
            and .baseline.evpi.numerator == 5000000000
            and .latent_shared_calibration_mode.probability_bps == 5000
            and .latent_spatial_representativeness_state.unrepresentative_probability_bps == 2000
            and .model_comparisons.single_assay_a.model.gross_expected_value.numerator == 6100000000
            and .model_comparisons.single_assay_a.portfolio.net_expected_value.numerator == 5700000000
            and .model_comparisons.shared_calibration_joint_model_a_b.model.gross_expected_value.numerator == 6670000000
            and .model_comparisons.shared_calibration_joint_model_a_b.model.outcomes[0].posterior_rich_probability_bps_floor == 8108
            and .model_comparisons.shared_calibration_joint_model_a_b.portfolio.net_expected_value.numerator == 5670000000
            and .model_comparisons.naive_independence_negative_control.model.gross_expected_value.numerator == 7062000000
            and .model_comparisons.naive_independence_negative_control.model.outcomes[0].posterior_rich_probability_bps_floor == 8901
            and .model_comparisons.naive_independence_negative_control.accepted_for_policy_selection == false
            and .model_comparisons.naive_independence_negative_control.credited_incremental_value_units == 0
            and .model_comparisons.complementary_assay_a_c.model.gross_expected_value.numerator == 7566000000
            and .model_comparisons.complementary_assay_a_c.portfolio.net_expected_value.numerator == 6666000000
            and .portfolio_exhaustive_selection.selected_portfolio == "complementary_assay_a_c"
            and .portfolio_exhaustive_selection.selected_net_expected_value.numerator == 6666000000
            and .portfolio_exhaustive_selection.zero_regret_vs_finite_enumeration == true
            and (.negative_controls.provenance_controls | length == 5)
            and all(.negative_controls.provenance_controls[]; .credited_incremental_value_units == 0 and .evidence_credit_rejected == true)
            and .negative_controls.three_assay_budget_overrun.budget_pass == false
            and .negative_controls.three_assay_budget_overrun.selection_credit == null
          ' space-economy-correlated-assay-evidence-receipt.json

      - name: Execute robust model-uncertainty exploration reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example robust_exploration_model_uncertainty_reference -- \
            --source-commit "$source_commit" > space-economy-robust-model-uncertainty-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and (.model_set_sha256 | test("^[0-9a-f]{64}$"))
            and .uncertainty_set.model_count == 3
            and .model_specifications.schema_version == "0.1.0"
            and (.model_specifications.models | length == 3)
            and .model_specifications.models[0].model_id == "nominal_high_accuracy"
            and .model_specifications.models[0].sensitivity_bps == 9000
            and .model_specifications.models[0].specificity_bps == 9000
            and .model_specifications.models[1].model_id == "moderate_accuracy"
            and .model_specifications.models[1].sensitivity_bps == 7000
            and .model_specifications.models[2].model_id == "uninformative_limit"
            and .model_specifications.models[2].sensitivity_bps == 5000
            and .expected_value_without_measurement.numerator == 5000000000
            and .evpi.numerator == 5000000000
            and .uncertainty_set.models[0].gross_expected_value_if_assay_bought.numerator == 8500000000
            and .uncertainty_set.models[0].net_value_if_always_buy_assay.numerator == 6500000000
            and .uncertainty_set.models[0].evsi_before_assay_cost.numerator == 3500000000
            and .uncertainty_set.models[1].gross_expected_value_if_assay_bought.numerator == 5500000000
            and .uncertainty_set.models[1].net_value_if_always_buy_assay.numerator == 3500000000
            and .uncertainty_set.models[1].evsi_before_assay_cost.numerator == 500000000
            and .uncertainty_set.models[2].gross_expected_value_if_assay_bought.numerator == 5000000000
            and .uncertainty_set.models[2].net_value_if_always_buy_assay.numerator == 3000000000
            and .uncertainty_set.models[2].evsi_before_assay_cost.numerator == 0
            and .selected_policies.nominal_optimal == "always_buy_assay"
            and .selected_policies.maximin_expected_value == "no_measurement"
            and .selected_policies.minimax_max_regret == "calibrate_then_adapt"
            and .selected_policies.nominal_value_numerator == 6500000000
            and .selected_policies.maximin_value_numerator == 5000000000
            and .selected_policies.minimax_regret_numerator == 300000000
            and .selected_policies.objective_choice_changes_policy == true
            and .policy_scores[0].worst_case_net_expected_value.numerator == 5000000000
            and .policy_scores[0].max_regret.numerator == 1500000000
            and .policy_scores[1].worst_case_net_expected_value.numerator == 3000000000
            and .policy_scores[1].max_regret.numerator == 2000000000
            and .policy_scores[2].worst_case_net_expected_value.numerator == 4700000000
            and .policy_scores[2].max_regret.numerator == 300000000
            and .calibration_gate.real_world_evidence == false
            and .unverified_model_negative_control.eligible_for_robust_selection == false
            and .unverified_model_negative_control.credited_incremental_value == 0
            and (.resource_budget.max_assays == 2 and .resource_budget.max_sample_units == 2 and .resource_budget.max_power_units == 4 and .resource_budget.max_elapsed_hours == 2)
          ' space-economy-robust-model-uncertainty-receipt.json

      - name: Execute decision-value calibration experiment reference and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml --example decision_value_calibration_experiments_reference -- \
            --source-commit "$source_commit" > space-economy-decision-value-calibration-experiments-receipt.json
          jq -e --arg source_commit "$source_commit" '
            .result == "pass"
            and .source_commit == $source_commit
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.reference_source_sha256 | test("^[0-9a-f]{64}$"))
            and (.model_set_sha256 | test("^[0-9a-f]{64}$"))
            and (.calibration_test_set_sha256 | test("^[0-9a-f]{64}$"))
            and .probability_basis_points == 10000
            and .global_probability_mass == 300000000
            and .expected_value_denominator == 30000000000
            and .model_uncertainty_set.model_prior_weights[0].prior_weight == 1
            and .model_uncertainty_set.model_prior_weights[1].prior_weight == 1
            and .model_uncertainty_set.model_prior_weights[2].prior_weight == 1
            and .value_of_information.model_uncertainty_evpi.numerator == 150000000000
            and .value_of_information.calibration_a_evsi_before_cost.numerator == 55000000000
