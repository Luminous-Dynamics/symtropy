name: Space Economy Corpus Validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/tech/space-economy-benchmark-corpus-v0.1.json"
      - "tools/space-economy-bench/**"
      - ".github/workflows/space-economy-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-economy-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/space-economy-bench/Cargo.toml -- --check

      - name: Run unit and negative-control tests
        run: cargo test --locked --manifest-path tools/space-economy-bench/Cargo.toml

      - name: Execute corpus validator and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/space-economy-bench/Cargo.toml -- \
            docs/tech/space-economy-benchmark-corpus-v0.1.json \
            --source-commit "$source_commit" > space-economy-reference-receipt.json
          jq -e '
            .result == "pass"
            and .scenario_count == 6
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | all(.status == "pass"))
          ' space-economy-reference-receipt.json

      - name: Upload deterministic corpus receipt
        uses: actions/upload-artifact@v4
        with:
          name: space-economy-reference-receipt
          path: space-economy-reference-receipt.json
          if-no-files-found: error
          retention-days: 90
