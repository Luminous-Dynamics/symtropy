name: Shipyard Multirate Event-Time Qualification

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-multirate-event-time/**"
      - "benchmarks/shipyard/multirate-event-time/**"
      - "docs/tech/SHIPYARD_MULTIRATE_EVENT_TIME_V0_1*"
      - ".github/workflows/shipyard-multirate-event-time.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-multirate-event-time-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify uncertainty-bounded integer event-time alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Apply pinned Rust formatting for repair capture
        run: cargo fmt --manifest-path crates/tools/shipyard-multirate-event-time/Cargo.toml --all
      - name: Capture canonical rustfmt output
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-multirate-event-time
          path: |
            crates/tools/shipyard-multirate-event-time/src/lib.rs
            crates/tools/shipyard-multirate-event-time/src/main.rs
          if-no-files-found: error
          retention-days: 1
      - name: Emit canonical formatted source for exact-head repair
        run: |
          echo '===BEGIN_LIB_SOURCE==='
          cat crates/tools/shipyard-multirate-event-time/src/lib.rs
          echo '===END_LIB_SOURCE==='
          echo '===BEGIN_MAIN_SOURCE==='
          cat crates/tools/shipyard-multirate-event-time/src/main.rs
          echo '===END_MAIN_SOURCE==='

      - name: Run event-time oracle tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-multirate-event-time/Cargo.toml
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-multirate-event-time/Cargo.toml --all-targets -- -D warnings
      - name: Verify frozen multirate event-time corpus
        run: cargo run --locked --manifest-path crates/tools/shipyard-multirate-event-time/Cargo.toml
      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
