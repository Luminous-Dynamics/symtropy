name: Shipyard Weld Scale Transfer

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-weld-scale-transfer/**"
      - "benchmarks/shipyard/scale-transfer/**"
      - "docs/tech/SHIPYARD_WELD_SCALE_TRANSFER_V0_1*"
      - ".github/workflows/shipyard-weld-scale-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-weld-scale-transfer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify domain-transfer and bridge-evidence contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-weld-scale-transfer/Cargo.toml --all -- --check

      - name: Run scale-transfer tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-weld-scale-transfer/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-weld-scale-transfer/Cargo.toml --all-targets -- -D warnings

      - name: Verify frozen scale-transfer corpus
        run: cargo run --locked --manifest-path crates/tools/shipyard-weld-scale-transfer/Cargo.toml -- benchmarks/shipyard/scale-transfer/corpus-v0.1.json benchmarks/shipyard/scale-transfer/reference-chain-v0.1.json

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
