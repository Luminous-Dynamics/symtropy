name: CivDyn robust policy analysis reference

on:
  pull_request:
    paths:
      - "research/civdyn-robust-policy/**"
      - "research/civdyn-resilience-uq/**"
      - "research/civdyn-cross-scale-resilience/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-robust-policy.yml"
  push:
    paths:
      - "research/civdyn-robust-policy/**"
      - "research/civdyn-resilience-uq/**"
      - "research/civdyn-cross-scale-resilience/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-robust-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute robust policy analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-robust-policy/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-robust-policy/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-robust-policy/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-robust-policy/Cargo.toml --all-targets

      - name: Execute finite-design policy feasibility and regret sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-robust-policy-evidence
          cargo run --locked --manifest-path research/civdyn-robust-policy/Cargo.toml --bin robust-policy-sweep \
            | tee target/civdyn-robust-policy-evidence/robust-policy-sweep.csv

      - name: Verify matched policies, native-unit regrets and finite-design constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path
          from math import isfinite

          path = Path("target/civdyn-robust-policy-evidence/robust-policy-sweep.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 507, f"expected 507 rows, got {len(rows)}"
          assert all(len(row) == 40 for row in rows)
          by_type = {}
          for row in rows:
              by_type.setdefault(row["record_type"], []).append(row)
          assert {key: len(value) for key, value in by_type.items()} == {
              "design_run": 360,
              "constraint_summary": 12,
              "metric_regret": 108,
              "winner_instability": 27,
          }

          policies = {"no_transfer", "proportional_solidarity", "deficit_first", "reserve_protected"}
          shocks = {"water_supply", "energy_supply", "compound_water_energy"}
          metrics = {
              "total_unmet_water_m3", "total_unmet_energy_kwh",
              "water_deficit_area_household_steps", "energy_deficit_area_household_steps",
              "minimum_water_coverage", "minimum_energy_coverage",
              "water_floor_breach_fraction", "energy_floor_breach_fraction",
              "recovery_success",
          }

          design_runs = by_type["design_run"]
          assert len({row["design_id"] for row in design_runs}) == 30
          assert {row["policy"] for row in design_runs} == policies
          assert {row["shock_kind"] for row in design_runs} == shocks
          assert all(row["total_unmet_water_m3"] and row["total_unmet_energy_kwh"] for row in design_runs)
          assert all(0.0 <= float(row["minimum_water_coverage"]) <= 1.0 for row in design_runs)
          assert all(0.0 <= float(row["minimum_energy_coverage"]) <= 1.0 for row in design_runs)

          constraints = by_type["constraint_summary"]
          assert {(row["shock_kind"], row["policy"]) for row in constraints} == {
              (shock, policy) for shock in shocks for policy in policies
          }
          for row in constraints:
              assert row["lhs_point_count"] == "30"
              assert row["valid_point_count"] == "30"
              assert row["unknown_point_count"] == "0"
              assert int(row["constraint_pass_count"]) + int(row["constraint_fail_count"]) == 30
              assert row["finite_design_robust_feasible"] in {"true", "false"}

          regrets = by_type["metric_regret"]
          assert {(row["shock_kind"], row["policy"], row["metric"]) for row in regrets} == {
              (shock, policy, metric)
              for shock in shocks for policy in policies for metric in metrics
          }
          for row in regrets:
              assert row["lhs_point_count"] == "30"
              assert row["valid_point_count"] == "30"
              assert row["unknown_point_count"] == "0"
              for key in ("mean_regret", "p95_regret", "worst_regret"):
                  assert isfinite(float(row[key])) and float(row[key]) >= 0.0
              assert 0.0 <= float(row["best_fraction"]) <= 1.0

          winners = by_type["winner_instability"]
          assert {(row["shock_kind"], row["metric"]) for row in winners} == {
              (shock, metric) for shock in shocks for metric in metrics
          }
          for row in winners:
              assert row["unknown_comparison_points"] == "0"
              assert int(row["distinct_best_policy_count"]) in range(1, 5)
              assert int(row["unique_winner_points"]) + int(row["tied_winner_points"]) == 30

          # Ensure the output remains a vector: no universal/weighted resilience score.
          assert all(row["metric"] in metrics for row in regrets)
          print("CIVDYN-ROBUST-001 matched policy design, finite-design feasibility, native-unit regret and winner-instability controls verified.")
          PY

          {
            echo "## CIVDYN-ROBUST-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-robust-policy-evidence/robust-policy-sweep.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: deterministic finite LHS design; not calibrated probabilities or continuous robust feasibility"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Execute stakeholder preference-robust sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-robust-policy-evidence
          cargo run --locked --manifest-path research/civdyn-robust-policy/Cargo.toml --bin preference-robust-sweep \
            | tee target/civdyn-robust-policy-evidence/preference-robust-sweep.csv

      - name: Verify preference vertices, hard floors and profile disagreement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path

          path = Path("target/civdyn-robust-policy-evidence/preference-robust-sweep.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 1194, f"expected 1194 records, got {len(rows)}"
          assert all(len(row) == 38 for row in rows)
          by_type = {}
          for row in rows:
              by_type.setdefault(row["record_type"], []).append(row)
          assert {key: len(value) for key, value in by_type.items()} == {
              "scenario_profile_policy": 1080,
              "profile_policy_summary": 12,
              "policy_preference_summary": 4,
              "scenario_preference_consensus": 90,
          }

          scenario_rows = by_type["scenario_profile_policy"]
          profiles = {"water-priority", "energy-priority", "service-reliability-priority"}
          policies = {"no_transfer", "proportional_solidarity", "deficit_first", "reserve_protected"}
          shocks = {"water_supply", "energy_supply", "compound_water_energy"}
          assert {row["profile_id"] for row in scenario_rows} == profiles
          assert {row["policy"] for row in scenario_rows} == policies
          assert {row["shock_kind"] for row in scenario_rows} == shocks
          assert len({row["design_point_id"] for row in scenario_rows}) == 30

          for row in scenario_rows:
              assert row["contract_id"] == "municipal-service-preferences"
              assert row["contract_digest"] == "sha256-municipal-service-preferences-v0.1"
              assert row["profile_vertices_are_probabilities"] == "false"
              criteria = row["criterion_order"].split(";")
              directions = row["criterion_directions"].split(";")
              scales = [float(value) for value in row["reference_scales"].split(";")]
              weights = [float(value) for value in row["preference_weights"].split(";")]
              assert len(criteria) == len(directions) == len(scales) == len(weights) == 5
              assert math.isclose(sum(weights), 1.0, abs_tol=1e-9)
              assert all(weight >= 0.0 for weight in weights)
              assert all(scale > 0.0 and math.isfinite(scale) for scale in scales)
              assert row["eligibility"] in {"feasible", "infeasible", "unknown"}
              assert row["scenario_status"] in {"comparable", "no_feasible_policy", "incomplete_comparison"}
              if row["eligibility"] != "feasible":
                  assert row["regret"] == "" and row["tied_best"] == "false"
              if row["eligibility"] == "feasible" and row["scenario_status"] == "comparable":
                  assert math.isfinite(float(row["normalized_utility"]))
                  assert math.isfinite(float(row["regret"])) and float(row["regret"]) >= 0.0
                  assert row["pareto_nondominated"] in {"true", "false"}
              assert row["total_unmet_water_m3"] and row["total_unmet_energy_kwh"]

          profile_summaries = by_type["profile_policy_summary"]
          assert {(row["profile_id"], row["policy"]) for row in profile_summaries} == {
              (profile, policy) for profile in profiles for policy in policies
          }
          for row in profile_summaries:
              assert row["scenario_count"] == "90"
              assert int(row["feasible_count"]) + int(row["infeasible_count"]) + int(row["unknown_count"]) == 90
              assert int(row["best_scenario_count"]) <= 90
              for field in ("mean_regret", "p95_regret", "worst_regret"):
                  if row[field]:
                      assert math.isfinite(float(row[field])) and float(row[field]) >= 0.0

          policy_summaries = by_type["policy_preference_summary"]
          assert {row["policy"] for row in policy_summaries} == policies
          assert all(row["scenario_count"] == "90" for row in policy_summaries)
          assert all(row["finite_design_robust_feasible"] in {"true", "false", "unknown"} for row in policy_summaries)

          consensus = by_type["scenario_preference_consensus"]
          assert all(row["profile_count"] == "3" for row in consensus)
          assert all(int(row["distinct_winner_policy_count"]) in range(0, 5) for row in consensus)
          assert all(row["unanimous_single_winner"] in policies | {""} for row in consensus)
          print("Preference-robust CSV valid: three declared vertices, five native-unit criteria, hard-feasibility separation, profile-level regret, disagreement and no probability interpretation.")
          PY

          {
            echo "## CIVDYN preference-robust execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-robust-policy-evidence/preference-robust-sweep.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: finite synthetic scenario design and declared preference vertices; no stakeholder probability or ethical legitimacy inference"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preference robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-preference-robust-sweep
          path: target/civdyn-robust-policy-evidence/preference-robust-sweep.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload robust policy evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-robust-policy-sweep
          path: target/civdyn-robust-policy-evidence/robust-policy-sweep.csv
          if-no-files-found: error
          retention-days: 30
