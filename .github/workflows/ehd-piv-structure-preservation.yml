name: EHD-PIV Structure Preservation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/ehd-piv-structure-preservation/**"
      - "docs/research/EHD_PIV_STRUCTURE_PRESERVATION_2026.md"
      - "data/research/ehd_piv_structure_preservation_v0_1.json"
      - ".github/workflows/ehd-piv-structure-preservation.yml"
  push:
    branches: ["main", "research/ehd-piv-structure-preservation-v0-1"]
    paths:
      - "tools/ehd-piv-structure-preservation/**"
      - "docs/research/EHD_PIV_STRUCTURE_PRESERVATION_2026.md"
      - "data/research/ehd_piv_structure_preservation_v0_1.json"
      - ".github/workflows/ehd-piv-structure-preservation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ehd-piv-structure-preservation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust 1.96 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Verify Formatting
        run: cargo fmt --manifest-path tools/ehd-piv-structure-preservation/Cargo.toml -- --check
      - name: Run Tests
        run: cargo test --manifest-path tools/ehd-piv-structure-preservation/Cargo.toml
      - name: Run Strict Clippy
        run: cargo clippy --manifest-path tools/ehd-piv-structure-preservation/Cargo.toml --all-targets -- -D warnings
