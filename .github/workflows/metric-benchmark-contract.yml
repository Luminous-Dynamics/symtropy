name: Metric physics benchmark contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/metric-benchmark-comparison-001/**"
      - ".github/workflows/metric-benchmark-contract.yml"
  push:
    branches: [main]
    paths:
      - "research/metric-benchmark-comparison-001/**"
      - ".github/workflows/metric-benchmark-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metric-benchmark-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind benchmark runner to exact source commit
        run: echo "METRIC_BENCHMARK_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format matched benchmark runner
        run: cargo fmt --manifest-path research/metric-benchmark-comparison-001/Cargo.toml --all -- --check
      - name: Test matched benchmark runner
        run: cargo test --locked --manifest-path research/metric-benchmark-comparison-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/metric-benchmark-comparison-001/Cargo.toml --all-targets -- -D warnings
      - name: Execute matched mass-Riesz kernel benchmark
        run: |
          set -euo pipefail
          cargo run --release --locked --manifest-path research/metric-benchmark-comparison-001/Cargo.toml --bin matched-kernel-runner -- "$RUNNER_TEMP/metric-physics-kernel-results.json"
          test -s "$RUNNER_TEMP/metric-physics-kernel-results.json"
      - name: Download and verify MuJoCo 4.0.1 Linux x86-64 release
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mujoco-4.0.1-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/google-deepmind/mujoco/releases/download/4.0.1/mujoco-4.0.1-linux-x86_64.tar.gz \
            --output "$archive"
          echo "8df1308b2900a4ed6c18717ebbc9d66d53ab3fe7a4da860a7d5b21f94607299d  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/mujoco-extract"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mujoco-extract"
          test -f "$RUNNER_TEMP/mujoco-extract/mujoco-4.0.1/include/mujoco/mujoco.h"
          test -f "$RUNNER_TEMP/mujoco-extract/mujoco-4.0.1/lib/libmujoco.so"
          echo "MUJOCO_DIR=$RUNNER_TEMP/mujoco-extract/mujoco-4.0.1" >> "$GITHUB_ENV"
          echo "MUJOCO_ARCHIVE_SHA256=8df1308b2900a4ed6c18717ebbc9d66d53ab3fe7a4da860a7d5b21f94607299d" >> "$GITHUB_ENV"
      - name: Build and execute MuJoCo 4.0.1 operator capture
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra \
            -I"$MUJOCO_DIR/include" \
            research/metric-benchmark-comparison-001/adapters/mujoco-4.0.1/delassus_capture.c \
            -L"$MUJOCO_DIR/lib" -Wl,-rpath,"$MUJOCO_DIR/lib" \
            -lmujoco -lm -ldl -lpthread \
            -o "$RUNNER_TEMP/mujoco-dumbbell-capture"
          LD_LIBRARY_PATH="$MUJOCO_DIR/lib" \
            "$RUNNER_TEMP/mujoco-dumbbell-capture" \
            research/metric-benchmark-comparison-001/adapters/mujoco-4.0.1/dumbbell.xml \
            "$RUNNER_TEMP/mujoco-4.0.1-operator-capture.json"
          test -s "$RUNNER_TEMP/mujoco-4.0.1-operator-capture.json"
          export MUJOCO_CAPTURE_PATH="$RUNNER_TEMP/mujoco-4.0.1-operator-capture.json"
          export MUJOCO_ARCHIVE_PATH="$RUNNER_TEMP/mujoco-4.0.1-linux-x86_64.tar.gz"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          capture_path = Path(os.environ["MUJOCO_CAPTURE_PATH"])
          model_path = Path("research/metric-benchmark-comparison-001/adapters/mujoco-4.0.1/dumbbell.xml")
          archive_path = Path(os.environ["MUJOCO_ARCHIVE_PATH"])
          with capture_path.open(encoding="utf-8") as stream:
              capture = json.load(stream)
          capture["model_sha256"] = hashlib.sha256(model_path.read_bytes()).hexdigest()
          capture["engine_archive_sha256"] = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          with capture_path.open("w", encoding="utf-8") as stream:
              json.dump(capture, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          echo "MuJoCo 4.0.1 C API operator capture completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Release archive SHA-256: $MUJOCO_ARCHIVE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Model SHA-256: $(sha256sum research/metric-benchmark-comparison-001/adapters/mujoco-4.0.1/dumbbell.xml | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate case, measured results, and fail-closed controls
        run: |
          python3 - "$RUNNER_TEMP/metric-physics-kernel-results.json" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path("research/metric-benchmark-comparison-001")
          case_schema = json.loads((root / "benchmark-case-v0.1.schema.json").read_text())
          result_schema = json.loads((root / "benchmark-result-v0.1.schema.json").read_text())
          case = json.loads((root / "fixtures/dumbbell-dense-rebasis-case-v0.1.json").read_text())
          not_run = json.loads((root / "fixtures/not-run-inconclusive-result-v0.1.json").read_text())
          with open(sys.argv[1], encoding="utf-8") as stream:
              results = json.load(stream)
          Draft202012Validator.check_schema(case_schema)
          Draft202012Validator.check_schema(result_schema)
          case_validator = Draft202012Validator(case_schema)
          result_validator = Draft202012Validator(result_schema)
          assert not list(case_validator.iter_errors(case))
          assert not list(result_validator.iter_errors(not_run))
          assert len(results) == 4, f"expected 4 matched kernel results, got {len(results)}"
          backends = {"symtropy_reference_cholesky", "symtropy_reference_lu"}
          observed = {
              (
                  item["implementation"]["backend_id"],
                  item["case_binding"]["case_id"],
                  item["case_binding"]["coordinate_family"]["family"],
              )
              for item in results
          }
          assert len(observed) == 4
          assert {family for _, _, family in observed} == {0, 2}
          for item in results:
              errors = list(result_validator.iter_errors(item))
              assert not errors, errors
              assert item["record_kind"] == "measured_result"
              assert item["execution"]["status"] == "COMPLETED"
              assert item["decision"]["comparison_status"] == "COMPARABLE"
              assert item["decision"]["acceptance"] == "INCONCLUSIVE"
              assert item["model_mapping"]["comparison_scope"] == "mass_metric_riesz_solve_kernel_only"
              assert item["implementation"]["backend_id"] in backends
              assert item["metrics"]["decision_quality"]["wrong_law_negative_control_relative_error"] > 1e-6
          forged = copy.deepcopy(not_run)
          forged["decision"]["comparison_status"] = "COMPARABLE"
          assert list(result_validator.iter_errors(forged)), "unverified model mapping was ranked"
          forged = copy.deepcopy(not_run)
          forged["decision"]["acceptance"] = "PASS"
          forged["execution"]["status"] = "COMPLETED"
          forged["model_mapping"]["status"] = "MATCHED"
          forged["decision"]["comparison_status"] = "COMPARABLE"
          assert list(result_validator.iter_errors(forged)), "kernel-only result claimed full physical PASS"
          forged = copy.deepcopy(not_run)
          forged["case_binding"]["commit_sha"] = "0" * 40
          assert list(result_validator.iter_errors(forged)), "stale case commit was accepted"
          forged = copy.deepcopy(case)
          forged["coordinate_families"][0]["family"] = 1
          assert list(case_validator.iter_errors(forged)), "unfrozen case coordinate family was accepted"
          forged_result = copy.deepcopy(not_run)
          forged_result["case_binding"]["coordinate_family"]["family"] = 1
          assert list(result_validator.iter_errors(forged_result)), "unfrozen result coordinate family was accepted"
          PY
      - name: Validate MuJoCo 4.0.1 operator capture
        run: |
          python3 - "$RUNNER_TEMP/mujoco-4.0.1-operator-capture.json" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("research/metric-benchmark-comparison-001")
          schema = json.loads((root / "mujoco-operator-capture-v0.1.schema.json").read_text())
          with open(sys.argv[1], encoding="utf-8") as stream:
              capture = json.load(stream)
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          errors = list(validator.iter_errors(capture))
          assert not errors, errors

          # Matched operator checks on this six-DOF, one-row fixed-link fixture.
          expected_mass = [1.3, 1.3, 1.3, 2.1, 2.1, 2.1]
          matrix = capture["mass_matrix"]
          for row in range(6):
              for column in range(6):
                  expected = expected_mass[row] if row == column else 0.0
                  assert abs(matrix[row * 6 + column] - expected) < 1e-10
          close = lambda a, b: abs(a - b) <= 1.0e-10
          assert all(close(a, b) for a, b in zip(capture["mass_1_site_world_position"], [0.0, 0.0, 0.0]))
          assert all(close(a, b) for a, b in zip(capture["mass_2_site_world_position"], [1.2, 0.0, 0.0]))
          assert capture["model_state_qpos"] == [0.0] * 6
          assert capture["model_state_qvel"] == [0.0] * 6
          jacobian = capture["constraint_jacobian"]
          assert abs(abs(jacobian[0]) - 1.0) < 1e-10
          assert abs(jacobian[3] + jacobian[0]) < 1e-10
          assert all(abs(jacobian[i]) < 1e-10 for i in (1, 2, 4, 5))
          expected_delassus = 1.0 / 1.3 + 1.0 / 2.1
          assert abs(capture["direct_delassus"] - expected_delassus) < 1e-10
          assert abs(capture["whitened_delassus"] - expected_delassus) < 1e-10
          assert capture["direct_whitened_relative_defect"] <= 1e-10
          assert abs(capture["native_constraint_force"]) > 1e-8
          assert abs(capture["constraint_position_residual"]) < 1e-10

          # Negative controls: wrong engine version and missing exact diagonal
          # qualification cannot be admitted as the pinned MuJoCo result.
          forged = copy.deepcopy(capture)
          forged["engine_release_tag"] = "4.0.0"
          assert list(validator.iter_errors(forged)), "MuJoCo 4.0.0 was accepted as 4.0.1"
          forged = copy.deepcopy(capture)
          forged["diagexact_enabled"] = False
          assert list(validator.iter_errors(forged)), "approximate diagonal capture was accepted"
          forged = copy.deepcopy(capture)
          forged["nefc"] = 2
          assert list(validator.iter_errors(forged)), "unmatched constraint row count was accepted"
          PY
      - name: Upload exact matched kernel result records
        uses: actions/upload-artifact@v4
        with:
          name: metric-physics-matched-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/metric-physics-kernel-results.json
          if-no-files-found: error
      - name: Upload MuJoCo 4.0.1 operator evidence
        uses: actions/upload-artifact@v4
        with:
          name: metric-physics-mujoco-4.0.1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mujoco-4.0.1-operator-capture.json
            research/metric-benchmark-comparison-001/adapters/mujoco-4.0.1/dumbbell.xml
            research/metric-benchmark-comparison-001/adapters/mujoco-4.0.1/delassus_capture.c
          if-no-files-found: error
