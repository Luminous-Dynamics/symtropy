name: AER-01 damage-preserving virtual sensing

on:
  pull_request:
    paths:
      - ".github/workflows/aero-virtual-sensing-health-state.yml"
      - "tools/civil-aero-benchmark/virtual-sensing-health-state/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-virtual-sensing-health-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact subject revision
        env:
          EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_subject_sha="$(git rev-parse HEAD)"
          test "$actual_subject_sha" = "$EXPECTED_SUBJECT_SHA"
          printf 'subject_commit=%s\n' "$actual_subject_sha"
          printf 'event_commit=%s\n' "$GITHUB_SHA"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record toolchain and runner identity
        run: |
          {
            echo "rust-toolchain.toml:"
            cat rust-toolchain.toml
            echo
            rustc --version --verbose
            cargo --version
            python3 --version
            printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-unknown}"
            printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
            printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
            uname -a
          } | tee virtual-sensing-environment.txt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/civil-aero-benchmark/virtual-sensing-health-state/Cargo.toml -- --check

      - name: Run joint-state, witness and damage-preservation tests
        run: cargo test --locked --manifest-path tools/civil-aero-benchmark/virtual-sensing-health-state/Cargo.toml

      - name: Run Rust joint-state evaluator
        run: cargo run --locked --quiet --manifest-path tools/civil-aero-benchmark/virtual-sensing-health-state/Cargo.toml > virtual-sensing-health-state-result.json

      - name: Independently recompute in Python
        run: python3 tools/civil-aero-benchmark/virtual-sensing-health-state/verify_independent.py --rust-output virtual-sensing-health-state-result.json

      - name: Create exact source and result SHA-256 receipts
        run: |
          set -euo pipefail
          subject_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          workflow_blob=$(git rev-parse "${subject_sha}:.github/workflows/aero-virtual-sensing-health-state.yml")
          printf 'subject_commit=%s\nevent_commit=%s\nworkflow_ref=%s\nworkflow_blob=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$subject_sha" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$workflow_blob" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > virtual-sensing-run-manifest.txt
          sha256sum rust-toolchain.toml > virtual-sensing-toolchain.sha256
          sha256sum tools/civil-aero-benchmark/virtual-sensing-health-state/Cargo.toml > virtual-sensing-cargo-manifest.sha256
          sha256sum tools/civil-aero-benchmark/virtual-sensing-health-state/Cargo.lock > virtual-sensing-cargo-lock.sha256
          sha256sum tools/civil-aero-benchmark/virtual-sensing-health-state/src/main.rs > virtual-sensing-rust-source.sha256
          sha256sum tools/civil-aero-benchmark/virtual-sensing-health-state/verify_independent.py > virtual-sensing-python-source.sha256
          sha256sum tools/civil-aero-benchmark/virtual-sensing-health-state/README.md > virtual-sensing-readme.sha256
          sha256sum .github/workflows/aero-virtual-sensing-health-state.yml > virtual-sensing-workflow.sha256
          sha256sum tools/civil-aero-benchmark/virtual-sensing-health-state/data/hh-hf-dh-df-v0.1.json > virtual-sensing-source.sha256
          sha256sum tools/civil-aero-benchmark/virtual-sensing-health-state/data/external-benchmark-register-v0.1.json > virtual-sensing-external-register.sha256
          sha256sum virtual-sensing-environment.txt > virtual-sensing-environment.sha256
          sha256sum virtual-sensing-health-state-result.json > virtual-sensing-result.sha256
          sha256sum virtual-sensing-run-manifest.txt > virtual-sensing-run-manifest.sha256

      - name: Retain complete source, output and digest receipts
        uses: actions/upload-artifact@v4
        with:
          name: aero-virtual-sensing-health-state-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            rust-toolchain.toml
            .github/workflows/aero-virtual-sensing-health-state.yml
            tools/civil-aero-benchmark/virtual-sensing-health-state/Cargo.toml
            tools/civil-aero-benchmark/virtual-sensing-health-state/Cargo.lock
            tools/civil-aero-benchmark/virtual-sensing-health-state/README.md
            tools/civil-aero-benchmark/virtual-sensing-health-state/src/main.rs
            tools/civil-aero-benchmark/virtual-sensing-health-state/verify_independent.py
            tools/civil-aero-benchmark/virtual-sensing-health-state/data/hh-hf-dh-df-v0.1.json
          tools/civil-aero-benchmark/virtual-sensing-health-state/data/external-benchmark-register-v0.1.json
            virtual-sensing-health-state-result.json
            virtual-sensing-environment.txt
            virtual-sensing-run-manifest.txt
            virtual-sensing-toolchain.sha256
            virtual-sensing-cargo-manifest.sha256
            virtual-sensing-cargo-lock.sha256
            virtual-sensing-rust-source.sha256
            virtual-sensing-python-source.sha256
            virtual-sensing-readme.sha256
            virtual-sensing-workflow.sha256
            virtual-sensing-source.sha256
            virtual-sensing-external-register.sha256
            virtual-sensing-environment.sha256
            virtual-sensing-result.sha256
            virtual-sensing-run-manifest.sha256
          if-no-files-found: error
          retention-days: 90
