name: Metric-induced error reference

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/metric-induced-error-envelope-001/**"
      - ".github/workflows/metric-induced-error-reference.yml"
  push:
    branches: [main]
    paths:
      - "research/metric-induced-error-envelope-001/**"
      - ".github/workflows/metric-induced-error-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metric-induced-error-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path research/metric-induced-error-envelope-001/Cargo.toml --all -- --check
      - name: Test
        run: cargo test --locked --manifest-path research/metric-induced-error-envelope-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/metric-induced-error-envelope-001/Cargo.toml --all-targets -- -D warnings

  microbenchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Run deterministic metric microbenchmark
        run: cargo run --release --locked --manifest-path research/metric-induced-error-envelope-001/Cargo.toml --bin metric-induced-microbenchmark -- "$RUNNER_TEMP/metric-induced-microbenchmark.json"
      - name: Validate benchmark report structure
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/metric-induced-microbenchmark.json"
          jq -e '
            .schema_version == "luminous.metric_induced_microbenchmark.v0.1" and
            .fixture_id == "dense-6d-diagonal-mass-upper-unitriangular-rebasis-v0.1" and
            (.measurements | length) == 11 and
            all(.measurements[];
              (.median_ns_per_op | type) == "number" and
              (.p95_ns_per_op | type) == "number" and
              (.p99_ns_per_op | type) == "number" and
              (.checksum | type) == "number")
          ' "$report" >/dev/null
          sha256sum "$report"
      - name: Retain benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: metric-induced-microbenchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/metric-induced-microbenchmark.json
          if-no-files-found: error
          retention-days: 30
