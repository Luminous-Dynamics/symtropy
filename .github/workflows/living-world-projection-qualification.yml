name: Living World bounded projection qualification

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: living-world-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Temporary one-shot formatter repair. This helper is never merged.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SOURCE_BRANCH: living-world/lw10-bounded-prospective-projection
  EXPECTED_HEAD: 730af2e870ca860e3b1def4697fabacd714bb5d5

jobs:
  repair-projection-formatting:
    name: Guarded rustfmt repair for bounded projection
    if: >-
      github.event.pull_request.head.ref == 'ci/living-world-projection-qualification-079a12' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
    - name: Check out exact product branch
      uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_BRANCH }}
        fetch-depth: 1
        persist-credentials: true

    - name: Assert exact source head and clean checkout
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo "INITIAL_LOCK_BLOB=$(git hash-object Cargo.lock)" >> "$GITHUB_ENV"

    - name: Set up pinned Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: rustfmt

    - name: Apply scoped rustfmt
      shell: bash
      run: cargo fmt --package symtropy-lifesim-core

    - name: Assert formatting-only projection delta
      shell: bash
      run: |
        set -euo pipefail
        test "$(git hash-object Cargo.lock)" = "$INITIAL_LOCK_BLOB"
        git diff --check
        mapfile -t changed < <(git diff --name-only)
        test "${#changed[@]}" -eq 1
        test "${changed[0]}" = "crates/domains/symtropy-lifesim-core/src/projection.rs"
        test -z "$(git ls-files --others --exclude-standard)"
        git diff -- crates/domains/symtropy-lifesim-core/src/projection.rs

    - name: Commit formatting-only repair
      shell: bash
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add crates/domains/symtropy-lifesim-core/src/projection.rs
        git commit -m 'style(lifesim): rustfmt bounded projection'
        git push origin "HEAD:$SOURCE_BRANCH"

    - name: Assert repair commit scope
      shell: bash
      run: |
        set -euo pipefail
        test "$(git hash-object Cargo.lock)" = "$INITIAL_LOCK_BLOB"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "crates/domains/symtropy-lifesim-core/src/projection.rs"
        echo "REPAIRED_HEAD=$(git rev-parse HEAD)"
