name: D1 Canonical Digest Authority (held for format prerequisite)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: d1-canonical-digest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hold:
    name: Refuse semantic promotion until exact D1 format prerequisite is qualified
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'D1 canonical digest promotion is intentionally held.'
          echo 'Exact lock-fixed parent 36797e6a... has Rust 1.96 rustfmt drift in symtropy-design/src/lib.rs.'
          echo 'Formatting must be promoted and qualified independently before semantic identity changes.'
          echo 'This workflow performs no checkout, transform, commit, or push.'
