name: VIS-MEM-018 Provenance Laundering and Taint Containment

on:
  push:
    branches: ["research/vis-mem-provenance-laundering-v0-1"]
    paths:
      - "tools/vision-memory-provenance-laundering.rs"
      - ".github/workflows/vision-memory-provenance-laundering.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
    paths:
      - "tools/vision-memory-provenance-laundering.rs"
      - ".github/workflows/vision-memory-provenance-laundering.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vis-mem-018-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-provenance-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Verify exact head and source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustc --version | grep -F "1.96.0"

      - name: Compile and run security-contract tests
        run: |
          set -euo pipefail
          rustc --edition=2024 --test tools/vision-memory-provenance-laundering.rs -o /tmp/vis-mem-provenance-tests
          /tmp/vis-mem-provenance-tests

      - name: Replay lineage report and validate schemas
        run: |
          set -euo pipefail
          rustc --edition=2024 -O tools/vision-memory-provenance-laundering.rs -o /tmp/vis-mem-provenance
          /tmp/vis-mem-provenance > vis-mem-provenance.tsv
          /tmp/vis-mem-provenance > vis-mem-provenance-repeat.tsv
          cmp vis-mem-provenance.tsv vis-mem-provenance-repeat.tsv
          grep -Fq $'META\tformat\tVIS-MEM-018-v0.1' vis-mem-provenance.tsv
          grep -Fq $'CASE\ttainted_fact_laundered_by_summary\troot_auth_only' vis-mem-provenance.tsv
          grep -Fq $'CASE\trevoked_ancestor_but_clean_child_claim\tlineage_revocation_aware' vis-mem-provenance.tsv
          awk -F '\t' '
            $1 == "CASE_HEADER" { if (NF != 32) bad=1; ch++ }
            $1 == "CASE" { if (NF != 32) bad=1; c++ }
            $1 == "SUMMARY_HEADER" { if (NF != 13) bad=1; sh++ }
            $1 == "SUMMARY" { if (NF != 13) bad=1; s++ }
            END { if (bad || ch != 1 || c != 50 || sh != 1 || s != 5) exit 1 }
          ' vis-mem-provenance.tsv
          sha256sum vis-mem-provenance.tsv > vis-mem-provenance.sha256
          sha256sum -c vis-mem-provenance.sha256

      - name: Upload exact-head provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: vis-mem-018-provenance-containment
          path: |
            vis-mem-provenance.tsv
            vis-mem-provenance.sha256
          if-no-files-found: error
