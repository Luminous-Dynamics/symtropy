name: A2.1 Verification Record Golden Capture

on:
  pull_request:
    branches: [ "analysis/a2-qualification-admission-r2-v0.1" ]

permissions:
  contents: read

concurrency:
  group: a21-record-golden-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: analysis/a2-verification-record-identity-v0.1
  PARENT_HEAD: 8b9cc08fa48bf7ebfc007ed28fd1ab348f28e211
  PARENT_TREE: d165f9a0892cb0eff7d494aa2e6be6606c5aa5dd
  TRANSFORM_BLOB: ecbc297aa6806a6c1898831c389fd33d277707a3
  CARGO_TARGET_DIR: /tmp/symtropy-a21-golden-target

jobs:
  capture:
    name: Execute and preserve record golden
    runs-on: ubuntu-24.04
    steps:
      - name: Check out frozen product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact runner tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact parent and transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PARENT_HEAD"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test "$(git -C runner-tools hash-object .github/repair/a21_verification_record_identity.py)" = "$TRANSFORM_BLOB"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Apply exact transform
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/a21_verification_record_identity.py
          cargo fmt -p symtropy-analysis-admission
          test "$(git status --porcelain=v1 --untracked-files=all)" = " M crates/domains/symtropy-analysis-admission/src/lib.rs"

      - name: Execute named record identity theorem
        id: golden
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd product
          cargo test --locked -p symtropy-analysis-admission tests::standalone_verification_record_digest_is_frozen_and_content_bound -- --exact --nocapture 2>&1 | tee /tmp/a21-record-golden.log

      - name: Preserve exact executed golden output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a21-record-golden-${{ github.run_id }}
          path: /tmp/a21-record-golden.log
          if-no-files-found: error
          retention-days: 7

      - name: Require exactly one executed sentinel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('/tmp/a21-record-golden.log')
          assert path.exists(), 'missing executed golden log'
          text = path.read_text()
          values = re.findall(r'A21_RECORD_GOLDEN=([0-9a-f]{64})', text)
          assert len(values) == 1, values
          print(f'A21_RECORD_GOLDEN={values[0]}')
          PY
