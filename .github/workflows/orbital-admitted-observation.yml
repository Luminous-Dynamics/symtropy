name: Orbital Admitted Observation Handoff Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-admitted-observation-bench/**"
      - "docs/research/orbital-truss/fixtures/admitted-observation-v0_1.json"
      - "docs/research/orbital-truss/orbital_admitted_observation_corpus_v0_1.schema.json"
      - "docs/research/orbital-truss/orbital_admitted_observation_v0_1.md"
      - ".github/workflows/orbital-admitted-observation.yml"
  push:
    branches:
      - "research/orbital-admitted-observation-v0-1"
    paths:
      - "tools/orbital-admitted-observation-bench/**"
      - "docs/research/orbital-truss/fixtures/admitted-observation-v0_1.json"
      - "docs/research/orbital-truss/orbital_admitted_observation_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-admitted-observation.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Complete acquisition attempt and outcome handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and Draft 2020-12 schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/admitted-observation-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_admitted_observation_corpus_v0_1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert len(fixture["cases"]) == 32
          assert len({case["case_id"] for case in fixture["cases"]}) == 32
          print("32 admitted-observation cases and Draft 2020-12 schema validated")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-admitted-observation-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-admitted-observation-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-admitted-observation-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-admitted-observation-bench/Cargo.toml --bin orbital-admitted-observation-bench -- docs/research/orbital-truss/fixtures/admitted-observation-v0_1.json "$GITHUB_SHA" > /tmp/admitted-rust-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-admitted-observation-bench/Cargo.toml --bin orbital-admitted-observation-bench -- docs/research/orbital-truss/fixtures/admitted-observation-v0_1.json "$GITHUB_SHA" > /tmp/admitted-rust-b.json
          cmp /tmp/admitted-rust-a.json /tmp/admitted-rust-b.json
      - name: Independent admitted observation oracle
        run: |
          python3 tools/orbital-admitted-observation-bench/tests/reference_oracle.py docs/research/orbital-truss/fixtures/admitted-observation-v0_1.json "$GITHUB_SHA" > /tmp/admitted-python.json
      - name: Compare complete Rust and Python receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/admitted-rust-a.json").read_text())
          oracle = json.loads(Path("/tmp/admitted-python.json").read_text())
          assert rust == oracle
          assert rust["expected_disposition_matches"] == 32
          assert rust["expected_disposition_mismatches"] == 0
          assert rust["authority_granted"] is False
          assert rust["statistical_update_performed"] is False
          assert rust["likelihood_or_eprocess_generated"] is False
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert cases["AO-001-MEASUREMENT-AVAILABLE"]["disposition"] == "MEASUREMENT_ADMISSIBLE"
          assert cases["AO-007-MOTION-BUDGET-EXCEEDED"]["disposition"] == "MODELLED_OBSERVATION_PROCESS_OUTCOME"
          assert cases["AO-009-OCCLUSION-UNMODELLED"]["disposition"] == "ABSTAIN_UNMODELLED_OUTCOME"
          assert cases["AO-019-SCOPE-MISMATCH"]["disposition"] == "INADMISSIBLE_MEASUREMENT"
          assert cases["AO-026-REQUIRED-OWNER-BYPASS"]["disposition"] == "INVALID_INPUT"
          assert cases["AO-027-STALE-KERNEL-PROFILE"]["disposition"] == "ABSTAIN_UNMODELLED_OUTCOME"
          assert all(not case["sequential_update_permitted"] for case in cases.values() if case["disposition"] in ["ABSTAIN_UNMODELLED_OUTCOME", "INADMISSIBLE_MEASUREMENT", "INVALID_INPUT"])
          print("Rust and independent Python oracle agree on all 32 admitted-observation cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-admitted-observation-evidence
          path: |
            /tmp/admitted-rust-a.json
            /tmp/admitted-python.json
            docs/research/orbital-truss/fixtures/admitted-observation-v0_1.json
            docs/research/orbital-truss/orbital_admitted_observation_corpus_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
