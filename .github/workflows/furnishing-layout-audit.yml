name: Furnishing Layout Audit

on:
  push:
    branches:
      - feat/furnishing-spatial-index-benchmark-v0-3-20261020
      - feat/interior-verified-pareto-frontier-v0-1-20261021-ready
      - feat/interior-resident-preference-probe-v0-1-20261021
  pull_request:
    branches: ["main", "research/furnishing-layout-benchmark-v0-1-20261020", "feat/furnishing-functional-envelope-oracle-v0-2-20261020", "feat/furnishing-spatial-index-benchmark-v0-3-20261020", "feat/interior-verified-pareto-frontier-v0-1-20261021-ready"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'fixtures/interiors/furnishing_layout_scenarios_v0_1.json'
      - 'fixtures/interiors/furnishing_layout_scenarios_v0_1.schema.json'
      - 'fixtures/interiors/furnishing_functional_envelopes_v0_2.json'
      - 'fixtures/interiors/furnishing_functional_envelopes_v0_2.schema.json'
      - 'tools/furnishing-layout-audit/**'
      - '.github/workflows/furnishing-layout-audit.yml'
      - 'docs/research/interiors/**'
permissions:
  contents: read

jobs:
  audit:
    name: Exact-head furnishing layout oracle
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.repository }}" = "Luminous-Dynamics/symtropy"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/furnishing-layout-audit/Cargo.toml -- --check
      - name: Run known-truth and mutation tests
        run: cargo test --locked --manifest-path tools/furnishing-layout-audit/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/furnishing-layout-audit/Cargo.toml --all-targets -- -D warnings
      - name: Record benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Benchmark source SHA: $(git rev-parse HEAD)"
          rustc --version --verbose
          uname -a
          lscpu || true
          free -h || true
      - name: Benchmark functional-envelope oracle at 25/100/1000/10000 tasks
        run: cargo bench --locked --manifest-path tools/furnishing-layout-audit/Cargo.toml --bench functional_envelope_scaling
      - name: Benchmark evidence-qualified frontier at 25/100/1000/10000 alternatives
        run: cargo bench --locked --manifest-path tools/furnishing-layout-audit/Cargo.toml --bench alternative_frontier_scaling
      - name: Benchmark resident preference query selection
        run: cargo bench --locked --manifest-path tools/furnishing-layout-audit/Cargo.toml --bench resident_preference_probe_scaling

