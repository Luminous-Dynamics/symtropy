name: Maritime Capability-to-Service Reference

on:
  pull_request:
    branches: [main, research/mcsc-kite-information-set-replay-v0]
    paths:
      - "research/maritime-capability-to-service/**"
      - "docs/research/maritime-capability-to-service/**"
      - ".github/workflows/maritime-capability-to-service.yml"
  push:
    branches: [main, research/mcsc-kite-information-set-replay-v0, research/mcsc-kite-reusable-replay-v0-3, research/mcsc-r1-finite-oracle-v0-3, research/mcsc-conformal-decision-contract-v0]
    paths:
      - "research/maritime-capability-to-service/**"
      - "docs/research/maritime-capability-to-service/**"
      - ".github/workflows/maritime-capability-to-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-reference:
    name: Exact capability-to-service reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path research/maritime-capability-to-service/Cargo.toml -- --check

      - name: Unit and negative-control tests
        run: cargo test --locked --manifest-path research/maritime-capability-to-service/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/maritime-capability-to-service/Cargo.toml --all-targets -- -D warnings

      - name: Emit deterministic synthetic receipt
        run: cargo run --locked --manifest-path research/maritime-capability-to-service/Cargo.toml
