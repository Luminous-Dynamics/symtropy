name: Motor Step Reference

on:
  pull_request:
    paths:
      - 'benchmarks/motor-step-reference/v0.1/**'
      - '.github/workflows/motor-step-reference.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/motor-step-reference/v0.1/**'
      - '.github/workflows/motor-step-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motor-step-reference-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/motor-step-reference/v0.1/Cargo.toml -- --check
      - name: Run scalar motor reference tests
        run: cargo test --manifest-path benchmarks/motor-step-reference/v0.1/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/motor-step-reference/v0.1/Cargo.toml --all-targets --locked -- -D warnings
