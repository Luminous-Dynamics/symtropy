name: Energy Studio End-to-End Bridge

on:
  pull_request:
    paths:
      - "tools/energy-dispatch-audit/**"
      - ".github/workflows/energy-studio-end-to-end.yml"
  workflow_dispatch:

permissions:
  contents: read

# These source heads are intentionally pinned. If one upstream PR advances,
# this workflow fails the head check until the pin is deliberately reviewed.
env:
  SYMTHAEA_BRANCH: research/energy-system-architect-v0-1
  SYMTHAEA_PIN: 0263ab50cccefdc93504fdcc4c768e308ecce0e1
  SYMTROPY_CONTRACT_BRANCH: research/energy-system-studio-v0-1
  SYMTROPY_CONTRACT_PIN: dccef7d158fa8b5e29c2db50196aa9e86c506e0a
  SOL_ATLAS_BRANCH: research/energy-design-adapter-v0-1
  SOL_ATLAS_PIN: 1f192bb549612990c71286578f1348e3bcccd05e

jobs:
  bridge:
    name: Generated candidate to independent dispatch audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out Symtropy auditor revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Fetch exact upstream PR heads
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          mkdir -p "$work"

          git clone --filter=blob:none --depth 1 --branch "$SYMTHAEA_BRANCH" \
            https://github.com/Luminous-Dynamics/symthaea.git "$work/symthaea"
          actual="$(git -C "$work/symthaea" rev-parse HEAD)"
          test "$actual" = "$SYMTHAEA_PIN" || {
            echo "Symthaea pin mismatch: expected $SYMTHAEA_PIN, got $actual" >&2
            exit 2
          }

          git clone --filter=blob:none --depth 1 --branch "$SOL_ATLAS_BRANCH" \
            https://github.com/Luminous-Dynamics/sol-atlas-leptos.git "$work/sol-atlas"
          actual="$(git -C "$work/sol-atlas" rev-parse HEAD)"
          test "$actual" = "$SOL_ATLAS_PIN" || {
            echo "Sol-Atlas pin mismatch: expected $SOL_ATLAS_PIN, got $actual" >&2
            exit 2
          }

          git fetch --no-tags --depth=1 origin "refs/heads/$SYMTROPY_CONTRACT_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$SYMTROPY_CONTRACT_PIN" || {
            echo "Symtropy schema pin mismatch: expected $SYMTROPY_CONTRACT_PIN, got $actual" >&2
            exit 2
          }
          git show "$SYMTROPY_CONTRACT_PIN:schemas/energy-system-candidate-v0.1.schema.json" \
            > "$work/energy-system-candidate-v0.1.schema.json"

      - name: Export one real Symthaea generator candidate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          cargo run --manifest-path "$work/symthaea/crates/domains/symthaea-engineering/Cargo.toml" \
            --bin energy_architecture_candidates -- \
            --candidate-id synthetic-pv-battery-grid \
            --output "$work/candidate.json"
          sha256sum "$work/candidate.json"

      - name: Validate generated bytes against pinned shared JSON Schema
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
          python3 - "$RUNNER_TEMP/energy-studio/energy-system-candidate-v0.1.schema.json" \
            "$RUNNER_TEMP/energy-studio/candidate.json" <<'PY'
          import json
          import sys
          from jsonschema import Draft202012Validator

          with open(sys.argv[1], encoding="utf-8") as f:
              schema = json.load(f)
          with open(sys.argv[2], encoding="utf-8") as f:
              candidate = json.load(f)
          errors = sorted(Draft202012Validator(schema).iter_errors(candidate),
                          key=lambda error: list(map(str, error.absolute_path)))
          if errors:
              for error in errors:
                  print(f"schema violation at {list(error.absolute_path)}: {error.message}", file=sys.stderr)
              raise SystemExit(2)
          print("Generated candidate validates against the pinned Symtropy schema.")
          PY

      - name: Compile generated candidate with Sol-Atlas adapter
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          config="$work/sol-atlas/sol-atlas-core/schemas/examples/energy-dispatch-mapping-config.synthetic.json"
          cd "$work/sol-atlas"
          cargo run --manifest-path sol-atlas-core/Cargo.toml \
            --bin energy_design_dispatch_compile -- \
            "$work/candidate.json" "$config" > "$work/compilation.json"

      - name: Verify compilation receipt and preserve exact compiled-request bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/energy-studio" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          work = pathlib.Path(sys.argv[1])
          def sha256(raw: bytes) -> str:
              return hashlib.sha256(raw).hexdigest()
          def compact(value) -> bytes:
              return json.dumps(value, separators=(",", ":"), ensure_ascii=False,
                                allow_nan=False).encode("utf-8")

          candidate_bytes = (work / "candidate.json").read_bytes()
          config_path = work / "sol-atlas/sol-atlas-core/schemas/examples/energy-dispatch-mapping-config.synthetic.json"
          with config_path.open(encoding="utf-8") as f:
              supplied_config = json.load(f)
          with (work / "compilation.json").open(encoding="utf-8") as f:
              compilation = json.load(f)

          if compilation.get("candidate_sha256") != sha256(candidate_bytes):
              raise SystemExit("compile receipt does not bind exact generated candidate bytes")
          expected_config_digest = sha256(compact(compilation["mapping_config"]))
          if compilation.get("mapping_config_sha256") != expected_config_digest:
              raise SystemExit("compile receipt mapping-config digest mismatch")
          if compact(supplied_config) != compact(compilation["mapping_config"]):
              raise SystemExit("compiled mapping config differs from pinned fixture")
          # Serialize in the same field order exposed by the typed Rust request and
          # compare to the adapter's own compact request digest before writing bytes.
          request_bytes = compact(compilation["dispatch_request"])
          if compilation.get("dispatch_request_sha256") != sha256(request_bytes):
              raise SystemExit("compile receipt does not bind the exact compiled dispatch request")
          (work / "dispatch-request.json").write_bytes(request_bytes)
          print("Candidate, mapping config, and compiled request digests agree.")
          PY

      - name: Execute Sol-Atlas exact finite dispatch
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          cd "$work/sol-atlas"
          cargo run --manifest-path sol-atlas-core/Cargo.toml \
            --bin energy_dispatch_assess -- "$work/dispatch-request.json" \
            > "$work/dispatch-report.json"

      - name: Independently audit actual Sol-Atlas report
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          cargo run --manifest-path "$GITHUB_WORKSPACE/tools/energy-dispatch-audit/Cargo.toml" -- \
            "$work/dispatch-request.json" "$work/dispatch-report.json" \
            > "$work/independent-audit.json"
          python3 - "$work/independent-audit.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              result = json.load(f)
          print(json.dumps({
              "status": result.get("status"),
              "case_id": result.get("case_id"),
              "reference_frontier_status": result.get("reference_frontier_status"),
              "reference_feasible_complete_schedules": result.get("reference_feasible_complete_schedules"),
              "objective_claim_status": result.get("objective_claim_status"),
          }, indent=2))
          if result.get("status") != "pass":
              raise SystemExit("independent schedule/receipt audit did not PASS")
          if result.get("reference_frontier_status") != "pass":
              raise SystemExit("bounded independent reference did not verify the objective frontier")
          if result.get("reference_feasible_complete_schedules") != 14:
              raise SystemExit("known-answer fixture no longer reports 14 feasible complete schedules")
          if result.get("objective_claim_status") != "verified_for_bounded_model_case":
              raise SystemExit("bounded objective result was not independently verified")
          PY

      - name: Preserve exact artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-studio-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/energy-studio/candidate.json
            ${{ runner.temp }}/energy-studio/compilation.json
            ${{ runner.temp }}/energy-studio/dispatch-request.json
            ${{ runner.temp }}/energy-studio/dispatch-report.json
            ${{ runner.temp }}/energy-studio/independent-audit.json
          if-no-files-found: ignore
          retention-days: 14
