name: Energy Studio End-to-End Bridge

on:
  pull_request:
    paths:
      - "tools/energy-dispatch-audit/**"
      - ".github/workflows/energy-studio-end-to-end.yml"
  workflow_dispatch:

permissions:
  contents: read

# Exact source heads are intentional. Any upstream movement requires a reviewed pin update.
env:
  SYMTHAEA_BRANCH: research/energy-system-architect-v0-1
  SYMTHAEA_PIN: 07327008e16a7753b58c4d6bdd3ad37cc515701d
  SYMTROPY_CONTRACT_BRANCH: research/energy-system-studio-v0-1
  SYMTROPY_CONTRACT_PIN: dccef7d158fa8b5e29c2db50196aa9e86c506e0a
  SOL_ATLAS_BRANCH: research/energy-design-adapter-v0-1
  SOL_ATLAS_PIN: 1f192bb549612990c71286578f1348e3bcccd05e

jobs:
  bridge:
    name: Generated candidates to independent dispatch audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out Symtropy auditor revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Fetch exact upstream PR heads
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          mkdir -p "$work"

          git clone --filter=blob:none --depth 1 --branch "$SYMTHAEA_BRANCH" \
            https://github.com/Luminous-Dynamics/symthaea.git "$work/symthaea"
          actual="$(git -C "$work/symthaea" rev-parse HEAD)"
          test "$actual" = "$SYMTHAEA_PIN" || {
            echo "Symthaea pin mismatch: expected $SYMTHAEA_PIN, got $actual" >&2
            exit 2
          }

          git clone --filter=blob:none --depth 1 --branch "$SOL_ATLAS_BRANCH" \
            https://github.com/Luminous-Dynamics/sol-atlas-leptos.git "$work/sol-atlas"
          actual="$(git -C "$work/sol-atlas" rev-parse HEAD)"
          test "$actual" = "$SOL_ATLAS_PIN" || {
            echo "Sol-Atlas pin mismatch: expected $SOL_ATLAS_PIN, got $actual" >&2
            exit 2
          }

          git fetch --no-tags --depth=1 origin "refs/heads/$SYMTROPY_CONTRACT_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$SYMTROPY_CONTRACT_PIN" || {
            echo "Symtropy schema pin mismatch: expected $SYMTROPY_CONTRACT_PIN, got $actual" >&2
            exit 2
          }
          git show "$SYMTROPY_CONTRACT_PIN:schemas/energy-system-candidate-v0.1.schema.json" \
            > "$work/energy-system-candidate-v0.1.schema.json"

      - name: Export all reference architectures from Symthaea
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid synthetic-parametric-pv-1kw-battery-1kwh-battery-power-1kw-grid-1kw; do
            mkdir -p "$work/$candidate"
            cargo run --manifest-path "$work/symthaea/crates/domains/symthaea-engineering/Cargo.toml" \
              --bin energy_architecture_candidates -- \
              --candidate-id "$candidate" --output "$work/$candidate/candidate.json"
            sha256sum "$work/$candidate/candidate.json"
          done

      - name: Validate all generated bytes against the pinned shared schema
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid synthetic-parametric-pv-1kw-battery-1kwh-battery-power-1kw-grid-1kw; do
            cargo run --manifest-path "$GITHUB_WORKSPACE/tools/energy-dispatch-audit/Cargo.toml" \
              --bin energy_candidate_schema_validate -- \
              "$work/energy-system-candidate-v0.1.schema.json" "$work/$candidate/candidate.json"
          done

      - name: Compile every candidate through Sol-Atlas
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          config="$work/sol-atlas/schemas/examples/energy-dispatch-mapping-config.synthetic.json"
          cd "$work/sol-atlas"
          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid synthetic-parametric-pv-1kw-battery-1kwh-battery-power-1kw-grid-1kw; do
            cargo run --manifest-path sol-atlas-core/Cargo.toml \
              --bin energy_design_dispatch_compile -- \
              "$work/$candidate/candidate.json" "$config" > "$work/$candidate/compilation.json"
          done

      - name: Verify compile receipts and preserve exact request bytes
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          config="$work/sol-atlas/schemas/examples/energy-dispatch-mapping-config.synthetic.json"
          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid synthetic-parametric-pv-1kw-battery-1kwh-battery-power-1kw-grid-1kw; do
            cargo run --manifest-path "$GITHUB_WORKSPACE/tools/energy-dispatch-audit/Cargo.toml" \
              --bin energy_compilation_receipt_verify -- \
              "$work/$candidate/candidate.json" "$config" \
              "$work/$candidate/compilation.json" "$work/$candidate/dispatch-request.json"
          done

      - name: Execute Sol-Atlas exact finite dispatch for every candidate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          cd "$work/sol-atlas"
          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid synthetic-parametric-pv-1kw-battery-1kwh-battery-power-1kw-grid-1kw; do
            cargo run --manifest-path sol-atlas-core/Cargo.toml \
              --bin energy_dispatch_assess -- "$work/$candidate/dispatch-request.json" \
              > "$work/$candidate/dispatch-report.json"
          done

      - name: Independently audit and gate all three designs
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid synthetic-parametric-pv-1kw-battery-1kwh-battery-power-1kw-grid-1kw; do
            echo "Auditing $candidate against its frozen objective-frontier known answer"
            cargo run --manifest-path "$GITHUB_WORKSPACE/tools/energy-dispatch-audit/Cargo.toml" \
              --bin symtropy-energy-dispatch-audit -- \
              "$work/$candidate/dispatch-request.json" "$work/$candidate/dispatch-report.json" \
              > "$work/$candidate/independent-audit.json"
            cargo run --manifest-path "$GITHUB_WORKSPACE/tools/energy-dispatch-audit/Cargo.toml" \
              --bin energy_audit_report_gate -- "$work/$candidate/independent-audit.json" "$candidate"
          done

      - name: Preserve candidate, compilation, dispatch and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-studio-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/energy-studio/synthetic-grid-only/*.json
            ${{ runner.temp }}/energy-studio/synthetic-pv-grid/*.json
            ${{ runner.temp }}/energy-studio/synthetic-pv-battery-grid/*.json
            ${{ runner.temp }}/energy-studio/synthetic-parametric-pv-1kw-battery-1kwh-battery-power-1kw-grid-1kw/*.json
          if-no-files-found: ignore
          retention-days: 14
