name: Energy Studio End-to-End Bridge

on:
  pull_request:
    paths:
      - "tools/energy-dispatch-audit/**"
      - ".github/workflows/energy-studio-end-to-end.yml"
  workflow_dispatch:

permissions:
  contents: read

# Exact source heads are intentional. Any upstream movement requires a reviewed pin update.
env:
  SYMTHAEA_BRANCH: research/energy-system-architect-v0-1
  SYMTHAEA_PIN: 7f9b8260d18a727ed4fc358b04b83436b77c1afe
  SYMTROPY_CONTRACT_BRANCH: research/energy-system-studio-v0-1
  SYMTROPY_CONTRACT_PIN: dccef7d158fa8b5e29c2db50196aa9e86c506e0a
  SOL_ATLAS_BRANCH: research/energy-design-adapter-v0-1
  SOL_ATLAS_PIN: 1f192bb549612990c71286578f1348e3bcccd05e

jobs:
  bridge:
    name: Full generated design space to independent dispatch audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out Symtropy auditor revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Fetch exact upstream PR heads
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          mkdir -p "$work"

          git clone --filter=blob:none --depth 1 --branch "$SYMTHAEA_BRANCH" \
            https://github.com/Luminous-Dynamics/symthaea.git "$work/symthaea"
          actual="$(git -C "$work/symthaea" rev-parse HEAD)"
          test "$actual" = "$SYMTHAEA_PIN" || {
            echo "Symthaea pin mismatch: expected $SYMTHAEA_PIN, got $actual" >&2
            exit 2
          }

          git clone --filter=blob:none --depth 1 --branch "$SOL_ATLAS_BRANCH" \
            https://github.com/Luminous-Dynamics/sol-atlas-leptos.git "$work/sol-atlas"
          actual="$(git -C "$work/sol-atlas" rev-parse HEAD)"
          test "$actual" = "$SOL_ATLAS_PIN" || {
            echo "Sol-Atlas pin mismatch: expected $SOL_ATLAS_PIN, got $actual" >&2
            exit 2
          }

          git fetch --no-tags --depth=1 origin "refs/heads/$SYMTROPY_CONTRACT_BRANCH"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$SYMTROPY_CONTRACT_PIN" || {
            echo "Symtropy schema pin mismatch: expected $SYMTROPY_CONTRACT_PIN, got $actual" >&2
            exit 2
          }
          git show "$SYMTROPY_CONTRACT_PIN:schemas/energy-system-candidate-v0.1.schema.json" \
            > "$work/energy-system-candidate-v0.1.schema.json"

      - name: Build pinned Rust CLI binaries once
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          CARGO_TARGET_DIR="$work/targets/symthaea" cargo build \
            --manifest-path "$work/symthaea/crates/domains/symthaea-engineering/Cargo.toml" \
            --bin energy_architecture_candidates
          CARGO_TARGET_DIR="$work/targets/sol-atlas" cargo build \
            --manifest-path "$work/sol-atlas/sol-atlas-core/Cargo.toml" \
            --bin energy_design_dispatch_compile --bin energy_dispatch_assess
          CARGO_TARGET_DIR="$work/targets/symtropy" cargo build \
            --manifest-path "$GITHUB_WORKSPACE/tools/energy-dispatch-audit/Cargo.toml" \
            --bins

      - name: Export three reference architectures and the 36-point sizing manifest
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          exporter="$work/targets/symthaea/debug/energy_architecture_candidates"

          "$exporter" --design-space --output "$work/energy-design-space-manifest.json"
          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid; do
            mkdir -p "$work/$candidate"
            "$exporter" --candidate-id "$candidate" --output "$work/$candidate/candidate.json"
            sha256sum "$work/$candidate/candidate.json"
          done

          for pv in 1 2 3; do
            for capacity in 1 2 3; do
              for battery_power in 1 2; do
                for grid_power in 1 2; do
                  candidate="synthetic-parametric-pv-${pv}kw-battery-${capacity}kwh-battery-power-${battery_power}kw-grid-${grid_power}kw"
                  mkdir -p "$work/$candidate"
                  "$exporter" --candidate-id "$candidate" --output "$work/$candidate/candidate.json"
                  sha256sum "$work/$candidate/candidate.json"
                done
              done
            done
          done

          manifest_gate="$work/targets/symtropy/debug/energy_design_space_manifest_gate"
          "$manifest_gate" "$work/energy-design-space-manifest.json" "$work"

      - name: Validate all 39 candidate documents against the pinned shared schema
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          validator="$work/targets/symtropy/debug/energy_candidate_schema_validate"
          schema="$work/energy-system-candidate-v0.1.schema.json"

          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid; do
            "$validator" "$schema" "$work/$candidate/candidate.json"
          done
          for pv in 1 2 3; do
            for capacity in 1 2 3; do
              for battery_power in 1 2; do
                for grid_power in 1 2; do
                  candidate="synthetic-parametric-pv-${pv}kw-battery-${capacity}kwh-battery-power-${battery_power}kw-grid-${grid_power}kw"
                  "$validator" "$schema" "$work/$candidate/candidate.json"
                done
              done
            done
          done

      - name: Compile every candidate into a bounded Sol-Atlas dispatch request
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          compiler="$work/targets/sol-atlas/debug/energy_design_dispatch_compile"
          config="$work/sol-atlas/schemas/examples/energy-dispatch-mapping-config.synthetic.json"

          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid; do
            "$compiler" "$work/$candidate/candidate.json" "$config" > "$work/$candidate/compilation.json"
          done
          for pv in 1 2 3; do
            for capacity in 1 2 3; do
              for battery_power in 1 2; do
                for grid_power in 1 2; do
                  candidate="synthetic-parametric-pv-${pv}kw-battery-${capacity}kwh-battery-power-${battery_power}kw-grid-${grid_power}kw"
                  "$compiler" "$work/$candidate/candidate.json" "$config" > "$work/$candidate/compilation.json"
                done
              done
            done
          done

      - name: Verify receipts and preserve exact dispatch-request bytes
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          verifier="$work/targets/symtropy/debug/energy_compilation_receipt_verify"
          config="$work/sol-atlas/schemas/examples/energy-dispatch-mapping-config.synthetic.json"

          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid; do
            "$verifier" "$work/$candidate/candidate.json" "$config" \
              "$work/$candidate/compilation.json" "$work/$candidate/dispatch-request.json"
          done
          for pv in 1 2 3; do
            for capacity in 1 2 3; do
              for battery_power in 1 2; do
                for grid_power in 1 2; do
                  candidate="synthetic-parametric-pv-${pv}kw-battery-${capacity}kwh-battery-power-${battery_power}kw-grid-${grid_power}kw"
                  "$verifier" "$work/$candidate/candidate.json" "$config" \
                    "$work/$candidate/compilation.json" "$work/$candidate/dispatch-request.json"
                done
              done
            done
          done

      - name: Execute the exact finite dispatch oracle for all candidates
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          dispatch="$work/targets/sol-atlas/debug/energy_dispatch_assess"

          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid; do
            "$dispatch" "$work/$candidate/dispatch-request.json" > "$work/$candidate/dispatch-report.json"
          done
          for pv in 1 2 3; do
            for capacity in 1 2 3; do
              for battery_power in 1 2; do
                for grid_power in 1 2; do
                  candidate="synthetic-parametric-pv-${pv}kw-battery-${capacity}kwh-battery-power-${battery_power}kw-grid-${grid_power}kw"
                  "$dispatch" "$work/$candidate/dispatch-request.json" > "$work/$candidate/dispatch-report.json"
                done
              done
            done
          done

      - name: Independently audit every solver report and gate the frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/energy-studio"
          auditor="$work/targets/symtropy/debug/symtropy-energy-dispatch-audit"
          gate="$work/targets/symtropy/debug/energy_audit_report_gate"

          for candidate in synthetic-grid-only synthetic-pv-grid synthetic-pv-battery-grid; do
            echo "Auditing frozen reference candidate: $candidate"
            "$auditor" "$work/$candidate/dispatch-request.json" "$work/$candidate/dispatch-report.json" \
              > "$work/$candidate/independent-audit.json"
            "$gate" "$work/$candidate/independent-audit.json" "$candidate"
          done

          for pv in 1 2 3; do
            for capacity in 1 2 3; do
              for battery_power in 1 2; do
                for grid_power in 1 2; do
                  candidate="synthetic-parametric-pv-${pv}kw-battery-${capacity}kwh-battery-power-${battery_power}kw-grid-${grid_power}kw"
                  echo "Auditing generated sizing candidate: $candidate"
                  "$auditor" "$work/$candidate/dispatch-request.json" "$work/$candidate/dispatch-report.json" \
                    > "$work/$candidate/independent-audit.json"
                  "$gate" "$work/$candidate/independent-audit.json" "$candidate"
                done
              done
            done
          done

      - name: Preserve exact generation, compilation, dispatch and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-studio-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/energy-studio/energy-design-space-manifest.json
            ${{ runner.temp }}/energy-studio/synthetic-*/*.json
          if-no-files-found: ignore
          retention-days: 14
