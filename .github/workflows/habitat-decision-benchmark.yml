name: Habitat Decision Impact Benchmark

on:
  push:
    branches: ["main"]
    paths:
      - "tools/habitat-decision-benchmark/**"
      - "docs/research/fixtures/HABITAT_DECISION_IMPACT_V0_1.json"
      - ".github/workflows/habitat-decision-benchmark.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/habitat-decision-benchmark/**"
      - "docs/research/fixtures/HABITAT_DECISION_IMPACT_V0_1.json"
      - ".github/workflows/habitat-decision-benchmark.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deterministic-decision-impact:
    name: Frozen finite-state decision impact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0

      - name: Check formatting
        run: cargo fmt --manifest-path tools/habitat-decision-benchmark/Cargo.toml -- --check

      - name: Run independent-oracle and adversarial tests
        run: cargo test --locked --manifest-path tools/habitat-decision-benchmark/Cargo.toml

      - name: Verify the frozen decision report
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/research/fixtures/HABITAT_DECISION_IMPACT_V0_1.json"
          report="$RUNNER_TEMP/habitat-decision-report.json"
          cargo run --locked --manifest-path tools/habitat-decision-benchmark/Cargo.toml -- \
            "$fixture" > "$report"
          jq -e '
            .schema_version == "luminous.habitat_decision_benchmark.report.v0.1" and
            .fixture_id == "habitat-site-survey-decision-toy-001" and
            .input_sha256 == "4c30be2c0e10c5a292a2dd2016860807a40caee2970253fda498b4022f87b8a9" and
            .verification_status == "SYNTHETIC_REFERENCE_EVALUATION_NOT_PHYSICAL_VALIDATION" and
            .claim_ceiling == "synthetic_decision_impact_only_not_real_site_safety" and
            .state_count == 4 and .candidate_count == 3 and .action_count == 3 and
            .baseline_robust_candidate_id == "inland_fallback" and
            .baseline_worst_case_regret_units == 120 and
            ([.ranked_actions[].action_id] == [
              "A-COMBINED-SURVEY","A-FLOOD-SURVEY","A-GEOTECH-SURVEY"
            ]) and
            ([.ranked_actions[].regret_reduction_per_cost_unit_milli] == [4800,3000,0]) and
            ([.ranked_actions[].worst_case_regret_after_units] == [0,105,120]) and
            ([.ranked_actions[].max_residual_state_count] == [1,2,2]) and
            ([.ranked_actions[].worst_case_total_cost_units] == [245,225,228])
          ' "$report"
