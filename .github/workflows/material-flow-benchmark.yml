name: Material Flow Benchmark contract

on:
  pull_request:
    paths:
      - "tools/material-flow-benchmark/**"
      - "docs/research/home-logistics/MATERIAL_FLOW_BENCHMARK_V0_1.md"
      - ".github/workflows/material-flow-benchmark.yml"
  push:
    branches:
      - "research/material-flow-benchmark-v0-1"
    paths:
      - "tools/material-flow-benchmark/**"
      - ".github/workflows/material-flow-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-flow-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/material-flow-benchmark/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/material-flow-benchmark/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/material-flow-benchmark/Cargo.toml --all-targets
      - name: Validate nominal scenario fixture
        run: cargo run --locked --manifest-path tools/material-flow-benchmark/Cargo.toml --bin mfb-validate -- tools/material-flow-benchmark/fixtures/nominal-stationary-carrier.json
      - name: Validate ten-fault campaign fixture
        run: cargo run --locked --manifest-path tools/material-flow-benchmark/Cargo.toml --bin mfb-validate-campaign -- tools/material-flow-benchmark/fixtures/nominal-stationary-carrier.json tools/material-flow-benchmark/fixtures/ten-fault-campaign.json
      - name: Run analytical four-timestep free-fall convergence
        run: |
          mkdir -p mfb-l1-evidence
          cargo run --locked --manifest-path tools/material-flow-benchmark/Cargo.toml --bin mfb-validate-convergence > mfb-l1-evidence/free-fall-convergence.json
          grep -q '"position_error_monotonic": true' mfb-l1-evidence/free-fall-convergence.json
          grep -q '"all_cases_numerically_healthy": true' mfb-l1-evidence/free-fall-convergence.json
          cat mfb-l1-evidence/free-fall-convergence.json
      - name: Run nominal L1 Symtropy physics episode and replay check
        run: |
          mkdir -p mfb-l1-evidence
          cargo run --locked --manifest-path tools/material-flow-benchmark/Cargo.toml --bin mfb-simulate -- tools/material-flow-benchmark/fixtures/nominal-stationary-carrier.json > mfb-l1-evidence/result.json
          grep -q '"accepted": true' mfb-l1-evidence/result.json
          grep -q '"replay_bitwise_equal": true' mfb-l1-evidence/result.json
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo
            echo "[rustc]"
            rustc -Vv
            echo
            echo "[cargo]"
            cargo -V
            echo
            echo "[host]"
            uname -a
            lscpu
            echo
            echo "[target]"
            rustc -vV | grep '^host:'
            echo
            echo "[features]"
            cargo tree --locked --manifest-path tools/material-flow-benchmark/Cargo.toml -e features
            echo
            echo "[scenario_digest]"
            sha256sum tools/material-flow-benchmark/fixtures/nominal-stationary-carrier.json
            echo
            echo "[simulation_result_digest]"
            sha256sum mfb-l1-evidence/result.json
          } > mfb-l1-evidence/environment.txt
          cat mfb-l1-evidence/environment.txt
          cat mfb-l1-evidence/result.json
      - name: Upload reproducible MFB L1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mfb-l1-evidence-${{ github.sha }}
          path: mfb-l1-evidence/
          if-no-files-found: error
          retention-days: 90
