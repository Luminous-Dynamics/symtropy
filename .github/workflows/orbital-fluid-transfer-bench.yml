name: Orbital Fluid Transfer Reference

on:
  push:
    branches: ["research/orbital-fluid-transfer-bench-v0-1"]
    paths:
      - "tools/orbital-fluid-transfer-bench/**"
      - ".github/workflows/orbital-fluid-transfer-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/orbital-fluid-transfer-bench/**"
      - ".github/workflows/orbital-fluid-transfer-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbital-fluid-transfer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Resolve standalone dependency graph
        run: cargo generate-lockfile --manifest-path tools/orbital-fluid-transfer-bench/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path tools/orbital-fluid-transfer-bench/Cargo.toml -- --check

      - name: Run fluid accounting and evidence-gate tests
        run: cargo test --locked --manifest-path tools/orbital-fluid-transfer-bench/Cargo.toml --all-targets

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/orbital-fluid-transfer-bench/Cargo.toml --all-targets -- -D warnings

      - name: Generate exact-input receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/orbital-fluid-transfer-bench/Cargo.toml -- \
            tools/orbital-fluid-transfer-bench/fixtures/v0.1/reference.json \
            --source-commit "$source_commit" > orbital-fluid-transfer-receipt.json
          jq -e '
            .result == "pass"
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.fixture_sha256 | test("^[0-9a-f]{64}$"))
            and .report.result == "pass"
            and .report.evidence_class == "synthetic"
            and (.report.scenarios | length == 3)
            and .report.scenarios[0].status == "transfer_accepted"
            and .report.scenarios[0].gross_transferred_g == 400000
            and .report.scenarios[0].receiver_accepted_g == 390000
            and .report.scenarios[0].receiver_id == "serviced-client-001"
            and .report.scenarios[0].interface_id == "COOPERATIVE-CAPTURE-PORT-A"
            and .report.scenarios[0].interface_revision == 3
            and .report.scenarios[1].status == "storage_only_not_transfer_evidence"
            and .report.scenarios[1].receiver_id == "serviced-client-001"
            and .report.scenarios[2].status == "transfer_accepted"
            and .report.scenarios[2].gross_transferred_g == 200000
            and (.report.scenarios | all(.mass_balance_residual_g == 0))
          ' orbital-fluid-transfer-receipt.json

      - name: Retain benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: orbital-fluid-transfer-receipt-${{ github.sha }}
          path: orbital-fluid-transfer-receipt.json
          if-no-files-found: error
