name: PB-04b Cut Cell Self Apply

on:
  push:
    branches:
      - "spatial/pb04b-cut-cell-decomposition-v0.1"
    paths:
      - "crates/domains/symtropy-spatial-decomposition/**"
      - "scripts/pb04b-fix-clippy-collapsible-if.py"
      - ".github/workflows/pb04b-cut-cell-self-apply.yml"

permissions:
  contents: write

concurrency:
  group: pb04b-cut-cell-self-apply
  cancel-in-progress: true

jobs:
  qualify-and-freeze:
    name: Qualify and freeze PB-04b cut-cell product
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact PB-04b source lineage and PB-04a dependency
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "${head}" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 1d500c62d93082e49f7a889656a1c92c552977e4 HEAD
          test "$(git rev-parse 1d500c62d93082e49f7a889656a1c92c552977e4^{tree})" = "17cde7c1991c5485ea84b3186eab375c064b61d4"
          test ! -e crates/domains/symtropy-spatial-decomposition/Cargo.lock

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git rev-parse "HEAD:${path}")"
            test "${actual}" = "${expected}" || {
              echo "PB-04b source/dependency capsule drift: ${path}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            }
          }

          check_blob f465ef97074a973eb3bf742a918609f7a06bccc4 crates/domains/symtropy-spatial-topology/Cargo.lock
          check_blob 22e4b9ed397b7fd94d5918d0dc26868710794d17 crates/domains/symtropy-spatial-topology/Cargo.toml
          check_blob d0553da04de45f5df6e372b24a5a2fdc4d894b66 crates/domains/symtropy-spatial-topology/src/lib.rs
          check_blob 79abd90a6aa2c0b6623f75a279a66ff309094926 crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs
          check_blob 614fa7d2e293809faaef10649cf3beb02475c259 crates/domains/symtropy-spatial-decomposition/Cargo.toml
          check_blob 0a81c715c5567f0d529a097da41bfd4c64b97ead crates/domains/symtropy-spatial-decomposition/src/lib.rs
          check_blob f9361c3fad891659228c0d41563afe582000e0cb scripts/pb04b-fix-clippy-collapsible-if.py

          actual_source_paths="$(git diff --name-only 1d500c62d93082e49f7a889656a1c92c552977e4..HEAD | sort -u)"
          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/pb04b-cut-cell-self-apply.yml|\
              crates/domains/symtropy-spatial-decomposition/Cargo.toml|\
              crates/domains/symtropy-spatial-decomposition/src/lib.rs|\
              scripts/pb04b-fix-clippy-collapsible-if.py)
                ;;
              "")
                ;;
              *)
                echo "unexpected PB-04b source-lineage path: ${path}" >&2
                exit 1
                ;;
            esac
          done <<< "${actual_source_paths}"

          echo "PB04B_INPUT_HEAD=${head}"
          echo "PB04B_INPUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "PB04B_QUALIFIED_PB04A_HEAD=1d500c62d93082e49f7a889656a1c92c552977e4"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04b-cut-cell-target" >> "${GITHUB_ENV}"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PB04B_RUNNER_OS=${RUNNER_OS}"
          echo "PB04B_RUNNER_ARCH=${RUNNER_ARCH}"
          echo "PB04B_IMAGE_OS=${ImageOS:-unknown}"
          echo "PB04B_IMAGE_VERSION=${ImageVersion:-unknown}"
          echo "PB04B_CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          uname -a
          git --version

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Freeze dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          manifest="crates/domains/symtropy-spatial-decomposition/Cargo.toml"
          lock="crates/domains/symtropy-spatial-decomposition/Cargo.lock"
          cargo generate-lockfile --manifest-path "${manifest}"
          test -s "${lock}"
          echo "PB04B_LOCK_BLOB=$(git hash-object "${lock}")"
          echo "PB04B_LOCK_SHA256=$(sha256sum "${lock}" | awk '{print $1}')"

      - name: Apply exact Clippy hygiene and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml
          python3 scripts/pb04b-fix-clippy-collapsible-if.py
          cargo fmt --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml
          echo "PB04B_FORMATTED_LIB_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/src/lib.rs)"

      - name: Verify locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          manifest="crates/domains/symtropy-spatial-decomposition/Cargo.toml"
          cargo metadata --manifest-path "${manifest}" --locked --format-version 1 > "${RUNNER_TEMP}/pb04b-metadata.json"
          echo "PB04B_LOCKED_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/pb04b-metadata.json" | awk '{print $1}')"

      - name: Check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked

      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets -- -D warnings

      - name: Require exact generated product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e crates/domains/symtropy-spatial-decomposition/target
          test -s crates/domains/symtropy-spatial-decomposition/Cargo.lock

          expected="$(printf '%s\n' \
            crates/domains/symtropy-spatial-decomposition/Cargo.lock \
            crates/domains/symtropy-spatial-decomposition/src/lib.rs | sort)"
          actual="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "PB-04b qualification produced an unexpected product path set" >&2
            echo "expected:" >&2
            printf '%s\n' "${expected}" >&2
            echo "actual:" >&2
            printf '%s\n' "${actual}" >&2
            exit 1
          fi
          printf '%s\n' "${actual}"

      - name: Publish frozen PB-04b product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PB-04b Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/domains/symtropy-spatial-decomposition/Cargo.lock \
                  crates/domains/symtropy-spatial-decomposition/src/lib.rs
          git diff --cached --check
          git diff --cached --exit-code --quiet && {
            echo "no frozen PB-04b product delta" >&2
            exit 1
          }
          git commit -m "feat(spatial): freeze PB-04b cut-cell decomposition product"

          product_head="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse HEAD^{tree})"
          echo "PB04B_PRODUCT_HEAD=${product_head}"
          echo "PB04B_PRODUCT_TREE=${product_tree}"
          echo "PB04B_PRODUCT_PARENT=$(git rev-parse HEAD^)"
          echo "PB04B_PRODUCT_LOCK_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/Cargo.lock)"
          echo "PB04B_PRODUCT_LIB_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/src/lib.rs)"

          remote_head="$(git ls-remote origin refs/heads/spatial/pb04b-cut-cell-decomposition-v0.1 | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin HEAD:spatial/pb04b-cut-cell-decomposition-v0.1
