name: dredge-solids-conversion

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/dredge-solids-conversion/**"
      - ".github/workflows/dredge-solids-conversion.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/dredge-solids-conversion/**"
      - ".github/workflows/dredge-solids-conversion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dredge-solids-conversion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/dredge-solids-conversion/Cargo.toml -- --check
      - name: Test fixed-point conversion and evidence gates
        run: cargo test --locked --manifest-path benchmarks/dredge-solids-conversion/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path benchmarks/dredge-solids-conversion/Cargo.toml --all-targets -- -D warnings
