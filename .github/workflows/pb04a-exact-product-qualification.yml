name: PB-04a Exact Product Qualification

on:
  push:
    branches:
      - "ci/pb04a-exact-product-1d500c6"
    paths:
      - ".github/workflows/pb04a-exact-product-qualification.yml"

permissions:
  contents: read

jobs:
  qualify-exact-product:
    name: Qualify immutable PB-04a product 1d500c62
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout and bind qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: harness

      - name: Bind harness identity and ephemeral build path
        shell: bash
        run: |
          set -euo pipefail
          harness_head="$(git -C harness rev-parse HEAD)"
          test "${harness_head}" = "${GITHUB_SHA}"
          echo "PB04A_QUALIFICATION_HARNESS_HEAD=${harness_head}"
          echo "PB04A_QUALIFICATION_HARNESS_TREE=$(git -C harness rev-parse HEAD^{tree})"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04a-exact-product-target" >> "${GITHUB_ENV}"

      - name: Checkout immutable product subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1d500c62d93082e49f7a889656a1c92c552977e4
          fetch-depth: 2
          persist-credentials: false
          path: product

      - name: Bind exact product lineage and frozen bytes
        shell: bash
        run: |
          set -euo pipefail
          cd product

          expected_head="1d500c62d93082e49f7a889656a1c92c552977e4"
          expected_tree="17cde7c1991c5485ea84b3186eab375c064b61d4"
          expected_parent="d1c43fe441552932a22b2dccbec4e0b9979f75d4"

          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          actual_parent="$(git rev-parse HEAD^)"
          test "${actual_head}" = "${expected_head}"
          test "${actual_tree}" = "${expected_tree}"
          test "${actual_parent}" = "${expected_parent}"

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git rev-parse "HEAD:${path}")"
            test "${actual}" = "${expected}" || {
              echo "PB-04a exact product blob drift: ${path}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            }
            echo "PB04A_PRODUCT_BLOB ${path} ${actual}"
          }

          check_blob f465ef97074a973eb3bf742a918609f7a06bccc4 crates/domains/symtropy-spatial-topology/Cargo.lock
          check_blob 22e4b9ed397b7fd94d5918d0dc26868710794d17 crates/domains/symtropy-spatial-topology/Cargo.toml
          check_blob d0553da04de45f5df6e372b24a5a2fdc4d894b66 crates/domains/symtropy-spatial-topology/src/lib.rs
          check_blob 79abd90a6aa2c0b6623f75a279a66ff309094926 crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs

          lock_sha="$(sha256sum crates/domains/symtropy-spatial-topology/Cargo.lock | awk '{print $1}')"
          test "${lock_sha}" = "0bf42b85a41a04bed6cb8038cb8863872ecf8b319a1e9d3dd7a9fa7b4981cf30"

          echo "PB04A_PRODUCT_HEAD=${actual_head}"
          echo "PB04A_PRODUCT_TREE=${actual_tree}"
          echo "PB04A_PRODUCT_PARENT=${actual_parent}"
          echo "PB04A_PRODUCT_LOCK_SHA256=${lock_sha}"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PB04A_RUNNER_OS=${RUNNER_OS}"
          echo "PB04A_RUNNER_ARCH=${RUNNER_ARCH}"
          echo "PB04A_IMAGE_OS=${ImageOS:-unknown}"
          echo "PB04A_IMAGE_VERSION=${ImageVersion:-unknown}"
          echo "PB04A_CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          uname -a
          git --version

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Verify frozen dependency graph
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          manifest="crates/domains/symtropy-spatial-topology/Cargo.toml"
          cargo metadata --manifest-path "${manifest}" --locked --format-version 1 > "${RUNNER_TEMP}/pb04a-exact-product-metadata.json"
          echo "PB04A_LOCKED_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/pb04a-exact-product-metadata.json" | awk '{print $1}')"

      - name: Require canonical formatting
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml -- --check

      - name: Check exact product
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --all-targets

      - name: Test exact product
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked

      - name: Strict Clippy exact product
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          cargo clippy --manifest-path crates/domains/symtropy-spatial-topology/Cargo.toml --locked --all-targets -- -D warnings

      - name: Prove immutable product checkout unchanged
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          test ! -e crates/domains/symtropy-spatial-topology/target
          git diff --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "${status}" ]]; then
            echo "PB-04a exact-product qualification mutated the checkout:" >&2
            printf '%s\n' "${status}" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "1d500c62d93082e49f7a889656a1c92c552977e4"
          test "$(git rev-parse HEAD^{tree})" = "17cde7c1991c5485ea84b3186eab375c064b61d4"
          echo "PB04A_EXACT_PRODUCT_QUALIFICATION=PASS"
