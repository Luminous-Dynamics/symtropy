name: RRVR AERB Evaluator v0.1

on:
  push:
    branches:
      - research/mobility-rrvr-aerb-v0-1
      - research/aerb-blind-corpus-assignments-v0-1
    paths:
      - "research/mobility-rrvr-aerb-v0.1/evaluator/**"
      - "research/mobility-rrvr-aerb-v0.1/schemas/**"
      - "research/mobility-rrvr-aerb-v0.1/fixtures/**"
      - "research/mobility-rrvr-aerb-probe-value-v0.1/**"
      - ".github/workflows/mobility-rrvr-aerb-evaluator.yml"
  pull_request:
    paths:
      - "research/mobility-rrvr-aerb-v0.1/evaluator/**"
      - "research/mobility-rrvr-aerb-v0.1/schemas/**"
      - "research/mobility-rrvr-aerb-v0.1/fixtures/**"
      - "research/mobility-rrvr-aerb-probe-value-v0.1/**"
      - ".github/workflows/mobility-rrvr-aerb-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aerb-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Validate evaluator schemas and public fixtures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/mobility-rrvr-aerb-v0.1"
          jq empty "$ROOT/schemas/aerb_candidate_episode_v0_1.schema.json"
          jq empty "$ROOT/schemas/aerb_candidate_submission_v0_1.schema.json"
          jq empty "$ROOT/schemas/aerb_evaluator_world_pack_v0_1.schema.json"
          jq empty "$ROOT/schemas/aerb_evaluator_report_v0_1.schema.json"
          jq empty "$ROOT/schemas/aerb_candidate_blind_manifest_v0_1.schema.json"
          jq empty "$ROOT/schemas/aerb_evaluator_blind_manifest_v0_1.schema.json"
          jq empty "$ROOT/fixtures/candidate_episode_synthetic_v0_1.json"
          jq empty "$ROOT/fixtures/candidate_submission_synthetic_v0_1.json"
          jq empty "$ROOT/fixtures/evaluator_only/world_pack_synthetic_v0_1.json"
          V02="research/mobility-rrvr-aerb-probe-value-v0.1"
          jq empty "$V02/schemas/aerb_candidate_submission_v0_2.schema.json"
          jq empty "$V02/fixtures/candidate_submission_adaptive_synthetic_v0_2.json"
          jq empty "$ROOT/schemas/aerb_probe_checkpoint_v0_1.schema.json"

          jq -e '
            . as $candidate
            | ($candidate.counterfactual_policy.nodes | map(.node_id)) as $node_ids
            | ($candidate.candidate_predicted_probe_models) as $probe_models
            | $candidate.schema_version == "0.2"
            and $candidate.benchmark == "AERB"
            and $candidate.actuation_guard == "block_new_effect"
            and ($candidate.initial_possible_world_support_ids | index("open_world_residual") != null)
            and ($node_ids | length == (unique | length))
            and ($node_ids | index($candidate.counterfactual_policy.root_node_id) != null)
            and all($candidate.counterfactual_policy.nodes[];
              . as $node
              | $node.counterfactual_only == true
                and (if $node.node_type == "probe" then
                  any($probe_models[]; .probe_id == $node.probe_id)
                  and all($node.outcome_branches[];
                    . as $branch
                    | ($node_ids | index($branch.next_node_id) != null)
                      and any($probe_models[] | select(.probe_id == $node.probe_id) | .outcomes[]; .outcome_id == $branch.outcome_id)
                  )
                elif $node.node_type == "terminal" then
                  ($node.terminal_disposition == "hold_reconcile" or $node.terminal_disposition == "abstain" or $node.terminal_disposition == "recommend_fresh_attempt")
                else false end)
            )
            and (has("hidden_truth_world_id") | not)
            and (has("decision_losses") | not)
            and (has("probe_outcome_supports") | not)
            and (has("evaluator_profile_sha256") | not)
            and (has("seed") | not)
          ' "$V02/fixtures/candidate_submission_adaptive_synthetic_v0_2.json"

      - name: Check formatting
        run: cargo fmt --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml -- --check

      - name: Run evaluator known answers and mutation tests
        run: cargo test --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked

      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run synthetic candidate/evaluator fixture
        run: cargo run --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --bin aerb_evaluate -- research/mobility-rrvr-aerb-v0.1/fixtures/candidate_episode_synthetic_v0_1.json research/mobility-rrvr-aerb-v0.1/fixtures/candidate_submission_synthetic_v0_1.json research/mobility-rrvr-aerb-v0.1/fixtures/evaluator_only/world_pack_synthetic_v0_1.json

      - name: Generate a balanced challenge corpus and evaluate one case
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$(mktemp -d)"
          EVALUATOR_DIR="$(mktemp -d)"
          cargo run --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --bin aerb_generate -- 42 16 "$CANDIDATE_DIR" "$EVALUATOR_DIR"
          test -f "$CANDIDATE_DIR/candidate_manifest.json"
          test -f "$EVALUATOR_DIR/evaluator_manifest.json"
          jq -e 'has("hidden_truth_by_episode") | not' "$CANDIDATE_DIR/candidate_manifest.json"
          jq -e 'has("seed") | not' "$CANDIDATE_DIR/candidate_manifest.json"
          jq -e '.episode_id == "aerb-case-000000" and (.episode_id | contains("seed") | not)' "$CANDIDATE_DIR/episode-000000.json"
          jq -e 'has("hidden_truth_world_id") | not' "$CANDIDATE_DIR/episode-000000.json"
          jq -e 'has("hidden_truth_world_id") | not' "$CANDIDATE_DIR/submission-000000.json"
          jq -e '(.hidden_truth_by_episode | length == 16) and ([.hidden_truth_by_episode[]] | sort | group_by(.) | all(.[]; length == 2))' "$EVALUATOR_DIR/evaluator_manifest.json"
          ! test -e "$CANDIDATE_DIR/world-pack-000000.json"
          test -f "$EVALUATOR_DIR/world-pack-000000.json"
          cargo run --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --bin aerb_evaluate -- "$CANDIDATE_DIR/episode-000000.json" "$CANDIDATE_DIR/submission-000000.json" "$EVALUATOR_DIR/world-pack-000000.json"

          cargo run --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --locked --bin aerb_campaign_evaluate -- "$CANDIDATE_DIR" "$EVALUATOR_DIR" "$EVALUATOR_DIR/campaign-report.json"

          jq -e '
            .scenario_count == 16
            and .evaluated_n == 16
            and .structural_invalid_n == 0
            and .candidate_contract_valid_n == 16
            and .hidden_truth_covered_n == 16
            and .open_world_residual_retained_n == 16
            and .disposition_admissible_n == 16
            and .unsafe_fresh_attempt_n == 0
            and (.world_strata | length == 8)
            and (.cluster_strata | length == 4)
          ' "$EVALUATOR_DIR/campaign-report.json"
