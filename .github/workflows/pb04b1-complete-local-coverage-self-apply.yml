name: PB-04b1 Complete Local Coverage Self Apply

on:
  push:
    branches:
      - "spatial/pb04b1-complete-local-coverage-v0.1"
    paths:
      - ".github/workflows/pb04b1-complete-local-coverage-self-apply.yml"
      - "scripts/pb04b1-complete-local-coverage.py"
      - "scripts/pb04b1-repair-schema3-transform.py"
      - "crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs"

permissions:
  contents: write

concurrency:
  group: pb04b1-complete-local-coverage-self-apply
  cancel-in-progress: true

jobs:
  qualify-and-freeze:
    name: Qualify and freeze PB-04b1 complete-coverage product
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact repaired theorem lineage to qualified schema2 base
        shell: bash
        run: |
          set -euo pipefail
          base=7c5b0d7edc22b01980c5d3324325612566348313
          theorem=d6efe6bf6b11b501ba64563f12bd7a0e764a2cda
          repair1=c492982285bd8f8b69e4447c5474369a7e2c79ee
          workflow1=b16a6eeb62660e1da786a437ec580ac02ec1b7c8
          repair2=303d067c2a2b0037fcd2ac571bb08c92e2c06b21
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${repair2}"
          test "$(git rev-parse HEAD^^)" = "${workflow1}"
          test "$(git rev-parse HEAD^^^)" = "${repair1}"
          test "$(git rev-parse HEAD^^^^)" = "${theorem}"
          test "$(git rev-parse HEAD^^^^^)" = "${base}"
          test "$(git rev-parse ${base}^{tree})" = "c80f3bd871a8cc3f16af7c52f990922e5f9c4a9b"

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git rev-parse "HEAD:${path}")"
            test "${actual}" = "${expected}" || {
              echo "PB-04b1 theorem source drift: ${path}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            }
          }

          check_blob 676fd6a7eb31a2ec00b09c9496b42c568e791556 crates/domains/symtropy-spatial-decomposition/Cargo.lock
          check_blob 614fa7d2e293809faaef10649cf3beb02475c259 crates/domains/symtropy-spatial-decomposition/Cargo.toml
          check_blob 396f79b17950990778702f1e473caba98b6b1c3d crates/domains/symtropy-spatial-decomposition/src/lib.rs
          check_blob 7622be3716a564a1a0abce183601a82f899798a0 crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs
          check_blob 8aa8efc59dc3b7267b29b0c8f8675e23b4a15498 crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs
          check_blob e9ed2fda9e3fefb5a029b0dcaad482dae180d85c scripts/pb04b1-complete-local-coverage.py
          check_blob c7373d0847477c9f3dbda3f6c0619b9926880cb5 scripts/pb04b1-repair-schema3-transform.py

          actual_source_delta="$(git diff --name-only ${base}..HEAD | sort -u)"
          expected_source_delta="$(printf '%s\n' \
            .github/workflows/pb04b1-complete-local-coverage-self-apply.yml \
            crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs \
            scripts/pb04b1-complete-local-coverage.py \
            scripts/pb04b1-repair-schema3-transform.py | sort)"
          if [[ "${actual_source_delta}" != "${expected_source_delta}" ]]; then
            echo "PB-04b1 theorem lineage changed unexpected paths" >&2
            echo "expected:" >&2
            printf '%s\n' "${expected_source_delta}" >&2
            echo "actual:" >&2
            printf '%s\n' "${actual_source_delta}" >&2
            exit 1
          fi

          echo "PB04B1_INPUT_HEAD=${GITHUB_SHA}"
          echo "PB04B1_INPUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "PB04B1_QUALIFIED_SCHEMA2_BASE=${base}"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04b1-complete-coverage-target" >> "${GITHUB_ENV}"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PB04B1_RUNNER_OS=${RUNNER_OS}"
          echo "PB04B1_RUNNER_ARCH=${RUNNER_ARCH}"
          echo "PB04B1_IMAGE_OS=${ImageOS:-unknown}"
          echo "PB04B1_IMAGE_VERSION=${ImageVersion:-unknown}"
          uname -a
          git --version

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Apply exact schema3 coverage transform and deterministic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pb04b1-complete-local-coverage.py
          python3 scripts/pb04b1-repair-schema3-transform.py
          cargo fmt --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml
          echo "PB04B1_TRANSFORMED_LIB_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/src/lib.rs)"
          echo "PB04B1_FORMATTED_LOCALITY_TEST_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs)"
          echo "PB04B1_FORMATTED_COVERAGE_TEST_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs)"
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/Cargo.lock)" = "676fd6a7eb31a2ec00b09c9496b42c568e791556"

      - name: Verify locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          manifest="crates/domains/symtropy-spatial-decomposition/Cargo.toml"
          cargo metadata --manifest-path "${manifest}" --locked --format-version 1 > "${RUNNER_TEMP}/pb04b1-metadata.json"
          echo "PB04B1_LOCKED_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/pb04b1-metadata.json" | awk '{print $1}')"

      - name: Check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets

      - name: Test complete local coverage theorem
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked

      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets -- -D warnings

      - name: Require exact generated product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e crates/domains/symtropy-spatial-decomposition/target
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/Cargo.lock)" = "676fd6a7eb31a2ec00b09c9496b42c568e791556"

          actual="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"
          expected="$(printf '%s\n' \
            crates/domains/symtropy-spatial-decomposition/src/lib.rs \
            crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs \
            crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "PB-04b1 qualification produced unexpected product paths" >&2
            echo "expected:" >&2
            printf '%s\n' "${expected}" >&2
            echo "actual:" >&2
            printf '%s\n' "${actual}" >&2
            exit 1
          fi

      - name: Publish frozen PB-04b1 schema3 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PB-04b Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            crates/domains/symtropy-spatial-decomposition/src/lib.rs \
            crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs \
            crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs
          git diff --cached --check
          git diff --cached --exit-code --quiet && {
            echo "no PB-04b1 schema3 product delta" >&2
            exit 1
          }
          git commit -m "fix(spatial): require complete PB-04b local coverage"

          product_head="$(git rev-parse HEAD)"
          echo "PB04B1_PRODUCT_HEAD=${product_head}"
          echo "PB04B1_PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
          echo "PB04B1_PRODUCT_PARENT=$(git rev-parse HEAD^)"
          echo "PB04B1_PRODUCT_LIB_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/src/lib.rs)"
          echo "PB04B1_PRODUCT_LOCALITY_TEST_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs)"
          echo "PB04B1_PRODUCT_COVERAGE_TEST_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/tests/complete_local_coverage.rs)"
          echo "PB04B1_PRODUCT_LOCK_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/Cargo.lock)"

          remote_head="$(git ls-remote origin refs/heads/spatial/pb04b1-complete-local-coverage-v0.1 | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin HEAD:spatial/pb04b1-complete-local-coverage-v0.1
