name: Shipyard benchmark auditor

on:
  pull_request:
    paths:
      - "tools/shipyard-benchmark-auditor/**"
      - "tools/shipyard-benchmark-contract/**"
      - ".github/workflows/shipyard-benchmark-auditor.yml"
  push:
    branches:
      - main
    paths:
      - "tools/shipyard-benchmark-auditor/**"
      - "tools/shipyard-benchmark-contract/**"
      - ".github/workflows/shipyard-benchmark-auditor.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Pinned Rust auditor conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Fetch pinned dependencies
        run: cargo fetch --locked --manifest-path tools/shipyard-benchmark-auditor/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path tools/shipyard-benchmark-auditor/Cargo.toml -- --check
      - name: Run frozen conformance suite offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-benchmark-auditor/Cargo.toml
      - name: Run Clippy offline
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-benchmark-auditor/Cargo.toml --all-targets -- -D warnings
