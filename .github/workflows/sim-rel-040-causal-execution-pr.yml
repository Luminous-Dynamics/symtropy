name: SIM-REL-040 Causal Execution PR Qualification

on:
  pull_request:
    branches:
      - research/sim-rel-037-independent-state-transition-oracle-2026-11-01
    paths:
      - "tools/sim-rel-action-realization-filter/src/decision_value.rs"
      - "tools/sim-rel-action-realization-filter/src/decision_value/**"
      - "tools/sim-rel-action-realization-filter/CAUSAL_ACTION_REALIZATION_PROTOCOL.md"
      - ".github/workflows/sim-rel-040-causal-execution-pr.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: causal chain, clock ambiguity, action attribution, full tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-040-causal-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml -- --check
      - name: Focused causal execution tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib decision_value::causal_execution
      - name: Full locked crate tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib -- -D warnings
      - name: Verify exact PR head and clean tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
