name: SAFRB Flow Rust Exact-Head Qualification

on:
  push:
    branches:
      - research/single-commodity-flow-kernel-v0
      - research/safrb-temporal-semantics-v0
      - research/safrb-time-expanded-adapter-v0
      - research/safrb-beneficiary-floor-feasibility-v0
      - research/safrb-robust-floor-scenarios-v0.2
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/single-commodity-flow-kernel/**"
      - "tools/wpt-exact-service-oracle/**"
      - "tools/safrb-time-expanded-adapter/**"
      - ".github/workflows/safrb-flow-rust.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - research/wpt-exact-service-oracle-v0
      - research/single-commodity-flow-kernel-v0
      - research/safrb-temporal-semantics-v0
      - research/safrb-beneficiary-floor-feasibility-v0
      - research/safrb-robust-floor-scenarios-v0.2
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/single-commodity-flow-kernel/**"
      - "tools/wpt-exact-service-oracle/**"
      - "tools/safrb-time-expanded-adapter/**"
      - ".github/workflows/safrb-flow-rust.yml"

permissions:
  contents: read

concurrency:
  group: saf-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_COMMIT"
          printf 'QUALIFIED_SOURCE_COMMIT=%s\n' "$actual" >> "$GITHUB_ENV"

      - name: Install repository-pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Format each present flow crate
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            tools/single-commodity-flow-kernel/Cargo.toml \
            tools/wpt-exact-service-oracle/Cargo.toml \
            tools/safrb-time-expanded-adapter/Cargo.toml; do
            if [[ -f "$manifest" ]]; then
              cargo fmt --manifest-path "$manifest" -- --check
            fi
          done

      - name: Clippy each present flow crate
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            tools/single-commodity-flow-kernel/Cargo.toml \
            tools/wpt-exact-service-oracle/Cargo.toml \
            tools/safrb-time-expanded-adapter/Cargo.toml; do
            if [[ -f "$manifest" ]]; then
              cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            fi
          done

      - name: Test each present flow crate
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            tools/single-commodity-flow-kernel/Cargo.toml \
            tools/wpt-exact-service-oracle/Cargo.toml \
            tools/safrb-time-expanded-adapter/Cargo.toml; do
            if [[ -f "$manifest" ]]; then
              cargo test --locked --manifest-path "$manifest" --all-targets
            fi
          done

      - name: Independent portable certificate conformance
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "tools/single-commodity-flow-kernel/conformance/test_flow_certificate.py" ]]; then
            python3 -m unittest discover \
              -s tools/single-commodity-flow-kernel/conformance \
              -p 'test_*.py' -v
            python3 tools/single-commodity-flow-kernel/conformance/verify_flow_certificate.py \
              tools/single-commodity-flow-kernel/conformance/fixtures/flow-certificate-v1.synthetic.json
          else
            echo "Portable certificate conformance suite not present on this branch; skipped."
          fi

      - name: Emit exact-head qualification receipt
        if: always()
        shell: bash
        run: |
          {
            echo "## SAFRB flow exact-head qualification"
            echo
            echo "- Source commit: $QUALIFIED_SOURCE_COMMIT"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Run: ${{ github.run_id }}"
            echo "- Job result: ${{ job.status }}"
            echo "- Claim ceiling: repository tests only; no evidence-source, legal, physical, field or beneficiary-service qualification"
          } >> "$GITHUB_STEP_SUMMARY"
