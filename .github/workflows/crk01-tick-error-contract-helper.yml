name: CRK-01 Tick Error Contract Helper

on:
  pull_request:
    branches:
      - hardening/game-state-canonical-v2

permissions:
  contents: write

concurrency:
  group: crk01-tick-error-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/crk01-tick-error-contract-ab492
          fetch-depth: 0

      - name: Assert exact CRK merge base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/hardening/game-state-canonical-v2)" = "ab492c1ec4eb418136271ff053957c7014ca0bdf"

      - name: Apply audited diagnostic-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/crk01-tick-error-contract-helper.py

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Qualify repair candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-canonical-event-v2-vectors.py
          cargo fmt -p symtropy-game-state
          cargo test --locked -p symtropy-game-state --all-targets
          cargo clippy --locked -p symtropy-game-state --all-targets -- -D warnings
          cargo check --locked -p symtropy-game-state --all-targets
          test -z "$(git diff -- Cargo.lock)"

      - name: Assert repair scope and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          expected=$'crates/domains/symtropy-game-state/CANONICAL_EVENT_V2.md\ncrates/domains/symtropy-game-state/src/event_v2.rs\ncrates/domains/symtropy-game-state/tests/canonical_event_v2.rs'
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/domains/symtropy-game-state/CANONICAL_EVENT_V2.md crates/domains/symtropy-game-state/src/event_v2.rs crates/domains/symtropy-game-state/tests/canonical_event_v2.rs
          git commit -m "fix(game-state): disambiguate non-monotonic tick errors"
          git push origin HEAD:ci/crk01-tick-error-contract-ab492
