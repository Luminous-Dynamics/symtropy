name: Bivector Inertia Verification 001

on:
  pull_request:
    paths:
      - "crates/core/symtropy-physics/src/rotational_inertia.rs"
      - "crates/core/symtropy-math/src/bivector.rs"
      - "crates/core/symtropy-math/src/point.rs"
      - "crates/core/symtropy-math/src/rotor.rs"
      - "research/bivector-inertia-001/**"
      - ".github/workflows/bivector-inertia-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bivector-inertia-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-verification:
    name: Exact-source bivector inertia tests and strict Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install stable Rust quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate isolated harness lockfile
        run: cargo generate-lockfile --manifest-path research/bivector-inertia-001/Cargo.toml

      - name: Format standalone harness and included production modules
        run: cargo fmt --manifest-path research/bivector-inertia-001/Cargo.toml -- --check

      - name: Run exact-source inertia and geometry tests
        run: cargo test --locked --manifest-path research/bivector-inertia-001/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/bivector-inertia-001/Cargo.toml --all-targets -- -D warnings
