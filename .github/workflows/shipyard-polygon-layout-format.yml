name: Format shipyard polygon layout baseline

on:
  pull_request:
    branches: ["research/shipyard-polygon-geometry-v0"]
    paths:
      - "tools/shipyard-polygon-layout-baseline/**"
      - ".github/workflows/shipyard-polygon-layout-format.yml"

permissions:
  contents: write

concurrency:
  group: shipyard-polygon-layout-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply pinned rustfmt without relaxing gates
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Format layout baseline
        run: cargo fmt --manifest-path tools/shipyard-polygon-layout-baseline/Cargo.toml
      - name: Commit rustfmt changes only
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- tools/shipyard-polygon-layout-baseline; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add tools/shipyard-polygon-layout-baseline
          git commit -m "style(shipyard): apply pinned rustfmt"
          git push origin "HEAD:${HEAD_REF}"
