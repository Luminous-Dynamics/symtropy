name: Scan-to-BIM Decision Capture Adapter

on:
  pull_request:
    branches: ["research/spatial-resilience-trajectory-benchmark-2026-10"]
    paths:
      - "tools/scan-bim-decision-capture-adapter/**"
      - "tools/spatial-resilience-qualifier/**"
      - "docs/research/spatial-design/SPATIAL_RESILIENCE_DECISION_IMPACT_V0_1.json"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_DECISION_CAPTURE_ADAPTER_V0_1.json"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_DECISION_CAPTURE_ADAPTER_V0_1.schema.json"
      - ".github/workflows/scan-bim-decision-capture-adapter.yml"
  push:
    branches: ["research/scan-bim-decision-capture-adapter-v0-1"]
    paths:
      - "tools/scan-bim-decision-capture-adapter/**"
      - "tools/spatial-resilience-qualifier/**"
      - "docs/research/spatial-design/SPATIAL_RESILIENCE_DECISION_IMPACT_V0_1.json"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_DECISION_CAPTURE_ADAPTER_V0_1.json"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_DECISION_CAPTURE_ADAPTER_V0_1.schema.json"
      - ".github/workflows/scan-bim-decision-capture-adapter.yml"

permissions:
  contents: read

concurrency:
  group: scan-bim-decision-capture-adapter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Decision capture adapter (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Resolve and snapshot pinned dependencies
        run: cargo generate-lockfile --manifest-path tools/scan-bim-decision-capture-adapter/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path tools/scan-bim-decision-capture-adapter/Cargo.toml -- --check
      - name: Run adapter and negative-control tests
        run: cargo test --locked --manifest-path tools/scan-bim-decision-capture-adapter/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/scan-bim-decision-capture-adapter/Cargo.toml --all-targets -- -D warnings
      - name: Evaluate frozen adapter corpus
        run: |
          cargo run --locked --manifest-path tools/scan-bim-decision-capture-adapter/Cargo.toml \
            > /tmp/scan-bim-decision-capture-adapter.json
          jq -e '
            .core.passed == true and
            .core.case_count == 8 and
            .core.capture_binding_count == 11 and
            .core.qualified_capture_count == 10 and
            .core.unqualified_capture_count == 1 and
            .core.decision_impact_cases_passed == 8 and
            (.receipt_sha256 | test("^[0-9a-f]{64}$"))
          ' /tmp/scan-bim-decision-capture-adapter.json
      - name: Bind report to exact source and generated lock
        run: |
          sha256sum \
            tools/scan-bim-decision-capture-adapter/Cargo.toml \
            tools/scan-bim-decision-capture-adapter/README.md \
            tools/scan-bim-decision-capture-adapter/src/lib.rs \
            tools/scan-bim-decision-capture-adapter/src/main.rs \
            tools/scan-bim-decision-capture-adapter/Cargo.lock \
            docs/research/built-asset/scan-bim/SCAN_BIM_DECISION_CAPTURE_ADAPTER_V0_1.json \
            docs/research/built-asset/scan-bim/SCAN_BIM_DECISION_CAPTURE_ADAPTER_V0_1.schema.json \
            /tmp/scan-bim-decision-capture-adapter.json > /tmp/scan-bim-decision-capture.sha256
          git rev-parse HEAD > /tmp/scan-bim-decision-capture.commit
      - name: Upload exact-head adapter receipt
        uses: actions/upload-artifact@v4
        with:
          name: scan-bim-decision-capture-adapter-receipt
          if-no-files-found: error
          path: |
            /tmp/scan-bim-decision-capture-adapter.json
            /tmp/scan-bim-decision-capture.sha256
            /tmp/scan-bim-decision-capture.commit
            tools/scan-bim-decision-capture-adapter/Cargo.lock
