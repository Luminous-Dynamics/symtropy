name: Construction Safety Temporal Replay V1

on:
  pull_request:
    branches: [main]
    paths:
      - "research/construction-safety-temporal-replay-v0-1/**"
      - ".github/workflows/construction-safety-temporal-replay-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-safety-temporal-replay-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Temporal safety replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/construction-safety-temporal-replay-v0-1/Cargo.toml -- --check
      - name: Run frozen event-trace oracle tests
        run: cargo test --manifest-path research/construction-safety-temporal-replay-v0-1/Cargo.toml --locked
      - name: Run temporal replay corpus
        run: cargo run --manifest-path research/construction-safety-temporal-replay-v0-1/Cargo.toml --locked --bin temporal-safety-benchmark
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/construction-safety-temporal-replay-v0-1/Cargo.toml --locked --all-targets -- -D warnings
