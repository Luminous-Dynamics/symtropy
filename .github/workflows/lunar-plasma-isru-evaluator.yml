name: Lunar plasma ISRU synthetic evaluator

on:
  push:
    branches:
      - research/lunar-plasma-process-twin-v0-1
    paths:
      - "crates/tools/lunar-plasma-isru-evaluator/**"
      - "benchmarks/plasma/lunar-plasma-isru-process-v0.json"
      - ".github/workflows/lunar-plasma-isru-evaluator.yml"
  pull_request:
    paths:
      - "crates/tools/lunar-plasma-isru-evaluator/**"
      - "benchmarks/plasma/lunar-plasma-isru-process-v0.json"
      - ".github/workflows/lunar-plasma-isru-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Rust and quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path crates/tools/lunar-plasma-isru-evaluator/Cargo.toml -- --check
      - name: Generate standalone dependency lockfile
        run: cargo generate-lockfile --manifest-path crates/tools/lunar-plasma-isru-evaluator/Cargo.toml
      - name: Export exact Cargo.lock for repository update
        run: |
          echo "CARGO_LOCK_BASE64_BEGIN"
          base64 -w0 crates/tools/lunar-plasma-isru-evaluator/Cargo.lock
          echo
          echo "CARGO_LOCK_BASE64_END"
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/lunar-plasma-isru-evaluator/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/lunar-plasma-isru-evaluator/Cargo.toml --all-targets -- -D warnings
      - name: Audit frozen synthetic fixture
        run: cargo run --locked --manifest-path crates/tools/lunar-plasma-isru-evaluator/Cargo.toml -- benchmarks/plasma/lunar-plasma-isru-process-v0.json
