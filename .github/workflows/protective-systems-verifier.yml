name: Protective Systems Verifier

on:
  push:
    branches:
      - "research/protect-threat-portfolio-v0-1"
      - "research/protect-resilience-e0-oracle-v0-1"
      - "research/protect-model-evidence-e1-v0-1"
      - "research/protect-evidence-portability-e2-review-v0-1"
      - "research/protect-evidence-multiprovider-e3-v0-1"
    paths:
      - "research/protective-systems/**"
      - ".github/workflows/protective-systems-verifier.yml"
  pull_request:
    branches:
      - "main"
      - "research/protective-systems-benchmark-v0-1"
      - "research/protect-threat-portfolio-v0-1"
      - "research/protect-resilience-e0-oracle-v0-1"
      - "research/protect-model-evidence-e1-v0-1"
      - "research/protect-evidence-portability-e2-review-v0-1"
    paths:
      - "research/protective-systems/**"
      - ".github/workflows/protective-systems-verifier.yml"

permissions:
  contents: read

concurrency:
  group: protective-systems-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-verifier:
    name: Protective Systems isolated Rust verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache isolated verifier dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            research/protective-systems/verifier -> target

      # Check the complete isolated verifier crate; parent and child gates
      # share one formatting contract.
      - name: Check formatting
        run: cargo fmt --manifest-path research/protective-systems/verifier/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path research/protective-systems/verifier/Cargo.toml --all-targets -- -D warnings

      - name: Run all verifier tests
        run: cargo test --manifest-path research/protective-systems/verifier/Cargo.toml

      - name: Run record-conformance verifier
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-systems-verifier

      - name: Run VOI oracle
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-voi

      - name: Run robust-decision oracle
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-robust

      - name: Run defensive threat-portfolio gate
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-threat-portfolio

      - name: Run defensive resilience-bridge gate
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-resilience-bridge

      - name: Run exact E0 resilience reference oracle
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-resilience-e0

      - name: Run external model evidence envelope gate
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-model-evidence

      - name: Run PROV-O and RO-Crate portability gate
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-evidence-portability

      - name: Run DataCite, OGC Records and OpenLineage E3 portability gate
        run: cargo run --manifest-path research/protective-systems/verifier/Cargo.toml --bin protective-multiprovider-e3


  independent-ro-crate-validation:
    name: Independent RO-Crate 1.3 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for independent standards validator
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Test-only external oracle. Production verifier and all evidence logic
      # remain in the isolated Rust crate.
      - name: Install pinned independent RO-Crate validator
        run: python -m pip install --disable-pip-version-check --only-binary=:all: roc-validator==0.13.1

      - name: Validate E2 RO-Crate 1.3 package
        run: ro-crate-validator validate research/protective-systems/fixtures/protective-evidence-crate-v0.1

      - name: Validate E3 RO-Crate 1.3 package
        run: ro-crate-validator validate research/protective-systems/fixtures/protective-evidence-multiprovider-e3-v0.1
