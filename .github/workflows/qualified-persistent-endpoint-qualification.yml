name: PHYS-EVID-02C1 Qualified Persistent Endpoint Qualification

on:
  push:
    branches:
      - ci/qualified-persistent-endpoint-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUBJECT_SHA: 6bd55619bc4a50d15bab6cf7569bcfb8d59f246e
      PARENT_SHA: e8753451e522ec343dc9669685ddc404f1cdade6
      CONTRACT_BLOB: 64a58d686b756ee9d768c364e14b35e88d5da701
      SOURCE_BLOB: 5bdee0b554880685e9138d7e45fff23fadfe174f
      LIB_BLOB: 64fbafa3b0f4f1363eb3e8fb55b1aa2b0a013222
      PREDECESSOR_ENDPOINT_SOURCE_BLOB: 3d00108424f48cea946cfc5db0abb3c9d0414586
      PREDECESSOR_ENDPOINT_VECTOR_BLOB: dcb6d3b74f3d06b30dcb336131e594c4353005ca
      PREDECESSOR_ENDPOINT_ORACLE_BLOB: fdc5a7b3b97f5408e59927522a9fc86c4ad2bfc7

    steps:
      - name: Checkout exact product subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Exact-head and three-file scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..$SUBJECT_SHA")" = "1"
          mapfile -t changed < <(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA" | sort)
          expected=(
            docs/release/evidence/QUALIFIED_PERSISTENT_ENDPOINT_SAMPLE_V01.md
            src/lib.rs
            src/qualified_persistent_endpoint.rs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" = "3"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Freeze product and predecessor blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$SUBJECT_SHA:docs/release/evidence/QUALIFIED_PERSISTENT_ENDPOINT_SAMPLE_V01.md")" = "$CONTRACT_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:src/qualified_persistent_endpoint.rs")" = "$SOURCE_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:src/lib.rs")" = "$LIB_BLOB"
          test "$(git rev-parse "$PARENT_SHA:src/endpoint_sample_codec.rs")" = "$PREDECESSOR_ENDPOINT_SOURCE_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:src/endpoint_sample_codec.rs")" = "$PREDECESSOR_ENDPOINT_SOURCE_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:tests/fixtures/endpoint_sample_v1_vector.json")" = "$PREDECESSOR_ENDPOINT_VECTOR_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:tests/verify_endpoint_sample_v1.py")" = "$PREDECESSOR_ENDPOINT_ORACLE_BLOB"

      - name: Static issuer-provenance boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('src/qualified_persistent_endpoint.rs').read_text()
          production = text.split('#[cfg(test)]', 1)[0]

          required = [
              'pub struct QualifiedPersistentEndpointSampleV1<const D: usize>',
              'live_token: LocalQualifiedStampedEndpointBoxObservation<D>',
              'frame: Vec<u8>',
              'pub fn capture(',
              'session: &PersistentEvidenceSession<D>',
              'capture_and_encode_current_endpoint_sample_v1(session, subject, region)',
              'LocalQualifiedStampedEndpointBoxObservation::capture(',
              'decode_endpoint_sample_v1(&frame)',
              'ensure_exact_match(session, &live_token, &decoded)?',
              'pub const fn live_token(&self)',
              'pub fn frame_bytes(&self) -> &[u8]',
              'pub fn into_frame_bytes(self) -> Vec<u8>',
          ]
          for needle in required:
              assert needle in production, needle

          # Strong wrapper itself must have no derive line granting Clone/Copy.
          wrapper_prefix = production.split('pub struct QualifiedPersistentEndpointSampleV1', 1)[0]
          tail = wrapper_prefix.rsplit('\n', 3)[-3:]
          assert not any('#[derive' in line for line in tail), tail

          # No bytes/decoded-record promotion or caller-selected constructor.
          for forbidden in [
              'impl From<',
              'impl TryFrom<',
              'pub fn new(',
              'pub fn from_bytes',
              'pub fn from_frame',
              'pub fn from_decoded',
              'Deserialize',
              'Serialize',
              'frame_mut(',
              'live_token_mut(',
          ]:
              assert forbidden not in production, forbidden

          # Matching is exhaustive over the semantics frozen by #1117; geometry
          # is compared, not recomputed here.
          for needle in [
              'decoded_session.session_id_bytes()',
              'decoded_session.physical_authority_raw()',
              'decoded_session.world_generation_raw()',
              'decoded_session.temporal_incarnation_raw()',
              'decoded_session.session_profile_code()',
              'decoded.step_index()',
              'decoded.target_net_id()',
              'decoded.anchor_net_id()',
              'decoded.membership()',
              'decoded.center_offset_bits(axis)',
              'decoded.half_extent_bits(axis)',
              'decoded.target_translation_bits(axis)',
              'decoded.anchor_translation_bits(axis)',
              'decoded.region_center_bits(axis)',
              'decoded.offset_from_center_bits(axis)',
          ]:
              assert needle in production, needle

          # C1 must not become a second geometry implementation.
          for forbidden in [
              '.abs() <=',
              'anchor_translation + center_offset',
              'target_translation -',
              'contains_local',
              'HyperBox',
          ]:
              assert forbidden not in production, forbidden

          print('PHYS-EVID-02C1 static issuer-provenance audit: PASS')
          PY

      - name: Re-run independent PHYS-EVID-02C oracle
        run: python3 tests/verify_endpoint_sample_v1.py

      - name: Install pinned Rust 1.96
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Workspace rustfmt
        run: cargo fmt --all -- --check

      - name: Integration library check
        run: cargo check -p symtropy-launcher --lib --locked

      - name: PHYS-EVID-02C1 unit corpus
        run: cargo test -p symtropy-launcher --lib qualified_persistent_endpoint::tests --locked -- --nocapture

      - name: PHYS-EVID-02C and persistence regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-launcher --lib endpoint_sample_codec::tests --locked -- --nocapture
          cargo test -p symtropy-launcher --lib evidence_session_binding_codec::tests --locked -- --nocapture
          cargo test -p symtropy-launcher --lib evidence_session::tests --locked -- --nocapture

      - name: PHYS-OBS endpoint regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-physics --test qualified_stamped_endpoint_v01 --locked -- --nocapture
          cargo test -p symtropy-physics --test authority_endpoint_box_v01 --locked -- --nocapture

      - name: Warnings-denied Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p symtropy-launcher --lib --locked -- -D warnings
          cargo clippy -p symtropy-physics --lib --locked -- -D warnings

      - name: Immutable-source postflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD:src/qualified_persistent_endpoint.rs)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:src/endpoint_sample_codec.rs)" = "$PREDECESSOR_ENDPOINT_SOURCE_BLOB"

      - name: Emit qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'theorem': 'PHYS-EVID-02C1 issuer-qualified persistent endpoint sample v0.1',
              'subject_sha': os.environ['SUBJECT_SHA'],
              'parent_sha': os.environ['PARENT_SHA'],
              'canonical_bytes_are_issuer_authority': False,
              'decoded_record_is_issuer_authority': False,
              'wrapper_reconstructible_from_bytes': False,
              'live_token_retained': True,
              'exact_semantic_postcheck': True,
              'predecessor_pass_laundering': False,
              'authentication_claimed': False,
              'remote_verification_claimed': False,
              'consecutive_presence_claimed': False,
              'continuous_occupancy_claimed': False,
              'side_effect_authority_claimed': False,
              'settlement_claimed': False,
          }
          Path('phys-evid-02c1-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Upload qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: phys-evid-02c1-qualified-persistent-endpoint-receipt
          path: phys-evid-02c1-receipt.json
          if-no-files-found: error
