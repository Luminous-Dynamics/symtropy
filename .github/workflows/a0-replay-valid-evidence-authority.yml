name: A0 Replay-Valid Evidence Authority

on:
  pull_request:
    branches: [ "analysis/a0-analysis-evidence-contracts-r2-v0.1" ]

permissions:
  contents: write

concurrency:
  group: a0-replay-valid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: analysis/a0-replay-valid-evidence-v0.1
  PARENT_HEAD: a84b10fb12ee3e20333be9914c5455075e5326d7
  PARENT_TREE: fdd860b78da87ed5ded7ef8fb177dffeabfe2a6d
  PARENT_ROOT_MANIFEST_BLOB: fbbf871e1ab88d844c257216f03c095f993b58d4
  PARENT_LOCK_BLOB: 81a0f21764b070dca01338ab05cf596bd19267b0
  PARENT_A0_MANIFEST_BLOB: 637fbc51b4c1a7e9389b24d6a8c39582664ea0b1
  PARENT_A0_SOURCE_BLOB: cc710942eb6628dce424e0f44da0439c1b51efcd
  TRANSFORM_BLOB: 48ab3b7a0ba8e3d8298593efb39159fa3edb193e
  API_GUARD_BLOB: 49605e123554bc231225052b7e2904f873294e14
  A0_REQUEST_GOLDEN: 3b0ce5c820d1dd550b164c7691ba9804ecc1f4a672d8615fa7f732e372829037
  A0_EVIDENCE_GOLDEN: 501e1ec4aabe3ebcbc49b0db12ae9a0963415df32dfa040e05e45ae3cf514dc5
  CARGO_TARGET_DIR: /tmp/symtropy-a0-replay-valid-target

jobs:
  qualify-and-promote:
    name: Prove replay-valid A0 evidence and promote exact product
    runs-on: ubuntu-24.04
    steps:
      - name: Check out frozen product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          fetch-depth: 0

      - name: Check out exact runner tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact parent and transforms
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PARENT_HEAD"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test "$(git -C product hash-object Cargo.toml)" = "$PARENT_ROOT_MANIFEST_BLOB"
          test "$(git -C product hash-object Cargo.lock)" = "$PARENT_LOCK_BLOB"
          test "$(git -C product hash-object crates/domains/symtropy-analysis-contracts/Cargo.toml)" = "$PARENT_A0_MANIFEST_BLOB"
          test "$(git -C product hash-object crates/domains/symtropy-analysis-contracts/src/lib.rs)" = "$PARENT_A0_SOURCE_BLOB"
          test "$(git -C runner-tools hash-object .github/repair/a0_harden_persistence.py)" = "$TRANSFORM_BLOB"
          test "$(git -C runner-tools hash-object .github/repair/a0_harden_persistence_api_guard.py)" = "$API_GUARD_BLOB"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Re-prove exact qualified A0 parent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo metadata --locked --format-version 1 >/tmp/a0-parent-metadata.json
          cargo fmt -p symtropy-analysis-contracts -- --check
          cargo check --locked -p symtropy-analysis-contracts --all-targets
          cargo test --locked -p symtropy-analysis-contracts
          cargo test --locked -p symtropy-analysis-contracts tests::canonical_analysis_request_digest_has_frozen_golden_vector -- --exact
          cargo test --locked -p symtropy-analysis-contracts tests::canonical_analysis_evidence_digest_has_frozen_golden_vector -- --exact
          cargo clippy --locked -p symtropy-analysis-contracts --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze unrelated authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cp Cargo.toml /tmp/a0-root.before
          cp Cargo.lock /tmp/a0-lock.before
          cp crates/domains/symtropy-design/src/lib.rs /tmp/a0-design.before
          cp crates/domains/symtropy-design-requirements/src/lib.rs /tmp/a0-requirements.before

      - name: Apply exact replay-valid persistence transforms
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/a0_harden_persistence.py
          python3 ../runner-tools/.github/repair/a0_harden_persistence_api_guard.py
          cargo fmt -p symtropy-analysis-contracts
          cmp Cargo.toml /tmp/a0-root.before
          cmp crates/domains/symtropy-design/src/lib.rs /tmp/a0-design.before
          cmp crates/domains/symtropy-design-requirements/src/lib.rs /tmp/a0-requirements.before
          grep -q 'pub struct ValidatedAnalysisEvidence' crates/domains/symtropy-analysis-contracts/src/lib.rs
          test "$(grep -c 'pub fn may_enter_result_qualification' crates/domains/symtropy-analysis-contracts/src/lib.rs)" -eq 1

      - name: Resolve and prove bounded lock delta
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo metadata --format-version 1 >/tmp/a0-replay-metadata.json
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/a0-lock.before').read_text())
          after = tomllib.loads(Path('Cargo.lock').read_text())
          assert {k:v for k,v in before.items() if k!='package'} == {k:v for k,v in after.items() if k!='package'}
          canon = lambda p: json.dumps(p, sort_keys=True, separators=(',', ':'))
          old = {canon(p) for p in before['package']}
          new = {canon(p) for p in after['package']}
          removed = old-new
          added = new-old
          assert len(removed) == 1 and len(added) == 1, (sorted(removed), sorted(added))
          old_pkg = json.loads(next(iter(removed)))
          new_pkg = json.loads(next(iter(added)))
          assert old_pkg['name'] == new_pkg['name'] == 'symtropy-analysis-contracts'
          assert old_pkg['version'] == new_pkg['version'] == '0.1.0'
          assert sorted(old_pkg.get('dependencies', [])) == ['serde','sha2','symtropy-design','symtropy-game-state']
          assert sorted(new_pkg.get('dependencies', [])) == ['serde','serde_json','sha2','symtropy-design','symtropy-game-state']
          old_pkg['dependencies'] = new_pkg['dependencies']
          assert old_pkg == new_pkg, (old_pkg, new_pkg)
          PY
          cargo metadata --locked --format-version 1 >/tmp/a0-replay-locked-metadata.json

      - name: Prove exact four-file product surface
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 - <<'PY'
          import subprocess
          expected={
              ' M Cargo.lock',
              ' M crates/domains/symtropy-analysis-contracts/Cargo.toml',
              ' M crates/domains/symtropy-analysis-contracts/src/lib.rs',
              '?? crates/domains/symtropy-analysis-contracts/src/persistence.rs',
          }
          actual=set(subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True).splitlines())
          assert actual == expected, (sorted(actual), sorted(expected))
          PY
          git diff --check -- Cargo.lock crates/domains/symtropy-analysis-contracts/Cargo.toml crates/domains/symtropy-analysis-contracts/src/lib.rs

      - name: Re-prove frozen A0 protocol identities
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo test --locked -p symtropy-analysis-contracts tests::canonical_analysis_request_digest_has_frozen_golden_vector -- --exact
          cargo test --locked -p symtropy-analysis-contracts tests::canonical_analysis_evidence_digest_has_frozen_golden_vector -- --exact
          grep -q "$A0_REQUEST_GOLDEN" crates/domains/symtropy-analysis-contracts/src/lib.rs
          grep -q "$A0_EVIDENCE_GOLDEN" crates/domains/symtropy-analysis-contracts/src/lib.rs

      - name: Format gate
        run: cargo fmt --manifest-path product/Cargo.toml -p symtropy-analysis-contracts -- --check

      - name: Check gate
        run: cargo check --locked --manifest-path product/Cargo.toml -p symtropy-analysis-contracts --all-targets

      - name: Unit and hostile persistence gate
        run: cargo test --locked --manifest-path product/Cargo.toml -p symtropy-analysis-contracts

      - name: Compile-fail raw authority gate
        run: cargo test --locked --manifest-path product/Cargo.toml -p symtropy-analysis-contracts --doc

      - name: Strict Clippy gate
        run: cargo clippy --locked --manifest-path product/Cargo.toml -p symtropy-analysis-contracts --all-targets -- -D warnings

      - name: Re-prove unrelated authority surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cmp Cargo.toml /tmp/a0-root.before
          cmp crates/domains/symtropy-design/src/lib.rs /tmp/a0-design.before
          cmp crates/domains/symtropy-design-requirements/src/lib.rs /tmp/a0-requirements.before

      - name: Commit exact qualified product only
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name luminous-qualification-bot
          git config user.email qualification@luminous.invalid
          git add Cargo.lock crates/domains/symtropy-analysis-contracts/Cargo.toml crates/domains/symtropy-analysis-contracts/src/lib.rs crates/domains/symtropy-analysis-contracts/src/persistence.rs
          python3 - <<'PY'
          import subprocess
          expected=[
              'Cargo.lock',
              'crates/domains/symtropy-analysis-contracts/Cargo.toml',
              'crates/domains/symtropy-analysis-contracts/src/lib.rs',
              'crates/domains/symtropy-analysis-contracts/src/persistence.rs',
          ]
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert actual == expected, (actual, expected)
          PY
          test -z "$(git diff --name-only)"
          git commit -m "feat(analysis): make evidence eligibility replay-valid"
          test "$(git rev-parse HEAD^)" = "$PARENT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "A0_REPLAY_VALID_HEAD=$(git rev-parse HEAD)"
          echo "A0_REPLAY_VALID_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse branch race and push exact qualified product
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$PARENT_HEAD"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          pushed="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)"
          test "$pushed" = "$(git rev-parse HEAD)"
          echo "A0_REPLAY_VALID_PROMOTED_HEAD=$pushed"
