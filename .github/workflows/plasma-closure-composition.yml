name: Plasma closure composition primitive

on:
  push:
    branches:
      - research/plasma-closure-composition-v0-1-2026-11-19
    paths:
      - "crates/tools/plasma-closure-composition/**"
      - ".github/workflows/plasma-closure-composition.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-closure-composition/**"
      - ".github/workflows/plasma-closure-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-closure-composition/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-closure-composition/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-closure-composition/Cargo.toml --all-targets -- -D warnings
