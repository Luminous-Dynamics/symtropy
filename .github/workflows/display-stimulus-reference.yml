name: Display Stimulus Reference

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/display-stimulus-reference/**"
      - "docs/visual-technology/display-stimulus-recipes-v0.1.json"
      - "docs/visual-technology/display-stimulus-recipes.schema.json"
      - "docs/visual-technology/display-stimulus-report.schema.json"
      - ".github/workflows/display-stimulus-reference.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/display-stimulus-reference/**"
      - "docs/visual-technology/display-stimulus-recipes-v0.1.json"
      - "docs/visual-technology/display-stimulus-recipes.schema.json"
      - "docs/visual-technology/display-stimulus-report.schema.json"
      - ".github/workflows/display-stimulus-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-stimulus-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic raster reference (pinned Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2 pinned to an immutable commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path tools/display-stimulus-reference/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/display-stimulus-reference/Cargo.toml --all-targets -- -D warnings

      - name: Run independent known-answer and mutation tests
        run: cargo test --manifest-path tools/display-stimulus-reference/Cargo.toml

      - name: Generate and compare deterministic PPM artifacts
        shell: bash
        env:
          ODRH_STIMULUS_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          crate="tools/display-stimulus-reference/Cargo.toml"
          out="$RUNNER_TEMP/odrh-stimuli"
          mkdir -p "$out"

          for id in \
            ODRH-STIM-GREY-RAMP-001 \
            ODRH-STIM-NEARBLACK-001 \
            ODRH-STIM-LOCAL-HIGHLIGHT-001 \
            ODRH-STIM-COLOR-GRADIENT-001; do
            cargo run --quiet --manifest-path "$crate" -- \
              --case "$id" --out "$out/$id-a.ppm" --report "$out/$id-a.json"
            cargo run --quiet --manifest-path "$crate" -- \
              --case "$id" --out "$out/$id-b.ppm" --report "$out/$id-b.json"
            cmp "$out/$id-a.ppm" "$out/$id-b.ppm"
            cmp "$out/$id-a.json" "$out/$id-b.json"

            expected="$(jq -r '.output_sha256' "$out/$id-a.json")"
            actual="$(sha256sum "$out/$id-a.ppm" | awk '{print $1}')"
            test "$actual" = "$expected"
            jq -e '
              .evidence_class == "SYNTHETIC_STIMULUS" and
              .status == "UNQUALIFIED" and
              .physical_output_validation == "NOT_PERFORMED" and
              .source_corpus_id == "VIS-DISP-CORPUS-001"
            ' "$out/$id-a.json" >/dev/null
            echo "$id $actual"
          done

      - name: Reject unknown source case from CLI
        shell: bash
        run: |
          if cargo run --quiet --manifest-path tools/display-stimulus-reference/Cargo.toml -- \
            --case ODRH-STIM-UNAUTHORIZED-999 --out "$RUNNER_TEMP/invalid.ppm"; then
            echo "unknown stimulus unexpectedly rendered"
            exit 1
          fi
