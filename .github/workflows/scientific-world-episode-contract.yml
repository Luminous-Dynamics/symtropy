name: Scientific World Episode Contract

on:
  pull_request:
    paths:
      - "tools/scientific-world-episode-contract/**"
      - "benchmarks/scientific-world-episodes/**"
      - "docs/research/SCIENTIFIC_WORLD_EPISODE_PROVIDER_V0_1.md"
      - ".github/workflows/scientific-world-episode-contract.yml"
  push:
    branches:
      - "research/scientific-world-episode-provider-v0-1"
    paths:
      - "tools/scientific-world-episode-contract/**"
      - "benchmarks/scientific-world-episodes/**"
      - "docs/research/SCIENTIFIC_WORLD_EPISODE_PROVIDER_V0_1.md"
      - ".github/workflows/scientific-world-episode-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-world-episode-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/scientific-world-episode-contract/Cargo.toml -- --check
      - name: Tests
        run: cargo test --locked --manifest-path tools/scientific-world-episode-contract/Cargo.toml --all-targets
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/scientific-world-episode-contract/Cargo.toml --all-targets -- -D warnings
