name: AeroWeft Reachability Core

on:
  pull_request:
    paths:
      - "tools/aeroweft-reachability/**"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - ".github/workflows/aeroweft-reachability.yml"
  push:
    branches:
      - "feat/aeroweFt-kinematic-reachability-001"
    paths:
      - "tools/aeroweft-reachability/**"
      - "docs/research/aviation/AEROWEFT_BENCHMARK_SUITE_V1.md"
      - ".github/workflows/aeroweft-reachability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeroweft-reachability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/aeroweft-reachability/Cargo.toml
      - name: Export temporary rustfmt patch
        if: always()
        run: git diff --binary -- tools/aeroweft-reachability > /tmp/rustfmt.patch
      - name: Upload temporary rustfmt patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeroweift-rustfmt-core
          path: /tmp/rustfmt.patch
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/aeroweft-reachability/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/aeroweft-reachability/Cargo.toml
