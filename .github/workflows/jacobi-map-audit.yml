name: Jacobi map audit

on:
  push:
    branches:
      - research/bh-kerr-ray-bundle-manifest-v0.1
    paths:
      - "tools/jacobi-map-audit/**"
      - ".github/workflows/jacobi-map-audit.yml"
      - "crates/domains/symtropy-relativity/benchmarks/kerr_ray_bundle_v1.json"
  pull_request:
    paths:
      - "tools/jacobi-map-audit/**"
      - ".github/workflows/jacobi-map-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path tools/jacobi-map-audit/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/jacobi-map-audit/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/jacobi-map-audit/Cargo.toml --all-targets
