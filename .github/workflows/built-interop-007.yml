name: BUILT-INTEROP-007 Paired Semantic Delta

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/built-interop-007/**"
      - ".github/workflows/built-interop-007.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/built-interop-007/**"
      - ".github/workflows/built-interop-007.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: built-interop-007-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-delta:
    name: Build, test and lint paired semantic-delta gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Bootstrap lockfile for commit
        run: |
          cargo generate-lockfile --manifest-path tools/built-interop-007/Cargo.toml
          sha256sum tools/built-interop-007/Cargo.lock
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 tools/built-interop-007/Cargo.lock
          echo
          echo "LOCKFILE_BASE64_END"
      - name: Format and export source for review
        run: |
          cargo fmt --manifest-path tools/built-interop-007/Cargo.toml
          echo "FORMATTED_SOURCE_BASE64_BEGIN"
          base64 -w0 tools/built-interop-007/src/main.rs
          echo
          echo "FORMATTED_SOURCE_BASE64_END"
      - name: Run paired preservation adversarial tests
        run: cargo test --locked --manifest-path tools/built-interop-007/Cargo.toml
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/built-interop-007/Cargo.toml --all-targets -- -D warnings
