name: water-epanet-junction-hook-t0

on:
  pull_request:
    paths:
      - ".github/workflows/water-epanet-junction-hook-t0.yml"
      - "tools/water-service-t0/**"
      - "research/water-intrusion-coupling/epanet-junction-hook-t0-*.json"
      - "research/water-intrusion-coupling/EPANET_JUNCTION_HOOK_T0_V0_1.md"
      - "research/water-intrusion-coupling/EPANET_LOCAL_OPERATOR_INTEROP_V0_1.md"
  push:
    branches:
      - main
      - research/water-mixing-engine-interop-t0-v0.1
    paths:
      - ".github/workflows/water-epanet-junction-hook-t0.yml"
      - "tools/water-service-t0/**"
      - "research/water-intrusion-coupling/epanet-junction-hook-t0-*.json"
      - "research/water-intrusion-coupling/EPANET_JUNCTION_HOOK_T0_V0_1.md"
      - "research/water-intrusion-coupling/EPANET_LOCAL_OPERATOR_INTEROP_V0_1.md"

permissions:
  contents: read

concurrency:
  group: water-epanet-junction-hook-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epanet-junction-hook-t0:
    name: Rust format, tests, clippy and hook snapshot oracle replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/water-service-t0/Cargo.toml --all -- --check

      - name: Run native Rust tests
        run: cargo test --locked --manifest-path tools/water-service-t0/Cargo.toml --bin epanet-junction-hook-t0

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/water-service-t0/Cargo.toml --bin epanet-junction-hook-t0 -- -D warnings

      - name: Replay frozen hook-snapshot oracle
        env:
          EPANET_JUNCTION_HOOK_T0_REVISION: ${{ github.sha }}
        run: |
          cargo run --locked --manifest-path tools/water-service-t0/Cargo.toml --bin epanet-junction-hook-t0 -- \
            research/water-intrusion-coupling/epanet-junction-hook-t0-cases-v0.1.json \
            research/water-intrusion-coupling/epanet-junction-hook-t0-oracle-v0.1.json \
            research/water-intrusion-coupling/epanet-junction-hook-t0-manifest-v0.1.json \
            artifacts/epanet-junction-hook-t0/receipt.json

      - name: Archive synthetic hook receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-junction-hook-t0-${{ github.sha }}
          path: artifacts/epanet-junction-hook-t0/receipt.json
          if-no-files-found: warn
