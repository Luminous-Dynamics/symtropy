name: Orbital Calibration Validity Benchmark

on:
  pull_request:
    paths:
      - "tools/orbital-cal-validity-bench/**"
      - "docs/research/orbital-truss/fixtures/calibration-validity-v0_1.json"
      - "docs/research/orbital-truss/orbital_cal_validity_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-cal-validity.yml"
  push:
    branches:
      - "research/orbital-cal-validity-evaluator-v0-1"
    paths:
      - "tools/orbital-cal-validity-bench/**"
      - "docs/research/orbital-truss/fixtures/calibration-validity-v0_1.json"
      - "docs/research/orbital-truss/orbital_cal_validity_corpus_v0_1.schema.json"
      - ".github/workflows/orbital-cal-validity.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Calibration validity contract and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen corpus and Draft 2020-12 schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          fixture = json.loads(Path("docs/research/orbital-truss/fixtures/calibration-validity-v0_1.json").read_text())
          schema = json.loads(Path("docs/research/orbital-truss/orbital_cal_validity_corpus_v0_1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert len(fixture["cases"]) == 16
          assert len({case["case_id"] for case in fixture["cases"]}) == 14
          assert all(case["required_scope_ids"] for case in fixture["cases"])
          print("14 frozen calibration-validity cases and Draft 2020-12 schema validated")
          PY
      - name: Format
        run: cargo fmt --manifest-path tools/orbital-cal-validity-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/orbital-cal-validity-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-cal-validity-bench/Cargo.toml --all-targets -- -D warnings
      - name: Deterministic Rust receipt replay
        run: |
          cargo run --quiet --locked --manifest-path tools/orbital-cal-validity-bench/Cargo.toml --bin orbital-cal-validity-bench -- docs/research/orbital-truss/fixtures/calibration-validity-v0_1.json "$GITHUB_SHA" > /tmp/cal-rust-a.json
          cargo run --quiet --locked --manifest-path tools/orbital-cal-validity-bench/Cargo.toml --bin orbital-cal-validity-bench -- docs/research/orbital-truss/fixtures/calibration-validity-v0_1.json "$GITHUB_SHA" > /tmp/cal-rust-b.json
          cmp /tmp/cal-rust-a.json /tmp/cal-rust-b.json
          jq -e '
            .schema == "luminous.orbital-cal-validity.receipt.v0.1" and
            .case_count == 16 and .expected_outcome_matches == 16 and
            .expected_outcome_mismatches == 0 and .authority_granted == false and
            .visibility_assessed == false and
            .measurement_performance_assessed == false and
            .physical_validation == "NOT_ASSESSED"
          ' /tmp/cal-rust-a.json
      - name: Independent Python oracle
        run: |
          python3 tools/orbital-cal-validity-bench/tests/reference_oracle.py docs/research/orbital-truss/fixtures/calibration-validity-v0_1.json "$GITHUB_SHA" > /tmp/cal-python.json
      - name: Compare complete Rust and Python receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/cal-rust-a.json").read_text())
          oracle = json.loads(Path("/tmp/cal-python.json").read_text())
          assert rust == oracle
          cases = {case["case_id"]: case for case in rust["cases"]}
          assert cases["CAL-001-MULTI-SCOPE-VALID"]["status"] == "VALID_WITHIN_SCOPE"
          assert cases["CAL-002-ACQUISITION-AFTER-EXPIRY"]["status"] == "EXPIRED"
          assert cases["CAL-003-TIME-BOUNDARY-OVERLAP"]["status"] == "INDETERMINATE"
          assert cases["CAL-004-LENS-IDENTITY-MISMATCH"]["status"] == "IDENTITY_MISMATCH"
          assert cases["CAL-005-REVOKED-CERTIFICATE"]["status"] == "REVOKED"
          assert cases["CAL-006-REFERENCE-CHECK-HOLD"]["status"] == "DRIFT_SUSPECTED"
          assert cases["CAL-008-PRIOR-INVALIDATING-EVENT"]["status"] == "INVALIDATED"
          assert cases["CAL-010-INCOMPLETE-EVENT-INVENTORY"]["status"] == "INDETERMINATE"
          assert cases["CAL-012-EVENT-AFTER-ACQUISITION"]["status"] == "VALID_WITHIN_SCOPE"
          assert cases["CAL-015-EVENT-BEFORE-CALIBRATION-EPOCH"]["status"] == "VALID_WITHIN_SCOPE"
          assert cases["CAL-016-EVENT-OVERLAPS-CALIBRATION-EPOCH"]["status"] == "INDETERMINATE"
          print("Rust and independent Python oracle agree on all 16 calibration-validity cases")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-calibration-validity-evidence
          path: |
            /tmp/cal-rust-a.json
            /tmp/cal-python.json
            docs/research/orbital-truss/fixtures/calibration-validity-v0_1.json
            docs/research/orbital-truss/orbital_cal_validity_corpus_v0_1.schema.json
          if-no-files-found: error
          retention-days: 30
