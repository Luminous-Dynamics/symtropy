name: AeroWeft Surveillance Observability Oracle

on:
  pull_request:
    paths:
      - "tools/aeroweift-surveillance-observability-oracle/**"
      - "fixtures/aeroweift-surveillance-observability/**"
      - ".github/workflows/aeroweift-surveillance-observability-oracle.yml"
  push:
    branches:
      - "research/aeroweFt-surveillance-observability-001"
    paths:
      - "tools/aeroweift-surveillance-observability-oracle/**"
      - "fixtures/aeroweift-surveillance-observability/**"
      - ".github/workflows/aeroweift-surveillance-observability-oracle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeroweift-surveillance-observability-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/aeroweift-surveillance-observability-oracle/Cargo.toml
      - name: Commit rustfmt output to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- tools/aeroweift-surveillance-observability-oracle; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- tools/aeroweift-surveillance-observability-oracle
            git commit -m "style(aviation): apply rustfmt to surveillance oracle"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/aeroweift-surveillance-observability-oracle/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/aeroweift-surveillance-observability-oracle/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path tools/aeroweift-surveillance-observability-oracle/Cargo.toml
