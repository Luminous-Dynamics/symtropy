name: Panel Disassembly Rustfmt Commit (temporary)

on:
  push:
    branches: ["research/panel-disassembly-protocol-v0.1"]
    paths:
      - "tools/panel-disassembly-bench/**"
      - ".github/workflows/panel-disassembly-rustfmt.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Apply pinned rustfmt
        run: cargo fmt --manifest-path tools/panel-disassembly-bench/Cargo.toml --all
      - name: Commit formatting if required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/panel-disassembly-bench/src
          git commit -m "style(robotics): apply pinned rustfmt to panel disassembly oracle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
