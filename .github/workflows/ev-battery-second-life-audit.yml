name: EV battery second-life mission audit v0.1

on:
  pull_request:
    paths:
      - "docs/transport/EV_BATTERY_SECOND_LIFE_MISSION_QUAL_V0_1.md"
      - "schemas/transport/ev_battery_second_life_mission_v0_1.schema.json"
      - "fixtures/ev_battery/ev_battery_second_life_mission_v0_1.json"
      - "tools/ev-battery-second-life-audit/**"
      - ".github/workflows/ev-battery-second-life-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check locked Cargo metadata
        run: cargo metadata --manifest-path tools/ev-battery-second-life-audit/Cargo.toml --locked --no-deps
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ev-battery-second-life-audit/Cargo.toml -- --check
      - name: Run hard-gate, BMS and configuration tests
        run: cargo test --manifest-path tools/ev-battery-second-life-audit/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/ev-battery-second-life-audit/Cargo.toml --all-targets --locked -- -D warnings
