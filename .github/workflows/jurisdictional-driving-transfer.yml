name: jurisdictional-driving-transfer

on:
  pull_request:
    paths:
      - "research/jurisdictional-driving-transfer-001/**"
      - ".github/workflows/jurisdictional-driving-transfer.yml"
  push:
    paths:
      - "research/jurisdictional-driving-transfer-001/**"
      - ".github/workflows/jurisdictional-driving-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/jurisdictional-driving-transfer-001/Cargo.toml -- --check

      - name: Run source and metamorphic conformance tests
        run: cargo test --locked --manifest-path research/jurisdictional-driving-transfer-001/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/jurisdictional-driving-transfer-001/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Audit the South Africa draft profile
        run: |
          cargo run --locked --manifest-path research/jurisdictional-driving-transfer-001/Cargo.toml -- \
            audit-profile \
            research/jurisdictional-driving-transfer-001/fixtures/za-profile-draft-v0-1.json \
            /tmp/za-profile-audit.json
          grep -q '"disposition": "valid_draft"' /tmp/za-profile-audit.json
          grep -q '"policy_eligible": false' /tmp/za-profile-audit.json

      - name: Audit LHT/RHT metamorphic fixture
        run: |
          cargo run --locked --manifest-path research/jurisdictional-driving-transfer-001/Cargo.toml -- \
            audit-metamorphic-pair \
            research/jurisdictional-driving-transfer-001/fixtures/za-us-metamorphic-lht-rht-v0-1.json \
            /tmp/lht-rht-audit.json
          grep -q '"disposition": "valid"' /tmp/lht-rht-audit.json
          grep -q '"geometry_mirrored": true' /tmp/lht-rht-audit.json
