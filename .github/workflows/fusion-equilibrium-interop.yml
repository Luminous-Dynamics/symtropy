name: Fusion equilibrium interop contract

on:
  pull_request:
    paths:
      - "research/fusion-equilibrium-interop-v0-1/**"
      - ".github/workflows/fusion-equilibrium-interop.yml"
  push:
    branches:
      - main
      - research/fusion-equilibrium-interop-v0-1
    paths:
      - "research/fusion-equilibrium-interop-v0-1/**"
      - ".github/workflows/fusion-equilibrium-interop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install stable Rust and quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path research/fusion-equilibrium-interop-v0-1/Cargo.toml -- --check

      - name: Unit and documentation tests
        run: cargo test --manifest-path research/fusion-equilibrium-interop-v0-1/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --manifest-path research/fusion-equilibrium-interop-v0-1/Cargo.toml --all-targets -- -D warnings

      - name: Independent fixture-corpus structural audit
        run: cargo run --manifest-path research/fusion-equilibrium-interop-v0-1/Cargo.toml --bin verify_fixture_corpus
