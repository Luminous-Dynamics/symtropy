name: EV External Job-Shop Benchmark Parity Contract

on:
  pull_request:
    paths:
      - "tools/ev-external-jobshop-parity/**"
      - "docs/research/EV_FACTORY_EXTERNAL_BENCHMARK_PARITY_V0_1.md"
      - ".github/workflows/ev-external-jobshop-parity.yml"
  push:
    branches: [main]
    paths:
      - "tools/ev-external-jobshop-parity/**"
      - "docs/research/EV_FACTORY_EXTERNAL_BENCHMARK_PARITY_V0_1.md"
      - ".github/workflows/ev-external-jobshop-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check out the exact upstream benchmark asset
        uses: actions/checkout@v4
        with:
          repository: ai-for-decision-making-tue/Job_Shop_Scheduling_Benchmark_Environments_and_Instances
          ref: d088a26582f5cb79c6b4f2ad94f68ac7c50878cb
          path: upstream-benchmark
          sparse-checkout: |
            LICENSE
            data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs
            data/fjsp_sdst/fattahi/Fattahi_setup_02.fjs
            data/fjsp_sdst/fattahi/Fattahi_setup_03.fjs
            solution_methods/cp_sat/models/FJSPSDSTmodel.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify upstream revision, license and instance bytes
        run: |
          test "$(git -C upstream-benchmark rev-parse HEAD)" = "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
          test "$(git -C upstream-benchmark hash-object data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs)" = "6bac8cfaf9f326f6405d5396b9cedd12941aba94"
          test "$(git -C upstream-benchmark hash-object data/fjsp_sdst/fattahi/Fattahi_setup_02.fjs)" = "aa051d7c71a0fc2949ce69d67bce0ec54f4a11d1"
          test "$(git -C upstream-benchmark hash-object data/fjsp_sdst/fattahi/Fattahi_setup_03.fjs)" = "01c1ff749cbad87206cbc4f2ba308c005dd8b1c9"
          cmp upstream-benchmark/data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs
          cmp upstream-benchmark/data/fjsp_sdst/fattahi/Fattahi_setup_02.fjs tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs
          cmp upstream-benchmark/data/fjsp_sdst/fattahi/Fattahi_setup_03.fjs tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs
          cmp upstream-benchmark/LICENSE tools/ev-external-jobshop-parity/UPSTREAM_LICENSE_MIT.txt
      - name: Rust format and tests
        run: |
          cargo fmt --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- --check
          cargo test --manifest-path tools/ev-external-jobshop-parity/Cargo.toml
      - name: Generate structure-parity report
        run: |
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_01_v0_2.json \
            > ev-external-jobshop-parity-report.json
          jq -e '
            .schema_version == "external-jobshop-input-parity/0.2"
            and .status == "input_and_tiny_exact_makespan_oracle_validated_not_policy_benchmarked"
            and .benchmark_id == "FJSP-SDST-FATTAHI-001"
            and .source_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .expected_source_git_blob_sha1 == "6bac8cfaf9f326f6405d5396b9cedd12941aba94"
            and .observed_jobs == 2
            and .observed_machines == 2
            and .observed_max_operations_per_job == 2
            and .observed_operations == 4
            and .operation_alternative_counts == [2,2,2,2]
            and .declared_average_machine_flexibility == 2
            and .setup_matrix_dimensions == [2,4,4]
            and .setup_values_min == 3
            and .setup_values_max == 8
            and .exact_oracle.candidate_assignment_sequence_combinations == 120
            and .exact_oracle.feasible_acyclic_schedules == 52
            and .exact_oracle.optimal_makespan == 70
            and .exact_oracle.optimal_machine_assignment_upstream_ids == [2,2,1,1]
            and .exact_oracle.exhaustive_for_declared_instance
            and (.exact_oracle.optimal_schedule | length) == 4
            and .primary_objective == "makespan"
            and .supports_due_dates == false
            and (.claim_ceiling | contains("No dispatching policy was executed"))
          ' ev-external-jobshop-parity-report.json

          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_02_v0_2.json \
            > ev-external-jobshop-parity-case02-report.json
          jq -e '
            .schema_version == "external-jobshop-input-parity/0.2"
            and .status == "input_and_tiny_exact_makespan_oracle_validated_not_policy_benchmarked"
            and .benchmark_id == "FJSP-SDST-FATTAHI-002"
            and .source_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .expected_source_git_blob_sha1 == "aa051d7c71a0fc2949ce69d67bce0ec54f4a11d1"
            and .observed_jobs == 2
            and .observed_machines == 2
            and .observed_max_operations_per_job == 2
            and .observed_operations == 4
            and .operation_alternative_counts == [1,2,2,1]
            and .declared_average_machine_flexibility == 1.5
            and .setup_matrix_dimensions == [2,4,4]
            and .setup_values_min == 3
            and .setup_values_max == 1000000
            and .exact_oracle.candidate_assignment_sequence_combinations == 20
            and .exact_oracle.feasible_acyclic_schedules == 11
            and .exact_oracle.optimal_makespan == 112
            and .exact_oracle.optimal_machine_assignment_upstream_ids == [1,1,2,2]
            and .exact_oracle.optimal_machine_sequences_operation_ids == [[0,1],[2,3]]
            and .exact_oracle.exhaustive_for_declared_instance
            and (.exact_oracle.optimal_schedule | length) == 4
            and .primary_objective == "makespan"
            and .supports_due_dates == false
          ' ev-external-jobshop-parity-case02-report.json

          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_03_v0_2.json \
            > ev-external-jobshop-parity-case03-report.json
          jq -e '
            .schema_version == "external-jobshop-input-parity/0.2"
            and .status == "input_and_tiny_exact_makespan_oracle_validated_not_policy_benchmarked"
            and .benchmark_id == "FJSP-SDST-FATTAHI-003"
            and .source_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .expected_source_git_blob_sha1 == "01c1ff749cbad87206cbc4f2ba308c005dd8b1c9"
            and .observed_jobs == 3
            and .observed_machines == 2
            and .observed_max_operations_per_job == 2
            and .observed_operations == 6
            and .operation_alternative_counts == [1,2,2,1,2,2]
            and .declared_average_machine_flexibility == 1.7
            and .setup_matrix_dimensions == [2,6,6]
            and .setup_values_min == 6
            and .setup_values_max == 1000000
            and .exact_oracle.candidate_assignment_sequence_combinations == 840
            and .exact_oracle.feasible_acyclic_schedules == 298
            and .exact_oracle.optimal_makespan == 233
            and .exact_oracle.optimal_machine_assignment_upstream_ids == [1,2,2,2,1,1]
            and .exact_oracle.optimal_machine_sequences_operation_ids == [[0,4,5],[2,1,3]]
            and .exact_oracle.exhaustive_for_declared_instance
            and (.exact_oracle.optimal_schedule | length) == 6
            and .primary_objective == "makespan"
            and .supports_due_dates == false
          ' ev-external-jobshop-parity-case03-report.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned external exact-solver dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir ortools==9.11.4210
      - name: Cross-check against upstream CP-SAT model
        run: |
          python tools/ev-external-jobshop-parity/reference_cp_sat_check.py \
            --instance tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            --upstream-model upstream-benchmark/solution_methods/cp_sat/models/FJSPSDSTmodel.py \
            --rust-report ev-external-jobshop-parity-report.json \
            --upstream-commit d088a26582f5cb79c6b4f2ad94f68ac7c50878cb \
            > ev-external-reference-cp-sat.json
          jq -e '
            .schema_version == "external-fjsp-sdst-cp-sat-crosscheck/0.2"
            and .upstream_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .ortools_version == "9.11.4210"
            and .solver_status == "OPTIMAL"
            and .objective == 70
            and .rust_oracle_makespan_matched
            and (.reference_schedule | length) == 4
            and (.claim_ceiling | contains("not a dispatch-policy"))
          ' ev-external-reference-cp-sat.json
          python tools/ev-external-jobshop-parity/reference_cp_sat_check.py \
            --instance tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs \
            --upstream-model upstream-benchmark/solution_methods/cp_sat/models/FJSPSDSTmodel.py \
            --rust-report ev-external-jobshop-parity-case02-report.json \
            --upstream-commit d088a26582f5cb79c6b4f2ad94f68ac7c50878cb \
            > ev-external-reference-cp-sat-case02.json
          jq -e '
            .schema_version == "external-fjsp-sdst-cp-sat-crosscheck/0.2"
            and .upstream_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .ortools_version == "9.11.4210"
            and .solver_status == "OPTIMAL"
            and .objective == 112
            and .rust_oracle_makespan_matched
            and (.reference_schedule | length) == 4
          ' ev-external-reference-cp-sat-case02.json
          python tools/ev-external-jobshop-parity/reference_cp_sat_check.py \
            --instance tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs \
            --upstream-model upstream-benchmark/solution_methods/cp_sat/models/FJSPSDSTmodel.py \
            --rust-report ev-external-jobshop-parity-case03-report.json \
            --upstream-commit d088a26582f5cb79c6b4f2ad94f68ac7c50878cb \
            > ev-external-reference-cp-sat-case03.json
          jq -e '
            .schema_version == "external-fjsp-sdst-cp-sat-crosscheck/0.2"
            and .upstream_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .ortools_version == "9.11.4210"
            and .solver_status == "OPTIMAL"
            and .objective == 233
            and .rust_oracle_makespan_matched
            and (.reference_schedule | length) == 6
          ' ev-external-reference-cp-sat-case03.json
      - name: Evaluate deterministic greedy schedule baselines against exact makespan
        run: |
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            --dispatch-baselines \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_01_v0_2.json \
            > ev-external-dispatch-baselines-case01.json
          jq -e '
            .schema_version == "external-jobshop-dispatch-baselines/0.1"
            and .status == "greedy_serial_schedule_baselines_compared_with_exact_oracle"
            and .benchmark_id == "FJSP-SDST-FATTAHI-001"
            and .exact_oracle_makespan == 70
            and .exact_oracle_exhaustive
            and .observed_operations == 4
            and (.policies | length) == 4
            and ([.policies[].policy] | sort) == ["earliest_completion_time","job_index_order","minimum_setup_plus_processing","shortest_processing_time"]
            and all(.policies[]; .schedule_valid and .makespan >= 70 and .absolute_gap_vs_exact == (.makespan - 70) and .relative_gap_fraction_vs_exact >= 0 and (.schedule | length) == 4)
            and (.claim_ceiling | contains("No due-date or tardiness results"))
          ' ev-external-dispatch-baselines-case01.json
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            --dispatch-baselines \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_02_v0_2.json \
            > ev-external-dispatch-baselines-case02.json
          jq -e '
            .schema_version == "external-jobshop-dispatch-baselines/0.1"
            and .benchmark_id == "FJSP-SDST-FATTAHI-002"
            and .exact_oracle_makespan == 112
            and .exact_oracle_exhaustive
            and .observed_operations == 4
            and (.policies | length) == 4
            and all(.policies[]; .schedule_valid and .makespan >= 112 and .absolute_gap_vs_exact == (.makespan - 112) and .relative_gap_fraction_vs_exact >= 0 and (.schedule | length) == 4)
          ' ev-external-dispatch-baselines-case02.json
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            --dispatch-baselines \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_03_v0_2.json \
            > ev-external-dispatch-baselines-case03.json
          jq -e '
            .schema_version == "external-jobshop-dispatch-baselines/0.1"
            and .benchmark_id == "FJSP-SDST-FATTAHI-003"
            and .exact_oracle_makespan == 233
            and .exact_oracle_exhaustive
            and .observed_operations == 6
            and (.policies | length) == 4
            and all(.policies[]; .schedule_valid and .makespan >= 233 and .absolute_gap_vs_exact == (.makespan - 233) and .relative_gap_fraction_vs_exact >= 0 and (.schedule | length) == 6)
          ' ev-external-dispatch-baselines-case03.json
      - name: Negative control - mismatched setup matrix fails closed
        run: |
          sed 's/^6 3 4 4 /6 3 4 /' \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs > invalid-external-instance.fjs
          if cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            invalid-external-instance.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_01_v0_2.json \
            > /dev/null 2> invalid-external-instance.stderr; then
            echo "Malformed FJSP-SDST setup matrix was incorrectly accepted" >&2
            exit 1
          fi
          grep -q "setup_row_width_mismatch" invalid-external-instance.stderr

          sed '1s/^2 2 1.5$/2 2 1.7/' \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs > invalid-average-flexibility.fjs
          if cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            invalid-average-flexibility.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_02_v0_2.json \
            > /dev/null 2> invalid-average-flexibility.stderr; then
            echo "Inconsistent average machine flexibility was incorrectly accepted" >&2
            exit 1
          fi
          grep -q "declared_average_machine_flexibility_mismatch" invalid-average-flexibility.stderr

          sed '1s/^3 2 1.7$/3 2 1.8/' \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs > invalid-average-flexibility-case03.fjs
          if cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            invalid-average-flexibility-case03.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_03_v0_2.json \
            > /dev/null 2> invalid-average-flexibility-case03.stderr; then
            echo "Inconsistent case-03 average machine flexibility was incorrectly accepted" >&2
            exit 1
          fi
          grep -q "declared_average_machine_flexibility_mismatch" invalid-average-flexibility-case03.stderr
      - name: Deterministic replay and hashes
        run: |
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_01_v0_2.json \
            > ev-external-jobshop-parity-repeat.json
          cmp ev-external-jobshop-parity-report.json ev-external-jobshop-parity-repeat.json
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_02_v0_2.json \
            > ev-external-jobshop-parity-case02-repeat.json
          cmp ev-external-jobshop-parity-case02-report.json ev-external-jobshop-parity-case02-repeat.json
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_03_v0_2.json \
            > ev-external-jobshop-parity-case03-repeat.json
          cmp ev-external-jobshop-parity-case03-report.json ev-external-jobshop-parity-case03-repeat.json
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            --dispatch-baselines \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_01_v0_2.json \
            > ev-external-dispatch-baselines-case01-repeat.json
          cmp ev-external-dispatch-baselines-case01.json ev-external-dispatch-baselines-case01-repeat.json
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            --dispatch-baselines \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_02_v0_2.json \
            > ev-external-dispatch-baselines-case02-repeat.json
          cmp ev-external-dispatch-baselines-case02.json ev-external-dispatch-baselines-case02-repeat.json
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            --dispatch-baselines \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_03_v0_2.json \
            > ev-external-dispatch-baselines-case03-repeat.json
          cmp ev-external-dispatch-baselines-case03.json ev-external-dispatch-baselines-case03-repeat.json
          sha256sum \
            tools/ev-external-jobshop-parity/src/main.rs \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_03.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_03_v0_2.json \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_02.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_02_v0_2.json \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_fattahi_setup_01_v0_2.json \
            tools/ev-external-jobshop-parity/UPSTREAM_NOTICE.md \
            tools/ev-external-jobshop-parity/UPSTREAM_LICENSE_MIT.txt \
            tools/ev-external-jobshop-parity/reference_cp_sat_check.py \
            docs/research/EV_FACTORY_EXTERNAL_BENCHMARK_PARITY_V0_1.md \
            ev-external-jobshop-parity-report.json \
            ev-external-jobshop-parity-case02-report.json \
            ev-external-jobshop-parity-case03-report.json \
            ev-external-reference-cp-sat-case03.json \
            ev-external-reference-cp-sat-case02.json \
            ev-external-reference-cp-sat.json \
            ev-external-dispatch-baselines-case01.json \
            ev-external-dispatch-baselines-case02.json \
            ev-external-dispatch-baselines-case03.json \
            .github/workflows/ev-external-jobshop-parity.yml \
            > ev-external-jobshop-parity-report.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ev-external-jobshop-parity-contract
          path: |
            ev-external-jobshop-parity-report.json
            ev-external-jobshop-parity-case02-report.json
            ev-external-jobshop-parity-case03-report.json
            ev-external-reference-cp-sat.json
            ev-external-reference-cp-sat-case02.json
            ev-external-reference-cp-sat-case03.json
            ev-external-dispatch-baselines-case01.json
            ev-external-dispatch-baselines-case02.json
            ev-external-dispatch-baselines-case03.json
            ev-external-jobshop-parity-report.sha256
          if-no-files-found: error
