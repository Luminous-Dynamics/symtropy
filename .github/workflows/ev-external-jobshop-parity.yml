name: EV External Job-Shop Benchmark Parity Contract

on:
  pull_request:
    paths:
      - "tools/ev-external-jobshop-parity/**"
      - "docs/research/EV_FACTORY_EXTERNAL_BENCHMARK_PARITY_V0_1.md"
      - ".github/workflows/ev-external-jobshop-parity.yml"
  push:
    branches: [main]
    paths:
      - "tools/ev-external-jobshop-parity/**"
      - "docs/research/EV_FACTORY_EXTERNAL_BENCHMARK_PARITY_V0_1.md"
      - ".github/workflows/ev-external-jobshop-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check out the exact upstream benchmark asset
        uses: actions/checkout@v4
        with:
          repository: ai-for-decision-making-tue/Job_Shop_Scheduling_Benchmark_Environments_and_Instances
          ref: d088a26582f5cb79c6b4f2ad94f68ac7c50878cb
          path: upstream-benchmark
          sparse-checkout: |
            LICENSE
            data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify upstream revision, license and instance bytes
        run: |
          test "$(git -C upstream-benchmark rev-parse HEAD)" = "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
          test "$(git -C upstream-benchmark hash-object data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs)" = "6bac8cfaf9f326f6405d5396b9cedd12941aba94"
          cmp upstream-benchmark/data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs
          cmp upstream-benchmark/LICENSE tools/ev-external-jobshop-parity/UPSTREAM_LICENSE_MIT.txt
      - name: Rust format and tests
        run: |
          cargo fmt --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- --check
          cargo test --manifest-path tools/ev-external-jobshop-parity/Cargo.toml
      - name: Generate structure-parity report
        run: |
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            > ev-external-jobshop-parity-report.json
          jq -e '
            .schema_version == "external-jobshop-input-parity/0.1"
            and .status == "input_and_tiny_exact_makespan_oracle_validated_not_policy_benchmarked"
            and .benchmark_id == "FJSP-SDST-FATTAHI-001"
            and .source_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .expected_source_git_blob_sha1 == "6bac8cfaf9f326f6405d5396b9cedd12941aba94"
            and .observed_jobs == 2
            and .observed_machines == 2
            and .observed_max_operations_per_job == 2
            and .observed_operations == 4
            and .operation_alternative_counts == [2,2,2,2]
            and .setup_matrix_dimensions == [2,4,4]
            and .setup_values_min == 3
            and .setup_values_max == 8
            and .exact_oracle.candidate_assignment_sequence_combinations == 120
            and .exact_oracle.feasible_acyclic_schedules == 52
            and .exact_oracle.optimal_makespan == 70
            and .exact_oracle.optimal_machine_assignment_upstream_ids == [2,2,1,1]
            and .exact_oracle.exhaustive_for_declared_instance
            and (.exact_oracle.optimal_schedule | length) == 4
            and .primary_objective == "makespan"
            and .supports_due_dates == false
            and (.claim_ceiling | contains("No dispatching policy was executed"))
          ' ev-external-jobshop-parity-report.json
      - name: Negative control - mismatched setup matrix fails closed
        run: |
          sed 's/^6 3 4 4 /6 3 4 /' \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs > invalid-external-instance.fjs
          if cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            invalid-external-instance.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            > /dev/null 2> invalid-external-instance.stderr; then
            echo "Malformed FJSP-SDST setup matrix was incorrectly accepted" >&2
            exit 1
          fi
          grep -q "setup_row_width_mismatch" invalid-external-instance.stderr
      - name: Deterministic replay and hashes
        run: |
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            > ev-external-jobshop-parity-repeat.json
          cmp ev-external-jobshop-parity-report.json ev-external-jobshop-parity-repeat.json
          sha256sum \
            tools/ev-external-jobshop-parity/src/main.rs \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            tools/ev-external-jobshop-parity/UPSTREAM_NOTICE.md \
            tools/ev-external-jobshop-parity/UPSTREAM_LICENSE_MIT.txt \
            docs/research/EV_FACTORY_EXTERNAL_BENCHMARK_PARITY_V0_1.md \
            ev-external-jobshop-parity-report.json \
            > ev-external-jobshop-parity-report.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ev-external-jobshop-parity-contract
          path: |
            ev-external-jobshop-parity-report.json
            ev-external-jobshop-parity-report.sha256
          if-no-files-found: error
