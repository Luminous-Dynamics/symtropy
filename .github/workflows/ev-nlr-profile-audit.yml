name: EV NLR 15-minute depot profile audit

on:
  pull_request:
    paths:
      - ".github/workflows/ev-nlr-profile-audit.yml"
      - "tools/ev-nlr-profile-audit/**"
      - "tools/ev-nlr-profile-audit/Cargo.lock"
  push:
    branches: [main, "research/**"]
    paths:
      - ".github/workflows/ev-nlr-profile-audit.yml"
      - "tools/ev-nlr-profile-audit/**"
      - "tools/ev-nlr-profile-audit/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-subject:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Rust and quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate report schema
        run: jq empty tools/ev-nlr-profile-audit/schemas/ev_nlr_profile_audit_report_v0_2.schema.json
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ev-nlr-profile-audit/Cargo.toml --all -- --check
      - name: Run unit and adversarial contract tests
        run: cargo test --manifest-path tools/ev-nlr-profile-audit/Cargo.toml --all-targets --locked
      - name: Run warnings-denied Clippy
        run: cargo clippy --manifest-path tools/ev-nlr-profile-audit/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check out pinned upstream NLR source data and generator
        uses: actions/checkout@v4
        with:
          repository: NatLabRockies/hdev-depot-charging-2021
          ref: 61530df51f6cd7d64f014ebbf8714cef24c8ca70
          path: nlr-upstream
      - name: Verify pinned NLR revision
        run: |
          test "$(git -C nlr-upstream rev-parse HEAD)" = "61530df51f6cd7d64f014ebbf8714cef24c8ca70"
      - name: Reconstruct NLR source profiles with Rust
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nlr-source-replay"
          mkdir -p "$OUT/profiles"
          cargo run --quiet --manifest-path tools/ev-nlr-profile-audit/Cargo.toml --locked --bin ev-nlr-source-replay -- \
            --schedule-root nlr-upstream/data/fleet-schedules \
            --source-script nlr-upstream/src/depot_charging.py \
            --output-dir "$OUT/profiles" \
            --source-revision 61530df51f6cd7d64f014ebbf8714cef24c8ca70 \
            --report "$OUT/replay-report.json"
          jq -e '
            .report.source_revision == "61530df51f6cd7d64f014ebbf8714cef24c8ca70" and
            .report.generated_profile_count == 81 and
            .report.generated_total_interval_count == 7776 and
            .report.output_intervals == 96 and
            .report.archive_comparison_state == "not_performed_official_catalog_zip_not_supplied" and
            .report.candidate_evidence_class == "source_reconstructed_model_output" and
            (.report_sha256 | test("^[a-f0-9]{64}$")) and
            ([.report.profiles[].sha256] | length == 81)
          ' "$OUT/replay-report.json"
          test "$(find "$OUT/profiles" -maxdepth 1 -type f -name '*.csv' | wc -l)" -eq 81
          (cd "$OUT" && find profiles -maxdepth 1 -type f -name '*.csv' -print0 | sort -z | xargs -0 sha256sum) > "$OUT/profile-files.sha256"
          sha256sum "$OUT/replay-report.json" > "$OUT/replay-report.sha256"
      - name: Upload pinned-source NLR replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: ev-nlr-source-replay-v0-1
          path: |
            ${{ runner.temp }}/nlr-source-replay/profiles/*.csv
            ${{ runner.temp }}/nlr-source-replay/replay-report.json
            ${{ runner.temp }}/nlr-source-replay/replay-report.sha256
            ${{ runner.temp }}/nlr-source-replay/profile-files.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Generate synthetic 81-profile reference and candidate archives
        shell: bash
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/nlr-reference-synthetic"
          CAND="$RUNNER_TEMP/nlr-candidate-synthetic"
          mkdir -p "$REF" "$CAND"
          for fleet in fleet1-beverage-delivery fleet2-warehouse-delivery fleet3-food-delivery; do
            case "$fleet" in
              fleet1-beverage-delivery) fleet_index=0 ;;
              fleet2-warehouse-delivery) fleet_index=1 ;;
              fleet3-food-delivery) fleet_index=2 ;;
            esac
            for size in 10 50 100; do
              case "$size" in
                10) size_index=0 ;;
                50) size_index=1 ;;
                100) size_index=2 ;;
              esac
              for strategy in immediate delayed min_power; do
                case "$strategy" in
                  immediate) strategy_index=0 ;;
                  delayed) strategy_index=1 ;;
                  min_power) strategy_index=2 ;;
                esac
                for kind in avg-prof min-prof peak-prof; do
                  case "$kind" in
                    min-prof) kind_shift=0 ;;
                    avg-prof) kind_shift=1 ;;
                    peak-prof) kind_shift=2 ;;
                  esac
                  name="$fleet"_"$size"vehs_"$kind"_"$strategy"_15min.csv
                  printf 'time,avg_power_kw\n' > "$REF/$name"
                  printf 'time,avg_power_kw\n' > "$CAND/$name"
                  for interval in $(seq 0 95); do
                    hour=$((interval / 4))
                    minute=$(((interval % 4) * 15))
                    printf -v timestamp '%02d:%02d:00' "$hour" "$minute"
                    base=$(awk -v f="$fleet_index" -v s="$size_index" -v t="$strategy_index" -v k="$kind_shift" -v q="$interval" 'BEGIN { printf "%.6f", 8 + 2*f + 3*s + t + k + 0.01*q }')
                    candidate=$(awk -v b="$base" 'BEGIN { printf "%.6f", b + 0.5 }')
                    printf '%s,%s\n' "$timestamp" "$base" >> "$REF/$name"
                    printf '%s,%s\n' "$timestamp" "$candidate" >> "$CAND/$name"
                  done
                done
              done
            done
          done
      - name: Audit archive contract and compare candidate
        run: |
          cargo run --quiet --manifest-path tools/ev-nlr-profile-audit/Cargo.toml --locked -- \
            --reference-dir "$RUNNER_TEMP/nlr-reference-synthetic" \
            --candidate-dir "$RUNNER_TEMP/nlr-candidate-synthetic" \
            --candidate-id deterministic-half-kw-bias \
            --candidate-evidence-class simulated \
            --source-revision synthetic-fixture-v0.2 \
            --output nlr-profile-audit-report.json
          jq -e '.report.reference_profile_count == 81 and .report.expected_intervals_per_profile == 96 and .report.reference_total_interval_count == 7776 and .report.candidate_comparison.profile_count == 81 and .report.candidate_comparison.interval_count == 7776 and (.report.candidate_comparison.mean_absolute_error_kw - 0.5 | fabs < 0.000001) and (.report.candidate_comparison.mean_bias_kw - 0.5 | fabs < 0.000001) and (.report.candidate_comparison.load_duration_curve_mae_kw - 0.5 | fabs < 0.000001) and (.report.candidate_comparison.ramp_mae_kw_per_15min | fabs < 0.000001) and (.report.candidate_comparison.maximum_peak_time_absolute_error_minutes == 0)' nlr-profile-audit-report.json
          sha256sum nlr-profile-audit-report.json > nlr-profile-audit-report.sha256
      - name: Capture standalone lockfile digest
        run: |
          test -s tools/ev-nlr-profile-audit/Cargo.lock
          echo "e22782e8b2135fe5aaeaa97a7ee34baaec9e5970fe79d04d5b21dbda1ab8e8e9  tools/ev-nlr-profile-audit/Cargo.lock" | sha256sum --check
          sha256sum tools/ev-nlr-profile-audit/Cargo.lock > nlr-profile-audit-cargo-lock.sha256
      - name: Upload synthetic contract report, lockfile and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ev-nlr-profile-audit-synthetic
          path: |
            nlr-profile-audit-report.json
            nlr-profile-audit-report.sha256
            tools/ev-nlr-profile-audit/Cargo.lock
            nlr-profile-audit-cargo-lock.sha256
            tools/ev-nlr-profile-audit/schemas/ev_nlr_profile_audit_report_v0_2.schema.json
          if-no-files-found: error
          retention-days: 14
