name: LOCO Actuator Map Verification

on:
  pull_request:
    paths:
      - "research/loco-actuator-map-v0/**"
      - ".github/workflows/loco-actuator-map.yml"
  push:
    branches:
      - main
    paths:
      - "research/loco-actuator-map-v0/**"
      - ".github/workflows/loco-actuator-map.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/loco-actuator-map-v0/Cargo.toml -- --check
      - name: Run bounded map and loss fixtures
        run: cargo test --manifest-path research/loco-actuator-map-v0/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/loco-actuator-map-v0/Cargo.toml --locked --all-targets -- -D warnings
