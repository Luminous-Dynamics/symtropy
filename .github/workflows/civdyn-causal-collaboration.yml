name: CivDyn causal collaboration reference

on:
  pull_request:
    paths:
      - "research/civdyn-causal-collaboration/**"
      - ".github/workflows/civdyn-causal-collaboration.yml"
  push:
    paths:
      - "research/civdyn-causal-collaboration/**"
      - ".github/workflows/civdyn-causal-collaboration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute causal collaboration reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-causal-collaboration/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-causal-collaboration/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-causal-collaboration/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-causal-collaboration/Cargo.toml --all-targets

      - name: Execute synthetic causal collaboration fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-cce-evidence
          cargo run --locked --manifest-path research/civdyn-causal-collaboration/Cargo.toml --bin causal-collaboration-sweep \
            | tee target/civdyn-cce-evidence/causal-collaboration-sweep.csv

      - name: Verify CCE, PAC, evidence bounds and failure controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-cce-evidence/causal-collaboration-sweep.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 24, f"expected 24 records, got {len(rows)}"
          assert all(len(row) == 36 for row in rows), "each record must have 36 columns"
          summaries = {row["fixture_id"]: row for row in rows if row["record_type"] == "summary"}
          assert set(summaries) == {"successful_trace", "failed_trace"}

          successful = summaries["successful_trace"]
          assert successful["task_succeeded"] == "true"
          assert successful["action_count"] == "8"
          assert successful["verified_contributing_actions"] == "5"
          assert successful["candidate_inclusive_contributing_actions"] == "7"
          assert abs(float(successful["cce_verified_lower"]) - 0.625) < 1e-9
          assert abs(float(successful["cce_candidate_upper"]) - 0.875) < 1e-9
          assert successful["verified_cross_agent_causal_edges"] == "3"
          assert successful["candidate_inclusive_cross_agent_causal_edges"] == "5"
          assert successful["message_action_count"] == "2"
          assert successful["verified_contributing_messages"] == "0"
          assert successful["candidate_inclusive_contributing_messages"] == "2"
          assert successful["resource_transfer_action_count"] == "1"
          assert successful["duplicate_action_count"] == "1"

          failed = summaries["failed_trace"]
          assert failed["task_succeeded"] == "false"
          assert failed["cce_verified_lower"] == "0.000000"
          assert failed["cce_candidate_upper"] == "0.000000"
          assert failed["partial_success_ratio"] == "0.500000"

          agents = [row for row in rows if row["record_type"] == "agent"]
          assert len(agents) == 10
          idle = next(row for row in agents if row["fixture_id"] == "successful_trace" and row["agent_id"] == "idle")
          assert idle["agent_action_count"] == "0"
          assert idle["pac_verified_lower"] == ""
          miner = next(row for row in agents if row["fixture_id"] == "successful_trace" and row["agent_id"] == "miner")
          assert miner["pac_verified_lower"] == "0.500000"
          assert miner["pac_candidate_upper"] == "1.000000"

          edges = [row for row in rows if row["record_type"] == "causal_edge"]
          assert len(edges) == 12
          model_proposed = [row for row in edges if row["evidence_kind"] == "model_proposed"]
          assert len(model_proposed) == 2
          assert all(row["evidence_status"] == "candidate" for row in model_proposed)
          assert all(row["evidence_ref"] for row in edges)

          print("CIVDYN-CCE-001 CCE/PAC, verified-candidate bounds, evidence lineage and failed-task controls verified.")
          PY

          {
            echo "## CIVDYN-CCE-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-cce-evidence/causal-collaboration-sweep.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: synthetic graph-scoring fixtures only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload causal collaboration evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-causal-collaboration-sweep
          path: target/civdyn-cce-evidence/causal-collaboration-sweep.csv
          if-no-files-found: error
          retention-days: 30
