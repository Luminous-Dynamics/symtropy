name: Construction Space-Time Occupancy Index v0.2

on:
  pull_request:
    branches:
      - "research/construction-spacetime-occupancy-time-index-stack-v0-1"
    paths:
      - "research/construction-spacetime-occupancy-v0-1/**"
      - ".github/workflows/construction-observation-planning-v0-1.yml"
  push:
    branches:
      - "research/construction-spacetime-4d-candidate-index-v0-1"
    paths:
      - "research/construction-spacetime-occupancy-v0-1/**"
      - ".github/workflows/construction-observation-planning-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-spacetime-occupancy-time-index-v0-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Verify occupancy package metadata and committed lockfile
        run: cargo metadata --manifest-path research/construction-spacetime-occupancy-v0-1/Cargo.toml --locked --format-version 1
      - name: Occupancy formatting
        run: cargo fmt --manifest-path research/construction-spacetime-occupancy-v0-1/Cargo.toml -- --check
      - name: Occupancy tests
        run: cargo test --manifest-path research/construction-spacetime-occupancy-v0-1/Cargo.toml --locked
      - name: Occupancy strict Clippy
        run: cargo clippy --manifest-path research/construction-spacetime-occupancy-v0-1/Cargo.toml --locked --all-targets -- -D warnings
      - name: Occupancy scale benchmark
        if: runner.os == 'Linux'
        run: cargo bench --manifest-path research/construction-spacetime-occupancy-v0-1/Cargo.toml --locked --bench scale
