name: World State to Pixel Contract

on:
  push:
    branches: ["research/world-state-to-pixel-v0"]
    paths:
      - "benchmarks/world-state-to-pixel/**"
      - "tools/world-state-to-pixel-validator/**"
      - ".github/workflows/world-state-to-pixel-contract.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "benchmarks/world-state-to-pixel/**"
      - "tools/world-state-to-pixel-validator/**"
      - ".github/workflows/world-state-to-pixel-contract.yml"

permissions:
  contents: read

concurrency:
  group: world-state-to-pixel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Validate Rust formatting
        run: cargo +1.97.1 fmt --manifest-path tools/world-state-to-pixel-validator/Cargo.toml -- --check
      - name: Run contract tests
        run: cargo +1.97.1 test --manifest-path tools/world-state-to-pixel-validator/Cargo.toml
      - name: Validate the committed benchmark manifest
        run: cargo +1.97.1 run --manifest-path tools/world-state-to-pixel-validator/Cargo.toml -- benchmarks/world-state-to-pixel/v0.1/manifest.json
      - name: Run strict Clippy
        run: cargo +1.97.1 clippy --manifest-path tools/world-state-to-pixel-validator/Cargo.toml --all-targets -- -D warnings
