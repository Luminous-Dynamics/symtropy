name: lighting-power-operating-characteristics

on:
  pull_request:
    paths:
      - "tools/lighting-study-plan/**"
      - "docs/research/LIGHTING_POWER_AND_SCENE_FAMILY_PLANNING_V0_1.md"
      - "docs/research/LIGHTING_POWER_OPERATING_CHARACTERISTICS_V0_1.md"
      - ".github/workflows/lighting-study-plan.yml"
      - ".github/workflows/lighting-power-operating-characteristics.yml"
  push:
    paths:
      - "tools/lighting-study-plan/**"
      - "docs/research/LIGHTING_POWER_AND_SCENE_FAMILY_PLANNING_V0_1.md"
      - "docs/research/LIGHTING_POWER_OPERATING_CHARACTERISTICS_V0_1.md"
      - ".github/workflows/lighting-study-plan.yml"
      - ".github/workflows/lighting-power-operating-characteristics.yml"

permissions:
  contents: read

jobs:
  standard-library-statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run planner and simulation tests
        run: |
          cd tools/lighting-study-plan
          python3 -m unittest -v test_plan_independent_scene_families test_simulate_power_operating_characteristics test_compare_mean_inference_methods test_mnar_sensitivity_audit test_mar_adjustment_and_mnar_tipping
      - name: Smoke-test synthetic operating-characteristic output
        run: |
          python3 tools/lighting-study-plan/simulate_power_operating_characteristics.py \
            tools/lighting-study-plan/fixtures/synthetic-plan-output-example.json \
            --replicates 500 --seed 20261028 \
            --output /tmp/lighting-operating-characteristics.json
          python3 -m json.tool /tmp/lighting-operating-characteristics.json > /dev/null
          grep -q 'synthetic_simulation_diagnostics_no_empirical_claim' /tmp/lighting-operating-characteristics.json
          grep -q 'independent_scene_family' /tmp/lighting-operating-characteristics.json
          grep -q 'skewed_lognormal_left' /tmp/lighting-operating-characteristics.json
      - name: Smoke-test mean-inference method stress suite
        run: |
          python3 tools/lighting-study-plan/compare_mean_inference_methods.py \
            --replicates 200 --bootstrap-replicates 99 --seed 20261028 \
            --output /tmp/lighting-mean-inference-methods.json
          python3 -m json.tool /tmp/lighting-mean-inference-methods.json > /dev/null
          grep -q 'synthetic_inference_method_diagnostics_no_empirical_claim' /tmp/lighting-mean-inference-methods.json
          grep -q 'studentized_bootstrap_t' /tmp/lighting-mean-inference-methods.json
      - name: Smoke-test informative-missingness sensitivity
        run: |
          python3 tools/lighting-study-plan/mnar_sensitivity_audit.py \
            --replicates 250 --seed 20261028 --sample-sizes 10,20 \
            --output /tmp/lighting-mnar-sensitivity.json
          python3 -m json.tool /tmp/lighting-mnar-sensitivity.json > /dev/null
          grep -q 'synthetic_missingness_sensitivity_diagnostics_no_empirical_claim' /tmp/lighting-mnar-sensitivity.json
          grep -q 'bounded_worst_case_hoeffding' /tmp/lighting-mnar-sensitivity.json
      - name: Smoke-test MAR adjustment and MNAR tipping
        run: |
          python3 tools/lighting-study-plan/mar_adjustment_and_mnar_tipping.py \
            --replicates 200 --seed 20261028 --sample-sizes 10,20 \
            --output /tmp/lighting-mar-mnar-tipping.json
          python3 -m json.tool /tmp/lighting-mar-mnar-tipping.json > /dev/null
          grep -q 'synthetic_missingness_adjustment_diagnostics_no_empirical_claim' /tmp/lighting-mar-mnar-tipping.json
          grep -q 'missing_mean_tipping_delta_pp' /tmp/lighting-mar-mnar-tipping.json


