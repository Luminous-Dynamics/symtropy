name: Design Qualification

on:
  push:
    branches:
      - "design/**"
      - "analysis/**"
    paths:
      - "crates/domains/symtropy-design/**"
      - "crates/domains/symtropy-design-requirements/**"
      - "crates/domains/symtropy-analysis-contracts/**"
      - "crates/domains/symtropy-analysis-qualification/**"
      - ".github/workflows/design-qualification.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/domains/symtropy-design/**"
      - "crates/domains/symtropy-design-requirements/**"
      - "crates/domains/symtropy-analysis-contracts/**"
      - "crates/domains/symtropy-analysis-qualification/**"
      - ".github/workflows/design-qualification.yml"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: design-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  design-contracts:
    name: Design + Analysis Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check contracts
        run: |
          cargo check -p symtropy-design --all-targets
          cargo check -p symtropy-design-requirements --all-targets
          cargo check -p symtropy-analysis-contracts --all-targets
          cargo check -p symtropy-analysis-qualification --all-targets

      - name: Test contracts
        run: |
          cargo test -p symtropy-design
          cargo test -p symtropy-design-requirements
          cargo test -p symtropy-analysis-contracts
          cargo test -p symtropy-analysis-qualification

      - name: Clippy contracts
        run: |
          cargo clippy -p symtropy-design --all-targets -- -D warnings
          cargo clippy -p symtropy-design-requirements --all-targets -- -D warnings
          cargo clippy -p symtropy-analysis-contracts --all-targets -- -D warnings
          cargo clippy -p symtropy-analysis-qualification --all-targets -- -D warnings
