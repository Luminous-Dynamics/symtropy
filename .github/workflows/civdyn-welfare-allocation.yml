name: CivDyn welfare allocation reference

on:
  pull_request:
    paths:
      - "research/civdyn-welfare-allocation/**"
      - ".github/workflows/civdyn-welfare-allocation.yml"
  push:
    paths:
      - "research/civdyn-welfare-allocation/**"
      - ".github/workflows/civdyn-welfare-allocation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute welfare allocation benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-welfare-allocation/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-welfare-allocation/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-welfare-allocation/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-welfare-allocation/Cargo.toml --all-targets

      - name: Execute the exact allocation and rhetoric-control sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-swf-evidence
          cargo run --locked --manifest-path research/civdyn-welfare-allocation/Cargo.toml --bin welfare-allocation-sweep \
            | tee target/civdyn-swf-evidence/welfare-allocation-sweep.csv

      - name: Verify allocation floors, Pareto and rhetoric invariance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-swf-evidence/welfare-allocation-sweep.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert rows, "sweep must emit data"
          assert all(len(row) == 16 for row in rows), "all records must have 16 columns"

          summaries = {
              row["policy"]: row
              for row in rows
              if row["record_type"] == "summary"
          }
          for policy in (
              "verified_utilitarian",
              "max_min_coverage",
              "leximin_coverage",
              "equal_coverage",
              "persuasion_susceptible",
          ):
              row = summaries[policy]
              assert int(row["total_allocated"]) == 16
              assert int(row["floor_violations"]) == 0, f"{policy} violated a hard floor"

          assert int(summaries["floor_blind_utilitarian"]["floor_violations"]) > 0

          allocation = {}
          for row in rows:
              if row["record_type"] == "allocation":
                  allocation.setdefault(row["policy"], {})[row["recipient_id"]] = int(row["allocation"])

          assert allocation["verified_utilitarian"] != allocation["persuasion_susceptible"]

          control = next(row for row in rows if row["record_type"] == "rhetoric_control")
          assert control["decision_invariant"] == "true", "verified policy changed under rhetoric-only input"

          frontier = [row for row in rows if row["record_type"] == "pareto"]
          assert len(frontier) >= 2, f"expected >=2 Pareto points, got {len(frontier)}"

          print("CIVDYN-SWF-001 floors, exact allocation budget, Pareto frontier and rhetoric-invariance controls verified.")
          PY

          {
            echo "## CIVDYN-SWF-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-swf-evidence/welfare-allocation-sweep.csv | cut -d' ' -f1)"
            echo "- Pareto and persuasion-control checks: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload welfare-allocation run evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-welfare-allocation-sweep
          path: target/civdyn-swf-evidence/welfare-allocation-sweep.csv
          if-no-files-found: error
          retention-days: 30
