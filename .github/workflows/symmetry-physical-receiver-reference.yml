name: Symmetry physical receiver reference

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/symmetry-physical-receiver-001/**"
      - ".github/workflows/symmetry-physical-receiver-reference.yml"
  push:
    branches: [main]
    paths:
      - "research/symmetry-physical-receiver-001/**"
      - ".github/workflows/symmetry-physical-receiver-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symmetry-physical-receiver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path research/symmetry-physical-receiver-001/Cargo.toml --all -- --check
      # Capture an exact, isolated-crate lockfile reconciliation when the
      # committed transitive resolution is stale. The following test still
      # uses --locked against the regenerated artifact in this same job.
      - name: Reconcile and snapshot receiver lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path research/symmetry-physical-receiver-001/Cargo.toml
          cp research/symmetry-physical-receiver-001/Cargo.lock "$RUNNER_TEMP/receiver-Cargo.lock"
          git diff -- research/symmetry-physical-receiver-001/Cargo.lock > "$RUNNER_TEMP/receiver-Cargo.lock.diff"
          echo "receiver_lock_sha256=$(sha256sum "$RUNNER_TEMP/receiver-Cargo.lock" | cut -d' ' -f1)"
          echo "receiver_lock_diff_bytes=$(wc -c < "$RUNNER_TEMP/receiver-Cargo.lock.diff")"
      - name: Upload receiver lockfile reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: symmetry-physical-receiver-lockfile-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/receiver-Cargo.lock
            ${{ runner.temp }}/receiver-Cargo.lock.diff
          if-no-files-found: error
      - name: Test exact receiver contract
        run: cargo test --locked --manifest-path research/symmetry-physical-receiver-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/symmetry-physical-receiver-001/Cargo.toml --all-targets -- -D warnings
      - name: Validate handoff schema and synthetic schema fixture
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path("research/symmetry-physical-receiver-001")
          schema = json.loads((root / "symmetry-physical-handoff-v0.1.schema.json").read_text())
          package_schema = json.loads((root / "receiver-package-v0.1.schema.json").read_text())
          fixture = json.loads((root / "fixtures/synthetic-handoff-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator.check_schema(package_schema)
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          assert not errors, errors
          assert fixture["receiver_verification"]["status"] == "INCONCLUSIVE"
          assert fixture["claims"]["physical_equivalence_authority"] == "NONE"
          assert fixture["claims"]["scientific_search_pruning_authorized"] is False
          PY
