name: Pose observability FIM contract

on:
  pull_request:
    paths:
      - "tools/pose-observability-bench/**"
      - ".github/workflows/pose-observability-fim.yml"
  push:
    branches:
      - main
    paths:
      - "tools/pose-observability-bench/**"
      - ".github/workflows/pose-observability-fim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fim-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/pose-observability-bench/Cargo.toml -- --check
      - name: Unit and degeneracy tests
        run: cargo test --manifest-path tools/pose-observability-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/pose-observability-bench/Cargo.toml --all-targets -- -D warnings
