name: Pose observability FIM contract

on:
  pull_request:
    paths:
      - "tools/pose-observability-bench/**"
      - "scripts/pose-observability-challenger.py"
      - "research/spacecraft/pose-observability/fixtures/**"
      - ".github/workflows/pose-observability-fim.yml"
  push:
    branches:
      - main
    paths:
      - "tools/pose-observability-bench/**"
      - "scripts/pose-observability-challenger.py"
      - "research/spacecraft/pose-observability/fixtures/**"
      - ".github/workflows/pose-observability-fim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fim-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/pose-observability-bench/Cargo.toml -- --check
      - name: Unit and degeneracy tests
        run: cargo test --manifest-path tools/pose-observability-bench/Cargo.toml
      - name: Independent Python/Rust parity
        run: |
          set -euo pipefail
          for fixture in \
            research/spacecraft/pose-observability/fixtures/diverse-full-rank-v0.1.json \
            research/spacecraft/pose-observability/fixtures/on-axis-degenerate-v0.1.json \
            research/spacecraft/pose-observability/fixtures/collinear-degenerate-v0.1.json \
            research/spacecraft/pose-observability/fixtures/common-correspondence-bias-v0.1.json; do
            rust_output="$(mktemp)"
            cargo run --quiet --manifest-path tools/pose-observability-bench/Cargo.toml -- --input "$fixture" > "$rust_output"
            python3 scripts/pose-observability-challenger.py --input "$fixture" --compare "$rust_output"
            rm -f "$rust_output"
          done
      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/pose-observability-bench/Cargo.toml --all-targets -- -D warnings
