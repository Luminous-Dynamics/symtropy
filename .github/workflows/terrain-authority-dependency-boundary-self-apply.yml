name: Terrain authority dependency boundary self-apply

on:
  push:
    branches:
      - terrain/authority-dependency-boundary-v0.1
    paths:
      - scripts/terrain-harden-authority-dependency-boundary.py
      - .github/workflows/terrain-authority-dependency-boundary-self-apply.yml
      - .github/workflows/terrain-authority-dependency-boundary-qualification.yml

permissions:
  contents: write

jobs:
  qualify-and-freeze:
    name: Qualify and freeze Terrain authority dependency boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact pre-product subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bind exact pre-product lineage
        shell: bash
        run: |
          set -euo pipefail
          base=e707113651e302f7c61c5542483104af352cb3d0
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${base}"
          test "$(git rev-parse HEAD:scripts/terrain-harden-authority-dependency-boundary.py)" = "0b2db043413cc53c1bcffd1aa8372c9caefe18cd"
          test "$(git rev-parse ${base}:crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          changed="$(git diff --name-only "${base}"..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/terrain-authority-dependency-boundary-qualification.yml \
            .github/workflows/terrain-authority-dependency-boundary-self-apply.yml \
            scripts/terrain-harden-authority-dependency-boundary.py | sort)"
          test "${changed}" = "${expected}"
          echo "TERRAIN_BOUNDARY_INPUT_HEAD=${GITHUB_SHA}"
          echo "TERRAIN_BOUNDARY_INPUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "TERRAIN_BOUNDARY_INPUT_LOCK_BLOB=$(git hash-object Cargo.lock)"

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"

      - name: Apply exact authority-boundary transform
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/terrain-harden-authority-dependency-boundary.py
          cargo fmt --package symtropy-terrain --package symtropy-rapier3d-bridge --package symthaea-bevy-brain
          git diff --check
          test "$(git hash-object crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"

      - name: Refresh and freeze dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > "${RUNNER_TEMP}/terrain-boundary-metadata.json"
          echo "TERRAIN_BOUNDARY_LOCK_BLOB=$(git hash-object Cargo.lock)"
          echo "TERRAIN_BOUNDARY_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          echo "TERRAIN_BOUNDARY_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/terrain-boundary-metadata.json" | awk '{print $1}')"
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/terrain-boundary-metadata-locked.json"

      - name: Prove authority dependency closures
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p symtropy-terrain --locked -e features > "${RUNNER_TEMP}/terrain-tree.txt"
          for forbidden in 'symtropy-physics-gpu' 'symthaea-bevy-brain' 'naga v27.0.3' 'codespan-reporting v0.12.0'; do
            if grep -Fq "${forbidden}" "${RUNNER_TEMP}/terrain-tree.txt"; then
              echo "forbidden Terrain dependency remains: ${forbidden}" >&2
              exit 1
            fi
          done
          grep -Fq 'naga v29.0.4' "${RUNNER_TEMP}/terrain-tree.txt"

          cargo tree -p symthaea-bevy-brain --locked -e features > "${RUNNER_TEMP}/brain-tree.txt"
          grep -Fq 'naga v27.0.3' "${RUNNER_TEMP}/brain-tree.txt"
          grep -Fq 'naga v29.0.4' "${RUNNER_TEMP}/brain-tree.txt"
          grep -Fq 'naga feature "termcolor"' "${RUNNER_TEMP}/brain-tree.txt"
          grep -Fq 'codespan-reporting feature "termcolor"' "${RUNNER_TEMP}/brain-tree.txt"

          echo "TERRAIN_BOUNDARY_TERRAIN_TREE_SHA256=$(sha256sum "${RUNNER_TEMP}/terrain-tree.txt" | awk '{print $1}')"
          echo "TERRAIN_BOUNDARY_BRAIN_TREE_SHA256=$(sha256sum "${RUNNER_TEMP}/brain-tree.txt" | awk '{print $1}')"

      - name: Check affected compilation surfaces
        shell: bash
        run: |
          set -euo pipefail
          cargo check \
            -p symtropy-terrain \
            -p symthaea-bevy-brain \
            -p symtropy-rapier3d-bridge \
            -p symtropy-physics-gpu \
            --locked --all-targets

      - name: Test affected product crates
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            -p symtropy-terrain \
            -p symthaea-bevy-brain \
            -p symtropy-rapier3d-bridge \
            --locked

      - name: Strict Clippy on modified crates
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy \
            -p symtropy-terrain \
            -p symthaea-bevy-brain \
            -p symtropy-rapier3d-bridge \
            --locked --all-targets -- -D warnings

      - name: Require exact product delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            Cargo.lock \
            crates/bridges/symthaea-bevy-brain/Cargo.toml \
            crates/bridges/symtropy-rapier3d-bridge/Cargo.toml \
            crates/domains/symtropy-terrain/Cargo.toml \
            crates/domains/symtropy-terrain/src/lib.rs | sort)"
          test "${changed}" = "${expected}"
          test "$(git hash-object crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          git diff --check

      - name: Publish frozen qualified product
        shell: bash
        run: |
          set -euo pipefail
          branch=terrain/authority-dependency-boundary-v0.1
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Cargo.lock \
            crates/bridges/symthaea-bevy-brain/Cargo.toml \
            crates/bridges/symtropy-rapier3d-bridge/Cargo.toml \
            crates/domains/symtropy-terrain/Cargo.toml \
            crates/domains/symtropy-terrain/src/lib.rs
          git commit -m "refactor(terrain): harden authority dependency boundary"
          product_head="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse HEAD^{tree})"
          echo "TERRAIN_BOUNDARY_PRODUCT_HEAD=${product_head}"
          echo "TERRAIN_BOUNDARY_PRODUCT_TREE=${product_tree}"
          echo "TERRAIN_BOUNDARY_PRODUCT_LOCK_BLOB=$(git hash-object Cargo.lock)"
          git push origin "HEAD:${branch}"
