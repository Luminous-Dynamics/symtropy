name: Airborne Energy Observability

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/airborne-energy-observability-validator/**"
      - "research/airborne-energy-observability-v0/**"
      - ".github/workflows/airborne-energy-observability.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/airborne-energy-observability-validator/**"
      - "research/airborne-energy-observability-v0/**"
      - ".github/workflows/airborne-energy-observability.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --manifest-path tools/airborne-energy-observability-validator/Cargo.toml -- --check
      - name: Run observability oracle tests
        run: cargo test --locked --manifest-path tools/airborne-energy-observability-validator/Cargo.toml
      - name: Validate positive synthetic fixture
        run: cargo run --locked --manifest-path tools/airborne-energy-observability-validator/Cargo.toml -- research/airborne-energy-observability-v0/observability.unique.synthetic.json
