name: EV Factory Discrete-Event Simulation
on:
  pull_request:
    paths:
      - "tools/ev-passenger-cost-frontier/src/bin/ev_factory_simulation.rs"
      - "tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json"
      - "docs/research/PCB_CELL_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_COMMON_RANDOM_STREAMS_V0_1.md"
      - "docs/research/EV_FACTORY_REPLICATION_STATISTICS_V0_1.md"
      - "docs/research/EV_FACTORY_SEQUENCE_AWARE_FLOW_V0_1.md"
      - "docs/research/EV_FACTORY_DISPATCH_POLICY_V0_1.md"
      - "docs/research/EV_FACTORY_DISPATCH_BENCHMARK_LITERATURE_V0_1.md"
      - "docs/research/EV_FACTORY_QUEUE_AGE_FAIRNESS_FRONTIER_V0_1.md"
      - ".github/workflows/ev-factory-simulation.yml"
  push:
    branches: [main]
    paths:
      - "tools/ev-passenger-cost-frontier/src/bin/ev_factory_simulation.rs"
      - "tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json"
      - "docs/research/PCB_CELL_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_COMMON_RANDOM_STREAMS_V0_1.md"
      - "docs/research/EV_FACTORY_REPLICATION_STATISTICS_V0_1.md"
      - "docs/research/EV_FACTORY_SEQUENCE_AWARE_FLOW_V0_1.md"
      - "docs/research/EV_FACTORY_DISPATCH_POLICY_V0_1.md"
      - "docs/research/EV_FACTORY_DISPATCH_BENCHMARK_LITERATURE_V0_1.md"
      - "docs/research/EV_FACTORY_QUEUE_AGE_FAIRNESS_FRONTIER_V0_1.md"
      - ".github/workflows/ev-factory-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Parse fixture
        run: |
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .schema_version == "0.1.0"
            and (.stations | length) == 5
            and (.buffer_capacities | length) == 4
            and (.stations | all(.[]; .servers > 0 and .good_yield_fraction > 0 and .good_yield_fraction <= 1))
            and .dispatch_policy == "fifo"
            and .maximum_consecutive_skips == 3
            and .maximum_queue_age_seconds == 900
            and (.replication_seeds | length) == 20
            and .replication_seeds[0] == .seed
            and ((.replication_seeds | unique | length) == 20)
            and .input_evidence_class == "synthetic"
            and .calibration_gate == "unknown"
            and .local_compliance_gate == "unknown"
            and .line_safety_gate == "unknown"
            and .product_quality_release_gate == "unknown"
          ' tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json
      - name: Parse PCB cell fixtures
        run: |
          for fixture in \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json; do
            jq empty "$fixture"
            jq -e '
              .schema_version == "0.1.0"
              and (.benchmark_id | startswith("PCB-CELL-"))
              and .seed > 0
              and .horizon_seconds > .warmup_seconds
              and .productive_seconds_per_year > 0
              and .variant_count > 0
              and .variant_batch_size > 0
              and (.stations | length) >= 2
              and (.buffer_capacities | length) == ((.stations | length) - 1)
              and (.stations | all(.[]; .servers > 0 and .good_yield_fraction > 0 and .good_yield_fraction <= 1))
              and (.input_evidence_class == "synthetic")
              and .calibration_gate == "unknown"
              and .local_compliance_gate == "unknown"
              and .line_safety_gate == "unknown"
              and .product_quality_release_gate == "unknown"
              and (.claim_ceiling | contains("Synthetic"))
            ' "$fixture"
          done
      - name: Format check
        run: cargo fmt --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml -- --check
      - name: Full Rust package tests
        run: cargo test --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml
      - name: Run benchmark and assert simulation invariants
        run: |
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
            > ev-factory-simulation-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .random_stream_policy == "entity_keyed_service_quality_failure; dedicated_supplier_arrival_stream"
            and .dispatch_policy == "fifo"
            and .maximum_consecutive_skips == 3
            and .maximum_queue_age_seconds == 900
            and all(.scenarios[]; .dispatch_policy == "fifo" and .maximum_consecutive_skips == 3 and .maximum_queue_age_seconds == 900 and (.variant_wait_statistics | length) == 3)
            and all(.scenario_statistics[]; ((.variant_wait_statistics | length) == 3) and all(.variant_wait_statistics[]; .sample_count.sample_count == 20))
            and .replication_count == 20
            and (.replication_seeds | length) == 20
            and (.scenario_statistics | length) == 6
            and (.station_sequence_statistics | length) == 30
            and all(.station_sequence_statistics[]; .changeovers_started.sample_count == 20 and .output_transfers.sample_count == 20 and .out_of_order_output_transfers.sample_count == 20 and .out_of_order_output_transfers.mean <= .output_transfers.mean)
            and all(.scenario_statistics[]; .good_units_per_hour.sample_count == 20)
            and all(.scenario_statistics[] | select(.scenario_id != "baseline"); .paired_good_units_per_hour_delta_vs_baseline.sample_count == 20 and .paired_good_units_per_hour_delta_vs_baseline.mean_confidence_95_lower != null and .paired_good_units_per_hour_delta_vs_baseline.mean_confidence_95_upper != null)
            and .scenario_count == 6
            and .measured_horizon_seconds == 518400
            and .input_evidence_class == "synthetic"
            and .release_ready == false
            and .output_never_exceeds_released_input
            and .all_buffers_respected_capacity
            and .station_time_accounting_within_horizon
            and (.scenarios | length) == 6
            and .scenarios[0].scenario_id == "baseline"
            and (.scenarios[0].stations | length) == 5
            and (.scenarios[0].interstation_buffers | length) == 4
            and all(.scenarios[]; .good_units_total <= .released_jobs_total)
            and all(.scenarios[]; .release_ready == false and .all_buffers_respected_capacity and .station_time_accounting_within_horizon)
            and all(.scenarios[]; all(.stations[]; .accounted_fraction >= 0 and .accounted_fraction <= 1.000001))
            and all(.scenarios[1:][]; .added_servers == 1 and .intervention_station_id != null)
          ' ev-factory-simulation-report.json
      - name: Compare FIFO and bounded changeover-aware dispatch on paired seeds
        run: |
          jq '.dispatch_policy = "minimize_changeover"' \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json > ev-factory-variant-aware.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            ev-factory-variant-aware.json > ev-factory-variant-aware-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .dispatch_policy == "minimize_changeover"
            and .maximum_consecutive_skips == 3
            and .maximum_queue_age_seconds == 900
            and .replication_count == 20
            and (.replication_seeds | length) == 20
            and (.scenario_statistics | length) == 6
            and (.station_sequence_statistics | length) == 30
            and .release_ready == false
            and .output_never_exceeds_released_input
            and .all_buffers_respected_capacity
            and .station_time_accounting_within_horizon
            and all(.scenarios[]; .dispatch_policy == "minimize_changeover" and .good_units_total <= .released_jobs_total and .release_ready == false and .all_buffers_respected_capacity and .station_time_accounting_within_horizon)
            and all(.scenario_statistics[]; ((.variant_wait_statistics | length) == 3) and all(.variant_wait_statistics[]; .sample_count.sample_count == 20))
          ' ev-factory-variant-aware-report.json

          jq -n --slurpfile fifo ev-factory-simulation-report.json --slurpfile aware ev-factory-variant-aware-report.json '
            def paired_summary($values):
              ($values | length) as $n
              | ($values | add / $n) as $mean
              | (if $n > 1
                 then ([$values[] | (. - $mean) * (. - $mean)] | add / ($n - 1) | sqrt)
                 else 0 end) as $sd
              | (if $n > 1 then 2.093 else null end) as $t
              | {
                  sample_count: $n,
                  mean: $mean,
                  sample_standard_deviation: (if $n > 1 then $sd else null end),
                  mean_confidence_95_lower: (if $n > 1 then $mean - $t * $sd / ($n | sqrt) else null end),
                  mean_confidence_95_upper: (if $n > 1 then $mean + $t * $sd / ($n | sqrt) else null end)
                };

            ($fifo[0].replication_scenario_records | sort_by(.seed, .scenario_id) | map([.seed, .scenario_id])) as $fifo_keys
            | ($aware[0].replication_scenario_records | sort_by(.seed, .scenario_id) | map([.seed, .scenario_id])) as $aware_keys
            | {
              schema_version: "ev-factory-dispatch-policy-comparison/0.2",
              benchmark_id: $fifo[0].benchmark_id,
              fifo_dispatch_policy: $fifo[0].dispatch_policy,
              variant_aware_dispatch_policy: $aware[0].dispatch_policy,
              maximum_queue_age_seconds: $fifo[0].maximum_queue_age_seconds,
              variant_aware_maximum_queue_age_seconds: $aware[0].maximum_queue_age_seconds,
              maximum_queue_age_matches: ($fifo[0].maximum_queue_age_seconds == $aware[0].maximum_queue_age_seconds),
              replication_seeds_equal: ($fifo[0].replication_seeds == $aware[0].replication_seeds),
              replication_records_matched_by_seed_and_scenario: ($fifo_keys == $aware_keys),
              replication_count: $fifo[0].replication_count,
              scenario_pairs: [
                $fifo[0].scenario_statistics[] as $f |
                ($aware[0].scenario_statistics[] | select(.scenario_id == $f.scenario_id)) as $a |
                ($fifo[0].replication_scenario_records | map(select(.scenario_id == $f.scenario_id)) | sort_by(.seed)) as $fr |
                ($aware[0].replication_scenario_records | map(select(.scenario_id == $f.scenario_id)) | sort_by(.seed)) as $ar |
                ([
                  range(0; ($fr | length)) as $i |
                  {
                    seed: $fr[$i].seed,
                    good_units_per_hour_delta: ($ar[$i].measured_good_units_per_hour - $fr[$i].measured_good_units_per_hour),
                    total_good_units_delta: ($ar[$i].good_units_total - $fr[$i].good_units_total),
                    scrap_delta: ($ar[$i].scrapped_jobs_total - $fr[$i].scrapped_jobs_total),
                    rework_delta: ($ar[$i].measured_rework_attempts - $fr[$i].measured_rework_attempts),
                    variant_wait_deltas: [
                      range(0; ($fr[$i].variant_wait_statistics | length)) as $v |
                      {
                        variant: $fr[$i].variant_wait_statistics[$v].variant,
                        average_wait_delta_seconds: (
                          $ar[$i].variant_wait_statistics[$v].average_wait_seconds
                          - $fr[$i].variant_wait_statistics[$v].average_wait_seconds
                        ),
                        p95_wait_delta_seconds: (
                          $ar[$i].variant_wait_statistics[$v].p95_wait_seconds
                          - $fr[$i].variant_wait_statistics[$v].p95_wait_seconds
                        ),
                        maximum_wait_delta_seconds: (
                          $ar[$i].variant_wait_statistics[$v].maximum_wait_seconds
                          - $fr[$i].variant_wait_statistics[$v].maximum_wait_seconds
                        )
                      }
                    ]
                  }
                ]) as $paired |
                {
                  scenario_id: $f.scenario_id,
                  fifo_good_units_per_hour_mean: $f.good_units_per_hour.mean,
                  variant_aware_good_units_per_hour_mean: $a.good_units_per_hour.mean,
                  unpaired_difference_of_means_units_per_hour: ($a.good_units_per_hour.mean - $f.good_units_per_hour.mean),
                  paired_good_units_per_hour_delta_ci95: paired_summary([$paired[].good_units_per_hour_delta]),
                  paired_total_good_units_delta_ci95: paired_summary([$paired[].total_good_units_delta]),
                  paired_scrap_delta_ci95: paired_summary([$paired[].scrap_delta]),
                  paired_rework_delta_ci95: paired_summary([$paired[].rework_delta]),
                  paired_seed_deltas: $paired,
                  per_variant_paired_wait_deltas: [
                    range(0; ($f.variant_wait_statistics | length)) as $v |
                    {
                      variant: $f.variant_wait_statistics[$v].variant,
                      average_wait_delta_ci95_seconds: paired_summary([$paired[].variant_wait_deltas[$v].average_wait_delta_seconds]),
                      p95_wait_delta_ci95_seconds: paired_summary([$paired[].variant_wait_deltas[$v].p95_wait_delta_seconds]),
                      maximum_wait_delta_ci95_seconds: paired_summary([$paired[].variant_wait_deltas[$v].maximum_wait_delta_seconds])
                    }
                  ]
                }
              ],
              station_pairs: [
                $fifo[0].station_sequence_statistics[] as $f |
                ($aware[0].station_sequence_statistics[] | select(.scenario_id == $f.scenario_id and .station_id == $f.station_id)) as $a |
                ($fifo[0].replication_scenario_records | map(select(.scenario_id == $f.scenario_id)) | sort_by(.seed)) as $fr |
                ($aware[0].replication_scenario_records | map(select(.scenario_id == $f.scenario_id)) | sort_by(.seed)) as $ar |
                ([
                  range(0; ($fr | length)) as $i |
                  ($fr[$i].stations | map(select(.station_id == $f.station_id)) | .[0]) as $fs |
                  ($ar[$i].stations | map(select(.station_id == $f.station_id)) | .[0]) as $as |
                  {
                    seed: $fr[$i].seed,
                    changeovers_delta: ($as.changeovers_started - $fs.changeovers_started),
                    output_transfers_delta: ($as.output_transfers - $fs.output_transfers),
                    out_of_order_transfers_delta: ($as.out_of_order_output_transfers - $fs.out_of_order_output_transfers)
                  }
                ]) as $paired |
                {
                  scenario_id: $f.scenario_id,
                  station_id: $f.station_id,
                  fifo_mean_changeovers: $f.changeovers_started.mean,
                  variant_aware_mean_changeovers: $a.changeovers_started.mean,
                  unpaired_difference_mean_changeovers: ($a.changeovers_started.mean - $f.changeovers_started.mean),
                  paired_changeovers_delta_ci95: paired_summary([$paired[].changeovers_delta]),
                  paired_output_transfers_delta_ci95: paired_summary([$paired[].output_transfers_delta]),
                  fifo_mean_out_of_order_transfers: $f.out_of_order_output_transfers.mean,
                  variant_aware_mean_out_of_order_transfers: $a.out_of_order_output_transfers.mean,
                  paired_out_of_order_transfers_delta_ci95: paired_summary([$paired[].out_of_order_transfers_delta]),
                  paired_seed_deltas: $paired
                }
              ],
              linewide_paired_totals: [
                $fifo[0].scenario_statistics[] as $f |
                ($fifo[0].replication_scenario_records | map(select(.scenario_id == $f.scenario_id)) | sort_by(.seed)) as $fr |
                ($aware[0].replication_scenario_records | map(select(.scenario_id == $f.scenario_id)) | sort_by(.seed)) as $ar |
                ([
                  range(0; ($fr | length)) as $i |
                  {
                    seed: $fr[$i].seed,
                    total_changeovers_delta: (
                      [$fr[$i].stations[] as $fs |
                        ($ar[$i].stations[] | select(.station_id == $fs.station_id)) as $as |
                        ($as.changeovers_started - $fs.changeovers_started)
                      ] | add
                    ),
                    total_output_transfers_delta: (
                      [$fr[$i].stations[] as $fs |
                        ($ar[$i].stations[] | select(.station_id == $fs.station_id)) as $as |
                        ($as.output_transfers - $fs.output_transfers)
                      ] | add
                    ),
                    total_order_inversions_delta: (
                      [$fr[$i].stations[] as $fs |
                        ($ar[$i].stations[] | select(.station_id == $fs.station_id)) as $as |
                        ($as.out_of_order_output_transfers - $fs.out_of_order_output_transfers)
                      ] | add
                    )
                  }
                ]) as $paired |
                {
                  scenario_id: $f.scenario_id,
                  paired_total_changeovers_delta_ci95: paired_summary([$paired[].total_changeovers_delta]),
                  paired_total_output_transfers_delta_ci95: paired_summary([$paired[].total_output_transfers_delta]),
                  paired_total_order_inversions_delta_ci95: paired_summary([$paired[].total_order_inversions_delta]),
                  paired_seed_totals: $paired
                }
              ],
              claim_ceiling: "Paired synthetic simulation comparison only; confidence intervals describe the frozen seed set and do not imply physical performance or release readiness."
            }
          ' > ev-factory-dispatch-policy-comparison.json

          jq -e '
            .schema_version == "ev-factory-dispatch-policy-comparison/0.2"
            and .benchmark_id == "EV-FACTORY-SIM-001"
            and .fifo_dispatch_policy == "fifo"
            and .variant_aware_dispatch_policy == "minimize_changeover"
            and .maximum_queue_age_seconds == 900
            and .variant_aware_maximum_queue_age_seconds == 900
            and .maximum_queue_age_matches
            and .replication_seeds_equal
            and .replication_records_matched_by_seed_and_scenario
            and .replication_count == 20
            and (.scenario_pairs | length) == 6
            and (.station_pairs | length) == 30
            and all(.scenario_pairs[]; .paired_good_units_per_hour_delta_ci95.sample_count == 20 and .paired_good_units_per_hour_delta_ci95.mean_confidence_95_lower != null and .paired_good_units_per_hour_delta_ci95.mean_confidence_95_upper != null)
            and all(.scenario_pairs[]; (.per_variant_paired_wait_deltas | length) == 3 and all(.per_variant_paired_wait_deltas[]; .average_wait_delta_ci95_seconds.sample_count == 20))
            and all(.station_pairs[]; .paired_changeovers_delta_ci95.sample_count == 20 and .paired_out_of_order_transfers_delta_ci95.sample_count == 20)
            and (.linewide_paired_totals | length) == 6
            and all(.linewide_paired_totals[]; .paired_total_changeovers_delta_ci95.sample_count == 20 and .paired_total_order_inversions_delta_ci95.sample_count == 20)
          ' ev-factory-dispatch-policy-comparison.json

      - name: Sweep queue-age thresholds against paired FIFO baseline
        run: |
          for age in 300 900 1800 3600; do
            if [ "$age" = "900" ]; then
              cp ev-factory-variant-aware-report.json "ev-factory-age-$age-report.json"
            else
              jq --argjson age "$age" '
                .dispatch_policy = "minimize_changeover"
                | .maximum_queue_age_seconds = $age
              ' tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
                > "ev-factory-age-$age.json"
              cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
                "ev-factory-age-$age.json" > "ev-factory-age-$age-report.json"
            fi
            jq -e --argjson age "$age" '
              .benchmark_id == "EV-FACTORY-SIM-001"
              and .dispatch_policy == "minimize_changeover"
              and .maximum_queue_age_seconds == $age
              and .replication_count == 20
              and (.replication_seeds | length) == 20
              and (.scenario_statistics | length) == 6
              and (.station_sequence_statistics | length) == 30
              and .input_evidence_class == "synthetic"
              and .release_ready == false
              and .output_never_exceeds_released_input
              and .all_buffers_respected_capacity
              and .station_time_accounting_within_horizon
              and all(.scenarios[]; .release_ready == false and .all_buffers_respected_capacity and .station_time_accounting_within_horizon)
              and all(.replication_scenario_records[]; (.variant_wait_statistics | length) == 3 and (.stations | length) == 5)
            ' "ev-factory-age-$age-report.json"
          done

          jq -s '.' \
            ev-factory-age-300-report.json \
            ev-factory-age-900-report.json \
            ev-factory-age-1800-report.json \
            ev-factory-age-3600-report.json \
            > ev-factory-age-threshold-reports.json

          jq -n \
            --slurpfile fifo ev-factory-simulation-report.json \
            --slurpfile threshold_runs ev-factory-age-threshold-reports.json '
            def paired_summary($values):
              ($values | length) as $n
              | ($values | add / $n) as $mean
              | (if $n > 1
                 then ([$values[] | (. - $mean) * (. - $mean)] | add / ($n - 1) | sqrt)
                 else 0 end) as $sd
              | (if $n > 1 then 2.093 else null end) as $t
              | {
                  sample_count: $n,
                  mean: $mean,
                  sample_standard_deviation: (if $n > 1 then $sd else null end),
                  mean_confidence_95_lower: (if $n > 1 then $mean - $t * $sd / ($n | sqrt) else null end),
                  mean_confidence_95_upper: (if $n > 1 then $mean + $t * $sd / ($n | sqrt) else null end)
                };
            ($fifo[0]) as $f
            | ($threshold_runs[0]) as $runs
            | {
                schema_version: "ev-factory-age-threshold-frontier/0.1",
                benchmark_id: $f.benchmark_id,
                baseline_policy: $f.dispatch_policy,
                baseline_seed_count: $f.replication_count,
                thresholds_seconds: [$runs[].maximum_queue_age_seconds],
                paired_seed_set_equal: all($runs[]; .replication_seeds == $f.replication_seeds),
                paired_record_keys_equal: all($runs[];
                  (.replication_scenario_records | sort_by(.seed, .scenario_id) | map([.seed, .scenario_id]))
                  == ($f.replication_scenario_records | sort_by(.seed, .scenario_id) | map([.seed, .scenario_id]))
                ),
                threshold_results: [
                  $runs[] as $r |
                  {
                    maximum_queue_age_seconds: $r.maximum_queue_age_seconds,
                    policy: $r.dispatch_policy,
                    scenario_results: [
                      $f.scenario_statistics[] as $fs |
                      ($r.scenario_statistics[] | select(.scenario_id == $fs.scenario_id)) as $rs |
                      ($f.replication_scenario_records | map(select(.scenario_id == $fs.scenario_id)) | sort_by(.seed)) as $f_records |
                      ($r.replication_scenario_records | map(select(.scenario_id == $fs.scenario_id)) | sort_by(.seed)) as $r_records |
                      ([
                        range(0; ($f_records | length)) as $i |
                        {
                          seed: $f_records[$i].seed,
                          good_output_rate_delta: ($r_records[$i].measured_good_units_per_hour - $f_records[$i].measured_good_units_per_hour),
                          good_units_delta: ($r_records[$i].good_units_total - $f_records[$i].good_units_total),
                          scrap_delta: ($r_records[$i].scrapped_jobs_total - $f_records[$i].scrapped_jobs_total),
                          rework_delta: ($r_records[$i].measured_rework_attempts - $f_records[$i].measured_rework_attempts),
                          total_changeovers_delta: (
                            [$f_records[$i].stations[] as $fb |
                              ($r_records[$i].stations[] | select(.station_id == $fb.station_id)) as $ra |
                              ($ra.changeovers_started - $fb.changeovers_started)
                            ] | add
                          ),
                          total_order_inversions_delta: (
                            [$f_records[$i].stations[] as $fb |
                              ($r_records[$i].stations[] | select(.station_id == $fb.station_id)) as $ra |
                              ($ra.out_of_order_output_transfers - $fb.out_of_order_output_transfers)
                            ] | add
                          ),
                          per_variant_wait_deltas: [
                            range(0; ($f_records[$i].variant_wait_statistics | length)) as $v |
                            {
                              variant: $f_records[$i].variant_wait_statistics[$v].variant,
                              mean_wait_seconds_delta: (
                                $r_records[$i].variant_wait_statistics[$v].average_wait_seconds
                                - $f_records[$i].variant_wait_statistics[$v].average_wait_seconds
                              ),
                              p95_wait_seconds_delta: (
                                $r_records[$i].variant_wait_statistics[$v].p95_wait_seconds
                                - $f_records[$i].variant_wait_statistics[$v].p95_wait_seconds
                              ),
                              maximum_wait_seconds_delta: (
                                $r_records[$i].variant_wait_statistics[$v].maximum_wait_seconds
                                - $f_records[$i].variant_wait_statistics[$v].maximum_wait_seconds
                              )
                            }
                          ]
                        }
                      ]) as $paired |
                      {
                        scenario_id: $fs.scenario_id,
                        fifo_mean_good_output_per_hour: $fs.good_units_per_hour.mean,
                        policy_mean_good_output_per_hour: $rs.good_units_per_hour.mean,
                        paired_good_output_rate_delta_ci95: paired_summary([$paired[].good_output_rate_delta]),
                        paired_good_units_delta_ci95: paired_summary([$paired[].good_units_delta]),
                        paired_scrap_delta_ci95: paired_summary([$paired[].scrap_delta]),
                        paired_rework_delta_ci95: paired_summary([$paired[].rework_delta]),
                        paired_total_changeovers_delta_ci95: paired_summary([$paired[].total_changeovers_delta]),
                        paired_total_order_inversions_delta_ci95: paired_summary([$paired[].total_order_inversions_delta]),
                        per_variant_wait_delta_ci95: [
                          range(0; ($f_records[0].variant_wait_statistics | length)) as $v |
                          {
                            variant: $f_records[0].variant_wait_statistics[$v].variant,
                            mean_wait_seconds_delta_ci95: paired_summary([$paired[].per_variant_wait_deltas[$v].mean_wait_seconds_delta]),
                            p95_wait_seconds_delta_ci95: paired_summary([$paired[].per_variant_wait_deltas[$v].p95_wait_seconds_delta]),
                            maximum_wait_seconds_delta_ci95: paired_summary([$paired[].per_variant_wait_deltas[$v].maximum_wait_seconds_delta])
                          }
                        ],
                        paired_seed_deltas: $paired
                      }
                    ]
                  }
                ],
                claim_ceiling: "Paired synthetic threshold sensitivity screen only. Intervals cover the frozen 20-seed set and do not establish a universal optimum, plant performance or release readiness."
              }
          ' > ev-factory-age-threshold-sweep.json

          jq -e '
            .schema_version == "ev-factory-age-threshold-frontier/0.1"
            and .benchmark_id == "EV-FACTORY-SIM-001"
            and .baseline_policy == "fifo"
            and .baseline_seed_count == 20
            and .thresholds_seconds == [300, 900, 1800, 3600]
            and .paired_seed_set_equal
            and .paired_record_keys_equal
            and (.threshold_results | length) == 4
            and all(.threshold_results[]; .policy == "minimize_changeover" and (.scenario_results | length) == 6)
            and all(.threshold_results[].scenario_results[];
              .paired_good_output_rate_delta_ci95.sample_count == 20
              and .paired_total_changeovers_delta_ci95.sample_count == 20
              and .paired_total_order_inversions_delta_ci95.sample_count == 20
              and (.per_variant_wait_delta_ci95 | length) == 3
              and all(.per_variant_wait_delta_ci95[];
                .mean_wait_seconds_delta_ci95.sample_count == 20
                and .p95_wait_seconds_delta_ci95.sample_count == 20
                and .maximum_wait_seconds_delta_ci95.sample_count == 20
              )
            )
          ' ev-factory-age-threshold-sweep.json

      - name: Run PCB cell routes and assert fail-closed invariants
        run: |
          for fixture in \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json; do
            benchmark_id=$(jq -r '.benchmark_id' "$fixture")
            station_count=$(jq '.stations | length' "$fixture")
            report="$benchmark_id-report.json"
            repeat="$benchmark_id-repeat.json"
            cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- "$fixture" > "$report"
            jq -e --arg id "$benchmark_id" --argjson n "$station_count" '
              .benchmark_id == $id
              and .scenario_count == ($n + 1)
              and .input_evidence_class == "synthetic"
              and .release_ready == false
              and .output_never_exceeds_released_input
              and .all_buffers_respected_capacity
              and .station_time_accounting_within_horizon
              and (.scenarios | length) == ($n + 1)
              and (.scenarios[0].stations | length) == $n
              and ((.scenarios[0].interstation_buffers | length) == ($n - 1))
              and all(.scenarios[]; .good_units_total <= .released_jobs_total)
              and all(.scenarios[]; .release_ready == false and .all_buffers_respected_capacity and .station_time_accounting_within_horizon)
              and all(.scenarios[]; all(.stations[]; .accounted_fraction >= 0 and .accounted_fraction <= 1.000001))
              and all(.scenarios[1:][]; .added_servers == 1 and .intervention_station_id != null)
            ' "$report"
            cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- "$fixture" > "$repeat"
            cmp "$report" "$repeat"
          done
      - name: Verify deterministic output for the declared seed
        run: |
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
            > ev-factory-simulation-repeat.json
          cmp ev-factory-simulation-report.json ev-factory-simulation-repeat.json
      - name: Negative control - invalid yield must fail closed
        run: |
          jq '.stations[0].good_yield_fraction = 1.1' \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json > invalid-factory-simulation.json
          if cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- invalid-factory-simulation.json >/dev/null 2>&1; then
            echo "invalid yield was unexpectedly accepted"
            exit 1
          fi
      - name: Negative control - zero skip budget must fail closed
        run: |
          jq '.maximum_consecutive_skips = 0' \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json > ev-factory-invalid-skip-budget.json
          if cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            ev-factory-invalid-skip-budget.json > /dev/null 2> ev-factory-invalid-skip-budget.stderr; then
            echo "invalid zero skip budget was incorrectly accepted" >&2
            exit 1
          fi
          grep -q "maximum_consecutive_skips_must_be_positive" ev-factory-invalid-skip-budget.stderr

      - name: Negative control - zero queue age threshold must fail closed
        run: |
          jq '.maximum_queue_age_seconds = 0' \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json > ev-factory-invalid-queue-age.json
          if cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            ev-factory-invalid-queue-age.json > /dev/null 2> ev-factory-invalid-queue-age.stderr; then
            echo "invalid zero queue-age threshold was incorrectly accepted" >&2
            exit 1
          fi
          grep -q "maximum_queue_age_seconds_must_be_positive" ev-factory-invalid-queue-age.stderr

      - name: Hash source, fixture and reports
        run: |
          sha256sum \
            tools/ev-passenger-cost-frontier/src/bin/ev_factory_simulation.rs \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json \
            docs/research/EV_FACTORY_DISCRETE_EVENT_SIMULATION_V0_1.md \
            docs/research/EV_FACTORY_COMMON_RANDOM_STREAMS_V0_1.md \
            docs/research/EV_FACTORY_REPLICATION_STATISTICS_V0_1.md \
            docs/research/EV_FACTORY_SEQUENCE_AWARE_FLOW_V0_1.md \
            docs/research/EV_FACTORY_DISPATCH_POLICY_V0_1.md \
            docs/research/EV_FACTORY_DISPATCH_BENCHMARK_LITERATURE_V0_1.md \
            docs/research/EV_FACTORY_QUEUE_AGE_FAIRNESS_FRONTIER_V0_1.md \
            docs/research/PCB_CELL_DISCRETE_EVENT_SIMULATION_V0_1.md \
            ev-factory-simulation-report.json \
            ev-factory-variant-aware.json \
            ev-factory-variant-aware-report.json \
            ev-factory-dispatch-policy-comparison.json \
            ev-factory-age-threshold-sweep.json \
            ev-factory-age-threshold-reports.json \
            ev-factory-age-300-report.json \
            ev-factory-age-900-report.json \
            ev-factory-age-1800-report.json \
            ev-factory-age-3600-report.json \
            docs/research/EV_FACTORY_DISPATCH_BENCHMARK_LITERATURE_V0_1.md \
            PCB-CELL-P0-OUTSOURCED-BARE-BOARD-LOCAL-ASSEMBLY-report.json \
            PCB-CELL-P1-LOCAL-ISOLATION-MILL-AND-ASSEMBLY-report.json > ev-factory-simulation-report.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ev-factory-discrete-event-simulation-report
          path: |
            ev-factory-simulation-report.json
            ev-factory-variant-aware.json
            ev-factory-variant-aware-report.json
            ev-factory-dispatch-policy-comparison.json
            ev-factory-age-threshold-sweep.json
            ev-factory-age-threshold-reports.json
            ev-factory-age-300-report.json
            ev-factory-age-900-report.json
            ev-factory-age-1800-report.json
            ev-factory-age-3600-report.json
            PCB-CELL-P0-OUTSOURCED-BARE-BOARD-LOCAL-ASSEMBLY-report.json
            PCB-CELL-P1-LOCAL-ISOLATION-MILL-AND-ASSEMBLY-report.json
            ev-factory-simulation-report.sha256
          if-no-files-found: error
