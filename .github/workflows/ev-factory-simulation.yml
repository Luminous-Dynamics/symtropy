name: EV Factory Discrete-Event Simulation
on:
  pull_request:
    paths:
      - "tools/ev-passenger-cost-frontier/src/bin/ev_factory_simulation.rs"
      - "tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json"
      - "docs/research/PCB_CELL_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_SHARED_CONTROL_OUTAGE_V0_1.md"
      - "docs/research/EV_FACTORY_FLOWTIME_CENSORING_V0_1.md"
      - "docs/research/EV_FACTORY_COMMON_RANDOM_STREAMS_V0_1.md"
      - "docs/research/EV_FACTORY_REPLICATION_STATISTICS_V0_1.md"
      - "docs/research/EV_FACTORY_SEQUENCE_AWARE_FLOW_V0_1.md"
      - "docs/research/EV_FACTORY_SEQUENCE_AWARE_DISPATCH_V0_1.md"
      - ".github/workflows/ev-factory-simulation.yml"
  push:
    branches: [main]
    paths:
      - "tools/ev-passenger-cost-frontier/src/bin/ev_factory_simulation.rs"
      - "tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json"
      - "tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json"
      - "docs/research/PCB_CELL_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_DISCRETE_EVENT_SIMULATION_V0_1.md"
      - "docs/research/EV_FACTORY_SHARED_CONTROL_OUTAGE_V0_1.md"
      - "docs/research/EV_FACTORY_FLOWTIME_CENSORING_V0_1.md"
      - "docs/research/EV_FACTORY_COMMON_RANDOM_STREAMS_V0_1.md"
      - "docs/research/EV_FACTORY_REPLICATION_STATISTICS_V0_1.md"
      - "docs/research/EV_FACTORY_SEQUENCE_AWARE_FLOW_V0_1.md"
      - "docs/research/EV_FACTORY_SEQUENCE_AWARE_DISPATCH_V0_1.md"
      - ".github/workflows/ev-factory-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Parse fixture
        run: |
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .schema_version == "0.1.0"
            and (.stations | length) == 5
            and (.buffer_capacities | length) == 4
            and (.stations | all(.[]; .servers > 0 and .good_yield_fraction > 0 and .good_yield_fraction <= 1))
            and .input_evidence_class == "synthetic"
            and .calibration_gate == "unknown"
            and .local_compliance_gate == "unknown"
            and .line_safety_gate == "unknown"
            and .product_quality_release_gate == "unknown"
          ' tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .schema_version == "0.1.0"
            and .horizon_seconds == 4000
            and .warmup_seconds == 0
            and (.replication_seeds | length) == 20
            and .common_cause_control_outage.domain_id == "shared-line-control"
            and .common_cause_control_outage.station_ids == ["battery-module-install", "final-assembly"]
            and .common_cause_control_outage.first_start_seconds == 600
            and .common_cause_control_outage.recurrence_interval_seconds == 1800
            and .common_cause_control_outage.duration_seconds == 300
            and .input_evidence_class == "synthetic"
          ' tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json
      - name: Parse PCB cell fixtures
        run: |
          for fixture in \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json; do
            jq empty "$fixture"
            jq -e '
              .schema_version == "0.1.0"
              and (.benchmark_id | startswith("PCB-CELL-"))
              and .seed > 0
              and .horizon_seconds > .warmup_seconds
              and .productive_seconds_per_year > 0
              and .variant_count > 0
              and .variant_batch_size > 0
              and (.stations | length) >= 2
              and (.buffer_capacities | length) == ((.stations | length) - 1)
              and (.stations | all(.[]; .servers > 0 and .good_yield_fraction > 0 and .good_yield_fraction <= 1))
              and (.input_evidence_class == "synthetic")
              and .calibration_gate == "unknown"
              and .local_compliance_gate == "unknown"
              and .line_safety_gate == "unknown"
              and .product_quality_release_gate == "unknown"
              and (.claim_ceiling | contains("Synthetic"))
            ' "$fixture"
          done
      - name: Format check
        run: cargo fmt --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml -- --check
      - name: Full Rust package tests
        run: cargo test --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml
      - name: Run benchmark and assert simulation invariants
        run: |
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
            > ev-factory-simulation-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .random_stream_policy == "entity_keyed_service_quality_failure; dedicated_supplier_arrival_stream"
            and .dispatch_policy == "fifo"
            and .max_variant_skip_seconds == 600
            and .replication_count == 20
            and (.replication_seeds | length) == 20
            and (.scenario_statistics | length) == 6
            and .flow_time_cohort_accounting_valid
            and (.flow_time_statistics | length) == 6
            and all(.flow_time_statistics[];
              .cohort_accounting_valid
              and .release_cohort_jobs.sample_count == 20
              and .completed_good_jobs.sample_count == 20
              and .completed_scrap_jobs.sample_count == 20
              and .right_censored_jobs_at_horizon.sample_count == 20
              and ((.replications_with_good_flow_time_observations == 0)
                or (.good_flow_time_mean_seconds_across_replications.sample_count == .replications_with_good_flow_time_observations
                  and .good_flow_time_p50_seconds_across_replications.sample_count == .replications_with_good_flow_time_observations
                  and .good_flow_time_p90_seconds_across_replications.sample_count == .replications_with_good_flow_time_observations
                  and .good_flow_time_p95_seconds_across_replications.sample_count == .replications_with_good_flow_time_observations
                  and .good_flow_time_p99_seconds_across_replications.sample_count == .replications_with_good_flow_time_observations))
              and ((.replications_with_right_censored_observations == 0)
                or (.right_censored_observed_age_mean_seconds_across_replications.sample_count == .replications_with_right_censored_observations
                  and .right_censored_observed_age_p50_seconds_across_replications.sample_count == .replications_with_right_censored_observations
                  and .right_censored_observed_age_p90_seconds_across_replications.sample_count == .replications_with_right_censored_observations
                  and .right_censored_observed_age_p95_seconds_across_replications.sample_count == .replications_with_right_censored_observations
                  and .right_censored_observed_age_p99_seconds_across_replications.sample_count == .replications_with_right_censored_observations))
            )
            and all(.scenarios[];
              .flow_time.cohort_accounting_valid
              and .flow_time.release_cohort_jobs == (.flow_time.completed_good_jobs + .flow_time.completed_scrap_jobs + .flow_time.right_censored_jobs_at_horizon)
            )
            and (.station_sequence_statistics | length) == 30
            and all(.station_sequence_statistics[]; .changeovers_started.sample_count == 20 and .output_transfers.sample_count == 20 and .out_of_order_output_transfers.sample_count == 20 and .out_of_order_output_transfers.mean <= .output_transfers.mean)
            and all(.scenario_statistics[]; .good_units_per_hour.sample_count == 20)
            and all(.scenario_statistics[] | select(.scenario_id != "baseline"); .paired_good_units_per_hour_delta_vs_baseline.sample_count == 20 and .paired_good_units_per_hour_delta_vs_baseline.mean_confidence_95_lower != null and .paired_good_units_per_hour_delta_vs_baseline.mean_confidence_95_upper != null)
            and .scenario_count == 6
            and .measured_horizon_seconds == 518400
            and .input_evidence_class == "synthetic"
            and .release_ready == false
            and .output_never_exceeds_released_input
            and .all_buffers_respected_capacity
            and .station_time_accounting_within_horizon
            and (.scenarios | length) == 6
            and .scenarios[0].scenario_id == "baseline"
            and (.scenarios[0].stations | length) == 5
            and (.scenarios[0].interstation_buffers | length) == 4
            and all(.scenarios[]; .good_units_total <= .released_jobs_total)
            and all(.scenarios[]; .release_ready == false and .all_buffers_respected_capacity and .station_time_accounting_within_horizon)
            and all(.scenarios[]; all(.stations[]; .accounted_fraction >= 0 and .accounted_fraction <= 1.000001))
            and all(.scenarios[1:][]; .added_servers == 1 and .intervention_station_id != null)
          ' ev-factory-simulation-report.json
      - name: Run shared-control outage experiment and assert robust decision evidence
        run: |
          set -euo pipefail
          FIXTURE=tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json
          REPORT=ev-factory-shared-control-outage-report.json
          REPEAT=ev-factory-shared-control-outage-repeat.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- "$FIXTURE" > "$REPORT"
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .input_evidence_class == "synthetic"
            and .replication_count == 20
            and (.replication_seeds | length) == 20
            and (.catalog_config_sha256 | test("^[0-9a-f]{64}$"))
            and .release_ready == false
            and .output_never_exceeds_released_input
            and .all_buffers_respected_capacity
            and .station_time_accounting_within_horizon
            and (.scenarios | length) == 6
            and .flow_time_cohort_accounting_valid
            and (.flow_time_statistics | length) == 6
            and all(.flow_time_statistics[];
              .cohort_accounting_valid
              and .release_cohort_jobs.sample_count == 20
              and .right_censored_jobs_at_horizon.sample_count == 20
            )
            and all(.scenarios[];
              .flow_time.cohort_accounting_valid
              and .flow_time.release_cohort_jobs == (.flow_time.completed_good_jobs + .flow_time.completed_scrap_jobs + .flow_time.right_censored_jobs_at_horizon)
              and .common_cause_control_outage_starts_after_warmup == 2
              and .measured_common_cause_control_outage_seconds == 600
              and (.common_cause_control_outage_trace | length) == 4
              and (.common_cause_control_outage_trace | map(.at_seconds) == [600, 900, 2400, 2700])
              and all(.common_cause_control_outage_trace[];
                .domain_id == "shared-line-control"
                and .station_ids == ["battery-module-install", "final-assembly"]
              )
              and all(.stations[] | select(.station_id == "battery-module-install" or .station_id == "final-assembly");
                .new_job_dispatches_during_common_cause_outage_after_warmup == 0
              )
              and .all_buffers_respected_capacity
              and .output_never_exceeds_released_input
              and .release_ready == false
            )
            and (.paired_common_cause_control_outage_baseline_comparison.seed_count == 20)
            and (.paired_common_cause_control_outage_baseline_comparison.paired_good_units_per_hour_delta_vs_no_outage.sample_count == 20)
            and ((.paired_common_cause_control_outage_baseline_comparison.scenario_comparisons | length) == 6)
            and all(.paired_common_cause_control_outage_baseline_comparison.scenario_comparisons[] | select(.scenario_id != "baseline");
              .paired_good_units_per_hour_delta_vs_no_outage.sample_count == 20
              and .paired_intervention_effect_vs_baseline_in_outage_model.sample_count == 20
              and .paired_intervention_effect_vs_baseline_in_no_outage_model.sample_count == 20
              and .paired_intervention_effect_delta_vs_no_outage.sample_count == 20
              and .paired_intervention_effect_delta_vs_no_outage.mean_confidence_95_lower != null
              and .paired_intervention_effect_delta_vs_no_outage.mean_confidence_95_upper != null
            )
            and (.structural_robust_intervention_summary.model_family_count == 2)
            and (.structural_robust_intervention_summary.family_probabilities_used == false)
            and (.structural_robust_intervention_summary.model_families_treated_as_iid_replications == false)
            and (.structural_robust_intervention_summary.family_winners | length) == 2
            and (.structural_robust_intervention_summary.intervention_scores | length) == 6
            and (.structural_robust_intervention_summary.maximin_scenario_id | type) == "string"
            and (.structural_robust_intervention_summary.minimax_regret_scenario_id | type) == "string"
          ' "$REPORT"
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- "$FIXTURE" > "$REPEAT"
          cmp "$REPORT" "$REPEAT"
      - name: Run short-horizon flow-time censoring negative control
        run: |
          set -euo pipefail
          BASE=tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json
          FIXTURE=ev-factory-flowtime-short-horizon-fixture.json
          REPORT=ev-factory-flowtime-short-horizon-report.json
          jq '.replication_seeds = [] | .horizon_seconds = 500 | .warmup_seconds = 0' "$BASE" > "$FIXTURE"
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- "$FIXTURE" > "$REPORT"
          jq -e '
            .replication_count == 1
            and .flow_time_cohort_accounting_valid
            and (.flow_time_statistics | length) == 6
            and all(.scenarios[];
              .flow_time.cohort_accounting_valid
              and .flow_time.release_cohort_jobs > 0
              and .flow_time.right_censored_jobs_at_horizon > 0
              and .flow_time.right_censored_observed_age_seconds != null
              and .flow_time.right_censored_observed_age_seconds.sample_count == .flow_time.right_censored_jobs_at_horizon
              and .flow_time.completed_good_jobs + .flow_time.completed_scrap_jobs + .flow_time.right_censored_jobs_at_horizon == .flow_time.release_cohort_jobs
              and .flow_time.completed_good_flow_time_seconds == null
            )
            and all(.flow_time_statistics[];
              .cohort_accounting_valid
              and .release_cohort_jobs.sample_count == 1
              and .right_censored_jobs_at_horizon.sample_count == 1
              and .replications_with_right_censored_observations == 1
              and .right_censored_observed_age_mean_seconds_across_replications.sample_count == 1
              and .right_censored_observed_age_p50_seconds_across_replications.sample_count == 1
              and .right_censored_observed_age_p90_seconds_across_replications.sample_count == 1
              and .right_censored_observed_age_p95_seconds_across_replications.sample_count == 1
              and .right_censored_observed_age_p99_seconds_across_replications.sample_count == 1
            )
          ' "$REPORT"
      - name: Run PCB cell routes and assert fail-closed invariants
        run: |
          for fixture in \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json; do
            benchmark_id=$(jq -r '.benchmark_id' "$fixture")
            station_count=$(jq '.stations | length' "$fixture")
            report="$benchmark_id-report.json"
            repeat="$benchmark_id-repeat.json"
            cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- "$fixture" > "$report"
            jq -e --arg id "$benchmark_id" --argjson n "$station_count" '
              .benchmark_id == $id
              and .scenario_count == ($n + 1)
              and .input_evidence_class == "synthetic"
              and .release_ready == false
              and .output_never_exceeds_released_input
              and .all_buffers_respected_capacity
              and .station_time_accounting_within_horizon
              and (.scenarios | length) == ($n + 1)
              and (.scenarios[0].stations | length) == $n
              and ((.scenarios[0].interstation_buffers | length) == ($n - 1))
              and all(.scenarios[]; .good_units_total <= .released_jobs_total)
              and all(.scenarios[]; .release_ready == false and .all_buffers_respected_capacity and .station_time_accounting_within_horizon)
              and all(.scenarios[]; all(.stations[]; .accounted_fraction >= 0 and .accounted_fraction <= 1.000001))
              and all(.scenarios[1:][]; .added_servers == 1 and .intervention_station_id != null)
            ' "$report"
            cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- "$fixture" > "$repeat"
            cmp "$report" "$repeat"
          done
      - name: Run bounded variant-aware dispatch on matched seeds
        run: |
          jq '.dispatch_policy = "minimize_changeover" | .max_variant_skip_seconds = 240' \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
            > ev-factory-sequence-aware-fixture.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            ev-factory-sequence-aware-fixture.json > ev-factory-sequence-aware-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .dispatch_policy == "minimize_changeover"
            and .max_variant_skip_seconds == 240
            and .replication_count == 20
            and (.replication_seeds | length) == 20
            and (.scenario_statistics | length) == 6
            and (.station_sequence_statistics | length) == 30
            and .release_ready == false
            and .all_buffers_respected_capacity
            and .output_never_exceeds_released_input
            and all(.station_sequence_statistics[]; .out_of_order_output_transfers.mean <= .output_transfers.mean)
          ' ev-factory-sequence-aware-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            ev-factory-sequence-aware-fixture.json > ev-factory-sequence-aware-repeat.json
          cmp ev-factory-sequence-aware-report.json ev-factory-sequence-aware-repeat.json
      - name: Verify deterministic output for the declared seed
        run: |
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
            > ev-factory-simulation-repeat.json
          cmp ev-factory-simulation-report.json ev-factory-simulation-repeat.json
      - name: Negative control - invalid yield must fail closed
        run: |
          jq '.stations[0].good_yield_fraction = 1.1' \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json > invalid-factory-simulation.json
          if cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_simulation -- invalid-factory-simulation.json >/dev/null 2>&1; then
            echo "invalid yield was unexpectedly accepted"
            exit 1
          fi
      - name: Hash source, fixture and reports
        run: |
          sha256sum \
            tools/ev-passenger-cost-frontier/src/bin/ev_factory_simulation.rs \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p0_outsourced_bare_board_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/pcb_cell_p1_local_milling_v0_1.json \
            docs/research/EV_FACTORY_DISCRETE_EVENT_SIMULATION_V0_1.md \
            docs/research/EV_FACTORY_SHARED_CONTROL_OUTAGE_V0_1.md \
            docs/research/EV_FACTORY_FLOWTIME_CENSORING_V0_1.md \
            docs/research/EV_FACTORY_COMMON_RANDOM_STREAMS_V0_1.md \
            docs/research/EV_FACTORY_REPLICATION_STATISTICS_V0_1.md \
            docs/research/EV_FACTORY_SEQUENCE_AWARE_FLOW_V0_1.md \
            docs/research/EV_FACTORY_SEQUENCE_AWARE_DISPATCH_V0_1.md \
            docs/research/PCB_CELL_DISCRETE_EVENT_SIMULATION_V0_1.md \
            ev-factory-simulation-report.json \
            ev-factory-shared-control-outage-report.json \
            ev-factory-flowtime-short-horizon-fixture.json \
            ev-factory-flowtime-short-horizon-report.json \
            ev-factory-sequence-aware-report.json \
            PCB-CELL-P0-OUTSOURCED-BARE-BOARD-LOCAL-ASSEMBLY-report.json \
            PCB-CELL-P1-LOCAL-ISOLATION-MILL-AND-ASSEMBLY-report.json > ev-factory-simulation-report.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ev-factory-discrete-event-simulation-report
          path: |
            ev-factory-simulation-report.json
            ev-factory-shared-control-outage-report.json
            ev-factory-shared-control-outage-repeat.json
            ev-factory-flowtime-short-horizon-fixture.json
            ev-factory-flowtime-short-horizon-report.json
            ev-factory-sequence-aware-report.json
            PCB-CELL-P0-OUTSOURCED-BARE-BOARD-LOCAL-ASSEMBLY-report.json
            PCB-CELL-P1-LOCAL-ISOLATION-MILL-AND-ASSEMBLY-report.json
            ev-factory-simulation-report.sha256
          if-no-files-found: error
