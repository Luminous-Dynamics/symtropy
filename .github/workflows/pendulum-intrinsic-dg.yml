name: Intrinsic pendulum discrete-gradient reference

on:
  pull_request:
    paths:
      - "tools/pendulum-intrinsic-reference/**"
      - "docs/research/INTRINSIC_PENDULUM_DISCRETE_GRADIENT_2026-10-31.md"
      - ".github/workflows/pendulum-intrinsic-dg.yml"
  push:
    branches:
      - "research/pendulum-intrinsic-dg-2026-10-31"

permissions:
  contents: read

jobs:
  standalone-rust-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Check formatting
        run: rustup run 1.96.0 rustfmt --edition 2021 --check tools/pendulum-intrinsic-reference/pendulum_discrete_gradient.rs

      - name: Compile and run warning-denied tests
        run: |
          rustup run 1.96.0 rustc --edition 2021 --test -D warnings \
            tools/pendulum-intrinsic-reference/pendulum_discrete_gradient.rs \
            -o /tmp/pendulum-dg-tests
          /tmp/pendulum-dg-tests

      - name: Compile optimized deterministic fixture
        run: |
          rustup run 1.96.0 rustc --edition 2021 -O -D warnings \
            tools/pendulum-intrinsic-reference/pendulum_discrete_gradient.rs \
            -o /tmp/pendulum-dg
          /tmp/pendulum-dg > /tmp/pendulum-dg-a.csv
          /tmp/pendulum-dg > /tmp/pendulum-dg-b.csv
          cmp /tmp/pendulum-dg-a.csv /tmp/pendulum-dg-b.csv
          test "$(wc -l < /tmp/pendulum-dg-a.csv)" -eq 501
          grep -q "^500," /tmp/pendulum-dg-a.csv
