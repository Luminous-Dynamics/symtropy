name: Power restoration risk metrics

on:
  pull_request:
    paths:
      - "tools/power-restoration-risk-metrics/**"
      - ".github/workflows/power-restoration-risk-metrics.yml"
  push:
    paths:
      - "tools/power-restoration-risk-metrics/**"
      - ".github/workflows/power-restoration-risk-metrics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  risk-metrics:
    name: Validate tail-risk and safety metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate risk metrics input schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          path = Path("tools/power-restoration-risk-metrics/fixtures/risk-metrics-input-v0.1.schema.json")
          schema = json.loads(path.read_text())
          Draft202012Validator.check_schema(schema)
          print("PASS: risk metrics JSON Schema is valid")
          PY
      - name: Format first-party crate on same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cargo fmt --manifest-path tools/power-restoration-risk-metrics/Cargo.toml --package power-restoration-risk-metrics
          if ! git diff --quiet -- tools/power-restoration-risk-metrics; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/power-restoration-risk-metrics
            git commit -m "style(power-restoration): format risk metrics crate"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/power-restoration-risk-metrics/Cargo.toml --package power-restoration-risk-metrics -- --check
      - name: Resolve dependency graph
        run: cargo generate-lockfile --manifest-path tools/power-restoration-risk-metrics/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/power-restoration-risk-metrics/Cargo.toml --package power-restoration-risk-metrics --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --manifest-path tools/power-restoration-risk-metrics/Cargo.toml --package power-restoration-risk-metrics --all-targets
