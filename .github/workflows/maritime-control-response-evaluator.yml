name: Maritime control-response evaluator
on:
  push:
    branches: ["research/maritime-control-response-v0-1"]
    paths:
      - "benchmarks/maritime-control-response/**"
      - "tools/maritime-control-response-evaluator/**"
      - "docs/tech/MARITIME_CONTROL_AWARE_DIAGNOSIS_BENCHMARK_V0_1.md"
      - "docs/tech/MARITIME_CONTROL_RESPONSE_CORPUS_V0_1.schema.json"
      - "docs/tech/MARITIME_EXTERNAL_CONTEXT_ROBUSTNESS_V0_1.schema.json"
      - "docs/tech/MARITIME_EXTERNAL_CONTEXT_ROBUSTNESS_BENCHMARK_V0_1.md"
      - "tools/maritime-control-response-evaluator/**"
      - ".github/workflows/maritime-control-response-evaluator.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/maritime-control-response/**"
      - ".github/workflows/maritime-control-response-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-control-response-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/maritime-control-response-evaluator/Cargo.toml --all -- --check

      - name: Run evaluator and contract tests
        run: cargo test --manifest-path tools/maritime-control-response-evaluator/Cargo.toml --locked --all-targets

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/maritime-control-response-evaluator/Cargo.toml --locked --all-targets -- -D warnings

      - name: Execute external-context robustness benchmark
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-control-response/environment-context-robustness-v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --manifest-path tools/maritime-control-response-evaluator/Cargo.toml --locked --bin external_context_robustness -- \
            "$input" --source-commit "$source_commit" --corpus-sha256 "$digest" > external-context-robustness-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '
            .result == "pass" and .source_commit == $source and .corpus_sha256 == $digest
            and .case_count == 10 and .pair_count == 2
            and .fault_conclusion == "NOT_ATTEMPTED"
            and .causal_attribution == "NOT_ESTABLISHED"
            and (.counterfactual_pairs | all(.status == "PASS"))
          ' external-context-robustness-receipt.json
