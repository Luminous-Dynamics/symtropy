name: SIM-REL-012 Stateful Risk-Cost Optimizer

on:
  push:
    branches: ["main", "research/sim-rel-012-*"]
    paths:
      - "tools/sim-rel-dynamics-optimizer/**"
      - "tools/sim-rel-dynamics-evaluator/**"
      - ".github/workflows/sim-rel-dynamics-optimizer.yml"
  pull_request:
    branches: ["main", "research/sim-rel-011-stateful-experiment-evaluator"]
    paths:
      - "tools/sim-rel-dynamics-optimizer/**"
      - "tools/sim-rel-dynamics-evaluator/**"
      - ".github/workflows/sim-rel-dynamics-optimizer.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: exact stateful frontier and independent replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-dynamics-optimizer-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format optimizer
        run: cargo fmt --manifest-path tools/sim-rel-dynamics-optimizer/Cargo.toml -- --check
      - name: Test independent evaluator
        run: cargo test --locked --manifest-path tools/sim-rel-dynamics-evaluator/Cargo.toml --lib
      - name: Test exact stateful optimizer and evaluator cross-checks
        run: cargo test --locked --manifest-path tools/sim-rel-dynamics-optimizer/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-dynamics-optimizer/Cargo.toml --lib -- -D warnings
      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
