name: quadruped-static-support-oracle-v0-1

on:
  push:
    branches:
      - research/quadruped-static-support-oracle-v0-1
    paths:
      - "research/quadruped-static-support-oracle-v0-1/**"
      - ".github/workflows/quadruped-static-support-oracle-v0-1.yml"
  pull_request:
    paths:
      - "research/quadruped-static-support-oracle-v0-1/**"
      - ".github/workflows/quadruped-static-support-oracle-v0-1.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, Clippy and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/quadruped-static-support-oracle-v0-1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format source and export review snapshot
        run: |
          cargo fmt --all
          tar -czf /tmp/quadruped-static-support-oracle-v0-1-formatted.tar.gz Cargo.toml README.md src
      - name: Upload formatted source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: quadruped-static-support-oracle-v0-1-formatted
          path: /tmp/quadruped-static-support-oracle-v0-1-formatted.tar.gz
          if-no-files-found: error
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
