name: Mobility Native Application Composition

on:
  push:
    branches:
      - research/native-application-composition-v0-1
    paths:
      - "research/mobility-native-application-adapter/**"
      - ".github/workflows/mobility-native-application-adapter.yml"
  pull_request:
    paths:
      - "research/mobility-native-application-adapter/**"
      - ".github/workflows/mobility-native-application-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact M2 action contract
        uses: actions/checkout@v4
        with:
          ref: 884bcfbd4474b31ed395fbedf63f0a4091eefa14
          path: m2-src
      - name: Checkout exact authority mutation boundary
        uses: actions/checkout@v4
        with:
          ref: 62ef899124d9a23851c6c00f7beb9d7e697b7f29
          path: mutation-src
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Resolve and export the isolated dependency lock
        run: |
          cargo generate-lockfile --manifest-path research/mobility-native-application-adapter/Cargo.toml
          echo "CARGO_LOCK_BASE64=$(base64 -w0 research/mobility-native-application-adapter/Cargo.lock)"
      - name: Format source and export canonical source bytes for exact-head commit
        run: |
          cargo fmt --manifest-path research/mobility-native-application-adapter/Cargo.toml
          echo "RUSTFMT_BASE64=$(base64 -w0 research/mobility-native-application-adapter/src/lib.rs)"
          cargo fmt --manifest-path research/mobility-native-application-adapter/Cargo.toml -- --check
      - name: Run composed-owner integration tests
        run: cargo test --manifest-path research/mobility-native-application-adapter/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/mobility-native-application-adapter/Cargo.toml --all-targets --locked -- -D warnings
