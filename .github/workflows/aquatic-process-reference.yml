name: Aquatic Process Reference

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/aquatic-process-reference/**"
      - ".github/workflows/aquatic-process-reference.yml"

permissions:
  contents: read

concurrency:
  group: aquatic-process-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Aquatic Process Reference (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Verify standalone formatting
        run: cargo fmt --manifest-path tools/aquatic-process-reference/Cargo.toml -- --check

      - name: Run frozen-corpus and invariant tests
        run: cargo test --manifest-path tools/aquatic-process-reference/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/aquatic-process-reference/Cargo.toml --all-targets --locked -- -D warnings
