name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    # Run the complete fluid package test surface, including integration tests.
    # Passing this step qualifies executable verification code only; it does not
    # turn the SPH scaffold or CPU reference solver into a production CFD claim.
    - name: Run Tests (Fluid Validation)
      run: cargo test -p symtropy-fluid

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets

  # Canonical evidence is generated from the exact source head, not the
  # synthetic pull-request merge ref used by the compatibility matrix above.
  # This lane deliberately repeats the fluid test on that exact tree so the
  # retained measurements and their executable test subject are identical.
  fluid-evidence:
    name: Fluid Evidence (exact head)
    runs-on: ubuntu-latest
    steps:
    - name: Check out exact evidence subject
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Fail before any dependency-resolving build if the committed lock does not
    # represent this exact workspace source.
    - name: Verify Locked Dependency Graph
      run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

    - name: Execute Exact-Head Fluid Verification Tests
      run: cargo test --locked -p symtropy-fluid

    - name: Generate Fluid Verification Evidence
      env:
        SYMTROPY_EVIDENCE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      run: cargo run --locked -p symtropy-fluid --example continuum_verification_evidence --quiet > continuum-verification-evidence.json

    - name: Hash Fluid Verification Evidence
      run: sha256sum continuum-verification-evidence.json > continuum-verification-evidence.json.sha256

    # Keep same-case pressure-iteration sensitivity separate from the V0.6
    # omnibus bundle. The 400-iteration point exactly matches the finest
    # manufactured temporal control; 800 iterations is only a higher numerical
    # reference, not continuum truth or an acceptance threshold.
    - name: Generate Manufactured Iterative Evidence
      env:
        SYMTROPY_EVIDENCE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      run: cargo run --locked -p symtropy-fluid --example manufactured_iterative_evidence --quiet > manufactured-iterative-evidence.json

    - name: Hash Manufactured Iterative Evidence
      run: sha256sum manufactured-iterative-evidence.json > manufactured-iterative-evidence.json.sha256

    # Keep false-smoothness observability independent as well. This document
    # compares resolved kinetic-energy loss to the exact viscous Taylor-Green
    # decay in the same discrete quadrature; it does not call the excess pure
    # physical or numerical dissipation and freezes no acceptance threshold.
    - name: Generate Passive Excess Energy Decay Evidence
      env:
        SYMTROPY_EVIDENCE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      run: cargo run --locked -p symtropy-fluid --example passive_excess_energy_decay_evidence --quiet > passive-excess-energy-decay-evidence.json

    - name: Hash Passive Excess Energy Decay Evidence
      run: sha256sum passive-excess-energy-decay-evidence.json > passive-excess-energy-decay-evidence.json.sha256

    - name: Upload Fluid Verification Evidence
      uses: actions/upload-artifact@v4
      with:
        name: continuum-verification-evidence-${{ github.run_id }}
        path: |
          continuum-verification-evidence.json
          continuum-verification-evidence.json.sha256
          manufactured-iterative-evidence.json
          manufactured-iterative-evidence.json.sha256
          passive-excess-energy-decay-evidence.json
          passive-excess-energy-decay-evidence.json.sha256
        if-no-files-found: error
        retention-days: 30
