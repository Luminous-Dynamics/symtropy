name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Fast Preflight (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    - name: Read pinned Rust toolchain
      id: rust-toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "rust-toolchain.toml does not declare [toolchain].channel" >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Set up pinned Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: preflight

    - name: Run fast reproducible preflight
      run: bash scripts/ci-preflight.sh fast

  test:
    name: Test Suite (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs report independently once the cheap Linux preflight has passed.
      # This preserves cross-platform evidence without spending three hosted
      # runners on formatting/license/workspace-invariant failures.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    - name: Read pinned Rust toolchain
      id: rust-toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "rust-toolchain.toml does not declare [toolchain].channel" >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Set up pinned Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: clippy, rustfmt

    - name: Toolchain provenance
      shell: bash
      run: |
        rustup show active-toolchain
        rustc --version --verbose
        cargo --version
        rustfmt --version
        cargo clippy --version

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
