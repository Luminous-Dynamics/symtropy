name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: PIRB standalone audit (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        cargo generate-lockfile --manifest-path tools/pirb-audit/Cargo.toml
        cargo fmt --manifest-path tools/pirb-audit/Cargo.toml -- --check
        cargo test --locked --manifest-path tools/pirb-audit/Cargo.toml
        cargo clippy --locked --manifest-path tools/pirb-audit/Cargo.toml --all-targets -- -D warnings
        source_commit="$(git rev-parse HEAD)"
        test "$source_commit" = "${{ github.sha }}"
        corpus="docs/fixtures/peace-infrastructure-resilience-v0.1.json"
        schema="docs/schemas/peace-infrastructure-resilience-v0.1.schema.json"
        expected_corpus_sha="$(sha256sum "$corpus" | awk '{print $1}')"
        expected_schema_sha="$(sha256sum "$schema" | awk '{print $1}')"
        cargo run --locked --quiet --manifest-path tools/pirb-audit/Cargo.toml -- --source-commit "$source_commit" > pirb-reference-receipt.json
        dependency_lock_sha="$(sha256sum tools/pirb-audit/Cargo.lock | awk '{print $1}')"
        rustc_version="$(rustc --version)"
        cargo_version="$(cargo --version)"
        jq --arg lock_sha "$dependency_lock_sha" --arg rustc_version "$rustc_version" --arg cargo_version "$cargo_version" '. + {dependency_lock_sha256: $lock_sha, rustc_version: $rustc_version, cargo_version: $cargo_version}' pirb-reference-receipt.json > pirb-reference-receipt.tmp
        mv pirb-reference-receipt.tmp pirb-reference-receipt.json
        jq -e --arg source_commit "$source_commit" --arg corpus_sha "$expected_corpus_sha" --arg schema_sha "$expected_schema_sha" --arg lock_sha "$dependency_lock_sha" --arg rustc_version "$rustc_version" --arg cargo_version "$cargo_version" '
          .result == "pass"
          and .benchmark_version == "PIRB-0.1"
          and .execution_claim == "synthetic_conformance_only"
          and .source_commit == $source_commit
          and (.source_commit | test("^[0-9a-f]{40}$"))
          and .corpus_sha256 == $corpus_sha
          and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
          and .schema_sha256 == $schema_sha
          and (.schema_sha256 | test("^[0-9a-f]{64}$"))
          and .dependency_lock_sha256 == $lock_sha
          and (.dependency_lock_sha256 | test("^[0-9a-f]{64}$"))
          and .rustc_version == $rustc_version
          and .cargo_version == $cargo_version
          and .scenario_count == 12
          and (.scenarios | length == 12)
          and ((.scenarios | map(select(.status != "pass")) | length) == 0)
          and (.findings | length == 0)
        ' pirb-reference-receipt.json

    - name: Upload PIRB exact-head synthetic receipt and dependency lock (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: pirb-synthetic-reference-receipt
        path: |
          pirb-reference-receipt.json
          tools/pirb-audit/Cargo.lock
          docs/fixtures/peace-infrastructure-resilience-v0.1.json
          docs/schemas/peace-infrastructure-resilience-v0.1.schema.json
        if-no-files-found: error
        retention-days: 90
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
