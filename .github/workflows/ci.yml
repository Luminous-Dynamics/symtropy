name: Rustfmt Capture

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: rustfmt-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Rust 1.96 rustfmt patch
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: qualification/q13-rustfmt-capture

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: rustfmt

    - name: Apply canonical formatting
      run: cargo fmt --all

    - name: Capture formatting patch
      id: diff
      shell: bash
      run: |
        git diff --binary > rustfmt.patch
        git diff --stat
        if test -s rustfmt.patch; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload formatting patch
      if: steps.diff.outputs.changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: q13-rustfmt-patch
        path: rustfmt.patch
        if-no-files-found: error

    - name: Commit exact formatter output to capture branch
      if: steps.diff.outputs.changed == 'true'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- '*.rs'
        git commit -m "style: capture canonical Rust 1.96 formatting"
        git push origin HEAD:qualification/q13-rustfmt-capture
