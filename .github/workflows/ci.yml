name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Test Airborne Energy Observability Oracle
      if: ${{ hashFiles('tools/airborne-energy-observability-validator/Cargo.toml') != '' }}
      run: cargo test --locked -p airborne-energy-observability-validator

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets

  civdyn-policy-observability:
    name: CIVDYN Policy Observability Reference
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt
    - name: Check Formatting
      run: cargo fmt --manifest-path research/civdyn-policy-observability/Cargo.toml --all -- --check
    - name: Run Strict Clippy
      run: cargo clippy --locked --manifest-path research/civdyn-policy-observability/Cargo.toml --all-targets -- -D warnings
    - name: Compile and Test
      run: |
        cargo check --locked --manifest-path research/civdyn-policy-observability/Cargo.toml --all-targets
        cargo test --locked --manifest-path research/civdyn-policy-observability/Cargo.toml --all-targets
    - name: Verify Deterministic Policy Observability Contract
      run: |
        set -euo pipefail
        cargo run --quiet --locked --manifest-path research/civdyn-policy-observability/Cargo.toml --bin policy-observability-sweep > /tmp/civdyn-policy-observability.csv
        cargo run --quiet --locked --manifest-path research/civdyn-policy-observability/Cargo.toml --bin policy-observability-sweep > /tmp/civdyn-policy-observability-replay.csv
        cmp /tmp/civdyn-policy-observability.csv /tmp/civdyn-policy-observability-replay.csv
        python3 - <<'PY'
        import csv
        from pathlib import Path

        with Path("/tmp/civdyn-policy-observability.csv").open(newline="", encoding="utf-8") as handle:
            reader = csv.DictReader(handle)
            assert reader.fieldnames is not None and len(reader.fieldnames) == 32
            rows = list(reader)

        assert len(rows) == 6
        assert all(row["truth_contained"] == "true" for row in rows)

        by_key = {(row["scenario_id"], row["policy_id"]): row for row in rows}
        adverse = by_key[("selective_adverse", "masked_failures")]
        transparent = by_key[("selective_adverse", "transparent_service")]
        assert adverse["true_mean"] == "25.000"
        assert adverse["complete_case_mean"] == "100.000"
        assert adverse["observation_coverage"] == "0.250"
        assert adverse["identified_lower"] == "25.000"
        assert adverse["identified_upper"] == "100.000"
        assert adverse["robust_comparison_vs_reference"] == "unresolved"
        assert adverse["true_stratum_gap"] == "50.000"
        assert adverse["missing_telemetry_unavailable_units"] == "1"
        assert adverse["missing_policy_suppressed_units"] == "2"
        assert adverse["high_need_identified_lower"] == "50.000"
        assert adverse["high_need_identified_upper"] == "100.000"
        assert adverse["high_need_observation_coverage"] == "0.500"
        assert transparent["true_mean"] == "60.000"
        assert transparent["complete_case_mean"] == "60.000"

        hidden = by_key[("selective_benefit", "hidden_successes")]
        steady = by_key[("selective_benefit", "steady_service")]
        assert hidden["true_mean"] == "100.000"
        assert hidden["missing_as_zero_mean"] == "25.000"
        assert hidden["robust_comparison_vs_reference"] == "unresolved"
        assert steady["true_mean"] == "60.000"

        mixed = by_key[("mixed_mechanism", "mixed_observation")]
        assert mixed["true_mechanism"] == "mixed"
        assert mixed["true_mean"] == "45.000"
        assert mixed["identified_lower"] == "42.500"
        assert mixed["identified_upper"] == "92.500"
        assert mixed["missing_nonresponse_units"] == "1"
        assert mixed["missing_policy_suppressed_units"] == "1"
        assert mixed["propensity_units"] == "2"
        assert mixed["missing_propensity_units"] == "2"
        assert mixed["high_need_true_mean"] == "50.000"
        assert mixed["high_need_identified_lower"] == "45.000"
        assert mixed["high_need_identified_upper"] == "95.000"
        assert mixed["general_true_mean"] == "40.000"
        assert mixed["general_identified_lower"] == "40.000"
        assert mixed["general_identified_upper"] == "90.000"

        mar = by_key[("mar_positive_control", "mar_known_propensity")]
        assert mar["true_mean"] == "50.000"
        assert mar["known_mar_ht_mean"] == "50.000"
        assert mar["identified_lower"] == "25.000"
        assert mar["identified_upper"] == "75.000"
        assert mar["propensity_units"] == "4"
        assert mar["missing_propensity_units"] == "0"
        assert mar["minimum_propensity_bps"] == "5000"
        assert mar["maximum_propensity_bps"] == "5000"
        assert mar["high_need_observation_coverage"] == "0.500"
        assert mar["general_observation_coverage"] == "0.500"

        print("CIVDYN policy observability contract passed: selection-induced rank reversals, honest bounds, subgroup reporting, MAR positive control and deterministic replay.")
        PY
