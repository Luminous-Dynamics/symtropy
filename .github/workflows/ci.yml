name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    # CIVDYN closed-loop policy reference: keep this small, isolated crate
    # qualified by the repository's existing PR workflow. The dedicated
    # CIVDYN workflow becomes available for subsequent commits after registry.
    - name: CIVDYN Closed-Loop Policy - Format, Clippy, Compile and Tests
      if: runner.os == 'Linux'
      run: |
        cargo fmt --manifest-path research/civdyn-closed-loop-policy/Cargo.toml --all -- --check
        cargo clippy --locked --manifest-path research/civdyn-closed-loop-policy/Cargo.toml --all-targets -- -D warnings
        cargo check --locked --manifest-path research/civdyn-closed-loop-policy/Cargo.toml --all-targets
        cargo test --locked --manifest-path research/civdyn-closed-loop-policy/Cargo.toml --all-targets

    - name: CIVDYN Closed-Loop Policy - Deterministic Known-Answer Contract
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        cargo run --quiet --locked --manifest-path research/civdyn-closed-loop-policy/Cargo.toml --bin closed-loop-policy-sweep > /tmp/civdyn-closed-loop-policy.csv
        cargo run --quiet --locked --manifest-path research/civdyn-closed-loop-policy/Cargo.toml --bin closed-loop-policy-sweep > /tmp/civdyn-closed-loop-policy-replay.csv
        cmp /tmp/civdyn-closed-loop-policy.csv /tmp/civdyn-closed-loop-policy-replay.csv
        python3 - <<'PY'
        import csv
        from pathlib import Path

        with Path("/tmp/civdyn-closed-loop-policy.csv").open(newline="", encoding="utf-8") as handle:
            reader = csv.DictReader(handle)
            fields = reader.fieldnames
            rows = list(reader)

        assert fields is not None and len(fields) == 37
        assert fields[0] == "source_id"
        assert len(rows) == 10
        assert {row["source_id"] for row in rows} == {"synthetic-civdyn-closed-loop-known-answer-v1"}
        worlds = {"water_degradation", "energy_degradation"}
        assert {row["true_world_id"] for row in rows} == worlds

        for world in worlds:
            subset = [row for row in rows if row["true_world_id"] == world]
            assert len(subset) == 5
            assert sum(row["policy_id"] == "evaluator_only_oracle" for row in subset) == 1
            assert sum(row["policy_id"] == "action_conditioned_model" for row in subset) == 2

            oracle = next(row for row in subset if row["policy_id"] == "evaluator_only_oracle")
            assert oracle["evaluator_oracle_access"] == "true"
            assert oracle["terminal_feasible"] == "true"
            assert oracle["cumulative_service_points"] == "50"
            assert oracle["oracle_service_points"] == "50"
            assert oracle["action_ranking_matches"] == "4"

            correct_id = "water_mechanism_model" if world == "water_degradation" else "energy_mechanism_model"
            correct = next(row for row in subset if row["candidate_model_id"] == correct_id)
            assert correct["policy_id"] == "action_conditioned_model"
            assert correct["evaluator_oracle_access"] == "false"
            assert correct["terminal_feasible"] == "true"
            assert correct["cumulative_service_points"] == "50"
            assert correct["raw_service_regret"] == "0"
            assert correct["action_trace"] == oracle["action_trace"]
            assert correct["action_ranking_matches"] == "4"
            assert correct["replan_count"] == "4"
            assert correct["abstention_ticks"] == "0"
            for field in (
                "water_service_mae", "energy_service_mae",
                "water_debt_mae", "energy_debt_mae",
                "water_reserve_mae", "energy_reserve_mae"
            ):
                assert float(correct[field]) == 0.0

            wrong = next(row for row in subset if row["policy_id"] == "action_conditioned_model" and row["candidate_model_id"] != correct_id)
            assert wrong["terminal_feasible"] == "false"
            assert int(wrong["water_floor_violation_ticks"]) + int(wrong["energy_floor_violation_ticks"]) > 0
            assert float(wrong["water_service_mae"]) + float(wrong["energy_service_mae"]) > 0.0

            reactive = next(row for row in subset if row["policy_id"] == "reactive_no_model")
            fixed = next(row for row in subset if row["policy_id"] == "fixed_open_loop")
            assert reactive["evaluator_oracle_access"] == "false"
            assert fixed["evaluator_oracle_access"] == "false"
            assert reactive["terminal_feasible"] == "false"
            assert fixed["terminal_feasible"] == "false"

            for row in subset:
                assert row["horizon"] == "4"
                assert row["decision_count"] == "4"
                assert row["scenario_manifest_digest"].startswith("sha256-")
                assert row["split_manifest_digest"].startswith("sha256-")
                assert row["independent_unit_id"].endswith("-paired-run-001")

        assert any(
            row["terminal_feasible"] == "false"
            and int(row["raw_service_regret"]) < 0
            for row in rows
        )
        print("CIVDYN closed-loop policy contract passed: exact oracle, correct/misspecified model arms, hard constraints, provenance and byte-identical replay.")
        PY

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Test Airborne Energy Observability Oracle
      if: ${{ hashFiles('tools/airborne-energy-observability-validator/Cargo.toml') != '' }}
      run: cargo test --locked -p airborne-energy-observability-validator

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
