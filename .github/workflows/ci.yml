name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Detect anisotropic reference changes
      id: anisotropic_reference_changes
      if: runner.os == 'Linux'
      shell: bash
      env:
        EVENT_BEFORE: ${{ github.event.before }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          changed_files="$(git diff --name-only FETCH_HEAD HEAD)"
        elif [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
          changed_files="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA")"
        else
          changed_files="$(git ls-tree --name-only -r HEAD)"
        fi
        while IFS= read -r changed_path; do
          case "$changed_path" in
            .github/workflows/ci.yml|.github/workflows/anisotropic-reference.yml|\
            crates/core/symtropy-math/Cargo.toml|crates/core/symtropy-math/src/bivector.rs|\
            crates/core/symtropy-physics/Cargo.toml|crates/core/symtropy-physics/src/lib.rs|crates/core/symtropy-physics/src/angular_dynamics.rs|\
            crates/core/symtropy-physics/src/bivector_inertia.rs|crates/core/symtropy-physics/src/compound_inertia_3d.rs|\
            crates/core/symtropy-physics/src/mass_properties_3d.rs|crates/core/symtropy-physics/tests/angular_convention_reference.rs|\
            crates/core/symtropy-physics/examples/anisotropic_reference_campaign.rs|crates/core/symtropy-physics/*_VALIDATION.md|\
            crates/core/symtropy-physics/README.md|Cargo.lock)
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
        done <<< "$changed_files"
        echo 'changed=false' >> "$GITHUB_OUTPUT"

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Qualify anisotropic reference campaign (D=2..9)
      if: runner.os == 'Linux' && steps.anisotropic_reference_changes.outputs.changed == 'true'
      run: |
        cargo test --locked -p symtropy-math --lib --features nd-bivector-9
        cargo test --locked -p symtropy-physics --lib --features nd-bivector-9
        cargo test --locked -p symtropy-physics --example anisotropic_reference_campaign --features nd-bivector-9
        cargo run --locked --release -p symtropy-physics --example anisotropic_reference_campaign --features nd-bivector-9

    - name: Test Airborne Energy Observability Oracle
      if: ${{ hashFiles('tools/airborne-energy-observability-validator/Cargo.toml') != '' }}
      run: cargo test --locked -p airborne-energy-observability-validator

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
