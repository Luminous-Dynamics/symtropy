name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Test Airborne Energy Observability Oracle
      if: ${{ hashFiles('tools/airborne-energy-observability-validator/Cargo.toml') != '' }}
      run: cargo test --locked -p airborne-energy-observability-validator

    - name: Qualify CIVDYN Active Sensing Reference
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        cargo fmt --manifest-path research/civdyn-active-sensing/Cargo.toml --all -- --check
        cargo clippy --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --all-targets -- -D warnings
        cargo check --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --all-targets
        cargo test --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --all-targets
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin active-sensing-sweep > /tmp/civdyn-active-sensing.csv
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin active-sensing-sweep > /tmp/civdyn-active-sensing-replay.csv
        cmp /tmp/civdyn-active-sensing.csv /tmp/civdyn-active-sensing-replay.csv
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin active-sensing-sweep -- --candidate-policy-map > /tmp/civdyn-active-sensing-candidate.csv
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin active-sensing-sweep -- --candidate-policy-map > /tmp/civdyn-active-sensing-candidate-replay.csv
        cmp /tmp/civdyn-active-sensing-candidate.csv /tmp/civdyn-active-sensing-candidate-replay.csv
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin sequential-active-sensing-sweep > /tmp/civdyn-sequential-sensing.csv
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin sequential-active-sensing-sweep > /tmp/civdyn-sequential-sensing-replay.csv
        cmp /tmp/civdyn-sequential-sensing.csv /tmp/civdyn-sequential-sensing-replay.csv
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin sequential-active-sensing-sweep -- --candidate-policy-map > /tmp/civdyn-sequential-sensing-candidate.csv
        cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin sequential-active-sensing-sweep -- --candidate-policy-map > /tmp/civdyn-sequential-sensing-candidate-replay.csv
        cmp /tmp/civdyn-sequential-sensing-candidate.csv /tmp/civdyn-sequential-sensing-candidate-replay.csv
        python3 - <<'PY'
        import csv
        from pathlib import Path

        with Path("/tmp/civdyn-active-sensing.csv").open(newline="", encoding="utf-8") as handle:
            reader = csv.DictReader(handle)
            assert reader.fieldnames is not None and len(reader.fieldnames) == 27
            rows = list(reader)

        summary = {
            row["sensor_id"]: row for row in rows
            if row["record_type"] == "sensor_summary"
            and row["scenario_id"] == "three-world-sensor-dual-control-v1"
        }
        lift = {
            row["sensor_id"]: row for row in rows
            if row["record_type"] == "sensor_summary"
            and row["scenario_id"] == "two-world-feasibility-lift-v1"
        }
        assert set(summary) == {
            "remote_telemetry",
            "independent_field_inspection",
            "uninformative_status_check",
            "over_budget_lab_test",
        }
        assert set(lift) == {
            "decision_separating_inspection",
            "uninformative_feasibility_check",
        }

        assert {float(row["baseline_worst_regret"]) for row in summary.values()} == {15.0}
        assert {row["baseline_policy_id"] for row in summary.values()} == {"repair"}

        field = summary["independent_field_inspection"]
        assert field["status"] == "evaluated"
        assert field["energy_cost_service_units"] == "1.000000"
        assert field["maximum_latency_service_loss"] == "3.000000"
        assert field["maximum_total_penalty_service_units"] == "4.000000"
        assert field["worst_case_post_sensing_regret"] == "4.000000"
        assert field["regret_reduction"] == "11.000000"
        assert field["recommended"] == "true"
        assert field["resolves_no_sensing_infeasibility"] == "false"

        remote = summary["remote_telemetry"]
        assert remote["worst_case_post_sensing_regret"] == "20.000000"
        assert remote["regret_reduction"] == "-5.000000"
        assert remote["recommended"] == "false"
        missing = [
            row for row in rows
            if row["record_type"] == "observation_partition"
            and row["scenario_id"] == "three-world-sensor-dual-control-v1"
            and row["sensor_id"] == "remote_telemetry"
            and row["observation_id"] == "missing"
        ]
        assert len(missing) == 1
        assert missing[0]["partition_world_count"] == "2"
        assert set(missing[0]["world_ids"].split(";")) == {
            "degraded", "healthy_sensor_fault"
        }

        unknown = summary["uninformative_status_check"]
        assert unknown["worst_case_post_sensing_regret"] == "15.000000"
        assert unknown["regret_reduction"] == "0.000000"
        assert unknown["recommended"] == "false"

        expensive = summary["over_budget_lab_test"]
        assert expensive["status"] == "over_budget"
        assert expensive["affordable"] == "false"
        assert expensive["recommended"] == "false"

        audit = [
            row for row in rows
            if row["record_type"] == "evaluator_prediction_audit"
            and row["scenario_id"] == "three-world-sensor-dual-control-v1"
            and row["sensor_id"] == "remote_telemetry"
            and row["observation_id"] == "missing"
        ]
        assert len(audit) == 2
        assert {row["evaluator_missing_cause"] for row in audit} == {
            "common_cause_power_loss", "telemetry_network_fault"
        }
        assert all(row["prediction_receipt_digest"] for row in audit)

        lift_inspection = lift["decision_separating_inspection"]
        assert lift_inspection["status"] == "evaluated"
        assert lift_inspection["baseline_policy_id"] == ""
        assert lift_inspection["baseline_worst_regret"] == ""
        assert lift_inspection["worst_case_post_sensing_regret"] == "0.500000"
        assert lift_inspection["regret_reduction"] == ""
        assert lift_inspection["resolves_no_sensing_infeasibility"] == "true"
        assert lift_inspection["recommended"] == "true"

        blind = lift["uninformative_feasibility_check"]
        assert blind["status"] == "no_feasible_policy"
        assert blind["resolves_no_sensing_infeasibility"] == "false"
        assert blind["recommended"] == "false"

        with Path("/tmp/civdyn-active-sensing-candidate.csv").open(newline="", encoding="utf-8") as handle:
            candidate_reader = csv.DictReader(handle)
            assert candidate_reader.fieldnames == ["scenario_id", "sensor_id", "observation_id", "action_id"]
            candidate_rows = list(candidate_reader)

        assert len(candidate_rows) == 4
        assert all(set(row) == {"scenario_id", "sensor_id", "observation_id", "action_id"} for row in candidate_rows)
        assert not any("world" in key or "missing_cause" in key or "regret" in key for key in candidate_reader.fieldnames)
        candidate_map = {(row["scenario_id"], row["observation_id"]): (row["sensor_id"], row["action_id"]) for row in candidate_rows}
        assert candidate_map[("three-world-sensor-dual-control-v1", "healthy")] == ("independent_field_inspection", "defer")
        assert candidate_map[("three-world-sensor-dual-control-v1", "degraded")] == ("independent_field_inspection", "repair")
        assert candidate_map[("two-world-feasibility-lift-v1", "world_a_detected")] == ("decision_separating_inspection", "repair_a")
        assert candidate_map[("two-world-feasibility-lift-v1", "world_b_detected")] == ("decision_separating_inspection", "repair_b")

        with Path("/tmp/civdyn-sequential-sensing.csv").open(newline="", encoding="utf-8") as handle:
            seq_reader = csv.DictReader(handle)
            assert seq_reader.fieldnames is not None and len(seq_reader.fieldnames) == 24
            seq_rows = list(seq_reader)

        seq_summary = [row for row in seq_rows if row["record_type"] == "plan_summary"]
        assert len(seq_summary) == 1
        seq = seq_summary[0]
        assert seq["scenario_id"] == "nonmyopic-two-stage-sensing-v1"
        assert seq["plan_id"] == "setup-then-inspect"
        assert seq["status"] == "evaluated"
        assert seq["recommended"] == "true"
        assert seq["myopic_stage_one_status"] == "no_feasible_policy"
        assert seq["myopic_stage_one_regret"] == ""
        assert seq["baseline_common_feasible_policy_count"] == "0"
        assert seq["total_energy_kwh"] == "0.250000"
        assert seq["total_energy_cost_service_units"] == "0.500000"
        assert seq["total_latency_ticks"] == "2"
        assert seq["maximum_latency_service_loss"] == "0.700000"
        assert seq["maximum_total_penalty_service_units"] == "1.200000"
        assert seq["worst_case_post_sensing_regret"] == "1.200000"
        assert seq["regret_reduction"] == ""
        assert seq["resolves_no_sensing_infeasibility"] == "true"

        seq_partitions = [row for row in seq_rows if row["record_type"] == "observation_partition"]
        assert len(seq_partitions) == 2
        assert {row["observation_history"] for row in seq_partitions} == {
            "ready>trace_alpha", "ready>trace_beta"
        }
        assert {row["selected_policy_id"] for row in seq_partitions} == {"repair_a", "repair_b"}
        seq_worlds = [row for row in seq_rows if row["record_type"] == "world_regret"]
        assert len(seq_worlds) == 2
        assert {row["world_regret"] for row in seq_worlds} == {"1.200000"}
        assert {row["world_penalty"] for row in seq_worlds} == {"1.200000"}

        with Path("/tmp/civdyn-sequential-sensing-candidate.csv").open(newline="", encoding="utf-8") as handle:
            seq_candidate_reader = csv.DictReader(handle)
            assert seq_candidate_reader.fieldnames == ["scenario_id", "plan_id", "observation_history", "action_id"]
            seq_candidate_rows = list(seq_candidate_reader)
        assert len(seq_candidate_rows) == 2
        assert {row["observation_history"]: row["action_id"] for row in seq_candidate_rows} == {
            "ready>trace_alpha": "repair_a",
            "ready>trace_beta": "repair_b",
        }
        assert not any("world" in key or "regret" in key or "penalty" in key for key in seq_candidate_reader.fieldnames)

        print("CIVDYN active-sensing contract passed: energy/latency costs, common-cause missingness, feasibility lift, budget gate and byte-identical replay.")
        PY

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
