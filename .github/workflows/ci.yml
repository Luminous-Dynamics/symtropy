name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Run Tests (Housing Evidence Verifier)
      run: cargo test -p symtropy-housing-evidence

    - name: Smoke Test Housing Evidence Manifest (Linux)
      if: runner.os == 'Linux'
      run: |
        cargo run -q -p symtropy-housing-evidence -- docs/built-environment/fixtures/example-not-evidence.json > /tmp/housing-evidence-report.json
        python3 -c 'import json; r=json.load(open("/tmp/housing-evidence-report.json")); assert r["schema_valid"] is True, r; assert r["effective_status"] == "NOT_EVALUATED", r; assert r["declared_status"] == "NOT_EVALUATED", r'

    - name: Smoke Test Home Layout Candidate (Linux)
      if: runner.os == 'Linux'
      run: |
        cargo run -q -p symtropy-housing-evidence -- --validate-layout docs/built-environment/fixtures/example-home-layout-candidate.json --brief docs/built-environment/fixtures/example-home-design-brief.json > /tmp/home-layout-report.json
        python3 -c 'import json; r=json.load(open("/tmp/home-layout-report.json")); assert r["contract_status"] == "LAYOUT_CANDIDATE_CONTRACT_VALID", r; assert r["reference_valid"] is True, r; assert r["geometry_valid"] is True, r'

    - name: Smoke Test Jurisdiction Evidence Registry (Linux)
      if: runner.os == 'Linux'
      run: |
        cargo run -q -p symtropy-housing-evidence -- --validate-jurisdiction-registry docs/built-environment/fixtures/example-jurisdiction-evidence-registry.json > /tmp/jurisdiction-registry-report.json
        python3 -c 'import json; r=json.load(open("/tmp/jurisdiction-registry-report.json")); assert r["registry_contract_status"] == "REGISTRY_VALID", r; assert r["ready_for_rule_evaluation_count"] == 0, r; assert any(x["readiness_reasons"] for x in r["records"]), r'

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets

