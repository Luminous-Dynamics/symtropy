name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Test Airborne Energy Observability Oracle
      if: ${{ hashFiles('tools/airborne-energy-observability-validator/Cargo.toml') != '' }}
      run: cargo test --locked -p airborne-energy-observability-validator

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets

  factory-fjsplib-adapter:
    name: FJSPLib Import + Exact Oracle + CP-SAT Cross-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Verify pinned FJSPLib corpus inventory
        shell: bash
        run: |
          index="tools/factory-fjsplib-adapter/corpus/fjsplib-index-2026-10-22.tsv"
          test "$(git hash-object "$index")" = "ffca6cdf55103205bcca73746324f94691ceeb87"
          awk -F '\\t' '
            NR == 1 { next }
            {
              rows++
              logical[$1] = 1
              formats[$6]++
              classes[$6 "/" $2]++
            }
            END {
              for (id in logical) unique++
              if (rows != 854 || unique != 452 ||
                  formats["fjsp"] != 402 || formats["fajsp"] != 452 ||
                  classes["fjsp/classic_fjsp"] != 138 ||
                  classes["fjsp/machine_independent_fjsp"] != 264 ||
                  classes["fajsp/classic_fjsp"] != 138 ||
                  classes["fajsp/machine_independent_fjsp"] != 264 ||
                  classes["fajsp/flexible_assembly_fjsp"] != 50) {
                print "FJSPLib inventory count mismatch" > "/dev/stderr"
                exit 1
              }
            }
          ' "$index"
      - name: Verify frozen fixture blob identities
        shell: bash
        run: |
          tab="$(printf '\t')"
          while IFS="$tab" read -r format path blob_sha1 byte_count provenance; do
            [[ "$format" == "format" ]] && continue
            test -n "$path"
            test "$(wc -c < "$path")" -eq "$byte_count"
            test "$(git hash-object "$path")" = "$blob_sha1"
          done < tools/factory-fjsplib-adapter/fixtures/manifest.tsv
      - name: Format
        run: cargo fmt --manifest-path tools/factory-fjsplib-adapter/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/factory-fjsplib-adapter/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path tools/factory-fjsplib-adapter/Cargo.toml --all-targets
      - name: Import both FJSPLib formats
        shell: bash
        run: |
          cargo run --quiet --manifest-path tools/factory-fjsplib-adapter/Cargo.toml --bin fjsp-inspect -- --reference-fjsp | tee /tmp/fjsplib-fjsp.tsv
          cargo run --quiet --manifest-path tools/factory-fjsplib-adapter/Cargo.toml --bin fjsp-inspect -- --reference-fajsp | tee /tmp/fjsplib-fajsp.tsv
          test "$(wc -l < /tmp/fjsplib-fjsp.tsv)" -eq 16
          test "$(wc -l < /tmp/fjsplib-fajsp.tsv)" -eq 16
          awk -F '\t' '$1 == "SUMMARY" && $2 == "fattahi1" && $3 == "fjsp" && $4 == "2" && $5 == "2" { found=1 } END { exit !found }' /tmp/fjsplib-fjsp.tsv
          awk -F '\t' '$1 == "SUMMARY" && $2 == "fattahi1" && $3 == "fajsp" && $4 == "2" && $5 == "2" { found=1 } END { exit !found }' /tmp/fjsplib-fajsp.tsv
      - name: Import stratified Fattahi sample
        shell: bash
        run: |
          for format in fjsp fajsp; do
            for instance in fattahi1 fattahi5 fattahi10 fattahi20; do
              path="tools/factory-fjsplib-adapter/fixtures/${instance}.${format}"
              cargo run --quiet --manifest-path tools/factory-fjsplib-adapter/Cargo.toml --bin fjsp-inspect -- "$format" "$instance" "$path" \
                | awk -F '\\t' -v id="$instance" -v fmt="$format" '$1 == "SUMMARY" && $2 == id && $3 == fmt { found=1 } END { exit !found }'
            done
          done
      - name: Verify exact schedule certificates
        shell: bash
        run: |
          cargo run --quiet --manifest-path tools/factory-fjsplib-adapter/Cargo.toml --bin fjsp-solve -- --reference-fjsp | tee /tmp/fjsplib-fjsp-solved.tsv
          cargo run --quiet --manifest-path tools/factory-fjsplib-adapter/Cargo.toml --bin fjsp-solve -- --reference-fajsp | tee /tmp/fjsplib-fajsp-solved.tsv
          test "$(wc -l < /tmp/fjsplib-fjsp-solved.tsv)" -eq 8
          test "$(wc -l < /tmp/fjsplib-fajsp-solved.tsv)" -eq 8
          awk -F '\t' '$1 == "SUMMARY" && $4 == "EXACT" && $5 == "true" && $6 == "66" && $7 == "16" && $8 == "120" && $9 == "68" && $10 == "52" { found=1 } END { exit !found }' /tmp/fjsplib-fjsp-solved.tsv
          awk -F '\t' '$1 == "SUMMARY" && $4 == "EXACT" && $5 == "true" && $6 == "66" && $7 == "16" && $8 == "120" && $9 == "68" && $10 == "52" { found=1 } END { exit !found }' /tmp/fjsplib-fajsp-solved.tsv
      - name: Set up benchmark-only Python reference
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned OR-Tools CP-SAT
        run: python -m pip install --disable-pip-version-check --only-binary=:all: ortools==9.15.6755
      - name: Independent CP-SAT cross-check
        shell: bash
        run: |
          python tools/factory-fjsplib-adapter/reference/ortools_fattahi1_check.py --format fjsp tools/factory-fjsplib-adapter/fixtures/fattahi1.fjsp | tee /tmp/fjsplib-cpsat-fjsp-reference.json
          python tools/factory-fjsplib-adapter/reference/ortools_fattahi1_check.py --format fajsp tools/factory-fjsplib-adapter/fixtures/fattahi1.fajsp | tee /tmp/fjsplib-cpsat-fajsp-reference.json
          grep -F '"status": "OPTIMAL"' /tmp/fjsplib-cpsat-fjsp-reference.json
          grep -F '"objective": 66' /tmp/fjsplib-cpsat-fjsp-reference.json
          grep -F '"best_bound": 66' /tmp/fjsplib-cpsat-fjsp-reference.json
          grep -F '"status": "OPTIMAL"' /tmp/fjsplib-cpsat-fajsp-reference.json
          grep -F '"objective": 66' /tmp/fjsplib-cpsat-fajsp-reference.json
          grep -F '"best_bound": 66' /tmp/fjsplib-cpsat-fajsp-reference.json
