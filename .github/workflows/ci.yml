name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  freeze-integration-subject:
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Freeze PR integration subject
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.freeze.outputs.base_sha }}
      head_sha: ${{ steps.freeze.outputs.head_sha }}
      tree_sha: ${{ steps.freeze.outputs.tree_sha }}
    steps:
    - name: Check out exact PR head with full history
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Test frozen-subject bootstrap
      shell: bash
      run: bash tests/ci/test-freeze-pr-integration-subject.sh

    - name: Compute frozen integration subject
      id: freeze
      shell: bash
      env:
        EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash scripts/freeze-pr-integration-subject.sh "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"

  test:
    needs: freeze-integration-subject
    # `always()` is required so push-to-main/stabilize matrices still run when
    # the PR-only freeze job is skipped. Pull-request matrices require the
    # bootstrap to succeed before any OS lane can execute.
    if: ${{ always() && !startsWith(github.head_ref, 'ci/living-world-') && (github.event_name != 'pull_request' || needs.freeze-integration-subject.result == 'success') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    # Every PR lane must prove that its actual provider checkout is the same
    # immutable integration subject independently computed by the bootstrap.
    - name: Verify immutable PR integration subject
      id: integration-subject
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        EXPECTED_BASE_SHA: ${{ needs.freeze-integration-subject.outputs.base_sha }}
        EXPECTED_HEAD_SHA: ${{ needs.freeze-integration-subject.outputs.head_sha }}
        EXPECTED_TREE_SHA: ${{ needs.freeze-integration-subject.outputs.tree_sha }}
      run: bash scripts/verify-pr-integration-subject.sh "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA" "$EXPECTED_TREE_SHA"

    # Hermetic authority regression stays ahead of apt/network setup so an
    # unrelated package-mirror outage cannot erase evidence about this guard.
    - name: Test integration subject verifier
      if: runner.os == 'Linux'
      shell: bash
      run: bash tests/ci/test-verify-pr-integration-subject.sh

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
