name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    # This guard validates only the committed synthetic flow corpus and DOE manifest.
    # The reusable validator checks run/manifest joins, provenance, interval shape and digests.
    - name: Lunar Granular Flow Benchmark Fixture (Linux)
      if: runner.os == 'Linux'
      run: bash scripts/check-lunar-granular-flow-fixture.sh

    # These are standalone tool workspaces, so the main workspace matrix does not
    # automatically compile them. Keep their formatting, tests, Clippy and JSON
    # example executions explicit on Linux.
    - name: Lunar Source Artifact Registration (Linux)
      if: runner.os == 'Linux'
      run: bash scripts/check-lunar-granular-flow-source-registration.sh

    - name: Lunar Feeder Controller Tournament (Linux)
      if: runner.os == 'Linux'
      run: bash scripts/check-lunar-feeder-controller-tournament.sh

    - name: Lunar Granular Flow Source Registry (Linux)
      if: runner.os == 'Linux'
      run: bash scripts/check-lunar-granular-flow-sources.sh

    - name: Lunar Granular Flow Rust Tools (Linux)
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        for manifest in \
          tools/lunar-granular-flow-similarity/Cargo.toml \
          tools/lunar-regolith-feeder-supervisor/Cargo.toml
        do
          cargo fmt --manifest-path "$manifest" -- --check
          cargo test --manifest-path "$manifest"
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
        done
        cargo run --quiet --manifest-path tools/lunar-granular-flow-similarity/Cargo.toml -- \
          tools/lunar-granular-flow-similarity/examples/synthetic-similarity-input.json \
          > /tmp/lunar-granular-flow-similarity-report.json
        jq -e '.overall_status == "within_declared_similarity_envelope" and (.coordinates | length) == 12' \
          /tmp/lunar-granular-flow-similarity-report.json >/dev/null
        cargo run --quiet --manifest-path tools/lunar-regolith-feeder-supervisor/Cargo.toml -- \
          tools/lunar-regolith-feeder-supervisor/examples/synthetic-supervisor-input.json \
          > /tmp/lunar-regolith-feeder-supervisor-decision.json
        jq -e '.mode == "normal" and .feeder_command == "hold" and .vibration_command == "hold"' \
          /tmp/lunar-regolith-feeder-supervisor-decision.json >/dev/null

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Test Airborne Energy Observability Oracle
      if: ${{ hashFiles('tools/airborne-energy-observability-validator/Cargo.toml') != '' }}
      run: cargo test --locked -p airborne-energy-observability-validator

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
