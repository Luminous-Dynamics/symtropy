name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets

  external-jobshop-parity:
    name: External FJSP-SDST input parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check out pinned upstream benchmark inputs
        uses: actions/checkout@v4
        with:
          repository: ai-for-decision-making-tue/Job_Shop_Scheduling_Benchmark_Environments_and_Instances
          ref: d088a26582f5cb79c6b4f2ad94f68ac7c50878cb
          path: upstream-benchmark
          sparse-checkout: |
            LICENSE
            data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify upstream provenance and exact fixture bytes
        run: |
          test "$(git -C upstream-benchmark rev-parse HEAD)" = "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
          test "$(git -C upstream-benchmark hash-object data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs)" = "6bac8cfaf9f326f6405d5396b9cedd12941aba94"
          cmp upstream-benchmark/data/fjsp_sdst/fattahi/Fattahi_setup_01.fjs tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs
          cmp upstream-benchmark/LICENSE tools/ev-external-jobshop-parity/UPSTREAM_LICENSE_MIT.txt
      - name: Format, lint and test standalone Rust crate
        run: |
          cargo fmt --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- --check
          cargo clippy --manifest-path tools/ev-external-jobshop-parity/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/ev-external-jobshop-parity/Cargo.toml
      - name: Validate frozen public-instance structure
        run: |
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            > ev-external-jobshop-parity-report.json
          jq -e '
            .schema_version == "external-jobshop-input-parity/0.1"
            and .status == "input_and_tiny_exact_makespan_oracle_validated_not_policy_benchmarked"
            and .benchmark_id == "FJSP-SDST-FATTAHI-001"
            and .source_commit == "d088a26582f5cb79c6b4f2ad94f68ac7c50878cb"
            and .expected_source_git_blob_sha1 == "6bac8cfaf9f326f6405d5396b9cedd12941aba94"
            and .observed_jobs == 2
            and .observed_machines == 2
            and .observed_operations == 4
            and .operation_alternative_counts == [2,2,2,2]
            and .setup_matrix_dimensions == [2,4,4]
            and .setup_values_min == 3
            and .setup_values_max == 8
            and .exact_oracle.candidate_assignment_sequence_combinations == 120
            and .exact_oracle.feasible_acyclic_schedules == 52
            and .exact_oracle.optimal_makespan == 70
            and .exact_oracle.optimal_machine_assignment_upstream_ids == [2,2,1,1]
            and .exact_oracle.exhaustive_for_declared_instance
            and (.exact_oracle.optimal_schedule | length) == 4
            and .primary_objective == "makespan"
            and .supports_due_dates == false
            and (.claim_ceiling | contains("No dispatching policy was executed"))
          ' ev-external-jobshop-parity-report.json
      - name: Negative control - malformed setup matrix is rejected
        run: |
          sed 's/^6 3 4 4 /6 3 4 /' \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs > invalid-external-instance.fjs
          if cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            invalid-external-instance.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            > /dev/null 2> invalid-external-instance.stderr; then
            echo "Malformed setup matrix unexpectedly passed" >&2
            exit 1
          fi
          grep -q "setup_row_width_mismatch" invalid-external-instance.stderr
      - name: Deterministic replay and SHA-256 manifest
        run: |
          cargo run --quiet --manifest-path tools/ev-external-jobshop-parity/Cargo.toml -- \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            > ev-external-jobshop-parity-report-repeat.json
          cmp ev-external-jobshop-parity-report.json ev-external-jobshop-parity-report-repeat.json
          sha256sum \
            tools/ev-external-jobshop-parity/src/main.rs \
            tools/ev-external-jobshop-parity/fixtures/fattahi_setup_01.fjs \
            tools/ev-external-jobshop-parity/fixtures/external_manifest_v0_1.json \
            tools/ev-external-jobshop-parity/UPSTREAM_NOTICE.md \
            tools/ev-external-jobshop-parity/UPSTREAM_LICENSE_MIT.txt \
            docs/research/EV_FACTORY_EXTERNAL_BENCHMARK_PARITY_V0_1.md \
            ev-external-jobshop-parity-report.json \
            > ev-external-jobshop-parity-report.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: external-jobshop-input-parity-report
          path: |
            ev-external-jobshop-parity-report.json
            ev-external-jobshop-parity-report.sha256
          if-no-files-found: error

