name: CI

on:
  push:
    branches: [ "main", "stabilize/*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Living World exact-head qualification helpers have their own dedicated,
    # immutable-product workflows. Running the full 3-OS workspace matrix on
    # those helper PRs duplicates runner demand without adding product evidence.
    # Product/oracle PRs keep normal CI; pushes to main/stabilize also keep it
    # because github.head_ref is empty outside pull_request events.
    if: ${{ !startsWith(github.head_ref, 'ci/living-world-') }}
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Legs must report independently. Under the default fail-fast, the
      # ubuntu leg's failure cancelled windows and macos mid-run, so from
      # 2026-06-21 to 2026-07-28 their status was simply unknown -- we could
      # not tell whether the Windows checkout problem diagnosed on 2026-07-13
      # was fixed, because Windows never got to finish again.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    # Keep CI on the same explicit toolchain as rust-toolchain.toml. The action
    # ref remains stable, but the installed compiler/lints are pinned so an
    # unrelated Rust release cannot turn the repository red.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    # Repo-invariant guards. These scripts existed since at least June but were
    # wired into nothing, so both of them silently failed against the tree for
    # weeks: check-workspace.sh still asserted `Bevy 0.18.1` (the workspace has
    # been on 0.19.0 since the dual-bevy cleanup) plus a hardcoded 14-crate
    # member list against 60 real members, and check-licenses.sh was finding 13
    # crates with no `license` field and a real SPDX mismatch. Both are now
    # repaired and enforced. Linux only -- they are filesystem/manifest checks
    # with no platform-specific behaviour, and rg/python3 are not guaranteed on
    # the Windows and macOS runners.
    - name: Workspace Invariants (members, single Bevy, portable paths, no placeholders)
      if: runner.os == 'Linux'
      run: bash scripts/check-workspace.sh

    - name: License Headers (SPDX matches package license)
      if: runner.os == 'Linux'
      run: bash scripts/check-licenses.sh

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run Tests (Physics Core)
      run: cargo test -p symtropy-math -p symtropy-physics -p symtropy-consciousness-physics --lib

    - name: Test Airborne Energy Observability Oracle
      if: ${{ hashFiles('tools/airborne-energy-observability-validator/Cargo.toml') != '' }}
      run: cargo test --locked -p airborne-energy-observability-validator

    - name: Qualify Lunar Subsurface Reference (Linux)
      if: runner.os == 'Linux'
      run: |
        cargo fmt --manifest-path tools/lunar-subsurface-reference/Cargo.toml -- --check
        cargo test --manifest-path tools/lunar-subsurface-reference/Cargo.toml
        cargo clippy --manifest-path tools/lunar-subsurface-reference/Cargo.toml --all-targets -- -D warnings
        cargo run --manifest-path tools/lunar-subsurface-reference/Cargo.toml --release > lunar-subsurface-report-1.json
        cargo run --manifest-path tools/lunar-subsurface-reference/Cargo.toml --release > lunar-subsurface-report-2.json
        cmp lunar-subsurface-report-1.json lunar-subsurface-report-2.json
        mv lunar-subsurface-report-1.json lunar-subsurface-reference.json
        jq -e . lunar-subsurface-reference.json >/dev/null
        jq -e '.evidence_class == "geometry_only_excavation_volume_screen" and .scenario_count == 72 and (.scenarios | length) == 72' lunar-subsurface-reference.json >/dev/null
        jq -e 'any(.scenarios[]; .circumference_km == 100 and .excavated_cross_section_m2 == 30 and .bore_count == 1 and .overbreak_fraction == 0 and .design_bore_volume_m3 == 3000000 and .total_excavation_volume_m3 == 3000000)' lunar-subsurface-reference.json >/dev/null
        jq -e 'any(.scenarios[]; .circumference_km == 100 and .excavated_cross_section_m2 == 30 and .bore_count == 2 and .overbreak_fraction == 0.2 and .total_excavation_volume_m3 == 7200000)' lunar-subsurface-reference.json >/dev/null
        jq -e 'any(.scenarios[]; .circumference_km == 150 and .excavated_cross_section_m2 == 40 and .bore_count == 2 and .overbreak_fraction == 0.2 and .total_excavation_volume_m3 == 14400000)' lunar-subsurface-reference.json >/dev/null
        jq -e '.material_accounting.evidence_class == "literature_bounded_in_situ_bulk_mass_scenarios" and (.material_accounting.rock_mass_examples | length) == 2' lunar-subsurface-reference.json >/dev/null
        jq -e 'any(.material_accounting.rock_mass_examples[]; .material_record_id == "LUNAR-HIGHLAND-CRUST-BULK-2012" and .single_bore_mass_min_kg == 6600000000 and .single_bore_mass_max_kg == 7800000000 and .two_bore_mass_min_kg == 15840000000 and .two_bore_mass_max_kg == 18720000000)' lunar-subsurface-reference.json >/dev/null
        jq -e 'any(.material_accounting.rock_mass_examples[]; .material_record_id == "LUNAR-IMPACT-BASIN-EJECTA-BULK-2012" and .single_bore_mass_min_kg == 7050000000 and .single_bore_mass_max_kg == 7800000000 and .two_bore_mass_min_kg == 16920000000 and .two_bore_mass_max_kg == 18720000000)' lunar-subsurface-reference.json >/dev/null
        jq -e '(.material_accounting.regolith_density_catalog | length) == 4 and (.material_accounting.simulant_density_catalog | length) == 3 and .material_accounting.loose_spoil_and_swell.status == "not_calculated"' lunar-subsurface-reference.json >/dev/null
        {
          echo "source_commit=$(git rev-parse HEAD)"
          echo "rustc=$(rustc --version)"
          echo "cargo=$(cargo --version)"
          sha256sum tools/lunar-subsurface-reference/Cargo.toml
          sha256sum tools/lunar-subsurface-reference/README.md
          sha256sum tools/lunar-subsurface-reference/src/main.rs
          sha256sum tools/lunar-subsurface-reference/src/material_accounting.rs
          sha256sum lunar-subsurface-reference.json
        } > lunar-subsurface-evidence-manifest.txt

    - name: Retain lunar subsurface reference evidence (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: lunar-subsurface-reference-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          lunar-subsurface-reference.json
          lunar-subsurface-evidence-manifest.txt
        if-no-files-found: error
        retention-days: 90

    - name: Verify Workspace Build
      run: cargo check --workspace --all-targets
