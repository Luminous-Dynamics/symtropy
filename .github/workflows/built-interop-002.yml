name: BUILT-INTEROP-002 IFC IDS Adapter

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/built-interop-002/**"
      - ".github/workflows/built-interop-002.yml"
      - "rust-toolchain.toml"
  push:
    branches: ["main"]
    paths:
      - "tools/built-interop-002/**"
      - ".github/workflows/built-interop-002.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: built-interop-002-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Format, test and lint bounded IFC4 IDS 1.0 adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Verify committed dependency lock
        run: echo "c1b085da9595c03b93d5f9b959532f7c4d9c56eaa325d1b4118c0399308f6c7e  tools/built-interop-002/Cargo.lock" | sha256sum -c -
      - name: Check formatting
        run: cargo fmt --manifest-path tools/built-interop-002/Cargo.toml -- --check
      - name: Run IFC/IDS synthetic contract tests
        run: cargo test --locked --manifest-path tools/built-interop-002/Cargo.toml
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/built-interop-002/Cargo.toml --all-targets -- -D warnings
