name: BUILT-INTEROP-002 IFC IDS Adapter

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/built-interop-002/**"
      - ".github/workflows/built-interop-002.yml"
      - "rust-toolchain.toml"
  push:
    branches: ["main"]
    paths:
      - "tools/built-interop-002/**"
      - ".github/workflows/built-interop-002.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: built-interop-002-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Format, test and lint bounded IFC4 IDS 1.0 adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Resolve exact direct pins and generate preliminary lockfile
        run: |
          cargo generate-lockfile --manifest-path tools/built-interop-002/Cargo.toml
          sha256sum tools/built-interop-002/Cargo.lock
          cat tools/built-interop-002/Cargo.lock
      - name: Check formatting
        run: cargo fmt --manifest-path tools/built-interop-002/Cargo.toml -- --check
      - name: Run IFC/IDS synthetic contract tests
        run: cargo test --manifest-path tools/built-interop-002/Cargo.toml
      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path tools/built-interop-002/Cargo.toml --all-targets -- -D warnings
