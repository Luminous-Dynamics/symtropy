name: Careframe Standalone Lockfile Regeneration (Temporary)

on:
  push:
    branches:
      - "research/medical-humanoid-platform-v0"
    paths:
      - "tools/medical-robot-tool-gate/Cargo.toml"
      - "tools/careframe-observation-audit/Cargo.toml"
      - ".github/workflows/careframe-regenerate-locks.yml"

permissions:
  contents: read

concurrency:
  group: careframe-lockfile-regeneration
  cancel-in-progress: true

jobs:
  regenerate:
    name: Resolve standalone lockfiles without committing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Resolve Cargo.lock for both standalone tools
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path tools/medical-robot-tool-gate/Cargo.toml
          cargo generate-lockfile --manifest-path tools/careframe-observation-audit/Cargo.toml
          {
            echo "Regenerated lockfiles at revision: ${GITHUB_SHA}"
            echo ""
            echo "===== MEDICAL-ROBOT-TOOL-GATE-LOCK-BEGIN ====="
            cat tools/medical-robot-tool-gate/Cargo.lock
            echo "===== MEDICAL-ROBOT-TOOL-GATE-LOCK-END ====="
            echo ""
            echo "===== CAREFRAME-OBSERVATION-AUDIT-LOCK-BEGIN ====="
            cat tools/careframe-observation-audit/Cargo.lock
            echo "===== CAREFRAME-OBSERVATION-AUDIT-LOCK-END ====="
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Generated lockfiles; this diagnostic workflow did not commit or push them."
