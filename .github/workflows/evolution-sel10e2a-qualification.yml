name: Evolution SEL-10E2A Qualification

on:
  push:
    branches:
      - "ci/evolution-sel10e2a-qualification-v0.1"

permissions:
  contents: read

env:
  PRODUCT_HEAD: b66535815cc865c57e70e3f27913fc88122e1dd3

jobs:
  qualify:
    name: Frozen SEL-10E2A / Rust 1.96
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen product subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 1
      - name: Assert executed subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Isolate E2A stack
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/e2a-stack"
          rm -rf "${root}"
          mkdir -p "${root}"
          cp -R crates/domains/symtropy-evolution-core "${root}/symtropy-evolution-core"
          cp -R crates/domains/symtropy-species-concept "${root}/symtropy-species-concept"
          cp -R crates/domains/symtropy-species-concept-relations "${root}/symtropy-species-concept-relations"
          cp -R crates/domains/symtropy-species-concept-general-lineage "${root}/symtropy-species-concept-general-lineage"
          cp -R crates/domains/symtropy-species-concept-robustness "${root}/symtropy-species-concept-robustness"
      - name: Check E2A formatting
        id: fmt
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-robustness
        run: cargo fmt --all -- --check
      - name: Check E2A all targets
        id: check
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-robustness
        run: cargo check --all-targets
      - name: Run E2A main corpus
        id: main
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_design_v1
      - name: Run E2A hardening corpus
        id: hardening
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_hardening_v1
      - name: Run E2A currentness corpus
        id: currentness
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-robustness
        run: cargo test --test current_robustness_currentness_v1
      - name: Run all E2A targets
        id: all_tests
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-robustness
        run: cargo test --all-targets
      - name: Run strict E2A Clippy
        id: clippy
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-robustness
        run: cargo clippy --all-targets -- -D warnings
      - name: Run frozen relation stack
        id: relations
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-relations
        run: cargo test --all-targets
      - name: Run frozen general-lineage stack
        id: general_lineage
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-species-concept-general-lineage
        run: cargo test --all-targets
      - name: Run strict current-species prerequisite
        id: strict_status
        working-directory: ${{ runner.temp }}/e2a-stack/symtropy-evolution-core
        run: cargo test --test current_species_status_v1
      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          MAIN: ${{ steps.main.outcome }}
          HARDENING: ${{ steps.hardening.outcome }}
          CURRENTNESS: ${{ steps.currentness.outcome }}
          ALL_TESTS: ${{ steps.all_tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RELATIONS: ${{ steps.relations.outcome }}
          GENERAL_LINEAGE: ${{ steps.general_lineage.outcome }}
          STRICT_STATUS: ${{ steps.strict_status.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          keys = ["FMT", "CHECK", "MAIN", "HARDENING", "CURRENTNESS", "ALL_TESTS", "CLIPPY", "RELATIONS", "GENERAL_LINEAGE", "STRICT_STATUS"]
          outcomes = {k.lower(): os.environ.get(k, "unknown") for k in keys}
          receipt = {
              "receipt_version": 1,
              "qualification": "SEL-10E2A-current-robustness",
              "product_head": os.environ["PRODUCT_HEAD"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "outcome-free E2A preregistration/current-authority only; pair eligibility is not robustness; no majority vote, historical robustness, nomenclature, or universal taxonomy truth",
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "sel10e2a-qualification.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(receipt, f, sort_keys=True, indent=2); f.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          sha256sum "${RUNNER_TEMP}/sel10e2a-qualification.json" > "${RUNNER_TEMP}/sel10e2a-qualification.json.sha256"
      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sel10e2a-qualification-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/sel10e2a-qualification.json
            ${{ runner.temp }}/sel10e2a-qualification.json.sha256
          if-no-files-found: error
          retention-days: 30
