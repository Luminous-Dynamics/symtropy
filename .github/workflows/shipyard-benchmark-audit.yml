name: Shipyard benchmark evidence audit

on:
  pull_request:
    branches: ["research/shipyard-disruption-recovery-current-v0", "research/shipyard-benchmark-contract-v0"]
    paths:
      - "tools/shipyard-benchmark-audit/**"
      - "tools/shipyard-benchmark-contract/**"
      - ".github/workflows/shipyard-benchmark-audit.yml"
  push:
    branches: ["research/shipyard-benchmark-audit-v0"]
    paths:
      - "tools/shipyard-benchmark-audit/**"
      - "tools/shipyard-benchmark-contract/**"
      - ".github/workflows/shipyard-benchmark-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-benchmark-audit-\${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned Rust benchmark auditor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --manifest-path tools/shipyard-benchmark-audit/Cargo.toml -- --check
      - name: Run dependency-free conformance tests offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-benchmark-audit/Cargo.toml
      - name: Clippy with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-benchmark-audit/Cargo.toml --all-targets -- -D warnings
