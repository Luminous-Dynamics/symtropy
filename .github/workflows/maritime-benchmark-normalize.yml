name: Maritime Benchmark Normalize

on:
  push:
    branches: [research/maritime-liu-ice-response-evaluator-v0-1]
    paths:
      - ".github/workflows/maritime-benchmark-normalize.yml"
      - "benchmarks/maritime-control-response/**"
  pull_request:
    branches: [research/maritime-control-response-v0-1]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/maritime-benchmark-normalize.yml"
      - "benchmarks/maritime-control-response/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-benchmark-normalize-${{ github.sha }}
  cancel-in-progress: false

jobs:
  normalize:
    name: Format Rust and refresh isolated lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format all benchmark crate Rust sources
        run: cargo fmt --manifest-path benchmarks/maritime-control-response/Cargo.toml --all

      - name: Regenerate isolated crate lockfile
        run: cargo generate-lockfile --manifest-path benchmarks/maritime-control-response/Cargo.toml

      - name: Preserve normalized source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/maritime-benchmark-normalized.tar.gz" \
            -C benchmarks/maritime-control-response src Cargo.lock
          sha256sum "$RUNNER_TEMP/maritime-benchmark-normalized.tar.gz" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload normalized source artifact
        uses: actions/upload-artifact@v4
        with:
          name: maritime-benchmark-normalized-${{ github.run_id }}
          path: ${{ runner.temp }}/maritime-benchmark-normalized.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Verify formatted and locked test suite
        run: cargo test --manifest-path benchmarks/maritime-control-response/Cargo.toml --locked --all-targets

      - name: Verify strict Clippy
        run: cargo clippy --manifest-path benchmarks/maritime-control-response/Cargo.toml --locked --all-targets -- -D warnings
