name: CivDyn resilience uncertainty and sensitivity

on:
  pull_request:
    paths:
      - "research/civdyn-resilience-uq/**"
      - "research/civdyn-cross-scale-resilience/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-resilience-uq.yml"
  push:
    paths:
      - "research/civdyn-resilience-uq/**"
      - "research/civdyn-cross-scale-resilience/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-resilience-uq.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute resilience UQ benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-resilience-uq/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-resilience-uq/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-resilience-uq/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-resilience-uq/Cargo.toml --all-targets

      - name: Execute full LHS and Morris portfolios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-resilience-uq-evidence
          cargo run --locked --manifest-path research/civdyn-resilience-uq/Cargo.toml --bin resilience-uq-sweep \
            | tee target/civdyn-resilience-uq-evidence/resilience-uq.csv

      - name: Verify stratified LHS, Morris paths, units and summary statistics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import math
          from collections import defaultdict
          from pathlib import Path

          path = Path("target/civdyn-resilience-uq-evidence/resilience-uq.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 1464, f"expected 1464 evidence rows, got {len(rows)}"
          assert all(len(row) == 42 for row in rows)
          lhs = [r for r in rows if r["record_type"] == "lhs_run"]
          summaries = [r for r in rows if r["record_type"] == "lhs_summary"]
          points = [r for r in rows if r["record_type"] == "morris_point"]
          effects = [r for r in rows if r["record_type"] == "morris_effect"]
          assert (len(lhs), len(summaries), len(points), len(effects)) == (360, 108, 240, 756)

          design_ids = {r["design_id"] for r in lhs}
          assert len(design_ids) == 30
          assert all(r["sample_count"] == "1" for r in lhs)
          assert all(0.0 <= float(r[f"u_{factor}"]) <= 1.0 for r in lhs for factor in (
              "water_supply","energy_supply","demand","reserve","water_retention","energy_retention","shock_duration"
          ))

          factor_columns = (
              "u_water_supply","u_energy_supply","u_demand","u_reserve",
              "u_water_retention","u_energy_retention","u_shock_duration"
          )
          for column in factor_columns:
              strata = sorted(math.floor(float(r[column]) * 30) for r in lhs if r["design_id"] == next(iter(design_ids)))
              assert len(strata) == 12, "one design id appears once per shock/policy, not once per sample"
          by_design_factor = defaultdict(list)
          for row in lhs:
              for column in factor_columns:
                  by_design_factor[(row["design_id"], column)].append(float(row[column]))
          for design_id in design_ids:
              for column in factor_columns:
                  values = by_design_factor[(design_id, column)]
                  assert len(values) == 12
                  assert max(values) - min(values) < 1e-12, "same LHS point must map identically across shock/policy"

          # Reconstruct each unique LHS coordinate by design ID. The 30 design points
          # must occupy every stratum once for every factor.
          unique_points = {}
          for row in lhs:
              unique_points.setdefault(row["design_id"], row)
          for column in factor_columns:
              strata = sorted(math.floor(float(row[column]) * 30) for row in unique_points.values())
              assert strata == list(range(30)), f"{column} does not occupy each of 30 strata exactly once"

          for row in lhs:
              assert 2 <= int(float(row["shock_duration_ticks"])) <= 4
              for key in ("water_unmet_m3","energy_unmet_kwh","water_deficit_area_household_steps",
                          "energy_deficit_area_household_steps"):
                  assert float(row[key]) >= 0.0
              for key in ("minimum_water_coverage","minimum_energy_coverage",
                          "water_floor_breach_fraction","energy_floor_breach_fraction","recovery_success"):
                  assert 0.0 <= float(row[key]) <= 1.0

          assert len({(r["shock_kind"], r["policy"], r["metric_id"]) for r in summaries}) == 108
          for row in summaries:
              assert row["sample_count"] == "30"
              assert float(row["p05"]) <= float(row["p50"]) <= float(row["p95"])
              assert 0.0 <= float(row["run_breach_fraction"]) <= 1.0

          by_trajectory = defaultdict(list)
          for row in points:
              by_trajectory[row["trajectory_id"]].append(row)
          assert len(by_trajectory) == 30
          for trajectory_id, trajectory_rows in by_trajectory.items():
              trajectory_rows.sort(key=lambda row: row["design_id"])
              assert len(trajectory_rows) == 8
              coordinates = [
                  [float(row[column]) for column in factor_columns]
                  for row in trajectory_rows
              ]
              changed = []
              for before, after in zip(coordinates, coordinates[1:]):
                  diffs = [i for i, (a, b) in enumerate(zip(before, after)) if abs(a-b) > 1e-10]
                  assert len(diffs) == 1
                  assert abs(abs(after[diffs[0]] - before[diffs[0]]) - 2/3) < 1e-7
                  changed.append(diffs[0])
              assert sorted(changed) == list(range(7))

          assert len({(r["parameter_id"],r["shock_kind"],r["policy"],r["metric_id"]) for r in effects}) == 756
          for row in effects:
              assert row["sample_count"] == "30"
              mu = float(row["mu"])
              mu_star = float(row["mu_star"])
              sigma = float(row["sigma"])
              assert mu_star >= abs(mu) - 1e-6
              assert mu_star >= 0.0 and sigma >= 0.0
              assert all(math.isfinite(value) for value in (mu,mu_star,sigma))

          print("CIVDYN-UQ-001 LHS strata, Morris trajectories, stock-flow-derived metrics and sensitivity summaries verified.")
          PY

          {
            echo "## CIVDYN-UQ-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-resilience-uq-evidence/resilience-uq.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: deterministic synthetic parameter-design and sensitivity screening"
            echo "- LHS samples are not stochastic replications or empirical priors."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload resilience UQ evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-resilience-uq
          path: target/civdyn-resilience-uq-evidence/resilience-uq.csv
          if-no-files-found: error
          retention-days: 30
