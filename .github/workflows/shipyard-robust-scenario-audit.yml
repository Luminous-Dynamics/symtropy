name: Shipyard finite-scenario robust audit

on:
  pull_request:
    branches: ["research/shipyard-polygon-exact-v0"]
    paths:
      - "tools/shipyard-robust-scenario-audit/**"
      - "tools/shipyard-polygon-geometry/**"
      - ".github/workflows/shipyard-robust-scenario-audit.yml"
  push:
    branches: ["research/shipyard-robust-scenario-audit-v0"]
    paths:
      - "tools/shipyard-robust-scenario-audit/**"
      - "tools/shipyard-polygon-geometry/**"
      - ".github/workflows/shipyard-robust-scenario-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Pinned Rust robust-scenario conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path tools/shipyard-robust-scenario-audit/Cargo.toml -- --check
      - name: Scenario completeness and robustness tests offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-robust-scenario-audit/Cargo.toml
      - name: Clippy with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-robust-scenario-audit/Cargo.toml --all-targets -- -D warnings
