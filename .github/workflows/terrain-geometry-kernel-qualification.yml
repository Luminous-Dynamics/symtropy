name: Terrain Geometry Kernel Qualification

on:
  push:
    branches:
      - "terrain/geometry-kernel-v0.1"
    paths:
      - ".github/workflows/terrain-geometry-kernel-qualification.yml"
      - "crates/domains/symtropy-terrain/src/geometry_kernel.rs"

permissions:
  contents: read

concurrency:
  group: terrain-geometry-kernel-v0.1
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify dependency-free Terrain geometry kernel
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact formatted kernel lineage
        shell: bash
        run: |
          set -euo pipefail
          base=7aa1190fe8390187f1765479978f2ad04e36e974
          source_commit=536170e3bb039e66b76ae931cf5fec27c25a58a4
          formatted_source_commit=1521e1694b037db758e24200e60a2a11d0f883e8
          formatted_source_blob=8d3e1213eacdeddf693cd2d1f82670d6ed832161
          kernel_path=crates/domains/symtropy-terrain/src/geometry_kernel.rs
          qualifier_path=.github/workflows/terrain-geometry-kernel-qualification.yml

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${formatted_source_commit}"
          test "$(git rev-parse ${source_commit}^)" = "${base}"
          git merge-base --is-ancestor "${source_commit}" "${formatted_source_commit}"
          test "$(git rev-parse ${formatted_source_commit}:${kernel_path})" = "${formatted_source_blob}"
          test "$(git rev-parse HEAD:${kernel_path})" = "${formatted_source_blob}"

          harness_delta="$(git diff --name-only ${formatted_source_commit}..HEAD | sort)"
          test "${harness_delta}" = "${qualifier_path}"

          actual="$(git diff --name-only ${base}..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/terrain-geometry-kernel-format-freeze.yml \
            .github/workflows/terrain-geometry-kernel-qualification.yml \
            crates/domains/symtropy-terrain/src/geometry_kernel.rs | sort)"
          test "${actual}" = "${expected}"

          echo "TERRAIN_GEOMETRY_KERNEL_HEAD=$(git rev-parse HEAD)"
          echo "TERRAIN_GEOMETRY_KERNEL_TREE=$(git rev-parse HEAD^{tree})"
          echo "TERRAIN_GEOMETRY_KERNEL_BLOB=$(git rev-parse HEAD:${kernel_path})"
          echo "TERRAIN_GEOMETRY_KERNEL_FORMATTED_SOURCE=${formatted_source_commit}"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Check canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/domains/symtropy-terrain/src/geometry_kernel.rs

      - name: Build isolated kernel crate
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/terrain-geometry-kernel"
          mkdir -p "${root}/src"
          cp crates/domains/symtropy-terrain/src/geometry_kernel.rs "${root}/src/lib.rs"
          cat > "${root}/Cargo.toml" <<'EOF'
          [package]
          name = "symtropy-terrain-geometry-kernel-proof"
          version = "0.0.0"
          edition = "2024"
          publish = false
          EOF
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/terrain-geometry-kernel-target" >> "${GITHUB_ENV}"
          echo "TERRAIN_GEOMETRY_KERNEL_PROOF_ROOT=${root}" >> "${GITHUB_ENV}"

      - name: Check kernel
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path "${TERRAIN_GEOMETRY_KERNEL_PROOF_ROOT}/Cargo.toml" --offline --all-targets

      - name: Test kernel and external identity vectors
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path "${TERRAIN_GEOMETRY_KERNEL_PROOF_ROOT}/Cargo.toml" --offline --all-targets

      - name: Strict kernel Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path "${TERRAIN_GEOMETRY_KERNEL_PROOF_ROOT}/Cargo.toml" --offline --all-targets -- -D warnings

      - name: Unchanged-source postflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          echo "TERRAIN_GEOMETRY_KERNEL_STATUS=PASS"
          echo "claim=dependency-free exact identity/query kernel only; EarthChunk adapter/provider qualification is separate"
