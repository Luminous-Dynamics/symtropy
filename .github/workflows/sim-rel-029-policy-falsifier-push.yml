name: SIM-REL-029 Policy Falsifier Branch Qualification

on:
  push:
    branches: ["research/sim-rel-029-policy-falsifier-2026-10-31"]
    paths:
      - "tools/sim-rel-action-realization-filter/**"
      - ".github/workflows/sim-rel-029-policy-falsifier-push.yml"

permissions:
  contents: write

concurrency:
  group: sim-rel-029-policy-falsifier-format-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    name: pinned rustfmt, falsifier fixtures and strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-029-falsifier-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Apply pinned formatting
        run: cargo fmt --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml
      - name: Commit formatter-only changes to the research branch
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sim-rel-action-realization-filter
          if ! git diff --cached --quiet; then
            git commit -m "style(research): format policy falsifier"
            git push origin "HEAD:$GH_REF_NAME"
          fi
      - name: Capture formatted source identity
        run: echo "EXPECTED_FORMATTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml -- --check
      - name: Locked falsifier and replay tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib -- -D warnings
      - name: Verify exact formatted checkout and clean tree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_FORMATTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
