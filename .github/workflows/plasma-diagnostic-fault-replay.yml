name: Plasma diagnostic fault replay

on:
  push:
    branches:
      - research/plasma-diagnostic-fault-replay-v0-1-2026-11-17
    paths:
      - "crates/tools/plasma-diagnostic-fault-replay/**"
      - "benchmarks/plasma/diagnostic-fault-replay-v0.json"
      - ".github/workflows/plasma-diagnostic-fault-replay.yml"
  pull_request:
    paths:
      - "crates/tools/plasma-diagnostic-fault-replay/**"
      - "benchmarks/plasma/diagnostic-fault-replay-v0.json"
      - ".github/workflows/plasma-diagnostic-fault-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Strict format check
        run: cargo fmt --manifest-path crates/tools/plasma-diagnostic-fault-replay/Cargo.toml -- --check
      - name: Resolve and display canonical standalone lockfile (temporary audit step)
        run: |
          cargo generate-lockfile --manifest-path crates/tools/plasma-diagnostic-fault-replay/Cargo.toml
          cat crates/tools/plasma-diagnostic-fault-replay/Cargo.lock
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/tools/plasma-diagnostic-fault-replay/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path crates/tools/plasma-diagnostic-fault-replay/Cargo.toml --all-targets -- -D warnings
      - name: Audit synthetic fault corpus
        run: cargo run --locked --manifest-path crates/tools/plasma-diagnostic-fault-replay/Cargo.toml -- benchmarks/plasma/diagnostic-fault-replay-v0.json
