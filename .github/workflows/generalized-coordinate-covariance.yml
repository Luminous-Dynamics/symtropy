name: Generalized-coordinate covariance reference

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "research/generalized-coordinate-covariance-001/**"
      - ".github/workflows/generalized-coordinate-covariance.yml"
  push:
    branches: [main]
    paths:
      - "research/generalized-coordinate-covariance-001/**"
      - ".github/workflows/generalized-coordinate-covariance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generalized-coordinate-covariance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path research/generalized-coordinate-covariance-001/Cargo.toml --all -- --check
      - name: Unit and negative-control tests
        run: cargo test --locked --manifest-path research/generalized-coordinate-covariance-001/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/generalized-coordinate-covariance-001/Cargo.toml --all-targets -- -D warnings
