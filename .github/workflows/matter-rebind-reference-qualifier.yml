name: Matter Rebind Reference Qualifier

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: matter-rebind-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Prove immutable FABRICATION-MATTER-REBIND-00A product
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact semantic product
        uses: actions/checkout@v4
        with:
          ref: 426c304a672cbc2be92f83139fdd2e07b47b5245
          fetch-depth: 0

      - name: Set up Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Verify immutable lineage and tree
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=426c304a672cbc2be92f83139fdd2e07b47b5245
          PRODUCT_TREE=3108ed85b7873867d1c3fe44bdd080bbf84d94d9
          PARENT=f323d7d2b9bdb9e923835fd24e4f499942a8fdd1
          PARENT_TREE=572a7830d8aea78ba4a7cb6087c7c25522130f5b
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-list --count "$PARENT..$PRODUCT")" -eq 1
          test -z "$(git status --porcelain)"

      - name: Re-prove exact qualified parent
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach f323d7d2b9bdb9e923835fd24e4f499942a8fdd1
          test "$(git rev-parse HEAD^{tree})" = "572a7830d8aea78ba4a7cb6087c7c25522130f5b"
          cargo check --locked -p symtropy-fabrication --lib
          cargo test --locked -p symtropy-fabrication --lib
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings
          cargo check --locked -p symtropy-construction --lib
          test -z "$(git status --porcelain)"

      - name: Return to exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 426c304a672cbc2be92f83139fdd2e07b47b5245
          test "$(git rev-parse HEAD^{tree})" = "3108ed85b7873867d1c3fe44bdd080bbf84d94d9"
          test -z "$(git status --porcelain)"

      - name: Verify exact semantic diff boundary
        shell: bash
        run: |
          set -euo pipefail
          PARENT=f323d7d2b9bdb9e923835fd24e4f499942a8fdd1
          expected=$(cat <<'EOF'
          crates/domains/symtropy-fabrication/src/lib.rs
          crates/domains/symtropy-fabrication/src/matter_rebind.rs
          EOF
          )
          actual=$(git diff --name-only "$PARENT..HEAD" | LC_ALL=C sort)
          test "$(printf '%s\n' "$actual")" = "$(printf '%s\n' "$expected" | LC_ALL=C sort)"
          test "$(git diff --name-only "$PARENT..HEAD" | wc -l | tr -d ' ')" -eq 2
          git diff --exit-code "$PARENT..HEAD" -- \
            Cargo.lock \
            Cargo.toml \
            crates/domains/symtropy-fabrication/Cargo.toml \
            crates/domains/symtropy-construction/Cargo.toml
          printf '%s\n' "$actual"

      - name: Audit reference-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE=crates/domains/symtropy-fabrication/src/matter_rebind.rs
          grep -Fq 'does **not** mint physical authority' "$FILE"
          grep -Fq 'caller-constructible reference vocabulary' "$FILE"
          grep -Fq 'This function is intentionally pure and non-authoritative' "$FILE"
          grep -Fq 'It does not authenticate the observation' "$FILE"
          grep -Fq 'pub enum MatterAuthorityResolutionV1' "$FILE"
          grep -Fq 'pub struct MatterRebindReferenceV1' "$FILE"
          grep -Fq 'pub enum MatterRebindReferenceDecisionV1' "$FILE"
          grep -Fq 'MatterRebindReferenceDecisionV1::StaleRevision' "$FILE"
          grep -Fq 'MatterRebindReferenceDecisionV1::StaleDigest' "$FILE"
          ! grep -Eq '(^|[^A-Za-z0-9_])unsafe([^A-Za-z0-9_]|$)' "$FILE"
          ! grep -Eq 'std::(fs|net|process|env)::|SystemTime|Instant::now' "$FILE"
          ! grep -Eq 'symtropy_(terrain|construction|world)|bevy::|rapier' "$FILE"
          ! grep -Eq 'SparseMatterStore|MatterStateDigest|symtropy_universal_matter|use[[:space:]].*MatterAuthority' "$FILE"

      - name: Check exact formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p symtropy-fabrication -- --check

      - name: Run locked Fabrication tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p symtropy-fabrication --lib

      - name: Run strict Fabrication Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p symtropy-fabrication --all-targets --all-features -- -D warnings

      - name: Check downstream Construction consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p symtropy-construction --lib

      - name: Immutable postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "426c304a672cbc2be92f83139fdd2e07b47b5245"
          test "$(git rev-parse HEAD^{tree})" = "3108ed85b7873867d1c3fe44bdd080bbf84d94d9"
          test "$(git rev-parse HEAD^)" = "f323d7d2b9bdb9e923835fd24e4f499942a8fdd1"
          test -z "$(git status --porcelain)"
