name: water-mixing-active-experiment-design-t0

on:
  pull_request:
    paths:
      - ".github/workflows/water-mixing-active-experiment-design-t0.yml"
      - "tools/water-service-t0/src/bin/active-experiment-design-t0.rs"
      - "research/water-intrusion-coupling/active-experiment-design-t0-*.json"
      - "research/water-intrusion-coupling/ACTIVE_EXPERIMENT_DESIGN_T0_V0_1.md"
  push:
    branches:
      - main
      - research/water-mixing-active-design-t0-v0.1
    paths:
      - ".github/workflows/water-mixing-active-experiment-design-t0.yml"
      - "tools/water-service-t0/src/bin/active-experiment-design-t0.rs"
      - "research/water-intrusion-coupling/active-experiment-design-t0-*.json"
      - "research/water-intrusion-coupling/ACTIVE_EXPERIMENT_DESIGN_T0_V0_1.md"

permissions:
  contents: read

concurrency:
  group: water-mixing-active-experiment-design-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-experiment-design-t0:
    name: Rust format, tests, clippy and Fisher-design oracle replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check evaluator formatting
        run: rustfmt --edition 2024 --check tools/water-service-t0/src/bin/active-experiment-design-t0.rs

      - name: Run native design tests
        run: cargo test --locked --manifest-path tools/water-service-t0/Cargo.toml --bin active-experiment-design-t0

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/water-service-t0/Cargo.toml --bin active-experiment-design-t0 -- -D warnings

      - name: Replay frozen sensor-aware design oracle
        env:
          WATER_MIXING_ACTIVE_DESIGN_T0_REVISION: ${{ github.sha }}
        run: |
          cargo run --locked --manifest-path tools/water-service-t0/Cargo.toml --bin active-experiment-design-t0 -- \
            research/water-intrusion-coupling/active-experiment-design-t0-cases-v0.1.json \
            research/water-intrusion-coupling/active-experiment-design-t0-oracle-v0.1.json \
            research/water-intrusion-coupling/active-experiment-design-t0-manifest-v0.1.json \
            artifacts/water-mixing-active-design-t0/receipt.json

      - name: Archive active-design receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-mixing-active-design-t0-${{ github.sha }}
          path: artifacts/water-mixing-active-design-t0/receipt.json
          if-no-files-found: warn
