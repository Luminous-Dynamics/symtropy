name: dredge-telemetry-validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "benchmarks/dredge-telemetry-validator/**"
      - ".github/workflows/dredge-telemetry-validator.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/dredge-telemetry-validator/**"
      - ".github/workflows/dredge-telemetry-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dredge-telemetry-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/dredge-telemetry-validator/Cargo.toml -- --check
      - name: Test source-profiled telemetry contract
        run: cargo test --locked --manifest-path benchmarks/dredge-telemetry-validator/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path benchmarks/dredge-telemetry-validator/Cargo.toml --all-targets -- -D warnings
