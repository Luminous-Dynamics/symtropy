name: SIM-REL-003 MDL Information Gain

on:
  push:
    branches: ["main", "research/sim-rel-003-mdl-eig"]
    paths:
      - "tools/sim-rel-bayes/**"
      - "docs/research/SIM_REL_003_MDL_EIG_PROTOCOL_2026-10-30.md"
      - ".github/workflows/sim-rel-bayes.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/sim-rel-bayes/**"
      - "docs/research/SIM_REL_003_MDL_EIG_PROTOCOL_2026-10-30.md"
      - ".github/workflows/sim-rel-bayes.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: MDL-EIG tests and exact-head receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}

      - name: Isolate Cargo build output from the exact-head checkout
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-003-cargo-target" >> "$GITHUB_ENV"

      - name: Set up Rust (repository-pinned version)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Verify formatting
        run: cargo fmt --manifest-path tools/sim-rel-bayes/Cargo.toml -- --check

      - name: Run Bayesian selector and integrity tests
        run: cargo test --locked --manifest-path tools/sim-rel-bayes/Cargo.toml --bin sim-rel-bayes

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-bayes/Cargo.toml --bin sim-rel-bayes -- -D warnings

      - name: Generate receipt on the exact source checkout
        env:
          EXPECTED_HEAD: \${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo run --locked --manifest-path tools/sim-rel-bayes/Cargo.toml --bin sim-rel-bayes -- \
            --problems tools/sim-rel-bayes/fixtures/problems-v0.tsv \
            --truth tools/sim-rel-bayes/fixtures/evaluator-truth-v0.tsv \
            --expected-head "$EXPECTED_HEAD" \
            --max-depth 2 \
            --out "$RUNNER_TEMP/sim-rel-003-receipt.json"
          jq -e --arg expected "$EXPECTED_HEAD" '
            .exact_head == $expected
            and .unique_semantic_candidates == 109
            and (.cases | length) == 18
            and (.policy_summaries | map(.policy) | unique | length) == 4
            and all(.policy_summaries[]; .in_grammar_target_retention_rate == 1)
            and all(.policy_summaries[]; .mean_cost >= 0)
          ' "$RUNNER_TEMP/sim-rel-003-receipt.json"

      - name: Retain exact-head receipt
        uses: actions/upload-artifact@v4
        with:
          name: sim-rel-003-receipt-\${{ github.event.pull_request.head.sha || github.sha }}
          path: \${{ runner.temp }}/sim-rel-003-receipt.json
          if-no-files-found: error
          retention-days: 30
