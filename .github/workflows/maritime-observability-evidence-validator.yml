name: Maritime observability evidence validator
on:
  push:
    branches: ["research/maritime-fault-observability-v0-1"]
    paths:
      - "tools/maritime-observability-evidence-validator/**"
      - "benchmarks/maritime-observability/validation-evidence-profiles.v0.1.json"
      - "docs/tech/MARITIME_VALIDATION_EVIDENCE_PROFILE_V0_1.schema.json"
      - "benchmarks/maritime-observability/**"
      - "docs/tech/MARITIME_QUALIFICATION_IMPACT_CHANGE_SET_V0_1.schema.json"
      - "docs/tech/MARITIME_SAIL_CAPABILITY_PROFILE_V0_1.schema.json"
      - "docs/tech/MARITIME_SAIL_CAPABILITY_GRAPH_V0_1.md"
      - "docs/tech/MARITIME_OBSERVATION_VALUE_CASE_V0_1.schema.json"
      - "docs/tech/MARITIME_FAULT_OBSERVABILITY_REPORT_V0_1.schema.json"
      - "docs/tech/MARITIME_OBSERVABILITY_PAIR_CASE_V0_1.schema.json"
      - "docs/tech/MARITIME_FAULT_OBSERVABILITY_BENCHMARK_V0_1.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/maritime-observability-evidence-validator.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/maritime-observability-evidence-validator/**"
      - "benchmarks/maritime-observability/validation-evidence-profiles.v0.1.json"
      - "docs/tech/MARITIME_VALIDATION_EVIDENCE_PROFILE_V0_1.schema.json"
      - "benchmarks/maritime-observability/**"
      - "docs/tech/MARITIME_QUALIFICATION_IMPACT_CHANGE_SET_V0_1.schema.json"
      - "docs/tech/MARITIME_SAIL_CAPABILITY_PROFILE_V0_1.schema.json"
      - "docs/tech/MARITIME_SAIL_CAPABILITY_GRAPH_V0_1.md"
      - "docs/tech/MARITIME_OBSERVATION_VALUE_CASE_V0_1.schema.json"
      - "docs/tech/MARITIME_FAULT_OBSERVABILITY_REPORT_V0_1.schema.json"
      - "docs/tech/MARITIME_OBSERVABILITY_PAIR_CASE_V0_1.schema.json"
      - "docs/tech/MARITIME_FAULT_OBSERVABILITY_BENCHMARK_V0_1.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/maritime-observability-evidence-validator.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maritime-observability-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Format workspace Rust sources
        run: cargo fmt --all

      - name: Test evidence validator
        run: cargo test --locked -p maritime-observability-evidence-validator
      - name: Strict Clippy
        run: cargo clippy --locked -p maritime-observability-evidence-validator --all-targets -- -D warnings
      - name: Execute synthetic report and bind receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-observability/synthetic-report-v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin maritime-observability-evidence-validator -- "$input" --source-commit "$source_commit" --report-sha256 "$digest" > maritime-observability-evidence-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '.result == "pass" and .source_commit == $source and .report_sha256 == $digest and .sensor_count == 6 and .fault_count == 3 and .pair_count == 3 and .measured_input_pairs_eligible_for_independent_review == 2 and .declared_isolability_claims_not_supported_by_measured_inputs == 0 and .physical_pair_separability_recomputed == false and (.pair_audits | length == 3) and (.pair_audits | all(.physical_pair_separability_recomputed == false))' maritime-observability-evidence-receipt.json
      - name: Execute qualification impact analysis
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-observability/qualification-dependency-manifest.v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin qualification_impact -- \
            "$input" --source-commit "$source_commit" --change-set-sha256 "$digest" > maritime-qualification-impact-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '
            .result == "pass"
            and .source_commit == $source
            and .change_set_sha256 == $digest
            and .change_count == 2
            and .impacted_qualification_count == 5
            and .requalification_required_count == 5
            and .unaffected_qualification_count == 2
            and .impact_path_count == 12
            and (.impact_paths | length == 12)
            and (.impact_traversal_state_count > 0 and .impact_traversal_state_count < 250000)
            and (.max_impact_path_depth <= 512)
            and (.impacted_qualifications | all(.impact_path_count > 0))
            and (.unaffected_qualifications | all(.impact_path_count == 0))
            and .mutation_performed == false
            and .authorization_granted == false
          ' maritime-qualification-impact-receipt.json
      - name: Execute maritime pairwise observability adapter
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-observability/pairwise-observability-case.v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin maritime_pairwise_observability -- \
            "$input" --source-commit "$source_commit" --case-sha256 "$digest" > maritime-pairwise-observability-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '
            .result == "pass"
            and .source_commit == $source
            and .case_sha256 == $digest
            and .reused_kernel.crate == "symtropy-sensor-observability-bench"
            and .reused_kernel.git_revision == "3c4a86de830a24bbf97c7d7fe30d79de299999c5"
            and .pair_count == 1
            and .identifiable_pair_count == 1
            and .base_pair_results[0].status == "IDENTIFIABLE"
            and .base_pair_results[0].observed_independent_principles == 3
            and .dependency_cut_results[0].pair_results[0].status == "NOT_IDENTIFIABLE"
            and .dependency_cut_results[1].pair_results[0].status == "IDENTIFIABLE"
            and .pair_separability_computed_by_reused_kernel == true
            and (.base_pair_results[0].measurement_window_id_a != .base_pair_results[0].measurement_window_id_b)
            and .base_pair_results[0].window_comparison.state == "MATCHED"
            and (.base_pair_results[0].window_comparison.window_a.configuration_sha256 == .base_pair_results[0].window_comparison.window_b.configuration_sha256)
            and (.base_pair_results[0].window_comparison.window_a.configuration_sha256 == .base_pair_results[0].window_comparison.asset_configuration_sha256)
            and (.base_pair_results[0].window_comparison.episode_definition_sha256 | length == 64)
            and .base_pair_results[0].window_comparison.minimum_independent_episodes_per_window == 10
            and .base_pair_results[0].window_comparison.window_a.independent_episode_count >= 10
            and .base_pair_results[0].window_comparison.window_b.independent_episode_count >= 10
            and .base_pair_results[0].pair_kernel_evaluated == true
            and .pair_kernel_evaluated_count == 3
            and .pair_kernel_skipped_count == 0
            and .window_comparison_withheld_count == 0
            and .source_artifact_payloads_verified == false
            and .physical_diagnosability_established == false
            and .mutation_performed == false
            and .authorization_granted == false
          ' maritime-pairwise-observability-receipt.json

      - name: Execute industrial validation-evidence profile evaluator
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-observability/validation-evidence-profiles.v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin maritime_validation_evidence_profile -- \
            "$input" --source-commit "$source_commit" --profile-sha256 "$digest" > maritime-validation-evidence-profile-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '
            .result == "pass"
            and .source_commit == $source
            and .corpus_sha256 == $digest
            and .profile_count == 6
            and (.profiles | map(.computed_physical_independence_ceiling) | unique | sort) == ["A0","A1","A2","A3","A4"]
            and (.profiles | map(.computed_domain_shift_ceiling) | unique | sort) == ["B0","B1","B2","B3","B4"]
            and .leakage_risk_counts.HIGH == 1
            and .leakage_risk_counts.LOW == 3
            and .leakage_risk_counts.SOME_CONCERNS == 1
            and .leakage_risk_counts.UNCLEAR == 1
            and .physical_evidence_verified == false
            and .source_artifact_payloads_verified == false
          ' maritime-validation-evidence-profile-receipt.json

      - name: Execute passive observation value-of-information evaluator
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-observability/observation-value-fixture.v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin observation_value -- \
            "$input" --source-commit "$source_commit" --case-sha256 "$digest" > maritime-observation-value-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '
            .result == "pass"
            and .source_commit == $source
            and .case_sha256 == $digest
            and .candidate_count == 4
            and .evaluated_candidate_count == 2
            and .not_evaluated_candidate_count == 2
            and .positive_net_value_candidate_count == 1
            and .mutation_performed == false
            and .authorization_granted == false
            and .ranked_candidates[0].candidate_id == "needle-lift-existing-trace"
            and .ranked_candidates[0].status == "ROBUST_POSITIVE_NET_VALUE"
            and (.ranked_candidates[0].likelihood_scenario_count == 3)
            and (.ranked_candidates[0].prior_ambiguity_scenario_count == 2)
            and (.ranked_candidates[0].joint_scenario_count == 9)
            and (.ranked_candidates[0].robust_net_evsi_min > 0)
            and .ranked_candidates[1].status == "NOT_ROBUST_POSITIVE_NET_VALUE"
          ' maritime-observation-value-receipt.json
      - name: Execute generic qualification scope compiler
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "\${{ github.event.pull_request.head.sha || github.sha }}"
          input="benchmarks/maritime-observability/qualification-scope-cases.v0.1.json"
          digest="$(sha256sum "$input" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin qualification_scope -- \
            "$input" --source-commit "$source_commit" --case-sha256 "$digest" > maritime-qualification-scope-receipt.json
          jq -e --arg source "$source_commit" --arg digest "$digest" '
            .result == "pass"
            and .source_commit == $source
            and .case_sha256 == $digest
            and .case_count == 20
            and .disposition_counts.SUPPORTED == 1
            and .disposition_counts.REQUALIFIED == 1
            and .disposition_counts.REQUALIFICATION_REQUIRED == 7
            and .disposition_counts.OUT_OF_SCOPE == 2
            and .disposition_counts.NOT_EVALUATED == 5
            and .disposition_counts.CONFLICTED == 1
            and .disposition_counts.EXPIRED == 3
            and .mutation_performed == false
            and .authorization_granted == false
            and .physical_qualification_established == false
          ' maritime-qualification-scope-receipt.json

      - name: Execute sail capability qualification and graph profile
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "\${{ github.event.pull_request.head.sha || github.sha }}"

          profile="benchmarks/maritime-observability/sail-capability-profile.v0.1.json"
          cases="benchmarks/maritime-observability/sail-capability-scope-cases.v0.1.json"
          schema="docs/tech/MARITIME_SAIL_CAPABILITY_PROFILE_V0_1.schema.json"

          jq -e '.schema_version == "maritime-sail-capability-profile-v0.1" and (.capability_graph | length == 7)' "$profile" > /dev/null
          jq -e '.schema_version == "maritime-qualification-scope-v0.1" and .evidence_class == "SYNTHETIC_KNOWN_TRUTH" and (.cases | length == 16)' "$cases" > /dev/null
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and .additionalProperties == false' "$schema" > /dev/null

          cases_digest="$(sha256sum "$cases" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin qualification_scope -- \
            "$cases" --source-commit "$source_commit" --case-sha256 "$cases_digest" > sail-capability-qualification-scope-receipt.json

          jq -e --arg source "$source_commit" --arg digest "$cases_digest" '
            .result == "pass"
            and .source_commit == $source
            and .case_sha256 == $digest
            and .case_count == 16
            and .disposition_counts.SUPPORTED == 7
            and .disposition_counts.REQUALIFICATION_REQUIRED == 3
            and .disposition_counts.OUT_OF_SCOPE == 1
            and .disposition_counts.EXPIRED == 3
            and .disposition_counts.NOT_EVALUATED == 1
            and .disposition_counts.CONFLICTED == 1
            and .mutation_performed == false
            and .authorization_granted == false
            and .physical_qualification_established == false
          ' sail-capability-qualification-scope-receipt.json

          profile_digest="$(sha256sum "$profile" | awk '{print $1}')"
          cargo run --quiet --locked -p maritime-observability-evidence-validator --bin sail_capability_profile -- \
            "$profile" "$cases" --source-commit "$source_commit" \
            --profile-sha256 "$profile_digest" --cases-sha256 "$cases_digest" > sail-capability-profile-receipt.json

          jq -e --arg source "$source_commit" --arg profile "$profile_digest" --arg cases "$cases_digest" '
            .result == "pass"
            and .source_commit == $source
            and .profile_sha256 == $profile
            and .qualification_cases_sha256 == $cases
            and .capability_count == 7
            and .dependency_edge_count == 9
            and .qualification_case_count == 16
            and .capabilities_with_nominal_scope_cases == 7
            and (.unreferenced_validation_case_ids | length == 9)
            and .acyclic == true
            and .mutation_performed == false
            and .authorization_granted == false
            and .actuator_commands_emitted == false
          ' sail-capability-profile-receipt.json

      - name: Archive rustfmt-normalized maritime sources
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/bin
          cp tools/maritime-observability-evidence-validator/src/bin/maritime_pairwise_observability.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/bin/
          cp tools/maritime-observability-evidence-validator/src/bin/maritime_validation_evidence_profile.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/bin/
          cp tools/maritime-observability-evidence-validator/src/bin/observation_value.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/bin/
          cp tools/maritime-observability-evidence-validator/src/bin/qualification_impact.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/bin/
          cp tools/maritime-observability-evidence-validator/src/bin/qualification_scope.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/bin/
          cp tools/maritime-observability-evidence-validator/src/bin/sail_capability_profile.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/bin/
          cp tools/maritime-observability-evidence-validator/src/main.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/
          cp tools/maritime-observability-evidence-validator/src/lib.rs /tmp/maritime-rustfmt/tools/maritime-observability-evidence-validator/src/
          tar -czf maritime-rustfmt-sources.tar.gz -C /tmp/maritime-rustfmt .
      - name: Upload rustfmt-normalized maritime sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maritime-rustfmt-sources
          path: maritime-rustfmt-sources.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: maritime-observability-and-impact-receipts
          path: |
            maritime-observability-evidence-receipt.json
            maritime-qualification-impact-receipt.json
            maritime-observation-value-receipt.json
            maritime-validation-evidence-profile-receipt.json
            maritime-qualification-scope-receipt.json
            sail-capability-qualification-scope-receipt.json
            sail-capability-profile-receipt.json
          if-no-files-found: error
          retention-days: 90
