name: Careframe Evidence-Aware Design Space

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/careframe-design-space/**"
      - "docs/medical-robotics/careframe-design-space-*.json"
      - ".github/workflows/careframe-design-space.yml"
  push:
    branches:
      - "research/careframe-pareto-study-v0"

permissions:
  contents: read

concurrency:
  group: careframe-design-space-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pareto-contract:
    name: Validate hard gates and non-dominated design set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path tools/careframe-design-space/Cargo.toml -- --check

      - name: Locked unit tests
        run: cargo test --locked --manifest-path tools/careframe-design-space/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/careframe-design-space/Cargo.toml --all-targets -- -D warnings

      - name: Execute selector on frozen synthetic fixture
        env:
          CAREFRAME_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          study=docs/medical-robotics/careframe-design-space-study-fixture-v0.1.json
          scenarios=docs/medical-robotics/careframe-design-space-scenarios-v0.1.json
          cargo run --locked --quiet --manifest-path tools/careframe-design-space/Cargo.toml -- "$study" "$scenarios" > /tmp/careframe-design-space-receipt.json
          jq -e '.disposition == "PARETO_FRONT_AVAILABLE" and
                 .eligible_count == 3 and
                 .candidate_count == 4 and
                 .pareto_front == ["wheeled_mobile_manipulator", "wheeled_upper_body_humanoid"] and
                 .aggregate_score_used == false and
                 .physical_actuation_authorized == false and
                 .patient_contact_authorized == false and
                 .clinical_use_authorized == false' /tmp/careframe-design-space-receipt.json
          grep -q "\"tested_revision\": \"$CAREFRAME_TESTED_SHA\"" /tmp/careframe-design-space-receipt.json
          grep -Eq '"study_sha256": "[0-9a-f]{64}"' /tmp/careframe-design-space-receipt.json
          grep -Eq '"scenario_file_sha256": "[0-9a-f]{64}"' /tmp/careframe-design-space-receipt.json
          jq -e 'any(.blocked_candidates[]; .candidate_id == "biped_humanoid" and
                       (.findings | any(. == "SAFE_STOP_FAULT_CASE_FAILED"))) and
                 any(.candidate_results[]; .candidate_id == "fixed_base_manipulator" and .disposition == "DOMINATED")'             /tmp/careframe-design-space-receipt.json
          {
            echo "Tested revision: ${CAREFRAME_TESTED_SHA}"
            echo "Study SHA-256: $(sha256sum "$study" | cut -d' ' -f1)"
            echo "Scenario SHA-256: $(sha256sum "$scenarios" | cut -d' ' -f1)"
            echo "Cargo.lock SHA-256: $(sha256sum tools/careframe-design-space/Cargo.lock | cut -d' ' -f1)"
            echo ""
            echo "Selector does not calculate an aggregate score. Hard-gate failures are excluded before Pareto comparison."
            echo "All input scores in this fixture are synthetic and fabricated to exercise selector logic only."
            echo ""
            cat /tmp/careframe-design-space-receipt.json
          } >> "$GITHUB_STEP_SUMMARY"
