name: PHYS-EVID-01D1A Independent SHA-256 Oracle Qualification

on:
  push:
    branches:
      - ci/sha256-semantic-digest-oracle-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-independent-sha256-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBJECT_SHA: b729cd6edf058428eb26943a1edd592e5ce37061
      D0_SHA: bdb5781ae49dbf2e3967876d31677fc2cb4f1dff
      D0_FIXTURE_BLOB: 2514cb1bc931a69ea70ebb2cf0e8a96b9fca60a0
      D0_ORACLE_BLOB: 898664e9e757a195a621f734410e7f88f29a348e
      CONTRACT_BLOB: 7b76ae6f9391c5ce115e16af97b0c3e0f82c976c
      VECTOR_BLOB: da098d1155f6d474c03225e3374368ae9c26891a
      ORACLE_BLOB: 01cc3fb21781ec1b7a3322daeac926cae2db8a56

    steps:
      - name: Checkout exact D1A subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Exact one-commit three-file scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$D0_SHA"
          test "$(git rev-list --count "$D0_SHA..$SUBJECT_SHA")" = "1"

          mapfile -t changed < <(git diff --name-only "$D0_SHA" "$SUBJECT_SHA" | sort)
          expected=(
            docs/release/evidence/SHA256_SEMANTIC_DIGEST_ORACLE_V01.md
            tests/fixtures/semantic_digest_v1_vector.json
            tests/verify_semantic_digest_v1.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" = "3"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

          test "$(git ls-tree "$SUBJECT_SHA" tests/verify_semantic_digest_v1.py | awk '{print $1}')" = "100755"

      - name: Freeze exact semantic and predecessor-oracle blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$SUBJECT_SHA:docs/release/evidence/SHA256_SEMANTIC_DIGEST_ORACLE_V01.md")" = "$CONTRACT_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:tests/fixtures/semantic_digest_v1_vector.json")" = "$VECTOR_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:tests/verify_semantic_digest_v1.py")" = "$ORACLE_BLOB"

          test "$(git rev-parse "$D0_SHA:tests/fixtures/semantic_commitment_preimage_v1_vector.json")" = "$D0_FIXTURE_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:tests/fixtures/semantic_commitment_preimage_v1_vector.json")" = "$D0_FIXTURE_BLOB"
          test "$(git rev-parse "$D0_SHA:tests/verify_semantic_commitment_preimage_v1.py")" = "$D0_ORACLE_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:tests/verify_semantic_commitment_preimage_v1.py")" = "$D0_ORACLE_BLOB"

      - name: Prove dependency and product source immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$D0_SHA:Cargo.toml")" = "$(git rev-parse "$SUBJECT_SHA:Cargo.toml")"
          test "$(git rev-parse "$D0_SHA:Cargo.lock")" = "$(git rev-parse "$SUBJECT_SHA:Cargo.lock")"
          test -z "$(git diff --name-only "$D0_SHA" "$SUBJECT_SHA" -- Cargo.toml Cargo.lock src crates)"

      - name: Static stdlib-only and read-boundary oracle audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tests/verify_semantic_digest_v1.py')
          text = path.read_text()
          tree = ast.parse(text)

          allowed = {'__future__', 'hashlib', 'json', 'struct', 'pathlib'}
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported.add((node.module or '').split('.')[0])
          assert imported <= allowed, (imported, allowed)

          required = [
              'hashlib.sha256',
              'git_blob_sha1',
              'semantic_commitment_preimage_v1_vector.json',
              'semantic_digest_v1_vector.json',
              'symtropy-physics-semantic-digest\\0',
              'struct.pack(">I", record_version)',
              'struct.pack(">I", preimage_version)',
          ]
          for needle in required:
              assert needle in text, needle

          forbidden = [
              'subprocess', 'requests', 'urllib', 'socket', 'http://', 'https://',
              'Cargo.toml', 'Cargo.lock', 'target/', '.github/', 'workflow',
              'hydration/', 'qualification/', '.rs', 'src/', 'crates/',
              'rustc', 'cargo ', 'sha2::', 'Sha256::',
          ]
          for needle in forbidden:
              assert needle not in text, needle

          # The oracle's declared file inputs are exactly the frozen D0 fixture
          # and the preregistered D1A vector. It must not discover arbitrary files.
          assert text.count('read_bytes()') == 2, text.count('read_bytes()')
          assert 'D0_FIXTURE.read_bytes()' in text
          assert 'D1_VECTOR.read_bytes()' in text
          print('D1A stdlib/read-boundary independence audit: PASS')
          PY

      - name: Compile and execute D0 and D1A independent oracles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/verify_semantic_commitment_preimage_v1.py
          python3 -m py_compile tests/verify_semantic_digest_v1.py
          python3 tests/verify_semantic_commitment_preimage_v1.py
          python3 tests/verify_semantic_digest_v1.py

      - name: Immutable-source postflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/__pycache__
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD:tests/fixtures/semantic_digest_v1_vector.json)" = "$VECTOR_BLOB"
          test "$(git rev-parse HEAD:tests/verify_semantic_digest_v1.py)" = "$ORACLE_BLOB"
          test "$(git rev-parse HEAD:tests/fixtures/semantic_commitment_preimage_v1_vector.json)" = "$D0_FIXTURE_BLOB"
          test "$(git rev-parse HEAD:tests/verify_semantic_commitment_preimage_v1.py)" = "$D0_ORACLE_BLOB"

      - name: Emit qualification receipt outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          vector = json.loads(Path('tests/fixtures/semantic_digest_v1_vector.json').read_text())
          receipt = {
              'theorem': 'PHYS-EVID-01D1A independent SHA-256 semantic digest oracle preregistration v0.1',
              'subject_sha': os.environ['SUBJECT_SHA'],
              'd0_parent_sha': os.environ['D0_SHA'],
              'd0_fixture_blob': os.environ['D0_FIXTURE_BLOB'],
              'd0_oracle_blob': os.environ['D0_ORACLE_BLOB'],
              'd1a_vector_blob': os.environ['VECTOR_BLOB'],
              'd1a_oracle_blob': os.environ['ORACLE_BLOB'],
              'algorithm': vector['algorithm_domain'],
              'record_version': vector['record_version'],
              'preimage_version': vector['preimage_version'],
              'endpoint_record_len': vector['endpoint_sample']['record_len'],
              'consecutive_record_len': vector['consecutive_presence']['record_len'],
              'standard_sha256_kats_passed': True,
              'oracle_stdlib_only_audited': True,
              'oracle_file_read_boundary_exact': True,
              'receipt_emitted_outside_checkout': True,
              'd0_oracle_rerun_passed': True,
              'd0_source_candidate_only': True,
              'd0_separate_qualification_pass_claimed': False,
              'predecessor_pass_laundering': False,
              'd1a_oracle_passed': True,
              'rust_digest_implementation_present': False,
              'cargo_manifest_changed': False,
              'cargo_lock_changed': False,
              'hydration_pass_claimed': False,
              'rustcrypto_dependency_qualified': False,
              'sha256_security_assumption_proven': False,
              'authentication_claimed': False,
              'issuer_authority_claimed': False,
              'fork_resolution_claimed': False,
              'replay_or_action_authority_claimed': False,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'phys-evid-01d1a-receipt.json'
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(out)
          PY

      - name: Final immutable checkout gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD:tests/fixtures/semantic_digest_v1_vector.json)" = "$VECTOR_BLOB"
          test "$(git rev-parse HEAD:tests/verify_semantic_digest_v1.py)" = "$ORACLE_BLOB"
          test "$(git rev-parse HEAD:tests/fixtures/semantic_commitment_preimage_v1_vector.json)" = "$D0_FIXTURE_BLOB"
          test "$(git rev-parse HEAD:tests/verify_semantic_commitment_preimage_v1.py)" = "$D0_ORACLE_BLOB"

      - name: Upload qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: phys-evid-01d1a-independent-sha256-oracle-receipt
          path: ${{ runner.temp }}/phys-evid-01d1a-receipt.json
          if-no-files-found: error
