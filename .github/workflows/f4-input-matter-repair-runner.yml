name: F4 Input Matter Repair Runner

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: f4-input-matter-repair-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Apply standalone repair transform
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: fabrication/f4-input-matter-integrity

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Apply executable-plan test prerequisite
      shell: bash
      run: |
        python - <<'PY'
        from pathlib import Path
        path = Path('crates/domains/symtropy-fabrication/src/executable_plan.rs')
        text = path.read_text()
        pattern = 'Err(ExecutablePlanError::CapabilityBindingMismatch { step_id, .. })'
        guard = 'if step_id == step_id("clean")'
        if text.count(pattern) != 1:
            raise SystemExit(f'executable-plan pattern count={text.count(pattern)}')
        if text.count(guard) != 1:
            raise SystemExit(f'executable-plan guard count={text.count(guard)}')
        text = text.replace(
            pattern,
            'Err(ExecutablePlanError::CapabilityBindingMismatch { step_id: actual_step_id, .. })',
        )
        text = text.replace(guard, 'if actual_step_id == step_id("clean")')
        path.write_text(text)
        PY

    - name: Apply exact source transformation
      run: python .github/repair/f4_input_matter_repair.py

    - name: Apply canonical formatting
      run: cargo fmt --all

    - name: Run Fabrication tests
      run: cargo test -p symtropy-fabrication --lib

    - name: Run Fabrication Clippy
      run: cargo clippy -p symtropy-fabrication --all-targets --all-features -- -D warnings

    - name: Commit verified Rust source only
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add crates/domains/symtropy-fabrication/src/executable_plan.rs crates/domains/symtropy-fabrication/src/identity.rs crates/domains/symtropy-fabrication/src/process.rs crates/domains/symtropy-fabrication/src/process_evidence.rs
        git diff --cached --quiet && exit 0
        git commit -m "fix(fabrication): verify executable-plan tests and input matter integrity"
        git push origin HEAD:fabrication/f4-input-matter-integrity
