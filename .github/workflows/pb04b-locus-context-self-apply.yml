name: PB-04b Locus Context Self Apply

on:
  push:
    branches:
      - "spatial/pb04b-locus-context-v0.2"
    paths:
      - ".github/workflows/pb04b-locus-context-self-apply.yml"
      - "scripts/pb04b-stabilize-locus-context.py"
      - "crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs"

permissions:
  contents: write

concurrency:
  group: pb04b-locus-context-self-apply
  cancel-in-progress: true

jobs:
  qualify-and-freeze:
    name: Qualify and freeze PB-04b locus/context product
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact schema2 theorem source and qualified PB-04b v0.1 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "4d88fcab078aaa5703bb427f6d03f63ddd8c41aa"
          test "$(git rev-parse HEAD^^)" = "72fda03521621c0d781d28237de1e88aa513e1f8"
          test "$(git rev-parse 72fda03521621c0d781d28237de1e88aa513e1f8^{tree})" = "e7c9a2dfe87eca7d03980a90791b703cc79548a2"

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git rev-parse "HEAD:${path}")"
            test "${actual}" = "${expected}" || {
              echo "PB-04b schema2 locus/context source drift: ${path}" >&2
              echo "expected ${expected}" >&2
              echo "actual   ${actual}" >&2
              exit 1
            }
          }

          check_blob 676fd6a7eb31a2ec00b09c9496b42c568e791556 crates/domains/symtropy-spatial-decomposition/Cargo.lock
          check_blob 614fa7d2e293809faaef10649cf3beb02475c259 crates/domains/symtropy-spatial-decomposition/Cargo.toml
          check_blob b413c7a9801913acd82475e32148c404dcd290a6 crates/domains/symtropy-spatial-decomposition/src/lib.rs
          check_blob 3fc46b0af0dfcf671ae1fa97aac60bb98357e198 crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs
          check_blob 9a3f59609f59404bfe5d38886b30d98061a03b14 scripts/pb04b-stabilize-locus-context.py

          actual_source_delta="$(git diff --name-only 72fda03521621c0d781d28237de1e88aa513e1f8..HEAD | sort -u)"
          expected_source_delta="$(printf '%s\n' \
            .github/workflows/pb04b-locus-context-self-apply.yml \
            crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs \
            scripts/pb04b-stabilize-locus-context.py | sort)"
          if [[ "${actual_source_delta}" != "${expected_source_delta}" ]]; then
            echo "PB-04b schema2 theorem lineage changed unexpected paths" >&2
            echo "expected:" >&2
            printf '%s\n' "${expected_source_delta}" >&2
            echo "actual:" >&2
            printf '%s\n' "${actual_source_delta}" >&2
            exit 1
          fi

          echo "PB04B_SCHEMA2_INPUT_HEAD=${GITHUB_SHA}"
          echo "PB04B_SCHEMA2_INPUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "PB04B_QUALIFIED_V01_HEAD=72fda03521621c0d781d28237de1e88aa513e1f8"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04b-locus-context-target" >> "${GITHUB_ENV}"

      - name: Record hosted execution environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PB04B_RUNNER_OS=${RUNNER_OS}"
          echo "PB04B_RUNNER_ARCH=${RUNNER_ARCH}"
          echo "PB04B_IMAGE_OS=${ImageOS:-unknown}"
          echo "PB04B_IMAGE_VERSION=${ImageVersion:-unknown}"
          echo "PB04B_CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          uname -a
          git --version

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Apply exact schema2 locus/context transform and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pb04b-stabilize-locus-context.py
          cargo fmt --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml
          echo "PB04B_TRANSFORMED_LIB_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/src/lib.rs)"
          echo "PB04B_FORMATTED_TEST_BLOB=$(git hash-object crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs)"
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/Cargo.lock)" = "676fd6a7eb31a2ec00b09c9496b42c568e791556"

      - name: Verify locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          manifest="crates/domains/symtropy-spatial-decomposition/Cargo.toml"
          cargo metadata --manifest-path "${manifest}" --locked --format-version 1 > "${RUNNER_TEMP}/pb04b-locus-context-metadata.json"
          echo "PB04B_LOCKED_METADATA_SHA256=$(sha256sum "${RUNNER_TEMP}/pb04b-locus-context-metadata.json" | awk '{print $1}')"

      - name: Check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets

      - name: Test schema2 locus/context theorem
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked

      - name: Strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path crates/domains/symtropy-spatial-decomposition/Cargo.toml --locked --all-targets -- -D warnings

      - name: Require exact generated product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e crates/domains/symtropy-spatial-decomposition/target
          test "$(git hash-object crates/domains/symtropy-spatial-decomposition/Cargo.lock)" = "676fd6a7eb31a2ec00b09c9496b42c568e791556"

          actual="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"
          expected="crates/domains/symtropy-spatial-decomposition/src/lib.rs"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "PB-04b schema2 locus/context qualification produced unexpected product paths" >&2
            echo "expected: ${expected}" >&2
            echo "actual:" >&2
            printf '%s\n' "${actual}" >&2
            exit 1
          fi

      - name: Publish frozen PB-04b schema2 locus/context product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PB-04b Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/domains/symtropy-spatial-decomposition/src/lib.rs
          git diff --cached --check
          git diff --cached --exit-code --quiet && {
            echo "no PB-04b schema2 locus/context product delta" >&2
            exit 1
          }
          git commit -m "fix(spatial): stabilize PB-04b physical locus identities v2"

          product_head="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse HEAD^{tree})"
          echo "PB04B_SCHEMA2_PRODUCT_HEAD=${product_head}"
          echo "PB04B_SCHEMA2_PRODUCT_TREE=${product_tree}"
          echo "PB04B_SCHEMA2_PRODUCT_PARENT=$(git rev-parse HEAD^)"
          echo "PB04B_SCHEMA2_PRODUCT_LIB_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/src/lib.rs)"
          echo "PB04B_SCHEMA2_PRODUCT_TEST_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs)"
          echo "PB04B_SCHEMA2_PRODUCT_LOCK_BLOB=$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/Cargo.lock)"

          remote_head="$(git ls-remote origin refs/heads/spatial/pb04b-locus-context-v0.2 | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin HEAD:spatial/pb04b-locus-context-v0.2
