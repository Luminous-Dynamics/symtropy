name: Observation Frame Reference Oracle

on:
  push:
    branches: ["research/observation-frame-reference-v0"]
    paths:
      - "research/observation-frame-reference/**"
      - ".github/workflows/observation-frame-reference.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/observation-frame-reference/**"
      - ".github/workflows/observation-frame-reference.yml"

permissions:
  contents: read

concurrency:
  group: observation-frame-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          rustc +1.96.0 --version
          cargo +1.96.0 --version

      - name: Check formatting
        run: cargo +1.96.0 fmt --manifest-path research/observation-frame-reference/Cargo.toml -- --check

      - name: Run reference corpus
        run: cargo +1.96.0 test --locked --manifest-path research/observation-frame-reference/Cargo.toml

      - name: Run strict Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path research/observation-frame-reference/Cargo.toml --all-targets -- -D warnings

      - name: Benchmark 1k / 10k / 100k observation frames
        shell: bash
        run: |
          set -euo pipefail
          package="research/observation-frame-reference"
          mkdir -p "$package/target"
          export RUSTC_VERSION="$(rustc +1.96.0 --version)"
          export RUNNER_IMAGE_OS="${ImageOS:-unrecorded}"
          export RUNNER_IMAGE_VERSION="${ImageVersion:-unrecorded}"
          export CPU_MODEL="$(lscpu | awk -F: '/^Model name:/ { sub(/^[ \t]+/, "", $2); print $2; exit }')"
          cargo +1.96.0 run --release --locked --manifest-path "$package/Cargo.toml" --bin benchmark -- 1000 > "$package/target/benchmark-results.jsonl"

      - name: Check deterministic receipt
        shell: bash
        run: |
          set -euo pipefail
          package="research/observation-frame-reference"
          mkdir -p "$package/target/receipts"
          cargo +1.96.0 run --quiet --locked --manifest-path "$package/Cargo.toml" -- "$package/fixtures/machine-test-01.json" > "$package/target/receipts/first.json"
          cargo +1.96.0 run --quiet --locked --manifest-path "$package/Cargo.toml" -- "$package/fixtures/machine-test-01.json" > "$package/target/receipts/second.json"
          cmp "$package/target/receipts/first.json" "$package/target/receipts/second.json"
          grep -q '"claim_ceiling":' "$package/target/receipts/first.json"
          sha256sum "$package/target/receipts/first.json"

      - name: Preserve benchmark and known-answer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observation-frame-reference-${{ github.sha }}
          path: |
            research/observation-frame-reference/target/benchmark-results.jsonl
            research/observation-frame-reference/target/receipts/
          if-no-files-found: warn
          retention-days: 30

