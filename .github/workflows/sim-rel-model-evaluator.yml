name: SIM-REL-010 Model-Indexed Evaluator

on:
  push:
    branches: ["main", "research/sim-rel-010-*"]
    paths:
      - "tools/sim-rel-model-evaluator/**"
      - ".github/workflows/sim-rel-model-evaluator.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/sim-rel-model-evaluator/**"
      - ".github/workflows/sim-rel-model-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: exact shared-policy replay across model worlds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-model-evaluator-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/sim-rel-model-evaluator/Cargo.toml -- --check
      - name: Unit and prior-shift golden fixture tests
        run: cargo test --locked --manifest-path tools/sim-rel-model-evaluator/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-model-evaluator/Cargo.toml --lib -- -D warnings
      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
