name: Authority Mutation TLA+ Model Check

on:
  push:
    branches:
      - research/cdaab-mutation-linearization-v0-1
    paths:
      - "research/mobility-mutation-boundary/formal/**"
      - ".github/workflows/authority-mutation-tla.yml"
  pull_request:
    paths:
      - "research/mobility-mutation-boundary/formal/**"
      - ".github/workflows/authority-mutation-tla.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download pinned TLC 1.7.4
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" | sha1sum --check
      - name: Parse and model-check finite authority protocol
        working-directory: research/mobility-mutation-boundary/formal
        run: |
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC -workers auto AuthorityMutationBoundary.tla
