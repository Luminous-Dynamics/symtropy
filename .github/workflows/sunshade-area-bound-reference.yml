name: sunshade-area-bound-reference

on:
  pull_request:
    paths:
      - ".github/workflows/sunshade-area-bound-reference.yml"
      - "tools/sunshade-area-bound-reference/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sunshade-area-bound-reference.yml"
      - "tools/sunshade-area-bound-reference/**"

permissions:
  contents: read

jobs:
  reference:
    name: projected shade-mask area bound
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/sunshade-area-bound-reference/Cargo.toml -- --check

      - name: Run unit tests
        run: cargo test --manifest-path tools/sunshade-area-bound-reference/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/sunshade-area-bound-reference/Cargo.toml --all-targets -- -D warnings

      - name: Execute frozen reference case
        run: |
          cargo run --manifest-path tools/sunshade-area-bound-reference/Cargo.toml --release > sunshade-area-bound.json
          grep -q '"evidence_class": "synthetic_analytical_reference"' sunshade-area-bound.json
          grep -q '"projected_mask_union_area_lower_bound_m2":' sunshade-area-bound.json
          grep -q '"claim_ceiling":' sunshade-area-bound.json
