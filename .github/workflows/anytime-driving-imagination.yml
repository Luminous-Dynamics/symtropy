name: anytime-driving-imagination

on:
  pull_request:
    paths:
      - "research/anytime-driving-imagination-001/**"
      - ".github/workflows/anytime-driving-imagination.yml"
  push:
    paths:
      - "research/anytime-driving-imagination-001/**"
      - ".github/workflows/anytime-driving-imagination.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path research/anytime-driving-imagination-001/Cargo.toml -- --check

      - name: Run known-answer and adversarial tests
        run: cargo test --locked --manifest-path research/anytime-driving-imagination-001/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/anytime-driving-imagination-001/Cargo.toml --all-targets --all-features -- -D warnings
