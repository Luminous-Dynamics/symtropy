name: Maritime observability adapter
on:
  push:
    branches: ["research/maritime-observability-adapter-v0-1"]
    paths:
      - "crates/domains/symtropy-maritime-observability-bench/**"
      - "crates/domains/symtropy-sensor-observability-bench/**"
      - "benchmarks/maritime-observability/**"
      - "docs/tech/MARITIME_OBSERVABILITY_ADAPTER_*"
      - ".github/workflows/maritime-observability-adapter.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/domains/symtropy-maritime-observability-bench/**"
      - "crates/domains/symtropy-sensor-observability-bench/**"
      - "benchmarks/maritime-observability/**"
      - "docs/tech/MARITIME_OBSERVABILITY_ADAPTER_*"
      - ".github/workflows/maritime-observability-adapter.yml"
permissions:
  contents: read
concurrency:
  group: maritime-observability-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Test reusable generic pairwise kernel
        run: cargo test --manifest-path crates/domains/symtropy-sensor-observability-bench/Cargo.toml
      - name: Strict Clippy for reusable generic kernel
        run: cargo clippy --manifest-path crates/domains/symtropy-sensor-observability-bench/Cargo.toml --all-targets -- -D warnings
      - name: Run adapter tests
        run: cargo test --manifest-path crates/domains/symtropy-maritime-observability-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path crates/domains/symtropy-maritime-observability-bench/Cargo.toml --all-targets -- -D warnings
      - name: Execute frozen fixture and verify receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          case_file="benchmarks/maritime-observability/maritime-observability-case-v0.1.json"
          case_sha256="$(sha256sum "$case_file" | awk '{print $1}')"
          clock_file="benchmarks/maritime-observability/synthetic-clock-qualification-v0.1.json"
          clock_sha256="$(sha256sum "$clock_file" | awk '{print $1}')"
          cargo run --quiet --manifest-path crates/domains/symtropy-maritime-observability-bench/Cargo.toml -- "$case_file" --source-commit "$source_commit" --case-sha256 "$case_sha256" --clock-qualification "$clock_file" --clock-sha256 "$clock_sha256" > maritime-observability-adapter-report.json
          jq -e --arg source "$source_commit" --arg digest "$case_sha256" --arg clock_sha "$clock_sha256" '.execution.source_commit == $source and .execution.case_sha256 == $digest and .execution.clock_qualification_sha256 == $clock_sha and .execution.clock_qualification_id == "SYNTHETIC-CLOCK-QUALIFICATION-001" and .execution.timebase_id == "marine-engine-common-ptp-v1" and (.ambiguity_classes | length == 1) and .authority_boundary.read_only == true and .authority_boundary.actuation == false and .operating_domain.maximum_timestamp_uncertainty_ms == 5 and (.metrics[] | select(.metric_id == "dependency_reviewed_installed_sensor_count") | .value == 5) and (.sensor_inventory | all(.[]; .timebase_qualification_state == "synthetic_conformance" and .timebase_id == "marine-engine-common-ptp-v1" and .timestamp_uncertainty_source == "synthetic_fixture" and .timestamp_uncertainty_ms == 1 and .timebase_qualification_sha256 == $clock_sha)) and (.metrics[] | select(.metric_id == "timebase_qualified_installed_sensor_count") | .value == 5) and (.claim_ceiling | contains("Structural detectability against the declared reference")) and (.pair_assessments | length == 11) and (.fault_assessments | all(.[]; has("ambiguity_class_ids"))) and (.sensor_loss_scenarios | length == 4) and (.measurement_window_assessments | length == 6) and ([.measurement_window_assessments[] | select(.status == "qualified")] | length == 5) and ([.measurement_window_assessments[] | select(.state_id == "ENGINE_UNKNOWN_OUT_OF_DOMAIN") | .status] == ["not_evaluated"]) and (.measurement_window_assessments | all(.[]; if .status == "qualified" then .guaranteed_common_overlap_ms >= .required_common_overlap_ms else .status == "not_evaluated" end)) and (.sensor_loss_scenarios | all(.[]; (.measurement_window_assessments | length == 6))) and ([.pair_assessments[].state] | sort == ["isolable","isolable","isolable","isolable","isolable","isolable","isolable","isolable","non_isolable","non_isolable","not_evaluated"])' maritime-observability-adapter-report.json
      - name: Upload deterministic report
        uses: actions/upload-artifact@v4
        with:
          name: maritime-observability-adapter-report
          path: maritime-observability-adapter-report.json
          if-no-files-found: error
          retention-days: 90
