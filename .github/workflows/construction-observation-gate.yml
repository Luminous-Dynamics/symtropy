name: Construction Observation Coverage Gate

on:
  pull_request:
    paths:
      - ".github/workflows/construction-observation-gate.yml"
      - "crates/apps/symtropy-construction-observation-gate/**"
      - "research/construction-observation-coverage-v0-1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-observation-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    name: Observation gate validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy — observation coverage gate
        run: cargo clippy -p symtropy-construction-observation-gate --all-targets -- -D warnings

      - name: Test — observation coverage gate
        run: cargo test -p symtropy-construction-observation-gate --all-targets
