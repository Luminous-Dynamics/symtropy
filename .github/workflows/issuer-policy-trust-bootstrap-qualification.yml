name: PHYS-EVID-03B1B Local Issuer Policy Trust Bootstrap Qualification

on:
  push:
    branches:
      - ci/issuer-policy-trust-bootstrap-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-issuer-policy-trust-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBJECT_SHA: 1f15527bd042972e59db8fa605396cc80986b59a
      PARENT_SHA: 509b4ea5af6167218c6e0c4ecaafdaff520d0705
      MAIN_SHA: c9ff0eb980389fd72b876488a7acfbbd5acc4780

      CONTRACT_BLOB: 5010d2fa174cbe921111588b245a0c997d78dd2c
      SOURCE_BLOB: dff364eb03a28f9b681a79645cfb7aca0bc0aea7
      ROOT_LIB_BLOB: 4d4c9a9e37c1762e56fdb34a5535b3faf2b633bc

      B1A_CONTRACT_BLOB: fe342df69a408110238498681a2dc8b269e17a36
      B1A_SOURCE_BLOB: b7c0e89c653d8b7dcdd16fbefdb43ef1ca3dfe08
      B1A_LIB_BLOB: 2b2abc235296cd44a78e57fb99b6001a3492f8d4
      B1A_FIXTURE_BLOB: 3bdac8266bbb542bcd2456243e9e6df9ad5241c9
      B1A_TEST_BLOB: dc84c236bfebfdf99a77241b737217b2c71f68c5
      B1A_ORACLE_BLOB: a9f4ed0df06ad5a696ffbc77646fd20b5ede8d06

    steps:
      - name: Checkout exact B1B subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Exact one-commit three-file B1B scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA..$SUBJECT_SHA")" = "1"

          mapfile -t changed < <(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA" | sort)
          expected=(
            docs/release/evidence/LOCAL_ISSUER_POLICY_TRUST_BOOTSTRAP_V01.md
            src/issuer_policy_trust.rs
            src/lib.rs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" = "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Freeze exact B1B blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$SUBJECT_SHA:docs/release/evidence/LOCAL_ISSUER_POLICY_TRUST_BOOTSTRAP_V01.md")" = "$CONTRACT_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:src/issuer_policy_trust.rs")" = "$SOURCE_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:src/lib.rs")" = "$ROOT_LIB_BLOB"

      - name: Freeze exact B1A parent lineage and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA^")" = "$MAIN_SHA"
          test "$(git rev-list --count "$MAIN_SHA..$PARENT_SHA")" = "1"

          test "$(git rev-parse "$PARENT_SHA:crates/core/symtropy-physics/ISSUER_AUTHORIZATION_POLICY_CANONICAL_V01.md")" = "$B1A_CONTRACT_BLOB"
          test "$(git rev-parse "$PARENT_SHA:crates/core/symtropy-physics/src/issuer_policy.rs")" = "$B1A_SOURCE_BLOB"
          test "$(git rev-parse "$PARENT_SHA:crates/core/symtropy-physics/src/lib.rs")" = "$B1A_LIB_BLOB"
          test "$(git rev-parse "$PARENT_SHA:crates/core/symtropy-physics/tests/fixtures/issuer_policy_v01_golden.json")" = "$B1A_FIXTURE_BLOB"
          test "$(git rev-parse "$PARENT_SHA:crates/core/symtropy-physics/tests/issuer_policy_canonical_v01.rs")" = "$B1A_TEST_BLOB"
          test "$(git rev-parse "$PARENT_SHA:crates/core/symtropy-physics/tests/issuer_policy_v01_oracle.py")" = "$B1A_ORACLE_BLOB"

          test "$(git rev-parse "$SUBJECT_SHA:crates/core/symtropy-physics/src/issuer_policy.rs")" = "$B1A_SOURCE_BLOB"
          test "$(git rev-parse "$SUBJECT_SHA:crates/core/symtropy-physics/tests/fixtures/issuer_policy_v01_golden.json")" = "$B1A_FIXTURE_BLOB"

      - name: Prove no manifest or lock change in B1B
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$PARENT_SHA:Cargo.toml")" = "$(git rev-parse "$SUBJECT_SHA:Cargo.toml")"
          test "$(git rev-parse "$PARENT_SHA:Cargo.lock")" = "$(git rev-parse "$SUBJECT_SHA:Cargo.lock")"
          test "$(git rev-parse "$PARENT_SHA:crates/core/symtropy-physics/Cargo.toml")" = "$(git rev-parse "$SUBJECT_SHA:crates/core/symtropy-physics/Cargo.toml")"
          test -z "$(git diff --name-only "$PARENT_SHA" "$SUBJECT_SHA" -- Cargo.toml Cargo.lock crates/core/symtropy-physics/Cargo.toml)"

      - name: Independent B1A canonical-policy oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 crates/core/symtropy-physics/tests/issuer_policy_v01_oracle.py

      - name: Static local-caller trust-boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('src/issuer_policy_trust.rs').read_text()
          production = text.split('#[cfg(test)]', 1)[0]
          contract = Path('docs/release/evidence/LOCAL_ISSUER_POLICY_TRUST_BOOTSTRAP_V01.md').read_text()

          required = [
              '"local-explicit-policy-bootstrap-v1"',
              'pub struct LocalIssuerPolicyTrustBootstrap',
              'pub struct LocallyTrustedIssuerAuthorizationPolicyV1',
              'canonical_policy_bytes: Vec<u8>',
              'policy: DecodedIssuerAuthorizationPolicyV1',
              'pub fn begin_local_issuer_policy_trust_bootstrap_v1()',
              'pub fn trust_exact_policy_bytes(',
              'Result<LocallyTrustedIssuerAuthorizationPolicyV1,',
              'candidate: &[u8]',
              'decode_issuer_authorization_policy_v1(candidate)?',
              'let canonical_policy_bytes = policy.to_canonical_bytes();',
              'if canonical_policy_bytes.as_slice() != candidate',
              'Ok(LocallyTrustedIssuerAuthorizationPolicyV1',
              'bootstrap_profile: LOCAL_ISSUER_POLICY_TRUST_BOOTSTRAP_PROFILE_V1',
              'PHYS-EVID-03B1B2',
              'does **not** prove caller identity or deployment/operator authorization',
          ]
          for needle in required:
              assert needle in production, needle

          assert 'TrustedIssuerAuthorizationPolicyV1' not in production.replace('LocallyTrustedIssuerAuthorizationPolicyV1', '')
          assert 'LocallyTrustedIssuerAuthorizationPolicyV1' in contract
          assert 'DeploymentAuthorizedIssuerPolicySnapshotV1' in contract

          marker = re.search(
              r'#\[derive\((?P<derive>[^)]*)\)\]\s*pub struct LocalIssuerPolicyTrustBootstrap\s*\{(?P<body>.*?)\n\}',
              production,
              re.S,
          )
          trusted = re.search(
              r'#\[derive\((?P<derive>[^)]*)\)\]\s*pub struct LocallyTrustedIssuerAuthorizationPolicyV1\s*\{(?P<body>.*?)\n\}',
              production,
              re.S,
          )
          assert marker and trusted
          assert 'Clone' not in marker.group('derive') and 'Copy' not in marker.group('derive')
          assert 'Clone' not in trusted.group('derive') and 'Copy' not in trusted.group('derive')
          assert 'pub ' not in marker.group('body')
          assert 'pub canonical_policy_bytes' not in trusted.group('body')
          assert 'pub policy' not in trusted.group('body')
          assert 'pub bootstrap_profile' not in trusted.group('body')

          forbidden = [
              'impl From<DecodedIssuerAuthorizationPolicyV1> for LocallyTrustedIssuerAuthorizationPolicyV1',
              'impl TryFrom<DecodedIssuerAuthorizationPolicyV1> for LocallyTrustedIssuerAuthorizationPolicyV1',
              'impl From<Vec<u8>> for LocallyTrustedIssuerAuthorizationPolicyV1',
              'impl TryFrom<Vec<u8>> for LocallyTrustedIssuerAuthorizationPolicyV1',
              'pub fn from_bytes', 'pub fn from_decoded',
              'Serialize', 'Deserialize', 'serde',
              'std::fs', 'File::', 'Path::', 'metadata(', 'mtime', 'watcher',
              'SystemTime', 'Instant::now',
              'verify_signature', 'sign_', 'Sha256', 'sha2', 'blake3',
              'IssuerAuthorizedPersistentPhysicsEvidenceV1',
              'ActionKey', 'compare_and_set', 'settlement', 'escrow',
          ]
          for needle in forbidden:
              assert needle not in production, needle

          assert '&mut LocallyTrustedIssuerAuthorizationPolicyV1' not in production
          assert 'pub fn policy_mut' not in production
          assert 'pub fn canonical_policy_bytes_mut' not in production

          print('PHYS-EVID-03B1B exact local-trust type audit: PASS')
          PY

      - name: Install pinned Rust 1.96
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Rust format and integration checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check -p symtropy-physics --locked
          cargo check -p symtropy-launcher --lib --locked

      - name: B1A and B1B semantic corpora
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-physics --test issuer_policy_canonical_v01 --locked -- --nocapture
          cargo test -p symtropy-launcher --lib issuer_policy_trust::tests --locked -- --nocapture

      - name: Library regressions and warnings-denied Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-physics --lib --locked
          cargo clippy -p symtropy-physics --lib --locked -- -D warnings
          cargo clippy -p symtropy-launcher --lib --locked -- -D warnings

      - name: Immutable-source postflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD:src/issuer_policy_trust.rs)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:crates/core/symtropy-physics/src/issuer_policy.rs)" = "$B1A_SOURCE_BLOB"

      - name: Emit qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          receipt = {
              'theorem': 'PHYS-EVID-03B1B local explicit issuer-policy trust bootstrap v0.1',
              'subject_sha': os.environ['SUBJECT_SHA'],
              'b1a_parent_sha': os.environ['PARENT_SHA'],
              'bootstrap_profile': 'local-explicit-policy-bootstrap-v1',
              'strong_type': 'LocallyTrustedIssuerAuthorizationPolicyV1',
              'one_shot_local_marker': True,
              'exact_canonical_bytes_retained': True,
              'decoded_policy_read_only': True,
              'file_path_identity_used': False,
              'silent_reload_supported': False,
              'caller_identity_authenticated': False,
              'deployment_authorization_claimed': False,
              'b1b2_claimed': False,
              'cargo_manifest_changed': False,
              'cargo_lock_changed': False,
              'b1a_separate_qualification_pass_claimed': False,
              'policy_root_authenticity_claimed': False,
              'global_policy_freshness_claimed': False,
              'trusted_time_claimed': False,
              'b0_crypto_validity_claimed': False,
              'issuer_authorization_claimed': False,
              'contradiction_resolution_claimed': False,
              'side_effect_authority_claimed': False,
              'settlement_claimed': False,
          }
          Path('phys-evid-03b1b-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Upload qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: phys-evid-03b1b-local-policy-trust-bootstrap-receipt
          path: phys-evid-03b1b-receipt.json
          if-no-files-found: error
