name: Maritime cargo capture completeness

on:
  pull_request:
    paths:
      - "benchmarks/maritime-cargo-capture-completeness/**"
      - ".github/workflows/maritime-cargo-capture-completeness.yml"
  push:
    branches:
      - "research/maritime-cargo-capture-completeness-v0-1"
    paths:
      - "benchmarks/maritime-cargo-capture-completeness/**"
      - ".github/workflows/maritime-cargo-capture-completeness.yml"

permissions:
  contents: read

concurrency:
  group: maritime-cargo-capture-completeness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/maritime-cargo-capture-completeness/Cargo.toml -- --check
      - name: Run locked tests
        run: cargo test --manifest-path benchmarks/maritime-cargo-capture-completeness/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path benchmarks/maritime-cargo-capture-completeness/Cargo.toml --locked --all-targets -- -D warnings
