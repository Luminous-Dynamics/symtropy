name: SIM-REL-020 Counterexample-Guided Model-Family Refinement

on:
  push:
    branches: ["research/sim-rel-020-*"]
    paths:
      - "tools/sim-rel-model-family-refiner/**"
      - "tools/sim-rel-model-family-auditor/**"
      - "tools/sim-rel-joint-stochastic-oracle/**"
      - ".github/workflows/sim-rel-020-model-family-refinement.yml"
  pull_request:
    branches: ["main", "research/sim-rel-019-model-family-auditor"]
    paths:
      - "tools/sim-rel-model-family-refiner/**"
      - "tools/sim-rel-model-family-auditor/**"
      - "tools/sim-rel-joint-stochastic-oracle/**"
      - ".github/workflows/sim-rel-020-model-family-refinement.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: append-only counterexample-guided model revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-020-model-refiner-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --manifest-path tools/sim-rel-model-family-refiner/Cargo.toml -- --check
      - name: Exact revision tests
        run: cargo test --locked --manifest-path tools/sim-rel-model-family-refiner/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-model-family-refiner/Cargo.toml --lib -- -D warnings
      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD: \${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
