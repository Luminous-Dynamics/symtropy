name: Kerr near-extremal strong-deflection quadrature audit

on:
  push:
    branches:
      - research/kerr-near-extremal-deflection-20261114
    paths:
      - crates/domains/symtropy-relativity/src/near_extremal_deflection.rs
      - crates/domains/symtropy-relativity/src/kerr_geodesic.rs
      - crates/domains/symtropy-relativity/src/lib.rs
      - crates/domains/symtropy-relativity/near_extremal_kerr_strong_deflection_v1.json
      - crates/domains/symtropy-relativity/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kerr-near-extremal-deflection.yml
  pull_request:
    branches:
      - research/kerr-canonical-endpoint-map-20261113
    paths:
      - crates/domains/symtropy-relativity/src/near_extremal_deflection.rs
      - crates/domains/symtropy-relativity/src/kerr_geodesic.rs
      - crates/domains/symtropy-relativity/src/lib.rs
      - crates/domains/symtropy-relativity/near_extremal_kerr_strong_deflection_v1.json
      - crates/domains/symtropy-relativity/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kerr-near-extremal-deflection.yml

permissions:
  contents: read

concurrency:
  group: kerr-near-extremal-deflection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Near-extremal Kerr strong-deflection (Linux, Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: |
          rustfmt --edition 2024 --check crates/domains/symtropy-relativity/src/near_extremal_deflection.rs
          rustfmt --edition 2024 --check crates/domains/symtropy-relativity/src/lib.rs
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path crates/domains/symtropy-relativity/Cargo.toml --all-targets -- -D warnings
      - name: Run crate tests
        run: cargo test --locked --manifest-path crates/domains/symtropy-relativity/Cargo.toml --lib
