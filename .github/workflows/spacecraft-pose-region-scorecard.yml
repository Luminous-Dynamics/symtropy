name: Spacecraft Pose Region Scorecard

on:
  pull_request:
    paths:
      - "tools/spacecraft-pose-region-scorecard-bench/**"
      - ".github/workflows/spacecraft-pose-region-scorecard.yml"
  push:
    branches:
      - "research/spacecraft-pose-region-scorecard-v0-1"
    paths:
      - "tools/spacecraft-pose-region-scorecard-bench/**"
      - ".github/workflows/spacecraft-pose-region-scorecard.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Pose region calibration scorecard and oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/spacecraft-pose-region-scorecard-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/spacecraft-pose-region-scorecard-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/spacecraft-pose-region-scorecard-bench/Cargo.toml --all-targets -- -D warnings
      - name: Bind frozen corpus digest
        run: |
          echo "CORPUS_SHA256=$(sha256sum tools/spacecraft-pose-region-scorecard-bench/fixtures/pose-region-corpus-v0_1.csv | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Deterministic Rust receipt
        run: |
          cargo run --quiet --locked --manifest-path tools/spacecraft-pose-region-scorecard-bench/Cargo.toml --bin spacecraft-pose-region-scorecard-bench -- tools/spacecraft-pose-region-scorecard-bench/fixtures/pose-region-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/pose-region-rust.json
          cargo run --quiet --locked --manifest-path tools/spacecraft-pose-region-scorecard-bench/Cargo.toml --bin spacecraft-pose-region-scorecard-bench -- tools/spacecraft-pose-region-scorecard-bench/fixtures/pose-region-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/pose-region-rust-replay.json
          cmp /tmp/pose-region-rust.json /tmp/pose-region-rust-replay.json
      - name: Independent Python scorecard oracle
        run: |
          python3 tools/spacecraft-pose-region-scorecard-bench/tests/reference_oracle.py tools/spacecraft-pose-region-scorecard-bench/fixtures/pose-region-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/pose-region-python.json
      - name: Compare complete receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/pose-region-rust.json").read_text())
          oracle = json.loads(Path("/tmp/pose-region-python.json").read_text())
          assert rust == oracle
          assert rust["scorecard"]["case_count"] == 42
          assert rust["claim_ready"] is False
          assert rust["source_bytes_authenticated"] is False
          assert rust["physical_validation"] == "NOT_ASSESSED"
          assert rust["authority_granted"] is False
          cases = {item["case_id"]: item for item in rust["scorecard"]["results"]}
          assert cases["SC001"]["disposition"] == "SCORED"
          assert all(row["joint_covered"] for row in cases["SC001"]["regions"])
          assert cases["SC005"]["regions"][0]["orientation_error_urad"] == 0
          assert cases["SC024"]["disposition"] == "ABSTAINED"
          assert cases["SC025"]["disposition"] == "MISSING"
          assert cases["SC037"]["disposition"] == "SPLIT_LEAKAGE"
          assert cases["SC039"]["disposition"] == "DUPLICATE_SAMPLE"
          assert cases["SC042"]["disposition"] == "INVALID_INPUT"
          print("42 pose-region cases: exact Rust/Python receipt equality")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spacecraft-pose-region-scorecard-evidence
          path: |
            /tmp/pose-region-rust.json
            /tmp/pose-region-python.json
            tools/spacecraft-pose-region-scorecard-bench/fixtures/pose-region-corpus-v0_1.csv
          if-no-files-found: error
          retention-days: 30
