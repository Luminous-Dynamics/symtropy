name: GeoFusion FMI Trace Verifier

on:
  pull_request:
    branches: ["main"]
    paths:
      - "research/geofusion-fmi-trace-verifier/**"
      - ".github/workflows/geofusion-fmi-trace-verifier.yml"
  push:
    branches: ["main"]
    paths:
      - "research/geofusion-fmi-trace-verifier/**"
      - ".github/workflows/geofusion-fmi-trace-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geofusion-fmi-trace-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify standalone Rust contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/geofusion-fmi-trace-verifier/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path research/geofusion-fmi-trace-verifier/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path research/geofusion-fmi-trace-verifier/Cargo.toml --all-targets --locked
