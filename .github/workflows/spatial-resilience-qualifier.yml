name: Spatial resilience qualifier

on:
  pull_request:
    paths:
      - "docs/research/spatial-design/SPATIAL_RESILIENCE_*"
      - "tools/spatial-resilience-qualifier/**"
      - "research/scan-bim-decision-capture-001/**"
      - ".github/workflows/spatial-resilience-qualifier.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/spatial-design/SPATIAL_RESILIENCE_*"
      - "tools/spatial-resilience-qualifier/**"
      - "research/scan-bim-decision-capture-001/**"
      - ".github/workflows/spatial-resilience-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualifier:
    name: Schema, semantic invariants, and temporal oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Resolve and snapshot standalone dependencies
        run: cargo generate-lockfile --manifest-path tools/spatial-resilience-qualifier/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path tools/spatial-resilience-qualifier/Cargo.toml -- --check

      - name: Run unit and negative-control tests
        run: cargo test --manifest-path tools/spatial-resilience-qualifier/Cargo.toml --locked

      - name: Validate embedded manifest against schema
        run: cargo run --manifest-path tools/spatial-resilience-qualifier/Cargo.toml --locked -- --check --json > spatial-resilience-qualifier-receipt.json

      - name: Execute data-driven timeline oracle corpus
        run: cargo run --manifest-path tools/spatial-resilience-qualifier/Cargo.toml --locked -- --oracle-check --json > spatial-resilience-timeline-receipt.json

      - name: Execute paired-outcome and Pareto corpus
        run: cargo run --manifest-path tools/spatial-resilience-qualifier/Cargo.toml --locked -- --outcome-check --json > spatial-resilience-outcome-receipt.json

      - name: Execute decision-impact measurement corpus
        run: cargo run --manifest-path tools/spatial-resilience-qualifier/Cargo.toml --locked -- --decision-impact-check --json > spatial-resilience-decision-impact-receipt.json

      - name: Execute adaptive measurement policy corpus
        run: cargo run --manifest-path tools/spatial-resilience-qualifier/Cargo.toml --locked -- --adaptive-policy-check --json > spatial-resilience-adaptive-policy-receipt.json

      - name: Execute Scan-to-BIM decision-sufficient capture adapter
        run: |
          cargo run --manifest-path tools/spatial-resilience-qualifier/Cargo.toml --locked --bin scan_bim_decision_capture -- --check --json > scan-bim-decision-capture-receipt.json
          jq -e '
            (.schema_version == "0.1") and
            (.case_id == "SCAN-BIM-DOOR-CLEARANCE-001") and
            (.action_count == 4) and
            (.qualified_action_count == 3) and
            (.rejected_action_count == 1) and
            (.decision.recommended_action_order == ["targeted-oblique-clearance-scan", "full-room-tls-sweep"]) and
            ([.decision.actions[] | select(.action_id == "dense-frontal-wall-scan")][0].decision_relevant == false) and
            ([.decision.actions[] | select(.action_id == "blocked-backside-scan")][0].status == "reject_action") and
            (.claim_ceiling | startswith("FINITE_STATE_SYNTHETIC_DECISION_ADAPTER_ONLY"))
          ' scan-bim-decision-capture-receipt.json

      - name: Bind receipts to exact files and resolved dependency lock
        run: |
          sha256sum \
            docs/research/spatial-design/SPATIAL_RESILIENCE_TRAJECTORY_FIXTURES_V0_1.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_TRAJECTORY_FIXTURES_V0_1.schema.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_TIMELINE_ORACLE_V0_1.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_TIMELINE_ORACLE_V0_1.schema.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_PAIRED_OUTCOMES_V0_1.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_PAIRED_OUTCOMES_V0_1.schema.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_DECISION_IMPACT_V0_1.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_DECISION_IMPACT_V0_1.schema.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_ADAPTIVE_POLICIES_V0_1.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_ADAPTIVE_POLICIES_V0_1.schema.json \
            docs/research/spatial-design/SPATIAL_RESILIENCE_TRAJECTORY_PROTOCOL_V0_1.md \
            tools/spatial-resilience-qualifier/README.md \
            tools/spatial-resilience-qualifier/Cargo.toml \
            tools/spatial-resilience-qualifier/src/lib.rs \
            tools/spatial-resilience-qualifier/src/main.rs \
            tools/spatial-resilience-qualifier/src/outcomes.rs \
            tools/spatial-resilience-qualifier/src/decision_impact.rs \
            tools/spatial-resilience-qualifier/src/adaptive_policy.rs \
            tools/spatial-resilience-qualifier/src/scan_bim.rs \
            tools/spatial-resilience-qualifier/src/bin/scan_bim_decision_capture.rs \
            research/scan-bim-decision-capture-001/fixtures/door-clearance-v0_1.json \
            research/scan-bim-decision-capture-001/schema/scan-bim-decision-case-v0_1.schema.json \
            scan-bim-decision-capture-receipt.json \
            tools/spatial-resilience-qualifier/Cargo.lock \
            spatial-resilience-qualifier-receipt.json \
            spatial-resilience-timeline-receipt.json \
            spatial-resilience-outcome-receipt.json \
            spatial-resilience-decision-impact-receipt.json \
            spatial-resilience-adaptive-policy-receipt.json > spatial-resilience-qualifier-receipt.sha256
          git rev-parse HEAD > spatial-resilience-qualifier-commit.txt

      - name: Upload exact-head receipts and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: spatial-resilience-qualifier-receipt
          if-no-files-found: error
          path: |
            spatial-resilience-qualifier-receipt.json
            spatial-resilience-timeline-receipt.json
            spatial-resilience-outcome-receipt.json
            spatial-resilience-decision-impact-receipt.json
            spatial-resilience-adaptive-policy-receipt.json
            scan-bim-decision-capture-receipt.json
            spatial-resilience-qualifier-receipt.sha256
            spatial-resilience-qualifier-commit.txt
            tools/spatial-resilience-qualifier/Cargo.lock
