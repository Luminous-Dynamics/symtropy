name: Shipyard Geometry Measurement Oracle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-geometry-measurement-oracle/**"
      - "benchmarks/shipyard/geometry-measurement-oracle/**"
      - "docs/tech/SHIPYARD_GEOMETRY_MEASUREMENT_ORACLE_V0_1*"
      - ".github/workflows/shipyard-geometry-measurement-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-geometry-measurement-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic profile measurement oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-geometry-measurement-oracle/Cargo.toml --all -- --check

      - name: Run geometry oracle mutation tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-geometry-measurement-oracle/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-geometry-measurement-oracle/Cargo.toml --all-targets -- -D warnings

      - name: Replay all frozen geometry known answers
        run: cargo run --locked --manifest-path crates/tools/shipyard-geometry-measurement-oracle/Cargo.toml -- benchmarks/shipyard/geometry-measurement-oracle/corpus-v0.1.json

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
