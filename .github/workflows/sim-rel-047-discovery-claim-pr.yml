name: SIM-REL-047 Discovery Claim Dossier PR Qualification

on:
  pull_request:
    branches:
      - research/sim-rel-046-repeated-run-scientific-reliability-2026-11-02
    paths:
      - "tools/sim-rel-action-realization-filter/src/decision_value.rs"
      - "tools/sim-rel-action-realization-filter/src/decision_value/**"
      - "tools/sim-rel-action-realization-filter/DISCOVERY_CLAIM_DOSSIER_PROTOCOL.md"
      - ".github/workflows/sim-rel-047-discovery-claim-pr.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: prior-art scope, replication independence, bounded claim disposition, full tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-047-claim-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml -- --check
      - name: Focused discovery claim dossier tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib decision_value::discovery_claim_dossier
      - name: Full locked crate tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib -- -D warnings
      - name: Verify exact PR head and clean tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
