name: space-collider-reference

on:
  pull_request:
    paths:
      - ".github/workflows/space-collider-reference.yml"
      - "tools/space-collider-reference/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/space-collider-reference.yml"
      - "tools/space-collider-reference/**"

permissions:
  contents: read

jobs:
  reference:
    name: collider convention and orbital reference checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/space-collider-reference/Cargo.toml -- --check

      - name: Run unit tests
        run: cargo test --manifest-path tools/space-collider-reference/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/space-collider-reference/Cargo.toml --all-targets -- -D warnings

      - name: Execute reference report
        run: |
          cargo run --manifest-path tools/space-collider-reference/Cargo.toml --release \
            | tee space-collider-reference.json
          grep -q '"evidence_class": "analytical_reference_check"' space-collider-reference.json
          grep -q '"gamma_ratio_under_center_of_mass_convention": 71.428571' space-collider-reference.json
