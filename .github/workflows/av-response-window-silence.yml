name: AV Response Window and Correct Silence Fixture Integrity

on:
  push:
    branches:
      - research/av-response-window-silence-v0
    paths:
      - "research/av-response-window-silence-v0/**"
      - "tools/av-modality-necessity-evaluator/**"
      - ".github/workflows/av-response-window-silence.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/av-response-window-silence-v0/**"
      - "tools/av-modality-necessity-evaluator/**"
      - ".github/workflows/av-response-window-silence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: av-response-window-silence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fixture-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate workload, candidate and scorecard schemas
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          base = "research/av-response-window-silence-v0/"
          schemas = {}
          for name in ("workload-v1.schema.json", "submission-v1.schema.json", "scorecard-v1.schema.json"):
              value = json.load(open(base + "schemas/" + name, encoding="utf-8"))
              Draft202012Validator.check_schema(value)
              schemas[name] = value
          workload = json.load(open(base + "fixtures/agent/workload-v1.json", encoding="utf-8"))
          truth = json.load(open(base + "fixtures/evaluator-only/truth-v1.json", encoding="utf-8"))
          submission = json.load(open(base + "fixtures/agent/reference-submission-v1.json", encoding="utf-8"))
          expected = json.load(open(base + "fixtures/expected/known-answer-v1.json", encoding="utf-8"))
          Draft202012Validator(schemas["workload-v1.schema.json"]).validate(workload)
          Draft202012Validator(schemas["submission-v1.schema.json"]).validate(submission)
          ids = [x["episode_id"] for x in workload["episodes"]]
          assert len(ids) == len(set(ids)) == 12
          assert ids == [x["episode_id"] for x in truth["episodes"]]
          assert ids == [x["episode_id"] for x in submission["predictions"]]
          assert expected["expected_decision_count"] == sum(len(x["decisions"]) for x in truth["episodes"])
          assert expected["episode_count"] == len(ids)
          PY
      - name: Validate event order and hidden timing separation
        run: |
          python - <<'PY'
          import json
          workload = json.load(open("research/av-response-window-silence-v0/fixtures/agent/workload-v1.json", encoding="utf-8"))
          for episode in workload["episodes"]:
              ticks = [event["tick"] for event in episode["stream_events"]]
              assert ticks == sorted(ticks), episode["episode_id"]
              assert all(0 <= tick <= episode["duration_ticks"] for tick in ticks), episode["episode_id"]
          forbidden = {"expected_action", "window_start_tick", "window_end_tick", "silence_windows", "max_ack_latency_ticks"}
          def inspect(value):
              if isinstance(value, dict):
                  assert not (forbidden & set(value)), "evaluator timing truth leaked into agent workload"
                  for child in value.values(): inspect(child)
              elif isinstance(value, list):
                  for child in value: inspect(child)
          inspect(workload)
          PY
      - name: Run response-window evaluator tests
        run: python -m unittest discover -s tools/av-modality-necessity-evaluator -p "test_evaluate_response_windows.py" -v
      - name: Score reference response-window submission
        env:
          SCORECARD_PATH: ${{ runner.temp }}/av-response-window-scorecard.json
        run: |
          python tools/av-modality-necessity-evaluator/evaluate_response_windows.py \
            --workload research/av-response-window-silence-v0/fixtures/agent/workload-v1.json \
            --truth research/av-response-window-silence-v0/fixtures/evaluator-only/truth-v1.json \
            --submission research/av-response-window-silence-v0/fixtures/agent/reference-submission-v1.json \
            --output "$SCORECARD_PATH"
      - name: Validate response-window scorecard
        env:
          SCORECARD_PATH: ${{ runner.temp }}/av-response-window-scorecard.json
        run: |
          python - <<'PY'
          import json, os
          from jsonschema import Draft202012Validator
          base = "research/av-response-window-silence-v0/"
          schema = json.load(open(base + "schemas/scorecard-v1.schema.json", encoding="utf-8"))
          actual = json.load(open(os.environ["SCORECARD_PATH"], encoding="utf-8"))
          expected = json.load(open(base + "fixtures/expected/reference-scorecard-v1.json", encoding="utf-8"))
          Draft202012Validator(schema).validate(actual)
          assert actual["totals"] == expected["totals"], (actual["totals"], expected["totals"])
          assert all(not episode["violations"] for episode in actual["per_episode"])
          PY