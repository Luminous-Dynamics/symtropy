name: EV battery scale-transfer audit v0.1

on:
  pull_request:
    paths:
      - "docs/transport/EV_BATTERY_SCALE_TRANSFER_V0_1.md"
      - "tools/ev-battery-scale-transfer-audit/**"
      - "schemas/transport/ev_battery_scale_transfer_v0_1.schema.json"
      - "fixtures/ev_battery/ev_battery_scale_transfer_v0_1.json"
      - ".github/workflows/ev-battery-scale-transfer-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check JSON syntax
        run: |
          python3 -c 'import json; json.load(open("schemas/transport/ev_battery_scale_transfer_v0_1.schema.json", encoding="utf-8")); json.load(open("fixtures/ev_battery/ev_battery_scale_transfer_v0_1.json", encoding="utf-8"))'
      - name: Check locked package metadata
        run: cargo metadata --manifest-path tools/ev-battery-scale-transfer-audit/Cargo.toml --locked --no-deps
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ev-battery-scale-transfer-audit/Cargo.toml -- --check
      - name: Run scale-lineage tests
        run: cargo test --manifest-path tools/ev-battery-scale-transfer-audit/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/ev-battery-scale-transfer-audit/Cargo.toml --all-targets --locked -- -D warnings
