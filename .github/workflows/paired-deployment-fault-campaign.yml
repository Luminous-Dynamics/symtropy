name: paired-deployment-fault-campaign

on:
  pull_request:
    paths:
      - "research/paired-deployment-fault-campaign-001/**"
      - ".github/workflows/paired-deployment-fault-campaign.yml"
  push:
    paths:
      - "research/paired-deployment-fault-campaign-001/**"
      - ".github/workflows/paired-deployment-fault-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Export canonical Rust 1.96 rustfmt output (format bootstrap)
        run: |
          files=(
            research/paired-deployment-fault-campaign-001/src/lib.rs
            research/paired-deployment-fault-campaign-001/src/main.rs
          )
          rustfmt --edition 2024 "${files[@]}"
          export_formatted() {
            name="$1"
            file="$2"
            echo "__FORMAT_EXPORT_BEGIN_${name}__"
            base64 -w0 "$file" | fold -w 4000
            echo "__FORMAT_EXPORT_END_${name}__"
          }
          export_formatted PAIRED_LIB "${files[0]}"
          export_formatted PAIRED_BIN "${files[1]}"
          cargo fmt --manifest-path research/paired-deployment-fault-campaign-001/Cargo.toml -- --check

      - name: Run paired campaign contract tests
        run: cargo test --locked --manifest-path research/paired-deployment-fault-campaign-001/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/paired-deployment-fault-campaign-001/Cargo.toml --all-targets --all-features -- -D warnings
