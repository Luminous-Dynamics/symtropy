name: AER-01 measurement operator contract

on:
  pull_request:
    paths:
      - ".github/workflows/aero-measurement-operator.yml"
      - "tools/civil-aero-benchmark/measurement-operator-contract/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-measurement-operators:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record Rust toolchain identity
        run: |
          rustc --version --verbose
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml -- --check

      - name: Run Rust contract and hostile tests
        run: cargo test --manifest-path tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml

      - name: Run Rust measurement-operator evaluator
        run: cargo run --quiet --manifest-path tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml > measurement-operator-result.json

      - name: Independently recompute compatibility in Python
        run: python3 tools/civil-aero-benchmark/measurement-operator-contract/verify_independent.py --rust-output measurement-operator-result.json

      - name: Create source and result SHA-256 receipts
        run: |
          sha256sum tools/civil-aero-benchmark/measurement-operator-contract/data/measurement-operator-fixture-v0.1.json > measurement-operator-source.sha256
          sha256sum measurement-operator-result.json > measurement-operator-result.sha256

      - name: Retain fixture, output and digest receipts
        uses: actions/upload-artifact@v4
        with:
          name: aero-measurement-operator-\${{ github.sha }}
          path: |
            tools/civil-aero-benchmark/measurement-operator-contract/data/measurement-operator-fixture-v0.1.json
            measurement-operator-result.json
            measurement-operator-source.sha256
            measurement-operator-result.sha256
          if-no-files-found: error
          retention-days: 90
