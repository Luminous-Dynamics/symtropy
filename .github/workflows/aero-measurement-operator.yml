name: AER-01 measurement operator contract

on:
  pull_request:
    paths:
      - ".github/workflows/aero-measurement-operator.yml"
      - "tools/civil-aero-benchmark/measurement-operator-contract/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-measurement-operators:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact subject revision
        env:
          EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_subject_sha="$(git rev-parse HEAD)"
          test "$actual_subject_sha" = "$EXPECTED_SUBJECT_SHA"
          printf 'subject_commit=%s\n' "$actual_subject_sha"
          printf 'event_commit=%s\n' "$GITHUB_SHA"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record toolchain and runner identity
        run: |
          {
            echo "rust-toolchain.toml:"
            cat rust-toolchain.toml
            echo
            rustc --version --verbose
            cargo --version
            python3 --version
            printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-unknown}"
            printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
            printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
            uname -a
          } | tee measurement-operator-environment.txt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml -- --check

      - name: Run Rust contract and hostile tests
        run: cargo test --locked --manifest-path tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml

      - name: Run Rust measurement-operator evaluator
        run: cargo run --locked --quiet --manifest-path tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml > measurement-operator-result.json

      - name: Independently recompute compatibility in Python
        run: python3 tools/civil-aero-benchmark/measurement-operator-contract/verify_independent.py --rust-output measurement-operator-result.json

      - name: Create exact source and result SHA-256 receipts
        run: |
          set -euo pipefail
          subject_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          workflow_blob=$(git rev-parse "${subject_sha}:.github/workflows/aero-measurement-operator.yml")
          printf 'subject_commit=%s\nevent_commit=%s\nworkflow_ref=%s\nworkflow_blob=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$subject_sha" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$workflow_blob" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > measurement-operator-run-manifest.txt
          sha256sum rust-toolchain.toml > measurement-operator-toolchain.sha256
          sha256sum tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml > measurement-operator-cargo-manifest.sha256
          sha256sum tools/civil-aero-benchmark/measurement-operator-contract/Cargo.lock > measurement-operator-cargo-lock.sha256
          sha256sum tools/civil-aero-benchmark/measurement-operator-contract/src/main.rs > measurement-operator-rust-source.sha256
          sha256sum tools/civil-aero-benchmark/measurement-operator-contract/verify_independent.py > measurement-operator-python-source.sha256
          sha256sum tools/civil-aero-benchmark/measurement-operator-contract/README.md > measurement-operator-readme.sha256
          sha256sum .github/workflows/aero-measurement-operator.yml > measurement-operator-workflow.sha256
          sha256sum tools/civil-aero-benchmark/measurement-operator-contract/data/measurement-operator-fixture-v0.1.json > measurement-operator-source.sha256
          sha256sum measurement-operator-environment.txt > measurement-operator-environment.sha256
          sha256sum measurement-operator-result.json > measurement-operator-result.sha256
          sha256sum measurement-operator-run-manifest.txt > measurement-operator-run-manifest.sha256

      - name: Retain complete source, output and digest receipts
        uses: actions/upload-artifact@v4
        with:
          name: aero-measurement-operator-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            rust-toolchain.toml
            .github/workflows/aero-measurement-operator.yml
            tools/civil-aero-benchmark/measurement-operator-contract/Cargo.toml
            tools/civil-aero-benchmark/measurement-operator-contract/Cargo.lock
            tools/civil-aero-benchmark/measurement-operator-contract/README.md
            tools/civil-aero-benchmark/measurement-operator-contract/src/main.rs
            tools/civil-aero-benchmark/measurement-operator-contract/verify_independent.py
            tools/civil-aero-benchmark/measurement-operator-contract/data/measurement-operator-fixture-v0.1.json
            measurement-operator-result.json
            measurement-operator-environment.txt
            measurement-operator-run-manifest.txt
            measurement-operator-toolchain.sha256
            measurement-operator-cargo-manifest.sha256
            measurement-operator-cargo-lock.sha256
            measurement-operator-rust-source.sha256
            measurement-operator-python-source.sha256
            measurement-operator-readme.sha256
            measurement-operator-workflow.sha256
            measurement-operator-source.sha256
            measurement-operator-environment.sha256
            measurement-operator-result.sha256
            measurement-operator-run-manifest.sha256
          if-no-files-found: error
          retention-days: 90
