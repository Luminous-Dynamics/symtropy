name: EGB Cartan-Lanczos replay

on:
  push:
    branches:
      - research/egb-single-spin-cartan-frame-2026-11-20
    paths:
      - crates/domains/symtropy-lovelock5d/benchmarks/derive_single_spin_nheg_cartan.py
      - crates/domains/symtropy-lovelock5d/benchmarks/single_spin_nheg_cartan_fixture_v1.json
      - .github/workflows/egb-cartan-replay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egb-cartan-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cartan-lanczos-exact:
    name: Cartan + Lanczos exact local field equations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned symbolic engine
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Replay coframe, connection, curvature and EGB equations
        env:
          PYTHONHASHSEED: "0"
        run: |
          python crates/domains/symtropy-lovelock5d/benchmarks/derive_single_spin_nheg_cartan.py \
            --output "$RUNNER_TEMP/single_spin_nheg_cartan_replay.json"

      - name: Enforce all component residuals and the wrong-index negative control
        env:
          REPLAY_JSON: ${{ runner.temp }}/single_spin_nheg_cartan_replay.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path(os.environ["REPLAY_JSON"]).read_text())
          residuals = data["gauss_bonnet"]["all_25_frame_residuals_after_exact_rationalization"]
          assert len(residuals) == 25, len(residuals)
          assert set(residuals) == {f"{a},{b}" for a in range(5) for b in range(5)}
          assert all(value == "0" for value in residuals.values()), residuals

          validation = data["validation"]
          for key in (
              "coframe_metric_reconstruction_exact",
              "torsion_free_exact",
              "metric_compatibility_exact",
              "cartan_d_squared_e_zero",
              "first_bianchi_D_Omega_zero",
              "cartan_kretschmann_matches_source_exactly",
              "all_25_EGB_frame_equations_exactly_zero",
              "single_eta_wrong_index_raising_negative_control_rejected",
              "full_EGB_field_equations_independently_replayed",
          ):
              assert validation[key] is True, (key, validation[key])

          wrong = validation["wrong_raising_residual_sample_alpha1_beta1over2_c1over2"]
          assert len(wrong) == 25
          assert sum(value != "0" for value in wrong.values()) == 4, wrong
          print("PASS: 25/25 correct EGB components are exactly zero.")
          print("PASS: single-eta index-raising mutation produces exactly four nonzero diagonals.")
          print("PASS: coframe, torsion, metric compatibility, Bianchi and Kretschmann gates.")
          PY

      - name: Preserve exact replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: egb-cartan-lanczos-exact-replay
          path: ${{ runner.temp }}/single_spin_nheg_cartan_replay.json
          if-no-files-found: error
          retention-days: 30
