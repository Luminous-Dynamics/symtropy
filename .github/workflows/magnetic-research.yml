name: Magnetic Research Qualification

on:
  pull_request:
    paths:
      - "research/magnetics/**"
      - ".github/workflows/magnetic-research.yml"

concurrency:
  group: magnetic-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  isolated-crates:
    name: Magnetic Research (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format — solver qualification
        if: ${{ hashFiles('research/magnetics/solver-qualification/Cargo.toml') != '' }}
        run: cargo fmt --manifest-path research/magnetics/solver-qualification/Cargo.toml -- --check

      - name: Clippy — solver qualification
        if: ${{ hashFiles('research/magnetics/solver-qualification/Cargo.toml') != '' }}
        run: cargo clippy --manifest-path research/magnetics/solver-qualification/Cargo.toml --all-targets -- -D warnings

      - name: Tests — solver qualification
        if: ${{ hashFiles('research/magnetics/solver-qualification/Cargo.toml') != '' }}
        run: cargo test --manifest-path research/magnetics/solver-qualification/Cargo.toml

      - name: Format — encoder function
        if: ${{ hashFiles('research/magnetics/encoder-function-benchmark/Cargo.toml') != '' }}
        run: cargo fmt --manifest-path research/magnetics/encoder-function-benchmark/Cargo.toml -- --check

      - name: Clippy — encoder function
        if: ${{ hashFiles('research/magnetics/encoder-function-benchmark/Cargo.toml') != '' }}
        run: cargo clippy --manifest-path research/magnetics/encoder-function-benchmark/Cargo.toml --all-targets -- -D warnings

      - name: Tests — encoder function
        if: ${{ hashFiles('research/magnetics/encoder-function-benchmark/Cargo.toml') != '' }}
        run: cargo test --manifest-path research/magnetics/encoder-function-benchmark/Cargo.toml

      - name: Format — digital quadrature
        if: ${{ hashFiles('research/magnetics/digital-quadrature/Cargo.toml') != '' }}
        run: cargo fmt --manifest-path research/magnetics/digital-quadrature/Cargo.toml -- --check

      - name: Clippy — digital quadrature
        if: ${{ hashFiles('research/magnetics/digital-quadrature/Cargo.toml') != '' }}
        run: cargo clippy --manifest-path research/magnetics/digital-quadrature/Cargo.toml --all-targets -- -D warnings

      - name: Tests — digital quadrature
        if: ${{ hashFiles('research/magnetics/digital-quadrature/Cargo.toml') != '' }}
        run: cargo test --manifest-path research/magnetics/digital-quadrature/Cargo.toml

      - name: Format — bounded phase assurance
        if: ${{ hashFiles('research/magnetics/bounded-phase-assurance/Cargo.toml') != '' }}
        run: cargo fmt --manifest-path research/magnetics/bounded-phase-assurance/Cargo.toml -- --check

      - name: Clippy — bounded phase assurance
