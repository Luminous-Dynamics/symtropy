name: CFI-Space scorer

on:
  pull_request:
    paths:
      - "tools/cfi-space-bench/**"
      - "schemas/cfi-space/**"
      - "research/spacecraft/cfi-space/**"
      - ".github/workflows/cfi-space-scorer.yml"
  push:
    branches:
      - main
    paths:
      - "tools/cfi-space-bench/**"
      - "schemas/cfi-space/**"
      - "research/spacecraft/cfi-space/**"
      - ".github/workflows/cfi-space-scorer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path tools/cfi-space-bench/Cargo.toml -- --check
      - name: Unit and adversarial tests
        run: cargo test --manifest-path tools/cfi-space-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --manifest-path tools/cfi-space-bench/Cargo.toml --all-targets -- -D warnings
      - name: Positive-control Rust scorer
        run: |
          cargo run --quiet --manifest-path tools/cfi-space-bench/Cargo.toml -- \
            --manifest research/spacecraft/cfi-space/fixtures/synthetic-candidate-manifest-v0.1.json \
            --ledger research/spacecraft/cfi-space/fixtures/synthetic-evaluator-ledger-v0.1.json \
            --predictions research/spacecraft/cfi-space/fixtures/synthetic-predictions-safe-v0.1.json \
            --expect-unsafe 0 --bundle-root . > "$RUNNER_TEMP/safe-rust.json"
      - name: Positive-control independent challenger
        run: |
          python3 scripts/cfi-space-challenger.py \
            --manifest research/spacecraft/cfi-space/fixtures/synthetic-candidate-manifest-v0.1.json \
            --ledger research/spacecraft/cfi-space/fixtures/synthetic-evaluator-ledger-v0.1.json \
            --predictions research/spacecraft/cfi-space/fixtures/synthetic-predictions-safe-v0.1.json \
            --expect-unsafe 0 --bundle-root . > "$RUNNER_TEMP/safe-python.json"
          diff -u "$RUNNER_TEMP/safe-rust.json" "$RUNNER_TEMP/safe-python.json"
      - name: Negative-control Rust scorer
        run: |
          cargo run --quiet --manifest-path tools/cfi-space-bench/Cargo.toml -- \
            --manifest research/spacecraft/cfi-space/fixtures/synthetic-candidate-manifest-v0.1.json \
            --ledger research/spacecraft/cfi-space/fixtures/synthetic-evaluator-ledger-v0.1.json \
            --predictions research/spacecraft/cfi-space/fixtures/synthetic-predictions-unsafe-v0.1.json \
            --expect-unsafe 1 --bundle-root . > "$RUNNER_TEMP/unsafe-rust.json"
      - name: Negative-control independent challenger
        run: |
          python3 scripts/cfi-space-challenger.py \
            --manifest research/spacecraft/cfi-space/fixtures/synthetic-candidate-manifest-v0.1.json \
            --ledger research/spacecraft/cfi-space/fixtures/synthetic-evaluator-ledger-v0.1.json \
            --predictions research/spacecraft/cfi-space/fixtures/synthetic-predictions-unsafe-v0.1.json \
            --expect-unsafe 1 --bundle-root . > "$RUNNER_TEMP/unsafe-python.json"
          diff -u "$RUNNER_TEMP/unsafe-rust.json" "$RUNNER_TEMP/unsafe-python.json"
