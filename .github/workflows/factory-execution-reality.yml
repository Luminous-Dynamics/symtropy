name: Factory Execution Reality

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/factory-execution-reality/**"
      - ".github/workflows/factory-execution-reality.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/factory-execution-reality/**"
      - ".github/workflows/factory-execution-reality.yml"

concurrency:
  group: factory-execution-reality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observation-coverage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path tools/factory-execution-reality/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/factory-execution-reality/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/factory-execution-reality/Cargo.toml --all-targets
      - name: Deterministic coverage and chronology replay
        run: cargo run --quiet --manifest-path tools/factory-execution-reality/Cargo.toml --bin factory-execution-reality > /tmp/factory-execution-reality.tsv
      - name: Verify scenario coverage and future controls
        shell: bash
        run: |
          test "$(wc -l < /tmp/factory-execution-reality.tsv)" -eq 13
          test "$(grep -c $'\ttrue\ttrue\t-$' /tmp/factory-execution-reality.tsv)" -ge 2
