name: Ocean Observation Allocation Benchmark

on:
  push:
    branches: ["feat/ocean-observation-allocation-001"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/tech/OCEAN_OBSERVATION_ALLOCATION_BENCHMARK_V0_1.md"
      - "docs/tech/OCEAN_OBSERVATION_ALLOCATION_CORPUS_V0_1.json"
      - "tools/ocean-observation-allocation-bench/**"
      - ".github/workflows/ocean-observation-allocation-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/tech/OCEAN_OBSERVATION_ALLOCATION_BENCHMARK_V0_1.md"
      - "docs/tech/OCEAN_OBSERVATION_ALLOCATION_CORPUS_V0_1.json"
      - "tools/ocean-observation-allocation-bench/**"
      - ".github/workflows/ocean-observation-allocation-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocean-observation-allocation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-synthetic-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting for the focused tool
        run: cargo fmt --manifest-path tools/ocean-observation-allocation-bench/Cargo.toml --check
      - name: Run focused unit tests
        run: cargo test -p ocean-observation-allocation-bench --locked
      - name: Verify frozen corpus and emit receipt
        env:
          OCEAN_ALLOCATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo run --quiet -p ocean-observation-allocation-bench --locked -- \
            --corpus docs/tech/OCEAN_OBSERVATION_ALLOCATION_CORPUS_V0_1.json \
            --receipt "${RUNNER_TEMP}/ocean-observation-allocation-receipt.json"
          test -s "${RUNNER_TEMP}/ocean-observation-allocation-receipt.json"
      - name: Upload machine-readable receipt
        uses: actions/upload-artifact@v4
        with:
          name: ocean-observation-allocation-receipt
          path: ${{ runner.temp }}/ocean-observation-allocation-receipt.json
          if-no-files-found: error
          retention-days: 14
