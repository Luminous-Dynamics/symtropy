name: ORS kinetic-energy control-volume reference

on:
  pull_request:
    paths:
      - ".github/workflows/ors-kinetic-energy-control-volume-reference.yml"
      - "tools/ors-kinetic-energy-control-volume-reference/**"
      - "docs/tech/ORS_KINETIC_ENERGY_CONTROL_VOLUME_REFERENCE_V0_1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ors-kinetic-energy-control-volume-reference.yml"
      - "tools/ors-kinetic-energy-control-volume-reference/**"
      - "docs/tech/ORS_KINETIC_ENERGY_CONTROL_VOLUME_REFERENCE_V0_1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/ors-kinetic-energy-control-volume-reference/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/ors-kinetic-energy-control-volume-reference/Cargo.toml --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/ors-kinetic-energy-control-volume-reference/Cargo.toml --locked --all-targets
      - name: Emit and compare deterministic receipts
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cases="tools/ors-kinetic-energy-control-volume-reference/cases-v0.1.csv"
          ports="tools/ors-kinetic-energy-control-volume-reference/ports-v0.1.csv"
          cases_sha="$(sha256sum "$cases" | awk '{print $1}')"
          ports_sha="$(sha256sum "$ports" | awk '{print $1}')"
          cargo run --quiet --manifest-path tools/ors-kinetic-energy-control-volume-reference/Cargo.toml --locked -- \
            --source-commit "$source_commit" --cases-sha256 "$cases_sha" --ports-sha256 "$ports_sha" > kinetic-energy-cv-a.json
          cargo run --quiet --manifest-path tools/ors-kinetic-energy-control-volume-reference/Cargo.toml --locked -- \
            --source-commit "$source_commit" --cases-sha256 "$cases_sha" --ports-sha256 "$ports_sha" > kinetic-energy-cv-b.json
          cmp kinetic-energy-cv-a.json kinetic-energy-cv-b.json
          jq -e '
            .result == "pass"
            and .case_count == 6
            and .port_count == 14
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.cases_corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.ports_corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.max_abs_mass_balance_residual_kg_s <= 1.0e-12)
            and (.max_abs_power_balance_residual_w <= 1.0e-9)
            and (.cases | length == 6)
            and all(.cases[]; .frame_id == "INERTIAL_SYNTHETIC")
            and all(.cases[]; .boundary_id == "CV0")
            and all(.cases[]; .epoch_s == 0)
          ' kinetic-energy-cv-a.json
          sha256sum "$cases" "$ports" kinetic-energy-cv-a.json
      - name: Upload exact outputs
        uses: actions/upload-artifact@v4
        with:
          name: ors-kinetic-energy-control-volume-receipts
          path: |
            kinetic-energy-cv-a.json
            kinetic-energy-cv-b.json
