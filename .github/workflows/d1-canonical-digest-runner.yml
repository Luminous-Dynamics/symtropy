name: D1 Canonical Design Digest Runner

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: d1-canonical-design-digest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Apply and prove explicit D1 digest protocol
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/symtropy-d1-canonical-target
    steps:
      - name: Check out exact D1 product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: design/d1-content-bound-design-revisions-v0.1
          path: product
          fetch-depth: 0

      - name: Check out exact qualifier tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "9098b501a0b61a163aed031b351228ddf2c39bcf"
          test "$(git -C runner-tools rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"
          echo "D1_PARENT_HEAD=$(git -C product rev-parse HEAD)"
          echo "D1_PARENT_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "D1_QUALIFIER_HEAD=$(git -C runner-tools rev-parse HEAD)"
          echo "D1_TRANSFORM_BLOB=$(git -C runner-tools hash-object .github/repair/d1_canonical_design_digest.py)"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "IMAGE_OS=${ImageOS:-unknown}"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Bind exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version

      - name: Apply canonical D1 digest transformation
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/d1_canonical_design_digest.py
          cargo fmt -p symtropy-design

      - name: Prove exact source scope and protocol shape
        shell: bash
        run: |
          set -euo pipefail
          cd product
          actual="$(git diff --name-only)"
          test "${actual}" = "crates/domains/symtropy-design/src/lib.rs"
          grep -q 'pub const DESIGN_REVISION_SCHEMA_VERSION: u32 = 1' crates/domains/symtropy-design/src/lib.rs
          grep -q 'fn canonical_preimage' crates/domains/symtropy-design/src/lib.rs
          grep -q 'fn encode_len' crates/domains/symtropy-design/src/lib.rs
          grep -q 'fn encode_digest' crates/domains/symtropy-design/src/lib.rs
          grep -q '3754b633817fd02c8d731793a8f5b76debd8e3c0791f01f77782c1f216ff4045' crates/domains/symtropy-design/src/lib.rs
          if grep -q 'serde_json::to_vec(self)' crates/domains/symtropy-design/src/lib.rs; then
            echo "::error::D1 revision identity still depends on ordinary JSON serialization"
            exit 1
          fi

      - name: Prove locked D1 crate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-design -- --check
          cargo check --locked -p symtropy-design --all-targets
          cargo test --locked -p symtropy-design
          cargo clippy --locked -p symtropy-design --all-targets -- -D warnings

      - name: Prove dependency and manifest state fixed
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git diff --exit-code -- Cargo.lock Cargo.toml crates/domains/symtropy-design/Cargo.toml rust-toolchain.toml
          status="$(git status --porcelain=v1 --untracked-files=all)"
          expected=' M crates/domains/symtropy-design/src/lib.rs'
          test "${status}" = "${expected}"

      - name: Commit exact D1 semantic source
        shell: bash
        run: |
          set -euo pipefail
          cd product
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/domains/symtropy-design/src/lib.rs
          test "$(git diff --cached --name-only)" = "crates/domains/symtropy-design/src/lib.rs"
          test -z "$(git diff --name-only)"
          git commit -m "fix(design): freeze canonical revision digest protocol"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "D1_PRODUCT_HEAD=$(git rev-parse HEAD)"
          echo "D1_PRODUCT_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse branch race and push exact qualified D1 head
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin refs/heads/design/d1-content-bound-design-revisions-v0.1 | awk '{print $1}')"
          test "${remote_head}" = "9098b501a0b61a163aed031b351228ddf2c39bcf"
          git push origin HEAD:design/d1-content-bound-design-revisions-v0.1
