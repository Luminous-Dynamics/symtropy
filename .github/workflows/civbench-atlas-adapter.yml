name: CivBench Humanity Atlas adapter

on:
  pull_request:
    paths:
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/adapt_civbench_output.py"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/test_adapt_civbench_output.py"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/fixtures/civbench-test-model.rs"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/schemas/run-v0.1.schema.json"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/schemas/scenario-v0.1.schema.json"
      - ".github/workflows/civbench-atlas-adapter.yml"
  push:
    paths:
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/adapt_civbench_output.py"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/test_adapt_civbench_output.py"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/fixtures/civbench-test-model.rs"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/schemas/run-v0.1.schema.json"
      - "docs/ops/humanity_atlas_scenario_contract_v0_1/schemas/scenario-v0.1.schema.json"
      - ".github/workflows/civbench-atlas-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civbench-atlas-adapter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate domain CSV to run-v0.1 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Parse and check both Humanity Atlas schemas
        run: |
          python -m json.tool docs/ops/humanity_atlas_scenario_contract_v0_1/schemas/scenario-v0.1.schema.json > /dev/null
          python -m json.tool docs/ops/humanity_atlas_scenario_contract_v0_1/schemas/run-v0.1.schema.json > /dev/null

      - name: Compile adapter and regression tests
        run: |
          python -m py_compile \
            docs/ops/humanity_atlas_scenario_contract_v0_1/adapt_civbench_output.py \
            docs/ops/humanity_atlas_scenario_contract_v0_1/test_adapt_civbench_output.py

      - name: Run fail-closed CSV, digest, replay and schema tests
        env:
          PYTHONPATH: docs/ops/humanity_atlas_scenario_contract_v0_1
        run: |
          python -m unittest discover \
            -s docs/ops/humanity_atlas_scenario_contract_v0_1 \
            -p 'test_adapt_civbench_output.py' -v
