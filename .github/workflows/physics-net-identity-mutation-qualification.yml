name: PHYS-ID-01A Net Identity Mutation Qualification

on:
  push:
    branches:
      - "ci/physics-net-identity-mutation-v0.1"

permissions:
  contents: read

concurrency:
  group: physics-net-identity-mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 45f13cbac714ffff974d7e06b7fedb88241a35e1
  PHYS_ID00_PARENT: 53af0682fb2d768bc8ca18d78d41b92704c4d567

jobs:
  qualify:
    name: Frozen PHYS-ID-01A / Rust 1.96
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact frozen product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 0

      - name: Assert exact subject ancestry and delta
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git merge-base --is-ancestor "${PHYS_ID00_PARENT}" "${PRODUCT_HEAD}"
          count="$(git rev-list --count "${PHYS_ID00_PARENT}..${PRODUCT_HEAD}")"
          echo "phys_id01a_commits_above_parent=${count}"
          test "${count}" = "7"
          mapfile -t changed < <(git diff --name-only "${PHYS_ID00_PARENT}..${PRODUCT_HEAD}" | sort)
          expected=(
            "crates/core/symtropy-physics/PHYSICAL_NET_IDENTITY_MUTATION_V01.md"
            "crates/core/symtropy-physics/src/identity_mutation.rs"
            "crates/core/symtropy-physics/src/lib.rs"
            "crates/core/symtropy-physics/tests/net_identity_mutation_v01.rs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" = "${#expected_sorted[@]}"
          for i in "${!changed[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Freeze source identities
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            crates/core/symtropy-physics/src/identity_mutation.rs \
            crates/core/symtropy-physics/src/identity_authority.rs \
            crates/core/symtropy-physics/src/lib.rs \
            crates/core/symtropy-physics/src/body.rs \
            crates/core/symtropy-physics/src/world.rs \
            crates/core/symtropy-physics/tests/net_identity_mutation_v01.rs \
            crates/core/symtropy-physics/tests/world_identity_authority_v01.rs \
            crates/core/symtropy-physics/PHYSICAL_NET_IDENTITY_MUTATION_V01.md \
            crates/core/symtropy-physics/PHYSICAL_WORLD_IDENTITY_V01.md \
            > "${RUNNER_TEMP}/phys-id01a-source-sha256.txt"
          cat "${RUNNER_TEMP}/phys-id01a-source-sha256.txt"

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check

      - name: Check symtropy-physics all targets
        id: check
        run: cargo check -p symtropy-physics --locked --all-targets

      - name: Run PHYS-ID-01A public mutation corpus
        id: mutation
        run: cargo test -p symtropy-physics --locked --test net_identity_mutation_v01

      - name: Run PHYS-ID-00 prerequisite corpus
        id: identity
        run: cargo test -p symtropy-physics --locked --test world_identity_authority_v01

      - name: Run complete symtropy-physics library regression
        id: physics_tests
        run: cargo test -p symtropy-physics --locked --lib

      - name: Run strict symtropy-physics Clippy
        id: clippy
        run: cargo clippy -p symtropy-physics --locked --all-targets --all-features -- -D warnings

      - name: Audit PHYS-ID-01A mutation boundary
        id: authority_audit
        shell: bash
        run: |
          set -euo pipefail
          source=crates/core/symtropy-physics/src/identity_mutation.rs
          contract=crates/core/symtropy-physics/PHYSICAL_NET_IDENTITY_MUTATION_V01.md

          grep -Fq 'pub fn assign_net_id_checked' "${source}"
          grep -Fq 'pub fn add_bodies_deterministic_checked' "${source}"
          grep -Fq 'IdentityReassignmentForbidden' "${source}"
          grep -Fq 'None -> NetId(N)' "${contract}"
          grep -Fq 'NetId(N) -> M' "${contract}"
          grep -Fq 'does **not** yet seal' "${contract}"

          test "$(grep -Fc 'world.set_net_id(handle, net_id);' "${source}")" = "1"
          test "$(grep -Fc '.add_bodies_deterministic(bodies)' "${source}")" = "1"

          if grep -Eq '\.net_id\s*=' "${source}"; then
            echo 'checked mutation coordinator directly writes body.net_id' >&2
            exit 1
          fi
          if grep -Eq '\.bodies\.(push|insert|remove|swap_remove|clear)' "${source}"; then
            echo 'checked mutation coordinator directly mutates world body vector' >&2
            exit 1
          fi
          if grep -Eq '\b(route|arrival|eta|distance|speed|travel)_?[A-Za-z0-9_]*\s*:' "${source}"; then
            echo 'PHYS-ID-01A introduced route/motion state' >&2
            exit 1
          fi
          if git diff --name-only "${PHYS_ID00_PARENT}..${PRODUCT_HEAD}" | grep -q '^crates/core/symtropy-core/'; then
            echo 'PHYS-ID-01A unexpectedly edits ECON product code' >&2
            exit 1
          fi

      - name: Assert unchanged frozen subject
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
          git diff --exit-code -- . ':!Cargo.lock'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit qualification receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SUBJECT: ${{ steps.subject.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          MUTATION: ${{ steps.mutation.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          PHYSICS_TESTS: ${{ steps.physics_tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          AUDIT: ${{ steps.authority_audit.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/phys-id01a-net-identity-mutation-v01.json"
          export RECEIPT_PATH="${receipt}"
          python3 - <<'PY'
          import json, os, subprocess
          keys = ["SUBJECT","SOURCE","FMT","CHECK","MUTATION","IDENTITY","PHYSICS_TESTS","CLIPPY","AUDIT","POSTFLIGHT"]
          outcomes = {k.lower(): os.environ.get(k, "unknown") for k in keys}
          def version(cmd):
              try: return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
              except Exception: return "unavailable"
          receipt = {
              "receipt_version": 1,
              "qualification": "PHYS-ID-01A-net-identity-mutation-v0.1",
              "product_head": os.environ["PRODUCT_HEAD"],
              "phys_id00_parent": os.environ["PHYS_ID00_PARENT"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "rustc_version": version(["rustc", "--version"]),
              "cargo_version": version(["cargo", "--version"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "checked bind-once NetId mutation and whole-batch duplicate preflight with typed expected failures occurring before legacy mutation; legacy direct mutation surfaces remain outside the claim",
          }
          with open(os.environ["RECEIPT_PATH"], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          cp "${RUNNER_TEMP}/phys-id01a-source-sha256.txt" "${RUNNER_TEMP}/phys-id01a-source-sha256-evidence.txt" || true
          sha256sum "${receipt}" > "${receipt}.sha256"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phys-id01a-net-identity-mutation-v01-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/phys-id01a-net-identity-mutation-v01.json
            ${{ runner.temp }}/phys-id01a-net-identity-mutation-v01.json.sha256
            ${{ runner.temp }}/phys-id01a-source-sha256-evidence.txt
          if-no-files-found: error
          retention-days: 90
