name: Scan-to-BIM Replay Contract

on:
  pull_request:
    branches: ["main", "research/scan-bim-admission-v0-1", "research/scan-bim-replay-p0-v0-2", "research/scan-bim-execution-receipt-v0-2", "research/scan-bim-representation-continuity-v0-1"]
    paths:
      - "tools/scan-bim-replay-contract/**"
      - "research/scan-bim-ifc-delivery-001/**"
      - "research/scan-bim-representation-continuity-001/**"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_REPLAY_CONTRACT_V0_2.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_REPLAY_CONTRACT_V0_3.md"
      - "docs/research/built-asset/scan-bim/ERSOZ_BOSCHE_MATCHING_CONFIDENCE_BASELINE_AUDIT_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_2026_FRONTIER_COMPARATOR_MATRIX_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_PARADIGM_SHIFT_AND_BENCHMARK_TARGETS_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_CANDIDATE_EVALUATOR_ISOLATION_THREAT_MODEL_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_EXECUTION_RECEIPT_AND_BENCHMARK_TARGETS_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_BUILD_ATTESTATION_AND_EXECUTION_RECEIPT_V0_1.md"
  push:
    branches: ["main", "research/scan-bim-admission-v0-1", "research/scan-bim-replay-p0-v0-2", "research/scan-bim-execution-receipt-v0-2", "research/scan-bim-representation-continuity-v0-1"]
    paths:
      - "tools/scan-bim-replay-contract/**"
      - "research/scan-bim-ifc-delivery-001/**"
      - "research/scan-bim-representation-continuity-001/**"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_REPLAY_CONTRACT_V0_2.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_REPLAY_CONTRACT_V0_3.md"
      - "docs/research/built-asset/scan-bim/ERSOZ_BOSCHE_MATCHING_CONFIDENCE_BASELINE_AUDIT_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_2026_FRONTIER_COMPARATOR_MATRIX_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_PARADIGM_SHIFT_AND_BENCHMARK_TARGETS_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_CANDIDATE_EVALUATOR_ISOLATION_THREAT_MODEL_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_EXECUTION_RECEIPT_AND_BENCHMARK_TARGETS_V0_1.md"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_BUILD_ATTESTATION_AND_EXECUTION_RECEIPT_V0_1.md"

permissions:
  contents: read

concurrency:
  group: scan-bim-replay-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-contract:
    name: Replay contract (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/scan-bim-replay-contract/Cargo.toml -- --check
      - name: Run contract tests
        run: cargo test --locked --manifest-path tools/scan-bim-replay-contract/Cargo.toml
      - name: Check IFC delivery schema and fixture JSON
        run: |
          jq -e '
            (.schema_version == "0.1") and
            ((.properties.required_gate_ids.const | length) == 9) and
            (.properties.gates.minItems == 9) and
            (.properties.gates.maxItems == 9) and
            (.properties.crosswalk.items.properties.ifc_global_id.pattern == "^[0-3][0-9A-Za-z_$]{21}$")
          ' research/scan-bim-ifc-delivery-001/schema/delivery-receipt.schema.json
          jq -e '
            (.fixture_version == "0.1") and
            ((.cases | map(.case_id) | unique | length) == 5) and
            (([.cases[] | select(.case_id != "missing_required_gate" and (.report.gates | length) != 9)] | length) == 0) and
            ((.cases[] | select(.case_id == "missing_required_gate") | .report.gates | length) == 8)
          ' research/scan-bim-ifc-delivery-001/fixtures/known_answers_v0_1.json
      - name: Check representation-continuity fixture contract
        run: |
          jq -e '
            (.fixture_version == "0.1") and
            (.fixture_id == "SCAN-BIM-CONTINUITY-KA-001") and
            (.canonical_receipt.schema_version == "0.1") and
            ((.canonical_receipt.transitions | length) == 1) and
            (.canonical_receipt.transitions[0].from_representation == "raw_observations") and
            (.canonical_receipt.transitions[0].to_representation == "surface_mesh") and
            (.canonical_receipt.transitions[0].claims[0].origin == "measured") and
            (.canonical_receipt.transitions[0].uncertainty.update_basis == "representation_only") and
            (.canonical_receipt.transitions[0].uncertainty.before.absolute_bound_m == 0.002) and
            (.canonical_receipt.transitions[0].uncertainty.after.absolute_bound_m == 0.0025) and
            (.canonical_receipt.transitions[0].uncertainty.approximation_error_bound_m == 0.0005)
          ' research/scan-bim-representation-continuity-001/fixtures/known_answers_v0_1.json
      - name: Execute representation continuity audit
        run: |
          cargo run --locked --manifest-path tools/scan-bim-replay-contract/Cargo.toml \
            --bin scan_bim_continuity_audit -- \
            research/scan-bim-representation-continuity-001/fixtures/known_answers_v0_1.json \
            > /tmp/scan-bim-continuity-report.json
          jq -e '
            (.schema_version == "0.1") and
            (.receipt_id == "SCAN-BIM-CONTINUITY-ROOM-A-001") and
            (.scene_id == "ROOM-A") and
            (.transition_count == 1) and
            (.claim_count == 1) and
            (.measured_claim_count == 1) and
            (.correspondence_event_count == 1) and
            (.unresolved_correspondence_count == 0) and
            (.continuity_state == "continuity_preserved")
          ' /tmp/scan-bim-continuity-report.json
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/scan-bim-replay-contract/Cargo.toml --all-targets -- -D warnings
      - name: Audit synthetic fixture
        run: |
          cargo run --locked --manifest-path tools/scan-bim-replay-contract/Cargo.toml -- \
            --manifest tools/scan-bim-replay-contract/fixtures/synthetic-observability.json \
            --candidate-root tools/scan-bim-replay-contract/fixtures/data/candidate \
            --evaluator-root tools/scan-bim-replay-contract/fixtures/data/evaluator \
            > /tmp/scan-bim-replay-report.json
          jq -e '
            (.metadata_audit.schema_version == "0.3") and
            (.metadata_audit.scene_count == 2) and
            (.metadata_audit.pipeline_id == "synthetic-scan-bim-candidate-v0.2") and
            (.metadata_audit.source_commit_sha == "1111111111111111111111111111111111111111") and
            (.metadata_audit.candidate_artifact_count == 13) and
            (.metadata_audit.evaluator_artifact_count == 2) and
            (.artifact_verification.candidate_verified == 13) and
            (.artifact_verification.candidate_runtime_verified == 3) and
            (.artifact_verification.candidate_input_verified == 4) and
            (.artifact_verification.candidate_output_verified == 6) and
            (.artifact_verification.evaluator_verified == 2) and
            (.metadata_audit.metric_suite_id == "luminous_synthetic_contract_metrics") and
            (.metadata_audit.metric_definition_authority == "project_defined") and
            (.metadata_audit.metric_accuracy_direction == "reference_to_candidate") and
            (.metadata_audit.metric_accuracy_sample_strategy == "reference_surface_samples") and
            (.metadata_audit.scenes[0].coordinate_frame_id == "BUILDING-A-LOCAL") and
            (.metadata_audit.scenes[0].transform_artifact_id == "ROOM-A-TRANSFORM") and
            (.metadata_audit.scenes[0].linear_unit_to_metre_factor == 1.0) and
            (.metadata_audit.candidate_outputs[0].artifact_id == "ROOM-A-IFC") and
            (.metadata_audit.candidate_outputs[0].sha256 == "1388812a1750215452fc4dea388e113d754231c3bd9e9ff4932917da6cef3698") and
            (.metadata_audit.requirement_revision == "synthetic-requirements-v0.2") and
            (.metadata_audit.tolerance_decision_policy == "report_only") and
            (.metadata_audit.tolerance_uncertainty_model_id == null) and
            (.metadata_audit.normalization_mode == "partial_input_only") and
            (.metadata_audit.scenes[0].theoretically_visible_area_m2 == 10.0) and
            (.metadata_audit.scenes[0].captured_visible_area_m2 == 8.0) and
            (.metadata_audit.scenes[0].not_captured_visible_area_m2 == 2.0) and
            (.metadata_audit.scenes[0].self_occluded_area_m2 == 4.0) and
            (.metadata_audit.scenes[0].externally_occluded_area_m2 == 3.0) and
            (.metadata_audit.claim_ceiling | startswith("METADATA_LOCAL_ARTIFACT_INTEGRITY_AND_VISIBILITY_ACCOUNTING_ONLY"))
          ' /tmp/scan-bim-replay-report.json
