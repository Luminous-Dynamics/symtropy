name: Thermo Boundary Adapter V1

on:
  push:
    branches:
      - feat/thermo-boundary-ledger-adapter-v1
  pull_request:
    branches: [main, research/thermo-ledger-reference-v1]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/thermo-boundary-adapter-v1.yml'
      - 'Cargo.lock'
      - 'crates/domains/symtropy-consciousness-physics/Cargo.toml'
      - 'crates/domains/symtropy-consciousness-physics/src/lib.rs'
      - 'crates/domains/symtropy-consciousness-physics/src/energy_boundary_accounting.rs'
      - 'crates/domains/symtropy-consciousness-physics/src/thermodynamics.rs'
      - 'crates/domains/symtropy-consciousness-physics/tests/thermo_ledger_reference_v1.rs'
      - 'crates/domains/symtropy-consciousness-physics/tests/data/thermo-ledger-reference-v1.json'
      - 'docs/research/THERMO_BOUNDARY_ADAPTER_V1_2026-10.md'

permissions:
  contents: read

concurrency:
  group: thermo-boundary-adapter-v1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/symtropy-thermo-boundary-${{ github.run_id }}-${{ github.run_attempt }}
  QUALIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head:
    name: Exact-head boundary accounting contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert tested commit and clean source tree
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master @ 2025-08-23
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Assert toolchain identity
        run: |
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
          rustfmt +1.96.0 --version
          cargo +1.96.0 --version

      - name: Check crate formatting
        run: cargo +1.96.0 fmt --manifest-path crates/domains/symtropy-consciousness-physics/Cargo.toml -- --check

      - name: Validate locked package metadata
        run: cargo +1.96.0 metadata --manifest-path crates/domains/symtropy-consciousness-physics/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      - name: Run frozen parent boundary-reference corpus
        run: cargo +1.96.0 test --manifest-path crates/domains/symtropy-consciousness-physics/Cargo.toml --locked --test thermo_ledger_reference_v1

      - name: Run crate unit tests including additive adapter
        run: cargo +1.96.0 test --manifest-path crates/domains/symtropy-consciousness-physics/Cargo.toml --locked --lib

      - name: Verify clean postflight and emit evidence
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          postflight_status="$(git status --porcelain=v1 -uall)"
          if [ -n "$postflight_status" ]; then
            echo "Unexpected repository changes after verification:"
            printf '%s\\n' "$postflight_status"
            exit 1
          fi
          {
            echo "profile=EnergyBoundaryAccountingV1"
            echo "status=exact-head-qualification-passed"
            echo "qualified_sha=$QUALIFIED_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "rust=$(rustc +1.96.0 --version)"
            echo "rust_commit=$(rustc +1.96.0 --version --verbose | sed -n 's/^commit-hash: //p')"
            echo "cargo=$(cargo +1.96.0 --version)"
            echo "rustfmt=$(rustfmt +1.96.0 --version)"
            echo "adapter_blob=$(git hash-object crates/domains/symtropy-consciousness-physics/src/energy_boundary_accounting.rs)"
            echo "legacy_ledger_blob=$(git hash-object crates/domains/symtropy-consciousness-physics/src/thermodynamics.rs)"
            echo "crate_lib_blob=$(git hash-object crates/domains/symtropy-consciousness-physics/src/lib.rs)"
            echo "fixture_blob=$(git hash-object crates/domains/symtropy-consciousness-physics/tests/data/thermo-ledger-reference-v1.json)"
            echo "production_correspondence=NOT_ESTABLISHED"
            echo "physical_conservation=NOT_ESTABLISHED"
            echo "postflight=clean"
          } >> "$GITHUB_STEP_SUMMARY"
