name: EV Passenger Cost Frontier
on:
  pull_request:
    paths:
      - "tools/ev-passenger-cost-frontier/**"
      - "docs/research/EV_PASSENGER_COST_FEASIBILITY_V0_1.md"
      - "docs/research/EV_LOCALIZATION_AND_LIFETIME_BENCHMARKS_V0_1.md"
      - "docs/research/EV_CARRIER_LIFECYCLE_AND_SERVICEABILITY_V0_1.md"
      - "docs/research/BATTERY_SERVICE_NETWORK_BENCHMARK_V0_1.md"
      - ".github/workflows/ev-passenger-cost-frontier.yml"
  push:
    branches: [main]
    paths:
      - "tools/ev-passenger-cost-frontier/**"
      - "docs/research/EV_PASSENGER_COST_FEASIBILITY_V0_1.md"
      - "docs/research/EV_LOCALIZATION_AND_LIFETIME_BENCHMARKS_V0_1.md"
      - "docs/research/EV_CARRIER_LIFECYCLE_AND_SERVICEABILITY_V0_1.md"
      - "docs/research/BATTERY_SERVICE_NETWORK_BENCHMARK_V0_1.md"
      - ".github/workflows/ev-passenger-cost-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Parse strict schema and fixture as JSON
        run: |
          jq empty tools/ev-passenger-cost-frontier/schemas/ev_passenger_cost_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/ev_carrier_module_processes_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_carrier_module_processes_v0_1.json
          jq -e '
            .benchmark_id == "EV-PUBLIC-COMPONENT-BENCHMARKS-001"
            and .observed_as_of == "2026-10-20"
            and (.sources | length) == 13
            and .derived_checks.global_bev_pack_reference_42kwh_ZAR > 68000
            and .derived_checks.global_bev_pack_reference_42kwh_ZAR < 69000
            and .derived_checks.current_synthetic_42kwh_cost_first_pack_low_ZAR == 60800
            and .derived_checks.current_synthetic_42kwh_cost_first_pack_high_ZAR == 80300
            and (.sources | any(.id == "south-africa-local-manufacturing-policy-announcement"))
            and .scenario_calculations_from_synthetic_cost_fixture.fixed_program_amortization_ZAR_per_vehicle[0].designs.cost_first.low == 150000
            and .scenario_calculations_from_synthetic_cost_fixture.fixed_program_amortization_ZAR_per_vehicle[3].designs.cost_first.high == 2500
            and (.scenario_calculations_from_synthetic_cost_fixture.cost_frontier_at_current_fixture_amortization_50000_units | length) == 4
          ' tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json
      - name: Format check
        run: cargo fmt --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml
      - name: Emit deterministic reference report
        run: |
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev-passenger-cost-frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json \
            > ev-passenger-cost-report.json
          jq -e '
            .benchmark_id == "EV-PASSENGER-COST-001"
            and .baseline_observed_retail_price == 341900
            and .retail_price_ceiling == 307710
            and (.results | length) == 4
            and all(.results[]; .declared_mission_fit == true)
            and all(.results[]; .cost_inputs_release_grade == false)
            and all(.results[]; .release_disposition == "needs_evidence")
            and all(.results[]; .economics_result == "range_crosses_target_ceiling")
          ' ev-passenger-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_localization_frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json \
            > ev-localization-cost-report.json
          jq -e '
            .benchmark_id == "EV-LOCALIZATION-001"
            and .result_count == 16
            and all(.results[]; .economics_evidence_status == "needs_evidence")
          ' ev-localization-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json \
            > ev-factory-design-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-DESIGN-001"
            and .base_currency == "USD"
            and .scenario_count == 36
            and all(.results[]; .target_good_vehicles_per_year > 0)
            and all(.results[]; .bottleneck_good_capacity_per_year >= .target_good_vehicles_per_year)
            and all(.results[]; .building_area_sqm > 0)
            and all(.results[]; .total_installed_capex_usd > 0)
            and all(.results[]; .annual_useful_thermal_energy_cost_usd >= 0)
            and all(.results[] | select(.strategy == "integrated_flexible"); .annual_useful_thermal_energy_cost_usd > 0)
            and all(.results[] | select(.strategy != "integrated_flexible"); .annual_useful_thermal_energy_cost_usd == 0)
            and all(.results[]; .production_release_ready == false)
            and all(.results[]; .local_code_gate == "unknown")
            and all(.results[]; .battery_process_safety_gate == "unknown")
          ' ev-factory-design-report.json
          jq -e '
            .benchmark_id == "EV-LOCALIZATION-001"
            and .baseline_observed_retail_price == 341900
            and .target_retail_price_ceiling == 307710
            and .result_count == 16
            and all(.results[]; .cost_inputs_release_grade == false)
            and all(.results[]; .tariff_treatments_qualified == false)
            and all(.results[]; .economics_evidence_status == "needs_evidence")
            and all(.results[]; .frontier_given_declared_vat_status == null)
            and all(.results[]; .cost_of_goods_if_vat_unrecoverable_low >= .cost_of_goods_if_vat_recovered_low)
            and all(.results[]; .cost_of_goods_if_vat_unrecoverable_high >= .cost_of_goods_if_vat_recovered_high)
          ' ev-localization-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_carrier_module_factory_screen -- \
            ev-factory-design-report.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_carrier_module_processes_v0_1.json \
            > ev-carrier-module-factory-report.json
          jq -e '
            .benchmark_id == "EV-CARRIER-MODULE-MFG-001"
            and .base_factory_benchmark_id == "EV-FACTORY-DESIGN-001"
            and .scenario_count == 108
            and ([.results[].config_id] | unique | length == 3)
            and all(.results[] | select(.evidence_class == "synthetic"); .status == "passes_synthetic_screen")
            and all(.results[] | select(.evidence_class == "synthetic"); .equivalent_good_vehicle_capacity_per_year >= .target_good_vehicles_per_year)
            and all(.results[] | select(.evidence_class == "synthetic"); .module_production_release_ready == false)
            and all(.results[] | select(.config_id == "integrated-drone-bay-production-intent-unknown"); .status == "indeterminate" and .equivalent_good_vehicle_capacity_per_year == null)
            and all(.results[]; .base_factory_production_release_ready == false)
          ' ev-carrier-module-factory-report.json
          jq empty tools/ev-passenger-cost-frontier/schemas/ev_carrier_lifecycle_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_carrier_lifecycle_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/battery_service_network_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/battery_service_network_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/battery_pack_state_journal_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/battery_resource_occupancy_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/battery_resource_occupancy_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/battery_charge_queue_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/battery_charge_queue_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/mobility_flexibility_envelope_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/mobility_flexibility_envelope_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/mobility_recovery_envelope_v0_2.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/mobility_recovery_envelope_v0_2.json
          jq empty tools/ev-passenger-cost-frontier/schemas/mobility_commitment_lease_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/mobility_commitment_lease_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/mobility_commitment_journal_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/mobility_commitment_journal_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/sustainable_mobility_service_capacity_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/sustainable_mobility_service_capacity_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/sustainable_mobility_service_quality_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/sustainable_mobility_service_quality_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/sustainable_mobility_service_quality_linked_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/sustainable_mobility_service_quality_linked_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/sustainable_mobility_service_quality_exact_oracle_v0_1.json
          jq -e --slurpfile schema tools/ev-passenger-cost-frontier/schemas/sustainable_mobility_service_quality_linked_v0_1.schema.json '
            . as $input
            | ($schema[0].required | sort) as $required
            | (($input | keys | sort) == $required)
            and all($input.aerial_opportunity_qualifications[];
              (. | keys | sort) == ["evidence", "max_payload_units", "opportunity_id"]
              and ((.evidence | keys | sort) == ["aircraft_id", "architecture_configuration_digest", "capacity_opportunity_id", "evidence_class", "evidence_reference", "method_id", "observed_at_seconds", "producer_id", "site_configuration_digest", "site_id", "valid_from_seconds", "valid_until_seconds"])
            )
            and all($input.aerial_opportunity_qualifications[]; has("opportunity_id") and (has("aircraft_id") | not) and (has("start_seconds") | not) and (has("mission_duration_seconds") | not) and (has("turnaround_seconds") | not))
            and all($input.aerial_opportunity_qualifications[]; .evidence.capacity_opportunity_id == .opportunity_id and .evidence.site_id == $input.site_id and .evidence.site_configuration_digest == $input.site_configuration_digest)
          ' tools/ev-passenger-cost-frontier/fixtures/sustainable_mobility_service_quality_linked_v0_1.json
          jq -e --slurpfile schema tools/ev-passenger-cost-frontier/schemas/battery_charge_queue_v0_1.schema.json '

            . as $queue
            | ($schema[0].required | sort) as $root_required
            | ($schema[0]["$defs"].job.required | sort) as $job_required
            | ($schema[0]["$defs"].charger.required | sort) as $charger_required
            | ($schema[0]["$defs"].gridSlot.required | sort) as $grid_required
            | ($schema[0]["$defs"].evidenceEnvelope.required | sort) as $evidence_required
            | (($queue | keys | sort) == $root_required)
            and (($queue.site_evidence | keys | sort) == $evidence_required)
            and ($queue.site_evidence.asset_id == $queue.site_id)
            and ($queue.site_evidence.configuration_digest == $queue.site_configuration_digest)
            and ($queue.site_evidence.observed_at_unix_ms <= $queue.decision_time_unix_ms)
            and ($queue.site_evidence.valid_from_unix_ms <= $queue.decision_time_unix_ms)
            and ($queue.site_evidence.valid_until_unix_ms >= ($queue.decision_time_unix_ms + ($queue.horizon_slots * $queue.slot_duration_seconds * 1000) - 1))
            and all($queue.jobs[];
              . as $job
              | (($job | keys | sort) == $job_required)
              and (($job.pack_state | keys | sort) == ["evidence", "value"])
              and (($job.pack_state.evidence | keys | sort) == $evidence_required)
              and ($job.pack_state.evidence.asset_id == $job.pack_id)
              and ($job.pack_state.evidence.configuration_digest == $job.pack_configuration_digest)
              and ($job.pack_state.value == "cooling")
              and ($job.pack_state.evidence.evidence_class == "synthetic")
              and ($job.pack_state.evidence.observed_at_unix_ms <= $queue.decision_time_unix_ms)
              and ($job.pack_state.evidence.valid_from_unix_ms <= $job.pack_state.evidence.observed_at_unix_ms)
              and ($job.pack_state.evidence.valid_from_unix_ms <= $queue.decision_time_unix_ms)
              and ($job.pack_state.evidence.valid_until_unix_ms >= $queue.decision_time_unix_ms)
              and ($job.release_slot < $job.deadline_slot_exclusive)
              and ($job.duration_slots > 0)
              and ($job.deadline_slot_exclusive <= $queue.horizon_slots)
            )
            and all($queue.chargers[];
              . as $charger
              | (($charger | keys | sort) == $charger_required)
              and (($charger.availability_evidence | keys | sort) == $evidence_required)
              and ($charger.availability_evidence.asset_id == $charger.charger_id)
              and ($charger.availability_evidence.configuration_digest == $charger.configuration_digest)
              and ($charger.availability_evidence.observed_at_unix_ms <= $queue.decision_time_unix_ms)
              and ($charger.availability_evidence.valid_from_unix_ms <= $queue.decision_time_unix_ms)
              and ($charger.availability_evidence.valid_until_unix_ms >= ($queue.decision_time_unix_ms + ($queue.horizon_slots * $queue.slot_duration_seconds * 1000) - 1))
              and (($charger.capability | keys | sort) == ["evidence", "max_power_w", "supported_pack_configuration_digests"])
              and (($charger.capability.evidence | keys | sort) == $evidence_required)
              and ($charger.capability.evidence.asset_id == $charger.charger_id)
              and ($charger.capability.evidence.configuration_digest == $charger.configuration_digest)
              and ($charger.capability.evidence.observed_at_unix_ms <= $queue.decision_time_unix_ms)
              and ($charger.capability.evidence.valid_from_unix_ms <= $queue.decision_time_unix_ms)
              and ($charger.capability.evidence.valid_until_unix_ms >= ($queue.decision_time_unix_ms + ($queue.horizon_slots * $queue.slot_duration_seconds * 1000) - 1))
              and ($charger.capability.max_power_w > 0)
              and ($charger.capability.supported_pack_configuration_digests | length > 0)
            )
            and all($queue.grid_slots[];
              . as $grid
              | (($grid | keys | sort) == $grid_required)
              and (($grid.evidence | keys | sort) == ["evidence", "import_cap_w", "non_charging_site_load_w"])
              and (($grid.evidence.evidence | keys | sort) == $evidence_required)
              and ($grid.evidence.evidence.asset_id == $queue.site_id)
              and ($grid.evidence.evidence.configuration_digest == $queue.site_configuration_digest)
              and ($grid.evidence.evidence.observed_at_unix_ms <= $queue.decision_time_unix_ms)
              and ($grid.evidence.evidence.valid_from_unix_ms <= ($queue.decision_time_unix_ms + ($grid.slot * $queue.slot_duration_seconds * 1000)))
              and ($grid.evidence.evidence.valid_until_unix_ms >= ($queue.decision_time_unix_ms + (($grid.slot + 1) * $queue.slot_duration_seconds * 1000) - 1))
              and ($grid.evidence.non_charging_site_load_w <= $grid.evidence.import_cap_w)
            )
            and ($queue.grid_slots | length) == $queue.horizon_slots
          ' tools/ev-passenger-cost-frontier/fixtures/battery_charge_queue_v0_1.json
          jq -e --slurpfile schema tools/ev-passenger-cost-frontier/schemas/battery_pack_state_journal_v0_1.schema.json '
            . as $journal
            | ($schema[0].required | sort) as $root_required
            | ($schema[0]["$defs"].event.required | sort) as $event_required
            | ($schema[0]["$defs"].evidenceEnvelope.required | sort) as $evidence_required
            | (($journal | keys | sort) == $root_required)
            and (($journal.initial_state | keys | sort) == ["evidence", "value"])
            and (($journal.initial_state.evidence | keys | sort) == $evidence_required)
            and ($journal.initial_state.evidence.asset_id == $journal.pack_id)
            and ($journal.initial_state.evidence.configuration_digest == $journal.configuration_digest)
            and ($journal.initial_state.evidence.observed_at_unix_ms <= $journal.replay_cutoff_unix_ms)
            and ($journal.initial_state.evidence.valid_from_unix_ms <= $journal.initial_state.evidence.observed_at_unix_ms)
            and ($journal.initial_state.evidence.valid_until_unix_ms >= $journal.initial_state.evidence.observed_at_unix_ms)
            and all($journal.events[];
              . as $event
              | (($event | keys | sort) == $event_required)
              and (($event.evidence | keys | sort) == $evidence_required)
              and ($event.evidence.asset_id == $journal.pack_id)
              and ($event.evidence.configuration_digest == $journal.configuration_digest)
              and ($event.evidence.observed_at_unix_ms <= $event.event_time_unix_ms)
              and ($event.event_time_unix_ms <= $journal.replay_cutoff_unix_ms)
              and ($event.evidence.valid_from_unix_ms <= $event.event_time_unix_ms)
              and ($event.evidence.valid_until_unix_ms >= $event.event_time_unix_ms)
            )
          ' tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json
          jq -e --slurpfile schema tools/ev-passenger-cost-frontier/schemas/battery_resource_occupancy_v0_1.schema.json '
            . as $schedule
            | ($schema[0].required | sort) as $root_required
            | ($schema[0]["$defs"].interval.required | sort) as $interval_required
            | ($schema[0]["$defs"].evidenceEnvelope.required | sort) as $evidence_required
            | (($schedule | keys | sort) == $root_required)
            and all($schedule.intervals[];
              . as $interval
              | (($interval | keys | sort) == $interval_required)
              and (($interval.evidence | keys | sort) == $evidence_required)
              and ($interval.end_unix_ms > $interval.start_unix_ms)
              and ($interval.resource_id == $interval.evidence.asset_id)
              and ($interval.resource_configuration_digest == $interval.evidence.configuration_digest)
              and ($interval.evidence.observed_at_unix_ms <= $schedule.decision_time_unix_ms)
              and ($interval.evidence.observed_at_unix_ms >= $interval.evidence.valid_from_unix_ms)
              and ($interval.evidence.observed_at_unix_ms <= $interval.evidence.valid_until_unix_ms)
              and ($interval.evidence.valid_from_unix_ms <= $interval.start_unix_ms)
              and ($interval.evidence.valid_until_unix_ms >= ($interval.end_unix_ms - 1))
              and ($interval.evidence.evidence_class == "synthetic")
            )
          ' tools/ev-passenger-cost-frontier/fixtures/battery_resource_occupancy_v0_1.json
          jq -e --slurpfile schema tools/ev-passenger-cost-frontier/schemas/battery_service_network_v0_1.schema.json '
            . as $fixture
            | ($schema[0]["$defs"].pack.required | sort) as $pack_required
            | ($schema[0]["$defs"].evidenceEnvelope.required | sort) as $evidence_required
            | ($schema[0]["$defs"].mission.required | sort) as $mission_required
            | (
                (($fixture | keys | sort) == ($schema[0].required | sort))
                and all($fixture.packs[];
                  . as $pack
                  | (($pack | keys | sort) == $pack_required)
                  and (
                    [
                      $pack.state_evidence.evidence,
                      $pack.identity_verification.evidence,
                      $pack.custody_resolution.evidence,
                      $pack.post_test.evidence,
                      $pack.usable_energy.evidence,
                      $pack.peak_power.evidence,
                      $pack.thermal.evidence
                    ]
                    | all(.[]; . as $evidence
                      | (($evidence | keys | sort) == $evidence_required)
                      and ($evidence.asset_id == $pack.pack_id)
                      and ($evidence.configuration_digest == $pack.configuration_digest)
                      and ($evidence.producer_id | length > 0)
                      and ($evidence.method_id | length > 0)
                      and ($evidence.evidence_reference | length > 0)
                      and ($evidence.evidence_class == "synthetic")
                      and ($evidence.observed_at_unix_ms <= $fixture.dispatch_time_unix_ms)
                      and ($evidence.valid_from_unix_ms <= $fixture.dispatch_time_unix_ms)
                      and ($evidence.valid_until_unix_ms >= $fixture.dispatch_time_unix_ms)
                      and ($evidence.valid_from_unix_ms <= $evidence.valid_until_unix_ms)
                      and ($evidence.observed_at_unix_ms >= $evidence.valid_from_unix_ms)
                      and ($evidence.observed_at_unix_ms <= $evidence.valid_until_unix_ms)
                    )
                  )
                )
                and (($fixture.packs[0].state_evidence | keys | sort) == ["evidence", "value"])
                and all($fixture.packs[];
                  (.state_evidence.value == "available"
                    or .state_evidence.value == "installed"
                    or .state_evidence.value == "reserved"
                    or .state_evidence.value == "depleted"
                    or .state_evidence.value == "charging"
                    or .state_evidence.value == "cooling"
                    or .state_evidence.value == "balancing"
                    or .state_evidence.value == "inspection"
                    or .state_evidence.value == "repair"
                    or .state_evidence.value == "post_test"
                    or .state_evidence.value == "quarantined"
                    or .state_evidence.value == "in_transit"
                    or .state_evidence.value == "retired"
                    or .state_evidence.value == "unknown")
                  and ((.usable_energy | keys | sort) == ["conservative_lower_bound", "evidence"])
                  and ((.peak_power | keys | sort) == ["conservative_lower_bound", "evidence"])
                  and ((.thermal | keys | sort) == ["conservative_upper_bound_c", "evidence", "qualified_max_temperature_c"])
                  and (.usable_energy.conservative_lower_bound >= 0)
                  and (.peak_power.conservative_lower_bound >= 0)
                  and (.thermal.conservative_upper_bound_c <= .thermal.qualified_max_temperature_c)
                )
                and all($fixture.missions[]; (keys | sort) == $mission_required)
              )
          ' tools/ev-passenger-cost-frontier/fixtures/battery_service_network_v0_1.json
          jq -e '
            . as $journal
            | .pack_id == "journal-pack"
            and .configuration_digest == "urn:synthetic:configuration:journal-pack"
            and .replay_cutoff_unix_ms == 1795219200000 + 5000
            and .initial_state.value == "available"
            and (.events | length) == 3
            and (.events[0].disposition == "confirmed" and .events[0].proposed_to_state == "reserved")
            and (.events[1].disposition == "timeout" and .events[1].proposed_to_state == "installed")
            and (.events[2].disposition == "reconciled" and .events[2].proposed_to_state == "installed")
            and (.events[0].sequence == 1 and .events[1].sequence == 2 and .events[2].sequence == 3)
            and (.events[0].event_time_unix_ms < .events[1].event_time_unix_ms and .events[1].event_time_unix_ms < .events[2].event_time_unix_ms)
            and all($journal.events[]; .event_time_unix_ms <= $journal.replay_cutoff_unix_ms)
            and (.events[2].evidence.evidence_class == "independent_test")
          ' tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json
