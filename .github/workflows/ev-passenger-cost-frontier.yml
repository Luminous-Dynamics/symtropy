name: EV Passenger Cost Frontier
on:
  pull_request:
    paths:
      - "tools/ev-passenger-cost-frontier/**"
      - "docs/research/EV_PASSENGER_COST_FEASIBILITY_V0_1.md"
      - "docs/research/EV_LOCALIZATION_AND_LIFETIME_BENCHMARKS_V0_1.md"
      - ".github/workflows/ev-passenger-cost-frontier.yml"
  push:
    branches: [main]
    paths:
      - "tools/ev-passenger-cost-frontier/**"
      - "docs/research/EV_PASSENGER_COST_FEASIBILITY_V0_1.md"
      - "docs/research/EV_LOCALIZATION_AND_LIFETIME_BENCHMARKS_V0_1.md"
      - ".github/workflows/ev-passenger-cost-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Parse strict schema and fixture as JSON
        run: |
          jq empty tools/ev-passenger-cost-frontier/schemas/ev_passenger_cost_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_automation_breakeven_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json
          jq -e '
            .benchmark_id == "EV-FACTORY-SIM-001"
            and .common_cause_control_outage.domain_id == "shared-line-control"
            and (.common_cause_control_outage.station_ids | length) == 2
            and .common_cause_control_outage.first_start_seconds == 600
            and .common_cause_control_outage.recurrence_interval_seconds == 1800
            and .common_cause_control_outage.duration_seconds == 300
            and .horizon_seconds == 4000
            and .warmup_seconds == 0
          ' tools/ev-passenger-cost-frontier/fixtures/ev_factory_simulation_shared_control_outage_v0_1.json
          jq -e '
            .benchmark_id == "EV-PUBLIC-COMPONENT-BENCHMARKS-001"
            and .observed_as_of == "2026-10-20"
            and (.sources | length) == 13
            and .derived_checks.global_bev_pack_reference_42kwh_ZAR > 68000
            and .derived_checks.global_bev_pack_reference_42kwh_ZAR < 69000
            and .derived_checks.current_synthetic_42kwh_cost_first_pack_low_ZAR == 60800
            and .derived_checks.current_synthetic_42kwh_cost_first_pack_high_ZAR == 80300
            and (.sources | any(.id == "south-africa-local-manufacturing-policy-announcement"))
            and .scenario_calculations_from_synthetic_cost_fixture.fixed_program_amortization_ZAR_per_vehicle[0].designs.cost_first.low == 150000
            and .scenario_calculations_from_synthetic_cost_fixture.fixed_program_amortization_ZAR_per_vehicle[3].designs.cost_first.high == 2500
            and (.scenario_calculations_from_synthetic_cost_fixture.cost_frontier_at_current_fixture_amortization_50000_units | length) == 4
          ' tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json
      - name: Format check
        run: cargo fmt --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml
      - name: Emit deterministic reference report
        run: |
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev-passenger-cost-frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json \
            > ev-passenger-cost-report.json
          jq -e '
            .benchmark_id == "EV-PASSENGER-COST-001"
            and .baseline_observed_retail_price == 341900
            and .retail_price_ceiling == 307710
            and (.results | length) == 4
            and all(.results[]; .declared_mission_fit == true)
            and all(.results[]; .cost_inputs_release_grade == false)
            and all(.results[]; .release_disposition == "needs_evidence")
            and all(.results[]; .economics_result == "range_crosses_target_ceiling")
          ' ev-passenger-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_localization_frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json \
            > ev-localization-cost-report.json
          jq -e '
            .benchmark_id == "EV-LOCALIZATION-001"
            and .result_count == 16
            and all(.results[]; .economics_evidence_status == "needs_evidence")
          ' ev-localization-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json \
            > ev-factory-design-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-DESIGN-001"
            and .base_currency == "USD"
            and .scenario_count == 36
            and all(.results[]; .target_good_vehicles_per_year > 0)
            and all(.results[]; .bottleneck_good_capacity_per_year >= .target_good_vehicles_per_year)
            and all(.results[]; .building_area_sqm > 0)
            and all(.results[]; .total_installed_capex_usd > 0)
            and all(.results[]; .annual_useful_thermal_energy_cost_usd >= 0)
            and all(.results[] | select(.strategy == "integrated_flexible"); .annual_useful_thermal_energy_cost_usd > 0)
            and all(.results[] | select(.strategy != "integrated_flexible"); .annual_useful_thermal_energy_cost_usd == 0)
            and all(.results[]; .production_release_ready == false)
            and all(.results[]; .local_code_gate == "unknown")
            and all(.results[]; .battery_process_safety_gate == "unknown")
          ' ev-factory-design-report.json
          jq -e '
            .benchmark_id == "EV-LOCALIZATION-001"
            and .baseline_observed_retail_price == 341900
            and .target_retail_price_ceiling == 307710
            and .result_count == 16
            and all(.results[]; .cost_inputs_release_grade == false)
            and all(.results[]; .tariff_treatments_qualified == false)
            and all(.results[]; .economics_evidence_status == "needs_evidence")
            and all(.results[]; .frontier_given_declared_vat_status == null)
            and all(.results[]; .cost_of_goods_if_vat_unrecoverable_low >= .cost_of_goods_if_vat_recovered_low)
            and all(.results[]; .cost_of_goods_if_vat_unrecoverable_high >= .cost_of_goods_if_vat_recovered_high)
          ' ev-localization-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_automation_frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_automation_breakeven_v0_1.json \
            > ev-automation-breakeven-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-AUTOMATION-001"
            and .result_count == 108
            and all(.results[]; .target_good_units_per_year > 0)
            and all(.results[]; .planned_attempt_capacity_per_year >= .planned_attempts_per_year)
            and all(.results[]; .good_capacity_per_year >= .target_good_units_per_year)
            and all(.results[]; .required_cells > 0)
            and all(.results[]; .total_station_cost_usd_per_good_unit > 0)
            and all(.results[]; .release_ready == false)
            and all(.results[]; .evidence_release_grade == false)
            and all(.results[] | select(.is_manual_baseline); .annual_operating_savings_vs_manual_usd == 0)
            and all(.results[] | select(.is_manual_baseline); .incremental_installed_capex_vs_manual_usd == 0)
            and all(.results[] | select(.is_manual_baseline); .discounted_npv_vs_manual_usd == 0)
          ' ev-automation-breakeven-report.json
          sha256sum \
            tools/ev-passenger-cost-frontier/schemas/ev_passenger_cost_v0_1.schema.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json \
            tools/ev-passenger-cost-frontier/src/main.rs \
            tools/ev-passenger-cost-frontier/src/bin/ev_localization_frontier.rs \
            tools/ev-passenger-cost-frontier/src/bin/ev_factory_frontier.rs \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json \
            tools/ev-passenger-cost-frontier/src/bin/ev_automation_frontier.rs \
            tools/ev-passenger-cost-frontier/fixtures/ev_automation_breakeven_v0_1.json \
            ev-passenger-cost-report.json ev-localization-cost-report.json ev-factory-design-report.json ev-automation-breakeven-report.json > ev-passenger-cost-report.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ev-passenger-cost-frontier-report
          path: |
            ev-passenger-cost-report.json
            ev-localization-cost-report.json
            ev-factory-design-report.json
            ev-automation-breakeven-report.json
            ev-passenger-cost-report.sha256
          if-no-files-found: error
