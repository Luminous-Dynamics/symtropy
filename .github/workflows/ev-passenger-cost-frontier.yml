name: EV Passenger Cost Frontier
on:
  pull_request:
    paths:
      - "tools/ev-passenger-cost-frontier/**"
      - "docs/research/EV_PASSENGER_COST_FEASIBILITY_V0_1.md"
      - "docs/research/EV_LOCALIZATION_AND_LIFETIME_BENCHMARKS_V0_1.md"
      - ".github/workflows/ev-passenger-cost-frontier.yml"
  push:
    branches: [main]
    paths:
      - "tools/ev-passenger-cost-frontier/**"
      - "docs/research/EV_PASSENGER_COST_FEASIBILITY_V0_1.md"
      - "docs/research/EV_LOCALIZATION_AND_LIFETIME_BENCHMARKS_V0_1.md"
      - ".github/workflows/ev-passenger-cost-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Parse strict schema and fixture as JSON
        run: |
          jq empty tools/ev-passenger-cost-frontier/schemas/ev_passenger_cost_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/ev_carrier_module_processes_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_carrier_module_processes_v0_1.json
          jq -e '
            .benchmark_id == "EV-PUBLIC-COMPONENT-BENCHMARKS-001"
            and .observed_as_of == "2026-10-20"
            and (.sources | length) == 13
            and .derived_checks.global_bev_pack_reference_42kwh_ZAR > 68000
            and .derived_checks.global_bev_pack_reference_42kwh_ZAR < 69000
            and .derived_checks.current_synthetic_42kwh_cost_first_pack_low_ZAR == 60800
            and .derived_checks.current_synthetic_42kwh_cost_first_pack_high_ZAR == 80300
            and (.sources | any(.id == "south-africa-local-manufacturing-policy-announcement"))
            and .scenario_calculations_from_synthetic_cost_fixture.fixed_program_amortization_ZAR_per_vehicle[0].designs.cost_first.low == 150000
            and .scenario_calculations_from_synthetic_cost_fixture.fixed_program_amortization_ZAR_per_vehicle[3].designs.cost_first.high == 2500
            and (.scenario_calculations_from_synthetic_cost_fixture.cost_frontier_at_current_fixture_amortization_50000_units | length) == 4
          ' tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json
      - name: Format check
        run: cargo fmt --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml
      - name: Emit deterministic reference report
        run: |
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev-passenger-cost-frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json \
            > ev-passenger-cost-report.json
          jq -e '
            .benchmark_id == "EV-PASSENGER-COST-001"
            and .baseline_observed_retail_price == 341900
            and .retail_price_ceiling == 307710
            and (.results | length) == 4
            and all(.results[]; .declared_mission_fit == true)
            and all(.results[]; .cost_inputs_release_grade == false)
            and all(.results[]; .release_disposition == "needs_evidence")
            and all(.results[]; .economics_result == "range_crosses_target_ceiling")
          ' ev-passenger-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_localization_frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json \
            > ev-localization-cost-report.json
          jq -e '
            .benchmark_id == "EV-LOCALIZATION-001"
            and .result_count == 16
            and all(.results[]; .economics_evidence_status == "needs_evidence")
          ' ev-localization-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_factory_frontier -- \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json \
            > ev-factory-design-report.json
          jq -e '
            .benchmark_id == "EV-FACTORY-DESIGN-001"
            and .base_currency == "USD"
            and .scenario_count == 36
            and all(.results[]; .target_good_vehicles_per_year > 0)
            and all(.results[]; .bottleneck_good_capacity_per_year >= .target_good_vehicles_per_year)
            and all(.results[]; .building_area_sqm > 0)
            and all(.results[]; .total_installed_capex_usd > 0)
            and all(.results[]; .annual_useful_thermal_energy_cost_usd >= 0)
            and all(.results[] | select(.strategy == "integrated_flexible"); .annual_useful_thermal_energy_cost_usd > 0)
            and all(.results[] | select(.strategy != "integrated_flexible"); .annual_useful_thermal_energy_cost_usd == 0)
            and all(.results[]; .production_release_ready == false)
            and all(.results[]; .local_code_gate == "unknown")
            and all(.results[]; .battery_process_safety_gate == "unknown")
          ' ev-factory-design-report.json
          jq -e '
            .benchmark_id == "EV-LOCALIZATION-001"
            and .baseline_observed_retail_price == 341900
            and .target_retail_price_ceiling == 307710
            and .result_count == 16
            and all(.results[]; .cost_inputs_release_grade == false)
            and all(.results[]; .tariff_treatments_qualified == false)
            and all(.results[]; .economics_evidence_status == "needs_evidence")
            and all(.results[]; .frontier_given_declared_vat_status == null)
            and all(.results[]; .cost_of_goods_if_vat_unrecoverable_low >= .cost_of_goods_if_vat_recovered_low)
            and all(.results[]; .cost_of_goods_if_vat_unrecoverable_high >= .cost_of_goods_if_vat_recovered_high)
          ' ev-localization-cost-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_carrier_module_factory_screen -- \
            ev-factory-design-report.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_carrier_module_processes_v0_1.json \
            > ev-carrier-module-factory-report.json
          jq -e '
            .benchmark_id == "EV-CARRIER-MODULE-MFG-001"
            and .base_factory_benchmark_id == "EV-FACTORY-DESIGN-001"
            and .scenario_count == 108
            and ([.results[].config_id] | unique | length == 3)
            and all(.results[] | select(.evidence_class == "synthetic"); .status == "passes_synthetic_screen")
            and all(.results[] | select(.evidence_class == "synthetic"); .equivalent_good_vehicle_capacity_per_year >= .target_good_vehicles_per_year)
            and all(.results[] | select(.evidence_class == "synthetic"); .module_production_release_ready == false)
            and all(.results[] | select(.config_id == "integrated-drone-bay-production-intent-unknown"); .status == "indeterminate" and .equivalent_good_vehicle_capacity_per_year == null)
            and all(.results[]; .base_factory_production_release_ready == false)
          ' ev-carrier-module-factory-report.json
          jq empty tools/ev-passenger-cost-frontier/schemas/ev_carrier_lifecycle_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/ev_carrier_lifecycle_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/battery_service_network_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/battery_service_network_v0_1.json
          jq empty tools/ev-passenger-cost-frontier/schemas/battery_pack_state_journal_v0_1.schema.json
          jq empty tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json
          jq -e --slurpfile schema tools/ev-passenger-cost-frontier/schemas/battery_service_network_v0_1.schema.json '
            . as $fixture
            | ($schema[0]["$defs"].pack.required | sort) as $pack_required
            | ($schema[0]["$defs"].evidenceEnvelope.required | sort) as $evidence_required
            | ($schema[0]["$defs"].mission.required | sort) as $mission_required
            | (
                (($fixture | keys | sort) == ($schema[0].required | sort))
                and all($fixture.packs[];
                  . as $pack
                  | (($pack | keys | sort) == $pack_required)
                  and (
                    [
                      $pack.state_evidence.evidence,
                      $pack.identity_verification.evidence,
                      $pack.custody_resolution.evidence,
                      $pack.post_test.evidence,
                      $pack.usable_energy.evidence,
                      $pack.peak_power.evidence,
                      $pack.thermal.evidence
                    ]
                    | all(.[]; . as $evidence
                      | (($evidence | keys | sort) == $evidence_required)
                      and ($evidence.asset_id == $pack.pack_id)
                      and ($evidence.configuration_digest == $pack.configuration_digest)
                      and ($evidence.producer_id | length > 0)
                      and ($evidence.method_id | length > 0)
                      and ($evidence.evidence_reference | length > 0)
                      and ($evidence.evidence_class == "synthetic")
                      and ($evidence.observed_at_unix_ms <= $fixture.dispatch_time_unix_ms)
                      and ($evidence.valid_from_unix_ms <= $fixture.dispatch_time_unix_ms)
                      and ($evidence.valid_until_unix_ms >= $fixture.dispatch_time_unix_ms)
                      and ($evidence.valid_from_unix_ms <= $evidence.valid_until_unix_ms)
                      and ($evidence.observed_at_unix_ms >= $evidence.valid_from_unix_ms)
                      and ($evidence.observed_at_unix_ms <= $evidence.valid_until_unix_ms)
                    )
                  )
                )
                and (($fixture.packs[0].state_evidence | keys | sort) == ["evidence", "value"])
                and all($fixture.packs[];
                  (.state_evidence.value == "available"
                    or .state_evidence.value == "installed"
                    or .state_evidence.value == "reserved"
                    or .state_evidence.value == "depleted"
                    or .state_evidence.value == "charging"
                    or .state_evidence.value == "cooling"
                    or .state_evidence.value == "balancing"
                    or .state_evidence.value == "inspection"
                    or .state_evidence.value == "repair"
                    or .state_evidence.value == "post_test"
                    or .state_evidence.value == "quarantined"
                    or .state_evidence.value == "in_transit"
                    or .state_evidence.value == "retired"
                    or .state_evidence.value == "unknown")
                  and ((.usable_energy | keys | sort) == ["conservative_lower_bound", "evidence"])
                  and ((.peak_power | keys | sort) == ["conservative_lower_bound", "evidence"])
                  and ((.thermal | keys | sort) == ["conservative_upper_bound_c", "evidence", "qualified_max_temperature_c"])
                  and (.usable_energy.conservative_lower_bound >= 0)
                  and (.peak_power.conservative_lower_bound >= 0)
                  and (.thermal.conservative_upper_bound_c <= .thermal.qualified_max_temperature_c)
                )
                and all($fixture.missions[]; (keys | sort) == $mission_required)
              )
          ' tools/ev-passenger-cost-frontier/fixtures/battery_service_network_v0_1.json
          jq -e '
            .pack_id == "journal-pack"
            and .configuration_digest == "urn:synthetic:configuration:journal-pack"
            and .replay_cutoff_unix_ms == 1795219200000 + 5000
            and .initial_state.value == "available"
            and (.events | length) == 3
            and (.events[0].disposition == "confirmed" and .events[0].proposed_to_state == "reserved")
            and (.events[1].disposition == "timeout" and .events[1].proposed_to_state == "installed")
            and (.events[2].disposition == "reconciled" and .events[2].proposed_to_state == "installed")
            and (.events[0].sequence == 1 and .events[1].sequence == 2 and .events[2].sequence == 3)
            and (.events[0].event_time_unix_ms < .events[1].event_time_unix_ms and .events[1].event_time_unix_ms < .events[2].event_time_unix_ms)
            and all(.events[]; .event_time_unix_ms <= .replay_cutoff_unix_ms)
            and (.events[2].evidence.evidence_class == "independent_test")
          ' tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin battery_pack_journal_screen -- \
            tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json \
            > battery-pack-state-journal-report.json
          jq -e '
            .pack_id == "journal-pack"
            and .final_state == "installed"
            and .final_sequence == 3
            and .reconciliation_required == false
            and .last_uncertain_event_id == null
            and (.accepted_event_ids == ["event-reserve", "event-install-timeout", "event-install-reconcile"])
            and (.findings | any(. == "operation_outcome_unknown:op-install"))
            and (.findings | any(. == "physical_state_reconciled:event-install-reconcile"))
          ' battery-pack-state-journal-report.json
          cat battery-pack-state-journal-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin ev_carrier_lifecycle_screen -- \
            ev-carrier-module-factory-report.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_carrier_lifecycle_v0_1.json \
            > ev-carrier-module-lifecycle-report.json
          jq -e '
            .benchmark_id == "EV-CARRIER-LIFECYCLE-001"
            and .base_factory_module_benchmark_id == "EV-CARRIER-MODULE-MFG-001"
            and .scenario_count == 108
            and ([.results[].config_id] | unique | length == 3)
            and all(.results[] | select(.config_id == "detachable-uav-pod-synthetic-demo"); .status == "passes_synthetic_screen")
            and all(.results[] | select(.config_id == "amr-handoff-synthetic-demo"); .status == "passes_synthetic_screen")
            and all(.results[] | select(.config_id == "integrated-drone-bay-production-intent-unknown"); .status == "indeterminate" and .undiscounted_lifecycle_cost_usd_per_module == null)
            and all(.results[]; .return_to_service_authority_granted == false)
            and all(.results[]; .production_release_granted == false)
          ' ev-carrier-module-lifecycle-report.json
          cat ev-carrier-module-lifecycle-report.json
          cargo run --quiet --manifest-path tools/ev-passenger-cost-frontier/Cargo.toml --bin battery_service_network_screen -- \
            tools/ev-passenger-cost-frontier/fixtures/battery_service_network_v0_1.json \
            > battery-service-network-report.json
          jq -e '
            .benchmark_id == "BATTERY-SERVICE-NETWORK-001"
            and .dispatch_epoch_id == "synthetic-common-epoch-001"
            and .dispatch_time_unix_ms == 1795219200000
            and .pack_count == 4
            and .mission_count == 4
            and .serviceable_mission_count == 3
            and .status == "partial_service"
            and (.assignments | length) == 3
            and .search_nodes == 38
            and (any(.assignments[]; .mission_id == "mission-1" and .pack_id == "pack-a" and .energy_margin_wh == 300))
            and (any(.assignments[]; .mission_id == "mission-2" and .pack_id == "pack-b" and .energy_margin_wh == 300))
            and (any(.assignments[]; .mission_id == "mission-3" and .pack_id == "pack-c" and .energy_margin_wh == 200))
            and ([.assignments[].pack_id] | unique | length) == 3
            and ([.assignments[].mission_id] | unique | length) == 3
            and (.unserved_missions == ["mission-4"])
            and (all(.assignments[]; .pack_id != "pack-d"))
            and (all(.assignments[]; .energy_margin_wh >= 0))
            and .all_pack_evidence_synthetic == true
            and .dispatch_authority_granted == false
            and .return_to_service_authority_granted == false
          ' battery-service-network-report.json
          cat battery-service-network-report.json
          sha256sum \
            tools/ev-passenger-cost-frontier/schemas/ev_passenger_cost_v0_1.schema.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_passenger_cost_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_component_public_benchmarks_v0_1.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_localization_v0_1.json \
            tools/ev-passenger-cost-frontier/src/main.rs \
            tools/ev-passenger-cost-frontier/src/bin/ev_localization_frontier.rs \
            tools/ev-passenger-cost-frontier/src/bin/ev_factory_frontier.rs \
            tools/ev-passenger-cost-frontier/fixtures/ev_factory_design_v0_1.json \
            tools/ev-passenger-cost-frontier/schemas/ev_carrier_module_processes_v0_1.schema.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_carrier_module_processes_v0_1.json \
            tools/ev-passenger-cost-frontier/src/carrier_module_factory.rs \
            tools/ev-passenger-cost-frontier/src/carrier_lifecycle.rs \
            tools/ev-passenger-cost-frontier/schemas/ev_carrier_lifecycle_v0_1.schema.json \
            tools/ev-passenger-cost-frontier/fixtures/ev_carrier_lifecycle_v0_1.json \
            tools/ev-passenger-cost-frontier/src/bin/ev_carrier_lifecycle_screen.rs \
            tools/ev-passenger-cost-frontier/src/lib.rs \
            tools/ev-passenger-cost-frontier/src/bin/ev_carrier_module_factory_screen.rs \
            tools/ev-passenger-cost-frontier/src/battery_service_network.rs \
            tools/ev-passenger-cost-frontier/src/bin/battery_pack_journal_screen.rs \
            tools/ev-passenger-cost-frontier/schemas/battery_pack_state_journal_v0_1.schema.json \
            tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json \
            tools/ev-passenger-cost-frontier/src/bin/battery_service_network_screen.rs \
            tools/ev-passenger-cost-frontier/schemas/battery_service_network_v0_1.schema.json \
            tools/ev-passenger-cost-frontier/fixtures/battery_service_network_v0_1.json \
            tools/ev-passenger-cost-frontier/README.md \
            docs/research/EV_CARRIER_LIFECYCLE_AND_SERVICEABILITY_V0_1.md \
            docs/research/BATTERY_SERVICE_NETWORK_BENCHMARK_V0_1.md \
            ev-passenger-cost-report.json ev-localization-cost-report.json ev-factory-design-report.json ev-carrier-module-factory-report.json ev-carrier-module-lifecycle-report.json > ev-passenger-cost-report.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ev-passenger-cost-frontier-report
          path: |
            ev-passenger-cost-report.json
            ev-localization-cost-report.json
            ev-factory-design-report.json
            ev-carrier-module-factory-report.json
            ev-carrier-module-lifecycle-report.json
            battery-service-network-report.json
            battery-pack-state-journal-report.json
            tools/ev-passenger-cost-frontier/fixtures/battery_pack_state_journal_v0_1.json
            tools/ev-passenger-cost-frontier/schemas/battery_pack_state_journal_v0_1.schema.json
            docs/research/BATTERY_SERVICE_NETWORK_BENCHMARK_V0_1.md
            tools/ev-passenger-cost-frontier/fixtures/battery_service_network_v0_1.json
            tools/ev-passenger-cost-frontier/schemas/battery_service_network_v0_1.schema.json
            tools/ev-passenger-cost-frontier/fixtures/ev_carrier_module_processes_v0_1.json
            tools/ev-passenger-cost-frontier/fixtures/ev_carrier_lifecycle_v0_1.json
            tools/ev-passenger-cost-frontier/schemas/ev_carrier_lifecycle_v0_1.schema.json
            tools/ev-passenger-cost-frontier/schemas/ev_carrier_module_processes_v0_1.schema.json
            ev-passenger-cost-report.sha256
          if-no-files-found: error
