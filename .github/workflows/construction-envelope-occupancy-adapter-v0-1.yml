name: Construction Envelope Occupancy Adapter v0.1

on:
  pull_request:
    branches:
      - research/construction-envelope-occupancy-integration-base-v0-1
    paths:
      - "research/construction-envelope-occupancy-adapter-v0-1/**"
      - "research/construction-motion-envelope-v0-1/**"
      - "research/construction-spacetime-occupancy-v0-1/**"
      - "research/construction-robot-interop-v0-1/**"
      - ".github/workflows/construction-envelope-occupancy-adapter-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Locked metadata
        run: cargo metadata --manifest-path research/construction-envelope-occupancy-adapter-v0-1/Cargo.toml --locked --format-version 1
      - name: Formatting
        run: cargo fmt --manifest-path research/construction-envelope-occupancy-adapter-v0-1/Cargo.toml -- --check
      - name: Tests
        run: cargo test --manifest-path research/construction-envelope-occupancy-adapter-v0-1/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo clippy --manifest-path research/construction-envelope-occupancy-adapter-v0-1/Cargo.toml --locked --all-targets -- -D warnings
      - name: Projection and occupancy benchmark
        if: runner.os == 'Linux'
        run: cargo bench --manifest-path research/construction-envelope-occupancy-adapter-v0-1/Cargo.toml --bench projection
