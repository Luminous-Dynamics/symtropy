name: VIS-MEM-002 Relational Memory Diagnostic

on:
  push:
    branches: ["research/vis-relational-memory-v0-1"]
    paths:
      - "tools/vision-relational-memory-bench.rs"
      - "docs/research/VIS_RELATIONAL_MEMORY_BENCH_V0_1.md"
      - ".github/workflows/vision-relational-memory-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
    paths:
      - "tools/vision-relational-memory-bench.rs"
      - "docs/research/VIS_RELATIONAL_MEMORY_BENCH_V0_1.md"
      - ".github/workflows/vision-relational-memory-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vis-mem-002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compile and run deterministic and negative-control tests
        run: |
          set -euo pipefail
          rustc --edition=2024 --test tools/vision-relational-memory-bench.rs -o /tmp/vis-mem-tests
          /tmp/vis-mem-tests

      - name: Execute report and check determinism
        run: |
          set -euo pipefail
          rustc --edition=2024 -O tools/vision-relational-memory-bench.rs -o /tmp/vis-mem-bench
          /tmp/vis-mem-bench > vis-relational-memory.tsv
          /tmp/vis-mem-bench > vis-relational-memory-repeat.tsv
          cmp vis-relational-memory.tsv vis-relational-memory-repeat.tsv
          grep -Fq "development" vis-relational-memory.tsv
          grep -Fq "query_keyed_latest" vis-relational-memory.tsv
          grep -Fq "query_keyed_selective" vis-relational-memory.tsv
          grep -Fq "query_keyed_hazard_aware" vis-relational-memory.tsv
          grep -Fq "query_keyed_gap_aware" vis-relational-memory.tsv
          grep -Fq "query_keyed_joint_noise" vis-relational-memory.tsv
          grep -Fq "joint-noise policy: joint transition-hazard x sensor-base-rate grid" vis-relational-memory.tsv
          grep -Fq "gap_aware_minus_hazard_aware" vis-relational-memory.tsv
          grep -Fq "joint_noise_minus_hazard_aware" vis-relational-memory.tsv
          grep -Fq "joint_noise_minus_gap_aware" vis-relational-memory.tsv
          grep -Fq "gap-aware policy: candidate per-tick hazards" vis-relational-memory.tsv
          grep -Fq "mean_logical_state_bytes" vis-relational-memory.tsv
          grep -Fq "mean_hazard_mae" vis-relational-memory.tsv
          grep -Fq "root_mean_hazard_mse" vis-relational-memory.tsv
          grep -Fq "mean_sensor_base_mae" vis-relational-memory.tsv
          grep -Fq "root_mean_sensor_base_mse" vis-relational-memory.tsv
          grep -Fq "prior_sensor_base_mae" vis-relational-memory.tsv
          grep -Fq "root_mean_prior_sensor_base_mse" vis-relational-memory.tsv
          grep -Fq "PAIRSENSOR" vis-relational-memory.tsv
          grep -Fq "joint_minus_uniform_grid_prior" vis-relational-memory.tsv
          grep -Fq "Joint transition/noise identifiability diagnostic" vis-relational-memory.tsv
          grep -Fq "uniform_prior_sensor_mae" vis-relational-memory.tsv
          grep -Fq 
          grep -Fq "confidence is sampled independently" vis-relational-memory.tsv
          grep -Fq "conditional corruption p per tier" vis-relational-memory.tsv
          grep -Fq "selective threshold calibrated on 256 separate development episodes" vis-relational-memory.tsv
          grep -Fq "bootstrap95_lo_vs_fifo" vis-relational-memory.tsv
          grep -Fq "STRATUM" vis-relational-memory.tsv
          grep -Fq "query_evidence_arrived_out_of_order" vis-relational-memory.tsv
          grep -Fq "profile_high_distractor_rate" vis-relational-memory.tsv
          grep -Fq "profile_high_claim_flip_rate" vis-relational-memory.tsv
          grep -Fq "profile_high_max_delay" vis-relational-memory.tsv
          grep -Fq "profile_high_corruption_rate" vis-relational-memory.tsv
          test "$(grep -c '^held_out' vis-relational-memory.tsv)" -eq 35
          sha256sum vis-relational-memory.tsv > vis-relational-memory.sha256
          sha256sum -c vis-relational-memory.sha256
          cat vis-relational-memory.tsv

      - name: Upload reproducible report
        uses: actions/upload-artifact@v4
        with:
          name: vis-relational-memory-report
          path: |
            vis-relational-memory.tsv
            vis-relational-memory.sha256
          if-no-files-found: error
          retention-days: 14
CALIBRATION\tobservations_per_claim\ttrue_hazard' vis-relational-memory.tsv
          test "$(grep -c '^CALIBRATION' vis-relational-memory.tsv)" -eq 211
          grep -Fq "confidence is sampled independently" vis-relational-memory.tsv
          grep -Fq "conditional corruption p per tier" vis-relational-memory.tsv
          grep -Fq "selective threshold calibrated on 256 separate development episodes" vis-relational-memory.tsv
          grep -Fq "bootstrap95_lo_vs_fifo" vis-relational-memory.tsv
          grep -Fq "STRATUM" vis-relational-memory.tsv
          grep -Fq "query_evidence_arrived_out_of_order" vis-relational-memory.tsv
          grep -Fq "profile_high_distractor_rate" vis-relational-memory.tsv
          grep -Fq "profile_high_claim_flip_rate" vis-relational-memory.tsv
          grep -Fq "profile_high_max_delay" vis-relational-memory.tsv
          grep -Fq "profile_high_corruption_rate" vis-relational-memory.tsv
          test "$(grep -c '^held_out' vis-relational-memory.tsv)" -eq 35
          sha256sum vis-relational-memory.tsv > vis-relational-memory.sha256
          sha256sum -c vis-relational-memory.sha256
          cat vis-relational-memory.tsv

      - name: Upload reproducible report
        uses: actions/upload-artifact@v4
        with:
          name: vis-relational-memory-report
          path: |
            vis-relational-memory.tsv
            vis-relational-memory.sha256
          if-no-files-found: error
          retention-days: 14
