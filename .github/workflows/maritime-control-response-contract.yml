name: Maritime Control-Response Contract

on:
  pull_request:
    branches: [research/maritime-control-response-v0-1]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/maritime-control-response/**"
      - ".github/workflows/maritime-control-response-contract.yml"
  push:
    branches: [research/maritime-liu-ice-response-evaluator-v0-1]
    paths:
      - "benchmarks/maritime-control-response/**"
      - ".github/workflows/maritime-control-response-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-control-response-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  protocol-contract:
    name: Validate frozen evidence and benchmark protocols
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate tournament and protocol catalogue
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liu-ice-tournament-v0.1" and
            .status == "protocol_only_not_executed" and
            (.comparators | length == 17) and
            ([.comparators[].id] | unique | length == 17) and
            (.hard_evidence_gates | length >= 90) and
            (.research_targets_not_achieved | length >= 30) and
            ([.research_targets_not_achieved[].status] | all(. == "aspirational")) and
            ([.split_protocols[].row_randomization_allowed] | all(. == false)) and
            (.calibration.minimum_independent_episodes["900000"] == 9) and
            (.calibration.minimum_independent_episodes["950000"] == 19) and
            (.calibration.minimum_independent_episodes["990000"] == 99) and
            (.event_evaluation.schema_version == "liu-ice-event-metrics-v0.1") and
            (.event_evaluation.status == "protocol_only_not_executed") and
            (.event_evaluation.alarm_debounce.minimum_positive_samples == 3) and
            (.event_evaluation.timing.maximum_observation_gap_seconds == 0.10) and
            (.event_evaluation.timing.missing_observation_gaps_count_as_exposure == false) and
            (.shift_matrix.schema_version == "liu-ice-shift-matrix-v0.1") and
            (.shift_matrix.status == "protocol_only_not_executed") and
            (.shift_matrix.axes | length == 6) and
            (.shift_matrix.axes | index("C_SHIFT_DRIVING_CYCLE") != null) and
            (.shift_matrix.axes | index("F_SHIFT_HELD_OUT_FAULT_FAMILY") != null) and
            (.shift_matrix.axes | index("C_PLUS_F_SHIFT") != null) and
            (.shift_matrix.cross_engine_fleet | contains("unsupported")) and
            (.active_evidence_selection.schema_version == "liu-ice-active-evidence-selection-v0.5") and
            (.active_evidence_selection.status == "protocol_only_not_executed") and
            (.active_evidence_selection.comparators | length == 7) and
            (.active_evidence_selection.comparators | index("maximum_worst_case_pairwise_chernoff_information") != null) and
            (.active_evidence_selection.execution_performed == false) and
            (.active_evidence_selection.actuation_authorized == false) and
            (.active_evidence_selection.controlled_perturbations_recommended == 0) and
            (.active_evidence_selection.sequential_updates.status == "single_point_model_updates_supported_multiscenario_updates_blocked") and
            (.streaming_contract.schema_version == "liu-ice-streaming-contract-v0.1") and
            (.streaming_contract.status == "protocol_only_not_executed") and
            (.streaming_contract.one_sample_one_output == true) and
            (.streaming_contract.historical_output_mutation == false) and
            (.streaming_contract.rust_core_direct_submission_compatible == false) and
            (.external_dataset_track.schema_version == "symtropy-marine-external-dataset-track-v0.1") and
            (.external_dataset_track.status == "archive_payload_audited_no_model_evaluation") and
            (.external_dataset_track.dataset_doi == "10.5281/zenodo.19857425") and
            (.external_dataset_track.dataset_license == "CC-BY-4.0") and
            (.external_dataset_track.archive_sha256 == "3fba7aa0c288ae1bc05383fb54bf67cbde209d61b26e3e811d4bc2f22f97442b") and
            (.external_dataset_track.audit_receipt.artifact_id == 13986307496) and
            (.external_dataset_track.dataset_file_inventory.recording_files == 16) and
            (.external_dataset_track.dataset_file_inventory.baseline_files == 1) and
            (.external_dataset_track.dataset_file_inventory.scenario_files == 15) and
            (.external_dataset_track.time_column_mapping.baseline.column == "Time") and
            (.external_dataset_track.time_column_mapping.scenario.column == "Time_rel") and
            (.deployability_matrix.schema_version == "symtropy-industrial-diagnostic-deployability-v0.1") and
            (.deployability_matrix.status == "evidence_matrix_defined_not_executed") and
            (.deployability_matrix.dimensions == 9) and
            (.deployability_matrix.aggregate_readiness_score_allowed == false) and
            (.behavioral_set_diagnosis.schema_version == "symtropy-behavioral-set-diagnosis-v0.1") and
            (.behavioral_set_diagnosis.status == "protocol_only_not_executed") and
            (.startup_adaptation_guard.schema_version == "symtropy-startup-adaptation-guard-v0.1") and
            (.startup_adaptation_guard.status == "protocol_only_not_executed") and
            (.dx2026_boundary_falsification.schema_version == "liu-ice-dx2026-boundary-falsification-v0.1") and
            (.dx2026_boundary_falsification.status == "protocol_only_not_executed") and
            (.sequential_evidence.schema_version == "symtropy-sequential-evidence-v0.1") and
            (.sequential_evidence.status == "protocol_only_not_executed")
          ' benchmarks/maritime-control-response/tournament-v0.1.json >/dev/null

      - name: Validate standalone shift matrix
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liu-ice-shift-matrix-v0.1" and
            .status == "protocol_only_not_executed" and
            (.axes | length == 6) and
            ([.axes[].id] | unique | length == 6) and
            ([.axes[].id] | index("C_SHIFT_DRIVING_CYCLE") != null) and
            ([.axes[].id] | index("F_SHIFT_HELD_OUT_FAULT_FAMILY") != null) and
            ([.axes[].id] | index("C_PLUS_F_SHIFT") != null) and
            (.framing.no_row_randomization == true) and
            (.cross_engine_and_fleet.status | contains("unsupported")) and
            (.hard_gates | length >= 9) and
            ([.axes[].data_status] | all(. != null))
          ' benchmarks/maritime-control-response/shift-matrix-v0.1.json >/dev/null

      - name: Validate active evidence selection
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liu-ice-active-evidence-selection-v0.5" and
            .status == "protocol_only_not_executed" and
            (.comparators | length == 7) and
            ([.comparators[].id] | unique | length == 7) and
            ([.comparators[].id] | index("risk_adjusted_worst_case_eig") != null) and
            ([.comparators[].id] | index("maximum_worst_case_pairwise_chernoff_information") != null) and
            (.candidate_classes.controlled_perturbation.eligible_when == false) and
            (.method.uncertainty_scenarios.eligibility | contains("worst-case")) and
            (.method.sequential_update_policy.status == "single_point_model_updates_supported_multiscenario_updates_blocked") and
            (.method.sequential_update_policy.no_silent_fallback == true) and
            (.hard_gates | length >= 50) and
            ([.research_targets_not_achieved[].status] | all(. == "aspirational")) and
            (.evidence_boundaries.authority_status | contains("external mandatory checks"))
          ' benchmarks/maritime-control-response/active-evidence-selection-v0.1.json >/dev/null

      - name: Validate streaming and behavioral contracts
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liu-ice-streaming-contract-v0.1" and
            .status == "protocol_only_not_executed" and
            (.interface.historical_output_mutation == false) and
            (.stream_invariants.sample_sequence | contains("contiguous")) and
            (.competition_adapter.adapter_status == "not_implemented") and
            (.hard_gates | length >= 10) and
            ([.research_targets_not_achieved[].status] | all(. == "aspirational"))
          ' benchmarks/maritime-control-response/streaming-contract-v0.1.json >/dev/null

          jq -e '
            .schema_version == "symtropy-behavioral-set-diagnosis-v0.1" and
            .status == "protocol_only_not_executed" and
            (.hard_gates | length >= 10) and
            (.global_unique_physical_cause_claim_allowed == false) and
            ([.research_targets_not_achieved[].status] | all(. == "aspirational"))
          ' benchmarks/maritime-control-response/behavioral-set-diagnosis-v0.1.json >/dev/null

          jq -e '
            .schema_version == "symtropy-sequential-evidence-v0.1" and
            .status == "protocol_only_not_executed" and
            (.familywise_control != null) and
            ([.research_targets_not_achieved[].status] | all(. == "aspirational"))
          ' benchmarks/maritime-control-response/sequential-evidence-v0.1.json >/dev/null

          jq -e '
            .schema_version == "symtropy-startup-adaptation-guard-v0.1" and
            .status == "protocol_only_not_executed" and
            (.core_invariant | contains("frozen")) and
            (.hard_gates | length >= 10) and
            ([.research_targets_not_achieved[].status] | all(. == "aspirational"))
          ' benchmarks/maritime-control-response/startup-adaptation-guard-v0.1.json >/dev/null

      - name: Validate published references and deployability matrix
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liu-ice-dx2026-published-graybox-baseline-v0.1" and
            .status == "published_reference_not_reproduced" and
            .official_results.overall.official_score_percent == 88.01 and
            .matched_reproduction.status == "not_reproduced" and
            (.claim_ceiling | contains("not Symtropy results"))
          ' benchmarks/maritime-control-response/published-dx2026-graybox-baseline-v0.1.json >/dev/null

          jq -e '
            .schema_version == "liu-ice-published-six-solution-baselines-v0.1" and
            .status == "literature_reference_not_reproduced" and
            (.solutions | length == 6) and
            (.protocol_context.comparability_warning | contains("TIR")) and
            ([.solutions[].reproduction_status] | all(. == "not_reproduced"))
          ' benchmarks/maritime-control-response/published-six-solution-baselines-v0.1.json >/dev/null

          jq -e '
            .schema_version == "symtropy-industrial-diagnostic-deployability-v0.1" and
            .status == "evidence_matrix_defined_not_executed" and
            (.dimensions | length == 9) and
            (.aggregate_readiness_score_allowed == false) and
            (.overall_status | contains("not_deployable"))
          ' benchmarks/maritime-control-response/deployability-matrix-v0.1.json >/dev/null

          jq -e '
            .schema_version == "symtropy-marine-external-dataset-track-v0.1" and
            .status == "archive_payload_audited_no_model_evaluation" and
            .dataset.doi == "10.5281/zenodo.19857425" and
            .dataset.license == "CC-BY-4.0" and
            .dataset.zenodo_record.file.md5_independently_verified == true and
            .dataset.zenodo_record.file.sha256 == "3fba7aa0c288ae1bc05383fb54bf67cbde209d61b26e3e811d4bc2f22f97442b" and
            .archive_audit_receipt.artifact_id == 13986307496 and
            .evaluation_tracks[0].status == "completed_archive_and_csv_payload_audit" and
            (.evaluation_tracks | length >= 5) and
            (.claim_ceiling | contains("no model accuracy") and contains("cross-engine"))
          ' benchmarks/maritime-control-response/external-marine-engine-dataset-v0.1.json >/dev/null

      - name: Validate run manifest and external file manifest schemas
        run: |
          set -euo pipefail
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            (.required | length == 12) and
            (.properties.run_status.enum | length == 6) and
            (.properties.protocol.required | index("event_evaluation") != null) and
            (.properties.protocol.required | index("shift_matrix_sha256") != null) and
            (.properties.protocol.required | index("active_evidence_selection") != null) and
            (.properties.protocol.required | index("streaming_contract") != null) and
            (.properties.protocol.required | index("external_dataset_track") != null) and
            (.properties.protocol.required | index("deployability_assessment") != null) and
            (.properties.protocol.required | index("behavioral_set_evaluation") != null) and
            (.properties.protocol.required | index("sequential_evidence") != null) and
            (.properties.protocol.properties.active_evidence_selection.properties.schema_version.const == "liu-ice-active-evidence-selection-v0.5") and
            (.properties.protocol.properties.active_evidence_selection.properties.execution_performed.const == false) and
            (.properties.protocol.properties.active_evidence_selection.properties.actuation_authorized.const == false) and
            (.properties.protocol.properties.active_evidence_selection.properties.controlled_perturbations_recommended.const == 0) and
            (.properties.protocol.properties.active_evidence_selection.properties.sequential_update_status.enum | index("multi_scenario_blocked_joint_posterior_missing") != null) and
            (.properties.protocol.properties.active_evidence_selection.properties.joint_scenario_posterior_ledger_sha256.oneOf | length == 2) and
            (.properties.protocol.properties.active_evidence_selection.allOf | length == 2) and
            (.properties.protocol.properties.active_evidence_selection.allOf[0].then.properties.joint_scenario_posterior_ledger_sha256.pattern == "^[a-f0-9]{64}$") and
            (.properties.protocol.properties.active_evidence_selection.allOf[1].then.properties.joint_scenario_posterior_ledger_sha256.type == "null") and
            (.properties.protocol.properties.streaming_contract.properties.historical_output_mutation_count.const == 0) and
            (.properties.protocol.properties.external_dataset_track.properties.cross_engine_or_fleet_claim_allowed.const == false) and
            (.properties.protocol.properties.deployability_assessment.properties.overall_deployability_claim_allowed.const == false) and
            (.properties.protocol.properties.behavioral_set_evaluation.properties.global_unique_physical_cause_claim_allowed.const == false) and
            (.properties.claims.properties.physical_transfer_claim_allowed.const == false)
          ' benchmarks/maritime-control-response/benchmark-run-manifest.schema.json >/dev/null

          jq -e '
            .schema_version == "symtropy-marine-file-manifest-v1" and
            .properties.dataset_doi.const == "10.5281/zenodo.19857425" and
            .properties.dataset_license.const == "CC-BY-4.0" and
            (.properties.files.minItems == 16) and
            (.properties.files.maxItems == 16) and
            (.properties.files.items["$ref"] == "#/$defs/file") and
            (.properties.archive_sha256.pattern == "^[a-f0-9]{64}$")
          ' benchmarks/maritime-control-response/external-dataset-file-manifest.schema.json >/dev/null

      - name: Validate Cargo package identity and locked dependency graph
        run: |
          set -euo pipefail
          test -f benchmarks/maritime-control-response/Cargo.lock
          cargo metadata --format-version 1 --manifest-path benchmarks/maritime-control-response/Cargo.toml --no-deps > "$RUNNER_TEMP/maritime-metadata.json"
          jq -e '
            ([.packages[] | select(.name == "liu-ice-control-response-evaluator" and .version == "0.1.0")] | length == 1)
          ' "$RUNNER_TEMP/maritime-metadata.json" >/dev/null
          grep -q '^version = 4$' benchmarks/maritime-control-response/Cargo.lock

  rust-contract:
    name: Rust format, tests and strict lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: protocol-contract
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/maritime-control-response/Cargo.toml --all -- --check

      - name: Run complete contract suite
        run: cargo test --manifest-path benchmarks/maritime-control-response/Cargo.toml --locked --all-targets

      - name: Run strict Clippy
        run: cargo clippy --manifest-path benchmarks/maritime-control-response/Cargo.toml --locked --all-targets -- -D warnings
