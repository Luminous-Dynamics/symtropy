name: Maritime Control-Response Contract

on:
  pull_request:
    branches: [research/maritime-control-response-v0-1]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/maritime-control-response/**"
      - ".github/workflows/maritime-control-response-contract.yml"
  push:
    branches: [research/maritime-liu-ice-response-evaluator-v0-1]
    paths:
      - "benchmarks/maritime-control-response/**"
      - ".github/workflows/maritime-control-response-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-control-response-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Rust evaluator contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Validate benchmark tournament protocol
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liu-ice-tournament-v0.1" and
            .status == "protocol_only_not_executed" and
            (.comparators | length == 8) and
            ([.comparators[].id] | unique | length == 8) and
            (.hard_evidence_gates | length >= 9) and
            ([.research_targets_not_achieved[].status] | all(. == "aspirational")) and
            ([.split_protocols[].row_randomization_allowed] | all(. == false)) and
            (.calibration.minimum_independent_episodes["900000"] == 9) and
            (.calibration.minimum_independent_episodes["950000"] == 19) and
            (.calibration.minimum_independent_episodes["990000"] == 99)
            and (.inverse_identifiability_protocol.local_sensitivity | contains("dimensionless"))
            and (.inverse_identifiability_protocol.caution | contains("not proof of global uniqueness"))
            and (.operational_metric_definitions.false_unique_root_cause_rate | contains("multiple components"))
            and (.event_evaluation.schema_version == "liu-ice-event-metrics-v0.1")
            and (.event_evaluation.status == "protocol_only_not_executed")
            and (.event_evaluation.alarm_debounce.minimum_positive_samples == 3)
            and (.event_evaluation.timing.maximum_observation_gap_seconds == 0.10)
            and (.event_evaluation.timing.missing_observation_gaps_count_as_exposure == false)
            and ([.research_targets_not_achieved[].status] | all(. == "aspirational"))
          ' benchmarks/maritime-control-response/tournament-v0.1.json >/dev/null

      - name: Validate benchmark run-manifest schema contract
        run: |
          set -euo pipefail
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            (.required | length == 12) and
            (.properties.run_status.enum | length == 6) and
            (.properties.dataset.properties.archive_sha256.oneOf | length == 2) and
            (.properties.protocol.required | index("event_evaluation") != null) and
            (.properties.metrics.properties.false_alarms_per_observed_normal_hour != null) and
            (.properties.claims.properties.physical_transfer_claim_allowed.const == false)
          ' benchmarks/maritime-control-response/benchmark-run-manifest.schema.json >/dev/null

      - name: Validate formatting
        run: cargo fmt --manifest-path benchmarks/maritime-control-response/Cargo.toml --all -- --check

      - name: Run contract tests
        run: cargo test --manifest-path benchmarks/maritime-control-response/Cargo.toml --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/maritime-control-response/Cargo.toml --locked --all-targets -- -D warnings
