name: HAPS Fleet Reliability

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/haps-fleet-reliability/**"
      - "docs/research/aviation/examples/synthetic_haps_fleet_common_cause_reliability_v1.json"
      - "docs/research/aviation/examples/synthetic_haps_fleet_diverse_weather_reliability_v1.json"
      - "docs/research/aviation/examples/synthetic_haps_fleet_cross_layer_common_mode_reliability_v1.json"
      - "docs/research/aviation/examples/synthetic_haps_fleet_30day_availability_v1.json"
      - "docs/research/aviation/examples/synthetic_haps_fleet_30day_airborne_reserve_availability_v1.json"
      - "docs/research/aviation/schemas/haps_fleet_service_availability_v1.schema.json"
      - "docs/research/aviation/schemas/haps_fleet_reliability_case_v1.schema.json"
      - "docs/research/aviation/examples/synthetic_haps_fleet_rotation_capacity_v1.json"
      - "docs/research/aviation/schemas/haps_fleet_rotation_capacity_v1.schema.json"

permissions:
  contents: read

jobs:
  standalone-rust:
    name: Standalone HAPS fleet reliability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/haps-fleet-reliability/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/haps-fleet-reliability/Cargo.toml --all-targets -- -D warnings

      - name: Run unit and fixture-replay tests
        run: cargo test --locked --manifest-path tools/haps-fleet-reliability/Cargo.toml
