name: Grid asset recovery resumable execution

on:
  pull_request:
    paths:
      - "tools/grid-asset-recovery-validator/**"
      - ".github/workflows/grid-asset-recovery-resumable.yml"
  push:
    paths:
      - "tools/grid-asset-recovery-validator/**"
      - ".github/workflows/grid-asset-recovery-resumable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resumable-execution:
    name: Compile, test and replay resumable execution ledger
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Set up Python for schema tests only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Validate Draft 2020-12 schema and synthetic execution fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tools/grid-asset-recovery-validator/fixtures")
          schema = json.loads((root / "resumable-execution-v0.1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(
              schema,
              format_checker=Draft202012Validator.FORMAT_CHECKER,
          )
          fixtures = sorted(root.glob("synthetic-*.json"))
          assert len(fixtures) == 2, f"expected two synthetic execution fixtures, found {len(fixtures)}"
          parsed = {}
          for path in fixtures:
              fixture = json.loads(path.read_text())
              errors = sorted(validator.iter_errors(fixture), key=lambda error: list(error.path))
              assert not errors, f"{path.name}: " + "\\n".join(
                  f"{list(error.path)}: {error.message}" for error in errors
              )
              assert fixture["timeOriginUtc"].endswith("Z")
              assert fixture["asOfHour"] < fixture["horizonEndHour"]
              parsed[path.name] = fixture

          planned = parsed["synthetic-resumable-execution-v0.1.json"]
          assert planned["baselineCommitments"] == planned["proposedCommitments"]
          assert len(planned["events"]) == 1
          assert planned["events"][0]["eventType"] == "work_segment_completed"
          assert planned["plannedSegments"][0]["startHour"] > planned["asOfHour"]
          assert planned["plannedSegments"][0]["interruptionCause"] is None
          assert planned["tasks"][0]["checkpointEffortHours"] == [4, 6]

          progress = parsed["synthetic-progress-reconciliation-v0.1.json"]
          assert progress["baselineCommitments"][0]["version"] == 1
          assert progress["proposedCommitments"][0]["version"] == 2
          assert progress["reconciliations"][0]["action"] == "progress_recorded"
          assert progress["events"][-1]["evidenceStatus"] == "current"
          assert any(event["evidenceStatus"] == "superseded" for event in progress["events"])
          print("PASS: Draft 2020-12 schema validates planned-resume and versioned-progress fixtures")
          PY

      - name: Check Rust formatting
        run: cargo fmt --manifest-path tools/grid-asset-recovery-validator/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/grid-asset-recovery-validator/Cargo.toml --all-targets -- -D warnings

      - name: Run all Rust tests
        run: cargo test --locked --manifest-path tools/grid-asset-recovery-validator/Cargo.toml --all-targets

      - name: Replay the planned multi-shift execution ledger
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path tools/grid-asset-recovery-validator/Cargo.toml \
            --bin multishift-replay -- \
            tools/grid-asset-recovery-validator/fixtures/synthetic-resumable-execution-v0.1.json \
            | tee /tmp/resumable-execution-report.json
          jq -e '
            .resultStatus == "execution_ledger_and_candidate_schedule_consistent"
            and (.tasks | length == 2)
            and ([.tasks[] | select(.taskId == "repair-pump")][0].observedEffortHours == 4.0)
            and ([.tasks[] | select(.taskId == "repair-pump")][0].plannedEffortHours == 4.0)
            and ([.tasks[] | select(.taskId == "repair-pump")][0].remainingEffortHours == 0.0)
          ' /tmp/resumable-execution-report.json

      - name: Replay the versioned progress reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path tools/grid-asset-recovery-validator/Cargo.toml \
            --bin multishift-replay -- \
            tools/grid-asset-recovery-validator/fixtures/synthetic-progress-reconciliation-v0.1.json \
            | tee /tmp/progress-reconciliation-report.json
          jq -e '
            .resultStatus == "execution_ledger_and_candidate_schedule_consistent"
            and (.tasks | length == 2)
            and ([.tasks[] | select(.taskId == "repair-pump")][0].commitmentState == "in_progress")
            and ([.tasks[] | select(.taskId == "repair-pump")][0].observedEffortHours == 7.0)
            and ([.tasks[] | select(.taskId == "repair-pump")][0].remainingEffortHours == 1.0)
          ' /tmp/progress-reconciliation-report.json

