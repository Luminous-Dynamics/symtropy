name: AV Active Sensing Decision-Value Fixture Integrity

on:
  push:
    branches:
      - research/av-active-sensing-decision-value-v0
    paths:
      - "research/av-active-sensing-decision-value-v0/**"
      - ".github/workflows/av-active-sensing-decision-value.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/av-active-sensing-decision-value-v0/**"
      - ".github/workflows/av-active-sensing-decision-value.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: av-active-sensing-decision-value-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fixture-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
      - name: Validate workload and submission schemas
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          base = "research/av-active-sensing-decision-value-v0/"
          workload_schema = json.load(open(base + "schemas/workload-v1.schema.json", encoding="utf-8"))
          submission_schema = json.load(open(base + "schemas/submission-v1.schema.json", encoding="utf-8"))
          score_schema = json.load(open(base + "schemas/scorecard-v1.schema.json", encoding="utf-8"))
          for schema in (workload_schema, submission_schema, score_schema):
              Draft202012Validator.check_schema(schema)
          workload = json.load(open(base + "fixtures/agent/workload-v1.json", encoding="utf-8"))
          truth = json.load(open(base + "fixtures/evaluator-only/action-truth-v1.json", encoding="utf-8"))
          expected = json.load(open(base + "fixtures/expected/known-answer-v1.json", encoding="utf-8"))
          Draft202012Validator(workload_schema).validate(workload)
          ids = [e["episode_id"] for e in workload["episodes"]]
          assert len(ids) == 8 and len(set(ids)) == 8
          assert ids == [e["episode_id"] for e in truth["episodes"]]
          assert ids == [e["episode_id"] for e in expected["episodes"]]
          forbidden = {"optimal_action_ids", "expected_answer", "action_outcomes", "optimal_final_decision", "decision_after", "realized_eig_nats", "evsi"}
          def scan(value):
              if isinstance(value, dict):
                  assert not forbidden.intersection(value.keys()), "evaluator truth leaked into candidate workload"
                  for child in value.values(): scan(child)
              elif isinstance(value, list):
                  for child in value: scan(child)
          scan(workload)
          PY
      - name: Assert causal deadlines and resource bounds
        run: |
          python - <<'PY'
          import json
          p = "research/av-active-sensing-decision-value-v0/fixtures/agent/workload-v1.json"
          data = json.load(open(p, encoding="utf-8"))
          for episode in data["episodes"]:
              task, budget = episode["task"], episode["budget"]
              assert task["deadline_tick"] >= task["query_tick"]
              assert len({a["action_id"] for a in episode["action_catalogue"]}) == len(episode["action_catalogue"])
              for action in episode["action_catalogue"]:
                  cost = action["resource_cost"]
                  assert cost["audio_bytes"] <= budget["max_audio_bytes"]
                  assert cost["video_frames"] <= budget["max_video_frames"]
                  assert cost["energy_joules"] <= budget["max_energy_joules"]
                  assert action["latency_ticks"] >= 0
          PY
