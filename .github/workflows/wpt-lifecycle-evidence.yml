name: WPT Lifecycle Evidence

on:
  push:
    branches: ["main"]
    paths:
      - "research/wpt-lifecycle-evidence-v0/**"
      - "tools/wpt-lifecycle-evidence/**"
      - ".github/workflows/wpt-lifecycle-evidence.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/wpt-lifecycle-evidence-v0/**"
      - "tools/wpt-lifecycle-evidence/**"
      - ".github/workflows/wpt-lifecycle-evidence.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test first-failure survival ledger
        run: cargo test --locked --manifest-path tools/wpt-lifecycle-evidence/Cargo.toml
      - name: Evaluate synthetic censored endurance cohort
        run: cargo run --locked --manifest-path tools/wpt-lifecycle-evidence/Cargo.toml -- research/wpt-lifecycle-evidence-v0/synthetic-contact-cohort.tsv
