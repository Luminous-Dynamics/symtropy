name: orbital observation-surface benchmark v0.1

on:
  pull_request:
    branches:
      - research/orbital-pod-trend-bounds-v0-2
      - research/orbital-observation-surface-identifiability-v0-3
      - research/orbital-decision-identifiability-v0-1
      - research/orbital-loss-regret-frontier-v0-1
      - research/orbital-joint-loss-scenario-v0-1
      - research/orbital-regret-calibration-v0-1
      - research/orbital-feasibility-regret-v0-1
      - research/orbital-feasibility-discovery-v0-1
    paths:
      - "tools/orbital-observation-surface-bench/**"
      - "research/orbital/OBSERVATION_SURFACE_IDENTIFIABILITY_BENCHMARK_V0_3.md"
      - "research/orbital/DECISION_IDENTIFIABILITY_BENCHMARK_V0_1.md"
      - "research/orbital/DECISION_LOSS_REGRET_FRONTIER_BENCHMARK_V0_1.md"
      - "research/orbital/JOINT_LOSS_MODEL_SCENARIO_REGRET_BENCHMARK_V0_1.md"
      - "research/orbital/DECISION_ALIGNED_REGRET_CALIBRATION_BENCHMARK_V0_1.md"
      - "research/orbital/JOINT_FEASIBILITY_AND_REGRET_BENCHMARK_V0_1.md"
      - "research/orbital/FEASIBILITY_DISCOVERY_POLICY_TREE_BENCHMARK_V0_1.md"
      - ".github/workflows/orbital-observation-surface-bench.yml"
  push:
    branches:
      - research/orbital-observation-surface-identifiability-v0-3
      - research/orbital-decision-identifiability-v0-1
      - research/orbital-loss-regret-frontier-v0-1
      - research/orbital-joint-loss-scenario-v0-1
      - research/orbital-regret-calibration-v0-1
      - research/orbital-feasibility-regret-v0-1
      - research/orbital-feasibility-discovery-v0-1

permissions:
  contents: read

concurrency:
  group: orbital-observation-surface-v0-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate frozen corpus against JSON Schema
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/observation-surface-corpus.schema.json \
            tools/orbital-observation-surface-bench/fixtures/v0.1/observation-surface-cases.json
      - name: Verify rustfmt
        run: cargo fmt --manifest-path tools/orbital-observation-surface-bench/Cargo.toml -- --check
      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --all-targets
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --all-targets -- -D warnings
      - name: Generate source-pinned synthetic receipt
        run: |
          mkdir -p artifacts
          cargo run --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --bin orbital-observation-surface-bench -- \
            tools/orbital-observation-surface-bench/fixtures/v0.1/observation-surface-cases.json \
            --source-commit "${GITHUB_SHA}" \
            --observations-output artifacts/observations-v0.1.json > artifacts/observation-surface-receipt-v0.1.json
      - name: Run independent JavaScript oracle
        run: |
          node tools/orbital-observation-surface-bench/tests/reference_oracle.mjs \
            tools/orbital-observation-surface-bench/fixtures/v0.1/observation-surface-cases.json \
            > artifacts/observation-surface-oracle-v0.1.json
      - name: Validate generated receipt against JSON Schema
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/observation-surface-receipt.schema.json \
            artifacts/observation-surface-receipt-v0.1.json
      - name: Validate exported observation stream against JSON Schema
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/observation-stream.schema.json \
            artifacts/observations-v0.1.json
      - name: Compare receipt, oracle and estimator-only stream
        run: |
          node tools/orbital-observation-surface-bench/tests/compare_receipts.mjs \
            artifacts/observation-surface-receipt-v0.1.json \
            artifacts/observation-surface-oracle-v0.1.json \
            artifacts/observations-v0.1.json
      - name: Validate decision-identifiability corpus
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/decision-identifiability-corpus.schema.json \
            tools/orbital-observation-surface-bench/fixtures/v0.1/decision-identifiability-cases.json
      - name: Generate exact finite-world decision receipt
        run: |
          cargo run --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --bin decision-identifiability -- \
            tools/orbital-observation-surface-bench/fixtures/v0.1/decision-identifiability-cases.json \
            --source-commit "${GITHUB_SHA}" > artifacts/decision-identifiability-receipt-v0.1.json
      - name: Run independent JavaScript decision oracle
        run: |
          node tools/orbital-observation-surface-bench/tests/decision_reference_oracle.mjs \
            tools/orbital-observation-surface-bench/fixtures/v0.1/decision-identifiability-cases.json \
            > artifacts/decision-identifiability-oracle-v0.1.json
      - name: Validate decision receipt
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/decision-identifiability-receipt.schema.json \
            artifacts/decision-identifiability-receipt-v0.1.json
      - name: Compare Rust decision receipt with independent oracle
        run: |
          node tools/orbital-observation-surface-bench/tests/compare_decision_receipts.mjs \
            artifacts/decision-identifiability-receipt-v0.1.json \
            artifacts/decision-identifiability-oracle-v0.1.json
      - name: Validate loss and regret corpus
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/decision-regret-frontier-corpus.schema.json \
            tools/orbital-observation-surface-bench/fixtures/v0.1/decision-regret-cases.json
      - name: Generate exact decision loss and regret receipt
        run: |
          cargo run --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --bin decision-regret-frontier -- \
            tools/orbital-observation-surface-bench/fixtures/v0.1/decision-regret-cases.json \
            --source-commit "${GITHUB_SHA}" > artifacts/decision-regret-frontier-receipt-v0.1.json
      - name: Run independent JavaScript decision regret oracle
        run: |
          node tools/orbital-observation-surface-bench/tests/decision_regret_reference_oracle.mjs \
            tools/orbital-observation-surface-bench/fixtures/v0.1/decision-regret-cases.json \
            > artifacts/decision-regret-frontier-oracle-v0.1.json
      - name: Validate decision regret receipt
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/decision-regret-frontier-receipt.schema.json \
            artifacts/decision-regret-frontier-receipt-v0.1.json
      - name: Compare Rust decision regret receipt with independent oracle
        run: |
          node tools/orbital-observation-surface-bench/tests/compare_decision_regret_receipts.mjs \
            artifacts/decision-regret-frontier-receipt-v0.1.json \
            artifacts/decision-regret-frontier-oracle-v0.1.json
      - name: Validate joint loss scenario corpus
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/joint-loss-scenario-corpus.schema.json \
            tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json
      - name: Generate joint loss scenario receipt
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json') != '' }}
        run: |
          cargo run --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --bin joint-loss-scenarios -- \
            tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json \
            --source-commit "${GITHUB_SHA}" > artifacts/joint-loss-scenario-receipt-v0.1.json
      - name: Run independent JavaScript joint loss scenario oracle
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/joint_loss_scenario_oracle.mjs \
            tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json \
            > artifacts/joint-loss-scenario-oracle-v0.1.json
      - name: Validate joint loss scenario receipt
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/joint-loss-scenario-receipt.schema.json \
            artifacts/joint-loss-scenario-receipt-v0.1.json
      - name: Compare Rust joint loss receipt with independent oracle
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/joint-loss-scenarios.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/compare_joint_loss_receipts.mjs \
            artifacts/joint-loss-scenario-receipt-v0.1.json \
            artifacts/joint-loss-scenario-oracle-v0.1.json
      - name: Validate regret calibration corpora
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/regret-calibration-*.json') != '' }}
        run: |
          set -euo pipefail
          for stem in multi-regime small-no-support small-support-bound; do
            node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
              tools/orbital-observation-surface-bench/schema/v0.1/regret-calibration-corpus.schema.json \
              "tools/orbital-observation-surface-bench/fixtures/v0.1/regret-calibration-${stem}.json"
          done
      - name: Generate regret calibration receipts and independent oracles
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/regret-calibration-*.json') != '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for stem in multi-regime small-no-support small-support-bound; do
            cargo run --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --bin regret-calibration -- \
              "tools/orbital-observation-surface-bench/fixtures/v0.1/regret-calibration-${stem}.json" \
              --source-commit "${GITHUB_SHA}" > "artifacts/regret-calibration-${stem}-receipt-v0.1.json"
            node tools/orbital-observation-surface-bench/tests/regret_calibration_oracle.mjs \
              "tools/orbital-observation-surface-bench/fixtures/v0.1/regret-calibration-${stem}.json" \
              > "artifacts/regret-calibration-${stem}-oracle-v0.1.json"
          done
      - name: Validate regret calibration receipts and compare Rust with oracle
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/regret-calibration-*.json') != '' }}
        run: |
          set -euo pipefail
          for stem in multi-regime small-no-support small-support-bound; do
            node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
              tools/orbital-observation-surface-bench/schema/v0.1/regret-calibration-receipt.schema.json \
              "artifacts/regret-calibration-${stem}-receipt-v0.1.json"
            node tools/orbital-observation-surface-bench/tests/compare_regret_calibration_receipts.mjs \
              "artifacts/regret-calibration-${stem}-receipt-v0.1.json" \
              "artifacts/regret-calibration-${stem}-oracle-v0.1.json"
          done
      - name: Validate joint feasibility-regret corpus
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/feasibility-regret-corpus.schema.json \
            tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json
      - name: Generate joint feasibility-regret receipt
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json') != '' }}
        run: |
          mkdir -p artifacts
          cargo run --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --bin feasibility-regret -- \
            tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json \
            --source-commit "${GITHUB_SHA}" > artifacts/feasibility-regret-receipt-v0.1.json
      - name: Run independent joint feasibility-regret oracle
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/feasibility_regret_oracle.mjs \
            tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json \
            > artifacts/feasibility-regret-oracle-v0.1.json
      - name: Validate joint feasibility-regret receipt
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/feasibility-regret-receipt.schema.json \
            artifacts/feasibility-regret-receipt-v0.1.json
      - name: Compare Rust feasibility-regret receipt with independent oracle
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-regret-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/compare_feasibility_regret_receipts.mjs \
            artifacts/feasibility-regret-receipt-v0.1.json \
            artifacts/feasibility-regret-oracle-v0.1.json
      - name: Validate feasibility-discovery corpus
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/feasibility-discovery-corpus.schema.json \
            tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json
      - name: Generate feasibility-discovery receipt
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json') != '' }}
        run: |
          cargo run --locked --manifest-path tools/orbital-observation-surface-bench/Cargo.toml --bin feasibility-discovery -- \
            tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json \
            --source-commit "${GITHUB_SHA}" > artifacts/feasibility-discovery-receipt-v0.1.json
      - name: Run independent feasibility-discovery policy oracle
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/feasibility_discovery_oracle.mjs \
            tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json \
            > artifacts/feasibility-discovery-oracle-v0.1.json
      - name: Validate feasibility-discovery receipt
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/validate_schema.mjs \
            tools/orbital-observation-surface-bench/schema/v0.1/feasibility-discovery-receipt.schema.json \
            artifacts/feasibility-discovery-receipt-v0.1.json
      - name: Compare Rust feasibility-discovery receipt with independent oracle
        if: ${{ hashFiles('tools/orbital-observation-surface-bench/fixtures/v0.1/feasibility-discovery-cases.json') != '' }}
        run: |
          node tools/orbital-observation-surface-bench/tests/compare_feasibility_discovery_receipts.mjs \
            artifacts/feasibility-discovery-receipt-v0.1.json \
            artifacts/feasibility-discovery-oracle-v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-observation-surface-v0.1-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
