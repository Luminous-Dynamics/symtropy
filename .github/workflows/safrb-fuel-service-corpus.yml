name: SAFRB fuel-to-service synthetic corpus qualification

on:
  push:
    branches:
      - research/safrb-fuel-corpus-executable-v0.1
    paths:
      - "tools/safrb-fuel-service-corpus/**"
      - ".github/workflows/safrb-fuel-service-corpus.yml"
  pull_request:
    paths:
      - "tools/safrb-fuel-service-corpus/**"
      - ".github/workflows/safrb-fuel-service-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safrb-fuel-corpus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: SAFRB synthetic corpus Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/safrb-fuel-service-corpus/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path tools/safrb-fuel-service-corpus/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/safrb-fuel-service-corpus/Cargo.toml --all-targets --locked -- -D warnings
      - name: Validate corpus
        run: cargo run --manifest-path tools/safrb-fuel-service-corpus/Cargo.toml --release --locked -- --check
      - name: Emit deterministic JSONL
        run: |
          cargo run --manifest-path tools/safrb-fuel-service-corpus/Cargo.toml --release --locked -- --emit target/safrb-fuel-corpus-v0.1
          test "$(wc -l < target/safrb-fuel-corpus-v0.1/planner-observations.jsonl)" -eq 120
          test "$(wc -l < target/safrb-fuel-corpus-v0.1/oracle-truth.jsonl)" -eq 120
          cd target/safrb-fuel-corpus-v0.1
          sha256sum planner-observations.jsonl oracle-truth.jsonl > SHA256SUMS
          test -s SHA256SUMS
      - name: Retain planner-visible observations
        uses: actions/upload-artifact@v4
        with:
          name: safrb-fuel-service-observations-v0.1
          path: |
            target/safrb-fuel-corpus-v0.1/planner-observations.jsonl
            target/safrb-fuel-corpus-v0.1/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Retain evaluator-only oracle truth
        uses: actions/upload-artifact@v4
        with:
          name: safrb-fuel-service-oracle-truth-v0.1
          path: |
            target/safrb-fuel-corpus-v0.1/oracle-truth.jsonl
            target/safrb-fuel-corpus-v0.1/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
