name: Household Appliance Benchmark Audit

on:
  pull_request:
    branches: ["main", "research/household-appliance-engineering-substrate-v0-1"]
    paths:
      - "docs/tech/HOUSEHOLD_APPLIANCE_ENGINEERING_SUBSTRATE_V0_1.md"
      - "docs/tech/LOW_VOLTAGE_FAN_REFERENCE_ARTICLE_V0_1.md"
      - "docs/tech/LARGE_APPLIANCE_REPAIRABLE_ARCHITECTURE_V0_1.md"
      - "docs/tech/WASHER_REFERENCE_ARCHITECTURE_V0_1.md"
      - "docs/tech/WASHER_ACQUISITION_AND_PARTS_RESILIENCE_V0_1.md"
      - "docs/tech/REPAIRABILITY_ARCHITECTURE_DECISION_ENGINE_V0_1.md"
      - "docs/tech/STAKEHOLDER_CONSTRAINED_REPAIRABILITY_FRONTIERS_V0_1.md"
      - "docs/tech/WASHER_FAULT_TO_REPAIR_BENCHMARK_CURRICULUM_V0_1.md"
      - "docs/tech/CROSS_APPLIANCE_ARCHITECTURE_MORPHOLOGY_AND_HYBRIDS_V0_1.md"
      - "docs/tech/PROOF_CARRYING_REPAIR_OUTCOME_BENCHMARK_V0_1.md"
      - "fixtures/appliances/**"
      - "schemas/appliances/**"
      - "fixtures/household_appliance/**"
      - "tools/household-appliance-bench-audit/**"
      - ".github/workflows/household-appliance-bench-audit.yml"
  push:
    branches:
      - main
      - research/household-appliance-engineering-substrate-v0-1
      - research/large-appliance-repairable-architecture-v0-1
    paths:
      - "docs/tech/HOUSEHOLD_APPLIANCE_ENGINEERING_SUBSTRATE_V0_1.md"
      - "docs/tech/LOW_VOLTAGE_FAN_REFERENCE_ARTICLE_V0_1.md"
      - "docs/tech/LARGE_APPLIANCE_REPAIRABLE_ARCHITECTURE_V0_1.md"
      - "docs/tech/WASHER_REFERENCE_ARCHITECTURE_V0_1.md"
      - "docs/tech/WASHER_ACQUISITION_AND_PARTS_RESILIENCE_V0_1.md"
      - "docs/tech/REPAIRABILITY_ARCHITECTURE_DECISION_ENGINE_V0_1.md"
      - "docs/tech/STAKEHOLDER_CONSTRAINED_REPAIRABILITY_FRONTIERS_V0_1.md"
      - "docs/tech/WASHER_FAULT_TO_REPAIR_BENCHMARK_CURRICULUM_V0_1.md"
      - "docs/tech/CROSS_APPLIANCE_ARCHITECTURE_MORPHOLOGY_AND_HYBRIDS_V0_1.md"
      - "docs/tech/PROOF_CARRYING_REPAIR_OUTCOME_BENCHMARK_V0_1.md"
      - "fixtures/appliances/**"
      - "schemas/appliances/**"
      - "fixtures/household_appliance/**"
      - "tools/household-appliance-bench-audit/**"
      - ".github/workflows/household-appliance-bench-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: household-appliance-bench-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check verifier formatting
        run: cargo fmt --manifest-path tools/household-appliance-bench-audit/Cargo.toml -- --check
      - name: Run schema, semantic and mutation tests
        run: cargo test --manifest-path tools/household-appliance-bench-audit/Cargo.toml --all-targets
      - name: Audit frozen contract corpus and portfolio; emit digest-bound report
        run: >-
          cargo run --manifest-path tools/household-appliance-bench-audit/Cargo.toml --
          --schema schemas/appliances/benchmark_scenario_corpus_v0_1.schema.json
          --corpus fixtures/household_appliance/benchmark_scenarios_v0_1.json
          --portfolio-schema schemas/appliances/large_appliance_repairable_portfolio_v0_1.schema.json
          --portfolio fixtures/appliances/large_appliance_repairable_portfolio_v0_1.json
          --sourcing-schema schemas/appliances/washer_parts_resilience_snapshot_v0_1.schema.json
          --sourcing-snapshot fixtures/appliances/washer_parts_resilience_snapshot_v0_1.json
          --decision-schema schemas/appliances/repairability_architecture_decision_v0_1.schema.json
          --decision-profile fixtures/appliances/repairability_architecture_decision_v0_1.json
          --faults-schema schemas/appliances/washer_fault_to_repair_curriculum_v0_1.schema.json
          --faults-curriculum fixtures/appliances/washer_fault_to_repair_curriculum_v0_1.json
          --morphology-schema schemas/appliances/cross_appliance_architecture_morphology_v0_1.schema.json
          --morphology-portfolio fixtures/appliances/cross_appliance_architecture_morphology_v0_1.json
          --restoration-schema schemas/appliances/repair_restoration_evidence_v0_1.schema.json
          --restoration-ledger fixtures/appliances/repair_restoration_evidence_v0_1.json
