name: AABB Prune Certificates

on:
  pull_request:
    branches: [main]
    paths:
      - "research/aabb-prune-certificates/v0.1/**"
      - ".github/workflows/aabb-prune-certificates.yml"
  push:
    branches: [main, "research/aabb-prune-certificates-v0.1"]
    paths:
      - "research/aabb-prune-certificates/v0.1/**"
      - ".github/workflows/aabb-prune-certificates.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 AABB certificate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/aabb-prune-certificates/v0.1/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/aabb-prune-certificates/v0.1/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/aabb-prune-certificates/v0.1/Cargo.toml --locked --all-targets -- -D warnings
