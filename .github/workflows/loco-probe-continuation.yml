name: LOCO Probe Continuation Verification

on:
  pull_request:
    paths:
      - 'research/loco-probe-continuation-001/**'
      - '.github/workflows/loco-probe-continuation.yml'
  push:
    branches: [main]
    paths:
      - 'research/loco-probe-continuation-001/**'
      - '.github/workflows/loco-probe-continuation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/loco-probe-continuation-001/Cargo.toml -- --check
      - name: Run exact probe prefix and robust continuation fixtures
        run: cargo test --manifest-path research/loco-probe-continuation-001/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/loco-probe-continuation-001/Cargo.toml --locked --all-targets -- -D warnings
