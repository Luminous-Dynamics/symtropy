name: PB-04b Locality Product Qualification

# Immutable-product qualifier for PB-04b locality product
# 72fda03521621c0d781d28237de1e88aa513e1f8.
# Run 34601959759 passed this exact harness lineage after the ancestry-checkout repair.
on:
  push:
    branches:
      - "ci/pb04b-locality-product-qual-72fda035-qual"
    paths:
      - ".github/workflows/pb04b-locality-product-qualification.yml"

permissions:
  contents: read

jobs:
  qualify-product:
    name: Qualify immutable PB-04b locality product
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact repaired harness lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # This annotation commit is intentionally not an evidence subject.
          git merge-base --is-ancestor 12ff763fe6b9e67a691cf900921ed29d37153dd8 HEAD
          git merge-base --is-ancestor 72fda03521621c0d781d28237de1e88aa513e1f8 HEAD
          echo "PB04B_QUAL_HARNESS_HEAD=${GITHUB_SHA}"
          echo "PB04B_QUAL_HARNESS_TREE=$(git rev-parse HEAD^{tree})"

      - name: Checkout immutable PB-04b product
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 72fda03521621c0d781d28237de1e88aa513e1f8
          test "$(git rev-parse HEAD)" = "72fda03521621c0d781d28237de1e88aa513e1f8"
          test "$(git rev-parse HEAD^{tree})" = "e7c9a2dfe87eca7d03980a90791b703cc79548a2"
          test "$(git rev-parse HEAD^)" = "bf229dfd548db3770312d1bbd724f4efc23c98b2"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/Cargo.lock)" = "676fd6a7eb31a2ec00b09c9496b42c568e791556"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/Cargo.toml)" = "614fa7d2e293809faaef10649cf3beb02475c259"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/src/lib.rs)" = "b413c7a9801913acd82475e32148c404dcd290a6"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-decomposition/tests/local_identity.rs)" = "ed347768e3b615921771b51cb5ebe55d03a295d7"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-topology/Cargo.lock)" = "f465ef97074a973eb3bf742a918609f7a06bccc4"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-topology/Cargo.toml)" = "22e4b9ed397b7fd94d5918d0dc26868710794d17"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-topology/src/lib.rs)" = "d0553da04de45f5df6e372b24a5a2fdc4d894b66"
          test "$(git rev-parse HEAD:crates/domains/symtropy-spatial-topology/tests/hostile_projection.rs)" = "79abd90a6aa2c0b6623f75a279a66ff309094926"
          test "$(sha256sum crates/domains/symtropy-spatial-decomposition/Cargo.lock | awk '{print $1}')" = "fb9c8fef69c0cce3a9fc680034e6d8b921a58d561fb1fc2258ff5297cad4f784"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/pb04b-locality-product-target" >> "${GITHUB_ENV}"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Verify and qualify immutable product
        shell: bash
        run: |
          set -euo pipefail
          manifest="crates/domains/symtropy-spatial-decomposition/Cargo.toml"
          rustc -Vv
          cargo -Vv
          rustfmt --version
          cargo clippy --version
          cargo metadata --manifest-path "${manifest}" --locked --format-version 1 > "${RUNNER_TEMP}/pb04b-locality-metadata.json"
          cargo fmt --manifest-path "${manifest}" -- --check
          cargo check --manifest-path "${manifest}" --locked --all-targets
          cargo test --manifest-path "${manifest}" --locked
          cargo clippy --manifest-path "${manifest}" --locked --all-targets -- -D warnings
          test "$(git rev-parse HEAD)" = "72fda03521621c0d781d28237de1e88aa513e1f8"
          test "$(git rev-parse HEAD^{tree})" = "e7c9a2dfe87eca7d03980a90791b703cc79548a2"
          test ! -e crates/domains/symtropy-spatial-decomposition/target
          test -z "$(git status --porcelain --untracked-files=all)"
