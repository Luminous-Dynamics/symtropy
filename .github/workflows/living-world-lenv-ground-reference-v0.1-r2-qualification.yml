name: Living World LENV Ground reference v0.1 r2 exact qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: living-world-lenv-ground-reference-v0-1-r2-q
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'ci/living-world-lenv-ground-reference-v0.1-r2-q'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: e20aadfabfbc774f3c8adff3dbcd56af63c78473
      PRODUCT_SHA: 560411d3c4cb44cb7d2ffaf9c6e85ec5ab33073b
      PRODUCT_TREE: 1503730e1faf46ea911b52b709e816674b20c0f5
      PRODUCT_FILE: crates/domains/symtropy-lifesim-core/tests/ground_that_remembers_reference.rs
      PRODUCT_BLOB: a2ef926ae1083a245015c0cc4105bf7e0de9cc64
      CARGO_TARGET_DIR: /tmp/living-world-lenv-ground-reference-r2-target
      REPORT: /tmp/living-world-lenv-ground-reference-r2-qualification.txt

    steps:
      - name: Checkout literal immutable product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Execute exact Ground theorem
        shell: bash
        run: |
          set -u -o pipefail
          : > "$REPORT"
          rm -rf -- "$CARGO_TARGET_DIR"
          fail=0
          subject_ok=1

          note() { printf '%s\n' "$*" | tee -a "$REPORT"; }
          gate() {
            local name="$1"; shift
            note "BEGIN $name"
            if "$@"; then note "PASS $name"; else local rc=$?; note "FAIL $name rc=$rc"; fail=1; fi
          }

          note "product_sha=$PRODUCT_SHA"
          note "product_tree=$PRODUCT_TREE"
          note "parent_sha=$PARENT_SHA"
          note "product_blob=$PRODUCT_BLOB"
          note "rustc=$(rustc --version)"
          note "cargo=$(cargo --version)"
          note "rustfmt=$(rustfmt --version)"

          if test "$(git rev-parse HEAD)" = "$PRODUCT_SHA" \
            && test "$(git rev-parse HEAD^)" = "$PARENT_SHA" \
            && test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE" \
            && test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = 1 \
            && test "$(git diff --name-status "$PARENT_SHA" "$PRODUCT_SHA")" = $'A\t'"$PRODUCT_FILE" \
            && test "$(git rev-parse HEAD:$PRODUCT_FILE)" = "$PRODUCT_BLOB" \
            && test -z "$(git status --porcelain=v1 --untracked-files=all)" \
            && test ! -e target; then
            note "PASS exact_subject_identity"
            note "PASS build_output_isolation_preflight"
          else
            note "FAIL exact_subject_identity_or_isolation_preflight"
            git status --porcelain=v1 --untracked-files=all | tee -a "$REPORT" || true
            subject_ok=0
            fail=1
          fi

          if test "$subject_ok" -eq 1; then
            gate exact_owned_file_format \
              rustfmt +1.96.0 --edition 2024 --check "$PRODUCT_FILE"
            gate ground_reference_tests \
              cargo test --locked -p symtropy-lifesim-core --test ground_that_remembers_reference
            gate ground_reference_strict_clippy \
              cargo clippy --locked -p symtropy-lifesim-core --test ground_that_remembers_reference -- -D warnings
            gate ground_reference_check \
              cargo check --locked -p symtropy-lifesim-core --test ground_that_remembers_reference
          else
            note "SKIP semantic_gates subject_identity_failed"
          fi

          if test -z "$(git status --porcelain=v1 --untracked-files=all)" \
            && test ! -e target \
            && test -d "$CARGO_TARGET_DIR" \
            && test "$(git rev-parse HEAD)" = "$PRODUCT_SHA" \
            && test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE" \
            && test "$(git rev-parse HEAD:$PRODUCT_FILE)" = "$PRODUCT_BLOB"; then
            note "PASS immutable_postflight"
            note "PASS build_outputs_confined_to_external_target"
          else
            note "FAIL immutable_postflight"
            git status --porcelain=v1 --untracked-files=all | tee -a "$REPORT" || true
            fail=1
          fi

          if test "$fail" -eq 0; then note "RESULT TheoremExecutedPass"; else note "RESULT TheoremExecutedFail"; fi
          exit "$fail"

      - name: Retain exact qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: living-world-lenv-ground-reference-r2-${{ env.PRODUCT_SHA }}
          path: /tmp/living-world-lenv-ground-reference-r2-qualification.txt
          if-no-files-found: error
          retention-days: 30
