name: AERB blind projection and metadata leakage audit

on:
  pull_request:
    paths:
      - "research/mobility-rrvr-aerb-v0.1/evaluator/**"
      - "research/mobility-rrvr-aerb-v0.1/schemas/aerb_metadata_*"
      - "research/mobility-rrvr-aerb-v0.1/fixtures/evaluator_only/metadata_attack_*"
      - "research/mobility-rrvr-aerb-v0.1/schemas/aerb_blind_campaign_report_*"
      - ".github/workflows/aerb-blind-projection-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Install JSON schema and report tooling
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate audit schemas and frozen attack fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/mobility-rrvr-aerb-v0.1"
          jq empty "$ROOT/schemas/aerb_metadata_attack_input_v0_1.schema.json"
          jq empty "$ROOT/schemas/aerb_metadata_audit_output_v0_1.schema.json"
          jq empty "$ROOT/schemas/aerb_blind_campaign_report_v0_1.schema.json"
          jq -e '.schema_version == "aerb-metadata-attack-input-v0.1" and .requested_folds == 4 and (.rows | length == 128) and ([.rows[].evaluator_cluster_id] | unique | length == 64)' "$ROOT/fixtures/evaluator_only/metadata_attack_leak_canary_v0_1.json"
      - name: Rust format check
        run: cargo fmt --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml -- --check
      - name: Locked evaluator tests
        run: cargo test --locked --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path research/mobility-rrvr-aerb-v0.1/evaluator/Cargo.toml --all-targets -- -D warnings
      - name: Execute evaluator-side metadata-only attack canary
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/mobility-rrvr-aerb-v0.1"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cp "$ROOT/fixtures/evaluator_only/metadata_attack_leak_canary_v0_1.json" "$WORK/input.json"
          chmod 600 "$WORK/input.json"
          cargo run --locked --manifest-path "$ROOT/evaluator/Cargo.toml" --bin aerb_metadata_audit -- "$WORK/input.json" "$WORK/report.json"
          jq -e '.report.sample_n == 128 and .report.independent_cluster_n == 64 and .report.combined_metadata_only_accuracy >= 0.95 and .report.combined_metadata_only_balanced_accuracy >= 0.95' "$WORK/report.json"
          test "$(stat -c '%a' "$WORK/report.json")" = "600"
          sha256sum "$WORK/input.json" "$WORK/report.json"
      - name: Reference-policy projection/replay conformance test (not candidate execution)
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          # This v0.1 lane replays a projected reference submission to qualify custody/projection only.
          # It is not a blind candidate run; see Symtropy issue #7886 for the separate input/output-root runtime.
          ROOT="research/mobility-rrvr-aerb-v0.1"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cargo run --locked --manifest-path "$ROOT/evaluator/Cargo.toml" --bin aerb_generate -- 42 32 "$WORK/source-candidate" "$WORK/source-evaluator"
          cargo run --locked --manifest-path "$ROOT/evaluator/Cargo.toml" --bin aerb_blind_materialize -- "$WORK/source-candidate" "$WORK/source-evaluator" "$WORK/blind-candidate" "$WORK/blind-evaluator"
          cargo run --locked --manifest-path "$ROOT/evaluator/Cargo.toml" --bin aerb_blind_campaign_evaluate -- "$WORK/blind-candidate" "$WORK/blind-evaluator" "$WORK/blind-evaluator/blind-evaluator-report.json"
          jq -e '.scheduled_n == 32 and .evaluated_n == 32 and .structurally_invalid_n == 0 and .candidate_contract_valid_n == 32 and .unsafe_fresh_attempt_n == 0 and (.candidate_contract_valid_rate_of_scheduled == 1)' "$WORK/blind-evaluator/blind-evaluator-report.json"
          test "$(stat -c '%a' "$WORK/blind-candidate")" = "700"
          test "$(stat -c '%a' "$WORK/blind-evaluator")" = "700"
          test "$(stat -c '%a' "$WORK/blind-evaluator/blind-evaluator-report.json")" = "600"
          sha256sum "$WORK/blind-candidate/candidate_manifest.json" "$WORK/blind-evaluator/evaluator_manifest.json" "$WORK/blind-evaluator/campaign-custody-seal.json" "$WORK/blind-evaluator/blind-evaluator-report.json"
