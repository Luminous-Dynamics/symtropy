name: Coupled Coulomb exact Sturm root-count oracle

on:
  pull_request:
    paths:
      - "crates/core/symtropy-physics/src/coupled_friction.rs"
      - "crates/core/symtropy-physics/src/coupled_friction_sturm.rs"
      - "crates/core/symtropy-physics/src/coupled_friction_multicontact_sturm.rs"
      - "crates/core/symtropy-physics/src/coupled_friction_sturm_support.rs"
      - "crates/core/symtropy-physics/tests/coupled_friction_multicontact_sturm.rs"
      - "crates/core/symtropy-physics/src/lib.rs"
      - "crates/core/symtropy-physics/Cargo.toml"
      - "Cargo.lock"
      - "docs/research/COUPLED_COULOMB_STURM_ROOT_ORACLE_2026-10-31.md"
      - ".github/workflows/coupled-coulomb-sturm-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-root-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Check formatting of the shared exact verifier sources
        run: |
          rustfmt --edition 2024 --check crates/core/symtropy-physics/src/coupled_friction_sturm_support.rs
          rustfmt --edition 2024 --check crates/core/symtropy-physics/src/coupled_friction_multicontact_sturm.rs
          rustfmt --edition 2024 --check crates/core/symtropy-physics/tests/coupled_friction_multicontact_sturm.rs
      - name: Compile the production physics library
        run: cargo check -p symtropy-physics --lib --locked
      - name: Certify both coupled two-contact slide/stick orientations
        run: cargo test -p symtropy-physics --test coupled_friction_multicontact_sturm --locked
