name: Engineering Scenario Compiler

on:
  pull_request:
    paths:
      - "tools/engineering-scenario-compiler/**"
      - "benchmarks/aero/naca0012-inc-rans/case.toml"
      - ".github/workflows/engineering-scenario-compiler.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/engineering-scenario-compiler/**"
      - "benchmarks/aero/naca0012-inc-rans/case.toml"
      - ".github/workflows/engineering-scenario-compiler.yml"

permissions:
  contents: read

concurrency:
  group: engineering-scenario-compiler-\${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Strict offline compiler (Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Apply pinned rustfmt to standalone compiler sources
        run: cargo fmt --manifest-path tools/engineering-scenario-compiler/Cargo.toml --all

      - name: Verify committed standalone dependency lock
        run: cargo metadata --manifest-path tools/engineering-scenario-compiler/Cargo.toml --format-version 1 --locked > /dev/null

      - name: Test strict compiler and negative corpus
        run: cargo test --manifest-path tools/engineering-scenario-compiler/Cargo.toml --locked

      - name: Clippy standalone compiler
        run: cargo clippy --manifest-path tools/engineering-scenario-compiler/Cargo.toml --all-targets --locked -- -D warnings

      - name: Record pinned toolchain details
        run: rustc --version --verbose

      - name: Measure deterministic compiler latency distribution
        run: cargo bench --manifest-path tools/engineering-scenario-compiler/Cargo.toml --bench compile_latency --locked

      - name: Publish formatted sources and resolved lockfile for commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-scenario-compiler-formatted
          path: |
            tools/engineering-scenario-compiler/Cargo.toml
            tools/engineering-scenario-compiler/Cargo.lock
            tools/engineering-scenario-compiler/README.md
            tools/engineering-scenario-compiler/src/lib.rs
            tools/engineering-scenario-compiler/src/main.rs
          if-no-files-found: error
