name: Two-phase Stefan explicit finite-volume baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/casting-phase-reference/two_phase_fv.rs"
      - "tools/casting-phase-reference/two-phase-fv-README.md"
      - "tools/casting-phase-reference/two-phase-fv-expected.csv"
      - ".github/workflows/casting-phase-two-phase-fv.yml"
  push:
    branches: [main]
    paths:
      - "tools/casting-phase-reference/two_phase_fv.rs"
      - "tools/casting-phase-reference/two-phase-fv-README.md"
      - "tools/casting-phase-reference/two-phase-fv-expected.csv"
      - ".github/workflows/casting-phase-two-phase-fv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run tests with warnings denied
        run: |
          rustc --version
          rustc --edition=2024 -D warnings --test tools/casting-phase-reference/two_phase_fv.rs -o "$RUNNER_TEMP/two-phase-fv-tests"
          "$RUNNER_TEMP/two-phase-fv-tests"
      - name: Build and verify explicit FV solver
        run: |
          rustc --edition=2024 -D warnings tools/casting-phase-reference/two_phase_fv.rs -o "$RUNNER_TEMP/two-phase-fv"
          "$RUNNER_TEMP/two-phase-fv" --verify
      - name: Check deterministic output
        run: |
          "$RUNNER_TEMP/two-phase-fv" --csv > "$RUNNER_TEMP/two-phase-fv-a.csv"
          "$RUNNER_TEMP/two-phase-fv" --csv > "$RUNNER_TEMP/two-phase-fv-b.csv"
          diff -u "$RUNNER_TEMP/two-phase-fv-a.csv" "$RUNNER_TEMP/two-phase-fv-b.csv"
          diff -u tools/casting-phase-reference/two-phase-fv-expected.csv "$RUNNER_TEMP/two-phase-fv-a.csv"
          cat "$RUNNER_TEMP/two-phase-fv-a.csv"
      - name: Emit source and output digests
        run: |
          sha256sum tools/casting-phase-reference/two_phase_fv.rs tools/casting-phase-reference/two-phase-fv-expected.csv "$RUNNER_TEMP/two-phase-fv-a.csv"
