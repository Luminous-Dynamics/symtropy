name: Physical Analytical Adapter

on:
  push:
    branches: ["research/physical-analytical-adapter-v0-1"]
    paths:
      - "research/physical-analytical-adapter/**"
      - "docs/research/PHYSICAL_ANALYTICAL_INTERVAL_METHOD_V0_1.md"
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_ANALYTICAL_VV_ROADMAP_V0_1.md"
      - "research/physical-analytical-adapter/README.md"
      - "schemas/physical-transformation/analytical-fixtures/**"
      - "schemas/physical-transformation/physical-analytical-*.schema.json"
      - "schemas/physical-transformation/physical-solver-capabilities-v0.1.json"
      - "schemas/physical-transformation/physical-solver-capabilities-v0.1.schema.json"
      - "schemas/physical-transformation/physical-solver-dispatch-receipt-v0.1.schema.json"
      - ".github/workflows/physical-analytical-adapter.yml"
      - ".github/workflows/physical-transformation-reference.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/physical-analytical-adapter/**"
      - "docs/research/PHYSICAL_ANALYTICAL_INTERVAL_METHOD_V0_1.md"
      - "research/physical-transformation-reference/**"
      - "docs/research/PHYSICAL_ANALYTICAL_VV_ROADMAP_V0_1.md"
      - "research/physical-analytical-adapter/README.md"
      - "schemas/physical-transformation/analytical-fixtures/**"
      - "schemas/physical-transformation/physical-analytical-*.schema.json"
      - "schemas/physical-transformation/physical-solver-capabilities-v0.1.json"
      - "schemas/physical-transformation/physical-solver-capabilities-v0.1.schema.json"
      - "schemas/physical-transformation/physical-solver-dispatch-receipt-v0.1.schema.json"
      - ".github/workflows/physical-analytical-adapter.yml"
      - ".github/workflows/physical-transformation-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-analytical-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analytical-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Validate request and receipt schema syntax
        shell: bash
        run: |
          set -euo pipefail
          jq empty schemas/physical-transformation/physical-analytical-request-v0.1.schema.json
          jq empty schemas/physical-transformation/physical-analytical-receipt-v0.1.schema.json
          jq empty schemas/physical-transformation/physical-analytical-request-v0.2.schema.json
          jq empty schemas/physical-transformation/physical-analytical-receipt-v0.2.schema.json
          jq empty schemas/physical-transformation/physical-solver-capabilities-v0.1.json
          jq empty schemas/physical-transformation/physical-solver-capabilities-v0.1.schema.json
          jq empty schemas/physical-transformation/physical-solver-dispatch-receipt-v0.1.schema.json
          jq -e '.properties.schema_version.const == "physical-solver-capabilities-v0.1" and (.properties.backends.minItems >= 1)' schemas/physical-transformation/physical-solver-capabilities-v0.1.schema.json
          jq -e '.properties.schema_version.const == "physical-solver-dispatch-receipt-v0.1" and .properties.external_solver_invoked.const == false and (.properties.request_schema_version.enum | index("physical-analytical-request-v0.2") != null)' schemas/physical-transformation/physical-solver-dispatch-receipt-v0.1.schema.json
          jq -e '.backends | length == 1 and .[0].backend_id == "symtropy-analytical-reference" and .[0].dispatch_eligible == true and .[0].real_world_validation_status == "UNRESOLVED"' schemas/physical-transformation/physical-solver-capabilities-v0.1.json
          jq empty schemas/physical-transformation/analytical-fixtures/analytical-bar-v0.1.json
          jq empty schemas/physical-transformation/analytical-fixtures/cantilever-tip-load-v0.1.json
          jq empty schemas/physical-transformation/analytical-fixtures/simply-supported-uniform-load-v0.1.json
          jq empty schemas/physical-transformation/analytical-fixtures/unsupported-fracture-v0.1.json
          jq empty schemas/physical-transformation/analytical-fixtures/analytical-bar-bounds-v0.2.json
          jq empty schemas/physical-transformation/analytical-fixtures/cantilever-zero-crossing-bounds-v0.2.json
          jq empty schemas/physical-transformation/analytical-fixtures/simply-supported-bounds-v0.2.json
          jq -e '.properties.case_id.enum == ["axial_bar","cantilever_tip_load","simply_supported_uniform_load"]' schemas/physical-transformation/physical-analytical-request-v0.1.schema.json
          jq -e '.properties.result_status.enum == ["PASS","UNRESOLVED"] and .properties.evidence_class.const == "analytical_reference"' schemas/physical-transformation/physical-analytical-receipt-v0.1.schema.json
          jq -e '.properties.schema_version.const == "physical-analytical-request-v0.2" and .properties.input_bounds.type == "object"' schemas/physical-transformation/physical-analytical-request-v0.2.schema.json
          jq -e '.properties.schema_version.const == "physical-analytical-receipt-v0.2" and (.required | index("output_intervals") != null)' schemas/physical-transformation/physical-analytical-receipt-v0.2.schema.json

      - name: Check formatting
        run: cargo fmt --manifest-path research/physical-analytical-adapter/Cargo.toml --all -- --check

      - name: Test analytical formulas and negative controls
        run: cargo test --locked --manifest-path research/physical-analytical-adapter/Cargo.toml

      - name: Clippy with warnings denied
        run: cargo clippy --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --all-targets -- -D warnings

      - name: Run all known-answer cases at exact head
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"

          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-analytical-adapter -- \
            --request schemas/physical-transformation/analytical-fixtures/analytical-bar-v0.1.json \
            --adapter-revision "$source_commit" > analytical-adapter-bar-receipt.json
          jq -e --arg revision "$source_commit" '
            .schema_version == "physical-analytical-receipt-v0.1"
            and .result_status == "PASS"
            and .adapter_revision == $revision
            and .case_id == "axial_bar"
            and .outputs.axial_stress_pa > 99999
            and .outputs.axial_stress_pa < 100001
            and .outputs.axial_strain > 0
            and .outputs.extension_m > 0
            and (.request_sha256 | test("^[0-9a-f]{64}$"))
          ' analytical-adapter-bar-receipt.json

          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-analytical-adapter -- \
            --request schemas/physical-transformation/analytical-fixtures/cantilever-tip-load-v0.1.json \
            --adapter-revision "$source_commit" > analytical-adapter-cantilever-receipt.json
          jq -e '
            .result_status == "PASS"
            and .case_id == "cantilever_tip_load"
            and .outputs.tip_deflection_m > 0
            and .outputs.maximum_bending_stress_pa > 2499999
          ' analytical-adapter-cantilever-receipt.json

          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-analytical-adapter -- \
            --request schemas/physical-transformation/analytical-fixtures/simply-supported-uniform-load-v0.1.json \
            --adapter-revision "$source_commit" > analytical-adapter-simply-supported-receipt.json
          jq -e '
            .result_status == "PASS"
            and .case_id == "simply_supported_uniform_load"
            and .outputs.midspan_deflection_m > 0.00208
            and .outputs.midspan_deflection_m < 0.00209
            and .outputs.maximum_bending_stress_pa > 24999999
            and .outputs.maximum_bending_stress_pa < 25000001
          ' analytical-adapter-simply-supported-receipt.json

          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-analytical-adapter -- \
            --request schemas/physical-transformation/analytical-fixtures/unsupported-fracture-v0.1.json \
            --adapter-revision "$source_commit" > analytical-adapter-unsupported-receipt.json
          jq -e '
            .result_status == "UNRESOLVED"
            and .outputs == null
            and (.physics_omitted | index("fracture") != null)
            and (.diagnostics | length > 0)
          ' analytical-adapter-unsupported-receipt.json


          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-analytical-adapter -- \
            --request schemas/physical-transformation/analytical-fixtures/analytical-bar-bounds-v0.2.json \
            --adapter-revision "$source_commit" > analytical-adapter-bar-bounds-receipt.json
          jq -e --arg revision "$source_commit" '
            .schema_version == "physical-analytical-receipt-v0.2"
            and .result_status == "PASS"
            and .adapter_revision == $revision
            and .case_id == "axial_bar"
            and .input_bounds.force_n.evidence_class == "synthetic"
            and .outputs.axial_stress_pa == .output_intervals.axial_stress_pa.nominal
            and .output_intervals.axial_stress_pa.lower <= .outputs.axial_stress_pa
            and .outputs.axial_stress_pa <= .output_intervals.axial_stress_pa.upper
            and .output_intervals.axial_stress_pa.unit == "Pa"
            and (.output_intervals.axial_stress_pa.lower < .output_intervals.axial_stress_pa.upper)
            and (.interval_semantics | contains("not a probability distribution"))
          ' analytical-adapter-bar-bounds-receipt.json

          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-analytical-adapter -- \
            --request schemas/physical-transformation/analytical-fixtures/cantilever-zero-crossing-bounds-v0.2.json \
            --adapter-revision "$source_commit" > analytical-adapter-cantilever-bounds-receipt.json
          jq -e '
            .schema_version == "physical-analytical-receipt-v0.2"
            and .result_status == "PASS"
            and .case_id == "cantilever_tip_load"
            and .output_intervals.maximum_bending_stress_pa.lower == 0
            and .output_intervals.maximum_bending_stress_pa.upper > 0
          ' analytical-adapter-cantilever-bounds-receipt.json


          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-analytical-adapter -- \
            --request schemas/physical-transformation/analytical-fixtures/simply-supported-bounds-v0.2.json \
            --adapter-revision "$source_commit" > analytical-adapter-simply-supported-bounds-receipt.json
          jq -e '
            .schema_version == "physical-analytical-receipt-v0.2"
            and .result_status == "PASS"
            and .case_id == "simply_supported_uniform_load"
            and .outputs.midspan_deflection_m == .output_intervals.midspan_deflection_m.nominal
            and .output_intervals.midspan_deflection_m.lower <= .outputs.midspan_deflection_m
            and .outputs.midspan_deflection_m <= .output_intervals.midspan_deflection_m.upper
            and .output_intervals.maximum_bending_stress_pa.lower <= .outputs.maximum_bending_stress_pa
            and .outputs.maximum_bending_stress_pa <= .output_intervals.maximum_bending_stress_pa.upper
          ' analytical-adapter-simply-supported-bounds-receipt.json


      - name: Run allowlisted dispatch receipts at exact head
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"

          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-solver-dispatch -- \
            --request schemas/physical-transformation/analytical-fixtures/analytical-bar-v0.1.json \
            --dispatcher-revision "$source_commit" \
            --adapter-revision "$source_commit" > physical-solver-dispatch-selected-receipt.json
          jq -e --arg revision "$source_commit" '
            .schema_version == "physical-solver-dispatch-receipt-v0.1"
            and .request_schema_version == "physical-analytical-request-v0.1"
            and .dispatcher_revision == $revision
            and .selection_status == "SELECTED"
            and .evaluation_status == "PASS"
            and .selected_backend.backend_id == "symtropy-analytical-reference"
            and .selected_backend.qualification_tier == "closed_form_equation_contract"
            and .model_evaluation_attempted == true
            and .external_solver_invoked == false
            and .outputs.axial_stress_pa > 99999
            and .outputs.axial_stress_pa < 100001
            and (.manifest_sha256 | test("^[0-9a-f]{64}$"))
            and .adapter_receipt.result_status == "PASS"
          ' physical-solver-dispatch-selected-receipt.json


          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-solver-dispatch -- \
            --request schemas/physical-transformation/analytical-fixtures/analytical-bar-bounds-v0.2.json \
            --dispatcher-revision "$source_commit" \
            --adapter-revision "$source_commit" > physical-solver-dispatch-bounded-receipt.json
          jq -e --arg revision "$source_commit" '
            .schema_version == "physical-solver-dispatch-receipt-v0.1"
            and .request_schema_version == "physical-analytical-request-v0.2"
            and .dispatcher_revision == $revision
            and .selection_status == "SELECTED"
            and .evaluation_status == "PASS"
            and .adapter_receipt.schema_version == "physical-analytical-receipt-v0.2"
            and .outputs.axial_stress_pa == .adapter_receipt.output_intervals.axial_stress_pa.nominal
            and .adapter_receipt.output_intervals.axial_stress_pa.lower <= .outputs.axial_stress_pa
            and .outputs.axial_stress_pa <= .adapter_receipt.output_intervals.axial_stress_pa.upper
            and .external_solver_invoked == false
          ' physical-solver-dispatch-bounded-receipt.json

          cargo run --quiet --locked --manifest-path research/physical-analytical-adapter/Cargo.toml --bin physical-solver-dispatch -- \
            --request schemas/physical-transformation/analytical-fixtures/unsupported-fracture-v0.1.json \
            --dispatcher-revision "$source_commit" \
            --adapter-revision "$source_commit" > physical-solver-dispatch-unresolved-receipt.json
          jq -e '
            .selection_status == "UNRESOLVED"
            and .evaluation_status == "NOT_EVALUATED"
            and .selected_backend == null
            and .outputs == null
            and .model_evaluation_attempted == false
            and .external_solver_invoked == false
            and (.physics_omitted | index("fracture") != null)
            and .adapter_receipt == null
          ' physical-solver-dispatch-unresolved-receipt.json

      - name: Upload analytical reference receipts
        uses: actions/upload-artifact@v4
        with:
          name: physical-analytical-adapter-receipts
          path: |
            analytical-adapter-*-receipt.json
            physical-solver-dispatch-*-receipt.json
          if-no-files-found: error
          retention-days: 90
