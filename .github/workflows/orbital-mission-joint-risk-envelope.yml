name: Orbital Mission Joint Risk Envelope

on:
  push:
    branches:
      - research/orbital-mission-joint-risk-envelope-v0-1-2026-11-25
    paths:
      - benchmarks/orbital-conjunction/rare-event-kernel/**
      - .github/workflows/orbital-mission-joint-risk-envelope.yml
  pull_request:
    branches:
      - research/orbital-pathwise-proposal-bridge-v0-1-2026-11-25
    paths:
      - benchmarks/orbital-conjunction/rare-event-kernel/**
      - .github/workflows/orbital-mission-joint-risk-envelope.yml
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbital-mission-risk-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finite-support-mission-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch or pull request head
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/orbital-conjunction/rare-event-kernel/Cargo.toml -- --check
      - name: Run exact finite-support tests
        run: cargo test --manifest-path benchmarks/orbital-conjunction/rare-event-kernel/Cargo.toml --all-targets
      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path benchmarks/orbital-conjunction/rare-event-kernel/Cargo.toml --all-targets -- -D warnings
