name: Living World LENV owner response v0 qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify-owner-response-reference:
    name: Qualify exact LENV owner response reference subject
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: 2c5de7b1d5f0f38317924ba69cd15a545694c3c6
      PARENT_SHA: 9522a85ec4baade6dd99a34923a9c1a27baf60ba
      PRODUCT_FILE: crates/domains/symtropy-lifesim-core/tests/owner_response_reference.rs
      CARGO_TARGET_DIR: /tmp/living-world-lenv-owner-response-v0-target
    steps:
      - name: Checkout exact product subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert exact one-file product scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git diff --name-status "$PARENT_SHA" "$PRODUCT_SHA")" = $'A\t'"$PRODUCT_FILE"
          git hash-object Cargo.lock | tee /tmp/cargo-lock.before
          git rev-parse HEAD^{tree} | tee /tmp/tree.before

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Check exact-file formatting
        run: rustfmt --edition 2024 --check "$PRODUCT_FILE"

      - name: Execute owner response reference tests
        run: cargo test --locked -p symtropy-lifesim-core --test owner_response_reference

      - name: Strict focused Clippy
        run: cargo clippy --locked -p symtropy-lifesim-core --test owner_response_reference -- -D warnings

      - name: Focused dependency check
        run: cargo check --locked -p symtropy-lifesim-core --test owner_response_reference

      - name: Assert immutable exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/tree.before)"
          test "$(git hash-object Cargo.lock)" = "$(cat /tmp/cargo-lock.before)"
          git diff --exit-code
          git diff --cached --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'unexpected untracked files:\n%s\n' "$untracked"
            exit 1
          fi
