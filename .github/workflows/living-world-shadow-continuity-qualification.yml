name: Living World Shadow Continuity Format Oracle

on:
  pull_request:
    paths:
      - '.github/workflows/living-world-shadow-continuity-qualification.yml'

permissions:
  contents: read

concurrency:
  group: living-world-shadow-continuity-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Exact rustfmt oracle
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 59cee313afae1ad184d1b8382088eac2616822c9
      TARGET_FILE: crates/domains/symtropy-lifesim-core/src/living_world_authority/shadow_execution_continuity.rs

    steps:
      - name: Check out immutable product subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
          printf 'PRODUCT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PRODUCT_TREE=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Set up pinned Rust formatter
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Format exact product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          test -n "$(git diff -- "$TARGET_FILE")"
          cp "$TARGET_FILE" "$RUNNER_TEMP/shadow_execution_continuity.rs"
          sha256sum "$RUNNER_TEMP/shadow_execution_continuity.rs"
          git diff --check

      - name: Upload exact formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lw55-rustfmt-output
          path: ${{ runner.temp }}/shadow_execution_continuity.rs
          if-no-files-found: error
          retention-days: 1
