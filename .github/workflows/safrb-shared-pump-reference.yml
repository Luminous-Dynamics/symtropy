name: SAFRB shared-pump known-answer

on:
  push:
    branches:
      - research/safrb-shared-pump-reference-v0.1
    paths:
      - "benchmarks/fuel-resilience/shared-pump/**"
      - ".github/workflows/safrb-shared-pump-reference.yml"
  pull_request:
    paths:
      - "benchmarks/fuel-resilience/shared-pump/**"
      - ".github/workflows/safrb-shared-pump-reference.yml"

permissions:
  contents: read

concurrency:
  group: safrb-shared-pump-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-known-answer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Verify fixture JSON syntax
        run: |
          python3 -m json.tool benchmarks/fuel-resilience/shared-pump/SAFRB_SHARED_PUMP_KNOWN_ANSWER_V0_1.json > /dev/null
          python3 -m json.tool benchmarks/fuel-resilience/shared-pump/SAFRB_SHARED_PUMP_KNOWN_ANSWER_V0_1.schema.json > /dev/null
      - name: Run independent standard-library verifier
        run: |
          python3 benchmarks/fuel-resilience/shared-pump/verify_shared_pump.py benchmarks/fuel-resilience/shared-pump/SAFRB_SHARED_PUMP_KNOWN_ANSWER_V0_1.json
