name: SIM-REL-050 Hierarchical Benchmark Inference PR Qualification

on:
  pull_request:
    branches:
      - research/sim-rel-049-adaptive-benchmark-split-firewall-2026-11-02
    paths:
      - "tools/sim-rel-action-realization-filter/src/decision_value.rs"
      - "tools/sim-rel-action-realization-filter/src/decision_value/**"
      - "tools/sim-rel-action-realization-filter/HIERARCHICAL_BENCHMARK_INFERENCE_PROTOCOL.md"
      - ".github/workflows/sim-rel-050-hierarchical-inference-pr.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: concept/recipe hierarchy, exact inference, release binding, full suite and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Isolate Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/sim-rel-050-hierarchical-target" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Verify formatting
        run: cargo fmt --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml -- --check
      - name: Focused hierarchical inference tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib decision_value::hierarchical_benchmark_inference
      - name: Full locked crate tests
        run: cargo test --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/sim-rel-action-realization-filter/Cargo.toml --lib -- -D warnings
      - name: Verify exact PR head and clean tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
