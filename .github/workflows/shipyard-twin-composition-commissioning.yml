name: Shipyard Twin Composition Commissioning

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-twin-composition-commissioning/**"
      - "docs/tech/SHIPYARD_TWIN_COMPOSITION_COMMISSIONING_V0_1*"
      - ".github/workflows/shipyard-twin-composition-commissioning.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-twin-composition-commissioning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify synthetic twin composition and commissioning contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-twin-composition-commissioning/Cargo.toml --all -- --check

      - name: Run composition commissioning tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-twin-composition-commissioning/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-twin-composition-commissioning/Cargo.toml --all-targets -- -D warnings

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
