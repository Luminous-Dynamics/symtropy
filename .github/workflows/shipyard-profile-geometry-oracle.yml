name: Shipyard Registered Profile Geometry Oracle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/shipyard-profile-geometry-oracle/**"
      - "docs/tech/SHIPYARD_PROFILE_GEOMETRY_ORACLE_V0_1*"
      - ".github/workflows/shipyard-profile-geometry-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-profile-geometry-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify registered 2D profile metric contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/shipyard-profile-geometry-oracle/Cargo.toml --all -- --check
      - name: Run profile metric tests
        run: cargo test --locked --manifest-path crates/tools/shipyard-profile-geometry-oracle/Cargo.toml
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/shipyard-profile-geometry-oracle/Cargo.toml --all-targets -- -D warnings
      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
