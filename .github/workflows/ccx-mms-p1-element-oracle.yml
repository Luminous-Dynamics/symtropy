name: CCX MMS P1 triangle element oracle

on:
  pull_request:
    paths:
      - ".github/workflows/ccx-mms-p1-element-oracle.yml"
      - "research/ccx-mms-p1-001-element-oracle/**"
      - "research/ccx-mms-p1-001-mesh/**"
      - "research/ccx-mms-p1-001-oracle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccx-mms-p1-element-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  element-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: research/ccx-mms-p1-001-element-oracle
        run: cargo fmt --all -- --check

      - name: Run element algebra and patch tests
        working-directory: research/ccx-mms-p1-001-element-oracle
        run: cargo test --locked --all-targets

      - name: Run strict Clippy
        working-directory: research/ccx-mms-p1-001-element-oracle
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Generate and repeat patch receipt
        working-directory: research/ccx-mms-p1-001-element-oracle
        env:
          MMS_BENCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MMS_BENCH_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          export MMS_BENCH_CHECKOUT_SHA="$checkout_sha"
          sha256sum \
            src/lib.rs \
            src/bin/triangle-patch-probe.rs \
            src/bin/triangle-conditioning-probe.rs \
            src/bin/triangle-material-conditioning-probe.rs \
            src/bin/triangle-global-condition-probe.rs \
            src/bin/triangle-global-pcg-probe.rs \
            Cargo.toml \
            Cargo.lock \
            README.md \
            ../ccx-mms-p1-001-mesh/src/lib.rs \
            ../ccx-mms-p1-001-mesh/Cargo.toml \
            ../ccx-mms-p1-001-mesh/Cargo.lock \
            ../ccx-mms-p1-001-oracle/src/lib.rs \
            ../ccx-mms-p1-001-oracle/Cargo.toml \
            ../ccx-mms-p1-001-oracle/Cargo.lock \
            ../physical-solver-contract/fixtures/ccx-mms-p1-001/problem.json \
            ../../docs/research/PHYS_CCX_MMS_P1_CONVERGENCE_001.md \
            ../../.github/workflows/ccx-mms-p1-element-oracle.yml \
            > /tmp/element-oracle-source-digests.sha256
          cargo run --locked --release --quiet --bin triangle-patch-probe > /tmp/triangle-patch-a.json
          cargo run --locked --release --quiet --bin triangle-patch-probe > /tmp/triangle-patch-b.json
          cmp /tmp/triangle-patch-a.json /tmp/triangle-patch-b.json
          jq -e '.solver_executed == false and .qualification_pass == false and .element_patch_pass == true and .max_energy_identity_defect <= 1e-12 and (.source_sha | test("^[0-9a-f]{40}$")) and (.checkout_sha | test("^[0-9a-f]{40}$"))' /tmp/triangle-patch-a.json > /dev/null
          sha256sum /tmp/triangle-patch-a.json > /tmp/triangle-patch-a.sha256
          cargo run --locked --release --quiet --bin triangle-conditioning-probe > /tmp/triangle-conditioning-a.json
          cargo run --locked --release --quiet --bin triangle-conditioning-probe > /tmp/triangle-conditioning-b.json
          cmp /tmp/triangle-conditioning-a.json /tmp/triangle-conditioning-b.json
          jq -e '
            .schema == "ccx-mms-p1-geometry-conditioning-v2"
            and .solver_executed == false
            and .qualification_pass == false
            and .geometry_conditioning_pass == true
            and (.sweep | length == 5)
            and (.source_sha | test("^[0-9a-f]{40}$"))
            and (.checkout_sha | test("^[0-9a-f]{40}$"))
            and .sweep[0].mean_ratio_quality > .sweep[1].mean_ratio_quality
            and .sweep[1].mean_ratio_quality > .sweep[2].mean_ratio_quality
            and .sweep[2].mean_ratio_quality > .sweep[3].mean_ratio_quality
            and .sweep[3].mean_ratio_quality > .sweep[4].mean_ratio_quality
            and .sweep[0].dimensionless_gradient_amplification < .sweep[1].dimensionless_gradient_amplification
            and .sweep[1].dimensionless_gradient_amplification < .sweep[2].dimensionless_gradient_amplification
            and .sweep[2].dimensionless_gradient_amplification < .sweep[3].dimensionless_gradient_amplification
            and .sweep[3].dimensionless_gradient_amplification < .sweep[4].dimensionless_gradient_amplification
            and .sweep[0].element_nonrigid_condition_number < .sweep[1].element_nonrigid_condition_number
            and .sweep[1].element_nonrigid_condition_number < .sweep[2].element_nonrigid_condition_number
            and .sweep[2].element_nonrigid_condition_number < .sweep[3].element_nonrigid_condition_number
            and .sweep[3].element_nonrigid_condition_number < .sweep[4].element_nonrigid_condition_number
            and .sweep[4].element_nonrigid_condition_number > 1e7
          ' /tmp/triangle-conditioning-a.json > /dev/null
          sha256sum /tmp/triangle-conditioning-a.json > /tmp/triangle-conditioning-a.sha256
          cargo run --locked --release --quiet --bin triangle-material-conditioning-probe > /tmp/triangle-material-conditioning-a.json
          cargo run --locked --release --quiet --bin triangle-material-conditioning-probe > /tmp/triangle-material-conditioning-b.json
          cmp /tmp/triangle-material-conditioning-a.json /tmp/triangle-material-conditioning-b.json
          jq -e '
            .schema == "ccx-mms-p1-material-conditioning-v1"
            and .solver_executed == false
            and .volumetric_locking_measured == false
            and .qualification_pass == false
            and .material_conditioning_pass == true
            and (.sweep | length == 4)
            and (.source_sha | test("^[0-9a-f]{40}$"))
            and (.checkout_sha | test("^[0-9a-f]{40}$"))
            and .sweep[0].poisson_ratio < .sweep[1].poisson_ratio
            and .sweep[1].poisson_ratio < .sweep[2].poisson_ratio
            and .sweep[2].poisson_ratio < .sweep[3].poisson_ratio
            and .sweep[0].lambda_over_mu < .sweep[1].lambda_over_mu
            and .sweep[1].lambda_over_mu < .sweep[2].lambda_over_mu
            and .sweep[2].lambda_over_mu < .sweep[3].lambda_over_mu
            and .sweep[0].element_nonrigid_condition_number < .sweep[1].element_nonrigid_condition_number
            and .sweep[1].element_nonrigid_condition_number < .sweep[2].element_nonrigid_condition_number
            and .sweep[2].element_nonrigid_condition_number < .sweep[3].element_nonrigid_condition_number
            and .sweep[3].lambda_over_mu > 1e4
            and .sweep[3].element_nonrigid_condition_number > 1e4
          ' /tmp/triangle-material-conditioning-a.json > /dev/null
          sha256sum /tmp/triangle-material-conditioning-a.json > /tmp/triangle-material-conditioning-a.sha256
          cargo run --locked --release --quiet --bin triangle-global-condition-probe > /tmp/triangle-global-condition-a.json
          cargo run --locked --release --quiet --bin triangle-global-condition-probe > /tmp/triangle-global-condition-b.json
          cmp /tmp/triangle-global-condition-a.json /tmp/triangle-global-condition-b.json
          jq -e '
            .schema == "ccx-mms-p1-global-condition-v1"
            and .solver_executed == false
            and .qualification_pass == false
            and .global_conditioning_pass == true
            and (.sweep | length == 5)
            and (.source_sha | test("^[0-9a-f]{40}$"))
            and (.checkout_sha | test("^[0-9a-f]{40}$"))
            and .sweep[0].cells_per_side == 2
            and .sweep[1].cells_per_side == 3
            and .sweep[2].cells_per_side == 4
            and .sweep[3].cells_per_side == 5
            and .sweep[4].cells_per_side == 6
            and .sweep[0].free_dof_count == 2
            and .sweep[1].free_dof_count == 8
            and .sweep[2].free_dof_count == 18
            and .sweep[3].free_dof_count == 32
            and .sweep[4].free_dof_count == 50
            and .sweep[0].smallest_eigenvalue > 0
            and .sweep[1].smallest_eigenvalue > 0
            and .sweep[2].smallest_eigenvalue > 0
            and .sweep[3].smallest_eigenvalue > 0
            and .sweep[4].smallest_eigenvalue > 0
            and .sweep[0].constrained_global_condition_number < .sweep[1].constrained_global_condition_number
            and .sweep[1].constrained_global_condition_number < .sweep[2].constrained_global_condition_number
            and .sweep[2].constrained_global_condition_number < .sweep[3].constrained_global_condition_number
            and .sweep[3].constrained_global_condition_number < .sweep[4].constrained_global_condition_number
            and .sweep[4].constrained_global_condition_number > 20
          ' /tmp/triangle-global-condition-a.json > /dev/null
          sha256sum /tmp/triangle-global-condition-a.json > /tmp/triangle-global-condition-a.sha256
          cargo run --locked --release --quiet --bin triangle-global-pcg-probe > /tmp/triangle-global-pcg-a.json
          cargo run --locked --release --quiet --bin triangle-global-pcg-probe > /tmp/triangle-global-pcg-b.json
          cmp /tmp/triangle-global-pcg-a.json /tmp/triangle-global-pcg-b.json
          jq -e '
            .schema == "ccx-mms-p1-global-pcg-v1"
            and .solver_executed == false
            and .qualification_pass == false
            and .solver_diagnostics_pass == true
            and .relative_residual_tolerance == 1e-10
            and (.source_sha | test("^[0-9a-f]{40}$"))
            and (.checkout_sha | test("^[0-9a-f]{40}$"))
            and (.sweep | length == 10)
            and .sweep[0].mesh_family == "uniform"
            and .sweep[1].mesh_family == "uniform"
            and .sweep[2].mesh_family == "uniform"
            and .sweep[3].mesh_family == "uniform"
            and .sweep[4].mesh_family == "uniform"
            and .sweep[5].mesh_family == "quadratic-graded"
            and .sweep[6].mesh_family == "quadratic-graded"
            and .sweep[7].mesh_family == "quadratic-graded"
            and .sweep[8].mesh_family == "quadratic-graded"
            and .sweep[9].mesh_family == "quadratic-graded"
            and .sweep[0].cells_per_side == 2
            and .sweep[1].cells_per_side == 3
            and .sweep[2].cells_per_side == 4
            and .sweep[3].cells_per_side == 5
            and .sweep[4].cells_per_side == 6
            and .sweep[5].cells_per_side == 2
            and .sweep[6].cells_per_side == 3
            and .sweep[7].cells_per_side == 4
            and .sweep[8].cells_per_side == 5
            and .sweep[9].cells_per_side == 6
            and .sweep[0].free_dof_count == 2
            and .sweep[1].free_dof_count == 8
            and .sweep[2].free_dof_count == 18
            and .sweep[3].free_dof_count == 32
            and .sweep[4].free_dof_count == 50
            and .sweep[5].free_dof_count == 2
            and .sweep[6].free_dof_count == 8
            and .sweep[7].free_dof_count == 18
            and .sweep[8].free_dof_count == 32
            and .sweep[9].free_dof_count == 50
            and all(.sweep[]; .condition_number_unscaled >= 1 and .condition_number_unscaled < 1e12)
            and all(.sweep[]; .condition_number_jacobi_scaled >= 1 and .condition_number_jacobi_scaled < 1e12)
            and all(.sweep[]; .cg_relative_residual <= 1e-10 and .pcg_relative_residual <= 1e-10)
            and all(.sweep[]; .cg_iterations <= (if .free_dof_count * 4 < 32 then 32 else .free_dof_count * 4 end))
            and all(.sweep[]; .pcg_iterations <= (if .free_dof_count * 4 < 32 then 32 else .free_dof_count * 4 end))
            and all(.sweep[0:5][]; (.condition_number_jacobi_scaled / .condition_number_unscaled) >= 0.95 and (.condition_number_jacobi_scaled / .condition_number_unscaled) <= 1.05)
            and .sweep[9].condition_number_jacobi_scaled < (.sweep[9].condition_number_unscaled * 0.75)
          ' /tmp/triangle-global-pcg-a.json > /dev/null
          sha256sum /tmp/triangle-global-pcg-a.json > /tmp/triangle-global-pcg-a.sha256

      - name: Preserve verification receipt and source digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccx-mms-p1-element-oracle-receipt
          path: |
            /tmp/triangle-patch-a.json
            /tmp/triangle-patch-a.sha256
            /tmp/element-oracle-source-digests.sha256
            /tmp/triangle-conditioning-a.json
            /tmp/triangle-conditioning-a.sha256
            /tmp/triangle-material-conditioning-a.json
            /tmp/triangle-material-conditioning-a.sha256
            /tmp/triangle-global-condition-a.json
            /tmp/triangle-global-condition-a.sha256
            /tmp/triangle-global-pcg-a.json
            /tmp/triangle-global-pcg-a.sha256
          if-no-files-found: ignore
          retention-days: 90

      - name: Ensure lockfile stayed unchanged
        run: git diff --exit-code -- research/ccx-mms-p1-001-element-oracle/Cargo.lock
