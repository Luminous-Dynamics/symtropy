name: Terrain golden kernel rebind qualification

on:
  push:
    branches:
      - test/terrain-golden-kernel-rebind-v0.1
    paths:
      - .github/workflows/terrain-golden-kernel-rebind-qualification.yml
      - crates/domains/symtropy-terrain/tests/geometry_authority_golden.rs

permissions:
  contents: read

concurrency:
  group: terrain-golden-kernel-rebind-v0.1
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify test-only golden rebind
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact test-only lineage
        shell: bash
        run: |
          set -euo pipefail
          base=8172eb7a29997e566b88938b95e12fac0d4c9ded
          test_commit=a2161d9cb13fce24899f345822f4919439b4053e
          test_path=crates/domains/symtropy-terrain/tests/geometry_authority_golden.rs
          workflow=.github/workflows/terrain-golden-kernel-rebind-qualification.yml
          kernel=crates/domains/symtropy-terrain/src/geometry_kernel.rs
          manifest=crates/domains/symtropy-terrain/Cargo.toml

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${test_commit}"
          test "$(git rev-parse HEAD^^)" = "${base}"
          test "$(git rev-parse HEAD:${kernel})" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          test "$(git rev-parse HEAD:${manifest})" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          actual="$(git diff --name-only ${base}..HEAD | sort)"
          expected="$(printf '%s\n' "${test_path}" "${workflow}" | sort)"
          test "${actual}" = "${expected}"
          echo "TERRAIN_GOLDEN_REBIND_HEAD=${GITHUB_SHA}"
          echo "TERRAIN_GOLDEN_REBIND_TEST_BLOB=$(git rev-parse HEAD:${test_path})"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/terrain-golden-rebind-target" >> "${GITHUB_ENV}"

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          test "$(cargo --version | awk '{print $2}')" = "1.96.0"

      - name: Check exact Terrain package including all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p symtropy-terrain --locked --all-targets

      - name: Execute rebound external golden vectors
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked --test geometry_authority_golden -- --nocapture

      - name: Execute complete Terrain tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked --all-targets

      - name: Strict Terrain Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p symtropy-terrain --locked --all-targets -- -D warnings

      - name: Unchanged-subject postflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/Cargo.toml)" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          echo "TERRAIN_GOLDEN_KERNEL_REBIND_STATUS=PASS"
          echo "claim=test-only rebind of stale external golden vectors to the already-qualified pure kernel; no live-provider or geometry-grammar change"
