name: HAPS Fleet Continuity
on:
  pull_request:
    paths:
      - "tools/haps-fleet-continuity/**"
      - "docs/research/aviation/schemas/haps_fleet_continuity_case_v1.schema.json"
      - "docs/research/aviation/examples/synthetic_haps_fleet_continuity_30day_v1.json"
      - ".github/workflows/haps-fleet-continuity.yml"
  push:
    branches:
      - main
    paths:
      - "tools/haps-fleet-continuity/**"
      - "docs/research/aviation/schemas/haps_fleet_continuity_case_v1.schema.json"
      - "docs/research/aviation/examples/synthetic_haps_fleet_continuity_30day_v1.json"
      - ".github/workflows/haps-fleet-continuity.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/haps-fleet-continuity
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Replay committed fixture
        run: cargo run -- ../../docs/research/aviation/examples/synthetic_haps_fleet_continuity_30day_v1.json
