name: Factory Process Model Assurance

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/factory-process-model-assurance/**"
      - ".github/workflows/factory-process-model-assurance.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/factory-process-model-assurance/**"
      - ".github/workflows/factory-process-model-assurance.yml"

concurrency:
  group: factory-process-model-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  obligation-trace-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path tools/factory-process-model-assurance/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/factory-process-model-assurance/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/factory-process-model-assurance/Cargo.toml --all-targets
      - name: Deterministic reference-trace replay
        run: cargo run --quiet --manifest-path tools/factory-process-model-assurance/Cargo.toml --bin factory-process-model-assurance > /tmp/factory-process-model-assurance.tsv
      - name: Verify task coverage and blocked reference case count
        shell: bash
        run: |
          test "$(wc -l < /tmp/factory-process-model-assurance.tsv)" -eq 19
          test "$(grep -c $'\ttrue$' /tmp/factory-process-model-assurance.tsv)" -eq 18
