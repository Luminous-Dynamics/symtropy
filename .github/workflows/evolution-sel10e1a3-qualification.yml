name: Evolution SEL-10E1A3 Qualification

on:
  push:
    branches:
      - "ci/evolution-sel10e1a3-qualification-v0.1"

permissions:
  contents: read

env:
  PRODUCT_HEAD: 901e8bd2f3ae23a561bf588afee608846655f69a

jobs:
  qualify:
    name: Frozen SEL-10E1A3 / Rust 1.96
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact product subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_HEAD }}
          fetch-depth: 1
      - name: Assert executed subject
        run: test "$(git rev-parse HEAD)" = "${PRODUCT_HEAD}"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Isolate species-concept stack
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/species-stack"
          rm -rf "${root}"
          mkdir -p "${root}"
          cp -R crates/domains/symtropy-evolution-core "${root}/symtropy-evolution-core"
          cp -R crates/domains/symtropy-species-concept "${root}/symtropy-species-concept"
          cp -R crates/domains/symtropy-species-concept-relations "${root}/symtropy-species-concept-relations"
      - name: Check relation formatting
        id: fmt
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept-relations
        run: cargo fmt --all -- --check
      - name: Check relation all targets
        id: check
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept-relations
        run: cargo check --all-targets
      - name: Run semantic relation corpus
        id: main
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept-relations
        run: cargo test --test species_concept_relations_v1
      - name: Run semantic relation hardening corpus
        id: hardening
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept-relations
        run: cargo test --test species_concept_relations_hardening_v1
      - name: Run inverse canonicalization corpus
        id: canonicalization
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept-relations
        run: cargo test --test species_concept_relations_canonicalization_v1
      - name: Run all relation tests
        id: all_tests
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept-relations
        run: cargo test --all-targets
      - name: Run strict relation Clippy
        id: clippy
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept-relations
        run: cargo clippy --all-targets -- -D warnings
      - name: Run frozen descriptor stack
        id: descriptor
        working-directory: ${{ runner.temp }}/species-stack/symtropy-species-concept
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Run frozen E1 concept-authority corpora
        id: e1
        working-directory: ${{ runner.temp }}/species-stack/symtropy-evolution-core
        run: |
          cargo test --test species_concept_authority_v1
          cargo test --test species_concept_authority_hardening_v1
      - name: Emit receipt
        if: always()
        shell: bash
        env:
          HELPER_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          MAIN: ${{ steps.main.outcome }}
          HARDENING: ${{ steps.hardening.outcome }}
          CANONICALIZATION: ${{ steps.canonicalization.outcome }}
          ALL_TESTS: ${{ steps.all_tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          DESCRIPTOR: ${{ steps.descriptor.outcome }}
          E1: ${{ steps.e1.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          keys = ["FMT", "CHECK", "MAIN", "HARDENING", "CANONICALIZATION", "ALL_TESTS", "CLIPPY", "DESCRIPTOR", "E1"]
          outcomes = {k.lower(): os.environ.get(k, "unknown") for k in keys}
          receipt = {
              "receipt_version": 1,
              "qualification": "SEL-10E1A3-species-concept-semantic-relations",
              "product_head": os.environ["PRODUCT_HEAD"],
              "helper_head": os.environ["HELPER_HEAD"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "step_outcomes": outcomes,
              "overall": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "claim_boundary": "semantic relation representation/replay only; PotentiallyNonNested is not independence; no cross-model robustness, species status, nomenclature, or universal taxonomy truth",
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "sel10e1a3-qualification.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(receipt, f, sort_keys=True, indent=2); f.write("\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          sha256sum "${RUNNER_TEMP}/sel10e1a3-qualification.json" > "${RUNNER_TEMP}/sel10e1a3-qualification.json.sha256"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sel10e1a3-${{ env.PRODUCT_HEAD }}
          path: |
            ${{ runner.temp }}/sel10e1a3-qualification.json
            ${{ runner.temp }}/sel10e1a3-qualification.json.sha256
          if-no-files-found: error
          retention-days: 30
