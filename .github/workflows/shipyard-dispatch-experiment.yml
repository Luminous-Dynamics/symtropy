name: Shipyard dispatch experiment adapter

on:
  push:
    paths:
      - "tools/shipyard-observed-dispatch/**"
      - "tools/shipyard-dispatch-audit/**"
      - "tools/shipyard-dispatch-experiment/**"
      - ".github/workflows/shipyard-dispatch-experiment.yml"
  pull_request:
    paths:
      - "tools/shipyard-observed-dispatch/**"
      - "tools/shipyard-dispatch-audit/**"
      - "tools/shipyard-dispatch-experiment/**"
      - ".github/workflows/shipyard-dispatch-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-dispatch-experiment-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Check formatting for all three crates
        run: |
          cargo fmt --manifest-path tools/shipyard-observed-dispatch/Cargo.toml -- --check
          cargo fmt --manifest-path tools/shipyard-dispatch-audit/Cargo.toml -- --check
          cargo fmt --manifest-path tools/shipyard-dispatch-experiment/Cargo.toml -- --check

      - name: Test observed-history policy crate offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-observed-dispatch/Cargo.toml

      - name: Test independent evaluator crate offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-dispatch-audit/Cargo.toml

      - name: Test policy-to-evaluator integration and result ledger offline
        run: cargo test --locked --offline --manifest-path tools/shipyard-dispatch-experiment/Cargo.toml

      - name: Compile synthetic comparison example
        run: cargo check --locked --offline --manifest-path tools/shipyard-dispatch-experiment/Cargo.toml --examples

      - name: Run four-rule example and verify JSONL result ledger
        shell: bash
        run: |
          cargo run --locked --offline --manifest-path tools/shipyard-dispatch-experiment/Cargo.toml --example compare_synthetic_rules > /tmp/shipyard-result-ledger.jsonl
          test "$(wc -l < /tmp/shipyard-result-ledger.jsonl)" -eq 4
          jq -s -e 'length == 4 and all(.[]; .schema_version == "shipyard-result-ledger-record-v0" and .feasibility_scope == "abstract-unary-resource-time-v0")' /tmp/shipyard-result-ledger.jsonl
          jq -s -e '[.[].policy_id] | sort == ["critical_ratio","earliest_due_date","fixed_order","least_slack"]' /tmp/shipyard-result-ledger.jsonl

      - name: Lint all targets with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-dispatch-experiment/Cargo.toml --all-targets -- -D warnings
