name: Shipyard dispatch and paired benchmark experiment

on:
  push:
    paths:
      - "tools/shipyard-observed-dispatch/**"
      - "tools/shipyard-dispatch-audit/**"
      - "tools/shipyard-dispatch-experiment/**"
      - "tools/shipyard-dispatch-benchmark/**"
      - ".github/workflows/shipyard-dispatch-experiment.yml"
  pull_request:
    paths:
      - "tools/shipyard-observed-dispatch/**"
      - "tools/shipyard-dispatch-audit/**"
      - "tools/shipyard-dispatch-experiment/**"
      - "tools/shipyard-dispatch-benchmark/**"
      - ".github/workflows/shipyard-dispatch-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-dispatch-experiment-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path tools/shipyard-observed-dispatch/Cargo.toml -- --check
          cargo fmt --manifest-path tools/shipyard-dispatch-audit/Cargo.toml -- --check
          cargo fmt --manifest-path tools/shipyard-dispatch-experiment/Cargo.toml -- --check
          cargo fmt --manifest-path tools/shipyard-dispatch-benchmark/Cargo.toml -- --check

      - name: Test policies, independent evaluator, ledger, and corpus
        run: |
          cargo test --locked --offline --manifest-path tools/shipyard-observed-dispatch/Cargo.toml
          cargo test --locked --offline --manifest-path tools/shipyard-dispatch-audit/Cargo.toml
          cargo test --locked --offline --manifest-path tools/shipyard-dispatch-experiment/Cargo.toml
          cargo test --locked --offline --manifest-path tools/shipyard-dispatch-benchmark/Cargo.toml

      - name: Compile benchmark CLI
        run: cargo check --locked --offline --manifest-path tools/shipyard-dispatch-benchmark/Cargo.toml

      - name: Lint full dependency graph with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-dispatch-benchmark/Cargo.toml --all-targets -- -D warnings

      - name: Generate paired corpus and verify all evidence digests
        shell: bash
        run: |
          rm -rf /tmp/shipyard-paired-benchmark
          cargo run --locked --offline --manifest-path tools/shipyard-dispatch-benchmark/Cargo.toml -- \
            --episodes 16 --seed 20261024 --out /tmp/shipyard-paired-benchmark \
            --policy-revision "$GITHUB_SHA" --evaluator-revision "$GITHUB_SHA"
          test "$(wc -l < /tmp/shipyard-paired-benchmark/results.jsonl)" -eq 64
          jq -e '.corpus_contract_version == "shipyard-paired-benchmark-corpus-v0" and .episode_count == 16 and (.episodes | length) == 16' /tmp/shipyard-paired-benchmark/benchmark-manifest.json
          jq -e '.receipt_contract_version == "shipyard-benchmark-run-receipt-v0" and .artifact_count == 164 and .budget_contract == "not_enforced; runtime comparisons prohibited"' /tmp/shipyard-paired-benchmark/run-receipt.json
          jq -s -e 'length == 64 and all(.[]; .ledger_contract_version == "shipyard-result-ledger-v0" and .synthetic_example == true and (.status == "incomplete" or .status == "invalid_input" or .status == "invalid_candidate"))' /tmp/shipyard-paired-benchmark/results.jsonl
          jq -s -e 'group_by(.episode_id) | all(.[]; length == 4 and ([.[].input_digests.method_config_sha256] | unique | length) == 4)' /tmp/shipyard-paired-benchmark/results.jsonl
          jq -e '(.comparisons | length) > 0 and ([.episode_coverage[].partition] | unique | sort) == ["development","held_out"]' /tmp/shipyard-paired-benchmark/paired-comparison-summary.json
          test "$(find /tmp/shipyard-paired-benchmark -type f -name 'method-config-*.json' | wc -l)" -eq 4
          test "$(find /tmp/shipyard-paired-benchmark -type f -name 'candidate-schedule-*.json' | wc -l)" -eq 64
          test "$(find /tmp/shipyard-paired-benchmark -type f -name 'independent-audit-*.json' | wc -l)" -eq 64
          test "$(find /tmp/shipyard-paired-benchmark -type f -name 'initial-state-*.json' | wc -l)" -eq 16
          test "$(find /tmp/shipyard-paired-benchmark -type f -name 'disturbance-tape-*.json' | wc -l)" -eq 16
          while IFS=$'	' read -r method_digest candidate_digest audit_digest; do
            test "$(sha256sum "/tmp/shipyard-paired-benchmark/method-config-$method_digest.json" | cut -d ' ' -f 1)" = "$method_digest"
            test "$(sha256sum "/tmp/shipyard-paired-benchmark/candidate-schedule-$candidate_digest.json" | cut -d ' ' -f 1)" = "$candidate_digest"
            test "$(sha256sum "/tmp/shipyard-paired-benchmark/independent-audit-$audit_digest.json" | cut -d ' ' -f 1)" = "$audit_digest"
          done < <(jq -r '[.artifact_digests.method_config_sha256, .artifact_digests.candidate_schedule_sha256, .artifact_digests.independent_audit_sha256] | @tsv' /tmp/shipyard-paired-benchmark/results.jsonl)
          sha256sum /tmp/shipyard-paired-benchmark/benchmark-manifest.json /tmp/shipyard-paired-benchmark/results.jsonl /tmp/shipyard-paired-benchmark/paired-comparison-summary.json /tmp/shipyard-paired-benchmark/run-receipt.json

      - name: Retain deterministic benchmark smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-paired-benchmark-${{ github.sha }}
          path: /tmp/shipyard-paired-benchmark/**
          if-no-files-found: ignore
          retention-days: 14