name: Manufacturing Digital Twin Commissioning Contract

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/tools/manufacturing-dt-commissioning/**"
      - "docs/tech/MANUFACTURING_DT_COMMISSIONING_V0_1*"
      - ".github/workflows/manufacturing-dt-commissioning.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manufacturing-dt-commissioning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify task-scoped federated twin readiness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/tools/manufacturing-dt-commissioning/Cargo.toml --all -- --check

      - name: Run readiness contract tests
        run: cargo test --locked --manifest-path crates/tools/manufacturing-dt-commissioning/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --manifest-path crates/tools/manufacturing-dt-commissioning/Cargo.toml --all-targets -- -D warnings

      - name: Confirm verifier did not modify tracked inputs
        run: git diff --exit-code
