name: Magnetic As-Built Acceptance

on:
  pull_request:
    paths:
      - "research/magnetics/as-built-acceptance/**"
      - ".github/workflows/magnetic-asbuilt-acceptance.yml"
  push:
    paths:
      - "research/magnetics/as-built-acceptance/**"
      - ".github/workflows/magnetic-asbuilt-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    name: evaluator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/magnetics/as-built-acceptance/evaluator/Cargo.toml -- --check

      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/magnetics/as-built-acceptance/evaluator/Cargo.toml --all-targets -- -D warnings

      - name: Run evaluator tests
        run: cargo test --manifest-path research/magnetics/as-built-acceptance/evaluator/Cargo.toml
