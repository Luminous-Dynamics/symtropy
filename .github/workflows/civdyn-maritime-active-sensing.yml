name: CIVDYN maritime active-sensing reference

on:
  pull_request:
    paths:
      - "research/civdyn-active-sensing/**"
      - ".github/workflows/civdyn-maritime-active-sensing.yml"
  push:
    branches:
      - "research/civdyn-maritime-observation-recourse-v0-1"
    paths:
      - "research/civdyn-active-sensing/**"
      - ".github/workflows/civdyn-maritime-active-sensing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civdyn-maritime-active-sensing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-active-sensing/Cargo.toml --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --all-targets -- -D warnings
      - name: Compile
        run: cargo check --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --all-targets
      - name: Run tests
        run: cargo test --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --all-targets
      - name: Verify deterministic known-answer output
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin maritime-active-sensing > /tmp/maritime-active-sensing.csv
          cargo run --quiet --locked --manifest-path research/civdyn-active-sensing/Cargo.toml --bin maritime-active-sensing > /tmp/maritime-active-sensing-replay.csv
          cmp /tmp/maritime-active-sensing.csv /tmp/maritime-active-sensing-replay.csv
          grep -q '^no_observation,EVALUATED,NO_NEW_EVIDENCE,0,0,0,0,0,1,70,0,false,' /tmp/maritime-active-sensing.csv
          grep -q '^shared_tos_signal,EVALUATED,ADVISORY_ONLY_NO_INDEPENDENT_CORROBORATION,1,1,0,3,1,2,71,-1,false,' /tmp/maritime-active-sensing.csv
          grep -q '^independent_field_inspection,EVALUATED,INDEPENDENT_OBSERVATION_CANDIDATE_NOT_DELIVERY_PROOF,2,1,1,3,5,3,5,65,true,' /tmp/maritime-active-sensing.csv
          grep -q '^unknown_dependency_feed,BLOCKED_UNKNOWN_DEPENDENCY,' /tmp/maritime-active-sensing.csv
          grep -q '^potentially_correlated_feed,BLOCKED_POTENTIALLY_CORRELATED,' /tmp/maritime-active-sensing.csv
          grep -q '^revoked_dependency_feed,BLOCKED_REVOKED_DEPENDENCY,' /tmp/maritime-active-sensing.csv
          grep -q '^ambiguous_event_camera,BLOCKED_AMBIGUOUS_ASSOCIATION,' /tmp/maritime-active-sensing.csv
          grep -q '^unmatched_event_receipt,BLOCKED_UNMATCHED_ASSOCIATION,' /tmp/maritime-active-sensing.csv
          grep -q '^stale_field_sensor,BLOCKED_STALE_EVIDENCE,' /tmp/maritime-active-sensing.csv
          grep -q '^overbudget_independent_audit,OVER_BUDGET,' /tmp/maritime-active-sensing.csv
          echo "Maritime active-sensing known-answer contract passed."
