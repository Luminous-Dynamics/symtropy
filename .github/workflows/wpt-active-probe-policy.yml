name: WPT Active Probe Policy

on:
  push:
    branches: ["main"]
    paths:
      - "research/wpt-active-probe-policy-v0/**"
      - "tools/wpt-active-probe-policy/**"
      - ".github/workflows/wpt-active-probe-policy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "research/wpt-active-probe-policy-v0/**"
      - "tools/wpt-active-probe-policy/**"
      - ".github/workflows/wpt-active-probe-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test adaptive probe-policy solver
        run: cargo test --locked --manifest-path tools/wpt-active-probe-policy/Cargo.toml
      - name: Evaluate frozen synthetic decision-tree case
        run: cargo run --locked --manifest-path tools/wpt-active-probe-policy/Cargo.toml -- research/wpt-active-probe-policy-v0/synthetic-actions.tsv
