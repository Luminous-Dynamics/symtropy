name: Two-contact coupled Coulomb multiple-solution witness

on:
  pull_request:
    paths:
      - "crates/core/symtropy-physics/src/lib.rs"
      - "crates/core/symtropy-physics/src/coupled_friction_two_contact_witness.rs"
      - "docs/research/COULOMB_TWO_CONTACT_MULTIROOT_WITNESS_2026-10-31.md"
      - ".github/workflows/coupled-coulomb-two-contact-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-contact-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Check formatting of the new witness source
        run: rustfmt --edition 2024 --check crates/core/symtropy-physics/tests/coupled_friction_two_contact_witness.rs
      - name: Validate coupled two-contact witness
        run: cargo test -p symtropy-physics --test coupled_friction_two_contact_witness --locked
      - name: Re-run single-contact coupled Coulomb reference
        run: cargo test -p symtropy-physics --lib coupled_friction::tests --locked
