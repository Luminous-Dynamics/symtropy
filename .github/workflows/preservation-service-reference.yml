name: preservation-service-reference isolated qualification

on:
  pull_request:
    paths:
      - 'research/physical-storage/preservation-service-reference/**'
      - 'research/physical-storage/preservation-service-reference/Cargo.lock'
      - '.github/workflows/preservation-service-reference.yml'
  push:
    branches: ["main"]
    paths:
      - 'research/physical-storage/preservation-service-reference/**'
      - 'research/physical-storage/preservation-service-reference/Cargo.lock'
      - '.github/workflows/preservation-service-reference.yml'

permissions:
  contents: read

jobs:
  rust:
    name: preservation-service-reference (Rust 1.96.0)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      MANIFEST: research/physical-storage/preservation-service-reference/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Exact tested commit: $actual"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --locked --manifest-path "$MANIFEST" -- --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Draft 2020-12 schemas and frozen fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          pairs = [
              ("research/physical-storage/preservation_service_workloads_v0_1.schema.json", "research/physical-storage/fixtures/preservation_service_workloads_v0_1.json"),
              ("research/physical-storage/preservation_service_receipts_v0_1.schema.json", "research/physical-storage/fixtures/preservation_service_receipts_v0_1.json"),
              ("research/physical-storage/preservation_migration_receipts_v0_1.schema.json", "research/physical-storage/fixtures/preservation_migration_receipts_v0_1.json"),
          ]
          for schema_path, fixture_path in pairs:
              schema = json.loads(Path(schema_path).read_text())
              fixture = json.loads(Path(fixture_path).read_text())
              assert schema.get("$schema") == "https://json-schema.org/draft/2020-12/schema", schema_path
              Draft202012Validator.check_schema(schema)
              errors = sorted(
                  Draft202012Validator(schema).iter_errors(fixture),
                  key=lambda error: list(map(str, error.absolute_path)),
              )
              if errors:
                  for error in errors:
                      print(f"{fixture_path}: {list(error.absolute_path)}: {error.message}")
                  raise SystemExit(1)
              print(f"VALID Draft 2020-12: {fixture_path}")
          PY
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --manifest-path "$MANIFEST" --all-targets
