name: Net additionality and circular rebound benchmark

on:
  pull_request:
    paths:
      - "tools/net-additionality-benchmark/**"
      - "docs/research/CIRC_BUILD_NET_ADDITIONALITY_V0_1.md"
      - ".github/workflows/net-additionality-benchmark.yml"
  push:
    paths:
      - "tools/net-additionality-benchmark/**"
      - "docs/research/CIRC_BUILD_NET_ADDITIONALITY_V0_1.md"
      - ".github/workflows/net-additionality-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-net-additionality:
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/net-additionality-benchmark/Cargo.toml -- --check
      - name: Run independent-reference and hostile-input tests
        run: cargo test --manifest-path tools/net-additionality-benchmark/Cargo.toml
      - name: Emit exact-source additionality receipt
        run: cargo run --manifest-path tools/net-additionality-benchmark/Cargo.toml
