name: A0 R2 Clippy Diagnostic

on:
  pull_request:
    branches: [ "design/d2-requirement-traceability-r2-v0.1" ]

permissions:
  contents: write

concurrency:
  group: a0-r2-clippy-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: analysis/a0-analysis-evidence-contracts-r2-v0.1
  D2_HEAD: 366dd29ae74b4aed411517497c5ce7799f2dc79c
  LEGACY_A0_HEAD: a80aa06d9b3f9ef0031d69b326d387ec2383cc13
  TRANSFORM_BLOB: 2ce1df21822064b53c02a7a1b4ebf2d7e2774c57
  CARGO_TARGET_DIR: /tmp/symtropy-a0-r2-clippy-diagnostic-target

jobs:
  diagnose:
    name: Reproduce exact A0 strict Clippy diagnostic
    runs-on: ubuntu-24.04
    steps:
      - name: Check out frozen A0 product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact historical A0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.LEGACY_A0_HEAD }}
          path: legacy-a0
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact runner tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: true
          fetch-depth: 0

      - name: Bind exact diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$D2_HEAD"
          test "$(git -C legacy-a0 rev-parse HEAD)" = "$LEGACY_A0_HEAD"
          test "$(git -C runner-tools hash-object .github/repair/a0_rederive_analysis_r2.py)" = "$TRANSFORM_BLOB"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Recreate exact A0 source
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/a0_rederive_analysis_r2.py ../legacy-a0
          cargo fmt -p symtropy-analysis-contracts
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Capture strict A0 Clippy diagnostic
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --message-format=short --locked --manifest-path product/Cargo.toml -p symtropy-analysis-contracts --all-targets -- -D warnings > /tmp/a0-clippy.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/a0-clippy-status
          cat /tmp/a0-clippy.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record hosted diagnostic on disposable runner branch
        if: steps.clippy.outputs.status != '0'
        shell: bash
        env:
          RUNNER_BRANCH: ${{ github.event.pull_request.head.ref }}
          RUNNER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          diagnostic=.github/diagnostics/a0-r2-clippy.txt
          if test -f "runner-tools/$diagnostic"; then
            echo "Hosted diagnostic already recorded at $diagnostic"
            exit 0
          fi

          git -C runner-tools fetch origin "+refs/heads/$RUNNER_BRANCH:refs/remotes/origin/$RUNNER_BRANCH"
          remote_head="$(git -C runner-tools rev-parse "refs/remotes/origin/$RUNNER_BRANCH")"
          test "$remote_head" = "$RUNNER_HEAD"
          test "$(git -C runner-tools rev-parse HEAD)" = "$RUNNER_HEAD"

          mkdir -p "runner-tools/.github/diagnostics"
          {
            printf 'runner_head=%s\n' "$RUNNER_HEAD"
            printf 'product_parent=%s\n' "$D2_HEAD"
            printf 'legacy_a0=%s\n' "$LEGACY_A0_HEAD"
            printf 'transform_blob=%s\n' "$TRANSFORM_BLOB"
            printf 'rust=1.96.0\n'
            printf 'command=cargo clippy --message-format=short --locked --manifest-path product/Cargo.toml -p symtropy-analysis-contracts --all-targets -- -D warnings\n'
            printf '\n'
            cat /tmp/a0-clippy.log
          } > "runner-tools/$diagnostic"

          git -C runner-tools add "$diagnostic"
          test "$(git -C runner-tools diff --cached --name-only)" = "$diagnostic"
          git -C runner-tools config user.name github-actions
          git -C runner-tools config user.email github-actions@github.com
          git -C runner-tools commit -m "ci(analysis): record hosted A0 clippy diagnostic"

          git -C runner-tools fetch origin "+refs/heads/$RUNNER_BRANCH:refs/remotes/origin/$RUNNER_BRANCH"
          test "$(git -C runner-tools rev-parse "refs/remotes/origin/$RUNNER_BRANCH")" = "$RUNNER_HEAD"
          git -C runner-tools push origin "HEAD:refs/heads/$RUNNER_BRANCH"

      - name: Fail if strict A0 Clippy failed
        if: steps.clippy.outputs.status != '0'
        shell: bash
        run: exit 1
