name: A0 R2 Clippy Diagnostic

on:
  pull_request:
    branches: [ "design/d2-requirement-traceability-r2-v0.1" ]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: a0-r2-clippy-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: analysis/a0-analysis-evidence-contracts-r2-v0.1
  D2_HEAD: 366dd29ae74b4aed411517497c5ce7799f2dc79c
  LEGACY_A0_HEAD: a80aa06d9b3f9ef0031d69b326d387ec2383cc13
  TRANSFORM_BLOB: 2ce1df21822064b53c02a7a1b4ebf2d7e2774c57
  CARGO_TARGET_DIR: /tmp/symtropy-a0-r2-clippy-diagnostic-target

jobs:
  diagnose:
    name: Reproduce exact A0 strict Clippy diagnostic
    runs-on: ubuntu-24.04
    steps:
      - name: Check out frozen A0 product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact historical A0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.LEGACY_A0_HEAD }}
          path: legacy-a0
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact runner tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$D2_HEAD"
          test "$(git -C legacy-a0 rev-parse HEAD)" = "$LEGACY_A0_HEAD"
          test "$(git -C runner-tools hash-object .github/repair/a0_rederive_analysis_r2.py)" = "$TRANSFORM_BLOB"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Recreate exact A0 source
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/a0_rederive_analysis_r2.py ../legacy-a0
          cargo fmt -p symtropy-analysis-contracts
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Emit strict A0 Clippy diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          cargo clippy --message-format=short --locked --manifest-path product/Cargo.toml -p symtropy-analysis-contracts --all-targets -- -D warnings 2>&1 | tee /tmp/a0-clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::A0 strict Clippy diagnostic"
            grep -E '(^|: )(error|warning)(\[|:)|--> |clippy::' /tmp/a0-clippy.log || cat /tmp/a0-clippy.log
            echo "::endgroup::"
            raw_diag="$(grep -m1 -E '^.*:[0-9]+:[0-9]+: (error|warning):' /tmp/a0-clippy.log || grep -m1 -E '^(error|warning)(\[[^]]+\])?:' /tmp/a0-clippy.log || true)"
            if [ -z "$raw_diag" ]; then
              raw_diag="strict Clippy failed; inspect the diagnostic group"
            fi
            annotation="${raw_diag//'%'/'%25'}"
            annotation="${annotation//$'\r'/'%0D'}"
            annotation="${annotation//$'\n'/'%0A'}"
            echo "::error title=A0 strict Clippy::$annotation"
            printf 'Exact hosted A0 strict-Clippy diagnostic for runner head `%s`:\n\n```text\n%s\n```\n\nThis is diagnostic-only; the A0 product branch was not mutated.\n' "$GITHUB_SHA" "$raw_diag" > /tmp/a0-clippy-comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/a0-clippy-comment.md
          fi
          exit "$status"
