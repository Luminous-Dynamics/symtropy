name: CRK-01 Exact Qualification

on:
  pull_request:
    branches:
      - hardening/game-state-canonical-v2

permissions:
  contents: read

concurrency:
  group: crk01-exact-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 242e93a810e9c2a7a5f92850ebd5186b785d54eb
          fetch-depth: 0

      - name: Assert exact CRK-01 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "242e93a810e9c2a7a5f92850ebd5186b785d54eb"

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Run exact CRK-01 qualification
        shell: bash
        run: bash scripts/qualify-game-state-canonical-v2.sh
