name: LiU-ICE DX2027 Profile Contract

on:
  pull_request:
    branches: [research/maritime-dx2026-clean-integration-v0-1]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/maritime-control-response/liu-ice-dx2027-profile-v0.1.json"
      - "benchmarks/maritime-control-response/liu-ice-dx2027-profile.schema.json"
      - "benchmarks/maritime-control-response/src/bin/liu_ice_dx2027_profile_audit.rs"
      - "docs/tech/LIU_ICE_DX2027_BENCHMARK_PROFILE_V0_1.md"
      - ".github/workflows/liu-ice-dx2027-profile-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liu-ice-dx2027-profile-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  profile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate strict metadata schema and cross-edition invariants
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Validate profile JSON Schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path("benchmarks/maritime-control-response")
          profile = json.loads((root / "liu-ice-dx2027-profile-v0.1.json").read_text())
          schema = json.loads((root / "liu-ice-dx2027-profile.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = sorted(validator.iter_errors(profile), key=lambda error: list(error.absolute_path))
          if errors:
              for error in errors:
                  print(f"{list(error.absolute_path)}: {error.message}")
              raise SystemExit(1)
          assert profile["dataset"]["training_dataset_count_reported"] == 41
          assert profile["edition_comparison"]["dx2026_training_dataset_count_reported"] == 26
          assert profile["acquisition"]["archive_sha256"] is None
          assert profile["acquisition"]["file_inventory"] == []
          calibration = profile["calibration_feasibility"]
          assert calibration["reported_max_recordings_per_known_fault_family"] == 7
          assert calibration["required_independent_episodes_for_split_conformal_coverage"]["0.90"] == 9
          assert calibration["per_fault_90pct_split_conformal_feasible_from_reported_training_count"] is False
          assert calibration["pooled_marginal_coverage_claims_per_fault_coverage"] is False
          assert profile["claim_ceiling"]["benchmark_score_claim_allowed"] is False
          print("DX2027 profile schema, calibration adequacy and cross-edition invariants: PASS")
          PY

      - name: Validate Rust formatting
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Run exact profile audit tests
        working-directory: benchmarks/maritime-control-response
        run: cargo test --locked --bin liu_ice_dx2027_profile_audit

      - name: Run strict Clippy
        working-directory: benchmarks/maritime-control-response
        run: cargo clippy --locked --bin liu_ice_dx2027_profile_audit -- -D warnings

      - name: Check Rust formatting
        working-directory: benchmarks/maritime-control-response
        run: cargo fmt -- --check
