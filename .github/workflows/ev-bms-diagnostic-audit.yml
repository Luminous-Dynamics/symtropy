name: EV BMS diagnostic event v0.1 audit

on:
  pull_request:
    paths:
      - "schemas/transport/ev_bms_diagnostic_event_v0_1.schema.json"
      - "fixtures/ev_battery/bms_diagnostic_event_scenarios_v0_1.json"
      - "tools/ev-bms-diagnostic-audit/**"
      - "docs/transport/EV_BMS_DIAGNOSTIC_EVENT_V0_1.md"
      - ".github/workflows/ev-bms-diagnostic-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Check formatting
        run: cargo fmt --manifest-path tools/ev-bms-diagnostic-audit/Cargo.toml -- --check
      - name: Run diagnostic evidence and mutation tests
        run: cargo test --manifest-path tools/ev-bms-diagnostic-audit/Cargo.toml
      - name: Audit frozen synthetic corpus
        run: |
          cargo run --manifest-path tools/ev-bms-diagnostic-audit/Cargo.toml -- --schema schemas/transport/ev_bms_diagnostic_event_v0_1.schema.json --corpus fixtures/ev_battery/bms_diagnostic_event_scenarios_v0_1.json > "$RUNNER_TEMP/ev-bms-diagnostic-report.json"
          jq -e '
            .case_count == 10 and
            .accepted_count == 5 and
            .rejected_count == 5 and
            (.report_sha256 | test("^[a-f0-9]{64}$"))
          ' "$RUNNER_TEMP/ev-bms-diagnostic-report.json"
