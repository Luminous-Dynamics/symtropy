name: Scan-to-BIM Measurement Observability Oracle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/scan-bim-measurement-observability/**"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_MEASUREMENT_OBSERVABILITY_V0_1.md"
      - ".github/workflows/scan-bim-measurement-observability.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/scan-bim-measurement-observability/**"
      - "docs/research/built-asset/scan-bim/SCAN_BIM_MEASUREMENT_OBSERVABILITY_V0_1.md"
      - ".github/workflows/scan-bim-measurement-observability.yml"

permissions:
  contents: read

concurrency:
  group: scan-bim-measurement-observability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-oracle:
    name: Measurement observability oracle (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/scan-bim-measurement-observability/Cargo.toml -- --check
      - name: Test synthetic oracle
        run: cargo test --manifest-path tools/scan-bim-measurement-observability/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path tools/scan-bim-measurement-observability/Cargo.toml --all-targets -- -D warnings
      - name: Evaluate frozen corpus
        run: |
          cargo run --manifest-path tools/scan-bim-measurement-observability/Cargo.toml -- \
            --corpus tools/scan-bim-measurement-observability/fixtures/measurement-observability.json \
            > /tmp/scan-bim-measurement-observability.json
          jq -e '
            .core.passed == true and
            .core.case_count == 24 and
            .core.mismatch_count == 0 and
            (.receipt_sha256 | test("^[0-9a-f]{64}$"))
          ' /tmp/scan-bim-measurement-observability.json
