name: LOCO Capability Envelope Verification

on:
  pull_request:
    paths:
      - 'research/loco-capability-envelope-001/**'
      - '.github/workflows/loco-capability-envelope.yml'
  push:
    branches: [main]
    paths:
      - 'research/loco-capability-envelope-001/**'
      - '.github/workflows/loco-capability-envelope.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/loco-capability-envelope-001/Cargo.toml -- --check
      - name: Run exact capability and cross-fit tests
        run: cargo test --manifest-path research/loco-capability-envelope-001/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/loco-capability-envelope-001/Cargo.toml --locked --all-targets -- -D warnings
