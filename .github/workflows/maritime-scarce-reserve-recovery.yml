name: Maritime scarce-reserve recovery reference

on:
  pull_request:
    paths:
      - "research/maritime-scarce-reserve-recovery/**"
      - ".github/workflows/maritime-scarce-reserve-recovery.yml"
  push:
    branches:
      - "research/maritime-scarce-reserve-recovery-v0-1"
    paths:
      - "research/maritime-scarce-reserve-recovery/**"
      - ".github/workflows/maritime-scarce-reserve-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-scarce-reserve-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path research/maritime-scarce-reserve-recovery/Cargo.toml --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/maritime-scarce-reserve-recovery/Cargo.toml --all-targets -- -D warnings
      - name: Compile
        run: cargo check --locked --manifest-path research/maritime-scarce-reserve-recovery/Cargo.toml --all-targets
      - name: Run tests
        run: cargo test --locked --manifest-path research/maritime-scarce-reserve-recovery/Cargo.toml --all-targets
      - name: Verify deterministic finite-policy receipt
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path research/maritime-scarce-reserve-recovery/Cargo.toml --bin scarce-reserve-recovery > /tmp/maritime-scarce-reserve.csv
          cargo run --quiet --locked --manifest-path research/maritime-scarce-reserve-recovery/Cargo.toml --bin scarce-reserve-recovery > /tmp/maritime-scarce-reserve-replay.csv
          cmp /tmp/maritime-scarce-reserve.csv /tmp/maritime-scarce-reserve-replay.csv
          grep -q '^no_observation,EVALUATED,NO_OBSERVATION,1,50,0,false,' /tmp/maritime-scarce-reserve.csv
          grep -q '^shared_tos_signal,EVALUATED,ADVISORY_ONLY,1,52,2,false,' /tmp/maritime-scarce-reserve.csv
          grep -q '^independent_reserve_inspection,EVALUATED,INDEPENDENT_WITNESS,0,7,7,true,' /tmp/maritime-scarce-reserve.csv
          grep -q '^unknown_dependency_feed,BLOCKED_UNKNOWN_DEPENDENCY,' /tmp/maritime-scarce-reserve.csv
          grep -q '^potentially_correlated_feed,BLOCKED_POTENTIALLY_CORRELATED,' /tmp/maritime-scarce-reserve.csv
          grep -q '^revoked_dependency_feed,BLOCKED_REVOKED_DEPENDENCY,' /tmp/maritime-scarce-reserve.csv
          grep -q '^ambiguous_event_camera,BLOCKED_AMBIGUOUS_ASSOCIATION,' /tmp/maritime-scarce-reserve.csv
          grep -q '^unmatched_event_receipt,BLOCKED_UNMATCHED_ASSOCIATION,' /tmp/maritime-scarce-reserve.csv
          grep -q '^stale_field_sensor,BLOCKED_STALE_EVIDENCE,' /tmp/maritime-scarce-reserve.csv
          grep -q '^incomplete_capture_sensor,BLOCKED_INCOMPLETE_CAPTURE,' /tmp/maritime-scarce-reserve.csv
          grep -q '^overbudget_independent_audit,OVER_BUDGET,' /tmp/maritime-scarce-reserve.csv
          grep -q ',a_critical_reserve_outage,hold,false,30,30,A,false,true,true,' /tmp/maritime-scarce-reserve.csv
          grep -q ',a_critical_a_consent_revoked,reserve_to_b,true,30,80,A,true,false,true,' /tmp/maritime-scarce-reserve.csv
          grep -q ',b_critical_b_consent_revoked,reserve_to_a,true,80,30,B,true,true,false,' /tmp/maritime-scarce-reserve.csv
          grep -q ',a_critical_reserve_ready,reserve_to_a,true,80,30,NONE,true,true,true,BOTH_VALID,0,7,0,7,' /tmp/maritime-scarce-reserve.csv
          grep -q ',b_critical_reserve_ready,reserve_to_b,true,30,80,NONE,true,true,true,BOTH_VALID,0,7,0,7,' /tmp/maritime-scarce-reserve.csv
          grep -q ',QUALIFIED_RESULT,a_critical_reserve_ready_sensor_only_fault,reserve_to_a,true,80,30,NONE,true,true,true,BOTH_VALID,0,7,0,7,' /tmp/maritime-scarce-reserve.csv
          grep -q ',MISSING,a_critical_reserve_outage,hold,false,30,30,A,false,true,true,BOTH_VALID,0,2,1,52,.*COMMON_CAUSE_RESERVE_AND_GATEWAY_OUTAGE' /tmp/maritime-scarce-reserve.csv
          grep -q ',MISSING,a_critical_reserve_ready_sensor_only_fault,hold,false,30,30,A,true,true,true,BOTH_VALID,1,52,1,52,.*SENSOR_ONLY_FAILURE_RESERVE_READY' /tmp/maritime-scarce-reserve.csv
          echo "Maritime scarce-reserve known-answer and participant-incidence contract passed."
