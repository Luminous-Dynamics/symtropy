name: Lean formalization

on:
  pull_request:
    paths:
      - "formalization/lean/**"
      - "docs/built-environment/lean-verification-roadmap.md"
      - ".github/workflows/lean-formalization.yml"
  push:
    branches: ["main"]
    paths:
      - "formalization/lean/**"
      - "docs/built-environment/lean-verification-roadmap.md"
      - ".github/workflows/lean-formalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Validate contracts, build proofs and audit axioms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Validate theorem-to-contract mapping and negative controls
        shell: bash
        run: |
          jq -e '
            .schema_version == "0.1.0" and
            .package == "SymtropyFormal" and
            (.contracts | length == 5) and
            ([.contracts[].theorems[]] | unique | length == 28) and
            (.negative_controls | length == 1)
          ' formalization/lean/contracts.json >/dev/null

          while IFS= read -r theorem; do
            short="${theorem##*.}"
            if ! grep -REq "^theorem ${short}([[:space:]]|$)" formalization/lean/SymtropyFormal; then
              echo "::error::Contract theorem missing from Lean source: ${theorem}"
              exit 1
            fi
          done < <(jq -r '.contracts[].theorems[]' formalization/lean/contracts.json)

          while IFS= read -r theorem; do
            short="${theorem##*.}"
            if ! grep -REq "^theorem ${short}([[:space:]]|$)" formalization/lean/SymtropyFormal; then
              echo "::error::Negative-control theorem missing from Lean source: ${theorem}"
              exit 1
            fi
          done < <(jq -r '.negative_controls[].theorem' formalization/lean/contracts.json)

          declared_count=$(grep -REh '^theorem ' formalization/lean/SymtropyFormal | wc -l)
          expected_count=$((
            $(jq '[.contracts[].theorems[]] | unique | length' formalization/lean/contracts.json) +
            $(jq '[.negative_controls[].theorem] | unique | length' formalization/lean/contracts.json)
          ))
          if [ "$declared_count" -ne "$expected_count" ]; then
            echo "::error::Expected $expected_count mapped theorem declarations, found $declared_count"
            exit 1
          fi
      - name: Build pinned Lean project and audit theorem namespace
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization/lean
          use-mathlib-cache: true
          build: true
          axiom-audit: true
          axiom-audit-root: SymtropyFormal
          axiom-audit-allow: propext,Classical.choice,Quot.sound
