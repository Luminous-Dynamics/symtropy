name: Fluid Lock Refresh Helper

on:
  push:
    branches:
      - ci/fluid-lock-refresh-v0.1

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Reconcile workspace lock
        run: cargo metadata --format-version 1 --no-deps > /dev/null

      - name: Show generated lock delta
        run: git diff -- Cargo.lock

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: fluid-lock-refresh-${{ github.run_id }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
