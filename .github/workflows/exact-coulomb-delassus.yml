name: Exact Coulomb Delassus Reference

on:
  pull_request:
    branches: [main]
    paths:
      - "research/exact-coulomb-delassus/v0.1/**"
      - ".github/workflows/exact-coulomb-delassus.yml"
  push:
    branches: [main, "research/exact-coulomb-delassus-v0.1"]
    paths:
      - "research/exact-coulomb-delassus/v0.1/**"
      - ".github/workflows/exact-coulomb-delassus.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 Delassus reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/exact-coulomb-delassus/v0.1/Cargo.toml
      - name: Upload rustfmt-normalized source
        uses: actions/upload-artifact@v4
        with:
          name: delassus-rustfmt
          path: research/exact-coulomb-delassus/v0.1/src/lib.rs
          if-no-files-found: error
      - name: Run tests
        run: cargo test --manifest-path research/exact-coulomb-delassus/v0.1/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/exact-coulomb-delassus/v0.1/Cargo.toml --locked --all-targets -- -D warnings
