name: EGB NHEG SL2 charge-density replay

on:
  push:
    branches:
      - research/egb-nheg-sl2-charge-densities-2026-11-21
    paths:
      - crates/domains/symtropy-lovelock5d/benchmarks/derive_nheg_sl2_charge_densities.py
      - .github/workflows/nheg-sl2-charge-densities.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nheg-sl2-charge-densities
  cancel-in-progress: false

jobs:
  sl2-phase-space:
    name: Exact SL(2,R) generators, presymplectic pullback and bifurcation charge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned symbolic engine
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Replay SL2 and bifurcation charge densities
        env:
          PYTHONHASHSEED: "0"
        run: |
          OUT="$RUNNER_TEMP/nheg_sl2_charge_densities.json"
          python crates/domains/symtropy-lovelock5d/benchmarks/derive_nheg_sl2_charge_densities.py --output "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          v=data["validation"]
          required=(
              "coordinate_determinant_exact",
              "Lovelock_PGB_contraction_exact",
              "Einstein_sector_matches_source_Eq29_exactly",
              "GB_Noether_potential_exact",
              "axial_variation_exact",
              "Wald_variation_exact",
              "sl2_bifurcation_generator_directly_evaluated",
          )
          for key in required:
              assert v[key] is True, (key,v[key])
          sl2=data["sl2_density_decomposition"]
          sv=sl2["validation"]
          assert sv["all_generators_killing_by_lie_derivative"] is True
          assert sv["bifurcation_generator_zero"] is True
          assert sv["direct_zeta_matches_component_combination"] is True
          assert sv["direct_zeta_matches_wald_variation"] is True
          assert sv["eq23_linearity_exact"] is True
          # Eq.24 is a published claim under investigation. A mismatch must be
          # recorded in the fixture, not silently converted into a passing identity.
          assert sv["source_eq24_density_equals_delta_J2"] is False
          assert sv["eq24_local_identity_2nQ_equals_J2"] is False
          assert data["validation"]["finite_entropy_or_angular_momentum_claimed"] is False
          print("PASS: all SL(2,R) generators independently satisfy Lie-derivative Killing tests.")
          print("PASS: direct bifurcation generator agrees with its component charge sum and local Wald variation.")
          print("PASS: Section 4 Eq.24 comparison is recorded as unresolved, not assumed.")
          PY
      - name: Preserve exact SL2 replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: egb-nheg-sl2-charge-density-replay
          path: ${{ runner.temp }}/nheg_sl2_charge_densities.json
          if-no-files-found: error
          retention-days: 30
