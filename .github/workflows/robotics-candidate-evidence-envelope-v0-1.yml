name: robotics-candidate-evidence-envelope-v0-1

on:
  pull_request:
    paths:
      - ".github/workflows/robotics-candidate-evidence-envelope-v0-1.yml"
      - "research/robotics-candidate-evidence-envelope-v0-1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust format, Clippy and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/robotics-candidate-evidence-envelope-v0-1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Run deterministic example
        run: cargo run --quiet
