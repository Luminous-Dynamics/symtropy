name: Tree-Backed Swept Pair Qualification

on:
  pull_request:
    branches: [research/stateful-tree-broadphase-v0.1]
    paths:
      - "research/tree-backed-swept-pairs/v0.1/**"
      - ".github/workflows/tree-backed-swept-pairs.yml"
  push:
    branches: [research/tree-backed-swept-pairs-v0.1]
    paths:
      - "research/tree-backed-swept-pairs/v0.1/**"
      - ".github/workflows/tree-backed-swept-pairs.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 tree-backed swept-pair checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/tree-backed-swept-pairs/v0.1/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/tree-backed-swept-pairs/v0.1/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/tree-backed-swept-pairs/v0.1/Cargo.toml --locked --all-targets -- -D warnings
