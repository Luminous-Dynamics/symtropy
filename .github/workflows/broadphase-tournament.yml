name: Broadphase Architecture Tournament

on:
  pull_request:
    branches: [research/stateful-tree-broadphase-v0.1, research/broadphase-tournament-v0.1, research/sleep-aware-pair-delta-v0.1]
    paths:
      - "research/broadphase-tournament/v0.1/**"
      - "research/incremental-aabb-tree-reference/v0.1/**"
      - ".github/workflows/broadphase-tournament.yml"
  push:
    branches: [research/broadphase-tournament-v0.1, research/sleep-aware-pair-delta-v0.1, research/indexed-dirty-frontier-v0.1]
    paths:
      - "research/broadphase-tournament/v0.1/**"
      - ".github/workflows/broadphase-tournament.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.96 broadphase tournament checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Resolve isolated Cargo.lock for shape coverage
        run: |
          cargo generate-lockfile --manifest-path research/broadphase-tournament/v0.1/Cargo.toml
          printf '\n---BROADPHASE_LOCK_BEGIN---\n'
          cat research/broadphase-tournament/v0.1/Cargo.lock
          printf '\n---BROADPHASE_LOCK_END---\n'
      - name: Check formatting
        run: cargo fmt --manifest-path research/broadphase-tournament/v0.1/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path research/broadphase-tournament/v0.1/Cargo.toml --locked
      - name: Run strict Clippy
        run: cargo clippy --manifest-path research/broadphase-tournament/v0.1/Cargo.toml --locked --all-targets -- -D warnings
      - name: Run release benchmark campaign
        env:
          BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          results_dir=research/broadphase-tournament/v0.1/benchmark-results
          mkdir -p "$results_dir"
          {
            printf 'source_sha=%s\n' "$BENCHMARK_SOURCE_SHA"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'rustc='
            rustc --version
            printf 'cargo='
            cargo --version
            printf 'os='
            uname -a
            printf '\n[cpu]\n'
            if command -v lscpu >/dev/null 2>&1; then
              lscpu
            else
              printf 'lscpu unavailable\n'
            fi
            printf '\n[command]\n'
            printf 'cargo run --release ... -- 128 40 2\n'
          } > "$results_dir/manifest.txt"
          cargo run --release --manifest-path research/broadphase-tournament/v0.1/Cargo.toml --bin broadphase-tournament -- 128 40 2 > "$results_dir/results.csv"
          test "$(wc -l < "$results_dir/results.csv")" -eq 190
          awk -F, 'NR > 1 && (NF != 61 || $14 != 0 || $15 != 0 || $16 != 0 || $17 != 0) { print "invalid benchmark row", NR, "columns", NF; failed = 1 } END { exit failed }' "$results_dir/results.csv"
          cargo run --release --manifest-path research/broadphase-tournament/v0.1/Cargo.toml --bin broadphase-tournament -- --scale 1024 16 1 > "$results_dir/scale-smoke.csv"
          test "$(wc -l < "$results_dir/scale-smoke.csv")" -eq 25
          awk -F, 'NR > 1 && (NF != 61 || $14 != 0 || $15 != 0 || $16 != 0 || $17 != 0) { print "invalid scale smoke row", NR, "columns", NF; failed = 1 } END { exit failed }' "$results_dir/scale-smoke.csv"
          printf 'validated_rows=%s\n' "$(($(wc -l < "$results_dir/results.csv") - 1))" >> "$results_dir/manifest.txt"
          printf 'validated_scale_rows=%s\n' "$(($(wc -l < "$results_dir/scale-smoke.csv") - 1))" >> "$results_dir/manifest.txt"
          cargo run --release --manifest-path research/broadphase-tournament/v0.1/Cargo.toml --bin contact-lease-benchmark -- 100000 > "$results_dir/contact-lease.csv"
          test "$(wc -l < "$results_dir/contact-lease.csv")" -eq 28
          awk -F, 'NR == 1 && NF != 10 { print "invalid contact lease header"; failed = 1 } NR > 1 && (NF != 10 || $3 <= 0 || $8 != 0 || ($4 + $5 + $6 + $7) != $3) { print "invalid contact lease row", NR; failed = 1 } END { exit failed }' "$results_dir/contact-lease.csv"
          printf 'validated_contact_lease_rows=%s\n' "$(($(wc -l < "$results_dir/contact-lease.csv") - 1))" >> "$results_dir/manifest.txt"
          cargo run --release --manifest-path research/broadphase-tournament/v0.1/Cargo.toml --bin shape-coverage-benchmark -- 4096 > "$results_dir/shape-coverage.csv"
          test "$(wc -l < "$results_dir/shape-coverage.csv")" -eq 3
          awk -F, 'NR == 1 && NF != 9 { print "invalid shape coverage header"; failed = 1 } NR > 1 && (NF != 9 || $2 != 4096 || $3 <= 0 || $6 != 0 || $7 != "1.000000000") { print "invalid shape coverage row", NR; failed = 1 } END { exit failed }' "$results_dir/shape-coverage.csv"
          printf 'validated_shape_coverage_rows=%s\n' "$(($(wc -l < "$results_dir/shape-coverage.csv") - 1))" >> "$results_dir/manifest.txt"
          cargo run --release --manifest-path research/broadphase-tournament/v0.1/Cargo.toml --bin shape-backend-coverage-benchmark -- 4096 > "$results_dir/shape-backend-coverage.csv"
          test "$(wc -l < "$results_dir/shape-backend-coverage.csv")" -eq 19
          awk -F, 'NR == 1 && NF != 10 { print "invalid backend shape coverage header"; failed = 1 } NR > 1 && (NF != 10 || $3 != 4096 || $4 <= 0 || $5 <= 0 || $6 != 0 || $7 != "1.000000000" || $9 <= 0) { print "invalid backend shape coverage row", NR; failed = 1 } END { exit failed }' "$results_dir/shape-backend-coverage.csv"
          printf 'validated_shape_backend_rows=%s\n' "$(($(wc -l < "$results_dir/shape-backend-coverage.csv") - 1))" >> "$results_dir/manifest.txt"
      - name: Retain benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: broadphase-tournament-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/broadphase-tournament/v0.1/benchmark-results/
          if-no-files-found: error
          retention-days: 30
