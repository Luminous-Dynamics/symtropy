name: Terrain Live Provider Rustfmt Diagnostic

on:
  push:
    branches:
      - "ci/terrain-live-provider-rustfmt-report-v0.1"
    paths:
      - ".github/workflows/terrain-live-provider-rustfmt-report.yml"

permissions:
  contents: write

concurrency:
  group: terrain-live-provider-rustfmt-report-v0.1
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture exact live-provider rustfmt diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind frozen subject
        shell: bash
        run: |
          set -euo pipefail
          subject=a41195f9c93a7868178b12f557c2f20420c71481
          test "$(git rev-parse HEAD^)" = "${subject}"
          test "$(git rev-parse ${subject}:crates/domains/symtropy-terrain/src/live_geometry_provider.rs)" = "4f0f2b60ca49263207e2b36300b3d04a94ebc366"
          test "$(git rev-parse ${subject}:crates/domains/symtropy-terrain/src/lib.rs)" = "05a94dda8fa4fe51ba55e328b113c80ae648ae49"

      - name: Set up pinned Rustfmt
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Capture exact rustfmt diff
        shell: bash
        run: |
          set -euo pipefail
          report=terrain-live-provider-rustfmt-report.txt
          set +e
          rustfmt --edition 2024 --check \
            crates/domains/symtropy-terrain/src/live_geometry_provider.rs \
            crates/domains/symtropy-terrain/src/lib.rs >"${report}" 2>&1
          status=$?
          set -e
          {
            printf '\nDIAGNOSTIC_EXIT_CODE=%s\n' "${status}"
            printf 'DIAGNOSTIC_SUBJECT=%s\n' "$(git rev-parse HEAD^)"
            printf 'DIAGNOSTIC_RUSTFMT=%s\n' "$(rustfmt --version)"
          } >> "${report}"
          git add "${report}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'ci(terrain): record exact live-provider rustfmt diff'
          git push origin HEAD:ci/terrain-live-provider-rustfmt-report-v0.1

      - name: Diagnostic completion
        shell: bash
        run: |
          set -euo pipefail
          echo "TERRAIN_LIVE_PROVIDER_RUSTFMT_DIAGNOSTIC_RECORDED=PASS"
