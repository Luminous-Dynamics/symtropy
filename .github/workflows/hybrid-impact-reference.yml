name: Hybrid impact reference

on:
  pull_request:
    paths:
      - "research/hybrid-impact-reference/**"
      - ".github/workflows/hybrid-impact-reference.yml"
  push:
    branches: [main]
    paths:
      - "research/hybrid-impact-reference/**"
      - ".github/workflows/hybrid-impact-reference.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path research/hybrid-impact-reference/Cargo.toml --check
      - name: Test
        run: cargo test --manifest-path research/hybrid-impact-reference/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path research/hybrid-impact-reference/Cargo.toml --locked --all-targets -- -D warnings
