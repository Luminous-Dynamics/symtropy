name: Ocean Industrial Symbiosis Benchmark

on:
  push:
    branches: ["feat/ocean-industrial-symbiosis-001"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/ocean-industrial-symbiosis-bench/**"
      - "docs/tech/OCEAN_INDUSTRIAL_SYMBIOSIS_BENCHMARK_V0_1.md"
      - "docs/tech/OCEAN_INDUSTRIAL_SYMBIOSIS_CORPUS_V0_1.json"
      - ".github/workflows/ocean-industrial-symbiosis-bench.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/ocean-industrial-symbiosis-bench/**"
      - "docs/tech/OCEAN_INDUSTRIAL_SYMBIOSIS_BENCHMARK_V0_1.md"
      - "docs/tech/OCEAN_INDUSTRIAL_SYMBIOSIS_CORPUS_V0_1.json"
      - ".github/workflows/ocean-industrial-symbiosis-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocean-industrial-symbiosis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-synthetic-portfolios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check focused formatting
        run: cargo fmt --manifest-path tools/ocean-industrial-symbiosis-bench/Cargo.toml --check
      - name: Run focused contract tests
        run: cargo test -p ocean-industrial-symbiosis-bench --locked
      - name: Verify frozen synthetic portfolios and emit receipt
        env:
          OCEAN_SYMBIOSIS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo run --quiet -p ocean-industrial-symbiosis-bench --locked -- \
            --corpus docs/tech/OCEAN_INDUSTRIAL_SYMBIOSIS_CORPUS_V0_1.json \
            --receipt "${RUNNER_TEMP}/ocean-industrial-symbiosis-receipt.json"
          test -s "${RUNNER_TEMP}/ocean-industrial-symbiosis-receipt.json"
      - name: Upload machine-readable receipt
        uses: actions/upload-artifact@v4
        with:
          name: ocean-industrial-symbiosis-receipt
          path: ${{ runner.temp }}/ocean-industrial-symbiosis-receipt.json
          if-no-files-found: error
          retention-days: 14
