name: Mobility M1 Receipt Adapter

on:
  pull_request:
    paths:
      - 'research/mobility-m1-receipt-adapter/**'
      - '.github/workflows/mobility-m1-receipt-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'research/mobility-m1-receipt-adapter/**'
      - '.github/workflows/mobility-m1-receipt-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobility-m1-receipt-adapter-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact M1 reference
        uses: actions/checkout@v4
        with:
          ref: 9d9b8b223e711d6bc76dd60b9563950ab2a16702
          path: m1-src
      - name: Checkout exact M2 contract
        uses: actions/checkout@v4
        with:
          ref: 189dd53b3fbd352f7dcc3d1773b2476b692604ee
          path: m2-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path research/mobility-m1-receipt-adapter/Cargo.toml -- --check
      - name: Run pinned M1/M2 integration and upstream regression tests
        run: cargo test --manifest-path research/mobility-m1-receipt-adapter/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path research/mobility-m1-receipt-adapter/Cargo.toml --all-targets --locked -- -D warnings
