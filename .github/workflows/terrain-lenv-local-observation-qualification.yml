name: Terrain LENV Local Observation Qualification

on:
  push:
    branches:
      - "ci/terrain-lenv-local-observation-qual-c4db958"
    paths:
      - ".github/workflows/terrain-lenv-local-observation-qualification.yml"

permissions:
  contents: read

concurrency:
  group: terrain-lenv-local-observation-qual-c4db958
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify exact Terrain local environmental observation subject
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact workflow-only qualifier lineage
        shell: bash
        run: |
          set -euo pipefail
          product=c4db958a899d6c3a34f298599c9d932f96e80329
          qualifier=.github/workflows/terrain-lenv-local-observation-qualification.yml
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${product}"
          test "$(git diff --name-only "${product}..HEAD")" = "${qualifier}"
          test -z "$(git rev-list --merges "${product}..HEAD")"

      - name: Checkout immutable product subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4db958a899d6c3a34f298599c9d932f96e80329
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact parent tree blobs and product delta
        shell: bash
        run: |
          set -euo pipefail
          product=c4db958a899d6c3a34f298599c9d932f96e80329
          parent=346852c0b3490df30b1b34ba96d23cb9cf47e5f3
          expected_tree=5a4c73c8f45dbc32a2480420bd6d20352a6c92e9
          module=crates/domains/symtropy-terrain/src/environment_observation.rs
          lib=crates/domains/symtropy-terrain/src/lib.rs

          test "$(git rev-parse HEAD)" = "${product}"
          test "$(git show -s --format=%P HEAD)" = "${parent}"
          test "$(git rev-parse HEAD^{tree})" = "${expected_tree}"
          test "$(git rev-parse HEAD:${module})" = "26e92b4afc0651e7476c3bd417a0b9a36198f23a"
          test "$(git rev-parse HEAD:${lib})" = "aabe641f7b9a600a888da0f681d1338bab97fbd8"

          # Freeze qualified parent surfaces that this child is allowed to consume.
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_kernel.rs)" = "8d3e1213eacdeddf693cd2d1f82670d6ed832161"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/live_geometry_provider.rs)" = "543858ec733429ac41d39bd52eb2e39210806280"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/geometry_currentness.rs)" = "2da7d9b27313ae24b45269171cf58ea6cd528de4"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/live_geometry_query.rs)" = "34995e11c7d82ffa4e18b7fc12927816408e8d1d"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/terrain_metric.rs)" = "5f6cce3dc034c0b8c0e46dc55e599bd6162841ac"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/tests/terrain_metric_public.rs)" = "20029889212d686d08fd92190a6945eb302d3ce5"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/Cargo.toml)" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"

          expected="$(printf '%s\n' "${module}" "${lib}" | sort)"
          actual="$(git diff --name-only "${parent}..${product}" | sort)"
          test "${actual}" = "${expected}"
          test "$(git diff --numstat "${parent}..${product}" -- "${lib}")" = $'1\t0\t'"${lib}"
          test "$(git diff --numstat "${parent}..${product}" -- "${module}")" = $'331\t0\t'"${module}"

          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/terrain-lenv-local-observation-target" >> "${GITHUB_ENV}"

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Bind toolchain and locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
          test "$(cargo --version | awk '{print $2}')" = "1.96.0"
          before="$(git hash-object Cargo.lock)"
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/terrain-lenv-local-observation-metadata.json"
          test "$(git hash-object Cargo.lock)" = "${before}"

      - name: Check exact product formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/domains/symtropy-terrain/src/environment_observation.rs \
            crates/domains/symtropy-terrain/src/lib.rs

      - name: Compile all Terrain targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p symtropy-terrain --locked --all-targets

      - name: Execute local observation hostile corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked environment_observation::tests -- --nocapture

      - name: Re-execute qualified parent theorem corpora
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked live_geometry_provider::tests -- --nocapture
          cargo test -p symtropy-terrain --locked geometry_currentness::tests -- --nocapture
          cargo test -p symtropy-terrain --locked live_geometry_query::tests -- --nocapture
          cargo test -p symtropy-terrain --locked --test terrain_metric_public -- --nocapture

      - name: Execute complete Terrain regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symtropy-terrain --locked --all-targets

      - name: Enforce strict all-target Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p symtropy-terrain --locked --all-targets -- -D warnings

      - name: Audit local-only read authority surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("crates/domains/symtropy-terrain")
          module = (root / "src/environment_observation.rs").read_text()
          prod = module.partition("#[cfg(test)]")[0]
          lib = (root / "src/lib.rs").read_text()
          manifest = (root / "Cargo.toml").read_text()

          # The adapter must remain a wrapper over qualified read/currentness
          # surfaces rather than minting a second geometry or authority grammar.
          if prod.count("pub struct TerrainLocalObservation") != 1:
              raise SystemExit("TerrainLocalObservation definition missing or duplicated")
          block = re.search(
              r"pub struct TerrainLocalObservation\s*\{(?P<body>.*?)\n\}",
              prod,
              flags=re.S,
          )
          if block is None:
              raise SystemExit("TerrainLocalObservation body not found")
          body = block.group("body")
          for required in ("snapshot: TerrainGeometrySnapshot", "receipt: TerrainGeometryQueryReceipt"):
              if required not in body:
                  raise SystemExit(f"missing exact retained field: {required}")
          if "Entity" in body:
              raise SystemExit("Bevy Entity leaked into retained canonical observation")

          required_calls = (
              "capture_live_terrain_geometry(world, entity)?",
              "verify_live_terrain_geometry_current(world, entity, expected.snapshot())?",
              "snapshot.query(bounds)?",
              "snapshot.query(expected.bounds())?",
          )
          for call in required_calls:
              if call not in prod:
                  raise SystemExit(f"qualified source composition changed: {call}")

          forbidden_prod = (
              "TerrainMetricProfile",
              "GlobalTransform",
              "SubstrateMaterial",
              "EarthChunk",
              "AuthorityScope",
              "AuthoritySnapshotToken",
              "CapabilitySourceRevision",
              "get_mut::<",
              "world_position",
          )
          for token in forbidden_prod:
              if token in prod:
                  raise SystemExit(f"forbidden authority/input leaked into production adapter: {token}")

          if lib.count("pub mod environment_observation;") != 1:
              raise SystemExit("environment observation export changed")
          if "symtropy-lifesim-core" in manifest or "symtropy_lifesim_core" in prod:
              raise SystemExit("adapter gained dependency on static/unqualified #299 vocabulary")

          print("TERRAIN_LENV_LOCAL_READ_ONLY=PASS")
          print("TERRAIN_LENV_ENTITY_RETAINED=NO")
          print("TERRAIN_LENV_METRIC_AUTHORITY=ABSENT")
          print("TERRAIN_LENV_WORLD_FRAME_AUTHORITY=ABSENT")
          print("TERRAIN_LENV_MUTATION_AUTHORITY=ABSENT")
          print("TERRAIN_LENV_CAPABILITY_299_DEPENDENCY=ABSENT")
          PY

      - name: Exact immutable-product postflight
        shell: bash
        run: |
          set -euo pipefail
          product=c4db958a899d6c3a34f298599c9d932f96e80329
          parent=346852c0b3490df30b1b34ba96d23cb9cf47e5f3
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${product}"
          test "$(git show -s --format=%P HEAD)" = "${parent}"
          test "$(git rev-parse HEAD^{tree})" = "5a4c73c8f45dbc32a2480420bd6d20352a6c92e9"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/environment_observation.rs)" = "26e92b4afc0651e7476c3bd417a0b9a36198f23a"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/src/lib.rs)" = "aabe641f7b9a600a888da0f681d1338bab97fbd8"
          test "$(git rev-parse HEAD:crates/domains/symtropy-terrain/Cargo.toml)" = "187fe4020a0c0048ab36404e219a7a5698a856d1"
          test "$(git rev-parse HEAD:Cargo.lock)" = "62c6eb098b3f6fffdea8a175a0f3afb33423b17b"
          git diff --exit-code
          echo "TERRAIN_LENV_LOCAL_OBSERVATION_EXACT_PRODUCT=PASS"
