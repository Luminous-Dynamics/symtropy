name: Spacecraft Pose Annotation Contract

on:
  pull_request:
    paths:
      - "tools/spacecraft-pose-annotation-contract-bench/**"
      - ".github/workflows/spacecraft-pose-annotation-contract.yml"
  push:
    branches:
      - "research/spacecraft-pose-annotation-contract-v0-1"
    paths:
      - "tools/spacecraft-pose-annotation-contract-bench/**"
      - ".github/workflows/spacecraft-pose-annotation-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Pose annotation geometry and independent oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/spacecraft-pose-annotation-contract-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/spacecraft-pose-annotation-contract-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/spacecraft-pose-annotation-contract-bench/Cargo.toml --all-targets -- -D warnings
      - name: Bind frozen corpus digest
        run: |
          echo "CORPUS_SHA256=$(sha256sum tools/spacecraft-pose-annotation-contract-bench/fixtures/pose-annotation-corpus-v0_1.csv | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Deterministic Rust receipt
        run: |
          cargo run --quiet --locked --manifest-path tools/spacecraft-pose-annotation-contract-bench/Cargo.toml --bin spacecraft-pose-annotation-contract-bench -- tools/spacecraft-pose-annotation-contract-bench/fixtures/pose-annotation-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/pose-rust.json
          cargo run --quiet --locked --manifest-path tools/spacecraft-pose-annotation-contract-bench/Cargo.toml --bin spacecraft-pose-annotation-contract-bench -- tools/spacecraft-pose-annotation-contract-bench/fixtures/pose-annotation-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/pose-rust-replay.json
          cmp /tmp/pose-rust.json /tmp/pose-rust-replay.json
      - name: Independent Python geometric oracle
        run: |
          python3 tools/spacecraft-pose-annotation-contract-bench/tests/reference_oracle.py tools/spacecraft-pose-annotation-contract-bench/fixtures/pose-annotation-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/pose-python.json
      - name: Compare complete receipts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/pose-rust.json").read_text())
          oracle = json.loads(Path("/tmp/pose-python.json").read_text())
          assert rust == oracle
          assert rust["case_count"] == 41
          assert rust["expected_disposition_matches"] == 41
          assert rust["expected_disposition_mismatches"] == 0
          assert rust["claim_ready"] is False
          assert rust["source_bytes_authenticated"] is False
          assert rust["pose_ground_truth_physically_validated"] is False
          assert rust["authority_granted"] is False
          cases = {item["case_id"]: item for item in rust["results"]}
          assert cases["PV001"]["disposition"] == "GEOMETRICALLY_CONSISTENT"
          assert cases["PV007"]["disposition"] == "GEOMETRICALLY_CONSISTENT"
          assert cases["PV013"]["disposition"] == "INCONSISTENT"
          assert cases["PV021"]["disposition"] == "ANNOTATION_INCOMPLETE"
          assert cases["PV038"]["disposition"] == "DUPLICATE_SPLIT_SAMPLE"
          assert cases["PV040"]["disposition"] == "DUPLICATE_KEYPOINT"
          print("41 pose annotation cases: exact Rust/Python receipt equality")
          PY
      - name: Retain exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spacecraft-pose-annotation-contract-evidence
          path: |
            /tmp/pose-rust.json
            /tmp/pose-python.json
            tools/spacecraft-pose-annotation-contract-bench/fixtures/pose-annotation-corpus-v0_1.csv
          if-no-files-found: error
          retention-days: 30
