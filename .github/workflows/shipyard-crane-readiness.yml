name: Shipyard crane operations readiness

on:
  push:
    paths:
      - "tools/shipyard-crane-readiness/**"
      - ".github/workflows/shipyard-crane-readiness.yml"
  pull_request:
    paths:
      - "tools/shipyard-crane-readiness/**"
      - ".github/workflows/shipyard-crane-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-crane-readiness-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Check readiness schemas and frozen conformance vectors
        shell: bash
        run: |
          set -euo pipefail
          vectors=tools/shipyard-crane-readiness/fixtures/conformance-vectors-v0.1.json
          jq -e '
            .contract_version == "shipyard-crane-readiness-v0.1"
            and .vector_set_id == "SHIPYARD-CRANE-READINESS-CONFORMANCE-V0.1"
            and (.vectors | length) == 15
            and ([.vectors[].id] | unique | length) == 15
            and ([.vectors[].test_name] | unique | length) == 15
            and all(.vectors[]; .synthetic_only == true)
          ' "$vectors"
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and .properties.contract_version.const == "shipyard-crane-readiness-v0.1" and (.required | index("lift_preflight") != null)' tools/shipyard-crane-readiness/schemas/readiness-plan-v0.1.schema.json
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and .properties.disposition.enum == ["ready_for_human_review","rejected","indeterminate"]' tools/shipyard-crane-readiness/schemas/readiness-report-v0.1.schema.json
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and .properties.vectors.minItems == 15' tools/shipyard-crane-readiness/schemas/conformance-vectors-v0.1.schema.json
          while IFS= read -r test_name; do
            grep -Fq "fn ${test_name}(" tools/shipyard-crane-readiness/src/lib.rs
          done < <(jq -r '.vectors[].test_name' "$vectors")

      - name: Check formatting
        run: cargo fmt --manifest-path tools/shipyard-crane-readiness/Cargo.toml -- --check

      - name: Run locked offline readiness tests
        run: cargo test --locked --offline --manifest-path tools/shipyard-crane-readiness/Cargo.toml

      - name: Compile all targets
        run: cargo check --locked --offline --manifest-path tools/shipyard-crane-readiness/Cargo.toml --all-targets

      - name: Lint all targets with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-crane-readiness/Cargo.toml --all-targets -- -D warnings
