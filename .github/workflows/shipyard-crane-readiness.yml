name: Shipyard crane operations readiness

on:
  push:
    paths:
      - "tools/shipyard-crane-readiness/**"
      - ".github/workflows/shipyard-crane-readiness.yml"
  pull_request:
    paths:
      - "tools/shipyard-crane-readiness/**"
      - ".github/workflows/shipyard-crane-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipyard-crane-readiness-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/shipyard-crane-readiness/Cargo.toml -- --check

      - name: Run locked offline readiness tests
        run: cargo test --locked --offline --manifest-path tools/shipyard-crane-readiness/Cargo.toml

      - name: Compile all targets
        run: cargo check --locked --offline --manifest-path tools/shipyard-crane-readiness/Cargo.toml --all-targets

      - name: Lint all targets with warnings denied
        run: cargo clippy --locked --offline --manifest-path tools/shipyard-crane-readiness/Cargo.toml --all-targets -- -D warnings
