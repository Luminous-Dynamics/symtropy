name: GAUGE Slope Identifiability Design

on:
  pull_request:
    paths:
      - 'benchmarks/gauge-slope-identifiability-design/v0.1/**'
      - '.github/workflows/gauge-slope-identifiability-design.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/gauge-slope-identifiability-design/v0.1/**'
      - '.github/workflows/gauge-slope-identifiability-design.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauge-slope-identifiability-design-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Validate pinned IDTD comparator receipt
        run: |
          jq -e '
            .baseline_id == "IDTD-ARXIV-2610.10905" and
            .paper.version == "v2" and
            .code_source.revision == "b47eed10adb4ea3d1987fc4211a9251f5de18ea6"
          ' benchmarks/gauge-slope-identifiability-design/v0.1/external_baseline_manifest.idtd.v0.1.json >/dev/null
          jq -e '
            any(.code_source.files[];
              .path == "consysid/active/fim_evaluator.py" and
              .git_blob_sha1 == "1a3aa63c8ed6f2091a06ffa25ae16f4072a7516d")
          ' benchmarks/gauge-slope-identifiability-design/v0.1/external_baseline_manifest.idtd.v0.1.json >/dev/null
          jq -e '
            .reproduction_status.code_executed_by_symtropy == false and
            .reproduction_status.paper_experiment_reproduced == false and
            .reproduction_status.full_robot_policy_pipeline_reproduced == false and
            (.scope.not_implemented | length) >= 5
          ' benchmarks/gauge-slope-identifiability-design/v0.1/external_baseline_manifest.idtd.v0.1.json >/dev/null
      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/gauge-slope-identifiability-design/v0.1/Cargo.toml -- --check
      - name: Run identifiability tests
        run: cargo test --manifest-path benchmarks/gauge-slope-identifiability-design/v0.1/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path benchmarks/gauge-slope-identifiability-design/v0.1/Cargo.toml --all-targets --locked -- -D warnings
