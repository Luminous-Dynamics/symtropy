      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable toolchain action pinned

      - name: Test fail-closed Rust manifest gate
        run: cargo test --locked --manifest-path research/polar-infrastructure/benchmark/Cargo.toml --bin environment_trace_manifest

      - name: Build manifest gate and run synthetic trace normalizer contract tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path research/polar-infrastructure/benchmark/Cargo.toml --bin environment_trace_manifest
          TRACE_MANIFEST_BIN=research/polar-infrastructure/benchmark/target/debug/environment_trace_manifest \
            bash research/polar-infrastructure/benchmark/scripts/test_normalize_nasa_power_daily.sh

      - name: Validate template with the Rust manifest gate
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path research/polar-infrastructure/benchmark/Cargo.toml --bin environment_trace_manifest -- research/polar-infrastructure/benchmark/fixtures/environment-trace-manifest-template-2026.json > /tmp/environment-trace-manifest-report.json
          jq -e '
            .report_kind == "symtropy-environment-trace-manifest-validation-report" and
            .contract_valid == true and
            .manifest_status == "template_only" and
            .candidate_for_independent_verification == false and
            .result_scope == "manifest_shape_and_gate_metadata_only_not_data_hash_or_physical_validation" and
            any(.warnings[]; contains("contains no acquired trace"))
          ' /tmp/environment-trace-manifest-report.json

          # Fail-closed negative control: the empty template must not become
          # replay-eligible merely by changing its status string.
          jq '.status = "validated_for_replay"' research/polar-infrastructure/benchmark/fixtures/environment-trace-manifest-template-2026.json > /tmp/incomplete-validated-trace.json
          if cargo run --locked --quiet --manifest-path research/polar-infrastructure/benchmark/Cargo.toml --bin environment_trace_manifest -- /tmp/incomplete-validated-trace.json > /tmp/incomplete-trace-report.json; then
            echo "ERROR: incomplete trace manifest was unexpectedly accepted"
            exit 1
          fi
          jq -e '
            .contract_valid == false and
            .candidate_for_independent_verification == false and
            any(.errors[]; contains("source_data_sha256")) and
            any(.errors[]; contains("sample counts"))
          ' /tmp/incomplete-trace-report.json
