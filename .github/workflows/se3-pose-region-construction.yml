name: SE3 Spacecraft Pose Region Construction

on:
  pull_request:
    paths:
      - "tools/se3-pose-region-construction-bench/**"
      - ".github/workflows/se3-pose-region-construction.yml"
  push:
    branches:
      - "research/se3-pose-region-construction-v0-1"
    paths:
      - "tools/se3-pose-region-construction-bench/**"
      - ".github/workflows/se3-pose-region-construction.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Conformal SE3 region and independent challenger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --manifest-path tools/se3-pose-region-construction-bench/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path tools/se3-pose-region-construction-bench/Cargo.toml
      - name: Strict Clippy
        run: cargo clippy --locked --manifest-path tools/se3-pose-region-construction-bench/Cargo.toml --all-targets -- -D warnings
      - name: Bind exact source and corpus
        run: |
          echo "CORPUS_SHA256=$(sha256sum tools/se3-pose-region-construction-bench/fixtures/pose-region-corpus-v0_1.csv | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Deterministic Rust receipt
        run: |
          CORPUS=tools/se3-pose-region-construction-bench/fixtures/pose-region-corpus-v0_1.csv
          cargo run --quiet --locked --manifest-path tools/se3-pose-region-construction-bench/Cargo.toml --bin se3-pose-region-construction-bench -- "$CORPUS" "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/se3-rust.json
          cargo run --quiet --locked --manifest-path tools/se3-pose-region-construction-bench/Cargo.toml --bin se3-pose-region-construction-bench -- "$CORPUS" "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/se3-rust-replay.json
          cmp /tmp/se3-rust.json /tmp/se3-rust-replay.json
      - name: Independent Python challenger
        run: |
          python3 tools/se3-pose-region-construction-bench/tests/reference_oracle.py tools/se3-pose-region-construction-bench/fixtures/pose-region-corpus-v0_1.csv "$GITHUB_SHA" "$CORPUS_SHA256" > /tmp/se3-python.json
      - name: Complete receipt equality and claim ceilings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rust = json.loads(Path("/tmp/se3-rust.json").read_text())
          oracle = json.loads(Path("/tmp/se3-python.json").read_text())
          assert rust == oracle, "Rust and independent Python receipts differ"
          assert rust["case_count"] == 35
          assert rust["expected_disposition_matches"] == 35
          assert rust["expected_disposition_mismatches"] == 0
          assert rust["claim_ready"] is False
          assert rust["source_bytes_authenticated"] is False
          assert rust["physical_calibration_validated"] is False
          assert rust["deterministic_safety_bound"] is False
          assert rust["maneuver_authority_granted"] is False
          cases = {item["case_id"]: item for item in rust["results"]}
          assert cases["R001"]["disposition"] == "CANDIDATE_STATISTICAL_POSE_REGION"
          assert cases["R006"]["disposition"] == "ABSTAIN_UNCALIBRATED"
          assert cases["R009"]["disposition"] == "INVALID_INPUT"
          assert cases["R022"]["disposition"] == "INVALID_COVARIANCE"
          assert cases["R026"]["disposition"] == "OVERFLOW"
          assert cases["R028"]["region"]["orientation_cap_urad"] == 3141593
          assert cases["R031"]["disposition"] == "DUPLICATE_SAMPLE"
          assert cases["R032"]["disposition"] == "DUPLICATE_SAMPLE"
          assert cases["R001"]["region_is_statistical"] is True
          assert cases["R001"]["deterministic_safety_bound"] is False
          PY
      - name: Retain exact receipts
        uses: actions/upload-artifact@v4
        with:
          name: se3-pose-region-construction-receipts
          path: |
            /tmp/se3-rust.json
            /tmp/se3-python.json
            /tmp/se3-rust-replay.json
          if-no-files-found: error
