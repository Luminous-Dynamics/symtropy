name: GLASS-SILICON Contract Audit

on:
  pull_request:
    paths:
      - "docs/tech/GLASS_SILICON_PROCESS_BENCHMARK_SUITE_V0_1.md"
      - "docs/tech/GLASS_SILICON_DECISION_VALUE_BENCHMARK_V0_1.md"
      - "docs/tech/glass-acquisition-policy-comparison-v0.1.schema.json"
      - "docs/tech/glass-acquisition-outcome-oracle-v0.1.schema.json"
      - "docs/tech/glass-acquisition-campaign-transcript-v0.1.schema.json"
      - "docs/tech/glass-causal-trial-v0.1.schema.json"
      - "docs/tech/GLASS_ADAPTIVE_SEARCH_SPACE_BENCHMARK_V0_1.md"
      - "docs/tech/glass-search-space-base-v0.1.schema.json"
      - "docs/tech/glass-search-space-proposal-v0.1.schema.json"
      - "docs/tech/glass-search-space-campaign-input-v0.1.schema.json"
      - "docs/tech/glass-search-space-outcome-oracle-v0.1.schema.json"
      - "docs/tech/glass-search-space-live-catalog-v0.1.schema.json"
      - "docs/tech/glass-search-space-live-oracle-v0.1.schema.json"
      - "docs/tech/GLASS_LIVE_POLICY_LOOP_PROTOCOL_V0_1.md"
      - "tools/glass-silicon-contract-audit/fixtures/acquisition-policy-comparison.synthetic.json"
      - "docs/tech/GLASS_FEASIBILITY_GATE_BENCHMARK_V0_1.md"
      - "docs/tech/GLASS_RELATIONSHIP_GRAPH_BENCHMARK_V0_1.md"
      - "docs/tech/glass-relationship-graph-v0.1.schema.json"
      - "docs/tech/GLASS_SEALED_EVALUATION_RECEIPT_V0_1.schema.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.schema.json"
      - "docs/tech/GLASS_SEALED_EVALUATION_RECEIPT_V0_1.schema.json"
      - "tools/glass-silicon-contract-audit/**"
      - ".github/workflows/glass-silicon-contract-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/tech/GLASS_SILICON_PROCESS_BENCHMARK_SUITE_V0_1.md"
      - "docs/tech/GLASS_SILICON_DECISION_VALUE_BENCHMARK_V0_1.md"
      - "docs/tech/glass-acquisition-policy-comparison-v0.1.schema.json"
      - "docs/tech/glass-acquisition-outcome-oracle-v0.1.schema.json"
      - "docs/tech/glass-acquisition-campaign-transcript-v0.1.schema.json"
      - "docs/tech/glass-causal-trial-v0.1.schema.json"
      - "docs/tech/GLASS_ADAPTIVE_SEARCH_SPACE_BENCHMARK_V0_1.md"
      - "docs/tech/glass-search-space-base-v0.1.schema.json"
      - "docs/tech/glass-search-space-proposal-v0.1.schema.json"
      - "docs/tech/glass-search-space-campaign-input-v0.1.schema.json"
      - "docs/tech/glass-search-space-outcome-oracle-v0.1.schema.json"
      - "docs/tech/glass-search-space-live-catalog-v0.1.schema.json"
      - "docs/tech/glass-search-space-live-oracle-v0.1.schema.json"
      - "docs/tech/GLASS_LIVE_POLICY_LOOP_PROTOCOL_V0_1.md"
      - "tools/glass-silicon-contract-audit/fixtures/acquisition-policy-comparison.synthetic.json"
      - "docs/tech/GLASS_FEASIBILITY_GATE_BENCHMARK_V0_1.md"
      - "docs/tech/GLASS_RELATIONSHIP_GRAPH_BENCHMARK_V0_1.md"
      - "docs/tech/glass-relationship-graph-v0.1.schema.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.schema.json"
      - "tools/glass-silicon-contract-audit/**"
      - ".github/workflows/glass-silicon-contract-audit.yml"

permissions:
  contents: read

concurrency:
  group: glass-silicon-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-audit:
    name: Contract and mass-ledger audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Test verifier and mutation controls
        run: cargo test --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml

      - name: Audit evaluation receipt schema and fail-closed fixtures
        shell: bash
        run: |
          schema="docs/tech/GLASS_SEALED_EVALUATION_RECEIPT_V0_1.schema.json"
          jq -e '.["$schema"] == "https://json-schema.org/draft/2020-12/schema" and .properties.evaluation_class.enum == ["UNSEALED_RETROSPECTIVE", "SEALED_CONFIRMATORY"] and .properties.dataset.properties.test_set_commitment.properties.scheme.const == "sha256-salted-v1"' "$schema" > /dev/null

          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-eval-receipt tools/glass-silicon-contract-audit/fixtures/evaluation-receipt-unsealed.synthetic.json > evaluation-receipt-unsealed.json
          grep -q '"status": "PASS"' evaluation-receipt-unsealed.json
          jq -e '.verified_evaluation_class == "UNSEALED_RETROSPECTIVE" and .metrics_checked == 1' evaluation-receipt-unsealed.json

          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-eval-receipt tools/glass-silicon-contract-audit/fixtures/evaluation-receipt-claimed-sealed.synthetic.json > evaluation-receipt-sealed.json
          sealed_status=$?
          set -e
          test "$sealed_status" -eq 3
          grep -q '"status": "UNRESOLVED"' evaluation-receipt-sealed.json
          grep -q 'SEALED_CLAIM_NOT_VERIFIED:' evaluation-receipt-sealed.json
          grep -q '"verified_evaluation_class": "UNSEALED_RETROSPECTIVE"' evaluation-receipt-sealed.json

          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-eval-receipt tools/glass-silicon-contract-audit/fixtures/evaluation-receipt-budget-overrun.synthetic.json > evaluation-receipt-overrun.json
          overrun_status=$?
          set -e
          test "$overrun_status" -eq 2
          grep -q '"status": "FAIL"' evaluation-receipt-overrun.json
          grep -q 'RESOURCE_OVERRUN:' evaluation-receipt-overrun.json

      - name: Audit frozen benchmark contract
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-corpus
          docs/tech/glass-silicon-process-benchmark-v0.1.schema.json
          docs/tech/glass-silicon-process-benchmark-v0.1.json

      - name: Audit feasibility-first protocol contract
        shell: bash
        run: |
          set -euo pipefail
          protocol="docs/tech/GLASS_FEASIBILITY_GATE_BENCHMARK_V0_1.md"
          test -s "$protocol"
          grep -q 'model the no-go region' "$protocol"
          grep -q 'non-glass-forming' "$protocol"
          grep -q 'GFRI-ML' "$protocol"
          grep -q 'unattempted, unknown or censored' "$protocol"
          grep -q 'false-feasible' "$protocol"
          grep -q 'system/family-held-out' "$protocol"
          grep -q 'UNRESOLVED' "$protocol"
          grep -q 'DOI 10.1111/jace.70616' "$protocol"
          grep -q 'DOI 10.1111/jace.70980' "$protocol"
          grep -q 'DOI 10.1016/j.jnoncrysol.2026.123990' "$protocol"
          grep -q 'audit-grouped-split <manifest.json>' "$protocol"
          grep -q 'group key occurring in more than one split' "$protocol"
          grep -q 'outcome labels and predictor features are forbidden' "$protocol"
          grep -q 'SHA-256 fingerprint of the raw manifest bytes' "$protocol"
          grep -q 'audit-false-feasible-bound <summary.json>' "$protocol"
          grep -q 'Hoeffding upper confidence bound' "$protocol"
          grep -q '600 independent negative units' "$protocol"
          grep -q 'Held-out evaluation integrity: declarations are not isolation' "$protocol"
          grep -q 'GLASS_SEALED_EVALUATION_RECEIPT_V0_1.schema.json' "$protocol"
          grep -q 'audit-eval-receipt <receipt.json>' "$protocol"
          grep -q 'SEALED_CONFIRMATORY' "$protocol"
          echo "Feasibility-gate and held-out evaluation trust-boundary controls: PASS"

      - name: Audit OOD acquisition-value protocol
        shell: bash
        run: |
          set -euo pipefail
          protocol="docs/tech/GLASS_SILICON_DECISION_VALUE_BENCHMARK_V0_1.md"
          test -s "$protocol"
          grep -q 'issue #2778' "$protocol"
          grep -q '10.1038/s41524-026-02368-4' "$protocol"
          grep -q '10.1038/s41467-023-42992-y' "$protocol"
          grep -qi 'random selection' "$protocol"
          grep -qi 'calibrated uncertainty' "$protocol"
          grep -qi 'out-of-distribution' "$protocol"
          grep -q 'same total budget' "$protocol"
          grep -q 'audit-acquisition-policies' "$protocol"
          grep -q 'glass-acquisition-policy-comparison-v0.1.schema.json' "$protocol"
          grep -q 'glass-acquisition-outcome-oracle-v0.1.schema.json' "$protocol"
          grep -q 'GLASS-CLOSED-LOOP-001 #2785' "$protocol"
          grep -q 'proceedings.mlr.press/v306/malik26a.html' "$protocol"
          grep -q 'audit-acquisition-transcript <transcript.json>' "$protocol"
          grep -q 'glass-acquisition-campaign-transcript-v0.1.schema.json' "$protocol"
          grep -q 'request/result pairing' "$protocol"
          grep -q 'calibration alone' "$protocol"
          grep -q 'GLASS-CAUSAL-TRIAL-001 #2787' "$protocol"
          grep -q 'audit-causal-trial <trial.json>' "$protocol"
          grep -q 'glass-causal-trial-v0.1.schema.json' "$protocol"
          grep -q 'randomization p-value' "$protocol"
          grep -q 'GLASS-SPACE-EXPANSION-001 #2788' "$protocol"
          grep -q 's43246-026-01304-9' "$protocol"
          grep -q 'A larger candidate pool, more unique compositions' "$protocol"
          echo "OOD acquisition-value protocol and matched-budget baselines: PASS"

      - name: Audit separated acquisition input/oracle schemas and known answer
        shell: bash
        run: |
          set -euo pipefail
          public_schema="docs/tech/glass-acquisition-policy-comparison-v0.1.schema.json"
          oracle_schema="docs/tech/glass-acquisition-outcome-oracle-v0.1.schema.json"
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.benchmark_id.const == "glass-silicon-decision-value-synthetic-v0.1" and
            .properties.acquisition_policy_comparison.properties.protocol_version.const == 1 and
            .properties.acquisition_policy_comparison.properties.random_seeds.minItems >= 10 and
            .properties.acquisition_policy_comparison.properties.random_seeds.uniqueItems == true and
            .properties.measurements.items.properties.selection_features.required == ["uncalibrated_uncertainty", "calibrated_uncertainty", "novelty", "estimated_voi"] and
            .additionalProperties == false and
            ((.properties | has("actions")) | not) and
            ((.properties | has("scenarios")) | not) and
            ((.properties.measurements.items.required | index("observation_by_scenario")) == null)
          ' "$public_schema" > /dev/null
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.schema_version.const == 1 and
            .properties.evidence_class.const == "synthetic_evaluator_only" and
            (.required | index("measurement_outcomes")) != null and
            .additionalProperties == false
          ' "$oracle_schema" > /dev/null

          public_input="tools/glass-silicon-contract-audit/fixtures/acquisition-policy-input.synthetic.json"
          sealed_oracle="tools/glass-silicon-contract-audit/fixtures/acquisition-outcome-oracle.synthetic.json"
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-acquisition-policies "$public_input" "$sealed_oracle" > acquisition-policy-comparison-report.json
          public_digest="$(sha256sum "$public_input" | awk '{print $1}')"
          oracle_digest="$(sha256sum "$sealed_oracle" | awk '{print $1}')"
          jq -e --arg public_digest "$public_digest" --arg oracle_digest "$oracle_digest" '
            .status == "PASS" and
            .audit_kind == "synthetic_acquisition_policy_comparison" and
            .input_sha256 == $public_digest and
            .oracle_sha256 == $oracle_digest and
            .random_seed_count == 16 and
            .available_measurements == 3 and
            .budget_eligible_measurements == 2 and
            .pre_measurement_worst_case_regret == 5.0 and
            (.policies | length) == 5 and
            ([.policies[] | select(.policy == "random")][0].runs | length) == 16 and
            ([.policies[] | select(.policy == "calibrated_uncertainty")][0].runs[0].selected_measurement_id == "measure-noise") and
            ([.policies[] | select(.policy == "calibrated_uncertainty")][0].runs[0].gross_worst_case_regret_reduction == 0.0) and
            ([.policies[] | select(.policy == "novelty")][0].runs[0].selected_measurement_id == "measure-regime") and
            ([.policies[] | select(.policy == "novelty")][0].runs[0].gross_worst_case_regret_reduction == 5.0) and
            ([.policies[] | select(.policy == "cost_aware_voi")][0].runs[0].selected_measurement_id == "measure-regime") and
            ([.policies[] | .runs[] | select(.selected_measurement_id == "measure-expensive")] | length) == 0
          ' acquisition-policy-comparison-report.json
          echo "Separated policy-visible catalog and sealed oracle known answer: PASS"

      - name: Audit acquisition campaign transcript schema and known answer
        shell: bash
        run: |
          set -euo pipefail
          schema="docs/tech/glass-acquisition-campaign-transcript-v0.1.schema.json"
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.schema_version.const == 1 and
            .properties.events.maxItems == 10000 and
            (.properties.events.items.oneOf | length) == 3 and
            .properties.events.items.oneOf[0].properties.event_type.const == "measurement_requested" and
            .properties.events.items.oneOf[1].properties.event_type.const == "measurement_result" and
            .properties.events.items.oneOf[2].properties.event_type.const == "decision" and
            (.required | index("measurement_cost_catalog")) != null and
            .properties.measurement_cost_catalog.items.properties.cost_units.exclusiveMinimum == 0 and
            .properties.measurement_cost_catalog.items.properties.duration_seconds.minimum == 0 and
            .additionalProperties == false
          ' "$schema" > /dev/null

          fixture="tools/glass-silicon-contract-audit/fixtures/acquisition-campaign-transcript.synthetic.json"
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- audit-acquisition-transcript "$fixture" > acquisition-campaign-transcript-report.json
          digest="$(sha256sum "$fixture" | awk '{print $1}')"
          jq -e --arg digest "$digest" '
            .status == "PASS" and
            .audit_kind == "acquisition_campaign_transcript" and
            .transcript_sha256 == $digest and
            .events_checked == 3 and
            .measurement_requests == 1 and
            .measurement_results == 1 and
            .total_cost_units == 2.0 and
            .total_duration_seconds == 20.0 and
            .final_decision_status == "UNRESOLVED"
          ' acquisition-campaign-transcript-report.json
          echo "Acquisition campaign transcript ordering and charged-budget known answer: PASS"

      - name: Audit paired causal trial schema and synthetic effect
        shell: bash
        run: |
          set -euo pipefail
          schema="docs/tech/glass-causal-trial-v0.1.schema.json"
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.schema_version.const == 1 and
            .properties.benchmark_id.const == "glass-causal-trial-synthetic-v0-1" and
            .properties.preregistration.properties.design.const == "balanced_paired_randomized_crossover" and
            .properties.blocks.minItems >= 2 and
            .properties.blocks.maxItems <= 20 and
            .additionalProperties == false
          ' "$schema" > /dev/null

          fixture="tools/glass-silicon-contract-audit/fixtures/causal-trial-paired-block.synthetic.json"
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- audit-causal-trial "$fixture" > causal-trial-report.json
          digest="$(sha256sum "$fixture" | awk '{print $1}')"
          jq -e --arg digest "$digest" '
            .status == "PASS" and
            .claim_status == "SUPPORTED" and
            .audit_kind == "paired_block_causal_trial" and
            .trial_sha256 == $digest and
            .blocks_declared == 8 and
            .complete_pairs == 8 and
            .control_then_treatment_blocks == 4 and
            .treatment_then_control_blocks == 4 and
            .mean_relative_reduction >= 0.05 and
            .relative_reduction_ci95[0] >= 0.05 and
            .exact_two_sided_randomization_p <= 0.05
          ' causal-trial-report.json
          echo "Paired-block causal effect and randomized inference known answer: PASS"

      - name: Audit relationship graph JSON schema
        shell: bash
        run: |
          set -euo pipefail
          schema="docs/tech/glass-relationship-graph-v0.1.schema.json"
          jq -e '
            .["$schema"] == "https://json-schema.org/draft/2020-12/schema" and
            .properties.schema_version.const == 1 and
            .properties.allowed_splits.const == ["train", "validation", "test"] and
            .properties.edges.items.properties.state.enum == ["verified", "candidate", "contradicted", "unknown"] and
            .properties.nodes.items.properties.split_required.type == "boolean" and
            (.properties.nodes.items.required | index("split_required")) != null and
            .properties.relation_profile.const == "provenance_identity_v0" and
            .properties.leakage_edge_types.const == ["derived_from", "replicate_of", "same_record"] and
            .additionalProperties == false
          ' "$schema" > /dev/null
          echo "Relationship graph schema and relationship-state contract: PASS"

      - name: Audit relationship-aware evidence protocol contract
        shell: bash
        run: |
          set -euo pipefail
          protocol="docs/tech/GLASS_RELATIONSHIP_GRAPH_BENCHMARK_V0_1.md"
          test -s "$protocol"
          grep -q 'one evidence graph, multiple relation profiles' "$protocol"
          grep -q 'Unknown is not false' "$protocol"
          grep -q 'connected components' "$protocol"
          grep -q 'transitive-leak' "$protocol"
          grep -q 'not-reject-all' "$protocol"
          grep -qi 'downstream dependency testing' "$protocol"
          grep -q 'UNRESOLVED' "$protocol"
          grep -q 'raw and canonical graph hashes' "$protocol"
          grep -q 'glass-relationship-graph-v0.1.schema.json' "$protocol"
          grep -q 'split_required' "$protocol"
          grep -q 'unregistered relation profile' "$protocol"
          echo "Relationship-aware evidence contract and anti-leakage requirements: PASS"

      - name: Audit relationship graph known-answer controls
        shell: bash
        run: |
          set -euo pipefail
          manifest="tools/glass-silicon-contract-audit/fixtures/relationship-graph-valid.synthetic.json"
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- audit-relationship-graph "$manifest" > relationship-graph-valid-report.json
          digest="$(sha256sum "$manifest" | awk '{print $1}')"
          jq -e --arg digest "$digest" '
            .status == "PASS" and
            .audit_kind == "relationship_graph_split_isolation" and
            .schema_version == 1 and
            .graph_sha256 == $digest and
            (.canonical_graph_sha256 | test("^[0-9a-f]{64}$")) and
            .nodes_checked == 6 and
            .edges_checked == 3 and
            .assignments_checked == 3 and
            .split_counts.train == 1 and
            .split_counts.validation == 1 and
            .split_counts.test == 1 and
            (.witness_paths | length) == 0
          ' relationship-graph-valid-report.json

          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- audit-relationship-graph \
            tools/glass-silicon-contract-audit/fixtures/relationship-graph-transitive-leak.synthetic.json > relationship-graph-leak-report.json
          leak_status=$?
          set -e
          test "$leak_status" -eq 2
          jq -e '
            .status == "FAIL" and
            (.findings | any(startswith("RELATION_LEAKAGE:"))) and
            (.witness_paths | length) > 0
          ' relationship-graph-leak-report.json

          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- audit-relationship-graph \
            tools/glass-silicon-contract-audit/fixtures/relationship-graph-uncertain-link.synthetic.json > relationship-graph-uncertain-report.json
          uncertain_status=$?
          set -e
          test "$uncertain_status" -eq 3
          jq -e '
            .status == "UNRESOLVED" and
            (.findings | any(startswith("RELATION_UNCERTAIN_CROSS_SPLIT:")))
          ' relationship-graph-uncertain-report.json

      - name: Audit grouped-split leakage manifest
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-grouped-split
          tools/glass-silicon-contract-audit/fixtures/grouped-split-manifest.synthetic.json

      - name: Assert grouped-split known answer
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-grouped-split tools/glass-silicon-contract-audit/fixtures/grouped-split-manifest.synthetic.json > grouped-split-report.json
          grep -q '"status": "PASS"' grouped-split-report.json
          fixture="tools/glass-silicon-contract-audit/fixtures/grouped-split-manifest.synthetic.json"
          expected_sha256="$(sha256sum "$fixture" | awk '{print $1}')"
          jq -e --arg digest "$expected_sha256" '
            .status == "PASS" and
            .evidence_class == "synthetic" and
            .manifest_sha256 == $digest and
            (.manifest_sha256 | test("^[0-9a-f]{64}$")) and
            .records_checked == 7 and
            .split_counts.train == 3 and
            .split_counts.validation == 2 and
            .split_counts.test == 2 and
            (.grouping_fields | sort) == ["composition_family_id", "synthesis_campaign_id"] and
            (.findings | length) == 0
          ' grouped-split-report.json

      - name: Audit false-feasible upper confidence bound
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-false-feasible-bound
          tools/glass-silicon-contract-audit/fixtures/false-feasible-bound.synthetic.json

      - name: Assert 600-negative false-feasible threshold
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-false-feasible-bound tools/glass-silicon-contract-audit/fixtures/false-feasible-bound.synthetic.json > false-feasible-bound-report.json
          grep -q '"status": "PASS"' false-feasible-bound-report.json
          jq -e '
            .independent_negative_units == 600 and
            .false_feasible_count == 0 and
            .confidence_level == 0.95 and
            .target_upper_bound == 0.05 and
            .target_met == true and
            .hoeffding_upper_bound <= 0.05 and
            .hoeffding_upper_bound > 0.0499
          ' false-feasible-bound-report.json

      - name: Abstain when negative sample is underpowered
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-false-feasible-bound tools/glass-silicon-contract-audit/fixtures/false-feasible-bound-underpowered.synthetic.json > false-feasible-underpowered.json
          status=$?
          set -e
          test "$status" -eq 3
          grep -q '"status": "UNRESOLVED"' false-feasible-underpowered.json
          jq -e '.independent_negative_units == 599 and .target_met == false and .hoeffding_upper_bound > 0.05' false-feasible-underpowered.json

      - name: Audit synthetic staged-feasibility corpus
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-feasibility
          tools/glass-silicon-contract-audit/fixtures/glass-feasibility-gate.synthetic.json

      - name: Assert staged-feasibility known answers
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-feasibility tools/glass-silicon-contract-audit/fixtures/glass-feasibility-gate.synthetic.json > feasibility-report.json
          grep -q '"status": "PASS"' feasibility-report.json
