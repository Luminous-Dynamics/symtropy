name: GLASS-SILICON Contract Audit

on:
  pull_request:
    paths:
      - "docs/tech/GLASS_SILICON_PROCESS_BENCHMARK_SUITE_V0_1.md"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.schema.json"
      - "tools/glass-silicon-contract-audit/**"
      - ".github/workflows/glass-silicon-contract-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/tech/GLASS_SILICON_PROCESS_BENCHMARK_SUITE_V0_1.md"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.schema.json"
      - "tools/glass-silicon-contract-audit/**"
      - ".github/workflows/glass-silicon-contract-audit.yml"

permissions:
  contents: read

concurrency:
  group: glass-silicon-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-audit:
    name: Contract and mass-ledger audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Test verifier and mutation controls
        run: cargo test --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml

      - name: Audit frozen benchmark contract
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-corpus
          docs/tech/glass-silicon-process-benchmark-v0.1.schema.json
          docs/tech/glass-silicon-process-benchmark-v0.1.json

      - name: Accept balanced synthetic ledger
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          check-mass
          tools/glass-silicon-contract-audit/fixtures/mass-balanced.synthetic.json

      - name: Reject unbalanced synthetic ledger
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            check-mass tools/glass-silicon-contract-audit/fixtures/mass-unbalanced.synthetic.json > unbalanced-report.json
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"status": "FAIL"' unbalanced-report.json

      - name: Abstain on incomplete synthetic ledger
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            check-mass tools/glass-silicon-contract-audit/fixtures/mass-census-incomplete.synthetic.json > incomplete-report.json
          status=$?
          set -e
          test "$status" -eq 3
          grep -q '"status": "UNRESOLVED"' incomplete-report.json

      - name: Hash synthetic artifact and preserve admission block
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            hash-artifacts \
            tools/glass-silicon-contract-audit/fixtures/hash-receipt-corpus.synthetic.json \
            local-hash-selftest-v1 \
            tools/glass-silicon-contract-audit/fixtures > hash-receipt.json
          grep -q '"status": "HASHED_PENDING_ADMISSION"' hash-receipt.json
          grep -q '"md5_matches": true' hash-receipt.json
          grep -q '"observed_sha256": "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"' hash-receipt.json
          grep -q '"rights_status": "unresolved"' hash-receipt.json
          grep -q '"manifest_admission_status": "blocked"' hash-receipt.json
