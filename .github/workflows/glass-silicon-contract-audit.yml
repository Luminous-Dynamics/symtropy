name: GLASS-SILICON Contract Audit

on:
  pull_request:
    paths:
      - "docs/tech/GLASS_SILICON_PROCESS_BENCHMARK_SUITE_V0_1.md"
      - "docs/tech/GLASS_SILICON_DECISION_VALUE_BENCHMARK_V0_1.md"
      - "docs/tech/GLASS_FEASIBILITY_GATE_BENCHMARK_V0_1.md"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.schema.json"
      - "tools/glass-silicon-contract-audit/**"
      - ".github/workflows/glass-silicon-contract-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/tech/GLASS_SILICON_PROCESS_BENCHMARK_SUITE_V0_1.md"
      - "docs/tech/GLASS_SILICON_DECISION_VALUE_BENCHMARK_V0_1.md"
      - "docs/tech/GLASS_FEASIBILITY_GATE_BENCHMARK_V0_1.md"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.json"
      - "docs/tech/glass-silicon-process-benchmark-v0.1.schema.json"
      - "tools/glass-silicon-contract-audit/**"
      - ".github/workflows/glass-silicon-contract-audit.yml"

permissions:
  contents: read

concurrency:
  group: glass-silicon-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-audit:
    name: Contract and mass-ledger audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Test verifier and mutation controls
        run: cargo test --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml

      - name: Audit frozen benchmark contract
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-corpus
          docs/tech/glass-silicon-process-benchmark-v0.1.schema.json
          docs/tech/glass-silicon-process-benchmark-v0.1.json

      - name: Audit feasibility-first protocol contract
        shell: bash
        run: |
          set -euo pipefail
          protocol="docs/tech/GLASS_FEASIBILITY_GATE_BENCHMARK_V0_1.md"
          test -s "$protocol"
          grep -q 'model the no-go region' "$protocol"
          grep -q 'non-glass-forming' "$protocol"
          grep -q 'GFRI-ML' "$protocol"
          grep -q 'unattempted, unknown or censored' "$protocol"
          grep -q 'false-feasible' "$protocol"
          grep -q 'system/family-held-out' "$protocol"
          grep -q 'UNRESOLVED' "$protocol"
          grep -q 'DOI 10.1111/jace.70616' "$protocol"
          grep -q 'DOI 10.1111/jace.70980' "$protocol"
          grep -q 'DOI 10.1016/j.jnoncrysol.2026.123990' "$protocol"
          grep -q 'audit-grouped-split <manifest.json>' "$protocol"
          grep -q 'group key occurring in more than one split' "$protocol"
          grep -q 'outcome labels and predictor features are forbidden' "$protocol"
          echo "Feasibility-gate protocol structural controls: PASS"

      - name: Audit grouped-split leakage manifest
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-grouped-split
          tools/glass-silicon-contract-audit/fixtures/grouped-split-manifest.synthetic.json

      - name: Assert grouped-split known answer
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-grouped-split tools/glass-silicon-contract-audit/fixtures/grouped-split-manifest.synthetic.json > grouped-split-report.json
          grep -q '"status": "PASS"' grouped-split-report.json
          jq -e '
            .records_checked == 7 and
            .split_counts.train == 3 and
            .split_counts.validation == 2 and
            .split_counts.test == 2 and
            (.grouping_fields | sort) == ["composition_family_id", "synthesis_campaign_id"] and
            (.findings | length) == 0
          ' grouped-split-report.json

      - name: Audit grouped-split leakage manifest
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-grouped-split
          tools/glass-silicon-contract-audit/fixtures/grouped-split-manifest.synthetic.json

      - name: Assert grouped-split known answer
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-grouped-split tools/glass-silicon-contract-audit/fixtures/grouped-split-manifest.synthetic.json > grouped-split-report.json
          grep -q '"status": "PASS"' grouped-split-report.json
          jq -e '
            .records_checked == 7 and
            .split_counts.train == 3 and
            .split_counts.validation == 2 and
            .split_counts.test == 2 and
            (.grouping_fields | sort) == ["composition_family_id", "synthesis_campaign_id"] and
            (.findings | length) == 0
          ' grouped-split-report.json

      - name: Audit synthetic staged-feasibility corpus
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-feasibility
          tools/glass-silicon-contract-audit/fixtures/glass-feasibility-gate.synthetic.json

      - name: Assert staged-feasibility known answers
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-feasibility tools/glass-silicon-contract-audit/fixtures/glass-feasibility-gate.synthetic.json > feasibility-report.json
          grep -q '"status": "PASS"' feasibility-report.json
          jq -e '
            ([.candidates[] | select(.candidate_id == "control-feasible")][0].derived_disposition == "FEASIBLE") and
            ([.candidates[] | select(.candidate_id == "control-non-forming")][0].derived_disposition == "INFEASIBLE") and
            ([.candidates[] | select(.candidate_id == "control-joint-property-failure")][0].derived_disposition == "INFEASIBLE") and
            ([.candidates[] | select(.candidate_id == "control-unknown-measurement")][0].derived_disposition == "UNRESOLVED") and
            ([.candidates[] | select(.candidate_id == "control-out-of-domain")][0].derived_disposition == "UNRESOLVED") and
            ([.candidates[] | select(.candidate_id == "control-stale-process-evidence")][0].derived_disposition == "UNRESOLVED") and
            ([.candidates[] | select(.candidate_id == "control-non-forming")][0].blocking_gates == ["glass_formation"])
          ' feasibility-report.json

      - name: Compare feasibility-gated one-step and adaptive policies
        shell: bash
        run: |
          set -euo pipefail
          fixture="tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool-feasibility-gated.synthetic.json"

          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-decision-value "$fixture" > feasibility-gated-myopic.json
          grep -q '"status": "PASS"' feasibility-gated-myopic.json
          jq -e '
            .pre_measurement_worst_case_regret == 10.0 and
            .oracle_measurement_id == "a-screen-formation" and
            .oracle_worst_case_regret_after == 10.0 and
            .oracle_gross_regret_reduction == 0.0
          ' feasibility-gated-myopic.json

          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-adaptive-campaign "$fixture" > feasibility-gated-adaptive.json
          grep -q '"status": "PASS"' feasibility-gated-adaptive.json
          grep -q '"adaptive_oracle_worst_case_regret": 0.0' feasibility-gated-adaptive.json
          grep -q '"adaptive_oracle_gross_regret_reduction": 10.0' feasibility-gated-adaptive.json
          grep -q '"adaptive_oracle_max_path_cost_units": 4.0' feasibility-gated-adaptive.json
          grep -q '"adaptive_oracle_max_path_duration_seconds": 12.0' feasibility-gated-adaptive.json
          grep -q '"adaptive_oracle_max_measurements_on_path": 2' feasibility-gated-adaptive.json
          jq -e '
            .policy_tree.measurement_id == "a-screen-formation" and
            .policy_tree.observation_branches["non-forming"].node_type == "STOP" and
            .policy_tree.observation_branches["non-forming"].action_id == "reject" and
            .policy_tree.observation_branches["forming"].node_type == "MEASURE" and
            .policy_tree.observation_branches["forming"].measurement_id == "b-characterize-route" and
            .policy_tree.observation_branches["forming"].observation_branches["route-a"].action_id == "route-a" and
            .policy_tree.observation_branches["forming"].observation_branches["route-b"].action_id == "route-b"
          ' feasibility-gated-adaptive.json

      - name: Audit synthetic decision-value pool and exact one-step oracle
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-decision-value
          tools/glass-silicon-contract-audit/fixtures/decision-value-pool.synthetic.json

      - name: Assert synthetic decision-value known answer
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-decision-value tools/glass-silicon-contract-audit/fixtures/decision-value-pool.synthetic.json > decision-value-report.json
          grep -q '"status": "PASS"' decision-value-report.json
          grep -q '"oracle_measurement_id": "measure-regime"' decision-value-report.json
          grep -q '"pre_measurement_worst_case_regret": 5.0' decision-value-report.json
          grep -q '"oracle_worst_case_regret_after": 0.0' decision-value-report.json
          grep -q '"oracle_gross_regret_reduction": 5.0' decision-value-report.json
          grep -q '"measurement_id": "measure-expensive"' decision-value-report.json
          grep -q '"within_budget": false' decision-value-report.json

      - name: Audit adaptive synthetic campaign oracle
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-adaptive-campaign
          tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool.synthetic.json

      - name: Assert adaptive campaign known answer
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-adaptive-campaign tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool.synthetic.json > adaptive-campaign-report.json
          grep -q '"status": "PASS"' adaptive-campaign-report.json
          grep -q '"pre_measurement_worst_case_regret": 6.0' adaptive-campaign-report.json
          grep -q '"adaptive_oracle_worst_case_regret": 0.0' adaptive-campaign-report.json
          grep -q '"adaptive_oracle_gross_regret_reduction": 6.0' adaptive-campaign-report.json
          grep -q '"adaptive_oracle_max_path_cost_units": 2.0' adaptive-campaign-report.json
          grep -q '"adaptive_oracle_max_path_duration_seconds": 20.0' adaptive-campaign-report.json
          grep -q '"adaptive_oracle_max_measurements_on_path": 2' adaptive-campaign-report.json
          grep -q '"measurement_id": "measure-alpha"' adaptive-campaign-report.json
          grep -q '"measurement_id": "measure-beta"' adaptive-campaign-report.json

      - name: Audit adaptive drift and failed-measurement stress fixture
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          audit-adaptive-campaign
          tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool-drift-failure.synthetic.json

      - name: Assert recovery from drift and invalid primary observations
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-adaptive-campaign tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool-drift-failure.synthetic.json > adaptive-drift-report.json
          grep -q '"status": "PASS"' adaptive-drift-report.json
          grep -q '"pre_measurement_worst_case_regret": 6.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_worst_case_regret": 0.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_gross_regret_reduction": 6.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_max_path_cost_units": 4.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_max_path_duration_seconds": 20.0' adaptive-drift-report.json
          grep -q '"measurement_id": "measure-primary"' adaptive-drift-report.json
          grep -q '"measurement_id": "measure-secondary"' adaptive-drift-report.json
          grep -q '"observation_branches": {' adaptive-drift-report.json

      - name: Compare myopic and adaptive policies under drift and failed observations
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-decision-value tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool-drift-failure.synthetic.json > drift-myopic-report.json
          grep -q '"status": "PASS"' drift-myopic-report.json
          grep -q '"pre_measurement_worst_case_regret": 6.0' drift-myopic-report.json
          grep -q '"oracle_worst_case_regret_after": 6.0' drift-myopic-report.json
          grep -q '"oracle_gross_regret_reduction": 0.0' drift-myopic-report.json

          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-adaptive-campaign tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool-drift-failure.synthetic.json > adaptive-drift-report.json
          grep -q '"status": "PASS"' adaptive-drift-report.json
          grep -q '"pre_measurement_worst_case_regret": 6.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_worst_case_regret": 0.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_gross_regret_reduction": 6.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_max_path_cost_units": 4.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_max_path_duration_seconds": 20.0' adaptive-drift-report.json
          grep -q '"adaptive_oracle_max_measurements_on_path": 2' adaptive-drift-report.json
          grep -q '"measurement_id": "measure-primary"' adaptive-drift-report.json
          grep -q '"measurement_id": "measure-secondary"' adaptive-drift-report.json
          grep -q '"action_id": "route-a"' adaptive-drift-report.json
          grep -q '"observation_branches": {' adaptive-drift-report.json
          jq -e '
            .policy_tree.measurement_id == "measure-primary" and
            .policy_tree.observation_branches["signal-a"].node_type == "STOP" and
            .policy_tree.observation_branches["signal-a"].action_id == "route-a" and
            .policy_tree.observation_branches["signal-b"].node_type == "MEASURE" and
            .policy_tree.observation_branches["signal-b"].measurement_id == "measure-secondary" and
            .policy_tree.observation_branches["signal-b"].observation_branches["signal-a"].node_type == "STOP" and
            .policy_tree.observation_branches["signal-b"].observation_branches["signal-a"].action_id == "route-a" and
            .policy_tree.observation_branches["signal-b"].observation_branches["no-signal"].node_type == "STOP" and
            .policy_tree.observation_branches["signal-b"].observation_branches["no-signal"].action_id == "route-b" and
            .policy_tree.observation_branches["invalid"].node_type == "MEASURE" and
            .policy_tree.observation_branches["invalid"].measurement_id == "measure-secondary" and
            .policy_tree.observation_branches["invalid"].observation_branches["signal-a"].action_id == "route-a" and
            .policy_tree.observation_branches["invalid"].observation_branches["signal-b"].action_id == "route-b"
          ' adaptive-drift-report.json

      - name: Abstain when no robust action exists and budget blocks resolution
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            audit-adaptive-campaign tools/glass-silicon-contract-audit/fixtures/adaptive-decision-pool-budget-blocked.synthetic.json > adaptive-blocked-report.json
          status=$?
          set -e
          test "$status" -eq 3
          grep -q '"status": "UNRESOLVED"' adaptive-blocked-report.json
          grep -q 'NO_FEASIBLE_ADAPTIVE_POLICY:' adaptive-blocked-report.json

      - name: Accept balanced synthetic ledger
        run: >
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml --
          check-mass
          tools/glass-silicon-contract-audit/fixtures/mass-balanced.synthetic.json

      - name: Reject unbalanced synthetic ledger
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            check-mass tools/glass-silicon-contract-audit/fixtures/mass-unbalanced.synthetic.json > unbalanced-report.json
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"status": "FAIL"' unbalanced-report.json

      - name: Abstain on incomplete synthetic ledger
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            check-mass tools/glass-silicon-contract-audit/fixtures/mass-census-incomplete.synthetic.json > incomplete-report.json
          status=$?
          set -e
          test "$status" -eq 3
          grep -q '"status": "UNRESOLVED"' incomplete-report.json

      - name: Hash synthetic artifact and preserve admission block
        shell: bash
        run: |
          cargo run --locked --manifest-path tools/glass-silicon-contract-audit/Cargo.toml -- \
            hash-artifacts \
            tools/glass-silicon-contract-audit/fixtures/hash-receipt-corpus.synthetic.json \
            local-hash-selftest-v1 \
            tools/glass-silicon-contract-audit/fixtures > hash-receipt.json
          grep -q '"status": "HASHED_PENDING_ADMISSION"' hash-receipt.json
          grep -q '"md5_matches": true' hash-receipt.json
          grep -q '"observed_sha256": "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"' hash-receipt.json
          grep -q '"rights_status": "unresolved"' hash-receipt.json
          grep -q '"manifest_admission_status": "blocked"' hash-receipt.json
