name: water-mixing-constrained-kernel-id-t0

on:
  pull_request:
    paths:
      - ".github/workflows/water-mixing-constrained-kernel-id-t0.yml"
      - "tools/water-service-t0/src/bin/constrained-kernel-id-t0.rs"
      - "research/water-intrusion-coupling/constrained-kernel-id-t0-*.json"
      - "research/water-intrusion-coupling/CONSTRAINED_KERNEL_ID_T0_V0_1.md"
  push:
    branches:
      - main
      - research/water-mixing-constrained-id-t0-v0.1
    paths:
      - ".github/workflows/water-mixing-constrained-kernel-id-t0.yml"
      - "tools/water-service-t0/src/bin/constrained-kernel-id-t0.rs"
      - "research/water-intrusion-coupling/constrained-kernel-id-t0-*.json"
      - "research/water-intrusion-coupling/CONSTRAINED_KERNEL_ID_T0_V0_1.md"

permissions:
  contents: read

concurrency:
  group: water-mixing-constrained-kernel-id-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constrained-kernel-id-t0:
    name: Rust format, tests, clippy and weighted-identification oracle replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check evaluator formatting
        run: rustfmt --edition 2024 --check tools/water-service-t0/src/bin/constrained-kernel-id-t0.rs

      - name: Run native estimator tests
        run: cargo test --locked --manifest-path tools/water-service-t0/Cargo.toml --bin constrained-kernel-id-t0

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path tools/water-service-t0/Cargo.toml --bin constrained-kernel-id-t0 -- -D warnings

      - name: Replay frozen weighted-identification oracle
        env:
          WATER_MIXING_CONSTRAINED_ID_T0_REVISION: ${{ github.sha }}
        run: |
          cargo run --locked --manifest-path tools/water-service-t0/Cargo.toml --bin constrained-kernel-id-t0 --             research/water-intrusion-coupling/constrained-kernel-id-t0-cases-v0.1.json             research/water-intrusion-coupling/constrained-kernel-id-t0-oracle-v0.1.json             research/water-intrusion-coupling/constrained-kernel-id-t0-manifest-v0.1.json             artifacts/water-mixing-constrained-id-t0/receipt.json

      - name: Archive synthetic identification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-mixing-constrained-id-t0-${{ github.sha }}
          path: artifacts/water-mixing-constrained-id-t0/receipt.json
          if-no-files-found: warn
