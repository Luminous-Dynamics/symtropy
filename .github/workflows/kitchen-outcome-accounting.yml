name: Kitchen Outcome Accounting

on:
  pull_request:
    paths:
      - "crates/domains/symtropy-kitchen-planner/src/outcome_accounting.rs"
      - "crates/domains/symtropy-kitchen-planner/schemas/**"
      - "tools/kitchen-outcome-accounting-harness/**"
      - ".github/workflows/kitchen-outcome-accounting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchen-outcome-accounting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-kernel:
    name: Focused outcome accounting kernel (exact head)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUSTUP_TOOLCHAIN: 1.96.1
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --manifest-path tools/kitchen-outcome-accounting-harness/Cargo.toml --all -- --check

      - name: Run production-source unit tests
        run: cargo test --manifest-path tools/kitchen-outcome-accounting-harness/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/kitchen-outcome-accounting-harness/Cargo.toml --all-targets -- -D warnings
