name: CivDyn cross-scale resilience reference

on:
  pull_request:
    paths:
      - "research/civdyn-cross-scale-resilience/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-cross-scale-resilience.yml"
  push:
    paths:
      - "research/civdyn-cross-scale-resilience/**"
      - "research/civdyn-resource-ledger/**"
      - ".github/workflows/civdyn-cross-scale-resilience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, check, test and execute cross-scale resilience benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path research/civdyn-cross-scale-resilience/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path research/civdyn-cross-scale-resilience/Cargo.toml --all-targets -- -D warnings

      - name: Check all targets with locked dependencies
        run: cargo check --locked --manifest-path research/civdyn-cross-scale-resilience/Cargo.toml --all-targets

      - name: Run all tests with locked dependencies
        run: cargo test --locked --manifest-path research/civdyn-cross-scale-resilience/Cargo.toml --all-targets

      - name: Execute cross-scale shock and recovery portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/civdyn-resilience-evidence
          cargo run --locked --manifest-path research/civdyn-cross-scale-resilience/Cargo.toml --bin cross-scale-resilience-sweep \
            | tee target/civdyn-resilience-evidence/cross-scale-resilience.csv

      - name: Verify portfolio, service separation, recovery and conservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("target/civdyn-resilience-evidence/cross-scale-resilience.csv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 132, f"expected 12 summary + 120 tick records, got {len(rows)}"
          assert all(len(row) == 25 for row in rows)
          summaries = { (r["scenario"], r["policy"]): r for r in rows if r["record_type"] == "summary" }
          ticks = [r for r in rows if r["record_type"] == "tick"]
          assert len(summaries) == 12 and len(ticks) == 120
          assert {r["scenario"] for r in rows} == {"water_supply", "energy_supply", "compound_water_energy"}
          assert all(float(r["max_water_conservation_residual_m3"]) < 1e-9 for r in summaries.values())
          assert all(float(r["max_energy_conservation_residual_kwh"]) < 1e-9 for r in summaries.values())

          compound_no_transfer = summaries[("compound_water_energy", "no_transfer")]
          assert float(compound_no_transfer["total_or_tick_unmet_water_m3"]) > 0
          assert float(compound_no_transfer["total_or_tick_unmet_energy_kwh"]) > 0
          assert compound_no_transfer["recovery_after_ticks"] == ""

          water_only = summaries[("water_supply", "proportional_solidarity")]
          energy_only = summaries[("energy_supply", "proportional_solidarity")]
          compound = summaries[("compound_water_energy", "proportional_solidarity")]
          assert float(water_only["total_or_tick_unmet_water_m3"]) > 0
          assert float(water_only["total_or_tick_unmet_energy_kwh"]) == 0
          assert float(energy_only["total_or_tick_unmet_water_m3"]) == 0
          assert float(energy_only["total_or_tick_unmet_energy_kwh"]) > 0
          assert float(compound["total_or_tick_unmet_water_m3"]) > 0
          assert float(compound["total_or_tick_unmet_energy_kwh"]) > 0
          assert compound["recovery_after_ticks"] == "2"

          for row in ticks:
              for key in ("water_coverage_h1","water_coverage_h2","water_coverage_h3","water_coverage_h4",
                          "energy_coverage_h1","energy_coverage_h2","energy_coverage_h3","energy_coverage_h4"):
                  assert 0.0 <= float(row[key]) <= 1.0

          print("CIVDYN-RES-001 portfolio, unit-separated deficits, sustained recovery and conservation controls verified.")
          PY

          {
            echo "## CIVDYN-RES-001 execution"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Output SHA-256: $(sha256sum target/civdyn-resilience-evidence/cross-scale-resilience.csv | cut -d' ' -f1)"
            echo "- Claim ceiling: deterministic synthetic trajectory fixture"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cross-scale resilience evidence
        uses: actions/upload-artifact@v4
        with:
          name: civdyn-cross-scale-resilience
          path: target/civdyn-resilience-evidence/cross-scale-resilience.csv
          if-no-files-found: error
          retention-days: 30
