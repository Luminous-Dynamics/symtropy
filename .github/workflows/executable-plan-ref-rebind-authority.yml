name: Executable Plan Ref Rebind Authority

on:
  pull_request:
    branches: [ "fabrication/executable-plan-content-identity" ]

permissions:
  contents: write

concurrency:
  group: executable-plan-ref-rebind-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: /tmp/symtropy-executable-plan-ref-rebind-target
  PRODUCT_BRANCH: fabrication/executable-plan-ref-rebind
  PRODUCT_PARENT: 0679a625013737ff45d5a4bb9b2beb4c6966dd5d
  PRODUCT_PARENT_TREE: 817f5c17c633d34d99ebb62de79104fe3030a9ee
  TRANSFORM_BLOB: 49fab7781ffebcf9b83643d12da925223d53427b

jobs:
  qualify-and-promote:
    name: Prove raw-ref to validated-rebind type-state
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact #611 product parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          path: product
          fetch-depth: 0

      - name: Check out exact authority tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-tools
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact subjects and frozen transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_PARENT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PRODUCT_PARENT_TREE"
          test "$(git -C runner-tools rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C runner-tools hash-object .github/repair/executable_plan_ref_rebind.py)" = "$TRANSFORM_BLOB"
          test -z "$(git -C product status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C runner-tools status --porcelain=v1 --untracked-files=all)"
          echo "REF_REBIND_PARENT_HEAD=$(git -C product rev-parse HEAD)"
          echo "REF_REBIND_PARENT_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "REF_REBIND_TRANSFORM_BLOB=$TRANSFORM_BLOB"

      - name: Set up pinned Rust 1.96
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Re-prove exact #611 identity parent
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-fabrication -p symtropy-firstlight -- --check
          cargo check --locked -p symtropy-fabrication --all-targets
          cargo test --locked -p symtropy-fabrication golden_v1_digest_freezes_cross_layer_preimage
          cargo test --locked -p symtropy-firstlight patch_conduit_executable_identity_v1_goldens
          cargo clippy --locked -p symtropy-fabrication --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze dependency surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cp Cargo.lock /tmp/ref-rebind-Cargo.lock.before
          cp Cargo.toml /tmp/ref-rebind-root-Cargo.toml.before
          cp crates/domains/symtropy-fabrication/Cargo.toml /tmp/ref-rebind-fabrication-Cargo.toml.before
          cp crates/apps/symtropy-firstlight/Cargo.toml /tmp/ref-rebind-firstlight-Cargo.toml.before

      - name: Apply frozen type-state transform
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 ../runner-tools/.github/repair/executable_plan_ref_rebind.py
          cargo fmt -p symtropy-fabrication -p symtropy-firstlight

      - name: Prove exact two-file semantic surface
        shell: bash
        run: |
          set -euo pipefail
          cd product
          python3 - <<'PY'
          import subprocess
          expected = {
              'crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs',
              'crates/domains/symtropy-fabrication/src/executable_plan_identity.rs',
          }
          status = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'], text=True
          ).splitlines()
          paths = {line[3:] for line in status}
          assert paths == expected, (paths, expected)
          print('REF_REBIND_CHANGED_FILES=' + ','.join(sorted(paths)))
          PY
          cmp Cargo.lock /tmp/ref-rebind-Cargo.lock.before
          cmp Cargo.toml /tmp/ref-rebind-root-Cargo.toml.before
          cmp crates/domains/symtropy-fabrication/Cargo.toml /tmp/ref-rebind-fabrication-Cargo.toml.before
          cmp crates/apps/symtropy-firstlight/Cargo.toml /tmp/ref-rebind-firstlight-Cargo.toml.before
          git diff --check

      - name: Prove validated type-state authority shape
        shell: bash
        run: |
          set -euo pipefail
          cd product
          file=crates/domains/symtropy-fabrication/src/executable_plan_identity.rs
          grep -q "pub struct ValidatedExecutableFabricationPlanRef<'a>" "$file"
          grep -q "pub fn rebind<'a>" "$file"
          grep -q "reference: &'a ExecutableFabricationPlanRef" "$file"
          grep -q "plan: &'a ExecutableFabricationPlan" "$file"
          ! grep -q 'pub reference:' "$file"
          ! grep -q 'pub plan:' "$file"
          ! grep -q 'fn validate_against' "$file"
          ! grep -q 'validate_against' crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs

      - name: Prove raw round trip rebind and hostile mismatch regressions
        shell: bash
        run: |
          set -euo pipefail
          cd product
          output="$(cargo test --locked -p symtropy-fabrication round_trip_preserves_digest_and_exact_ref 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test .*round_trip_preserves_digest_and_exact_ref .* ok'
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. 1 passed; 0 failed;'
          output="$(cargo test --locked -p symtropy-fabrication compact_ref_rebind_rejects_different_plan_identity_before_digest 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test .*compact_ref_rebind_rejects_different_plan_identity_before_digest .* ok'
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. 1 passed; 0 failed;'
          output="$(cargo test --locked -p symtropy-fabrication compact_ref_rejects_same_lineage_changed_exact_content 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test .*compact_ref_rejects_same_lineage_changed_exact_content .* ok'
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. 1 passed; 0 failed;'

      - name: Prove #611 v1 synthetic digest remains frozen
        shell: bash
        run: |
          set -euo pipefail
          cd product
          output="$(cargo test --locked -p symtropy-fabrication golden_v1_digest_freezes_cross_layer_preimage 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test .*golden_v1_digest_freezes_cross_layer_preimage .* ok'
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. 1 passed; 0 failed;'
          grep -q 'c1a830a601fa472b3c112282454de040bb2c148c8fcf5e90d11de81ba1822413' crates/domains/symtropy-fabrication/src/executable_plan_identity.rs

      - name: Prove all four Patch Conduit v1 goldens remain frozen
        shell: bash
        run: |
          set -euo pipefail
          cd product
          output="$(cargo test --locked -p symtropy-firstlight patch_conduit_executable_identity_v1_goldens 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq 'test .*patch_conduit_executable_identity_v1_goldens .* ok'
          printf '%s\n' "$output" | grep -Eq 'test result: ok\. 1 passed; 0 failed;'
          for digest in \
            aa6902076be2cc4c61f637b774873ea8eb1106b1a45d4af2b6d6355ef19aadf2 \
            57db32de10648d084aefee6b8c99635b0fadba1cf246ed6201dd3653ac72b477 \
            cdf91f4e7ffc0bea27f2505fdf6a2ed8f2f8919fe8d29091d3197caed2a35f75 \
            682d12ee72c108ee4552f934d1035a8f9bec9f19deedc7206aecedf90a2ed38d; do
            grep -q "$digest" crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs
          done

      - name: Run full locked transformed qualification
        shell: bash
        run: |
          set -euo pipefail
          cd product
          cargo fmt -p symtropy-fabrication -p symtropy-firstlight -- --check
          cargo check --locked -p symtropy-fabrication --all-targets
          cargo test --locked -p symtropy-fabrication
          cargo clippy --locked -p symtropy-fabrication --all-targets -- -D warnings
          cargo test --locked -p symtropy-firstlight patch_conduit_exact_plan
          cmp Cargo.lock /tmp/ref-rebind-Cargo.lock.before
          cmp Cargo.toml /tmp/ref-rebind-root-Cargo.toml.before
          cmp crates/domains/symtropy-fabrication/Cargo.toml /tmp/ref-rebind-fabrication-Cargo.toml.before
          cmp crates/apps/symtropy-firstlight/Cargo.toml /tmp/ref-rebind-firstlight-Cargo.toml.before

      - name: Commit exact qualified #738 product
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_PARENT"
          git config user.name "luminous-qualification-bot"
          git config user.email "qualification@luminous.invalid"
          git add \
            crates/domains/symtropy-fabrication/src/executable_plan_identity.rs \
            crates/apps/symtropy-firstlight/src/patch_conduit_exact_plan.rs
          test "$(git diff --cached --name-only | sort | wc -l)" -eq 2
          test -z "$(git diff --name-only)"
          git commit -m "feat(fabrication): require exact rebind for executable plan refs"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 2
          echo "REF_REBIND_QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "REF_REBIND_QUALIFIED_TREE=$(git rev-parse HEAD^{tree})"

      - name: Refuse branch race and push exact qualified #738 head
        shell: bash
        run: |
          set -euo pipefail
          cd product
          remote_head="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$PRODUCT_PARENT"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "REF_REBIND_PROMOTED_HEAD=$(git rev-parse HEAD)"
