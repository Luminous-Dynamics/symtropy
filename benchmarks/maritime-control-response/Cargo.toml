[package]
name = "liu-ice-control-response-evaluator"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false
description = "Independent Rust evaluator for command-conditioned industrial engine response and fault-diagnosis evidence"

[workspace]

[[bin]]
name = "marine-dataset-audit"
path = "src/bin/marine_dataset_audit.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "monte_carlo_randomization"
harness = false
